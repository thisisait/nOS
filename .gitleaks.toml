# Gitleaks allowlist — verified FALSE POSITIVES only (2026-06-10 security review).
# Each entry was manually inspected; none is a real credential. Real findings
# must NEVER be allowlisted — rotate + purge instead (docs/secret-lifecycle-doctrine.md).
#
# Run:  gitleaks detect --source . --no-banner
# The pulse gitleaks job picks this file up automatically (repo-root config).

[extend]
useDefault = true

[allowlist]
description = "Verified false positives — docblocks, test fixtures, docs placeholders"

# 1) ForwardAuthUserStorage.php — PHP docblock prose ("the CSRF token
#    BasePresenter stores...") trips the generic-api-key entropy heuristic.
# 2) test_pulse_redact.py — deliberate FAKE token exercising the redactor
#    (asserts the value gets <REDACTED>); a real secret never appears.
# 3) grafana-tempo README — `curl -u admin:$(rg ...)` shell substitution,
#    no literal credential on the line.
# 4) README.md (historical) — Czech docs placeholder "silne-heslo" /
#    "nahodny-64-char-hex" example values.
# 5b) Cortex spine bundle keys (2026-08-19) — `"key": "08_survival_emergency"`
#    in files/anatomy/cortex/knowledge/spine/*.json and the same value echoed
#    in that directory's manifest.json. A taxonomy domain identifier, not a
#    credential; generic-api-key fires on the WORD "key" plus a long-ish value.
#    Format-anchored to two digits + lowercase words, so it cannot mask a real
#    high-entropy secret. Inspected line by line before allowlisting.
# 5c) `keap-v2-and-contracts` — a JavaScript object key in
#    tools/workflows/release-readiness-v010.js, same rule, same shape.
# 5d) Self-declaring fixtures (2026-08-19) — values whose FIRST BYTES say they
#    are not real. `tests/anatomy/test_a_fixture_is_never_a_real_secret.py`
#    already REFUSES a credential-shaped fixture value that does not announce
#    itself this way, so the convention is enforced upstream of this file, and
#    a scan of git HISTORY cannot be fixed by editing the working tree — the
#    2026-08-05 commit keeps its copy for ever. Anchored to the whole value so
#    a real secret cannot merely contain the word.
# 5) GHSA advisory identifiers (GHSA-xxxx-xxxx-xxxx) cited across
#    docs/llm/security/ + remediation-queue.json — public GitHub Security
#    Advisory IDs, not credentials. Format-anchored (lowercase base32), so it
#    cannot mask a real high-entropy key (remediator triage, 2026-07-15).
paths = [
    '''files/anatomy/wing/app/Security/ForwardAuthUserStorage\.php''',
    '''tests/anatomy/test_pulse_redact\.py''',
    '''files/anatomy/plugins/grafana-tempo/README\.md''',
]

regexes = [
    '''silne-heslo''',
    '''nahodny-64-char-hex''',
    '''GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}''',
    '''^[0-9]{2}_[a-z]+(_[a-z]+)*$''',
    '''^keap-v2-and-contracts$''',
    '''^FAKE_[A-Za-z0-9_]+$''',
]
