# =============================================================================
# profiles/core.yml — face, Iris, KEAP, Wing, Bone, Pulse and the SSO/edge they need
#
# axis: service-set
# plain: The smallest working nOS — desktop, assistant, memory and dashboard behind SSO.
#
#   nos -e @profiles/core.yml
#
# MEASURED 2026-10-14 on a 32 GiB client host running a near-full set: 43 containers,
# 7.6 GiB inside a Docker VM that held its whole 12 GiB cap. This keeps 8: traefik,
# docker-socket-proxy, postgresql, redis, authentik server+worker, keap, face —
# estimated ~1.2-1.6 GiB idle, UNMEASURED until tools/docker-pressure-status.py reads it.
# A converge with this profile prunes the disabled services' containers
# (tasks/stacks/prune-disabled.yml); their data stays.
# The Docker VM cap (Docker Desktop MemoryMiB) is the hard lever and not a config value.
# =============================================================================

# ── L0 + SSO + edge: what every core route depends on ────────────────────────
install_postgresql: true        # Authentik's store; KEAP keeps its own /data
install_mariadb: false          # no core consumer (bookstack/firefly/nextcloud/... only)
install_authentik: true         # SSO is mandatory; forces postgresql + redis on (manifest forced_by)
install_traefik: true           # the edge; preflight refuses with no edge proxy
install_nginx: false

# ── The core itself ───────────────────────────────────────────────────────────
install_keap: true              # memory organ; DataTables (dtt) live here
install_face: true              # web desktop
install_wing: true              # dashboard; FrankenPHP + SQLite on the host
install_bone: true              # face's file store + Wing's event sink
install_receptor: true          # the thalamus role asserts it
install_pulse: true             # core organ (ruling 2026-10-15): runs the installed owners' jobs only
install_thalamus: true          # Iris; macOS only; needs a model binding (mistral-eu)

# ── Docker VM: the all-on minimum (11 GiB, measured 2026-10-10) is far above the core's need ──
docker_min_memory_gib: 6        # core measured 3.2 GiB with leftovers (client, 2026-10-14); the
                                # memory-pressure refusal still stops a run the VM cannot carry

# ── Authentik is half the core's memory: fewer threads, the minimum web workers ──
authentik_web_workers: 2        # gunicorn's floor
authentik_web_threads: 2        # 4 by default
authentik_worker_threads: 1     # 2 by default

# ── Off: no core part needs them ─────────────────────────────────────────────
install_infisical: false        # only Wing invite provisioning reads it, off by default
install_loops: false            # the maintainer's development loops and the cells serving them
install_observability: false    # ~700 MiB; Traefik tracing then logs export errors
install_cortex: false           # keap_cortex_cutover false: KEAP serves its own path
install_ollama: false           # Iris is cloud-bound; KEAP's local-model path errors softly
install_openclaw: false
install_ears: false
install_backup: false
install_apex: false
install_gitea: false
install_woodpecker: false       # CI, needs gitea
apps_runner_enabled: false      # manifest apps (documenso, roundcube, twofauth, ...)

# ── Every other service flag that defaults true, or that a host's config.yml often sets ──
install_bluesky_pds: false
install_calibreweb: false
install_freescout: false
install_hedgedoc: false
install_bookstack: false
install_dolibarr: false
install_kiwix: false
install_mailpit: false
install_metabase: false
install_n8n: false
install_nextcloud: false
install_onlyoffice: false
install_openwebui: false
install_outline: false
install_paperclip: false
install_portainer: false
install_rustfs: false
install_superset: false
install_uptime_kuma: false
install_vaultwarden: false
install_watchtower: false
