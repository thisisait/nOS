# =============================================================================
# profiles/cloud-e2e.yml — nOS DEFAULT CONFIG inside a Claude cloud sandbox
#
#   tools/cloud/e2e.sh converge          (docs/cloud-e2e.md)
#
# The goal is that this file is (almost) EMPTY: the estate a cloud session
# proves is the estate `default.config.yml` describes. Platform differences —
# macOS-only settings, Homebrew, launchd, a container's kernel, no systemd —
# are resolved by FACTS in tasks/_platform.yml, never by a toggle here
# (docs/cross-platform.md). What remains below is the NETWORK the sandbox
# sits behind, measured 2026-09-25, the sandbox's disk, and one safety belt
# for the controller.
# Each line says which of the two it is; a line that is neither does not
# belong here.
#
# Every key must be declared in default.config.yml
# (test_a_profile_only_sets_flags_that_exist.py); every enabled image must be
# pullable here (test_cloud_e2e_contract.py::test_profile_pulls_nothing_the_sandbox_refuses).
# =============================================================================

# ── NETWORK: same upstream images, served from Docker Hub ────────────────────
# ghcr's blob host (pkg-containers.githubusercontent.com) and lscr.io are
# refused by the sandbox egress; both vendors publish the same image to Hub.
authentik_image: authentik/server
calibreweb_image: linuxserver/calibre-web

# ── NETWORK: no Docker Hub copy exists, and the blob host is refused ─────────
# Flip back on once the environment allows pkg-containers.githubusercontent.com.
install_openwebui: false       # ghcr.io/open-webui/open-webui
install_kiwix: false           # ghcr.io/kiwix/kiwix-serve
install_paperclip: false       # ghcr.io/paperclipai/paperclip
install_bluesky_pds: false     # ghcr.io/bluesky-social/pds

# ── NETWORK: KEAP's image build apt-gets from Debian ─────────────────────────
# deb.debian.org and every Debian mirror answer 403 (archive.ubuntu.com
# passes). Flip back on once the environment allows deb.debian.org.
install_keap: false

# ── KERNEL + DISK ────────────────────────────────────────────────────────────
# twofauth: its upstream nginx listens on [::]:8000 only; it can never become
#   healthy on a kernel without IPv6.
# documenso, roundcube: the session's disk allowance (~37 GB written) does not
#   hold every default image (~30 GB) plus data; measured 2026-09-26, the
#   converge died "No space left on device". These two Tier-2 apps (~4 GB with
#   documenso's own postgres) are the lane's cut — they are already proven by
#   the Tier-2 wet-test (tests/wet) and by earlier runs of this lane.
apps_skip: [twofauth, documenso, roundcube]

# ── CONTROLLER safety belt ───────────────────────────────────────────────────
# The global pip/npm tasks run whichever pip3/npm is first on PATH; measured,
# pip installed `ansible` into the frozen controller venv (2.21.0 → 2.21.4).
# e2e.sh strips the venv from PATH too; this is the belt to that brace.
pip_packages: []
node_global_packages: []
