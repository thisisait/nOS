# =============================================================================
# profiles/gov-local.yml — sovereignty-hardened "local-only" overlay
# =============================================================================
#
# Purpose: collapse the residual external-egress + accept-risk surface so the
# platform's "all data stays local" claim holds BY DEFAULT, not only in a
# hand-tuned offline setup. Layer it on top of your normal config:
#
#   ansible-playbook main.yml -e @profiles/gov-local.yml
#   ansible-playbook main.yml -e @profiles/all-on.yml -e @profiles/gov-local.yml
#     (later -e file wins, so gov-local's hardening overrides all-on's defaults)
#
# This is a SOVEREIGNTY profile, not a full government-compliance profile.
# At-rest disk crypto (P0-ATREST, require_disk_encryption), enforced MFA
# (P0-MFA, enforce_mfa) and the tamper-evident audit hash-chain (P1,
# wing_audit_chain_enabled) are all TOGGLABLE here (set below). The breach-
# notification Pulse scan registers when the gdpr-breach-base plugin is enabled
# (sibling control — inert until a breach is filed). The remaining blocking gov
# controls (ISDS + NIA/eIDAS federation) are NOT yet togglable — see
# docs/compliance/gov-readiness-audit-2026q2.md for that roadmap. What this
# profile ALSO closes is every off-host data path that is a single variable.
# =============================================================================

# ── No third-party control-plane egress ──────────────────────────────────────
# Tailscale routes through login.tailscale.com + DERP relays — a real external
# dependency and the single material sovereignty default. Off here. For remote
# access without a third party, self-host Headscale (the FOSS control server)
# and point tailscaled at it; that is a separate manual wiring step.
install_tailscale: false

# ── Drop the unfixable accept-risk service ────────────────────────────────────
# FreePBX's tiredofit image was abandoned upstream in 2022 and carries CRITICAL
# RCEs that are UNFIXABLE in-image (REM-014 CVSS 10.0, REM-046). A government
# tenant must not run it. (Already false in default.config.yml — pinned here so
# an all-on overlay can't turn it back on.)
install_freepbx: false

# ── Backups stay encrypted (already the default; pinned for demonstrability) ──
# AES-256 client-side before upload to RustFS — personal data never lands in
# object storage as cleartext. Keep backup_encryption_passphrase under the same
# custody as global_password_prefix (lose it → backups unrecoverable).
backup_encryption_enabled: true

# ── Enforce at-rest disk encryption (P0-ATREST) ────────────────────────────
# A gov tenant MUST store personal data on an encrypted volume. This makes the
# pre_tasks at-rest gate hard-fail the run unless macOS FileVault is On / a Linux
# LUKS backing device is present, BEFORE any personal-data service starts. If
# your host uses an encryption layout the heuristic misses (ZFS-native crypto,
# stacked LVM-on-LUKS, eCryptfs), verify it out-of-band and pass
# -e nos_skip_at_rest_check=true on the run.
require_disk_encryption: true

# ── Enforce MFA on Tier-1 privileged sign-in (P0-MFA) ──────────────────────
# Routes ONLY Tier-1 (nos-providers/nos-admins) OIDC/proxy providers through a
# dedicated authentication flow (nos-tier1-mfa-flow) whose validate stage is
# not_configured_action='configure' — a brand-new / un-enrolled Tier-1 user is
# prompted to set up TOTP or a WebAuthn passkey INLINE and continues. NEVER a
# hard deny, so nobody is locked out. Non-Tier-1 providers keep the stock flow,
# byte-unchanged. Also installs a length-15 + zxcvbn password policy on the
# enrollment / password-change prompts.
#
# BEFORE flipping this on a live install: enrol a TOTP/WebAuthn device for at
# least one nos-admins identity, AND keep the un-wedge `ak shell` command from
# the 50-mfa-policy.yaml.j2 header ready. mfa_password_hibp stays FALSE on an
# air-gapped tenant (HIBP needs egress); flip it true only if egress is allowed.
enforce_mfa: true
# Remember-device window. The non-gov DEFAULT is posture B ("global MFA,
# remembered" — an enrolled user re-challenges once per ~8h rather than every
# login; set in default.config.yml). A GOV tenant gets STRICT step-up: 2FA on
# EVERY authentication-flow run, no remember-device. Pinned here so a +gov
# reconverge re-asserts strict over a relaxed config.yml. Relax to "hours=8"
# only if the operator accepts the remembered-device window on a gov host.
mfa_remember_window: "seconds=0"

# ── Tamper-evident audit hash-chain (P1) ───────────────────────────────────
# HMAC-chain every wing.db events row at INSERT; WORM triggers block content
# edits / unguarded deletes on chained rows; bin/verify-audit-chain.php (+ the
# hourly verify Pulse job) confirms integrity. On a chain OFF->ON toggle the
# post.yml anchor task (backfill-event-chain.php) is best-effort
# (failed_when: false) and always reports ok — the segment anchor is recorded
# idempotently inside the script; verify with `php bin/verify-audit-chain.php`,
# NOT the Ansible changed flag. Pre-enable rows stay unsigned (accepted baseline).
wing_audit_chain_enabled: true

# =============================================================================
# MANUAL STEPS this profile cannot express as a single variable (do these too):
#
# 1. LOCAL TLD ONLY. Keep tenant_domain on a *.local mkcert wildcard (the
#    default). A public TLD pulls in ACME/Let's Encrypt (DNS-01 egress) — fine
#    for a public service, but for an air-gapped/sovereign deployment stay local.
#
# 2. LOCAL-ONLY AI. Leave openai_api_key / anthropic_api_key EMPTY (the shipped
#    default) and re-point each AgentKit agent's model.primary from
#    `anthropic-claude-opus-4-7` to a local `openclaw-*` / `ollama-*` URI in
#    files/anatomy/agents/<name>/agent.yml. There is no global override var —
#    the pins are per-agent. Without this, agent runs call the Anthropic API.
#
# 3. EGRESS ALLOWLIST. Constrain host outbound to the registries/mirrors you
#    actually need (image pulls, brew/apt) via a host firewall + an internal
#    registry mirror; everything else denied. Captures the pull-only metadata
#    paths this profile can't gate from Ansible vars.
# =============================================================================
