---
# =============================================================================
# profiles/test-users.yml — RBAC and multi-user test personas
#
# axis: use-case
# =============================================================================
#
# Purpose: four test accounts, one per RBAC tier below admin (alice manager, bob + carol user, dave guest), for RBAC and per-user storage tests.
#
# This file is the ONE declaration of the synthetic identities: kind: synthetic,
# apart from the real accounts in default.config.yml `nos_identities`. main.yml
# adopts this roster on every run (namespaced include, so the switch below stays
# yours); `nos_test_users_enabled` is the switch. On, the Authentik blueprint
# creates them active, each in its tier's group, tagged synthetic, and the
# end-of-run first-login walk gives them their app accounts. Passwords are
# derived (nos_test_<name>_password in default.credentials.yml).
#
# Usage:
#   nos -e @profiles/test-users.yml          # or nos_test_users_enabled: true in config.yml
#   cd tests/e2e && python3 -m pytest estate/test_rbac_users.py -o addopts=""
#
# Switched off, the accounts LINGER (the run and tools/identity-status.py name
# them synthetic and lingering) until `nos -e retire_synthetic=true`, which
# deletes only Authentik users tagged attributes.kind synthetic — never on -y
# or --confirm. App-side accounts the first-login walk created are not touched.
# =============================================================================

nos_test_users_enabled: true

# Two at tier 3 so isolation has a peer to fail against.
nos_synthetic_identities:
  - {name: alice, kind: synthetic, tier: 2, email: "alice@{{ tenant_domain | default('dev.local') }}", realms: [authentik],
     password_var: nos_test_alice_password}
  - {name: bob, kind: synthetic, tier: 3, email: "bob@{{ tenant_domain | default('dev.local') }}", realms: [authentik],
     password_var: nos_test_bob_password}
  - {name: carol, kind: synthetic, tier: 3, email: "carol@{{ tenant_domain | default('dev.local') }}", realms: [authentik],
     password_var: nos_test_carol_password}
  - {name: dave, kind: synthetic, tier: 4, email: "dave@{{ tenant_domain | default('dev.local') }}", realms: [authentik],
     password_var: nos_test_dave_password}
