# nOS — Woodpecker CI pipeline (Anatomy A16, 2026-05-17)
#
# Runs on every push to any branch from the Gitea mirror. Four required
# stages (composer, php-lint, pytest, ansible-syntax); one optional
# stage (notify) for dev/pzny pushes that posts a CI-green notification
# into Wing /inbox so the operator-attention queue surfaces it.
#
# Pipeline runs entirely in containers — no host filesystem access, no
# deploy step in this iteration. Deploy is operator-triggered via
# `ansible-playbook main.yml --tags <stack>` after CI goes green.
#
# Secret 'wing_api_token' is optional — if not configured in Woodpecker
# the notify step is gracefully skipped. Set via the Woodpecker UI
# (Repo → Settings → Secrets) once the wing API surface has minted a
# pipeline-scoped token (Authentik OIDC client, scopes nos:notifications).

# Top-level when removed (2026-05-20): manual triggers (event=manual) and
# cron events would be filtered out otherwise. Per-step `when:` blocks below
# still gate the notify-green step to push/pzny branches only.

steps:
  composer-validate:
    image: composer:2
    pull: true
    commands:
      - cd files/anatomy/wing
      - composer validate --strict --no-check-publish
      - composer install --no-progress --no-interaction --no-scripts

  php-lint:
    image: php:8.5-cli-alpine
    pull: true
    commands:
      - find files/anatomy/wing/app files/anatomy/wing/bin -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null

  pytest-anatomy:
    image: python:3.13-slim
    pull: true
    environment:
      # THE ENVIRONMENT CONTRACT (tests/anatomy/_environment_contract.py):
      # every tool named here MUST resolve on PATH or the suite ABORTS before
      # running a single test. This is what stops a dropped apt package (or a
      # trimmed image) from silently demoting a hundred tool-gated gates into
      # skips: absence in a promising environment is a red run, not a quiet
      # green one. Declaration pinned by test_absence_is_counted.py — do not
      # remove a tool here to go green; install it below instead.
      # The last entry is a PATH, not a name: the wing vendor tree the
      # composer-validate step installs into this shared workspace. It is
      # never on PATH, so until it was declared (2026-08-29) a composer step
      # that silently did nothing would have demoted every PHP behavioural
      # gate to a skip while the run stayed green.
      NOS_TEST_PROVIDES: git,ansible-playbook,php,jq,sqlite3,files/anatomy/wing/vendor/autoload.php
    commands:
      # pytest + pyyaml = anatomy test runner + yaml-based gates
      # httpx + pytest-asyncio = Pulse daemon test fixtures (test_pulse_daemon.py
      #   imports the pulse package which depends on httpx)
      # jinja2 + jsonschema = plugin loader render tests
      # requests = tester_identity lib (tests/e2e/lib/authentik_admin.py)
      # fastapi = the loop-engine gates import it at MODULE level, so without it
      #   pytest exits 2 on a COLLECTION error and the whole suite is skipped —
      #   not three failures, no run at all. Found 2026-08-19 by the first CI
      #   run this repo has had since those gates were written: CI had been dark
      #   (no forge webhook) for the entire life of the loop engine, so nothing
      #   ever discovered that three of its gates cannot be collected here.
      # git: several gates build a scratch repository and ask git what would
      #   actually happen (the apply/landed/conflict oracle, the loop ratchet's
      #   committed-vs-worktree split). python:*-slim has no git, and without it
      #   they ERROR rather than fail — 13 errors, 43 extra failures, measured.
      # php (+sqlite/xml/mbstring): ~150 wing/agentkit gates execute PHP against
      #   the vendor tree the composer-validate step installed into this shared
      #   workspace. Without php they all skip — and the pzny branch mirrors to
      #   the forge ONLY, so for that branch a php skip here is php gates
      #   running NOWHERE. Debian trixie ships php 8.4; wing requires >=8.3.
      # jq + sqlite3: the drift-watch / kuma-reader / vuln-cycle gates drive
      #   the real scripts, which require them.
      # markdown==3.10.2: tools/devlog-compile.py hard-pins this version for
      #   bundle byte-determinism and sys.exit()s on any other — an unpinned
      #   install (3.10.3) failed the devlog gates here on 2026-08-19. The pin
      #   must equal MARKDOWN_PIN in tools/devlog-compile.py (gated).
      # ansible-core (frozen pin from tools/ci-freeze.env): 19 gates drive
      #   ansible-playbook harnesses against tasks/run-mode.yml and
      #   tasks/removal-verify.yml — the fail-closed removal ladder. They are
      #   the last gates that should ever be allowed to quietly not run.
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git php-cli php-sqlite3 php-xml php-mbstring jq sqlite3
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - . tools/ci-freeze.env && pip install --quiet --no-cache-dir pytest pytest-asyncio pyyaml httpx jinja2 jsonschema requests fastapi textual "markdown==3.10.2" "$NOS_ANSIBLE_CORE"
      # Install pulse as editable so its package imports resolve in test
      - pip install --quiet --no-cache-dir -e files/anatomy/pulse
      # -rA summary lists FAIL/SKIP/ERROR at the very end so even a
      # truncated CI log still reports the critical info.
      - python -m pytest tests/anatomy/ --tb=long -rA

  ansible-syntax:
    image: python:3.13-slim
    pull: true
    environment:
      # ansible.cfg is ignored when CWD is world-writable (Docker default
      # 0777). Set library/module_utils explicitly via env so the custom
      # nos_state / nos_migrate modules resolve even without ansible.cfg.
      ANSIBLE_LIBRARY: files/anatomy/library
      ANSIBLE_MODULE_UTILS: files/anatomy/module_utils
      ANSIBLE_ROLES_PATH: ./roles
    commands:
      - pip install --quiet --no-cache-dir 'ansible-core>=2.20,<2.22'
      # Install both roles AND collections from the single requirements.yml
      # (Galaxy roles like elliotweiser.osx-command-line-tools + collections
      # like community.general). Without the role install the playbook
      # syntax-check fails on the `roles: - role:` block in main.yml.
      - ansible-galaxy role install -r requirements.yml
      - ansible-galaxy collection install -r requirements.yml
      - ansible-playbook main.yml --syntax-check

  # notify-green + deploy-trigger live in separate workflow files
  # (.woodpecker/notify.yml, .woodpecker/deploy.yml). Woodpecker v3
  # resolves `from_secret` at parse time, so a missing secret would
  # fail the WHOLE pipeline. Splitting into per-workflow files isolates
  # the failure to that workflow — tests stay green even if secrets
  # haven't been provisioned yet.
