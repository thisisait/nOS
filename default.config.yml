uptime_kuma_status_page_domain: "status{{ _host_alias_seg }}.{{ tenant_domain | default('dev.local') }}"
uptime_kuma_ntfy_topic: "nos-alerts"              # ntfy topic used for alert notifications
uptime_kuma_notify_webhook_url: "http://127.0.0.1:{{ bone_port | default(8099) }}/api/events"
uptime_kuma_tls_expiry_monitors: true             # Create TLS cert-expiry monitors for HTTPS-exposed services
uptime_kuma_docker_host_monitors: false           # Optional Docker healthcheck pass-through (needs socket proxy)

