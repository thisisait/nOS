# app_secrets is the apps_runner secret-store (its own default is `{}` in
# roles/pazny.apps_runner/defaults). That role default only materialises during
# stack-up — AFTER the core-up `template_vars: "{{ vars }}"` loader resolves the
# whole namespace — so it MUST also default here, or the eager resolution aborts
# on an undefined var (the `| default({})` below does not save it). See CLAUDE.md
# `{{ vars }}` gotcha + test_config_stock_jinja_only.py.
app_secrets: {}
# Play-level hoist of the apps_runner skip switch so Art-15/17 maps can
# `lookup('vars', 'apps_runner_enabled')` outside the role. Role default is
# the same true; operators set false in config.yml to skip the whole catalog.
apps_runner_enabled: true
# app manifest ids to leave out of this estate (apps/<id>.yml stays
# committed; the runner just does not discover it). Default: none.
apps_skip: []
