observability_launchd_label: "sh.brew.grafana-alloy"
# REM-107: Alloy OTLP receiver bind. 127.0.0.1 = loopback-only (on-host apps only —
# the secure default; Alloy is a HOST process, so 0.0.0.0 exposed 4317/4318 to the
# LAN/Tailscale unauthenticated). Set 0.0.0.0 ONLY for cross-host telemetry, then
