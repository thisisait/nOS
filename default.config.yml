snappymail_data_dir: "{{ ansible_facts['env']['HOME'] }}/snappymail"

# ==============================================================================
# TAILSCALE – WireGuard mesh VPN
# After install: tailscale up (interactive browser login)
# Services then available via: http://mac-studio.<tailnet>.ts.net:<PORT>
# ==============================================================================

tailscale_accept_routes: false    # Accept subnet routes from other nodes
tailscale_exit_node: false        # Use this Mac as an exit node
# tailscale_auth_key: ""          # Pre-auth key for non-interactive setup (from admin console)
tailscale_hostname: ""            # Tailscale FQDN (e.g. mac-studio.tailnet-abc.ts.net) – homepage → Grafana
services_lan_access: false        # true = Docker services on 0.0.0.0 (access via Tailscale/LAN by ports)

# Alternative hosts for service access (LAN IP, Tailscale hostname/IP)
# Automatically added to nginx server_name + Nextcloud trusted_domains
service_extra_hosts: []
# service_extra_hosts:
#   - "192.168.1.64"
#   - "studio.tail9f5625.ts.net"
#   - "100.106.211.106"

# ==============================================================================
# POWER MANAGEMENT – pmset settings (only on AC power -c)
# Goal: display sleeps but the computer remains reachable on the network (Jellyfin, SSH, Grafana...)
# ==============================================================================

configure_power_management: true       # Configure pmset
blank_stop_timeout: 30                # Seconds to wait after docker compose down (blank reset)
pmset_sleep: 0                         # Computer never sleeps (0 = disabled)
pmset_displaysleep: 20                 # Display sleeps after 20 min
pmset_disksleep: 0                     # Disk never sleeps
pmset_womp: 1                          # Wake on LAN
pmset_tcpkeepalive: 1                  # Keep TCP connections during sleep
pmset_powernap: 1                      # Power Nap (background updates)
pmset_networkoversleep: 0              # Do not sleep NIC when display sleeps
pmset_ttyskeepawake: 1                 # TTY session prevents sleep

# ==============================================================================
# DNSMASQ – automatic *.dev.local DNS resolver
# Removes the need to manually edit /etc/hosts
# ==============================================================================

# Known-good Homebrew dnsmasq release. Homebrew always installs the current
# formula version; this pin documents the release nOS is validated against
# (tested on macOS 27) and is the reference the restart handler's
# plist-existence guard hardens around. Bump when a newer release is verified.
dnsmasq_version: "2.91"                    # known-good Homebrew dnsmasq (macOS 27 validated)
dnsmasq_dev_domain: "{{ tenant_domain | default('dev.local') }}"  # Auto-tracks tenant_domain (Track F)
dnsmasq_dev_address: "127.0.0.1"          # Target for *.dev.local from localhost
dnsmasq_port: 53                          # DNS port (53 = default)
dnsmasq_lan_access: true                  # true = dnsmasq also listens on LAN (for TVs, mobiles, guests)
dnsmasq_additional_addresses: []          # Additional custom DNS records
# dnsmasq_additional_addresses:
#   - domain: "api.external.test"
#     address: "192.168.1.100"

# ==============================================================================
# RESTIC – backups
# Documentation: https://restic.readthedocs.io/
# ==============================================================================

# Off-site copy #2 mirrors the RustFS bucket dir (copy #1's encrypted objects) —
# NOT the whole $HOME. The old "{{ HOME }}" default dragged in TCC-protected
# ~/Library subdirs on macOS → restic dir-level EPERM → fatal rc=1 (it aborted
# the all-on blank, 2026-06-09). The bucket dir is user-owned + self-contained:
# DB dumps, volume/dir tars, wing.db, nos-state, blueprints (all encrypted).
# DR: `restic restore latest --target <rustfs parent>` repopulates it, then
# `--tags restore`. See docs/backup-architecture.md.
restic_backup_paths:
  - "{{ rustfs_data_dir }}"     # RustFS bucket dir = canonical copy #1 object store

# Restic repository – an off-site, operator-rotated external medium:
# restic_repo: "/Volumes/Backup/restic"          # external USB/SSD (recommended)
# restic_repo: "s3:s3.us-east-005.backblazeb2.com/bucket-name"
# restic_repo: "sftp:user@nas:/backup/mac-studio"
# Leave configure_backup:false until restic_repo points at a MOUNTED disk.

# ==============================================================================
# EXTERNAL STORAGE – move data directories to a secondary SSD
# Internal SSD (0.5 TB) = macOS, Homebrew, source code, MariaDB (low latency)
# External SSD (1 TB)   = Kiwix ZIM, Calibre, maps, Docker, Ollama, observability
#
# How it works:
#   1. Set configure_external_storage: true
#   2. Mount the SSD at external_storage_root (e.g. /Volumes/SSD1TB)
#   3. Run the playbook – the task redirects all data-heavy paths to the SSD
#   4. The original paths in the home directory will NOT be used (set_fact override)
#
# What stays on the internal SSD (performance):
#   - macOS system, Homebrew, source code, MariaDB, Redis
# ==============================================================================

configure_external_storage: false       # true = redirect data to the external SSD
external_storage_root: "/Volumes/SSD1TB"

# Optional moves (only if configure_external_storage: true)
external_storage_docker: true           # Docker Desktop disk image (~20-100 GB)
external_storage_docker_app: true      # Move Docker.app to the SSD + symlink in /Applications
external_storage_ollama: true           # Ollama models (~10-150 GB)
external_storage_caches: true           # npm, pip, Composer, Homebrew cache (~10-50 GB)

# ==============================================================================
# POST-PROVISION
# ==============================================================================

post_provision_tasks: []

# ==============================================================================
# TRAEFIK
# ==============================================================================

# ── Docker Stacks ────────────────────────────────────────────────────────────
# All Docker services are organized into 4 stacks managed via Portainer.
# Each stack has its own docker-compose.yml in a subdirectory of stacks_dir.
stacks_dir: "{{ ansible_facts['env']['HOME'] }}/stacks"
stacks_shared_network: "shared_net"

# ── Stack-up bring-up tuning (tasks/stacks/stack-up.yml) ─────────────────────
# stack_up_parallel: true  → fire `docker compose up --wait` for every wave-2
#   stack at once (async). Fastest for normal installs (few stacks enabled).
#   false → bring stacks up one at a time. Slower but contention-free; required
#   when enabling the whole catalogue on a cold blank (the all-on profile),
#   where parallel pulls/builds saturate the Docker daemon and blow the
#   per-stack --wait-timeout (gitlab/onlyoffice are the slow ones).
# stack_up_wait_timeout: per-stack `docker compose up --wait` ceiling (seconds).
#   540 is fine when images are warm; bump to 900 for cold-blank heavy sets.
stack_up_parallel: true
stack_up_wait_timeout: 540
# stack_wait_tick_interval: seconds between health-poll ticks during bring-up.
# Each tick prints a per-stack readiness line into the main ansible.log stream
# (tasks/stacks/wait-stacks-healthy.yml) so a long `up --wait` no longer freezes
# the log. 15s is a good balance of heartbeat freshness vs task-count noise.
stack_wait_tick_interval: 15

# coexistence_secondary_ttl_days: cooling window applied to the PRIOR primary
# when a coexistence track is promoted (it becomes a read-only secondary). This
# is the one-click-rollback window — re-promote the demoted track within it to
# revert. VALIDATED to the inclusive range [3, 60] days by
# tasks/coexistence-ttl-validate.yml; an out-of-range value fails the run early
# with a clear CLI message. Kept a BARE literal here (no filter, no expression)
# per the {{ vars }} eager-resolve trap — the [3,60] clamp lives in the TASK,
# not in this file. Default 7 (the §7-RESOLVED Q4 deviation: configurable,
# was fixed 7).
coexistence_secondary_ttl_days: 7

# Backward compatibility – old monolithic compose dir (will be removed after migration)
iiab_compose_dir: "{{ stacks_dir }}/iiab"

# ── Traefik ────────────────────────────────────────────────────────────────────
traefik_image_version: "v3.6.21"        # CVE-2026-33186/33433 pins + S2 freshness 2026-06-10 (3.6 patch line)
traefik_http_port: 80
traefik_https_port: 443
traefik_dashboard_port: 8082            # 8080=cadvisor, 8081=tileserver, 8090=freescout — 8082 is the first free slot
traefik_domain: "traefik{{ _host_alias_seg }}.{{ tenant_domain | default('dev.local') }}"
traefik_log_level: "INFO"               # DEBUG / INFO / WARN / ERROR
# traefik_dynamic_dir / traefik_certs_dir live in roles/pazny.traefik/defaults
# (referenced only once the role loads). traefik_config_dir is HOISTED here —
# tasks/stacks/core-up.yml's data-dir loop pre-creates it BEFORE the traefik role
# loads, so the role default is too late: under ansible-core 2.20.6 the loop-item
# `| default()` does not save the undefined var. Value matches the role default
# ({{ stacks_dir }}/infra/traefik) byte-for-byte. See CLAUDE.md `{{ vars }}` gotcha.
traefik_config_dir: "{{ stacks_dir }}/infra/traefik"

# ── Tier-1 service ports lifted from role defaults ────────────────────────────
# These are referenced via lookup('vars', '<svc>_port') in the Traefik file
# provider template. Role defaults aren't visible to that lookup because the
# role isn't included for *every* service during the Traefik render — operator
# would only have role defaults loaded for services they're actively running
# include_role on. Lifting the port numbers up here makes the lookup succeed
# and avoids the "default(80) → infinite loop on Traefik's own :80" footgun.
# Domain hostname overrides — must match the value rendered inside each
# plugin's authentik: block (e.g. files/anatomy/plugins/<svc>-base/plugin.yml).
# The Traefik file-provider falls back to '<id>.<tld>' when these aren't defined,
# which would mismatch Authentik's redirect_uris and break SSO.
miniflux_domain: "rss{{ _host_alias_seg }}.{{ tenant_domain | default('dev.local') }}"
code_server_domain: "code{{ _host_alias_seg }}.{{ tenant_domain | default('dev.local') }}"
# Wave A/B service domains (added 2026-05-03 — without top-level definition,
# nos-smoke catalog auto-derive skipped them because vars_dict.get('<svc>_domain')
# returned None even though the var was used inside Jinja default(...) filters
# in plugin authentik: blocks. Surfaced during pazny.eu prod blank — 8 healthy
# Wave A/B services were silently absent from the smoke output.)
ntfy_domain: "ntfy{{ _host_alias_seg }}.{{ tenant_domain | default('dev.local') }}"
nodered_domain: "nodered{{ _host_alias_seg }}.{{ tenant_domain | default('dev.local') }}"
hedgedoc_domain: "hedgedoc{{ _host_alias_seg }}.{{ tenant_domain | default('dev.local') }}"
bookstack_domain: "bookstack{{ _host_alias_seg }}.{{ tenant_domain | default('dev.local') }}"
firefly_domain: "firefly{{ _host_alias_seg }}.{{ tenant_domain | default('dev.local') }}"
# NOTE: hostnames match the Traefik file-provider's manifest-id fallback
# (state/manifest.yml id=onlyoffice, id=influxdb) so URLs are consistent
# whether Traefik resolves via domain_var or via id-suffix. Earlier OIDC
# apps fallback expressions used 'office.' / 'influx.' which would have
# diverged — those defaults still fire when these vars are undefined,
# but with these top-level defs they're authoritative.
onlyoffice_domain: "onlyoffice{{ _host_alias_seg }}.{{ tenant_domain | default('dev.local') }}"
influxdb_domain: "influxdb{{ _host_alias_seg }}.{{ tenant_domain | default('dev.local') }}"

nodered_port: 1880
# Real default here (not only in role defaults) — referenced by
# backup_dirs_to_dump above, which the core-up eager `{{ vars }}` resolve
# walks BEFORE the nodered role loads (test_config_stock_jinja_only gate).
nodered_data_dir: "{{ ansible_facts['env']['HOME'] }}/nodered/data"
# Node-RED runtime defaults (D2 promotion, 2026-05-17): previously these
# lived only as `| default(...)` chains inside the compose template, which
# made operator overrides invisible to nos-smoke + config introspection.
nodered_uid: 1000
nodered_gid: 1000
nodered_timezone: "Europe/Prague"
nodered_flows_file: "flows.json"
nodered_enable_safe_mode: "false"
nodered_enable_projects: "true"
# Native OIDC opt-in (β1.B 2026-05-05 — passport-openidconnect path).
# When true, the compose template wires NODERED_OIDC_* env + mounts the
# mkcert root CA; otherwise Traefik forward-auth gates the service.
nodered_native_oidc_enabled: false
authentik_oidc_nodered_client_id: "nos-nodered"
authentik_oidc_nodered_client_secret: "{{ global_password_prefix }}_pw_oidc_nodered"
ntfy_port: 2586
miniflux_port: 3011
code_server_port: 3009                  # container 8443 (HTTPS) — Traefik upstream is https://nos-host:3009
hedgedoc_port: 3012
bookstack_port: 3013
firefly_port: 3014
# Data dirs promoted from role defaults so the upgrade engine can resolve them
# in play scope (recipes reference these for backup/restore steps).
bookstack_data_dir: "{{ ansible_facts['env']['HOME'] }}/bookstack/config"
firefly_upload_dir: "{{ ansible_facts['env']['HOME'] }}/firefly/upload"
firefly_export_dir: "{{ ansible_facts['env']['HOME'] }}/firefly/export"
onlyoffice_port: 3015
influxdb_port: 8086
mcpo_port: 8765
hermes_web_port: 18790
mailpit_port: 8025                      # UI port (1025 is SMTP)

# ── Home Assistant ─────────────────────────────────────────────────────────────
homeassistant_version: "2026.4"     # CVE-2026-34205 (CVSS 9.7 Supervisor bypass)
homeassistant_port: 8123
homeassistant_domain: "home{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
homeassistant_timezone: "Europe/Prague"
homeassistant_config_dir: "{{ ansible_facts['env']['HOME'] }}/homeassistant"
# true = privileged + network_mode: host → mDNS/Bonjour auto-discovery
# Warning (macOS): host mode reaches into the Docker VM network, not the Mac's physical network.
# Full Bonjour/mDNS on Mac requires a native HA install or host networking
# via --network host in Docker Desktop (experimental feature).
homeassistant_privileged: false
homeassistant_admin_name: "Admin"
homeassistant_admin_user: "admin"
homeassistant_admin_password: "{{ global_password_prefix }}_pw_homeassistant"
homeassistant_auth_oidc_version: "1.1.1"
authentik_oidc_homeassistant_client_id: "nos-homeassistant"
authentik_oidc_homeassistant_client_secret: "{{ global_password_prefix }}_pw_oidc_homeassistant"

# ==============================================================================
# RUSTFS – S3-compatible object storage
# ==============================================================================

rustfs_version: "1.0.0-alpha.93"         # CVE-2025-68926 baseline + alpha.91 multipart auth hardening (#2411) + OIDC claim fix (#2386)
rustfs_api_port: 9010               # S3 API (aws-cli, rclone, restic, SDK...) – 9000 taken by PHP-FPM
rustfs_console_port: 9001           # Web console
rustfs_domain: "fs{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
rustfs_data_dir: "{{ ansible_facts['env']['HOME'] }}/rustfs/data"
rustfs_access_key: "{{ global_password_prefix }}_pw_rustfs_access"
rustfs_secret_key: "{{ global_password_prefix }}_pw_rustfs_secret"

# ==============================================================================
# B2B – ERPNEXT (CRM + ERP + HR + Accounting)
# Requires: install_mariadb: true, redis_docker: true
# ==============================================================================

erpnext_domain: "erp{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
erpnext_port: 8087                     # 8082 = Traefik dashboard, 8083-8086 taken
erpnext_version: "v15.98.1"              # CVE-2026-27471 (CVSS 9.3 unauth doc access)
# erpnext_data_dir: DEPRECATED since P0.1 migration to a named volume. Sites data
# lives in Docker named volume `b2b_erpnext_sites` (managed for blank-reset
# via `compose down -v` + `volume prune -f -a`). External storage can be
# configured by moving the whole Docker Desktop disk image to an external SSD.
erpnext_admin_password: "{{ global_password_prefix }}_pw_erpnext"
# Site name follows erpnext_domain (host_alias + tenant_domain aware).
erpnext_site_name: "{{ erpnext_domain }}"
erpnext_experimental_override: false
# Bind-mount target for the ERPNext sites volume. The Docker named volume
# `b2b_erpnext_sites` is the live storage; this var is referenced by
# tasks/post.yml when reading site_config.json + bench migrate. Operators
# pointing external storage at sites use this override.
