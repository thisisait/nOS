# ==============================================================================
# INFRA – BLUESKY PDS (AT Protocol Personal Data Server)
# Federated identity: @user.bsky.dev.local → SSO for all services
# ==============================================================================

# Track F (2026-05-01) + Track G prod cutover (2026-05-03) — derive
# from tenant_domain. Local TLDs (.local/.lan/.test) keep the bsky.dev.lan
# fallback for AT Protocol (.local is spec-forbidden); public TLDs get
# bsky.<tenant_domain> so federation handles match the actual zone.
# Override either side via config.yml if needed.
# stock-Jinja only (no `| bool`) — see _host_alias_normalized note (L40).
bluesky_pds_hostname: "{{ 'bsky.dev.lan' if (tenant_domain_is_local | default(true)) else 'bsky.' + (tenant_domain | default('dev.local')) }}"
bluesky_pds_port: 2583
bluesky_pds_version: "0.4"               # ghcr.io/bluesky-social/pds (no semver tags; 0.4 tracks latest)
bluesky_pds_admin_password: "{{ nos_derived_secrets.bluesky }}"
bluesky_pds_jwt_secret: "{{ global_password_prefix }}_pw_bluesky_jwt"
bluesky_pds_rotation_key: ""           # Generate: openssl rand -hex 32
bluesky_pds_invite_required: true      # Invite-only registration (true = closed PDS)
bluesky_pds_email_smtp_url: ""         # SMTP URL for PDS notifications (empty = disabled)
bluesky_pds_email_from: ""             # Email sender (default: noreply@<bluesky_pds_hostname>)

# ==============================================================================
# nOS face – the unified web-desktop shell (the FACE of the nOS anatomy).
# Source is VENDORED in-repo at files/anatomy/face (2026-07-18, v0.2); the role
# syncs it into the build dir and `docker compose` builds nos/face from there
# (keap build-from-source precedent). forward_auth SSO; the shell composes
# the Wing catalog + Bone VFS + KEAP config DataTables. install_face ON by
# default. Design doc: docs/archive/nos-face.md, docs/archive/nos-face-shell-v2.md.
# ==============================================================================

# os.<tld> — inherited from Puter, which owned it until its removal (2026-07-20).
# The face IS the operating surface, so it gets the operating-system host.
face_domain: "os{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
face_port: 5090                                # loopback debug publish (container binds 5090)
face_version: "latest"                         # nos/face local image tag (source = vendored tree)
# The face builds FROM this (build arg FACE_NODE_IMAGE): tag AND digest, the same 24.x line as
# node_nvm_version. KEAP's Node is pinned in the KEAP repo; this var does not reach it.
face_node_image: "node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53"
# Config-DataTable source of truth: KEAP /api/tables (with repo/user-state
# fallback). Empty by default → the shell uses the repo defaults + user-state
# until KEAP wiring lands (G2). Set to the KEAP tables API URL to go live.
face_keap_tables_url: ""
face_keap_explore_url: ""                       # override KEAP explore-graph iframe URL (default: https://<keap_domain>/explore)
# Command-palette LLM model (host Ollama). Empty → auto-pick the first installed
# non-embedding model, so "ask" works with whatever chat model the host pulled.
face_ask_model: ""

# ==============================================================================
# apex – the public anatomy page at the ROOT domain (the estate's front door).
# Static build of files/anatomy/apex/ (projection of state/anatomy-graph.json
# through the SIGNED ruling), served by a pinned nginx with a read-only bind.
# No application, no database, no identity model, no telemetry — by ruling.
# Serving gate: roles/pazny.apex refuses an unsigned ruling at converge.
# ==============================================================================

# The ROOT domain itself, not a subdomain: the apex answers https://<tld>/.
# host_alias deliberately does not apply — an aliased host publishes no apex.
apex_domain: "{{ tenant_domain | default('dev.local') }}"
apex_port: 8061                                # loopback publish (container binds 80)
# The front door at the root domain (roles/pazny.landing): a card per routed
# service plus a short how-to. Same root domain as apex — one or the other.
landing_domain: "{{ tenant_domain | default('dev.local') }}"
landing_port: 8062
landing_version: "{{ apex_version }}"   # the same pinned nginx (tag + digest)
landing_title: "nOS — {{ tenant_domain | default('dev.local') }}"
landing_host_note: ""                   # one host-specific paragraph (config.yml)
landing_contact: ""                     # who to ask, as text (config.yml)
# nginx stable-alpine. The tag says what we meant, the digest says what we get
# (mcp_gateway precedent). Digest is the multi-arch INDEX (arm64 + amd64).
# Asked at the source registry (Docker Hub library/nginx), 2026-10-23: 1.30.6 fixes
# CVE-2026-15176, -93479, -95101, -97629, -97205 (nginx.org CHANGES-1.30).
apex_version: "1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951"

# ==============================================================================
# KEAP – Knowledge Explorer and Preserver (where nOS keeps its memory)
# Built from source by roles/pazny.keap (git clone at keap_repo_ref, face-
# style compose build). Human surface behind header_oidc SSO; agent surface
# /agent/v1 on the loopback port for AgentKit (scope-split bearer tokens).
# ==============================================================================

keap_version: "2.1.0"                      # nos/keap image tag
# Cortex consolidator ("dream" sweep) inputs. Colon-separated filesystem roots
# the keap-consolidate Pulse job walks for new/changed datapoints (e.g.
# "{{ ansible_facts['env']['HOME'] }}/keap/inbox:{{ ansible_facts['env']['HOME'] }}/nextcloud-data");
# empty = scan nothing until the operator points it at data piles. db_exclude
# is a comma list of provisioned service DBs to skip when a MariaDB root is
# reachable. Both consumed via NOS_CONSOLIDATE_* env in keap-base plugin.yml;
# empty-string keeps the eager-resolve loader happy (the job filters empties).
consolidate_fs_roots: ""
consolidate_db_exclude: ""
# FS doctrine P1b — additional service-engine paths (global for core-up/loader refs)
onlyoffice_db_dir: "{{ nos_data_root }}/platform/services/onlyoffice/db"
onlyoffice_lib_dir: "{{ nos_data_root }}/platform/services/onlyoffice/lib"
onlyoffice_logs_dir: "{{ nos_data_root }}/platform/services/onlyoffice/logs"
code_server_workspace_dir: "{{ nos_data_root }}/platform/services/code_server/workspace"

# ==============================================================================
# PAPERCLIP – multi-agent orchestration platform
# Requires: install_postgresql: true
# Coordinates AI agents (OpenClaw, Claude Code, Codex) through an org-chart structure
# ==============================================================================
# (the rest of this section is a config.d layer)
paperclip_version: "sha-d554c47"         # ghcr.io/paperclipai/paperclip — release v2026.916.1 (2026-09-21); images carry only sha-<commit> tags, this is the release commit

# ==============================================================================
# IIAB TERMINAL – public SSH TUI hub for LAN users
# ssh home@<ip> → TUI with Kiwix, AI chat, service overview
# Requires: enable_ssh: true
# ==============================================================================

iiab_terminal_user: "home"                         # macOS user for SSH access
iiab_terminal_password: ""                         # Empty = auto-generated random password
iiab_terminal_password_auth: true                  # true = password login enabled
iiab_terminal_config_dir: "{{ homebrew_prefix }}/etc/iiab-terminal"
iiab_terminal_bin_path: "{{ homebrew_prefix }}/bin/iiab-terminal"

# ── Identity pins: the rest of Authentik, Infisical and Vaultwarden is the config.d identity layer ──
# Registry path only; the tag is authentik_version. Upstream publishes the SAME
# image to ghcr.io and Docker Hub (`authentik/server`). A sandbox whose egress
# refuses ghcr blob storage (a Claude cloud session) flips this in
# profiles/cloud-e2e.yml — docs/cloud-e2e.md §Registries.
authentik_image: "ghcr.io/goauthentik/server"
authentik_version: "2026.5.7"                      # REM-283: same-minor patch, five 2026-09-09 HIGH GHSAs
infisical_version: "v0.162.19"   # synced to role default (cleared version-pin shadow) [swept v0.162.16 2026-08-11]
vaultwarden_version: "1.37.4"            # REM-291: seven org/2FA authz fixes (REM-261 was 1.37.3)

# ==============================================================================
# BACKUP — copy #1 (pazny.backup role): nightly DB dumps + named volumes +
# host-bind dirs (git repos) + wing.db + ~/.nos state + Authentik blueprints,
# AES-256 encrypted → RustFS S3 bucket via the launchd/systemd agent
# eu.thisisait.nos.backup.rustfs. Copy #2 (off-site) = the Restic block above.
# See docs/backup-architecture.md + roles/pazny.backup/README.md + docs/restore-runbook.md.
# ==============================================================================

# Tar/extract image — ONE declaration. backup.sh and restore_alpine_image both
# read this var; a second literal is a silent restore-extract drift.
backup_alpine_image: "alpine:3.20"

# Consumed by Alloy's textfile collector (Agent A1 + C3).
# S4 (2026-06-10): was /var/lib/node_exporter/textfile — that path does not
# exist on macOS (and needs root on Linux), so the collector read nothing and
# the 91-backups dashboard stayed blind. HOME keeps it sudo-free both OSes.
node_exporter_textfile_dir: "{{ ansible_facts['env']['HOME'] }}/.nos/metrics/textfile"
