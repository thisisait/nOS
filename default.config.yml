  - alias: cat
    command: "bat --style=numbers,changes,header"
  - alias: grep
    command: "rg"
  - alias: find
    command: "fd"
  - alias: du
    command: "ncdu"
  - alias: df
    command: "duf"
  - alias: lg
    command: "lazygit"
  - alias: nr
    command: "npm run"
  - alias: br
    command: "bun run"

# ==============================================================================
# OBSERVABILITY – Grafana LGTM stack + Alloy
# Architektura:
#   Alloy (collector) → Prometheus (metrics) → Grafana (dashboards)
#                    → Loki (logs)            →
#                    → Tempo (traces)         →
# ==============================================================================

# ── Ports ─────────────────────────────────────────────────────────────────────
grafana_port: 3000
prometheus_port: 9090
loki_port: 3100
tempo_version: "2.10.3"           # >=2.10.3 fixes CVE-2026-28377 / REM-036 (was 2.10.0); github.com/grafana/tempo/releases
nginx_prometheus_exporter_version: "1.4.1"  # github.com/nginxinc/nginx-prometheus-exporter/releases – no Homebrew formula
phpfpm_exporter_version: "2.2.0"         # github.com/hipages/php-fpm_exporter/releases – no Homebrew formula
tempo_http_port: 3200
tempo_otlp_grpc_port: 4327    # Tempo internal OTLP gRPC (Alloy → Tempo)
tempo_otlp_http_port: 4328    # Tempo internal OTLP HTTP (Alloy → Tempo)
alloy_ui_port: 12345
alloy_otlp_grpc_port: 4317    # Alloy public OTLP gRPC (apps → Alloy)
alloy_otlp_http_port: 4318    # Alloy public OTLP HTTP (apps → Alloy)

# ── Domains ───────────────────────────────────────────────────────────────────
grafana_domain: "grafana{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
# Other services are not publicly exposed (localhost only), accessed via Grafana
observability_hostname: "{{ ansible_facts['hostname'] }}"  # Hostname in Grafana labels

# ── Docker image versions (observability + devops) ───────────────────────────
grafana_version: "12.4.4"               # CVE-2026-27876 pin + S2 freshness 2026-06-10 (patch line)
prometheus_version: "v3.11.3"   # synced to role default (cleared version-pin shadow)
loki_version: "3.7.2"           # synced to role default (cleared version-pin shadow)
grafana_data_dir: "{{ stacks_dir }}/observability/grafana/data"

# Gitea Docker
gitea_version: "1.26.4"                 # REM-099: 1.25.x EOL — CVE-2026-27771 pkg-registry reads, CVE-2026-22874 SSRF, OAuth2 scope bypass; exactly 1.26.4 (1.26.3 regression). Migration 2026-07-09-gitea-1-25-5-to-1-26-4

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana_admin_user: "admin"
grafana_admin_password: "{{ global_password_prefix }}_pw_grafana"
grafana_allow_embedding: false
grafana_analytics: false    # Disable telemetry

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus_retention: "30d"
prometheus_storage_path: "{{ ansible_facts['env']['HOME'] }}/observability/prometheus"

# ── Loki ──────────────────────────────────────────────────────────────────────
loki_retention: "744h"   # 31 days
loki_storage_path: "{{ ansible_facts['env']['HOME'] }}/observability/loki"

# ── Tempo ─────────────────────────────────────────────────────────────────────
tempo_retention: "168h"  # 7 days (traces tend to be larger)
tempo_storage_path: "{{ ansible_facts['env']['HOME'] }}/observability/tempo"

# ── Alloy – what to collect ───────────────────────────────────────────────────
# Both exporters instrument the HOST-NGINX leg (nginx stub_status + php-fpm
# FCGI status). On a Traefik-primary host (install_nginx=false) php-fpm does
# not run AND port 9000 belongs to Wing/FrankenPHP since A3.5 — the exporter
# was firing FCGI bytes at Wing every Alloy scrape and hanging its own
# /metrics (found by the W6.4 hub probe, 2026-06-11). Follow install_nginx.
alloy_scrape_nginx: "{{ install_nginx | default(false) }}"
alloy_scrape_phpfpm: "{{ install_nginx | default(false) }}"
phpfpm_exporter_port: 9253         # Port of php-fpm_exporter
alloy_scrape_mariadb: false        # MariaDB metrics (enable if install_mariadb: true)
alloy_scrape_redis: true           # Redis metrics → Prometheus
redis_port: 6379                   # Redis port
alloy_tail_nginx_logs: true        # Nginx access+error logs → Loki
alloy_tail_agent_logs: true        # ~/agents/*.log → Loki
alloy_tail_php_logs: true          # PHP-FPM logs → Loki
alloy_tail_docker_logs: true       # All Docker container stdout/stderr → Loki
alloy_receive_otlp: true           # OTLP receiver for app traces/metrics/logs → Tempo

# ── Exporter containers (observability stack) ─────────────────────────────────
# Sprint 1 / Wave 1: expand metrics coverage with infra + container exporters.
# Toggle individual exporters with alloy_scrape_* flags below.
postgres_exporter_port: 9187       # prometheuscommunity/postgres-exporter
mysqld_exporter_port: 9104         # prom/mysqld-exporter (requires `mysqld_exporter` MariaDB user)
redis_exporter_port: 9121          # oliver006/redis_exporter
cadvisor_port: 8080                # gcr.io/cadvisor/cadvisor — container resource metrics
blackbox_exporter_port: 9115       # prom/blackbox-exporter — HTTP/TCP probes

postgres_exporter_version: "v0.15.0"
mysqld_exporter_version: "v0.15.1"
redis_exporter_version: "v1.58.0"
cadvisor_version: "v0.49.1"
blackbox_exporter_version: "v0.25.0"

alloy_scrape_postgres_exporter: "{{ install_postgresql | default(false) }}"
alloy_scrape_mysqld_exporter: "{{ install_mariadb | default(false) }}"
alloy_scrape_redis_exporter: "{{ redis_docker | default(false) }}"
# Tier-2 Qdrant (apps/qdrant.yml). Auto-on when the manifest is enabled —
# operator can flip in config.yml if Qdrant runs without observability scrape.
alloy_scrape_qdrant: "{{ install_qdrant | default(false) }}"
qdrant_port: 6333
qdrant_domain: "qdrant.{{ apps_subdomain | default('apps') }}{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
# install_qdrant flips true when apps/qdrant.yml is present in the apps
# catalog. apps_runner sets this fact dynamically; default is false so a
# stripped-down build doesn't trigger Qdrant-dependent wiring spuriously.
install_qdrant: false
# Qdrant API keys are auto-generated by apps_runner from the
# $SERVICE_PASSWORD_API / $SERVICE_PASSWORD_RO_API magic tokens in
# apps/qdrant.yml, then persisted under app_secrets.qdrant.* in
# credentials.yml. Bone / Wing read these via the env they're set in
# (see roles/pazny.bone/templates/bone.plist.j2 + roles/pazny.wing/
# templates/compose.yml.j2). Operators with a custom Qdrant deployment
# can override `qdrant_api_key` / `qdrant_api_key_ro` directly in
# credentials.yml — these wrappers fall back to the auto-generated
# values when no override is set.
# app_secrets is the apps_runner secret-store (its own default is `{}` in
# roles/pazny.apps_runner/defaults). That role default only materialises during
# stack-up — AFTER the core-up `template_vars: "{{ vars }}"` loader resolves the
# whole namespace — so it MUST also default here, or the eager resolution aborts
# on an undefined var (the `| default({})` below does not save it). See CLAUDE.md
# `{{ vars }}` gotcha + test_config_stock_jinja_only.py.
app_secrets: {}
qdrant_api_key: "{{ (app_secrets | default({})).get('qdrant', {}).get('PASSWORD_API', '') }}"
qdrant_api_key_ro: "{{ (app_secrets | default({})).get('qdrant', {}).get('PASSWORD_RO_API', '') }}"
qdrant_url: "http://127.0.0.1:{{ qdrant_port | default(6333) }}"
alloy_scrape_cadvisor: true
alloy_scrape_blackbox_self: true   # scrape blackbox-exporter's own /metrics (probe results come from prometheus rules — A2)

# ── Grafana dashboards to download from grafana.com ───────────────────────────
# Dashboard IDs from https://grafana.com/grafana/dashboards/
grafana_dashboards:
  - id: 1860    # Node Exporter Full (system metrics)
    revision: 37
  - id: 12708   # NGINX exporter
    revision: 1

# ==============================================================================
# IIAB – N8N (workflow automation)
# ==============================================================================

n8n_domain: "n8n{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
n8n_port: 5678
n8n_version: "2.28.1"      # REM-109: Jun-24-2026 advisory cluster (4 HIGH, CVSS 7.1-7.6) fixed 2.28.1; prior 2.26.2 CVE-2026-4478x; same-major migrate-on-start
n8n_data_dir: "{{ ansible_facts['env']['HOME'] }}/n8n"
n8n_timezone: "Europe/Prague"
n8n_admin_email: "{{ default_admin_email }}"
n8n_admin_password: "{{ global_password_prefix }}_pw_n8n"
n8n_admin_firstname: "Admin"
n8n_admin_lastname: "nOS"

# ==============================================================================
# IIAB – GITEA (self-hosted Git)
# ==============================================================================

gitea_domain: "git{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
gitea_port: 3003         # 3000=Grafana, 3001=Uptime Kuma, 3002=reserve → Gitea on 3003
gitea_ssh_port: 2222
gitea_data_dir: "{{ ansible_facts['env']['HOME'] }}/gitea"
gitea_admin_user: "{{ ansible_facts['user_id'] }}"
gitea_admin_password: "{{ global_password_prefix }}_pw_gitea"
gitea_admin_email: ""                          # FILL IN!
gitea_secret_key: "{{ global_password_prefix }}_pw_gitea_secret"
gitea_metrics_token: "{{ global_password_prefix }}_pw_gitea_metrics"   # bearer token guarding /metrics (Alloy scrape sends it)
gitea_disable_registration: false              # true = only admin can add users (also blocks OIDC auto-create)
# Pure-SSO: hide the local self-registration form but still let OAuth2/OIDC
# first-login auto-create users (Authentik onboarding). true = external-only.
gitea_allow_only_external_registration: true

# ==============================================================================
# IIAB – GITLAB CE (full DevOps platform)
# Note: GitLab Omnibus is a heavy application (~4 GB RAM idle, ~1 GB image).
#       Recommended only if you need more than just Git (Gitea is enough for that).
#       Internal PostgreSQL, Redis, Sidekiq – all in one container.
# ==============================================================================

gitlab_domain: "gitlab{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
gitlab_http_port: 8929          # Internal HTTP port (nginx handles SSL, forwards here)
gitlab_ssh_port: 2224           # Git SSH (22=system, 2222=Gitea → Gitlab on 2224)
gitlab_version: "18.11.7-ce.0"  # REM-111: Jun-24-2026 GitLab security release version-flagged 18.10.8; 18.11 patch line
gitlab_data_dir: "{{ ansible_facts['env']['HOME'] }}/gitlab"          # Repos, uploads, artifacts (large!)
gitlab_config_dir: "{{ ansible_facts['env']['HOME'] }}/gitlab-config" # gitlab.rb + keys (small but important)
gitlab_timezone: "Europe/Prague"
gitlab_signup_enabled: false    # Disables registration of new users
gitlab_puma_workers: 2          # Worker processes (min 2, with 36 GB feel free to use 4)
gitlab_sidekiq_concurrency: 10  # Background job threads

# ── T32.2: which LOCAL forge the agent loop targets (tools/recipe-pr.sh) ──────
# "gitlab" — agents open GitLab MERGE REQUESTS (operator review surface;
#            native omniauth OIDC works → operator can actually sign in).
# "gitea"  — legacy PR target (the Gitea oauth2 source row kept vanishing →
#            SSO 500 → operator locked out of the UI; Gitea keeps Woodpecker).
# Enable the GitLab side with `gitlab_agent_forge: true` in config.yml — it
# provisions the nOS project + PAT (pazny.gitlab post-forge.yml).
nos_agent_forge: "gitlab"

# ==============================================================================
# IIAB – OPEN WEBUI (chat UI for Ollama)
# Requires: install_openclaw: true (Ollama must run on port 11434)
# ==============================================================================

openwebui_domain: "ai{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
openwebui_port: 3004             # Internal container port 8080 → host 3004
openwebui_version: "0.8.12"      # 0.8 adds native MCP + function calling + code exec. DB migration ~few min.
openwebui_data_dir: "{{ ansible_facts['env']['HOME'] }}/openwebui"
openwebui_secret_key: "{{ global_password_prefix }}_pw_openwebui"
openwebui_enable_signup: false   # pure-SSO: public local signup OFF (was true →
                                 # public /auth/signup first-admin race). Users
                                 # onboard via Authentik OIDC; admin is DB-seeded
                                 # + group-mapped (OAUTH_ADMIN_ROLES). The compose
                                 # template default is false too, but this
                                 # explicit value was the live source of truth.
openwebui_admin_name: "Admin"
openwebui_admin_email: "{{ default_admin_email }}"
openwebui_admin_password: "{{ global_password_prefix }}_pw_openwebui_admin"

# ==============================================================================
# IIAB – WOODPECKER CI (CI/CD connected to Gitea)
# Requires: install_gitea: true + manual OAuth2 application in Gitea
# ==============================================================================

woodpecker_domain: "ci{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
woodpecker_port: 8060            # Web UI
woodpecker_grpc_port: 9060       # gRPC for agents (internal)
woodpecker_version: "v3.14.1"           # REM-105: pin the floating v3 tag — CVE-2026-50141 auth-bypass-by-spoofing (agent_id gRPC metadata forge) fixed v3.14.1
woodpecker_data_dir: "{{ ansible_facts['env']['HOME'] }}/woodpecker"
woodpecker_agent_secret: "{{ global_password_prefix }}_pw_woodpecker"
woodpecker_gitea_client: ""      # auto-provisioned on first run (post-oauth.yml); leave empty
woodpecker_gitea_secret: ""      # auto-provisioned on first run (post-oauth.yml); leave empty
woodpecker_open_registration: false  # true = anyone can log in via Gitea
woodpecker_max_workflows: 4      # Max parallel pipeline runs per agent
# REM-002 hardening — see roles/pazny.woodpecker/templates/compose.yml.j2 for
# the full vessel block. Operators with vetted plugins can override
# `woodpecker_plugins_privileged` with a comma-separated allowlist of plugin
# image refs (e.g. "plugins/docker,plugins/kaniko"). Empty = no privileged plugins.
woodpecker_plugins_privileged: ""
woodpecker_prom_token: "{{ global_password_prefix }}_pw_wp_prom"

# ==============================================================================
# IIAB – PORTAINER CE (Docker management UI)
# ==============================================================================

portainer_domain: "portainer{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
portainer_port: 9002                   # 9000/9001 reserved for RustFS (S3 API + console)
portainer_version: "2.27.3"             # CVE-2025-68121 transitive (Go TLS CVSS 10.0)
portainer_data_dir: "{{ ansible_facts['env']['HOME'] }}/portainer"
portainer_admin_password: "{{ global_password_prefix }}_pw_portainer"
# Self-heal an admin-password DRIFT (admin exists but neither the current nor
# previous prefix logs in — left by an interrupted/partial provisioning). true =
# wipe Portainer's BoltDB so admin-init recreates the admin with the config
# password (Portainer holds no user data — endpoints/OAuth are reprovisioned).
# Default false (manual-over-auto): off gives a loud, paste-able heal diagnostic.
portainer_admin_auto_reset: false
# Shared Traefik/Portainer Docker-API gateway (templates/stacks/infra base
# compose). Guards docker.sock = root-on-host — pinned, never floating
# (2026-06-10 review; the C1 pin gate doesn't scan base-stack templates).
docker_socket_proxy_version: "v0.4.2"  # registry tag IS v-prefixed (0.4.2 was only the OCI label — pull fails bare)

# ==============================================================================
# INFRA – SPACETIMEDB (realtime DB, BSL 1.1)
