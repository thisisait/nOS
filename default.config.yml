# ── Home Assistant ─────────────────────────────────────────────────────────────
homeassistant_version: "2026.8.1"     # CVE-2026-34205 (CVSS 9.7 Supervisor bypass) [swept 2026.8.0 2026-08-11]
homeassistant_port: 8123
homeassistant_domain: "home{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
homeassistant_timezone: "{{ nos_timezone }}"
# true = privileged + network_mode: host → mDNS/Bonjour auto-discovery
# Warning (macOS): host mode reaches into the Docker VM network, not the Mac's physical network.
# Full Bonjour/mDNS on Mac requires a native HA install or host networking
# via --network host in Docker Desktop (experimental feature).
homeassistant_privileged: false
homeassistant_admin_name: "Admin"
homeassistant_admin_user: "admin"
homeassistant_admin_password: "{{ nos_derived_secrets.homeassistant }}"
homeassistant_auth_oidc_version: "1.2.1"   # GHSA-gg9c-6c2r-6x28 (medium, 1.0.0-1.1.1) fixed 1.2.0 [advisory-status 2026-10-23]
# REM-168. Home Assistant sets ip_ban_enabled=True by default and then never
# bans anything: login_attempts_threshold defaults to -1, and ban.py returns
# from process_wrong_login BEFORE incrementing the counter whenever the
# threshold is < 1. An enabled-looking defence that cannot fire — so the
# positive number below is what turns it on, not the boolean.
#
# WHY IT MATTERS HERE, measured on this host: the router home.<tld> is
# anonymous by design (native OIDC adds a button to HA's own login page, it
# does not put a wall in front of it), and every failed login costs a cost-12
# bcrypt — 207.7 ms, because HA deliberately hashes a dummy for an UNKNOWN
# username to keep timing constant. The container is capped at 1.0 CPU, so
# ~4.8 anonymous requests per second saturate it. One client, one thread.
#
# 100 since 2026-09-27, and the reason 10 was wrong is not that it was too
# small — it is that it was SHARED. Until the Traefik forwardedHeaders fix,
# every caller reached HA as the ingress address 192.168.65.1, so ten attempts
# were one budget for the whole internet AND the operator. Three AI crawlers
# (ChatGLM, Grok, GPTBot) spent it in nineteen minutes on 2026-09-26 by polling
# /api/config, and the ban landed on the proxy — i.e. on everybody — for
# eighteen hours, visible only as a non-fatal smoke row.
#
# The budget is now PER CLIENT (verified: a probe claiming 203.0.113.77 is
# attributed to 203.0.113.77, where it used to read 192.168.65.1). So it can be
# generous without being weak: 100 bounds one source at ~21 CPU-seconds of
# bcrypt before the ban, well inside what a 1.0-CPU container absorbs, while
# sitting far above any plausible accidental count.
#
# Bans persist in ip_bans.yaml until someone edits it. Recovery is
# `docker exec iiab-homeassistant-1 rm /config/ip_bans.yaml` plus a restart.
# Set 0 to disable the ban entirely (upstream's own -1 shape).
#
# HONEST LIMIT: this bounds ONE source. A distributed flood still costs a
# bcrypt per attempt until it is banned, and the complementary fix is a
# rateLimit middleware on the router (REM-169), which nothing declares yet.
homeassistant_login_attempts_threshold: 100
authentik_oidc_homeassistant_client_id: "nos-homeassistant"
authentik_oidc_homeassistant_client_secret: "{{ nos_derived_secrets.oidc_homeassistant }}"

