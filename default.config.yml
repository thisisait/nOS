install_openhuman: false
openhuman_provider: ollama        # ollama (local_only) | claude-code (the claude CLI login, privacy standard)
openhuman_model: ""               # "" = ollama_small_model on ollama, `sonnet` on claude-code
openhuman_register_mcp: true      # declare the nOS tables MCP server ([[mcp_client.servers]] in config.toml)
openhuman_skills: [nos-datatables, nos-for-openhuman]  # copied into ~/.openhuman/skills (it rejects symlinks)

