---
# ==============================================================================
# GLOBAL PASSWORD SETTINGS
# Prefix for all default passwords. Format: [prefix]_pw_[service]
# On first run override the prefix in credentials.yml or set custom passwords.
# ==============================================================================

global_password_prefix: "changeme"

# ==============================================================================
# INSTANCE IDENTITY & FLEET
# Each box has a unique identity. Provider (thisisait.eu) manages the fleet.
# ==============================================================================

instance_name: "nos"                # Unique instance name (lowercase, no spaces)
# One clock for the estate: every service timezone below derives from it.
nos_timezone: "Europe/Prague"       # IANA name, e.g. Europe/London, America/New_York

# ── Domain composition (Track F decomposition, 2026-05) ──────────────────────
# Three vars compose every nOS hostname. Defaults reproduce today's flat layout
# (`<svc>.dev.local`, `<svc>.apps.dev.local`); set `host_alias` to slot a
# per-host segment between the service name and the rest (lab/factory/branch).
#
#   Tier-1 service host:  <svc>[.<host_alias>].<tenant_domain>
#   manifest app host:      <svc>[.<host_alias>].<apps_subdomain>.<tenant_domain>
#
# Examples (tenant_domain=dev.local, apps_subdomain=apps):
#   host_alias=""    → bone.dev.local           |  documenso.apps.dev.local
#   host_alias="lab" → bone.lab.dev.local       |  documenso.lab.apps.dev.local
#
# `instance_tld` is kept as a backwards-compat shim that resolves to
# `tenant_domain`; existing consumers (179 occurrences across 69 files at the
# Track-F kickoff) continue to work unchanged. Phase 3 of Track F migrates
# them to the explicit segment layout. See docs/operator-domain-naming.md.
tenant_domain: "dev.local"                # Primary TLD; all FQDNs resolve here
host_alias: ""                            # Per-host segment ("" drops it; "lab" yields bone.lab.dev.local)
apps_subdomain: "apps"                    # Subdomain segment for manifest apps (Coolify-imported et al.)

# ── Filesystem doctrine (ssot/doctrine/filesystem.md) ─────────────────────────
# Single persistent-data root. Every service data/config path derives from this
# in its ROLE default (not here) — see the doctrine. Point at an SSD by setting
# this one var; ~/.nos stays the runtime sidecar (never persistent data).
nos_data_root: "{{ ansible_facts['env']['HOME'] }}/nos"
# Verified image cache (tools/nos-image-cache.py): a SIBLING of nos_data_root,
# never inside it, so no removal level takes it (declared `never` in
# tasks/removal-set.yml). Converge loads from it whenever its lock exists;
# filling it writes one tar per image (~70 GB for a full estate), so that is opt-in.
artifact_cache_dir: "{{ nos_data_root.rsplit('/', 1)[0] }}/nos-cache"
artifact_cache_seed: false
# Short per-tenant slug for the on-disk tree (full domain kept as tenant_domain).
nos_tenant_slug: "{{ (tenant_domain | default('dev.local')).split('.')[0] }}"

# ── FS doctrine — derived service paths (ssot/doctrine/filesystem.md) ─────────
# Global (referenced by core-up dir-creation + blank-reset before roles run, so
# they must resolve pre-core-up); value mirrors each role default. The config-
# surface-revision epic will DRY this via a trap-safe generator.
authentik_data_dir: "{{ nos_data_root }}/platform/services/authentik/data"
bluesky_pds_data_dir: "{{ nos_data_root }}/platform/services/bluesky_pds/data"
bookstack_data_dir: "{{ nos_data_root }}/platform/services/bookstack/data"
code_server_data_dir: "{{ nos_data_root }}/platform/services/code_server/data"
erpnext_data_dir: "{{ nos_data_root }}/platform/services/erpnext/data"
mikopbx_data_dir: "{{ nos_data_root }}/platform/services/mikopbx"
freescout_data_dir: "{{ nos_data_root }}/platform/services/freescout/data"
gitea_data_dir: "{{ nos_data_root }}/platform/services/gitea/data"
gitlab_config_dir: "{{ nos_data_root }}/platform/services/gitlab/config"
gitlab_data_dir: "{{ nos_data_root }}/platform/services/gitlab/data"
grafana_data_dir: "{{ nos_data_root }}/platform/services/grafana/data"
# frser-sqlite-datasource (Wing + KEAP SQLite datasources), provisioned by
# pazny.grafana from github.com/fr-ser/grafana-sqlite-datasource releases.
grafana_sqlite_plugin_version: "4.0.6"
grafana_sqlite_plugin_sha256: "e5ce2354dd26ba9bea56b37f9ed4050cc917a46b858a0a191e1cafda382bf18a"
hedgedoc_data_dir: "{{ nos_data_root }}/platform/services/hedgedoc/data"
# Rendered config.json — HedgeDoc's database TLS, which its connection URL
# cannot express (ssot/doctrine/foreign-properties.md §5.2). Separate from data/
# because it is a render, not state: a blank may wipe it and the next converge
# writes it back, while compose must find a FILE there before it binds it.
hedgedoc_config_dir: "{{ nos_data_root }}/platform/services/hedgedoc/config"
geolibre_data_dir: "{{ nos_data_root }}/platform/services/geolibre/data"
homeassistant_config_dir: "{{ nos_data_root }}/platform/services/homeassistant/config"
infisical_data_dir: "{{ nos_data_root }}/platform/services/infisical/data"
influxdb_config_dir: "{{ nos_data_root }}/platform/services/influxdb/config"
influxdb_data_dir: "{{ nos_data_root }}/platform/services/influxdb/data"
keap_data_dir: "{{ nos_data_root }}/platform/services/keap/data"
kiwix_data_dir: "{{ nos_data_root }}/tenants/{{ nos_tenant_slug }}/shared/kiwix/data"
mailpit_data_dir: "{{ nos_data_root }}/platform/services/mailpit/data"
maps_data_dir: "{{ nos_data_root }}/tenants/{{ nos_tenant_slug }}/shared/maps/data"
mariadb_data_dir: "{{ nos_data_root }}/platform/services/mariadb/data"
mcpo_data_dir: "{{ nos_data_root }}/platform/services/mcpo/data"
# The medulla's settings store (state/genome/settings.yml; thalamus settings.rs): estate/ and people/<uid>/.
medulla_data_dir: "{{ nos_data_root }}/platform/services/medulla/data"
metabase_data_dir: "{{ nos_data_root }}/platform/services/metabase/data"
nextcloud_data_dir: "{{ nos_data_root }}/tenants/{{ nos_tenant_slug }}/shared/nextcloud/data"
nodered_data_dir: "{{ nos_data_root }}/platform/services/nodered/data"
ntfy_data_dir: "{{ nos_data_root }}/platform/services/ntfy/data"
onlyoffice_data_dir: "{{ nos_data_root }}/platform/services/onlyoffice/data"
openwebui_data_dir: "{{ nos_data_root }}/platform/services/openwebui/data"
outline_data_dir: "{{ nos_data_root }}/platform/services/outline/data"
nos_forum_data_dir: "{{ nos_data_root }}/platform/services/nos_forum/data"
paperclip_data_dir: "{{ nos_data_root }}/platform/services/paperclip/data"
paperclip_workspaces_dir: "{{ nos_data_root }}/tenants/{{ nos_tenant_slug }}/shared/paperclip/workspaces"  # agents' files (class 2), at /workspaces
portainer_data_dir: "{{ nos_data_root }}/platform/services/portainer/data"
postgresql_data_dir: "{{ nos_data_root }}/platform/services/postgresql/data"
qgis_data_dir: "{{ nos_data_root }}/platform/services/qgis/data"
redis_data_dir: "{{ nos_data_root }}/platform/services/redis/data"
rustfs_data_dir: "{{ nos_data_root }}/platform/services/rustfs/data"
snappymail_data_dir: "{{ nos_data_root }}/platform/services/snappymail/data"
spacetimedb_data_dir: "{{ nos_data_root }}/platform/services/spacetimedb/data"
stalwart_data_dir: "{{ nos_data_root }}/platform/services/stalwart/data"
superset_data_dir: "{{ nos_data_root }}/platform/services/superset/data"
thalamus_data_dir: "{{ nos_data_root }}/platform/services/thalamus/data"
uptime_kuma_data_dir: "{{ nos_data_root }}/platform/services/uptime_kuma/data"
vaultwarden_data_dir: "{{ nos_data_root }}/platform/services/vaultwarden/data"
watchtower_data_dir: "{{ nos_data_root }}/platform/services/watchtower/data"
woodpecker_data_dir: "{{ nos_data_root }}/platform/services/woodpecker/data"

# Normalize host_alias by stripping leading/trailing dots. Operators may
# accidentally type '.lab' or 'lab.' — both should produce a clean '.lab'
# segment without double-dot artefacts in the rendered FQDN.
#
# STOCK-JINJA ONLY in this file's var values: the plugin loader is invoked with
# `template_vars: "{{ vars }}"`, which makes ansible-core (2.20.6+ new engine)
# eagerly resolve every play var during module-arg finalization — in a context
# where ANSIBLE filter plugins (regex_replace, regex_search, bool, b64encode…)
# are NOT loaded, so any of them throws "No filter named '<x>'" and aborts the
# whole run on ubuntu CI. Keep these expressions to Jinja2 core builtins
# (default, trim, length, .endswith(), operators). Do NOT reintroduce
# regex_replace / | bool here. (hotfix 2026-06-06)
_host_alias_normalized: "{{ host_alias | default('') | trim('.') }}"

# Helper: ".<host_alias>" when host_alias is set, "" otherwise. Consumer
# templates compose hostnames as: "<svc>{{ _host_alias_seg }}.{{ tenant_domain }}".
_host_alias_seg: "{{ ('.' + _host_alias_normalized) if (_host_alias_normalized | length > 0) else '' }}"

# Same normalization for apps_subdomain — operators may type 'apps.' or '.apps';
# Tier-2 Jinja consumers (mkcert SANs, ACME domains list) should both render cleanly.
_apps_subdomain_normalized: "{{ apps_subdomain | default('apps') | trim('.') }}"

# Backwards-compat shim — Phase 3 will migrate consumers to tenant_domain
# directly, then this can be removed in a follow-up cleanup commit.
instance_tld: "{{ tenant_domain }}"

default_admin_email: "admin@{{ tenant_domain | default('dev.local') }}"  # Fallback admin email for all services

# ==============================================================================
# DECLARED IDENTITIES — the estate's account roster (2026-08-19)
#
# Until now no file said WHO exists: gitea_admin_user derived from the OS
# username, WOODPECKER_ADMIN inherited that, and akadmin lived only inside an
# Authentik blueprint. The day the operator signed into Woodpecker as
# `akadmin` while the list said `pazny`, "The registration is closed" was the
# error message for an identity model that existed in four places and was
# declared in none. This registry is the single roster; per-realm consumer
# vars (gitea_admin_user, woodpecker_admin) DERIVE from it.
#
# Scope: HUMAN + service ACCOUNTS only. Machine identities keep their own
# channel rosters — `authentik_agent_clients` (OIDC client_credentials) and
# Bone's loopauth.IDENTITIES (loop token scopes) — because re-typing a roster
# is how drift starts. `tools/identity-status.py` reads all three and checks
# them against the realms; doctrine: ssot/doctrine/identity.md.
#
# Fields: name (account username), kind (operator|user|service|agent;
# synthetic lives in profiles/test-users.yml), tier (RBAC 1-4, see
# authentik_rbac_tiers), email, realms (where the account must exist:
# authentik|gitea|gitlab|woodpecker|wing), password_var.
# ==============================================================================

# The local forge/OS-side admin. TODAY this defaults to the OS username so a
# converge is byte-identical with the pre-registry estate. The TARGET model
# (ssot/doctrine/identity.md §5) makes akadmin the primary admin everywhere
# and demotes this account to kind:user — that flip is an operator act with a
# written runbook, never a silent default change.
nos_primary_admin: "{{ ansible_facts['user_id'] }}"
nos_operator_email: "{{ nos_primary_admin }}@{{ tenant_domain | default('dev.local') }}"
# Venv for host tools that need more than the stdlib (tasks/tools-venv.yml).
nos_tools_venv: "{{ ansible_facts['env']['HOME'] }}/.nos/tools-venv"
nos_tools_python: "{{ nos_tools_venv }}/bin/python"
# The estate's own clone (row estate-dev-split): NOS_ESTATE_DIR, else ~/.nos/estate;
# the CLI and readers use the same fallback. Gate: test_the_estate_path_is_computed_once.py.
nos_estate_dir: "{{ ansible_facts['env'].get('NOS_ESTATE_DIR') or ansible_facts['env']['HOME'] ~ '/.nos/estate' }}"
# The host's profile (profiles/<name>.yml), set in config.yml: loaded under config.yml on every run.
nos_profile: ""
# What every container ran at the last converge (tools/workload-digest-record.py writes,
# tools/workload-digest-status.py compares). Runtime state; a converge rewrites it.
nos_workload_digests_file: "{{ ansible_facts['env']['HOME'] }}/.nos/workload-digests.json"

nos_identities:
  # The SSO root. Seeded by the Authentik blueprint (00-admin-groups.yaml.j2)
  # on every blank; listed in the Woodpecker admin allowlist so an SSO login
  # as akadmin is never refused again (the 2026-08-19 incident).
  - name: akadmin
    kind: operator
    tier: 1
    email: "{{ default_admin_email }}"
    realms: [authentik, woodpecker]
    password_var: authentik_bootstrap_password   # tasks/first-login.yml
  # The operator's own account: an Authentik admin from the first install
  # (00-admin-groups blueprint), the local Gitea admin, historical Woodpecker
  # admin. Own email: apps that key on email would merge it with akadmin.
  - name: "{{ nos_primary_admin }}"
    kind: operator
    tier: 1
    email: "{{ nos_operator_email }}"
    realms: [authentik, gitea, woodpecker]
    password_var: nos_operator_password
  # The ephemeral E2E tester (docs/e2e-tester-identity.md) — a service
  # account a human never uses interactively.
  - name: "{{ nos_tester_username | default('nos-tester') }}"
    kind: service
    tier: 1
    email: "tester@{{ tenant_domain | default('dev.local') }}"
    realms: [authentik]
    password_var: nos_tester_password
# Synthetic test identities (alice/bob/carol/dave) are NOT here: they are
# `nos_synthetic_identities` in profiles/test-users.yml, kind: synthetic, so
# this roster holds real accounts only. main.yml adopts that profile's roster
# whenever this stays empty; `nos_test_users_enabled` switches them on, and
# off they retire (state: absent) on the next `nos --confirm` run.
nos_synthetic_identities: []
nos_test_users_enabled: false   # profiles/test-users.yml flips it
# Your own extra people, [{name, email, tier 1-4}] (the profile builder's People
# step writes it). Each gets an Authentik user in its tier's group and its app
# accounts from the first-login walk; the password is derived per name in
# main.yml — read it with tools/nos-secret.py --user <name> nos-identity password.
# Add realms: [authentik, unix] to also make the person a Linux host login
# (roles/pazny.linux.users, home 0700) — the shared-workstation case.
nos_extra_identities: []
# The operator's Authentik password is the derived one by default, and the
# install's identity checks fail if it stops working. true = it is only the
# INITIAL password, like an extra person's: a refusal means the operator set
# their own (first-login and --tags verify then say so instead of failing), and
# the 00-admin-groups blueprint stops re-applying it on every converge.
nos_operator_owns_password: false

# ── ACME (Let's Encrypt) — auto-enabled for public TLDs ──────────────────────
# Wildcard cert *{host_alias_seg}.{tenant_domain} (+ Tier-2 wildcard) via
# DNS-01 challenge to Cloudflare. Keys & state stored at ~/.acme.sh/, certs
# symlinked into nginx/ssl/acme/.
install_acme: "{{ not tenant_domain_is_local }}"

instance_org: ""                          # Client organization name

# Breach-notification controller identity (gov P1). Feeds the GDPR Art-33(3)(b)
# header of bin/breach-report.php via GDPR_CONTROLLER_NAME/_DPO_NAME/_DPO_CONTACT
# env. Empty-default = inert (the report renders blank header fields).
gdpr_controller_name: "{{ instance_org | default('') }}"   # Art-30(1)(a)/Art-33(3) controller identity
gdpr_dpo_name: ""                                          # Art-33(3)(b) DPO / contact-point name
gdpr_dpo_contact: "{{ default_admin_email }}"              # Art-33(3)(b) DPO contact (defaults to admin email)
# strict | standard | none (ruling 2026-10-16). Today only: a non-EU row serves an agent whose
# record claims the EU only at none (nos_gdpr.effective_records, the thalamus preflight).
gdpr_posture: standard
instance_role: "standalone"               # standalone | headquarters | factory | office | division
instance_parent: ""                       # Slug of parent box (for hierarchy)

# ── Playbook behavior ─────────────────────────────────────────────────────────
# Fail playbook if any `docker compose up <stack>` returns non-zero exit.
# Default true — silent stack bringup failures (image pull errors, port
# collisions) previously got masked by `failed_when: false` on the shell task;
# this turns them into hard errors so they're visible. Set false to tolerate
# partial stack failures (e.g., `-e fail_on_stack_errors=false` during debug).
fail_on_stack_errors: true

# Gov-readiness: require host full-disk encryption (P0-ATREST). When true, a
# pre_tasks gate hard-fails the run unless macOS FileVault is On / a Linux LUKS
# (dm-crypt) backing device is present, BEFORE any personal-data service starts.
# Default OFF — a host disk property, independent of Docker. profiles/gov-local.yml
# flips it true. Bypass a false-negative detection with -e nos_skip_at_rest_check=true.
require_disk_encryption: false

# ── macOS-as-managed-upgrade: cross-reboot continuation agent ────────────────
# Installs the resume LaunchAgent (macOS-only) that settles nOS automatically
# after an operator-triggered macOS update + restart. A no-op unless an update
# is armed (tools/nos-os-update-arm.sh). See docs/archive/macos-as-managed-upgrade-target.md.
install_os_resume: true

# ── Fleet / Heartbeat ────────────────────────────────────────────────────────
configure_heartbeat: false                # Heartbeat daemon for fleet reporting
heartbeat_endpoint: ""                    # URL of the fleet management server
heartbeat_interval: 300                   # Interval in seconds (5 minutes)
heartbeat_api_key: "{{ nos_derived_secrets.heartbeat }}"

# ── Bone (local FastAPI — structure/state/dispatcher organ) ──────────────────
# Formerly BoxAPI. See docs/anatomy.md.
install_bone: true                        # FastAPI management API — required for Wing telemetry sink
bone_port: 8099
bone_domain: "api{{ _host_alias_seg }}.{{ tenant_domain }}"
bone_secret: "{{ global_password_prefix }}_pw_bone"
# Retired chain keys, comma-separated, newest first. The audit hash-chain's key
# derives from bone_secret (App\Model\AuditChain::chainKey), so rotating the
# secret used to invalidate every signed row. The verifier now carries a RING:
# a key is elected per recorded segment anchor and is the only one accepted
# until the next, so retired keys verify the history they signed and cannot
# sign new rows. Empty until the first rotation; main.yml appends the outgoing
# value when `bone_secret_rotate=true`, and ~/.nos/secrets.yml persists it.
bone_secret_retired: ""
# HMAC secret for /api/v1/events ingestion. Both sides (Bone server +
# apps_runner client + callback_plugins/wing_telemetry.py) MUST share this.
# Default mirrors bone_secret so the symmetry holds without operator setup.
# Override in credentials.yml for stronger hardening (recommended: 32+
# random bytes — see docs/secrets-hardening.md once it lands).
wing_events_hmac_secret: "{{ bone_secret }}"

# ── Notification dispatch (Anatomy A9 — wing.db.notifications fanout) ───────
# `mail_digest_floor`: severities at-or-below this rank get queued for the
# daily digest mail instead of one-immediate-mail-per-event. The minute-tick
# dispatch worker still fires critical/high immediately; medium/low/info
# (with this default) batch into the 09:00 UTC summary. Set to "none" to
# disable digest behavior (every severity fires immediate — pre-A9-daily
# behavior). Set to "critical" to put EVERYTHING into the digest.
# Ranking: critical < high < medium < low < info (less severe → larger rank).
mail_digest_floor: "medium"
# Cron expression for the digest flush job. Defaults to 09:00 UTC daily.
mail_digest_cron: "0 9 * * *"

# ── Pulse (host launchd — scheduled-job daemon, A4 of the host-organs refactor)
# Local Python daemon that polls Wing API for due jobs and fires them.
# A4 PoC (2026-05-03): non-agentic only; agent runner lands in A8.
# Anatomy default is ON — Pulse is part of the nOS skeleton (not opt-in).
# Wing API endpoints (/api/v1/pulse_jobs/due, /pulse_runs/start|finish)
# return 404 today and Pulse idle-tolerates that gracefully (warns once
# per minute, no crash-loop). Endpoints land alongside A7 (gitleaks plugin).
install_pulse: true
# The jobs the medulla fires (`medulla pulse serve`, eu.thisisait.nos.medulla-pulse); the Python daemon
# skips exactly these. Empty = the medulla fires nothing. A secret: job is refused at converge (it needs
# install_thalamus for the binary). Rollback: empty it, then `nos --tags pulse`.
pulse_medulla_jobs: []

# The maintainer's development loops: loops/*.loop.yml, loop-base (propose,
# drive, review), trunk-sync and the cells that serve only them (proposer,
# surveyor, upgrade-architect, ...). A client host turns it off (profiles/core.yml).
install_loops: true
# Whose host this is. maintainer: the nOS repo's CI (dev/master runs) is this host's red to act on.
# client: a firm's host that runs nOS; tools/red-status.py shows that CI as info only (2026-10-18).
nos_host_role: maintainer   # maintainer | client

# wing_telemetry_enabled lives in main.yml as a PLAY-level var (not here)
# because Ansible callback plugins can only see play.get_vars(), not the
# vars_files-loaded scope. Override per-run with `-e wing_telemetry_enabled=false`.

# ── Mailpit (dev SMTP capture-all + modern web UI) ───────────────────────────
# Default ON — every other service relays SMTP into mailpit:1025 inside the
# iiab_net docker network. UI at https://mail.<tld>, gated by Authentik
# forward_auth (Tier 2 manager). See roles/pazny.mailpit/README.md.
install_mailpit: true                     # SMTP sink + web UI for dev mail capture
mailpit_domain: "mail{{ _host_alias_seg }}.{{ tenant_domain }}"
mailpit_smtp_port: 1025                   # Apps relay here (mailpit:1025 inside iiab_net)
mailpit_ui_port: 8025                     # Web UI + REST API port (nginx fronts at mail.<tld>)

# ── Stalwart Mail Server (production SMTP / IMAP / JMAP — Track G) ──────────
# Disabled by default. Enable AFTER:
#   1. tenant_domain switched to a public TLD (your real domain)
#   2. pazny.acme has issued the wildcard cert via Cloudflare DNS-01
#   3. CF DNS records added: MX, A mail.<td>, SPF/DKIM/DMARC TXT
#   4. the router forwards 25/465/587/993 to host
# When install_smtp_stalwart is on, role refuses to render on a local TLD
# (Mailpit covers dev capture). See roles/pazny.smtp_stalwart/defaults
# and docs/operator-domain-switch.md.
install_smtp_stalwart: false

# ── Mastodon (ActivityPub federation — future-proofing flag, Track G) ───────
# Off by default; role doesn't exist yet. Reserved here so config.yml /
# operator overrides validate cleanly + the flag is discoverable. Full
# implementation lands as roles/pazny.mastodon when operator commits the
# bsky+mastodon dual-federation work (post-PoC).
#
# When enabled it'll need: PostgreSQL + Redis (already on) + dedicated S3
# bucket (rustfs or external) + DNS for mastodon.<tenant_domain> +
# ACME wildcard cert. See docs/operator-domain-switch.md for prep.

# ── Watchtower (Docker image freshness watcher) ──────────────────────────────
# Default ON in NOTIFY-ONLY mode — surfaces stale images in Mailpit without
# auto-restarting anything. Stateful upgrades stay manual via upgrade
# recipes. See roles/pazny.watchtower/defaults/main.yml for tuning.
install_watchtower: true                  # Docker image drift watcher
watchtower_mode: "notify"                 # notify | apply (per-host opt-in)

# ── Provider Access ──────────────────────────────────────────────────────────

# ── Backup copy #2 — the restic STORE (local disk OR S3-compatible) ──────────
# Copy #1 = install_backup: backup.sh dumps every service nightly (03:00) and
# ALSO tees each dump plaintext into backup_staging_dir (roles/pazny.backup).
# Copy #2 = a restic repository holding those dumps: dedup, native AES, retention,
# `restic check`, per-file browse + restore. Two orchestrators, pick ONE:
#   install_backrest: true   → Backrest daemon owns the repo + schedule + UI
#                              (preferred; roles/pazny.backrest, plan nos-dumps)
#   configure_backup: true   → legacy launchd `restic backup` of restic_backup_paths
#                              (tasks/backup.yml; skipped when Backrest is on)
# The TARGET is a value, not an architecture — restic reads all of these:
#   restic_repo: "/Volumes/Backup/restic"                     # external SSD
#   restic_repo: "s3:http://127.0.0.1:9010/nos-restic"        # local RustFS
#   restic_repo: "s3:https://nas.lan:9000/nos-restic"         # S3 on the NAS
#   restic_repo: "s3:s3.eu-central-003.backblazeb2.com/x"     # off-site bucket
#   restic_repo: "sftp:user@nas:/backup/mac-studio"
# Trade-off, named: a restic repo is MUTABLE by anyone holding the key. The S3
# Object-Lock immutability copy #1 has does not carry over until the repo sits
# behind an append-only rest-server (or the bucket's own lock). Leave both
# orchestrators off until restic_repo points at a MOUNTED disk / reachable host.
configure_backup: false
one_way_upgrade_backup_dir: "{{ ansible_facts['env']['HOME'] }}/backups/pre-upgrade"  # tasks/one-way-upgrade-guard.yml: cold copy before a migration with no rollback (keep it off nos_data_root's volume)

# ── Vulnerability Scanner (NOS Security Auditor) ─────────────────────────────
configure_vulnerability_scan: false

# ── CI circadian (plugin ci-circadian) ────────────────────────────────────────
# Nightly `gh workflow run` of every scheduled workflow on dev: GitHub fires schedules only on
# master. The maintainer's estate only; a client estate never dispatches this repo's CI.
install_ci_circadian: false

# ── Version Policy ────────────────────────────────────────────────────────────
# "stable" = pinned CVE-patched versions (default, recommended for production)
# "latest" = always pull newest available images/packages
# "lts"    = LTS/stable release branches for databases and core infra;
#            stable pins for services without LTS concept
#
# Per-service override: set individual *_version variables in config.yml
#
# Usage:
#   ansible-playbook main.yml -K                          # stable (default)
#   ansible-playbook main.yml -K -e version_policy=latest # latest
#   ansible-playbook main.yml -K -e version_policy=lts    # lts
#   ./security-update.sh                                  # security-only update
version_policy: "stable"

# ── Docker Resource Limits ────────────────────────────────────────────────────
# mem_limit per service tier. Override per service: {service}_mem_limit
docker_mem_limit_heavy: "4g"             # GitLab
docker_mem_limit_critical: "2g"          # Authentik, ERPNext, Nextcloud, Grafana
docker_mem_limit_standard: "1g"          # most services
docker_mem_limit_light: "512m"           # Redis, Kiwix, Tileserver, exporters
docker_cpus_heavy: "2.0"
docker_cpus_standard: "1.0"
docker_cpus_light: "0.5"
# Authentik is half the core's memory (2026-10-14): its workers, threads and limits are knobs here,
# not role defaults, so a profile (profiles/core.yml) can size them. Web workers: gunicorn's minimum is 2.
authentik_mem_limit: "{{ docker_mem_limit_critical | default('2g') }}"
authentik_worker_mem_limit: "{{ docker_mem_limit_standard | default('1g') }}"
authentik_cpus: "{{ docker_cpus_standard | default('1.0') }}"
authentik_web_workers: 2
authentik_web_threads: 4
authentik_worker_processes: 1
authentik_worker_threads: 2
# The estate brand (row estate-brand): the name on the Authentik login page and tab title.
estate_brand_title: "This is AIT"
# The smallest Docker VM (GiB, as `docker info` MemTotal reports it) a converge
# starts on. Measured 2026-10-10, all-on: 10 GB (9.7 GiB) died on timeouts an
# hour in, 11.5 GB (11.17 GiB) ran failed=0. A smaller estate may lower it.
docker_min_memory_gib: 11
# Size is not enough: 2026-10-12 a VM that passed the size check read full
# avg300=34.55 in /proc/pressure/memory and the converge died on an Authentik EOF;
# idle the same VM reads ~0.3. Refused above this (avg60, read before any stack).
docker_memory_pressure_max_full_avg60: 10

# ==============================================================================
# INSTALLATION QUEUE
# Comment out (#) any line to SKIP that component during provisioning.
# ==============================================================================

# ── Reverse proxy ─────────────────────────────────────────────────────────────
# Traefik is the edge proxy (binds 80/443). It auto-discovers manifest apps
# via Docker labels and routes Tier-1 services from a file provider that
# pazny.traefik renders out of state/manifest.yml + the install_* flags.
#
# install_nginx is for operators who want a thin host-side nginx alongside
# Traefik — e.g. for SCRIPT_FILENAME flows that tunnel through the legacy
# vhost templates under templates/nginx/sites-available/. When enabled,
# nginx starts EMPTY: the operator opts in per-vhost via `nginx_sites_enabled`
# (no auto-derivation from install_* flags). install_nginx + install_traefik
# both true is rejected — they would collide on 80/443.
install_nginx: false

# Track C+D (2026-04-26): Linux-only flags. Ignored on macOS.
install_docker: true              # Linux: install Docker CE + compose plugin via APT
install_hardening: true           # Linux: ANSSI baseline (ufw + fail2ban + sysctl + auditd + apparmor + chrony + ssh + unattended). Decision O5: default ON, opt-out via this flag.
# The two ssh choices a host's USE decides (pazny.linux.hardening, server default
# off): password logins and TCP forwarding (editor remotes tunnel over ssh).
# profiles/workstation.yml turns both on for people who ssh into a shared box.
hardening_ssh_password_auth: false
hardening_ssh_tcp_forwarding: false

# macOS workload telemetry (epic workload-allowlist). MONITOR mode only, never lockdown.
# First run stops for two System Settings approvals (system extension + Full Disk Access).
install_santa: false              # Santa exec telemetry; reader: tools/santa-status.py
santa_version: "2026.9"           # github.com/northpolesec/santa release (Apache-2.0)
santa_pkg_sha256: "96821b6439d51ece2991e1d9a8ddd9969c6278391325d8e73904ff0961dff6ea"
# ClamAV, the anti-malware immune cell (brew/apt, tasks/clamav.yml); signatures by the
# clamav:freshclam Pulse job. Judges the immune drill's eicar sample; scans nothing else yet.
install_clamav: false

# Agents (claude CLI children of AgentKit / pulse-run-agent.sh) run as a separate,
# non-admin macOS user that cannot read ~/.nos. Off = agents run as the operator, as today.
agents_separate_user: false
agents_user: "nos-agent"
agents_libexec_dir: "/usr/local/libexec/nos-agent"
agents_claude_wrapper: "{{ agents_libexec_dir }}/nos-agent-claude"

# ── Languages / runtimes ──────────────────────────────────────────────────────
# PHP at the host level is no longer needed by default — Track A (2026-04-26)
# moved Wing's PHP-FPM into a container and Composer runs inside that
# container via the wing-cli sidecar. Re-enabling this flag will install
# Homebrew php@8.3 + start its launchd service, which then steals port 9000
# from the Wing container (FPM upstream `php_fpm` in nginx is also at :9000).
# Only flip this back to true if you have host-side PHP needs that don't go
# through Wing.
install_php: false                # Kept false. The host-PHP INSTALLER (tasks/php.yml) was deleted
                                  # 2026-09-05 — Wing uses FrankenPHP + a self-downloaded composer.phar,
                                  # and Homebrew php@ collides with php-zts over /opt/homebrew/bin/php.
                                  # This flag now only gates some service-registry/dashboard rows (which
                                  # over-use it as a proxy for Wing/Redis/php-fpm); do NOT delete the key
                                  # until those are re-gated, or `| default(true)` flips them all on.

# ── AI Agent ──────────────────────────────────────────────────────────────────
install_openclaw: true            # OpenClaw (Inspektor Klepitko, Ollama, no API key)
install_hermes: false             # Hermes Agent (Nous) – Python daemon, MCP client, cross-channel gateway
install_device_gateway: false     # Device BFF (RFC 8628). Enable in config.yml; Art-30 gate docs/compliance/devices.md.
install_opencode: false           # OpenCode AI coding TUI (sst.dev) with local Ollama provider
# Receptor: a host login reaches KEAP's human door as a person (roles/pazny.receptor).
# On wherever OpenHuman is, its only way into the tables; set true for host CLIs alone.
install_receptor: "{{ install_openhuman }}"
# Host login -> {username, groups[]} the receptor gives KEAP (~/.nos/identity-map.yml, the ONE
# map; the Thalamus will read it). {} = from the roster: your login is nos_primary_admin, each
# nos_extra_identities name a login of its own name. A login not listed is refused.
nos_identity_map: {}
# Under ~/.nos (0700), the socket 0600. Clients: KEAP_IDENTITY_URL=http+unix://<path, %-quoted>.
receptor_socket: "{{ ansible_facts['env']['HOME'] }}/.nos/keap-identity.sock"
# Thalamus: Iris at a terminal, tools run as you through KEAP's human door; a write lands
# only after you approve its cell diff (roles/pazny.thalamus). Needs install_receptor: it
# reads the receptor's identity map. Off until the operator proves it live.
install_thalamus: false
# Linux builds the thalamus in this image (roles/pazny.thalamus/tasks/linux.yml):
# tag AND digest, so a re-pushed tag cannot change the compiler.
thalamus_rust_image: "rust:1.90-bookworm@sha256:3914072ca0c3b8aad871db9169a651ccfce30cf58303e5d6f2db16d1d8a7e58f"
# tools/image-sbom.py (Pulse advisory-patrol:image-sbom) runs these scanners as containers, never as host
# packages: tag AND digest, like thalamus_rust_image. A bump is a session commit with the new index digest.
syft_image: "anchore/syft:v1.57.1@sha256:03215d0e98b661d0ecbc8575dbc14d65be1743b5de5df6410aecb7e80f95b060"
grype_image: "anchore/grype:v0.121.3@sha256:13113eeceab017260370cf540e1d25442c59665fd07d1b09b66d63bb0c282887"
# The face's door into thalamus serve (src/relay.rs): loopback only, opened with install_face, read by
# the plist and the face compose env. 8097: free, beside cortex 8098 and Bone 8099.
thalamus_relay_port: 8097
# Iris's row on THIS host: "" = the cell's own (mistral-eu); "ollama" = on-device (the default while
# llm_on_host), needs install_ollama + ollama_enabled + an ollama_model of llm_cell_min_params_b or more.
iris_backend: "{{ 'ollama' if llm_on_host else '' }}"
# The on-device model's sampling temperature for Iris (low = steadier tool calls; measured 2026-10-15:
# one model scored 9/11 then 6/11 at Ollama's default). Cloud rows keep their own.
iris_local_temperature: 0.3
# A fixed sampling seed for the on-device model ("" = unset, Ollama samples freely). Set it for a
# deterministic bench run (tools/iris-bench.py, docs/llm/evals-and-finetune.md); cloud rows ignore it.
iris_local_seed: ""
# How Iris plans a turn: "tools" = the model calls the thalamus's tools; "cortex" = it first emits ONE
# cortex-lang pipeline, the cortex organ validates it (needs install_cortex) and the thalamus maps it to
# those tools, falling back to tools when refused (seed row iris-speaks-cortex-lang, bench before switching);
# "hybrid" = the turn's own words pick: an iris_cortex_intents turn plans in cortex-lang, any other uses tools.
iris_plan: "tools"
# hybrid's cortex intents (the bench's kinds; measured 2026-10-18/19 cortex beat tools on these four).
# insert-row sends a WRITE to the planner: the approval card still gates it.
iris_cortex_intents: [chart, kpi, top-n, insert-row]
# The cortex plan's table lines: "lean" = column key:kind; "rich" adds each label and select options.
# Measured 2026-10-18 (cortex, qwen3.5:9b GGUF, standard): 85 -> 70/283 beside the catalogue rework;
# A/B with ~/iris-bench-local/ab-catalogue.sh before choosing rich. The face's marks stay rich either way.
thalamus_cortex_catalogue: "lean"
# The most nodes of the ontology Iris draws around a node she read (read_node's knowledge tree: the
# parent chain, the node, its children, then its siblings; the rest is said). The wire carries at most 200.
iris_knowledge_tree_max: 50
# Iris's turns as OTLP spans to Alloy (127.0.0.1:alloy_otlp_http_port): turn, model call, tool; names,
# durations, outcome and token counts only, never content (row thalamus-otel-spans). Off by default.
thalamus_otel_spans: false
# The Wing agents Iris may START (start_agent: a card the person approves, then a Wing session under her
# run). Read-only by default: they read and file a report event, never change the estate. [] = none.
# librarian is left out: it holds keap.write.
iris_startable_agents: [conductor, surveyor]

# ── nos system user (Linux; roles/pazny.linux.users + pazny.medulla) ──
# "" = today: the thalamus is a systemd --user unit of the operator. "nos" = a nologin system account
# (no tier group, never docker) and a system unit running the medulla as it, confined to
# nos_system_home (ProtectHome: it cannot read ~/wing or ~/.nos). The operator's key (config.yml).
nos_system_user: ""
nos_system_home: /var/lib/nos

# ── Skill library (2026-08-27) ────────────────────────────────────────────────
# One shelf at files/anatomy/skills/, symlinked onto every reader that should
# hold it; contract + audience rule in files/anatomy/skills/README.md.
# `kind: main` (human-driven harness) gets every skill; `kind: agent` gets only
# skills whose metadata.nos.audience names its `id`. An entry whose `dir`
# PARENT does not exist is skipped — a skills dir for an uninstalled harness
# reads later as evidence the harness is set up.
nos_install_skills: true
nos_skill_consumers:
  # Operator harnesses — the full library.
  - { id: claude,   kind: main,  dir: "{{ ansible_facts['env']['HOME'] }}/.claude/skills" }
  - { id: codex,    kind: main,  dir: "{{ ansible_facts['env']['HOME'] }}/.codex/skills" }
  - { id: gemini,   kind: main,  dir: "{{ ansible_facts['env']['HOME'] }}/.gemini/config/skills" }
  - { id: pi,       kind: main,  dir: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/skills" }
  - { id: opencode, kind: main,  dir: "{{ ansible_facts['env']['HOME'] }}/.config/opencode/skills" }
  # The harness-agnostic location, so a reader nobody has wired still finds one.
  - { id: agents,   kind: main,  dir: "{{ ansible_facts['env']['HOME'] }}/.agents/skills" }
  # Autonomous runners — only what names them.
  # LITERAL paths, deliberately NOT references to the role vars (e.g.
  # hermes_config_dir): role defaults load at stack-up, after the eager vars
  # resolve — the CLAUDE.md `vars` trap; test_config_stock_jinja_only fires
  # even on a braced COMMENT, hence prose here. The literal must agree with
  # the role default by hand; test_the_skill_library_is_scoped.py pins it.
  - { id: hermes,   kind: agent, dir: "{{ ansible_facts['env']['HOME'] }}/.hermes/skills" }
  - { id: openclaw, kind: agent, dir: "{{ ansible_facts['env']['HOME'] }}/.openclaw/skills" }
install_pi_agents: false          # PI agent framework + pi-autoresearch extension (pi.dev)
install_backup: true             # pazny.backup — nightly DB + volumes + blueprints → RustFS (launchd agent)
install_backrest: false          # pazny.backrest — restic store orchestrator + browse/restore UI (host launchd daemon); needs restic_repo
install_wing: true           # Wing Security Dashboard + Hub (Nette PHP + SQLite) [requires: php, nginx]

