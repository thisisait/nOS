docker_bin: /usr/local/bin/docker

# ── FrankenPHP — Wing host runtime (anatomy A3.5, 2026-05-04) ────────────────
# FrankenPHP = single binary bundling Caddy HTTP server + PHP runtime + Mercure +
# Vulcain. Replaces the wing PHP-FPM container + wing-nginx sidecar pair with a
# host-native launchd daemon listening on 127.0.0.1:9000. Ships PHP 8.5 +
# Caddy 2.x; Wing's composer.json minimum is PHP 8.3 — backward compatible.
#
# The binary is the GitHub release static build on EVERY platform (#48): a
# Homebrew tap formula has no version selector, so on macOS it landed the tap's
# latest and every upstream release broke every fresh install at the version
# preflight. The release binary is self-contained (system dylibs only) and is
# installed to frankenphp_bin (~/.local/bin/frankenphp). The `php` CLI on macOS
# (composer, Pulse jobs) stays Homebrew's shivammathur/php/php-zts.
#
# frankenphp_version: pazny.wing fetches exactly this release and refuses a
# binary whose `frankenphp --version` does not report it. Bump = new version +
# all four checksums below, in one commit.
frankenphp_version: "1.13.5"
# sha256 per release asset (frankenphp-<key>) of v1.13.5 as of 2026-11-08.
# Upstream's static.yaml rebuilds the LATEST tag every night and re-uploads (--clobber), so these
# go stale daily. Re-pin with tools/frankenphp-repin.py --write (nightly: workflow frankenphp-digest
# opens the PR); it moves a pin only after `gh attestation verify` names upstream's static.yaml.
# mac-x86_64 has no asset since 1.13.3: its pin is still 1.13.1's, so an Intel Mac fails closed.
frankenphp_checksums:
  linux-aarch64: "f7c599635563b71c2072adff1a34fa04df44dba9d9a6f4b8443f9da4f03dd7ca"
  linux-x86_64: "1c58538a68d532c1ee76f26c7726736fa9c0039b662f6126e3173706ab55b563"
  mac-arm64: "95af1b64012bcce192c6a3bab9d26bd4f8a03c273159cb7bcb73842e0a8cf3d1"
  mac-x86_64: "b9123b427cb357eac076b1f316f71589cfe5c3db4ad2449114e243563d794a89"

# ==============================================================================
# NGINX
# ==============================================================================

# Nginx sites – activated AUTOMATICALLY based on install_* flags.
# For manual override set nginx_sites_enabled in config.yml.
# To add your own sites use nginx_sites_extra:
# nginx_sites_extra:
#   - php-app.conf
#   - python-proxy.conf
  # - static-site.conf      # Static files with caching

# ==============================================================================
# PHP
# ==============================================================================

php_version: "8.3"
php_memory_limit: "256M"
php_upload_max_filesize: "64M"
php_post_max_size: "64M"
php_max_execution_time: 300

php_extensions:
  - "php@{{ php_version }}-redis"
  - "php@{{ php_version }}-imagick"

php_composer_packages:
  []
  # - name: laravel/installer
  #   state: present
  # - name: drush/drush
  #   state: present

# ── Wing Security Dashboard ─────────────────────────────────────────────
wing_domain: "wing{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
# wing_port MUST be at top level (not just role default) — the Traefik
# file-provider template (roles/pazny.traefik/templates/dynamic/services.yml.j2)
# resolves it via `lookup('vars', s.port_var)` from PLAY scope, which
# only sees top-level config vars + role defaults of currently-included
# roles. The Traefik render runs in pre_compose hook (host scope, no
# pazny.wing inclusion), so role-local wing_port=9000 was invisible →
# rendered upstream URL was `http://nos-host:0` and wing.<tld> 502'd
# at the Traefik upstream layer (C11, 2026-05-08).
wing_port: 9000
# The PHP CLI that runs Wing's bin/*.php from Ansible. macOS: Homebrew php(-zts).
# Linux: ~/.local/bin/nos-php (pazny.wing), a shim over `frankenphp php-cli` — a fresh Ubuntu has
# no `php`, and the bare `php` these tasks used failed there behind
# failed_when: false (the CI runner and the cloud sandbox both ship a php).
wing_php_cli: "{{ 'php' if ansible_os_family == 'Darwin' else (ansible_facts['env']['HOME'] ~ '/.local/bin/nos-php') }}"
wing_home: "{{ ansible_facts['env']['HOME'] }}/wing"
wing_app_dir: "{{ wing_home }}/app"
wing_data_dir: "{{ wing_app_dir }}/data"
# ── the strangler seam (ssot/doctrine/medulla.md §5) ──
# Whole /api/v1/<prefix> names Wing's Caddy hands to the medulla; [] = everything is still PHP.
# The operator moves a prefix in config.yml (e.g. [metrics]), then converges --tags wing,thalamus.
medulla_routes: []
# Named read sets whose GETs alone move; their writes stay PHP's (ruling 2026-10-25). [] = none.
# [pulse] = GET /api/v1/pulse_jobs, /pulse_runs, /pulse_runs/summary, /pulse_runs/<id> (not /due).
# [admin] = GET /api/v1/admin/state: PHP's halt_active + job_counts and the medulla's state struct.
# [audit] = GET /api/v1/audit/verify: the cached audit-chain verdict (MEDULLA_AUDIT_CHAIN, never the secret).
# [inbox] = GET /api/v1/inbox/questions and /<uuid>: open agent questions and a poll (answer, cancel stay PHP's).
# [notifications] = GET /api/v1/notifications: the operator's notification list (insert and mark-read stay off it).
medulla_read_routes: []
# The medulla's loopback HTTP door. 8095: free (8096 is Jellyfin; 8097 relay, 8098 cortex, 8099 Bone).
medulla_http_port: 8095
wing_json_source: "{{ playbook_dir }}/docs/llm/security"
# Tracy debug bar gate. Empty (default) = debug NEVER renders — the bar leaks
# $_COOKIE/config/SQL dumps and must stay off on any reachable install. To
# debug: set this to a long random value, redeploy, then set a `tracy-debug`
# browser cookie to the same value (constant-time compared in Booting.php).
# IP gating can't work behind loopback+Traefik (every request looks local).
wing_tracy_secret: ""
# Audit-log retention horizon (GDPR Art. 5(1)(e) storage limitation). Enforced
# on-demand by `--tags audit-retention` (dry-run unless -e retention_confirm=true);
# see docs/security-baseline.md §4. Not auto-scheduled.
wing_audit_retention_days: 365

# Tamper-evident audit hash-chain (gov-readiness P1). When true, every events
# row is HMAC-chained at INSERT (Bone Python + Wing PHP seams), WORM triggers
# block content UPDATE / unguarded DELETE on chained rows, the retention purge
# re-anchors, and bin/verify-audit-chain.php confirms integrity. Pre-enable rows
# stay unsigned (accepted baseline). DETECT-not-prevent vs a DB-only attacker;
# the chain key is on-box (derived from wing_events_hmac_secret). Default OFF
# (behavior-changing-control doctrine). Toggling OFF->ON re-runs
# backfill-event-chain.php (post.yml does this when on) to record the segment
# anchor. Verify: php files/anatomy/wing/bin/verify-audit-chain.php --db=<wing.db>
wing_audit_chain_enabled: false

# PEM bundle trusted while nOS BUILDS its own images (face, superset), never
# baked into them — a BuildKit secret on the download steps. For a TLS-intercepting
# egress: a corporate proxy, or the Claude cloud sandbox (tools/cloud/e2e.sh
# passes its bundle). Empty = the image's own trust store only.
nos_build_ca_bundle: ""

# ==============================================================================
# OPENCLAW – self-hosted AI agent (Ollama backend, no API key)
# Documentation: https://github.com/openclaw/openclaw
# Ollama integration: https://ollama.com/blog/openclaw
# ==============================================================================

ollama_max_loaded_models: 1    # Max models in RAM (1 = saves SWAP on 36GB)
ollama_num_parallel: 2         # Max parallel inference requests
ollama_keep_alive: "5m"        # Release model from RAM after idle (default 5m, 0 = immediate)
ollama_flash_attention: 1      # Flash attention for MLX (faster, less memory)

# Every AgentKit agent's row on THIS host: "" = each agent's own model.backend; "ollama" = all on
# the local Ollama (needs install_ollama + ollama_enabled + an ollama_model of llm_cell_min_params_b
# or more). A choice, never a fallback: an agent whose record does not name the row is refused.
agents_backend: ""

# ollama — the LOCAL backend, and the only one that can carry an agent's
# `transfers_outside_eu: false` honestly: nothing leaves the host. Arming is
# three edits, not five, because there is no key and no residency premium —
# this flag and the two model ids. The ids must be models `ollama list` shows.
#
# MEASURED 2026-08-30 on state/fixtures/local-model-bench.yml (6 tasks, code as judge):
# hermes3:8b 2/6, every failure punctuation; qwen3:14b 4/6, no syntax errors
# left and its two misses are about the world; qwen2.5-coder:32b unscoreable —
# it drove the KEAP validator from 0.02s to 16.71s and starved its own judge.
# The knee is 14B and the ceiling is this machine, not the weights.
# On-host models (ruling 2026-10-16): three switches over the knobs below; a later layer still
# sets any knob itself (iris_backend: mistral-eu, ollama_model: qwen3:14b, ...).
llm_on_host: true              # text model on the host: Iris works with no key, even badly
vlm_on_host: "{{ ollama_vision_model != '' }}"  # vision model (vlm_model); on whenever ollama_vision_model is named
decision_model_on_host: false  # decision model (ollama_decision_model, /v1/systemone, ollama >= 0.35)
ollama_enabled: "{{ llm_on_host or vlm_on_host or decision_model_on_host }}"
ollama_model: "{{ 'qwen3:4b' if llm_on_host else '' }}"  # -> NOS_LOCAL_MODEL (sonnet tier); Apache-2.0, ~2.5 GB q4
# hermes3:8b: the bound FALLBACK of every hosted-primary agent (2026-10-01) —
# tool-capable, and small enough that KEAP keeps answering (14B starves it).
ollama_small_model: "hermes3:8b"  # -> NOS_LOCAL_SMALL_MODEL (haiku tier)
# vision tier — a document/image-input model, distinct from the text tiers
# above (BindingResolver's tier regex now also matches `vision`). Chosen
# 2026-09-20 for the D1 invoice-vision path: qwen2.5vl:7b (Ollama library tag
# `qwen2.5vl:7b`, ~6GB at q4_K_M). The operator pulls it — this file only
# names the id `ollama list` must show. See files/anatomy/agents/
# invoice-vision-ocr/agent.yml for the consumer.
# The id an operator names; vlm_on_host follows it. `vlm_on_host: true` alone is served qwen2.5vl:7b
# through vlm_model, since naming it back here would make the two vars a loop Ansible refuses.
ollama_vision_model: ""
vlm_model: "{{ ollama_vision_model or ('qwen2.5vl:7b' if vlm_on_host else '') }}"  # -> NOS_LOCAL_VISION_MODEL (vision tier)
ollama_decision_model: "{{ 'tev1:4b' if decision_model_on_host else '' }}"  # pulled; no tier binds it yet
# A cell bound to local ollama (install_thalamus -> iris, an agents_backend rebind) refuses below
# llm_cell_min_params_b billion parameters (size from the tag; none = refused) and warns below
# llm_cell_recommended_params_b. Ruling 2026-10-16; tools/nos_cell_binding.py, src/binding.rs.
llm_cell_min_params_b: 3
llm_cell_recommended_params_b: 8

# THE PIN THAT DID NOT EXIST, AND WHAT ITS ABSENCE COST (added 2026-08-08).
#
# `roles/pazny.openclaw` installs ollama with `state: latest` and nothing has
# ever declared WHICH ollama the estate wants. That is fine right up until a
# formula of the same name outranks homebrew/core — and one does, on this host:
#
#     $ brew info ollama
#     ==> ollama: stable 0.30.7 (bottled)
#     Warning: `ollama` shadows `homebrew/core/ollama`      <- core is 0.32.6
#
# `pazny/local` was tapped in June to carry a HEAD build, because core's 0.30.7
# bottle shipped no `llama-server` and every GGUF answered HTTP 500 (memory
# `ollama-brew-mlx-only-bottle`). The tap did its job. But it is NOT in
# `homebrew_taps` above, so the playbook never knew it existed, `state: latest`
# has meant "latest within the tap" ever since, and the estate sat two minor
# versions back for weeks while every run reported success.
#
# The tap's reason is gone, verified rather than assumed: homebrew-core 0.32.6
# builds llama-server (`cmake --install llama-server --component llama-server`)
# AND its `test do` block spawns it against a GGUF model and asserts it listens.
#
# So the pin is declared here and VERIFIED against the landed binary, the same
# shape `frankenphp_version` uses — because a pin nobody reads back is a wish.
# Moving off a shadowing tap needs one operator action the playbook must not
# take unattended:
#     brew uninstall ollama && brew untap pazny/local && brew install ollama
# Models live in `ollama_models_dir` and survive it.
#
# THE PIN DECIDES. Install is `state: present` (2026-08-27). When brew has
# already linked a newer keg, the role links the pin keg back if it is still
# in the cellar. Advancing this number is `tools/brew-pin-status.py` plus a
# commit — not a failed converge. Security-floor.md still advances immediately
# on a CVE. Last adopt: 0.34.0 on 2026-09-14 (TOO-FRESH the same afternoon;
# keg was already linked). Previous: 0.33.3 09-05, 0.33.2 09-03, 0.33.0 08-27.
# 0.35.0 on 2026-09-30: TOO-FRESH (2 days), adopted by operator decision —
# /v1/systemone decision models (dtt local-decision-tev1) need >= 0.35.
ollama_version: "0.40.6"
# Linux archives of that pin, by architecture (roles/pazny.ollama/tasks/linux.yml).
# Advance together with ollama_version — the digest, not the release page, is the trust.
ollama_linux_sha256:
  arm64: "0a279d9428ad17b06fdb7dddf3b059b2c148433585fa3b30676a102fc459bb9f"
  amd64: "c164ab8b1b28e2a247c29719b8e404c423c5b83ae64c3ab4e59d50c7ff7fc5e0"

# Where host daemons meet containers. macOS: loopback (Docker Desktop's
# host.docker.internal reaches it). Linux: docker0's address, because Linux
# host-gateway cannot reach a loopback bind; the LAN still cannot. Read from
# the host's docker0 fact (a daemon.json `bip` moves it); Docker's default
# 172.17.0.1 before Docker is installed.
nos_docker_host_ip: "{{ '127.0.0.1' if (ansible_system | default('Darwin')) == 'Darwin' else ((((ansible_facts | default({})).get('docker0') or {}).get('ipv4') or {}).get('address') or '172.17.0.1') }}"
# The model server listens there (no auth, so never wider). Host-side
# consumers read ollama_url, containers host.docker.internal.
ollama_bind_host: "{{ nos_docker_host_ip }}"
ollama_url: "http://{{ ollama_bind_host }}:11434"

# The model server itself (roles/pazny.ollama, row `ollama`). Its own flag since
# 2026-10-06: core cells use it as backend:ollama, so install_openclaw: false must
# not take it away. Default true = what install_openclaw: true installed before.
install_ollama: true

