# ==============================================================================
# B2B – ERPNEXT (CRM + ERP + HR + Accounting)
# Requires: install_mariadb: true, redis_docker: true
# ==============================================================================

# REM-165. v15.119.0 is the TOP of the v15 line — v15.120.0 is 404 — and the
# bump stays inside v15 deliberately: v16.31.1 exists and the pin scanner offers
# it, but a Frappe major is a bench migration this estate already treats as
# unreliable on a cold blank (ERPNext is excluded from profiles/all-on.yml).
#
# HONEST LIMIT: erpnext is NOT RUNNING on this host, so unlike every other bump
# in this wave the result cannot be verified against `docker ps`. The tag and
# its arm64 manifest are verified against the registry; that the service comes
# up on it is not. First supervised `-e install_erpnext=true` run is the test.
erpnext_version: "v15.124.5"              # top of v15 (2026-11-04): GHSA-m668-9q43-8g29 + GHSA-x267-fgf5-54q9 fixed by 15.124.2 [advisory-status 2026-11-08]. Prior GHSA-v38v-9h2p-hr8v (critical) fixed by 15.121.3. REM-208: GHSA-6w83-8777-v93q SSTI (CVSS 9.9), floor 15.119.1 — pinned above it so the fourth overtake has margin
# Bind-mount target for the ERPNext sites volume. The Docker named volume
# `b2b_erpnext_sites` is the live storage; this var is referenced by
# tasks/post.yml when reading site_config.json + bench migrate. Operators
# pointing external storage at sites use this override.
authentik_oidc_erpnext_client_id: "nos-erpnext"
authentik_oidc_erpnext_client_secret: "{{ nos_derived_secrets.oidc_erpnext }}"

# ==============================================================================
# B2B – FREESCOUT (helpdesk / ticketing)
