# ==============================================================================

openwebui_domain: "ai{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
openwebui_port: 3004             # Internal container port 8080 → host 3004
# JupyterHub (roles/pazny.jupyterhub): host-native, Linux only. The proxy binds
# docker0:jupyterhub_port, Traefik serves jupyter.<tld>.
jupyterhub_domain: "jupyter{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
jupyterhub_port: 8010
# Pins: the Hub, Lab and kernel share one root-owned venv every user can exec.
jupyterhub_version: "6.0.0"
jupyterlab_version: "4.6.3"
jupyterhub_ipykernel_version: "7.3.0"
jupyterhub_oauthenticator_version: "17.4.0"
jupyterhub_systemdspawner_version: "1.0.2"
# The proxy fronts every notebook on the host network: tag AND digest.
jupyterhub_chp_image: "quay.io/jupyterhub/configurable-http-proxy:5.2.0@sha256:522738d5285e4be758da5023194cbc95249efdadaa62a0998c8ed1aa2890b2da"
# vLLM (roles/pazny.vllm): ONE resident model behind an OpenAI-compatible API,
# The image's CUDA must not exceed what the host driver serves (the role refuses
# otherwise): NGC 26.09 needs driver >= 615, the DGX Spark ships 580 (CUDA 13.0),
# so the upstream -cu129 build (CUDA 12.9, sm_120 cubins run on GB10's sm_121).
# beside Ollama (which keeps every other model on demand). Linux + NVIDIA only.
# The weights are a pinned Hugging Face snapshot fetched in the background; the
# service is rendered once a reader finds it complete, then runs offline.
vllm_image: "vllm/vllm-openai:v0.31.0-cu129@sha256:ff29e51a9457f191deb332b96fa6440584fa941aa2a548449b604e2b1e5e1eeb"
vllm_model: "Qwen/Qwen3.5-35B-A3B-FP8"
vllm_model_revision: "9d1823d2dee688a6b25e77009dc727688c44936e"
# The id clients ask for. Ollama-shaped (name:tag-<N>b) so the cell size floor
# (llm_cell_min_params_b) reads its parameter count like any local model's.
vllm_served_model_name: "qwen3.5:35b-a3b-fp8"
vllm_port: 8011                   # 127.0.0.1 only; containers use http://vllm:8000/v1
vllm_data_dir: "{{ nos_data_root }}/platform/services/vllm"
# The share of the GPU's memory vLLM PRE-ALLOCATES at start (weights + KV cache).
# On unified-memory hosts (DGX Spark: 121 GB) that is the same pool as Ollama's
# resident models, notebooks and containers — size it, do not let it default.
vllm_gpu_memory_utilization: 0.45
vllm_max_model_len: 32768
vllm_extra_args: []
# Optional packages broken in the pinned image, hidden behind an empty tmpfs so
# their import fails as ImportError (handled) instead of OSError (fatal).
# v0.31.0-cu129 arm64 ships a torchcodec built for CUDA 13 (needs libnvrtc.so.13):
# vllm/multimodal/media/audio.py dies on it at startup, even for a text model.
# Re-check (and empty this) whenever vllm_image moves.
vllm_masked_paths:
  - /usr/local/lib/python3.12/dist-packages/torchcodec
# How long vLLM may take to load and capture CUDA graphs before its healthcheck
# counts; the role refuses when stack_up_wait_timeout is shorter.
vllm_start_period_s: 480
# A host without a CDI-visible NVIDIA GPU skips vLLM with a message; true makes
# that a refusal (a host that is SUPPOSED to serve it).
vllm_require_gpu: false
# REM-176, the THIRD consecutive supersession of this component: REM-101 moved
# it 0.8.12 → 0.9.6, REM-138 0.9.6 → 0.10.2, this one 0.10.2 → 0.11.0. Each was
# correct when written and stale within weeks, which is the argument for
# measuring the registry rather than quoting the queue.
#
# 0.11.0 verified by MANIFEST, not by a tag listing: ghcr's /tags/list returned
# 1000 entries containing NEITHER 0.10.2 (which is running) nor 0.11.0 (which
# exists) — the listing is incomplete for this repository, so a HEAD on the
# manifest is the only authoritative answer. arm64 present; 0.11.1 is 404, so
# this is the top of the line as of 2026-08-07. Same-major, DB migration on
# start (~minutes), and signup stays off per the pure-SSO doctrine.
  # REM-245 patch bump, then REM-270 0.11.1 -> 0.11.4 (ghcr manifest 200, arm64).
openwebui_version: "0.11.4"
openwebui_secret_key: "{{ nos_derived_secrets.openwebui }}"
openwebui_enable_signup: false   # pure-SSO: public local signup OFF (was true →
                                 # public /auth/signup first-admin race). Users
                                 # onboard via Authentik OIDC; admin is DB-seeded
                                 # + group-mapped (OAUTH_ADMIN_ROLES). The compose
                                 # template default is false too, but this
                                 # explicit value was the live source of truth.
openwebui_admin_name: "Admin"
openwebui_admin_email: "{{ default_admin_email }}"
openwebui_admin_password: "{{ nos_derived_secrets.openwebui_admin }}"

