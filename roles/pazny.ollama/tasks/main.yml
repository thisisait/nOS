---
# ==============================================================================
# OLLAMA — the local model server: homebrew formula, user LaunchAgent on :11434.
# Its own row since 2026-10-06 (core cells use it as backend:ollama), moved
# from roles/pazny.openclaw, which now only consumes it.
# ==============================================================================

# `state: present`, NOT `latest` — changed 2026-08-27 after the pin guard below
# fired a third time: `latest` had adopted a formula ONE DAY old in
# homebrew-core (`ollama 0.33.0`, 2026-08-26T03:01:09Z), unattended. The lag is
# now a decision (Omarchy's month-behind mirror, mise's MINIMUM_RELEASE_AGE):
# `tools/brew-pin-status.py` says when a newer version has aged enough, and
# advancing the pin is a commit. THE COST: a security fix no longer arrives by
# itself — the carve-out is ssot/doctrine/security-floor.md (a CVE advances the
# pin immediately); `tasks/nginx.yml:34` keeps `state: latest` for REM-134.
- name: "[Ollama] Install Ollama via Homebrew (0.19+ = MLX backend on Apple Silicon)"
  community.general.homebrew:
    name: ollama
    state: present
  register: _ollama_install
  when: nos_pkg_manager == 'homebrew'

# `state: latest` upgrades to the latest of WHICHEVER FORMULA WINS THE NAME, and
# a third-party tap outranks homebrew/core. On this host `pazny/local` has done
# exactly that since June, so "latest" meant 0.30.7 while core moved to 0.32.6 —
# for weeks, with every run reporting changed=false and success.
#
# So the landed binary is read back against the pin, the same way
# `frankenphp_version` is (roles/pazny.wing/tasks/main.yml). The shadowing tap is
# named in the failure because that is the part nobody could see: it is not in
# `homebrew_taps`, so nothing in this repository knows it exists.
# READ THE KEG, NOT THE SERVER — and they are different questions (2026-08-09).
#
# The first version ran `ollama --version`, which reports the RUNNING DAEMON's
# version, not the installed one. Right after the operator switched taps that
# said:
#
#     $ brew list --versions ollama      ->  ollama 0.32.6
#     $ ollama --version                 ->  ollama version is 0.30.7
#                                            Warning: client version is 0.32.6
#
# The keg was correct and the daemon was still executing the old binary, because
# a keg swap does not restart launchd — the same defect family as the plist that
# was written and never re-read. So this preflight would have failed a converge
# that had just done exactly the right thing, and it would have failed BEFORE
# the LaunchAgent reload further down that fixes it.
#
# Two questions, two checks: the linked keg is switched to the pin when a
# newer keg stole the name, and the daemon is asserted AFTER the reload
# (is the estate running it).
# ONE READING, USED BY ALL THREE CHECKS BELOW — and it is the LINKED keg.
#
# `brew list --versions ollama` prints EVERY keg brew kept: on this host
# "ollama 0.32.6 0.32.7". Every check here used to substring-match the pin
# against that line, so a pin of 0.32.6 read as "installed" while
# /opt/homebrew/bin/ollama pointed at 0.32.7 — the pin gate stayed silent and
# the drift gate then failed the converge blaming the daemon. Measured live
# 2026-08-10 when exactly that happened.
#
# The linked keg is what `ollama` will EXEC, so it is the only one that can
# disagree with anything. Same rule as tools/estate-status.py: ask the thing
# that runs, not the thing that lists.
- name: "[Ollama] Resolve the LINKED ollama keg (not merely an installed one)"
  ansible.builtin.shell: |
    set -o pipefail
    bin=$(command -v ollama 2>/dev/null)
    [ -n "$bin" ] || exit 0
    python3 -c 'import os,sys;print(os.path.realpath(sys.argv[1]))' "$bin" 2>/dev/null \
      | sed -nE 's|.*/Cellar/[^/]+/([^/]+)/.*|\1|p'
  args:
    executable: /bin/bash
  register: _ollama_keg
  changed_when: false
  failed_when: false
  when: nos_pkg_manager == 'homebrew'

- name: "[Ollama] Read the version the running daemon reports"
  ansible.builtin.command: ollama --version
  register: _ollama_ver
  changed_when: false
  failed_when: false
  when: nos_pkg_manager == 'homebrew'

# THE PATTERN MATTERS AND THE FIRST ONE WAS WRONG (fixed 2026-08-09, same day).
# This grepped for the literal `shadows homebrew/core/ollama`. Brew actually
# prints, backticks and all:
#
#     Warning: `ollama` shadows `homebrew/core/ollama`.
#
# so it never matched, the diagnosis below never rendered, and the operator's
# converge told them to run `brew upgrade ollama` — which is a NO-OP precisely
# because the tap shadows core. The one task whose whole job was to explain the
# situation sent them in a circle instead. Match the word, not the punctuation.
- name: "[Ollama] Find any tap shadowing homebrew/core/ollama"
  ansible.builtin.shell: |
    set -o pipefail
    brew info ollama 2>&1 | grep -ci 'shadows' || true
  args:
    executable: /bin/bash
  register: _ollama_shadow
  changed_when: false
  failed_when: false
  when:
    - nos_pkg_manager == 'homebrew'
    - ollama_version | default('') | length > 0
    - (_ollama_keg.stdout | default('') | trim) not in ('', ollama_version)

# THE PIN DECIDES. `state: present` will not downgrade a keg brew already
# linked (operator `brew upgrade`, or a leftover from when this task was
# `latest`). p=11902: cellar still had 0.33.3, linked was 0.34.0, and the
# refusal told the operator to re-pin — the recorder failing for being out
# of date. If the pin keg is still in the cellar, link it. Advancing the
# pin is `tools/brew-pin-status.py` plus a commit, not a failed converge.
# `brew link ollama` always links the newest keg, so this uses Homebrew's
# Keg API on the pin prefix. brew-as-root is refused; this task is become
# false on purpose.
# A pin ABOVE the cellar was a dead end: the relink below prints "missing pin"
# and the refusal fails the run, so every advance so far needed someone to run
# `brew upgrade` by hand first (and `brew pin` blocks exactly that). When
# homebrew-core's stable IS the pin, land it here; when it is not, say so and
# let the refusal speak. Gate: test_ollama_pin_is_installed_not_assumed.py
- name: "[Ollama] Install the pin keg when the cellar lacks it"
  ansible.builtin.shell: |
    set -euo pipefail
    PIN="{{ ollama_version }}"
    [ -d "$(brew --cellar ollama)/${PIN}" ] && { echo "present ${PIN}"; exit 0; }
    brew update --quiet >/dev/null 2>&1 || true
    STABLE="$(brew info --json=v2 ollama | python3 -c 'import json,sys;print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"])')"
    if [ "${STABLE}" != "${PIN}" ]; then
      echo "unavailable pin=${PIN} core=${STABLE}"
      exit 0
    fi
    brew unpin ollama >/dev/null 2>&1 || true
    brew upgrade ollama
    brew pin ollama
    echo "installed ${PIN}"
  args:
    executable: /bin/bash
  register: _ollama_pin_install
  become: false
  changed_when: "'installed ' in (_ollama_pin_install.stdout | default(''))"
  when:
    - nos_pkg_manager == 'homebrew'
    - ollama_version | default('') | length > 0
    - (_ollama_keg.stdout | default('') | trim) != ollama_version
    - (_ollama_shadow.stdout | default('0') | trim | int) == 0

- name: "[Ollama] Link the pin keg when a newer keg stole the name"
  ansible.builtin.shell: |
    set -euo pipefail
    PIN="{{ ollama_version }}"
    CELLAR="$(brew --cellar ollama)"
    if [ ! -d "${CELLAR}/${PIN}" ]; then
      echo "missing pin=${PIN}"
      exit 0
    fi
    brew unlink ollama || true
    brew ruby -e '
      pin = ENV.fetch("HOMEBREW_OLLAMA_PIN")
      f = Formulary.factory("ollama")
      keg = f.installed_kegs.find { |k| k.version.to_s == pin }
      abort "no keg #{pin}" if keg.nil?
      f.installed_kegs.each { |k| k.unlink if k.linked? }
      keg.link(overwrite: true)
      puts "linked #{pin}"
    '
  args:
    executable: /bin/bash
  # `brew ruby` SCRUBS the environment — only HOMEBREW_*-prefixed vars reach the
  # subprocess. A plain OLLAMA_PIN vanished, ENV.fetch raised KeyError, the ruby
  # aborted printing nothing, changed_when stayed false, and this relink silently
  # no-op'd EVERY run — the drift never healed (root-caused 2026-09-19). Prefix
  # the var so it survives the scrub.
  environment:
    HOMEBREW_OLLAMA_PIN: "{{ ollama_version }}"
    HOMEBREW_NO_AUTO_UPDATE: "1"
  register: _ollama_relink
  become: false
  changed_when: "'linked ' in (_ollama_relink.stdout | default(''))"
  failed_when: false
  when:
    - nos_pkg_manager == 'homebrew'
    - ollama_version | default('') | length > 0
    # Fire on ANY linked keg that is not the pin — INCLUDING '' (nothing linked),
    # so a host left unlinked (e.g. a half-done manual brew fix) self-heals here
    # instead of needing a manual `brew link`.
    - (_ollama_keg.stdout | default('') | trim) != ollama_version

# MUST NOT register `_ollama_keg`. A skipped task still replaces the
# registered result; p=14457 wiped a coherent 0.34.0 keg, then the drift
# gate refused `keg=` vs daemon 0.34.0. Ansible, not brew.
- name: "[Ollama] Re-resolve the LINKED keg after switching to the pin"
  ansible.builtin.shell: |
    set -o pipefail
    bin=$(command -v ollama 2>/dev/null)
    [ -n "$bin" ] || exit 0
    python3 -c 'import os,sys;print(os.path.realpath(sys.argv[1]))' "$bin" 2>/dev/null \
      | sed -nE 's|.*/Cellar/[^/]+/([^/]+)/.*|\1|p'
  args:
    executable: /bin/bash
  register: _ollama_keg_after_link
  become: false
  changed_when: false
  failed_when: false
  when:
    - nos_pkg_manager == 'homebrew'
    - "('linked ' in (_ollama_relink.stdout | default(''))) or ('installed ' in (_ollama_pin_install.stdout | default('')))"

- name: "[Ollama] Remember the linked keg after an optional pin switch"
  ansible.builtin.set_fact:
    # An EXECUTED result carries no `skipped` key, so `.skipped | default(true)`
    # read every re-resolve as skipped and the stale pre-install keg won: the
    # 0.35.0 adopt (2026-09-30) was refused while 0.35.0 was the linked keg.
    ollama_linked_keg: "{{ (_ollama_keg_after_link.stdout | default('') | trim) if ((_ollama_keg_after_link.skipped | default(false)) is false and (_ollama_keg_after_link.stdout | default('') | trim) | length > 0) else (_ollama_keg.stdout | default('') | trim) }}"
  when: nos_pkg_manager == 'homebrew'

# DETERMINISM: the version record + gate above only DETECT drift. Without a brew
# pin, any `brew upgrade` (manual, or pulled in as another formula's dependency)
# silently moves the ollama keg — which is exactly how 0.34.2 landed on top of
# the 0.34.0 pin. `brew pin` is Homebrew's own lock; it stops `brew upgrade` from
# wandering off the pinned version. The record stays the source of truth; this
# just keeps brew from contradicting it behind our backs. become:false —
# brew-as-root is refused.
- name: "[Ollama] Pin the formula in brew so an upgrade can't move the keg"
  ansible.builtin.command: brew pin ollama
  register: _ollama_brew_pin
  become: false
  changed_when: "'already pinned' not in (_ollama_brew_pin.stderr | default(''))"
  failed_when: false
  when:
    - nos_pkg_manager == 'homebrew'
    - ollama_version | default('') | length > 0

- name: "[Ollama] Refuse when the INSTALLED keg is not the pin"
  ansible.builtin.fail:
    msg: |
      the LINKED ollama keg is not the pinned {{ ollama_version }}.
        linked keg: {{ ollama_linked_keg | default('(none)') }}
        daemon: {{ _ollama_ver.stdout | default('(none)') | trim }}
      {% if (_ollama_shadow.stdout | default('0') | trim | int) > 0 %}
        CAUSE: a third-party tap outranks homebrew/core for the name `ollama`,
        so brew lands that tap's keg and `brew upgrade ollama` is a NO-OP.
        Check `brew tap`.
        Fix (one operator action — models in {{ ollama_models_dir }} survive it):
          brew uninstall ollama && brew untap pazny/local && brew install ollama
      {% elif _ollama_shadow.rc | default(1) != 0 %}
        The shadow probe did not run, so this cannot tell a stale formula from a
        shadowing tap. Check `brew info ollama` for a "shadows" warning BEFORE
        assuming the pin keg can be linked from homebrew/core.
      {% else %}
        The pin keg was not linkable (gone from the cellar, or brew ruby
        failed). Restore {{ ollama_version }}; do not bump the record to
        follow brew. Ask `tools/brew-pin-status.py` before advancing
        ollama_version — that advance is a commit, not a failed run.
      {% endif %}
  when:
    - nos_pkg_manager == 'homebrew'
    - ollama_version | default('') | length > 0
    - (ollama_linked_keg | default('') | trim) not in ('', ollama_version)
    # A FIRST INSTALL IS NOT DRIFT: on a clean host the keg above the record is
    # the only thing that could have happened, and the pin keg is not in the
    # cellar yet. The refusal is for a keg that moved while this playbook
    # installed nothing. `state: present` reports changed only on that first
    # install — the module's own result is the signal, not a marker this task
    # writes about itself.
    - not (_ollama_install.changed | default(false))

# The half the refusal above deliberately does not cover. Loud, and it does not
# stop the run: the operator cannot act on it mid-converge and a from-zero
# install must be able to finish.
- name: "[Ollama] First install landed a version the record does not name"
  ansible.builtin.debug:
    msg: |
      ollama was installed fresh at {{ ollama_linked_keg | default('(none)') }},
      and default.config.yml records {{ ollama_version }}. That is not drift —
      brew had one version to give. RECORD IT: set ollama_version to the keg
      above and commit, so the next run has something to refuse against.
      Ask `tools/brew-pin-status.py` how old that version is before adopting it
      anywhere else.
  when:
    - nos_pkg_manager == 'homebrew'
    - ollama_version | default('') | length > 0
    - (ollama_linked_keg | default('') | trim) not in ('', ollama_version)
    - _ollama_install.changed | default(false)

- name: "[Ollama] Ensure models directory exists (persistent across --blank)"
  ansible.builtin.file:
    path: "{{ ollama_models_dir }}"
    state: directory
    mode: '0755'

- name: "[Ollama] Set launchd env vars (models path + memory + KV cache)"
  ansible.builtin.command: "launchctl setenv {{ item.key }} {{ item.value }}"
  loop:
    - { key: "OLLAMA_MODELS", value: "{{ ollama_models_dir }}" }
    - { key: "OLLAMA_MAX_LOADED_MODELS", value: "{{ ollama_max_loaded_models | default(1) }}" }
    - { key: "OLLAMA_NUM_PARALLEL", value: "{{ ollama_num_parallel | default(2) }}" }
    - { key: "OLLAMA_KEEP_ALIVE", value: "{{ ollama_keep_alive | default('5m') }}" }
    - { key: "OLLAMA_FLASH_ATTENTION", value: "{{ ollama_flash_attention | default(1) }}" }
    - { key: "OLLAMA_KV_CACHE_TYPE", value: "{{ ollama_kv_cache_type | default('q8_0') }}" }
    - { key: "OLLAMA_CONTEXT_LENGTH", value: "{{ ollama_context_length | default(32768) | string }}" }
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  changed_when: false
  when: nos_service_manager == 'launchd'

- name: "[Ollama] Stop OpenClaw gateway (holds persistent Ollama connection)"
  ansible.builtin.command: pkill -f 'openclaw-gateway'
  changed_when: false
  failed_when: false

# -- Ollama persistent LaunchAgent (replaces brew-managed plist) ─────────────
# Brew's homebrew.mxcl.ollama.plist HAS NO env vars, so OLLAMA_MODELS
# would be lost after reboot/logout. Our wrapper plist has EnvironmentVariables
# directly in the dict that launchd injects on every start.

- name: "[Ollama] Disable brew-managed Ollama service (replaced by user LaunchAgent)"
  ansible.builtin.shell: |
    # Stop brew service (gracefully via launchctl, not `brew services stop`)
    for plist in "$HOME/Library/LaunchAgents/homebrew.mxcl.ollama.plist" "$HOME/Library/LaunchAgents/sh.brew.ollama.plist"; do
      if [ -f "$plist" ]; then     # Homebrew 7 names it sh.brew.ollama
        launchctl unload "$plist" 2>/dev/null || true
        mv "$plist" "$plist.disabled" 2>/dev/null || true   # kept, in case it is wanted back
      fi
    done
    # Kill any running instance (brew or our own wrapper)
    launchctl unload "$HOME/Library/LaunchAgents/{{ ollama_launchd_label }}.plist" 2>/dev/null || true
    pkill -f 'ollama serve' 2>/dev/null || true
    sleep 1
    echo "DONE"
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: nos_service_manager == 'launchd'

- name: "[Ollama] Wait for port 11434 to be free"
  ansible.builtin.wait_for:
    port: 11434
    state: stopped
    timeout: 15
  failed_when: false

- name: "[Ollama] Deploy persistent user LaunchAgent (ollama)"
  ansible.builtin.template:
    src: ollama-agent.plist.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ ollama_launchd_label }}.plist"
    mode: '0644'
  when: nos_service_manager == 'launchd'

- name: "[Ollama] Load user LaunchAgent (ollama)"
  ansible.builtin.command: >
    launchctl load "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ ollama_launchd_label }}.plist"
  register: ollama_svc
  changed_when: true
  failed_when: >
    ollama_svc.rc != 0 and
    'already loaded' not in (ollama_svc.stderr | default(''))
  when: nos_service_manager == 'launchd'

- name: "[Ollama] Wait for Ollama process to start"
  ansible.builtin.shell: |
    for i in $(seq 1 15); do
      pgrep -f 'ollama serve' > /dev/null 2>&1 && exit 0
      sleep 1
    done
    exit 1
  changed_when: false
  failed_when: false

- name: "[Ollama] Wait for API to respond"
  ansible.builtin.uri:
    url: "http://127.0.0.1:11434/api/version"
    status_code: [200]
    timeout: 5
  register: _ollama_api
  # Cold blank=true freshly restarts Ollama, which can take well over 20s to
  # bind on macOS — the old 10x2s gave up and the subsequent `ollama pull` could
  # race a not-yet-ready Ollama (failed_when:false → silent missing model).
  # 30x5s (~2.5min) blocks until it actually serves. Stays failed_when:false so
  # a genuinely-down Ollama doesn't abort the (Ollama-independent) core platform.
  retries: 30
  delay: 5
  until: _ollama_api.status | default(0) == 200
  failed_when: false

# RESTART ON DRIFT, BECAUSE `launchctl load` IS NOT A RESTART (2026-08-09).
#
# A keg swap replaces the binary on disk and leaves the running daemon executing
# the old one; `launchctl load` above answers "already loaded" and changes
# nothing. Measured the moment the operator moved off the shadowing tap:
#
#     brew list --versions ollama  ->  ollama 0.32.6
#     ollama --version             ->  ollama version is 0.30.7
#                                      Warning: client version is 0.32.6
#
# The client is new, the SERVER is old, and every consumer — hermes, openclaw,
# KEAP embeddings, face ask — keeps talking to 0.30.7. That is the same defect
# as the launchd plist that was written and never re-read
# (roles/pazny.wing/tasks/main.yml), and it wants the same answer: compare what
# is running against what is installed, and reload on the DIFFERENCE rather than
# on having just written something.
# THE KEG IS THE LINKED ONE, NOT THE FIRST ONE LISTED. `brew list --versions`
# prints EVERY keg it kept — on this host "ollama 0.32.6 0.32.7" — so the old
# `awk '{print $2}'` returned 0.32.6 while /opt/homebrew/bin/ollama pointed at
# 0.32.7. Measured 2026-08-10, live, when this very gate failed a converge: it
# reported drift, ran a reload that could change nothing, and then refused,
# because the number it called "the keg" was a keg nobody was running.
#
# Resolving the symlink asks what will actually EXEC, which is the same rule
# tools/estate-status.py is built on: the port and the binary beat the manifest.
- name: "[Ollama] Compare the running daemon against the installed keg"
  ansible.builtin.shell: |
    set -o pipefail
    keg="{{ ollama_linked_keg | default('') }}"
    srv=$(ollama --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
    if [ -z "$keg" ]; then
      echo "unread keg srv=${srv:-none}"
    elif [ "$keg" = "$srv" ]; then
      echo "same keg=$keg"
    else
      echo "drift keg=$keg srv=$srv"
    fi
  args:
    executable: /bin/bash
  register: _ollama_drift
  changed_when: false
  failed_when: false
  when: nos_service_manager == 'launchd'

- name: "[Ollama] Reload the daemon so it execs the installed binary"
  ansible.builtin.shell: |
    set -o pipefail
    L="{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ ollama_launchd_label }}.plist"
    launchctl bootout "gui/$(id -u)/{{ ollama_launchd_label }}" 2>/dev/null || true
    sleep 2
    launchctl bootstrap "gui/$(id -u)" "$L" || echo "BOOTSTRAP-FAILED rc=$?"
  args:
    executable: /bin/bash
  changed_when: true
  failed_when: false
  when:
    - nos_service_manager == 'launchd'
    - "'drift' in (_ollama_drift.stdout | default(''))"

# Re-measure the SAME comparison after the reload, not a different one. The
# first draft waited for the daemon to report `ollama_version` — the PIN — so on
# a host where brew had moved past the pin it looped fifteen times, timed out,
# and handed the refusal a string that could never match. What the reload was
# supposed to fix is keg-vs-daemon, so that is what gets re-read.
- name: "[Ollama] Re-compare keg and daemon after the reload"
  ansible.builtin.shell: |
    set -o pipefail
    keg="{{ ollama_linked_keg | default('') }}"
    if [ -z "$keg" ]; then
      srv=$(ollama --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
      echo "unread keg srv=${srv:-none}"
      exit 0
    fi
    for i in $(seq 1 15); do
      srv=$(ollama --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
      if [ "$keg" = "$srv" ]; then echo "same keg=$keg"; exit 0; fi
      sleep 2
    done
    echo "drift keg=$keg srv=${srv:-none}"
  args:
    executable: /bin/bash
  register: _ollama_drift_after
  changed_when: false
  failed_when: false
  when:
    - nos_pkg_manager == 'homebrew'
    - "'drift' in (_ollama_drift.stdout | default(''))"

- name: "[Ollama] Read the daemon version for the messages below"
  ansible.builtin.command: ollama --version
  register: _ollama_ver_after
  changed_when: false
  failed_when: false
  when: nos_pkg_manager == 'homebrew'

# THREE FAULTS, THREE MESSAGES. The first draft of this gate had one message for
# all of them and it named none: it printed `ollama_version` — THE PIN — under
# the words "the installed keg", then blamed the daemon for "still talking to
# the old binary". On 2026-08-10 that failed a converge in which nothing was
# wrong except the pin: brew had upgraded 0.32.6 -> 0.32.7 mid-run (`state:
# latest`), keg and daemon agreed at 0.32.7, and the daemon was NEWER than the
# number the message called the keg. A refusal that misnames the fault sends the
# operator to `launchctl bootout` for a launchd problem that does not exist.
- name: "[Ollama] Refuse — the daemon is not running the keg that is installed"
  ansible.builtin.fail:
    msg: |
      the linked keg and the running daemon disagree, so every consumer —
      hermes, openclaw, KEAP embeddings, face ask — is talking to the wrong one.
        {{ _ollama_drift.stdout | default('(not measured)') | trim }}
        daemon now: {{ _ollama_ver_after.stdout | default('(none)') | trim }}
      The reload above should have fixed it. By hand:
        launchctl bootout gui/$(id -u)/{{ ollama_launchd_label }}
        launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/{{ ollama_launchd_label }}.plist
  when:
    - nos_service_manager == 'launchd'
    - "'drift' in (_ollama_drift.stdout | default(''))"
    - "'drift' in (_ollama_drift_after.stdout | default(_ollama_drift.stdout | default('')))"

# Loud leftover: the pin-switch above ran, or first-install landed a keg
# the record does not name, and the daemon still does not report the pin.
# Do not tell the operator to bump the record — the pin decides.
- name: "[Ollama] Report — brew installed a version the pin does not name"
  ansible.builtin.debug:
    msg: |
      ollama_version is {{ ollama_version }} but the daemon reports
      {{ _ollama_ver_after.stdout | default('?') | trim }}
      (linked keg {{ ollama_linked_keg | default('?') }}).
      The pin decides; do not edit the record to follow brew. If the pin
      keg is missing, restore it. Advancing the pin is
      `tools/brew-pin-status.py` plus a commit.
  when:
    - nos_pkg_manager == 'homebrew'
    - ollama_version | default('') | length > 0
    - ollama_version not in (_ollama_ver_after.stdout | default(''))

# ── The tier models the config names (ollama_pull_models) ────────────────────
# A job bound to a tier runs against the id the config names, so the id must be
# on the host. Skipped when present; a failed pull is not fatal HERE — the
# verify play (tools/job_readiness.py --verify) fails on a configured model the
# host still lacks after the converge.
- name: "[Ollama] Which models the host already holds"
  ansible.builtin.command: ollama list
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] | default('', true) }}"
    OLLAMA_HOST: "http://127.0.0.1:11434"
  register: _ollama_have
  changed_when: false
  failed_when: false
  check_mode: false
  when: ollama_pull_models | length > 0

- name: "[Ollama] Pull a configured tier model the host lacks"
  ansible.builtin.command: "ollama pull {{ item }}"
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] | default('', true) }}"
    OLLAMA_MODELS: "{{ ollama_models_dir }}"
    OLLAMA_HOST: "http://127.0.0.1:11434"
  loop: "{{ ollama_pull_models | reject('in', _have) | reject('in', _have | map('regex_replace', ':latest$', '')) | list }}"
  loop_control:
    label: "{{ item }}"
  vars:
    _have: "{{ (_ollama_have.stdout_lines | default([]))[1:] | map('regex_replace', '\\s.*$', '') | list }}"
  register: _ollama_pulled
  changed_when: _ollama_pulled.rc == 0
  failed_when: false
  timeout: 3600
  when: ollama_pull_models | length > 0
