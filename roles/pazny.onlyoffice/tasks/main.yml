---
# ==============================================================================
# pazny.onlyoffice/tasks/main.yml
#
# Called from tasks/stacks/stack-up.yml BEFORE `docker compose up b2b`:
#  - creates 4 data dirs (data, logs, lib, embedded postgres db)
#  - renders the compose override fragment do
#    {{ stacks_dir }}/b2b/overrides/onlyoffice.yml, which stack-up.yml collects
#    via `find` and passes as an additional -f flag.
#
# ONLYOFFICE CE uses an EMBEDDED postgres (inside the container) — it does not require
# external DB. Redis is optionally shared with the infra stack over the network.
# ==============================================================================

- name: "[pazny.onlyoffice] Ensure data directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ onlyoffice_data_dir }}"
    - "{{ onlyoffice_logs_dir }}"
    - "{{ onlyoffice_lib_dir }}"
    - "{{ onlyoffice_db_dir }}"

# ── Euro-office blank-safe DB seed ───────────────────────────────────────────
# The euro-office image bakes its postgres cluster into the image layers and
# its entrypoint does NOT initdb an empty PGDATA. A fresh / blank-wiped db_dir
# (empty bind mount) shadows the baked cluster, so the container restart-loops
# on "16/main not accessible" and a blank fails at the b2b health-wait. The
# stock onlyoffice image DOES initdb an empty dir, so seed ONLY for euro-office
# and ONLY when the dir is fresh. Idempotent: skipped once the cluster exists.
- name: "[pazny.onlyoffice] Detect a fresh (empty) embedded-postgres dir"
  ansible.builtin.find:
    paths: "{{ onlyoffice_db_dir }}"
    file_type: any
  register: _oo_db_contents
  when: onlyoffice_image | default('onlyoffice/documentserver') is search('euro-office')
  changed_when: false

- name: "[pazny.onlyoffice] Seed euro-office postgres cluster from the image (blank-safe)"
  ansible.builtin.command:
    argv:
      - "{{ docker_bin }}"
      - run
      - "--rm"
      - "--entrypoint"
      - sh
      - "-v"
      - "{{ onlyoffice_db_dir }}:/seed-target"
      - "{{ onlyoffice_image | default('onlyoffice/documentserver') }}:{{ onlyoffice_version | default('latest') }}"
      - "-c"
      - "cp -a /var/lib/postgresql/. /seed-target/"
  register: _oo_seed
  when:
    - onlyoffice_image | default('onlyoffice/documentserver') is search('euro-office')
    - (_oo_db_contents.matched | default(0)) == 0
  changed_when: _oo_seed.rc == 0

- name: "[pazny.onlyoffice] Render compose override fragment"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/b2b/overrides/onlyoffice.yml"
    mode: '0600'
  notify: Restart onlyoffice

- name: "[pazny.onlyoffice] Print info"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════
       ONLYOFFICE Document Server (spousti se pres B2B stack)
      ══════════════════════════════════════════════════════
       URL:         https://{{ onlyoffice_domain }}
       Healthcheck: https://{{ onlyoffice_domain }}/healthcheck
       API:         https://{{ onlyoffice_domain }}/ConvertService.ashx
       Data:        {{ onlyoffice_data_dir }}

       Integrace s hostitelskymi aplikacemi (Nextcloud, Outline, BookStack):
         Document Server URL: https://{{ onlyoffice_domain }}/
         JWT secret:          <viz credentials.yml → onlyoffice_jwt_secret>
      ══════════════════════════════════════════════════════
