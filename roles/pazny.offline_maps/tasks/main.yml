---
# ==============================================================================
# pazny.offline_maps/tasks/main.yml
#
# Called from tasks/stacks/stack-up.yml BEFORE `docker compose -p iiab up`.
# Builds the base map once (Planetiler, OSM extract for `maps_region`) into the
# artifact cache, which no removal level touches, fetches fonts + sprites next
# to it, copies the vendored style into the data dir and renders config.json.
# Nothing here hides a failure: a map that does not arrive fails the play.
# ==============================================================================

- name: "[pazny.offline_maps] Ensure data and cache directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ maps_data_dir }}"
    - "{{ maps_data_dir }}/styles"
    - "{{ maps_cache_dir }}"
    - "{{ maps_cache_dir }}/planetiler"
    - "{{ maps_cache_dir }}/sprites"

# One-shot, creates-if-missing. Sources (~2.4 GB for CZ) stay under
# planetiler/data/sources so a rebuild for a new region re-uses the shared ones.
- name: "[pazny.offline_maps] Build {{ maps_region }} base map with Planetiler (once)"
  ansible.builtin.command:
    argv:
      - "{{ docker_bin | default('docker') }}"
      - run
      - --rm
      - -v
      - "{{ maps_cache_dir }}/planetiler:/data"
      - -e
      - "JAVA_TOOL_OPTIONS={{ maps_planetiler_java_opts }}"
      - "ghcr.io/onthegomap/planetiler:{{ maps_planetiler_version }}"
      - --download
      - "--area={{ maps_region }}"
      - "--languages={{ maps_languages }}"
      - "--output=/data/{{ maps_region }}.pmtiles"
    creates: "{{ maps_cache_dir }}/planetiler/{{ maps_region }}.pmtiles"

- name: "[pazny.offline_maps] Fetch OpenFreeMap glyphs archive (once)"
  ansible.builtin.get_url:
    url: "{{ maps_fonts_url }}"
    dest: "{{ maps_cache_dir }}/ofm-fonts.tar.gz"
    mode: '0644'
    timeout: 600

- name: "[pazny.offline_maps] Unpack glyphs to {{ maps_cache_dir }}/fonts"
  ansible.builtin.unarchive:
    src: "{{ maps_cache_dir }}/ofm-fonts.tar.gz"
    dest: "{{ maps_cache_dir }}"
    remote_src: true
    creates: "{{ maps_cache_dir }}/ofm/Noto Sans Regular"

- name: "[pazny.offline_maps] Expose glyphs under the path the config names"
  ansible.builtin.file:
    src: "{{ maps_cache_dir }}/ofm"
    dest: "{{ maps_cache_dir }}/fonts"
    state: link

- name: "[pazny.offline_maps] Fetch OpenFreeMap sprites"
  ansible.builtin.get_url:
    url: "{{ maps_sprites_url }}/ofm{{ item }}"
    dest: "{{ maps_cache_dir }}/sprites/ofm{{ item }}"
    mode: '0644'
  loop: [".json", ".png", "@2x.json", "@2x.png"]

- name: "[pazny.offline_maps] Install vendored style(s)"
  ansible.builtin.copy:
    src: "styles/"
    dest: "{{ maps_data_dir }}/styles/"
    mode: '0644'
  notify: Restart offline_maps

- name: "[pazny.offline_maps] Download operator-listed tile archives"
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ maps_data_dir }}/{{ item.dest }}"
    mode: '0644'
    timeout: 3600
  loop: "{{ maps_mbtiles_files | default([]) }}"

- name: "[pazny.offline_maps] Find operator tile archives in {{ maps_data_dir }}"
  ansible.builtin.find:
    paths: "{{ maps_data_dir }}"
    patterns: ["*.pmtiles", "*.mbtiles"]
  register: _maps_found

- name: "[pazny.offline_maps] Render tileserver-gl config.json"
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ maps_data_dir }}/config.json"
    mode: '0644'
  vars:
    _maps_extra_files: "{{ _maps_found.files | map(attribute='path') | map('basename') | sort }}"
  notify: Restart offline_maps

# Linux routes via Traefik; host-nginx per-service vhosts are macOS-only.
- name: "[pazny.offline_maps] Deploy nginx reverse proxy vhost"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/nginx/sites-available/maps.conf"
    dest: "{{ homebrew_prefix }}/etc/nginx/sites-available/maps.conf"
    mode: '0644'
  notify: Restart nginx
  when:
    - install_nginx | default(true)
    - ansible_os_family == 'Darwin'

- name: "[pazny.offline_maps] Enable nginx vhost (symlink)"
  ansible.builtin.file:
    src: "{{ homebrew_prefix }}/etc/nginx/sites-available/maps.conf"
    dest: "{{ homebrew_prefix }}/etc/nginx/sites-enabled/maps.conf"
    state: link
    force: true
  notify: Restart nginx
  when:
    - install_nginx | default(true)
    - ansible_os_family == 'Darwin'

- name: "[pazny.offline_maps] Render compose override fragment"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/iiab/overrides/tileserver.yml"
    mode: '0600'
  notify: Restart offline_maps
