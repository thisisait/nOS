---
# ==============================================================================
# pazny.bone — local FastAPI organ (host launchd, Anatomy A3a 2026-05-03).
#
# History:
#   pre-2026-04-26 — host launchd Python daemon
#   2026-04-26 (Track A) — containerized in the infra compose stack
#   2026-05-03 (Anatomy A3a) — REVERSED back to host launchd, mirroring the
#     pulse role from A4. This eliminates the bundled-ansible-core debt
#     (Bone now uses the operator's pyenv ansible directly) and allows
#     direct loopback API access for Pulse + future host-mode Wing.
#
# Source tree: files/anatomy/bone/  (moved from files/bone/ in this commit)
# Runtime tree: ~/bone/{venv,state,log}
#
# This file ALSO does the one-shot container teardown for ops upgrading
# from the Track A shape — see "Track-A reversal cleanup" block.
# ==============================================================================

- name: "[pazny.bone] Skip when install_bone: false"
  ansible.builtin.meta: end_play
  when: not (install_bone | default(true))   # stock-Jinja: meta: when: is filter-less on 2.20.6

# ── Track-A reversal cleanup ─────────────────────────────────────────────────
# Stop + remove the bone container if it exists from a prior (Track A) run.
# Idempotent: when no container exists (fresh install), all four steps no-op.
# The compose-override fragment is also removed so the next `docker compose
# up infra` doesn't try to recreate the container.

- name: "[pazny.bone] Track-A reversal — check if legacy bone container exists"
  ansible.builtin.shell: |
    {{ docker_bin | default('/usr/local/bin/docker') }} ps -a --filter "name=^bone$" --format "{{ '{{' }}.Names{{ '}}' }}"
  register: _bone_container_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: "[pazny.bone] Track-A reversal — stop + remove legacy container"
  ansible.builtin.shell: |
    {{ docker_bin | default('/usr/local/bin/docker') }} compose -p infra stop bone 2>/dev/null || true
    {{ docker_bin | default('/usr/local/bin/docker') }} compose -p infra rm -f bone 2>/dev/null || true
    {{ docker_bin | default('/usr/local/bin/docker') }} rm -f bone 2>/dev/null || true
  when: _bone_container_check.stdout | default('') | trim == 'bone'
  changed_when: true

- name: "[pazny.bone] Track-A reversal — remove stale compose override"
  ansible.builtin.file:
    path: "{{ stacks_dir }}/infra/overrides/bone.yml"
    state: absent

# ── Runtime directories ──────────────────────────────────────────────────────

- name: "[pazny.bone] Ensure runtime directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ bone_runtime_dir }}"
    - "{{ bone_log_dir }}"
    - "{{ bone_state_dir }}"
    - "{{ bone_registry_dir }}"
    - "{{ bone_wing_db_dir }}"

# ── Service-registry placeholder (unchanged from container era) ──────────────

- name: "[pazny.bone] Stat service-registry.json"
  ansible.builtin.stat:
    path: "{{ bone_registry_dir }}/service-registry.json"
  register: _bone_registry_stat

- name: "[pazny.bone] Seed empty service-registry.json placeholder"
  ansible.builtin.copy:
    dest: "{{ bone_registry_dir }}/service-registry.json"
    content: "{{ {'services': []} | to_nice_json }}\n"
    mode: '0644'
    force: false  # never overwrite a real registry
  when: not _bone_registry_stat.stat.exists

# ── Python venv + source sync ────────────────────────────────────────────────

- name: "[pazny.bone] Create Python venv"
  ansible.builtin.command:
    cmd: "{{ bone_python }} -m venv {{ bone_venv }}"
    creates: "{{ bone_venv }}/bin/python"

- name: "[pazny.bone] Install bone deps into venv"
  # NB: we shell out to the venv's own pip rather than using
  # ansible.builtin.pip. The pip module imports `packaging` from the
  # controller-side interpreter (Homebrew Python 3.14 here), which is
  # PEP 668 externally-managed on macOS — no clean way to inject the
  # package without `--break-system-packages`. Using the venv's pip
  # directly sidesteps the controller dependency entirely; idempotence
  # comes from pip itself ("Requirement already satisfied" exits 0).
  ansible.builtin.command:
    cmd: "{{ bone_venv }}/bin/pip install --quiet --disable-pip-version-check -r {{ playbook_dir }}/files/anatomy/bone/requirements.txt"
  register: _bone_pip
  changed_when: _bone_pip.stdout | trim != ""

- name: "[pazny.bone] Sync Bone source to runtime dir"
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/files/anatomy/bone/"
    dest: "{{ bone_runtime_dir }}/"
    delete: false
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=.pytest_cache"
      - "--exclude=Dockerfile"        # not needed at runtime in host mode
  notify: Restart bone

# ── Service manager: launchd (macOS) | systemd --user (Linux) ─────────────────
# Anatomy A3a put Bone on host launchd. The Linux sibling (2026-05-25 pilot)
# renders a systemd --user unit via pazny.linux.systemd_user::ensure_unit. Both
# branches gate on nos_service_manager (tasks/_platform.yml); the env dict below
# mirrors bone.plist.j2 — keep the two in sync until they share one source.

# ---- macOS: launchd ----
- name: "[pazny.bone] Render launchd plist"
  ansible.builtin.template:
    src: bone.plist.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ bone_launchd_label }}.plist"
    # 0600: plist embeds BONE_SECRET (HMAC seed for every API call) +
    # WING_API_TOKEN. Same threat model as the Wing plist — peer
    # processes / backup agents must not be able to read these.
    mode: '0600'
  notify: Restart bone
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[pazny.bone] Bootstrap launchd job (idempotent)"
  ansible.builtin.shell: |
    set -e
    PLIST=~/Library/LaunchAgents/{{ bone_launchd_label }}.plist
    UID_NUM=$(id -u)
    if launchctl print "gui/${UID_NUM}/{{ bone_launchd_label }}" >/dev/null 2>&1; then
      echo "already-loaded"
    else
      launchctl bootstrap gui/${UID_NUM} "$PLIST"
      echo "bootstrapped"
    fi
  register: _bone_bootstrap
  changed_when: "'bootstrapped' in _bone_bootstrap.stdout"
  when: (nos_service_manager | default('launchd')) == 'launchd'

# ── Self-heal canary (handler-independent) ───────────────────────────────────
# Handlers flush only at end-of-play. A run that CHANGED the plist/source but
# FAILED before flush (e.g. the tofu destroy-guard) leaves Bone on stale code or
# a stale cached env; the next idempotent run sees no change → never re-notifies
# → Bone keeps running old code (live 2026-07-18: VFS routes 404 / BONE_VFS_TOKEN
# unset after a green run). The bootstrap task above only loads-if-absent, so it
# doesn't help a loaded-but-stale job. This canary probes a route only the CURRENT
# Bone serves and forces a full reload (bootout+bootstrap re-reads the plist env)
# on ANY non-200 — 404 (route missing), 503 (env unloaded), 403 (token rotated),
# or unreachable. Gated on install_face (the VFS surface it checks).
- name: "[pazny.bone] Canary — is the running Bone current (VFS route + env live)?"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ bone_port | default(8099) }}/api/v1/vfs/list?uid=_canary&path=documents"
    method: GET
    headers:
      Authorization: "Bearer {{ face_vfs_token }}"
    status_code: [200]
  register: _bone_canary
  failed_when: false
  changed_when: false
  no_log: true   # Bearer face_vfs_token in header
  when:
    - (nos_service_manager | default('launchd')) == 'launchd'
    - install_face | default(false) | bool

- name: "[pazny.bone] Reload Bone when the canary shows stale code/env"
  ansible.builtin.shell: |
    LABEL="{{ bone_launchd_label }}"; UID_NUM=$(id -u)
    launchctl bootout "gui/${UID_NUM}/${LABEL}" 2>/dev/null || true
    sleep 1
    launchctl bootstrap "gui/${UID_NUM}" "$HOME/Library/LaunchAgents/${LABEL}.plist"
  register: _bone_stale_reload
  changed_when: true
  when:
    - (nos_service_manager | default('launchd')) == 'launchd'
    - install_face | default(false) | bool
    - (_bone_canary.status | default(0)) != 200

- name: "[pazny.bone] Wait for Bone to recover after a stale-reload"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ bone_port | default(8099) }}/api/health"
    status_code: [200]
  register: _bone_recover
  retries: 15
  delay: 2
  until: _bone_recover.status == 200
  changed_when: false
  when:
    - _bone_stale_reload is defined
    - _bone_stale_reload is changed

# ---- Linux: systemd --user (env mirrors bone.plist.j2 EnvironmentVariables) ----
- name: "[pazny.bone] (Linux) Build systemd --user environment"
  ansible.builtin.set_fact:
    _bone_systemd_env: >-
      {{
        {
          'HOME': ansible_facts['env']['HOME'],
          'PATH': bone_venv ~ '/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin',
          'WING_EVENTS_HMAC_SECRET': wing_events_hmac_secret | default(bone_secret | default('')),
          'INSTANCE_NAME': instance_name | default('nos'),
          'INSTANCE_TLD': tenant_domain | default('dev.local'),
          'PLAYBOOK_DIR': playbook_dir,
          'STATE_DIR': bone_state_dir,
          'SERVICE_REGISTRY_PATH': bone_registry_dir ~ '/service-registry.json',
          'WING_DB_DIR': bone_wing_db_dir,
          'WING_DB_PATH': bone_wing_db_dir ~ '/wing.db',
          'QDRANT_URL': (qdrant_url | default('http://127.0.0.1:' ~ (qdrant_port | default(6333) | string)) if (install_qdrant | default(false)) else ''),
          'QDRANT_API_KEY': qdrant_api_key | default(''),
          'BONE_REQUIRE_JWT_AUTH': (install_authentik | default(false)) | ternary('1', '0'),
        } | combine(
          {
            'AUTHENTIK_OIDC_ISSUER': authentik_oidc_issuer | default('https://' ~ (authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local')))) ~ '/'),
            'AUTHENTIK_JWKS_URL': bone_jwks_url | default('https://' ~ (authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local')))) ~ '/application/o/nos-state-manager/jwks/'),
          } if (install_authentik | default(false)) else {}
        )
      }}
  when: (nos_service_manager | default('launchd')) == 'systemd-user'

- name: "[pazny.bone] (Linux) Install systemd --user service"
  ansible.builtin.include_role:
    name: pazny.linux.systemd_user
    tasks_from: ensure_unit
  vars:
    su_name: "{{ bone_launchd_label }}"
    su_description: "nOS Bone — local FastAPI bridge (Ansible ↔ Wing)"
    su_exec_start: "{{ bone_venv }}/bin/uvicorn main:app --host 127.0.0.1 --port {{ bone_port }}"
    su_working_dir: "{{ bone_runtime_dir }}"
    su_environment: "{{ _bone_systemd_env }}"
  when: (nos_service_manager | default('launchd')) == 'systemd-user'

# ── Setup summary ────────────────────────────────────────────────────────────

- name: "[pazny.bone] Setup summary"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════════════════
       Bone — local FastAPI (host launchd, Anatomy A3a) ready
      ══════════════════════════════════════════════════════════════════
       Label:        {{ bone_launchd_label }}
       Source:       {{ playbook_dir }}/files/anatomy/bone/
       Runtime:      {{ bone_runtime_dir }}/
       Venv:         {{ bone_venv }}
       Logs:         {{ bone_log_dir }}/{bone.log,launchd.{out,err}.log}
       Listening:    127.0.0.1:{{ bone_port }}  (loopback only)
       Health:       http://127.0.0.1:{{ bone_port }}/api/health
       URL via TLS:  https://{{ bone_domain }}  (Traefik file-provider →
                     host.docker.internal:{{ bone_port }})

       Status:       launchctl print gui/$(id -u)/{{ bone_launchd_label }}
       Reload:       launchctl kickstart -k gui/$(id -u)/{{ bone_launchd_label }}
       Tail logs:    tail -f {{ bone_log_dir }}/bone.log
      ══════════════════════════════════════════════════════════════════
