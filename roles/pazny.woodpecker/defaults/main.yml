---
# ==============================================================================
# pazny.woodpecker — Woodpecker CI in Docker (devops compose stack)
#
# Lightweight CI/CD hooked into Gitea via OAuth2. Two compose services in one role:
#   • woodpecker-server — web UI + API + task queue
#   • woodpecker-agent  — runner, provadi pipeline kroky
#
# Credentials (woodpecker_agent_secret) + OAuth2 (woodpecker_gitea_client,
# woodpecker_gitea_secret) stay in top-level default.credentials.yml /
# default.config.yml.
# ==============================================================================

woodpecker_domain: "ci{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
woodpecker_port: 8060                   # Web UI
woodpecker_grpc_port: 9060              # gRPC pro agenty (interni)
woodpecker_open_registration: false
woodpecker_max_workflows: 4             # Max paralelnich pipeline runu na agenta

# ── Stable agent identity (2026-08-19) ──────────────────────────────────
# Display name of the compose-managed agent (WOODPECKER_HOSTNAME). The
# server-issued agent ID persists in {{ woodpecker_data_dir }}/agent/.
woodpecker_agent_hostname: "nos-woodpecker-agent"
# tasks/post-agents.yml deletes agent rows whose registration AND last
# contact are both older than this many seconds. The live agent pings every
# few seconds; an hour of silence is an orphan, not a busy runner.
woodpecker_agent_stale_after_s: 3600
woodpecker_mem_limit: "{{ docker_mem_limit_light | default('512m') }}"
woodpecker_agent_mem_limit: "{{ docker_mem_limit_standard | default('1g') }}"

# ── A16 (2026-05-17): nOS repo activation autowiring ───────────────────
# When install_woodpecker_autowire_nos=true, the playbook calls the
# Woodpecker activate-repo API after Gitea creates the mirror. Once
# active, every Gitea webhook fires the .woodpecker.yml pipeline.
install_woodpecker_autowire_nos: false
woodpecker_nos_repo_owner: "{{ gitea_admin_user | default(ansible_facts['user_id']) }}"
woodpecker_nos_repo_name: "nOS"
