---
# ==============================================================================
# pazny.woodpecker/tasks/post-secrets.yml — provision the repo secrets the
# committed pipelines reference (2026-08-19).
#
# WHY THIS EXISTS. `.woodpecker/deploy.yml` reads two Woodpecker REPO secrets,
# `wing_deploy_url` and `nos_deploy_hmac_secret`, and both were documented as a
# manual "Repo Settings → Secrets" step. Woodpecker's repo rows live in its own
# database, so a rebuilt Woodpecker (or a re-activated repo) loses them — and
# the estate then has committed pipelines referencing secrets nothing creates.
#
# MEASURED THE DAY CI FIRST FIRED: pipeline #1 came back
#
#     status: error — secret "wing_deploy_url" not found
#
# with ZERO steps executed. That also disproves the claim in `deploy.yml`'s own
# header — "If either secret is missing, ONLY this workflow fails to parse" —
# because the tests workflow did not run either. A missing secret errors the
# whole pipeline, so the repository's test gate is down, not merely its deploy.
# The comment was written from expectation; this file is written from the run.
#
# IDEMPOTENT: list, then create or update by name. Woodpecker has no upsert.
#
# The two values are NOT invented here. `nos_deploy_hmac_secret` is the same
# random value `main.yml` regenerates and `wing.plist.j2` hands to Wing — the
# whole point is that the two ends match. `wing_deploy_url` points at Wing over
# the Docker host bridge rather than the public edge: the caller is a container
# on this host, and routing it through the edge adds a Cloudflare hop plus a
# forward-auth surface to a call that never leaves the machine.
# ==============================================================================

- name: "[pazny.woodpecker Secrets] Skip — no usable API token"
  ansible.builtin.debug:
    msg: >-
      Woodpecker repo secrets not provisioned: the API did not answer for this
      PAT. `.woodpecker/deploy.yml` will error the WHOLE pipeline (tests
      included) until wing_deploy_url and nos_deploy_hmac_secret exist.
  when: not (_woodpecker_pat_ok | default(false) | bool)

- name: "[pazny.woodpecker Secrets] Provision the pipeline secrets"
  when:
    - _woodpecker_pat_ok | default(false) | bool
    - (_woodpecker_repo_check.json.id | default(0)) | int > 0
  block:
    - name: "[pazny.woodpecker Secrets] List existing repo secrets"
      ansible.builtin.uri:
        url: "{{ _woodpecker_api }}/api/repos/{{ _woodpecker_repo_check.json.id }}/secrets"
        method: GET
        headers:
          Authorization: "Bearer {{ woodpecker_api_token }}"
        status_code: [200]
      register: _wp_secrets
      changed_when: false
      no_log: true

    - name: "[pazny.woodpecker Secrets] Resolve which names already exist"
      ansible.builtin.set_fact:
        _wp_secret_names: "{{ _wp_secrets.json | default([]) | map(attribute='name') | list }}"

    # A secret's VALUE cannot be read back, so an existing name is refreshed
    # rather than trusted: a stale hmac on this side and a fresh one on Wing's
    # fails closed with a 401 that nobody attributes to this task.
    - name: "[pazny.woodpecker Secrets] Create or update each secret"
      ansible.builtin.uri:
        url: >-
          {{ _woodpecker_api }}/api/repos/{{ _woodpecker_repo_check.json.id }}/secrets{{
             ('/' ~ item.name) if item.name in _wp_secret_names else '' }}
        method: "{{ 'PATCH' if item.name in _wp_secret_names else 'POST' }}"
        headers:
          Authorization: "Bearer {{ woodpecker_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ item.name }}"
          value: "{{ item.value }}"
          events: ["push"]
        status_code: [200, 201]
      loop:
        - name: "wing_deploy_url"
          value: "{{ woodpecker_wing_deploy_url }}"
        - name: "nos_deploy_hmac_secret"
          value: "{{ nos_deploy_hmac_secret | default('') }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.value | length > 0
      register: _wp_secret_put
      changed_when: true
      no_log: true

    - name: "[pazny.woodpecker Secrets] Name what was skipped, rather than pass silently"
      ansible.builtin.debug:
        msg: >-
          nos_deploy_hmac_secret is empty, so it was NOT provisioned and
          `.woodpecker/deploy.yml` will still error the whole pipeline. It is
          regenerated by main.yml — run the full playbook, not just this tag.
      when: (nos_deploy_hmac_secret | default('') | length) == 0
