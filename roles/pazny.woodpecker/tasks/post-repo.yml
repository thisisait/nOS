---
# ==============================================================================
# pazny.woodpecker/tasks/post-repo.yml — activate nOS repo in Woodpecker
#
# Woodpecker discovers Gitea repos via its OAuth2 integration but each repo
# is dormant until explicitly activated. Activation enables webhook delivery
# (Gitea push → Woodpecker pipeline run) and surfaces the repo in the
# Woodpecker UI.
#
# woodpecker_api_token is OAuth-derived; since 2026-09-29 the role mints it
# itself (tools/woodpecker-token.py walks the Gitea grant over loopback), so
# a blank activates the repo in one run. The Woodpecker↔Gitea OAuth2 app is
# autowired first (post-oauth.yml), which is what makes that walk possible.
#
# Gitea forge-id discovery uses Gitea Admin Basic auth over 127.0.0.1 (NOT
# gitea_api_token / public domain — A19, 2026-05-24; see gitea post-repo.yml).
#
# Optional vars:
#   * woodpecker_nos_repo_owner  — default: same as gitea_admin_user
#   * woodpecker_nos_repo_name   — default: 'nOS'
#
# Idempotent: the activate endpoint returns 409 if the repo is already
# active; we treat that as success.
# ==============================================================================

# ── The PAT, without a browser (2026-09-29) ────────────────────────────────
# The token the UI shows is a JWT signed with the user's hash: no expiry,
# same value every call. The UI gets it by logging in through Gitea and
# POSTing /api/user/token; tools/woodpecker-token.py walks that same OAuth
# grant over loopback. A persisted token outlives the database that issued
# it (a blank regenerates the hash), so it is PROBED first, never trusted.
- name: "[pazny.woodpecker Post Repo] Resolve loopback API base"
  ansible.builtin.set_fact:
    _woodpecker_api: "http://127.0.0.1:{{ woodpecker_port | default(8060) }}"

- name: "[pazny.woodpecker Post Repo] Probe the persisted PAT"
  no_log: true   # Bearer header embeds woodpecker_api_token
  ansible.builtin.uri:
    url: "{{ _woodpecker_api }}/api/user"
    headers:
      Authorization: "Bearer {{ woodpecker_api_token }}"
    status_code: [200, 401, 403]
    return_content: true
  register: _woodpecker_pat_probe
  failed_when: false
  changed_when: false
  when: woodpecker_api_token | default('') | length > 0

# As an SSO identity, the way a person gets it: Authentik → Gitea's "Sign in
# with Authentik" → Woodpecker's grant. The local-form path died with 403 the
# day the gitea-base extension really hid the form (2026-09-30).
- name: "[pazny.woodpecker Post Repo] Mint the PAT through SSO"
  ansible.builtin.command:
    argv: "{{ ['python3', playbook_dir ~ '/tools/woodpecker-token.py',
               '--user=' ~ woodpecker_ci_identity,
               '--auth-host=' ~ authentik_domain,
               '--gitea-public=https://' ~ gitea_domain,
               '--woodpecker-public=https://' ~ woodpecker_domain]
              + (['--insecure'] if (tenant_domain_is_local | default(true) | bool) else []) }}"
  environment:
    SSO_PASSWORD: "{{ authentik_bootstrap_password }}"
  register: _woodpecker_mint
  failed_when: false
  changed_when: _woodpecker_mint.rc == 0
  no_log: true   # stdout IS the token
  when: >-
    (woodpecker_api_token | default('') | length == 0)
    or (_woodpecker_pat_probe.status | default(0)) != 200
    or _woodpecker_pat_probe.json is not defined

- name: "[pazny.woodpecker Post Repo] Adopt the minted PAT for this run"
  ansible.builtin.set_fact:
    woodpecker_api_token: "{{ _woodpecker_mint.stdout | trim }}"
  no_log: true
  when: (_woodpecker_mint.rc | default(1)) == 0

# lineinfile, not a template re-render — same reason as post-oauth.yml.
- name: "[pazny.woodpecker Post Repo] Persist the PAT into ~/.nos/secrets.yml"
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.nos/secrets.yml"
    regexp: "^woodpecker_api_token:"
    line: 'woodpecker_api_token: "{{ woodpecker_api_token }}"'
    create: true
    mode: '0600'
  no_log: true
  when: (_woodpecker_mint.rc | default(1)) == 0

- name: "[pazny.woodpecker Post Repo] The mint did not reach a token"
  ansible.builtin.debug:
    msg: >-
      woodpecker-token.py could not walk the Gitea OAuth grant
      ({{ _woodpecker_mint.stderr | default('') | trim }}). Activation is
      skipped below; the manual path still works (Woodpecker → User Settings →
      Personal Access Tokens → woodpecker_api_token in credentials.yml).
  when:
    - _woodpecker_mint is not skipped
    - (_woodpecker_mint.rc | default(1)) != 0

- name: "[pazny.woodpecker Post Repo] Activate nOS repo (token present)"
  when: woodpecker_api_token | default('') | length > 0
  block:
    # The CI identity activates the repo, so it must administer it in Gitea.
    # Its Gitea account exists from the mint's SSO walk (auto-registration).
    - name: "[pazny.woodpecker Post Repo] Make the CI identity a repo admin in Gitea"
      no_log: true   # Basic-auth embeds gitea_admin_password
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ gitea_port | default(3003) }}/api/v1/repos/{{ woodpecker_nos_repo_owner }}/{{ woodpecker_nos_repo_name }}/collaborators/{{ woodpecker_ci_identity }}"
        method: PUT
        headers:
          Authorization: "Basic {{ (gitea_admin_user ~ ':' ~ gitea_admin_password) | b64encode }}"
        body_format: json
        body: {permission: admin}
        status_code: [204]
      changed_when: false
      when: woodpecker_ci_identity != woodpecker_nos_repo_owner

    - name: "[pazny.woodpecker Post Repo] Discover Gitea forge_remote_id"
      no_log: true   # Basic-auth embeds gitea_admin_password (SEC-18 gap)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ gitea_port | default(3003) }}/api/v1/repos/{{ woodpecker_nos_repo_owner }}/{{ woodpecker_nos_repo_name }}"
        method: GET
        headers:
          Authorization: "Basic {{ (gitea_admin_user ~ ':' ~ gitea_admin_password) | b64encode }}"
        status_code: 200
      register: _woodpecker_gitea_repo
      changed_when: false

    # A 200 IS NOT AN ANSWER HERE. Woodpecker's SPA serves index.html as a
    # catch-all, so an unauthenticated call to a route that does not exist —
    # or to one the PAT cannot reach — comes back 200 with 1679 bytes of HTML.
    # Measured 2026-08-19: this task reported `changed` (cache refreshed!) and
    # the check below reported "already activated", both off that same HTML,
    # while the real API answered 401 to every route and the Gitea repo carried
    # ZERO webhooks. The activation path silently no-opped and certified itself.
    #
    # So every call in this block asserts a JSON body. `return_content: true`
    # plus a `json` key is what separates an answer from the front-end.
    - name: "[pazny.woodpecker Post Repo] Refresh forge cache (sync Gitea repo list)"
      no_log: true   # Bearer header embeds woodpecker_api_token
      # GET, not POST. `/api/user/repos` is a GET route in Woodpecker 3; POST
      # is v1/v2 syntax and lands in the SPA catch-all, which is how this call
      # returned 200-with-HTML and reported the forge cache refreshed. Measured
      # 2026-08-19 with a KNOWN-GOOD token: GET -> `null` (JSON, authenticated,
      # no repos synced yet); POST -> 1679 bytes of index.html.
      ansible.builtin.uri:
        url: "{{ _woodpecker_api }}/api/user/repos?all=true&flush=true"
        method: GET
        headers:
          Authorization: "Bearer {{ woodpecker_api_token }}"
        status_code: [200, 204, 401, 403]
        return_content: true
      register: _woodpecker_flush
      failed_when: false
      changed_when: false

    - name: "[pazny.woodpecker Post Repo] Resolve whether the PAT actually answered"
      ansible.builtin.set_fact:
        # JSON body → a real API answer. HTML (or no body) → the SPA, which
        # means the call never reached the API and we know nothing.
        _woodpecker_pat_ok: >-
          {{ (_woodpecker_flush.status | default(0)) in [200, 204]
             and (_woodpecker_flush.json is defined
                  or (_woodpecker_flush.content | default('') | trim | length) == 0) }}

    - name: "[pazny.woodpecker Post Repo] Activation deferred — token rejected"
      ansible.builtin.debug:
        msg: >-
          WOODPECKER CI IS NOT WIRED TO THE FORGE. Repo activation skipped —
          the API did not answer (HTTP {{ _woodpecker_flush.status | default('unreachable') }},
          {{ 'HTML: the SPA catch-all, so the PAT never reached the API'
             if (_woodpecker_flush.json is not defined
                 and (_woodpecker_flush.content | default('') | trim | length) > 0)
             else 'no JSON body' }}).
          On a fresh blank this is expected (no user has logged in yet). On an
          established host the PAT has expired or been revoked, and while it is
          the Gitea repo has no webhook, so no push starts a pipeline and every
          merge request opens with no CI behind it.
          The role mints the PAT itself on the next run; if that keeps
          failing, the manual path is Woodpecker → User Settings → Personal
          Access Tokens → woodpecker_api_token, then `--tags woodpecker`.
          Verify with: tools/loop-pr.py (it reports the Gitea webhook count).
      when: not (_woodpecker_pat_ok | bool)

    # v3 route. `/api/repos/{owner}/{name}` is NOT an API path in Woodpecker 3
    # — it is caught by the SPA and answers 200 for anything, which is exactly
    # how "already activated" got certified for a repo with no webhook.
    - name: "[pazny.woodpecker Post Repo] Check if repo is already activated"
      when: _woodpecker_pat_ok | bool
      no_log: true   # Bearer header embeds woodpecker_api_token
      ansible.builtin.uri:
        url: "{{ _woodpecker_api }}/api/repos/lookup/{{ woodpecker_nos_repo_owner }}/{{ woodpecker_nos_repo_name }}"
        method: GET
        headers:
          Authorization: "Bearer {{ woodpecker_api_token }}"
        status_code: [200, 404]
        return_content: true
      register: _woodpecker_repo_check
      changed_when: false

    - name: "[pazny.woodpecker Post Repo] Activate nOS repo (first run only)"
      no_log: true   # Bearer header embeds woodpecker_api_token
      ansible.builtin.uri:
        url: "{{ _woodpecker_api }}/api/repos?forge_remote_id={{ _woodpecker_gitea_repo.json.id }}"
        method: POST
        headers:
          Authorization: "Bearer {{ woodpecker_api_token }}"
        status_code: [200, 201, 409]
      when:
        - _woodpecker_pat_ok | bool
        - (_woodpecker_repo_check.json.id | default(0)) == 0
      register: _woodpecker_activate
      changed_when: true

    # The run that activates the repo is the run that must seed its secrets
    # (post-secrets.yml): the lookup above answered 404 on that run, so the
    # id has to come from the activation response instead (2026-09-29).
    - name: "[pazny.woodpecker Post Repo] Resolve the repo id (looked up, or just activated)"
      ansible.builtin.set_fact:
        _woodpecker_repo_id: >-
          {{ (_woodpecker_repo_check.json.id | default(0)) or (_woodpecker_activate.json.id | default(0)) }}
      when: _woodpecker_pat_ok | bool

    # ACTIVE IN WOODPECKER IS NOT THE SAME AS WIRED TO THE FORGE. The webhook
    # lives in the Gitea repo, and the agent-forge conversion RECREATES that
    # repo — so the hook dies with the old one while Woodpecker's own row
    # survives, reports active, and nothing ever recreates it. That is the state
    # measured on 2026-08-19: repo active, zero webhooks, every push silent.
    # `repair` is Woodpecker's own verb for exactly this and it is idempotent.
    - name: "[pazny.woodpecker Post Repo] Repair the forge webhook (idempotent)"
      when:
        - _woodpecker_pat_ok | bool
        - (_woodpecker_repo_check.json.id | default(0)) | int > 0
      no_log: true
      ansible.builtin.uri:
        url: "{{ _woodpecker_api }}/api/repos/{{ _woodpecker_repo_check.json.id }}/repair"
        method: POST
        headers:
          Authorization: "Bearer {{ woodpecker_api_token }}"
        status_code: [200, 204]
      changed_when: true
