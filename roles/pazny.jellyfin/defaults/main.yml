---
# ==============================================================================
# pazny.jellyfin — Jellyfin media server (iiab compose stack)
#
# Centralized variables (jellyfin_domain, port, media dirs) staysji v
# default.config.yml due to external consumers (nginx vhost render,
# blank-reset path resolver). Role defaults poskytuji fallback.
# ==============================================================================

jellyfin_port: 8096
jellyfin_domain: "media{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
jellyfin_lan_access: true                           # true = port dostupny z LAN
jellyfin_movies_dir: "{{ ansible_facts['env']['HOME'] }}/media/movies"
jellyfin_shows_dir: "{{ ansible_facts['env']['HOME'] }}/media/shows"
jellyfin_music_dir: "{{ ansible_facts['env']['HOME'] }}/media/music"
# The mounts this role renders: the three defaults, then each of
# jellyfin_extra_media_dirs at its own path (default.config.yml).
_jf_media: >-
  {% set out = [{'src': jellyfin_movies_dir, 'dst': '/media/movies'},
                {'src': jellyfin_shows_dir, 'dst': '/media/shows'},
                {'src': jellyfin_music_dir, 'dst': '/media/music'}] %}{%
  for d in jellyfin_extra_media_dirs | default([]) %}{% set p = d | regex_replace('/+$', '') %}{%
  set _ = out.append({'src': p, 'dst': p}) %}{% endfor %}{{ out }}

jellyfin_admin_user: "admin"
jellyfin_language: "en-US"
jellyfin_country: "CZ"

jellyfin_mem_limit: "{{ docker_mem_limit_critical | default('2g') }}"
jellyfin_cpus: "{{ docker_cpus_standard | default('1.0') }}"

# ----------------------------------------------------------------------------
# Native OIDC via jellyfin-plugin-sso — K0lin's maintained fork of the archived 9p4.
# 5.1.1: targetAbi 12.0.0.0, same GUID 505ce9d1-…, same OID/* routes (checked from
# the zip's meta.json, 2026-10-24). A plugin whose targetAbi misses the server is
# NotSupported → /sso/OID/* 404s (3.5.2.4 on 10.11, live 2026-06-02; 9p4 4.0.0.4 on 12).
# The zip is verified against its sha256 before it is unpacked.
# ----------------------------------------------------------------------------
jellyfin_sso_plugin_version: "5.1.1"
jellyfin_sso_plugin_url: "https://github.com/K0lin/jellyfin-plugin-sso/releases/download/v{{ jellyfin_sso_plugin_version }}/sso-authentication_{{ jellyfin_sso_plugin_version }}.zip"
jellyfin_sso_plugin_sha256: "db126b4763bda3a3754fa2103232fc03ef1bf929cfeda35f2e9af39c875233b1"

# Authentik OIDC provider config (matches the jellyfin-base plugin's authentik: block).
jellyfin_oidc_provider_name: "Authentik"
jellyfin_oidc_client_id: "nos-jellyfin"
jellyfin_oidc_client_secret: "{{ nos_derived_secrets.oidc_jellyfin }}"
jellyfin_oidc_endpoint: "https://{{ authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/application/o/jellyfin/"
jellyfin_oidc_admin_roles:
  - "nos-admins"
  - "nos-providers"
jellyfin_oidc_user_roles:
  - "nos-admins"
  - "nos-providers"
  - "nos-managers"
  - "nos-users"
  - "nos-guests"
