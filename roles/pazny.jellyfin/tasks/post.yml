---
# ==============================================================================
# pazny.jellyfin/tasks/post.yml — auto-onboarding via Startup API
#
# Jellyfin exposes /Startup/* endpoints only before first configuration.
# Flow: POST /Startup/Configuration -> /Startup/User -> /Startup/Complete.
#
# After the startup wizard, /Startup/* answers 403 (10.11+: 401). Pro non-blank runy
# reconverge password via AuthenticateUserByName -> POST /Users/{id}/Password
# with previous_password_prefix for the OLD password. Degrades gracefully at DRIFT.
# ==============================================================================

- name: "[pazny.jellyfin Post] Wait for API"
  ansible.builtin.include_role:
    name: pazny._common_tasks
    tasks_from: wait_for_api.yml
  vars:
    wait_name: "[pazny.jellyfin Post]"
    wait_url: "http://127.0.0.1:{{ jellyfin_port | default(8096) }}/health"
    wait_status_codes: [200]
    wait_register_as: _jf_ready
    wait_retries: 12
    wait_delay: 10
    # hard-fail: `failed_when: false` removed 2026-05-08 — see open_webui comment.
    wait_hard_fail: true

- name: "[pazny.jellyfin Post] Check startup configuration state"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_port | default(8096) }}/Startup/Configuration"
    method: GET
    timeout: 10
    status_code: [200, 401, 403]
  register: _jf_startup
  failed_when: false
  when: _jf_ready.status | default(0) == 200

- name: "[pazny.jellyfin Post] Set initial configuration"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_port | default(8096) }}/Startup/Configuration"
    method: POST
    body_format: json
    body:
      UICulture: "{{ jellyfin_language | default('en-US') }}"
      MetadataCountryCode: "{{ jellyfin_country | default('CZ') }}"
      PreferredMetadataLanguage: "{{ jellyfin_language | default('en') }}"
    status_code: [204, 200]
    timeout: 10
  when:
    - _jf_startup.status | default(0) == 200
  failed_when: false

# 10.11 creates the initial user only on GET /Startup/User; a POST without it
# 500s (Users.First() on an empty table), the wizard stays open and the
# operator finishes it by hand under a name/password nOS does not know.
- name: "[pazny.jellyfin Post] Initialise the startup user"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_port | default(8096) }}/Startup/User"
    timeout: 10
  when: _jf_startup.status | default(0) == 200
  failed_when: false

- name: "[pazny.jellyfin Post] Set startup user (best-effort)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_port | default(8096) }}/Startup/User"
    method: POST
    body_format: json
    body:
      Name: "{{ jellyfin_admin_user | default('admin') }}"
      Password: "{{ jellyfin_admin_password | default(nos_derived_secrets.jellyfin) }}"
    status_code: [204, 200, 400, 500]
    timeout: 10
  register: _jf_user
  when:
    - _jf_startup.status | default(0) == 200
  changed_when: _jf_user.status | default(0) in [200, 204]
  failed_when: false
  no_log: true

- name: "[pazny.jellyfin Post] Complete startup wizard"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_port | default(8096) }}/Startup/Complete"
    method: POST
    status_code: [204, 200]
    timeout: 10
  when:
    - _jf_startup.status | default(0) == 200
    # Gate on the USER creation, not merely on the wizard being open. The POST
    # above accepts 400 and 500 as success, and completing the wizard SEALS a
    # one-shot window: every later converge then takes the 403 branch into
    # "DRIFT — manual reset required". Sealing it over a failed admin POST is
    # the one defect in this file the playbook cannot repair on a re-run, so an
    # OPEN wizard is strictly better — it stays retryable.
    - _jf_user.status | default(0) in [200, 204]
  failed_when: false

- name: "[pazny.jellyfin Post] Startup wizard result"
  ansible.builtin.debug:
    msg: >-
      Jellyfin wizard:
      {{ 'completed' if (_jf_startup.status | default(0) == 200)
         else 'skipped (already configured)' }}
      {{ '(user set OK)' if (_jf_user.status | default(0) in [200, 204])
         else '(user creation failed — set password via UI)' }}
  when: _jf_ready.status | default(0) == 200

# -- Post-wizard password reconverge (state-declarative UPDATE) ----------
- name: "[pazny.jellyfin Post] Authenticate with current password (converged check)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_port | default(8096) }}/Users/AuthenticateByName"
    method: POST
    body_format: json
    headers:
      Authorization: 'MediaBrowser Client="nOS", Device="Ansible", DeviceId="ansible-reconverge", Version="1.0"'
    body:
      Username: "{{ jellyfin_admin_user | default('admin') }}"
      Pw: "{{ jellyfin_admin_password | default(nos_derived_secrets.jellyfin) }}"
    status_code: [200, 401]
    timeout: 10
  register: _jf_auth_new
  when:
    - _jf_ready.status | default(0) == 200
    - _jf_startup.status | default(0) in [401, 403]  # wizard already complete
  changed_when: false
  failed_when: false
  no_log: true

- name: "[pazny.jellyfin Post] Authenticate with previous password (for reconverge)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_port | default(8096) }}/Users/AuthenticateByName"
    method: POST
    body_format: json
    headers:
      Authorization: 'MediaBrowser Client="nOS", Device="Ansible", DeviceId="ansible-reconverge", Version="1.0"'
    body:
      Username: "{{ jellyfin_admin_user | default('admin') }}"
      Pw: "{{ previous_password_prefix | default(global_password_prefix) }}_pw_jellyfin"
    status_code: [200, 401]
    timeout: 10
  register: _jf_auth_old
  when:
    - _jf_ready.status | default(0) == 200
    - _jf_auth_new.status | default(0) != 200
    - _jf_startup.status | default(0) in [401, 403]
  changed_when: false
  failed_when: false
  no_log: true

- name: "[pazny.jellyfin Post] POST /Users/{id}/Password (reconverge)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_port | default(8096) }}/Users/{{ _jf_auth_old.json.User.Id }}/Password"
    method: POST
    body_format: json
    headers:
      Authorization: 'MediaBrowser Token="{{ _jf_auth_old.json.AccessToken }}"'
    body:
      CurrentPw: "{{ previous_password_prefix | default(global_password_prefix) }}_pw_jellyfin"
      NewPw: "{{ jellyfin_admin_password | default(nos_derived_secrets.jellyfin) }}"
    status_code: [200, 204]
    timeout: 10
  register: _jf_pw_reset
  when:
    - _jf_auth_old.status | default(0) == 200
    - _jf_auth_old.json.AccessToken is defined
  changed_when: _jf_pw_reset.status | default(0) in [200, 204]
  failed_when: false
  no_log: true

- name: "[pazny.jellyfin Post] Password reconverge status"
  ansible.builtin.debug:
    msg: >-
      Jellyfin admin pw:
      {{ 'already converged' if (_jf_auth_new.status | default(0) == 200)
         else ('updated' if (_jf_pw_reset.status | default(0) in [200, 204])
               else ('DRIFT — manual reset required' if (_jf_startup.status | default(0) in [401, 403]) else 'fresh install')) }}
  when: _jf_ready.status | default(0) == 200

# ── SSO-Auth provider via the plugin API (v4 wipes a hand-rendered XML) ──────
# Existing fields (CanonicalLinks = per-user links) are kept; only ours change.
- name: "[pazny.jellyfin Post] Admin token for SSO provisioning"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_port | default(8096) }}/Users/AuthenticateByName"
    method: POST
    body_format: json
    headers:
      Authorization: 'MediaBrowser Client="nOS", Device="Ansible", DeviceId="ansible-reconverge", Version="1.0"'
    body:
      Username: "{{ jellyfin_admin_user | default('admin') }}"
      Pw: "{{ jellyfin_admin_password | default(nos_derived_secrets.jellyfin) }}"
    status_code: [200, 401]
    timeout: 10
  register: _jf_sso_auth
  when: install_authentik | default(false) and _jf_ready.status | default(0) == 200
  changed_when: false
  failed_when: false
  no_log: true

- name: "[pazny.jellyfin Post] SSO provider not written — admin login refused"
  ansible.builtin.debug:
    msg: >-
      Jellyfin SSO NOT provisioned: '{{ jellyfin_admin_user | default('admin') }}' cannot sign in
      with the derived password (an account made by hand?). Set jellyfin_admin_user/_password
      in credentials.yml, or reset the Jellyfin data dir.
  when: _jf_sso_auth.status | default(0) == 401

- name: "[pazny.jellyfin Post] Read SSO-Auth OID providers"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_port | default(8096) }}/sso/OID/Get"
    headers: &jf_sso_hdr
      Authorization: 'MediaBrowser Token="{{ _jf_sso_auth.json.AccessToken | default('') }}"'
    timeout: 10
  register: _jf_sso_get
  when: _jf_sso_auth.json.AccessToken is defined
  no_log: true

- name: "[pazny.jellyfin Post] Write the {{ jellyfin_oidc_provider_name }} provider"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_port | default(8096) }}/sso/OID/Add/{{ jellyfin_oidc_provider_name }}"
    method: POST
    body_format: json
    headers: *jf_sso_hdr
    body: "{{ _jf_sso_have | combine(_jf_sso_want) }}"
    status_code: [200, 204]
    timeout: 10
  vars:
    _jf_sso_have: "{{ (_jf_sso_get.json | default({}) or {}).get(jellyfin_oidc_provider_name) or {} }}"
    _jf_sso_want:
      OidEndpoint: "{{ jellyfin_oidc_endpoint }}"
      OidClientId: "{{ jellyfin_oidc_client_id }}"
      OidSecret: "{{ jellyfin_oidc_client_secret }}"
      Enabled: true
      EnableAuthorization: true
      EnableAllFolders: true
      AdminRoles: "{{ jellyfin_oidc_admin_roles }}"
      Roles: "{{ jellyfin_oidc_user_roles }}"
      RoleClaim: groups
      OidScopes: [openid, profile, email, groups]
      SchemeOverride: https
      NewPath: true
      DefaultUsernameClaim: preferred_username
  register: _jf_sso_add
  when:
    - _jf_sso_get.json is defined
    - _jf_sso_have | combine(_jf_sso_want) != _jf_sso_have
  changed_when: true
  no_log: true

- name: "[pazny.jellyfin Post] Read back — the provider must exist after the write"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_port | default(8096) }}/sso/OID/GetNames"
    timeout: 10
  register: _jf_sso_names
  when: _jf_sso_get.json is defined
  failed_when: jellyfin_oidc_provider_name not in (_jf_sso_names.json | default([]))

# Branding login button: still not injected — jellyfin is supports:no /
# Tier-4, the plugin's own /sso/OID/start/<provider> is the entry point.
