---
# ==============================================================================
# pazny.jellyfin/tasks/main.yml
#
# Called from tasks/stacks/stack-up.yml BEFORE `docker compose -p iiab up`:
# creates config/cache/media dirs, enables the nginx vhost and renders
# compose override fragment do {{ stacks_dir }}/iiab/overrides/jellyfin.yml.
#
# Post-start auto-setup (Startup wizard + password reconverge) je v
# tasks/post.yml — called from stack-up.yml az PO compose up.
# ==============================================================================

- name: "[pazny.jellyfin] Ensure config, cache and media directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ jellyfin_config_dir }}"
    - "{{ jellyfin_cache_dir }}"
    - "{{ jellyfin_movies_dir }}"
    - "{{ jellyfin_shows_dir }}"
    - "{{ jellyfin_music_dir }}"
    - "{{ jellyfin_config_dir }}/plugins"
    - "{{ jellyfin_config_dir }}/plugins/configurations"
    - "{{ ansible_facts['env']['HOME'] }}/agents/log"

# ─── Native OIDC via jellyfin-plugin-sso ─────────────────────────────────────
# Plugin download is host-side (before first container start) so Jellyfin picks
# it up on boot. Install skipped when install_authentik is disabled.
- name: "[pazny.jellyfin] Find stale SSO plugin versions (!= pinned)"
  ansible.builtin.find:
    paths: "{{ jellyfin_config_dir }}/plugins"
    patterns: "SSO-Auth_*"
    file_type: directory
    excludes: "SSO-Auth_{{ jellyfin_sso_plugin_version }}.0"
  register: _jf_sso_stale
  when: install_authentik | default(false)

- name: "[pazny.jellyfin] Remove stale SSO plugin versions (a bump must not leave the old dir)"
  # Jellyfin registers NEITHER when two versions of the same plugin GUID are
  # present (the older NotSupported one conflicts) → /sso/OID/* 404s. Remove any
  # non-pinned SSO-Auth_* so only the pinned version loads. (live 2026-06-02)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _jf_sso_stale.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: install_authentik | default(false)
  notify: Restart jellyfin

- name: "[pazny.jellyfin] Ensure SSO plugin target directory exists"
  ansible.builtin.file:
    path: "{{ jellyfin_config_dir }}/plugins/SSO-Auth_{{ jellyfin_sso_plugin_version }}.0"
    state: directory
    mode: '0755'
  when: install_authentik | default(false)

- name: "[pazny.jellyfin] Check whether SSO plugin already installed"
  ansible.builtin.stat:
    path: "{{ jellyfin_config_dir }}/plugins/SSO-Auth_{{ jellyfin_sso_plugin_version }}.0/SSO-Auth.dll"
  register: _jf_sso_installed
  when: install_authentik | default(false)

- name: "[pazny.jellyfin] Download + unpack jellyfin-plugin-sso {{ jellyfin_sso_plugin_version }}"
  ansible.builtin.unarchive:
    src: "{{ jellyfin_sso_plugin_url }}"
    dest: "{{ jellyfin_config_dir }}/plugins/SSO-Auth_{{ jellyfin_sso_plugin_version }}.0"
    remote_src: true
    mode: '0755'
  when:
    - install_authentik | default(false)
    - not (_jf_sso_installed.stat.exists | default(false))
  notify: Restart jellyfin

- name: "[pazny.jellyfin] Render SSO-Auth plugin configuration (XML)"
  ansible.builtin.template:
    src: SSO-Auth.xml.j2
    dest: "{{ jellyfin_config_dir }}/plugins/configurations/SSO-Auth.xml"
    mode: '0600'
  when: install_authentik | default(false)
  notify: Restart jellyfin

# Linux routes via Traefik; host-nginx per-service vhosts are macOS-only.
- name: "[pazny.jellyfin] Enable nginx vhost"
  ansible.builtin.file:
    src: "{{ homebrew_prefix }}/etc/nginx/sites-available/jellyfin.conf"
    dest: "{{ homebrew_prefix }}/etc/nginx/sites-enabled/jellyfin.conf"
    state: link
    force: true
  notify: Restart nginx
  when:
    - install_nginx | default(true)
    - ansible_os_family == 'Darwin'

- name: "[pazny.jellyfin] Display post-install note"
  ansible.builtin.debug:
    msg: |
      ==========================================================================
       JELLYFIN - FIRST RUN
       URL: https://{{ jellyfin_domain | default('media' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}
       Admin ucet + knihovny auto-setup pres Startup API (post.yml).
       Medialni slozky v kontejneru:
         /media/movies -> {{ jellyfin_movies_dir }}
         /media/shows  -> {{ jellyfin_shows_dir }}
         /media/music  -> {{ jellyfin_music_dir }}
       Apple Silicon has no HW acceleration in Docker — transcoding = software.
      ==========================================================================

- name: "[pazny.jellyfin] Render compose override fragment"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/iiab/overrides/jellyfin.yml"
    mode: '0600'
  notify: Restart jellyfin
