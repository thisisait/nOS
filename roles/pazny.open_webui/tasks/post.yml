---
# ==============================================================================
# pazny.open_webui/tasks/post.yml — admin user creation + password reconverge
#
# The first registered user = admin (WEBUI_AUTH=true, ENABLE_SIGNUP=true).
# Pro non-blank runy (rotated prefix) provadime state-declarative UPDATE
# via in-container python (sqlite3 + passlib bcrypt).
# ==============================================================================

# hard-fail (wait_hard_fail: true) is the canonical 2026-05-08 fix: a silent
# `failed_when: false` absorb here masked iiab-stack failures for ~25 min as
# `Wait for API (N retries left)` loops. docker compose up --wait already gates
# stack health (see stack-up.yml fail-fast); if we STILL can't reach the port
# from the host that's a genuine split-brain to surface, not paper over. This is
# the reference comment the ha/jellyfin waits point back to.
- name: "[pazny.open_webui Post] Wait for API"
  ansible.builtin.include_role:
    name: pazny._common_tasks
    tasks_from: wait_for_api.yml
  vars:
    wait_name: "[pazny.open_webui Post]"
    wait_url: "http://127.0.0.1:{{ openwebui_port | default(3004) }}/api/config"
    wait_status_codes: [200]
    wait_register_as: _owui_ready
    wait_retries: 12
    wait_delay: 10
    wait_hard_fail: true

# ── Ensure admin (DB-seed first-run, reconverge otherwise) ─────────────────
# Pure-SSO + signup-off safe: we no longer POST the public signup endpoint
# (ENABLE_SIGNUP=false closes the public first-admin race). Instead seed the
# admin DIRECTLY into webui.db on first run (empty DB), and reconverge the
# password on later runs. The admin email == the Authentik admin's, so
# OAUTH_MERGE_ACCOUNTS_BY_EMAIL merges the first OIDC login into this admin →
# SSO-primary, with the seeded password as a break-glass fallback. Idempotent;
# the in-container python uses the same sqlite3 + passlib path as before.
- name: "[pazny.open_webui Post] Ensure admin user (seed first-run / reconverge)"
  ansible.builtin.shell: |
    {{ docker_bin }} compose -p iiab exec -T open-webui python3 -c "
    import sqlite3, uuid, time
    from passlib.context import CryptContext
    pwd_ctx = CryptContext(schemes=['bcrypt'], deprecated='auto')
    hashed = pwd_ctx.hash('{{ openwebui_admin_password }}')
    email = '{{ openwebui_admin_email | default(default_admin_email) }}'
    db = sqlite3.connect('/app/backend/data/webui.db')
    cur = db.cursor()
    total = cur.execute('SELECT count(*) FROM user').fetchone()[0]
    mine = cur.execute('SELECT id FROM user WHERE email=?', (email,)).fetchone()
    if total == 0:
        uid = str(uuid.uuid4()); now = int(time.time())
        cur.execute('INSERT INTO user (id,name,email,role,profile_image_url,created_at,updated_at,last_active_at) VALUES (?,?,?,?,?,?,?,?)', (uid, 'Admin', email, 'admin', '/user.png', now, now, now))
        cur.execute('INSERT INTO auth (id,email,password,active) VALUES (?,?,?,1)', (uid, email, hashed))
        print('SEEDED')
    elif mine:
        cur.execute('UPDATE auth SET password=? WHERE email=?', (hashed, email))
        print('RECONVERGED')
    else:
        print('SKIP')
    db.commit()
    db.close()
    "
  register: _owui_admin
  when: _owui_ready.status | default(0) == 200
  changed_when: "('SEEDED' in (_owui_admin.stdout | default('')) ) or ('RECONVERGED' in (_owui_admin.stdout | default('')))"
  failed_when: false
  check_mode: false
  no_log: true
