---
# ==============================================================================
# pazny.wing/tasks/post.yml — POST-START PHASE.
#
# Anatomy A3.5 (2026-05-04): all PHP CLI ops run host-native (no more
# `docker compose run --rm wing-cli`). Composer is host-installed via
# Homebrew; PHP is whatever frankenphp ships (or the Homebrew php@8.x in
# PATH for CLI scripts). The `wing-cli` profile service is gone.
#
# Runs from tasks/stacks/stack-up.yml AFTER the iiab stack is up, but the
# iiab stack no longer carries Wing — Wing has its own launchd daemon
# already-bootstrapped by tasks/main.yml. We could move post.yml earlier;
# kept here to preserve the "main.yml renders, post.yml does state ops"
# split that mirrors all other anatomy roles (Bone A3a, Pulse A4).
# ==============================================================================

# ── DB init: create schema if wing.db is empty ───────────────────────────────

- name: "[pazny.wing] Initialize SQLite database schema (idempotent)"
  ansible.builtin.command:
    cmd: php bin/init-db.php --data-dir={{ wing_data_dir }}
    chdir: "{{ wing_app_dir }}"
  register: _wing_initdb
  changed_when: "'Created' in (_wing_initdb.stdout | default(''))"

- name: "[pazny.wing] Migrate components → systems (idempotent)"
  ansible.builtin.command:
    cmd: php bin/migrate-systems.php --data-dir={{ wing_data_dir }}
    chdir: "{{ wing_app_dir }}"
  register: _wing_migrate_sys
  changed_when: >
    'Migrated' in (_wing_migrate_sys.stdout | default(''))
    or 'Created' in (_wing_migrate_sys.stdout | default(''))

# ── Legacy JSON migration (only on a brand-new install) ──────────────────────

- name: "[pazny.wing] Detect whether legacy JSON migration is still needed"
  ansible.builtin.command:
    argv:
      - php
      - -r
      - >-
        $db = new SQLite3('{{ wing_data_dir }}/wing.db');
        echo $db->querySingle('SELECT COUNT(*) FROM systems WHERE source IN ("components_db","manual")');
        $db->close();
  register: _wing_component_count
  changed_when: false

- name: "[pazny.wing] Stat legacy JSON source dir (skip migration if no markdown to import)"
  # The legacy migrate.php is an upgrade path from old Wing where component
  # metadata lived in markdown files under docs/llm/security. Fresh-blank
  # installs don't have anything to migrate from; skip cleanly so the
  # playbook doesn't trip on `migrate.php: Usage: ...` (rc=1) when the
  # directory is empty or absent.
  ansible.builtin.find:
    paths: "{{ wing_json_source }}"
    patterns: "*.md"
    file_type: file
  register: _wing_legacy_md
  changed_when: false
  failed_when: false

- name: "[pazny.wing] Run legacy JSON → SQLite import (only if no rows yet AND markdown sources exist)"
  ansible.builtin.command:
    cmd: php bin/migrate.php --json-dir={{ wing_json_source }} --data-dir={{ wing_data_dir }}
    chdir: "{{ wing_app_dir }}"
  register: _wing_migrate
  when:
    - (_wing_component_count.stdout | default('0') | trim | int) == 0
    - (_wing_legacy_md.files | default([]) | length) > 0

# ── Service registry ingestion ───────────────────────────────────────────────

- name: "[pazny.wing] Ingest service-registry.json into systems table"
  ansible.builtin.command:
    cmd: php bin/ingest-registry.php --registry={{ ansible_facts['env']['HOME'] }}/projects/default/service-registry.json
    chdir: "{{ wing_app_dir }}"
  register: _wing_ingest
  changed_when: >
    'Ingested' in (_wing_ingest.stdout | default(''))
    and 'Ingested 0' not in (_wing_ingest.stdout | default(''))

# ── Security-research re-sync (idempotent) ───────────────────────────────────
# bin/migrate.php is a ONE-SHOT bootstrap: once systems.source='components_db'
# exists it short-circuits forever, so /remediation + /pentest stop tracking
# the authoritative JSON (remediation-queue.json had 85 items, the table held
# 83 — the 2 vendor-blocked FreePBX rows were dropped because migrate.php's
# INSERT OR IGNORE swallowed the status CHECK rejection). These two scripts are
# the ONGOING re-sync — they UPSERT on every run keyed on the stable id, so the
# pages always match the committed JSON. Gated ONLY on the JSON input existing
# (NOT the components_db one-shot gate, NOT the *.md-presence heuristic that
# gates migrate.php). The DB path is taken from WING_DB_PATH (unset here → the
# script's ~/wing/app/data/wing.db default, same dir as wing_data_dir), and the
# JSON is passed explicitly so the chdir into wing_app_dir doesn't break the
# script's repo-relative default.

- name: "[pazny.wing] Stat remediation-queue.json (re-sync source)"
  ansible.builtin.stat:
    path: "{{ wing_json_source }}/remediation-queue.json"
  register: _wing_rem_json
  changed_when: false

- name: "[pazny.wing] Re-sync remediation-queue.json → remediation_items (idempotent upsert)"
  ansible.builtin.command:
    cmd: php bin/ingest-remediation.php --json={{ wing_json_source }}/remediation-queue.json
    chdir: "{{ wing_app_dir }}"
  register: _wing_rem_ingest
  # Idempotent: the script prints "changed=N" (real inserts/updates via the
  # UPSERT WHERE-guard). A steady-state re-sync is changed=0 → reported ok.
  changed_when: "'changed=0' not in (_wing_rem_ingest.stdout | default('changed=0'))"
  when: _wing_rem_json.stat.exists | default(false)

- name: "[pazny.wing] Stat pentest-journal.json (re-sync source)"
  ansible.builtin.stat:
    path: "{{ wing_json_source }}/pentest-journal.json"
  register: _wing_pentest_json
  changed_when: false

- name: "[pazny.wing] Re-sync pentest-journal.json → pentest_* tables (idempotent upsert)"
  ansible.builtin.command:
    cmd: php bin/ingest-pentest.php --json={{ wing_json_source }}/pentest-journal.json
    chdir: "{{ wing_app_dir }}"
  register: _wing_pentest_ingest
  # Idempotent: keyed on the script's "changed=N" (targets+findings real diffs;
  # the keyless area rows are rebuilt content-stable and excluded from the count).
  changed_when: "'changed=0' not in (_wing_pentest_ingest.stdout | default('changed=0'))"
  when: _wing_pentest_json.stat.exists | default(false)

# Surface historical pulse / claude-CLI agent runs in /agents (W5-A1): those
# runs emit agent_run_* events but never created agent_sessions rows, so they
# were invisible. Replay the events into sessions (idempotent). New runs are
# synced live by Api\EventsPresenter on ingest.
- name: "[pazny.wing] Backfill agent_sessions from historical agent_run events"
  ansible.builtin.command:
    cmd: php bin/backfill-agent-sessions.php
    chdir: "{{ wing_app_dir }}"
  register: _wing_session_backfill
  changed_when: "'now holds 0' not in (_wing_session_backfill.stdout | default(''))"
  failed_when: false

# Record the audit hash-chain segment anchor (gov P1). Idempotent: prints
# 'now holds 0' once the recorded anchor matches the current tail. Only runs
# when the chain is enabled; lets the verifier accept a chain OFF->ON boundary.
- name: "[pazny.wing] Record audit-chain enable anchor (idempotent)"
  ansible.builtin.command:
    cmd: php bin/backfill-event-chain.php --data-dir={{ wing_data_dir }}
    chdir: "{{ wing_app_dir }}"
  register: _wing_chain_anchor
  changed_when: "'now holds 0' not in (_wing_chain_anchor.stdout | default(''))"
  failed_when: false
  when: wing_audit_chain_enabled | default(false) | bool

# Populate the /upgrades version matrix (W5-B1): ingest the committed upgrade
# recipes (upgrades/*.yml) into upgrade_recipes. Offline / deterministic — no
# upstream version calls. Idempotent (truncate + reinsert).
- name: "[pazny.wing] Ingest upgrade recipes into upgrade_recipes table"
  ansible.builtin.command:
    cmd: php bin/ingest-upgrade-recipes.php --recipes-dir={{ playbook_dir }}/upgrades --data-dir={{ wing_data_dir }}
    chdir: "{{ wing_app_dir }}"
  register: _wing_recipe_ingest
  changed_when: "'loaded 0 recipe' not in (_wing_recipe_ingest.stdout | default(''))"
  failed_when: false

# ── GDPR Article 30 register — Tier-1 core services (C3, 2026-05-25) ──────────
# Per-plugin gdpr: blocks were loader-validated (Art. 6(1)) but never ingested:
# the /gdpr UI + DPA story covered only the 4 Tier-2 apps, leaving ~50 core
# services dark. This closes the gap. The canonical mapper
# (files/anatomy/module_utils/nos_gdpr.py) turns each plugin gdpr block into a
# complete Article-30 record; we upsert via the SAME bin/upsert-gdpr.php path
# the apps_runner uses for Tier-2 (--id=svc_<name> here vs app_<name> there).
# The static DPA register (state/dpa-register.md) is the offline twin of these
# same rows — both rendered from the one mapper, so /gdpr and the markdown agree.
- name: "[pazny.wing] Emit Tier-1 GDPR Article-30 records (canonical mapper)"
  ansible.builtin.command:
    cmd: "python3 {{ playbook_dir }}/tools/gdpr-records.py --tier core"
  register: _gdpr_records_raw
  changed_when: false
  check_mode: false

- name: "[pazny.wing] Upsert Tier-1 GDPR processing rows (host PHP CLI, one per service)"
  # Mirrors roles/pazny.apps_runner/tasks/post.yml Hook 7. JSON goes through an
  # env var (NOS_GDPR_JSON) so the shell never has to quote nested arrays;
  # `--json=-` reads it from the stdin pipe. Idempotent: re-running rewrites the
  # row from the latest plugin block. failed_when:false keeps a single malformed
  # record from aborting the run — the changed/ok tally surfaces any miss.
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      printf '%s' "$NOS_GDPR_JSON"
      | php bin/upsert-gdpr.php --id={{ item.id }} --json=-
    chdir: "{{ wing_app_dir }}"
    executable: /bin/bash
  environment:
    NOS_GDPR_JSON: "{{ item | to_json }}"
  loop: "{{ _gdpr_records_raw.stdout | from_json }}"
  loop_control:
    label: "{{ item.id }}"
  register: _gdpr_tier1_upserts
  changed_when: "'OK upserted' in (_gdpr_tier1_upserts.stdout | default(''))"
  failed_when: false

# ── API token reconverge ─────────────────────────────────────────────────────
# Provisions named tokens for every first-class Wing consumer. Each gets its
# own row so the audit trail carries a meaningful actor name. Idempotent.

- name: "[pazny.wing] Reconverge API token — ansible-provisioned (operator)"
  ansible.builtin.command:
    argv:
      - php
      - "{{ wing_app_dir }}/bin/provision-token.php"
      - --db={{ wing_data_dir }}/wing.db
      - --token={{ wing_api_token }}
      - --name=ansible-provisioned
    chdir: "{{ wing_app_dir }}"
  register: _wing_token_result
  changed_when: >
    'Created' in (_wing_token_result.stdout | default(''))
    or 'Updated' in (_wing_token_result.stdout | default(''))
  no_log: true

- name: "[pazny.wing] Reconverge API token — conductor (A8 Claude Code agent)"
  ansible.builtin.command:
    argv:
      - php
      - "{{ wing_app_dir }}/bin/provision-token.php"
      - --db={{ wing_data_dir }}/wing.db
      - --token={{ conductor_wing_api_token }}
      - --name=conductor
    chdir: "{{ wing_app_dir }}"
  register: _wing_conductor_token
  changed_when: >
    'Created' in (_wing_conductor_token.stdout | default(''))
    or 'Updated' in (_wing_conductor_token.stdout | default(''))
  no_log: true

# THE EXECUTOR'S DOOR. Measured 2026-08-11: nine provisioned tokens, not one
# with a cortex column set, and the playbook had no task that could set one. The
# cortex executor was built, deployed, gated and unreachable — `CortexCapability`
# refuses a token missing ANY of the three axes, by design, so "powerful
# elsewhere" is correctly not a way in.
#
# The scopes are the executor's own P1 surface and no wider: the five read verbs
# it can dispatch (`embed` is still late-bound upstream, so granting it would
# name a verb that cannot run), and the two namespaces KEAP resolves. `db:` is
# deliberately absent — a chain that could reach the Wing or GDPR store through
# this token would make the executor a second, unaudited path into them.
- name: "[pazny.wing] Reconverge API token — cortex executor (all three axes)"
  ansible.builtin.command:
    argv:
      - php
      - "{{ wing_app_dir }}/bin/provision-token.php"
      - --db={{ wing_data_dir }}/wing.db
      - --token={{ cortex_executor_token }}
      - --name=cortex-executor
      - --cortex-verbs=get,resolve,map,filter,rank,classify
      - --cortex-namespaces=tax,rel
      - --cortex-tenants=default
    chdir: "{{ wing_app_dir }}"
  register: _wing_cortex_token
  changed_when: >
    'Created' in (_wing_cortex_token.stdout | default(''))
    or 'Updated' in (_wing_cortex_token.stdout | default(''))
  no_log: true

- name: "[pazny.wing] Reconverge API token — librarian (cortex L2 knowledge judge)"
  # Judges the KEAP lint intake queue (overlap-review/near-duplicate pairs).
  # Client nos-librarian pre-provisioned in authentik_agent_clients; this adds
  # the api_tokens row so its report events authenticate.
  ansible.builtin.command:
    argv:
      - php
      - "{{ wing_app_dir }}/bin/provision-token.php"
      - --db={{ wing_data_dir }}/wing.db
      - --token={{ librarian_wing_api_token }}
      - --name=librarian
    chdir: "{{ wing_app_dir }}"
  register: _wing_librarian_token
  changed_when: >
    'Created' in (_wing_librarian_token.stdout | default(''))
    or 'Updated' in (_wing_librarian_token.stdout | default(''))
  no_log: true

# Roster close 2026-08-26: scout/upgrade-advisor/remediator token tasks left
# with their RETIRED agents, curator/migration-author with the PARK. Live
# api_tokens rows persist until the operator deactivates them — provision
# only upserts, it never reconciles absence.

- name: "[pazny.wing] Reconverge API token — surveyor (A20 surface-legibility agent)"
  # Read-only surface survey. Same provision-token.php pattern as conductor; the
  # Authentik client (nos-surveyor) is pre-provisioned in
  # default.config.yml::authentik_agent_clients, and this hook adds the
  # matching api_tokens row Wing checks at request time. Without it the agent
  # dies inside pulse-run-agent.sh on "WING_API_TOKEN is not set" — a message
  # that names the symptom and not the five declarations a new agent needs.
  ansible.builtin.command:
    argv:
      - php
      - "{{ wing_app_dir }}/bin/provision-token.php"
      - --db={{ wing_data_dir }}/wing.db
      - --token={{ surveyor_wing_api_token }}
      - --name=surveyor
    chdir: "{{ wing_app_dir }}"
  register: _wing_surveyor_token
  changed_when: >
    'Created' in (_wing_surveyor_token.stdout | default(''))
    or 'Updated' in (_wing_surveyor_token.stdout | default(''))
  no_log: true

- name: "[pazny.wing] Reconverge API token — upgrade-architect (W5-B5)"
  # Reads the /upgrades matrix, drafts recipes (in its report) + queues
  # coexistence. Token name = actor_id (planned_by on coexistence queues).
  # Authentik client (nos-upgrade-architect) is in authentik_agent_clients.
  ansible.builtin.command:
    argv:
      - php
      - "{{ wing_app_dir }}/bin/provision-token.php"
      - --db={{ wing_data_dir }}/wing.db
      - --token={{ upgrade_architect_wing_api_token }}
      - --name=upgrade-architect
    chdir: "{{ wing_app_dir }}"
  register: _wing_upgrade_architect_token
  changed_when: >
    'Created' in (_wing_upgrade_architect_token.stdout | default(''))
    or 'Updated' in (_wing_upgrade_architect_token.stdout | default(''))
  no_log: true

- name: "[pazny.wing] Reconverge API token — openclaw (B1: A8 agent, wing-side provisioning)"
  ansible.builtin.command:
    argv:
      - php
      - "{{ wing_app_dir }}/bin/provision-token.php"
      - --db={{ wing_data_dir }}/wing.db
      - --token={{ openclaw_wing_api_token }}
      - --name=openclaw
    chdir: "{{ wing_app_dir }}"
  register: _wing_openclaw_token
  changed_when: >
    'Created' in (_wing_openclaw_token.stdout | default(''))
    or 'Updated' in (_wing_openclaw_token.stdout | default(''))
  no_log: true
  when: install_openclaw | default(false)

# ── Pulse job registration via Wing API ──────────────────────────────────────
# Plugin loader does not yet process pulse: blocks — jobs are registered here
# directly. Wing must be running at this point (started by main.yml above,
# docker compose stacks start before post.yml runs). B2 fix (2026-05-07).

- name: "[pazny.wing] Wait for Wing API health (hub/health 200, confirms DB init done)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ wing_port | default(9000) }}/api/v1/hub/health"
    method: GET
    status_code: 200
  register: _wing_health
  until: _wing_health.status == 200
  retries: 12
  delay: 5
  failed_when: false

# ── Pulse job registration — data-driven from plugin manifests + agents ─────
# X.2 (2026-05-08) refactor: the previous shape hardcoded two
# `ansible.builtin.uri` blocks (gitleaks + conductor) at ~50 LOC each.
# Source-of-truth is now each plugin's `pulse:` block (gitleaks/plugin.yml
# already had it) + each agent profile's `pulse:` block (conductor.yml
# already had it). The migration target is plugin loader's
# `replay_api_calls` action (Lane C5 in the C-series roadmap); until that
# lands, this loop is the bridge:
#   1. Glob plugin + agent yamls.
#   2. Extract `pulse.jobs[]` from each.
#   3. POST each to /api/v1/pulse_jobs (idempotent on plugin_name+job_name).
# pulse-base/plugin.yml pins the long-term contract (aggregator decl).
- name: "[pazny.wing] Discover Pulse job catalog from plugin manifests + agent profiles"
  # Standalone Python script lives at files/anatomy/scripts/discover-pulse-catalog.py.
  # We deliberately avoid inline-Python-in-heredoc here: Ansible Jinja-templates
  # the entire shell body before bash sees it, and Jinja braces inside a Python
  # dict literal break the argument splitter ("failed at splitting arguments,
  # either an unbalanced jinja2 block or quotes" — observed live 2026-05-07).
  # Substitution values are fed via env vars so the script source carries
  # literal `{{ playbook_dir }}` strings as dict keys without any templating.
  ansible.builtin.command:
    cmd: "python3 {{ playbook_dir }}/files/anatomy/scripts/discover-pulse-catalog.py"
  environment:
    # The secret-shaped NOS_* vars that used to live here are GONE (2026-08-11).
    # The catalog now emits `secret:<name>` references and the Pulse daemon
    # resolves them from ~/.nos/secrets.yml at exec time, so passing the VALUES
    # into this subprocess would put nineteen credentials into a process
    # environment that no longer reads them — visible to `ps -E` for the life of
    # the task, for nothing. Removed rather than left as harmless: an unused
    # secret in flight is still a secret in flight.
    NOS_PLAYBOOK_DIR: "{{ playbook_dir }}"
    NOS_AUTHENTIK_DOMAIN: "{{ authentik_domain | default('auth.' ~ (tenant_domain | default('dev.local'))) }}"
    NOS_TENANT_DOMAIN: "{{ tenant_domain | default('dev.local') }}"
    NOS_GLOBAL_PASSWORD_PREFIX: "{{ global_password_prefix }}"
    # NOS_BONE_SECRET_RETIRED left this block 2026-08-12: the catalog now emits
    # `secret:bone_secret_retired` (the last secret-shaped token that still rode
    # as a VALUE — the leaked, rotated-out chain key, sitting 64-hex in the
    # live audit-chain-verify row because it is not `_pw_`-shaped and the
    # 2026-08-11 sweep keyed on that shape).
    NOS_BONE_PORT: "{{ bone_port | default(8099) }}"
    # alert-relay-base polls Prometheus for firing alerts (2026-08-05). Same
    # reason bone_port is here: so a manifest declares the port instead of
    # hardcoding it and drifting from default.config.yml.
    NOS_PROMETHEUS_PORT: "{{ prometheus_port | default(9090) }}"
    # A9.4-fixup (2026-05-17): wing-base Pulse jobs reference {{ wing_home }}
    # in args[] and env values. Without the substitution, Pulse would
    # fork `/opt/homebrew/bin/php "{{ wing_home }}/bin/..."` and crash
    # with "Could not open input file" 1× per minute.
    NOS_WING_HOME: "{{ wing_home }}"
    NOS_WING_APP_DIR: "{{ wing_app_dir }}"
    # A9 mail/ntfy dispatch (2026-05-26 fix): Ansible renders these conditional
    # values HERE (full var context) — the catalog can't render Jinja, so
    # wing-base/plugin.yml carries bare tokens that map to these NOS_* vars.
    # Was: the conditionals lived in plugin.yml + shipped UNRENDERED (A9 mail/
    # ntfy delivery silently broken; caught by the live conductor 2026-05-25).
    NOS_NTFY_URL: "{{ ('http://127.0.0.1:' ~ ntfy_port) if install_ntfy | default(false) else '' }}"
    NOS_NTFY_PUBLISH_USER: "{{ ntfy_publisher_user | default('') if install_ntfy | default(false) else '' }}"
    NOS_MAIL_HOST: "{{ '127.0.0.1' if (install_mailpit | default(true)) or (install_smtp_stalwart | default(false)) else '' }}"
    NOS_MAIL_PORT: "{{ (stalwart_port_submission | default(587)) if install_smtp_stalwart | default(false) else (mailpit_smtp_port | default(1025)) }}"
    NOS_MAIL_TLS_MODE: "{{ 'starttls' if install_smtp_stalwart | default(false) else 'none' }}"
    NOS_MAIL_USERNAME: "{{ (stalwart_admin_username | default('admin')) if install_smtp_stalwart | default(false) else '' }}"
    NOS_MAIL_TLS_VERIFY: "{{ '1' if mail_tls_verify | default(true) else '0' }}"
    NOS_MAIL_FROM: "wing@{{ tenant_domain | default('dev.local') }}"
    NOS_MAIL_RECIPIENT: "{{ default_admin_email | default('') }}"
    NOS_MAIL_DIGEST_FLOOR: "{{ mail_digest_floor | default('medium') }}"
    NOS_MAIL_DIGEST_CRON: "{{ mail_digest_cron | default('0 9 * * *') }}"
    # keap-embed-sync (cortex Phase 6): keap-base/plugin.yml env carries bare
    # keap_port / keap_agent_token_rw tokens; the catalog literal-substitutes
    # them from these Ansible-rendered values.
    NOS_KEAP_PORT: "{{ keap_port | default(8091) }}"
    # keap-consolidate (cortex dream sweep): capture-tier token + source roots.
    # backup-restore-drill: backup-base/plugin.yml carries the bare
    # {{ backup_verify_script_path }} token; the catalog literal-substitutes it.
    NOS_BACKUP_VERIFY_SCRIPT: "{{ backup_verify_script_path | default(ansible_facts['env']['HOME'] ~ '/.nos/backup-verify.sh') }}"
    NOS_CONSOLIDATE_FS_ROOTS: "{{ (nextcloud_data_dir | default('')) ~ ':' ~ (ansible_facts['env']['HOME'] ~ '/keap/inbox') }}"
    NOS_CONSOLIDATE_DB_EXCLUDE: "{{ mariadb_databases | default([]) | map(attribute='name') | join(',') }}"
    # S2 fan-out: an EMPTY url is the off switch — keap-consolidate and
    # keap-embed-sync then behave exactly as they did before the second target
    # existed, rather than failing against a daemon that is not there.
    NOS_CORTEX_FANOUT_URL: "{{ ('http://127.0.0.1:' ~ (cortex_port | default(8098))) if install_cortex | default(false) else '' }}"
    # NO MiniMax env, deliberately (2026-08-13). The catalog used to receive
    # NOS_MINIMAX_* here and inject an ANTHROPIC_* override into every agent
    # job — the estate-wide shape ruling 1 (docs/minimax-groundwork.md)
    # forbids. Backend selection is now a per-agent BINDING resolved by
    # AgentKit (state/llm-backends.yml + model.backend in agent.yml); the
    # catalog carries no backend env at all, and the arming envs
    # (NOS_ARMED_BACKENDS + the model-id envs) ride wing.plist where the
    # binding resolver runs.
  register: _pulse_catalog_raw
  changed_when: false
  check_mode: false
  no_log: true

- name: "[pazny.wing] Parse Pulse job catalog"
  ansible.builtin.set_fact:
    _pulse_catalog: "{{ _pulse_catalog_raw.stdout | from_json }}"

- name: "[pazny.wing] Drop Pulse jobs of retired agents"
  # Runs BEFORE the upsert, so an id that is still declared wins.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ wing_port | default(9000) }}/api/v1/pulse_jobs/{{ item }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ wing_api_token }}"
    status_code: [200, 404]
  loop: "{{ wing_pulse_retired_jobs }}"
  changed_when: false

- name: "[pazny.wing] Register discovered Pulse jobs (idempotent upsert)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ wing_port | default(9000) }}/api/v1/pulse_jobs"
    method: POST
    headers:
      Authorization: "Bearer {{ wing_api_token }}"
    body_format: json
    body:
      plugin_name: "{{ item.plugin_name | regex_replace('-base$', '') }}"
      job_name: "{{ item.job.name }}"
      command: "{{ item.job.command }}"
      runner: "{{ item.job.runner | default('subprocess') }}"
      schedule: "{{ item.job.schedule }}"
      jitter_min: "{{ item.job.jitter_min | default(0) }}"
      max_runtime_s: "{{ item.job.max_runtime_s | default(300) }}"
      max_concurrent: "{{ item.job.max_concurrent | default(1) }}"
      env: "{{ item.job.env | default({}) }}"
      # 2026-08-06. This body is an ALLOW-LIST, so a field a manifest declares
      # and this block omits is dropped in silence — which is exactly how
      # args[] went missing in May. `omit` rather than a default: absent must
      # reach Wing as NULL ("not declared"), not as [] or "" ("declared empty").
      findings_exit_codes: "{{ item.job.findings_exit_codes | default(omit) }}"
      category: "{{ item.job.category | default(omit) }}"
      # A9.4 (2026-05-17): args[] propagation. Wing dispatch jobs use
      # `command: php` + `args: [<script>]` shape; previously the
      # POST body dropped args silently and Pulse forked `php` with no
      # script. Surfaced live 2026-05-17 on the first re-run after the
      # A9 batch landed (wing:dispatch-notifications stored args_json=[]).
      args: "{{ item.job.args | default([]) }}"
      # A9.3 (2026-05-17): paused-by-default support — introduced for the
      # remediator agent (retired 2026-08-26; its launcher is gone but the
      # pattern stays for every on-demand job). Repository upsert
      # honors paused/paused_reason on FIRST insert; preserves operator
      # manual pause state on subsequent updates.
      paused: "{{ (item.job.paused | default(false)) | bool | ternary(1, 0) }}"
      paused_reason: "{{ item.job.paused_reason | default(omit) }}"
    status_code: [200, 201]
  loop: "{{ _pulse_catalog }}"
  loop_control:
    label: "{{ item.plugin_name }}:{{ item.job.name }}"
  register: _pulse_jobs_reg
  retries: 3
  delay: 5
  until: _pulse_jobs_reg.status in [200, 201]
  changed_when: _pulse_jobs_reg.status == 201
  no_log: true

# ── Local .env for Playwright + Wing ─────────────────────────────────────────
# Lives outside the bind-mount so it isn't part of the container payload.

- name: "[pazny.wing] Write .env with API token + e2e credentials"
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/wing/.env"
    mode: '0600'
    content: |
      # Auto-generated by pazny.wing — do not edit
      WING_API_TOKEN={{ wing_api_token }}
      WING_URL=https://{{ wing_domain | default('wing' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}
      DEV_DOMAIN={{ tenant_domain | default('dev.local') }}
