---
# ==============================================================================
# pazny.wing/tasks/main.yml — RENDER PHASE.
#
# Anatomy A3.5 (2026-05-04): Wing now runs as a host launchd daemon backed by
# FrankenPHP (single binary = PHP runtime + Caddy HTTP server). Replaces the
# Track-A `wing` PHP-FPM container + `wing-nginx` sidecar pair. Mirrors A3a
# Bone host-revert.
#
# Steps:
#   1. Track-A reversal cleanup — stop + remove legacy wing/wing-nginx
#      containers, retire compose override, drop sidecar nginx config.
#      Idempotent: no-ops on a fresh install.
#   2. Ensure runtime directories exist.
#   3. Install frankenphp via Homebrew (idempotent).
#   4. Rsync app source from files/anatomy/wing/ to ~/wing/app/.
#   5. Composer install (host-native — no docker run anymore).
#   6. Render Caddyfile + launchd plist.
#   7. Bootstrap launchd job.
#
# DB init + token reconverge stay in tasks/post.yml (called from
# tasks/stacks/stack-up.yml after the iiab stack is up — keeps the same
# ordering invariant; post.yml now runs everything host-native too).
# ==============================================================================

- name: "[pazny.wing] Skip when install_wing: false"
  ansible.builtin.meta: end_play
  when: not (install_wing | default(true))   # stock-Jinja: meta: when: is filter-less on 2.20.6

# ── Track-A reversal cleanup ─────────────────────────────────────────────────
# Stop + remove the wing + wing-nginx containers if they exist from a prior
# (Track A) run. Idempotent: when no containers exist (fresh install or
# already-reverted host), all four steps no-op. The compose-override fragment
# is also removed so the next `docker compose up iiab` doesn't try to recreate
# the containers.

- name: "[pazny.wing] Track-A reversal — check if legacy wing containers exist"
  ansible.builtin.shell: |
    {{ docker_bin | default('/usr/local/bin/docker') }} ps -a \
      --filter "name=^wing(-nginx)?$" --format "{{ '{{' }}.Names{{ '}}' }}"
  register: _wing_container_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: "[pazny.wing] Track-A reversal — stop + remove legacy containers"
  ansible.builtin.shell: |
    {{ docker_bin | default('/usr/local/bin/docker') }} compose -p iiab stop wing wing-nginx 2>/dev/null || true
    {{ docker_bin | default('/usr/local/bin/docker') }} rm -f wing wing-nginx 2>/dev/null || true
  register: _wing_container_teardown
  changed_when: (_wing_container_check.stdout | default('') | length) > 0
  when: (_wing_container_check.stdout | default('') | length) > 0

- name: "[pazny.wing] Track-A reversal — remove stale compose override"
  ansible.builtin.file:
    path: "{{ stacks_dir }}/iiab/overrides/wing.yml"
    state: absent

- name: "[pazny.wing] Track-A reversal — remove stale wing-nginx sidecar config"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/wing/wing-nginx.conf"
    state: absent

# ── Runtime directories ──────────────────────────────────────────────────────

- name: "[pazny.wing] Ensure runtime directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ wing_runtime_dir }}"
    - "{{ wing_app_dir }}"
    - "{{ wing_data_dir }}"
    - "{{ wing_app_dir }}/temp"
    - "{{ wing_runtime_dir }}/repos"
    - "{{ wing_runtime_dir }}/patches"
    - "{{ wing_runtime_dir }}/caddy-data"
    - "{{ wing_runtime_dir }}/caddy-config"

# SEC-2 (2026-05-23): the log directory holds Tracy's exception-*.html
# dumps which CAN contain partial env-block fragments even with the
# $keysToHide filter (Tracy redacts values but key names + structural
# context might still leak service-graph info). Lock to 0700 so no
# local UID can list or read.
- name: "[pazny.wing] Ensure log directory exists at 0700"
  ansible.builtin.file:
    path: "{{ wing_log_dir }}"
    state: directory
    mode: '0700'

# ── FrankenPHP runtime ───────────────────────────────────────────────────────
# FrankenPHP lives in the dunglas/frankenphp tap (added globally via
# default.config.yml's homebrew_taps list — pazny.mac.homebrew installs the
# tap in pre-stack phase). The formula depends on shivammathur/php's php-zts
# (also tapped). Both taps must exist before this task runs; if they're
# missing, brew prints a clear error pointing at the tap name.

- name: "[pazny.wing] Resolve FrankenPHP + composer paths per platform"
  ansible.builtin.set_fact:
    _wing_frankenphp_bin: "{{ frankenphp_bin if (ansible_os_family == 'Darwin') else (ansible_facts['env']['HOME'] ~ '/.local/bin/frankenphp') }}"
    # composer.phar location + how to invoke it. macOS runs it against php-zts
    # on PATH; Linux runs it through FrankenPHP's embedded PHP (no separate php).
    _wing_composer_phar: "{{ (homebrew_prefix | default('/opt/homebrew') ~ '/bin/composer') if (ansible_os_family == 'Darwin') else (ansible_facts['env']['HOME'] ~ '/.local/bin/composer.phar') }}"
    _wing_composer_cmd: "{{ 'composer' if (ansible_os_family == 'Darwin') else (ansible_facts['env']['HOME'] ~ '/.local/bin/frankenphp php-cli ' ~ ansible_facts['env']['HOME'] ~ '/.local/bin/composer.phar') }}"

# ---- macOS: Homebrew tap (php-zts dep) ----
- name: "[pazny.wing] Install frankenphp via Homebrew"
  community.general.homebrew:
    name: dunglas/frankenphp/frankenphp
    state: present
  register: _wing_frankenphp_install
  when: ansible_os_family == 'Darwin'

# frankenphp + its libphp (php-zts, dunglas tap) dynamically link a set of
# libs the tap formulae DO NOT declare as runtime deps, so `brew autoremove`
# prunes them as "unused" leaves → dangling dylib → dyld abort → `version`
# returns rc=-6 empty and the preflight below refuses. Observed pruned on this
# host: freetds (2026-07-15), then gd/libpq/argon2/watcher (frankenphp binary)
# and tidy-html5/net-snmp/openldap (libphp.dylib) on the 2026-07-17 blank run.
# Installing them EXPLICITLY makes each a leaf brew won't autoremove;
# `state: present` is a no-op once there, so this also self-heals a host where
# they were already pruned. Audit after a frankenphp bump:
#   otool -L $(brew --prefix)/bin/frankenphp
#   otool -L $(brew --prefix)/Cellar/php-zts/*/lib/libphp.dylib
- name: "[pazny.wing] Ensure frankenphp runtime deps (autoremove-proof)"
  community.general.homebrew:
    name:
      - freetds
      - gd
      - libpq
      - argon2
      - watcher
      - tidy-html5
      - net-snmp
      - openldap
    state: present
  when: ansible_os_family == 'Darwin'

# ---- Linux: static binary (self-contained PHP — NEEDS-VM-VALIDATION) ----
# FrankenPHP ships a static per-arch binary on GitHub releases; its embedded
# PHP also runs composer via `frankenphp php-cli`, so no separate php package
# is needed. Validate the asset name/arch + php-cli behaviour on Ubuntu 24.04.
- name: "[pazny.wing] (Linux) Ensure ~/.local + bin exist (operator-owned)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    mode: '0755'
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.local"
    - "{{ ansible_facts['env']['HOME'] }}/.local/bin"
  # ~/.local can be left root-owned by an earlier become/pip step (or the CI
  # runner image); chown it back so the operator-context frankenphp + composer
  # downloads below can write here without become.
  become: true
  when: ansible_os_family != 'Darwin'

# The URL must carry the PIN, not `latest`. It fetched
# releases/latest/download/… while the preflight below asserted the binary
# equals `frankenphp_version` — two facts nobody could keep in agreement, so
# Linux worked only until upstream cut a release. It broke the moment 1.12.6
# landed (CI 2026-07-22) while macOS, whose version comes from the brew
# formula, stayed on the pinned 1.12.4. A pin that does not govern the fetch
# pins nothing. Pinned by tests/anatomy/test_pinned_artifacts_fetch_the_pin.py.
- name: "[pazny.wing] (Linux) Download FrankenPHP static binary"
  ansible.builtin.get_url:
    url: "https://github.com/dunglas/frankenphp/releases/download/v{{ frankenphp_version }}/frankenphp-linux-{{ 'aarch64' if ansible_architecture in ['aarch64', 'arm64'] else 'x86_64' }}"
    dest: "{{ _wing_frankenphp_bin }}"
    mode: '0755'
    timeout: 60   # default 10s times out on a slow github.com release CDN
  register: _wing_frankenphp_dl
  until: _wing_frankenphp_dl is succeeded
  retries: 5
  delay: 10
  when: ansible_os_family != 'Darwin'

- name: "[pazny.wing] Stat frankenphp binary"
  ansible.builtin.stat:
    path: "{{ _wing_frankenphp_bin }}"
  register: _wing_frankenphp_stat

- name: "[pazny.wing] Refuse to continue when frankenphp binary missing"
  ansible.builtin.fail:
    msg: |
      frankenphp binary not found at {{ _wing_frankenphp_bin }}.
        macOS: brew tap shivammathur/php + dunglas/frankenphp, then
               `brew list dunglas/frankenphp/frankenphp`.
        Linux: verify the GitHub release asset name/arch in this role.
  when: not _wing_frankenphp_stat.stat.exists

# Version preflight — the landed binary must report frankenphp_version. Catches
# a stale tap, a half-finished source build (no arm64_sequoia bottle on older
# macOS), or a missing Linux release asset before launchd ever execs it. The
# install path is architecture-agnostic (one ARM64 binary across M1..M5), so a
# wrong/empty `--version` is the real signal, not the chip generation.
- name: "[pazny.wing] Read frankenphp version"
  ansible.builtin.command: "{{ _wing_frankenphp_bin }} --version"
  register: _wing_frankenphp_ver
  changed_when: false
  failed_when: false

- name: "[pazny.wing] Refuse on frankenphp version mismatch"
  ansible.builtin.fail:
    msg: |
      frankenphp at {{ _wing_frankenphp_bin }} did not report the pinned
      version {{ frankenphp_version }} (rc={{ _wing_frankenphp_ver.rc }}).
        Reported: {{ _wing_frankenphp_ver.stdout | default('(none)') | trim }}
        macOS: `brew upgrade dunglas/frankenphp/frankenphp` — the arm64_sequoia
               bottle only exists on macOS 15+; older macOS source-builds (needs
               Go). Then re-pin frankenphp_version in default.config.yml.
        Linux: re-run to re-fetch the GitHub release static binary.
  when: >-
    _wing_frankenphp_ver.rc != 0
    or ('FrankenPHP v' ~ frankenphp_version) not in (_wing_frankenphp_ver.stdout | default(''))

# ── App source sync ──────────────────────────────────────────────────────────
# Same rsync pattern as before — Wing source lives in files/anatomy/wing/
# (anatomy A2). The exclude list keeps gitignored runtime artefacts out of
# the deploy target.

- name: "[pazny.wing] Rsync app source to host"
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/files/anatomy/wing/"
    dest: "{{ wing_app_dir }}/"
    delete: true
    rsync_opts:
      - "--exclude=data/"
      - "--exclude=temp/"
      - "--exclude=log/"
      - "--exclude=vendor/"
      - "--exclude=*.bak"
      - "--exclude=.git/"
      - "--exclude=tests/node_modules/"
      - "--exclude=tests/playwright-report/"
      - "--exclude=tests/test-results/"
      - "--exclude=tests/.env"
  delegate_to: "{{ inventory_hostname }}"
  register: _wing_app_sync
  notify: Restart wing

# The rsync excludes temp/ (preserving runtime cache), but Nette compiles the
# DI container + Latte templates into temp/cache. When app source changes
# (e.g. a presenter gains a constructor arg), the STALE compiled container
# calls the new class with the old signature → ArgumentCountError → 500 on the
# affected page. Clear the compiled cache whenever the source changed so Nette
# recompiles on the next request. (A live /hub 500 — HubPresenter +1 arg — hit
# exactly this; the Restart-wing handler alone doesn't recompile the container.)
- name: "[pazny.wing] Clear compiled cache (DI container + Latte) on source change"
  ansible.builtin.file:
    path: "{{ wing_app_dir }}/temp/cache"
    state: absent
  when: _wing_app_sync is changed
  notify: Restart wing

# ── AgentKit definitions sync ─────────────────────────────────────────────────
# The PHP AgentLoader is wired in common.neon as
# `AgentLoader(%appDir%/../../agents)`. In the repo %appDir% is
# files/anatomy/wing/app, so the loader root is the sibling
# files/anatomy/agents (correct for CLI + pytest). Deployed, the app-source
# rsync nests files/anatomy/wing/ inside {{ wing_app_dir }} (~/wing/app), so
# %appDir% becomes ~/wing/app/app and `../../agents` resolves to ~/wing/agents.
# Without this task that path is empty — the Wing /agents catalog renders blank
# and every /agents/<name> detail/session 404s ("Agent not loadable"). The
# dir-form <name>/agent.yml definitions (validated by test_agent_schema.py) are
# the AgentKit source; the flat <name>.yml siblings are Pulse profiles consumed
# from the repo path and are harmless here (AgentLoader::listAvailable only
# scans subdirectories with an agent.yml). Distinct from OpenClaw's ~/agents.
- name: "[pazny.wing] Sync AgentKit definitions to host"
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/files/anatomy/agents/"
    dest: "{{ wing_home }}/agents/"
    delete: true
    rsync_opts:
      - "--exclude=.git/"
      - "--exclude=*.bak"
  delegate_to: "{{ inventory_hostname }}"

# ── Composer install (host-native, no docker run) ────────────────────────────
# Replaces the Track-A `docker compose run --rm wing-cli composer install`
# pattern.
#
# 2026-05-11 — `composer` is NOT installed via Homebrew. The `composer`
# formula pulls `php` as a hard dep, and `brew link php` collides with
# `php-zts` (which frankenphp requires; both formulas own the same
# `/opt/homebrew/bin/php`, `/opt/homebrew/include/php/TSRM/*`, …). We
# install composer.phar directly into /opt/homebrew/bin/composer — it's
# a single PHP script that runs against whatever `php` is on PATH (i.e.
# php-zts), so no symlink conflict.
- name: "[pazny.wing] Stat composer binary"
  ansible.builtin.stat:
    path: "{{ _wing_composer_phar }}"
  register: _composer_stat

- name: "[pazny.wing] Download composer.phar (official installer)"
  ansible.builtin.get_url:
    url: "https://getcomposer.org/composer-stable.phar"
    dest: "{{ _wing_composer_phar }}"
    mode: '0755'
    force: false
  when: not _composer_stat.stat.exists

- name: "[pazny.wing] Stat vendor/autoload.php"
  ansible.builtin.stat:
    path: "{{ wing_app_dir }}/vendor/autoload.php"
  register: _wing_autoload_stat

- name: "[pazny.wing] Stat composer.lock"
  ansible.builtin.stat:
    path: "{{ wing_app_dir }}/composer.lock"
  register: _wing_lock_stat

# Pre-flight (2026-05-07): catch composer.json/composer.lock drift BEFORE
# `composer install` exits 4 with a cryptic "lock file is not up to date"
# trace deep in the playbook. `composer validate --strict` fails fast with
# the SAME diagnosis but at a place the operator can actually act on
# (right before the install task, with the CWD already set). The
# matching pytest in tests/test_lockfile_sync.py is the CI gate that
# stops a drifted commit landing in the first place; this is the
# operator-side belt to that suspenders.
- name: "[pazny.wing] Pre-flight — composer validate --strict (lockfile sync gate)"
  ansible.builtin.command:
    cmd: "{{ _wing_composer_cmd }} validate --strict --no-check-publish"
    chdir: "{{ wing_app_dir }}"
  register: _wing_composer_validate
  changed_when: false
  failed_when: _wing_composer_validate.rc != 0
  when: _wing_lock_stat.stat.exists

- name: "[pazny.wing] Run composer install (vendor missing or lock newer)"
  ansible.builtin.command:
    cmd: "{{ _wing_composer_cmd }} install --no-dev --optimize-autoloader --no-interaction"
    chdir: "{{ wing_app_dir }}"
  register: _wing_composer
  changed_when: "'Nothing to install' not in (_wing_composer.stdout | default('')) or _wing_composer.rc != 0"
  when: >
    not _wing_autoload_stat.stat.exists
    or (_wing_lock_stat.stat.exists
        and _wing_autoload_stat.stat.mtime < _wing_lock_stat.stat.mtime)
  notify: Restart wing

# ── DB schema BEFORE the daemon serves (ordering fix, 2026-05-26) ─────────────
# Pre-this, init-db ran only in post.yml (stack-up phase, minutes later). But
# the daemon bootstraps just below and Pulse immediately polls
# /api/v1/pulse_jobs/due → Nette threw "Table 'api_tokens' does not exist" 500s
# for the whole window (Tracy-dumped 30× on the 2026-05-25 blank). Creating the
# schema here (idempotent, standalone CLI) means the daemon serves a ready DB
# from request #1. post.yml re-runs init-db harmlessly + does the migrate/ingest
# steps that genuinely need the running daemon.
- name: "[pazny.wing] Initialize SQLite schema BEFORE daemon start"
  ansible.builtin.command:
    cmd: "{{ ('php' if ansible_os_family == 'Darwin' else (_wing_frankenphp_bin ~ ' php-cli')) }} bin/init-db.php --data-dir={{ wing_data_dir }}"
    chdir: "{{ wing_app_dir }}"
  register: _wing_initdb_pre
  changed_when: "'Created' in (_wing_initdb_pre.stdout | default(''))"

# ── Caddyfile + launchd plist ────────────────────────────────────────────────

- name: "[pazny.wing] Render Caddyfile"
  ansible.builtin.template:
    src: wing.Caddyfile.j2
    dest: "{{ wing_caddyfile_path }}"
    mode: '0644'
  notify: Restart wing

- name: "[pazny.wing] Render launchd plist"
  ansible.builtin.template:
    src: wing.plist.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ wing_launchd_label }}.plist"
    # 0600: the plist embeds AUTHENTIK_BOOTSTRAP_TOKEN, INFISICAL_API_TOKEN,
    # STALWART_ADMIN_PASSWORD, BONE_SECRET, NOS_DEPLOY_HMAC_SECRET,
    # WING_API_TOKEN, WING_EVENTS_HMAC_SECRET — admin-level credentials
    # for every connected service. Anything more permissive lets peer
    # processes (Spotlight indexers, third-party backup agents, other
    # launchd jobs running as the same user, anyone with Full Disk
    # Access) walk away with the full credential surface. launchctl
    # reads the file ONCE at bootstrap; 0600 doesn't interfere with the
    # bootstrap or with later "Restart wing" handler kicks.
    mode: '0600'
  notify: Restart wing
  when: (nos_service_manager | default('launchd')) == 'launchd'

# ── Linux: systemd --user (env via EnvironmentFile, NEEDS-VM-VALIDATION) ──────
# Caddyfile (rendered above) is cross-platform; FrankenPHP runs it the same way.
# wing.env mirrors the plist's EnvironmentVariables; the unit references it via
# EnvironmentFile=. Validate FrankenPHP run + Caddyfile + php-cli on Ubuntu.
- name: "[pazny.wing] (Linux) Render systemd EnvironmentFile (0600 — secrets)"
  ansible.builtin.template:
    src: wing.env.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/wing.env"
    mode: '0600'
  notify: Restart wing
  when: (nos_service_manager | default('launchd')) == 'systemd-user'

- name: "[pazny.wing] (Linux) Install systemd --user service"
  ansible.builtin.include_role:
    name: pazny.linux.systemd_user
    tasks_from: ensure_unit
  vars:
    su_name: "{{ wing_launchd_label }}"
    su_description: "nOS Wing — FrankenPHP security-research dashboard"
    su_exec_start: "{{ _wing_frankenphp_bin }} run --config {{ wing_caddyfile_path }}"
    su_working_dir: "{{ wing_app_dir }}"
    su_environment_file: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/wing.env"
  when: (nos_service_manager | default('launchd')) == 'systemd-user'

# ── Launchd bootstrap (idempotent) ───────────────────────────────────────────
# Same pattern as A3a Bone + A4 Pulse. `launchctl print` returns 0 when the
# job is registered; if so, kickstart -k for graceful restart on plist change.
# Otherwise, bootstrap the agent into the user's launchd domain.
#
# A17 (2026-05-20) hardening: post-bootstrap health probe with fail-loud
# diagnostic. Pre-A17 the bootstrap was `failed_when: false` so a
# plist syntax error / port conflict / missing dep silently left the
# daemon down — surfaced live 2026-05-18 when wing.pazny.eu was 502
# despite green playbook run. New behavior: probe `http://127.0.0.1:
# {{ wing_port }}/` 20× with 0.5s intervals; if all 20 fail, dump
# `launchctl print` output to the playbook log AND fail the play.
# Operators see the root cause immediately, not 2 days later.

- name: "[pazny.wing] Bootstrap launchd job (idempotent)"
  ansible.builtin.shell: |
    PLIST=~/Library/LaunchAgents/{{ wing_launchd_label }}.plist
    UID_NUM=$(id -u)
    if launchctl print "gui/${UID_NUM}/{{ wing_launchd_label }}" >/dev/null 2>&1; then
      launchctl kickstart -k "gui/${UID_NUM}/{{ wing_launchd_label }}"
      echo "already-loaded"
    else
      launchctl bootstrap "gui/${UID_NUM}" "$PLIST"
      echo "bootstrapped"
    fi
  register: _wing_launchd_bootstrap
  # Same idempotence signal as pazny.bone: changed only on a real bootstrap.
  # A steady-state re-run kickstarts (graceful restart) but is changed=0.
  changed_when: "'bootstrapped' in _wing_launchd_bootstrap.stdout"
  failed_when: false
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[pazny.wing] Wait for daemon to bind {{ wing_port }} (health probe)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ wing_port }}/"
    method: GET
    status_code: [200, 301, 302, 401, 403]  # any sign of life — auth-gated paths return 401/403
    timeout: 2
  register: _wing_post_bootstrap_probe
  retries: 20
  delay: 1
  until: _wing_post_bootstrap_probe.status | default(0) | int > 0
  failed_when: false

- name: "[pazny.wing] Diagnose dead daemon (only if probe never landed)"
  # macOS launchctl/lsof diagnostics; Linux uses `journalctl --user -u wing`.
  ansible.builtin.shell: |
    set -o pipefail
    UID_NUM=$(id -u)
    echo "=== launchctl print ==="
    launchctl print "gui/${UID_NUM}/{{ wing_launchd_label }}" 2>&1 | grep -E "state |last exit code|stdout|stderr|pid" | head -10 || true
    echo ""
    echo "=== last 20 lines of launchd.err.log ==="
    tail -20 "{{ wing_log_dir }}/launchd.err.log" 2>/dev/null || echo "(no stderr log)"
    echo ""
    echo "=== port {{ wing_port }} listener ==="
    lsof -nP -iTCP:{{ wing_port }} -sTCP:LISTEN 2>&1 | head -5 || echo "(port not bound)"
  args:
    executable: /bin/bash
  register: _wing_diagnose
  changed_when: false
  when: _wing_post_bootstrap_probe.status | default(0) | int == 0

- name: "[pazny.wing] Fail-loud if daemon never came up"
  ansible.builtin.fail:
    msg: |
      Wing daemon did not bind 127.0.0.1:{{ wing_port }} within 20 seconds
      after launchctl bootstrap. Diagnostic:
      {{ _wing_diagnose.stdout | default('(diagnose task skipped)') }}

      Common causes:
        - plist syntax error (validate with `plutil -lint`)
        - port {{ wing_port }} already bound by another process
        - FrankenPHP missing / wrong path (check {{ frankenphp_bin }})
        - app/Bootstrap.php composer autoload failure (check
          {{ wing_log_dir }}/launchd.err.log for fatal PHP errors)
  when: _wing_post_bootstrap_probe.status | default(0) | int == 0

- name: "[pazny.wing] Setup summary"
  ansible.builtin.debug:
    msg: |
      ════════════════════════════════════════════════════════════
       pazny.wing — A3.5 host runtime via FrankenPHP
      ════════════════════════════════════════════════════════════
       Binary:       {{ frankenphp_bin }}
       Caddyfile:    {{ wing_caddyfile_path }}
       Plist:        ~/Library/LaunchAgents/{{ wing_launchd_label }}.plist
       Bind:         127.0.0.1:{{ wing_port }}
       Source:       {{ wing_app_dir }} (rsync from files/anatomy/wing/)
       Logs:         {{ wing_log_dir }}/launchd.{out,err}.log
       Traefik:      wing.{{ tenant_domain | default('dev.local') }} → host.docker.internal:{{ wing_port }}
      ════════════════════════════════════════════════════════════
