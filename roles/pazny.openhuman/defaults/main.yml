---
# Internals only. Operator-facing switches (install_openhuman, openhuman_*) live in the default layers.
openhuman_home: "{{ ansible_facts['env']['HOME'] }}/.openhuman"
# "Login locally" makes users/local-<slug of the hostname>, not users/local (core
# credentials/session_support.rs local_session_user_id); the role writes both.
openhuman_hostname: "{{ ansible_facts['nodename'] | default('') }}"
openhuman_app: /Applications/OpenHuman.app
openhuman_claude_default_model: sonnet    # OpenHuman's own CLAUDE_CODE_DEFAULT_MODEL
openhuman_keap_container: iiab-keap-1
# The tree being converged: IMPRINT.md and the skills are COPIED from it (contents, not a path).
openhuman_source_dir: "{{ playbook_dir }}"
# KEAP's embedder (pazny.keap keap_embed_model), already pulled by nOS; 768 is its width.
openhuman_embed_model: nomic-embed-text
openhuman_embed_dimensions: 768
