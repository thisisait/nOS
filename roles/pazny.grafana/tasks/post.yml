---
# ==============================================================================
# pazny.grafana/tasks/post.yml — admin password reconverge
#
# The GF_SECURITY_ADMIN_PASSWORD env var is only read on the first DB initialization.
# Pro non-blank runy (edited credentials.yml) potrebujeme explicitni password
# reset via grafana-cli, which overwrites the hash in the sqlite DB on every run.
# A blank run triggers this task too — harmless, the password is already the same from env vars.
# ==============================================================================

- name: "[pazny.grafana Post] Check if Grafana container is running"
  ansible.builtin.shell: >
    {{ docker_bin }} ps -q
    --filter "label=com.docker.compose.project=observability"
    --filter "label=com.docker.compose.service=grafana"
  register: _grafana_container
  changed_when: false
  failed_when: false
  check_mode: false

- name: "[pazny.grafana Post] Wait for Grafana HTTP API to be ready"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port | default(3000) }}/api/health"
    status_code: [200]
    timeout: 5
  register: _grafana_health
  retries: 20
  delay: 3
  until: _grafana_health.status | default(0) == 200
  when: _grafana_container.stdout | default('') | length > 0
  failed_when: false

# Ask before resetting. The reset ran on EVERY converge, reported changed and
# fired "Restart grafana" each time — on every platform (cloud e2e idempotence
# tier, 2026-09-26). The current password logging in means there is nothing
# to reconverge; only a 401 does.
- name: "[pazny.grafana Post] Does the declared admin password already log in?"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port | default(3000) }}/api/user"
    user: "{{ grafana_admin_user | default('admin') }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 401]
    timeout: 5
  register: _grafana_pw_probe
  when:
    - _grafana_container.stdout | default('') | length > 0
    - _grafana_health.status | default(0) == 200
  failed_when: false
  check_mode: false
  no_log: true

- name: "[pazny.grafana Post] Reconverge admin password (grafana-cli reset-admin-password)"
  ansible.builtin.shell: |
    {{ docker_bin }} compose -p observability exec -T grafana \
      grafana-cli admin reset-admin-password {{ grafana_admin_password | quote }} 2>&1
  register: _grafana_pw_reset
  when:
    - _grafana_container.stdout | default('') | length > 0
    - _grafana_health.status | default(0) == 200
    - (_grafana_pw_probe.status | default(-1)) != 200
  changed_when: "'Admin password changed successfully' in (_grafana_pw_reset.stdout | default(''))"
  failed_when: false
  check_mode: false
  no_log: true
  notify: Restart grafana
