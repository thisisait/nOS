---
# ==============================================================================
# pazny.gitlab/tasks/post.yml — root password reconverge (state-declarative)
#
# GitLab Omnibus auto-generates a root password into /etc/gitlab/initial_root_password
# (disappears after 24h). Reconverge uses `gitlab-rails runner` to overwrite root
# password from credentials.yml. Runs on every playbook run; idempotent-on-write.
# ==============================================================================

- name: "[pazny.gitlab Post] Check if GitLab container is running"
  ansible.builtin.shell: >
    {{ docker_bin }} ps -q
    --filter "label=com.docker.compose.project=devops"
    --filter "label=com.docker.compose.service=gitlab"
  register: _gitlab_container
  changed_when: false
  failed_when: false

- name: "[pazny.gitlab Post] Wait for GitLab web API (/-/readiness)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ gitlab_http_port | default(8929) }}/-/readiness"
    status_code: [200]
    timeout: 5
  register: _gitlab_ready
  retries: 60  # GitLab startup je 2-5 min, Omnibus init je pomaly
  delay: 10
  until: _gitlab_ready.status | default(0) == 200
  when: _gitlab_container.stdout | default('') | length > 0
  failed_when: false

# Rails runner is the safest path — it writes directly to the User model without rake prompts.
# Idempotent: sets the same password on every run (bcrypt re-hashes automatically),
# so `password changed` always reports -> we fix changed_when on a stdout marker.
# Standalone Ruby (files/anatomy/scripts/gitlab-root-password.rb) via stdin +
# env pass-through — no Jinja-in-heredoc, no shell-quoting fragility, password
# never in argv/ps. String CONCAT in the script — the previous escaped-quote-
# inside-Ruby-interpolation was a SyntaxError that silently killed this whole
# script on EVERY run since it shipped ("GitLab root pw: FAILED —" with empty
# stdout; the parse error went to stderr, never shown). Review CRIT 2026-06-10.
# KNOWN: GitLab's weak-password check rejects the prefix-derived default (it
# contains "gitlab" → "commonly used combinations") — now VISIBLE in the status
# below; set a custom gitlab_admin_password in credentials.yml to converge it.
- name: "[pazny.gitlab Post] Reconverge root password via gitlab-rails runner"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p devops exec -e NOS_GITLAB_ROOT_PW
    -T gitlab gitlab-rails runner -
    < "{{ playbook_dir }}/files/anatomy/scripts/gitlab-root-password.rb"
  environment:
    NOS_GITLAB_ROOT_PW: "{{ gitlab_admin_password | default(nos_derived_secrets.gitlab) }}"
  register: _gitlab_pw_reset
  when: _gitlab_ready.status | default(0) == 200
  changed_when: "'UPDATED' in (_gitlab_pw_reset.stdout | default(''))"
  failed_when: false
  no_log: true

- name: "[pazny.gitlab Post] Password reconverge status"
  ansible.builtin.debug:
    msg: >-
      GitLab root pw:
      {{ 'updated' if ('UPDATED' in (_gitlab_pw_reset.stdout | default('')))
         else ('skipped (not ready)' if (_gitlab_ready.status | default(0) != 200)
               else 'FAILED — stdout: ' ~ (_gitlab_pw_reset.stdout | default(''))
                    ~ ' stderr: ' ~ (_gitlab_pw_reset.stderr | default('') | truncate(300))) }}
  when: _gitlab_container.stdout | default('') | length > 0

# ── T32.2 (2026-06-10): GitLab agent forge — local MR review surface. Opt-in;
# default OFF. Provisions the nOS project + a PAT for tools/recipe-pr.sh.
- name: "[pazny.gitlab Post] Wire local-first agent forge (MR surface)"
  ansible.builtin.include_tasks: post-forge.yml
  when:
    - gitlab_agent_forge | default(false) | bool
    - _gitlab_ready.status | default(0) == 200

# Loud marker: forge requested but GitLab wasn't ready in the 600s wait → the
# include above silently skipped. Without this the play exits 0 with no PAT and
# no project, and the operator only finds out when recipe-pr.sh exits 2.
- name: "[pazny.gitlab Post] WARN — forge requested but GitLab not ready (SKIPPED)"
  ansible.builtin.debug:
    msg: >-
      gitlab_agent_forge=true but /-/readiness never returned 200 — the forge
      provisioning (PAT + nOS project) was SKIPPED. Re-run once GitLab is up:
      tools/nos-stacks.sh gitlab
  when:
    - gitlab_agent_forge | default(false) | bool
    - _gitlab_ready.status | default(0) != 200
