---
# ==============================================================================
# pazny.gitlab — GitLab CE in Docker (devops compose stack)
#
# Heavy Omnibus stack (~4 GB RAM at rest). Full devops platform
# (Git, CI/CD, registry, wiki, issues). Credentials (gitlab_admin_password)
# live in top-level default.credentials.yml.
# ==============================================================================

gitlab_version: "18.10.3-ce.0"          # aligned with default.config.yml (CVE-2026-5173, CVE-2026-1092, CVE-2025-12664)
gitlab_domain: "gitlab{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
gitlab_http_port: 8929                  # Internal HTTP port (nginx handles SSL)
gitlab_ssh_port: 2224                   # Git SSH (22=system, 2222=Gitea)
gitlab_data_dir: "{{ ansible_facts['env']['HOME'] }}/gitlab"
gitlab_config_dir: "{{ ansible_facts['env']['HOME'] }}/gitlab-config"
gitlab_timezone: "Europe/Prague"
gitlab_signup_enabled: false
gitlab_puma_workers: 2                  # Min 2; can bump to 4 on a 36 GB host
gitlab_sidekiq_concurrency: 10
gitlab_mem_limit: "{{ docker_mem_limit_heavy | default('4g') }}"
gitlab_cpus: "{{ docker_cpus_heavy | default('2.0') }}"

# ── T32.2 (2026-06-10): GitLab agent forge — the local MR review surface ──────
# The Gitea SSO lockout (oauth2 source row missing → /user/oauth2/authentik
# 500s; operator can't reach the Gitea UI) moved the operator-facing review
# surface to GitLab, whose native omniauth OIDC works. When
# gitlab_agent_forge=true, post-forge.yml ensures the nOS PROJECT exists
# (writable, created EMPTY — trunk is pushed from the operator host via
# tools/sync-trunk-to-gitlab.sh, keeping the loop local) and provisions a PAT
# for tools/recipe-pr.sh (MR creation), persisted as gitlab_api_token in
# ~/.nos/secrets.yml. Woodpecker CI stays on Gitea; GitHub stays the trunk.
gitlab_agent_forge: false
gitlab_nos_repo_owner: "root"
gitlab_nos_repo_name: "nOS"
gitlab_nos_repo_visibility: "private"
gitlab_forge_token_name: "nos-agent-forge"
gitlab_forge_token_scopes: ['api', 'write_repository']
