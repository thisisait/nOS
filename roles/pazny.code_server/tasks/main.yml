---
# ==============================================================================
# pazny.code_server/tasks/main.yml
#
# Called (in Phase B) from tasks/stacks/stack-up.yml BEFORE `docker compose up devops`:
# creates data + workspace dirs, renders the compose override fragment to
# {{ stacks_dir }}/devops/overrides/code-server.yml a linkuje nginx vhost.
#
# No post-start setup required — code-server is a stateless web editor,
# authentication is handled by Authentik forward_auth in nginx.
# ==============================================================================

- name: "[pazny.code_server] Ensure data and workspace directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ code_server_data_dir }}"
    - "{{ code_server_workspace_dir }}"

- name: "[pazny.code_server] Render compose override fragment"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/devops/overrides/code-server.yml"
    mode: '0600'
  notify: Restart code_server

# Same condition as the compose port bind: LAN asked for, no login hash, so it stays local.
- name: "[pazny.code_server] WARN LAN bind refused, no login hash"
  ansible.builtin.debug:
    msg: >-
      code-server stays on 127.0.0.1: services_lan_access is on but code_server_hashed_password
      is empty (credentials.yml; an argon2 hash)
  when:
    - services_lan_access | default(false)
    - not (code_server_hashed_password | default(''))

# Linux routes via Traefik; host-nginx per-service vhosts are macOS-only.
- name: "[pazny.code_server] Enable nginx vhost"
  ansible.builtin.file:
    src: "{{ homebrew_prefix }}/etc/nginx/sites-available/code-server.conf"
    dest: "{{ homebrew_prefix }}/etc/nginx/sites-enabled/code-server.conf"
    state: link
    force: true
  notify: Restart nginx
  when:
    - install_nginx | default(true)
    - ansible_os_family == 'Darwin'
