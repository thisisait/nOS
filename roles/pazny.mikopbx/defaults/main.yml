---
# pazny.mikopbx — install-only. SSO / Traefik / GDPR live in mikopbx-base.
#
# Image: mikopbx/mikopbx (GPL-3.0, multi-arch, Asterisk 22 + SQLite + Redis
# inside — no infra DB). Version pin and ports live in default.config.yml.
#
# First boot reads WEB_ADMIN_PASSWORD / SIP_PORT / RTP_PORT_* from env ONCE
# (DockerCloud provisioning marks itself done); every later change is pushed
# through the REST API by tasks/post.yml and read back there.

mikopbx_mem_limit: "{{ docker_mem_limit_standard | default('1g') }}"
mikopbx_cpus: "{{ docker_cpus_standard | default('1.0') }}"
