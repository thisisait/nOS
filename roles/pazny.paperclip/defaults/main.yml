---
# ==============================================================================
# pazny.paperclip — Paperclip multi-agent orchestration platform (devops stack)
#
# Coordinates AI agents (OpenClaw, Claude Code, Codex) through an org-chart structure.
# Requires a Postgres backend (install_postgresql: true). Credentials
# (paperclip_db_password, paperclip_auth_secret) live in top-level
# default.credentials.yml.
# ==============================================================================

paperclip_mem_limit: "{{ docker_mem_limit_standard | default('1g') }}"
paperclip_cpus: "{{ docker_cpus_standard | default('1.0') }}"
