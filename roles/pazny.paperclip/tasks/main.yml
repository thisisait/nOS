---
# ==============================================================================
# pazny.paperclip/tasks/main.yml
#
# Called from tasks/stacks/stack-up.yml BEFORE `docker compose -p devops up`:
# creates the data dir and renders the compose override fragment to
# {{ stacks_dir }}/devops/overrides/paperclip.yml, which stack-up.yml then
# collects via `find` and passes as an additional -f flag.
#
# Paperclip is not part of the standard task/iiab/ set — pre-setup logic
# was minimal, a compose fragment render + data dir was enough.
#
# Post-start logic (allowed-hostname registration) lives in tasks/post.yml —
# called AFTER `docker compose up devops --wait` from stack-up.yml.
# ==============================================================================

- name: "[pazny.paperclip] Ensure data directory exists"
  ansible.builtin.file:
    path: "{{ paperclip_data_dir }}"
    state: directory
    mode: '0755'

- name: "[pazny.paperclip] Ensure the agents' workspace root exists"
  ansible.builtin.file:
    path: "{{ paperclip_workspaces_dir }}"
    state: directory
    mode: '0755'

# A host folder handed to Paperclip's agents is a client's project, never the estate's own
# state: ~/.nos holds the secrets and the estate checkout, the data root holds every service.
- name: "[pazny.paperclip] A host workspace is a project folder, not the estate's state"
  ansible.builtin.assert:
    that:
      - item.name is defined and item.name is match('^[a-z0-9][a-z0-9-]*$')
      - (item.path | realpath) != (ansible_facts['env']['HOME'] | realpath)
      - not ((item.path | realpath) ~ '/').startswith((ansible_facts['env']['HOME'] | realpath) ~ '/.nos/')
      - not (((nos_data_root | realpath) ~ '/').startswith((item.path | realpath) ~ '/'))
      - not ('/.git/' in ((item.path | realpath) ~ '/'))
    fail_msg: >-
      paperclip_host_workspaces entry {{ item }} is refused: a workspace is a project folder
      (e.g. ~/projects/<client>), never $HOME, ~/.nos, a .git dir or a folder containing the data root.
  loop: "{{ paperclip_host_workspaces | default([]) }}"

# A bare repo (HEAD + objects/ at its root) is a git dir without the .git name. Checked on the
# controller, which is the host (ansible_connection=local).
# stat, not the `is file` test: the profile builder evaluates role conditions with stock Jinja,
# which has no file tests (11-04: every profile-builder gate went red on it).
- name: "[pazny.paperclip] Stat each host workspace's HEAD (bare-repo check)"
  ansible.builtin.stat:
    path: "{{ item.path }}/HEAD"
  loop: "{{ paperclip_host_workspaces | default([]) }}"
  register: _pc_ws_head

- name: "[pazny.paperclip] Stat each host workspace's objects/ (bare-repo check)"
  ansible.builtin.stat:
    path: "{{ item.path }}/objects"
  loop: "{{ paperclip_host_workspaces | default([]) }}"
  register: _pc_ws_objects

- name: "[pazny.paperclip] A host workspace is not a bare repo"
  ansible.builtin.assert:
    that:
      - not ((_pc_ws_head.results[_i].stat.isreg | default(false)) and (_pc_ws_objects.results[_i].stat.isdir | default(false)))
    fail_msg: "paperclip_host_workspaces entry {{ item.name }} is refused: {{ item.path }} is a bare git repo, not a work tree."
  loop: "{{ paperclip_host_workspaces | default([]) }}"
  loop_control:
    index_var: _i

- name: "[pazny.paperclip] Ensure each host workspace exists"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0755'
  loop: "{{ paperclip_host_workspaces | default([]) }}"

# The compose .git overlay only where one exists: a bind mount creates a missing source,
# so an unconditional overlay planted an empty .git in every non-repo workspace on each up.
# A .git FILE (linked worktree) points at a gitdir outside the mount: the repo is broken in the
# container and the overlay protects nothing, so it is refused. Gate: test_paperclip_workspace_git_is_read_only.py.
- name: "[pazny.paperclip] Which host workspaces hold a .git"
  ansible.builtin.stat:
    path: "{{ item.path }}/.git"
    get_checksum: false
  register: _paperclip_ws_git
  loop: "{{ paperclip_host_workspaces | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: "[pazny.paperclip] A host workspace is not a linked worktree"
  ansible.builtin.assert:
    that:
      - not (_paperclip_ws_git.results[_i].stat.isreg | default(false))
    fail_msg: "paperclip_host_workspaces entry {{ item.name }} is refused: {{ item.path }} is a linked git worktree; mount the main clone."
  loop: "{{ paperclip_host_workspaces | default([]) }}"
  loop_control:
    index_var: _i

# Row paperclip-nested-git-rw: the overlay above covers the TOP .git only. A nested repo or a
# submodule's .git file under a writable mount stays writable (a planted hook or core.fsmonitor runs
# when the operator next uses git there), so a writable workspace holding one is refused. Anything
# but mode ro counts as writable. ponytail: depth-bounded walk (paperclip_nested_git_depth, 6);
# deeper repos and ones the agent creates later are the rw mount's own ceiling: mount ro.
- name: "[pazny.paperclip] Find nested .git under each writable host workspace"
  ansible.builtin.find:
    paths: "{{ item.path }}"
    patterns: ".git"
    file_type: any
    hidden: true
    recurse: true
    depth: "{{ paperclip_nested_git_depth | default(6) }}"
  register: _paperclip_ws_nested
  loop: "{{ paperclip_host_workspaces | default([]) | rejectattr('mode', 'undefined') | rejectattr('mode', 'equalto', 'ro') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: "[pazny.paperclip] A writable host workspace holds no nested repo"
  ansible.builtin.assert:
    that: _nested | length == 0
    fail_msg: >-
      Paperclip host workspace {{ item.item.name }} is refused: it mounts {{ item.item.mode }} and holds
      a nested repo ({{ _nested[:3] | join(', ') }}{{ ' …' if _nested | length > 3 else '' }}) whose .git the
      read-only overlay does not cover. Mount it ro, or move the nested repo out.
  vars:
    _nested: "{{ item.files | map(attribute='path') | map('dirname') | map('realpath') | reject('equalto', item.item.path | realpath) | list }}"
  loop: "{{ _paperclip_ws_nested.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

# `follow: <branch>`: the agents read origin/<branch>, not the day someone cloned it
# (11-01: an oponent reviewed against a 24-10 clone and flagged shipped fixes as missing).
# Detached at the tip; a dirty clone is refused, never reset.
- name: "[pazny.paperclip] A followed workspace sits at its branch's tip"
  ansible.builtin.shell: |
    set -eo pipefail
    cd {{ item.path | quote }}
    git rev-parse --git-dir >/dev/null 2>&1 || { echo "{{ item.name }}: {{ item.path }} is no git clone (follow needs one)" >&2; exit 1; }
    [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "{{ item.name }}: local changes, not moved" >&2; exit 1; }
    before=$(git rev-parse HEAD)
    git fetch -q origin {{ item.follow | quote }}
    git checkout -q --detach FETCH_HEAD
    [ "$before" = "$(git rev-parse HEAD)" ] && echo "at $before" || echo "moved $before -> $(git rev-parse HEAD)"
  args:
    executable: /bin/bash
  register: _paperclip_follow
  changed_when: "'moved' in _paperclip_follow.stdout"
  loop: "{{ paperclip_host_workspaces | default([]) | selectattr('follow', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.follow }}"

# A recreate kills every run in flight, and its working files with it (2026-10-23:
# six runs lost to one restart). Wait until no run is going; on timeout refuse, so
# the operator chooses: wait more, or `-e paperclip_drain_timeout_s=0` to restart now.
# No database yet (first install) counts as idle. Gate: test_paperclip_role_journey.py.
- name: "[pazny.paperclip] Drain: wait until no agent run is in flight"
  ansible.builtin.shell: >
    {{ docker_bin }} exec infra-postgresql-1 psql -U postgres -d {{ paperclip_db_name }} -tA -c
    "SELECT count(*) FROM heartbeat_runs WHERE status NOT IN ('succeeded', 'failed', 'cancelled', 'interrupted')"
    2>/dev/null || echo 0
  register: _paperclip_inflight
  changed_when: false
  check_mode: false
  until: (_paperclip_inflight.stdout | trim | int) == 0
  retries: "{{ ((paperclip_drain_timeout_s | int) / 15) | round(0, 'ceil') | int }}"
  delay: 15
  failed_when: false
  when: (paperclip_drain_timeout_s | int) > 0

- name: "[pazny.paperclip] Drain: refuse to restart over runs in flight"
  ansible.builtin.fail:
    msg: >-
      Paperclip still has {{ _paperclip_inflight.stdout | trim }} agent run(s) in flight after
      {{ paperclip_drain_timeout_s }} s; a restart would kill them and their working files.
      Re-run when they finish, or `-e paperclip_drain_timeout_s=0` to restart now.
  when:
    - (paperclip_drain_timeout_s | int) > 0
    - (_paperclip_inflight.stdout | default('0') | trim | int) > 0

- name: "[pazny.paperclip] Render compose override fragment"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/devops/overrides/paperclip.yml"
    mode: '0600'
  notify: Restart paperclip
