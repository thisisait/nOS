---
# ==============================================================================
# pazny.paperclip/tasks/main.yml
#
# Called from tasks/stacks/stack-up.yml BEFORE `docker compose -p devops up`:
# creates the data dir and renders the compose override fragment to
# {{ stacks_dir }}/devops/overrides/paperclip.yml, which stack-up.yml then
# collects via `find` and passes as an additional -f flag.
#
# Paperclip is not part of the standard task/iiab/ set — pre-setup logic
# was minimal, a compose fragment render + data dir was enough.
#
# Post-start logic (allowed-hostname registration) lives in tasks/post.yml —
# called AFTER `docker compose up devops --wait` from stack-up.yml.
# ==============================================================================

- name: "[pazny.paperclip] Ensure data directory exists"
  ansible.builtin.file:
    path: "{{ paperclip_data_dir }}"
    state: directory
    mode: '0755'

- name: "[pazny.paperclip] Ensure the agents' workspace root exists"
  ansible.builtin.file:
    path: "{{ paperclip_workspaces_dir }}"
    state: directory
    mode: '0755'

# A host folder handed to Paperclip's agents is a client's project, never the estate's own
# state: ~/.nos holds the secrets and the estate checkout, the data root holds every service.
- name: "[pazny.paperclip] A host workspace is a project folder, not the estate's state"
  ansible.builtin.assert:
    that:
      - item.name is defined and item.name is match('^[a-z0-9][a-z0-9-]*$')
      - (item.path | realpath) != (ansible_facts['env']['HOME'] | realpath)
      - not ((item.path | realpath) ~ '/').startswith((ansible_facts['env']['HOME'] | realpath) ~ '/.nos/')
      - not (((nos_data_root | realpath) ~ '/').startswith((item.path | realpath) ~ '/'))
    fail_msg: >-
      paperclip_host_workspaces entry {{ item }} is refused: a workspace is a project folder
      (e.g. ~/projects/<client>), never $HOME, ~/.nos or a folder containing the data root.
  loop: "{{ paperclip_host_workspaces | default([]) }}"

- name: "[pazny.paperclip] Ensure each host workspace exists"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0755'
  loop: "{{ paperclip_host_workspaces | default([]) }}"

# A recreate kills every run in flight, and its working files with it (2026-10-23:
# six runs lost to one restart). Wait until no run is going; on timeout refuse, so
# the operator chooses: wait more, or `-e paperclip_drain_timeout_s=0` to restart now.
# No database yet (first install) counts as idle. Gate: test_paperclip_drains_before_a_restart.py.
- name: "[pazny.paperclip] Drain: wait until no agent run is in flight"
  ansible.builtin.shell: >
    {{ docker_bin }} exec infra-postgresql-1 psql -U postgres -d {{ paperclip_db_name }} -tA -c
    "SELECT count(*) FROM heartbeat_runs WHERE status NOT IN ('succeeded', 'failed', 'cancelled', 'interrupted')"
    2>/dev/null || echo 0
  register: _paperclip_inflight
  changed_when: false
  check_mode: false
  until: (_paperclip_inflight.stdout | trim | int) == 0
  retries: "{{ ((paperclip_drain_timeout_s | int) / 15) | round(0, 'ceil') | int }}"
  delay: 15
  failed_when: false
  when: (paperclip_drain_timeout_s | int) > 0

- name: "[pazny.paperclip] Drain: refuse to restart over runs in flight"
  ansible.builtin.fail:
    msg: >-
      Paperclip still has {{ _paperclip_inflight.stdout | trim }} agent run(s) in flight after
      {{ paperclip_drain_timeout_s }} s; a restart would kill them and their working files.
      Re-run when they finish, or `-e paperclip_drain_timeout_s=0` to restart now.
  when:
    - (paperclip_drain_timeout_s | int) > 0
    - (_paperclip_inflight.stdout | default('0') | trim | int) > 0

- name: "[pazny.paperclip] Render compose override fragment"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/devops/overrides/paperclip.yml"
    mode: '0600'
  notify: Restart paperclip
