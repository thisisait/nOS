---
# pazny.receptor — a host login reaches KEAP's human door as the person it maps to
# (files/anatomy/receptor/receptor.py; operator rulings 2026-10-11). Gated on
# install_receptor in main.yml. launchd on macOS, systemd --user on Linux.

- name: "[pazny.receptor] Ensure runtime directories exist"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ receptor_runtime_dir }}", mode: '0755' }
    # 0700: the logs name every login, person and request line; the dir guards the files.
    - { path: "{{ receptor_log_dir }}", mode: '0700' }

# The ONE identity map (ruling 1a). Read per request, so a new map needs no restart.
- name: "[pazny.receptor] Render the identity map"
  ansible.builtin.template:
    src: identity-map.yml.j2
    dest: "{{ receptor_identity_map }}"
    mode: '0600'

- name: "[pazny.receptor] Sync receptor source"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/anatomy/receptor/receptor.py"
    dest: "{{ receptor_src }}"
    mode: '0644'
  notify: Restart receptor

# ---- macOS: launchd ----
- name: "[pazny.receptor] Render launchd plist"
  ansible.builtin.template:
    src: receptor.plist.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ receptor_launchd_label }}.plist"
    mode: '0600'   # carries the KEAP proxy secret
  register: _receptor_plist
  notify: Restart receptor
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[pazny.receptor] Bootstrap launchd job (idempotent)"
  ansible.builtin.shell: |
    set -e
    PLIST=~/Library/LaunchAgents/{{ receptor_launchd_label }}.plist
    UID_NUM=$(id -u)
    PLIST_CHANGED={{ 'yes' if (_receptor_plist is defined and _receptor_plist is changed) else 'no' }}
    if launchctl print "gui/${UID_NUM}/{{ receptor_launchd_label }}" >/dev/null 2>&1; then
      if [ "$PLIST_CHANGED" = "yes" ]; then
        launchctl bootout "gui/${UID_NUM}/{{ receptor_launchd_label }}" 2>/dev/null || true
        sleep 1
        launchctl bootstrap "gui/${UID_NUM}" "$PLIST" || echo "BOOTSTRAP-FAILED rc=$?"
        echo "reloaded"
      else
        echo "already-loaded"
      fi
    else
      launchctl bootstrap gui/${UID_NUM} "$PLIST"
      echo "bootstrapped"
    fi
  register: _receptor_bootstrap
  changed_when: >-
    'bootstrapped' in _receptor_bootstrap.stdout
    or 'reloaded' in _receptor_bootstrap.stdout
  when: (nos_service_manager | default('launchd')) == 'launchd'

# ---- Linux: systemd --user (env mirrors receptor.plist.j2) ----
- name: "[pazny.receptor] (Linux) Install systemd --user service"
  ansible.builtin.include_role:
    name: pazny.linux.systemd_user
    tasks_from: ensure_unit
  vars:
    su_name: "{{ receptor_launchd_label }}"
    su_description: "nOS receptor — host login to KEAP person relay"
    su_exec_start: "{{ receptor_python }} {{ receptor_src }} --socket {{ receptor_socket }} --map {{ receptor_identity_map }} --upstream 127.0.0.1:{{ keap_port | default(8091) }}"
    su_working_dir: "{{ receptor_runtime_dir }}"
    su_environment:
      HOME: "{{ ansible_facts['env']['HOME'] }}"
      KEAP_PROXY_SHARED_SECRET: "{{ keap_proxy_shared_secret | default('') }}"
  when: (nos_service_manager | default('launchd')) == 'systemd-user'

- name: "[pazny.receptor] Flush handlers (apply a pending restart now)"
  ansible.builtin.meta: flush_handlers

# The effect, not the render: the socket is 0600 and this login reads KEAP as a person.
# Only a 200 from /api/me passes; 403 = map refuses, 503 = no secret, 502 = KEAP down.
- name: "[pazny.receptor] Verify — the socket answers this login as a person"
  ansible.builtin.shell: |
    set -eo pipefail
    for _ in $(seq 1 20); do [ -S "{{ receptor_socket }}" ] && break; sleep 0.5; done
    MODE=$(stat -c '%a' "{{ receptor_socket }}" 2>/dev/null || stat -f '%Lp' "{{ receptor_socket }}")
    # A restart leaves the old file a moment (client 2026-10-16): retry what is transient (000/502), ~30 s.
    for _ in $(seq 1 30); do
      CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 10 --unix-socket "{{ receptor_socket }}" http://keap/api/me) || CODE=000
      case "$CODE" in 000|502) sleep 1 ;; *) break ;; esac
    done
    echo "mode=${MODE} code=${CODE}"
  args:
    executable: /bin/bash
  register: _receptor_verify
  changed_when: false
  failed_when: >-
    'mode=600' not in _receptor_verify.stdout
    or 'code=200' not in _receptor_verify.stdout
  tags: ['verify']
