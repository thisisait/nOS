---
# TRANSITIONAL (Phase 2 C5 shipped 2026-05-12): the plugin loader post_compose
# runner is LIVE, so files/anatomy/plugins/portainer-base authoritatively replays the
# post-start wiring. This role file is NOT retired — still invoked every run, and
# runs idempotently ALONGSIDE the hook during the dual-safe transition.
#
# ==============================================================================
# pazny.portainer/tasks/post.yml
#
# Post-start admin init + password reconverge + Authentik OAuth2 config.
# Called from tasks/stacks/core-up.yml AFTER `docker compose up infra --wait`.
#
# PARTIAL: password reconverge only rotates one prefix forward
# (previous_password_prefix → global_password_prefix). Dva+ kroky DRIFT
# -> manual reset. See Wave 1 commit 4c65ba7.
# ==============================================================================

# "Ready" = the API responds at all. 200 = healthy; 303 = up but admin-locked
# (Redirect-Reason: AdminInitTimeout). BOTH must let the downstream admin-check
# / window-reset-restart branch run — gating those on ==200 alone made the very
# 303 that needs the restart skip the restart (self-defeating). Surfaced by a
# cold blank where Portainer started >5 min before this task reached it. Stays
# best-effort (wait_hard_fail: false) — the 303/restart branch handles a closed
# admin window itself, so an aborting wait would defeat the recovery path.
- name: "[pazny.portainer Post] Wait for API to be ready"
  ansible.builtin.include_role:
    name: pazny._common_tasks
    tasks_from: wait_for_api.yml
  vars:
    wait_name: "[pazny.portainer Post]"
    wait_url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/system/status"
    wait_status_codes: [200, 303]   # 303 = up but admin-init window CLOSED (AdminInitTimeout)
    wait_register_as: _portainer_ready
    wait_retries: 12
    wait_delay: 10
    wait_hard_fail: false

- name: "[pazny.portainer Post] Check if admin already exists"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/users/admin/check"
    method: GET
    status_code: [204, 404, 303]   # 303 = AdminInitTimeout (no admin + window closed)
    timeout: 5
  register: _portainer_admin_check
  # Retry a transient localhost flake rather than letting one bad GET decide the
  # restart/init branch: without this, a flaked status (-1) is != 204 and used to
  # trip a needless restart on a healthy re-run (fail-OPEN). 6×5s settles it.
  until: _portainer_admin_check.status | default(0) in [204, 404, 303]
  retries: 6
  delay: 5
  failed_when: false
  when: _portainer_ready.status | default(0) in [200, 303]

# Current SSO state, read UNAUTHENTICATED (/api/settings/public carries
# AuthenticationMethod). Once OAuth2 is active (==3) Portainer's internal admin
# login 422s by design (OAuth is the only path), so the admin-password machinery
# below (reconverge, drift-detect, OAuth config) is MOOT — gating it on !=3 keeps
# a re-converge from raising a false "DRIFT" / "OAuth SKIPPED" alarm every run.
- name: "[pazny.portainer Post] Read AuthenticationMethod (unauth public settings)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/settings/public"
    method: GET
    status_code: [200]
    timeout: 5
  register: _portainer_public_pre
  changed_when: false
  failed_when: false
  when: _portainer_ready.status | default(0) in [200, 303]

- name: "[pazny.portainer Post] Expose current AuthenticationMethod fact"
  ansible.builtin.set_fact:
    _portainer_authmethod: "{{ _portainer_public_pre.json.AuthenticationMethod | default(0) | int }}"
  when: _portainer_ready.status | default(0) in [200, 303]

# ── Admin-init window guard (cold-blank gotcha) ─────────────────────────────
# Portainer's admin-init API window is ~5 min from CONTAINER START. On a cold
# blank the run can reach this task long after that (blank-confirm pause + slow
# sequential infra health-wait) -> /api/users/admin/init returns 303
# `AdminInitTimeout`, the admin is never created, and failed_when:false hides it
# (failed=0 but no admin). A container restart resets the window. Restart ONLY on
# a KNOWN no-admin signal (404 = no admin, 303 = window closed) — fail-CLOSED, so
# an error/unknown status (-1 from a flake, 5xx) SKIPS rather than needlessly
# restarting a healthy, already-provisioned Portainer on a re-run.
- name: "[pazny.portainer Post] Restart to reset admin-init window (no admin yet)"
  ansible.builtin.command: "{{ docker_bin | default('docker') }} restart infra-portainer-1"
  register: _portainer_restart
  when:
    - _portainer_ready.status | default(0) in [200, 303]
    - _portainer_admin_check.status | default(0) in [404, 303]
  changed_when: true

- name: "[pazny.portainer Post] Re-wait for API after window-reset restart"
  ansible.builtin.include_role:
    name: pazny._common_tasks
    tasks_from: wait_for_api.yml
  vars:
    wait_name: "[pazny.portainer Post] (re-wait)"
    wait_url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/system/status"
    wait_status_codes: [200]
    wait_register_as: _portainer_ready2
    wait_retries: 12
    wait_delay: 5
    wait_hard_fail: false
  when: _portainer_restart is changed

- name: "[pazny.portainer Post] Create admin user via API"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/users/admin/init"
    method: POST
    body_format: json
    body:
      Username: "admin"
      Password: "{{ portainer_admin_password | default(nos_derived_secrets.portainer) }}"
    status_code: [200]
    timeout: 10
  register: _portainer_admin_create
  when:
    - _portainer_ready.status | default(0) in [200, 303]
    - _portainer_admin_check.status | default(0) in [404, 303]   # no admin (404) or window-closed (303); fail-closed
  changed_when: _portainer_admin_create.status | default(0) == 200
  failed_when: false
  no_log: true

# ── Password reconverge (state-declarative UPDATE) ────────────────────
# Portainer PUT /api/users/{id}/passwd requires the OLD password in the body. We alternate:
# 1) If login with NEW succeeds -> converged, skip update.
# 2) If login with OLD (previous_password_prefix) succeeds -> issue UPDATE.
# 3) Otherwise DRIFT — log warning.
- name: "[pazny.portainer Post] Login attempt with current password"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/auth"
    method: POST
    body_format: json
    body:
      Username: "admin"
      Password: "{{ portainer_admin_password | default(nos_derived_secrets.portainer) }}"
    status_code: [200, 401, 422]
    timeout: 10
  register: _portainer_auth_new
  when:
    - _portainer_ready.status | default(0) in [200, 303]
    - _portainer_admin_check.status | default(0) == 204  # admin already exists
  changed_when: false
  failed_when: false
  no_log: true

- name: "[pazny.portainer Post] Login attempt with previous password (for reconverge)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/auth"
    method: POST
    body_format: json
    body:
      Username: "admin"
      Password: "{{ previous_password_prefix | default(global_password_prefix) }}_pw_portainer"
    status_code: [200, 401, 422]
    timeout: 10
  register: _portainer_auth_old
  when:
    - _portainer_ready.status | default(0) in [200, 303]
    - _portainer_auth_new.status | default(0) != 200
    - _portainer_admin_check.status | default(0) == 204
  changed_when: false
  failed_when: false
  no_log: true

- name: "[pazny.portainer Post] PUT /api/users/1/passwd (password reconverge)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/users/1/passwd"
    method: PUT
    body_format: json
    headers:
      Authorization: "Bearer {{ _portainer_auth_old.json.jwt | default('') }}"
    body:
      password: "{{ previous_password_prefix | default(global_password_prefix) }}_pw_portainer"
      newPassword: "{{ portainer_admin_password | default(nos_derived_secrets.portainer) }}"
    status_code: [200, 204]
    timeout: 10
  register: _portainer_pw_reset
  when:
    - _portainer_auth_old.status | default(0) == 200
  changed_when: _portainer_pw_reset.status | default(0) in [200, 204]
  failed_when: false
  no_log: true

- name: "[pazny.portainer Post] Password reconverge status"
  ansible.builtin.debug:
    msg: >-
      Portainer admin pw:
      {{ 'already converged' if (_portainer_auth_new.status | default(0) == 200)
         else ('updated' if (_portainer_pw_reset.status | default(0) in [200, 204])
               else ('DRIFT — manual reset required' if (_portainer_admin_check.status | default(0) == 204) else 'fresh install')) }}
  when: _portainer_ready.status | default(0) in [200, 303]

# ── ADMIN-PASSWORD DRIFT SELF-HEAL ───────────────────────────────────────────
# Portainer's admin password can only be rotated via the API WITH the old
# password (PUT /passwd above). When BOTH the current AND previous prefixes fail
# to log in (admin exists but its password is unknown — an interrupted/partial
# provisioning, like an aborted blank, left it drifted), the reconverge is stuck,
# OAuth/SSO config below is SKIPPED, and the loud SSO verify correctly FAILS the
# run. Portainer holds NO user data — its admin, endpoints, settings and OAuth
# are 100% reprovisioned by this role — so the robust heal is to wipe its BoltDB,
# which drops the unknown admin → the admin-init path (and the OAuth login below)
# re-create it with the CONFIG password. Wiping the BoltDB is destructive of
# Portainer's local config only; per manual-over-auto doctrine it is OPT-IN via
# portainer_admin_auto_reset (default false). Off → a loud, paste-able diagnostic.
- name: "[pazny.portainer Post] Detect admin-password DRIFT (neither prefix logs in)"
  ansible.builtin.set_fact:
    _portainer_pw_drift: >-
      {{ (_portainer_admin_check.status | default(0) == 204)
         and (_portainer_auth_new.status | default(0) != 200)
         and (_portainer_auth_old.status | default(0) != 200)
         and (_portainer_authmethod | default(0) | int != 3) }}
  when: _portainer_ready.status | default(0) in [200, 303]

- name: "[pazny.portainer Post] Auto-heal admin DRIFT — reset the BoltDB (opt-in)"
  when:
    - _portainer_pw_drift | default(false) | bool
    - portainer_admin_auto_reset | default(false) | bool
  block:
    - name: "[pazny.portainer Post] DRIFT heal — stop Portainer"
      ansible.builtin.command: "{{ docker_bin | default('docker') }} stop infra-portainer-1"
      changed_when: true

    - name: "[pazny.portainer Post] DRIFT heal — remove BoltDB (admin store; reprovisioned)"
      ansible.builtin.file:
        path: "{{ portainer_data_dir }}/portainer.db"
        state: absent

    - name: "[pazny.portainer Post] DRIFT heal — start Portainer (fresh admin-init window)"
      ansible.builtin.command: "{{ docker_bin | default('docker') }} start infra-portainer-1"
      changed_when: true

    - name: "[pazny.portainer Post] DRIFT heal — wait for API"
      ansible.builtin.include_role:
        name: pazny._common_tasks
        tasks_from: wait_for_api.yml
      vars:
        wait_name: "[pazny.portainer Post] (drift-heal re-wait)"
        wait_url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/system/status"
        wait_status_codes: [200]
        wait_register_as: _portainer_ready_heal
        wait_retries: 12
        wait_delay: 5
        wait_hard_fail: false

    - name: "[pazny.portainer Post] DRIFT heal — re-init admin with the config password"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/users/admin/init"
        method: POST
        body_format: json
        body:
          Username: "admin"
          Password: "{{ portainer_admin_password | default(nos_derived_secrets.portainer) }}"
        status_code: [200]
        timeout: 10
      register: _portainer_admin_reinit
      changed_when: _portainer_admin_reinit.status | default(0) == 200
      failed_when: false
      no_log: true

    - name: "[pazny.portainer Post] DRIFT heal — result"
      ansible.builtin.debug:
        msg: >-
          Portainer admin DRIFT auto-healed: BoltDB wiped + admin re-initialized
          {{ 'OK with the config password' if (_portainer_admin_reinit.status | default(0) == 200)
             else 'FAILED (admin-init window may need a 2nd pass) — re-run --tags portainer' }}.
          Endpoints/OAuth are reprovisioned below.

- name: "[pazny.portainer Post] DRIFT but auto-reset OFF — loud actionable diagnostic"
  ansible.builtin.debug:
    msg: >-
      Portainer admin password DRIFT — admin exists but neither the current nor
      previous prefix logs in, so OAuth/SSO config is SKIPPED and the SSO verify
      will FAIL this run. Portainer holds no user data (config is reprovisioned).
      Heal by EITHER: (a) re-run with -e portainer_admin_auto_reset=true ; OR
      (b) manually — `{{ docker_bin | default('docker') }} stop infra-portainer-1
      && rm -f {{ portainer_data_dir }}/portainer.db &&
      {{ docker_bin | default('docker') }} start infra-portainer-1` then re-run
      `--tags portainer,stacks`.
  when:
    - _portainer_pw_drift | default(false) | bool
    - not (portainer_admin_auto_reset | default(false) | bool)

- name: "[pazny.portainer Post] Get auth token for admin (for OAuth2 config)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/auth"
    method: POST
    body_format: json
    body:
      Username: "admin"
      Password: "{{ portainer_admin_password | default(nos_derived_secrets.portainer) }}"
    status_code: [200]
    timeout: 10
  register: _portainer_auth
  when:
    - _portainer_ready.status | default(0) in [200, 303]
    - install_authentik | default(false)
    - _portainer_authmethod | default(0) | int != 3   # already OAuth2 → skip (idempotent)
  failed_when: false
  no_log: true

- name: "[pazny.portainer Post] SSO already active — OAuth config skipped (idempotent)"
  ansible.builtin.debug:
    msg: >-
      Portainer OAuth2 already active (AuthenticationMethod=3) — config PUT skipped.
      {{ 'NOTE: local admin login differs from the config password (break-glass only;
      SSO is unaffected). Set portainer_admin_auto_reset=true to restore local login.'
         if (_portainer_auth_new.status | default(0) != 200) else '' }}
  when:
    - _portainer_ready.status | default(0) in [200, 303]
    - install_authentik | default(false)
    - _portainer_authmethod | default(0) | int == 3

- name: "[pazny.portainer Post] OAuth2 auth token status"
  ansible.builtin.debug:
    msg: >-
      Portainer OAuth2 setup:
      {% if _portainer_auth.json.jwt is defined and _portainer_auth.json.jwt | length > 0 %}
      JWT obtained — proceeding with OAuth config
      {% else %}
      FAILED to obtain JWT (HTTP {{ _portainer_auth.status | default('-1') }}) — OAuth config SKIPPED.
      Root-cause by status: 401/422 = wrong admin password (reconverge drift);
      -1 = network/DNS (Portainer unreachable on 127.0.0.1:{{ portainer_port | default(9002) }});
      5xx = Portainer internal error.
      {% endif %}
  when:
    - _portainer_ready.status | default(0) in [200, 303]
    - install_authentik | default(false)
    - _portainer_authmethod | default(0) | int != 3   # already active → the 'already active' note above covers it

- name: "[pazny.portainer Post] Configure OAuth2 settings (Authentik)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/settings"
    method: PUT
    body_format: json
    headers:
      Authorization: "Bearer {{ _portainer_auth.json.jwt | default('') }}"
    body:
      AuthenticationMethod: 3
      OAuthSettings:
        ClientID: "nos-portainer"
        ClientSecret: "{{ nos_derived_secrets.oidc_portainer }}"
        # Browser-side URLs (HTTPS -> nginx -> Authentik): the user logs in via browser
        AuthorizationURI: "https://{{ authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/application/o/authorize/"
        RedirectURI: "https://{{ portainer_domain | default('portainer' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}"
        LogoutURI: "https://{{ authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/application/o/portainer/end-session/"
        # Server-side URLs (HTTP → Docker interni sit): Portainer backend ↔ Authentik.
        # We use internal HTTP so Portainer (Go) does not have to trust the mkcert CA.
        AccessTokenURI: "http://authentik-server:9000/application/o/token/"
        ResourceURI: "http://authentik-server:9000/application/o/userinfo/"
        UserIdentifier: "preferred_username"
        Scopes: "openid profile email"
        OAuthAutoCreateUsers: true
        DefaultTeamID: 0
        SSO: true
        # ── SSO autologin (force-OIDC) — sso-autologin-plan.md Batch 2 ─────────
        # Portainer is HYBRID: the OIDC env wires via this same PUT, and
        # HideInternalAuth=true is the stateful API toggle that hides the
        # internal username/password form so the OAuth button is the only path.
        # Dormant behind sso_autologin=false default; resolves via the canonical
        # enable chain (svc > min_tier_1 > global > false), | bool coerced.
        # Break-glass: /#!/internal-auth re-exposes the internal-auth view.
        HideInternalAuth: "{{ (sso_autologin_portainer | default(sso_autologin_min_tier_1 | default(sso_autologin | default(false)))) | bool }}"
    status_code: [200]
    timeout: 10
  register: _portainer_oauth_put
  when:
    - _portainer_auth.json.jwt is defined
    - _portainer_auth.json.jwt | length > 0
  changed_when: _portainer_oauth_put.status | default(0) == 200
  failed_when: false
  no_log: true

- name: "[pazny.portainer Post] Verify OAuth2 settings applied"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/settings"
    method: GET
    headers:
      Authorization: "Bearer {{ _portainer_auth.json.jwt | default('') }}"
    status_code: [200]
    timeout: 10
  register: _portainer_settings_verify
  # Read back the LIVE AuthenticationMethod whenever we hold a JWT — NOT only on a
  # 200 PUT. If the PUT silently no-op'd or the settings drifted, this GET is the
  # only headless confirmation that AuthMethod==3 actually landed; gating it on PUT
  # success left a blind spot where the summary could never see the real value.
  when:
    - _portainer_auth.json.jwt is defined
    - _portainer_auth.json.jwt | length > 0
  failed_when: false
  no_log: true

- name: "[pazny.portainer Post] OAuth2 setup summary"
  ansible.builtin.debug:
    msg: >-
      Portainer OAuth2:
      {% if (_portainer_settings_verify.json.AuthenticationMethod | default(0) | int == 3) or (_portainer_authmethod | default(0) | int == 3) %}
      OK — AuthMethod=3 (OAuth2), SSO active{{ ' (config skipped — already active)' if (_portainer_settings_verify.json.AuthenticationMethod is not defined) else ', token exchange via Docker internal HTTP' }}
      {% elif _portainer_oauth_put.status | default(0) == 200 %}
      PUT accepted but verification shows AuthMethod={{ _portainer_settings_verify.json.AuthenticationMethod | default('?') }} — check manually
      {% elif _portainer_auth.json.jwt is not defined or _portainer_auth.json.jwt | length == 0 %}
      SKIPPED — failed to obtain admin JWT (check admin password)
      {% else %}
      FAILED — PUT /api/settings returned HTTP {{ _portainer_oauth_put.status | default('?') }};
      live AuthMethod={{ _portainer_settings_verify.json.AuthenticationMethod | default('?') }} (1=internal, 3=OAuth2)
      {% endif %}
  when: install_authentik | default(false)

# ── Idempotent endpoint registration (gap-fill) ─────────────────────────────
# When apps_runner brings up the Tier-2 `apps` Docker compose project, we want
# Portainer to surface it under the same Endpoints view as `infra` /
# `observability` / `iiab` etc. Portainer auto-discovers the local Docker
# socket as endpoint id=1 ("primary"); compose projects are visualised as
# Stacks under that endpoint. Nothing additional is required for visibility —
# this task is a defensive idempotent reconcile of the primary endpoint name
# + URL so the operator UI surfaces Tier-2 stacks immediately.
#
# Operators wanting a SECOND, dedicated endpoint for Tier-2 apps can set
# `portainer_register_apps_endpoint: true` (default false); then we POST the
# extra endpoint via /api/endpoints. Idempotent — GET first to detect.
- name: "[pazny.portainer Post] Get current endpoints (gap-fill check)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/endpoints"
    method: GET
    headers:
      Authorization: "Bearer {{ _portainer_auth.json.jwt | default('') }}"
    status_code: [200, 401]
    timeout: 10
  register: _portainer_endpoints_list
  when:
    - portainer_register_apps_endpoint | default(false)
    - _portainer_auth.json.jwt is defined
    - _portainer_auth.json.jwt | length > 0
  changed_when: false
  failed_when: false
  no_log: true

- name: "[pazny.portainer Post] Register `apps` endpoint (idempotent)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/endpoints"
    method: POST
    headers:
      Authorization: "Bearer {{ _portainer_auth.json.jwt | default('') }}"
    body_format: form-multipart
    body:
      Name: "apps"
      EndpointCreationType: "1"  # 1 = local Docker socket
      URL: "unix:///var/run/docker.sock"
      GroupID: "1"
      TagIds: "[]"
    status_code: [200, 201, 409]
    timeout: 30
  register: _portainer_apps_ep
  when:
    - portainer_register_apps_endpoint | default(false)
    - _portainer_endpoints_list.json is defined
    - (_portainer_endpoints_list.json | selectattr('Name', 'equalto', 'apps') | list | length) == 0
  changed_when: _portainer_apps_ep.status | default(0) in [200, 201]
  failed_when: false
  no_log: true

- name: "[pazny.portainer Post] Apps endpoint registration summary"
  ansible.builtin.debug:
    msg: >-
      Portainer Tier-2 endpoint:
      {% if not (portainer_register_apps_endpoint | default(false)) %}
      not requested (set portainer_register_apps_endpoint: true to enable)
      {% elif _portainer_apps_ep is not defined %}
      already present — no-op
      {% elif _portainer_apps_ep.status | default(0) in [200, 201] %}
      created
      {% else %}
      FAILED — HTTP {{ _portainer_apps_ep.status | default('?') }}
      {% endif %}
  when: install_portainer | default(false)
