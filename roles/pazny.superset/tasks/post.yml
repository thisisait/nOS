---
# ==============================================================================
# pazny.superset/tasks/post.yml
# SUPERSET — post-start: DB schema init and admin user
# Runs AFTER data stack startup (stack-up.yml).
# ==============================================================================

# Pre-check removed (2026-05-08): the previous version polled
# `docker compose exec -T superset python -c "socket.connect(('postgresql', 5432))"`
# 30× × 2s. It was meant to gate on Postgres readiness, but Postgres is
# verified healthy in tasks/stacks/core-up.yml long before this task can
# run; on cold blank the probe instead measured `docker exec` readiness
# of Superset itself (gunicorn + SQLAlchemy bootstrap) and fired 60s of
# noisy [ERROR] entries until exec attach started working — a false
# negative that obscured real failures. The downstream `superset db
# upgrade` already has its own retry (4 × 15s = 60s) and tolerates the
# same exec-attach delay correctly, so the probe was both redundant and
# misdiagnosing.

- name: "[pazny.superset Post] Run Superset db upgrade"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p data
    exec -T superset superset db upgrade
  register: _superset_db
  retries: 4
  delay: 15
  until: _superset_db.rc == 0
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: "[pazny.superset Post] Initialize roles and permissions"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p data
    exec -T superset superset init
  register: _superset_init
  changed_when: _superset_init.rc == 0
  failed_when: false
  when:
    - _superset_db.rc | default(1) == 0
    - not ansible_check_mode

- name: "[pazny.superset Post] Create admin user"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p data
    exec -T superset superset fab create-admin
    --username admin
    --firstname Admin
    --lastname User
    --email "{{ superset_admin_email }}"
    --password {{ superset_admin_password }}
  register: _superset_admin
  changed_when: "'was created' in (_superset_admin.stdout | default(''))"
  failed_when: false
  no_log: true
  when:
    - _superset_db.rc | default(1) == 0
    - not ansible_check_mode

# THE HALF THAT MAKES THE OTHER HALF REAL (REM-191, 2026-08-11).
#
# `fab create-admin` on an EXISTING user reports that it exists and leaves the
# password alone. So main.yml's lazy-regenerate of superset_admin_password would
# have changed the variable, changed ~/.nos/secrets.yml, and left the live
# account still answering to `{prefix}_pw_superset` — a fix visible everywhere
# except where it matters. That is the estate's own "success markers must be
# written by a reader" defect, applied to a credential.
#
# WHY THIS MATTERS AT ALL: Flask-AppBuilder's `POST /api/v1/security/login`
# accepts {"provider":"db"} and calls auth_user_db() regardless of AUTH_TYPE, so
# AUTH_OAUTH does not gate this account, and traefik_auth_modes['superset']
# = 'oidc' attaches no forward-auth middleware to an internet-reachable route.
#
# Idempotent by shape: reset-password writes the value the playbook already
# holds, so a converge where nothing changed rewrites the same secret.
- name: "[pazny.superset Post] Reset the admin password to the managed value"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p data
    exec -T superset superset fab reset-password
    --username admin
    --password {{ superset_admin_password }}
  register: _superset_pw
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - _superset_db.rc | default(1) == 0
    - not ansible_check_mode

- name: "[pazny.superset Post] REFUSE a silent password reset failure"
  # `failed_when: false` above keeps a converge alive; this makes the outcome
  # legible. A reset that did not happen leaves the derived password live, which
  # is the whole finding — so it must not pass as quiet success.
  ansible.builtin.assert:
    that: (_superset_pw.rc | default(1)) == 0
    fail_msg: >-
      superset fab reset-password failed (rc={{ _superset_pw.rc | default('?') }}).
      The admin account may still answer to the prefix-derived password that
      REM-191 was filed for. Run it by hand and check:
      docker compose -p data exec -T superset superset fab reset-password --username admin --password <value from ~/.nos/secrets.yml>
  when:
    - _superset_db.rc | default(1) == 0
    - not ansible_check_mode
