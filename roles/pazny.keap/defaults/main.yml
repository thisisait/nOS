---
# ==============================================================================
# pazny.keap — role defaults
#
# KEAP (Knowledge Explorer and Preserver) — the CORTEX of the nOS anatomy:
# the knowledge layer of the brain. Curated taxonomy, content links into the
# live content services (Kiwix, Calibre-Web, Nextcloud, Open WebUI), a
# capture/preservation review queue, and an agent-facing knowledge API
# (/agent/v1) consumed by the AgentKit runtime.
#
# Operator-facing pins (domain/port/version/repo) live in default.config.yml
# — these are fallbacks only (version-pin shadow rule: bump default.config.yml,
# not here).
# ==============================================================================

keap_home: "{{ ansible_facts['env']['HOME'] }}/keap"
keap_src_dir: "{{ keap_home }}/src"

# Upstream repo — org-transferred 2026-07-13 from budweis-dev/knowledge-explorer-
# -and-preserver to thisisait/nos-keap (public; old path still redirects). CI still
# skips it (install_keap off in tests/config.yml) to avoid a heavy Docker image
# build, same as every other Docker stack in the wet-test — not an auth limit now.
keap_repo_url: "https://github.com/thisisait/nos-keap.git"
# Immutable release tag (R10: branches make `--tags keap` builds non-
# reproducible; a force-pushed branch silently changes what gets built under
# the same image tag). v1.8.1 == v1.7.0 (files core + fs-sync) + mapped folders
# (admin fs_mappings over KEAP_FS_ROOTS), Option C shared uids
# (KEAP_FS_SHARED_UIDS — self-model visible to every tenant user), folder-hub
# detail panel + near-hop camera guard in /explore.
#
# ⚠️ NEVER PIN v1.19.0 — it is a real, immutable, released tag carrying the
# CANCELLED numeric user-root scheme (`USER_ROOT_MIN` is set in it and zero in
# every tag after it). Under v1.19.0 `registerExtNode` accepts two-digit roots
# ONLY, so the slug root `nos` is rejected with a bare `null`: the root is never
# created, every self-model card under it is invisible, and NOTHING IS LOGGED.
# The tag is deliberately not retracted — rewriting a published tag to mean
# something else is worse than a documented trap — so the trap is made loud here
# instead, and pinned by tests/anatomy/test_keap_pin_not_cancelled.py.
# Anything self-model related needs v1.21.0 or newer. NOT v1.20.0 — it carries
# slug ids but NOT boot-fixpoint registration, and ingest applies domain files in
# DIRECTORY order: `nos.infra.json` sorts before `nos.json`, so children get an
# earlier created_at than their root and single-pass boot registration drops the
# WHOLE TREE without a word. v1.21.0 fixes the point and tests both iteration
# directions. Pinned by tests/anatomy/test_keap_pin_not_cancelled.py.
keap_repo_ref: "v1.33.0"

# ── The cortex cutover (KEAP P-5) ────────────────────────────────────────────
# false ⇒ KEAP answers /agent/v1/validate with its OWN typechecker (the shipped
# default, and what has been live all along). true ⇒ it proxies to the pazny.cortex
# organ and its local typechecker never runs; compose then also plumbs
# cortex_ro_token. Requires install_cortex AND keap_repo_ref >= v1.29.0 — earlier
# images ignore the variable entirely.
#
# Separate from install_cortex on purpose: standing the organ up and repointing a
# live product's reasoning at it are two decisions. Converge the organ first, watch
# `/agent/v1/health .data.cortex` on both sides, THEN flip this. Rollback is
# flipping it back and converging — no rebuild, no tag.
keap_cortex_cutover: false

keap_mem_limit: "{{ docker_mem_limit_light | default('512m') }}"
keap_cpus: "{{ docker_cpus_light | default(1) }}"

# ── nOS architecture self-model (KEAP fs-sync tree) ──────────────────────────
# The playbook writes a deterministic knowledge tree describing nOS's OWN
# architecture (platform → stack → service) into a doctrine class-2 SHARED dir
# (docs/doctrine/filesystem.md: "app-managed multi-user content →
# tenants/<t>/shared/<svc>/"), then bind-mounts it into KEAP as a reserved
# fs-sync uid so server/fs-sync.ts (v1.7.0) mirrors it into a standalone "nOS"
# constellation in /explore and embeds each card into vector space. Generator +
# KEAP-contract analysis: docs/archive/keap-selfmodel.md.
keap_selfmodel: true
# Which shape the generator emits. `anchors` = the legacy tree whose cards anchor
# at seed nodes ([[02.02]]); `slug` = the contract-v1 tree (nos / nos.<stack> /
# nos.<stack>.<system>) ingested as canonical. Flip to `slug` in the SAME commit
# as the generator rewrite — the pin gate keys on THIS, not on the presence of a
# test fixture, because a fixture is inert and the live generator is what can
# lose a tree on a pre-v1.21.0 KEAP.
keap_selfmodel_schema: "slug"
# Class-2 shared root (NOT a per-user tree). Kept as a role default (not global)
# because it is referenced only by this role's own tasks, never by the plugin
# loader / core-up before the role runs — so the eager-resolve trap doesn't apply.
keap_selfmodel_root: "{{ nos_data_root }}/tenants/{{ nos_tenant_slug }}/shared/nos-docs"
# The reserved fs-sync owner uid the tree mounts as, and its top-class dir. The
# top dir MUST appear in keap_fs_sync_dirs (below) or fs-sync ignores it.
keap_selfmodel_uid: "nos-docs"
keap_selfmodel_top: "nOS"
# Extra dependency edges {service: [dep, ...]} beyond the auto-derived SSO→authentik.
keap_selfmodel_deps: {}
# Per-service taxonomy anchor overrides {service: "NN.NN"} (real KEAP node-ids).
keap_selfmodel_anchors: {}

# fs-sync top-class allowlist. Adds "nOS" so the self-model tree is scanned; the
# compose env reads `{{ keap_fs_sync_dirs | default('documents,library,inbox') }}`.
keap_fs_sync_dirs: "documents,library,inbox,nOS"

# ── Brain-embedding model (host Ollama) ──────────────────────────────────────
# KEAP dictates the embedding model + dim via /agent/v1/embeddings/pending; the
# host-side keap-embed-sync Pulse job calls host-loopback Ollama with it (the
# gated_net container can't reach Ollama). If this model isn't on the host Ollama
# every embed call 404s and semantic search + table vector columns stay empty —
# so post.yml `ollama pull`s it (idempotent). 768-dim.
keap_embed_model: "nomic-embed-text"
# Pull the embed model on the host during provisioning. Needs a host Ollama
# (installed + run by the openclaw role) — gated on install_openclaw so a run
# without Ollama doesn't spuriously fail. Set false to manage the model yourself.
keap_embed_pull: "{{ install_openclaw | default(false) }}"

# Extra origins permitted to iframe KEAP, beyond the nOS face. Comma-joined into
# KEAP_EMBED_ORIGINS. Real (empty) default, not a bare `| default([])` reference
# — an undefined var referenced only through default() aborts a live converge.
keap_embed_origins: []
