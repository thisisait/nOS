---
# pazny.keap/tasks/seed-geo-tables.yml — the maps & GIS DataTables (party-site).
# Shape only (rows: []): the operator enters sites; the nightly projection
# (geo-base Pulse job) copies them into PostGIS. Reuses the face per-table seeder.

- name: "[pazny.keap] Reconcile geo DataTables (party-site)"
  ansible.builtin.include_tasks: seed-face-table.yml
  loop:
    - slug: "party-site"
      def: "{{ lookup('file', playbook_dir + '/state/keap-tables/party-site.table.yml') | from_yaml }}"
      rows: []
  loop_control:
    loop_var: _face_tbl
    label: "{{ _face_tbl.slug }}"
