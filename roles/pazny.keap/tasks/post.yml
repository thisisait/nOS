---
# ── Embed model (host Ollama) — KEAP's brain-embedding dependency ─────────────
# The keap-embed-sync Pulse job embeds node/table descriptions into 768-dim
# vectors via host-loopback Ollama. The model KEAP dictates (keap_embed_model)
# must exist on the host Ollama or every embed call 404s and semantic search +
# table vector columns stay empty. `ollama pull` is idempotent (no-op if present).
# Gated on install_openclaw (which installs + runs the host Ollama); tolerant of
# a transient Ollama outage so it never blocks the converge.
- name: "[pazny.keap] Ensure embed model on host Ollama ({{ keap_embed_model }})"
  ansible.builtin.command: "ollama pull {{ keap_embed_model }}"
  environment:
    PATH: "{{ homebrew_prefix | default('/opt/homebrew') }}/bin:{{ ansible_facts['env']['PATH'] | default('', true) }}"
    OLLAMA_MODELS: "{{ ollama_models_dir | default(ansible_facts['env']['HOME'] + '/.ollama/models') }}"
    OLLAMA_HOST: "http://127.0.0.1:11434"
  register: _keap_embed_pull
  changed_when: false
  failed_when: false
  timeout: 600
  when: keap_embed_pull | default(false) | bool

- name: "[pazny.keap] Warn if the embed model pull failed (semantic search will be empty)"
  ansible.builtin.debug:
    msg: >-
      WARNING: `ollama pull {{ keap_embed_model }}` did not succeed (rc={{ _keap_embed_pull.rc | default('?') }}).
      KEAP embeddings + vector search will be empty until the model is available on the host Ollama.
      Fix: ensure Ollama is running, then `ollama pull {{ keap_embed_model }}`.
  when:
    - keap_embed_pull | default(false) | bool
    - _keap_embed_pull.rc is defined
    - _keap_embed_pull.rc != 0

# Post-start: optionally seed illustrative demo data tables so a fresh install
# shows the TableStore with real, OLAP-shaped content instead of an empty grid.
# Opt-in (keap_seed_fixtures) + once-only (the `creates` marker), matching
# KEAP's "empty state is real state" doctrine. The seed script is itself
# idempotent (fixed fixture ids), so a re-run without the marker is safe too.
# Runs here — after the stack-up health-wait — so the container is healthy and
# its loopback API is answering before we exec the seed.

- name: "[pazny.keap] Seed demo data tables (opt-in, once)"
  ansible.builtin.command:
    cmd: >-
      {{ docker_bin }} exec iiab-keap-1 node deploy/seed-fixtures.mjs
    creates: "{{ keap_home }}/.fixtures-seeded"
  register: _keap_seed
  changed_when: "'created' in (_keap_seed.stdout | default(''))"
  failed_when:
    - _keap_seed.rc is defined
    - _keap_seed.rc != 0
  when: keap_seed_fixtures | default(true) | bool

- name: "[pazny.keap] Mark fixtures as seeded (skip on later converges)"
  ansible.builtin.file:
    path: "{{ keap_home }}/.fixtures-seeded"
    state: touch
    mode: '0644'
  when:
    - keap_seed_fixtures | default(true) | bool
    - _keap_seed is defined
    - _keap_seed is not skipped

# ── Knowledge ingest (git SoT → live DB, idempotent) ─────────────────────────
# The WHOLE of knowledge/ is bind-mounted RO from the clone — not just canonical.
# The distinction matters and is the entire subject of KEAP's
# docs/specs/deploy-knowledge-mount-split.md: ingest.mjs imports ./_ontology.mjs
# and applies knowledge/ontology/, so a canonical-only mount left the image and
# the git ref on two different versions of one SoT. knowledge/ingest.mjs
# applies only the domain files whose sha256 changed (knowledge_imports marker),
# so this is a no-op on a steady converge and a full load on a blank. A restart
# materialises any applied change (registerExtNode → applyDescriptionOverride →
# rebuildFts → ensureLayout APPEND — U1 layout of existing stars never re-bakes).
# Embeddings for new nodes are filled by the nightly keap-embed-sync Pulse job.
- name: "[pazny.keap] Ingest canonical knowledge (idempotent, git SoT → live DB)"
  ansible.builtin.command:
    cmd: "{{ docker_bin }} exec iiab-keap-1 node knowledge/ingest.mjs"
  register: _keap_ingest
  changed_when: false
  failed_when:
    - _keap_ingest.rc is defined
    - _keap_ingest.rc != 0
  when: install_keap | default(false) | bool

- name: "[pazny.keap] Parse ingest result (did anything apply?)"
  ansible.builtin.set_fact:
    _keap_ingest_changed: >-
      {{ ((_keap_ingest.stdout_lines | default([]) | select('match', '^INGEST_RESULT ') | first
          | default('INGEST_RESULT {}')) | regex_replace('^INGEST_RESULT ', '') | from_json).get('changed', false) }}
  when:
    - install_keap | default(false) | bool
    - _keap_ingest is not skipped

- name: "[pazny.keap] Restart keap to materialise applied knowledge"
  ansible.builtin.command:
    cmd: "{{ docker_bin }} restart iiab-keap-1"
  changed_when: true
  when:
    - install_keap | default(false) | bool
    - _keap_ingest_changed | default(false) | bool

- name: "[pazny.keap] Wait for keap healthy after knowledge materialisation"
  ansible.builtin.command:
    cmd: "{{ docker_bin }} inspect -f '{{ '{{' }}.State.Health.Status{{ '}}' }}' iiab-keap-1"
  register: _keap_health
  until: _keap_health.stdout == 'healthy'
  retries: 30
  delay: 5
  changed_when: false
  when:
    - install_keap | default(false) | bool
    - _keap_ingest_changed | default(false) | bool

# ── nOS architecture self-model (CONTENT — generation + publish + wet gate) ──
# Deliberately AFTER the knowledge ingest above, not in the render phase where it
# used to live: cards were written a whole stack bring-up before the taxonomy
# nodes they anchor at existed, and fs-sync mirrors a card with an unresolved
# anchor silently — it just renders nowhere. main.yml now creates only the
# mountpoints; everything with bytes in it happens here, and selfmodel.yml's own
# publish order keeps "nodes before cards" structural. Ends on the wet gate:
# KEAP's own linter over the staged canonical, then a real fs/sync that must
# report zero dangling anchors.
- name: "[pazny.keap] Generate + publish the nOS architecture self-model"
  ansible.builtin.include_tasks: selfmodel.yml
  when:
    - install_keap | default(false) | bool
    - keap_selfmodel | default(true) | bool

# Best-effort: kick embeddings for the freshly-materialised nodes now instead of
# waiting for the nightly Pulse job. Never fails the play (Ollama may be busy/off;
# the scheduled keap-embed-sync is the guarantee).
- name: "[pazny.keap] Kick keap-embed-sync for new knowledge (best-effort)"
  ansible.builtin.command:
    cmd: "{{ ansible_python_interpreter | default('python3') }} {{ playbook_dir }}/files/anatomy/scripts/keap-embed-sync.py"
  # Same env the Pulse job gets (plugin.yml keap-base) — without it the script
  # exits "KEAP_AGENT_TOKEN_RW not set" and failed_when:false hid that, so the
  # kick was a silent no-op on every converge (caught on the 2026-07-17 blank).
  environment:
    KEAP_API_URL: "http://127.0.0.1:{{ keap_port | default(8091) }}"
    KEAP_AGENT_TOKEN_RW: "{{ keap_agent_token_rw }}"
  register: _keap_embed
  changed_when: false
  failed_when: false
  when:
    - install_keap | default(false) | bool
    # Either ingest pass can have added nodes: the clone's canonical above, or
    # the self-model's own canonical in selfmodel.yml. Keying only on the first
    # left a freshly-ingested self-model tree unembedded until the nightly job.
    - (_keap_ingest_changed | default(false) | bool) or (_keap_sm_ingest_changed | default(false) | bool)

# ── nOS-face config DataTables (SoC → runtime DataTable) ─────────────────────
# Create face-layouts/face-wallpapers/face-controls in KEAP and upsert their
# built-in system rows from state/keap-tables/*.table.yml. Idempotent + WHERE-
# guarded (re-run = changed=0); tolerant of the DataTable agent route not being
# live yet. Design: docs/plans/nos-face-shell-v2.md + keap-datatables-apps-systems.md.
- name: "[pazny.keap] Seed nOS-face config DataTables (layouts/wallpapers/controls)"
  ansible.builtin.include_tasks: seed-face-tables.yml
  when: install_keap | default(false) | bool
