---
# ==============================================================================
# pazny.keap/tasks/main.yml — CORTEX (knowledge layer)
#
# Called from tasks/stacks/stack-up.yml BEFORE `docker compose -p iiab up`:
# clones the nos-keap repo at the pinned ref (git-clone build precedent:
# roles/pazny.hermes), then renders the compose override fragment to
# {{ stacks_dir }}/iiab/overrides/keap.yml which stack-up.yml collects via
# `find` and passes as an additional -f flag. The image is built from the
# clone by `docker compose up` (build-from-source precedent: pazny.puter).
# ==============================================================================

- name: "[pazny.keap] Ensure home and data directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ keap_home | default(ansible_facts['env']['HOME'] + '/keap') }}"
    - "{{ keap_data_dir | default(ansible_facts['env']['HOME'] + '/keap/data') }}"
    # Universal drop dir — anything copied here becomes a datapoint on the
    # next keap-consolidate sweep (the operator's "dump it, sort it later").
    - "{{ keap_home | default(ansible_facts['env']['HOME'] + '/keap') }}/inbox"
    # FS-sync mount parent (KEAP v1.7.0): the doctrine per-user tree KEAP mounts
    # RO. Ensure it exists so Docker doesn't create a root-owned mount point.
    - "{{ nos_data_root }}/tenants/{{ nos_tenant_slug }}/users"

- name: "[pazny.keap] Generate nOS architecture self-model (KEAP fs-sync tree)"
  ansible.builtin.include_tasks: selfmodel.yml
  when: keap_selfmodel | default(true)

- name: "[pazny.keap] Clone nos-keap repository (pinned ref)"
  ansible.builtin.git:
    repo: "{{ keap_repo_url }}"
    dest: "{{ keap_src_dir }}"
    version: "{{ keap_repo_ref }}"
    force: false
    depth: 1
  register: _keap_clone
  # No custom failed_when: the git module is already idempotent (up-to-date =
  # changed:false, never failed) and signals real fetch/checkout failures via
  # fail_json. The old override ANDed `rc is defined` first, but the module's
  # fetch-failure path calls fail_json WITHOUT rc — so an unfetchable/unpushed
  # ref was reclassified as ok and the PREVIOUS checkout got built under the
  # NEW image tag. Let the module's own failure signal through.
  notify: Restart keap

- name: "[pazny.keap] Render compose override fragment"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/iiab/overrides/keap.yml"
    mode: '0600'
  notify: Restart keap

# Resolve Traefik's watched conf.d from the GLOBAL traefik_config_dir, NOT the
# role-scoped traefik_dynamic_dir (undefined outside pazny.traefik → its old
# fallback ignored the external-storage override and pointed at a ~/stacks path
# that doesn't exist when traefik_config_dir is redirected to an SSD). external-
# paths.yml set_facts traefik_config_dir globally; default installs fall back to
# ~/stacks/infra/traefik. Ensure the dir exists so we don't depend on traefik's
# ordering (Traefik merges every file in the dir anyway).
- name: "[pazny.keap] Resolve Traefik conf.d dir"
  ansible.builtin.set_fact:
    _keap_traefik_confd: "{{ traefik_config_dir | default(stacks_dir + '/infra/traefik') }}/conf.d"

- name: "[pazny.keap] Ensure Traefik conf.d exists"
  ansible.builtin.file:
    path: "{{ _keap_traefik_confd }}"
    state: directory
    mode: '0755'

# Public bearer-only ingest route (DEVICE entry point — AR glasses etc.).
# A 4th file in Traefik's watched conf.d next to the traefik-role-rendered
# {services,middlewares,tls}.yml; Traefik merges all files in the dir.
- name: "[pazny.keap] Render public ingest route (keap-ingest.yml)"
  ansible.builtin.template:
    src: traefik-ingest.yml.j2
    dest: "{{ _keap_traefik_confd }}/keap-ingest.yml"
    mode: '0644'
  when: keap_public_ingest | default(true)

- name: "[pazny.keap] Remove public ingest route when disabled"
  ansible.builtin.file:
    path: "{{ _keap_traefik_confd }}/keap-ingest.yml"
    state: absent
  when: not (keap_public_ingest | default(true))

# Browser-extension surface (/ext/v1) — a 5th conf.d file, NO authentik@file
# (an extension is cross-origin + cookieless; an SSO-gated route would answer
# pairing with the login page → the "non-JSON 200" the flow hits). The server
# enforces its own auth (pairing bootstrap public + rate-limited; the rest
# Bearer). Gated on the extension being wanted; default on with install_keap.
- name: "[pazny.keap] Render browser-extension route (keap-ext.yml)"
  ansible.builtin.template:
    src: traefik-ext.yml.j2
    dest: "{{ _keap_traefik_confd }}/keap-ext.yml"
    mode: '0644'
  when: keap_extension_surface | default(true)

- name: "[pazny.keap] Remove browser-extension route when disabled"
  ansible.builtin.file:
    path: "{{ _keap_traefik_confd }}/keap-ext.yml"
    state: absent
  when: not (keap_extension_surface | default(true))

- name: "[pazny.keap] Print info"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════
       KEAP cortex ready (starts via the IIAB stack)
      ══════════════════════════════════════════════════════
       URL:       https://{{ keap_domain | default('keap' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}
       Port:      {{ keap_port | default(8091) }} (loopback; agent surface /agent/v1)
       Source:    {{ keap_src_dir }} @ {{ keap_repo_ref }}
       Data:      {{ keap_data_dir | default(ansible_facts['env']['HOME'] + '/keap/data') }}
       SSO:       header_oidc (X-Authentik-* via gated_net; KEAP_TRUSTED_PROXY=1)
      ══════════════════════════════════════════════════════
