---
# =============================================================================
# pazny.keap/tasks/seed-face-table.yml — seed ONE face config DataTable.
#
# Included per-table by seed-face-tables.yml with `_face_tbl` = { slug, def, rows }.
# Create-if-missing (WHERE-guarded by a slug probe) + upsert only the system rows
# whose slug is not already present → re-run is changed=0. Tolerant of the
# /agent/v1/tables route being absent (404) so the converge never blocks on a KEAP
# build that predates the DataTable agent route.
# =============================================================================

- name: "[pazny.keap] Probe DataTable {{ _face_tbl.slug }} (exists?)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ keap_port | default(8091) }}/agent/v1/tables/{{ _face_tbl.slug }}"
    method: GET
    headers:
      authorization: "Bearer {{ keap_agent_token_rw }}"
    status_code: [200, 401, 404]
  register: _face_tbl_probe
  no_log: true   # Bearer keap_agent_token_rw in header
  changed_when: false
  failed_when: false

# RECONCILE, not create-if-missing. This task used to carry
# `when: _face_tbl_probe.status == 404`, which made the whole definition file
# write-once: KEAP's POST /agent/v1/tables early-returned "already exists" and
# there was no UPDATE of data_tables.schema_json anywhere, so a column added or
# given an L1 `concept:` in state/keap-tables/*.table.yml landed in git, went
# green in every offline gate, and never touched a converged install. Nothing
# was red — the change simply had no effect. KEAP now reconciles on re-POST
# (additive + relabel only; a drop or kind change comes back 409), so this runs
# unconditionally and `changed_when` keys off the response instead of the probe.
- name: "[pazny.keap] Reconcile DataTable {{ _face_tbl.slug }} (create or align columns)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ keap_port | default(8091) }}/agent/v1/tables"
    method: POST
    headers:
      authorization: "Bearer {{ keap_agent_token_rw }}"
      content-type: "application/json"
    body_format: json
    body:
      slug: "{{ _face_tbl.slug }}"
      title: "{{ _face_tbl.def.title }}"
      description: "{{ _face_tbl.def.description | default('') }}"
      driver: "{{ _face_tbl.def.driver | default('libsql') }}"
      visibility: "{{ _face_tbl.def.visibility | default('tier-users') }}"
      # §14.3 — a table's explicit ACL (dtt-share-model). `omit` rather than
      # `[]`: a table that declares no share sends nothing, so the door's own
      # default holds and a reconcile never clears an ACL the definition file
      # simply does not carry. Same silent-drop trap `view:` had — the
      # schema-pin gate's doorBody and the create contract both accept
      # sharedWith, but until now the seeder dropped it on the floor.
      sharedWith: "{{ _face_tbl.def.sharedWith | default(omit) }}"
      anchors: "{{ _face_tbl.def.anchors | default([]) }}"
      columns: "{{ _face_tbl.def.schema.columns }}"
      # Render metadata (style / facets / highlights / offer). `omit` rather than
      # `{}`: KEAP preserves a card's prior view block when the key is absent, so
      # a table that never declared one must send nothing rather than an empty
      # object that would overwrite it. Added 2026-08-28 with the two KEAP-side
      # halves — before all three, a `view:` in the definition file validated in
      # git and reached no converged install, silently.
      view: "{{ _face_tbl.def.view | default(omit) }}"
    # 409 = the definition asks for something destructive (a dropped column or a
    # changed kind). That is an AUTHORING error in the .table.yml, not a
    # transient — it is surfaced by the next task rather than silently tolerated.
    status_code: [200, 201, 404, 409]
  register: _face_tbl_create
  no_log: true   # Bearer keap_agent_token_rw in header
  # A reconcile that changed nothing still answers 200, so this reports changed
  # on every run for an existing table. Accepted deliberately: the alternative
  # is diffing the live schema here, which re-implements KEAP's own comparison
  # in Jinja and would drift from it. Idempotence of EFFECT is asserted by
  # KEAP's table-schema-reconcile.test.ts.
  changed_when: _face_tbl_create.status | default(0) in [200, 201]

- name: "[pazny.keap] Fail when the DataTable definition asks for a destructive change"
  ansible.builtin.fail:
    msg: >-
      KEAP refused the schema for {{ _face_tbl.slug }} (409). The definition in
      state/keap-tables/{{ _face_tbl.slug }}.table.yml drops a column or changes
      a column's kind, and rows already hold those values. Add columns and
      relabel freely; to remove or re-type one, drop and recreate the table
      deliberately.
  when: _face_tbl_create.status | default(0) == 409

- name: "[pazny.keap] Warn if the KEAP DataTable route is not live yet ({{ _face_tbl.slug }})"
  ansible.builtin.debug:
    msg: >-
      KEAP /agent/v1/tables did not accept the create for {{ _face_tbl.slug }}
      (status={{ _face_tbl_create.status | default('n/a') }}). The face BFF will
      serve the vendored repo defaults until the DataTable agent route lands.
  # 404 only: the route itself is absent (a KEAP build predating it). 409 is a
  # definition error and already failed above; 200/201 succeeded.
  when: _face_tbl_create.status | default(0) == 404

- name: "[pazny.keap] Fetch existing rows of {{ _face_tbl.slug }} (idempotency WHERE-guard)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ keap_port | default(8091) }}/agent/v1/tables/{{ _face_tbl.slug }}/rows"
    method: GET
    headers:
      authorization: "Bearer {{ keap_agent_token_rw }}"
    status_code: [200, 401, 404]
  register: _face_rows_probe
  no_log: true   # Bearer keap_agent_token_rw in header
  changed_when: false
  failed_when: false

- name: "[pazny.keap] Compute already-seeded row slugs for {{ _face_tbl.slug }}"
  ansible.builtin.set_fact:
    _face_existing_row_slugs: >-
      {{ ((_face_rows_probe.json | default({})).rows | default([])) | map(attribute='slug') | list }}

- name: "[pazny.keap] Upsert MISSING system rows into {{ _face_tbl.slug }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ keap_port | default(8091) }}/agent/v1/tables/{{ _face_tbl.slug }}/rows"
    method: POST
    headers:
      authorization: "Bearer {{ keap_agent_token_rw }}"
      content-type: "application/json"
    body_format: json
    body: "{{ item }}"
    status_code: [200, 201, 404]
  loop: "{{ _face_tbl.rows }}"
  loop_control:
    label: "{{ _face_tbl.slug }}/{{ item.slug }}"
  register: _face_row_upsert
  no_log: true   # Bearer keap_agent_token_rw in header
  changed_when: _face_row_upsert.status | default(0) in [200, 201]
  # Only attempt rows once the table is reachable (probe 200 = pre-existing, or
  # we just created it). Skip the missing-route case entirely.
  when:
    - item.slug not in _face_existing_row_slugs
    - (_face_tbl_probe.status | default(0) == 200) or (_face_tbl_create.status | default(0) in [200, 201])
