---
# ==============================================================================
# pazny.cortex — the reasoning organ (host Node daemon, P-4 build seq. step 9).
#
# The fourth host organ beside Bone (signals), Wing (observes) and Pulse (keeps
# time): Cortex remembers and reasons. A loopback-only Node 22 daemon serving
# POST /agent/v1/validate + GET /agent/v1/validate/opcodes + /health, built from
# the vendored KEAP v1.27.0 port at files/anatomy/cortex/.
#
# ── Why the daemon runs IN-PLACE from the playbook tree (no ~/cortex/app) ────
# The organ's self-model half (cortex-config.ts NOS_ROOT) resolves
# state/manifest.yml, files/anatomy/plugins/ and docs/systems/ RELATIVE TO ITS
# OWN MODULE PATH — the self-model describes the estate, so the code must live
# where the estate's descriptors live. An rsynced runtime copy would point
# NOS_ROOT at ~/../.. and the coverage assertion would refuse the store. The
# STORE is what must survive `git clean`, and it lives outside the tree.
#
# Store: ~/cortex/data/keap.db — the basename is fixed by the vendored port
# (server/db.ts:30); the DIRECTORY is the isolation boundary. This is NOT a
# shared keap.db (docs/specs/cortex-full-scope-decision.md "Two corrections"):
# different directory, own db_identity, and cortex-store.ts refuses to open a
# store file the organ did not create.
# ==============================================================================

cortex_port: 8098          # loopback-only, beside Bone's 8099
cortex_domain: "cortex{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"

cortex_launchd_label: "eu.thisisait.nos.cortex"

# Vendored organ source — the daemon's WorkingDirectory. Deliberately the
# playbook tree, see the header.
cortex_src_dir: "{{ playbook_dir }}/files/anatomy/cortex"

# The organ's store DIRECTORY (env CORTEX_STORE_PATH). Outside the playbook
# tree so neither `git clean` nor a repo re-clone can wipe reasoning history.
cortex_store_path: "{{ ansible_facts['env']['HOME'] }}/cortex/data"
cortex_log_dir: "{{ ansible_facts['env']['HOME'] }}/cortex/log"

# Host Ollama (MLX) — NOT consumed by the C1 daemon (validate reads no
# embedder); recorded here because the C2 embed-sync Pulse job and the recall
# gate are specified against it (design §3). Kept so the variable has one home.
cortex_ollama_url: "http://127.0.0.1:11434"

# Generate + ingest the nOS self-model at materialise time (env CORTEX_SELFMODEL).
# Off only for a deliberately spine-only store (the onto1 digest state).
cortex_selfmodel_enabled: true

# Node binary override. Empty ⇒ auto-detect the nvm default (tasks/node.yml
# installs it); the organ needs Node >= 22 (package.json engines).
cortex_node_bin: ""

# ==============================================================================
# S2 — the corpus mirror (docs/plans/cortex-corpus-parallel.md)
#
# The organ reads the SAME host trees KEAP's compose file stacks at /user-files,
# but as a HOST daemon: no bind mount, no container. Two roots, ordered, each
# declaring how uids are derived. `child-dirs` is KEAP's behaviour verbatim;
# `literal:<uid>` walks a root as if it were one uid's own directory, which is
# how the `:ro`-mounted self-model tree keeps deriving the ids the container
# derives through the nested mount.
#
# Permissions are NOT part of the derivation: fs-sync reads no st.uid, no
# getuid(), no mode. Read-only-ness is enforced by the daemon never opening a
# file for writing, and by the operator's own filesystem permissions.
# ==============================================================================

cortex_fs_enabled: true

# The per-user doctrine tree. REAL USER DATA — read, never written.
cortex_fs_users_root: "{{ nos_data_root }}/tenants/{{ nos_tenant_slug }}/users"

# The published self-model tree. Sourced from the HOST tree the converge writes
# (keap_selfmodel_root), NOT from the organ's own generated stage, for one
# transitional reason with a named exit: roles/pazny.keap/tasks/selfmodel.yml
# invokes the generator with --facts-json (live image/version/port/domain/
# mem_limit/cpus) and cortex-store.ts::runSelfmodel passes none of them. Same
# ids, DIFFERENT card bodies — so S3's "one corpus, two indexes" would be
# quietly false while an id-only diff read green. The exit (the converge writes
# a facts JSON that runSelfmodel passes through) is S4 scope.
cortex_fs_shared_root: "{{ keap_selfmodel_root | default(nos_data_root ~ '/tenants/' ~ nos_tenant_slug ~ '/shared/nos-docs') }}"

# MUST match keap_fs_sync_dirs and keap_selfmodel_uid. A divergence here does
# not fail — it produces two corpora that legitimately differ, which the
# nightly diff then reports as a defect that is really a config mismatch.
cortex_fs_sync_dirs: "{{ keap_fs_sync_dirs | default('documents,library,inbox,nOS') }}"
cortex_fs_shared_uids: "{{ keap_selfmodel_uid | default('nos-docs') }}"

# 0 disables the in-daemon timer. Default 0: the pass is driven explicitly so a
# night is a decision rather than a coincidence of when the daemon last
# restarted — and so §5.3's "halt the organ's fs-sync" has something to halt.
#
# WHAT DRIVES IT (this used to be the sentence's missing half, and its absence
# was not cosmetic): the boot pass, the converge kick at the end of
# tasks/main.yml, and the nightly `cortex-fs-sync` Pulse job at 04:30 UTC
# (files/anatomy/plugins/cortex-base/plugin.yml). With none of those, 0 meant the
# organ's mirror froze at the last converge that changed the build while KEAP
# re-walked every 300 s, every file created since read as `only_in_keap` over a
# clean-but-old pass, and the nightly diff blamed the organ's reader for files it
# had never been asked to walk — which the 3-night agreement clock can never
# survive. If you set this non-zero, the halt in §5.3 must also stop the timer,
# not only the job.
cortex_fs_sync_interval_s: 0

# ── the mount sentinel ────────────────────────────────────────────────────────
# nos_data_root is a REMOVABLE volume. An unmounted volume presents as an empty
# directory — or, after an eject, as a stale empty MOUNTPOINT — both of which
# walk cleanly and scan zero files. The five prune guards all react AFTER the
# walk; the sentinel is what makes the organ refuse to walk at all.
# Written at nos_data_root, NEVER inside tenants/<slug>/users: the user tree is
# real user data and nothing in this stage writes to it.
cortex_mount_sentinel_path: "{{ nos_data_root }}/.nos-mount-ok"
