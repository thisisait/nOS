---
# ==============================================================================
# pazny.cortex — build, materialise and run the reasoning organ.
#
# Sequence: dirs → Node probe → npm ci (lock-sha guarded) → build (staleness
# guarded) → store:materialise (git + self-model, restart on change) → plist /
# systemd unit → health wait. The daemon opens the store WITHOUT materialising
# (CORTEX_MATERIALISE_ON_BOOT stays unset) — a restart must not re-walk 107
# canonical files before it can answer a health probe; the converge is what
# materialises.
#
# Gating happens at the import site in main.yml (import_role propagates its
# `when: install_cortex` to every task here) — no end_play guard, because this
# role is imported into the main host play and end_play would kill it.
# ==============================================================================

# ── Runtime directories ──────────────────────────────────────────────────────

- name: "[pazny.cortex] Ensure store + log directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ cortex_store_path }}"
    - "{{ cortex_log_dir }}"

# ── Node 22 resolution (nvm default, tasks/node.yml) ─────────────────────────

- name: "[pazny.cortex] Detect the Node binary (nvm default)"
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix | default('/opt/homebrew') }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix | default('/opt/homebrew') }}/opt/nvm/nvm.sh"
    [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
    nvm use default >/dev/null 2>&1 || true
    command -v node || true
  args:
    executable: /bin/bash
  register: _cortex_node_probe
  changed_when: false
  check_mode: false
  when: cortex_node_bin | length == 0

- name: "[pazny.cortex] Resolve the Node binary"
  ansible.builtin.set_fact:
    _cortex_node_bin: "{{ cortex_node_bin if cortex_node_bin | length > 0 else (_cortex_node_probe.stdout_lines | last | default('')) }}"

- name: "[pazny.cortex] Assert Node >= 22 (package.json engines)"
  ansible.builtin.command:
    argv: ["{{ _cortex_node_bin }}", "-v"]
  register: _cortex_node_version
  changed_when: false
  check_mode: false
  failed_when: >-
    _cortex_node_version.rc != 0 or
    (_cortex_node_version.stdout | trim | regex_replace('^v', '') | split('.') | first | int) < 22

# ── npm ci — guarded by a package-lock sha stamp, not `creates:` ─────────────
# `creates: node_modules` never reinstalls after a lockfile bump; a bare
# `npm ci` reinstalls on every converge. The stamp reruns exactly when the
# lock changed (or node_modules is gone) and is idempotent otherwise.

- name: "[pazny.cortex] npm ci (when package-lock.json changed)"
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ cortex_src_dir }}"
    LOCK_SHA=$(shasum -a 256 package-lock.json | cut -d' ' -f1)
    STAMP=node_modules/.nos-lock-sha
    if [ ! -d node_modules ] || [ "$(cat "$STAMP" 2>/dev/null)" != "$LOCK_SHA" ]; then
      "{{ _cortex_node_bin | dirname }}/npm" ci --no-audit --no-fund
      echo "$LOCK_SHA" > "$STAMP"
      echo NOS_CHANGED
    fi
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ _cortex_node_bin | dirname }}:/usr/local/bin:/usr/bin:/bin"
  register: _cortex_npm_ci
  changed_when: "'NOS_CHANGED' in _cortex_npm_ci.stdout"

# ── Build — tsc typecheck + esbuild bundle, only when sources are newer ──────

- name: "[pazny.cortex] Build dist-server/index.js (when sources changed)"
  ansible.builtin.shell: |
    set -e
    cd "{{ cortex_src_dir }}"
    if [ ! -f dist-server/index.js ] || [ -n "$(find server shared src knowledge package.json tsconfig.json tsconfig.server.json -type f -newer dist-server/index.js -print -quit 2>/dev/null)" ]; then
      "{{ _cortex_node_bin | dirname }}/npm" run -s build
      echo NOS_CHANGED
    fi
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ _cortex_node_bin | dirname }}:/usr/local/bin:/usr/bin:/bin"
  register: _cortex_build
  changed_when: "'NOS_CHANGED' in _cortex_build.stdout"
  notify: Restart cortex

# ── Materialise the store from git + the self-model generator ────────────────
# Runs at converge time (build seq. step 9) so a daemon restart never re-walks
# the tree. The daemon holds the composed tree IN MEMORY, so a materialise that
# changed rows must restart it — changed_when reads the ingest trailer and the
# self-model applied count off the CLI output.
# python3 (self-model generator) resolves via PATH: the pyenv shim first, the
# way the operator's ansible itself runs.

- name: "[pazny.cortex] Materialise the store (git tree + self-model)"
  ansible.builtin.command:
    argv: ["{{ _cortex_node_bin | dirname }}/npm", "run", "-s", "store:materialise"]
    chdir: "{{ cortex_src_dir }}"
  environment:
    PATH: "{{ _cortex_node_bin | dirname }}:{{ ansible_facts['env']['HOME'] }}/.pyenv/shims:{{ homebrew_prefix | default('/opt/homebrew') }}/bin:/usr/local/bin:/usr/bin:/bin"
    CORTEX_STORE_PATH: "{{ cortex_store_path }}"
    CORTEX_SELFMODEL: "{{ '1' if (cortex_selfmodel_enabled | default(true) | bool) else '0' }}"
  register: _cortex_materialise
  changed_when: >-
    ('"changed":true' in _cortex_materialise.stdout) or
    (_cortex_materialise.stdout is search('self-model: [1-9][0-9]* domain'))
  notify: Restart cortex

# ── S2: the corpus mirror seam (docs/plans/cortex-corpus-parallel.md) ────────
# Everything here runs BEFORE the plist is rendered and the daemon bootstrapped,
# because the daemon runs an fs-sync pass at BOOT: a sentinel written afterwards
# would make the first pass of every fresh converge a refusal.

- name: "[pazny.cortex] Compose the ordered fs roots list"
  ansible.builtin.set_fact:
    # ORDER IS THE CONTRACT. The users tree first, the published self-model tree
    # second — the same order the compose file stacks them at /user-files, so the
    # first-root-wins collision rule resolves the same way on both sides.
    # `literal:<uid>` walks the shared root as one uid's own directory, which is
    # what makes its relPaths (and therefore its object ids) identical to the
    # ones the container derives through the nested mount.
    _cortex_fs_user_roots: "child-dirs={{ cortex_fs_users_root }},literal:{{ cortex_fs_shared_uids }}={{ cortex_fs_shared_root }}"
  when: cortex_fs_enabled | bool

- name: "[pazny.cortex] Read the data root's volume UUID (recorded in the sentinel)"
  # `diskutil info` takes a VOLUME, not an arbitrary path inside one: given
  # {{ nos_data_root }} (a subdirectory of the mount) it exits 1 and prints a
  # plist with no VolumeUUID, so the UUID could never be read on any estate
  # whose data root is not itself a mount point. Resolve the mount point with
  # `df` first and ask diskutil about that.
  #
  # /bin/df by absolute path, not `df`: this operator's PATH resolves `df` to
  # Homebrew's `duf`, which has no -P and exits non-zero. The command must not
  # depend on which shims happen to be ahead of /bin on a given host.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      /usr/sbin/diskutil info -plist \
        "$(/bin/df -P {{ nos_data_root | quote }} | tail -1 | awk '{ print $NF }')"
    executable: /bin/bash
  register: _cortex_diskutil
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cortex_fs_enabled | bool
    - ansible_os_family == 'Darwin'

- name: "[pazny.cortex] Extract the volume UUID"
  ansible.builtin.set_fact:
    # Best-effort: recorded for a human reading the sentinel, never asserted on.
    # The tenant slug is the discriminator that matters — it is what catches a
    # DIFFERENT volume mounted at the same path, which is the case where every
    # uid goes missing at once and the per-uid guard cannot help.
    #
    # `+ ['']` is load-bearing, not defensive dressing: `regex_findall` yields []
    # on no match and `first` RAISES on an empty sequence, so a trailing
    # `| default('', true)` never runs — the filter has already thrown. That is
    # what failed the converge here: a best-effort field aborted the play on a
    # non-Darwin host, in check mode, or whenever diskutil printed no UUID.
    _cortex_volume_uuid: >-
      {{ ((_cortex_diskutil.stdout | default(''))
          | regex_findall('<key>VolumeUUID</key>\s*<string>([^<]+)</string>')
          + ['']) | first }}
  when: cortex_fs_enabled | bool

# ── S2: the mount sentinel ───────────────────────────────────────────────────
# nos_data_root is a REMOVABLE volume, and the organ's fs mirror walks it. An
# unmounted volume presents as an empty directory — or, after an eject, as a
# stale empty MOUNTPOINT — and both walk cleanly and scan zero files. The five
# prune guards in fs-sync all REACT to a bad found-set after the walk; this file
# is what lets the daemon refuse to walk at all.
#
# It is written at nos_data_root, NEVER inside tenants/<slug>/users: that tree
# is real user data and this stage writes nothing into it. The converge is the
# only writer; the organ only ever reads it.
- name: "[pazny.cortex] Assert the data root is actually mounted"
  ansible.builtin.stat:
    path: "{{ nos_data_root }}"
  register: _cortex_data_root
  when: cortex_fs_enabled | bool

- name: "[pazny.cortex] Fail when the data root is absent — the sentinel must not be written into a phantom"
  ansible.builtin.fail:
    msg: >-
      {{ nos_data_root }} is not a directory. Writing the mount sentinel here would
      create it on the boot volume UNDER an empty mountpoint, and the organ would then
      happily walk an empty tree while believing the disk was present — which is the
      exact failure the sentinel exists to prevent. Mount the volume and re-run.
  when:
    - cortex_fs_enabled | bool
    - not (_cortex_data_root.stat.isdir | default(false))

- name: "[pazny.cortex] Write the mount sentinel"
  ansible.builtin.copy:
    dest: "{{ cortex_mount_sentinel_path }}"
    mode: '0644'
    content: |
      {{ {
           'tenant': nos_tenant_slug,
           'volumeUuid': (_cortex_volume_uuid | default('')) or None,
           'writtenAt': ansible_date_time.iso8601,
           'dataRoot': nos_data_root,
         } | to_nice_json }}
  when: cortex_fs_enabled | bool

# ── Service manager: launchd (macOS) | systemd --user (Linux) ────────────────

# ---- macOS: launchd ----
- name: "[pazny.cortex] Render launchd plist"
  ansible.builtin.template:
    src: cortex.plist.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ cortex_launchd_label }}.plist"
    # 0600: the plist embeds CORTEX_TOKEN_RO/RW — the whole agent surface.
    # Same threat model as the Bone plist.
    mode: '0600'
  notify: Restart cortex
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[pazny.cortex] Bootstrap launchd job (idempotent)"
  ansible.builtin.shell: |
    set -e
    PLIST=~/Library/LaunchAgents/{{ cortex_launchd_label }}.plist
    UID_NUM=$(id -u)
    if launchctl print "gui/${UID_NUM}/{{ cortex_launchd_label }}" >/dev/null 2>&1; then
      echo "already-loaded"
    else
      launchctl bootstrap gui/${UID_NUM} "$PLIST"
      echo "bootstrapped"
    fi
  register: _cortex_bootstrap
  changed_when: "'bootstrapped' in _cortex_bootstrap.stdout"
  when: (nos_service_manager | default('launchd')) == 'launchd'

# ---- Linux: systemd --user (env mirrors cortex.plist.j2 EnvironmentVariables) ----
- name: "[pazny.cortex] (Linux) Build systemd --user environment"
  ansible.builtin.set_fact:
    _cortex_systemd_env:
      HOME: "{{ ansible_facts['env']['HOME'] }}"
      PATH: "{{ _cortex_node_bin | dirname }}:/usr/local/bin:/usr/bin:/bin"
      CORTEX_PORT: "{{ cortex_port | string }}"
      CORTEX_STORE_PATH: "{{ cortex_store_path }}"
      CORTEX_TOKEN_RO: "{{ cortex_ro_token | default('') }}"
      CORTEX_TOKEN_RW: "{{ cortex_rw_token | default('') }}"
      CORTEX_TOKEN_CAPTURE: "{{ cortex_capture_token | default('') }}"
      CORTEX_SELFMODEL: "{{ '1' if (cortex_selfmodel_enabled | default(true) | bool) else '0' }}"
      CORTEX_FS_USER_ROOTS: "{{ _cortex_fs_user_roots }}"
      CORTEX_FS_SYNC_DIRS: "{{ cortex_fs_sync_dirs }}"
      CORTEX_FS_SHARED_UIDS: "{{ cortex_fs_shared_uids }}"
      CORTEX_FS_SYNC_INTERVAL_S: "{{ cortex_fs_sync_interval_s | string }}"
      CORTEX_FS_MOUNT_SENTINEL: "{{ cortex_mount_sentinel_path }}"
      CORTEX_FS_TENANT_SLUG: "{{ nos_tenant_slug }}"
  no_log: true   # the dict embeds both bearer tokens — keep them out of -vvv output
  when: (nos_service_manager | default('launchd')) == 'systemd-user'

- name: "[pazny.cortex] (Linux) Install systemd --user service"
  ansible.builtin.include_role:
    name: pazny.linux.systemd_user
    tasks_from: ensure_unit
  vars:
    su_name: "{{ cortex_launchd_label }}"
    su_description: "nOS Cortex — reasoning organ (validate surface)"
    su_exec_start: "{{ _cortex_node_bin }} dist-server/index.js"
    su_working_dir: "{{ cortex_src_dir }}"
    su_environment: "{{ _cortex_systemd_env }}"
  when: (nos_service_manager | default('launchd')) == 'systemd-user'

# ── Health — flush the restart first, then require the daemon to answer ──────

- name: "[pazny.cortex] Flush handlers (apply a pending restart now)"
  ansible.builtin.meta: flush_handlers

- name: "[pazny.cortex] Wait for /health"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ cortex_port }}/health"
    status_code: 200
    return_content: false
  register: _cortex_health
  retries: 12
  delay: 5
  until: _cortex_health.status | default(0) == 200

# ── Kick one mirror pass, the way pazny.keap does at the end of selfmodel.yml ─
# The daemon walks at boot, and the role restarts it only when the plist template
# changes — so on a converge that changed anything else, the organ's mirror stays
# frozen at whatever the last build-changing converge saw while KEAP re-walks
# every 300 s. Nightly cover is the `cortex-fs-sync` Pulse job; this is the
# converge half, so a run that publishes new self-model cards leaves the organ
# holding them instead of waiting until 04:30.
#
# Never fatal: a REFUSED pass (the mount sentinel — nos_data_root is a removable
# volume) is exactly the state the sentinel exists to produce, and it must not
# take a converge down. 409 = a pass is already in flight, which is a success.
- name: "[pazny.cortex] Kick one fs-sync pass (the converge half of the trigger)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ cortex_port }}/agent/v1/fs/sync"
    method: POST
    headers:
      Authorization: "Bearer {{ cortex_rw_token }}"
    body_format: json
    body: {}
    status_code: [200, 409]
    timeout: 600
  register: _cortex_fs_kick
  failed_when: false
  changed_when: >-
    ((_cortex_fs_kick.json.data.upserted | default(0)) | int
     + (_cortex_fs_kick.json.data.removed | default(0)) | int) > 0
  when: cortex_fs_enabled | default(true) | bool
  no_log: true   # the Authorization header carries the RW token

- name: "[pazny.cortex] Report the fs-sync pass (a refusal must be legible)"
  ansible.builtin.debug:
    msg: >-
      cortex fs-sync: status {{ _cortex_fs_kick.status | default('skipped') }} ·
      scanned {{ _cortex_fs_kick.json.data.scanned | default('n/a') }} ·
      upserted {{ _cortex_fs_kick.json.data.upserted | default('n/a') }} ·
      removed {{ _cortex_fs_kick.json.data.removed | default('n/a') }} ·
      sentinel {{ _cortex_fs_kick.json.data.sentinel | default('n/a') }}
      {{ '— REFUSED, nothing walked and nothing pruned (check the mount sentinel)'
         if (_cortex_fs_kick.status | default(0)) | int not in [200, 409] else '' }}
  when: cortex_fs_enabled | default(true) | bool

- name: "[pazny.cortex] Setup summary"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════════════════
       Cortex — the reasoning organ (host {{ nos_service_manager | default('launchd') }}) ready
      ══════════════════════════════════════════════════════════════════
       Label:        {{ cortex_launchd_label }}
       Source:       {{ cortex_src_dir }}/  (runs in-place, see defaults)
       Store:        {{ cortex_store_path }}/keap.db  (own db_identity)
       Logs:         {{ cortex_log_dir }}/launchd.{out,err}.log
       Listening:    127.0.0.1:{{ cortex_port }}  (loopback only, NO route)
       Health:       http://127.0.0.1:{{ cortex_port }}/health
       Surface:      POST /agent/v1/validate · GET /agent/v1/validate/opcodes

       Status:       launchctl print gui/$(id -u)/{{ cortex_launchd_label }}
       Reload:       launchctl kickstart -k gui/$(id -u)/{{ cortex_launchd_label }}
      ══════════════════════════════════════════════════════════════════
