---
# ==============================================================================
# OPENCLAW — Self-hosted AI agent with Ollama backend
# No API key, everything runs locally on Mac Studio
# ==============================================================================

# The Wing half of the launchd env the Ollama loop used to set (moved 2026-10-06
# with Ollama into roles/pazny.ollama); same keys, same values, before the gateway.
- name: "[OpenClaw] Set launchd env vars (Wing API)"
  ansible.builtin.command: "launchctl setenv {{ item.key }} {{ item.value }}"
  loop:
    - { key: "WING_API_URL", value: "http://127.0.0.1:9000" }
    - { key: "WING_API_TOKEN", value: "{{ openclaw_wing_api_token }}" }
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  changed_when: false
  no_log: "{{ item.key == 'WING_API_TOKEN' }}"
  when: nos_service_manager == 'launchd'

- name: "[Ollama] Pull primary model ({{ openclaw_model }})"
  ansible.builtin.command: ollama pull {{ openclaw_model }}
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] | default('', true) }}"
    OLLAMA_MODELS: "{{ ollama_models_dir }}"
    OLLAMA_HOST: "http://127.0.0.1:11434"
  changed_when: false
  failed_when: false
  timeout: 1800

- name: "[Ollama] Pull additional models (MoE fallback + dense heavy-duty)"
  ansible.builtin.command: ollama pull {{ item }}
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] | default('', true) }}"
    OLLAMA_MODELS: "{{ ollama_models_dir }}"
    OLLAMA_HOST: "http://127.0.0.1:11434"
  loop: "{{ openclaw_additional_models | default([]) }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  failed_when: false
  timeout: 1800
  when: (openclaw_pull_additional_models | default(true)) | bool

# -- 2. OpenClaw installation ──────────────────────────────────────────────────────

- name: "[OpenClaw] Check if OpenClaw is already installed"
  ansible.builtin.command: which openclaw
  register: openclaw_which
  changed_when: false
  failed_when: false

- name: "[OpenClaw] Install OpenClaw via npm"
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default
    npm install -g {{ '--ignore-scripts' if (npm_ignore_scripts | default(true)) else '' }} openclaw
  args:
    executable: /bin/zsh
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  when: openclaw_which.rc != 0
  changed_when: true

# -- 3. Directory structure of the agentic system --------------------------

- name: "[OpenClaw] Create agentic directory structure"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ openclaw_agents_dir }}"
    - "{{ openclaw_log_dir }}"
    - "{{ openclaw_projects_dir }}"
    - "{{ ansible_facts['env']['HOME'] }}/.openclaw"
    - "{{ ansible_facts['env']['HOME'] }}/.openclaw/workspace"

# -- 4. Non-interactive onboarding (Ollama) ───────────────────────────────────

- name: "[OpenClaw] Check if already onboarded"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.openclaw/openclaw.json"
  register: _oc_config

- name: "[OpenClaw] Run non-interactive onboarding"
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default
    export OLLAMA_API_KEY="ollama-local"
    openclaw onboard --non-interactive \
      --mode local \
      --auth-choice ollama \
      --custom-base-url "http://127.0.0.1:11434" \
      --custom-model-id "{{ openclaw_model }}" \
      --accept-risk \
      --workspace "{{ ansible_facts['env']['HOME'] }}/.openclaw/workspace" \
      --gateway-port 18789 \
      --gateway-bind loopback \
      --install-daemon \
      --skip-health \
      --skip-skills
  args:
    executable: /bin/zsh
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
    HOME: "{{ ansible_facts['env']['HOME'] }}"
    OLLAMA_API_KEY: "ollama-local"
  when: not _oc_config.stat.exists
  register: _oc_onboard
  failed_when: false
  changed_when: _oc_onboard.rc == 0

# -- The gateway plist is written once and never re-read ---------------------
#
# MEASURED 2026-08-11. `nos-smoke` had openclaw DEAD on 127.0.0.1:18789 with
# `launchctl list` reporting exit **78** (EX_CONFIG), and the refusal itself was
# unreadable: the plist sends StandardErrorPath to /dev/null, so the daemon
# discarded its own explanation on every restart. Run by hand, it says:
#
#     Your OpenClaw config was written by version 2026.7.1-2, but this command
#     is running 2026.6.11. Refusing to run automatic gateway startup
#     migrations because this binary is older than the config.
#
# OpenClaw is right to refuse. The estate is what was wrong, and this is the
# same defect family the Ollama preflight above already names — a plist written
# once and never re-read — arriving by a different road:
#
#   `npm install -g openclaw` installs into WHATEVER NODE IS CURRENT. This host
#   carries four, one per nvm version it has passed through:
#
#       2026.5.19   node v24.15.0
#       2026.6.1    node v24.16.0
#       2026.6.11   node v24.18.0   <- the plist launches this one
#       2026.7.1-2  node v24.19.0   <- this one is on PATH and wrote the config
#
#   Every node bump strands the previous install and leaves the plist pointing
#   at it. The onboarding task above passes `--install-daemon`, but only
#   `when: not _oc_config.stat.exists` — first run only. So the one task that
#   could have repaired this is the one task that never runs again.
#
# The remedy is OpenClaw's own (`gateway install --force`), not a hand-written
# plist: the service file is the vendor's property and its shape is theirs to
# change (ssot/doctrine/foreign-properties.md). We only decide WHEN to ask.
#
# Idempotent by comparison, not by flag: on a steady estate the two paths agree
# and nothing here runs.

- name: "[OpenClaw] Which openclaw does the gateway service actually launch"
  ansible.builtin.shell: |
    plist="$HOME/Library/LaunchAgents/{{ openclaw_gateway_launchd_label }}.plist"
    [ -f "$plist" ] || exit 0
    python3 -c '
    import plistlib, sys
    args = plistlib.load(open(sys.argv[1], "rb")).get("ProgramArguments", [])
    hit = next((a for a in args if "/node_modules/openclaw" in a), "")
    print(hit.split("/node_modules/openclaw")[0] + "/node_modules/openclaw" if hit else "")
    ' "$plist"
  args:
    executable: /bin/bash
  register: _oc_plist_target
  changed_when: false
  failed_when: false
  when: nos_service_manager == 'launchd'

- name: "[OpenClaw] Which openclaw is on PATH — the one that writes the config"
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && . "{{ homebrew_prefix }}/opt/nvm/nvm.sh" >/dev/null 2>&1
    nvm use default >/dev/null 2>&1 || true
    bin=$(command -v openclaw 2>/dev/null) || exit 0
    python3 -c '
    import os, sys
    p = os.path.realpath(sys.argv[1])
    print(p.split("/node_modules/openclaw")[0] + "/node_modules/openclaw" if "/node_modules/openclaw" in p else "")
    ' "$bin"
  args:
    executable: /bin/bash
  register: _oc_path_target
  changed_when: false
  failed_when: false
  when: nos_service_manager == 'launchd'

- name: "[OpenClaw] Repoint the gateway service at the openclaw on PATH"
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && . "{{ homebrew_prefix }}/opt/nvm/nvm.sh" >/dev/null 2>&1
    nvm use default >/dev/null 2>&1 || true
    openclaw gateway install --force --port {{ openclaw_gateway_port | default(18789) }}
  args:
    executable: /bin/bash
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
    HOME: "{{ ansible_facts['env']['HOME'] }}"
  register: _oc_daemon_repoint
  changed_when: (_oc_daemon_repoint.rc | default(1)) == 0
  failed_when: false
  when:
    - nos_service_manager == 'launchd'
    - (_oc_path_target.stdout | default('') | trim) != ''
    - (_oc_plist_target.stdout | default('') | trim) != (_oc_path_target.stdout | default('') | trim)

# Only asserted when we just acted. A gateway that was already fine is not this
# task's claim to make, and a converge on a host whose openclaw is deliberately
# stopped must not go red for it.
- name: "[OpenClaw] Verify the repointed gateway actually listens"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openclaw_gateway_port | default(18789) }}/"
    status_code: [200, 401, 403]
    timeout: 5
  register: _oc_gateway_probe
  retries: 12
  delay: 5
  until: _oc_gateway_probe is success
  when:
    - not ansible_check_mode
    - _oc_daemon_repoint is defined
    - _oc_daemon_repoint is changed

- name: "[OpenClaw] Set maxConcurrent in config"
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default
    openclaw config set agents.defaults.maxConcurrent {{ openclaw_max_concurrent_agents | default(4) }} --strict-json
  args:
    executable: /bin/zsh
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  changed_when: false
  failed_when: false

# OpenAI-compatible HTTP API (2026-10-01). Measured: 2026.7.1 answered 404 on
# /v1/chat/completions, so AgentKit's openclaw-* provider had no wire at all.
# The token is OPERATOR-grade (upstream docs/gateway/openai-http-api.md), so the
# bind is re-asserted loopback FIRST and the enable only runs after it held.
# Gate: tests/anatomy/test_openclaw_http_api_is_loopback_only.py.
- name: "[OpenClaw] Serve the OpenAI HTTP API on loopback only"
  ansible.builtin.shell: |
    set -e
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default >/dev/null
    if [ "$(openclaw config get gateway.bind 2>/dev/null)" != "loopback" ]; then
      openclaw config set gateway.bind '"loopback"' --strict-json; echo CHANGED
    fi
    want={{ 'true' if (openclaw_http_api_enabled | bool) else 'false' }}
    if [ "$(openclaw config get gateway.http.endpoints.chatCompletions.enabled 2>/dev/null)" != "$want" ]; then
      openclaw config set gateway.http.endpoints.chatCompletions.enabled "$want" --strict-json; echo CHANGED
    fi
  args:
    executable: /bin/zsh
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  register: _oc_http_api
  changed_when: "'CHANGED' in _oc_http_api.stdout"
  when: _oc_config.stat.exists or (_oc_onboard.rc | default(1)) == 0

# The gateway token, copied into ~/.nos/secrets.yml for the `openclaw` backend
# row (nos:openclaw_gateway_token). OpenClaw mints it; nOS never rotates it.
- name: "[OpenClaw] Read the gateway token"
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.openclaw/openclaw.json"
  register: _oc_config_raw
  failed_when: false
  no_log: true

- name: "[OpenClaw] Persist the gateway token into ~/.nos/secrets.yml (in-role)"
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.nos/secrets.yml"
    regexp: '^openclaw_gateway_token:'
    line: 'openclaw_gateway_token: "{{ _oc_token }}"'
    create: true
    mode: '0600'
  vars:
    _oc_token: "{{ (_oc_config_raw.content | b64decode | from_json).get('gateway', {}).get('auth', {}).get('token', '') }}"
  when:
    - _oc_config_raw.content is defined
    - _oc_token | length > 0
  no_log: true

# Idempotent model upgrade: onboarding is skipped if the config exists, but the user
# could change openclaw_model. Forcibly updating `agents.defaults.model.primary`
# so that the playbook can upgrade/downgrade the model without the user having to wipe.
- name: "[OpenClaw] Force-update primary model in existing config"
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default
    openclaw config set agents.defaults.model.primary "ollama/{{ openclaw_model }}" --strict-json
  args:
    executable: /bin/zsh
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  when: _oc_config.stat.exists
  register: _oc_model_update
  changed_when: _oc_model_update.rc == 0
  failed_when: false

# ── 5. Workspace bootstrap soubory ──────────────────────────────────────────

- name: "[OpenClaw] Deploy SOUL.md (Inspektor Klepitko persona)"
  ansible.builtin.template:
    # WAS a static `copy:` of files/openclaw/SOUL.md — 280 lines that could not
    # know a single estate variable, and had drifted accordingly: it taught
    # nginx as the HTTPS proxy and *.dev.local hostnames long after Traefik
    # became primary and this tenant moved to its own TLD. Now the same rendered
    # source Hermes uses; only the runtime block differs.
    src: personas/klepitko.md.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.openclaw/workspace/SOUL.md"
    mode: '0644'
  vars:
    persona_runtime: openclaw

- name: "[OpenClaw] Deploy AGENTS.md (sub-agents config)"
  ansible.builtin.copy:
    src: openclaw/AGENTS.md
    dest: "{{ ansible_facts['env']['HOME'] }}/.openclaw/workspace/AGENTS.md"
    mode: '0644'

- name: "[OpenClaw] Deploy TOOLS.md (allowed tools)"
  ansible.builtin.copy:
    src: openclaw/TOOLS.md
    dest: "{{ ansible_facts['env']['HOME'] }}/.openclaw/workspace/TOOLS.md"
    mode: '0644'

- name: "[OpenClaw] Ensure OLLAMA_API_KEY + Wing API vars in shell profile"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    marker: "# {mark} OPENCLAW - ANSIBLE MANAGED"
    block: |
      export OLLAMA_API_KEY="ollama-local"
      export OLLAMA_MODELS="{{ ollama_models_dir }}"
      export OLLAMA_MAX_LOADED_MODELS="{{ ollama_max_loaded_models | default(1) }}"
      export OLLAMA_NUM_PARALLEL="{{ ollama_num_parallel | default(2) }}"
      export OLLAMA_KEEP_ALIVE="{{ ollama_keep_alive | default('5m') }}"
      export OLLAMA_FLASH_ATTENTION="{{ ollama_flash_attention | default(1) }}"
      export OLLAMA_KV_CACHE_TYPE="{{ ollama_kv_cache_type | default('q8_0') }}"
      export WING_API_URL="http://127.0.0.1:9000"
      export WING_API_TOKEN="{{ openclaw_wing_api_token }}"
    create: true
    mode: '0600'   # .zshrc holds a live WING_API_TOKEN — not world-readable
  no_log: true     # block embeds openclaw_wing_api_token

- name: "[OpenClaw] Secure openclaw config directory permissions"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.openclaw"
    mode: '0700'
    state: directory

# -- 5. Log templates and initialization files ------------------------------

- name: "[OpenClaw] Copy log template"
  ansible.builtin.copy:
    src: openclaw/log-template.md
    dest: "{{ openclaw_log_dir }}/_TEMPLATE.md"
    mode: '0644'

- name: "[OpenClaw] Create initial README in log dir"
  ansible.builtin.copy:
    dest: "{{ openclaw_log_dir }}/README.md"
    content: |
      # Inspektor Klepitko - Log of agentic work

      This directory contains structured records (.md files) about the agents' work.

      ## Naming convention
      ```
      YYYY-MM-DD_TASK-NNN_short-description.md
      ```

      ## Task state
      - `STATUS: PLANNED` - planned, waiting to start
      - `STATUS: IN_PROGRESS` - in progress
      - `STATUS: COMPLETE` - done
      - `STATUS: FAILED` - failed (see the Result section)
      - `STATUS: DELEGATED` - delegated to a sub-agent

      ## System directories
      | Path | Purpose |
      |-------|------|
      | `{{ openclaw_agents_dir }}/` | Installation and agent config |
      | `{{ openclaw_log_dir }}/` | This directory - logs |
      | `{{ openclaw_projects_dir }}/` | Projects hosted via nginx |
      | `{{ homebrew_prefix }}/etc/nginx/sites-available/` | Nginx vhost configuration |
    mode: '0644'
    force: false

- name: "[OpenClaw] Deploy onboard.sh script"
  ansible.builtin.copy:
    src: openclaw/onboard.sh
    dest: "{{ openclaw_agents_dir }}/onboard.sh"
    mode: '0755'

# -- 6. Nginx — update webroot to ~/projects/ ──────────────────────

- name: "[OpenClaw] Ensure nginx default project dir exists"
  ansible.builtin.file:
    path: "{{ openclaw_projects_dir }}/default"
    state: directory
    mode: '0755'

- name: "[OpenClaw] Create default project landing page"
  ansible.builtin.copy:
    dest: "{{ openclaw_projects_dir }}/default/index.html"
    content: |
      <!DOCTYPE html>
      <html lang="cs">
      <head>
        <meta charset="UTF-8">
        <title>Inspektor Klepitko - Server</title>
        <style>
          body { font-family: monospace; background: #0d1117; color: #e6edf3;
                 display: flex; justify-content: center; align-items: center;
                 min-height: 100vh; margin: 0; }
          .card { border: 1px solid #30363d; padding: 2rem; border-radius: 8px;
                  max-width: 600px; }
          h1 { color: #58a6ff; }
          code { background: #161b22; padding: 2px 6px; border-radius: 4px;
                 color: #79c0ff; }
          .status { color: #3fb950; }
        </style>
      </head>
      <body>
        <div class="card">
          <h1>Inspektor Klepitko</h1>
          <p class="status">Server running</p>
          <p>To add a project:</p>
          <ol>
            <li>Copy files into <code>{{ openclaw_projects_dir }}/&lt;project&gt;/</code></li>
            <li>Copy and adjust the nginx vhost from
              <code>{{ homebrew_prefix }}/etc/nginx/sites-available/</code></li>
            <li>Restartuj: <code>brew services restart nginx</code></li>
          </ol>
        </div>
      </body>
      </html>
    mode: '0644'
    force: false

# -- 7. Final summary ------------------------------------------------------

- name: "[OpenClaw] Print setup summary"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════
       Inspektor Klepitko — OpenClaw ready
      ══════════════════════════════════════════════════════
       Model:     {{ openclaw_model }} (Ollama, 100% local)
       Config:    ~/.openclaw/openclaw.json
       Workspace: ~/.openclaw/workspace/
       Persona:   ~/.openclaw/workspace/SOUL.md
       Agenti:    {{ openclaw_agents_dir }}/
       Projekty:  {{ openclaw_projects_dir }}/
       Logy:      {{ openclaw_log_dir }}/

       Gateway:   openclaw gateway run
       TUI:       openclaw tui
       Health:    openclaw health
      ══════════════════════════════════════════════════════
