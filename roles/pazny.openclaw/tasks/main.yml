---
# ==============================================================================
# OPENCLAW — Self-hosted AI agent with Ollama backend
# No API key, everything runs locally on Mac Studio
# ==============================================================================

# -- 1. Ollama (local LLM inference) ─────────────────────────────────────────

- name: "[Ollama] Install/upgrade Ollama via Homebrew (0.19+ = MLX backend on Apple Silicon)"
  community.general.homebrew:
    name: ollama
    state: latest
  when: nos_pkg_manager == 'homebrew'

# `state: latest` upgrades to the latest of WHICHEVER FORMULA WINS THE NAME, and
# a third-party tap outranks homebrew/core. On this host `pazny/local` has done
# exactly that since June, so "latest" meant 0.30.7 while core moved to 0.32.6 —
# for weeks, with every run reporting changed=false and success.
#
# So the landed binary is read back against the pin, the same way
# `frankenphp_version` is (roles/pazny.wing/tasks/main.yml). The shadowing tap is
# named in the failure because that is the part nobody could see: it is not in
# `homebrew_taps`, so nothing in this repository knows it exists.
# READ THE KEG, NOT THE SERVER — and they are different questions (2026-08-09).
#
# The first version ran `ollama --version`, which reports the RUNNING DAEMON's
# version, not the installed one. Right after the operator switched taps that
# said:
#
#     $ brew list --versions ollama      ->  ollama 0.32.6
#     $ ollama --version                 ->  ollama version is 0.30.7
#                                            Warning: client version is 0.32.6
#
# The keg was correct and the daemon was still executing the old binary, because
# a keg swap does not restart launchd — the same defect family as the plist that
# was written and never re-read. So this preflight would have failed a converge
# that had just done exactly the right thing, and it would have failed BEFORE
# the LaunchAgent reload further down that fixes it.
#
# Two questions, two checks: the keg is asserted here (did brew install the pin)
# and the daemon is asserted AFTER the reload (is the estate running it).
- name: "[Ollama] Read the installed ollama keg version"
  ansible.builtin.command: brew list --versions ollama
  register: _ollama_keg
  changed_when: false
  failed_when: false
  when: nos_pkg_manager == 'homebrew'

- name: "[Ollama] Read the version the running daemon reports"
  ansible.builtin.command: ollama --version
  register: _ollama_ver
  changed_when: false
  failed_when: false
  when: nos_pkg_manager == 'homebrew'

# THE PATTERN MATTERS AND THE FIRST ONE WAS WRONG (fixed 2026-08-09, same day).
# This grepped for the literal `shadows homebrew/core/ollama`. Brew actually
# prints, backticks and all:
#
#     Warning: `ollama` shadows `homebrew/core/ollama`.
#
# so it never matched, the diagnosis below never rendered, and the operator's
# converge told them to run `brew upgrade ollama` — which is a NO-OP precisely
# because the tap shadows core. The one task whose whole job was to explain the
# situation sent them in a circle instead. Match the word, not the punctuation.
- name: "[Ollama] Find any tap shadowing homebrew/core/ollama"
  ansible.builtin.shell: |
    set -o pipefail
    brew info ollama 2>&1 | grep -ci 'shadows' || true
  args:
    executable: /bin/bash
  register: _ollama_shadow
  changed_when: false
  failed_when: false
  when:
    - nos_pkg_manager == 'homebrew'
    - ollama_version | default('') | length > 0
    - ollama_version not in (_ollama_keg.stdout | default(''))

- name: "[Ollama] Refuse when the INSTALLED keg is not the pin"
  ansible.builtin.fail:
    msg: |
      brew has not installed the pinned ollama {{ ollama_version }}.
        keg:    {{ _ollama_keg.stdout | default('(none)') | trim }}
        daemon: {{ _ollama_ver.stdout | default('(none)') | trim }}
      {% if (_ollama_shadow.stdout | default('0') | trim | int) > 0 %}
        CAUSE: a third-party tap outranks homebrew/core for the name `ollama`,
        so `state: latest` has been upgrading within that tap and
        `brew upgrade ollama` is a NO-OP. Check `brew tap`.
        Fix (one operator action — models in {{ ollama_models_dir }} survive it):
          brew uninstall ollama && brew untap pazny/local && brew install ollama
      {% elif _ollama_shadow.rc | default(1) != 0 %}
        The shadow probe did not run, so this cannot tell a stale formula from a
        shadowing tap. Check `brew info ollama` for a "shadows" warning BEFORE
        reaching for `brew upgrade` — under a shadowing tap the upgrade does
        nothing and looks like it worked.
      {% else %}
        No shadowing tap found. `brew upgrade ollama`, then re-pin
        ollama_version in default.config.yml if upstream has moved past it.
      {% endif %}
  when:
    - nos_pkg_manager == 'homebrew'
    - ollama_version | default('') | length > 0
    - ollama_version not in (_ollama_keg.stdout | default(''))

- name: "[Ollama] Ensure models directory exists (persistent across --blank)"
  ansible.builtin.file:
    path: "{{ ollama_models_dir }}"
    state: directory
    mode: '0755'

- name: "[Ollama] Set launchd env vars (models path + memory + KV cache + Wing API)"
  ansible.builtin.command: "launchctl setenv {{ item.key }} {{ item.value }}"
  loop:
    - { key: "OLLAMA_MODELS", value: "{{ ollama_models_dir }}" }
    - { key: "OLLAMA_MAX_LOADED_MODELS", value: "{{ ollama_max_loaded_models | default(1) }}" }
    - { key: "OLLAMA_NUM_PARALLEL", value: "{{ ollama_num_parallel | default(2) }}" }
    - { key: "OLLAMA_KEEP_ALIVE", value: "{{ ollama_keep_alive | default('5m') }}" }
    - { key: "OLLAMA_FLASH_ATTENTION", value: "{{ ollama_flash_attention | default(1) }}" }
    - { key: "OLLAMA_KV_CACHE_TYPE", value: "{{ ollama_kv_cache_type | default('q8_0') }}" }
    - { key: "OLLAMA_CONTEXT_LENGTH", value: "{{ ollama_context_length | default(32768) | string }}" }
    - { key: "WING_API_URL", value: "http://127.0.0.1:9000" }
    - { key: "WING_API_TOKEN", value: "{{ openclaw_wing_api_token }}" }
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  changed_when: false
  no_log: "{{ item.key == 'WING_API_TOKEN' }}"
  when: nos_service_manager == 'launchd'

- name: "[Ollama] Stop OpenClaw gateway (holds persistent Ollama connection)"
  ansible.builtin.command: pkill -f 'openclaw-gateway'
  changed_when: false
  failed_when: false

# -- Ollama persistent LaunchAgent (replaces brew-managed plist) ─────────────
# Brew's homebrew.mxcl.ollama.plist HAS NO env vars, so OLLAMA_MODELS
# would be lost after reboot/logout. Our wrapper plist has EnvironmentVariables
# directly in the dict that launchd injects on every start.

- name: "[Ollama] Disable brew-managed Ollama service (replaced by user LaunchAgent)"
  ansible.builtin.shell: |
    # Stop brew service (gracefully via launchctl, not `brew services stop`)
    plist="$HOME/Library/LaunchAgents/homebrew.mxcl.ollama.plist"
    if [ -f "$plist" ]; then
      launchctl unload "$plist" 2>/dev/null || true
      # Presun do backup (kdyby user chtel vratit)
      mv "$plist" "$plist.disabled" 2>/dev/null || true
    fi
    # Kill any running instance (brew or our own wrapper)
    launchctl unload "$HOME/Library/LaunchAgents/com.ollama.agent.plist" 2>/dev/null || true
    pkill -f 'ollama serve' 2>/dev/null || true
    sleep 1
    echo "DONE"
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: nos_service_manager == 'launchd'

- name: "[Ollama] Wait for port 11434 to be free"
  ansible.builtin.wait_for:
    port: 11434
    state: stopped
    timeout: 15
  failed_when: false

- name: "[Ollama] Deploy persistent user LaunchAgent (com.ollama.agent)"
  ansible.builtin.template:
    src: com.ollama.agent.plist.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/com.ollama.agent.plist"
    mode: '0644'
  when: nos_service_manager == 'launchd'

- name: "[Ollama] Load user LaunchAgent (com.ollama.agent)"
  ansible.builtin.command: >
    launchctl load "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/com.ollama.agent.plist"
  register: ollama_svc
  changed_when: true
  failed_when: >
    ollama_svc.rc != 0 and
    'already loaded' not in (ollama_svc.stderr | default(''))
  when: nos_service_manager == 'launchd'

- name: "[Ollama] Wait for Ollama process to start"
  ansible.builtin.shell: |
    for i in $(seq 1 15); do
      pgrep -f 'ollama serve' > /dev/null 2>&1 && exit 0
      sleep 1
    done
    exit 1
  changed_when: false
  failed_when: false

- name: "[Ollama] Wait for API to respond"
  ansible.builtin.uri:
    url: "http://127.0.0.1:11434/api/version"
    status_code: [200]
    timeout: 5
  register: _ollama_api
  # Cold blank=true freshly restarts Ollama, which can take well over 20s to
  # bind on macOS — the old 10x2s gave up and the subsequent `ollama pull` could
  # race a not-yet-ready Ollama (failed_when:false → silent missing model).
  # 30x5s (~2.5min) blocks until it actually serves. Stays failed_when:false so
  # a genuinely-down Ollama doesn't abort the (Ollama-independent) core platform.
  retries: 30
  delay: 5
  until: _ollama_api.status | default(0) == 200
  failed_when: false

# RESTART ON DRIFT, BECAUSE `launchctl load` IS NOT A RESTART (2026-08-09).
#
# A keg swap replaces the binary on disk and leaves the running daemon executing
# the old one; `launchctl load` above answers "already loaded" and changes
# nothing. Measured the moment the operator moved off the shadowing tap:
#
#     brew list --versions ollama  ->  ollama 0.32.6
#     ollama --version             ->  ollama version is 0.30.7
#                                      Warning: client version is 0.32.6
#
# The client is new, the SERVER is old, and every consumer — hermes, openclaw,
# KEAP embeddings, face ask — keeps talking to 0.30.7. That is the same defect
# as the launchd plist that was written and never re-read
# (roles/pazny.wing/tasks/main.yml), and it wants the same answer: compare what
# is running against what is installed, and reload on the DIFFERENCE rather than
# on having just written something.
- name: "[Ollama] Compare the running daemon against the installed keg"
  ansible.builtin.shell: |
    set -o pipefail
    keg=$(brew list --versions ollama 2>/dev/null | awk '{print $2}')
    srv=$(ollama --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
    [ -n "$keg" ] && [ "$keg" = "$srv" ] && echo same || echo "drift keg=$keg srv=$srv"
  args:
    executable: /bin/bash
  register: _ollama_drift
  changed_when: false
  failed_when: false
  when: nos_service_manager == 'launchd'

- name: "[Ollama] Reload the daemon so it execs the installed binary"
  ansible.builtin.shell: |
    set -o pipefail
    L="{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/com.ollama.agent.plist"
    launchctl bootout "gui/$(id -u)/com.ollama.agent" 2>/dev/null || true
    sleep 2
    launchctl bootstrap "gui/$(id -u)" "$L"
  args:
    executable: /bin/bash
  changed_when: true
  failed_when: false
  when:
    - nos_service_manager == 'launchd'
    - "'drift' in (_ollama_drift.stdout | default(''))"

# The daemon half of the pin, asserted only AFTER the reload has had its chance.
# Split from the keg check on purpose: "brew installed the wrong version" and
# "the right version is installed and nothing is running it" are different
# faults with different fixes, and one message covering both would name neither.
- name: "[Ollama] Re-read the daemon version after the reload"
  ansible.builtin.shell: |
    set -o pipefail
    for i in $(seq 1 15); do
      v=$(ollama --version 2>/dev/null | head -1 || true)
      case "$v" in *{{ ollama_version }}*) echo "$v"; exit 0;; esac
      sleep 2
    done
    ollama --version 2>&1 | head -1 || true
  args:
    executable: /bin/bash
  register: _ollama_ver_after
  changed_when: false
  failed_when: false
  when:
    - nos_pkg_manager == 'homebrew'
    - ollama_version | default('') | length > 0

- name: "[Ollama] Refuse when the estate is running a version it did not install"
  ansible.builtin.fail:
    msg: |
      the installed keg is {{ ollama_version }} but the running daemon reports
      something else, so every consumer is still talking to the old binary.
        daemon: {{ _ollama_ver_after.stdout | default('(none)') | trim }}
      The reload above should have fixed this. If it did not, do it by hand:
        launchctl bootout gui/$(id -u)/com.ollama.agent
        launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.ollama.agent.plist
  when:
    - nos_pkg_manager == 'homebrew'
    - ollama_version | default('') | length > 0
    - ollama_version not in (_ollama_ver_after.stdout | default(''))

- name: "[Ollama] Pull primary model ({{ openclaw_model }})"
  ansible.builtin.command: ollama pull {{ openclaw_model }}
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] | default('', true) }}"
    OLLAMA_MODELS: "{{ ollama_models_dir }}"
    OLLAMA_HOST: "http://127.0.0.1:11434"
  changed_when: false
  failed_when: false
  timeout: 1800

- name: "[Ollama] Pull additional models (MoE fallback + dense heavy-duty)"
  ansible.builtin.command: ollama pull {{ item }}
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] | default('', true) }}"
    OLLAMA_MODELS: "{{ ollama_models_dir }}"
    OLLAMA_HOST: "http://127.0.0.1:11434"
  loop: "{{ openclaw_additional_models | default([]) }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  failed_when: false
  timeout: 1800
  when: (openclaw_pull_additional_models | default(true)) | bool

# -- 2. OpenClaw installation ──────────────────────────────────────────────────────

- name: "[OpenClaw] Check if OpenClaw is already installed"
  ansible.builtin.command: which openclaw
  register: openclaw_which
  changed_when: false
  failed_when: false

- name: "[OpenClaw] Install OpenClaw via npm"
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default
    npm install -g {{ '--ignore-scripts' if (npm_ignore_scripts | default(true)) else '' }} openclaw
  args:
    executable: /bin/zsh
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  when: openclaw_which.rc != 0
  changed_when: true

# -- 3. Directory structure of the agentic system --------------------------

- name: "[OpenClaw] Create agentic directory structure"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ openclaw_agents_dir }}"
    - "{{ openclaw_log_dir }}"
    - "{{ openclaw_projects_dir }}"
    - "{{ ansible_facts['env']['HOME'] }}/.openclaw"
    - "{{ ansible_facts['env']['HOME'] }}/.openclaw/workspace"

# -- 4. Non-interactive onboarding (Ollama) ───────────────────────────────────

- name: "[OpenClaw] Check if already onboarded"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.openclaw/openclaw.json"
  register: _oc_config

- name: "[OpenClaw] Run non-interactive onboarding"
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default
    export OLLAMA_API_KEY="ollama-local"
    openclaw onboard --non-interactive \
      --mode local \
      --auth-choice ollama \
      --custom-base-url "http://127.0.0.1:11434" \
      --custom-model-id "{{ openclaw_model }}" \
      --accept-risk \
      --workspace "{{ ansible_facts['env']['HOME'] }}/.openclaw/workspace" \
      --gateway-port 18789 \
      --gateway-bind loopback \
      --install-daemon \
      --skip-health \
      --skip-skills
  args:
    executable: /bin/zsh
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
    HOME: "{{ ansible_facts['env']['HOME'] }}"
    OLLAMA_API_KEY: "ollama-local"
  when: not _oc_config.stat.exists
  register: _oc_onboard
  failed_when: false
  changed_when: _oc_onboard.rc == 0

- name: "[OpenClaw] Set maxConcurrent in config"
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default
    openclaw config set agents.defaults.maxConcurrent {{ openclaw_max_concurrent_agents | default(4) }} --strict-json
  args:
    executable: /bin/zsh
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  changed_when: false
  failed_when: false

# Idempotent model upgrade: onboarding is skipped if the config exists, but the user
# could change openclaw_model. Forcibly updating `agents.defaults.model.primary`
# so that the playbook can upgrade/downgrade the model without the user having to wipe.
- name: "[OpenClaw] Force-update primary model in existing config"
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default
    openclaw config set agents.defaults.model.primary "ollama/{{ openclaw_model }}" --strict-json
  args:
    executable: /bin/zsh
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  when: _oc_config.stat.exists
  register: _oc_model_update
  changed_when: _oc_model_update.rc == 0
  failed_when: false

# ── 5. Workspace bootstrap soubory ──────────────────────────────────────────

- name: "[OpenClaw] Deploy SOUL.md (Inspektor Klepitko persona)"
  ansible.builtin.template:
    # WAS a static `copy:` of files/openclaw/SOUL.md — 280 lines that could not
    # know a single estate variable, and had drifted accordingly: it taught
    # nginx as the HTTPS proxy and *.dev.local hostnames long after Traefik
    # became primary and this tenant moved to its own TLD. Now the same rendered
    # source Hermes uses; only the runtime block differs.
    src: personas/klepitko.md.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.openclaw/workspace/SOUL.md"
    mode: '0644'
  vars:
    persona_runtime: openclaw

- name: "[OpenClaw] Deploy AGENTS.md (sub-agents config)"
  ansible.builtin.copy:
    src: openclaw/AGENTS.md
    dest: "{{ ansible_facts['env']['HOME'] }}/.openclaw/workspace/AGENTS.md"
    mode: '0644'

- name: "[OpenClaw] Deploy TOOLS.md (allowed tools)"
  ansible.builtin.copy:
    src: openclaw/TOOLS.md
    dest: "{{ ansible_facts['env']['HOME'] }}/.openclaw/workspace/TOOLS.md"
    mode: '0644'

- name: "[OpenClaw] Ensure OLLAMA_API_KEY + Wing API vars in shell profile"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    marker: "# {mark} OPENCLAW - ANSIBLE MANAGED"
    block: |
      export OLLAMA_API_KEY="ollama-local"
      export OLLAMA_MODELS="{{ ollama_models_dir }}"
      export OLLAMA_MAX_LOADED_MODELS="{{ ollama_max_loaded_models | default(1) }}"
      export OLLAMA_NUM_PARALLEL="{{ ollama_num_parallel | default(2) }}"
      export OLLAMA_KEEP_ALIVE="{{ ollama_keep_alive | default('5m') }}"
      export OLLAMA_FLASH_ATTENTION="{{ ollama_flash_attention | default(1) }}"
      export OLLAMA_KV_CACHE_TYPE="{{ ollama_kv_cache_type | default('q8_0') }}"
      export WING_API_URL="http://127.0.0.1:9000"
      export WING_API_TOKEN="{{ openclaw_wing_api_token }}"
    create: true
    mode: '0600'   # .zshrc holds a live WING_API_TOKEN — not world-readable
  no_log: true     # block embeds openclaw_wing_api_token

- name: "[OpenClaw] Secure openclaw config directory permissions"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.openclaw"
    mode: '0700'
    state: directory

# -- 5. Log templates and initialization files ------------------------------

- name: "[OpenClaw] Copy log template"
  ansible.builtin.copy:
    src: openclaw/log-template.md
    dest: "{{ openclaw_log_dir }}/_TEMPLATE.md"
    mode: '0644'

- name: "[OpenClaw] Create initial README in log dir"
  ansible.builtin.copy:
    dest: "{{ openclaw_log_dir }}/README.md"
    content: |
      # Inspektor Klepitko - Log of agentic work

      This directory contains structured records (.md files) about the agents' work.

      ## Naming convention
      ```
      YYYY-MM-DD_TASK-NNN_short-description.md
      ```

      ## Task state
      - `STATUS: PLANNED` - planned, waiting to start
      - `STATUS: IN_PROGRESS` - in progress
      - `STATUS: COMPLETE` - done
      - `STATUS: FAILED` - failed (see the Result section)
      - `STATUS: DELEGATED` - delegated to a sub-agent

      ## System directories
      | Path | Purpose |
      |-------|------|
      | `{{ openclaw_agents_dir }}/` | Installation and agent config |
      | `{{ openclaw_log_dir }}/` | This directory - logs |
      | `{{ openclaw_projects_dir }}/` | Projects hosted via nginx |
      | `{{ homebrew_prefix }}/etc/nginx/sites-available/` | Nginx vhost configuration |
    mode: '0644'
    force: false

- name: "[OpenClaw] Deploy onboard.sh script"
  ansible.builtin.copy:
    src: openclaw/onboard.sh
    dest: "{{ openclaw_agents_dir }}/onboard.sh"
    mode: '0755'

# -- 6. Nginx — update webroot to ~/projects/ ──────────────────────

- name: "[OpenClaw] Ensure nginx default project dir exists"
  ansible.builtin.file:
    path: "{{ openclaw_projects_dir }}/default"
    state: directory
    mode: '0755'

- name: "[OpenClaw] Create default project landing page"
  ansible.builtin.copy:
    dest: "{{ openclaw_projects_dir }}/default/index.html"
    content: |
      <!DOCTYPE html>
      <html lang="cs">
      <head>
        <meta charset="UTF-8">
        <title>Inspektor Klepitko - Server</title>
        <style>
          body { font-family: monospace; background: #0d1117; color: #e6edf3;
                 display: flex; justify-content: center; align-items: center;
                 min-height: 100vh; margin: 0; }
          .card { border: 1px solid #30363d; padding: 2rem; border-radius: 8px;
                  max-width: 600px; }
          h1 { color: #58a6ff; }
          code { background: #161b22; padding: 2px 6px; border-radius: 4px;
                 color: #79c0ff; }
          .status { color: #3fb950; }
        </style>
      </head>
      <body>
        <div class="card">
          <h1>Inspektor Klepitko</h1>
          <p class="status">Server running</p>
          <p>To add a project:</p>
          <ol>
            <li>Copy files into <code>{{ openclaw_projects_dir }}/&lt;project&gt;/</code></li>
            <li>Copy and adjust the nginx vhost from
              <code>{{ homebrew_prefix }}/etc/nginx/sites-available/</code></li>
            <li>Restartuj: <code>brew services restart nginx</code></li>
          </ol>
        </div>
      </body>
      </html>
    mode: '0644'
    force: false

# -- 7. Final summary ------------------------------------------------------

- name: "[OpenClaw] Print setup summary"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════
       Inspektor Klepitko — OpenClaw ready
      ══════════════════════════════════════════════════════
       Model:     {{ openclaw_model }} (Ollama, 100% local)
