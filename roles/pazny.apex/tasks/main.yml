---
# ==============================================================================
# pazny.apex/tasks/main.yml
#
# Called from tasks/stacks/stack-up.yml BEFORE `docker compose -p iiab up`:
# gates on the SIGNED apex ruling, builds the static site from the repo,
# places it under {{ apex_web_root }} for a read-only bind mount, and renders
# the compose override fragment to {{ stacks_dir }}/iiab/overrides/apex.yml.
#
# THE SIGNATURE GATE COMES FIRST AND EVERYTHING ELSE IS BEHIND IT.
# files/anatomy/apex/ruling.yml is the operator-signable allow-list that
# decides what may appear on an unauthenticated page at the root domain.
# While it says `status: PROPOSED`, this role FAILS THE CONVERGE LOUDLY —
# it does not skip, and it does not render a compose override that a later
# `docker compose up` would happily serve. Belt and braces: the build script
# itself re-checks the same signature (`build.py --require-signed`, exit 4),
# so reordering these tasks cannot silently open the door.
# Gate: tests/anatomy/test_apex_serving_is_signature_gated.py.
# ==============================================================================

- name: "[pazny.apex] Read the public-surface ruling"
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/files/anatomy/apex/ruling.yml"
  register: _apex_ruling_raw

- name: "[pazny.apex] REFUSE to serve while the ruling is unsigned"
  vars:
    _apex_ruling: "{{ _apex_ruling_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - _apex_ruling.status == 'SIGNED'
      - (_apex_ruling.signed_by | default('', true) | trim | length) > 0
    fail_msg: >-
      files/anatomy/apex/ruling.yml is status={{ _apex_ruling.status }},
      signed_by={{ _apex_ruling.signed_by | default('null', true) }}.
      The apex page is a public projection of the estate's anatomy and may
      not be built for serving until the operator has read and signed the
      ruling (every `speaks:` phrase and organ title), set status: SIGNED
      and signed_by, and reconverged. Nothing was rendered and no route
      will exist. To silence this instead, set install_apex: false.
    success_msg: >-
      apex ruling v{{ _apex_ruling.version }} SIGNED by
      {{ _apex_ruling.signed_by | default('?', true) }}

- name: "[pazny.apex] Ensure web root parent exists"
  ansible.builtin.file:
    path: "{{ apex_web_root | dirname }}"
    state: directory
    mode: '0755'

# Deterministic build (ruling decision D3): byte-identical output for the
# same repo inputs, so re-running is a no-op in content terms. The script
# re-verifies the signature itself and exits 4 on an unsigned ruling.
- name: "[pazny.apex] Build the public site into the web root (signature re-checked)"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/files/anatomy/apex/build.py"
      - "--require-signed"
      - "--out"
      - "{{ apex_web_root }}"
  register: _apex_build
  changed_when: false

# ── The site is on the host. Ask the CONTAINER whether it is also there. ─────
# Measured 2026-08-17: the build used to clear its output directory by
# removing and recreating it, which gave the web root a new inode while the
# running container's bind mount still pointed at the old one. Host: correct.
# Converge: failed=0. World: 403. build.py no longer does that
# (tests/anatomy/test_apex_rebuild_keeps_the_web_root.py), but a mount can go
# stale for reasons this role does not author — an external-storage remount,
# a manual move — and the failure is silent on every surface except the page
# itself. So the container is asked, and a container that cannot see its own
# content is removed rather than restarted: `restart` keeps the container,
# and with it the mount that is the problem. The compose-up that follows this
# role in stack-up.yml then builds a fresh one against the current inode.
- name: "[pazny.apex] Ask the container whether it can see the page it serves"
  ansible.builtin.command:
    argv: ["{{ docker_bin }}", "exec", "iiab-apex-1",
           "test", "-s", "/usr/share/nginx/html/index.html"]
  register: _apex_sees_its_content
  failed_when: false
  changed_when: false

- name: "[pazny.apex] Remove a container whose mount no longer resolves"
  ansible.builtin.command:
    argv: ["{{ docker_bin }}", "rm", "-f", "iiab-apex-1"]
  # rc 1 from `docker exec` on a MISSING container is the ordinary first-run
  # case and must not trigger a removal; only a container that exists and
  # cannot read its own index does.
  when: >-
    _apex_sees_its_content.rc != 0
    and 'No such container' not in (_apex_sees_its_content.stderr | default(''))
  changed_when: true

- name: "[pazny.apex] Deploy nginx server config (server_tokens off)"
  ansible.builtin.template:
    src: apex-nginx.conf.j2
    dest: "{{ stacks_dir }}/iiab/apex-nginx.conf"
    mode: '0644'
  notify: Restart apex

- name: "[pazny.apex] Render compose override fragment"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/iiab/overrides/apex.yml"
    mode: '0600'
  notify: Restart apex
