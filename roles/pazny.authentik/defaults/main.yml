---
# ==============================================================================
# pazny.authentik — Authentik (server + worker) in Docker (infra compose stack)
#
# Credentials (authentik_secret_key, authentik_db_password,
# authentik_bootstrap_password) and the whole OIDC registry (authentik_oidc_apps,
# authentik_rbac_tiers, authentik_app_tiers, authentik_default_groups) stay in
# top-level default.config.yml / default.credentials.yml — centralized for
# prefix rotation and shared with the compose fragments of other services
# (each service reads an authentik_oidc_<svc>_client_id derived var).
# ==============================================================================

# DB pool tuning — default 0 closes the connection after every request so
# Authentik does not hold hundreds of idle connections that would otherwise
# exhaust the shared Postgres pool (Outline / Hedgedoc / Firefly depend on
# free slots).
authentik_pg_conn_max_age: 0
# Workers, threads and limits are config knobs (default.config.yml) so a profile can size them.
