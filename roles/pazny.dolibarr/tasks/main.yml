---
# Rendered into {{ stacks_dir }}/b2b/overrides/dolibarr.yml before compose up.

- name: "[pazny.dolibarr] Ensure data directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dolibarr_data_dir }}"
    - "{{ dolibarr_custom_dir }}"

# The backup organ deliberately records an EMPTY declared source as FAILED
# (a vanished source reading as "OK — N sources" is the incident class the
# rule closed), and a fresh Dolibarr has no custom modules — so the nightly
# went red on an honest emptiness (measured 2026-09-23). This marker is real
# content that also tells a future operator what the directory is FOR.
- name: "[pazny.dolibarr] Marker so the empty custom dir backs up honestly"
  ansible.builtin.copy:
    dest: "{{ dolibarr_custom_dir }}/README.nos.md"
    mode: "0644"
    content: |
      # Dolibarr custom modules

      Mounted at /var/www/html/custom in the b2b-dolibarr container.
      Third-party or in-house Dolibarr modules land here and survive image
      upgrades; nightly backup carries this whole directory (source
      `dir-dolibarr-custom` in default.config.yml).

- name: "[pazny.dolibarr] Render compose override fragment"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/b2b/overrides/dolibarr.yml"
    mode: "0600"
  notify: Restart dolibarr

- name: "[pazny.dolibarr] Print installation info"
  ansible.builtin.debug:
    msg: |
      Dolibarr → https://{{ dolibarr_domain }} (127.0.0.1:{{ dolibarr_port }})
      DB {{ dolibarr_db_name }} @ mariadb. SSO: Authentik forward_auth (gate).
      Documents: {{ dolibarr_data_dir }}
