---
# ==============================================================================
# pazny.pulse — local launchd Python daemon for scheduled jobs.
#
# A4 phase of the bones-and-wings refactor (2026-05-03). NOT containerized
# — runs as a host launchd service alongside the eventual host-Wing/host-Bone
# from A3 (track-A-reversal). For now, Pulse calls Wing API at
# wing.<tenant_domain> via Traefik (HTTPS) — same path as any external
# consumer until A3 makes Wing-FPM listen on 127.0.0.1:9000 directly.
#
# Source tree: files/anatomy/pulse/
# Runtime tree: ~/pulse/{venv,state,log}
# ==============================================================================

# Toggle — flip to true once Pulse first-run blank lands clean.
install_pulse: false

pulse_user: "{{ ansible_facts['user_id'] }}"
pulse_home: "{{ ansible_facts['env']['HOME'] }}/pulse"
pulse_venv: "{{ pulse_home }}/venv"
pulse_log_dir: "{{ pulse_home }}/log"
pulse_state_dir: "{{ pulse_home }}/state"
# wing.db Pulse holds a WAL anchor on (mirrors bone_wing_db_dir).
pulse_wing_db_path: "{{ wing_data_dir | default(ansible_facts['env']['HOME'] + '/wing/app/data') }}/wing.db"

# launchd plist
pulse_launchd_label: "eu.thisisait.nos.pulse"

# Tick + concurrency tuning
pulse_tick_interval_s: 30
pulse_max_concurrent: 4
pulse_dry_run: false

# Wing API endpoint Pulse calls. Direct loopback as of Anatomy A3.5
# (Wing now runs host-side on FrankenPHP at port 9000 — pre-A3.5 it was
# in a Docker container reached via Traefik). Going through Traefik would
# hit the Authentik forward-auth gate and 302 to login (Pulse has no OIDC
# session — surfaced live 2026-05-07 as a polling 302 storm). Operator
# can override in config.yml if a different topology is needed.
pulse_wing_api_base: "http://127.0.0.1:{{ wing_port | default(9000) }}"

# Pulse's auth token. We reuse wing_api_token (single shared secret for the
# inner ring — Wing/Bone/Pulse). Per-actor identity (Pulse gets its own
# OIDC client) lands in A10 (audit-trail phase).
pulse_api_token: "{{ wing_api_token }}"

# The medulla's half of the split (pulse_medulla_jobs, default.config.yml; tasks/medulla-pulse.yml).
medulla_pulse_launchd_label: "eu.thisisait.nos.medulla-pulse"
# pazny.medulla builds it (install_thalamus); spelled out because that role's vars are private.
# A signed copy named for its organ: Activity Monitor and ps show nos-pulse (test_a_host_job_runs_under_its_organ_name).
pulse_medulla_bin: "{{ ansible_facts['env']['HOME'] }}/thalamus/bin/nos-pulse"
pulse_medulla_env:
  HOME: "{{ ansible_facts['env']['HOME'] }}"
  PATH: "{{ pulse_python | dirname }}:{{ homebrew_prefix | default('/opt/homebrew') }}/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  NOS_REPO_ROOT: "{{ nos_main_checkout }}"
  MEDULLA_PULSE: "1"
  MEDULLA_WING_TOKEN: "{{ medulla_wing_api_token }}"
  NOS_WING_URL: "{{ pulse_wing_api_base }}"
  PULSE_MEDULLA_JOBS: "{{ pulse_medulla_jobs | join(',') }}"
  PULSE_TICK_INTERVAL_S: "{{ pulse_tick_interval_s | string }}"
  PULSE_MAX_CONCURRENT: "{{ pulse_max_concurrent | string }}"
  WING_DB_PATH: "{{ pulse_wing_db_path }}"

# Python interpreter. macOS: the operator's pyenv shim. Linux: the system
# interpreter (tasks/python.yml apt-installs python3-venv for it).
pulse_python: "{{ (ansible_facts['env']['HOME'] ~ '/.pyenv/shims/python3') if ansible_os_family == 'Darwin' else (ansible_facts['python']['executable'] | default('/usr/bin/python3', true)) }}"
