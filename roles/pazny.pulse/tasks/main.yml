---
# ==============================================================================
# pazny.pulse/tasks/main.yml
#
# Thin install:
#   1. Ensure runtime dirs (~/pulse/{venv,state,log})
#   2. Create Python venv (idempotent — pip's --upgrade safely no-ops)
#   3. Install pulse package (editable from files/anatomy/pulse/)
#   4. Render launchd plist into ~/Library/LaunchAgents/
#   5. Bootstrap (or reload) the launchd job
#
# Source code lives under {{ playbook_dir }}/files/anatomy/pulse/ and is
# NOT copied — the venv installs editable + the launchd plist's
# WorkingDirectory points there. This way edits-during-dev don't require
# a re-deploy; just `launchctl kickstart -k gui/$UID/<label>`.
# ==============================================================================

- name: "[pazny.pulse] Skip when install_pulse: false"
  ansible.builtin.meta: end_play
  when: not (install_pulse | default(false))   # stock-Jinja: meta: when: is filter-less on 2.20.6

- name: "[pazny.pulse] Ensure runtime directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ pulse_home }}"
    - "{{ pulse_log_dir }}"
    - "{{ pulse_state_dir }}"

# Use the playbook's pyenv shim so we get the same Python the rest of the
# nos tooling uses. ``ansible.builtin.command: creates:`` handles idempotency.
- name: "[pazny.pulse] Create Python venv"
  ansible.builtin.command:
    cmd: "{{ pulse_python }} -m venv {{ pulse_venv }}"
    creates: "{{ pulse_venv }}/bin/python"

- name: "[pazny.pulse] Upgrade pip in venv"
  # Same reason as pazny.bone: avoid ansible.builtin.pip — its controller-
  # side `packaging` import fails on PEP-668 Homebrew Python 3.14.
  ansible.builtin.command:
    cmd: "{{ pulse_venv }}/bin/pip install --quiet --disable-pip-version-check --upgrade pip"
  register: _pulse_pip_upgrade
  changed_when: _pulse_pip_upgrade.stdout | trim != ""

- name: "[pazny.pulse] Install pulse package into venv"
  ansible.builtin.command:
    cmd: "{{ pulse_venv }}/bin/pip install --quiet --disable-pip-version-check --upgrade {{ playbook_dir }}/files/anatomy/pulse"
  register: _pulse_pip_install
  changed_when: _pulse_pip_install.stdout | trim != ""
  # Only the plist render notified the reload, so a change to the DAEMON SOURCE
  # landed on disk and the running process kept executing the old code from
  # memory. Measured 2026-07-31: `2704f4c4 fix(pulse): a job outliving one tick
  # fired twice` shipped on 07-28, the venv copy had it, and the daemon had been
  # running since 07-27 12:58 — four converges later it was still double-firing
  # vulnerability-scan every night, exactly as the fix describes.
  # pazny.bone already does this correctly (its source sync notifies Restart
  # bone); pulse was the outlier.
  #
  # THIS NOTIFY IS A BACKSTOP AND CANNOT BE TRUSTED ALONE — measured 2026-08-01.
  # `--quiet` prints nothing on ANY install, not just a no-op, so the
  # `changed_when` above is ALWAYS false and this notify has never once fired:
  # the handler ran twice in the estate's whole history, last at 2026-07-27
  # 12:58:28, which is exactly the running daemon's start time. Three converges
  # rewrote site-packages/pulse/*.py while the process kept executing 07-27 code.
  # The real signal is the staleness probe below, which reads the EFFECT (is the
  # running process older than the code?) instead of trusting the installer's
  # own account of whether it did anything.
  notify: Reload pulse launchd

# Observe the effect, do not trust the attempt.
#
# A `notify` fires on the installer's self-report, and a self-report can be
# structurally incapable of being true (see above). This compares two facts
# neither of which the installing task authored: when the daemon actually
# started, and how new the code on disk actually is. It also REPAIRS existing
# drift, which a change-triggered notify never can — a daemon already running
# stale code emits no change event, so nothing would ever restart it.
- name: "[pazny.pulse] Detect a daemon older than the code it runs"
  ansible.builtin.shell: |
    set -euo pipefail
    PID=$(launchctl print "gui/$(id -u)/{{ pulse_launchd_label }}" 2>/dev/null | awk '/pid = /{print $3}')
    # Not running at all: the bootstrap task below starts it with current code.
    [ -n "${PID:-}" ] || { echo FRESH; exit 0; }
    STARTED=$(ps -o lstart= -p "$PID" | sed 's/^ *//' \
      | xargs -I{} date -j -f "%a %b %d %T %Y" "{}" +%s 2>/dev/null || echo 0)
    NEWEST=$(find {{ pulse_venv }}/lib/*/site-packages/pulse -name '*.py' \
      -exec stat -f %m {} \; 2>/dev/null | sort -rn | head -1)
    # Unparseable start time (0) must not read as "daemon is ancient, restart
    # every run" — it reads as unknown, and unknown is not a reason to bounce
    # a live daemon on every converge.
    [ "${STARTED:-0}" -gt 0 ] || { echo FRESH; exit 0; }
    if [ "${NEWEST:-0}" -gt "$STARTED" ]; then echo STALE; else echo FRESH; fi
  register: _pulse_staleness
  changed_when: "'STALE' in _pulse_staleness.stdout"
  notify: Reload pulse launchd
  when: (nos_service_manager | default('launchd')) == 'launchd'

# ── Service manager: launchd (macOS) | systemd --user (Linux) ─────────────────
# Linux sibling of the launchd path; env mirrors pulse.plist.j2. Gated on
# nos_service_manager (tasks/_platform.yml) so macOS is unchanged.

# ---- macOS: launchd ----
- name: "[pazny.pulse] Render launchd plist"
  ansible.builtin.template:
    src: pulse.plist.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ pulse_launchd_label }}.plist"
    # 0600: plist may embed BONE_SECRET / WING_API_TOKEN for Pulse jobs
    # that hit the local API. Apply the same lock-down as Wing + Bone.
    mode: '0600'
  notify: Reload pulse launchd
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[pazny.pulse] Bootstrap launchd job (idempotent)"
  ansible.builtin.shell: |
    set -e
    PLIST=~/Library/LaunchAgents/{{ pulse_launchd_label }}.plist
    UID_NUM=$(id -u)
    if launchctl print "gui/${UID_NUM}/{{ pulse_launchd_label }}" >/dev/null 2>&1; then
      echo "already-loaded"
    else
      launchctl bootstrap gui/${UID_NUM} "$PLIST"
      echo "bootstrapped"
    fi
  register: _pulse_bootstrap
  changed_when: "'bootstrapped' in _pulse_bootstrap.stdout"
  when: (nos_service_manager | default('launchd')) == 'launchd'

# ---- Linux: systemd --user (env mirrors pulse.plist.j2) ----
- name: "[pazny.pulse] (Linux) Install systemd --user service"
  ansible.builtin.include_role:
    name: pazny.linux.systemd_user
    tasks_from: ensure_unit
  vars:
    su_name: "{{ pulse_launchd_label }}"
    su_description: "nOS Pulse — scheduled-job daemon"
    su_exec_start: "{{ pulse_venv }}/bin/python -m pulse"
    su_working_dir: "{{ playbook_dir }}/files/anatomy/pulse"
    su_environment:
      HOME: "{{ ansible_facts['env']['HOME'] }}"
      PATH: "{{ pulse_venv }}/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
      WING_API_BASE: "{{ pulse_wing_api_base }}"
      WING_API_TOKEN: "{{ pulse_api_token }}"
      PULSE_TICK_INTERVAL_S: "{{ pulse_tick_interval_s | string }}"
      PULSE_MAX_CONCURRENT: "{{ pulse_max_concurrent | string }}"
      PULSE_STATE_DIR: "{{ pulse_state_dir }}"
      PULSE_LOG_PATH: "{{ pulse_log_dir }}/pulse.log"
      PULSE_DRY_RUN: "{{ '1' if (pulse_dry_run | bool) else '0' }}"
  when: (nos_service_manager | default('launchd')) == 'systemd-user'

- name: "[pazny.pulse] Setup summary"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════════════════
       Pulse — local launchd daemon ready
      ══════════════════════════════════════════════════════════════════
       Label:        {{ pulse_launchd_label }}
       Source:       {{ playbook_dir }}/files/anatomy/pulse/
       Venv:         {{ pulse_venv }}
       Logs:         {{ pulse_log_dir }}/pulse.log
                     {{ pulse_log_dir }}/launchd.{out,err}.log
       Wing API:     {{ pulse_wing_api_base }}
       Tick:         every {{ pulse_tick_interval_s }}s
       Concurrency:  max {{ pulse_max_concurrent }} parallel runs
       Dry-run:      {{ pulse_dry_run }}

       Status:       launchctl print gui/$(id -u)/{{ pulse_launchd_label }}
       Reload:       launchctl kickstart -k gui/$(id -u)/{{ pulse_launchd_label }}
       Stop:         launchctl bootout gui/$(id -u) ~/Library/LaunchAgents/{{ pulse_launchd_label }}.plist
      ══════════════════════════════════════════════════════════════════
