---
# ==============================================================================
# pazny.apps_runner/tasks/post.yml — POST-START PHASE.
#
# Called from tasks/stacks/apps-up.yml AFTER the apps stack has been brought
# up via `docker compose up apps --wait`. Each app from the render phase
# (_apps_render.apps) gets:
#
#   1. service-registry.json append (consumed by Bone /api/services + Wing
#      systems table via existing ingest-registry.php pipeline)
#   2. Wing systems table refresh (re-runs bin/ingest-registry.php — the same
#      script the wing role uses; Tier-2 entries flow through the unchanged
#      ingestion path now that step 1 added them)
#   3. Authentik blueprint reconverge (2026-05-17: simplified — the
#      Tier-2 apps land in authentik-base's inputs.clients via the X.3
#      aggregator path. This step only triggers the blueprint re-render
#      + flush, no more set_fact mutation of authentik_oidc_apps /
#      authentik_app_tiers. Tier comes from the aggregator's read of
#      nginx.rbac_tier; idempotent because the blueprint pipeline is
#      INSERT-OR-UPDATE keyed on slug.)
#   4. Bone HMAC-signed `app.deployed` event — one POST /api/v1/events per
#      onboarded app, X-Wing-Signature = sha256=<hex> over the body
#   5. Portainer apps endpoint registration (handled by pazny.portainer post
#      via portainer_register_apps_endpoint flag — gap-fill, idempotent)
#   6. Uptime Kuma manifest extension — set _kuma_manifest_apps fact, then
#      re-include monitors.yml so each Tier-2 app gets an HTTP probe
#   7. GDPR Article 30 row INSERT via Wing CLI (bin/upsert-gdpr.php — wraps
#      App\Model\GdprRepository::upsertProcessing)
#   8. state/smoke-catalog.runtime.yml extension (one smoke entry per app —
#      tools/nos-smoke.py auto-merges this on top of state/smoke-catalog.yml)
#
# All hooks are idempotent and gated on (_apps_render.apps | length > 0). The
# 0-app case (apps/ contains only _template.yml) makes this file a no-op.
# Heavy reconverges (Authentik / Kuma) can be skipped via
# `apps_runner_reconverge_blueprints: false` for fast iteration.
# ==============================================================================

# Cheap exit when there's nothing to do — keeps the runner-with-no-manifests
# case fully silent in the play recap.
- name: "[pazny.apps_runner Post] Skip — no Tier-2 apps rendered"
  ansible.builtin.debug:
    msg: "No Tier-2 apps in _apps_render — post-start hooks skipped."
  when:
    - (_apps_render is not defined) or ((_apps_render.apps | default([])) | length == 0)

- name: "[pazny.apps_runner Post] Run observability hooks"
  when:
    - _apps_render is defined
    - (_apps_render.apps | default([])) | length > 0
  block:

    # ── Hook 1+2: service-registry append + Wing systems re-ingest ──────────
    - name: "[Apps Post] Set apps_extra_services fact (Tier-2 registry entries)"
      ansible.builtin.set_fact:
        apps_extra_services: >-
          {{ _apps_render.apps | map(attribute='registry_entry') | list }}

    - name: "[Apps Post] Re-render service-registry.json with Tier-2 entries"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/service-registry.json.j2"
        dest: "{{ openclaw_projects_dir | default(ansible_facts['env']['HOME'] + '/projects') }}/default/service-registry.json"
        mode: '0644'

    - name: "[Apps Post] Re-ingest service-registry into Wing systems table (host PHP CLI)"
      # Anatomy P0.14b (2026-05-05): host-native invocation, mirrors the
      # P0.14 fix for the GDPR upsert task earlier in this file. Pre-fix
      # this called `docker compose run --rm wing-cli php bin/ingest-
      # registry.php`, but A3.5 retired the wing-cli profile service when
      # Wing moved to a FrankenPHP launchd daemon. The task silently no-
      # opped (failed_when: false), so Wing's systems table never picked
      # up Tier-2 app entries from apps_runner — /hub showed stale data
      # after every apps onboarding. Mirrors pazny.wing/tasks/post.yml's
      # canonical host-native pattern (cmd: php bin/X.php, chdir).
      ansible.builtin.command:
        cmd: php bin/ingest-registry.php --registry={{ ansible_facts['env']['HOME'] }}/projects/default/service-registry.json
        chdir: "{{ wing_app_dir }}"
      register: _apps_wing_ingest
      changed_when: >
        'Ingested' in (_apps_wing_ingest.stdout | default(''))
        and 'Ingested 0' not in (_apps_wing_ingest.stdout | default(''))
      failed_when: false
      when: install_wing | default(true) | bool

    # ── Hook 3: Authentik blueprint reconverge ──────────────────────────────
    # Tier-2 apps with auth_mode=proxy|oidc are picked up by the X.3
    # aggregator path: `run_aggregators` reads every apps/*.yml and harvests
    # the manifest's `authentik:` block into the authentik-base plugin's
    # `inputs.clients` list (same target as Tier-1 plugins). The blueprint
    # templates (10-oidc-apps.yaml.j2 + 20-rbac-policies.yaml.j2) iterate
    # that merged list — see active-work punch #3 + the 2026-05-17 cleanup
    # commit. Pre-cleanup this file also `set_fact`'d
    # `authentik_oidc_apps` + `authentik_app_tiers` to extend Tier-2 entries
    # into the legacy central lists, which produced DUPLICATE blueprint
    # rows once X.3 landed (each Tier-2 app appeared via inputs.clients AND
    # via authentik_oidc_apps).
    #
    # We still trigger the blueprint reconverge here (the aggregator runs
    # during the plugin loader hook earlier in the play, but the
    # blueprints.yml task render is what notifies the "Reapply authentik
    # blueprints" handler). The gating condition is now "Tier-2 apps
    # exist with auth_mode in [proxy, oidc]" — a presence test, not an
    # extra-list builder.
    - name: "[Apps Post] Detect Tier-2 apps that need Authentik wiring"
      ansible.builtin.set_fact:
        _apps_has_authentik_consumers: >-
          {{ (_apps_render.apps
              | selectattr('auth_mode', 'in', ['proxy', 'oidc'])
              | list | length) > 0 }}

    # Re-render the blueprint TEMPLATES (already harvested via aggregator
    # `inputs.clients`). The render task in pazny.authentik/tasks/blueprints.yml
    # has `notify: Reapply authentik blueprints` on each template — when the
    # file content changes, the play-level handler in main.yml fires
    # `ak apply_blueprint` for all three blueprints.
    #
    # NOTE: previously this called `tasks_from: post.yml` which only
    # contains a health probe (Wait + Health), NOT the blueprint render —
    # so the Tier-2 OIDC/Proxy providers never made it into Authentik and
    # Traefik's authentik@file middleware returned 404 for every
    # *.apps.<tld> request. blueprints.yml is the right entry-point;
    # post.yml is for read-only confirmations.
    - name: "[Apps Post] Reconverge Authentik blueprints (Tier-2 OIDC/Proxy providers)"
      ansible.builtin.include_role:
        name: pazny.authentik
        tasks_from: blueprints.yml
        apply:
          tags: ['authentik', 'iam', 'apps']
      when:
        - apps_runner_reconverge_blueprints | default(true) | bool
        - install_authentik | default(false) | bool
        - _apps_has_authentik_consumers | bool
      tags: ['authentik', 'iam', 'apps']

    # Force the "Reapply authentik blueprints" handler (play-level, in
    # main.yml) to fire RIGHT NOW so providers are live before Bone
    # events / Kuma / smoke run downstream. Without this flush, handlers
    # only fire at end-of-play — too late for the inline smoke at the
    # bottom of apps-up.yml to see the new providers.
    # meta: when: compiles FILTER-LESS on ansible-core 2.20.6 — membership
    # idiom on the -e-reachable vars, bare read on the native-bool set_fact
    # (same shape as the run-mode dry-run stop; gate: G-6 meta-when scanner).
    - name: "[Apps Post] Flush handlers — apply blueprints to Authentik now"
      ansible.builtin.meta: flush_handlers
      when:
        - apps_runner_reconverge_blueprints | default(true) in [true, 'true', 'True', 'yes', 'y', '1', 1]
        - install_authentik | default(false) in [true, 'true', 'True', 'yes', 'y', '1', 1]
        - _apps_has_authentik_consumers
      tags: ['authentik', 'iam', 'apps']

    # ── Hook 4: Bone HMAC-signed app.deployed events ────────────────────────
    # The Bone /api/v1/events endpoint accepts batch payloads {events: [...]},
    # signed with HMAC-SHA256 over the body using wing_events_hmac_secret.
    # Header format matches callback_plugins/wing_telemetry.py:131 —
    # X-Wing-Signature = "sha256=<hex>" (the receiver verifies the prefix).
    #
    # Build the batch as a real list (pure Jinja set + append, same idiom as
    # tasks/stacks/stack-up.yml result-normalisation — avoids the jmespath
    # dependency which isn't installed by default on macOS).
    - name: "[Apps Post] Assemble Bone events batch"
      ansible.builtin.set_fact:
        _apps_bone_batch:
          events: "{{ _events_acc }}"
      vars:
        # A4 (2026-05-26): attribution. Pre-fix these events carried
        # actor_id=null + actor_action_id=null + run_id=bare-timestamp, so the
        # scout drift agent flagged them as an attribution gap. Stamp a service
        # actor_id, a run-level UUID actor_action_id (shared across the batch so
        # all app.deployed events of one apps-up group together), and a
        # meaningful run_id.
        _apps_action_id: "{{ (ansible_date_time.iso8601 ~ '-apps-deploy') | to_uuid }}"
        _events_acc: |-
          {%- set out = [] -%}
          {%- for a in _apps_render.apps -%}
            {%- set _ = out.append({
              'ts': ansible_date_time.iso8601,
              'run_id': 'apps-deploy-' ~ ansible_date_time.epoch,
              'type': 'app.deployed',
              'source': 'apps_runner',
              'actor_id': 'apps_runner',
              'actor_action_id': _apps_action_id,
              'app_id': a.id,
              'fqdn': a.fqdn,
              'category': a.category,
              'auth_mode': a.auth_mode,
              'version': a.version,
              'stack': 'apps',
              'tier': 2
            }) -%}
          {%- endfor -%}
          {{ out }}

    - name: "[Apps Post] Serialise event batch to JSON (single source of truth for HMAC)"
      ansible.builtin.set_fact:
        _apps_bone_body: "{{ _apps_bone_batch | to_json }}"

    # Ansible's built-in `hash` filter is unkeyed (hashlib only — no HMAC
    # variant). For a real keyed HMAC-SHA256 we delegate to openssl, which
    # ships on every macOS + Linux dev box. Result is hex; we prefix
    # "sha256=" to match the header format the receiver expects (see
    # callback_plugins/wing_telemetry.py:131).
    #
    # When wing_events_hmac_secret is empty (operator hasn't set it),
    # we skip HMAC entirely and let Bone reject if it strict-requires
    # signed events. callback_plugins/wing_telemetry.py uses the same
    # opt-in semantic — no key, no signature header.
    - name: "[Apps Post] Resolve HMAC secret (may be empty if operator hasn't set it)"
      ansible.builtin.set_fact:
        _apps_bone_hmac_key: "{{ wing_events_hmac_secret | default('') }}"
      no_log: true

    # Bone's HMAC scheme (files/anatomy/bone/events.py::verify_hmac):
    #   - timestamp MUST be Unix epoch seconds (digits only, ±300s window)
    #   - signature is HMAC-SHA256 over the literal string `{ts}.{body}`
    #     (not over body alone — the dot-prefixed timestamp is part of the
    #     signed message to bind it against replay)
    # Earlier this task sent ISO-8601 + signed body-only; Bone responded
    # 401 "invalid timestamp" on every run since A3a (Bone host launchd).
    # MUST be the CURRENT epoch, computed here — NOT ansible_date_time.epoch,
    # which is frozen at gather_facts (play start). On a long blank (1h+) that
    # cached value is way outside Bone's ±300s window → verify_hmac returns
    # "timestamp out of window" → 401 on every signed POST, even though the
    # secret matches. `date +%s` runs at task time, seconds before the POST.
    # (A19 fix 2026-05-24 — the real cause of the recurring app.deployed 401.)
    - name: "[Apps Post] Compute Unix-epoch timestamp for HMAC (current time)"
      ansible.builtin.set_fact:
        _apps_bone_ts_epoch: "{{ lookup('pipe', 'date +%s') | trim }}"

    # Bone verifies the HMAC over the RAW received body bytes
    # (files/anatomy/bone/events.py::verify_hmac: message = "{ts}.{raw_body}").
    # It does NOT re-canonicalize server-side. So the bytes we SEND on the wire
    # must be byte-identical to the bytes we SIGN. We canonicalize once via
    # `jq -cS` (compact, sorted keys) and POST THOSE EXACT bytes below with
    # body_format: raw.
    #
    # A19 fix (2026-05-23): the old comment claimed Bone re-canonicalizes the
    # parsed body — it does NOT. The POST sent `_apps_bone_batch` via
    # body_format:json, letting Ansible re-serialize the dict with different
    # separators/key-order than the signed `jq -cS` form → HMAC mismatch → 401
    # "invalid signature" on every app.deployed event.
    - name: "[Apps Post] Canonicalize Bone body via jq -cS (matches server-side encoding)"
      ansible.builtin.shell:
        cmd: 'set -o pipefail; printf %s "$NOS_BODY" | jq -cS .'
        executable: /bin/bash
      environment:
        NOS_BODY: "{{ _apps_bone_body }}"
      register: _apps_bone_canon
      no_log: true
      changed_when: false
      check_mode: false
      when: (_apps_bone_hmac_key | length) > 0

    - name: "[Apps Post] Compute keyed HMAC-SHA256 via openssl over {ts}.{canon-body}"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          printf '%s.%s' "$NOS_TS" "$NOS_BODY"
          | openssl dgst -sha256 -hmac "$NOS_KEY" -hex
          | awk '{print $NF}'
        executable: /bin/bash
      environment:
        NOS_TS: "{{ _apps_bone_ts_epoch }}"
        NOS_BODY: "{{ _apps_bone_canon.stdout }}"
        NOS_KEY: "{{ _apps_bone_hmac_key }}"
      register: _apps_bone_hmac_calc
      no_log: true
      changed_when: false
      check_mode: false
      when: (_apps_bone_hmac_key | length) > 0

    - name: "[Apps Post] POST app.deployed events to Bone (signed)"
      ansible.builtin.uri:
        url: "{{ wing_events_url | default('http://127.0.0.1:' ~ (bone_port | default(8099)) ~ '/api/v1/events') }}"
        method: POST
        # Send the EXACT canonical bytes the HMAC was computed over (raw, not
        # body_format:json — Ansible would re-serialize and break the signature).
        body_format: raw
        body: "{{ _apps_bone_canon.stdout }}"
        headers:
          Content-Type: "application/json"
          X-Wing-Signature: "sha256={{ _apps_bone_hmac_calc.stdout | trim }}"
          X-Wing-Timestamp: "{{ _apps_bone_ts_epoch }}"
        status_code: [200, 201, 202, 204]
        timeout: 10
      register: _apps_bone_post
      failed_when: false
      changed_when: _apps_bone_post.status | default(0) in [200, 201, 202, 204]
      no_log: true
      when:
        - install_bone | default(true) | bool
        - (_apps_bone_hmac_key | length) > 0

    - name: "[Apps Post] POST app.deployed events to Bone (unsigned fallback)"
      ansible.builtin.uri:
        url: "{{ wing_events_url | default('http://127.0.0.1:' ~ (bone_port | default(8099)) ~ '/api/v1/events') }}"
        method: POST
        body_format: json
        body: "{{ _apps_bone_batch }}"
        headers:
          Content-Type: "application/json"
          X-Wing-Timestamp: "{{ ansible_date_time.iso8601 }}"
        status_code: [200, 201, 202, 204, 401, 403]
        timeout: 10
      register: _apps_bone_post_unsigned
      failed_when: false
      changed_when: _apps_bone_post_unsigned.status | default(0) in [200, 201, 202, 204]
      when:
        - install_bone | default(true) | bool
        - (_apps_bone_hmac_key | length) == 0

    # Normalise: downstream summary task reads _apps_bone_post.status.
    - name: "[Apps Post] Normalise _apps_bone_post when unsigned path was taken"
      ansible.builtin.set_fact:
        _apps_bone_post: "{{ _apps_bone_post_unsigned }}"
      when:
        - _apps_bone_post is not defined or (_apps_bone_post.skipped | default(false))
        - _apps_bone_post_unsigned is defined

    - name: "[Apps Post] Bone events delivery summary"
      ansible.builtin.debug:
        msg: >-
          Bone app.deployed:
          {{ 'OK — ' ~ (_apps_render.apps | length) ~ ' event(s) accepted (HTTP ' ~ (_apps_bone_post.status | default('?')) ~ ')'
             if (_apps_bone_post.status | default(0) in [200, 201, 202, 204])
             else 'FAILED — HTTP ' ~ (_apps_bone_post.status | default('?')) ~ ' (events queued in fallback if WING_EVENTS_QUEUE is set)' }}
      when:
        - install_bone | default(true) | bool
        - _apps_bone_post is defined

    # ── Parallel JSONL sink for app.deployed events ─────────────────────────
    # The callback plugin (wing_telemetry.py) writes ~/.nos/events/playbook.jsonl
    # only with framework-level types (playbook_start/end) plus its own task
    # telemetry. The `app.deployed` events posted above go straight to Bone
    # over HTTP — they never reach the JSONL.
    #
    # That's a problem for the wet-test contract: docs/tier2-wet-test-checklist.md
    # §7 and tests/wet/test_post_blank_state.py::TestSection7_BoneEvents both
    # rely on `tail playbook.jsonl | jq 'select(.type == "app.deployed")'`.
    # We mirror the events to JSONL here regardless of HTTP outcome so the
    # operator-facing evidence path matches the documented recipe and the
    # signal stays even when Bone is down.
    - name: "[Apps Post] Mirror app.deployed events into ~/.nos/events/playbook.jsonl"
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.nos/events/playbook.jsonl"
        line: "{{ event | to_json }}"
        create: true
        insertafter: EOF
        mode: '0644'
      loop: "{{ _apps_bone_batch.events }}"
      loop_control:
        loop_var: event
        label: "{{ event.app_id }}"
      when:
        - _apps_bone_batch is defined
        - (_apps_bone_batch.events | default([])) | length > 0

    # ── Hook 5: Portainer apps endpoint (gap-fill via flag) ─────────────────
    # The actual POST /api/endpoints lives in roles/pazny.portainer/tasks/
    # post.yml under the `portainer_register_apps_endpoint` flag — defaulting
    # to false so existing installs keep their current single-endpoint UX.
    # When operators want a dedicated `apps` endpoint, they flip the flag in
    # config.yml. Re-running the role's post.yml here lets the flag take
    # effect after Tier-2 apps come up, without mutating core-up.yml ordering.
    - name: "[Apps Post] Re-include Portainer post (gap-fill apps endpoint when flag is set)"
      ansible.builtin.include_role:
        name: pazny.portainer
        tasks_from: post.yml
        apply:
          tags: ['portainer', 'infra', 'apps']
      when:
        - install_portainer | default(false) | bool
        - portainer_register_apps_endpoint | default(false) | bool
      tags: ['portainer', 'infra', 'apps']

    # ── Hook 6: Uptime Kuma — extend monitors with Tier-2 apps ──────────────
    # _kuma_manifest_apps gets consumed by the new clause in
    # roles/pazny.uptime_kuma/tasks/monitors.yml (added in this commit).
    - name: "[Apps Post] Set _kuma_manifest_apps fact for uptime_kuma reconverge"
      ansible.builtin.set_fact:
        _kuma_manifest_apps: >-
          {{ _apps_render.apps | map(attribute='kuma_monitor') | list }}

    - name: "[Apps Post] Reconverge Uptime Kuma monitors (picks up Tier-2 entries)"
      ansible.builtin.include_role:
        name: pazny.uptime_kuma
        tasks_from: monitors.yml
        apply:
          tags: ['uptime-kuma', 'apps']
      when:
        - apps_runner_reconverge_blueprints | default(true) | bool
        - install_uptime_kuma | default(false) | bool
      tags: ['uptime-kuma', 'apps']

    # ── Hook 7: GDPR Article 30 register — upsert one row per app ───────────
    # Each apps/<name>.yml passes the parser only if it contains a complete
    # `gdpr:` block. We forward that block to bin/upsert-gdpr.php via stdin
    # (avoids writing a temp file on the controller). The PHP script wraps
    # GdprRepository::upsertProcessing — same code path Wing's /gdpr UI
    # uses. Idempotent: re-running on an already-onboarded app rewrites the
    # row with the latest manifest values.
    #
    # Anatomy P0.14 (2026-05-04): host-native PHP CLI. Pre-A3.5 this ran
    # `docker compose run --rm wing-cli php bin/upsert-gdpr.php` against
    # the iiab stack's wing-cli profile service. A3.5 retired the wing-cli
    # profile when Wing moved to a FrankenPHP launchd daemon. We now call
    # `php bin/upsert-gdpr.php` directly with chdir={{ wing_app_dir }},
    # mirroring pazny.wing/tasks/post.yml's existing host-native pattern
    # for bin/ingest-registry.php + bin/migrate-systems.php. Stdin pipe
    # (`--json=-`) keeps shell module + printf; rest is plain `php`.
    - name: "[Apps Post] Upsert GDPR processing rows (host PHP CLI, one per app)"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          printf '%s' "$NOS_GDPR_JSON"
          | php bin/upsert-gdpr.php --id=app_{{ item.id }} --json=-
        chdir: "{{ wing_app_dir }}"
        executable: /bin/bash
      environment:
        # NOT NULL fields in wing.db gdpr_processing that manifests don't
        # always carry: `name` (we use the slug) and `storage_location`
        # (Tier-2 apps live in the iiab/apps Docker stack with bind-mounted
        # volumes on the host — sensible default; manifests can still
        # override by setting gdpr.storage_location explicitly).
        NOS_GDPR_JSON: >-
          {{ (
                {
                  'name': item.id,
                  'storage_location': "Docker volumes in the 'apps' compose stack on host (Tier-2, managed by pazny.apps_runner)"
                }
                | combine(item.gdpr | default({}))
             ) | to_json }}
      loop: "{{ _apps_render.apps }}"
      loop_control:
        label: "{{ item.id }}"
      register: _apps_gdpr_upserts
      changed_when: "'OK upserted' in (_apps_gdpr_upserts.stdout | default(''))"
      failed_when: false
      when: install_wing | default(true) | bool

    - name: "[Apps Post] GDPR upsert summary"
      ansible.builtin.debug:
        msg: >-
          GDPR Article 30: {{ (_apps_gdpr_upserts.results | default([])
              | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list | length) }}/{{ _apps_render.apps | length }} app(s) upserted.

    # ── Hook 8: state/smoke-catalog.runtime.yml extension ───────────────────
    # tools/nos-smoke.py loads state/smoke-catalog.yml + state/smoke-catalog.
    # runtime.yml (loaded additively when present — see the matching change
    # in nos-smoke.py). The runtime file is YAML with the same shape as the
    # checked-in catalog so the smoke runner code stays simple.
    - name: "[Apps Post] Build smoke runtime catalog payload"
      ansible.builtin.set_fact:
        _apps_smoke_catalog:
          # No defaults override — runtime entries inherit from the static
          # catalog's smoke_defaults. Keeps the runtime file minimal.
          smoke_endpoints: "{{ _apps_render.apps | map(attribute='smoke_entry') | list }}"

    - name: "[Apps Post] Write state/smoke-catalog.runtime.yml"
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/state/smoke-catalog.runtime.yml"
        content: |
          # Auto-generated by pazny.apps_runner — do not edit by hand.
          # Source of truth is apps/<name>.yml manifests + nos_apps_render.
          # This file is consumed by tools/nos-smoke.py on top of
          # state/smoke-catalog.yml. Delete safely — it'll regenerate on the
          # next playbook run.
          {{ _apps_smoke_catalog | to_nice_yaml(indent=2) }}
        mode: '0644'
      when: apps_extend_smoke_catalog | default(true) | bool

    # ── Final summary ───────────────────────────────────────────────────────
    - name: "[Apps Post] Tier-2 onboarding summary"
      ansible.builtin.debug:
        msg: |
          ══════════════════════════════════════════════════════════════════
           Tier-2 apps_runner — POST-START COMPLETE
          ══════════════════════════════════════════════════════════════════
           Apps onboarded:    {{ _apps_render.apps | length }}
           Service registry:  {{ apps_extra_services | length }} entry/-ies appended
           Authentik:         {{ (_apps_render.apps | selectattr('auth_mode', 'in', ['proxy', 'oidc']) | list | length) }} provider(s) wired via aggregator
           Bone events:       {{ 'sent (HTTP ' ~ (_apps_bone_post.status | default('?')) ~ ')' if install_bone | default(true) else 'skipped (bone disabled)' }}
           Kuma monitors:     {{ _kuma_manifest_apps | length }} probe(s) registered
