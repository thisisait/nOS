---
# DISSOLUTION PLAN (Phase 2 C5): This file dissolves into
# files/anatomy/plugins/nextcloud-base/ lifecycl.post_compose once the plugin
# loader gains a `replay_api_calls` runner with docker_exec + http support.
# Until C5 lands, this file remains the authoritative wiring path.
#
# NOTE: Overlaps with tasks/stacks/authentik_service_post.yml:103-184
# (OIDC provider registration). Both must be re-homed into the plugin.
#
# ==============================================================================
# pazny.nextcloud/tasks/post.yml — sync configuration after container start
# Called from tasks/stacks/stack-up.yml AFTER `docker compose -p iiab up`.
#
# Handles:
#   1. DB password in config.php — the MYSQL_PASSWORD env var is only read on the first
#      initialization; when credentials.yml changes the sync happens via occ
#   2. Admin password reconverge via occ user:resetpassword
#   3. trusted_domains for existing installations (config.php) via occ
#   4. OIDC direct login (when install_authentik)
# ==============================================================================

- name: "[pazny.nextcloud Post] Check if Nextcloud container is running"
  ansible.builtin.shell: >
    {{ docker_bin }} ps -q
    --filter "label=com.docker.compose.project=iiab"
    --filter "label=com.docker.compose.service=nextcloud"
  register: _nc_container
  changed_when: false
  failed_when: false
  check_mode: false

# ── DB password sync ─────────────────────────────────────────────────────
# Pre-bootstrap path (2026-05-17): when config.php's dbpassword has
# drifted from the effective resolved value (e.g. operator rotated
# `global_password_prefix` between runs, or the operator config layer
# defines a duplicate prefix that shadows differently than before),
# Nextcloud crash-loops with "Access denied for user 'nextcloud'" on
# every request — including the `occ` CLI, which bootstraps the same
# DB connection before doing anything else. The chicken-and-egg of
# "update password via occ ↔ occ can't start because of bad password"
# is broken here: read the file directly, sed-patch it, then let the
# normal occ-based reconvergence below catch any drift the
# pre-bootstrap edit didn't cover (e.g. running config.php elsewhere).
#
# This is the canonical way to recover Nextcloud from a password-drift
# stuck state without losing data — the alternative is `blank=true`,
# which wipes the operator's files. Surfaced live 2026-05-17 on
# pazny.eu with config.yml.global_password_prefix=kloFas9 +
# credentials.yml.global_password_prefix=kloFas7 (credentials.yml wins
# at runtime, so the in-DB user used kloFas7_pw_nextcloud, but
# config.php from a previous run stored kloFas9_pw_nextcloud).
- name: "[pazny.nextcloud Post] Pre-bootstrap: sync config.php dbpassword (file edit)"
  ansible.builtin.shell: |
    set -o pipefail
    PHP_FILE="{{ nextcloud_dir }}/config/config.php"
    if [[ ! -f "$PHP_FILE" ]]; then
      echo "NO_CONFIG"
      exit 0
    fi
    CURRENT=$(grep -oE "'dbpassword' => '[^']+'" "$PHP_FILE" | sed -E "s/^'dbpassword' => '([^']+)'$/\1/" | head -1)
    EXPECTED="{{ nextcloud_db_password }}"
    if [[ -z "$CURRENT" ]]; then
      echo "NO_DBPASSWORD_LINE"
      exit 0
    fi
    if [[ "$CURRENT" == "$EXPECTED" ]]; then
      echo "IN_SYNC"
      exit 0
    fi
    # Drift detected — sed-patch in place. macOS sed needs the empty -i arg.
    if [[ "$OSTYPE" == "darwin"* ]]; then
        sed -i "" "s|'dbpassword' => '$CURRENT'|'dbpassword' => '$EXPECTED'|" "$PHP_FILE"
    else
        sed -i "s|'dbpassword' => '$CURRENT'|'dbpassword' => '$EXPECTED'|" "$PHP_FILE"
    fi
    echo "PATCHED: ${CURRENT:0:4}…${CURRENT: -4} -> ${EXPECTED:0:4}…${EXPECTED: -4}"
  args:
    executable: /bin/bash
  register: _nc_prebootstrap
  changed_when: "'PATCHED:' in (_nc_prebootstrap.stdout | default(''))"
  failed_when: false
  no_log: true  # cmd embeds nextcloud_db_password (EXPECTED=...); telemetry
  # forwards `cmd` raw. The masked-stdout debug below still reads the
  # registered var, so the diagnostic is preserved without leaking the secret.

- name: "[pazny.nextcloud Post] Pre-bootstrap result"
  ansible.builtin.debug:
    msg: "config.php dbpassword sync → {{ _nc_prebootstrap.stdout | default('?') }}"
  when: _nc_prebootstrap is defined

# If we patched the file, Nextcloud picks up the new value on the next
# HTTP request (config.php is require'd on every request). No container
# restart needed; the chicken-and-egg is resolved.

- name: "[pazny.nextcloud Post] Get current DB password from config.php (via occ)"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p iiab
    exec -T -u www-data nextcloud
    php occ config:system:get dbpassword 2>/dev/null || echo "__NC_NOT_INSTALLED__"
  register: _nc_current_dbpass
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true   # stdout is the live dbpassword
  when: _nc_container.stdout | default('') | length > 0

- name: "[pazny.nextcloud Post] Update DB password in config.php (via occ)"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p iiab
    exec -T -u www-data nextcloud
    php occ config:system:set dbpassword
    --value={{ nextcloud_db_password | quote }}
  when:
    - _nc_container.stdout | default('') | length > 0
    - _nc_current_dbpass.stdout | default('') | trim != '__NC_NOT_INSTALLED__'
    - _nc_current_dbpass.stdout | default('') | trim != nextcloud_db_password
  changed_when: true
  failed_when: false
  check_mode: false
  no_log: true

# ── Admin password reconverge ────────────────────────────────────────────
# occ user:resetpassword reads OC_PASS from env, runs on every run ⇒ drift
# the prefix propagates to the existing admin user.
- name: "[pazny.nextcloud Post] Reconverge admin password (state-declarative UPDATE)"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p iiab
    exec -T -u www-data
    -e OC_PASS={{ nextcloud_admin_password | quote }}
    nextcloud php occ user:resetpassword --password-from-env
    {{ nextcloud_admin_user | default('admin') }}
  when:
    - _nc_container.stdout | default('') | length > 0
    - _nc_current_dbpass.stdout | default('') | trim != '__NC_NOT_INSTALLED__'
  register: _nc_pw_reset
  changed_when: "'Successfully reset password' in (_nc_pw_reset.stdout | default(''))"
  failed_when: false
  check_mode: false
  no_log: true

# ── trusted_domains sync ─────────────────────────────────────────────────
- name: "[pazny.nextcloud Post] Get current trusted_domains"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p iiab
    exec -T -u www-data nextcloud
    php occ config:system:get trusted_domains 2>/dev/null || true
  register: _nc_trusted
  changed_when: false
  failed_when: false
  check_mode: false
  when: _nc_container.stdout | default('') | length > 0

- name: "[pazny.nextcloud Post] Set trusted_domains via occ"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p iiab
    exec -T -u www-data nextcloud
    php occ config:system:set trusted_domains {{ item.index }}
    --value={{ item.domain | quote }}
  loop:
    - { index: 0, domain: "{{ nextcloud_domain | default('cloud' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}" }
    - { index: 1, domain: "localhost" }
    - { index: 2, domain: "127.0.0.1" }
  loop_control:
    label: "trusted_domains[{{ item.index }}] = {{ item.domain }}"
  when:
    - _nc_container.stdout | default('') | length > 0
    - item.domain not in (_nc_trusted.stdout | default(''))
  changed_when: true
  failed_when: false
  check_mode: false

- name: "[pazny.nextcloud Post] Add extra trusted domains (LAN/Tailscale)"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p iiab
    exec -T -u www-data nextcloud
    php occ config:system:set trusted_domains {{ idx + 3 }}
    --value={{ item | quote }}
  loop: "{{ service_extra_hosts | default([]) }}"
  loop_control:
    index_var: idx
    label: "trusted_domains[{{ idx + 3 }}] = {{ item }}"
  when:
    - _nc_container.stdout | default('') | length > 0
    - service_extra_hosts | default([]) | length > 0
  changed_when: true
  failed_when: false
  check_mode: false

# -- OIDC: set user_oidc as the default login method -------------------
- name: "[pazny.nextcloud Post] Enable OIDC as direct login (skip Nextcloud login page)"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p iiab
    exec -T -u www-data nextcloud
    php occ config:app:set user_oidc allow_multiple_user_backends --value=0
  when:
    - _nc_container.stdout | default('') | length > 0
    - install_authentik | default(false)
  changed_when: false
  failed_when: false
  check_mode: false

- name: "[pazny.nextcloud Post] Set OIDC provider as login redirect"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p iiab
    exec -T -u www-data nextcloud
    php occ config:app:set user_oidc login_redirect --value=authentik
  when:
    - _nc_container.stdout | default('') | length > 0
    - install_authentik | default(false)
  changed_when: false
  failed_when: false
  check_mode: false

# ── OnlyOffice document-editing wiring (P2a, 2026-05-29) ───────────────────
# Declarative Nextcloud↔OnlyOffice: enable the `onlyoffice` connector app and
# point it at the document server with the SHARED JWT secret
# (onlyoffice_jwt_secret == OnlyOffice's JWT_SECRET env, so the two trust each
# other). Browser-facing DocumentServerUrl rides Traefik; JWT secures the
# server↔server calls. Fully provisioned on a blank — no manual "connect to
# document server" step. Gated on both services being installed.
- name: "[pazny.nextcloud Post] Install + enable the OnlyOffice connector app"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p iiab
    exec -T -u www-data nextcloud
    sh -c 'php occ app:install onlyoffice || php occ app:enable onlyoffice'
  when:
    - _nc_container.stdout | default('') | length > 0
    - install_onlyoffice | default(false)
  register: _nc_oo_app
  changed_when: "'enabled' in (_nc_oo_app.stdout | default('') | lower)"
  failed_when: false
  check_mode: false

- name: "[pazny.nextcloud Post] Point OnlyOffice connector at the document server (+ shared JWT)"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p iiab
    exec -T -u www-data nextcloud
    sh -c '{{ item }}'
  loop:
    - "php occ config:app:set onlyoffice DocumentServerUrl --value=https://{{ onlyoffice_domain }}/"
    - "php occ config:app:set onlyoffice jwt_secret --value={{ onlyoffice_jwt_secret | quote }}"
  loop_control:
    label: "set onlyoffice {{ item.split(' ')[4] }}"
  when:
    - _nc_container.stdout | default('') | length > 0
    - install_onlyoffice | default(false)
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true   # jwt_secret in the second item
