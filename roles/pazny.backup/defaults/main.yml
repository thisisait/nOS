---
# pazny.backup — default variables
# Nightly backup orchestration for stateful nOS services, targeting RustFS (S3).

# -- S3 / RustFS target --------------------------------------------------------
backup_target_region: "us-east-1"                 # RustFS ignores, aws-cli requires a value

# P2 (2026-08-02) — the archive key is NO LONGER derived from the password
# prefix. It used to be `{{ global_password_prefix }}_pw_backup_encryption`,
# which meant: leak the prefix -> decrypt the archive -> read the copy of
# ~/.nos/secrets.yml inside it (29 keys, 27 credential-shaped) -> hold every
# secret the estate deliberately RANDOMISED because deriving it was unsafe.
# REM-144 leaked exactly that prefix. See docs/archive/secret-blast-radius.md.
#
# Empty here on purpose: main.yml mints a 256-bit random value on first run and
# persists it to ~/.nos/secrets.yml, the same lazy-regenerate pattern as
# bone_secret and authentik_secret_key.
backup_encryption_passphrase: ""

# Wing SQLite store (security findings, audit hash-chain, agent sessions, GDPR
# lineage) — a host file, not a container. sqlite3 .dump → wing-db.sql.gz.
backup_keap_db_path: "{{ keap_data_dir | default(ansible_facts['env']['HOME'] + '/keap/data') }}/keap.db"
# Container that already has keap.db bind-mounted. The backup runs INSIDE it
# (node:sqlite `backup()`), which is what makes the source work at all: the
# launchd context that runs backup.sh has no Full Disk Access, so every
# host-path read under nos_data_root fails with "authorization denied".
# Docker reads its own mount — with SystemPolicyRemovableVolumes, NOT Full
# Disk Access, which it is refused (corrected 2026-08-30; ask
# tools/permission-status.py --grants rather than restating this).
# `keap_db_container_path` is where the store lives INSIDE that container.
# backup_keap_container / backup_keap_db_container_path / backup_wing_db_path /
# backup_tofu_state(_dir) live in default.config.yml: the direct restic path
# (tasks/backup.yml, no copy #1) reads them too.

# OpenTofu Authentik state artifacts (ADR-0001 Phase 1) → tofu-state.tar.gz.
# terraform.tfstate (+ its .backup sibling) and the rendered nos.auto.tfvars.json
# are SECRET-BEARING (provider client_secrets, outpost tokens) and gitignored in
# the repo checkout — before this they were in NO custody path, so disk loss
# orphaned the tenant from state (docs/opentofu-authentik-cutover.md P1).
# backup.sh skips a missing dir/file, so a blueprint-engine install costs nothing.
# Restore: the generic stage of tasks/restore.yml downloads + decrypts the tar
# into the restore workdir; re-seating it into the checkout is a deliberate
# MANUAL step (never auto-extract over a live git working tree).

# Embedded EspoCRM MariaDB (apps stack) is NOT infra-mariadb. Dump it when the
# container is running; skip when praxis/apps is off. Mutables are named volumes
# (not the mysql datadir — that is the dump). Compose project is `-p apps`.
backup_espocrm_db_container: "espocrm-db"
backup_espocrm_volumes:
  - apps_espocrm_custom
  - apps_espocrm_data
  - apps_espocrm_client_custom

# -- Container names (match the project-wide convention) -----------------------
backup_mariadb_container: "{{ mariadb_container_name | default('nos-mariadb') }}"
backup_postgresql_container: "{{ postgresql_container_name | default('nos-postgresql') }}"

# -- DB credentials (re-use playbook-wide secrets) -----------------------------
backup_mariadb_user: "root"
backup_mariadb_password: "{{ mariadb_root_password }}"
backup_postgresql_user: "{{ postgresql_root_user | default('postgres') }}"
backup_postgresql_password: "{{ postgresql_root_password }}"

# -- Authentik API -------------------------------------------------------------
# Authentik server publishes its :9000 on host port authentik_port (default 9003;
# host :9000 is PHP-FPM). A hardcoded :9000 hit PHP-FPM → 404 → blueprint backup
# failed (live, 2026-06-09). Track the real published port.
backup_authentik_url: "http://127.0.0.1:{{ authentik_port | default(9003) }}"
backup_authentik_token: "{{ authentik_bootstrap_token | default('') }}"

# -- Runtime paths -------------------------------------------------------------
backup_home_dir: "{{ ansible_facts['env']['HOME'] }}/.nos"
backup_script_path: "{{ backup_home_dir }}/backup.sh"
# backup_staging_dir (plaintext dump staging, the restic source) is declared in
# default.config.yml: tasks/backup.yml stages there too when copy #1 is off.

# ── Restore drill (backup-verify.sh) ──────────────────────────────────────
# A backup nobody has restored is a hypothesis. The drill fetches the newest
# objects from the bucket, decrypts + decompresses them, opens them and asserts
# the contents are usable — never touching live data.
backup_verify_script_path: "{{ backup_home_dir }}/backup-verify.sh"
backup_verify_log: "{{ backup_home_dir }}/backup-verify.log"
backup_verify_result: "{{ backup_home_dir }}/backup-verify.json"
# RustFS (on-host copy #1) agent label. Was "eu.thisisait.nos.backup" — COLLIDED
# with the Restic off-site path (tasks/backup.yml), which wrote the SAME plist
# path/Label, so enabling both silently clobbered one. Now ".rustfs" vs the
# Restic ".offsite"; the legacy label is booted-out + removed by tasks/main.yml.
backup_launchd_label: "eu.thisisait.nos.backup.rustfs"
backup_legacy_launchd_label: "eu.thisisait.nos.backup"
backup_launchd_plist: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ backup_launchd_label }}.plist"

# ── Backup-status exporter (S4 2026-06-10) ───────────────────────────────────
# backup_status_exporter.py was referenced by the 91-backups dashboard +
# 05-backup.yml alerts but never deployed/scheduled — dead metrics since C3.
# Runs every 60s: backup-status.json -> textfile .prom for Alloy's collector.
backup_exporter_enabled: true
backup_exporter_script_path: "{{ backup_home_dir }}/backup_status_exporter.py"
backup_exporter_launchd_label: "eu.thisisait.nos.backup.exporter"
backup_exporter_launchd_plist: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ backup_exporter_launchd_label }}.plist"
backup_legacy_launchd_plist: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ backup_legacy_launchd_label }}.plist"

