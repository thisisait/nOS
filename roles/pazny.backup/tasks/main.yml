---
# ==============================================================================
# pazny.backup — nightly backup orchestration
#
# Renders ~/.nos/backup.sh + a LaunchAgent that fires it every day at 03:00.
# The shell script handles the actual work (dump DBs, tar volumes, export
# Authentik blueprints, upload to RustFS, rotate). Ansible only provisions.
# ==============================================================================

- name: "[backup] Ensure ~/.nos runtime dir exists"
  ansible.builtin.file:
    path: "{{ backup_home_dir }}"
    state: directory
    mode: '0700'

# Platform-split, because this was an UNGATED brew call and Linux has Linuxbrew
# on $PATH — so `community.general.homebrew` did not skip, it ran, and the estate
# built awscli from a Linuxbrew formula whose post-install crashed inside
# Homebrew itself ("unknown install step: run"). Two faults stacked: an upstream
# Homebrew-on-Linux bug, and our own doctrine that every brew call is gated on
# `nos_pkg_manager == 'homebrew'` simply not applied here. Only the second is
# ours to fix, and fixing it removes the first from the path entirely.
# Found 2026-08-02 by the Linux wet-test, at pazny.backup.
- name: "[backup] Ensure aws-cli is installed (RustFS S3 client) — macOS"
  community.general.homebrew:
    name: awscli
    state: present
  when: nos_pkg_manager | default('homebrew') == 'homebrew'

# Linux goes to the VENDOR installer, not to a distro package. `apt awscli` was
# the obvious first guess and it is wrong on the target: Ubuntu dropped `awscli`
# from the archive after 22.04, so noble answers "No package matching 'awscli'"
# (measured on the 24.04 runner, 2026-08-02). Fedora ships `awscli2` under a
# different name again. One vendor path is fewer moving parts than a per-distro
# name table, and it is the same shape pazny.opencode already uses.
#
# Skipped entirely when `aws` is already on PATH, so a re-run is changed=0 and
# an operator who installed it their own way is left alone.
- name: "[backup] (Linux) Check for an existing aws CLI"
  ansible.builtin.command: command -v aws
  register: _backup_aws_present
  changed_when: false
  failed_when: false
  when: nos_pkg_manager | default('homebrew') != 'homebrew'

- name: "[backup] (Linux) Install AWS CLI v2 from the vendor installer"
  when:
    - nos_pkg_manager | default('homebrew') != 'homebrew'
    - _backup_aws_present.rc | default(1) != 0
  become: true
  block:
    - name: "[backup] (Linux) Ensure unzip + curl are present"
      ansible.builtin.package:
        name:
          - unzip
          - curl
        state: present

    - name: "[backup] (Linux) Fetch and install awscli v2"
      ansible.builtin.shell: |
        set -o pipefail
        # The vendor publishes exactly two Linux assets, keyed on `uname -m`:
        # awscli-exe-linux-x86_64.zip and awscli-exe-linux-aarch64.zip.
        arch="$(uname -m)"
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${arch}.zip" -o "$tmp/awscliv2.zip"
        unzip -q "$tmp/awscliv2.zip" -d "$tmp"
        # --update makes this idempotent if a partial install is already there.
        "$tmp/aws/install" --update
      args:
        executable: /bin/bash
      changed_when: true

    - name: "[backup] (Linux) VERIFY aws is now callable"
      ansible.builtin.command: aws --version
      register: _backup_aws_verify
      changed_when: false
      # Loud on purpose: without the client the nightly upload leg cannot work,
      # and a backup that cannot upload must not report itself as provisioned.
      failed_when: _backup_aws_verify.rc != 0

- name: "[backup] Render backup.sh entrypoint"
  ansible.builtin.template:
    src: "{{ role_path }}/files/backup.sh"
    dest: "{{ backup_script_path }}"
    mode: '0700'
  # files/backup.sh is actually a Jinja template (the .sh suffix keeps it
  # lint-friendly and executable stand-alone for debugging). `template:`
  # accepts any source path, so reading from files/ is fine.

- name: "[backup] Render backup-verify.sh (restore drill)"
  ansible.builtin.template:
    src: "{{ role_path }}/files/backup-verify.sh"
    dest: "{{ backup_verify_script_path }}"
    mode: '0700'
  # The drill pulls what is ACTUALLY in the bucket, decrypts it, opens it and
  # asserts the contents are usable. Without it, "we have backups" is a claim
  # about a script's exit code rather than about restorable data — which is how
  # keap.db went 6+ nights with zero successful backups and nobody noticed.

- name: "[backup] Ensure status file exists (empty skeleton)"
  ansible.builtin.copy:
    dest: "{{ backup_status_file }}"
    content: |
      {"last_run": 0, "sources": []}
    mode: '0600'
    force: false

# ── Schedule: launchd (macOS) | systemd --user timer (Linux) ──────────────────
# macOS uses a launchd StartCalendarInterval plist. Linux uses a systemd --user
# oneshot .service driven by a .timer (OnCalendar) — rendered via ensure_unit.
# Both gate on nos_service_manager (tasks/_platform.yml).

# ---- macOS: launchd ----
# De-collision (2026-06-09): the legacy label `eu.thisisait.nos.backup` was
# shared by BOTH this role and the Restic off-site path → same plist path,
# whoever loaded last won. Boot out + remove the orphan so the renamed
# .rustfs / .offsite agents are the only ones left.
- name: "[backup] Boot out legacy colliding backup agent (if present)"
  ansible.builtin.command: "launchctl bootout gui/{{ ansible_facts['user_uid'] | default(lookup('pipe', 'id -u')) }}/{{ backup_legacy_launchd_label }}"
  register: _backup_legacy_bootout
  changed_when: _backup_legacy_bootout.rc == 0
  failed_when: false
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[backup] Remove legacy colliding plist (if present)"
  ansible.builtin.file:
    path: "{{ backup_legacy_launchd_plist }}"
    state: absent
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[backup] Deploy launchd plist"
  ansible.builtin.template:
    src: backup-launchd.plist.j2
    dest: "{{ backup_launchd_plist }}"
    mode: '0644'
  notify: Reload backup launchd
  when: (nos_service_manager | default('launchd')) == 'launchd'

# Probe launchd state first: `launchctl load -w` prints "already loaded" to
# stderr with version-dependent wording, so a stderr-substring changed_when was
# unreliable (re-run still reported changed). rc of `launchctl list <label>` is
# the robust signal (0 = already loaded).
- name: "[backup] Check whether backup agent is already loaded"
  ansible.builtin.command: "launchctl list {{ backup_launchd_label }}"
  register: _backup_loaded
  changed_when: false
  failed_when: false
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[backup] Load launchd agent (idempotent)"
  ansible.builtin.command: >
    launchctl load -w "{{ backup_launchd_plist }}"
  register: _backup_load
  # Changed only when the agent was NOT already loaded (probe rc != 0), so a
  # steady-state re-run is ok.
  changed_when: _backup_loaded.rc | default(1) != 0
  failed_when: >
    _backup_load.rc != 0 and
    'already loaded' not in (_backup_load.stderr | default(''))
  when: (nos_service_manager | default('launchd')) == 'launchd'

# ---- Backup-status exporter (S4 2026-06-10) ----
# Dashboard 91-backups + 05-backup.yml alerts read nos_backup_* metrics that
# nothing produced. Deploy the exporter + a 60s agent; Alloy's textfile
# collector picks up {{ node_exporter_textfile_dir }}/backup.prom.
- name: "[backup] Ensure textfile metrics dir exists"
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    mode: '0755'
  when: backup_exporter_enabled | default(true) | bool

- name: "[backup] Deploy backup_status_exporter.py"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/observability/scripts/backup_status_exporter.py"
    dest: "{{ backup_exporter_script_path }}"
    mode: '0755'
  when: backup_exporter_enabled | default(true) | bool

- name: "[backup] Deploy exporter launchd plist"
  ansible.builtin.template:
    src: backup-exporter.plist.j2
    dest: "{{ backup_exporter_launchd_plist }}"
    mode: '0644'
  register: _exporter_plist
  when:
    - backup_exporter_enabled | default(true) | bool
    - (nos_service_manager | default('launchd')) == 'launchd'

# launchd caches EnvironmentVariables/args — bootout + bootstrap on change
# (the launchctl kickstart trap, see 2026-05-17 incident notes).
- name: "[backup] (Re)load exporter agent"
  ansible.builtin.shell: |
    launchctl bootout gui/$(id -u)/{{ backup_exporter_launchd_label }} 2>/dev/null || true
    launchctl bootstrap gui/$(id -u) "{{ backup_exporter_launchd_plist }}"
  when:
    - backup_exporter_enabled | default(true) | bool
    - (nos_service_manager | default('launchd')) == 'launchd'
    - _exporter_plist is changed
  changed_when: true

- name: "[backup] (Linux) Exporter service + 60s timer"
  ansible.builtin.include_role:
    name: pazny.linux.systemd_user
    tasks_from: ensure_unit
  vars:
    su_name: "{{ backup_exporter_launchd_label }}"
    su_description: "nOS backup-status textfile exporter"
    su_service_type: oneshot
    su_exec_start: "/usr/bin/python3 {{ backup_exporter_script_path }} --status {{ backup_status_file }} --output {{ node_exporter_textfile_dir }}/backup.prom"
    su_enable: false
  when:
    - backup_exporter_enabled | default(true) | bool
    - (nos_service_manager | default('launchd')) == 'systemd-user'

- name: "[backup] (Linux) Exporter timer (every minute)"
  ansible.builtin.include_role:
    name: pazny.linux.systemd_user
    tasks_from: ensure_unit
  vars:
    su_name: "{{ backup_exporter_launchd_label }}"
    su_type: timer
    su_description: "nOS backup exporter schedule"
    su_timer_calendar: "*-*-* *:*:00"
    su_timer_unit: "{{ backup_exporter_launchd_label }}.service"
  when:
    - backup_exporter_enabled | default(true) | bool
    - (nos_service_manager | default('launchd')) == 'systemd-user'

# ---- Linux: systemd --user oneshot service + timer ----
# De-collision (Linux): the same label rename (.backup → .backup.rustfs) orphans
# any pre-rename systemd --user units. Disable + remove them so the old timer
# doesn't keep firing the old backup.sh in parallel forever.
- name: "[backup] (Linux) Disable + remove legacy colliding systemd units (post-rename)"
  when: (nos_service_manager | default('launchd')) == 'systemd-user'
  block:
    - name: "[backup] (Linux) Stop + disable legacy backup timer/service"  # noqa: command-instead-of-module
      # command (not the systemd module): the legacy units usually no longer
      # exist; the module errors hard on a missing unit, command + failed_when:false
      # is the right "disable-if-present" idiom.
      ansible.builtin.command: "systemctl --user disable --now {{ backup_legacy_launchd_label }}.{{ item }}"
      loop: ['timer', 'service']
      changed_when: true
      failed_when: false

    - name: "[backup] (Linux) Remove legacy unit files"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/{{ backup_legacy_launchd_label }}.{{ item }}"
        state: absent
      loop: ['timer', 'service']

    - name: "[backup] (Linux) daemon-reload after legacy removal"
      ansible.builtin.systemd_service:
        scope: user
        daemon_reload: true
      failed_when: false

- name: "[backup] (Linux) Render oneshot backup service (not enabled — timer drives it)"
  ansible.builtin.include_role:
    name: pazny.linux.systemd_user
    tasks_from: ensure_unit
  vars:
    su_name: "{{ backup_launchd_label }}"
    su_description: "nOS nightly backup to RustFS"
    su_service_type: oneshot
    su_exec_start: "/bin/bash {{ backup_script_path }}"
    su_working_dir: "{{ ansible_facts['env']['HOME'] }}"
    su_enable: false
    su_environment:
      HOME: "{{ ansible_facts['env']['HOME'] }}"
      PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  when: (nos_service_manager | default('launchd')) == 'systemd-user'

- name: "[backup] (Linux) Render + enable backup timer"
  ansible.builtin.include_role:
    name: pazny.linux.systemd_user
    tasks_from: ensure_unit
  vars:
    su_name: "{{ backup_launchd_label }}"
    su_type: timer
    su_description: "nOS nightly backup schedule"
    su_timer_calendar: "*-*-* {{ '%02d' | format(backup_schedule_hour | int) }}:{{ '%02d' | format(backup_schedule_minute | int) }}:00"
    su_timer_unit: "{{ backup_launchd_label }}.service"
  when: (nos_service_manager | default('launchd')) == 'systemd-user'

- name: "[backup] Optionally run backup.sh immediately (backup_run_now=true)"
  ansible.builtin.command: "{{ backup_script_path }}"
  when: backup_run_now | bool
  register: _backup_run
  changed_when: _backup_run.rc == 0
  failed_when: false
