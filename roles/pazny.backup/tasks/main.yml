---
# ==============================================================================
# pazny.backup — nightly backup orchestration
#
# Renders ~/.nos/backup.sh + a LaunchAgent that fires it every day at 03:00.
# The shell script handles the actual work (dump DBs, tar volumes, export
# Authentik blueprints, upload to RustFS, rotate). Ansible only provisions.
# ==============================================================================

- name: "[backup] Ensure ~/.nos runtime dir exists"
  ansible.builtin.file:
    path: "{{ backup_home_dir }}"
    state: directory
    mode: '0700'

- name: "[backup] Ensure aws-cli is installed (RustFS S3 client)"
  community.general.homebrew:
    name: awscli
    state: present

- name: "[backup] Render backup.sh entrypoint"
  ansible.builtin.template:
    src: "{{ role_path }}/files/backup.sh"
    dest: "{{ backup_script_path }}"
    mode: '0700'
  # files/backup.sh is actually a Jinja template (the .sh suffix keeps it
  # lint-friendly and executable stand-alone for debugging). `template:`
  # accepts any source path, so reading from files/ is fine.

- name: "[backup] Ensure status file exists (empty skeleton)"
  ansible.builtin.copy:
    dest: "{{ backup_status_file }}"
    content: |
      {"last_run": 0, "sources": []}
    mode: '0600'
    force: false

# ── Schedule: launchd (macOS) | systemd --user timer (Linux) ──────────────────
# macOS uses a launchd StartCalendarInterval plist. Linux uses a systemd --user
# oneshot .service driven by a .timer (OnCalendar) — rendered via ensure_unit.
# Both gate on nos_service_manager (tasks/_platform.yml).

# ---- macOS: launchd ----
# De-collision (2026-06-09): the legacy label `eu.thisisait.nos.backup` was
# shared by BOTH this role and the Restic off-site path → same plist path,
# whoever loaded last won. Boot out + remove the orphan so the renamed
# .rustfs / .offsite agents are the only ones left.
- name: "[backup] Boot out legacy colliding backup agent (if present)"
  ansible.builtin.command: "launchctl bootout gui/{{ ansible_facts['user_uid'] | default(lookup('pipe', 'id -u')) }}/{{ backup_legacy_launchd_label }}"
  register: _backup_legacy_bootout
  changed_when: _backup_legacy_bootout.rc == 0
  failed_when: false
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[backup] Remove legacy colliding plist (if present)"
  ansible.builtin.file:
    path: "{{ backup_legacy_launchd_plist }}"
    state: absent
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[backup] Deploy launchd plist"
  ansible.builtin.template:
    src: backup-launchd.plist.j2
    dest: "{{ backup_launchd_plist }}"
    mode: '0644'
  notify: Reload backup launchd
  when: (nos_service_manager | default('launchd')) == 'launchd'

# Probe launchd state first: `launchctl load -w` prints "already loaded" to
# stderr with version-dependent wording, so a stderr-substring changed_when was
# unreliable (re-run still reported changed). rc of `launchctl list <label>` is
# the robust signal (0 = already loaded).
- name: "[backup] Check whether backup agent is already loaded"
  ansible.builtin.command: "launchctl list {{ backup_launchd_label }}"
  register: _backup_loaded
  changed_when: false
  failed_when: false
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[backup] Load launchd agent (idempotent)"
  ansible.builtin.command: >
    launchctl load -w "{{ backup_launchd_plist }}"
  register: _backup_load
  # Changed only when the agent was NOT already loaded (probe rc != 0), so a
  # steady-state re-run is ok.
  changed_when: _backup_loaded.rc | default(1) != 0
  failed_when: >
    _backup_load.rc != 0 and
    'already loaded' not in (_backup_load.stderr | default(''))
  when: (nos_service_manager | default('launchd')) == 'launchd'

# ---- Linux: systemd --user oneshot service + timer ----
# De-collision (Linux): the same label rename (.backup → .backup.rustfs) orphans
# any pre-rename systemd --user units. Disable + remove them so the old timer
# doesn't keep firing the old backup.sh in parallel forever.
- name: "[backup] (Linux) Disable + remove legacy colliding systemd units (post-rename)"
  when: (nos_service_manager | default('launchd')) == 'systemd-user'
  block:
    - name: "[backup] (Linux) Stop + disable legacy backup timer/service"  # noqa: command-instead-of-module
      # command (not the systemd module): the legacy units usually no longer
      # exist; the module errors hard on a missing unit, command + failed_when:false
      # is the right "disable-if-present" idiom.
      ansible.builtin.command: "systemctl --user disable --now {{ backup_legacy_launchd_label }}.{{ item }}"
      loop: ['timer', 'service']
      changed_when: true
      failed_when: false

    - name: "[backup] (Linux) Remove legacy unit files"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/{{ backup_legacy_launchd_label }}.{{ item }}"
        state: absent
      loop: ['timer', 'service']

    - name: "[backup] (Linux) daemon-reload after legacy removal"
      ansible.builtin.systemd_service:
        scope: user
        daemon_reload: true
      failed_when: false

- name: "[backup] (Linux) Render oneshot backup service (not enabled — timer drives it)"
  ansible.builtin.include_role:
    name: pazny.linux.systemd_user
    tasks_from: ensure_unit
  vars:
    su_name: "{{ backup_launchd_label }}"
    su_description: "nOS nightly backup to RustFS"
    su_service_type: oneshot
    su_exec_start: "/bin/bash {{ backup_script_path }}"
    su_working_dir: "{{ ansible_facts['env']['HOME'] }}"
    su_enable: false
    su_environment:
      HOME: "{{ ansible_facts['env']['HOME'] }}"
      PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  when: (nos_service_manager | default('launchd')) == 'systemd-user'

- name: "[backup] (Linux) Render + enable backup timer"
  ansible.builtin.include_role:
    name: pazny.linux.systemd_user
    tasks_from: ensure_unit
  vars:
    su_name: "{{ backup_launchd_label }}"
    su_type: timer
    su_description: "nOS nightly backup schedule"
    su_timer_calendar: "*-*-* {{ '%02d' | format(backup_schedule_hour | int) }}:{{ '%02d' | format(backup_schedule_minute | int) }}:00"
    su_timer_unit: "{{ backup_launchd_label }}.service"
  when: (nos_service_manager | default('launchd')) == 'systemd-user'

- name: "[backup] Optionally run backup.sh immediately (backup_run_now=true)"
  ansible.builtin.command: "{{ backup_script_path }}"
  when: backup_run_now | bool
  register: _backup_run
  changed_when: _backup_run.rc == 0
  failed_when: false
