---
# ==============================================================================
# pazny.ears — the ear, the mouth, and the launcher between them. No port, no
# organ, and nothing here executes a cortex chain.
#
# Three pieces travel together because they are one loop: ears-listen hears a
# turn, caddy puts it to an agent and has the cortex daemon typecheck the
# answer, speech.py reads the answer back — verbalised from a wording table, so
# a chain is spoken as a sentence a person can judge rather than as syntax.
# The launchd agent is rendered always and started only when the operator has
# said so.
# ==============================================================================

# NO `meta: end_play` GUARD HERE, deliberately, and the omission is the
# careful choice rather than the careless one. main.yml imports this role under
# `when: install_ears`, which stamps that condition on every task below — so
# the guard could never both be reached and be true. Copied from an older role
# it would be dead code today and a landmine tomorrow: under `include_role`
# (no outer when) `end_play` ends the ENTIRE converge play — Pulse, stacks,
# post-provision — not just this role.

- name: "[pazny.ears] Ensure runtime directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ears_runtime_dir }}"
    - "{{ ears_log_dir }}"

- name: "[pazny.ears] Create Python venv"
  ansible.builtin.command:
    cmd: "{{ ears_python }} -m venv {{ ears_venv }}"
    creates: "{{ ears_venv }}/bin/python"

# Shelling out to the venv's own pip rather than ansible.builtin.pip, for the
# reason pazny.bone records: the pip module imports `packaging` from the
# controller interpreter, which is PEP 668 externally-managed on macOS.
- name: "[pazny.ears] Install listener deps into venv (parakeet-mlx)"
  ansible.builtin.command:
    cmd: "{{ ears_venv }}/bin/pip install --disable-pip-version-check -r {{ playbook_dir }}/files/anatomy/ears/requirements.txt"
  register: _ears_pip
  # NOT `--quiet` with `stdout != ""`, which is how a task reports changed=false
  # on the run that actually installed everything: -q suppresses the success
  # line too, so the FIRST install looks identical to a no-op. Keying on pip's
  # own success sentence is the honest signal in both directions.
  changed_when: "'Successfully installed' in _ears_pip.stdout"

# WHERE THE PLAYBOOK IS, written down at converge. The launcher needs
# tools/run-agent.sh and cannot derive its path from its own location: in the
# repo it sits three directories below the root, at runtime it sits one below
# ~/ears, and the first real call went looking in `/`.
- name: "[pazny.ears] Record the repo root for the launcher"
  ansible.builtin.copy:
    dest: "{{ ears_runtime_dir }}/repo-root"
    content: "{{ playbook_dir }}\n"
    mode: '0644'

- name: "[pazny.ears] Sync listener source to runtime dir"
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/files/anatomy/ears/"
    dest: "{{ ears_runtime_dir }}/"
    delete: false
    rsync_opts:
      - "--exclude=__pycache__"
  notify: Restart ears-listen

# A symlink and not a copy, same reason nos-loop is one: the target is the file
# rsync just refreshed, so the command and the source can never be two
# versions of each other.
- name: "[pazny.ears] Put ears-listen and caddy on PATH"
  ansible.builtin.file:
    src: "{{ ears_runtime_dir }}/{{ item.src }}"
    dest: "{{ nos_cli_install_dir }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "ears-listen.py", dest: "ears-listen" }
    - { src: "caddy.py", dest: "caddy" }

# ── The .app bundle ──────────────────────────────────────────────────────────
# Built before the launchd job, because the job runs THE BUNDLE. See the role
# defaults for why a bundle id is the whole point.

- name: "[pazny.ears] Create the app bundle skeleton"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ears_app_dir }}/Contents/MacOS"
  when: ansible_os_family == 'Darwin'

- name: "[pazny.ears] Render the bundle Info.plist"
  ansible.builtin.template:
    src: ears-app-info.plist.j2
    dest: "{{ ears_app_dir }}/Contents/Info.plist"
    mode: '0644'
  register: _ears_app_plist
  when: ansible_os_family == 'Darwin'

- name: "[pazny.ears] Render the bundle executable"
  ansible.builtin.template:
    src: ears-app-launcher.sh.j2
    dest: "{{ ears_app_dir }}/Contents/MacOS/ears"
    mode: '0755'
  register: _ears_app_exec
  when: ansible_os_family == 'Darwin'

# A CHANGED BUNDLE IS A DIFFERENT APP TO TCC in the ad-hoc-signed case, so the
# grant can lapse when the executable changes. Re-signing ad-hoc keeps the
# identity stable across edits; without it the operator is re-prompted at
# random and eventually stops reading the prompt.
- name: "[pazny.ears] Ad-hoc sign the bundle so its identity survives an edit"
  # argv, NOT a string: `ears_app_dir` holds "nOS Ears.app" and the command
  # module splits a string on whitespace — so the signed path became
  # ".../Applications/nOS" and the play failed after building the bundle.
  ansible.builtin.command:
    argv:
      - codesign
      - --force
      - --sign
      - "-"
      - "{{ ears_app_dir }}"
  when:
    - ansible_os_family == 'Darwin'
    - (_ears_app_plist is defined and _ears_app_plist is changed) or
      (_ears_app_exec is defined and _ears_app_exec is changed)
  changed_when: true

# ── NO LAUNCHD JOB, and this is a measured decision, not an omission ─────────
#
# Every background shape was tried on 2026-08-31 and every one was handed a
# microphone with no speech in it: a launchd job running the venv python, a
# tmux window of the operator's own control-centre session, and an ad-hoc
# signed .app bundle under launchd — for which TCC would not even record a
# row. macOS binds a microphone grant to the RESPONSIBLE process, and on this
# host exactly two hold one: com.apple.Terminal and the pyenv interpreter.
#
# So the ear is a DELIBERATE SESSION: `s` in nos-cc opens a Terminal window
# running the listener. The window is not an inconvenience — it is the
# microphone made visible, and closing it is the fastest way to stop being
# recorded. A reboot-proof ear needs a real signing identity; that is roadmap
# row `ears-app-bundle`, and until it exists this role must not pretend.
#
# A STALE JOB IS WORSE THAN NONE: one that loads and hears nothing reports
# LISTENING, so the role removes any it previously installed.

- name: "[pazny.ears] Stop and remove a previously installed launchd listener"
  ansible.builtin.shell: |
    UID_NUM=$(id -u)
    if launchctl print "gui/${UID_NUM}/{{ ears_launchd_label }}" >/dev/null 2>&1; then
      launchctl bootout "gui/${UID_NUM}/{{ ears_launchd_label }}" 2>/dev/null || true
      echo REMOVED
    else
      echo ABSENT
    fi
  register: _ears_unload
  changed_when: "'REMOVED' in _ears_unload.stdout"
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[pazny.ears] Remove the launchd plist"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ ears_launchd_label }}.plist"
    state: absent
  when: (nos_service_manager | default('launchd')) == 'launchd'

# The model is ~600 MB and downloads on first use. Pre-fetching it here would
# make a converge wait on huggingface for a file the operator may never speak
# to, and would fail a blank run on a flaky network for a feature that is not
# load-bearing. So the FIRST RUN downloads it, and says so.
- name: "[pazny.ears] Report what is installed and what the first run still costs"
  ansible.builtin.debug:
    msg:
      - "ears-listen installed ({{ nos_cli_install_dir }}/ears-listen)"
      - "ASR model {{ ears_asr_model }} downloads on FIRST USE (~600 MB), not during this run"
      - "listening: NOT automatic. Press s in nos-cc — it opens a Terminal window, the one
         context on this host whose microphone grant is real. Closing the window stops it."
      - "MICROPHONE: a launchd agent has no window to prompt in. If macOS refuses,
         the listener exits 3 and records mic_ok=false — check `tools/caddy-status.py`,
         then grant it in System Settings > Privacy & Security > Microphone and
         re-run --tags ears."
      - "transcripts: {{ ears_runtime_dir }}/turns/, kept {{ ears_retention_days }} days"
      - "autorun: {{ 'ON — a finished turn goes to caddy, which asks the agent and typechecks the answer' if (ears_autorun | default(true) | bool) else 'OFF — turns are written down only' }}"
      - "rate what you hear: caddy --rate <-1|0|1|2|3>  (the only writer of that column that may exist)"
