---
# ==============================================================================
# pazny.n8n/tasks/post.yml — auto-register owner user
# Owner setup is POST /rest/owner/setup (internal REST). The /api/v1/owner*
# spellings this file used until 2026-09-21 have been 404 on every modern n8n
# — and `failed_when: false` swallowed it, so the owner was NEVER created
# (measured: user row with empty email, isInstanceOwnerSetUp=false) while the
# converge stayed green. The check is now an attempted LOGIN (a reader that
# proves the credential), and the file ends in an assert: one of the three
# legs must land or the task fails loudly.
# Called from tasks/stacks/stack-up.yml AFTER `docker compose -p iiab up`.
#
# Reconverge leg for state-declarative idempotence: session-based password
# change via /rest/login + /rest/change-password with previous_password_prefix
# for the OLD password (from .ansible-prefix-state).
# ==============================================================================

- name: "[pazny.n8n Post] Wait for API"
  ansible.builtin.include_role:
    name: pazny._common_tasks
    tasks_from: wait_for_api.yml
  vars:
    wait_name: "[pazny.n8n Post]"
    wait_url: "http://127.0.0.1:{{ n8n_port | default(5678) }}/healthz"
    wait_status_codes: [200]
    wait_register_as: _n8n_ready
    wait_retries: 12
    wait_delay: 10
    wait_hard_fail: false

# The converged check IS a login: the only reader that proves the credential
# works (an owner-exists flag says nothing about WHICH password the owner has,
# and /rest/settings' showSetupOnFirstLoad reads false even pre-setup —
# measured 2026-09-21).
- name: "[pazny.n8n Post] Login with current password (converged check)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ n8n_port | default(5678) }}/rest/login"
    method: POST
    body_format: json
    body:
      emailOrLdapLoginId: "{{ n8n_admin_email | default(default_admin_email) }}"
      password: "{{ n8n_admin_password | default(nos_derived_secrets.n8n) }}"
    status_code: [200, 401]
    timeout: 10
  register: _n8n_login_new
  when: _n8n_ready.status | default(0) == 200
  changed_when: false
  no_log: true

# 400 = "instance owner already setup" (some OTHER credential logs in) — the
# previous-password reconverge leg below is the handler. Any other non-200 is
# a real transport/validation failure and fails HERE, not three tasks later.
- name: "[pazny.n8n Post] Setup owner account (first-run only)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ n8n_port | default(5678) }}/rest/owner/setup"
    method: POST
    body_format: json
    body:
      email: "{{ n8n_admin_email | default(default_admin_email) }}"
      password: "{{ n8n_admin_password | default(nos_derived_secrets.n8n) }}"
      firstName: "{{ n8n_admin_firstname | default('Admin') }}"
      lastName: "{{ n8n_admin_lastname | default('nOS') }}"
    status_code: [200, 400]
    timeout: 10
  register: _n8n_setup
  when:
    - _n8n_ready.status | default(0) == 200
    - _n8n_login_new.status | default(0) == 401
  changed_when: _n8n_setup.status | default(0) == 200
  no_log: true

- name: "[pazny.n8n Post] Login with previous password (for reconverge)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ n8n_port | default(5678) }}/rest/login"
    method: POST
    body_format: json
    body:
      emailOrLdapLoginId: "{{ n8n_admin_email | default(default_admin_email) }}"
      password: "{{ previous_password_prefix | default(global_password_prefix) }}_pw_n8n"
    status_code: [200, 401]
    timeout: 10
  register: _n8n_login_old
  when:
    - _n8n_ready.status | default(0) == 200
    - _n8n_login_new.status | default(0) != 200
    - _n8n_setup.status | default(0) != 200
  changed_when: false
  failed_when: false
  no_log: true

- name: "[pazny.n8n Post] Change password via /rest/change-password"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ n8n_port | default(5678) }}/rest/change-password"
    method: POST
    body_format: json
    headers:
      Cookie: "{{ _n8n_login_old.cookies_string | default('') }}"
    body:
      currentPassword: "{{ previous_password_prefix | default(global_password_prefix) }}_pw_n8n"
      newPassword: "{{ n8n_admin_password | default(nos_derived_secrets.n8n) }}"
    status_code: [200, 204]
    timeout: 10
  register: _n8n_pw_reset
  when:
    - _n8n_login_old.status | default(0) == 200
  changed_when: _n8n_pw_reset.status | default(0) in [200, 204]
  failed_when: false
  no_log: true

# Success is asserted by a READER (the login/setup/reset statuses), never
# implied by attempting code — the pre-2026-09-21 file was the textbook
# self-reporting shape and hid a never-created owner for months.
- name: "[pazny.n8n Post] Owner credential must land (no silent green)"
  ansible.builtin.assert:
    that:
      - >-
        _n8n_login_new.status | default(0) == 200
        or _n8n_setup.status | default(0) == 200
        or _n8n_pw_reset.status | default(0) in [200, 204]
    fail_msg: >-
      n8n owner is unreachable by every leg: current-password login,
      /rest/owner/setup, and the previous-prefix password reset all failed.
      The owner exists with a credential this playbook does not derive —
      inspect `sqlite3 database.sqlite 'SELECT email FROM user'` in the n8n
      volume and reconcile manually (or blank n8n data).
  when: _n8n_ready.status | default(0) == 200

- name: "[pazny.n8n Post] Sync n8n packs (inactive; inject KEAP cred)"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/tools/n8n-pack.py"
      - sync
      - "--packs={{ playbook_dir }}/files/anatomy/n8n/packs"
      - "--url=http://127.0.0.1:{{ n8n_port | default(5678) }}"
      - "--secrets={{ ansible_facts['env']['HOME'] }}/.nos/secrets.yml"
      - "--email={{ n8n_admin_email | default(default_admin_email) }}"
      - "--keap-base=https://{{ keap_domain }}"
  environment:
    N8N_PASSWORD: "{{ n8n_admin_password | default(nos_derived_secrets.n8n) }}"
    KEAP_TOKEN: "{{ keap_agent_token_rw | default('') }}"
    KEAP_BASE: "https://{{ keap_domain }}"
  when:
    - _n8n_ready.status | default(0) == 200
    - install_keap | default(false) | bool
  no_log: true
