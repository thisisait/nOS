---
# ==============================================================================
# pazny.linux.systemd_user — systemd --user service manager (Linux).
#
# This role has NO default action. It is a library: host-daemon roles
# (pazny.bone / .wing / .pulse / .openclaw, and the acme/backup timers) call
# its reusable entry point on Linux instead of the macOS launchctl dance:
#
#   - include_role:
#       name: pazny.linux.systemd_user
#       tasks_from: ensure_unit
#     vars: { su_name: ..., su_exec_start: ..., su_environment: {...} }
#
# Callers gate the include on `nos_service_manager == 'systemd-user'`
# (resolved per-platform in tasks/_platform.yml), so macOS never reaches it.
# See roles/pazny.linux.systemd_user/tasks/ensure_unit.yml for the contract.
# First consumer: pazny.bone (Linux pilot, 2026-05-25).
# ==============================================================================

- name: "[pazny.linux.systemd_user] Library role — call tasks_from=ensure_unit"
  ansible.builtin.debug:
    msg: "pazny.linux.systemd_user is a library (no default action); see tasks/ensure_unit.yml."
  when: false
