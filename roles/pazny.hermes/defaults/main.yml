---
# ==============================================================================
# pazny.hermes — Hermes Agent framework (Nous Research)
#
# Python 3.11+ agent daemon with:
#   - Skill autogeneration (agentskills.io format)
#   - Cross-channel gateway (Telegram, Signal, Slack, Email, etc.)
#   - FTS5 cross-session memory
#   - Cron-scheduled agents
#   - Subagent RPC (parallel workstreams)
#   - Model-agnostic: Ollama, Anthropic, OpenAI, OpenRouter, HF, Bedrock
#   - MCP client (consumes our mcpo gateway's underlying MCP servers)
#
# Architektura:
#   1) Hermes 4 14B (~10GB) — orchestrator + MCP caller + smaller tasks
#   2) Delegace velkych ukolu:
#      - Local dense: qwen2.5-coder:32b (20GB) — on-demand via Ollama
#      - Claude Code CLI — user's Claude subscription (zero API cost)
#      - Anthropic API — optional, for quick prototyping
#
# RAM budget on a 36GB Mac Studio:
#   - Docker stack:        ~12 GB
#   - Hermes 14B (x2):     ~20 GB (2 paralelni instance)
#   - Remaining:           ~4 GB for OS + cache
#   For heavy tasks: 1 Hermes + 1 dense 32B = ~30GB (short-lived)
# ==============================================================================

hermes_user: "{{ ansible_facts['user_id'] }}"
hermes_home: "{{ ansible_facts['env']['HOME'] }}/agents/hermes"
hermes_venv: "{{ ansible_facts['env']['HOME'] }}/agents/hermes/.venv"
hermes_config_dir: "{{ ansible_facts['env']['HOME'] }}/.hermes"
hermes_log_dir: "{{ ansible_facts['env']['HOME'] }}/agents/log"

# Hermes Agent: NOT on PyPI — installed from git clone + `uv pip install -e .`
# Pinned via hermes_version_tag (git tag). Upstream releases: v2026.X.Y
hermes_repo_url: "https://github.com/NousResearch/hermes-agent.git"
hermes_version_tag: "v2026.4.16"      # = Hermes Agent 0.10.0 (April 2026, beta)
hermes_extras: "mcp,web"              # MCP client + FastAPI web UI (pro nginx vhost)
                                      # Plny seznam: all, mcp, web, messaging, cron, slack,
                                      # matrix, cli, voice, honcho, tts-premium, rl, ...

# ── Modely ────────────────────────────────────────────────────────────────────

# Primary model — Hermes 3 8B (~4.7GB, official Ollama library)
# Why not Hermes 4: the GGUF version requires HF auth, and the official Ollama library
# has no Hermes 4 (only hermes3 in 3b/8b/70b/405b). 8B is ideal for the orchestrator
# role (fast, tool-call ready, leaves RAM for delegate 32b).
hermes_primary_model: "hermes3:8b"
hermes_primary_model_shortname: "hermes3:8b"      # Ollama tag = also the Hermes model ID

# Heavy-duty delegate — local dense coder (shared with OpenClaw)
hermes_heavy_model: "qwen2.5-coder:32b"

# ── Backend endpoints ─────────────────────────────────────────────────────────

hermes_ollama_host: "http://127.0.0.1:11434"        # lokalni Ollama

# Anthropic API key (z credentials.yml, volitelne)
# If set -> Hermes can call Claude via API for quick prototypes
hermes_anthropic_api_key: "{{ anthropic_api_key | default('') }}"

# Claude Code CLI delegation (user's $20/mo subscription)
# Hermes calls it as a shell tool: `claude --print "..."`
hermes_claude_code_enabled: true

# ── MCP ───────────────────────────────────────────────────────────────────────

# Hermes MCP client -> hook into our MCP servers (via mcpo gateway)
# mcpo exposes individual servers as OpenAPI, but Hermes speaks raw MCP,
# so they connect directly to MCP servers (stdio/sse, without the mcpo layer)
# THREE OF THESE FIVE WERE DEAD ON EVERY START, and `hermes doctor` said
# "Found 3 issue(s)" without naming any of them (measured 2026-08-08 — the
# tracebacks scroll past ABOVE the summary, which reports calm; the estate's
# own recurring defect, this time inside a third-party tool).
#
#   time, fetch   ImportError: cannot import name 'McpError' from
#                 mcp.shared.exceptions ... Did you mean: 'MCPError'?
#   git           ERROR: /Users/pazny/projects is not a valid Git repository
#
# `uvx <pkg>` resolves the LATEST of everything on every invocation. The `mcp`
# SDK reached 2.0.0 and renamed McpError -> MCPError; mcp-server-time and
# mcp-server-fetch still import the old name, so an unpinned uvx is guaranteed
# to fetch an incompatible pair. `--with 'mcp<2'` holds the SDK on the side of
# the rename these servers were written against — verified before shipping by
# running both with the exact argv rendered below.
#
# The git one was ours: the repository is ~/projects/nOS. ~/projects is the
# parent directory and has never been a git repo, so that server has answered
# nothing since the day it was configured.
#
# NOT PINNED HERE, and deliberately: the npx servers. They have not broken, and
# a pin nobody has a reason for is a maintenance burden that looks like rigour.
hermes_mcp_servers:
  - name: "filesystem"
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "{{ ansible_facts['env']['HOME'] }}/projects", "{{ ansible_facts['env']['HOME'] }}/agents/log"]
  - name: "git"
    command: "uvx"
    args: ["--with", "mcp<2", "mcp-server-git", "--repository", "{{ hermes_git_repository }}"]
  - name: "fetch"
    command: "uvx"
    args: ["--with", "mcp<2", "mcp-server-fetch"]
  - name: "memory"
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-memory"]
    env:
      MEMORY_FILE_PATH: "{{ ansible_facts['env']['HOME'] }}/.hermes/memory.json"
  - name: "time"
    command: "uvx"
    args: ["--with", "mcp<2", "mcp-server-time", "--local-timezone={{ hermes_timezone }}"]

# The repository mcp-server-git serves. Must be a real git working tree —
# pointing it at a parent directory makes the server log an error per start and
# answer nothing, which is what it did until 2026-08-08.
hermes_git_repository: "{{ playbook_dir }}"
# Was hard-coded Europe/Prague in the args above; an operator elsewhere had no
# way to change it without editing a role default.
hermes_timezone: "Europe/Prague"

# ── Web UI / API ──────────────────────────────────────────────────────────────

hermes_web_enabled: true                            # FastAPI na hermes_web_port
hermes_web_host: "127.0.0.1"
hermes_web_port: 18790                              # vedle openclaw 18789
hermes_domain: "hermes{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"

# -- Daemon mode (optional, OPT-IN; default OFF) ──────────────────────────────
# Phase-1 autowiring (2026-06-08): when hermes_daemon_mode=true AND the host uses
# launchd, the role renders + bootstraps a launchd unit that self-starts the
# FastAPI web UI on hermes_web_host:hermes_web_port and respawns it (KeepAlive),
# matching the Bone/Pulse/Wing host-daemon pattern. Default OFF so a blank run
# never silently starts a daemon or exposes a no-native-auth web UI —
# manual-over-auto. Cross-channel messaging (Telegram/Discord/Signal) stays a
# deliberate manual step (`hermes gateway install`), never auto-fired.
hermes_daemon_mode: false
hermes_launchd_label: "eu.thisisait.nos.hermes"   # matches state/manifest.yml
# ProgramArguments for the web-UI daemon. Parametric on purpose: the upstream
# Hermes CLI verb that starts the web server is version-dependent, and the
# source is git-cloned (not vendored), so it can't be pinned from the repo.
# v0.10.0 (2026.4.16, live-verified 2026-06-11): the verb is `dashboard`
# with explicit --host/--port args (`web` was removed upstream — the old
# default crash-looped the launchd agent at status 2, throttled 300s).
# NO --insecure: loopback bind is the contract; Traefik fronts the route.
hermes_web_command:
  - "{{ hermes_venv }}/bin/hermes"
  - "dashboard"
  - "--host"
  - "{{ hermes_web_host }}"
  - "--port"
  - "{{ hermes_web_port }}"
  - "--no-open"

# Manual modes (no launchd needed) — still available regardless of daemon_mode:
#   hermes chat                # interactive TUI
#   hermes gateway install     # launchd plist for Telegram/Discord messaging
#   hermes mcp serve &         # standalone MCP server in the background

# ── Concurrent agents ─────────────────────────────────────────────────────────

hermes_max_concurrent_subagents: 4                  # paralelni RPC workstreams
hermes_max_parallel_tool_calls: 10

# Sampling (recommended by Nous: temp=0.6, top_p=0.95, top_k=20 for tool use)
hermes_temperature: 0.6
hermes_top_p: 0.95
hermes_top_k: 20
