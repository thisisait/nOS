---
# Internals only. The switch (install_thalamus) and the ledger dir (thalamus_data_dir, under
# nos_data_root) live in default.config.yml. The socket (~/.nos/thalamus.sock) is fixed in src/main.rs.
thalamus_launchd_label: "eu.thisisait.nos.thalamus"
thalamus_home: "{{ ansible_facts['env']['HOME'] }}/thalamus"
# The var behind the auth_secret (nos:<var>) of the row iris binds, read where the binary reads it;
# "" for a keyless row. The plist renders that one var's value as NOS_SECRET_<VAR> (src/main.rs).
thalamus_model_secret: >-
  {{ ((lookup('file', nos_main_checkout ~ '/state/habitat/llm-backends.yml') | from_yaml).backends
  [(lookup('file', nos_main_checkout ~ '/files/anatomy/agents/iris/agent.yml') | from_yaml).model.backend]
  .auth_secret | default('', true)) | regex_replace('^nos:', '') }}
thalamus_model_token: "{{ lookup('vars', thalamus_model_secret, default='') if thalamus_model_secret else '' }}"
thalamus_bin: "{{ thalamus_home }}/bin/thalamus"
thalamus_log_dir: "{{ thalamus_home }}/log"
thalamus_target_dir: "{{ thalamus_home }}/target"
thalamus_socket: "{{ ansible_facts['env']['HOME'] }}/.nos/thalamus.sock"
thalamus_cargo: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/cargo"
# serve maps the model's "roadmap" to this; declared once in default.config.yml.
thalamus_roadmap_table_id: "{{ keap_roadmap_table_id }}"
# The env src/binding.rs binds iris from: the plist renders it, the preflight
# (tasks/llm-requirement.yml) judges it. ollama is armed only with its daemon installed.
# Never the key: this map is the preflight's env too; the plist adds NOS_SECRET_<VAR> on its own.
thalamus_binding_env:
  NOS_ARMED_BACKENDS: >-
    {{ (('mistral-eu ' if mistral_enabled | default(false) | bool else '')
    ~ ('ollama' if (ollama_enabled | default(false) | bool and install_ollama | default(false) | bool) else '')) | trim }}
  NOS_LOCAL_MODEL: "{{ ollama_model | default('') }}"
  NOS_LOCAL_SMALL_MODEL: "{{ ollama_small_model | default('') }}"
  NOS_MISTRAL_MODEL: "{{ mistral_model | default('') }}"
