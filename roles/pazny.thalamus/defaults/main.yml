---
# Internals only. The switch (install_thalamus) and the ledger dir (thalamus_data_dir, under
# nos_data_root) live in default.config.yml. The socket (~/.nos/thalamus.sock) is fixed in src/main.rs.
thalamus_launchd_label: "eu.thisisait.nos.thalamus"
thalamus_home: "{{ ansible_facts['env']['HOME'] }}/thalamus"
# A copy of the medulla in the same dir (pazny.medulla medulla_bin_dir); the plist and the unit run it.
# Spelled without medulla_* vars: include_role keeps them private, and this is read before the include.
thalamus_bin: "{{ thalamus_home }}/bin/thalamus"
# The copy the daemon runs: Activity Monitor and top name a process by the file launchd ran
# (argv[0] does not count), so the organ's file is nos-<organ>. thalamus_bin stays the CLI.
thalamus_serve_bin: "{{ thalamus_home }}/bin/nos-thalamus"
thalamus_log_dir: "{{ thalamus_home }}/log"
thalamus_target_dir: "{{ thalamus_home }}/target"
thalamus_socket: "{{ ansible_facts['env']['HOME'] }}/.nos/thalamus.sock"
# One self-signed identity per host keeps the removable-volume grant across rebuilds (pazny.medulla).
thalamus_signing_cn: "nOS local code signing"
thalamus_signing_keychain: "{{ ansible_facts['env']['HOME'] }}/Library/Keychains/login.keychain-db"
thalamus_cargo: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/cargo"
# The pupil (files/anatomy/pupil), built and signed by tasks/pupil.yml. The id is tauri.conf.json's.
# An app the person opens from Launchpad/Dock; the binary inside it is the path serve can check.
thalamus_pupil_app: "{{ ansible_facts['env']['HOME'] }}/Applications/Iris.app"
thalamus_pupil_exe: "{{ thalamus_pupil_app }}/Contents/MacOS/nos-pupil"
# The hashes live beside the app: a file added inside a signed bundle breaks its seal.
thalamus_pupil_state: "{{ thalamus_home }}/bin/nos-pupil"
# The executables serve lets submit a form, decide an approval or answer a choice (NOS_DECIDER_EXES);
# empty = off, the peer is only recorded. Recommended, set in config.yml by the operator:
# [ "{{ thalamus_pupil_exe }}", "{{ thalamus_bin }}" ] (the terminal shell decides with y/n).
thalamus_decider_exes: []
thalamus_pupil_identifier: "eu.thisisait.nos.pupil"
thalamus_pupil_target_dir: "{{ thalamus_home }}/pupil-target"
# serve maps the model's "roadmap" to this; declared once in default.config.yml.
thalamus_roadmap_table_id: "{{ keap_roadmap_table_id }}"
# The env src/binding.rs binds iris from: the plist renders it, the preflight
# (tasks/llm-requirement.yml) judges it. ollama is armed only with its daemon installed.
# Never the key: this map is the preflight's env too; the plist adds NOS_SECRET_<VAR> on its own.
thalamus_binding_env:
  NOS_ARMED_BACKENDS: >-
    {{ (('mistral-eu ' if mistral_enabled | default(false) | bool else '')
    ~ ('anthropic-api ' if anthropic_api_enabled | default(false) | bool else '')
    ~ ('minimax-api ' if minimax_api_enabled | default(false) | bool else '')
    ~ ('vllm ' if install_vllm | default(false) | bool else '')
    ~ ('ollama' if (ollama_enabled | default(false) | bool and install_ollama | default(false) | bool) else '')) | trim }}
  NOS_LOCAL_MODEL: "{{ ollama_model | default('') }}"
  NOS_LOCAL_SMALL_MODEL: "{{ ollama_small_model | default('') }}"
  NOS_MISTRAL_MODEL: "{{ mistral_model | default('') }}"
  NOS_ANTHROPIC_API_MODEL: "{{ anthropic_api_model | default('') }}"
  NOS_MINIMAX_MODEL: "{{ minimax_model | default('') }}"
  NOS_VLLM_MODEL: "{{ vllm_served_model_name | default('') if install_vllm | default(false) | bool else '' }}"
  NOS_CELL_BACKEND: "{{ iris_backend | default('') }}"
  NOS_GDPR_POSTURE: "{{ gdpr_posture | default('standard') }}"
  NOS_LOCAL_TEMPERATURE: "{{ iris_local_temperature | default(0.3) }}"
  NOS_LOCAL_SEED: "{{ iris_local_seed | default('') }}"
  # The size floors src/binding.rs judges a local model by (refuse / warn); empty = not judged there.
  NOS_LLM_MIN_PARAMS_B: "{{ llm_cell_min_params_b | default('') }}"
  NOS_LLM_RECOMMENDED_PARAMS_B: "{{ llm_cell_recommended_params_b | default('') }}"
# ── Linux (tasks/linux.yml) ───────────────────────────────────────────────────
# One daemon for every login on the host: the socket lives outside the (0700)
# homes and is opened 0666 — serve still names the peer by SO_PEERCRED and
# refuses a uid the identity map does not list. /etc/profile.d tells each
# login's shell where it is; `iris` is the shell.
thalamus_shared_socket_dir: /run/nos   # src/main.rs SHARED_SOCKET is this dir + thalamus.sock
thalamus_shared_socket: "{{ thalamus_shared_socket_dir }}/thalamus.sock"
# Built in a pinned container (thalamus_rust_image, default.config.yml): no Rust
# toolchain on the host, the same compiler every run.
thalamus_build_cache: "{{ ansible_facts['env']['HOME'] }}/.cache/nos-thalamus-build"
thalamus_unit_name: "eu.thisisait.nos.thalamus"
# thalamus.env.j2's HOME, NOS_REPO_ROOT and PATH. Today's values unless nos_system_user is set; then
# the medulla's system unit (pazny.medulla) reads its identity map and genome under nos_system_home,
# and no line names the operator's home (ProtectHome hides it).
thalamus_env_home: "{{ nos_system_home if nos_system_user | default('') | length else ansible_facts['env']['HOME'] }}"
thalamus_repo_root: "{{ nos_system_home ~ '/genome' if nos_system_user | default('') | length else nos_main_checkout }}"
thalamus_env_path: "{{ '' if nos_system_user | default('') | length else nos_tools_venv ~ '/bin:' }}/usr/local/bin:/usr/bin:/bin"
# The job the opt-in nerve probe fires (-e medulla_pulse_probe=true): read-only, no secret: env.
medulla_pulse_probe_job: "npm-supply-chain:daily-ioc-scan"
