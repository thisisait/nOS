---
# pazny.thalamus on macOS: the medulla build (pazny.medulla), launchd, the pupil app.

- name: "[pazny.thalamus] Ensure runtime directories exist"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ thalamus_home }}", mode: '0755' }
    - { path: "{{ thalamus_home }}/bin", mode: '0755' }
    # 0700: the logs name every person; the ledger holds turns and approved cell values.
    - { path: "{{ thalamus_log_dir }}", mode: '0700' }
    - { path: "{{ thalamus_data_dir }}", mode: '0700' }
    # The settings store serve writes (src/settings.rs); Wing and medulla-pulse read it as the same user.
    - { path: "{{ medulla_data_dir }}", mode: '0700' }

# The build is the medulla's (row medulla-skeleton): one workspace binary, thalamus_bin is a copy of it.
- name: "[pazny.thalamus] Build the medulla, which runs as thalamus"
  ansible.builtin.include_role:
    name: pazny.medulla
    apply:
      tags: [thalamus, keap, medulla]  # main.yml imports pazny.thalamus under thalamus + keap
  tags: [thalamus, keap, medulla]

- name: "[pazny.thalamus] Render launchd plist"
  ansible.builtin.template:
    src: thalamus.plist.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ thalamus_launchd_label }}.plist"
    mode: '0600'   # carries the KEAP proxy secret and the model key
  no_log: true     # --diff would print both
  register: _thalamus_plist
  notify: Restart thalamus

- name: "[pazny.thalamus] Bootstrap launchd job (idempotent)"
  ansible.builtin.shell: |
    set -e
    PLIST=~/Library/LaunchAgents/{{ thalamus_launchd_label }}.plist
    UID_NUM=$(id -u)
    if launchctl print "gui/${UID_NUM}/{{ thalamus_launchd_label }}" >/dev/null 2>&1; then
      echo "already-loaded"
    else
      launchctl bootstrap gui/${UID_NUM} "$PLIST"
      echo "bootstrapped"
    fi
  register: _thalamus_bootstrap
  changed_when: "'bootstrapped' in _thalamus_bootstrap.stdout"

- name: "[pazny.thalamus] Flush handlers (apply a pending restart now)"
  ansible.builtin.meta: flush_handlers

# Static, so --tags thalamus reaches it; signs with the identity minted above. After the daemon
# serves, so a failed pupil build (npm, tauri) never holds back the plist or the bootstrap.
- ansible.builtin.import_tasks: pupil.yml

# After pupil.yml built nos-pupil: a listed path that names no file admits nobody, silently.
- name: "[pazny.thalamus] Each listed decider exists"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ thalamus_decider_exes }}"
  register: _thalamus_deciders

- name: "[pazny.thalamus] A decider that names no file is refused"
  ansible.builtin.assert:
    that: _thalamus_deciders.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      thalamus_decider_exes names no file:
      {{ _thalamus_deciders.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }};
      it would admit nobody (src/serve.rs decider_refusal).
  when: not ansible_check_mode  # --check builds no pupil

# The effect, read by the reader: socket 0600, job loaded, ledger readable. Any line not OK fails,
# except the model line: serving without one warns (ruling 2026-10-12) — the reader still says UNKNOWN.
- name: "[pazny.thalamus] Verify — the reader sees the socket, the job and the ledger"
  ansible.builtin.shell: |
    set -o pipefail
    # Wait for a socket that accepts: a stale one from a crashed run exists but answers nobody.
    for _ in $(seq 1 20); do
      out=$(/usr/bin/python3 {{ (playbook_dir ~ '/tools/thalamus-status.py') | quote }} --json) || exit 1
      echo "$out" | /usr/bin/python3 -c 'import json,sys; sys.exit(any(r["state"] != "OK" for r in json.load(sys.stdin) if r["check"] != "model"))' && break
      sleep 0.5
    done
    echo "$out"
  args:
    executable: /bin/bash
  register: _thalamus_verify
  changed_when: false
  failed_when: >-
    _thalamus_verify.rc != 0
    or (_thalamus_verify.stdout | from_json | rejectattr('check', 'equalto', 'model')
        | rejectattr('state', 'equalto', 'OK') | list | length) > 0
  tags: ['verify']

# Red in the log, ignored=1 in the recap: visible, not green, not a failure.
- name: "[pazny.thalamus] Verify — WARN: the thalamus serves without a model"
  ansible.builtin.fail:
    msg: >-
      WARN (not a failure): {{ (_thalamus_verify.stdout | from_json | selectattr('check', 'equalto', 'model') | first).detail }}.
      Controls answer, turns are refused until iris binds a model (tools/thalamus-status.py).
  when: >-
    (_thalamus_verify.stdout | from_json | selectattr('check', 'equalto', 'model')
     | rejectattr('state', 'equalto', 'OK') | list | length) > 0
  ignore_errors: true  # noqa: ignore-errors - a warning by ruling, counted as ignored in the recap
  tags: ['verify']

# Here, not in pazny.medulla's app.yml: an include_role is not reached by --tags verify.
# The installed bundle verifies, names nOS.app's identifier and the keychain identity's leaf.
- name: "[pazny.thalamus] Verify — the installed nOS.app is signed by the local identity"
  ansible.builtin.shell: |
    set -euo pipefail
    codesign --verify --strict {{ thalamus_nos_app | quote }}
    dr=$(codesign -d -r- {{ thalamus_nos_app | quote }} 2>&1)
    H=$(security find-certificate -c {{ thalamus_signing_cn | quote }} -Z {{ thalamus_signing_keychain | quote }} \
      | awk '/SHA-1 hash/ {print tolower($3); exit}')
    [ -n "$H" ] || { echo "no signing identity in the keychain" >&2; exit 1; }
    grep -qF 'identifier "eu.thisisait.nos.app"' <<<"$dr" || { echo "not nOS.app's identifier: $dr" >&2; exit 1; }
    grep -qF "certificate leaf = H\"$H\"" <<<"$dr" || { echo "not signed by the keychain identity $H: $dr" >&2; exit 1; }
    echo "$H"
  args:
    executable: /bin/bash
  register: _nos_app_verify
  changed_when: false
  tags: ['verify']

# The nerve, proven live (row medulla-scheduler, c2): fire ONE read-only job through the medulla with
# --report and read its row back. Opt-in (-e medulla_pulse_probe=true): it really runs the job.
# Gate for the shape: medulla/tests/pulse_report.rs; this is the effect. macOS only for now.
- name: "[pazny.thalamus] Verify — the probe fires a job of the medulla's own set"
  ansible.builtin.assert:
    that: medulla_pulse_probe_job in (pulse_medulla_jobs | default([]))
    fail_msg: >-
      the probe fires {{ medulla_pulse_probe_job or 'nothing' }}, not a job of pulse_medulla_jobs
      ({{ pulse_medulla_jobs | default([]) }}): a probe on a Python job made it two-schedulered in
      red-status (2026-10-25). Put one job in pulse_medulla_jobs first.
  when: medulla_pulse_probe | default(false) | bool
  tags: ['verify']

- name: "[pazny.thalamus] Verify — one job fired by the medulla is recorded by Wing"
  ansible.builtin.command:
    argv: ["{{ thalamus_home }}/bin/medulla", pulse, run, "{{ medulla_pulse_probe_job }}", --report, --db, "{{ wing_data_dir }}/wing.db"]
  environment:
    MEDULLA_PULSE: "1"
    MEDULLA_WING_TOKEN: "{{ medulla_wing_api_token }}"
    NOS_WING_URL: "http://127.0.0.1:{{ wing_port | default(9000) }}"
    NOS_REPO_ROOT: "{{ playbook_dir }}"
  register: _medulla_probe
  changed_when: true
  no_log: true  # carries a secret (test_a_secret_bearing_task_is_no_log)
  when: medulla_pulse_probe | default(false) | bool
  tags: ['verify']

- name: "[pazny.thalamus] Verify — Wing holds that run, by the medulla, finished"
  ansible.builtin.command:
    argv: [sqlite3, -readonly, "{{ wing_data_dir }}/wing.db",
           "SELECT actor_id || '|' || IFNULL(exit_code, 'open') FROM pulse_runs WHERE run_id = '{{ (_medulla_probe.stdout | from_json).run_id }}'"]
  register: _medulla_probe_row
  changed_when: false
  failed_when: >-
    _medulla_probe_row.stdout.split('|') | first != 'medulla'
    or _medulla_probe_row.stdout.split('|') | last == 'open'
    or (_medulla_probe.stdout | from_json).reported is not sameas true
  when: medulla_pulse_probe | default(false) | bool
  tags: ['verify']
