---
# pazny.thalamus — the relay organ (files/anatomy/thalamus/thalamus): `thalamus serve` on
# ~/.nos/thalamus.sock, Iris's tools run as the peer's person through KEAP's human door.
# Gated on install_thalamus in main.yml. The identity map is the receptor's (ruling 1).

# Without the map every peer is refused; say so now rather than serve a door nobody can use.
- name: "[pazny.thalamus] The receptor renders the identity map it reads"
  ansible.builtin.assert:
    that: install_receptor | default(false) | bool
    fail_msg: "install_thalamus needs install_receptor: true (pazny.receptor renders ~/.nos/identity-map.yml)."

# serve.rs reads only the fixed ~/.nos/identity-map.yml; a moved map would refuse every peer.
- name: "[pazny.thalamus] The receptor's map is the path the binary reads"
  ansible.builtin.assert:
    that: >-
      (receptor_identity_map | default(ansible_facts['env']['HOME'] ~ '/.nos/identity-map.yml'))
      == ansible_facts['env']['HOME'] ~ '/.nos/identity-map.yml'
    fail_msg: "receptor_identity_map is overridden; the thalamus reads only ~/.nos/identity-map.yml (src/serve.rs IDENTITY_MAP)."

# Build only when the source differs from the one the binary was built from (Pulse's pattern).
- name: "[pazny.thalamus] Hash the thalamus source"
  ansible.builtin.shell: |
    set -o pipefail
    cd {{ (playbook_dir ~ '/files/anatomy/thalamus') | quote }}
    find thalamus/src thalamus/Cargo.toml thalamus/Cargo.lock contract/src contract/Cargo.toml -type f \
      | LC_ALL=C sort | xargs cat | shasum -a 256 | cut -d' ' -f1
  args:
    executable: /bin/bash
  register: _thalamus_src_sha
  changed_when: false
  check_mode: false

- name: "[pazny.thalamus] Read the hash the binary was built from"
  ansible.builtin.command: cat {{ thalamus_bin }}.source-sha256
  register: _thalamus_built_sha
  changed_when: false
  failed_when: false
  check_mode: false

# The vars behind the auth_secret (nos:<var>) of each row iris may bind that is ARMED here (its
# enabled_flag true); a keyless row has none. The plist renders each value as NOS_SECRET_<VAR>
# (src/main.rs): an unarmed row's key never reaches the thalamus.
- name: "[pazny.thalamus] The key vars of iris's armed rows"
  ansible.builtin.set_fact:
    thalamus_model_secrets: >-
      {%- set reg = (lookup('file', nos_main_checkout ~ '/state/habitat/llm-backends.yml') | from_yaml).backends -%}
      {%- set m = (lookup('file', nos_main_checkout ~ '/files/anatomy/agents/iris/agent.yml') | from_yaml).model -%}
      {%- set ns = namespace(out=[]) -%}
      {%- for row in m.backends_allowed | default([m.backend]) -%}
      {%- set spec = reg[row] | default({}) -%}
      {%- set ref = spec.auth_secret | default('', true) -%}
      {%- if ref.startswith('nos:') and lookup('vars', spec.enabled_flag | default('_unflagged'), default=false) | bool -%}
      {%- set ns.out = ns.out + [ref[4:]] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.out }}

- name: "[pazny.thalamus] Their values, for the plist only"
  ansible.builtin.set_fact:
    thalamus_model_tokens: >-
      {%- set ns = namespace(out={}) -%}
      {%- for var in thalamus_model_secrets -%}
      {%- set ns.out = dict(ns.out, **{var: lookup('vars', var, default='')}) -%}
      {%- endfor -%}
      {{ ns.out }}
  no_log: true

# serve splits NOS_DECIDER_EXES on ':' and a mis-set entry admits nobody (src/serve.rs deciders):
# a string would join its characters, an empty or relative entry matches no peer.
- name: "[pazny.thalamus] thalamus_decider_exes is a list of absolute paths"
  ansible.builtin.assert:
    that:
      - thalamus_decider_exes is iterable and thalamus_decider_exes is not string and thalamus_decider_exes is not mapping
      - thalamus_decider_exes | reject('string') | list | length == 0
      - thalamus_decider_exes | select('string') | reject('match', '^/[^:]+$') | list | length == 0
    fail_msg: "thalamus_decider_exes must be a list of absolute paths without ':', e.g. [\"{{ thalamus_pupil_exe }}\", \"{{ thalamus_bin }}\"]."

# One daemon per host: launchd on macOS (macos.yml, plus the pupil app), the
# operator's systemd --user unit on Linux with a socket every login shares (linux.yml).
- ansible.builtin.import_tasks: macos.yml
  when: nos_service_manager == 'launchd'

- ansible.builtin.import_tasks: linux.yml
  when: nos_service_manager != 'launchd'
