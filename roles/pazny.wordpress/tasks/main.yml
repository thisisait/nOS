---
# ==============================================================================
# pazny.wordpress/tasks/main.yml
#
# Called from tasks/stacks/stack-up.yml BEFORE `docker compose -p iiab up`:
# creates the data dir, nginx vhost, renders the compose override fragment do
# {{ stacks_dir }}/iiab/overrides/wordpress.yml, which stack-up.yml then
# collects via `find` and passes as an additional -f flag.
#
# Post-start wp-cli install + admin password reconverge lives in tasks/post.yml —
# called from stack-up.yml AFTER compose up (wordpress must be running before
# call `wp core install` and `wp user update`).
# ==============================================================================

- name: "[pazny.wordpress] Ensure WordPress directory exists"
  ansible.builtin.file:
    path: "{{ wordpress_dir }}"
    state: directory
    mode: '0755'

- name: "[pazny.wordpress] Ensure mu-plugins staging directory exists"
  ansible.builtin.file:
    path: "{{ stacks_dir }}/iiab/wordpress/mu-plugins"
    state: directory
    mode: '0755'

# Copy the OIDC auto-configurator as a must-use plugin. Mu-plugins load on
# every request with no activation step, so the openid-connect-generic
# settings get pushed as soon as the plugin itself is installed.
- name: "[pazny.wordpress] Stage OIDC mu-plugin (auto-configures openid-connect-generic)"
  ansible.builtin.copy:
    src: oidc-mu-plugin.php
    dest: "{{ stacks_dir }}/iiab/wordpress/mu-plugins/oidc-bootstrap.php"
    mode: '0644'
  notify: Restart wordpress

# App Passwords are core-disabled on non-SSL requests; TLS terminates at
# Traefik so WP only ever sees in-host hops. This mu-plugin re-enables them
# for the devlog REST writes (docs/devlog/README.md § Audit doctrine).
- name: "[pazny.wordpress] Stage devlog app-passwords mu-plugin"
  ansible.builtin.copy:
    src: devlog-app-passwords.php
    dest: "{{ stacks_dir }}/iiab/wordpress/mu-plugins/devlog-app-passwords.php"
    mode: '0644'
  notify: Restart wordpress
  when: wordpress_devlog_enabled | default(true)

# Mirrors Authentik groups -> WP roles on every OIDC login (map JSON comes
# from wordpress_rbac_role_map_json via the wordpress-base compose extension).
- name: "[pazny.wordpress] Stage RBAC role-sync mu-plugin"
  ansible.builtin.copy:
    src: rbac-role-sync.php
    dest: "{{ stacks_dir }}/iiab/wordpress/mu-plugins/rbac-role-sync.php"
    mode: '0644'
  notify: Restart wordpress
  when: install_authentik | default(false)

# CVE-2026-63030 (unauth RCE via /wp-json/batch/v1/). OFF as of 2026-08-06:
# wordpress_version is 7.0.2, which carries the upstream fix for both halves of
# wp2shell, so the mu-plugin's job is done and leaving it would keep the batch
# REST API dead for no reason.
#
# The FILE IS KEPT even though it is not staged. The recipe in
# default.config.yml said to delete it; deleting it is what makes the flag a
# trap in the other direction — a rollback to 6.9.4 is precisely the moment the
# mitigation is needed again, and it would have to be recovered from git
# history under pressure. An unused file costs nothing; a flag that cannot be
# turned back on costs an incident.
- name: "[pazny.wordpress] Stage CVE-2026-63030 batch-block mu-plugin"
  ansible.builtin.copy:
    src: cve-2026-63030-batch-block.php
    dest: "{{ stacks_dir }}/iiab/wordpress/mu-plugins/cve-2026-63030-batch-block.php"
    mode: '0644'
  notify: Restart wordpress
  when: wordpress_cve_63030_mitigate | default(false)

- name: "[pazny.wordpress] Stage unauth-surface hardening mu-plugin (REM-114)"
  ansible.builtin.copy:
    src: hardening-mu-plugin.php
    dest: "{{ stacks_dir }}/iiab/wordpress/mu-plugins/nos-hardening.php"
    mode: '0644'
  notify: Restart wordpress
  when: wordpress_harden_unauth_surface | default(true)

# ── The other half of every `when:` above ────────────────────────────────────
#
# A CONDITIONAL COPY IS HALF A SWITCH. Three of the mu-plugins above are staged
# behind a flag and, until 2026-08-06, not one of them was ever removed when
# its flag went false: `when:` decided whether to WRITE the file, and nothing
# decided to delete it. `mu-plugins/` is auto-loaded by WordPress with no
# activation step, so a staged plugin keeps running forever — flipping
# wordpress_cve_63030_mitigate to false would have left /wp-json/batch/v1/
# unregistered indefinitely, and the recipe's advice to delete the source would
# have removed the only explanation of why.
#
# Measured that day: the mu-plugin was live in iiab-wordpress-1 while its
# reason (an unpatched 6.9.4) had ceased to exist.
#
# Same shape as the flag/effect split this repo keeps finding — the flag records
# an intention, and something else has to carry it out. Pinned by
# tests/anatomy/test_a_flag_removes_what_it_staged.py.
- name: "[pazny.wordpress] Remove mu-plugins whose flag is off"
  ansible.builtin.file:
    path: "{{ stacks_dir }}/iiab/wordpress/mu-plugins/{{ item.file }}"
    state: absent
  # `enabled:`, NOT `on:`. YAML 1.1 — which is what PyYAML and Ansible parse —
  # coerces a bare `on` KEY to the boolean True, so `item.on` looked up an
  # attribute that did not exist and every loop item failed with "object of
  # type 'dict' has no attribute 'on'". The item rendered as
  # `{file: ..., true: true}`, which is the tell.
  #
  # This is the second time in one day: the anatomy graph's edge field is
  # `upstream:` for exactly this reason, and it was reported hours before this
  # was written. A trap you have been told about and walk into anyway is an
  # argument for a gate, not for more care — test_no_yaml_key_is_a_boolean.py.
  loop:
    - { file: devlog-app-passwords.php, enabled: "{{ wordpress_devlog_enabled | default(true) }}" }
    - { file: rbac-role-sync.php, enabled: "{{ install_authentik | default(false) }}" }
    - { file: cve-2026-63030-batch-block.php, enabled: "{{ wordpress_cve_63030_mitigate | default(false) }}" }
    - { file: nos-hardening.php, enabled: "{{ wordpress_harden_unauth_surface | default(true) }}" }
  loop_control:
    label: "{{ item.file }}"
  when: not (item.enabled | bool)
  notify: Restart wordpress

- name: "[pazny.wordpress] Render compose override fragment"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/iiab/overrides/wordpress.yml"
    mode: '0600'
  notify: Restart wordpress

# Linux routes via Traefik; host-nginx per-service vhosts are macOS-only.
- name: "[pazny.wordpress] Deploy nginx vhost"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/nginx/sites-available/wordpress.conf"
    dest: "{{ homebrew_prefix }}/etc/nginx/sites-available/wordpress.conf"
    mode: '0644'
  notify: Restart nginx
  when:
    - install_nginx | default(true)
    - ansible_os_family == 'Darwin'

- name: "[pazny.wordpress] Enable nginx vhost (symlink)"
  ansible.builtin.file:
    src: "{{ homebrew_prefix }}/etc/nginx/sites-available/wordpress.conf"
    dest: "{{ homebrew_prefix }}/etc/nginx/sites-enabled/wordpress.conf"
    state: link
    force: true
  notify: Restart nginx
  when:
    - install_nginx | default(true)
    - ansible_os_family == 'Darwin'

- name: "[pazny.wordpress] Print installation info"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════
       WordPress (Docker) ready
      ══════════════════════════════════════════════════════
       URL:       https://{{ wordpress_domain }}
       Container: wordpress → 127.0.0.1:{{ wordpress_port | default(8084) }}
       Data:      {{ wordpress_dir }}
       DB:        {{ wordpress_db_name }} @ mariadb (iiab_net)
       SSO:       {% if install_authentik | default(false) %}Authentik native OIDC (openid-connect-generic){% else %}disabled{% endif %}

       Finish: go to https://{{ wordpress_domain }}/wp-admin/install.php
       Add to /etc/hosts:   127.0.0.1 {{ wordpress_domain }}
      ══════════════════════════════════════════════════════
