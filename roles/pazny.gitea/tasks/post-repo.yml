---
# ==============================================================================
# pazny.gitea/tasks/post-repo.yml — nOS repo + GitHub pull-mirror
#
# Idempotently creates the `thisisait/nOS` repo in the local Gitea instance
# and configures it as a pull-mirror from the GitHub origin. After the
# mirror lands, every push to GitHub auto-syncs into Gitea, which in turn
# fires the Woodpecker pipeline (post-repo.yml in pazny.woodpecker).
#
# AUTH: Gitea Admin Basic auth over the LOCAL port (127.0.0.1:gitea_port) —
# NOT gitea_api_token and NOT the public domain. Rationale (A19, 2026-05-24):
# a pre-provisioned gitea_api_token is wiped by `blank=true` (fresh Gitea DB
# has no such token) → 401 on the first post-blank run; and the public domain
# routes through Cloudflare/Traefik (extra failure surface, CF NEL noise). The
# admin user+password always exist after the gitea role's post-start, so this
# is single-run robust with no operator prerequisite. Mirrors post-oauth.yml.
#
# Optional vars (defaults in pazny.gitea/defaults/main.yml):
#   * gitea_nos_repo_owner  — default: same as gitea_admin_user
#   * gitea_nos_repo_name   — default: 'nOS'
#   * gitea_nos_repo_clone_url — default: GitHub origin
#   * gitea_nos_repo_private  — default: true
#
# Called from tasks/main.yml only when both install_gitea=true AND
# install_gitea_autowire_nos=true (gated so operators who don't want the
# mirror don't get one).
# ==============================================================================

- name: "[pazny.gitea Post Repo] Check if nOS repo already exists"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ gitea_port | default(3003) }}/api/v1/repos/{{ gitea_nos_repo_owner }}/{{ gitea_nos_repo_name }}"
    method: GET
    headers:
      Authorization: "Basic {{ (gitea_admin_user ~ ':' ~ gitea_admin_password) | b64encode }}"
    status_code: [200, 404]
  register: _gitea_repo_check
  changed_when: false
  no_log: true

- name: "[pazny.gitea Post Repo] Create + pull-mirror repo (first run only)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ gitea_port | default(3003) }}/api/v1/repos/migrate"
    method: POST
    headers:
      Authorization: "Basic {{ (gitea_admin_user ~ ':' ~ gitea_admin_password) | b64encode }}"
      Content-Type: "application/json"
    body_format: json
    body:
      clone_addr: "{{ gitea_nos_repo_clone_url }}"
      repo_name: "{{ gitea_nos_repo_name }}"
      repo_owner: "{{ gitea_nos_repo_owner }}"
      mirror: true
      mirror_interval: "{{ gitea_nos_repo_mirror_interval | default('10m0s') }}"
      private: "{{ gitea_nos_repo_private | default(true) | bool }}"
      description: "nOS playbook — auto-mirror from GitHub (A16, 2026-05-17)"
      service: "git"
    status_code: 201
  when: _gitea_repo_check.status == 404
  register: _gitea_repo_create
  no_log: true

- name: "[pazny.gitea Post Repo] Force initial mirror sync (first run only)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ gitea_port | default(3003) }}/api/v1/repos/{{ gitea_nos_repo_owner }}/{{ gitea_nos_repo_name }}/mirror-sync"
    method: POST
    headers:
      Authorization: "Basic {{ (gitea_admin_user ~ ':' ~ gitea_admin_password) | b64encode }}"
    status_code: [200, 202]
  when: _gitea_repo_create.changed | default(false)
  changed_when: true
  no_log: true

# A17 (2026-05-20): reconverge mirror_interval on EXISTING repos so a
# default-value bump in pazny.gitea defaults (10m → 1m) takes effect
# without operator manually editing the repo in Gitea UI. PATCH endpoint
# is idempotent — setting the same value twice is a no-op.
- name: "[pazny.gitea Post Repo] Reconverge mirror_interval (UPDATE leg)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ gitea_port | default(3003) }}/api/v1/repos/{{ gitea_nos_repo_owner }}/{{ gitea_nos_repo_name }}"
    method: PATCH
    headers:
      Authorization: "Basic {{ (gitea_admin_user ~ ':' ~ gitea_admin_password) | b64encode }}"
      Content-Type: "application/json"
    body_format: json
    body:
      mirror_interval: "{{ gitea_nos_repo_mirror_interval }}"
    status_code: 200
  when: _gitea_repo_check.status == 200
  changed_when: false  # idempotent; we can't cheaply detect actual drift
  no_log: true
