---
# ==============================================================================
# pazny.gitea/tasks/post.yml — admin user + password reconverge
#
# Gitea does not support an env var for the admin password -> must go via CLI:
#   • `gitea admin user create` for the first initialization
#   • `gitea admin user change-password` for state-declarative UPDATE
#     (safe idempotent call, overwrites password on every run)
#
# Called from tasks/stacks/stack-up.yml AFTER `docker compose up devops --wait`.
# ==============================================================================

- name: "[pazny.gitea Post] Check if Gitea container is running"
  # Label filter, NOT `compose -f <base> ps -q gitea`: the base devops
  # compose is `services: {}` (real services live in role overrides), so the
  # old `-f docker-compose.yml ps -q gitea` returned "no such service" → empty
  # → every admin task below silently skipped → NO admin on a blank → post-repo
  # 401. The label filter resolves the running container with no compose-file
  # dependency (A19, 2026-05-24).
  ansible.builtin.shell: >
    {{ docker_bin }} ps -q
    --filter "label=com.docker.compose.project=devops"
    --filter "label=com.docker.compose.service=gitea"
  register: _gitea_container
  changed_when: false
  failed_when: false
  check_mode: false

- name: "[pazny.gitea Post] Check if admin user exists"
  ansible.builtin.shell: |
    set -o pipefail
    {{ docker_bin }} compose -p devops \
      exec -T -u git gitea gitea admin user list --admin 2>/dev/null \
      | grep -q "{{ gitea_admin_user | default(ansible_facts['user_id']) }}"
  args:
    executable: /bin/bash
  register: _gitea_admin_exists
  changed_when: false
  failed_when: false
  check_mode: false
  when: _gitea_container.stdout | default('') | length > 0

# Sanity: surface the admin-list output so a future regression doesn't get
# silently swallowed by failed_when:false (the 2026-05-17 -u git bug took
# 2 days to surface because the role couldn't fail-loud).
- name: "[pazny.gitea Post] Diagnose admin-list call (warn-on-fail)"
  ansible.builtin.fail:
    msg: |
      gitea admin user list failed inside the container — likely a
      Gitea CLI permission issue. Without this check, the admin user
      provisioning is a no-op and login fails forever. Output:
      {{ _gitea_admin_exists.stderr | default('(no stderr)') }}
  when:
    - _gitea_container.stdout | default('') | length > 0
    - _gitea_admin_exists.rc | default(0) not in [0, 1]   # 0 = found, 1 = grep miss; anything else is real failure

- name: "[pazny.gitea Post] Create admin user (first-run only)"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p devops
    exec -T -u git gitea gitea admin user create
    --username "{{ gitea_admin_user | default(ansible_facts['user_id']) }}"
    --password "{{ gitea_admin_password }}"
    --email "{{ gitea_admin_email | default(gitea_admin_user | default(ansible_facts['user_id']) + '@localhost') }}"
    --admin
    --must-change-password=false
  when:
    - _gitea_container.stdout | default('') | length > 0
    - _gitea_admin_exists.rc | default(0) != 0
  changed_when: true
  failed_when: false
  check_mode: false
  no_log: true

# ── Reconverge admin password every run (idempotent UPDATE) ─────────────
# `gitea admin user change-password` is safe to call on an existing user —
# overwritne password nepodminene. Toto je UPDATE leg state-declarative
# idempotence: blank+prefix rotation, non-blank edit credentials.yml,
# both paths pick up the new password on every run.
- name: "[pazny.gitea Post] Reconverge admin password (state-declarative UPDATE)"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p devops
    exec -T -u git gitea gitea admin user change-password
    --username "{{ gitea_admin_user | default(ansible_facts['user_id']) }}"
    --password "{{ gitea_admin_password }}"
    --must-change-password=false
  when:
    - _gitea_container.stdout | default('') | length > 0
    - _gitea_admin_exists.rc | default(0) == 0
  changed_when: true
  failed_when: false
  check_mode: false
  no_log: true
  notify: Restart gitea

# ── SSO-mandatory guard (2026-06-09; CLI-fixed 2026-06-13) ────────────────
# SSO is mandatory: when the local sign-in form is HIDDEN (sso_autologin), the
# "Sign in with Authentik" OAuth source MUST be registered — else login is
# SSO-only with no working button = LOCKOUT. The source is registered by
# tasks/stacks/authentik_service_post.yml (`gitea admin auth add-oauth`); a
# service-only `--tags gitea` run SKIPS it. This guard fails LOUD on that
# desync. NOTE: the old guard queried `/api/v1/admin/identity-providers` — an
# endpoint Gitea has at NO version — so it 404'd and could never SEE the
# source; AND its fail had no source-absence condition (it would have fired
# unconditionally if autologin were on). Both fixed: detect via the CLI, and
# only fail when the source is genuinely absent.
- name: "[pazny.gitea Post] SSO guard — list Authentik OAuth source"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p devops exec -T -u git gitea gitea admin auth list
  register: _gitea_idp_guard
  changed_when: false
  failed_when: false
  when:
    - _gitea_container.stdout | default('') | length > 0
    - install_authentik | default(false) | bool
    - (sso_autologin_gitea | default(sso_autologin_min_tier_2 | default(sso_autologin | default(false)))) | bool

- name: "[pazny.gitea Post] SSO guard — refuse a hidden form with no Authentik source"
  ansible.builtin.fail:
    msg: |
      Gitea's local sign-in form is HIDDEN (sso_autologin) but no 'authentik'
      OAuth source is registered → SSO-only login with no working button =
      LOCKOUT. The source is registered by tasks/stacks/authentik_service_post.yml
      via `gitea admin auth add-oauth`; a service-only `--tags gitea` run SKIPS
      it. Run the full SSO wiring:
          ansible-playbook main.yml --tags authentik,anatomy,gitea
      (or a full run), then the 'Sign in with Authentik' button appears.
  when:
    - _gitea_container.stdout | default('') | length > 0
    - install_authentik | default(false) | bool
    - (sso_autologin_gitea | default(sso_autologin_min_tier_2 | default(sso_autologin | default(false)))) | bool
    - "'authentik' not in (_gitea_idp_guard.stdout | default(''))"
    - _gitea_idp_guard.status | default(0) == 200
    - (_gitea_idp_guard.json | default([]) | selectattr('name', 'equalto', 'authentik') | list | length) == 0

# ── A16 (2026-05-17): autowire nOS repo + GitHub pull-mirror ──────────────
- name: "[pazny.gitea Post] Wire nOS repo + GitHub pull-mirror"
  ansible.builtin.include_tasks: post-repo.yml
  when: install_gitea_autowire_nos | default(false) | bool

# ── T32 (2026-06-08): local-first agent forge (writable repo + repo-scoped token).
# Mutually exclusive with the A16 pull-mirror above (post-forge.yml fails loud if
# both are on). Opt-in; default OFF.
- name: "[pazny.gitea Post] Wire local-first agent forge"
  ansible.builtin.include_tasks: post-forge.yml
  when: gitea_agent_forge | default(false) | bool
