---
# ==============================================================================
# pazny.gitea — Gitea in Docker (devops compose stack)
#
# Credentials (gitea_admin_password, gitea_secret_key) staysji v top-level
# default.credentials.yml — still centralized, the role only reads them via
# Ansible var precedence (vars_files > role defaults).
# ==============================================================================

gitea_version: "1.25.5"                 # CVE-2026-gitea-template-traversal pin
gitea_domain: "git{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
gitea_port: 3003                        # 3000=Grafana, 3001=Uptime Kuma, 3002=reserved
gitea_ssh_port: 2222
gitea_data_dir: "{{ ansible_facts['env']['HOME'] }}/gitea"
gitea_admin_user: "{{ ansible_facts['user_id'] }}"
gitea_admin_email: ""
gitea_disable_registration: false       # true = only admins can add users
gitea_mem_limit: "{{ docker_mem_limit_standard | default('1g') }}"
gitea_cpus: "{{ docker_cpus_standard | default('1.0') }}"

# ── A16 (2026-05-17): nOS repo + GitHub pull-mirror autowiring ─────────
# When install_gitea_autowire_nos=true (set in config.yml), Gitea
# auto-creates the nOS repo as a pull-mirror from GitHub. The mirror
# polls GitHub every gitea_nos_repo_mirror_interval and pushes the
# new HEAD into Gitea, which fires the Woodpecker pipeline.
install_gitea_autowire_nos: false
gitea_nos_repo_owner: "{{ gitea_admin_user | default(ansible_facts['user_id']) }}"
gitea_nos_repo_name: "nOS"
gitea_nos_repo_clone_url: "https://github.com/thisisait/nOS.git"
# Mirror interval — fallback poll when tools/nos-push isn't used. Gitea
# enforces a server-side MIN_INTERVAL of 10 minutes (configurable globally
# in app.ini under [mirror].MIN_INTERVAL but defaulting to 10m). The
# PATCH API returns HTTP 422 for any per-repo override below the floor —
# operator's blank run on 2026-05-21 hit "invalid mirror interval: 1m0s
# is below minimum interval: 10m0s" with our previous 1m0s default. So
# 10m0s is the lowest the per-repo override can go.
#
# In practice this is a non-issue: `tools/nos-push` calls /mirror-sync
# via the API for sub-10s end-to-end push → Woodpecker cycle. 10m0s is
# the safety net for the case where someone runs raw `git push` and
# forgets the wrapper. Operator can lower app.ini MIN_INTERVAL globally
# if they need tighter fallback.
gitea_nos_repo_mirror_interval: "10m0s"
gitea_nos_repo_private: true
