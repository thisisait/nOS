---
# TRANSITIONAL (Phase 2 C5 shipped 2026-05-12): the plugin loader post_compose
# runner is LIVE, so files/anatomy/plugins/freescout-base authoritatively replays the
# post-start wiring. This role file is NOT retired — still invoked every run, and
# runs idempotently ALONGSIDE the hook during the dual-safe transition.
#
# ==============================================================================
# pazny.freescout/tasks/post.yml
#
# FreeScout post-start — two jobs:
#   1. Admin user onboarding via Laravel Artisan (no REST API exists)
#   2. Install + enable the `freescout-oauth` community module for native OIDC
#      with Authentik, then persist OIDC settings into the module's DB rows so
#      the end-user does NOT have to fill in the Admin UI form.
#
# Called from tasks/stacks/stack-up.yml only AFTER `docker compose up b2b --wait`.
# ==============================================================================

- name: "[pazny.freescout Post] Wait for service"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ freescout_port }}/"
    method: GET
    headers:
      Host: "{{ freescout_domain }}"   # FreeScout enforces trusted-host -> bare 127.0.0.1 returns 403
    timeout: 5
    status_code: [200, 302, 500]
  register: _fs_ready
  until: _fs_ready.status | default(0) in [200, 302, 500]
  retries: 12
  delay: 10
  failed_when: false

- name: "[pazny.freescout Post] Check if admin user exists"
  # pipefail twice, on purpose: the INNER one is the real fix — the pipe lives in
  # the container, so only a container-side shell can protect it (verified: the
  # image has bash, and rc is unchanged on the happy path). The OUTER one makes
  # the same property true of the shell ansible-lint actually inspects.
  ansible.builtin.shell: |
    set -o pipefail
    {{ docker_bin }} compose -p b2b exec -T freescout \
      bash -c 'set -o pipefail; cd /www/html && echo "echo \"NOSCOUNT:\".App\\User::where(\"email\",\"{{ freescout_admin_email }}\")->count();" | php artisan tinker 2>/dev/null'
  args:
    executable: /bin/bash
  register: _fs_user_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: _fs_ready.status | default(0) in [200, 302, 500]
  # The `|| echo "0"` that used to close this line collapsed the probe's OWN
  # failure into the answer "no admin exists" — two states that mean opposite
  # things (create one / we do not know). rc is now the discriminator, and the
  # create below requires rc == 0.

- name: "[pazny.freescout Post] Create admin user via Artisan (first-run only)"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p b2b
    exec -T -w /www/html freescout
    php artisan freescout:create-user
    --role=admin
    --firstName="{{ freescout_admin_first_name }}"
    --lastName="{{ freescout_admin_last_name }}"
    --email="{{ freescout_admin_email }}"
    --password="{{ freescout_admin_password }}"
    2>&1
  register: _fs_user_create
  when:
    - _fs_ready.status | default(0) in [200, 302, 500]
    # rc == 0 means the probe ANSWERED; only then does '0' mean "no admin".
    - _fs_user_check.rc | default(1) == 0
    - "'NOSCOUNT:0' in (_fs_user_check.stdout | default(''))"
  changed_when: _fs_user_create.rc | default(1) == 0
  failed_when: false
  check_mode: false
  no_log: true

# ── Reconverge admin password every run (state-declarative UPDATE) ──────
# FreeScout has no dedicated change-password artisan command, we use tinker
# with App\User::where->update to work for existing users.
- name: "[pazny.freescout Post] Reconverge admin password (tinker UPDATE)"
  ansible.builtin.shell: |
    set -o pipefail
    {{ docker_bin }} compose -p b2b exec -T freescout \
      bash -c 'set -o pipefail; cd /www/html && echo "\$u=App\\User::where(\"email\",\"{{ freescout_admin_email }}\")->first(); if(\$u){\$u->password=bcrypt(\"{{ freescout_admin_password }}\"); \$u->save(); echo \"UPDATED\";}" | php artisan tinker 2>/dev/null'
  args:
    executable: /bin/bash
  when:
    - _fs_ready.status | default(0) in [200, 302, 500]
    # Same rc discriminator as the create: with the `|| echo "0"` sentinel gone,
    # a failed probe yields an EMPTY stdout, which is != '0' and would otherwise
    # send this branch at a FreeScout we could not read.
    - _fs_user_check.rc | default(1) == 0
    - "'NOSCOUNT:' in (_fs_user_check.stdout | default(''))"
    - "'NOSCOUNT:0' not in (_fs_user_check.stdout | default(''))"
  register: _fs_pw_update
  changed_when: "'UPDATED' in (_fs_pw_update.stdout | default(''))"
  failed_when: false
  check_mode: false
  no_log: true

# ── The reader: does the owner actually exist now? ────────────────────────
# Every task above swallows its failure by design (one broken step must not
# abort the rest), which is exactly why NOTHING above can tell a seeded admin
# from a green converge over an ownerless helpdesk. This is the one place that
# observes the EFFECT rather than trusting an attempt, and it is loud — an
# unowned FreeScout is a service anyone reaching it can claim.
- name: "[pazny.freescout Post] VERIFY the admin account exists"
  ansible.builtin.shell: |
    set -o pipefail
    {{ docker_bin }} compose -p b2b exec -T freescout \
      bash -c 'set -o pipefail; cd /www/html && echo "echo \"NOSCOUNT:\".App\\User::where(\"email\",\"{{ freescout_admin_email }}\")->count();" | php artisan tinker 2>/dev/null'
  args:
    executable: /bin/bash
  register: _fs_owner_verify
  changed_when: false
  failed_when: false
  check_mode: false
  when: _fs_ready.status | default(0) in [200, 302, 500]

- name: "[pazny.freescout Post] Refuse an ownerless FreeScout"
  ansible.builtin.fail:
    msg: |
      FreeScout answered on its port but has NO account for
      {{ freescout_admin_email }} — or the PROBE ITSELF FAILED, which this message
      cannot tell apart. rc={{ _fs_owner_verify.rc | default('n/a') }}, marker="{{
      (_fs_owner_verify.stdout | default('')).split('NOSCOUNT:')[1][:4] if 'NOSCOUNT:' in (_fs_owner_verify.stdout | default('')) else 'ABSENT — the probe did not run' }}".
      The create and password steps above swallow their own failures on purpose,
      so this is the only signal that the seed did not take. Diagnose with:
        docker compose -p b2b exec -T freescout php artisan tinker
  when:
    - _fs_ready.status | default(0) in [200, 302, 500]
    # Read the MARKER, never bare stdout: tinker prints a Psy Shell banner and a
    # trailing prompt line, so `stdout == '0'` could never have matched anything.
    # A missing marker means the PROBE failed, which is not the same as "no
    # admin" — and conflating those is what fired this gate against a FreeScout
    # that had its admin all along (2026-08-01).
    - (_fs_owner_verify.rc | default(1) != 0)
      or ('NOSCOUNT:' not in (_fs_owner_verify.stdout | default('')))
      or ('NOSCOUNT:0' in (_fs_owner_verify.stdout | default('')))

# ──────────────────────────────────────────────────────────────────────────
# Native OIDC wiring via the `freescout-oauth` community module
#
# STATUS 2026-08-02: THIS PATH HAS NEVER SUCCEEDED, and until today it said the
# opposite on every converge. Measured on the live estate:
#
#   * both source repos are HTTP 404 — `freescout-help-desk/oauth` and the
#     `tiredofit/freescout-module-oauth` fallback. git therefore falls through
#     to an interactive credential prompt and dies with
#     "could not read Username for 'https://github.com'".
#   * git prints "Cloning into '...'" BEFORE it fails, and the clone task's
#     `changed_when` matched exactly that string — so a failed clone reported
#     `changed: [127.0.0.1]`, every run, for as long as this has existed. Same
#     defect family as the rest of this release: the record of success was
#     written by the code that was attempting, from a string that means
#     "starting", not "done".
#   * consequence: /data/Modules is empty, the FREESCOUT_OIDC_* env block the
#     plugin renders is inert (the MODULE is what consumes it), and
#     https://<freescout>/login offers only the local form — no "Sign in with
#     Authentik" button. FreeScout's `native_oidc` classification is therefore
#     ASPIRATIONAL, not live. Tracked as known-open in RELEASE.md.
#
# The tasks below are kept and made honest rather than deleted: the wiring is
# correct and would work the moment a reachable module source exists. What is
# NOT done here is inventing a replacement URL — the module appears to have
# moved behind FreeScout's paid module marketplace, and guessing at a source is
# how you ship a second silent failure on top of the first.
#
# `/www/html/Modules` is a symlink to `/data/Modules` (the persistent bind
# mount), so the clone target below is correct; only the source is missing.
# ──────────────────────────────────────────────────────────────────────────

- name: "[pazny.freescout Post][OIDC] Check if OAuth module directory exists"
  ansible.builtin.stat:
    path: "{{ freescout_data_dir }}/Modules/OAuth/module.json"
  register: _fs_oauth_stat
  when: install_authentik | default(false)

- name: "[pazny.freescout Post][OIDC] Clone freescout-oauth module (first-run only)"
  ansible.builtin.shell: |
    {{ docker_bin }} compose -p b2b exec -T freescout bash -c '
      cd /data/Modules || exit 1
      if [ ! -d OAuth ]; then
        # GIT_TERMINAL_PROMPT=0: without it a 404 repo blocks on an interactive
        # username prompt instead of failing, which is how this hung the
        # difference between "no module" and "no answer".
        GIT_TERMINAL_PROMPT=0 git clone --depth 1 https://github.com/freescout-help-desk/oauth.git OAuth 2>&1 || \
        GIT_TERMINAL_PROMPT=0 git clone --depth 1 https://github.com/tiredofit/freescout-module-oauth.git OAuth 2>&1 || true
      fi
      chown -R www-data:www-data OAuth 2>/dev/null || true
      # The marker is the EFFECT: a module.json on disk, not a clone that started.
      [ -f OAuth/module.json ] && echo NOS_OAUTH_PRESENT || echo NOS_OAUTH_ABSENT
    '
  register: _fs_oauth_clone
  # Observe the EFFECT, not a progress string. "Cloning into '...'" is what git
  # prints on the way IN; it survives an authentication failure and is exactly
  # what made this report `changed` on every failed run.
  changed_when: "'NOS_OAUTH_PRESENT' in (_fs_oauth_clone.stdout | default(''))"
  failed_when: false
  check_mode: false
  when:
    - install_authentik | default(false)
    - _fs_ready.status | default(0) in [200, 302, 500]
    - not (_fs_oauth_stat.stat.exists | default(false))

# The one place that reads the result. Deliberately NOT a hard fail: FreeScout
# is fully usable without the module (local admin login works, and the operator
# may not want the helpdesk gated at all), so an absent module is a documented
# degradation rather than a broken converge. It must not, however, be SILENT —
# that is the whole point of this release.
- name: "[pazny.freescout Post][OIDC] Report that SSO will not render without the module"
  ansible.builtin.debug:
    msg: |
      FreeScout OAuth module is ABSENT — /login will show the local form only,
      with no "Sign in with Authentik" button, and the FREESCOUT_OIDC_* env
      block is inert because the module is what consumes it.
      Both upstream sources are HTTP 404 (freescout-help-desk/oauth,
      tiredofit/freescout-module-oauth); the module appears to have moved to
      FreeScout's paid marketplace. Supply a reachable source, or accept that
      FreeScout is local-auth-only on this estate.
  when:
    - install_authentik | default(false)
    - _fs_ready.status | default(0) in [200, 302, 500]
    - not (_fs_oauth_stat.stat.exists | default(false))
    - "'NOS_OAUTH_PRESENT' not in (_fs_oauth_clone.stdout | default(''))"

- name: "[pazny.freescout Post][OIDC] Enable OAuth module + clear cache"
  # `cd /www/html` for the same reason the admin probes needed it: the image's
  # default working directory is `/`, where `php artisan` is "Could not open
  # input file: artisan" — swallowed here by `|| true` since 2026-05.
  ansible.builtin.shell: |
    {{ docker_bin }} compose -p b2b exec -T freescout bash -c '
      cd /www/html || exit 1
      php artisan module:enable OAuth 2>&1 || true
      php artisan freescout:clear-cache 2>&1 || php artisan cache:clear 2>&1 || true
    '
  register: _fs_oauth_enable
  changed_when: "'Module enabled' in (_fs_oauth_enable.stdout | default('')) or 'has been enabled' in (_fs_oauth_enable.stdout | default(''))"
  failed_when: false
  check_mode: false
  when:
    - install_authentik | default(false)
    - _fs_ready.status | default(0) in [200, 302, 500]
    # Only meaningful once the module is actually on disk. Running it against a
    # missing module produced a guaranteed-useless call every converge.
    - _fs_oauth_stat.stat.exists | default(false) or 'NOS_OAUTH_PRESENT' in (_fs_oauth_clone.stdout | default(''))

# Persist OIDC settings into the options table. The freescout-oauth module
# reads keys prefixed `oauth.*`; we upsert via tinker for idempotency so the
# values always match the freescout-base plugin's authentik: block + the
# credentials.yml state.
# `tinker --execute=` DOES NOT EXIST on this image's tinker — the flag was
# silently unknown, so this task has never written a single option. Same
# discovery as the admin probes (2026-08-01), missed here because the whole
# block is `failed_when: false`.
#
# Fed over STDIN via the module's own `stdin:` arg rather than a shell pipe:
# the PHP is full of single quotes, which cannot survive a `bash -c '…'`
# wrapper, and this form also removes the pipe entirely (nothing to pipefail).
# `-w /www/html` supplies the working directory artisan needs.
- name: "[pazny.freescout Post][OIDC] Persist OIDC config (tinker UPSERT)"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p b2b exec -T -w /www/html freescout
    php artisan tinker
  args:
    stdin: |
      $cfg=[
        'oauth.provider'=>'oidc',
        'oauth.enabled'=>'1',
        'oauth.client_id'=>'{{ authentik_oidc_freescout_client_id }}',
        'oauth.client_secret'=>'{{ authentik_oidc_freescout_client_secret }}',
        'oauth.authorize_url'=>'https://{{ authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/application/o/authorize/',
        'oauth.token_url'=>'https://{{ authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/application/o/token/',
        'oauth.userinfo_url'=>'https://{{ authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/application/o/userinfo/',
        'oauth.logout_url'=>'https://{{ authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/application/o/freescout/end-session/',
        'oauth.discovery_url'=>'https://{{ authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/application/o/freescout/.well-known/openid-configuration',
        'oauth.redirect_uri'=>'https://{{ freescout_domain }}/oauth/callback',
        'oauth.scopes'=>'openid profile email',
        'oauth.display_name'=>'Authentik',
        'oauth.auto_create_user'=>'1',
        'oauth.email_claim'=>'email',
        'oauth.name_claim'=>'name',
      ];
      foreach($cfg as $k=>$v){ \Option::set($k,$v); }
      echo 'OIDC_PERSISTED';
  register: _fs_oidc_persist
  changed_when: "'OIDC_PERSISTED' in (_fs_oidc_persist.stdout | default(''))"
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - install_authentik | default(false)
    - _fs_ready.status | default(0) in [200, 302, 500]
