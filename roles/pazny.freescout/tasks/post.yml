---
# TRANSITIONAL (Phase 2 C5 shipped 2026-05-12): the plugin loader post_compose
# runner is LIVE, so files/anatomy/plugins/freescout-base authoritatively replays the
# post-start wiring. This role file is NOT retired — still invoked every run, and
# runs idempotently ALONGSIDE the hook during the dual-safe transition.
#
# ==============================================================================
# pazny.freescout/tasks/post.yml
#
# FreeScout post-start — two jobs:
#   1. Admin user onboarding via Laravel Artisan (no REST API exists)
#   2. Install + enable the `freescout-oauth` community module for native OIDC
#      with Authentik, then persist OIDC settings into the module's DB rows so
#      the end-user does NOT have to fill in the Admin UI form.
#
# Called from tasks/stacks/stack-up.yml only AFTER `docker compose up b2b --wait`.
# ==============================================================================

- name: "[pazny.freescout Post] Wait for service"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ freescout_port }}/"
    method: GET
    headers:
      Host: "{{ freescout_domain }}"   # FreeScout enforces trusted-host -> bare 127.0.0.1 returns 403
    timeout: 5
    status_code: [200, 302, 500]
  register: _fs_ready
  until: _fs_ready.status | default(0) in [200, 302, 500]
  retries: 12
  delay: 10
  failed_when: false

- name: "[pazny.freescout Post] Check if admin user exists"
  # pipefail twice, on purpose: the INNER one is the real fix — the pipe lives in
  # the container, so only a container-side shell can protect it (verified: the
  # image has bash, and rc is unchanged on the happy path). The OUTER one makes
  # the same property true of the shell ansible-lint actually inspects.
  ansible.builtin.shell: |
    set -o pipefail
    {{ docker_bin }} compose -p b2b exec -T freescout \
      bash -c 'set -o pipefail; cd /www/html && echo "echo \"NOSCOUNT:\".App\\User::where(\"email\",\"{{ freescout_admin_email }}\")->count();" | php artisan tinker 2>/dev/null'
  args:
    executable: /bin/bash
  register: _fs_user_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: _fs_ready.status | default(0) in [200, 302, 500]
  # The `|| echo "0"` that used to close this line collapsed the probe's OWN
  # failure into the answer "no admin exists" — two states that mean opposite
  # things (create one / we do not know). rc is now the discriminator, and the
  # create below requires rc == 0.

- name: "[pazny.freescout Post] Create admin user via Artisan (first-run only)"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p b2b
    exec -T -w /www/html freescout
    php artisan freescout:create-user
    --role=admin
    --firstName="{{ freescout_admin_first_name }}"
    --lastName="{{ freescout_admin_last_name }}"
    --email="{{ freescout_admin_email }}"
    --password="{{ freescout_admin_password }}"
    2>&1
  register: _fs_user_create
  when:
    - _fs_ready.status | default(0) in [200, 302, 500]
    # rc == 0 means the probe ANSWERED; only then does '0' mean "no admin".
    - _fs_user_check.rc | default(1) == 0
    - "'NOSCOUNT:0' in (_fs_user_check.stdout | default(''))"
  changed_when: _fs_user_create.rc | default(1) == 0
  failed_when: false
  check_mode: false
  no_log: true

# ── Reconverge admin password every run (state-declarative UPDATE) ──────
# FreeScout has no dedicated change-password artisan command, we use tinker
# with App\User::where->update to work for existing users.
- name: "[pazny.freescout Post] Reconverge admin password (tinker UPDATE)"
  ansible.builtin.shell: |
    set -o pipefail
    {{ docker_bin }} compose -p b2b exec -T freescout \
      bash -c 'set -o pipefail; cd /www/html && echo "\$u=App\\User::where(\"email\",\"{{ freescout_admin_email }}\")->first(); if(\$u){\$u->password=bcrypt(\"{{ freescout_admin_password }}\"); \$u->save(); echo \"UPDATED\";}" | php artisan tinker 2>/dev/null'
  args:
    executable: /bin/bash
  when:
    - _fs_ready.status | default(0) in [200, 302, 500]
    # Same rc discriminator as the create: with the `|| echo "0"` sentinel gone,
    # a failed probe yields an EMPTY stdout, which is != '0' and would otherwise
    # send this branch at a FreeScout we could not read.
    - _fs_user_check.rc | default(1) == 0
    - "'NOSCOUNT:' in (_fs_user_check.stdout | default(''))"
    - "'NOSCOUNT:0' not in (_fs_user_check.stdout | default(''))"
  register: _fs_pw_update
  changed_when: "'UPDATED' in (_fs_pw_update.stdout | default(''))"
  failed_when: false
  check_mode: false
  no_log: true

# ── The reader: does the owner actually exist now? ────────────────────────
# Every task above swallows its failure by design (one broken step must not
# abort the rest), which is exactly why NOTHING above can tell a seeded admin
# from a green converge over an ownerless helpdesk. This is the one place that
# observes the EFFECT rather than trusting an attempt, and it is loud — an
# unowned FreeScout is a service anyone reaching it can claim.
- name: "[pazny.freescout Post] VERIFY the admin account exists"
  ansible.builtin.shell: |
    set -o pipefail
    {{ docker_bin }} compose -p b2b exec -T freescout \
      bash -c 'set -o pipefail; cd /www/html && echo "echo \"NOSCOUNT:\".App\\User::where(\"email\",\"{{ freescout_admin_email }}\")->count();" | php artisan tinker 2>/dev/null'
  args:
    executable: /bin/bash
  register: _fs_owner_verify
  changed_when: false
  failed_when: false
  check_mode: false
  when: _fs_ready.status | default(0) in [200, 302, 500]

- name: "[pazny.freescout Post] Refuse an ownerless FreeScout"
  ansible.builtin.fail:
    msg: |
      FreeScout answered on its port but has NO account for
      {{ freescout_admin_email }} — or the PROBE ITSELF FAILED, which this message
      cannot tell apart. rc={{ _fs_owner_verify.rc | default('n/a') }}, marker="{{
      (_fs_owner_verify.stdout | default('')).split('NOSCOUNT:')[1][:4] if 'NOSCOUNT:' in (_fs_owner_verify.stdout | default('')) else 'ABSENT — the probe did not run' }}".
      The create and password steps above swallow their own failures on purpose,
      so this is the only signal that the seed did not take. Diagnose with:
        docker compose -p b2b exec -T freescout php artisan tinker
  when:
    - _fs_ready.status | default(0) in [200, 302, 500]
    # Read the MARKER, never bare stdout: tinker prints a Psy Shell banner and a
    # trailing prompt line, so `stdout == '0'` could never have matched anything.
    # A missing marker means the PROBE failed, which is not the same as "no
    # admin" — and conflating those is what fired this gate against a FreeScout
    # that had its admin all along (2026-08-01).
    - (_fs_owner_verify.rc | default(1) != 0)
      or ('NOSCOUNT:' not in (_fs_owner_verify.stdout | default('')))
      or ('NOSCOUNT:0' in (_fs_owner_verify.stdout | default('')))

