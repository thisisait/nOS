---
# ==============================================================================
# pazny.uptime_kuma — Uptime Kuma (self-hosted monitoring / status page)
#
# Credentials (uptime_kuma_admin_password) stay in default.credentials.yml
# and are prefix-rotated. Auto-monitors derive from install_* flags in
# default.config.yml — the monitor list lives in tasks/monitors.yml.
#
# SSO: Uptime Kuma has no native OIDC on the 2.2.x line either — measured
# 2026-08-04, no oidc/openid socket handler in the deployed /app/server. Access
# is gated via the Authentik forward_auth outpost, and Kuma's OWN internal login
# is DISABLED (uptime_kuma_disable_internal_auth) so the Authentik gate is the
# single sign-in. The long-standing "revisit when v2.x ships OIDC" note is
# retired: v2.x shipped, OIDC did not.
# ==============================================================================

# ── THE PIN LIVES IN default.config.yml ──────────────────────────────────────
# It read "1" here while the config read 2.2.1, and the config won every time.
# The shadow line was deleted 2026-08-05 with the other 37; the history it
# carried is worth keeping, because it is the reason the surviving rule exists.
#
# The comment that used to sit beside that dead line said: "migrating to v2.x is
# a separate operator call, not a mechanical pin. '1' stays in v1.x; never jumps
# to v2.x." The upgrade engine jumped it mechanically five weeks later and
# nothing compared the two statements — a prose prohibition beside an
# unreachable value. Kuma 2 then asked for a database type the role did not know
# to answer, so the container served its installer for ten days while reporting
# `healthy`.
#
# The rule that survives is narrower and enforceable: a MAJOR move must be
# accompanied by a re-reading of the post-start automation, because that
# automation is version-shaped. tests/anatomy/test_kuma_pin_matches_automation.py
# fails when the pinned major outruns it.
uptime_kuma_port: 3001
uptime_kuma_domain: "uptime{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
uptime_kuma_admin_user: "admin"
uptime_kuma_auto_monitors: true                     # Automatically create monitors for all install_* services
# Stop the converge when Kuma is reachable but holds no database (the 2.x
# setup-database state). Default true because the alternative — the debug line
# this replaced — is how ten days of blind monitoring stayed green. Set false
# only if you deliberately run an unconfigured Kuma.
uptime_kuma_fail_on_unconfigured: true
# Disable Kuma's internal login so the Authentik forward_auth gate is the SINGLE
# sign-in (Kuma v1 has no OIDC; its own login behind the gate = double login).
# Applied only when install_authentik is on — never leave Kuma open without the
# gate. Set false to keep Kuma's native login (e.g. no-Authentik deploys).
uptime_kuma_disable_internal_auth: true
uptime_kuma_api_timeout: 45                         # setup-monitors.py per-event wait (s); lib default 10s hangs under blank-run load
uptime_kuma_setup_retries: 2                        # re-attempt monitor setup (3 total) — Kuma API starves under peak blank load
uptime_kuma_setup_retry_delay: 45                   # seconds between monitor-setup attempts (lets load settle)
uptime_kuma_mem_limit: "{{ docker_mem_limit_light | default('512m') }}"
uptime_kuma_cpus: "{{ docker_cpus_light | default('0.5') }}"
