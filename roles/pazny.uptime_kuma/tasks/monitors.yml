---
# ==============================================================================
# pazny.uptime_kuma/tasks/monitors.yml
#
# Auto-configure Uptime Kuma after container startup:
#   1. install uptime-kuma-api + PyYAML
#   2. wait for the web UI
#   3. load state/manifest.yml → derive the canonical monitor set
#   4. add DB TCP probes (MariaDB / PostgreSQL / Redis), FreePBX TCP,
#      Nginx HTTPS loopback, and optional Docker healthcheck pass-through
#   5. reconverge the admin password (reset-password.py)
#   6. invoke setup-monitors.py with a spec JSON that covers
#        monitors + ntfy + Wing webhook + public status page
#   7. verify monitor count
# ==============================================================================

- name: "[pazny.uptime_kuma] Install the Socket.IO client + PyYAML"
  # ansible.builtin.pip imports `packaging` controller-side; that fails
  # on PEP-668 Homebrew Python 3.14. Shell out to pip directly with
  # --break-system-packages so --user installs land cleanly. The
  # downstream setup-monitors.py invocation runs under the same
  # interpreter so the packages resolve.
  #
  # WAS `uptime-kuma-api`, dropped 2026-08-04. That library supports Uptime
  # Kuma 1.21.3 – 1.23.2 and has shipped nothing since; REM-073 moved the pin
  # to 2.2.1 on 2026-07-24 and every call went out of range in one step.
  # files/kuma2.py speaks to the same Socket.IO handlers directly, so the
  # dependency is now the plain transport the library was built on.
  ansible.builtin.command:
    cmd: "{{ ansible_python_interpreter | default('python3') }} -m pip install --quiet --disable-pip-version-check --user --break-system-packages python-socketio websocket-client PyYAML"
  register: _kuma_pip
  failed_when: false
  changed_when: "'Successfully installed' in (_kuma_pip.stdout | default(''))"

- name: "[pazny.uptime_kuma] Wait for API to be ready"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ uptime_kuma_port | default(3001) }}/"
    method: GET
    timeout: 5
    status_code: [200, 301, 302]
    validate_certs: false
  register: _kuma_ready
  until: _kuma_ready.status | default(0) | int in [200, 301, 302]
  retries: 12
  delay: 10
  failed_when: false

# "Ready" above means the HTTP server answered. Kuma's SETUP WIZARD answers 200
# on every route, so a container that has never been configured passes that
# probe — and on 2026-08-03 one had, for nine days, `healthy` the whole time,
# while every converge burned the monitor-setup retry budget against a service
# with no database. `/api/entry-page` is the deterministic discriminator:
# {"type":"setup-database"} until the wizard is completed.
- name: "[pazny.uptime_kuma] Distinguish 'server answers' from 'app configured'"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ uptime_kuma_port | default(3001) }}/api/entry-page"
    method: GET
    timeout: 5
    return_content: true
  register: _kuma_entry
  failed_when: false
  changed_when: false
  when: _kuma_ready.status | default(0) | int in [200, 301, 302]

- name: "[pazny.uptime_kuma] Note the setup state"
  ansible.builtin.set_fact:
    # `default({}, true)` — the two-arg form. The one-arg form substitutes only
    # UNDEFINED, so a JSON `null` body would pass straight through and `.get`
    # would abort the play. That is the metabase defect this repo shipped a
    # gate for on 2026-08-02 (test_json_default_is_null_safe.py).
    _kuma_needs_setup: >-
      {{ ((_kuma_entry | default({}, true)).json | default({}, true)).get('type', '') == 'setup-database' }}

# FAILS, and the earlier version of this task is why it has to.
#
# Yesterday this was a `debug:` telling the operator to go and finish the
# wizard by hand. That was wrong twice over. It asked a human to do what the
# compose file can declare (UPTIME_KUMA_DB_TYPE, added 2026-08-04), and it left
# the converge GREEN — so the advice scrolled past in a 50-service run and the
# estate went on reporting success while monitoring nothing.
#
# The estate's own rule, from docs/hidden_fees and the 2026-08-01 audit: a step
# that cannot do its job must not exit 0. Kuma sitting in setup after the env
# var exists means the container was never recreated to pick it up, and that is
# a real, actionable, converge-stopping fact — not a note.
- name: "[pazny.uptime_kuma] FAIL — Kuma is serving its setup wizard, not the app"
  ansible.builtin.fail:
    msg: >-
      Uptime Kuma is running `setup-database.js`, not the application: it
      answers 200 on every route and reports `healthy` to Docker while holding
      no database. Nothing is being monitored.

      Expected cause: the container predates the `UPTIME_KUMA_DB_TYPE=sqlite`
      env var (roles/pazny.uptime_kuma/templates/compose.yml.j2) and was not
      recreated. Fix with `ansible-playbook main.yml --tags uptime_kuma`, which
      re-renders the override and recreates the container in one pass.

      If it persists AFTER a recreate, check `docker exec iiab-uptime-kuma-1
      env | grep UPTIME_KUMA_DB_TYPE` — an empty result means the override did
      not merge, not that Kuma refused it.
  when:
    - _kuma_needs_setup | bool
    - uptime_kuma_auto_monitors | default(true)
    - uptime_kuma_fail_on_unconfigured | default(true)

# Is Kuma's internal login already disabled (the Authentik forward_auth gate is
# the single SSO)? Read it early so the API-login-based password reconverge +
# monitor setup below SKIP when auth is off — their login() would just fail
# against a disableAuth=true Kuma and burn the retry budget for nothing.
# Deployed FIRST because the disableAuth read below needs it. This reader used
# to be an inline `sqlite3 /app/data/kuma.db "SELECT …"`, which CREATES the
# database file when it is missing — and did, leaving a 0-byte kuma.db that
# Kuma 2's setup-database.js then reads as an existing database.
- name: "[pazny.uptime_kuma] Deploy the setting reader"
  ansible.builtin.copy:
    src: read-setting.sh
    dest: "{{ uptime_kuma_data_dir }}/read-setting.sh"
    mode: '0755'

- name: "[pazny.uptime_kuma] Read current disableAuth setting"
  ansible.builtin.command:
    argv:
      - "{{ docker_bin | default('docker') }}"
      - exec
      - iiab-uptime-kuma-1
      - /app/data/read-setting.sh
      - /app/data/kuma.db
      - disableAuth
  register: _kuma_disableauth_cur
  changed_when: false
  failed_when: false

- name: "[pazny.uptime_kuma] Expose auth-disabled fact"
  ansible.builtin.set_fact:
    _kuma_auth_disabled: "{{ (_kuma_disableauth_cur.stdout | default('') | trim) == 'true' }}"

- name: "[pazny.uptime_kuma] Load state/manifest.yml"
  ansible.builtin.set_fact:
    _kuma_manifest: "{{ lookup('file', playbook_dir ~ '/state/manifest.yml') | from_yaml }}"

- name: "[pazny.uptime_kuma] Keep only manifest services with a domain_var that are currently enabled"
  ansible.builtin.set_fact:
    _kuma_domain_services: >-
      {{
        _kuma_manifest.services
        | selectattr('domain_var', 'defined')
        | selectattr('install_flag', 'defined')
        | list
      }}

- name: "[pazny.uptime_kuma] Seed monitor spec with an empty list"
  ansible.builtin.set_fact:
    _kuma_spec_monitors: []

# ── Services deliberately taken off the edge (2026-08-05) ───────────────────
#
# A monitor must ask a question whose answer we have not already decided.
#
# `traefik_skip_ids` lists services for which services.yml.j2 renders NO router,
# so `https://<domain>/` is a 404 by design. The monitor builder below derived
# its URL from `domain_var` alone and never consulted that list, so every
# service removed from the edge got a permanently-red monitor. Measured on the
# live estate the day this was written: traefik, bone and cortex — all three
# 404, all three healthy, all three unrouted on purpose. REM-144's remediation
# pattern is "take it off the edge", so the class grows every time we apply it.
#
# A monitor that is always red is a monitor an operator learns to ignore, which
# is worse than not having it: it trains the habit that will one day be applied
# to a real failure.
#
# Read from the file rather than relying on the traefik role's vars being in
# scope — same idiom as the manifest lookup below, and ordering-independent.
- name: "[pazny.uptime_kuma] Read the ids Traefik does not route"
  ansible.builtin.set_fact:
    _kuma_unrouted: >-
      {{ (lookup('file', playbook_dir ~ '/roles/pazny.traefik/vars/main.yml')
          | from_yaml).traefik_skip_ids | default([]) }}

# P1b (2026-05-29): probe the service's declared health endpoint instead of the
# bare root. The plugin-harvested hub-cards.json (wing-base) carries each
# service's ui-extension.hub_card.health_check; build a slug→path map so the
# monitor URL can target it. Slugs are hyphenated (open-webui); manifest ids
# are underscored (open_webui) — normalise on lookup.
- name: "[pazny.uptime_kuma] Read plugin hub-cards (health_check paths)"
  ansible.builtin.slurp:
    src: "{{ wing_home | default(ansible_facts['env']['HOME'] ~ '/wing') }}/app/data/hub-cards.json"
  register: _kuma_hubcards_raw
  failed_when: false

- name: "[pazny.uptime_kuma] Build slug → health_check map"
  ansible.builtin.set_fact:
    _kuma_health_paths: >-
      {{ dict(_cards | map(attribute='slug') | zip(_cards | map(attribute='health_check'))) }}
  vars:
    _cards: >-
      {{ ((_kuma_hubcards_raw.content | b64decode | from_json).cards | default([]))
         if (_kuma_hubcards_raw.content | default('', true) | length > 0) else [] }}

- name: "[pazny.uptime_kuma] Append one HTTP monitor per enabled domain-backed service"
  ansible.builtin.set_fact:
    _kuma_spec_monitors: "{{ _kuma_spec_monitors + [_m] }}"
  loop: "{{ _kuma_domain_services }}"
  loop_control:
    loop_var: svc
    label: "{{ svc.id }}"
  vars:
    _domain: "{{ vars[svc.domain_var] | default('') }}"
    # Health-endpoint path from the plugin hub_card (path-style only — full-URL
    # or absent health_checks keep the bare-root probe). Join by hyphenated slug.
    _hc: "{{ _kuma_health_paths[svc.id | replace('_', '-')] | default('') }}"
    _hc_path: "{{ _hc if _hc.startswith('/') else '' }}"
    # ── Unrouted services probe the loopback the manifest already declares ──
    # `health_check.url_template` is the AUTHORED answer to "how do you check
    # this service", and for the three unrouted ids it is a loopback endpoint.
    # Only the path is taken from it: the template embeds Jinja for a port var
    # that may be a ROLE default (cortex_port lives in the cortex role, not in
    # default.config.yml), and rendering another role's default from here is the
    # eager-resolution trap CLAUDE.md documents. `vars[...]` with a default is
    # the safe read, and an unresolvable port SKIPS the monitor rather than
    # emitting `http://127.0.0.1:/health`.
    _unrouted: "{{ svc.id in (_kuma_unrouted | default([])) }}"
    _tpl: "{{ (svc.health_check | default({})).url_template | default('') }}"
    _tpl_path: "{{ _tpl.split('}}')[-1] if _tpl else '' }}"
    _port: "{{ vars[svc.port_var] | default('') if svc.port_var is defined else '' }}"
    _m:
      name: "{{ svc.id | replace('_', ' ') | title }}"
      type: "http"
      url: >-
        {{ 'http://127.0.0.1:' ~ _port ~ _tpl_path
           if _unrouted else 'https://' ~ _domain ~ _hc_path }}
      interval: 60
      maxretries: 2
      ignore_tls: true
      # A loopback health endpoint that answers 401/403 has NOT answered. The
      # edge list keeps them because an auth-gated 401 there proves the router
      # and the gate are both alive, which is the thing being tested.
      accepted_statuscodes: >-
        {{ ['200-299'] if _unrouted
           else ['200-299', '301', '302', '401', '403'] }}
      expiry_notification: "{{ false if _unrouted else (uptime_kuma_tls_expiry_monitors | default(true)) }}"
      tags: ["{{ svc.stack | default('host') }}", "{{ svc.category | default('service') }}"]
  when:
    # Undeclared flag = error, not "service off": the `in vars` guard dropped
    # such a row silently, exit 0, no monitor.
    - vars[svc.install_flag] | bool
    - vars[svc.domain_var] | default('') | length > 0
    # An unrouted service needs BOTH a declared path and a resolvable port, or
    # there is no honest probe to build and no monitor is better than a wrong one.
    - (svc.id not in (_kuma_unrouted | default([]))) or
      ((svc.health_check | default({})).url_template is defined
       and (svc.port_var is defined)
       and (vars[svc.port_var] | default('') | string | length > 0))

# ── Tier-2 (apps_runner) — runtime-derived monitors ─────────────────────────
# `_kuma_manifest_apps` is set by roles/pazny.apps_runner/tasks/post.yml from
# nos_apps_render's per-app `kuma_monitor` block (one entry per parsed
# apps/<name>.yml). Each entry uses domain_var=__inline__ + _resolved_domain
# instead of looking up a vars[] key — Tier-2 hostnames are computed at render
# time and don't have a default.config.yml var to point at. Sentinel install
# flag __always__ means "monitor whenever the app rendered successfully".
- name: "[pazny.uptime_kuma] Append HTTP monitors for runtime-derived Tier-2 apps"
  ansible.builtin.set_fact:
    _kuma_spec_monitors: "{{ _kuma_spec_monitors + [_m] }}"
  loop: "{{ _kuma_manifest_apps | default([]) }}"
  loop_control:
    loop_var: svc
    label: "{{ svc.id }}"
  vars:
    _domain: >-
      {%- if svc.domain_var | default('') == '__inline__' -%}
      {{ svc._resolved_domain }}
      {%- else -%}
      {{ vars[svc.domain_var] | default('') }}
      {%- endif -%}
    _m:
      name: "{{ svc.id | replace('_', ' ') | title }}"
      type: "http"
      url: "https://{{ _domain }}"
      interval: 60
      maxretries: 2
      ignore_tls: true
      # 401 covers proxy-auth gate redirect-then-block before login
      accepted_statuscodes: ["200-299", "301", "302", "308", "401", "403"]
      expiry_notification: "{{ uptime_kuma_tls_expiry_monitors | default(true) }}"
      tags: ["{{ svc.stack | default('apps') }}", "{{ svc.category | default('app') }}", "tier2"]
  when:
    - _domain | trim | length > 0

# ── Database / infra TCP probes ─────────────────────────────────────────────
- name: "[pazny.uptime_kuma] Append MariaDB TCP monitor"
  ansible.builtin.set_fact:
    _kuma_spec_monitors: "{{ _kuma_spec_monitors + [{'name': 'MariaDB TCP', 'type': 'tcp', 'hostname': '127.0.0.1', 'port': mariadb_port | default(3306), 'interval': 60, 'maxretries': 2, 'tags': ['infra', 'db']}] }}"
  when: install_mariadb | default(false)

- name: "[pazny.uptime_kuma] Append PostgreSQL TCP monitor"
  ansible.builtin.set_fact:
    _kuma_spec_monitors: "{{ _kuma_spec_monitors + [{'name': 'PostgreSQL TCP', 'type': 'tcp', 'hostname': '127.0.0.1', 'port': postgresql_port | default(5432), 'interval': 60, 'maxretries': 2, 'tags': ['infra', 'db']}] }}"
  when: install_postgresql | default(false)

- name: "[pazny.uptime_kuma] Append Redis TCP monitor"
  ansible.builtin.set_fact:
    _kuma_spec_monitors: "{{ _kuma_spec_monitors + [{'name': 'Redis TCP', 'type': 'tcp', 'hostname': '127.0.0.1', 'port': redis_port | default(6379), 'interval': 60, 'maxretries': 2, 'tags': ['infra', 'db']}] }}"
  # `redis_docker` is the declared toggle; `install_redis` exists in no config
  # layer, so this monitor was never once appended.
  when: redis_docker | bool

- name: "[pazny.uptime_kuma] Append FreePBX TCP monitor"
  ansible.builtin.set_fact:
    _kuma_spec_monitors: "{{ _kuma_spec_monitors + [{'name': 'FreePBX Web', 'type': 'tcp', 'hostname': '127.0.0.1', 'port': freepbx_port | default(8088), 'interval': 60, 'maxretries': 2, 'tags': ['voip']}] }}"
  when: install_freepbx | default(false)

- name: "[pazny.uptime_kuma] Append Nginx HTTPS loopback monitor"
  ansible.builtin.set_fact:
    _kuma_spec_monitors: "{{ _kuma_spec_monitors + [{'name': 'Nginx HTTPS', 'type': 'http', 'url': 'https://127.0.0.1/', 'interval': 60, 'maxretries': 2, 'ignore_tls': true, 'accepted_statuscodes': ['200-299', '301', '302', '404'], 'tags': ['infra', 'proxy']}] }}"

# ── Optional: Docker container healthcheck pass-through ────────────────────
# Requires Uptime Kuma to reach the Docker socket. Disabled by default
# (uptime_kuma_docker_host_monitors: false in default.config.yml).
- name: "[pazny.uptime_kuma] Append Docker healthcheck monitors (opt-in)"
  ansible.builtin.set_fact:
    _kuma_spec_monitors: "{{ _kuma_spec_monitors + [{'name': 'Docker: ' ~ item, 'type': 'docker', 'docker_container': item, 'interval': 60, 'maxretries': 2, 'tags': ['docker']}] }}"
  loop:
    - infra-mariadb-1
    - infra-postgresql-1
    - infra-redis-1
    - infra-authentik-server-1
  when: uptime_kuma_docker_host_monitors | default(false)

- name: "[pazny.uptime_kuma] Assemble final spec document (monitors + notifications + status page)"
  ansible.builtin.set_fact:
    _kuma_spec:
      monitors: "{{ _kuma_spec_monitors }}"
      notifications:
        ntfy:
          enabled: "{{ install_ntfy | default(false) }}"
          name: "nOS → ntfy"
          server_url: "https://{{ ntfy_domain | default('ntfy' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}"
          topic: "{{ uptime_kuma_ntfy_topic | default('nos-alerts') }}"
          is_default: true
        webhook:
          enabled: true
          name: "nOS → Wing (Bone)"
          url: "{{ uptime_kuma_notify_webhook_url | default('http://127.0.0.1:' ~ (bone_port | default(8099)) ~ '/api/events') }}"
          hmac_secret: "{{ wing_api_token | default('') }}"
          is_default: true
          body:
            source: "uptime-kuma"
            event_type: "probe.failed"
            payload:
              msg: "{{ '{{msg}}' }}"
              monitor: "{{ '{{monitorJSON}}' }}"
              heartbeat: "{{ '{{heartbeatJSON}}' }}"
      status_page:
        enabled: true
        slug: "{{ uptime_kuma_status_page_slug | default('nos') }}"
        title: "{{ uptime_kuma_status_page_title | default('nOS Service Status') }}"
        description: "Live health of every self-hosted service on this nOS instance."

- name: "[pazny.uptime_kuma] Deploy helper scripts from role"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ uptime_kuma_data_dir }}/{{ item }}"
    mode: '0755'
  loop:
    - setup-monitors.py
    - reset-password.py
    # The transport setup-monitors.py imports. It must land in the SAME
    # directory: Python puts the script's own directory on sys.path[0], which
    # is the entire import mechanism here — there is no package install.
    - kuma2.py

- name: "[pazny.uptime_kuma] Write spec file (JSON) for setup-monitors.py"
  ansible.builtin.copy:
    dest: "{{ uptime_kuma_data_dir }}/monitors.spec.json"
    content: "{{ _kuma_spec | to_nice_json }}"
    mode: '0600'
  no_log: true

# ── Reconverge admin password BEFORE monitor setup ─────────────────────────
# Password reconverge runs first so login() in setup-monitors.py uses the
# current prefix. The helper tries current pw first (converged) → falls back
# to previous prefix + change_password → drift resolved.
- name: "[pazny.uptime_kuma] Reconverge admin password"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ uptime_kuma_data_dir }}/reset-password.py"
      - "http://127.0.0.1:{{ uptime_kuma_port | default(3001) }}"
      - "{{ uptime_kuma_admin_user | default('admin') }}"
      - "{{ uptime_kuma_admin_password }}"
      - "{{ previous_password_prefix | default(global_password_prefix) }}_pw_uptime_kuma"
  register: _kuma_pw_reset
  changed_when: "'UPDATED' in (_kuma_pw_reset.stdout | default(''))"
  failed_when: false
  no_log: true
  when:
    - not (_kuma_pip.failed | default(false))
    - _kuma_ready.status | default(0) | int in [200, 301, 302]
    - not (_kuma_needs_setup | default(false) | bool)
    - not (_kuma_auth_disabled | default(false))   # login() is moot once auth is off

- name: "[pazny.uptime_kuma] Auto-create monitors / notifications / status page"
  ansible.builtin.command:
    # MUST be the SAME interpreter the install task used (l.24), else
    # uptime-kuma-api (installed --user into that interpreter's site) is not
    # importable here → setup-monitors.py prints "SKIP: uptime-kuma-api not
    # installed" and creates ZERO monitors. Bare `python3` (PATH) diverged from
    # ansible_python_interpreter on macOS → the all-on blank made 0/48 monitors.
    argv:
      - "{{ ansible_python_interpreter | default('python3') }}"
      - "{{ uptime_kuma_data_dir }}/setup-monitors.py"
      - "--url"
      - "http://127.0.0.1:{{ uptime_kuma_port | default(3001) }}"
      - "--user"
      - "{{ uptime_kuma_admin_user | default('admin') }}"
      - "--password"
      - "{{ uptime_kuma_admin_password }}"
      - "--config"
      - "{{ uptime_kuma_data_dir }}/monitors.spec.json"
      - "--timeout"
      - "{{ uptime_kuma_api_timeout | default(45) }}"
      - "-v"
  register: _kuma_result
  # Retry on a non-zero exit (2 = connect/login timed out, 3 = aborted after
  # consecutive event-wait timeouts). Kuma's Socket.IO API is starved while the
  # blank's apps phase is at peak load; a later attempt catches the load
  # settling. failed_when:false keeps it non-fatal once retries are spent — the
  # host-idle `--tags uptime_kuma` re-run always succeeds.
  until: (_kuma_result.rc | default(1)) == 0
  retries: "{{ uptime_kuma_setup_retries | default(2) }}"
  delay: "{{ uptime_kuma_setup_retry_delay | default(45) }}"
  changed_when: "'[+] Created' in (_kuma_result.stdout | default(''))"
  failed_when: false
  no_log: true
  when:
    - not (_kuma_pip.failed | default(false))
    - _kuma_ready.status | default(0) | int in [200, 301, 302]
    - not (_kuma_needs_setup | default(false) | bool)
    - uptime_kuma_auto_monitors | default(true)
    - not (_kuma_auth_disabled | default(false))   # API login() fails once auth is off

- name: "[pazny.uptime_kuma] Monitor setup output"
  ansible.builtin.debug:
    msg: "{{ _kuma_result.stdout_lines | default(_kuma_result.stderr_lines | default(['Skipped'])) }}"

# ── Post-setup verification: count monitors via the REST API ───────────────
# Uses the /metrics endpoint (public, no auth) to get a rough monitor count;
# falls back to the stdout summary from setup-monitors.py for the exact number.
- name: "[pazny.uptime_kuma] Verify monitor count summary"
  ansible.builtin.debug:
    # Build the result line in a step-by-step Jinja that doesn't lean on
    # ``| default([...]) | first``. Jinja's default() does NOT fire on an
    # empty list — only on undefined / null / empty-string — so the pipeline
    # ``[] | default(['x']) | first`` raises "No first item, sequence was
    # empty". Hit on the second include of monitors.yml from
    # roles/pazny.apps_runner/tasks/post.yml when setup-monitors.py is
    # skipped (re-run on already-converged Kuma) and stdout_lines is
    # absent.
    msg: >-
      Requested {{ _kuma_spec.monitors | length }} monitors.
      Result:
      {%- set _done = (_kuma_result.stdout_lines | default([]) | select('match', '^Done:') | list) -%}
      {{ _done[0] if _done | length > 0 else '(skipped or no Done: line in setup-monitors output)' }}
  when: _kuma_result is defined

# ── The verification that is allowed to say no ─────────────────────────────
# Everything above this line is `failed_when: false`, which is right for the
# retry loop and wrong as a final answer: it is how a monitoring stack that
# monitored nothing stayed green for ten days.
#
# The claim under test is narrow and checkable — "the spec asked for N monitors
# and Kuma now tracks N". It reads the number setup-monitors.py printed AFTER
# talking to the server, not a flag set by the code that intended to do the
# work. That distinction is the estate's most expensive recurring lesson
# (docs/hidden_fees, the 2026-08-01 audit): a success marker must be written by
# a reader, never by the attempting code.
- name: "[pazny.uptime_kuma] Read back how many monitors Kuma actually tracks"
  ansible.builtin.set_fact:
    _kuma_tracked: >-
      {{ ((_kuma_result.stdout | default('')
           | regex_search('Monitors tracked: (\d+)', '\1') | default(['-1'], true)) | first) | int }}
  when:
    - _kuma_result is defined
    - not (_kuma_result.skipped | default(false))

- name: "[pazny.uptime_kuma] FAIL — the spec asked for monitors and none exist"
  ansible.builtin.fail:
    msg: >-
      setup-monitors.py finished but Kuma tracks {{ _kuma_tracked }} monitors
      while the spec declared {{ _kuma_spec.monitors | length }}. Nothing is
      being watched, so nothing can alert.

      Read the task output above for the per-monitor reason. A `SKIP:` line
      means the transport could not be imported (kuma2.py must land in the same
      directory as setup-monitors.py); an authentication failure means the
      admin password and Kuma's stored one have diverged.
  when:
    - _kuma_tracked is defined
    - _kuma_tracked | int <= 0
    - _kuma_spec.monitors | length > 0
    - uptime_kuma_auto_monitors | default(true)
    - uptime_kuma_fail_on_unconfigured | default(true)

- name: "[pazny.uptime_kuma] WARN: pip install failed"
  ansible.builtin.debug:
    msg: "uptime-kuma-api pip install failed: {{ _kuma_pip.msg | default('unknown') }}. Monitors were not created."
  when: _kuma_pip.failed | default(false)

# ── Single-SSO: disable Kuma's internal login (Authentik gate is the only one) ─
# Kuma v1 has NO OIDC; behind the Authentik forward_auth gate its own login is a
# pointless SECOND sign-in (the operator's "kuma still asks for a password after
# Authentik" wart). Disable it so the embedded outpost is the only sign-in — Kuma
# itself recommends this when reverse-proxy auth fronts it. GATED on
# install_authentik so Kuma is NEVER left open without the gate, plus an opt-out.
# Runs LAST so the API-login monitor setup above ran with auth still on (fresh
# blank); idempotent via the early _kuma_auth_disabled read — only writes +
# bounces Kuma when it is not already disabled, so steady-state is changed=0.
- name: "[pazny.uptime_kuma] Disable internal login — Authentik gate is the only SSO"
  ansible.builtin.shell: |
    set -e
    C=iiab-uptime-kuma-1
    DOCKER="{{ docker_bin | default('docker') }}"
    "$DOCKER" exec "$C" sqlite3 /app/data/kuma.db \
      "INSERT INTO setting (key,value,type) VALUES ('disableAuth','true','general') ON CONFLICT(key) DO UPDATE SET value='true';"
    "$DOCKER" restart "$C" >/dev/null
    echo "disabled"
  register: _kuma_disable
  changed_when: "'disabled' in (_kuma_disable.stdout | default(''))"
  failed_when: false
  when:
    - install_authentik | default(false)
    - uptime_kuma_disable_internal_auth | default(true)
    - not (_kuma_auth_disabled | default(false))
    - _kuma_ready.status | default(0) | int in [200, 301, 302]
    - not (_kuma_needs_setup | default(false) | bool)
