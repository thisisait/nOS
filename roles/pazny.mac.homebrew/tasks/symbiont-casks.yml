---
# Symbiont casks (software_owner): installed once when the .app is absent, then
# never upgraded or removed — the vendor's updater owns them. A Caskroom record
# without its .app (dragged to the Trash) is reinstalled, not read as present.
- name: "[Homebrew] Symbiont casks — install only what is absent"
  ansible.builtin.shell: |
    if [ -e "{{ item.app }}" ] && [ -d "{{ homebrew_prefix }}/Caskroom/{{ item.name }}" ]; then
      echo "PRESENT: {{ item.app }} (brew cask, its updater owns it)"
    elif [ -e "{{ item.app }}" ]; then
      echo "PRESENT: {{ item.app }} (not from brew; left alone)"
    elif [ -d "{{ homebrew_prefix }}/Caskroom/{{ item.name }}" ]; then
      brew reinstall --cask {{ item.name | quote }} 2>&1
    else
      brew install --cask {{ item.name | quote }} 2>&1
    fi
  args:
    executable: /bin/bash
  register: _symbiont_cask
  changed_when: "'PRESENT:' not in _symbiont_cask.stdout"
  loop: "{{ _symbiont_casks | default(homebrew_symbiont_casks | default([])) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.flag is not defined or (lookup('vars', item.flag, default=false) | bool)
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"

- name: "[Homebrew] Symbiont casks — which copy each one is"
  ansible.builtin.debug:
    msg: "{{ _symbiont_cask.results | default([]) | selectattr('stdout', 'defined') | map(attribute='stdout') | list }}"
