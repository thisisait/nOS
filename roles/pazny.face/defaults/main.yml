---
# ==============================================================================
# pazny.face — role defaults
#
# nOS face — the unified web-desktop shell (SvelteKit). The FACE of the nOS
# anatomy: a liquid-glass macOS-style desktop that composes the EXISTING nOS
# surfaces — Authentik header-SSO (zero forced accounts), the Wing app catalog
# (/api/v1/hub/systems), iframe-embedded services, and the Bone VFS over the
# real per-user tree (tenants/<slug>/users/<uid>/).
#
# Built from source (KEAP precedent): the shell source is VENDORED in-repo
# at files/anatomy/face/ (see face_vendored_src below); the role syncs it into
# face_src_dir and `docker compose up` builds nos/face from there. The separate-
# repo pinned-tag clone model is retired (2026-07-18, v0.2).
#
# Operator-facing pins (domain/port/version) live in default.config.yml —
# these are fallbacks only (version-pin shadow rule: bump default.config.yml,
# not here). Design doc: docs/plans/nos-face.md.
# ==============================================================================

face_home: "{{ ansible_facts['env']['HOME'] }}/face"
face_src_dir: "{{ face_home }}/src"

# ── Vendored source (2026-07-18: nos-face moved IN-REPO) ─────────────────────
# The shell source now lives inside the monorepo at files/anatomy/face/ (joining
# wing/bone/pulse as an in-tree anatomy organ) — the separate-repo pinned-tag
# clone model is retired. Reproducibility is now the repo commit itself (the
# VERSION marker in the vendored tree tracks the shell version). The role SYNCS
# the vendored tree into face_src_dir and `docker compose` builds nos/face from
# there (keap build-from-source precedent).
face_vendored_src: "{{ playbook_dir }}/files/anatomy/face"

face_mem_limit: "{{ docker_mem_limit_light | default('512m') }}"
face_cpus: "{{ docker_cpus_light | default(1) }}"

# Internal container port the SvelteKit node server binds (adapter-node PORT).
# NOT operator-facing — Traefik reaches the container on this port via Docker DNS.
face_internal_port: 5090
