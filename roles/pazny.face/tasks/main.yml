---
# ==============================================================================
# pazny.face/tasks/main.yml — nOS face (web-desktop shell)
#
# Called from tasks/stacks/stack-up.yml BEFORE `docker compose -p iiab up`:
# clones thisisait/nos-face at the pinned ref (git-clone build precedent:
# pazny.keap / pazny.hermes), then renders the compose override fragment to
# {{ stacks_dir }}/iiab/overrides/face.yml which stack-up.yml collects via
# `find` and passes as an additional -f flag. The image is built from the clone
# by `docker compose up` (build-from-source precedent: pazny.keap / pazny.puter).
#
# Routing: face is auto-routed by the Traefik file-provider from its
# state/manifest.yml row (domain_var: face_domain, port_var: face_port) with
# forward-auth (traefik_auth_modes.face = proxy) + the face-edge middleware
# (SEC-6 analog) that injects X-Face-Edge-Token. Reached container-directly on
# gated_net via traefik_container_upstreams.face = {svc: face, port: 5090}.
# ==============================================================================

- name: "[pazny.face] Ensure home and src directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ face_home }}"
    - "{{ face_src_dir }}"

- name: "[pazny.face] Sync vendored nos-face source into the build dir"
  # The shell source is vendored in-repo (files/anatomy/face); copy it into the
  # build dir so `docker compose build` has a stable context. Excludes the local
  # dev artifacts (node_modules/.svelte-kit/build) — the image rebuilds them.
  ansible.builtin.synchronize:
    src: "{{ face_vendored_src }}/"
    dest: "{{ face_src_dir }}/"
    delete: true
    recursive: true
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=.svelte-kit"
      - "--exclude=build"
  delegate_to: "{{ inventory_hostname }}"
  register: _face_sync
  notify: Restart face

- name: "[pazny.face] Render compose override fragment"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/iiab/overrides/face.yml"
    mode: '0600'
  notify: Restart face

- name: "[pazny.face] Print info"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════
       nOS face ready (starts via the IIAB stack)
      ══════════════════════════════════════════════════════
       URL:      https://{{ face_domain | default('face' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}
       Port:     {{ face_internal_port }} (container; loopback debug on {{ face_port | default(5090) }})
       Source:   {{ face_src_dir }} (vendored from files/anatomy/face)
       SSO:      forward_auth (X-Authentik-* via gated_net) + X-Face-Edge-Token trust
       Catalog:  Wing /api/v1/hub/systems   Files: Bone VFS (users/<uid>/)
      ══════════════════════════════════════════════════════
