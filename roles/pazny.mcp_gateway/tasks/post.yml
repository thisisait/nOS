---
# ==============================================================================
# pazny.mcp_gateway/tasks/post.yml
#
# Called from tasks/stacks/stack-up.yml AFTER `docker compose up iiab`.
# Creates a PostgreSQL read-only user + Grafana service account token,
# then restarts mcpo to reload the new config with token substitution.
# ==============================================================================

# -- 1. PostgreSQL read-only user ─────────────────────────────────────────

- name: "[mcp_gateway Post] Create PostgreSQL read-only role for MCP"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p infra
    exec -T postgresql psql -U {{ postgresql_root_user | default('postgres') }}
    -c "DO $$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ mcp_postgres_user }}') THEN
        CREATE USER {{ mcp_postgres_user }} WITH PASSWORD '{{ mcp_postgres_password }}';
      ELSE
        ALTER USER {{ mcp_postgres_user }} WITH PASSWORD '{{ mcp_postgres_password }}';
      END IF;
    END $$;
    GRANT CONNECT ON DATABASE postgres TO {{ mcp_postgres_user }};
    GRANT USAGE ON SCHEMA public TO {{ mcp_postgres_user }};
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO {{ mcp_postgres_user }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO {{ mcp_postgres_user }};"
  register: _mcp_pg_user
  changed_when: _mcp_pg_user.rc == 0
  failed_when: false
  no_log: true
  when: mcp_enable_postgres | default(true)

# ── 2. Grafana service account + token ────────────────────────────────────────

- name: "[mcp_gateway Post] Create Grafana service account for MCP (idempotent)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port | default(3000) }}/api/serviceaccounts"
    method: POST
    body_format: json
    body:
      name: "mcp-gateway"
      role: "Viewer"                    # Pouze cteni dashboardu/query
      isDisabled: false
    user: "{{ grafana_admin_user | default('admin') }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 201, 400, 409]   # 409 = already exists
    timeout: 10
  register: _grafana_sa
  changed_when: _grafana_sa.status in [200, 201]
  failed_when: false
  no_log: true
  when: mcp_enable_grafana | default(true)

- name: "[mcp_gateway Post] Get Grafana service account ID (if existed)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port | default(3000) }}/api/serviceaccounts/search?query=mcp-gateway"
    method: GET
    user: "{{ grafana_admin_user | default('admin') }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200]
    timeout: 10
  register: _grafana_sa_search
  failed_when: false
  no_log: true
  when: mcp_enable_grafana | default(true)

- name: "[mcp_gateway Post] Extract Grafana SA ID"
  ansible.builtin.set_fact:
    # The Grafana API returns `id` as an integer. We cast via `| int` for a consistent type.
    # Fallback 0 = "not SA" (check via `> 0`).
    _grafana_sa_id: "{{ (_grafana_sa.json.id | default(
      (_grafana_sa_search.json.serviceAccounts | default([]) | selectattr('name', 'equalto', 'mcp-gateway') | list | first).id | default(0))) | int }}"
  when: mcp_enable_grafana | default(true)

- name: "[mcp_gateway Post] Look for a persisted Grafana SA token"
  ansible.builtin.stat:
    path: "{{ mcpo_data_dir }}/.grafana_sa_token"
  register: _mcp_grafana_tok_stat
  when: mcp_enable_grafana | default(true)

# Grafana returns the token secret ONCE at POST. If the persist file is gone
# but a token named mcpo-token still exists, a second POST is 409 with no key
# — silent, and the compose keep the placeholder. Delete the named leftover
# first; GET never returns the secret.
- name: "[mcp_gateway Post] List Grafana SA tokens (only when the persist file is gone)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port | default(3000) }}/api/serviceaccounts/{{ _grafana_sa_id }}/tokens"
    method: GET
    user: "{{ grafana_admin_user | default('admin') }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200]
    timeout: 10
  register: _grafana_tok_list
  failed_when: false
  no_log: true
  when: >-
    (mcp_enable_grafana | default(true))
    and ((_grafana_sa_id | default(0) | int) > 0)
    and not ((_mcp_grafana_tok_stat.stat | default({})).exists | default(false))

- name: "[mcp_gateway Post] Drop leftover Grafana SA token named mcpo-token"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port | default(3000) }}/api/serviceaccounts/{{ _grafana_sa_id }}/tokens/{{ item.id }}"
    method: DELETE
    user: "{{ grafana_admin_user | default('admin') }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 204, 404]
    timeout: 10
  loop: "{{ (_grafana_tok_list.json | default([])) if ((_grafana_tok_list.json | default([])) | type_debug == 'list') else ((_grafana_tok_list.json | default({})).tokens | default([])) }}"
  loop_control:
    label: "{{ item.name | default(item.id) }}"
  failed_when: false
  no_log: true
  when:
    - mcp_enable_grafana | default(true)
    - _grafana_tok_list is not skipped
    - (item.name | default('')) == 'mcpo-token'

- name: "[mcp_gateway Post] Create Grafana SA token for mcpo"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port | default(3000) }}/api/serviceaccounts/{{ _grafana_sa_id }}/tokens"
    method: POST
    body_format: json
    body:
      name: "mcpo-token"
    user: "{{ grafana_admin_user | default('admin') }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 201]
    timeout: 10
  register: _grafana_token
  changed_when: (_grafana_token.status | default(0)) in [200, 201]
  failed_when: false
  no_log: true
  when: >-
    (mcp_enable_grafana | default(true))
    and ((_grafana_sa_id | default(0) | int) > 0)
    and not ((_mcp_grafana_tok_stat.stat | default({})).exists | default(false))

- name: "[mcp_gateway Post] Fail if a mint was required but Grafana returned no key"
  ansible.builtin.fail:
    msg: >-
      Grafana SA token file {{ mcpo_data_dir }}/.grafana_sa_token is missing and
      POST /tokens did not return a key (status={{ _grafana_token.status | default('n/a') }}).
      A leftover token named mcpo-token is 409; that leftover must be deleted first.
  when: >-
    (mcp_enable_grafana | default(true))
    and ((_grafana_sa_id | default(0) | int) > 0)
    and not ((_mcp_grafana_tok_stat.stat | default({})).exists | default(false))
    and (
      (_grafana_token is skipped)
      or ((_grafana_token.json | default({})).key | default('') | length == 0)
    )

- name: "[mcp_gateway Post] Persist Grafana SA token to file (for compose restart)"
  ansible.builtin.copy:
    dest: "{{ mcpo_data_dir }}/.grafana_sa_token"
    content: "{{ (_grafana_token.json | default({})).key }}"
    mode: '0600'
  when: >-
    (mcp_enable_grafana | default(true))
    and (_grafana_token is not skipped)
    and ((_grafana_token.json | default({})).key | default('') | length > 0)

- name: "[mcp_gateway Post] Use the newly minted Grafana SA token in the override"
  ansible.builtin.set_fact:
    mcp_grafana_sa_token: "{{ (_grafana_token.json | default({})).key }}"
  when: >-
    (mcp_enable_grafana | default(true))
    and (_grafana_token is not skipped)
    and ((_grafana_token.json | default({})).key | default('') | length > 0)

- name: "[mcp_gateway Post] Re-render compose override with the minted token"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/iiab/overrides/mcp_gateway.yml"
    mode: '0600'
  when: >-
    (mcp_enable_grafana | default(true))
    and (_grafana_token is not skipped)
    and (_grafana_token is changed)

- name: "[mcp_gateway Post] Restart mcp-grafana to pick up new token"  # noqa: no-handler
  # Inline (not a handler) because the next task in this file probes
  # mcpo /openapi.json — that probe must run AFTER the restart, but
  # handlers fire at end-of-play. Same ordering pattern as launchctl
  # plist reload tasks elsewhere in the codebase.
  # THE BASE FILE IS NOT OPTIONAL (fixed 2026-08-13). This passed only the
  # overrides — the networks are declared in `iiab/docker-compose.yml`, so
  # compose refused the whole project with `service "nodered" refers to
  # undefined network iiab_net`, every run since this task was written. With
  # `failed_when: false` above it, that refusal was invisible: the token was
  # minted, persisted and sed'd into the override, and the CONTAINER kept the
  # literal `placeholder-set-in-post` it was created with by the stack-level
  # up. Measured 2026-08-13 — 30 tokens had accumulated on the `mcp-gateway`
  # service account, one per converge, none of which ever reached the process.
  # Ordering is why: the stack `up` creates the container from a freshly
  # rendered override (placeholder), and only then does post.yml mint a token.
  # So this restart IS the step that delivers it, and it may not fail quietly.
  ansible.builtin.shell: |
    cd {{ stacks_dir }}/iiab
    {{ docker_bin }} compose -p iiab \
      -f docker-compose.yml \
      $(find overrides -name '*.yml' -exec echo '-f {}' \;) \
      up -d mcp-grafana mcpo 2>&1
  args:
    executable: /bin/bash
  register: _mcpo_restart
  changed_when: "'Started' in (_mcpo_restart.stdout | default('')) or 'Recreated' in (_mcpo_restart.stdout | default(''))"
  when: >-
    (mcp_enable_grafana | default(true))
    and (_grafana_token is not skipped)
    and (_grafana_token is changed)

- name: "[mcp_gateway Post] Verify the token actually reached the container"
  # Written by a READER, per the doctrine in CLAUDE.md: the step above
  # reporting success is what hid this for a month. Ask the running process
  # what it holds. A placeholder here means the toolset is authenticated with
  # a string, which Grafana answers `401 Invalid API key` — and mcpo stays
  # `healthy` throughout, so nothing else in the estate would say so.
  # `printenv` in the RUNNING process, not `docker inspect` on the container
  # metadata: one asks what the binary actually holds, the other what it was
  # configured with. No pipe, so nothing can swallow a non-zero rc either.
  ansible.builtin.command:
    cmd: "{{ docker_bin }} exec iiab-mcp-grafana-1 printenv GRAFANA_SERVICE_ACCOUNT_TOKEN"
  register: _mcpo_token_live
  changed_when: false
  # BOTH legs, deliberately. A `failed_when` naming only the placeholder would
  # override the rc check and hide an unset variable — the same shape as the
  # `failed_when: false` this task exists to compensate for.
  failed_when: >-
    _mcpo_token_live.rc != 0
    or (_mcpo_token_live.stdout | trim) == 'placeholder-set-in-post'
  when: >-
    (mcp_enable_grafana | default(true))
    and (_grafana_token is not skipped)
    and (_grafana_token is changed)

# ── 4. Health check mcpo ──────────────────────────────────────────────────────

- name: "[mcp_gateway Post] Wait for mcpo to be ready"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ mcpo_port | default(8765) }}/openapi.json"
    method: GET
    headers:
      Authorization: "Bearer {{ mcpo_api_key }}"
    status_code: [200]
    timeout: 5
  register: _mcpo_health
  retries: 12
  delay: 5
  until: _mcpo_health.status | default(0) == 200
  failed_when: false
  no_log: true

- name: "[mcp_gateway Post] Status"
  ansible.builtin.debug:
    msg: >-
      mcpo: {{ 'OK (' ~ (_mcpo_health.json.paths | default({}, true) | length) ~ ' MCP endpoints active)'
        if _mcpo_health.status | default(0) == 200
        else 'UNAVAILABLE - zkontroluj docker logs iiab-mcpo-1' }}
