---
# ==============================================================================
# pazny.mcp_gateway/tasks/main.yml
#
# Called from tasks/stacks/stack-up.yml BEFORE `docker compose up iiab`:
# creates data dirs, renders mcpo config + compose override fragment.
# ==============================================================================

- name: "[pazny.mcp_gateway] Ensure mcpo data directory exists"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ mcpo_data_dir }}"
    - "{{ mcpo_data_dir }}/data"

# The Grafana SA token is minted once in post.yml and persisted. Reading it
# here means the compose render already carries it, so stack-up does not
# recreate mcp-grafana from `placeholder-set-in-post` and post.yml does not
# mint-a-token / sed / restart every converge (~27s verify on p=54800).
- name: "[pazny.mcp_gateway] Look for a persisted Grafana SA token"
  ansible.builtin.stat:
    path: "{{ mcpo_data_dir }}/.grafana_sa_token"
  register: _mcp_grafana_tok_stat
  when: mcp_enable_grafana | default(true)

- name: "[pazny.mcp_gateway] Read the persisted Grafana SA token"
  ansible.builtin.slurp:
    src: "{{ mcpo_data_dir }}/.grafana_sa_token"
  register: _mcp_grafana_tok_file
  # Slurp fails the role if the file is absent. `stat.exists | default(false)`
  # also errors when the stat task itself was skipped (`stat` is missing on
  # the skipped register, and default() does not catch a missing attr).
  when: >-
    (mcp_enable_grafana | default(true))
    and ((_mcp_grafana_tok_stat.stat | default({})).exists | default(false))

- name: "[pazny.mcp_gateway] Prefer the persisted Grafana SA token in the render"
  ansible.builtin.set_fact:
    mcp_grafana_sa_token: "{{ _mcp_grafana_tok_file.content | b64decode | trim }}"
  when: >-
    (mcp_enable_grafana | default(true))
    and (_mcp_grafana_tok_file is not skipped)
    and (_mcp_grafana_tok_file.content | default('') | length > 0)

- name: "[pazny.mcp_gateway] Render mcpo config.json"
  ansible.builtin.template:
    src: mcpo-config.json.j2
    dest: "{{ mcpo_data_dir }}/config.json"
    mode: '0600'
  notify: Restart mcpo

- name: "[pazny.mcp_gateway] Render compose override fragment"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/iiab/overrides/mcp_gateway.yml"
    mode: '0600'
  notify: Restart mcpo

# Linux routes via Traefik; host-nginx per-service vhosts are macOS-only.
- name: "[pazny.mcp_gateway] Deploy nginx vhost"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/nginx/sites-available/mcpo.conf"
    dest: "{{ homebrew_prefix }}/etc/nginx/sites-available/mcpo.conf"
    mode: '0644'
  notify: Restart nginx
  when:
    - install_nginx | default(true)
    - ansible_os_family == 'Darwin'

- name: "[pazny.mcp_gateway] Enable nginx vhost (symlink)"
  ansible.builtin.file:
    src: "{{ homebrew_prefix }}/etc/nginx/sites-available/mcpo.conf"
    dest: "{{ homebrew_prefix }}/etc/nginx/sites-enabled/mcpo.conf"
    state: link
    force: true
  notify: Restart nginx
  when:
    - install_nginx | default(true)
    - ansible_os_family == 'Darwin'

- name: "[pazny.mcp_gateway] Print installation info"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════════════════
       MCP Gateway (mcpo) ready
      ══════════════════════════════════════════════════════════════════
       URL:       https://{{ mcpo_domain }}
       Endpoint:  http://127.0.0.1:{{ mcpo_port }}
       API Key:   (in mcpo config.json)
       Config:    {{ mcpo_data_dir }}/config.json
       Data:      {{ mcpo_data_dir }}/data

       MCP servers (active):
      {% if mcp_enable_time | default(true) %}   ✓ time        → /time/openapi.json{% endif %}
      {% if mcp_enable_memory | default(true) %}   ✓ memory      → /memory/openapi.json{% endif %}
      {% if mcp_enable_fetch | default(true) %}   ✓ fetch       → /fetch/openapi.json{% endif %}
      {% if mcp_enable_filesystem | default(true) %}   ✓ filesystem  → /filesystem/openapi.json{% endif %}
      {% if mcp_enable_git | default(true) %}   ✓ git         → /git/openapi.json{% endif %}
      {% if mcp_enable_postgres | default(true) %}   ✓ postgres    → /postgres/openapi.json{% endif %}
      {% if mcp_enable_grafana | default(true) %}   ✓ grafana     → /grafana/openapi.json{% endif %}

       Registruj v OpenWebUI:
         Admin → Settings → Tools → Add Connection:
           URL: http://mcpo:8000
           Auth: Bearer (in mcpo config.json)
      ══════════════════════════════════════════════════════════════════
