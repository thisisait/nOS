---
# ==============================================================================
# pazny.mcp_gateway — MCP-to-OpenAPI proxy for OpenWebUI
#
# Deploys `mcpo` (https://github.com/open-webui/mcpo) as a single container
# that wraps multiple MCP servers and exposes them as OpenAPI endpoints.
# OpenWebUI 0.8.x consumes mcpo as a tool server via TOOL_SERVER_CONNECTIONS.
#
# MCP servers included by default (configurable in mcp_servers_enabled):
#   - time        — timezone-aware datetime (uvx mcp-server-time)
#   - memory      — persistent notes (npx @modelcontextprotocol/server-memory)
#   - fetch       — HTTP fetching (uvx mcp-server-fetch)
#   - filesystem  — read /data/readonly (npx @modelcontextprotocol/server-filesystem)
#   - git         — local git repos (uvx mcp-server-git)
#   - postgres    — read-only DB queries (npx server-postgres)
#   - grafana     — Grafana dashboards/queries (SSE sibling container)
# ==============================================================================

mcpo_version: "main"          # upstream publishes only main/latest (no semver tags)
mcpo_domain: "mcp{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
mcpo_port: 8765                                         # host port
mcpo_api_key: "{{ global_password_prefix }}_pw_mcpo"    # bearer token for OpenWebUI
mcpo_image: "ghcr.io/open-webui/mcpo"

# ── Per-server toggles ────────────────────────────────────────────────────────
# Disable a specific MCP server by setting it to false
mcp_enable_time: true
mcp_enable_memory: true
mcp_enable_fetch: true
mcp_enable_filesystem: true
mcp_enable_git: true
mcp_enable_postgres: true
mcp_enable_grafana: true

# ── Filesystem MCP ────────────────────────────────────────────────────────────
# Paths that MCP filesystem exposes (read-only bind mount in the container)
mcp_filesystem_paths:
  - "{{ ansible_facts['env']['HOME'] }}/projects"
  - "{{ ansible_facts['env']['HOME'] }}/agents/log"

# ── Git MCP ───────────────────────────────────────────────────────────────────
mcp_git_repo_path: "{{ ansible_facts['env']['HOME'] }}/projects"

# ── PostgreSQL MCP ────────────────────────────────────────────────────────────
# Read-only user for MCP queries (created in post.yml)
mcp_postgres_user: "mcp_readonly"
mcp_postgres_password: "{{ global_password_prefix }}_pw_mcp_postgres_ro"
mcp_postgres_database: "postgres"                       # default DB s read-only roli

# ── Grafana MCP ───────────────────────────────────────────────────────────────
# Grafana service account token (created automatically in post.yml)
mcp_grafana_url: "http://grafana:3000"                  # internal Docker service name
# THE REGISTRY WAS THE WRONG QUESTION (2026-08-13). `mcp/grafana` is Docker's
# MCP-catalogue MIRROR: one floating `latest`, unpushed since 2026-07-08.
# Upstream publishes to `grafana/mcp-grafana` — semver tags, 1.1.0 on
# 2026-08-10 — and its README has said `docker pull grafana/mcp-grafana` all
# along. The 2026-08-05 note here concluded "there is nothing to bump TO"
# after asking the registry the estate already used, never asking where the
# project publishes. Same shape as the GHSA-without-a-CVE lesson in CLAUDE.md:
# the answer was true of the question and false of the world.
#
# Verified drop-in before switching, from the registry rather than the docs —
# both images carry the identical entrypoint
# (`/app/mcp-grafana --transport sse --address 0.0.0.0:8000`) and expose 8000,
# which is what `mcpo-config.json.j2` dials as http://mcp-grafana:8000/sse.
# (Both run as the same non-root user too — an earlier note here credited that
# to the official build alone; `docker image inspect` says otherwise.)
#
# "Drop-in" is true of the IMAGE and was false of the LINK (found 2026-08-13,
# re-measuring the claim): BOTH builds ship a Host allowlist defaulting to
# loopback, so the resident container had been answering mcpo's
# `Host: mcp-grafana:8000` with 403 all along — mcpo starts healthy and
# silently drops the grafana toolset. The compose template now restates the
# entrypoint with `--allowed-hosts mcp-grafana:8000`; see the comment there.
mcp_grafana_image: "grafana/mcp-grafana"
# REM-196 (CRITICAL, CVE-2026-19516, CVSS 9.1) — the SECOND bite at the
# X-Grafana-URL header: an authenticated caller steers the OUTBOUND request and
# READS THE RESPONSE, reaching loopback and cloud-metadata endpoints. Grafana's
# advisory says the CVE-2026-15583 patch (REM-150) "prevented token leakage but
# failed to restrict destination targeting entirely", moving the floor 0.17.1 ->
# 1.1.0. The resident digest resolves to commit 76ed7db, ONE commit before
# 0.17.1 — behind BOTH fixes.
#
# Digest form kept: the tag says what we meant, the digest says what we get.
# The digest below is the multi-arch INDEX, so arm64 and amd64 both resolve.
mcp_grafana_version: "1.1.0@sha256:f21a19cebbfa7c3a76ef1746171e5ffc3601064e432f593e7c6cb526e5216e5f"
# DEAD CONFIG, kept only to say so: nothing renders this var. The SSE port is
# 8000 (baked into the image entrypoint and the compose override); 8765 never
# was it. Deleting outright would silently break an operator override file
# that sets it — announce first, remove on the next role-surface sweep.
mcp_grafana_port: 8765

# ── OpenWebUI Anthropic connector ─────────────────────────────────────────────
# Add ANTHROPIC_API_KEY to config.yml / credentials.yml to activate
# Anthropic Claude v OpenWebUI admin UI (multi-provider via OpenAI-compat API)
openwebui_anthropic_enable: "{{ anthropic_api_key is defined and (anthropic_api_key | length) > 0 }}"
