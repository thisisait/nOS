---
# ==============================================================================
# pazny.mcp_gateway — MCP-to-OpenAPI proxy for OpenWebUI
#
# Deploys `mcpo` (https://github.com/open-webui/mcpo) as a single container
# that wraps multiple MCP servers and exposes them as OpenAPI endpoints.
# OpenWebUI 0.8.x consumes mcpo as a tool server via TOOL_SERVER_CONNECTIONS.
#
# MCP servers included by default (configurable in mcp_servers_enabled):
#   - time        — timezone-aware datetime (uvx mcp-server-time)
#   - memory      — persistent notes (npx @modelcontextprotocol/server-memory)
#   - fetch       — HTTP fetching (uvx mcp-server-fetch)
#   - filesystem  — read /data/readonly (npx @modelcontextprotocol/server-filesystem)
#   - git         — local git repos (uvx mcp-server-git)
#   - postgres    — read-only DB queries (npx server-postgres)
#   - grafana     — Grafana dashboards/queries (SSE sibling container)
# ==============================================================================

mcpo_version: "main"          # upstream publishes only main/latest (no semver tags)
mcpo_domain: "mcp{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
mcpo_port: 8765                                         # host port
mcpo_api_key: "{{ global_password_prefix }}_pw_mcpo"    # bearer token for OpenWebUI
mcpo_image: "ghcr.io/open-webui/mcpo"

# ── Per-server toggles ────────────────────────────────────────────────────────
# Disable a specific MCP server by setting it to false
mcp_enable_time: true
mcp_enable_memory: true
mcp_enable_fetch: true
mcp_enable_filesystem: true
mcp_enable_git: true
mcp_enable_postgres: true
mcp_enable_grafana: true

# ── Filesystem MCP ────────────────────────────────────────────────────────────
# Paths that MCP filesystem exposes (read-only bind mount in the container)
mcp_filesystem_paths:
  - "{{ ansible_facts['env']['HOME'] }}/projects"
  - "{{ ansible_facts['env']['HOME'] }}/agents/log"

# ── Git MCP ───────────────────────────────────────────────────────────────────
mcp_git_repo_path: "{{ ansible_facts['env']['HOME'] }}/projects"

# ── PostgreSQL MCP ────────────────────────────────────────────────────────────
# Read-only user for MCP queries (created in post.yml)
mcp_postgres_user: "mcp_readonly"
mcp_postgres_password: "{{ global_password_prefix }}_pw_mcp_postgres_ro"
mcp_postgres_database: "postgres"                       # default DB s read-only roli

# ── Grafana MCP ───────────────────────────────────────────────────────────────
# Grafana service account token (created automatically in post.yml)
mcp_grafana_url: "http://grafana:3000"                  # internal Docker service name
mcp_grafana_image: "mcp/grafana"
# DIGEST-PINNED, 2026-08-05. Not a version bump — there is nothing to bump TO.
#
# REM-150 (HIGH, CVE-2026-15583: the X-Grafana-URL header overrides the
# configured base URL, so the sidecar forwards its GRAFANA_SERVICE_ACCOUNT_TOKEN
# to an attacker-chosen host; fixed upstream in 0.17.1) recorded the action as
# "pin the tag". Measured against the registry today, that action is a no-op:
# `mcp/grafana` publishes ONLY `latest`, and its single tag was last pushed
# 2026-07-08 — seven days BEFORE the fix. There is no 0.17.1 image, and the
# floating tag has not moved, so a `docker pull` changes nothing.
#
# What the digest does buy is honesty. A floating tag means the resident image
# can drift arbitrarily far from anything the repo records, with nothing to
# show it — the same class as nextcloud's floating major tag, and the reason a
# version-keyed scan calls this component "unknown" rather than "vulnerable".
# Pinning the digest freezes what is already running (zero converge change:
# this IS the resident image) and makes the exposure a stated fact instead of
# an unmeasurable one. Re-check the registry when REM-150 is next reviewed; the
# moment a versioned or rebuilt image appears, this becomes a real bump.
#
# Mitigations unchanged and load-bearing meanwhile: no host port published,
# absent from state/manifest.yml so no Traefik router is derived, and fronting
# mcpo is forward-auth gated plus --api-key protected.
mcp_grafana_version: "latest@sha256:9362bcf6aa0e44e61f645b905cec03fb346a946a34a4dafecd7f3e28d3724014"
mcp_grafana_port: 8765                                  # internal SSE port

# ── OpenWebUI Anthropic connector ─────────────────────────────────────────────
# Add ANTHROPIC_API_KEY to config.yml / credentials.yml to activate
# Anthropic Claude v OpenWebUI admin UI (multi-provider via OpenAI-compat API)
openwebui_anthropic_enable: "{{ anthropic_api_key is defined and (anthropic_api_key | length) > 0 }}"
