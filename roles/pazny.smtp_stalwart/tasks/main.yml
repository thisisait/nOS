---
# ==============================================================================
# pazny.smtp_stalwart — render compose override + ensure data dirs
#
# Track G scaffold. Activated by `install_smtp_stalwart: true`.
# ==============================================================================

- name: "[pazny.smtp_stalwart] Refuse on local TLD (production-only role)"
  ansible.builtin.fail:
    msg: |-
      pazny.smtp_stalwart is a production role — it requires a public
      tenant_domain so MX records, DKIM, and ACME wildcards work end-to-end.
      Current tenant_domain={{ tenant_domain }} is detected as local
      (.local/.lan/.test/localhost). Either:
        - leave install_smtp_stalwart: false (Mailpit handles dev capture)
        - or set tenant_domain to a public domain (and run pazny.acme first)
  when:
    - install_smtp_stalwart | default(false) | bool
    - tenant_domain_is_local | default(true) | bool

- name: "[pazny.smtp_stalwart] Ensure data + config directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    # v0.16 layout — config.json lives in etc/, queue + logs + blob store
    # under var/. Replaces the v0.11 etc/+logs/+queue/ trio.
    - "{{ stalwart_data_dir }}"
    - "{{ stalwart_data_dir }}/etc"
    - "{{ stalwart_data_dir }}/var"

# ── Declarative first boot: the store, the DKIM key, the plans ─────────────
# With config.json present the server leaves bootstrap mode. On the FIRST
# boot (marker absent) compose starts it in recovery mode — only the
# management listener is up — and tasks/post.yml applies the plans, then
# recreates the container normally. Every later converge is one idempotent
# apply against the running server.
- name: "[pazny.smtp_stalwart] Render config.json (the store — nothing else lives here)"
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ stalwart_data_dir }}/etc/config.json"
    mode: '0600'

- name: "[pazny.smtp_stalwart] Generate the DKIM ed25519 key once"
  ansible.builtin.command:
    cmd: openssl genpkey -algorithm ed25519 -out "{{ stalwart_data_dir }}/etc/dkim-ed25519.key"
    creates: "{{ stalwart_data_dir }}/etc/dkim-ed25519.key"

- name: "[pazny.smtp_stalwart] DKIM key readable by the stalwart user (uid 2000) only"
  ansible.builtin.file:
    path: "{{ stalwart_data_dir }}/etc/dkim-ed25519.key"
    mode: '0644'

- name: "[pazny.smtp_stalwart] Render the plans"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ stalwart_data_dir }}/etc/{{ item }}"
    mode: '0600'
  loop: [plan.ndjson, bootstrap-plan.ndjson]
  no_log: true   # the DNS token and the admin secret are in them

- name: "[pazny.smtp_stalwart] Is this the first boot? (marker written by post.yml after a verified apply)"
  ansible.builtin.stat:
    path: "{{ stalwart_applied_marker }}"
  register: _stalwart_marker

- name: "[pazny.smtp_stalwart] Render compose override fragment"
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stacks_dir }}/infra/overrides/smtp_stalwart.yml"
    mode: '0600'
  notify: Restart smtp_stalwart

- name: "[pazny.smtp_stalwart] Print operator info banner"
  ansible.builtin.debug:
    msg: |-
      ════════════════════════════════════════════════════════════════════
       pazny.smtp_stalwart — scaffold rendered ({{ stalwart_image }})
      ════════════════════════════════════════════════════════════════════
       Mail host:    {{ stalwart_domain }}
       Webadmin:     https://{{ stalwart_domain }}/admin (public via Traefik)
       JMAP API:     http://127.0.0.1:{{ stalwart_port_admin }}/jmap (Wing reaches here)
       SMTP submit:  smtps://{{ stalwart_domain }}:{{ stalwart_port_smtps }}
       IMAP:         imaps://{{ stalwart_domain }}:{{ stalwart_port_imap }}
       Admin user:   {{ stalwart_admin_username }} (STALWART_RECOVERY_ADMIN-pinned)
       Data dir:     {{ stalwart_data_dir }} (etc/ + var/)

       NEXT (operator, v0.16+ first-boot):
         1. Open Cloudflare DNS → add MX <td> → mail.<td>, A mail.<td> → IP
         2. Wait for cert via pazny.acme (--tags acme)
         3. Open https://{{ stalwart_domain }}/admin — login with the
            STALWART_RECOVERY_ADMIN credentials above. Bootstrap wizard
            walks through domain + DKIM + TLS cert paths. Inside the
            container the wildcard cert is mounted at:
              /certs/cert.pem
              /certs/key.pem
            (NOT /etc/stalwart/certs/* — Docker Desktop virtiofs on
            macOS can't handle nested file binds, see compose template
            comment). Wizard generates /etc/stalwart/config.json.
         4. Paste DKIM key (from wizard) into CF DNS.
         5. Test send:    swaks --to <you>@gmail.com --server {{ stalwart_domain }}
         6. Test receive: swaks --to test@{{ tenant_domain }}
                                --server external-mta-of-your-choice

       Cesta B (invite flow): Wing's StalwartProvisioner uses the JMAP
       endpoint above to create mailboxes during operator-driven invites.
       See docs/invite-provisioning.md.
      ════════════════════════════════════════════════════════════════════
