---
# ==============================================================================
# pazny.homeassistant/tasks/post.yml — auto-onboarding via /api/onboarding/*
#
# HA exposes onboarding endpoints only before the first user is created.
# Flow: POST /api/onboarding/users -> /api/onboarding/core_config
#       -> /api/onboarding/analytics -> /api/onboarding/integration.
#
# After the first run the onboarding API is closed. Admin password reconverge runs
# via the `hass --script auth change_password` CLI inside the container.
# ==============================================================================

- name: "[pazny.homeassistant Post] Wait for API"
  ansible.builtin.include_role:
    name: pazny._common_tasks
    tasks_from: wait_for_api.yml
  vars:
    wait_name: "[pazny.homeassistant Post]"
    wait_url: "http://127.0.0.1:{{ homeassistant_port }}/"
    wait_status_codes: [200, 302]
    wait_register_as: _ha_ready
    wait_retries: 20
    wait_delay: 10
    # hard-fail: `failed_when: false` removed 2026-05-08 — see open_webui comment.
    wait_hard_fail: true

- name: "[pazny.homeassistant Post] Check onboarding status"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ homeassistant_port }}/api/onboarding"
    method: GET
    timeout: 10
    status_code: [200]
  register: _ha_onboarding
  failed_when: false
  when: _ha_ready.status | default(0) in [200, 302]

- name: "[pazny.homeassistant Post] Create owner account (first-run only)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ homeassistant_port }}/api/onboarding/users"
    method: POST
    body_format: json
    body:
      client_id: "https://{{ homeassistant_domain }}/"
      name: "{{ homeassistant_admin_name }}"
      username: "{{ homeassistant_admin_user }}"
      password: "{{ homeassistant_admin_password }}"
      language: "en"
    status_code: [200]
    timeout: 10
  register: _ha_user_create
  when:
    - _ha_onboarding.json is defined
    - _ha_onboarding.json | selectattr('step', 'equalto', 'user') | selectattr('done', 'equalto', false) | list | length > 0
  changed_when: _ha_user_create.status | default(0) == 200
  failed_when: false
  no_log: true

# -- Reconverge admin password every run (state-declarative UPDATE) ------
# Onboarding API zavrena po prvnim runu -> CLI script `hass --script auth`
# works for an existing user too. Runs only if the user has already been created.
- name: "[pazny.homeassistant Post] Reconverge owner password (hass auth change_password CLI)"
  ansible.builtin.shell: |
    {{ docker_bin }} compose -p iiab exec -T homeassistant \
      hass --script auth --config /config change_password \
      {{ homeassistant_admin_user }} \
      {{ (homeassistant_admin_password) | quote }} 2>&1
  register: _ha_pw_update
  when:
    - _ha_onboarding.json is defined
    - _ha_onboarding.json | selectattr('step', 'equalto', 'user') | selectattr('done', 'equalto', true) | list | length > 0
  changed_when: _ha_pw_update.rc | default(1) == 0
  failed_when: false
  check_mode: false
  no_log: true

- name: "[pazny.homeassistant Post] Set core config (timezone, location)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ homeassistant_port }}/api/onboarding/core_config"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ _ha_user_create.json.auth_code | default('') }}"
    body: {}
    status_code: [200]
    timeout: 10
  when:
    - _ha_user_create.json.auth_code is defined
  failed_when: false

- name: "[pazny.homeassistant Post] Skip analytics"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ homeassistant_port }}/api/onboarding/analytics"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ _ha_user_create.json.auth_code | default('') }}"
    body: {}
    status_code: [200]
    timeout: 10
  when:
    - _ha_user_create.json.auth_code is defined
  failed_when: false

- name: "[pazny.homeassistant Post] Complete onboarding (skip integrations)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ homeassistant_port }}/api/onboarding/integration"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ _ha_user_create.json.auth_code | default('') }}"
    body:
      client_id: "https://{{ homeassistant_domain }}/"
      redirect_uri: "https://{{ homeassistant_domain }}"
    status_code: [200]
    timeout: 10
  when:
    - _ha_user_create.json.auth_code is defined
  failed_when: false
