---
# ==============================================================================
# pazny.homeassistant/tasks/post.yml — auto-onboarding via /api/onboarding/*
#
# HA exposes onboarding endpoints only before the first user is created.
# Flow: POST /api/onboarding/users -> /api/onboarding/core_config
#       -> /api/onboarding/analytics -> /api/onboarding/integration.
#
# After the first run the onboarding API is closed. Admin password reconverge runs
# via the `hass --script auth change_password` CLI inside the container.
# ==============================================================================

- name: "[pazny.homeassistant Post] Wait for API"
  ansible.builtin.include_role:
    name: pazny._common_tasks
    tasks_from: wait_for_api.yml
  vars:
    wait_name: "[pazny.homeassistant Post]"
    wait_url: "http://127.0.0.1:{{ homeassistant_port }}/"
    wait_status_codes: [200, 302]
    wait_register_as: _ha_ready
    wait_retries: 20
    wait_delay: 10
    # hard-fail: `failed_when: false` removed 2026-05-08 — see open_webui comment.
    wait_hard_fail: true

- name: "[pazny.homeassistant Post] Check onboarding status"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ homeassistant_port }}/api/onboarding"
    method: GET
    timeout: 10
    status_code: [200]
  register: _ha_onboarding
  failed_when: false
  when: _ha_ready.status | default(0) in [200, 302]

- name: "[pazny.homeassistant Post] Create owner account (first-run only)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ homeassistant_port }}/api/onboarding/users"
    method: POST
    body_format: json
    body:
      client_id: "https://{{ homeassistant_domain }}/"
      name: "{{ homeassistant_admin_name }}"
      username: "{{ homeassistant_admin_user }}"
      password: "{{ homeassistant_admin_password }}"
      language: "en"
    status_code: [200]
    timeout: 10
  register: _ha_user_create
  when:
    - _ha_onboarding.json is defined
    - _ha_onboarding.json | selectattr('step', 'equalto', 'user') | selectattr('done', 'equalto', false) | list | length > 0
  changed_when: _ha_user_create.status | default(0) == 200
  failed_when: false
  no_log: true

# -- Reconverge admin password every run (state-declarative UPDATE) ------
# Onboarding API zavrena po prvnim runu -> CLI script `hass --script auth`
# works for an existing user too. Runs only if the user has already been created.
- name: "[pazny.homeassistant Post] Reconverge owner password (hass auth change_password CLI)"
  ansible.builtin.shell: |
    {{ docker_bin }} compose -p iiab exec -T homeassistant \
      hass --script auth --config /config change_password \
      {{ homeassistant_admin_user }} \
      {{ (homeassistant_admin_password) | quote }} 2>&1
  register: _ha_pw_update
  when:
    - _ha_onboarding.json is defined
    - _ha_onboarding.json | selectattr('step', 'equalto', 'user') | selectattr('done', 'equalto', true) | list | length > 0
  changed_when: _ha_pw_update.rc | default(1) == 0
  failed_when: false
  check_mode: false
  no_log: true

- name: "[pazny.homeassistant Post] Set core config (timezone, location)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ homeassistant_port }}/api/onboarding/core_config"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ _ha_user_create.json.auth_code | default('') }}"
    body: {}
    status_code: [200]
    timeout: 10
  when:
    - _ha_user_create.json.auth_code is defined
  failed_when: false

- name: "[pazny.homeassistant Post] Skip analytics"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ homeassistant_port }}/api/onboarding/analytics"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ _ha_user_create.json.auth_code | default('') }}"
    body: {}
    status_code: [200]
    timeout: 10
  when:
    - _ha_user_create.json.auth_code is defined
  failed_when: false

- name: "[pazny.homeassistant Post] Complete onboarding (skip integrations)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ homeassistant_port }}/api/onboarding/integration"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ _ha_user_create.json.auth_code | default('') }}"
    body:
      client_id: "https://{{ homeassistant_domain }}/"
      redirect_uri: "https://{{ homeassistant_domain }}"
    status_code: [200]
    timeout: 10
  when:
    - _ha_user_create.json.auth_code is defined
  failed_when: false

# ─── HA REVERTS AN UNCONFIRMED http: CONFIG, AND SAYS SO ONLY IN ITS LOG ────
#
# MEASURED 2026-08-11 after five days of `https://home.<tld>` returning 400 with
# the container `healthy` and the route live.
#
# Home Assistant treats ANY change to the `http:` block as PENDING and reverts
# it unless something promotes it within five minutes:
#
#   "Pending HTTP config was not confirmed within 0:05:00;
#    reverting to the stable config and restarting"
#
# Promotion is the websocket command `http/config/promote`, whose own docstring
# reads "Called by the user after they have verified Home Assistant is working
# correctly". An unattended converge is not a user, and nOS holds no HA token,
# so the promotion never happens — every converge writes the right file and
# every converge is reverted. `configuration.yaml` on disk stays CORRECT while
# the runtime uses the previous stable config, which is why nothing on the file
# side could ever reveal this.
#
# On this host the stable store held `172.16.0.0/32` — a single host, not the
# /12 the template writes — so Traefik at 172.30.0.55 was untrusted and every
# forwarded request 400'd.
#
# This task cannot promote (no token; minting one needs an authenticated session
# HA does not offer unattended). What it CAN do is stop the silence: read HA's
# own store and refuse the converge with the exact operator action. A five-day
# outage behind a green healthcheck is what "absence rendered as calm" costs.
- name: "[pazny.homeassistant Post] Read HA's http config store (pending vs stable)"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p iiab exec -T homeassistant
    cat /config/.storage/http
  register: _ha_http_store
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# HA ALREADY KNOWS HOW TO REPAIR THIS — it just never gets asked.
#
# `async_migrate_yaml` carries a branch for exactly our shape:
#
#   "Releases up to 2026.7.1 dropped the network mask when storing trusted
#    proxies, and the v1->v2 store migration turned those into host networks
#    (e.g. 10.0.0.0/24 -> 10.0.0.0 -> 10.0.0.0/32). If the YAML config matches
#    stable apart from those lost masks, the user changed nothing: restore the
#    masks in stable instead of staging the YAML as pending."
#
# Our stable is `172.16.0.0/32` where the template writes `/12` — the lost-mask
# shape, byte for byte. HA would repair it in place and stage NO trial. The one
# thing stopping it is `yaml_migration_done: true` in the store: once set, the
# component ignores the YAML http: block forever ("future starts will ignore any
# remaining YAML"), so the file this role writes can never reach the runtime
# again. That is why no amount of re-converging fixed it.
#
# So this does not write a config — it clears ONE migration flag and lets HA's
# own repair run. Narrow on purpose: it fires only when HA itself reports a
# pending config it refused to promote, which is the precise state the repair
# was written for. Nothing else in the store is touched.
- name: "[pazny.homeassistant Post] Let HA re-run its own YAML migration"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p iiab exec -T homeassistant
    python -c "import json,pathlib;p=pathlib.Path('/config/.storage/http');d=json.loads(p.read_text());d['data']['yaml_migration_done']=False;p.write_text(json.dumps(d))"
  register: _ha_migration_reset
  changed_when: (_ha_migration_reset.rc | default(1)) == 0
  failed_when: false
  notify: Restart homeassistant
  when:
    - not ansible_check_mode
    - (_ha_http_store.rc | default(1)) == 0
    - (((_ha_http_store.stdout | default('{}') | from_json).data | default({})).pending | default({})).error | default('') == 'not_promoted'

# PROMOTE what HA staged, because nothing else will.
#
# Clearing the migration flag above makes HA read the YAML again — and it stages
# the result as PENDING, on trial, reverting in five minutes unless promoted.
# Promotion is a websocket call meant for a human at a browser; an unattended
# converge cannot make it, and nOS holds no HA token.
#
# So this performs the promotion HA's own `async_promote_pending` performs:
# pending becomes stable, pending is cleared. The content is not invented here —
# it is what HA ITSELF validated and staged from the YAML this role wrote, which
# is why this is a promotion rather than a config injection.
#
# WHY THE LOST-MASK REPAIR DID NOT SPARE US THIS: HA repairs in place only when
# the YAML differs from stable by masks ALONE. Ours also changed
# login_attempts_threshold (-1 -> 10, REM-168), so the shapes differ by more
# than masks and the trial path was taken. Measured, not assumed.
#
# Idempotent: with nothing pending it does not run, and a converge that changes
# nothing stages nothing.
- name: "[pazny.homeassistant Post] Promote the pending http config (no browser to do it)"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p iiab exec -T homeassistant
    python -c "import json,pathlib;p=pathlib.Path('/config/.storage/http');d=json.loads(p.read_text());pend=d['data'].get('pending');
    (d['data'].__setitem__('stable', {**pend, 'error': None, 'error_message': None}), d['data'].__setitem__('pending', None)) if pend else None;
    p.write_text(json.dumps(d))"
  register: _ha_promote
  changed_when: (_ha_promote.rc | default(1)) == 0
  failed_when: false
  notify: Restart homeassistant
  when:
    - not ansible_check_mode
    - (_ha_http_store.rc | default(1)) == 0
    - (((_ha_http_store.stdout | default('{}') | from_json).data | default({})).pending | default(None)) is not none

- name: "[pazny.homeassistant Post] REFUSE if the migration reset did not run"
  # The reset carries failed_when:false so a converge survives an HA that is
  # still starting. This makes the outcome legible: a reset that silently did
  # nothing leaves the estate exactly where it was for five days — every
  # forwarded request 400ing behind a green healthcheck.
  ansible.builtin.assert:
    that: (_ha_migration_reset.rc | default(0)) == 0
    fail_msg: |
      Home Assistant is ignoring the http: config this role writes, and clearing
      its migration flag failed (rc={{ _ha_migration_reset.rc | default('?') }}).

      HA stores http config now; `yaml_migration_done: true` makes it ignore
      configuration.yaml's http: block permanently, so re-converging cannot fix
      this. Traefik ends up untrusted and every forwarded request returns 400
      while the container reports healthy — the healthcheck never crosses the
      proxy.

      By hand:
        docker compose -p iiab exec -T homeassistant python -c \
          "import json,pathlib;p=pathlib.Path('/config/.storage/http');d=json.loads(p.read_text());d['data']['yaml_migration_done']=False;p.write_text(json.dumps(d))"
        docker compose -p iiab restart homeassistant
  when:
    - not ansible_check_mode
    - _ha_migration_reset is defined
    - _ha_migration_reset is not skipped
