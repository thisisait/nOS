---
# ==============================================================================
# pazny.calibre_web/tasks/post.yml — change default admin password
#
# Linuxserver image default creds: admin / admin123.
# Changes password to `{{ global_password_prefix }}_pw_calibreweb` via
# in-container python + werkzeug + sqlite3 UPDATE.
#
# Note: the compose service name has a hyphen (`calibre-web`). Legacy post.yml
# used `calibreweb` without a hyphen (silent failure via `failed_when: false`).
# Here we correctly use `calibre-web`.
# ==============================================================================

- name: "[pazny.calibre_web Post] Wait for API"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ calibreweb_port | default(8083) }}/"
    method: GET
    timeout: 5
    status_code: [200, 302]
  register: _cw_ready
  until: _cw_ready.status | default(0) in [200, 302]
  retries: 12
  delay: 10
  failed_when: false

- name: "[pazny.calibre_web Post] Login with default credentials"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ calibreweb_port | default(8083) }}/login"
    method: POST
    body_format: form-urlencoded
    body:
      username: "admin"
      password: "admin123"
      next: "/"
    status_code: [200, 302]
    follow_redirects: none
    timeout: 10
  register: _cw_login_default
  failed_when: false
  when: _cw_ready.status | default(0) in [200, 302]

- name: "[pazny.calibre_web Post] Login with target password (already changed)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ calibreweb_port | default(8083) }}/login"
    method: POST
    body_format: form-urlencoded
    body:
      username: "admin"
      password: "{{ calibreweb_admin_password | default(global_password_prefix + '_pw_calibreweb') }}"
      next: "/"
    status_code: [200, 302]
    follow_redirects: none
    timeout: 10
  register: _cw_login_target
  failed_when: false
  no_log: true
  when:
    - _cw_ready.status | default(0) in [200, 302]
    - _cw_login_default.status | default(0) == 302

- name: "[pazny.calibre_web Post] Reconverge admin password via SQLite + werkzeug"
  ansible.builtin.shell: |
    {{ docker_bin }} compose -p iiab exec -T calibre-web python3 -c "
    import sqlite3
    from werkzeug.security import generate_password_hash
    db = sqlite3.connect('/config/app.db')
    pw = generate_password_hash('{{ calibreweb_admin_password | default(global_password_prefix + '_pw_calibreweb') }}')
    db.execute('UPDATE user SET password=? WHERE role & 32 = 32 OR id=1', (pw,))
    db.commit()
    db.close()
    print('UPDATED')
    "
  register: _cw_pw_update
  when: _cw_ready.status | default(0) in [200, 302]
  changed_when: "'UPDATED' in (_cw_pw_update.stdout | default(''))"
  failed_when: false
  check_mode: false
  no_log: true

- name: "[pazny.calibre_web Post] Password reset status"
  ansible.builtin.debug:
    msg: >-
      Calibre-Web admin pw: {{ 'updated' if ('UPDATED' in (_cw_pw_update.stdout | default(''))) else 'skipped (best-effort)' }}

# ── SSO forward_auth header-provision (Batch 6, sso-autologin-plan.md §forward_auth) ──
# Calibre-Web has a real upstream "Allow Reverse Proxy Authentication" feature.
# It is NOT native OIDC and carries NO authentik.autologin block (forward_auth
# services are forbidden one by the test_no_autologin_for_pure_proxy_services
# gate). Instead it trusts a configured header carrying the username and logs
# that user in without rendering its own login form. The calibre-web router
# already sits behind Traefik's authentik@file forward-auth middleware, which
# forwards `X-authentik-username` (roles/pazny.traefik dynamic middlewares) —
# so once Authentik has authenticated the user the SAME header skips the second
# login.
#
# Stored in app.db `settings` (single row) — no env var exists in the linuxserver
# image, so we set the two columns via the same in-container SQLite path the
# admin-password reset uses above:
#   config_allow_reverse_proxy_header_login  (Boolean)  → 1 when on, 0 when off
#   config_reverse_proxy_login_header_name   (String)   → the trusted header name
#
# DORMANT by default: calibreweb_proxy_auth_enabled resolves to the global
# sso_autologin (false on a blank run). Fully reversible — the OFF branch flips
# the boolean back to 0, so a re-run with sso_autologin=false (or
# sso_autologin_calibreweb=false) restores the username/password form. The
# setting is cached in Calibre-Web's memory at load; a re-render with --tags
# calibreweb recreates the container so the new DB value takes effect (same
# recreate semantics the plan documents for env-driven autologin).
#
# HONEST CAVEAT (documented in default.config.yml + role defaults): Calibre-Web
# matches the forwarded username against an EXISTING Calibre-Web user. The
# provisioned admin user is `admin`; an Authentik principal whose username has
# no Calibre-Web account is silently NOT logged in (no auto-provision — upstream
# req #2965 rejected) and still sees the form. This cleanly eliminates the
# second login only for users whose Authentik username matches a Calibre-Web
# account.
- name: "[pazny.calibre_web Post] Reverse-proxy header auth (forward_auth header-provision)"
  ansible.builtin.shell: |
    {{ docker_bin }} compose -p iiab exec -T calibre-web python3 -c "
    import sqlite3
    db = sqlite3.connect('/config/app.db')
    enabled = {{ 1 if (calibreweb_proxy_auth_enabled | default(false) | bool) else 0 }}
    header = '{{ calibreweb_proxy_auth_header | default('X-authentik-username') }}'
    db.execute('UPDATE settings SET config_allow_reverse_proxy_header_login=?, config_reverse_proxy_login_header_name=?', (enabled, header))
    # Calibre-Web matches the forwarded username against an EXISTING user (no
    # auto-create — upstream req #2965 rejected). Rename the seeded admin row to
    # the operator's Authentik username so their header-login matches → true
    # autologin for that principal. Only renames the still-default 'admin' row.
    op = '{{ calibreweb_proxy_auth_username | default('') }}'
    if enabled and op and op.lower() != 'admin':
        db.execute('UPDATE user SET name=? WHERE id=1 AND lower(name)=\"admin\"', (op,))
    db.commit()
    db.close()
    print('PROXYAUTH=' + ('on' if enabled else 'off') + ' user=' + (op or 'admin'))
    "
  register: _cw_proxyauth
  when: _cw_ready.status | default(0) in [200, 302]
  changed_when: "'PROXYAUTH=' in (_cw_proxyauth.stdout | default(''))"
  failed_when: false
  check_mode: false

- name: "[pazny.calibre_web Post] Reverse-proxy header auth status"
  ansible.builtin.debug:
    msg: >-
      Calibre-Web reverse-proxy header auth:
      {{ 'ENABLED (trusts ' + (calibreweb_proxy_auth_header | default('X-authentik-username')) + ')'
         if (calibreweb_proxy_auth_enabled | default(false) | bool)
         else 'disabled (username/password form; SSO autologin dormant)' }}

# ── Library autowiring — create metadata.db + point Calibre-Web at it ─────────
# Without a Calibre library (metadata.db) AND config_calibre_dir set, Calibre-Web
# dead-ends on /admin/dbconfig. Autowire both. calibredb (shipped by the
# universal-calibre DOCKER_MOD) creates an empty library at the container's /books,
# which is calibreweb_books_dir on the host — LOCAL (~/calibre) or the external SSD
# when configure_external_storage flips calibreweb_books_dir to
# {{ external_storage_root }}/calibre (tasks/stacks/external-paths.yml). Idempotent:
# library creation is guarded on metadata.db absence; config_calibre_dir is only
# written when it differs; the restart fires only when one of them actually changed.
- name: "[pazny.calibre_web Post] Ensure the library dir is PUID-owned (abc)"
  # The bind-mounted /books can land root-owned (esp. on Linux, where mount perms
  # are real — on macOS Docker Desktop host access masks it). Calibre-Web + calibredb
  # run as abc (PUID); without this they can't create the library or book subdirs.
  # Idempotent + defensive; run as root (default exec user).
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p iiab exec -T calibre-web chown -R abc:abc /books
  when: _cw_ready.status | default(0) in [200, 302]
  changed_when: false
  failed_when: false

- name: "[pazny.calibre_web Post] Create empty Calibre library if metadata.db absent"
  ansible.builtin.shell: |
    {{ docker_bin }} compose -p iiab exec -T -u abc calibre-web sh -c '
      if [ -f /books/metadata.db ]; then echo EXISTS; exit 0; fi
      calibredb list --library-path /books >/dev/null 2>&1 || true
      [ -f /books/metadata.db ] && echo CREATED || echo FAILED'
  register: _cw_lib
  when: _cw_ready.status | default(0) in [200, 302]
  changed_when: "'CREATED' in (_cw_lib.stdout | default(''))"
  failed_when: "'FAILED' in (_cw_lib.stdout | default(''))"
  check_mode: false

- name: "[pazny.calibre_web Post] Point Calibre-Web at the library (/books)"
  ansible.builtin.shell: |
    {{ docker_bin }} compose -p iiab exec -T calibre-web python3 -c "
    import sqlite3
    db = sqlite3.connect('/config/app.db')
    row = db.execute('SELECT config_calibre_dir FROM settings').fetchone()
    if (row[0] if row else None) != '/books':
        db.execute(\"UPDATE settings SET config_calibre_dir='/books'\")
        db.commit(); print('LIBDIR_SET')
    else:
        print('LIBDIR_OK')
    db.close()
    "
  register: _cw_libdir
  when: _cw_ready.status | default(0) in [200, 302]
  changed_when: "'LIBDIR_SET' in (_cw_libdir.stdout | default(''))"
  failed_when: false
  check_mode: false

- name: "[pazny.calibre_web Post] Restart Calibre-Web to load the library"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p iiab restart calibre-web
  when:
    - _cw_ready.status | default(0) in [200, 302]
    - (_cw_lib.changed | default(false)) or (_cw_libdir.changed | default(false))
  changed_when: true
  failed_when: false
