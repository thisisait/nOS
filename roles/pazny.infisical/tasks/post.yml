---
# ==============================================================================
# pazny.infisical/tasks/post.yml — wait na ready + info + KMS self-heal.
# ==============================================================================

- name: "[pazny.infisical Post] Wait for server to be ready"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ infisical_port | default(8075) }}/api/status"
    status_code: [200]
    timeout: 10
  register: _infisical_health
  retries: 20
  delay: 5
  until: _infisical_health.status | default(0) == 200
  failed_when: false

# ── KMS self-heal block ─────────────────────────────────────────────────────
# Symptom (2026-05-11): on the very first blank=true run, Infisical can
# end up with a `kms_root_config` row whose `encryptedRootKey` is NOT
# decryptable by the current ENCRYPTION_KEY. Manual openssl brute-force
# against six derivation candidates (utf-8, hex, padded placeholder,
# SHA-256 variants) all FAIL — proving the seed used yet-another value
# we can't reconstruct from current state. Without intervention the
# container restart-loops forever with `Decipheriv.final` raising
# "Unsupported state or unable to authenticate data".
#
# Self-heal contract: when the initial readiness probe failed AND the
# container logs contain the KMS decrypt signature, drop the orphaned
# row, restart the container, re-probe. KMS root has no user data
# (it's the wrapping key for everything else; on a fresh install only
# Infisical's seed migration has touched it). Drop is therefore safe
# pre-first-user. After truncate, Infisical's startup re-seeds with
# the current ENCRYPTION_KEY → decrypt works.
- name: "[pazny.infisical Post] Self-heal — fetch container logs to detect KMS decrypt failure"
  ansible.builtin.shell: |
    set -o pipefail
    {{ docker_bin }} logs --tail 200 infra-infisical-1 2>&1 \
      | grep -c 'Unsupported state or unable to authenticate data' || echo 0
  args:
    executable: /bin/bash
  register: _infisical_kms_error_count
  when: _infisical_health.status | default(0) != 200
  changed_when: false
  failed_when: false

- name: "[pazny.infisical Post] Self-heal — drop unrecoverable kms_root_config + restart container"
  when:
    - _infisical_health.status | default(0) != 200
    - (_infisical_kms_error_count.stdout | default('0') | int) > 0
  block:
    - name: "[pazny.infisical Post] Self-heal — TRUNCATE kms_root_config"
      ansible.builtin.shell: |
        {{ docker_bin }} exec infra-postgresql-1 psql -U postgres -d infisical -c "TRUNCATE kms_root_config;"
      register: _infisical_kms_truncate
      changed_when: "'TRUNCATE TABLE' in (_infisical_kms_truncate.stdout | default(''))"
      failed_when: _infisical_kms_truncate.rc != 0

    - name: "[pazny.infisical Post] Self-heal — restart Infisical container"
      ansible.builtin.command:
        argv:
          - "{{ docker_bin }}"
          - restart
          - infra-infisical-1
      changed_when: true

    - name: "[pazny.infisical Post] Self-heal — re-probe readiness"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ infisical_port | default(8075) }}/api/status"
        status_code: [200]
        timeout: 10
      register: _infisical_health
      retries: 20
      delay: 5
      until: _infisical_health.status | default(0) == 200
      failed_when: false

- name: "[pazny.infisical Post] Status"
  ansible.builtin.debug:
    msg: >-
      Infisical {{ 'OK' if _infisical_health.status | default(0) == 200
      else 'UNAVAILABLE - docker logs infra-infisical-1' }}
      | Dashboard: https://{{ infisical_domain | default('vault' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}
      | Signup: first user = admin
      {% if (_infisical_kms_error_count.stdout | default('0') | int) > 0 -%}
      | KMS self-heal: triggered (orphaned root key dropped, re-seeded)
      {%- endif %}

# ── Machine identity → fresh admin JWT (A18 follow-up, 2026-05-23) ───────────
# `infisical bootstrap` CLI works only on fresh installs — if Infisical is
# already bootstrapped (admin user exists) but no admin_token is persisted
# in ~/.nos/secrets.yml (operator wiped secrets file, or first install
# pre-dated the A18 capture path), seed.py exits with "admin already
# bootstrapped but no token persisted" and the whole seed chain stops.
#
# Fix: operator creates a Machine Identity ONCE in the Infisical UI
# (Org Settings → Access Control → Identities → New Identity → org role
# Admin → UniversalAuth → New Client Secret), and pastes the resulting
# client_id + client_secret into credentials.yml. From then on, every
# playbook run exchanges those creds for a fresh access token via the
# /api/v1/auth/universal-auth/login endpoint. JWTs are short-lived
# (~30 days default) but we re-mint on every run anyway, so no
# persistence is needed and the long-term token never sits on disk.
#
# Guards: skip when (a) infisical_admin_token already present (legacy
# install with persisted bootstrap token still works), (b) machine
# identity creds empty (operator hasn't done the UI step yet — graceful
# degradation, seed.yml will report missing token).
- name: "[pazny.infisical Post] Exchange machine identity for fresh admin JWT"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ infisical_port | default(8075) }}/api/v1/auth/universal-auth/login"
    method: POST
    headers:
      Content-Type: application/x-www-form-urlencoded
    body_format: form-urlencoded
    body:
      clientId: "{{ infisical_machine_id_client_id }}"
      clientSecret: "{{ infisical_machine_id_client_secret }}"
    return_content: true
    # Tolerate 401/403: after `blank=true` wipes Infisical's DB the stored
    # machine identity no longer exists, so login returns 401. Treating that
    # as a task FAILURE (status_code: 200) hard-aborted the whole playbook on
    # every blank with pre-existing creds. Accept the rejection here and let
    # the warning below route the operator to recovery — Infisical itself is
    # up and usable; only the admin-token seeding defers.
    status_code: [200, 401, 403]
  register: _infisical_machine_auth
  when:
    - _infisical_health.status | default(0) == 200
    - (infisical_admin_token | default('')) | length == 0
    - (infisical_machine_id_client_id | default('')) | length > 0
    - (infisical_machine_id_client_secret | default('')) | length > 0
  no_log: true

- name: "[pazny.infisical Post] Pin admin_token from machine-auth response"
  ansible.builtin.set_fact:
    infisical_admin_token: "{{ _infisical_machine_auth.json.accessToken }}"
  when:
    - _infisical_machine_auth is defined
    - _infisical_machine_auth.json is defined
    - _infisical_machine_auth.json.accessToken | default('') | length > 0
  no_log: true

- name: "[pazny.infisical Post] Warn when stored machine identity is rejected (stale after blank)"
  ansible.builtin.debug:
    msg: |
      ⚠  Infisical rejected the stored machine identity (HTTP {{ _infisical_machine_auth.status | default('?') }} Invalid credentials).
      The clientId/clientSecret in credentials.yml point to an identity that no longer exists —
      almost always because `blank=true` wiped Infisical's DB. Admin-token seeding is skipped this run;
      Infisical is up and usable, but A18 invite-flow Cesta B will skip Infisical writes until recovered.

      Recover with EITHER:
        • ansible-playbook main.yml --tags infisical-reset-admin   (clears the stale creds, then reseed), OR
        • re-create the `nos-seeder` identity in Infisical and paste fresh
          infisical_machine_id_client_id / _client_secret into credentials.yml, then re-run.
  when:
    - _infisical_machine_auth.status | default(0) | int in [401, 403]

- name: "[pazny.infisical Post] Operator hint when token still missing"
  ansible.builtin.debug:
    msg: |
      ⚠  Infisical admin token unresolved — A18 invite-flow Cesta B will skip Infisical writes.

      One-time setup (operator):
        1. Open https://{{ infisical_domain | default('vault.' ~ (tenant_domain | default('dev.local'))) }}
        2. Log in: {{ infisical_admin_email | default('admin@<tld>') }} / {{ infisical_admin_password | default('<set by global_password_prefix>') }}
        3. Org Settings → Access Control → Identities → "Create identity"
           Name: nos-seeder    Role: Admin (organization-level)
        4. Click the new identity → Authentication → UniversalAuth → "Create Client Secret"
           Copy Client ID + Client Secret.
        5. In credentials.yml (gitignored):
             infisical_machine_id_client_id: "<paste>"
             infisical_machine_id_client_secret: "<paste>"
        6. Re-run playbook (or just --tags infisical) — the token is minted
           automatically on every run, no further manual steps.
  when:
    - _infisical_health.status | default(0) == 200
    - (infisical_admin_token | default('')) | length == 0
    - (infisical_machine_id_client_id | default('')) | length == 0

# ── Seed: org + projects + secrets ───────────────────────────────────────────
# Bootstrap admin user + organization on first run, then ensure project tree
# and upsert secrets every run. Gated on `infisical_seed_enabled` (defaults to
# install_infisical). Source-of-truth values come from Ansible vars; Infisical
# is a derived projection of canonical state.
- name: "[pazny.infisical Post] Seed org + projects + secrets"
  ansible.builtin.include_tasks: seed.yml
  when: infisical_seed_enabled | default(install_infisical | default(false)) | bool
