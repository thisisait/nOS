---
# ==============================================================================
# pazny.traefik/vars/main.yml — auth-mode lookup for Tier-1 services.
#
# The auto-derived router list (see templates/dynamic/services.yml.j2) iterates
# every state/manifest.yml entry that has both `domain_var` and `port_var`.
# This map decides which Traefik middleware to attach per service id:
#
#   none   → service handles its own auth (Authentik itself, JWT APIs,
#            services with native OIDC env vars / API config).
#   oidc   → native OIDC was wired into the service via env / API; Traefik
#            does NOT add forward-auth — the service's own login button
#            redirects to Authentik. Same router as `none` in practice;
#            kept distinct for documentation + future per-mode policy.
#   proxy  → service has no native SSO support, so Traefik gates the
#            request via the Authentik forward-auth middleware (mirror
#            of nginx's `include authentik-proxy-locations.conf` pattern,
#            fail-closed semantics — see PENTEST-002).
#
# DEFAULT FOR UNLISTED SERVICES = 'proxy'. Anything new gets gated until
# the operator wires native OIDC or explicitly opts out.
# ==============================================================================

#
# Source of truth for native-OIDC vs proxy-auth: per-plugin `authentik:` block
# in files/anatomy/plugins/<svc>-base/plugin.yml. Blocks with `mode: native_oidc`
# get an OAuth2 provider (= service handles its own login); blocks with
# `mode: forward_auth` get a Proxy provider (= forward_auth via outpost).
# `mode: header_oidc` is a proxy provider that also stamps Remote-User headers.
#
# Matching the wrong mode here breaks login two ways:
#   - oidc service marked as 'proxy' → Authentik outpost has no proxy
#     provider for that Host header → 404 from outpost (not Traefik!)
#   - proxy service marked as 'oidc' → Traefik just forwards anonymous
#     traffic to the upstream → service shows its own (un-gated) login.
traefik_auth_modes:
  # ── No auth (public or self-managed) ───────────────────────────────────────
  authentik: none           # IS the auth provider
  bone: none                # JWT-validated API
  bluesky_pds: none         # AT Protocol federation
  rustfs: none              # S3 API, own credentials
  onlyoffice: none          # DocServer for collab (JWT-secured)
  spacetimedb: none         # binary protocol
  # REM-144: this said "LAN-only via 127.0.0.1 bind" and was FALSE from batch-21
  # until 2026-07-30. The bind is real; it was also irrelevant, because the
  # manifest entry auto-derived an edge router that proxied around it. The id is
  # in traefik_skip_ids now, so no router is rendered and this entry is unreached
  # — kept only so the manifest↔auth-mode gate has something to read.
  traefik: none             # dashboard is NOT routed; see traefik_skip_ids
  offline_maps: none        # public tile server (no Authentik provider entry exists)
  # ntfy: forward-auth REMOVED 2026-08-08, deliberately, so a PHONE can subscribe.
  #
  # A push client is a machine caller: it holds a credential and speaks HTTP. It
  # cannot complete an Authentik browser flow, so `proxy` 302s it and no mobile
  # device can ever receive a notification. Same class as the woodpecker entry
  # above, and CLAUDE.md's own SSO doctrine names it: forward_auth 302's machine
  # callers.
  #
  # WHAT GATES IT INSTEAD, and why this is not a downgrade: until today, nothing
  # did. `auth-default-access: deny-all` was declared with no `auth-file`, so
  # ntfy enforced nothing — anonymous publish AND subscribe both returned 200
  # behind the forward-auth gate, and the admin account the playbook claimed to
  # create had never existed. The gate was real for browsers and irrelevant to
  # anything else. ntfy now has a user database, deny-all is in force, the
  # dispatcher holds a write-only-on-nos-* identity, and the operator's phone
  # authenticates as a real user.
  #
  # THE STANDING CONSTRAINT THAT MAKES THIS SAFE is not on this line: a
  # notification is a POINTER, NOT A PAYLOAD. Nothing sensitive may ride in a
  # title, body or metadata field, because a leaked subscribe credential must
  # cost the operator a list of "something happened" and never the something.
  # Pinned by tests/anatomy/test_a_notification_is_a_pointer.py.
  ntfy: none

  # ── Native OIDC (Authentik OAuth2 provider) ────────────────────────────────
  grafana: oidc
  gitea: oidc
  gitlab: oidc
  n8n: oidc
  nextcloud: oidc
  open_webui: oidc
  openwebui: oidc           # alias spelling guard
  outline: oidc
  portainer: oidc
  vaultwarden: oidc
  woodpecker: oidc          # app-auth via Gitea OAuth — NOT forward-auth gated.
                            # A forward_auth gate would be the documented
                            # double-login anti-pattern (CLAUDE.md "Forward-auth
                            # ≠ native-OIDC double-protection") AND it 302's the
                            # playbook's own Woodpecker API post-wiring. The
                            # unauth SPA shell loads but every API call 401s and
                            # login redirects to Gitea OAuth — no data exposure.
                            # (Audit 2026-06-13 flagged BYPASS; re-judged: app
                            # auth is the gate here, route-gating is wrong.)
  hedgedoc: oidc
  bookstack: oidc
  superset: oidc            # SUPERSET_AUTH_TYPE=AUTH_OAUTH
  homeassistant: oidc       # Auth provider plugin
  jellyfin: oidc            # SSO-Auth plugin
  wordpress: oidc           # OpenID Connect Generic plugin
  erpnext: oidc             # Frappe OAuth2 social_login_keys
  freescout: oidc           # OAuth Module
  infisical: proxy          # CE org-OIDC is enterprise-licensed (inert on CE) → gate at the
                            # edge with authentik@file forward-auth, else this Tier-1 vault is
                            # UNGATED (live-verified 2026-06-02). Flip back to oidc only with an
                            # Infisical Enterprise license + a working oidc_configs row.
  miniflux: oidc            # OAUTH2_PROVIDER=oidc
  nodered: oidc             # β1.B 2026-05-05 — passport-openidconnect adminAuth
                            # in /data/settings.js; service handles its own
                            # OIDC redirect, no outpost needed.

  # ── Proxy (Authentik forward-auth via outpost) ─────────────────────────────
  # Includes both:
  #   - true forward-auth gates (uptime_kuma, kiwix, etc.): no per-user state
  #     in service; Authentik session = "you're in".
  #   - header_oidc services (firefly): outpost MUST stay in path so it
  #     injects REMOTE_USER / REMOTE_EMAIL headers that the service uses to
  #     auto-create the local account. β1.A doctrine: the proxy provider
  #     entry in Authentik is required, so traefik_auth_mode stays `proxy`.
  metabase: proxy
  uptime_kuma: proxy
  calibre_web: proxy
  kiwix: proxy
  paperclip: proxy
  wing: proxy
  code_server: proxy
  # ntfy moved to the `none` block above (2026-08-08) — a push client cannot do
  # an Authentik browser flow. Its comment here read "has its own user DB but
  # admin UI is gated"; the user DB did not exist, which is the other half of
  # why this had to change.
  firefly: proxy
  keap: proxy               # header_oidc — outpost must stay in path to inject
                            # X-Authentik-* identity headers (firefly pattern)
  face: proxy               # forward_auth — outpost injects X-Authentik-* which
                            # the face BFF reads (behind X-Face-Edge-Token trust)
  influxdb: proxy           # admin UI gated; token-based API still works
  mailpit: proxy            # admin tier
  mcp_gateway: proxy
  openclaw: proxy
  hermes: proxy
  qgis_server: proxy

  # Everything else falls through to 'proxy' as a safe default — but the
  # explicit catalog above should already cover every manifest entry.

# REM-144: a routed service with auth_mode 'none' is anonymously reachable at the
# edge. Until this map existed, the ONLY thing standing behind such a decision was
# an inline comment — and `traefik: none  # LAN-only via 127.0.0.1 bind` was false
# for months with nothing comparing it to the router actually rendered.
#
# The rule (tests/anatomy/test_traefik_exposure_justified.py): every manifest entry
# with domain_var + port_var that is NOT in traefik_skip_ids and resolves to 'none'
# MUST appear here. A comment is not a justification; this is.
#
# Deliberately absent: traefik itself. It is in traefik_skip_ids, and if anyone
# removes it from there the gate fails — which is the whole point.
traefik_auth_none_justification:
  ntfy: >-
    A push client is a machine caller: it holds a credential and speaks HTTP, and
    cannot complete an Authentik browser flow — forward-auth 302s it, so no phone
    could ever receive a notification. Same class as woodpecker. ntfy
    authenticates subscribers itself (auth-file + deny-all + per-topic ACLs, all
    of which were declared and INERT until 2026-08-08 because no auth-file
    existed — anonymous publish AND subscribe both returned 200 behind the
    forward-auth gate, so the gate protected browsers and nothing else). The
    dispatcher holds a write-only-on-nos-* identity; the operator's phone
    authenticates as a real user. Safety rests on the standing rule that a
    notification is a POINTER, NOT A PAYLOAD — nothing sensitive in a title, body
    or metadata — so a stolen subscribe credential costs a list of "something
    happened" and never the something. Pinned by
    tests/anatomy/test_a_notification_is_a_pointer.py.
  authentik: >-
    IS the auth provider. Gating Authentik behind Authentik is a bootstrap
    deadlock; it ships its own login flow, MFA policy and RBAC.
  onlyoffice: >-
    DocServer is called by Nextcloud/BookStack/Outline server-side and secured by
    a shared JWT (onlyoffice_jwt_secret); a browser session gate would break the
    editor iframe without adding a check the JWT does not already make.
  rustfs: >-
    S3 API with its own signed-request credentials. A forward-auth gate cannot be
    satisfied by an S3 client and would break every backup target.
  offline_maps: >-
    Public tile server by design — read-only, no user data, no Authentik provider
    entry exists for it.

# Service ids to skip even if their install flag is on (no Traefik router).
# These either expose a non-HTTP protocol or are intentionally LAN-only.
# Keep in mind: removing entries here exposes services on Traefik routes —
# make sure their auth_mode above is set sensibly first.
traefik_skip_ids:
  - bone             # Bone is on host; published only on 127.0.0.1; reach via Wing UI
  - cortex           # Reasoning organ: pure loopback by design (no route unless explicitly opted in)
  # REM-144 (CRITICAL, live-confirmed 2026-07-30): Traefik's own dashboard/API.
  # state/manifest.yml gives this id domain_var + port_var, so services.yml.j2
  # auto-derived a websecure router with NO authentik@file, upstream = the Docker
  # host-gateway — i.e. Traefik proxied around the 127.0.0.1:8082 bind that was
  # supposed to protect it. api.insecure:true then made the ENTIRE API anonymous
  # over 443, and /api/http/middlewares serves rendered customRequestHeaders
  # verbatim: both SEC-6 edge tokens, one of which carries the password prefix.
  # Reach the dashboard at http://127.0.0.1:{{ traefik_dashboard_port }} instead.
  - traefik

# Service ids whose CONTAINER listener is HTTPS (not HTTP). Traefik upstream
# URL gets the https:// prefix and `serversTransport: noverify` so the
# self-signed dev cert is tolerated.
#
# Doctrine: docs/doctrine/foreign-properties.md §3.1 — an upstream is HTTP until
# measured otherwise, and a port number is not evidence. §3 records why: the
# LSIO code-server image serves PLAIN HTTP on 8443 unless `--cert` is passed,
# which nOS does not; the entry that used to sit here made Traefik open a TLS
# handshake the upstream answered in HTTP (`tls_get_more_records: packet length
# too long`, a 502/404 on code.pazny.eu, removed 2026-05-04).
#
# EMPTY IS THE CURRENT CORRECT ANSWER, not a gap: every routed upstream in this
# estate terminates TLS at the edge and speaks HTTP behind it. Adding an id
# requires measured evidence of an internal TLS listener, registered in
# tests/anatomy/test_traefik_https_upstream_binds_tls.py.
traefik_https_upstream_ids: []

# Special-case routes that don't follow the manifest auto-derivation pattern.
# Added to the rendered services.yml verbatim — bypass the manifest loop.
#
# Note: do NOT also list a service id here that already has a manifest entry
# with domain_var + port_var — the auto-loop will already emit a router and
# adding another with the same id breaks YAML parsing (mapping key duplicate).
# `traefik` is a manifest entry (domain_var=traefik_domain, port_var=traefik_dashboard_port)
# so the dashboard route is auto-derived; no extra_routers entry needed.
#
# auth: proxy here would require the operator to register a matching Authentik
# proxy provider for the Host header, otherwise the outpost returns 404. Use
# 'none' for things that already gate themselves or 'oidc' for endpoints with
# native OIDC support.
traefik_extra_routers: []

# Service ids whose backend is the host (bind on 0.0.0.0 or 127.0.0.1) — use
# `nos-host:<port>`. Everything else uses the same alias too because every
# Docker compose template publishes its primary port via 127.0.0.1:<port>:<int>.
# This map is informational; the template emits `nos-host:<port>` uniformly.
traefik_host_services:
  - openclaw
  - hermes

# ── A19 (2026-05-23): container-name routing (fixes IPv6 host-gateway 502) ───
# Docker Desktop began resolving the `host-gateway` alias (nos-host) to an
# IPv6 address that the IPv4-only Traefik container can't route → every
# `nos-host:<port>` upstream returned 502 "Network unreachable". Worse, the
# IPv4 host-gateway reaches HOST processes (wing) but NOT Docker-published
# loopback ports (verified). So:
#   • containerized services → reach the container DIRECTLY on shared_net via
#     its compose service name + INTERNAL port (proven: grafana:3000 works).
#   • host daemons (wing/openclaw/hermes — not in the map) → the explicit IPv4
#     host-gateway (traefik_host_gateway_ip), which DOES reach host loopback.
#
# traefik_container_upstreams: manifest-id → { svc: <shared_net alias =
# compose service name>, port: <internal/container port> }. Ground-truth from
# the running containers' published host→private mappings. `svc` defaults to
# the id with underscores→dashes; only override where the compose service name
# differs (tileserver/mcpo/authentik-server/woodpecker-server). Services NOT
# listed fall back to host-gateway routing (host daemons).
traefik_host_gateway_ip: "192.168.65.254"   # Docker Desktop host gateway (IPv4); override per host
traefik_container_upstreams:
  grafana:       { port: 3000 }
  gitea:         { port: 3000 }
  gitlab:        { port: 80 }
  woodpecker:    { svc: woodpecker-server, port: 8000 }
  authentik:     { svc: authentik-server, port: 9000 }
  infisical:     { port: 8080 }
  portainer:     { port: 9000 }
  vaultwarden:   { port: 80 }
  nextcloud:     { port: 80 }
  outline:       { port: 3000 }
  metabase:      { port: 3000 }
  superset:      { port: 8088 }
  open_webui:    { svc: open-webui, port: 8080 }
  jellyfin:      { port: 8096 }
  miniflux:      { port: 8080 }
  hedgedoc:      { port: 3000 }
  bookstack:     { port: 80 }
  firefly:       { port: 8080 }
  onlyoffice:    { port: 80 }
  ntfy:          { port: 80 }
  keap:          { port: 8080 }
  face:          { port: 5090 }
  kiwix:         { port: 8080 }
  nodered:       { port: 1880 }
  n8n:           { port: 5678 }
  uptime_kuma:   { svc: uptime-kuma, port: 3001 }
  calibre_web:   { svc: calibre-web, port: 8083 }
  homeassistant: { port: 8123 }
  rustfs:        { port: 9001 }
  mailpit:       { port: 8025 }
  qgis_server:   { svc: qgis-server, port: 80 }
  offline_maps:  { svc: tileserver, port: 8080 }
  mcp_gateway:   { svc: mcpo, port: 8000 }
  wordpress:     { port: 80 }
  code_server:   { svc: code-server, port: 8443 }
  freescout:     { port: 80 }
  paperclip:     { port: 3100 }
  snappymail:    { port: 8888 }
  influxdb:      { port: 8086 }
