---
# ==============================================================================
# pazny.traefik — Traefik edge reverse proxy (binds 80/443).
#
# Two providers:
#   docker — Tier-2 apps (onboarded via apps_runner) auto-discovered by labels.
#   file   — Tier-1 services (existing pazny.* roles) auto-derived from
#            state/manifest.yml + install_* flags. One YAML rendered into
#            {{ traefik_dynamic_dir }}/services.yml; Traefik watches it for
#            hot-reload.
#
# Authentik forward-auth is a file-provider middleware in
# {{ traefik_dynamic_dir }}/middlewares.yml — fail-closed (PENTEST-002).
# ==============================================================================

# traefik_dashboard_route_enabled lives in default.config.yml: the service
# registry reads it outside this role, where a role default is out of scope.

# http(s)://<host ip> redirects to the face (face_domain) instead of a 404 —
# the address a LAN visitor types first. Needs install_face.
traefik_bare_ip_redirect: true

# Config tree on the host. Bind-mounted into the container.
traefik_dynamic_dir: "{{ traefik_config_dir }}/conf.d"
traefik_certs_dir:   "{{ tls_cert_dir | default(stacks_dir + '/infra/tls') }}"
traefik_log_dir:     "{{ traefik_config_dir }}/log"

traefik_mem_limit: "{{ docker_mem_limit_standard | default('1g') }}"
traefik_cpus: "{{ docker_cpus_standard | default('1.0') }}"

# Networks Traefik joins. shared_net = Tier-2 apps; per-stack nets = Tier-1
# upstream containers. host-gateway gives access to host loopback for services
# that publish on 127.0.0.1:<port> (most of the catalog).
traefik_networks:
  - infra_net
  - "{{ stacks_shared_network | default('shared_net') }}"
  # SEC-02 gated nets — Traefik must share a network with the header-trust
  # backends it routes (calibre-web/2FAuth on gated_net; firefly on gated_b2b_net)
  # so Docker DNS + file-provider routing resolve them once they leave shared_net.
  - gated_net
  - gated_b2b_net
