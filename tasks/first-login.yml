---
# Every declared identity (nos_identities, realm authentik) gets its account in
# every SSO app on the FIRST install: tools/nos-first-login.py logs it in once
# and walks each enabled plugin's authentik.first_login. Native/header OIDC
# apps create users only at a first SSO login; before this, an app a person
# never opened had no account for them. A failed walk fails the run. The
# synthetic identities walk only while nos_test_users_enabled; apps above an
# identity's tier are skipped (RBAC refuses them by design). nos_extra_identities walk too,
# with their INITIAL password: refused = the person owns it now (fine);
# accepted = still on a password the master derives (named, every run).
- name: "[Identities] Create every declared account in every SSO app"
  ansible.builtin.command:
    argv: "{{ [nos_tools_python, playbook_dir ~ '/tools/nos-first-login.py', '--auth-host=' ~ authentik_domain]
              + (['--insecure'] if (tenant_domain_is_local | default(true) | bool) else []) }}"
  environment:
    NOS_FIRST_LOGIN: >-
      {% set out = [] %}{% for i in nos_identities + (nos_synthetic_identities | default([])
      if (nos_test_users_enabled | default(false) | bool) else []) if 'authentik' in (i.realms | default([])) %}{%
      set _ = out.append({'name': i.name, 'tier': i.tier, 'password': lookup('vars', i.password_var)}) %}{%
      endfor %}{% for i in nos_extra_identities | default([]) %}{%
      set _ = out.append({'name': i.name, 'tier': i.tier, 'password': nos_extra_identity_passwords[i.name],
                          'own_password': true}) %}{%
      endfor %}{{ out | to_json }}
  register: _first_login
  changed_when: false
  failed_when: false
  no_log: true   # env carries the passwords

- name: "[Identities] Accounts per app"
  ansible.builtin.debug:
    msg: "{{ _first_login.stdout_lines | default([]) + (_first_login.stderr_lines | default([])) }}"

- name: "[Identities] Every declared account reached its app"
  ansible.builtin.assert:
    that: _first_login.rc | default(1) == 0
    fail_msg: "A declared identity could not sign in to an app — see the FAIL lines above."
    quiet: true

# Outline takes no role from OIDC; its first sign-in became admin — a tier-3
# tester on 2026-10-01. Now that the accounts exist, its admins are made
# exactly Authentik's tier-1 people (tools/outline-roles.py).
- name: "[Identities] Outline admins are the tier-1 people"
  ansible.builtin.command:
    argv: "{{ [nos_tools_python, playbook_dir ~ '/tools/outline-roles.py',
               '--authentik=http://127.0.0.1:' ~ (authentik_port | default(9003))]
              + (authentik_rbac_tiers | selectattr('tier', 'equalto', 1) | map(attribute='groups') | first
                 | map('regex_replace', '^', '--group=') | list) }}"
  environment:
    AUTHENTIK_TOKEN: "{{ authentik_bootstrap_token }}"
  register: _outline_roles
  changed_when: "' set ' in _outline_roles.stdout"
  when: install_outline | default(false) | bool
  no_log: true   # env carries the API token

- name: "[Identities] Outline role changes"
  ansible.builtin.debug:
    msg: "{{ (_outline_roles.stdout_lines | default([])) | map('regex_replace', '[^ ]+@', '…@') | list }}"
  when: install_outline | default(false) | bool
