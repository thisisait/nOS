---
# The medulla's own credentials (row wing-apply-through-medulla, slice 1b; rulings 2026-11-11 custody,
# 2026-11-14 a second token, 2026-11-14 (a) generated): the Bone client secret of nos-medulla and the
# wing-intents bearer. GENERATED, never derived; read from custody when present, else openssl rand,
# then written to custody: /etc/nos/medulla.env root:<group> 0640 on Linux, a login-Keychain item on
# macOS. Never ~/.nos/secrets.yml. Runs before any blueprint render (tagged always) so the Authentik
# registration and the Wing token row read the same value the medulla does.

- name: "[Medulla custody] Read /etc/nos/medulla.env (Linux)"
  ansible.builtin.slurp:
    path: /etc/nos/medulla.env
  register: _medulla_env_file
  become: true
  failed_when: false
  no_log: true
  when: ansible_facts['system'] == 'Linux'
  tags: ['always']

- name: "[Medulla custody] Read the Keychain items (macOS)"
  ansible.builtin.command:
    argv: [security, find-generic-password, -a, nos, -s, "nos.medulla.{{ item }}", -w]
  loop: [bone-client-secret, wing-intents-token]
  register: _medulla_keychain
  changed_when: false
  failed_when: false
  no_log: true
  when: ansible_facts['system'] == 'Darwin'
  tags: ['always']

- name: "[Medulla custody] The values: custody first, else generated"
  ansible.builtin.set_fact:
    medulla_bone_client_secret: "{{ _held.MEDULLA_BONE_CLIENT_SECRET if (_held.MEDULLA_BONE_CLIENT_SECRET | default('') | length) >= 32 else lookup('pipe', 'openssl rand -hex 32') }}"
    wing_intents_token: "{{ _held.WING_INTENTS_TOKEN if (_held.WING_INTENTS_TOKEN | default('') | length) >= 32 else lookup('pipe', 'openssl rand -hex 32') }}"
    _medulla_custody_had: "{{ _held }}"
  vars:
    _env_lines: "{{ ((_medulla_env_file.content | default('') | b64decode) if (_medulla_env_file.content is defined) else '').splitlines() }}"
    _from_env: >-
      {%- set d = {} -%}
      {%- for l in _env_lines if '=' in l and not l.startswith('#') -%}
        {%- set _ = d.update({l.split('=', 1)[0] | trim: l.split('=', 1)[1] | trim}) -%}
      {%- endfor -%}{{ d }}
    _kc: "{{ _medulla_keychain.results | default([]) }}"
    _from_keychain:
      MEDULLA_BONE_CLIENT_SECRET: "{{ (_kc | selectattr('item', 'equalto', 'bone-client-secret') | map(attribute='stdout') | first | default('')) if _kc else '' }}"
      WING_INTENTS_TOKEN: "{{ (_kc | selectattr('item', 'equalto', 'wing-intents-token') | map(attribute='stdout') | first | default('')) if _kc else '' }}"
    _held: "{{ _from_keychain if ansible_facts['system'] == 'Darwin' else _from_env }}"
  no_log: true
  tags: ['always']

- name: "[Medulla custody] /etc/nos exists (Linux)"
  ansible.builtin.file:
    path: /etc/nos
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: ansible_facts['system'] == 'Linux'
  tags: ['always']

# Group: the medulla's run-as (nos_system_user) when set, else the operator's primary group (a
# systemd --user medulla). Root owns it, so the medulla can read it and never rewrite it.
- name: "[Medulla custody] Write /etc/nos/medulla.env (Linux)"
  ansible.builtin.copy:
    dest: /etc/nos/medulla.env
    content: |
      # GENERATED by tasks/medulla-custody.yml: the medulla's own credentials. Root-owned; never in ~/.nos.
      MEDULLA_BONE_CLIENT_SECRET={{ medulla_bone_client_secret }}
      WING_INTENTS_TOKEN={{ wing_intents_token }}
    owner: root
    group: "{{ nos_system_user if (nos_system_user | default('') | length) else ansible_facts['user_gid'] }}"
    mode: '0640'
  become: true
  no_log: true
  when: ansible_facts['system'] == 'Linux'
  tags: ['always']

# ponytail: `security add-generic-password -w <value>` puts the value in this process's argv for its
# lifetime (same-user `ps`); upgrade = a Keychain write through stdin (no flag for it today).
- name: "[Medulla custody] Write the Keychain items (macOS)"
  ansible.builtin.command:
    argv: [security, add-generic-password, -U, -a, nos, -s, "nos.medulla.{{ item.name }}", -w, "{{ item.value }}"]
  loop:
    - { name: bone-client-secret, value: "{{ medulla_bone_client_secret }}", held: "{{ _medulla_custody_had.MEDULLA_BONE_CLIENT_SECRET | default('') }}" }
    - { name: wing-intents-token, value: "{{ wing_intents_token }}", held: "{{ _medulla_custody_had.WING_INTENTS_TOKEN | default('') }}" }
  loop_control:
    label: "nos.medulla.{{ item.name }}"
  when:
    - ansible_facts['system'] == 'Darwin'
    - item.held != item.value
  changed_when: true
  no_log: true
  tags: ['always']

- name: "[Medulla custody] Both credentials hold a value"
  ansible.builtin.assert:
    that:
      - (medulla_bone_client_secret | length) >= 32
      - (wing_intents_token | length) >= 32
    fail_msg: "the medulla's credentials resolved empty: nos-medulla and wing-intents would register with no secret"
    quiet: true
  no_log: true
  tags: ['always']
