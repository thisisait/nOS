---
# =============================================================================
# tasks/gdpr-forget.yml — GDPR Art. 17 right-to-erasure fan-out.
# =============================================================================
# Opt-in (main.yml imports this under tags ['gdpr-forget','never']):
#   DRY-RUN (default — prints the plan, deletes NOTHING, logs a gdpr_dsar row):
#     ansible-playbook main.yml --tags gdpr-forget -e forget_subject=user@tld
#   EXECUTE:
#     ansible-playbook main.yml --tags gdpr-forget -e forget_subject=user@tld \
#       -e forget_confirm=true
#
# The audited destructive-command list is state/gdpr-erasure-map.yml. Authentik
# (the identity anchor) + container_exec entries run automatically on a
# confirmed run; `manual` entries are always REPORTED (the operator runs the
# printed step). Every run logs a gdpr_dsar row (request_type=erase) — the legal
# audit record — and is attributable in Wing's events trail. See
# docs/security-baseline.md §4.
# =============================================================================

- name: "[GDPR forget] Validate data subject (strict email — no shell metacharacters)"
  ansible.builtin.assert:
    that:
      - forget_subject is defined
      # Strict RFC-ish email; rejects spaces/;/`/$/&/| etc. forget_subject is
      # interpolated into a container_exec one-liner, so 'a@b; rm -rf / #' must
      # NEVER pass this gate (host-RCE guard on the confirmed-erasure path).
      - forget_subject | string | regex_search('^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$') is not none
    fail_msg: "Set -e forget_subject=<plain email> (no shell metacharacters)."
    quiet: true

- name: "[GDPR forget] Resolve confirm flag (default dry-run)"
  ansible.builtin.set_fact:
    _forget_confirm: "{{ forget_confirm | default(false) | bool }}"

- name: "[GDPR forget] Load audited erasure map"
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/state/gdpr-erasure-map.yml"
    name: _erasure

- name: "[GDPR forget] Build plan from services enabled for this tenant"
  ansible.builtin.set_fact:
    _forget_plan: "{{ _forget_plan | default([]) + [item] }}"
  loop: "{{ _erasure.services }}"
  loop_control:
    label: "{{ item.id }}"
  when: item.flag == 'always' or (lookup('vars', item.flag, default=false) | bool)

- name: "[GDPR forget] Erasure plan banner"
  ansible.builtin.debug:
    msg: >-
      {{ '*** EXECUTE — deletions will run ***' if _forget_confirm
         else 'DRY-RUN — nothing will be deleted (add -e forget_confirm=true to execute)' }}
      | subject={{ forget_subject }}
      | {{ _forget_plan | default([]) | length }} services in scope:
      {{ _forget_plan | default([]) | map(attribute='id') | list }}

- name: "[GDPR forget] Per-service plan detail"
  ansible.builtin.debug:
    msg: "{{ item.id }} [{{ item.method }}] — {{ item.note }}"
  loop: "{{ _forget_plan | default([]) }}"
  loop_control:
    label: "{{ item.id }}"

# ── Legal audit record — INTAKE (always, even on dry-run) ────────────────────
# Art. 12(3): record that the request landed BEFORE touching anything. A
# confirmed run transitions this same row to its real terminal status after the
# executors finish (see "terminal status" below) — we never pre-stamp
# 'completed' while 19/22 services are still only reported.
- name: "[GDPR forget] Record DSAR intake row (status=received)"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      printf '%s' "$NOS_DSAR_JSON" | php bin/record-dsar.php --json=-
    chdir: "{{ wing_app_dir }}"
    executable: /bin/bash
  environment:
    NOS_DSAR_JSON: >-
      {{ {
            'subject_email': forget_subject,
            'request_type': 'erase',
            'status': 'received',
            'processing_ids': (_forget_plan | default([]) | map(attribute='id') | list),
            'notes': (_forget_confirm
                      | ternary('Erasure run started — terminal status set after executors.',
                                'Dry-run: plan logged, no deletion performed.'))
         } | to_json }}
  register: _dsar_rec
  changed_when: "'OK recorded' in (_dsar_rec.stdout | default(''))"
  failed_when: false
  when: install_wing | default(true) | bool

- name: "[GDPR forget] Capture DSAR row id (for terminal-status update)"
  ansible.builtin.set_fact:
    # regex_search WITHOUT a backref arg returns the SCALAR match, not a list:
    # the '\\1'-backref form returns ['42'] -> "--update=['42']" -> record-dsar
    # casts to 0 -> the terminal update silently no-ops (row stuck at 'received').
    _dsar_id: "{{ (_dsar_rec.stdout | default('') | regex_search('(?<=#)[0-9]+')) | default('', true) }}"
  when: install_wing | default(true) | bool

# ── Executor: Authentik (identity anchor) ────────────────────────────────────
- name: "[GDPR forget] Authentik — look up user by email"
  ansible.builtin.uri:
    url: "https://{{ authentik_domain | default('auth.' ~ (tenant_domain | default('dev.local'))) }}/api/v3/core/users/?email={{ forget_subject | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token | default('') }}"
    validate_certs: false
    status_code: [200]
  register: _ak_user
  failed_when: false
  no_log: true
  when:
    - _forget_confirm
    - (_forget_plan | default([]) | selectattr('method', 'eq', 'authentik_api') | list | length) > 0

# Authentik's ?email= filter is contains/iexact and CAN return MULTIPLE users —
# select ONLY the single EXACT-email match before an IRREVERSIBLE delete. The
# read-only export sibling already does this; deleting `results | first` could
# erase a DIFFERENT data subject's identity anchor (a fresh Art-5/Art-32 breach)
# and then stamp the DSAR 'completed'.
- name: "[GDPR forget] Authentik — select single exact-match user"
  ansible.builtin.set_fact:
    _ak_match: >-
      {{ (_ak_user.json.results | default([])
          | selectattr('email', 'equalto', forget_subject) | list | first) | default({}, true) }}
  no_log: true
  when:
    - _forget_confirm
    - _ak_user.json is defined

- name: "[GDPR forget] Authentik — delete the exact-match user"
  ansible.builtin.uri:
    url: "https://{{ authentik_domain | default('auth.' ~ (tenant_domain | default('dev.local'))) }}/api/v3/core/users/{{ _ak_match.pk }}/"
    method: DELETE
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token | default('') }}"
    validate_certs: false
    status_code: [204, 404]
  register: _ak_delete
  failed_when: false
  no_log: true
  when:
    - _forget_confirm
    - (_ak_match | default({})) != {}

# ── Executor: container_exec (email-keyed one-liners) ────────────────────────
- name: "[GDPR forget] container_exec — resolve container + run delete"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      CID=$(docker ps -q
        --filter "label=com.docker.compose.project={{ item.stack }}"
        --filter "label=com.docker.compose.service={{ item.service }}" | head -1);
      if [ -z "$CID" ]; then echo "SKIP {{ item.id }}: no running container"; exit 0; fi;
      docker exec "$CID" {{ item.command }}
    executable: /bin/bash
  loop: "{{ _forget_plan | default([]) | selectattr('method', 'eq', 'container_exec') | list }}"
  loop_control:
    label: "{{ item.id }}"
  register: _cexec
  changed_when: "'SKIP' not in (_cexec.stdout | default('SKIP'))"
  failed_when: false
  when: _forget_confirm

# ── manual services — operator action required (printed in dry-run + execute) ─
- name: "[GDPR forget] MANUAL erasure required (run the printed step)"
  ansible.builtin.debug:
    msg: "MANUAL erase for {{ item.id }} ({{ forget_subject }}): {{ item.note }}"
  loop: "{{ _forget_plan | default([]) | selectattr('method', 'eq', 'manual') | list }}"
  loop_control:
    label: "{{ item.id }}"

# ── Terminal status — record what ACTUALLY happened (Art. 12(3)) ─────────────
# 'completed' ONLY when every in-scope store was truly erased: zero manual steps
# pending, zero container_exec SKIP/failure, AND the Authentik leg is genuinely
# ok. The Authentik leg is ok iff: not in scope, OR the lookup was REACHABLE
# (status==200 — an unreachable/5xx lookup must NOT vacuously pass, else a run
# that never reached Authentik would claim completion) AND either there was no
# exact-email match (subject legitimately absent) or the exact-match delete
# returned 204/404. Otherwise 'in-progress'.
- name: "[GDPR forget] Compute terminal DSAR status"
  ansible.builtin.set_fact:
    _forget_terminal: >-
      {{ 'completed'
         if (
              (_forget_plan | default([]) | selectattr('method', 'eq', 'manual') | list | length) == 0
              and (_cexec.results | default([]) | selectattr('stdout', 'defined')
                   | selectattr('stdout', 'search', 'SKIP') | list | length) == 0
              and (_cexec.results | default([]) | rejectattr('rc', 'eq', 0) | list | length) == 0
              and (
                   ((_forget_plan | default([]) | selectattr('method', 'eq', 'authentik_api') | list | length) == 0)
                   or (
                        (_ak_user.status | default(0) == 200)
                        and (
                             ((_ak_match | default({})) == {})
                             or (_ak_delete.status | default(0) in [204, 404])
                        )
                   )
              )
            )
         else 'in-progress' }}
  when: _forget_confirm

- name: "[GDPR forget] Update DSAR row to terminal status"
  ansible.builtin.command:
    argv:
      - php
      - bin/record-dsar.php
      - "--update={{ _dsar_id }}"
      - "--status={{ _forget_terminal }}"
      - "--notes={{ 'Erasure run: auto-executed='
          ~ (_forget_plan | default([]) | selectattr('method', 'in', ['authentik_api', 'container_exec']) | list | length)
          ~ ', manual-pending=' ~ (_forget_plan | default([]) | selectattr('method', 'eq', 'manual') | list | length)
          ~ '. Terminal=' ~ _forget_terminal ~ '.' }}"
    chdir: "{{ wing_app_dir }}"
  register: _dsar_upd
  changed_when: "'OK updated' in (_dsar_upd.stdout | default(''))"
  failed_when: false
  when:
    - _forget_confirm
    - install_wing | default(true) | bool
    - (_dsar_id | default('') | length) > 0

- name: "[GDPR forget] Summary"
  ansible.builtin.debug:
    msg: >-
      {{ ('ERASURE ' ~ (_forget_terminal | default('in-progress') | upper)) if _forget_confirm else 'DRY-RUN COMPLETE' }}
      for {{ forget_subject }}.
      Auto-executed: {{ _forget_plan | default([]) | selectattr('method', 'in', ['authentik_api', 'container_exec']) | list | length }};
      manual steps {{ 'pending (run the printed steps, then the DSAR closes)' if _forget_confirm else 'reported' }}:
      {{ _forget_plan | default([]) | selectattr('method', 'eq', 'manual') | list | length }}.
      DSAR row {{ 'updated to ' ~ (_forget_terminal | default('in-progress')) if _forget_confirm else 'logged (received)' }}.
      {{ '' if _forget_confirm else 'Re-run with -e forget_confirm=true to execute.' }}
