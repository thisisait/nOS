---
# ==============================================================================
# BLANK RESET - clean reinstall of all services
#
# Run: ansible-playbook main.yml -K -e blank=true
#
# What gets DELETED:
#   - Docker containers, volumes, compose files
#   - Service configurations (nginx sites, SSL certs, dnsmasq, alloy)
#   - Service data directories (DB, app data, observability data)
#   - LaunchAgents (exporters, openclaw)
#
# What is KEPT:
#   - USER SOURCE FILES — ~/nos/tenants/<slug>/users/** (the class-3 Bone VFS
#     tree). blank = "reset DERIVED state, PRESERVE SOURCE" (operator decision
#     2026-07-19). Removing user files is `uninstall`, a separate manifest-driven
#     path — NOT blank. See docs/plans/blank-uninstall-managed-resources.md.
#     (Derived KEAP /data IS wiped above so KEAP re-syncs from the kept source.)
#   - ~/media/ (movies, series, music) - user data
#   - ~/calibre/ (library) - user data
#   - ~/.ollama/ (models, tens of GB) - manual delete: rm -rf ~/.ollama
#   - Homebrew packages - kept, services just restart
#   - Shell configuration (.zshrc blocks) - overwritten during reinstall
# ==============================================================================

# ── 0. The removal inventory (external paths, auto-deps, _blank_dirs) is
# resolved by tasks/removal-set.yml, imported from the run-mode phase BEFORE
# this file. The assert below proves it ran (this file is only reachable via
# the run-mode phase — main.yml imports it after the confirm gate).
- name: "[BLANK] Assert the removal set was resolved (tasks/removal-set.yml)"
  ansible.builtin.assert:
    that:
      - _blank_dirs is defined
    fail_msg: >-
      _blank_dirs is undefined — tasks/removal-set.yml did not run. blank-reset
      must only be reached through the run-mode phase (main.yml), never
      imported directly.

# ── 1. Confirmation ─────────────────────────────────────────────────────
- name: "[BLANK/FLUSH] Confirm destructive operation"
  ansible.builtin.pause:
    prompt: |-

      ╔══════════════════════════════════════════════════════════════════════╗
      ║  REMOVE={{ remove | default('data') | upper }} — DELETE ALL DATA AND CONFIGURATIONS       ║
      ║                                                                    ║
      ║  Will be deleted:                                                  ║
      ║    - All Docker containers and volumes                             ║
      ║    - Databases (MariaDB), app data (Nextcloud, Gitea, n8n...)      ║
      ║    - Nginx configuration and SSL certificates                      ║
      ║    - Observability data (Grafana, Prometheus, Loki, Tempo)         ║
      ║    - Uptime Kuma monitors, Portainer settings                      ║
      ║  {{ "- Docker images + build cache (remove=deep)" if _flush_deep | default(false) | bool else "(remove=data: Docker images kept)" }}
      ║                                                                    ║
      ║  Will remain:                                                      ║
      ║    - ~/media/ (movies, music), ~/calibre/ (books)                  ║
      ║    - ~/.ollama/ (models — add flush_ollama=true to wipe)           ║
      ║    - ~/nos/tenants/** user files (remove=all is the ONLY level     ║
      ║      that deletes them — a separate pause guards it)               ║
      ║  {{ "- Homebrew packages kept (remove=deep also clears the cache)" if _flush_deep | default(false) | bool else "- Homebrew packages and cache (services just restart)" }}
      ║                                                                    ║
      ║  {{ "After removal the play ENDS (leave=true) — no reinstall." if nos_leaving | default(false) | bool else "After reset the playbook reinstalls everything with clean data." }}
      ╚══════════════════════════════════════════════════════════════════════╝

       Press ENTER to continue or Ctrl+C -> A to cancel
  when: not nos_assume_yes

# ── Plugin loader — post_blank hook (A6, 2026-05-03) ──────────────────
# Runs BEFORE the data-dir wipe so plugins can do orderly cleanup of
# their owned filesystem state (provisioning dirs, cached downloads).
# Audit-log rows in wing.db are NEVER cleared (regulatory requirement,
# enforced inside the loader). Reverse-topological order so consumers
# clean before sources.
- name: "[BLANK] Plugin loader — post_blank hook"
  nos_plugin_loader:
    hook: post_blank
    plugins_root: "{{ playbook_dir }}/files/anatomy/plugins"
    apps_root: "{{ playbook_dir }}/apps"
    agent_profiles_root: "{{ playbook_dir }}/files/anatomy/agents"
    template_vars: "{{ vars }}"
  tags: ['blank', 'reset', 'anatomy.plugins']
  failed_when: false  # blank must continue even if plugin cleanup misbehaves

# ── 2. Docker stacks - stop and remove volumes ──────────────────────────
- name: "[BLANK] Stop Docker stacks and remove volumes"
  ansible.builtin.shell: >
    {{ docker_bin }} compose
    -f "{{ stacks_dir }}/{{ item }}/docker-compose.yml"
    -p {{ item }} down -v --remove-orphans -t {{ blank_stop_timeout | default(30) }} 2>&1 || true
  loop:
    - iiab
    - observability
    - infra
    - apps
    - devops
    - b2b
    - voip
    - engineering
    - data
  failed_when: false
  changed_when: true

- name: "[BLANK] Wait for containers to fully stop"
  ansible.builtin.pause:
    seconds: "{{ blank_stop_timeout | default(30) }}"
    prompt: "Waiting {{ blank_stop_timeout | default(30) }}s for containers to stop..."

- name: "[BLANK] Remove shared Docker network"
  ansible.builtin.shell: >
    {{ docker_bin }} network rm {{ stacks_shared_network }} 2>/dev/null || true
  failed_when: false
  changed_when: false

- name: "[BLANK] Prune all unused Docker volumes (-a = named + anonymous)"
  ansible.builtin.shell: "{{ docker_bin }} volume prune -f -a 2>&1 || {{ docker_bin }} volume prune -f 2>&1"
  failed_when: false
  changed_when: true

- name: "[BLANK] Prune all unused Docker networks"
  ansible.builtin.command: "{{ docker_bin }} network prune -f"
  failed_when: false
  changed_when: true

# ── 3. Homebrew services - stop ─────────────────────────────────────────
# brew services stop is unreliable (Ruby API hangs 30min+ on brew 4.x).
# We use direct launchctl unload + pkill - immediate effect.
- name: "[BLANK] Stop Homebrew services (direct launchctl)"
  ansible.builtin.shell: |
    for svc in nginx "php@{{ php_version | default('8.3') }}" dnsmasq grafana-alloy ollama; do
      plist="$HOME/Library/LaunchAgents/homebrew.mxcl.${svc}.plist"
      [ -f "$plist" ] && launchctl unload "$plist" 2>/dev/null
      plist="/Library/LaunchDaemons/homebrew.mxcl.${svc}.plist"
      [ -f "$plist" ] && sudo launchctl unload "$plist" 2>/dev/null
    done
    pkill -f "nginx: master" 2>/dev/null || true
    pkill -f "php-fpm: master" 2>/dev/null || true
    pkill -f "dnsmasq" 2>/dev/null || true
    pkill -f "alloy" 2>/dev/null || true
    pkill -f "ollama serve" 2>/dev/null || true
    echo "DONE"
  args:
    executable: /bin/bash
  failed_when: false
  changed_when: false

# ── 4. LaunchAgents - unload and remove ─────────────────────────────────
- name: "[BLANK] Find playbook-managed LaunchAgents"
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents"
    patterns:
      - "com.nginx.nginx-prometheus-exporter.plist"
      - "com.hipages.php-fpm-exporter.plist"
      - "com.openclaw.agent.plist"
      # The OpenClaw CLI's own gateway service (`openclaw gateway install` →
      # ai.openclaw.gateway.plist + ~/.openclaw/service-env/). nOS provisions
      # OpenClaw (npm install -g openclaw), so this daemon is ours — without it
      # in the list a blank/uninstall leaves it running, and it RE-CREATES
      # ~/.openclaw right after the data-dir wipe (found 2026-07-19 uninstall).
      - "ai.openclaw.gateway.plist"
      - "com.hermes.agent.plist"
      - "com.ollama.agent.plist"
      - "com.ollama.agent.plist.disabled"
      - "homebrew.mxcl.ollama.plist.disabled"
      # Anatomy host daemons (eu.thisisait.nos.*) — each role renders its plist
      # into ~/Library/LaunchAgents; without these a blank leaves stale plists
      # pointing at wiped data dirs (gated by test_blank_reset_plist_discovery).
      - "eu.thisisait.nos.bone.plist"
      - "eu.thisisait.nos.pulse.plist"
      - "eu.thisisait.nos.wing.plist"
      - "eu.thisisait.nos.hermes.plist"
      - "eu.thisisait.nos.heartbeat.plist"
      - "eu.thisisait.nos.resume.plist"
      - "eu.thisisait.nos.backup.rustfs.plist"
      - "eu.thisisait.nos.backup.exporter.plist"
      - "eu.thisisait.nos.backup.offsite.plist"
      - "eu.thisisait.nos.acme-renew.plist"
  register: _blank_plists

- name: "[BLANK] Unload LaunchAgents"
  ansible.builtin.command: "launchctl unload {{ item.path }}"
  loop: "{{ _blank_plists.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  failed_when: false
  changed_when: false

- name: "[BLANK] Remove LaunchAgent plists"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _blank_plists.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

# ── 4b. OpenTofu Authentik state — reset so a blank recreates from scratch ──
# The blank wipes Authentik's DB (every provider/app/outpost gets a NEW pk on
# reinstall), but terraform.tfstate lives in the REPO (not a data dir) and so
# survived blanks — carrying STALE pks. The next `tofu apply` then PUTs to pks
# that now belong to OTHER providers (e.g. tofu's "Superset" pk became an agent
# client) → "provider with this name already exists" 400s, and the apply could
# clobber the wrong object. Resetting the state here makes tofu CREATE cleanly
# against the wiped tenant. Backup custody is separate (run_tofu_state); this is
# the working copy only. Root-caused 2026-06-14 (a converge after a blank).
- name: "[BLANK] Reset OpenTofu Authentik state (stale pks across blanks)"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/terraform/authentik/{{ item }}"
    state: absent
  loop:
    - terraform.tfstate
    - terraform.tfstate.backup
  when: (authentik_engine | default('blueprint')) == 'tofu' or (manage_authentik_with_tofu | default(false) | bool)

# OpenTofu writes a timestamped terraform.tfstate.<epoch>.backup on every apply.
# These accumulate in the repo working tree (gitignored, but they pile up and
# muddy which state is live). The reset above only removes the singular backup,
# so wipe the timestamped ones too — keeping the blank's wipe-all contract honest.
- name: "[BLANK] Find timestamped OpenTofu Authentik backups"
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/terraform/authentik"
    patterns: "terraform.tfstate.*.backup"
    use_regex: false
  register: _blank_tofu_backups
  when: (authentik_engine | default('blueprint')) == 'tofu' or (manage_authentik_with_tofu | default(false) | bool)

- name: "[BLANK] Remove timestamped OpenTofu Authentik backups"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _blank_tofu_backups.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (authentik_engine | default('blueprint')) == 'tofu' or (manage_authentik_with_tofu | default(false) | bool)

# ── 5. Nginx - reset configuration ──────────────────────────────────────
- name: "[BLANK] Remove nginx sites-enabled symlinks"
  ansible.builtin.shell: "rm -f {{ homebrew_prefix }}/etc/nginx/sites-enabled/*.conf"
  failed_when: false
  changed_when: true

- name: "[BLANK] Remove nginx sites-available configs"
  ansible.builtin.shell: "rm -f {{ homebrew_prefix }}/etc/nginx/sites-available/*.conf"
  failed_when: false
  changed_when: true

- name: "[BLANK] Remove nginx SSL certificates"
  ansible.builtin.file:
    path: "{{ homebrew_prefix }}/etc/nginx/ssl"
    state: absent

- name: "[BLANK] Remove nginx logs"
  ansible.builtin.shell: "rm -f {{ homebrew_prefix }}/var/log/nginx/*.log"
  failed_when: false
  changed_when: false

# ── 6. dnsmasq - reset ──────────────────────────────────────────────────
- name: "[BLANK] Remove dnsmasq dev.local config"
  ansible.builtin.lineinfile:
    path: "{{ homebrew_prefix }}/etc/dnsmasq.conf"
    regexp: "dev\\.local"
    state: absent
  failed_when: false

- name: "[BLANK] Remove macOS resolver for dev.local"
  ansible.builtin.file:
    path: "/etc/resolver/{{ dnsmasq_dev_domain | default('dev.local') }}"
    state: absent
  become: true
  failed_when: false

# ── 7/8. Auto-deps + _blank_dirs: MOVED to tasks/removal-set.yml (single
# removal inventory — one list, consumed by dry-run, execution, and verify).

- name: "[BLANK] Remove data directories (sudo - Docker creates files as www-data)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ _blank_dirs }}"
  loop_control:
    label: "{{ item }}"
  become: true

# ── 9. Generated files ──────────────────────────────────────────────────
- name: "[BLANK] Remove service registry"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/projects/default/service-registry.json"
    state: absent
  failed_when: false

- name: "[BLANK] Remove persisted runtime secrets (force-regenerate)"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.nos/secrets.yml"
    state: absent
  failed_when: false

# The banner must describe THIS run, not the run this file was written for.
# It used to hardcode the old level name and "Playbook now continues with clean
# installation" — a lie in two directions under the ladder: it named blank for
# remove=deep|all (more removal phases follow this one) and it promised a
# reinstall that `--leave` explicitly cancels. It also left the quiet phases
# unannounced, so the silent minutes of `docker image prune -af` read as a hang
# (live 2026-07-22). Pinned by test_blank_reset_confirmation_accuracy.py.
- name: "[BLANK] Data removal complete"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════════════════════
       REMOVE={{ remove | default('data') | upper }} — DATA PHASE COMPLETE
       Removed: {{ _blank_dirs | length }} data directories, Docker stacks,
       nginx configuration, SSL certificates, dnsmasq, LaunchAgents.
      {% if _flush_deep | default(false) | bool %}
       Next: images + build cache + Homebrew cache — the pruning runs QUIET
       for several minutes with no output. Not a hang.
      {% endif %}
      {% if nos_remove_source | default(false) | bool %}
       Next: user SOURCE removal (~/nos/tenants, anatomy runtime).
      {% endif %}
       Then: post-removal verification.
       {{ 'Play ENDS after verification (leave=true) — no reinstall.'
          if nos_leaving | default(false) | bool
          else 'Playbook then continues with clean installation...' }}
      ══════════════════════════════════════════════════════════════════════
