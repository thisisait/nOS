---
# ==============================================================================
# NODE.JS - NVM, Node LTS, global npm packages
# ==============================================================================

- name: Install NVM via Homebrew
  community.general.homebrew:
    name: nvm
    state: present
  when: nos_pkg_manager == 'homebrew'

- name: Ensure NVM directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.nvm"
    state: directory
    mode: '0755'
  when: nos_pkg_manager == 'homebrew'

- name: Add NVM to shell profile (.zshrc)
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    marker: "# {mark} NVM - ANSIBLE MANAGED"
    block: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
      [ -s "{{ homebrew_prefix }}/opt/nvm/etc/bash_completion.d/nvm" ] && source "{{ homebrew_prefix }}/opt/nvm/etc/bash_completion.d/nvm"
    create: true
    mode: '0644'
  when: nos_pkg_manager == 'homebrew'

- name: Install Node.js LTS via NVM
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm install '{{ node_nvm_version | default('lts/*') }}'
    nvm alias default '{{ node_nvm_version | default('lts/*') }}'
    nvm use default
  args:
    executable: /bin/bash
  changed_when: false
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  when: nos_pkg_manager == 'homebrew'

# ── Linux: the same nvm, from its own git tag (no Homebrew there) ────────────
# Ubuntu 24.04's apt nodejs is 18; the Cortex organ needs >= 22 (package.json
# engines) and the macOS path already means "nvm default". nvm itself is a
# shell script — cloned at a pinned tag, it downloads Node from nodejs.org.
- name: "[node] Clone nvm (Linux)"
  ansible.builtin.git:
    repo: https://github.com/nvm-sh/nvm.git
    dest: "{{ ansible_facts['env']['HOME'] }}/.nvm"
    version: "{{ nvm_git_version | default('v0.40.8') }}"
    depth: 1
    update: false
  register: _nvm_clone
  # A GitHub 429 is a cooldown, not a blip (roles/pazny.hermes/tasks/main.yml).
  until: _nvm_clone is succeeded
  retries: 5
  delay: 30
  when: nos_pkg_manager in ['apt', 'dnf']

- name: "[node] Install Node.js via nvm (Linux)"
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    . "$NVM_DIR/nvm.sh"
    if nvm ls '{{ node_nvm_version | default('lts/*') }}' >/dev/null 2>&1; then
      echo present
    else
      nvm install '{{ node_nvm_version | default('lts/*') }}' >/dev/null && echo installed
    fi
    nvm alias default '{{ node_nvm_version | default('lts/*') }}' >/dev/null
  args:
    executable: /bin/bash
  register: _node_nvm_linux
  changed_when: "'installed' in _node_nvm_linux.stdout"
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  when: nos_pkg_manager in ['apt', 'dnf']

- name: Install global npm packages
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default
    npm install -g {{ '--ignore-scripts' if (npm_ignore_scripts | default(true)) else '' }} {{ item }}
  args:
    executable: /bin/bash
  loop: "{{ node_global_packages | default([]) }}"
  changed_when: false
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  when: nos_pkg_manager == 'homebrew'

# `--ignore-scripts` has one real failure mode: a package that genuinely needs
# a postinstall (native builds via node-gyp) installs INCOMPLETE and npm still
# exits 0. That is a success marker written by the code that attempted the work
# — the exact shape this estate spent 2026-08-04 removing from four other
# places. So a reader checks the result instead: does the binary actually run?
- name: Verify each global CLI actually runs after an ignore-scripts install
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default >/dev/null 2>&1
    broken=""
    for spec in {{ node_global_packages | default([]) | map('regex_replace', '@[^@]*$', '') | join(' ') }}; do
      bin="${spec##*/}"                     # @scope/name -> name
      command -v "$bin" >/dev/null 2>&1 || continue   # not every package ships a CLI
      "$bin" --version >/dev/null 2>&1 || broken="$broken $bin"
    done
    [ -z "$broken" ] && echo "ALL-CLIS-OK" || echo "BROKEN:$broken"
  args:
    executable: /bin/bash
  register: _npm_cli_check
  changed_when: false
  failed_when: "'BROKEN:' in (_npm_cli_check.stdout | default(''))"
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  when:
    - nos_pkg_manager == 'homebrew'
    - npm_ignore_scripts | default(true)

- name: Install extra npm packages from config
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default
    npm install -g {{ '--ignore-scripts' if (npm_ignore_scripts | default(true)) else '' }} {% if item.version is defined %}{{ item.name }}@{{ item.version }}{% else %}{{ item.name }}{% endif %}
  args:
    executable: /bin/bash
  loop: "{{ npm_packages | default([]) }}"
  changed_when: false
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  when: nos_pkg_manager == 'homebrew'

# ── Duplicate NVM node trees: report always, prune only on request ──────────
# `node_nvm_version: lts/*` floats, so every converge can install a new LTS and
# leave the old tree behind. Six had accumulated by 2026-08-04, each carrying a
# full global package set — five copies of eslint, and therefore five copies of
# keyv / flat-cache / file-entry-cache, the three packages ChainDrop poisoned
# that same day. Duplicate trees are not just disk: each one is an independent
# dependency surface that no single audit covers.
#
# REPORTS BY DEFAULT. Removal is opt-in AND refuses to touch the default alias
# or the tree the running node came from — deleting the interpreter underneath
# a live process is a worse failure than the disk it reclaims.
- name: "[node] Inventory NVM node trees"
  ansible.builtin.shell: |
    set -o pipefail
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    default_ver=$(nvm version default 2>/dev/null || echo "")
    running=$(node -v 2>/dev/null || echo "")
    keep="${default_ver} ${running}"
    for d in "$HOME/.nvm/versions/node"/*/; do
      v=$(basename "$d")
      case " $keep " in *" $v "*) echo "KEEP $v" ;; *) echo "STALE $v" ;; esac
    done
  args:
    executable: /bin/bash
  register: _node_trees
  changed_when: false
  failed_when: false
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  when: nos_pkg_manager == 'homebrew'

- name: "[node] Report duplicate node trees"
  ansible.builtin.debug:
    msg: >-
      NVM trees: {{ (_node_trees.stdout_lines | default([]) | select('match', '^STALE') | list) | length }}
      stale, {{ (_node_trees.stdout_lines | default([]) | select('match', '^KEEP') | list) | length }} kept.
      {{ (_node_trees.stdout_lines | default([]) | select('match', '^STALE') | list) | join(', ') }}
      {{ 'Set node_prune_stale_versions=true to remove them.'
         if (_node_trees.stdout_lines | default([]) | select('match', '^STALE') | list | length) > 0 else '' }}
  when: _node_trees is defined and not (_node_trees.skipped | default(false))

- name: "[node] Remove stale node trees"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.nvm/versions/node/{{ item.split(' ')[1] }}"
    state: absent
  loop: "{{ _node_trees.stdout_lines | default([]) | select('match', '^STALE') | list }}"
  loop_control:
    label: "{{ item }}"
  when:
    - node_prune_stale_versions | default(false)
    - _node_trees is defined and not (_node_trees.skipped | default(false))

# ──────────────────────────────────────────────────────────────────────────────
# The claude PATH-bridge USED TO LIVE HERE. Moved to tasks/claude-cli.yml on
# 2026-08-04, and the move is the point rather than tidying.
#
# The original task was right about the problem: launchd starts Pulse and Bone
# with a minimal PATH, so `command -v claude` failed inside pulse-run-agent.sh
# (found live 2026-05-07, runner exited rc=2 before any Wing event landed) and
# a symlink into the homebrew prefix fixed it.
#
# What it got wrong was the TARGET. It resolved `claude` under `nvm use
# default`, and `node_nvm_version` is `lts/*` — floating. So every converge
# re-pointed the bridge at whatever node version upstream had released, and the
# estate accumulated five separate claude-code installs (211–270 MB each), each
# auto-updating itself. When one of those updaters rewrote the 270 MB binary
# that the operator's LIVE session was executing, spawning the background
# service failed with EACCES, several times a day.
#
# A developer tool the operator is holding must not be reinstallable by a Node
# runtime migration. claude-cli.yml installs a native build outside NVM and
# bridges THAT, so this file no longer has an opinion about the CLI.
#
# Anything else that genuinely needs an NVM-installed CLI on the launchd PATH
# belongs here — but read the above before adding a second floating target.
# ──────────────────────────────────────────────────────────────────────────────
