---
# ==============================================================================
# NODE.JS - NVM, Node LTS, global npm packages
# ==============================================================================

- name: Install NVM via Homebrew
  community.general.homebrew:
    name: nvm
    state: present
  when: nos_pkg_manager == 'homebrew'

- name: Ensure NVM directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.nvm"
    state: directory
    mode: '0755'
  when: nos_pkg_manager == 'homebrew'

- name: Add NVM to shell profile (.zshrc)
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    marker: "# {mark} NVM - ANSIBLE MANAGED"
    block: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
      [ -s "{{ homebrew_prefix }}/opt/nvm/etc/bash_completion.d/nvm" ] && source "{{ homebrew_prefix }}/opt/nvm/etc/bash_completion.d/nvm"
    create: true
    mode: '0644'
  when: nos_pkg_manager == 'homebrew'

- name: Install Node.js LTS via NVM
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm install '{{ node_nvm_version | default('lts/*') }}'
    nvm alias default '{{ node_nvm_version | default('lts/*') }}'
    nvm use default
  args:
    executable: /bin/bash
  changed_when: false
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  when: nos_pkg_manager == 'homebrew'

- name: Install global npm packages
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default
    npm install -g {{ item }}
  args:
    executable: /bin/bash
  loop: "{{ node_global_packages | default([]) }}"
  changed_when: false
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  when: nos_pkg_manager == 'homebrew'

- name: Install extra npm packages from config
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ] && source "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
    nvm use default
    npm install -g {% if item.version is defined %}{{ item.name }}@{{ item.version }}{% else %}{{ item.name }}{% endif %}
  args:
    executable: /bin/bash
  loop: "{{ npm_packages | default([]) }}"
  changed_when: false
  environment:
    NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.nvm"
  when: nos_pkg_manager == 'homebrew'

# ──────────────────────────────────────────────────────────────────────────────
# The claude PATH-bridge USED TO LIVE HERE. Moved to tasks/claude-cli.yml on
# 2026-08-04, and the move is the point rather than tidying.
#
# The original task was right about the problem: launchd starts Pulse and Bone
# with a minimal PATH, so `command -v claude` failed inside pulse-run-agent.sh
# (found live 2026-05-07, runner exited rc=2 before any Wing event landed) and
# a symlink into the homebrew prefix fixed it.
#
# What it got wrong was the TARGET. It resolved `claude` under `nvm use
# default`, and `node_nvm_version` is `lts/*` — floating. So every converge
# re-pointed the bridge at whatever node version upstream had released, and the
# estate accumulated five separate claude-code installs (211–270 MB each), each
# auto-updating itself. When one of those updaters rewrote the 270 MB binary
# that the operator's LIVE session was executing, spawning the background
# service failed with EACCES, several times a day.
#
# A developer tool the operator is holding must not be reinstallable by a Node
# runtime migration. claude-cli.yml installs a native build outside NVM and
# bridges THAT, so this file no longer has an opinion about the CLI.
#
# Anything else that genuinely needs an NVM-installed CLI on the launchd PATH
# belongs here — but read the above before adding a second floating target.
# ──────────────────────────────────────────────────────────────────────────────
