---
# ==============================================================================
# DNSMASQ - automatic DNS resolver for *.dev.local
# Removes the need to manually edit /etc/hosts
#
# How it works:
#   1. dnsmasq listens on 127.0.0.1:53
#   2. macOS /etc/resolver/dev.local redirects *.dev.local queries to dnsmasq
#   3. dnsmasq responds 127.0.0.1 for all *.dev.local domains
#
# Result: grafana.dev.local, gitea.dev.local, n8n.dev.local... work
# automatically without any manual configuration.
# ==============================================================================

- name: Install dnsmasq via Homebrew
  community.general.homebrew:
    name: dnsmasq
    state: present
  when: nos_pkg_manager == 'homebrew'

- name: "[dnsmasq] Detect LAN IP for DNS responses"
  ansible.builtin.shell: ipconfig getifaddr en0 2>/dev/null || echo "127.0.0.1"
  register: _lan_ip
  changed_when: false
  check_mode: false
  when: dnsmasq_lan_access | default(true)

- name: "[dnsmasq] Build listen addresses"
  ansible.builtin.set_fact:
    _dnsmasq_listen: "{{ '127.0.0.1,' ~ (_lan_ip.stdout | default('127.0.0.1')) if (dnsmasq_lan_access | default(true)) else '127.0.0.1' }}"
    _dnsmasq_target: "{{ _lan_ip.stdout | default(dnsmasq_dev_address | default('127.0.0.1')) }}"

- name: Deploy dnsmasq configuration
  ansible.builtin.blockinfile:
    path: "{{ homebrew_prefix }}/etc/dnsmasq.conf"
    marker: "# {mark} DEV.LOCAL (ansible managed)"
    block: |
      # *.dev.local -> {{ _dnsmasq_target }} (LAN IP)
      address=/.{{ dnsmasq_dev_domain | default('dev.local') }}/{{ _dnsmasq_target }}

      {% if install_bluesky_pds | default(false) %}
      # *.dev.lan -> {{ _dnsmasq_target }} (Bluesky PDS - AT Protocol forbids .local)
      address=/.dev.lan/{{ _dnsmasq_target }}
      {% endif %}

      # Optional custom records
      {% for entry in dnsmasq_additional_addresses | default([]) %}
      address=/{{ entry.domain }}/{{ entry.address }}
      {% endfor %}

      # Interfaces: {{ _dnsmasq_listen }}
      listen-address={{ _dnsmasq_listen }}
      bind-interfaces

      # Do not forward queries for the configured tenant_domain to upstream
      # DNS (treats e.g. .local / .lan / .test as authoritative locally —
      # honouring tenant_domain so the dnsmasq scope follows operator's TLD).
      local=/{{ dnsmasq_dev_domain | default('dev.local') }}/
      {% if install_bluesky_pds | default(false) %}
      local=/dev.lan/
      {% endif %}

      # Faster cache
      cache-size=1000
    create: true
    mode: '0644'
  # dnsmasq.conf has no _platform var; the Homebrew path is macOS-only.
  when: ansible_os_family == 'Darwin'
  notify: Restart dnsmasq

- name: Ensure /etc/resolver directory exists
  ansible.builtin.file:
    path: /etc/resolver
    state: directory
    mode: '0755'
  become: true
  # /etc/resolver is a macOS-only DNS resolver mechanism.
  when:
    - ansible_os_family == 'Darwin'
    - not ansible_check_mode

- name: Create macOS resolver for dev.local domain
  ansible.builtin.copy:
    dest: "/etc/resolver/{{ dnsmasq_dev_domain | default('dev.local') }}"
    content: |
      # Generated by Ansible - *.{{ dnsmasq_dev_domain | default('dev.local') }} -> dnsmasq
      nameserver 127.0.0.1
      port {{ dnsmasq_port | default(53) }}
    mode: '0644'
  become: true
  # /etc/resolver is a macOS-only DNS resolver mechanism.
  when:
    - ansible_os_family == 'Darwin'
    - not ansible_check_mode

- name: Create macOS resolver for dev.lan domain (Bluesky PDS)
  ansible.builtin.copy:
    dest: "/etc/resolver/dev.lan"
    content: |
      # Generated by Ansible - *.dev.lan -> dnsmasq (Bluesky PDS)
      nameserver 127.0.0.1
      port {{ dnsmasq_port | default(53) }}
    mode: '0644'
  become: true
  # /etc/resolver is a macOS-only DNS resolver mechanism.
  when:
    - ansible_os_family == 'Darwin'
    - install_bluesky_pds | default(false)
    - not ansible_check_mode

# ── Ensure the dnsmasq LaunchDaemon is INSTALLED and RUNNING ─────────────────
# CRITICAL (root-caused 2026-07-18): the "Restart dnsmasq" handler only
# launchctl-unload/loads an EXISTING plist at
# /Library/LaunchDaemons/homebrew.mxcl.dnsmasq.plist — but that plist is created
# only by `brew services start`, which nothing else ran. On a fresh blank the
# plist never existed, the handler hit its `[ ! -f "$plist" ]` guard, WARNed to
# stderr, and exited — so dnsmasq NEVER started. *.<tenant_domain> then didn't
# resolve and the ENTIRE platform was unreachable by name despite failed=0
# (every service DEAD in nos-smoke with "nodename nor servname").
#
# We do NOT use `brew services start`: as root (needed for the system port-53
# LaunchDaemon) Homebrew refuses — "Need to download …packages.…jws.json but
# cannot as root" (the API-cache-as-root guard). Instead we install Homebrew's
# OWN generated plist (correct ProgramArguments incl. the dnsmasq.d conf dir)
# straight to /Library/LaunchDaemons and bootstrap it with launchctl — no brew
# under sudo. This also makes the existing "Restart dnsmasq" handler work, since
# the plist it reloads now exists.
- name: "[dnsmasq] Install the dnsmasq system LaunchDaemon plist"
  ansible.builtin.copy:
    src: "{{ homebrew_prefix }}/opt/dnsmasq/homebrew.mxcl.dnsmasq.plist"
    dest: /Library/LaunchDaemons/homebrew.mxcl.dnsmasq.plist
    remote_src: true
    owner: root
    group: wheel
    mode: '0644'
  become: true
  when: ansible_os_family == 'Darwin'
  notify: Restart dnsmasq

- name: "[dnsmasq] Bootstrap (start) the dnsmasq LaunchDaemon"
  ansible.builtin.command: launchctl bootstrap system /Library/LaunchDaemons/homebrew.mxcl.dnsmasq.plist
  become: true
  register: _dnsmasq_boot
  # bootstrap of an already-loaded service returns rc 5 ("already bootstrapped"
  # / "Input/output error") — that's success for us (it's running).
  changed_when: _dnsmasq_boot.rc | default(0) == 0
  failed_when:
    - _dnsmasq_boot.rc | default(0) != 0
    - "'already' not in ((_dnsmasq_boot.stderr | default('')) | lower)"
    - "'5:' not in (_dnsmasq_boot.stderr | default(''))"
  when: ansible_os_family == 'Darwin'

# dnsmasq restart stays notify-driven (config-change reloads); the install+boot
# tasks above are the first-boot guarantee the notify-only handler could not
# provide.

- name: "Verify dnsmasq resolves {{ dnsmasq_dev_domain | default('dev.local') }} correctly"
  ansible.builtin.command: "dig +short grafana{{ _host_alias_seg | default('') }}.{{ dnsmasq_dev_domain | default('dev.local') }} @127.0.0.1"
  register: dns_check
  until: (dns_check.stdout | default('') | trim | length) > 0
  retries: 6
  delay: 2
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'Darwin'

# LOUD gate: a down/misresolving dnsmasq means the whole platform is unreachable
# by name — that must FAIL the run, not ship green + silently broken (the
# DNS-layer health-blindness that hid this for so long).
- name: "[dnsmasq] FAIL LOUD if local DNS is still down"
  ansible.builtin.assert:
    that: (dns_check.stdout | default('') | trim | length) > 0
    fail_msg: >-
      dnsmasq is NOT resolving *.{{ dnsmasq_dev_domain | default('dev.local') }}
      on 127.0.0.1 — the whole platform would be UNREACHABLE BY NAME. Recover:
      `sudo {{ homebrew_prefix }}/bin/brew services start dnsmasq` then
      `sudo launchctl list | grep dnsmasq`.
    success_msg: >-
      dnsmasq resolves *.{{ dnsmasq_dev_domain | default('dev.local') }} →
      {{ dns_check.stdout | default('') | trim }}
  when: ansible_os_family == 'Darwin'
