---
# ==============================================================================
# DNSMASQ - automatic DNS resolver for *.dev.local
# Removes the need to manually edit /etc/hosts
#
# How it works:
#   1. dnsmasq listens on 127.0.0.1:53
#   2. macOS /etc/resolver/dev.local redirects *.dev.local queries to dnsmasq
#   3. dnsmasq responds 127.0.0.1 for all *.dev.local domains
#
# Result: grafana.dev.local, gitea.dev.local, n8n.dev.local... work
# automatically without any manual configuration.
# ==============================================================================

- name: Install dnsmasq via Homebrew
  community.general.homebrew:
    name: dnsmasq
    state: present
  when: nos_pkg_manager == 'homebrew'

# lan_tailscale: LAN devices and the tailnet's split DNS ask this host, so it must listen there.
# nos_lan_roaming: a host that changes networks answers 127.0.0.1 on loopback only.
- name: "[dnsmasq] Decide whether to answer on the LAN"
  ansible.builtin.set_fact:
    _dnsmasq_lan: "{{ ((dnsmasq_lan_access | default(true) | bool) or (nos_edge | default('cloudflare')) == 'lan_tailscale') and not (nos_lan_roaming | default(false) | bool) }}"

# The LAN address is ONE declared fact (nos_lan_ip); Tailscale advertises the same one.
- name: "[dnsmasq] Build listen addresses"
  ansible.builtin.set_fact:
    _dnsmasq_listen: "{{ '127.0.0.1,' ~ (nos_lan_ip | default('', true) or '127.0.0.1') if (_dnsmasq_lan | bool) else '127.0.0.1' }}"
    _dnsmasq_target: "{{ (nos_lan_ip | default('', true) or '127.0.0.1') if (_dnsmasq_lan | bool) else (dnsmasq_dev_address | default('127.0.0.1')) }}"

- name: Deploy dnsmasq configuration
  ansible.builtin.blockinfile:
    path: "{{ homebrew_prefix }}/etc/dnsmasq.conf"
    marker: "# {mark} DEV.LOCAL (ansible managed)"
    block: |
      # *.dev.local -> {{ _dnsmasq_target }} (LAN IP)
      address=/.{{ dnsmasq_dev_domain | default('dev.local') }}/{{ _dnsmasq_target }}

      {% if install_bluesky_pds | default(false) %}
      # *.dev.lan -> {{ _dnsmasq_target }} (Bluesky PDS - AT Protocol forbids .local)
      address=/.dev.lan/{{ _dnsmasq_target }}
      {% endif %}

      # Optional custom records
      {% for entry in dnsmasq_additional_addresses | default([]) %}
      address=/{{ entry.domain }}/{{ entry.address }}
      {% endfor %}

      # Interfaces: {{ _dnsmasq_listen }}
      listen-address={{ _dnsmasq_listen }}
      bind-interfaces

      # Do not forward queries for the configured tenant_domain to upstream
      # DNS (treats e.g. .local / .lan / .test as authoritative locally —
      # honouring tenant_domain so the dnsmasq scope follows operator's TLD).
      local=/{{ dnsmasq_dev_domain | default('dev.local') }}/
      {% if install_bluesky_pds | default(false) %}
      local=/dev.lan/
      {% endif %}

      # Faster cache
      cache-size=1000

      # REM-154: reject upstream answers in RFC1918/loopback (measured:
      # dig @127.0.0.1 localtest.me → 127.0.0.1). address=/.<tenant_domain>/ is
      # local, not forwarded — do NOT set rebind-localhost-ok, that re-opens
      # the relay.
      stop-dns-rebind
    create: true
    mode: '0644'
  # dnsmasq.conf has no _platform var; the Homebrew path is macOS-only.
  when: ansible_os_family == 'Darwin'
  notify: Restart dnsmasq

- name: Ensure /etc/resolver directory exists
  ansible.builtin.file:
    path: /etc/resolver
    state: directory
    mode: '0755'
  become: true
  # /etc/resolver is a macOS-only DNS resolver mechanism.
  when:
    - ansible_os_family == 'Darwin'
    - not ansible_check_mode

- name: Create macOS resolver for dev.local domain
  ansible.builtin.copy:
    dest: "/etc/resolver/{{ dnsmasq_dev_domain | default('dev.local') }}"
    content: |
      # Generated by Ansible - *.{{ dnsmasq_dev_domain | default('dev.local') }} -> dnsmasq
      nameserver 127.0.0.1
      port {{ dnsmasq_port | default(53) }}
    mode: '0644'
  become: true
  # /etc/resolver is a macOS-only DNS resolver mechanism.
  when:
    - ansible_os_family == 'Darwin'
    - not ansible_check_mode

- name: Create macOS resolver for dev.lan domain (Bluesky PDS)
  ansible.builtin.copy:
    dest: "/etc/resolver/dev.lan"
    content: |
      # Generated by Ansible - *.dev.lan -> dnsmasq (Bluesky PDS)
      nameserver 127.0.0.1
      port {{ dnsmasq_port | default(53) }}
    mode: '0644'
  become: true
  # /etc/resolver is a macOS-only DNS resolver mechanism.
  when:
    - ansible_os_family == 'Darwin'
    - install_bluesky_pds | default(false)
    - not ansible_check_mode

# ── Ensure the dnsmasq LaunchDaemon is INSTALLED and RUNNING ─────────────────
# CRITICAL (root-caused 2026-07-18): the "Restart dnsmasq" handler only
# launchctl-unload/loads an EXISTING plist at
# /Library/LaunchDaemons/<dnsmasq_launchd_label>.plist — but that plist is created
# only by `brew services start`, which nothing else ran. On a fresh blank the
# plist never existed, the handler hit its `[ ! -f "$plist" ]` guard, WARNed to
# stderr, and exited — so dnsmasq NEVER started. *.<tenant_domain> then didn't
# resolve and the ENTIRE platform was unreachable by name despite failed=0
# (every service DEAD in nos-smoke with "nodename nor servname").
#
# We do NOT use `brew services start`: as root (needed for the system port-53
# LaunchDaemon) Homebrew refuses — "Need to download …packages.…jws.json but
# cannot as root" (the API-cache-as-root guard). Instead we install Homebrew's
# OWN generated plist (correct ProgramArguments incl. the dnsmasq.d conf dir)
# straight to /Library/LaunchDaemons and bootstrap it with launchctl — no brew
# under sudo. This also makes the existing "Restart dnsmasq" handler work, since
# the plist it reloads now exists.
#
# Homebrew 7 ships `sh.brew.<svc>.plist` (was `homebrew.mxcl.<svc>`) (#46).
# Keep the configured label when its plist exists; else follow Homebrew 7.
- name: "[dnsmasq] Stat the configured formula plist"
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/opt/dnsmasq/{{ dnsmasq_launchd_label }}.plist"
  register: _dnsmasq_formula_plist
  when: ansible_os_family == 'Darwin'

- name: "[dnsmasq] Follow Homebrew 7 plist naming when the configured one is absent"
  ansible.builtin.set_fact:
    dnsmasq_launchd_label: "sh.brew.dnsmasq"
  when:
    - ansible_os_family == 'Darwin'
    - not (_dnsmasq_formula_plist.stat.exists | default(false))
    - (homebrew_prefix ~ '/opt/dnsmasq/sh.brew.dnsmasq.plist') is file

- name: "[dnsmasq] Install the dnsmasq system LaunchDaemon plist"
  ansible.builtin.copy:
    src: "{{ homebrew_prefix }}/opt/dnsmasq/{{ dnsmasq_launchd_label }}.plist"
    dest: "/Library/LaunchDaemons/{{ dnsmasq_launchd_label }}.plist"
    remote_src: true
    owner: root
    group: wheel
    mode: '0644'
  become: true
  when: ansible_os_family == 'Darwin'
  notify: Restart dnsmasq

- name: "[dnsmasq] Bootstrap (start) the dnsmasq LaunchDaemon"
  ansible.builtin.command: launchctl bootstrap {{ dnsmasq_launchd_domain }} /Library/LaunchDaemons/{{ dnsmasq_launchd_label }}.plist
  become: true
  register: _dnsmasq_boot
  # bootstrap of an already-loaded service returns rc 5 ("already bootstrapped"
  # / "Input/output error") — that's success for us (it's running).
  changed_when: _dnsmasq_boot.rc | default(0) == 0
  failed_when:
    - _dnsmasq_boot.rc | default(0) != 0
    - "'already' not in ((_dnsmasq_boot.stderr | default('')) | lower)"
    - "'5:' not in (_dnsmasq_boot.stderr | default(''))"
  when: ansible_os_family == 'Darwin'

# dnsmasq restart stays notify-driven (config-change reloads); the install+boot
# tasks above are the first-boot guarantee the notify-only handler could not
# provide.

- name: "Verify dnsmasq resolves {{ dnsmasq_dev_domain | default('dev.local') }} correctly"
  ansible.builtin.command: "dig +short grafana{{ _host_alias_seg | default('') }}.{{ dnsmasq_dev_domain | default('dev.local') }} @127.0.0.1"
  register: dns_check
  until: (dns_check.stdout | default('') | trim | length) > 0
  retries: 6
  delay: 2
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'Darwin'

# LOUD gate: a down/misresolving dnsmasq means the whole platform is unreachable
# by name — that must FAIL the run, not ship green + silently broken (the
# DNS-layer health-blindness that hid this for so long).
- name: "[dnsmasq] FAIL LOUD if local DNS is still down"
  ansible.builtin.assert:
    that: (dns_check.stdout | default('') | trim | length) > 0
    fail_msg: >-
      dnsmasq is NOT resolving *.{{ dnsmasq_dev_domain | default('dev.local') }}
      on 127.0.0.1 — the whole platform would be UNREACHABLE BY NAME. Recover:
      `sudo {{ homebrew_prefix }}/bin/brew services start dnsmasq` then
      `sudo launchctl list | grep dnsmasq`.
    success_msg: >-
      dnsmasq resolves *.{{ dnsmasq_dev_domain | default('dev.local') }} →
      {{ dns_check.stdout | default('') | trim }}
  when: ansible_os_family == 'Darwin'

# ── Tailnet instance: a roaming host answers its Tailscale IP to the tailnet ─────
# The system instance above stays on 127.0.0.1; a second dnsmasq binds the Tailscale
# address only, so the person's phone (split DNS in the tailnet admin console) reaches
# the same vhosts. Gate: tests/anatomy/test_a_roaming_host_answers_the_tailnet.py.
- name: "[dnsmasq] Tailnet: read this host's Tailscale IPv4"
  ansible.builtin.shell: |
    set -o pipefail
    for c in "$(command -v tailscale 2>/dev/null)" {{ _ts_candidates | default([homebrew_prefix ~ '/bin/tailscale',
        '/usr/local/bin/tailscale', '/Applications/Tailscale.app/Contents/MacOS/Tailscale']) | map('quote') | join(' ') }}; do
      if [ -n "$c" ] && [ -x "$c" ]; then exec "$c" ip -4; fi
    done
    exit 1
  args:
    executable: /bin/bash
  register: _dnsmasq_ts_raw
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_os_family == 'Darwin'
    - nos_lan_roaming | default(false) | bool
  tags: ['verify']

- name: "[dnsmasq] Tailnet: name the IP"
  ansible.builtin.set_fact:
    _dnsmasq_ts_ip: >-
      {{ ((_dnsmasq_ts_raw.stdout | default('')).split() + [''])[0] if _dnsmasq_ts_raw.rc | default(1) == 0
         and ((_dnsmasq_ts_raw.stdout | default('')).split() + [''])[0].replace('.', '').isdigit() else '' }}
  tags: ['verify']

- name: "[dnsmasq] Tailnet: decide"
  ansible.builtin.set_fact:
    _dnsmasq_tailnet: "{{ ansible_os_family == 'Darwin' and (nos_lan_roaming | default(false) | bool) and _dnsmasq_ts_ip | length > 0 }}"
  tags: ['verify']

- name: "[dnsmasq] Tailnet: render the config"
  ansible.builtin.template:
    src: dnsmasq-tailnet.conf.j2
    dest: "{{ dnsmasq_tailnet_conf }}"
    mode: '0644'
  register: _dnsmasq_tn_conf
  when: _dnsmasq_tailnet | bool

- name: "[dnsmasq] Tailnet: install the LaunchDaemon"
  ansible.builtin.template:
    src: eu.thisisait.nos.dnsmasq-tailnet.plist.j2
    dest: /Library/LaunchDaemons/eu.thisisait.nos.dnsmasq-tailnet.plist
    owner: root
    group: wheel
    mode: '0644'
  become: true
  register: _dnsmasq_tn_plist
  when: _dnsmasq_tailnet | bool

# launchd re-reads a plist (and dnsmasq its config) only on bootout + bootstrap.
- name: "[dnsmasq] Tailnet: load it"
  ansible.builtin.shell: |
    {% if _dnsmasq_tn_conf is changed or _dnsmasq_tn_plist is changed %}
    launchctl bootout system/eu.thisisait.nos.dnsmasq-tailnet 2>/dev/null && sleep 1
    {% endif %}
    launchctl print system/eu.thisisait.nos.dnsmasq-tailnet >/dev/null 2>&1 && exit 0
    launchctl bootstrap system /Library/LaunchDaemons/eu.thisisait.nos.dnsmasq-tailnet.plist && echo loaded
  become: true
  register: _dnsmasq_tn_load
  changed_when: "'loaded' in (_dnsmasq_tn_load.stdout | default(''))"
  when: _dnsmasq_tailnet | bool

- name: "[dnsmasq] Tailnet: remove it when not roaming"
  ansible.builtin.shell: |
    p=/Library/LaunchDaemons/eu.thisisait.nos.dnsmasq-tailnet.plist
    if [ -f "$p" ]; then launchctl bootout system/eu.thisisait.nos.dnsmasq-tailnet 2>/dev/null; rm -f "$p"; echo removed; fi
    if [ -f {{ dnsmasq_tailnet_conf | quote }} ]; then rm -f {{ dnsmasq_tailnet_conf | quote }}; echo removed; fi
    true
  become: true
  register: _dnsmasq_tn_gone
  changed_when: "'removed' in (_dnsmasq_tn_gone.stdout | default(''))"
  when: not (nos_lan_roaming | default(false) | bool)

- name: "[dnsmasq] Tailnet verify: ask it"
  ansible.builtin.command:
    argv: ["dig", "+short", "+time=2", "+tries=1", "@{{ _dnsmasq_ts_ip }}", "grafana{{ _host_alias_seg | default('') }}.{{ dnsmasq_dev_domain }}"]
  register: _dnsmasq_tn_dig
  until: _dnsmasq_ts_ip in (_dnsmasq_tn_dig.stdout | default('')).split()
  retries: 5
  delay: 2
  changed_when: false
  failed_when: false
  check_mode: false
  when: _dnsmasq_tailnet | bool
  tags: ['verify']

# Reported on a converge, fails under --tags verify (as tasks/tailscale.yml does).
- name: "[dnsmasq] Tailnet verify: judge"
  ansible.builtin.assert:
    that: _dnsmasq_ts_ip in (_dnsmasq_tn_dig.stdout | default('')).split()
    fail_msg: >-
      RED: `dig @{{ _dnsmasq_ts_ip }} grafana{{ _host_alias_seg | default('') }}.{{ dnsmasq_dev_domain }}`
      answered '{{ _dnsmasq_tn_dig.stdout | default('') | trim }}', not {{ _dnsmasq_ts_ip }}. Look at
      `sudo launchctl print system/eu.thisisait.nos.dnsmasq-tailnet`; docs/systems/dnsmasq/README.md.
    success_msg: "OK: the tailnet dnsmasq answers *.{{ dnsmasq_dev_domain }} -> {{ _dnsmasq_ts_ip }}"
  register: _dnsmasq_tn_assert
  failed_when: _dnsmasq_tn_assert.failed | default(false) and 'verify' in ansible_run_tags
  when: _dnsmasq_tailnet | bool
  tags: ['verify']

- name: "[dnsmasq] Tailnet verify: UNKNOWN without a Tailscale IP"
  ansible.builtin.debug:
    msg: >-
      UNKNOWN: nos_lan_roaming is on but this host has no Tailscale IPv4 (Tailscale down or
      logged out). The tailnet DNS instance was skipped and nothing about it was checked.
  when:
    - nos_lan_roaming | default(false) | bool
    - not (_dnsmasq_tailnet | bool)
  tags: ['verify']
