---
# ==============================================================================
# UPGRADE ENGINE
# ------------------------------------------------------------------------------
# Applies eligible upgrade recipes against the running system.  Recipes live
# in upgrades/<service>.yml and conform to state/schema/upgrade.schema.json.
#
# Execution modes:
#
#   1. Scan mode (default) — read ~/.nos/state.yml, iterate services, load
#      matching recipes per from_regex, apply in alphabetic id order.
#
#         ansible-playbook main.yml -K --tags upgrade
#
#   2. Explicit mode — caller passes the service and/or recipe id.
#
#         ansible-playbook main.yml -K --tags upgrade \
#           -e upgrade_service=grafana -e upgrade_recipe_id=grafana-11-to-12
#
#   3. Dry-run — no side effects.
#
#         ansible-playbook main.yml -K --tags upgrade -e upgrade_dry_run=true
#
# Flow per recipe:
#
#   preconditions -> pre[] -> apply[] -> post[]
#                                        |
#                                        +-- if any post step fails:
#                                            rollback[] runs in order
#
# All step executions dispatch through the merged action table
# (nos_migrate_actions + nos_upgrade_actions).  Results are recorded into
# ~/.nos/state.yml under upgrades_applied[] by the state_manager role's
# report phase.
#
# Spec reference: docs/framework-plan.md §7.2
# ==============================================================================

- name: "[Upgrade] Read current state"
  nos_state:
    action: read
  register: _upgrade_state
  tags: ['upgrade']

- name: "[Upgrade] Locate upgrade recipe files"
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/upgrades"
    patterns: "*.yml,*.yaml"
    excludes: "_template.yml"
  register: _upgrade_files
  tags: ['upgrade']

- name: "[Upgrade] Load recipe files"
  ansible.builtin.set_fact:
    _upgrade_catalog: >-
      {{
        _upgrade_catalog | default([]) +
        [ (lookup('file', item.path) | from_yaml) | combine({'__path': item.path}) ]
      }}
  loop: "{{ _upgrade_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  tags: ['upgrade']

- name: "[Upgrade] Read planned-upgrade queue from Wing (W5-B3)"
  ansible.builtin.command:
    cmd: >-
      php bin/planned-upgrades.php --list
      --data-dir={{ wing_data_dir | default(ansible_facts['env']['HOME'] ~ '/wing/app/data') }}
    chdir: "{{ wing_app_dir | default(ansible_facts['env']['HOME'] ~ '/wing/app') }}"
  register: _planned_raw
  changed_when: false
  failed_when: false
  tags: ['upgrade']

- name: "[Upgrade] Parse planned-upgrade keys (service:recipe_id)"
  ansible.builtin.set_fact:
    # Operator/agent-queued upgrades. These are eligible under --tags upgrade
    # regardless of the from_regex auto-detect — the operator explicitly
    # planned them (the only auto-apply path, per the apply-gate decision).
    _planned_keys: >-
      {{ (_planned_raw.stdout | default('[]') | trim | from_json)
         if (_planned_raw.stdout | default('') | trim | length > 0) else [] }}
  tags: ['upgrade']

- name: "[Upgrade] Filter catalog to eligible recipes"
  vars:
    _installed_map: "{{ _upgrade_state.state.services | default({}) }}"
    _target_service: "{{ upgrade_service | default('') }}"
    _target_recipe_id: "{{ upgrade_recipe_id | default('') }}"
  ansible.builtin.set_fact:
    _upgrade_plan: >-
      {{
        (_upgrade_catalog | default([]))
        | selectattr('service', 'defined')
        | selectattr('recipes', 'defined')
        | list
      }}
  tags: ['upgrade']

- name: "[Upgrade] Expand plan — one entry per matching (service, recipe)"
  vars:
    _installed_map: "{{ _upgrade_state.state.services | default({}) }}"
    _target_service: "{{ upgrade_service | default('') }}"
    _target_recipe_id: "{{ upgrade_recipe_id | default('') }}"
  ansible.builtin.set_fact:
    # Track H Phase 6 (2026-05-01): the previous expression
    # `_installed_map[item.0.service].installed if item.0.service in _installed_map else ''`
    # raised UndefinedMarker when Jinja eagerly evaluated the truthy
    # branch even on services NOT in the map. Defensive default makes
    # the lookup safe regardless of map content.
    _upgrade_jobs: >-
      {{
        _upgrade_jobs | default([]) + [
          {
            'service':   item.0.service,
            'recipe':    item.1,
            'installed': ((_installed_map | default({}))[item.0.service]
                          | default({})).installed | default(''),
            'recipe_path': item.0.__path
          }
        ]
      }}
  loop: "{{ _upgrade_plan | subelements('recipes') }}"
  loop_control:
    label: "{{ item.0.service }}:{{ item.1.id }}"
  when:
    - (_target_service | length == 0) or (item.0.service == _target_service)
    - (_target_recipe_id | length == 0) or (item.1.id == _target_recipe_id)
    # Safety carve-out: operator excludes risky/destructive recipes from a bulk
    # run, e.g. -e '{"upgrade_exclude":["postgresql"]}' to route PG's in-place
    # dump/wipe/restore through the coexistence track instead.
    - item.0.service not in (upgrade_exclude | default([]))
    # Eligible if EITHER the installed version matches from_regex (auto-detect)
    # OR the (service, recipe) is in the planned queue (W5-B3 explicit path).
    - >-
      (
        (item.0.service in _installed_map)
        and ((_installed_map[item.0.service].installed | default('')) | regex_search(item.1.from_regex) is not none)
      ) or (
        (item.0.service ~ ':' ~ item.1.id) in (_planned_keys | default([]))
      )
  tags: ['upgrade']

- name: "[Upgrade] Sort eligible jobs by recipe id (stable ordering)"
  ansible.builtin.set_fact:
    _upgrade_jobs: "{{ (_upgrade_jobs | default([])) | sort(attribute='recipe.id') }}"
  tags: ['upgrade']

- name: "[Upgrade] Summary"
  ansible.builtin.debug:
    msg: |-
      Upgrade engine: {{ _upgrade_jobs | length }} recipe(s) eligible.
      {% for job in _upgrade_jobs %}
        - [{{ job.recipe.severity }}] {{ job.service }}: {{ job.installed }} -> {{ job.recipe.to }} (recipe {{ job.recipe.id }})
      {% endfor %}
  tags: ['upgrade']

- name: "[Upgrade] No eligible recipes — exit"
  ansible.builtin.meta: end_play
  when: _upgrade_jobs | length == 0
  tags: ['upgrade']

- name: "[Upgrade] Confirm breaking upgrades"
  ansible.builtin.pause:
    prompt: |-
      {{ _upgrade_jobs | length }} upgrade(s) eligible;
      {{ _upgrade_jobs | selectattr('recipe.severity', 'in', ['breaking', 'security']) | list | length }} breaking/security.
      Press ENTER to proceed, or Ctrl+C then A to cancel.
  when:
    - _upgrade_jobs | selectattr('recipe.severity', 'in', ['breaking', 'security']) | list | length > 0
    - not (auto_upgrade | default(false) | bool)
    - not (upgrade_dry_run | default(false) | bool)
  tags: ['upgrade']

- name: "[Upgrade] Compute run timestamp (used for unique backup labels)"
  ansible.builtin.set_fact:
    _upgrade_run_ts: "{{ ansible_date_time.iso8601_basic_short }}"
  tags: ['upgrade']

# ------------------------------------------------------------------------------
# Reset-scope PREVIEW pass + session-risk pre-apply gate (Phase 3)
# ------------------------------------------------------------------------------
# Spec: docs/plans/upgrade-reset-scope-and-session-safety.md §"Execution side".
#
# Before ANY mutation we run apply_upgrade with dry_run:true over every eligible
# recipe. That call mutates nothing (backup dir + state writes are gated on
# `not dry_run` in nos_migrate.py) but returns the engine-DERIVED reset block
# per recipe — scope, session_risk, estimated_sec, affected_services/host_apps —
# floor-escalated, so a recipe with a host_app/host_reboot floor but no authored
# reset still reports the risk. We then pause ONCE, and only when at least one
# eligible recipe is session_risk (scope host_app|host_reboot).
#
# A session_risk upgrade can drop the controlling terminal/IDE; the pause exists
# so the operator can re-launch detached. NON-session_risk upgrades (container /
# stack) are unaffected by this gate — they proceed exactly as before.

- name: "[Upgrade] PREVIEW — resolve reset scope per recipe (dry-run, no side effects)"
  # dry_run:true → nos_migrate validates every step and returns the resolved
  # reset block WITHOUT applying. Independent of the operator's real
  # upgrade_dry_run choice: even a wet run needs the derived scope to decide
  # whether to pause. failed_when:false — a recipe that fails dry-run validation
  # still surfaces its reset (every return path in _apply_upgrade spreads it),
  # and the real apply loop below reports the failure authoritatively.
  nos_migrate:
    action: apply_upgrade
    upgrade:
      service: "{{ item.service }}"
      recipe: { id: "{{ item.recipe.id }}" }
      installed: "{{ item.installed }}"
      recipe_path: "{{ item.recipe_path }}"
      run_ts: "{{ _upgrade_run_ts }}"
      tmpl_vars: "{{ _upgrade_render_vars | default({}) }}"
    dry_run: true
  loop: "{{ _upgrade_jobs }}"
  loop_control:
    label: "{{ item.service }}:{{ item.recipe.id }}"
  register: _upgrade_preview
  failed_when: false
  changed_when: false
  tags: ['upgrade']

- name: "[Upgrade] Identify session-risk recipes (scope host_app|host_reboot)"
  ansible.builtin.set_fact:
    # Each preview result spreads session_risk + reset.* (see nos_migrate.py
    # _apply_upgrade success/failure return dicts). A recipe is a session risk
    # when its DERIVED scope sits in {host_app, host_reboot}.
    _session_risk_jobs: >-
      {{ (_upgrade_preview.results | default([]))
         | selectattr('session_risk', 'defined')
         | selectattr('session_risk', 'eq', true)
         | list }}
  tags: ['upgrade']

- name: "[Upgrade] Confirm session-risk upgrades (host_app / host_reboot)"
  # Modeled on tasks/pre-migrate.yml's breaking-migration confirm. Fires ONLY
  # for session_risk recipes. Triple escape hatch so it NEVER hangs a
  # non-interactive / detached / CI run:
  #   - auto_migrate=true          (shared framework auto-apply flag)
  #   - upgrade_confirmed=true     (Phase-3 explicit pre-confirm extra-var; the
  #                                 detached launcher passes this)
  #   - upgrade_dry_run=true       (a preview run never blocks)
  ansible.builtin.pause:
    prompt: |-
      {% set jobs = _session_risk_jobs | default([]) %}
      ⚠ {{ jobs | length }} eligible upgrade(s) are SESSION-RISK — they may
      restart a host app or reboot the machine and DROP this terminal/IDE session:
      {% for j in jobs %}
      {% set est = j.reset.estimated_sec | default(none) %}
      {% set why = j.reset.reason | default('') | trim %}
        - {{ j.service }} ({{ j.recipe_id | default('?') }}): scope={{ j.reset_scope | default('?') }}{% if est is not none %}, ~{{ est }}s downtime{% endif %}
      {% if why | length > 0 %}    {{ why }}
      {% endif %}
      {% endfor %}
      Recommended: cancel (Ctrl+C then A) and re-launch DETACHED so a host
      restart cannot kill the run:
        tools/nos-upgrade-detached.sh {{ (jobs | map(attribute='service') | unique | join(' ')) }}
      Press ENTER to proceed ATTACHED anyway (you may lose this session).
  when:
    - (_session_risk_jobs | default([]) | length) > 0
    - not (auto_migrate | default(false) | bool)
    - not (upgrade_confirmed | default(false) | bool)
    - not (upgrade_dry_run | default(false) | bool)
    # --check on an interactive TTY must not prompt (pause has no check-mode
    # short-circuit); matches the repo's other interactive-pause idiom.
    - not (ansible_check_mode | default(false) | bool)
  tags: ['upgrade']

# ------------------------------------------------------------------------------
# Render-var context (2026-05-30)
# ------------------------------------------------------------------------------
# Recipe steps reference play-vars ({{ rustfs_data_dir }}, {{ postgresql_port
# | default(5432) }}, ...) the module's pure-Python render layer can't see.
# We harvest every {{ identifier }} the eligible recipes mention, strip the
# engine's own runtime tokens, resolve the rest against play scope, and pass
# the values to nos_migrate as upgrade.tmpl_vars. Genuinely-undefined names
# resolve to a sentinel so the module keeps them undefined (recipe-side
# `| default(...)` then works) rather than collapsing to ''.
- name: "[Upgrade] Collect play-var names referenced by recipes"
  ansible.builtin.set_fact:
    _upgrade_render_var_names: >-
      {{ _upgrade_jobs | map(attribute='recipe') | map('to_json') | join(' ')
         | regex_findall('{{\s*([a-zA-Z_][a-zA-Z0-9_]*)')
         | difference(['recipe', 'upgrade_id', 'installed', 'run_ts', 'service',
                       'from_version_resolved'])
         | unique }}
  tags: ['upgrade']

- name: "[Upgrade] Resolve referenced play-vars (undefined-safe sentinel)"
  ansible.builtin.set_fact:
    # wantlist=true is LOAD-BEARING: without it lookup('vars', *names) returns a
    # comma-joined STRING, so `names | zip(string)` zips against the string's
    # CHARACTERS and every var collapses to its first char ('/Users/...' -> '/').
    # That rendered `rm -rf {{ postgresql_data_dir }}/*` as `rm -rf //*`. With
    # wantlist=true the lookup returns a per-name list aligned to names.
    _upgrade_render_vars: >-
      {{ dict(_upgrade_render_var_names | zip(
              lookup('vars', *_upgrade_render_var_names,
                     default='__NOS_UNDEF__', wantlist=true))) }}
  when: _upgrade_render_var_names | length > 0
  tags: ['upgrade']

# ------------------------------------------------------------------------------
# Per-job orchestration
# ------------------------------------------------------------------------------
#
# nos_migrate exposes apply for migrations; the same module handles upgrade
# dispatch via action=apply_upgrade. The Python layer consumes both action
# tables (merged via module_utils/nos_upgrade_actions/merged_handlers()) so
# a recipe's steps[*].type resolves uniformly.
#
# We delegate the pre/apply/post/rollback loop into nos_migrate itself to
# keep Jinja complexity out of this file.  Each job gets its own call; the
# module emits upgrade_start / upgrade_step_ok / upgrade_end events (see
# event.schema.json) for the callback plugin.

- name: "[Upgrade] Apply each eligible recipe"
  # 2026-05-30: do NOT pass `recipe` through here — recipe YAML carries
  # {{ var }} tokens (e.g. {{ rustfs_data_dir }}) intended for the engine's
  # OWN minimal substitution layer (defined in nos_migrate.py _apply_upgrade).
  # Ansible templates module args at finalization → boom on undefined role
  # defaults. nos_migrate now loads the recipe from recipe_path itself as raw
  # YAML, so tokens reach the engine verbatim. recipe.id is still passed via
  # the upgrade.recipe stub so the module can identify the single recipe to
  # apply inside a multi-recipe file.
  nos_migrate:
    action: apply_upgrade
    upgrade:
      service: "{{ item.service }}"
      recipe: { id: "{{ item.recipe.id }}" }
      installed: "{{ item.installed }}"
      recipe_path: "{{ item.recipe_path }}"
      run_ts: "{{ _upgrade_run_ts }}"
      tmpl_vars: "{{ _upgrade_render_vars | default({}) }}"
    dry_run: "{{ upgrade_dry_run | default(false) | bool }}"
  loop: "{{ _upgrade_jobs }}"
  loop_control:
    label: "{{ item.service }}:{{ item.recipe.id }}"
  register: _upgrade_results
  # Per-recipe failures are NOT fatal mid-loop — every eligible recipe is
  # attempted and reported. The "Result gate" task below fails the play if any
  # recipe failed, so the exit code still reflects reality. (The prior
  # self-referential failed_when silently evaluated False during its own loop,
  # masking real failures — the "failed=0 lies" footgun.)
  failed_when: false
  tags: ['upgrade']

- name: "[Upgrade] Mark planned-queue upgrades as applied (W5-B3)"
  ansible.builtin.command:
    cmd: >-
      php bin/planned-upgrades.php --mark-applied
      --service={{ item.item.service }} --recipe={{ item.item.recipe.id }}
      --data-dir={{ wing_data_dir | default(ansible_facts['env']['HOME'] ~ '/wing/app/data') }}
    chdir: "{{ wing_app_dir | default(ansible_facts['env']['HOME'] ~ '/wing/app') }}"
  loop: "{{ _upgrade_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.service }}:{{ item.item.recipe.id }}"
  when:
    - not (upgrade_dry_run | default(false) | bool)
    - (item.item.service ~ ':' ~ item.item.recipe.id) in (_planned_keys | default([]))
    - item.success | default(false) | bool
  changed_when: true
  failed_when: false
  tags: ['upgrade']

# ------------------------------------------------------------------------------
# Reboot-required marker + A9 HIGH notification (Phase 3)
# ------------------------------------------------------------------------------
# A SUCCESSFULLY-applied host_reboot-class recipe leaves the host needing a
# restart to fully settle. We drop a single ~/.nos/reboot-required.json sidecar
# marker (read by Wing's /upgrades banner; last-writer-wins if >1 host_reboot
# recipe succeeds in one run — one host restart satisfies them all) and emit a
# HIGH A9 notification via Bone. host_app-class needs NO marker — it restarts an
# app, not the machine. Skipped on dry-run. Each marker records the boot id at
# write time; the clear task below removes any marker from a PRIOR boot (the host
# has since restarted → the banner's job is done), honoring 'clears on restart'.

- name: "[Upgrade] Capture current boot id (reboot-marker freshness)"
  ansible.builtin.shell: |
    set -euo pipefail
    if [ "$(uname -s)" = "Darwin" ]; then
      sysctl -n kern.boottime | sed -E 's/.*sec = ([0-9]+).*/\1/'
    else
      cat /proc/sys/kernel/random/boot_id 2>/dev/null || echo unknown
    fi
  register: _nos_boot_id
  changed_when: false
  check_mode: false
  tags: ['upgrade']

- name: "[Upgrade] Find existing reboot-required markers"
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/.nos"
    patterns: "reboot-required*.json"
  register: _reboot_markers
  tags: ['upgrade']

- name: "[Upgrade] Clear stale reboot-required markers (host restarted since)"
  # The marker's recorded boot id differs from the live one ⇒ the host has been
  # restarted since the upgrade ⇒ the pending-restart is satisfied; drop it.
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _reboot_markers.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  # Extract boot_id by regex, NOT from_json — a corrupt non-empty marker would
  # make from_json throw; regex_search returns None on no match, so a garbled or
  # boot_id-less marker resolves to '' != the live boot id and is treated as
  # stale (removed), which is the desired self-healing behaviour.
  when: >-
    (lookup('file', item.path, errors='ignore')
      | regex_search('"boot_id"\s*:\s*"([^"]*)"', '\1') | default('', true))
    != (_nos_boot_id.stdout | default('') | trim)
  tags: ['upgrade']

- name: "[Upgrade] Identify successfully-applied host_reboot recipes"
  ansible.builtin.set_fact:
    _reboot_jobs: >-
      {{ (_upgrade_results.results | default([]))
         | selectattr('success', 'defined')
         | selectattr('success', 'eq', true)
         | selectattr('reset_scope', 'defined')
         | selectattr('reset_scope', 'eq', 'host_reboot')
         | list }}
  when: not (upgrade_dry_run | default(false) | bool)
  tags: ['upgrade']

- name: "[Upgrade] Ensure ~/.nos exists for the reboot marker"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.nos"
    state: directory
    mode: "0700"
  when:
    - not (upgrade_dry_run | default(false) | bool)
    - (_reboot_jobs | default([]) | length) > 0
  tags: ['upgrade']

- name: "[Upgrade] Write reboot-required marker (~/.nos/reboot-required.json)"
  # Single marker — the Wing reader UpgradeRepository::rebootMarker() reads this
  # exact path. boot_id is recorded so the clear task above detects a later
  # restart and removes it. NOTE: in the rare case >1 host_reboot recipe succeeds
  # in one run the last marker wins (the banner names a single service) —
  # acceptable because ONE host restart satisfies every pending host_reboot.
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.nos/reboot-required.json"
    mode: "0644"
    content: >-
      {{
        {
          'service': item.service | default('unknown'),
          'recipe_id': item.recipe_id | default('unknown'),
          'upgrade_id': item.upgrade_id | default(''),
          'scope': item.reset_scope | default('host_reboot'),
          'estimated_sec': item.reset.estimated_sec | default(none),
          'reason': item.reset.reason | default(''),
          'requested_at': _upgrade_run_ts,
          'boot_id': _nos_boot_id.stdout | default('') | trim
        } | to_nice_json
      }}
  loop: "{{ _reboot_jobs | default([]) }}"
  loop_control:
    label: "{{ item.service | default('?') }}:{{ item.recipe_id | default('?') }}"
  when:
    - not (upgrade_dry_run | default(false) | bool)
    - (_reboot_jobs | default([]) | length) > 0
  tags: ['upgrade']

- name: "[Upgrade] Emit HIGH A9 'reboot_required' notification via Bone"
  # Canonical A9 emit (HMAC-signed POST to Bone /api/v1/notifications). Uses a
  # LITERAL title+body+channels — NOT template+context: a template name only
  # resolves if a harvested plugin manifest registers it, and upgrade-engine is a
  # tasks/ flow, not a files/anatomy/plugins/* manifest, so 'reboot_required'
  # would 404 in Bone's _lookup_template -> 400 -> the notification is silently
  # dropped under failed_when:false. A literal title+body bypasses the lookup and
  # lands via the on_high routing fallback (channels listed explicitly to page).
  # Skips quietly when the HMAC secret is unset (CI / a host without Wing).
  # sort_keys + compact canonical body is load-bearing — Bone re-canonicalizes
  # before verifying the signature.
  # environment: pass the HMAC secret + Bone URL into the shell (mirrors
  # tasks/devlog-sync.yml). Without this the shell's $WING_EVENTS_HMAC_SECRET is
  # unset and the task ALWAYS self-skips, so the notification would never fire.
  environment:
    WING_EVENTS_HMAC_SECRET: "{{ wing_events_hmac_secret | default('') }}"
    BONE_URL: "http://127.0.0.1:{{ bone_port | default(8099) }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      if [ -z "${WING_EVENTS_HMAC_SECRET:-}" ]; then
        echo "INFO: WING_EVENTS_HMAC_SECRET unset — skipping reboot_required notification"
        exit 0
      fi
      body=$(jq -n \
        --arg svc {{ item.service | default('unknown') | quote }} \
        --arg rid {{ item.recipe_id | default('unknown') | quote }} \
        --arg uid {{ item.upgrade_id | default('') | quote }} \
        --arg scope {{ item.reset_scope | default('host_reboot') | quote }} \
        '{severity: "high",
          title: ("Reboot pending to finish " + $svc + " upgrade"),
          body: ("A host_reboot-class upgrade (" + $rid + ") was applied for " + $svc + ". The host must be restarted to finish settling — nOS never restarts the machine for you."),
          channels: ["wing-inbox", "ntfy"],
          origin_plugin: "upgrade-engine",
          actor_id: "engine:upgrade",
          actor_action_id: $uid,
          metadata: {service: $svc, recipe_id: $rid, scope: $scope}}')
      compact=$(echo "$body" | jq --sort-keys -c .)
      ts=$(date +%s)
      sig=$(printf '%s.%s' "$ts" "$compact" \
            | openssl dgst -sha256 -hmac "$WING_EVENTS_HMAC_SECRET" \
            | awk '{print $NF}')
      code=$(curl -sS -o /dev/null -w "%{http_code}" \
        -X POST \
        -H "X-Wing-Timestamp: $ts" \
        -H "X-Wing-Signature: $sig" \
        -H "Content-Type: application/json" \
        -d "$compact" \
        "${BONE_URL:-http://127.0.0.1:9000}/api/v1/notifications" 2>&1 || echo "000")
      if [ "$code" = "200" ] || [ "$code" = "201" ]; then
        echo "INFO: reboot_required notification emitted (service={{ item.service | default('?') }})"
      else
        echo "WARN: reboot_required notification POST returned HTTP $code"
      fi
  loop: "{{ _reboot_jobs | default([]) }}"
  loop_control:
    label: "{{ item.service | default('?') }}:{{ item.recipe_id | default('?') }}"
  when:
    - not (upgrade_dry_run | default(false) | bool)
    - (_reboot_jobs | default([]) | length) > 0
  changed_when: false
  failed_when: false
  tags: ['upgrade']

- name: "[Upgrade] Persist updated state"
  # nos_migrate apply_upgrade already writes upgrades_applied[] to state.yml
  # (it owns state_path). This is a final consistency merge-touch — action=write
  # requires state + state_path (bare write errored, never caught because the
  # engine was orphaned until wired under --tags upgrade). Skip on dry-run so a
  # preview leaves the state file untouched.
  nos_state:
    action: write
    state_path: "{{ ansible_facts['env']['HOME'] }}/.nos/state.yml"
    merge: true
    state: {}
  when: not (upgrade_dry_run | default(false) | bool)
  # runtime-state refresh; not idempotency-relevant — a merge-touch consistency
  # write whose only delta is the freshly stamped generated_at (the actual
  # upgrades_applied[] rows are written by nos_migrate apply_upgrade above).
  changed_when: false
  tags: ['upgrade']

- name: "[Upgrade] Final summary"
  ansible.builtin.debug:
    msg: |-
      Upgrade run complete.
      {% for r in (_upgrade_results.results | default([])) %}
      {% set job = r.item %}
        - {{ job.service }}:{{ job.recipe.id }} -> {{ 'ok' if r.success | default(false) else 'FAILED' }}
        {% if not r.success | default(false) %}    error: {{ r.error | default(r.msg) | default('unknown') }} (phase {{ r.failed_phase | default('?') }}, step {{ r.failed_step | default('?') }}){% endif %}
        {% if r.rolled_back | default(false) %}(rolled back){% endif %}
      {% endfor %}
  tags: ['upgrade']

- name: "[Upgrade] Result gate — non-zero exit if any recipe failed"
  vars:
    _upgrade_failed: >-
      {{ (_upgrade_results.results | default([]))
         | rejectattr('success', 'eq', true)
         | map(attribute='item') | map(attribute='service') | list }}
  ansible.builtin.fail:
    msg: >-
      Upgrade engine: {{ _upgrade_failed | length }} recipe(s) FAILED
      ({{ _upgrade_failed | join(', ') }}) — see '[Upgrade] Final summary' above.
  when:
    - not (upgrade_dry_run | default(false) | bool)
    - _upgrade_failed | length > 0
  tags: ['upgrade']
