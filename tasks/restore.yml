---
# ==============================================================================
# RESTORE - pull backups from RustFS (S3) and replay into live services
# ------------------------------------------------------------------------------
# Contract with pazny.backup (Agent C1):
#   Backups live at  s3://backups/<YYYY-MM-DD>/<source>.<ext>   via RustFS
#   Endpoint:        http://127.0.0.1:{{ rustfs_api_port | default(9010) }}
#   Sources (object stem = restore source; one fixed key per source per day):
#     mariadb.sql.gz             mariadb-dump --all-databases
#     postgres.sql.gz            pg_dumpall
#     volume-<name>.tar.gz       Docker named volume tarball
#     dir-<name>.tar.gz          host-bind dir (gitea/gitlab repos)
#     wing-db.sql.gz             Wing SQLite store (sqlite3 .dump)
#     keap-db.gz                 KEAP cortex libSQL store (sqlite3 .backup, binary)
#     nos-state.tar.gz           ~/.nos/{secrets,state}.yml (GATED: -e restore_state=true)
#     authentik-blueprints.json  Authentik export (durable state restores via the postgres dump)
#
# Invocation:
#   ansible-playbook main.yml -K --tags restore \
#       -e restore_date=2026-04-20 \
#       [-e restore_sources=mariadb,postgres,volume-mariadb_data]
#
# If restore_sources is omitted, every source at that date is restored.
# ==============================================================================

# ── 0. Guardrails ─────────────────────────────────────────────────────────────

- name: "[Restore] Validate restore_date is provided"
  ansible.builtin.fail:
    msg: |
      restore_date is not set. Pass the backup date on the CLI, e.g.:
        ansible-playbook main.yml -K --tags restore -e restore_date=2026-04-20
      List available dates with:
        aws --endpoint-url http://127.0.0.1:{{ rustfs_api_port | default(9010) }} s3 ls backups/
  when: restore_date is not defined or (restore_date | string | length) == 0

- name: "[Restore] Validate restore_date format (YYYY-MM-DD)"
  ansible.builtin.fail:
    msg: "restore_date='{{ restore_date }}' — expected ISO date YYYY-MM-DD"
  when: restore_date is not match('^[0-9]{4}-[0-9]{2}-[0-9]{2}$')

- name: "[Restore] Verify aws CLI is installed"
  ansible.builtin.command: which aws
  register: aws_which
  changed_when: false
  failed_when: aws_which.rc != 0

- name: "[Restore] Verify docker is available"
  ansible.builtin.command: which docker
  register: docker_which
  changed_when: false
  failed_when: docker_which.rc != 0

# ── 1. Resolve configuration ──────────────────────────────────────────────────

- name: "[Restore] Set restore run-time facts"
  ansible.builtin.set_fact:
    restore_s3_endpoint: "http://127.0.0.1:{{ rustfs_api_port | default(9010) }}"
    restore_s3_bucket: "backups"
    restore_s3_prefix: "{{ restore_date }}/"
    restore_workdir: "{{ ansible_facts['env']['HOME'] }}/restore-temp/{{ restore_date }}"
    restore_started_at: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -Iseconds')) }}"
    restore_requested_sources: >-
      {{ (restore_sources | default('') | string).split(',')
         | map('trim') | reject('equalto', '') | list }}
    # MUST equal roles/pazny.backup defaults backup_alpine_image (pinned by
    # tests/anatomy/test_backup_restore_contract.py).
    restore_alpine_image: "alpine:3.20"
    # name → host target path for `dir-<name>` sources (mirrors
    # backup_dirs_to_dump). Derived from the *_data_dir config vars so an
    # external-storage redirect lands the restore on the same disk.
    restore_dir_targets:
      gitea: "{{ gitea_data_dir | default(ansible_facts['env']['HOME'] + '/gitea') }}"
      gitlab: "{{ gitlab_data_dir | default(ansible_facts['env']['HOME'] + '/gitlab') }}"
      gitlab-config: "{{ gitlab_config_dir | default(ansible_facts['env']['HOME'] + '/gitlab-config') }}"
      # S4 (2026-06-10) — mirrors the backup_dirs_to_dump extension:
      vaultwarden: "{{ vaultwarden_data_dir | default(ansible_facts['env']['HOME'] + '/vaultwarden') }}"
      n8n: "{{ n8n_data_dir | default(ansible_facts['env']['HOME'] + '/n8n') }}"
      nodered: "{{ nodered_data_dir | default(ansible_facts['env']['HOME'] + '/nodered/data') }}"
      authentik: "{{ authentik_data_dir | default(ansible_facts['env']['HOME'] + '/authentik') }}"

- name: "[Restore] Prepare AWS environment block"
  ansible.builtin.set_fact:
    restore_aws_env:
      AWS_ACCESS_KEY_ID: "{{ rustfs_access_key }}"
      AWS_SECRET_ACCESS_KEY: "{{ rustfs_secret_key }}"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: "us-east-1"
  no_log: true

# ── 2. List available objects at the requested date ──────────────────────────

- name: "[Restore] List backup objects at s3://{{ restore_s3_bucket }}/{{ restore_s3_prefix }}"
  ansible.builtin.command: >
    aws --endpoint-url {{ restore_s3_endpoint }}
    s3 ls s3://{{ restore_s3_bucket }}/{{ restore_s3_prefix }}
  environment: "{{ restore_aws_env }}"
  register: restore_ls
  changed_when: false
  failed_when: false
  no_log: true

- name: "[Restore] Bail if no backups exist at the requested date"
  ansible.builtin.fail:
    msg: |
      No backups found at s3://{{ restore_s3_bucket }}/{{ restore_s3_prefix }}
      Endpoint: {{ restore_s3_endpoint }}
      List available dates:
        aws --endpoint-url {{ restore_s3_endpoint }} s3 ls {{ restore_s3_bucket }}/
  when: restore_ls.rc != 0 or (restore_ls.stdout | default('') | trim | length) == 0

- name: "[Restore] Parse available source filenames"
  ansible.builtin.set_fact:
    restore_available_files: >-
      {{ restore_ls.stdout_lines
         | map('regex_replace', '^.*\\s+([^\\s]+)$', '\\1')
         | reject('equalto', '')
         | list }}

- name: "[Restore] Build list of sources to restore"
  # `s3file` is the object key (may carry a `.enc` suffix from client-side
  # encryption); `file` is the local PLAINTEXT name decryption produces, which
  # every downstream replay step operates on. `.enc` is transparent to the
  # operator's restore_sources filter (matched against the plaintext name).
  # Stem normalization yields the canonical `source` that the per-type blocks
  # switch on. Strips: .enc → compression/format ext → a trailing ISO timestamp
  # (legacy drifted keys) → alias-maps the legacy `-all`/`postgresql` stems. So
  # BOTH the current contract (mariadb.sql.gz) and any legacy object
  # (mariadb-all.<ts>.sql.gz) resolve to the same source. Pinned by
  # tests/anatomy/test_backup_restore_contract.py.
  ansible.builtin.set_fact:
    restore_plan: >-
      {%- set plan = [] -%}
      {%- set aliases = {'mariadb-all': 'mariadb', 'postgresql-all': 'postgres', 'postgresql': 'postgres'} -%}
      {%- for f in restore_available_files -%}
        {%- set plain = f | regex_replace('\\.enc$', '') -%}
        {%- set noext = plain | regex_replace('\\.sql\\.gz$|\\.tar\\.gz$|\\.json\\.gz$|\\.json$|\\.gz$', '') -%}
        {%- set nots = noext | regex_replace('\\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:-]+Z?$', '') -%}
        {%- set stem = aliases.get(nots, nots) -%}
        {%- if (restore_requested_sources | length) == 0
               or stem in restore_requested_sources
               or plain in restore_requested_sources -%}
          {%- set _ = plan.append({'s3file': f, 'file': plain, 'source': stem,
                                    'encrypted': f.endswith('.enc')}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ plan }}

- name: "[Restore] Bail if nothing matches restore_sources filter"
  ansible.builtin.fail:
    msg: |
      No files at {{ restore_s3_prefix }} match restore_sources={{ restore_requested_sources }}.
      Available: {{ restore_available_files }}
  when: restore_plan | length == 0

- name: "[Restore] Show restore plan"
  ansible.builtin.debug:
    msg: |
      Restore plan for {{ restore_date }}:
      Endpoint:  {{ restore_s3_endpoint }}
      Bucket:    s3://{{ restore_s3_bucket }}/{{ restore_s3_prefix }}
      Files:     {{ restore_plan | map(attribute='file') | list | join(', ') }}
      Target:    live services (infra stack must be running)
      Work dir:  {{ restore_workdir }}

# ── 3. Destructive-action safety prompt ───────────────────────────────────────

- name: "[Restore] Interactive confirmation (operator must press ENTER)"
  ansible.builtin.pause:
    prompt: |

      ╔══════════════════════════════════════════════════════════════════════╗
      ║                  *** DESTRUCTIVE RESTORE AHEAD ***                   ║
      ╠══════════════════════════════════════════════════════════════════════╣
      ║ Date:       {{ restore_date }}
      ║ Sources:    {{ restore_plan | map(attribute='source') | list | join(', ') }}
      ║ Mode:       {{ 'CHECK (dry-run, no writes)' if ansible_check_mode else 'LIVE (will overwrite data)' }}
      ║
      ║ This will (only for the sources present above):
      ║   * Drop-and-replace MariaDB / PostgreSQL databases from dumps
      ║   * Stop containers using targeted Docker volumes / host-bind dirs and rewrite them
      ║   * Rebuild wing.db (stops Wing; live db snapshotted to .pre-restore-<date>)
      ║   * ~/.nos state: ONLY if -e restore_state=true (else skipped)
      ║   * Authentik: restored via the postgres dump (blueprint JSON staged, not re-POSTed)
      ║
      ║ There is NO undo. Take a fresh backup first if unsure.
      ║ Press ENTER to continue, Ctrl-C to abort.
      ╚══════════════════════════════════════════════════════════════════════╝
  when: not ansible_check_mode and not (restore_auto_confirm | default(false) | bool)

- name: "[Restore] Ensure restore work-dir exists"
  ansible.builtin.file:
    path: "{{ restore_workdir }}"
    state: directory
    mode: '0700'

# ── 4. Download every planned object ──────────────────────────────────────────

- name: "[Restore] Download backups to {{ restore_workdir }}"
  ansible.builtin.command: >
    aws --endpoint-url {{ restore_s3_endpoint }}
    s3 cp s3://{{ restore_s3_bucket }}/{{ restore_s3_prefix }}{{ item.s3file }}
    {{ restore_workdir }}/{{ item.s3file }}
  environment: "{{ restore_aws_env }}"
  loop: "{{ restore_plan }}"
  loop_control:
    label: "{{ item.s3file }}"
  register: restore_downloads
  changed_when: true
  no_log: true

# Decrypt client-side-encrypted objects in place (.enc → plaintext name).
# Mirror of encrypt_stream() in roles/pazny.backup/files/backup.sh — cipher
# params MUST match. Plaintext objects skip this; downstream steps then operate
# uniformly on `item.file`. Fails loud (no fallback) on a wrong/missing passphrase.
- name: "[Restore] Decrypt encrypted objects (.enc → plaintext)"
  ansible.builtin.shell: |
    set -o pipefail
    # Mirror resolve_openssl() in roles/pazny.backup/files/backup.sh — the system
    # `openssl` (old macOS LibreSSL) may lack `enc -pbkdf2`; probe candidates so
    # the cipher matches the producer exactly. Fail closed if none qualify.
    resolve_openssl() {
      local cand
      for cand in openssl /opt/homebrew/opt/openssl@3/bin/openssl \
                  /usr/local/opt/openssl@3/bin/openssl /usr/bin/openssl; do
        command -v "$cand" >/dev/null 2>&1 || continue
        if printf 'x' | "$cand" enc -aes-256-cbc -pbkdf2 -iter 1 -salt \
               -pass pass:probe >/dev/null 2>&1; then
          echo "$cand"; return 0
        fi
      done
      return 1
    }
    OSSL="$(resolve_openssl)" || { echo "FATAL: no -pbkdf2-capable openssl on PATH" >&2; exit 1; }
    # P2 key ring: try the current key, then every retired one. Restoring an
    # archive written BEFORE a key rotation is the normal case during the first
    # retention window after P2 lands — a single-key restore would fail on it
    # and look like backup corruption.
    # while-read over a here-string, NOT `mapfile`: macOS /bin/bash is 3.2 and
    # has no mapfile. A here-string keeps this in the current shell, so the
    # early exit below really exits the task.
    idx=0
    while IFS= read -r key; do
      if [ -n "$key" ] \
         && NOS_BACKUP_PASS="$key" "$OSSL" enc -d -aes-256-cbc -md sha512 \
              -pbkdf2 -iter 100000 -salt -pass env:NOS_BACKUP_PASS \
              -in "{{ restore_workdir }}/{{ item.s3file }}" \
              -out "{{ restore_workdir }}/{{ item.file }}" 2>/dev/null \
         && [ -s "{{ restore_workdir }}/{{ item.file }}" ]; then
        [ "$idx" -ne 0 ] && echo "note: {{ item.s3file }} opened with retired key ${idx}"
        exit 0
      fi
      idx=$((idx + 1))
    done <<< "${NOS_RESTORE_KEYS_RAW}"
    echo "FATAL: no key in the ring decrypted {{ item.s3file }}" >&2
    exit 1
  args:
    executable: /bin/bash
  environment:
    # Newline-separated so the shell can split it without exposing the values
    # on a command line (they would otherwise show in `ps`).
    NOS_RESTORE_KEYS_RAW: |-
      {{ ([backup_encryption_passphrase | default('')]
          + (backup_encryption_keys_previous | default([]))) | join('\n') }}
  loop: "{{ restore_plan | selectattr('encrypted') | list }}"
  loop_control:
    label: "{{ item.s3file }}"
  register: restore_decrypt
  changed_when: restore_decrypt.rc == 0
  no_log: true
  when: not ansible_check_mode

- name: "[Restore] Stat downloaded files (for summary)"
  ansible.builtin.stat:
    path: "{{ restore_workdir }}/{{ item.file }}"
  loop: "{{ restore_plan }}"
  loop_control:
    label: "{{ item.file }}"
  register: restore_stats

# ── 5. Per-source restore (idempotent per type) ───────────────────────────────

- name: "[Restore] Initialise restore summary"
  ansible.builtin.set_fact:
    restore_summary: []

# 5a. MariaDB ------------------------------------------------------------------

- name: "[Restore][mariadb] Replay SQL dump into infra-mariadb-1"
  when:
    - restore_plan | selectattr('source', 'equalto', 'mariadb') | list | length > 0
    - not ansible_check_mode
  block:
    - name: "[Restore][mariadb] Ensure MariaDB container is running"
      ansible.builtin.command: docker ps --filter "name=infra-mariadb-1" --format "{% raw %}{{.Names}}{% endraw %}"
      register: maria_ps
      changed_when: false

    - name: "[Restore][mariadb] Fail if MariaDB is not running"
      ansible.builtin.fail:
        msg: "infra-mariadb-1 is not running. Bring up the infra stack before restoring."
      when: "'infra-mariadb-1' not in maria_ps.stdout"

    - name: "[Restore][mariadb] Resolve dump file + start time"
      ansible.builtin.set_fact:
        maria_t0: "{{ lookup('pipe', 'date +%s') }}"
        maria_file: >-
          {{ restore_plan | selectattr('source', 'equalto', 'mariadb')
             | map(attribute='file') | list | last }}

    - name: "[Restore][mariadb] Pipe gunzip'd dump into mariadb client"
      ansible.builtin.shell: |
        set -o pipefail
        gunzip -c {{ restore_workdir }}/{{ maria_file }} \
          | docker exec -i infra-mariadb-1 \
              mariadb -uroot -p"{{ mariadb_root_password | default(global_password_prefix + '_pw_mariadb') }}"
      args:
        executable: /bin/bash
      register: maria_restore
      no_log: true
      changed_when: maria_restore.rc == 0

    - name: "[Restore][mariadb] Append to summary"
      ansible.builtin.set_fact:
        restore_summary: "{{ restore_summary + [{
          'source': 'mariadb',
          'status': 'ok',
          'duration_s': ((lookup('pipe', 'date +%s') | int) - (maria_t0 | int)),
          'size_bytes': (restore_stats.results
                          | selectattr('item.source','equalto','mariadb')
                          | map(attribute='stat.size') | list | first | default(0))
        }] }}"

# 5b. PostgreSQL ---------------------------------------------------------------

- name: "[Restore][postgres] Replay pg_dumpall into infra-postgresql-1"
  when:
    - restore_plan | selectattr('source', 'equalto', 'postgres') | list | length > 0
    - not ansible_check_mode
  block:
    - name: "[Restore][postgres] Ensure PostgreSQL container is running"
      ansible.builtin.command: docker ps --filter "name=infra-postgresql-1" --format "{% raw %}{{.Names}}{% endraw %}"
      register: pg_ps
      changed_when: false

    - name: "[Restore][postgres] Fail if PostgreSQL is not running"
      ansible.builtin.fail:
        msg: "infra-postgresql-1 is not running. Bring up the infra stack before restoring."
      when: "'infra-postgresql-1' not in pg_ps.stdout"

    - name: "[Restore][postgres] Resolve dump file + start time"
      ansible.builtin.set_fact:
        pg_t0: "{{ lookup('pipe', 'date +%s') }}"
        pg_file: >-
          {{ restore_plan | selectattr('source', 'equalto', 'postgres')
             | map(attribute='file') | list | last }}

    - name: "[Restore][postgres] Pipe gunzip'd pg_dumpall into psql"
      ansible.builtin.shell: |
        set -o pipefail
        gunzip -c {{ restore_workdir }}/{{ pg_file }} \
          | docker exec -i infra-postgresql-1 psql -U postgres -v ON_ERROR_STOP=0
      args:
        executable: /bin/bash
      register: pg_restore
      no_log: true
      changed_when: pg_restore.rc == 0

    - name: "[Restore][postgres] Append to summary"
      ansible.builtin.set_fact:
        restore_summary: "{{ restore_summary + [{
          'source': 'postgres',
          'status': 'ok',
          'duration_s': ((lookup('pipe', 'date +%s') | int) - (pg_t0 | int)),
          'size_bytes': (restore_stats.results
                          | selectattr('item.source','equalto','postgres')
                          | map(attribute='stat.size') | list | first | default(0))
        }] }}"

# 5c. Docker named volumes (volume-<name>.tar.gz) ------------------------------

- name: "[Restore][volumes] Enumerate volume-* sources"
  ansible.builtin.set_fact:
    restore_volume_plan: >-
      {{ restore_plan
         | selectattr('source', 'match', '^volume-')
         | list }}

- name: "[Restore][volumes] Restore each Docker volume from tarball"
  when:
    - restore_volume_plan | length > 0
    - not ansible_check_mode
  loop: "{{ restore_volume_plan }}"
  loop_control:
    label: "{{ item.source }}"
  ansible.builtin.include_tasks: _restore_volume.yml

# 5d. Authentik blueprints ----------------------------------------------------

- name: "[Restore][authentik] Re-apply blueprints JSON via API"
  when:
    - restore_plan | selectattr('source', 'equalto', 'authentik-blueprints') | list | length > 0
    - not ansible_check_mode
  block:
    - name: "[Restore][authentik] Resolve blueprints file + start time"
      ansible.builtin.set_fact:
        ak_t0: "{{ lookup('pipe', 'date +%s') }}"
        ak_file: >-
          {{ restore_plan | selectattr('source', 'equalto', 'authentik-blueprints')
             | map(attribute='file') | list | last }}

    - name: "[Restore][authentik] Gunzip legacy .json.gz blueprint (defensive)"
      ansible.builtin.shell: |
        set -o pipefail
        gunzip -c "{{ restore_workdir }}/{{ ak_file }}" > "{{ restore_workdir }}/authentik-blueprints.json"
      args:
        executable: /bin/bash
      when: ak_file is search('\.gz$')
      changed_when: true

    # NO direct re-POST: the GET export is a PAGINATED LIST and
    # POST /api/v3/managed/blueprints/ expects a SINGLE {name,path} object →
    # the old call always 400'd (masked by failed_when:false → silent 'warn').
    # Authentik's durable state — users, groups, flows, OIDC providers AND the
    # BlueprintInstance rows — is restored by the PostgreSQL dump (authentik DB);
    # file-based blueprints are re-applied by the worker on container start. The
    # JSON export is staged on disk for inspection / manual re-apply only.
    - name: "[Restore][authentik] Note how Authentik state is restored"
      ansible.builtin.debug:
        msg: >-
          Authentik restores via the PostgreSQL 'postgres' source (the authentik DB
          holds users/flows/providers/blueprint instances). The blueprint JSON export
          is staged at {{ restore_workdir }}/{{ 'authentik-blueprints.json' if ak_file is search('\.gz$') else ak_file }}
          for inspection. To fully restore Authentik, ensure the 'postgres' source is
          in this restore (it is, in a full restore).

    - name: "[Restore][authentik] Append to summary"
      ansible.builtin.set_fact:
        restore_summary: "{{ restore_summary + [{
          'source': 'authentik-blueprints',
          'status': 'staged (restores via postgres dump)',
          'duration_s': ((lookup('pipe', 'date +%s') | int) - (ak_t0 | int)),
          'size_bytes': (restore_stats.results
                          | selectattr('item.source','equalto','authentik-blueprints')
                          | map(attribute='stat.size') | list | first | default(0))
        }] }}"

# 5e. Wing SQLite store (wing-db.sql.gz) ---------------------------------------

- name: "[Restore][wing-db] Replay sqlite3 .dump into wing.db"
  when:
    - restore_plan | selectattr('source', 'equalto', 'wing-db') | list | length > 0
    - not ansible_check_mode
  vars:
    wing_db_target: "{{ wing_data_dir | default(ansible_facts['env']['HOME'] + '/wing/app/data') }}/wing.db"
    wing_label: "{{ wing_launchd_label | default('eu.thisisait.nos.wing') }}"
    wing_uid: "{{ ansible_facts['user_uid'] | default(lookup('pipe', 'id -u')) }}"
  # block/rescue/always so a failed rebuild (sqlite3 absent on a Linux DR / a
  # corrupt .gz) can NEVER leave Wing booted-out with its DB renamed away:
  #   block  — preflight (FAIL before touching the live db) → stop → snapshot → rebuild → summary
  #   rescue — roll the snapshot back, then re-raise loud
  #   always — restart Wing no matter what
  block:
    - name: "[Restore][wing-db] Pre-flight: require sqlite3 (BEFORE mutating wing.db)"  # noqa: command-instead-of-shell
      # `command -v` is a shell builtin (needs shell, not command). Fails the block
      # here, while wing.db is still in place and Wing still up.
      ansible.builtin.shell: command -v sqlite3
      changed_when: false

    - name: "[Restore][wing-db] Resolve dump file + start time"
      ansible.builtin.set_fact:
        wing_t0: "{{ lookup('pipe', 'date +%s') }}"
        wing_db_file: >-
          {{ restore_plan | selectattr('source', 'equalto', 'wing-db')
             | map(attribute='file') | list | last }}

    - name: "[Restore][wing-db] Stop Wing (best-effort — frees the sqlite lock)"
      ansible.builtin.command: >-
        {{ ('launchctl bootout gui/' ~ wing_uid ~ '/' ~ wing_label)
           if (nos_service_manager | default('launchd')) == 'launchd'
           else ('systemctl --user stop ' ~ wing_label) }}
      changed_when: true
      failed_when: false

    - name: "[Restore][wing-db] Snapshot current wing.db (non-clobbering)"
      # `mv -n` so a RE-RUN (where wing.db is now the already-restored copy)
      # cannot overwrite the genuine first-run pre-restore snapshot.
      ansible.builtin.command: >-
        mv -n "{{ wing_db_target }}" "{{ wing_db_target }}.pre-restore-{{ restore_date }}"
      args:
        removes: "{{ wing_db_target }}"
      changed_when: true
      failed_when: false

    - name: "[Restore][wing-db] Rebuild wing.db from the dump"
      ansible.builtin.shell: |
        set -o pipefail
        gunzip -c "{{ restore_workdir }}/{{ wing_db_file }}" | sqlite3 "{{ wing_db_target }}"
      args:
        executable: /bin/bash
      register: wing_db_replay
      changed_when: wing_db_replay.rc == 0

    - name: "[Restore][wing-db] Append to summary"
      ansible.builtin.set_fact:
        restore_summary: "{{ restore_summary + [{
          'source': 'wing-db', 'status': 'ok',
          'duration_s': ((lookup('pipe', 'date +%s') | int) - (wing_t0 | int)),
          'size_bytes': (restore_stats.results
                          | selectattr('item.source','equalto','wing-db')
                          | map(attribute='stat.size') | list | first | default(0))
        }] }}"
  rescue:
    - name: "[Restore][wing-db] FAILED — roll the pre-restore snapshot back"
      ansible.builtin.command: >-
        mv -f "{{ wing_db_target }}.pre-restore-{{ restore_date }}" "{{ wing_db_target }}"
      args:
        removes: "{{ wing_db_target }}.pre-restore-{{ restore_date }}"
      changed_when: true
      failed_when: false

    - name: "[Restore][wing-db] Re-raise the failure"
      ansible.builtin.fail:
        msg: >-
          wing-db restore failed (sqlite3 missing, or a corrupt/partial dump).
          The live wing.db was rolled back from the .pre-restore snapshot and Wing
          is being restarted. Install sqlite3 / pick a different restore_date, then retry.
  always:
    - name: "[Restore][wing-db] Ensure Wing is restarted"
      ansible.builtin.command: >-
        {{ ('launchctl bootstrap gui/' ~ wing_uid ~ ' ' ~ ansible_facts['env']['HOME'] ~ '/Library/LaunchAgents/' ~ wing_label ~ '.plist')
           if (nos_service_manager | default('launchd')) == 'launchd'
           else ('systemctl --user start ' ~ wing_label) }}
      changed_when: true
      failed_when: false

# 5e-2. KEAP cortex libSQL store (keap-db.gz) --------------------------------
# NOT a sqlite3 replay: the backup is a binary online-`.backup` copy (the
# vector index uses libsql_vector_idx(), which host sqlite3 can't rebuild from
# a .dump). Restore = gunzip the binary DB straight into place. KEAP is a
# Docker container, so stop it first to release the WAL lock, then start it.
- name: "[Restore][keap-db] Restore keap.db (binary .backup copy)"
  when:
    - restore_plan | selectattr('source', 'equalto', 'keap-db') | list | length > 0
    - not ansible_check_mode
  vars:
    keap_db_target: "{{ keap_data_dir | default(ansible_facts['env']['HOME'] + '/keap/data') }}/keap.db"
  # block/rescue/always so a failed decompress can NEVER leave keap stopped
  # with its DB renamed away: snapshot → gunzip → summary; roll back on fail;
  # always restart the container.
  block:
    - name: "[Restore][keap-db] Pre-flight: require gunzip (BEFORE mutating keap.db)"  # noqa: command-instead-of-shell
      ansible.builtin.shell: command -v gunzip
      changed_when: false

    - name: "[Restore][keap-db] Resolve backup file + start time"
      ansible.builtin.set_fact:
        keap_t0: "{{ lookup('pipe', 'date +%s') }}"
        keap_db_file: >-
          {{ restore_plan | selectattr('source', 'equalto', 'keap-db')
             | map(attribute='file') | list | last }}

    - name: "[Restore][keap-db] Stop keap container (frees the WAL lock)"
      ansible.builtin.command: "{{ docker_bin | default('docker') }} stop {{ backup_keap_container | default('iiab-keap-1') }}"
      changed_when: true
      failed_when: false

    - name: "[Restore][keap-db] Snapshot current keap.db (non-clobbering)"
      ansible.builtin.command: >-
        mv -n "{{ keap_db_target }}" "{{ keap_db_target }}.pre-restore-{{ restore_date }}"
      args:
        removes: "{{ keap_db_target }}"
      changed_when: true
      failed_when: false

    - name: "[Restore][keap-db] Rebuild keap.db from the binary backup"
      ansible.builtin.shell: |
        set -o pipefail
        gunzip -c "{{ restore_workdir }}/{{ keap_db_file }}" > "{{ keap_db_target }}"
      args:
        executable: /bin/bash
      register: keap_db_replay
      changed_when: keap_db_replay.rc == 0

    - name: "[Restore][keap-db] Append to summary"
      ansible.builtin.set_fact:
        restore_summary: "{{ restore_summary + [{
          'source': 'keap-db', 'status': 'ok',
          'duration_s': ((lookup('pipe', 'date +%s') | int) - (keap_t0 | int)),
          'size_bytes': (restore_stats.results
                          | selectattr('item.source','equalto','keap-db')
                          | map(attribute='stat.size') | list | first | default(0))
        }] }}"
  rescue:
    - name: "[Restore][keap-db] FAILED — roll the pre-restore snapshot back"
      ansible.builtin.command: >-
        mv -f "{{ keap_db_target }}.pre-restore-{{ restore_date }}" "{{ keap_db_target }}"
      args:
        removes: "{{ keap_db_target }}.pre-restore-{{ restore_date }}"
      changed_when: true
      failed_when: false

    - name: "[Restore][keap-db] Re-raise the failure"
      ansible.builtin.fail:
        msg: >-
          keap-db restore failed (gunzip missing, or a corrupt/partial backup).
          The live keap.db was rolled back from the .pre-restore snapshot and the
          keap container is being restarted. Pick a different restore_date, then retry.
  always:
    - name: "[Restore][keap-db] Ensure keap container is restarted"
      ansible.builtin.command: "{{ docker_bin | default('docker') }} start {{ backup_keap_container | default('iiab-keap-1') }}"
      changed_when: true
      failed_when: false

# 5f. Runtime state side-car (nos-state.tar.gz) — GATED behind restore_state ----
# Restoring ~/.nos overwrites secrets.yml/state.yml. A NEWER live secrets.yml
# (post-rekey, fresh tokens) would be clobbered → SSO brick. Default SKIP; opt
# in only on a true DR onto a fresh host: -e restore_state=true.

- name: "[Restore][nos-state] Present in backup but NOT restored (default)"
  ansible.builtin.debug:
    msg: >-
      nos-state is in this backup but was NOT restored. Pass -e restore_state=true
      to restore ~/.nos (overwrites live secrets.yml/state.yml — only on fresh-host DR).
  when:
    - restore_plan | selectattr('source', 'equalto', 'nos-state') | list | length > 0
    - not (restore_state | default(false) | bool)

- name: "[Restore][nos-state] Extract ~/.nos side-car (restore_state=true)"
  when:
    - restore_plan | selectattr('source', 'equalto', 'nos-state') | list | length > 0
    - restore_state | default(false) | bool
    - not ansible_check_mode
  block:
    - name: "[Restore][nos-state] Resolve file"
      ansible.builtin.set_fact:
        state_file: >-
          {{ restore_plan | selectattr('source', 'equalto', 'nos-state')
             | map(attribute='file') | list | last }}

    - name: "[Restore][nos-state] Ensure ~/.nos exists"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.nos"
        state: directory
        mode: '0700'

    - name: "[Restore][nos-state] Snapshot live secrets.yml/state.yml before overwrite"
      # Non-clobbering rollback copy — an accidental restore_state=true on a
      # populated host (the SSO-brick scenario) is then recoverable.
      ansible.builtin.shell: |
        set -o pipefail
        d="{{ ansible_facts['env']['HOME'] }}/.nos"
        for f in secrets.yml state.yml; do
          if [[ -f "$d/$f" && ! -f "$d/$f.pre-restore-{{ restore_date }}" ]]; then
            cp -p "$d/$f" "$d/$f.pre-restore-{{ restore_date }}"
          fi
        done
      args:
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: "[Restore][nos-state] Extract tarball into ~/.nos"
      ansible.builtin.shell: |
        set -o pipefail
        tar -xzf "{{ restore_workdir }}/{{ state_file }}" -C "{{ ansible_facts['env']['HOME'] }}/.nos"
      args:
        executable: /bin/bash
      changed_when: true

    - name: "[Restore][nos-state] Append to summary"
      ansible.builtin.set_fact:
        restore_summary: "{{ restore_summary + [{
          'source': 'nos-state', 'status': 'ok', 'duration_s': 0,
          'size_bytes': (restore_stats.results | selectattr('item.source','equalto','nos-state')
                          | map(attribute='stat.size') | list | first | default(0))
        }] }}"

# 5g. Host-bind service dirs (dir-<name>.tar.gz) -------------------------------

- name: "[Restore][dirs] Enumerate dir-* sources"
  ansible.builtin.set_fact:
    restore_dir_plan: "{{ restore_plan | selectattr('source', 'match', '^dir-') | list }}"

- name: "[Restore][dirs] Restore each host-bind dir from tarball"
  when:
    - restore_dir_plan | length > 0
    - not ansible_check_mode
  loop: "{{ restore_dir_plan }}"
  loop_control:
    label: "{{ item.source }}"
  ansible.builtin.include_tasks: _restore_dir.yml

# ── 6. Replay post.yml hooks for restored services ────────────────────────────
# Best-effort: each role's post.yml is idempotent; re-running re-verifies
# migrations, re-seeds admin users, re-applies OIDC wiring, etc.

- name: "[Restore] Replay MariaDB role post.yml (service bootstrap)"  # noqa: ignore-errors
  # Best-effort: post.yml is idempotent, but a partial restore may leave
  # the DB in a state where bootstrap (CREATE USER, GRANT, etc.) errors.
  # We accept those errors here so the next role's replay still runs.
  # `failed_when` doesn't apply to include_role in ansible-core 2.20+;
  # ignore_errors is the supported escape hatch. ansible-lint flags it
  # but the alternative (block/rescue around an include_role) adds
  # cognitive load without behavior change.
  ansible.builtin.include_role:
    name: pazny.mariadb
    tasks_from: post.yml
    apply:
      tags: ['restore']
  when:
    - restore_plan | selectattr('source', 'equalto', 'mariadb') | list | length > 0
    - not ansible_check_mode
  tags: ['restore']
  ignore_errors: true

- name: "[Restore] Replay PostgreSQL role post.yml"  # noqa: ignore-errors
  # Same best-effort policy as MariaDB above.
  ansible.builtin.include_role:
    name: pazny.postgresql
    tasks_from: post.yml
    apply:
      tags: ['restore']
  when:
    - restore_plan | selectattr('source', 'equalto', 'postgres') | list | length > 0
    - not ansible_check_mode
  tags: ['restore']
  ignore_errors: true

# ── 7. Final summary ──────────────────────────────────────────────────────────

- name: "[Restore] Show summary"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════════════════════
      Restore complete — {{ restore_date }}
      ══════════════════════════════════════════════════════════════════════
      Started:  {{ restore_started_at }}
      Finished: {{ lookup('pipe', 'date -Iseconds') }}
      Work dir: {{ restore_workdir }}

      Restored items:
      {% for item in restore_summary %}
        - {{ item.source }}: {{ item.status }}
          size={{ (item.size_bytes | int) }} B,
          duration={{ item.duration_s }}s
      {% endfor %}

      Next steps:
        1. Verify the health probes:  ansible-playbook main.yml --tags health
        2. Spot-check DB row counts and service UIs (see docs/restore-runbook.md).
        3. When satisfied, remove the work dir:  rm -rf {{ restore_workdir }}
      ══════════════════════════════════════════════════════════════════════
