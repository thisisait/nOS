---
# ==============================================================================
# BACKUP — off-site copy #2 (Restic). Mirrors the RustFS bucket dir to an
# operator-rotated external repo (USB/SSD, S3, SFTP).
#
# 3-2-1 split (docs/backup-architecture.md): the pazny.backup role
# (install_backup) is copy #1 — it produces the canonical encrypted
# dumps/tars/blueprints INTO the RustFS bucket (rustfs_data_dir). THIS path
# (configure_backup) is copy #2 — it restic-backs-up that SAME bucket dir to an
# INDEPENDENT, off-site medium so a whole-disk loss is survivable. It no longer
# re-dumps DBs: that was duplicate work AND the whole-$HOME default that aborted
# on macOS TCC (rc=1). DR: `restic restore` the repo back into rustfs_data_dir,
# then `--tags restore`. Scheduled AFTER the RustFS run so it mirrors a COMPLETE
# copy #1. Label is `.offsite` (de-collided from the RustFS `.rustfs` agent).
# No copy #1 (backup_copy1_enabled false: no RustFS) = the wrapper stages the DB
# dumps itself and snapshots them with the data dirs straight into restic_repo.
# ==============================================================================

- name: "[Backup] Verify restic is installed"
  ansible.builtin.command: which restic
  register: restic_which
  changed_when: false
  failed_when: restic_which.rc != 0

# An empty restic_repo is refused in main.yml's preflight (one place for the rule).

# Fail fast if a mirror source is missing: `restic backup <missing-path>` exits
# rc=1 (FATAL, outside the tolerated [0,3]) and aborts the play with an opaque
# error. Copy #2 mirrors the RustFS bucket dir, so it needs copy #1 present.
- name: "[Backup] Stat each restic source path"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ restic_backup_paths }}"
  register: _restic_src_stats
  when: backup_copy1_enabled | bool

- name: "[Backup] Fail fast if any restic source path is absent"
  ansible.builtin.fail:
    msg: >-
      restic source path '{{ item.item }}' does not exist. Copy #2 mirrors the RustFS
      bucket dir (rustfs_data_dir) — enable install_backup + install_rustfs (copy #1)
      first, or fix restic_backup_paths in config.yml.
  loop: "{{ _restic_src_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - backup_copy1_enabled | bool
    - not item.stat.exists

- name: "[Backup] Ensure backups directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/backups"
    state: directory
    mode: '0700'

- name: "[Backup] Deploy resticignore exclusion patterns"
  ansible.builtin.copy:
    src: backup/resticignore
    dest: "{{ restic_excludefile }}"
    mode: '0644'

- name: "[Backup] Check if restic repo is initialized"
  # `snapshots` lists every snapshot (~31s on p=54800). `cat config` reads
  # the one small file that exists iff the repo is initialized.
  ansible.builtin.command: restic -r {{ restic_repo }} cat config
  environment:
    RESTIC_PASSWORD: "{{ restic_password }}"
  register: restic_repo_check
  changed_when: false
  failed_when: false

- name: "[Backup] Fail if restic password does not match an existing repo"
  ansible.builtin.fail:
    msg: >-
      restic cat config failed with wrong password for {{ restic_repo }} —
      the repo is initialized; refusing restic init. Fix restic_password.
  when: >-
    restic_repo_check.rc != 0
    and ('wrong password' in (restic_repo_check.stderr | default('') | lower))

- name: "[Backup] Initialize restic repo"
  ansible.builtin.command: restic init -r {{ restic_repo }}
  environment:
    RESTIC_PASSWORD: "{{ restic_password }}"
  # Uninitialized → rc!=0, no "wrong password". Wrong password is also rc!=0
  # (`cat config` decrypts the key); init would then no-op on "already exists"
  # and the backup would fail later. Refuse here.
  when: >-
    restic_repo_check.rc != 0
    and ('wrong password' not in (restic_repo_check.stderr | default('') | lower))
  register: _restic_init
  # Idempotent: the check (restic cat config) can return non-zero on a transient
  # / lock / external-volume hiccup even when the repo IS initialized; restic
  # init then errors "config file already exists" — benign. Tolerate that;
  # surface anything else (TCC 'operation not permitted' on an external volume,
  # wrong password). no_log dropped: RESTIC_PASSWORD is in `environment` (not
  # logged at default verbosity) so the real error is visible for diagnosis.
  failed_when:
    - _restic_init.rc | default(0) != 0
    - "'already' not in (_restic_init.stderr | default('') | lower)"
    - "'exists' not in (_restic_init.stderr | default('') | lower)"
  changed_when: _restic_init.rc | default(1) == 0

# ── Restic backup (mirror of the RustFS bucket dir) ──────────────────────────
# No DB dumps here — copy #1 (pazny.backup) already wrote the canonical encrypted
# dumps into rustfs_data_dir. We just replicate that dir off-site. Without copy #1
# the wrapper below does the whole run (dumps + dirs) and is executed after it.

- name: "[Backup] Run restic backup"
  when: backup_copy1_enabled | bool
  ansible.builtin.command: >
    restic -r {{ restic_repo }} backup
    --exclude-file={{ restic_excludefile }}
    {{ restic_backup_paths | join(' ') }}
  environment:
    RESTIC_PASSWORD: "{{ restic_password }}"
  async: 3600
  poll: 30
  register: _restic_backup
  # rc=0 = clean; rc=3 = "completed, but some source files could not be read"
  # (e.g. a RustFS object rotated/written mid-scan) — a WARNING, tolerated;
  # rc=1/2 = real error, surfaced. restic_backup_paths now points at the RustFS
  # bucket dir (rustfs_data_dir) — user-owned, NOT the whole $HOME, so the macOS
  # ~/Library TCC EPERM that previously forced a fatal rc=1 no longer applies.
  failed_when: _restic_backup.rc is defined and _restic_backup.rc not in [0, 3]
  # no_log dropped (password is in environment, not the command) so a non-0/3
  # rc shows the real restic error.

- name: "[Backup] Clear stale restic locks before prune"
  # An interrupted earlier run (e.g. the pre-fix whole-$HOME restic that aborted
  # on macOS TCC) can leave a stale lock → `forget --prune` then fails with
  # "repository is already locked". `unlock` removes locks whose process is gone
  # (safe; there is no concurrent restic on a single-host nightly).
  ansible.builtin.command: "restic -r {{ restic_repo }} unlock"
  environment:
    RESTIC_PASSWORD: "{{ restic_password }}"
  changed_when: false
  failed_when: false
  when: backup_copy1_enabled | bool

- name: "[Backup] Prune old snapshots"
  ansible.builtin.command: >
    restic -r {{ restic_repo }} forget
    --keep-daily {{ restic_keep_daily }}
    --keep-weekly {{ restic_keep_weekly }}
    --keep-monthly {{ restic_keep_monthly }}
    --prune
  environment:
    RESTIC_PASSWORD: "{{ restic_password }}"
  register: _restic_prune
  when: backup_copy1_enabled | bool
  # Prune is retention HOUSEKEEPING — the backup snapshot (copy #2) already
  # succeeded above. A prune hiccup must NOT abort the play and discard a good
  # backup; surface it as a warning. no_log dropped (password is in environment,
  # not the command) so the real restic error is finally visible.
  changed_when: _restic_prune.rc == 0
  failed_when: false

- name: "[Backup] Warn if prune failed (the backup snapshot is still intact)"
  ansible.builtin.debug:
    msg: >-
      restic forget/prune returned rc={{ _restic_prune.rc }} — retention cleanup
      did not complete, but copy #2 is safe. Investigate:
      {{ (_restic_prune.stderr | default('')) | truncate(400) }}
  when: _restic_prune.rc | default(0) != 0

# ── Scheduled backup via launchd ─────────────────────────────────────────────

# MEASURED 2026-08-05: the wrapper below was rendered 0755 with
# `export RESTIC_PASSWORD="…"` inline — the key that decrypts the entire
# off-site mirror, world-readable to every local process. `no_log: true` kept
# it out of Ansible's output and then wrote it to disk for anyone to read.
# Split: the secret goes to a 0600 env file, the script to 0700.
- name: "[Backup] Deploy the off-site restic credentials (0600, not in the script)"
  ansible.builtin.copy:
    content: |
      # Managed by Ansible — off-site restic credentials. Sourced by
      # ~/agents/backup-run.sh. 0600 on purpose: this is copy #2's decryption key.
      export RESTIC_PASSWORD={{ restic_password | quote }}
      export RESTIC_REPOSITORY={{ restic_repo | quote }}
      {% if (restic_s3_access_key | default('')) | length > 0 -%}
      export AWS_ACCESS_KEY_ID={{ restic_s3_access_key | quote }}
      export AWS_SECRET_ACCESS_KEY={{ restic_s3_secret_key | quote }}
      {% endif %}
      {% if not backup_copy1_enabled | bool and backup_databases_postgresql | bool -%}
      export NOS_PG_PASSWORD={{ postgresql_root_password | quote }}
      {% endif %}
      {% if not backup_copy1_enabled | bool and backup_databases_mariadb | bool -%}
      export NOS_MARIADB_PASSWORD={{ mariadb_root_password | quote }}
      {% endif %}
    dest: "{{ ansible_facts['env']['HOME'] }}/.nos/restic.env"
    mode: '0600'
  no_log: true

- name: "[Backup] Deploy backup-run.sh wrapper script (off-site mirror)"
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Automated Restic off-site mirror — managed by Ansible, do not edit.
      # Mirrors the RustFS bucket dir (copy #1) to the off-site repo (copy #2).
      set -euo pipefail
      export PATH="{{ homebrew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
      LOG_DIR="{{ ansible_facts['env']['HOME'] }}/backups"
      LOG_FILE="${LOG_DIR}/backup.log"
      mkdir -p "$LOG_DIR"
      exec >> "$LOG_FILE" 2>&1
      # Copy #2 was the only backup leg with NO notification path: a failed or
      # corrupt mirror was discoverable at restore time and nowhere earlier.
      # The trap fires on any un-guarded non-zero under `set -e`.
      notify_fail() {
        "{{ playbook_dir }}/files/anatomy/scripts/nos-notify.sh" high \
          "Off-site mirror FAILED" \
          "restic exited non-zero. Tail of ${LOG_FILE}:
      $(tail -n 20 "${LOG_FILE}" 2>/dev/null)" \
          "wing-inbox,ntfy" "backup-offsite-mirror" || true
      }
      trap notify_fail ERR
      . "{{ ansible_facts['env']['HOME'] }}/.nos/restic.env"
      echo "=== Off-site mirror started: $(date -Iseconds) ==="
      {% if backup_copy1_enabled | bool %}
      restic backup \
        --exclude-file="{{ restic_excludefile }}" \
        {{ restic_backup_paths | join(' ') }}
      {% else %}
      # No copy #1 (no RustFS): stage the DB dumps here, then snapshot them with
      # the data dirs. An off service's NON-EMPTY dir stays in (its last copy must
      # not age out); an empty or absent one is ignored. rows: "name ok off".
      STAGE="{{ backup_staging_dir }}"
      mkdir -p "$STAGE" && chmod 700 "$STAGE"
      PATHS=("$STAGE")
      ROWS=()
      stage_dump() {
        local name="$1"; shift
        if "$@" | gzip -c > "$STAGE/$name.sql.gz.part"; then
          mv -f "$STAGE/$name.sql.gz.part" "$STAGE/$name.sql.gz"; ROWS+=("$name 1 0")
        else
          rm -f "$STAGE/$name.sql.gz.part" "$STAGE/$name.sql.gz"; ROWS+=("$name 0 0")
        fi
      }
      add_dir() {  # name path installed empty_ok
        local full; full="$(ls -A "$2" 2>/dev/null | head -1 || true)"
        if [[ "$3" == true ]]; then
          if [[ -d "$2" && ( -n "$full" || "$4" == true ) ]]; then PATHS+=("$2"); ROWS+=("dir-$1 1 0")
          else echo "dir-$1: $2 absent or empty"; ROWS+=("dir-$1 0 0"); fi
        elif [[ -n "$full" ]]; then PATHS+=("$2"); ROWS+=("dir-$1 1 1"); fi
      }
      {% if backup_databases_postgresql | bool %}
      stage_dump postgres docker exec -i -e "PGPASSWORD=${NOS_PG_PASSWORD}" {{ postgresql_container_name }} pg_dumpall -U {{ postgresql_root_user }}
      {% for d in backup_postgres_dbs if lookup('vars', d.flag, default=false) | bool %}
      stage_dump postgres-{{ d.db }} docker exec -i -e "PGPASSWORD=${NOS_PG_PASSWORD}" {{ postgresql_container_name }} pg_dump -U {{ postgresql_root_user }} -d {{ d.db }}
      {% endfor %}
      {% endif %}
      {% if backup_databases_mariadb | bool %}
      stage_dump mariadb docker exec -i {{ mariadb_container_name }} mariadb-dump --all-databases \
        --single-transaction --quick --routines --triggers -uroot "-p${NOS_MARIADB_PASSWORD}"
      {% endif %}
      {% if backup_wing_db | bool %}
      # One read transaction = a consistent dump; -readonly fails on a missing file instead of creating it.
      stage_dump wing-db sqlite3 -readonly "{{ backup_wing_db_path }}" .dump
      {% endif %}
      {% if backup_thalamus_ledger | bool %}
      stage_dump thalamus-ledger sqlite3 -readonly "{{ backup_thalamus_ledger_path }}" .dump
      {% endif %}
      {% if backup_keap_db | bool %}
      # KEAP: node:sqlite backup() INSIDE the container (page copy keeps the vector
      # index; the host may not read the store), verified by counting the three
      # core tables, then copied out. Never a copy of the live file.
      keap_js() {
        cat <<'KEAPJS'
      const { DatabaseSync, backup } = require("node:sqlite");
      const fs = require("fs");
      const [src, dst] = process.argv.slice(2);
      try { fs.unlinkSync(dst); } catch (e) {}
      const db = new DatabaseSync(src, { readOnly: true });
      backup(db, dst).then(() => {
        db.close();
        const v = new DatabaseSync(dst, { readOnly: true });
        const n = ["taxonomy_nodes_ext", "relations", "knowledge_objects"].map((t) => v.prepare("select count(*) c from " + t).get().c);
        v.close();
        if (n.some((c) => c === 0)) { process.stderr.write("empty core table " + n.join("/") + "\n"); process.exit(1); }
      }).catch((e) => { process.stderr.write("keap backup failed: " + e.message + "\n"); process.exit(1); });
      KEAPJS
      }
      K="{{ backup_keap_container }}"; KT="/tmp/nos-keap-direct.$$"
      if keap_js | docker exec -i "$K" sh -c "cat > $KT.js && node --no-warnings $KT.js '{{ backup_keap_db_container_path }}' $KT.db" \
         && docker exec "$K" cat "$KT.db" | gzip -c > "$STAGE/keap-db.gz.part"; then
        mv -f "$STAGE/keap-db.gz.part" "$STAGE/keap-db.gz"; ROWS+=("keap-db 1 0")
      else
        rm -f "$STAGE/keap-db.gz.part" "$STAGE/keap-db.gz"; ROWS+=("keap-db 0 0")
      fi
      docker exec "$K" rm -f "$KT.js" "$KT.db" >/dev/null 2>&1 || true
      {% endif %}
      # Secret-bearing state goes to restic IN PLACE (restic encrypts): no second plaintext copy.
      add_files() {  # name dir file... : absent dir = FAILED, no file = nothing to back up
        local name="$1" dir="$2" f n=0; shift 2
        [[ -d "$dir" ]] || { ROWS+=("$name 0 0"); return 0; }
        for f in "$@"; do [[ -f "$dir/$f" ]] && { PATHS+=("$dir/$f"); n=1; }; done
        [[ "$n" == 1 ]] && ROWS+=("$name 1 0")
        return 0
      }
      {% if backup_nos_state | bool %}
      add_files nos-state "{{ ansible_facts['env']['HOME'] }}/.nos" secrets.yml state.yml
      {% endif %}
      {% if backup_tofu_state | bool %}
      add_files tofu-state "{{ backup_tofu_state_dir }}" terraform.tfstate terraform.tfstate.backup nos.auto.tfvars.json
      {% endif %}
      {% for d in backup_dirs_to_dump %}
      {% set on = d.flag is not defined or (lookup('vars', d.flag, default=false) | bool) %}
      add_dir "{{ d.name }}" "{{ d.path }}" {{ 'true' if on else 'false' }} {{ 'true' if (d.empty_ok | default(false) | bool) else 'false' }}
      {% endfor %}
      rc=0
      restic backup --exclude-file="{{ restic_excludefile }}" --exclude='*.part' "${PATHS[@]}" || rc=$?
      FAILED="$(python3 - "{{ backup_restic_status_file }}" "$rc" "${ROWS[@]+"${ROWS[@]}"}" <<'PY'
      import json, sys, time
      path, rc, rows = sys.argv[1], int(sys.argv[2]), [r.split() for r in sys.argv[3:]]
      now = int(time.time())
      src = [{"name": n, "success": ok == "1" and rc == 0, "off": off == "1", "timestamp": now} for n, ok, off in rows]
      json.dump({"last_run": now, "restic_rc": rc, "sources": src}, open(path, "w"), indent=2)
      print(",".join(s["name"] for s in src if not s["success"]) or ("restic" if rc else ""))
      PY
      )"
      {% endif %}
      restic unlock || true
      # Retention failing is NOT the backup failing — the snapshot is already
      # written — so this stays guarded. It notifies rather than only echoing,
      # because a WARN in a log nobody tails is the silence this file is fixing.
      restic forget \
        --keep-daily {{ restic_keep_daily }} \
        --keep-weekly {{ restic_keep_weekly }} \
        --keep-monthly {{ restic_keep_monthly }} \
        --prune || {
          echo "WARN: restic prune failed — backup snapshot is safe, retention skipped"
          "{{ playbook_dir }}/files/anatomy/scripts/nos-notify.sh" medium \
            "Off-site retention skipped" \
            "restic forget --prune failed; the snapshot is safe, old ones were not pruned." \
            "wing-inbox,ntfy" "backup-offsite-retention" || true
        }
      {% if not backup_copy1_enabled | bool %}
      if [[ -n "$FAILED" ]]; then echo "FAILED: $FAILED"; notify_fail; exit 1; fi
      {% endif %}
      echo "=== Off-site mirror finished: $(date -Iseconds) ==="
    dest: "{{ ansible_facts['env']['HOME'] }}/agents/backup-run.sh"
    mode: '0700'
  no_log: true

# Without copy #1 the wrapper IS the backup (dumps + dirs); run it once like the
# mirror leg above runs once. Its log: ~/backups/backup.log.
- name: "[Backup] Run the direct restic backup once (no copy #1)"
  ansible.builtin.command: "/bin/bash {{ ansible_facts['env']['HOME'] }}/agents/backup-run.sh"
  async: 3600
  poll: 30
  changed_when: true
  when: not (backup_copy1_enabled | bool)

# De-collision: the legacy Restic plist shared the label/path
# eu.thisisait.nos.backup with the RustFS role. Boot out + remove it so the
# renamed .offsite agent is the only Restic one.
- name: "[Backup] Boot out legacy colliding backup agent (if present)"
  ansible.builtin.command: >
    launchctl bootout gui/{{ ansible_facts['user_uid'] | default(lookup('pipe', 'id -u')) }}/eu.thisisait.nos.backup
  register: _offsite_legacy_bootout
  changed_when: _offsite_legacy_bootout.rc == 0
  failed_when: false
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[Backup] Remove legacy colliding plist (if present)"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/eu.thisisait.nos.backup.plist"
    state: absent
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[Backup] Deploy launchd plist for daily off-site mirror"
  ansible.builtin.template:
    src: eu.thisisait.nos.backup.offsite.plist.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ restic_launchd_label }}.plist"
    mode: '0644'
  register: backup_plist
  when: (nos_service_manager | default('launchd')) == 'launchd'

- name: "[Backup] Load launchd backup schedule"  # noqa: no-handler
  # Inline (not a handler) — same launchctl ordering rationale as the
  # vulnerability-scan plist tasks: must run mid-play so the scheduler is
  # consistent for any later tasks that check `launchctl list`.
  ansible.builtin.command: >
    launchctl load -w {{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ restic_launchd_label }}.plist
  when:
    - backup_plist is changed
    - (nos_service_manager | default('launchd')) == 'launchd'
  failed_when: false

# ── Scheduled mirror via systemd --user (Linux) ──────────────────────────────
# Without this the off-site mirror runs ONCE at provisioning and is never re-armed
# on Linux (the launchd tasks above are macOS-only). backup-run.sh is deployed
# unconditionally above; here we add the recurring timer.
- name: "[Backup] (Linux) Render off-site oneshot service"
  ansible.builtin.include_role:
    name: pazny.linux.systemd_user
    tasks_from: ensure_unit
  vars:
    su_name: "{{ restic_launchd_label }}"
    su_description: "nOS off-site Restic mirror (copy #2)"
    su_service_type: oneshot
    su_exec_start: "/bin/bash {{ ansible_facts['env']['HOME'] }}/agents/backup-run.sh"
    su_working_dir: "{{ ansible_facts['env']['HOME'] }}"
    su_enable: false
    su_environment:
      HOME: "{{ ansible_facts['env']['HOME'] }}"
      PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  when: (nos_service_manager | default('launchd')) == 'systemd-user'

- name: "[Backup] (Linux) Render + enable off-site timer"
  ansible.builtin.include_role:
    name: pazny.linux.systemd_user
    tasks_from: ensure_unit
  vars:
    su_name: "{{ restic_launchd_label }}"
    su_type: timer
    su_description: "nOS off-site Restic mirror schedule"
    su_timer_calendar: "*-*-* {{ '%02d' | format(restic_backup_schedule_hour | int) }}:00:00"
    su_timer_unit: "{{ restic_launchd_label }}.service"
  when: (nos_service_manager | default('launchd')) == 'systemd-user'
