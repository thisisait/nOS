---
# ==============================================================================
# BACKUP — legacy Restic-based encrypted backups (host-level).
#
# NOTE: This is the OLD backup path using `configure_backup` + `restic_*` vars.
# The CURRENT primary backup is `pazny.backup` role (install_backup flag) which
# dumps DBs + volumes + Authentik blueprints to RustFS via launchd.
# Keep both paths available — Restic supports off-site repos (S3, SFTP) that
# RustFS does not. Operators choose one or both.
# ==============================================================================

- name: "[Backup] Verify restic is installed"
  ansible.builtin.command: which restic
  register: restic_which
  changed_when: false
  failed_when: restic_which.rc != 0

- name: "[Backup] Verify restic_repo is configured"
  ansible.builtin.fail:
    msg: "restic_repo is empty — set it in config.yml (e.g., /Volumes/Backup/restic, s3:endpoint/bucket, sftp:user@host:/path)"
  when: restic_repo | default('') | length == 0

- name: "[Backup] Ensure backups directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/backups"
    state: directory
    mode: '0700'

- name: "[Backup] Deploy resticignore exclusion patterns"
  ansible.builtin.copy:
    src: backup/resticignore
    dest: "{{ restic_excludefile }}"
    mode: '0644'

- name: "[Backup] Check if restic repo is initialized"
  ansible.builtin.command: restic -r {{ restic_repo }} snapshots
  environment:
    RESTIC_PASSWORD: "{{ restic_password }}"
  register: restic_repo_check
  changed_when: false
  failed_when: false

- name: "[Backup] Initialize restic repo"
  ansible.builtin.command: restic init -r {{ restic_repo }}
  environment:
    RESTIC_PASSWORD: "{{ restic_password }}"
  when: restic_repo_check.rc != 0
  register: _restic_init
  # Idempotent: the check (restic snapshots) can return non-zero on a transient
  # / lock / external-volume hiccup even when the repo IS initialized; restic
  # init then errors "config file already exists" — benign. Tolerate that;
  # surface anything else (TCC 'operation not permitted' on an external volume,
  # wrong password). no_log dropped: RESTIC_PASSWORD is in `environment` (not
  # logged at default verbosity) so the real error is visible for diagnosis.
  failed_when:
    - _restic_init.rc | default(0) != 0
    - "'already' not in (_restic_init.stderr | default('') | lower)"
    - "'exists' not in (_restic_init.stderr | default('') | lower)"
  changed_when: _restic_init.rc | default(1) == 0

# ── Pre-backup database dumps ────────────────────────────────────────────────

- name: "[Backup] Dump PostgreSQL databases"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p infra exec -T postgresql
    pg_dumpall -U postgres > {{ ansible_facts['env']['HOME'] }}/backups/pg_dump.sql
  when: install_postgresql | default(false)
  failed_when: false

- name: "[Backup] Dump MariaDB databases"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p infra exec -T mariadb
    mysqldump --all-databases -uroot -p{{ mariadb_root_password | default(global_password_prefix + '_pw_mariadb') }}
    > {{ ansible_facts['env']['HOME'] }}/backups/maria_dump.sql
  when: install_mariadb | default(false)
  failed_when: false
  no_log: true

# ── Restic backup ────────────────────────────────────────────────────────────

- name: "[Backup] Run restic backup"
  ansible.builtin.command: >
    restic -r {{ restic_repo }} backup
    --exclude-file={{ restic_excludefile }}
    {{ restic_backup_paths | join(' ') }}
    {{ ansible_facts['env']['HOME'] }}/backups
  environment:
    RESTIC_PASSWORD: "{{ restic_password }}"
  async: 3600
  poll: 30
  register: _restic_backup
  # restic rc=3 = "backup completed, but SOME source files could not be read"
  # — normal for a HOT backup of a live home/data tree (sockets, locked
  # ~/Library files, files changing under running services). It is a WARNING,
  # not a failure. rc=0 = clean; rc=1/2 = real error. Tolerate 3, surface the
  # rest. (Caught on the all-on blank: restic_backup_paths defaults to the whole
  # $HOME, which always has a few unreadable files → rc=3 aborted the run.)
  failed_when: _restic_backup.rc is defined and _restic_backup.rc not in [0, 3]
  # no_log dropped (password is in environment, not the command) so a non-0/3
  # rc shows the real restic error. KNOWN GAP: restic_backup_paths defaults to
  # the whole $HOME, which on macOS contains TCC-protected ~/Library subdirs
  # (Mail, Safari, TCC.db) → restic hits dir-level EPERM → FATAL rc=1 (not the
  # tolerated rc=3). Proper fix is to NARROW restic_backup_paths to the nOS data
  # (e.g. ~/backups DB dumps + service data dirs), not the whole home. Until
  # then, set configure_backup:false to skip the off-site Restic path (the
  # RustFS nightly via install_backup is separate).

- name: "[Backup] Prune old snapshots"
  ansible.builtin.command: >
    restic -r {{ restic_repo }} forget
    --keep-daily {{ restic_keep_daily }}
    --keep-weekly {{ restic_keep_weekly }}
    --keep-monthly {{ restic_keep_monthly }}
    --prune
  environment:
    RESTIC_PASSWORD: "{{ restic_password }}"
  no_log: true

# ── Scheduled backup via launchd ─────────────────────────────────────────────

- name: "[Backup] Deploy backup-run.sh wrapper script"
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Automated Restic backup — managed by Ansible, do not edit
      set -euo pipefail
      export PATH="{{ homebrew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
      export RESTIC_PASSWORD="{{ restic_password }}"
      export RESTIC_REPOSITORY="{{ restic_repo }}"
      BACKUP_DIR="{{ ansible_facts['env']['HOME'] }}/backups"
      LOG_FILE="${BACKUP_DIR}/backup.log"
      mkdir -p "$BACKUP_DIR"
      exec >> "$LOG_FILE" 2>&1
      echo "=== Backup started: $(date -Iseconds) ==="
      {% if install_postgresql | default(false) %}
      {{ docker_bin }} compose -p infra exec -T postgresql pg_dumpall -U postgres > "${BACKUP_DIR}/pg_dump.sql" || true
      {% endif %}
      {% if install_mariadb | default(false) %}
      {{ docker_bin }} compose -p infra exec -T mariadb \
        mysqldump --all-databases \
        -uroot -p{{ mariadb_root_password | default(global_password_prefix + '_pw_mariadb') }} \
        > "${BACKUP_DIR}/maria_dump.sql" 2>/dev/null || true
      {% endif %}
      restic backup \
        --exclude-file="{{ restic_excludefile }}" \
        {{ restic_backup_paths | join(' ') }} \
        "${BACKUP_DIR}"
      restic forget \
        --keep-daily {{ restic_keep_daily }} \
        --keep-weekly {{ restic_keep_weekly }} \
        --keep-monthly {{ restic_keep_monthly }} \
        --prune
      echo "=== Backup finished: $(date -Iseconds) ==="
    dest: "{{ ansible_facts['env']['HOME'] }}/agents/backup-run.sh"
    mode: '0755'
  no_log: true

- name: "[Backup] Deploy launchd plist for daily backup"
  ansible.builtin.template:
    src: eu.thisisait.nos.backup.plist.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/eu.thisisait.nos.backup.plist"
    mode: '0644'
  register: backup_plist

- name: "[Backup] Load launchd backup schedule"  # noqa: no-handler
  # Inline (not a handler) — same launchctl unload→load ordering rationale
  # as the vulnerability-scan plist tasks: must run mid-play, not at
  # end-of-play handler dispatch, so the scheduler is consistent for any
  # later tasks that check `launchctl list`.
  ansible.builtin.command: >
    launchctl load -w {{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/eu.thisisait.nos.backup.plist
  when: backup_plist is changed
  failed_when: false
