---
# ==============================================================================
# SERVICE REGISTRY - generates JSON service catalog and Grafana dashboard
# JSON is served via Nginx at http://localhost/service-registry.json
# Dashboard is provisioned into Grafana automatically.
# ==============================================================================

- name: "[Service Registry] Ensure default project directory exists"
  ansible.builtin.file:
    path: "{{ openclaw_projects_dir | default(ansible_facts['env']['HOME'] + '/projects') }}/default"
    state: directory
    mode: '0755'

- name: "[Service Registry] Generate service-registry.json"
  ansible.builtin.template:
    src: "service-registry.json.j2"
    dest: "{{ openclaw_projects_dir | default(ansible_facts['env']['HOME'] + '/projects') }}/default/service-registry.json"
    mode: '0644'

# Wing's hub reads this file, so it ingests the copy just rendered (an ingest in
# pazny.wing post.yml ran first and kept the last run's urls). Gate:
# tests/anatomy/test_wing_ingests_the_registry_this_run_wrote.py
- name: "[Service Registry] Wing ingests the registry into its systems table"
  ansible.builtin.command:
    # No chdir: the module enters chdir BEFORE checking removes, so a host
    # without ~/wing/app failed here instead of skipping (master CI, macOS).
    cmd: "{{ wing_php_cli }} {{ wing_app_dir }}/bin/ingest-registry.php --registry={{ openclaw_projects_dir | default(ansible_facts['env']['HOME'] + '/projects') }}/default/service-registry.json"
    removes: "{{ wing_data_dir }}/wing.db"   # no Wing DB yet: nothing to ingest into
  register: _wing_ingest
  # digest-changed compares the table before/after (App\Model\TableDigest).
  changed_when: "'digest-changed=1' in (_wing_ingest.stdout | default(''))"
  when: install_wing | default(true) | bool
  tags: ['wing']

- name: "[Service Registry] Ensure dashboards directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/observability/dashboards"
    state: directory
    mode: '0755'
  when: install_observability | default(true) | bool

- name: "[Service Registry] Deploy Grafana dashboard"
  ansible.builtin.template:
    src: "grafana-service-registry-dashboard.json.j2"
    dest: "{{ ansible_facts['env']['HOME'] }}/observability/dashboards/service-registry.json"
    mode: '0644'
  when: install_observability | default(true) | bool

# The landing page is a view of the same list; at stack-up apps_extra_services
# is not set yet, so render it again now that apps-up has added them.
- name: "[Service Registry] Landing page from the finished list"
  ansible.builtin.include_role:
    name: pazny.landing
    apply: { tags: ['service-registry', 'registry', 'landing'] }
  when: install_landing | default(false) | bool
  tags: ['service-registry', 'registry', 'landing']
