---
# ==============================================================================
# credentials.yml holds VALUES, never `{{ }}` templates (thisisait/nOS#42).
#
# Copying default.credentials.yml wholesale into credentials.yml looks harmless
# and passes every earlier task. It is not: credentials.yml is include_vars'd,
# and core-up's eager `nos_plugin_ctx: "{{ vars }}"` snapshot resolves those
# values in a context where vars_files names (default.config.yml) are not
# visible. The run then aborts ~40 min in, at the snapshot, with a bare
# "'default_admin_email' is undefined" that names neither file nor fix.
#
# This fails in preflight instead, naming the lines and the fix.
# ==============================================================================

- name: "[Preflight] Find template lines in credentials.yml"
  ansible.builtin.command:
    argv: [grep, -nE, '^[^#]*\{\{', "{{ playbook_dir }}/credentials.yml"]
  register: _creds_template_lines
  changed_when: false
  failed_when: _creds_template_lines.rc > 1
  check_mode: false

- name: "[Preflight] credentials.yml must hold values, not templates"
  ansible.builtin.fail:
    msg: |-
      credentials.yml contains {{ _creds_template_lines.stdout_lines | length }} template line(s), e.g.:
        {{ _creds_template_lines.stdout_lines[:3] | join('\n  ') }}
      credentials.yml is for YOUR overrides only (global_password_prefix, API keys).
      It is not a copy of default.credentials.yml: delete every line you did not
      change; the defaults keep applying from default.credentials.yml.
  when: _creds_template_lines.rc == 0
