---
# ==============================================================================
# REMOVE: SOURCE — the `remove=all` tail: user SOURCE + anatomy runtime dirs.
# Was tasks/uninstall.yml step 2b. Reached only when nos_remove_source
# (remove=all) AND confirmed (the run-mode dry-run gate ends the play otherwise).
# GOV NOTE: removes wing.db (tamper-evident audit chain) — export first under a
# gov/compliance profile. See docs/archive/blank-uninstall-managed-resources.md.
# ==============================================================================

- name: "[Remove:source] Final interactive confirmation"
  ansible.builtin.pause:
    prompt: |-

      ╔══════════════════════════════════════════════════════════════════════╗
      ║  REMOVE=ALL — this REMOVES ALL nOS DATA INCLUDING USER FILES.         ║
      ║  {{ nos_data_root }}/tenants/** (documents, uploads) will be DELETED. ║
      ║  leave={{ nos_leaving }} — {{ 'the play STOPS after removal' if nos_leaving else 'the estate REINSTALLS from zero afterwards' }}.
      ║  Back up first if unsure.                                             ║
      ╚══════════════════════════════════════════════════════════════════════╝

       Press ENTER to PERMANENTLY DELETE, or Ctrl+C -> A to cancel
  when: not nos_assume_yes

- name: "[Remove:source] Remove the SOURCE tree + side-car + registry"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ _uninstall_source }}"
  loop_control:
    label: "{{ item }}"
  become: true

# ── Host layer (macOS) — what a leave must not leave behind ──────────────────
# The 2026-09-29 exit audit read the machine before a leave and found the
# removal set covered directories only: brew service registrations (dnsmasq
# as a ROOT daemon, still answering the tenant domain on :53), the mkcert
# root CA trusted in the System keychain with its key on disk, the `home`
# SSH account with its sshd Match block, and brew-bin symlinks into removed
# trees. The reader at the end refuses a leave that kept any of them.
- name: "[Remove:host] Host layer"
  when: ansible_facts['os_family'] == 'Darwin'
  block:
    - name: "[Remove:host] Unregister the brew services nOS started"
      ansible.builtin.shell: |
        # Both prefixes: Homebrew 7 formulae ship sh.brew.<svc>, older homebrew.mxcl.
        for svc in dnsmasq grafana-alloy nginx redis ollama "php@{{ php_version | default('8.3') }}"; do
          for plist in "$HOME"/Library/LaunchAgents/{homebrew.mxcl,sh.brew}."${svc}".plist /Library/LaunchDaemons/{homebrew.mxcl,sh.brew}."${svc}".plist; do
            [ -f "$plist" ] || continue
            launchctl bootout system "$plist" 2>/dev/null || launchctl bootout "gui/{{ ansible_facts['user_uid'] }}" "$plist" 2>/dev/null || true
            rm -f "$plist" && echo "removed $plist"
          done
        done
      args:
        executable: /bin/bash
      environment:
        HOME: "{{ ansible_facts['env']['HOME'] }}"
      become: true
      register: _rm_brew_services
      changed_when: "'removed' in _rm_brew_services.stdout"

    - name: "[Remove:host] Where is the mkcert CA?"
      ansible.builtin.command: "{{ homebrew_prefix }}/bin/mkcert -CAROOT"
      register: _rm_caroot
      changed_when: false
      failed_when: false

    - name: "[Remove:host] Untrust the mkcert root CA, then delete its key"
      # `mkcert -uninstall` drops the TRUST setting and leaves the certificate in
      # the System keychain (2026-09-30 leave: the reader caught it). Delete the
      # cert too — only this host's (`mkcert <user>@<hostname>`), never another
      # mkcert CA the operator keeps.
      ansible.builtin.shell: |
        set -o pipefail
        KC=/Library/Keychains/System.keychain
        if [ -f "$CAROOT/rootCA.pem" ]; then
          "{{ homebrew_prefix }}/bin/mkcert" -uninstall
        fi
        security find-certificate -a -c "mkcert " -Z "$KC" 2>/dev/null \
          | awk -v host="@$(hostname)" '/^SHA-1 hash:/{h=$3} /"labl"/ && index($0, host){print h}' \
          | sort -u | while read -r h; do
              security delete-certificate -Z "$h" "$KC" && echo "removed cert $h"
            done
        [ -d "$CAROOT" ] && rm -rf "$CAROOT" && echo "removed caroot"
        true
      args:
        executable: /bin/bash
      environment:
        CAROOT: "{{ _rm_caroot.stdout | trim }}"
      become: true
      register: _rm_mkcert
      changed_when: "'removed' in _rm_mkcert.stdout"
      when: (_rm_caroot.stdout | default('') | trim | length) > 0

    - name: "[Remove:host] Drop the iiab-terminal sshd Match block"
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        marker: "# {mark} ANSIBLE MANAGED - iiab-terminal"
        state: absent
      become: true

    - name: "[Remove:host] Delete the iiab-terminal account (and /Users/<it>)"
      ansible.builtin.shell: |
        id "{{ iiab_terminal_user | default('home') }}" >/dev/null 2>&1 || { echo "absent"; exit 0; }
        sysadminctl -deleteUser "{{ iiab_terminal_user | default('home') }}" && echo "removed"
      become: true
      register: _rm_home_user
      changed_when: "'removed' in _rm_home_user.stdout"

    - name: "[Remove:host] Drop brew-bin symlinks into removed trees"
      ansible.builtin.shell: |
        set -o pipefail
        find "{{ nos_cli_install_dir }}" -maxdepth 1 -type l ! -exec test -e {} \; -print 2>/dev/null |
        while read -r link; do
          case "$(readlink "$link")" in "$HOME"/*) rm -f "$link" && echo "removed $link";; esac
        done || true
      args:
        executable: /bin/bash
      environment:
        HOME: "{{ ansible_facts['env']['HOME'] }}"
      register: _rm_links
      changed_when: "'removed' in _rm_links.stdout"

    # The reader: the tasks above report what they attempted; this asks the OS.
    - name: "[Remove:host] Read back the host layer"
      ansible.builtin.shell: |
        set -o pipefail
        left=""
        for p in "$HOME"/Library/LaunchAgents/eu.thisisait.nos* \
                 "$HOME"/Library/LaunchAgents/{homebrew.mxcl,sh.brew}.{dnsmasq,grafana-alloy,nginx,redis,ollama}.plist \
                 /Library/LaunchDaemons/{homebrew.mxcl,sh.brew}.{dnsmasq,grafana-alloy,nginx,redis,ollama}.plist; do
          [ -e "$p" ] && left="$left plist:$p"
        done
        security find-certificate -a -c "mkcert " /Library/Keychains/System.keychain 2>/dev/null \
          | grep '"labl"' | grep -qF "@$(hostname)" && left="$left mkcert-ca-in-keychain"
        id "{{ iiab_terminal_user | default('home') }}" >/dev/null 2>&1 && left="$left user:{{ iiab_terminal_user | default('home') }}"
        grep -q "ANSIBLE MANAGED - iiab-terminal" /etc/ssh/sshd_config && left="$left sshd-match-block"
        echo "LEFT:${left:- none}"
      args:
        executable: /bin/bash
      environment:
        HOME: "{{ ansible_facts['env']['HOME'] }}"
      register: _rm_host_left
      changed_when: false
      # Directory Services still answered for the deleted account 19 ms later
      # (2026-09-30): ask again for a few seconds before calling it a survivor.
      retries: 5
      delay: 3
      until: "_rm_host_left.stdout | trim == 'LEFT: none'"
      failed_when: "_rm_host_left.stdout | trim != 'LEFT: none'"

- name: "[Remove:source] Done"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════════════════════
       REMOVE=ALL SOURCE PHASE COMPLETE — user source + anatomy runtime gone.
       {{ 'Play ends here (leave=true). Reinstall later: nos --remove=none' if nos_leaving else 'Reinstalling from zero…' }}
      ══════════════════════════════════════════════════════════════════════
