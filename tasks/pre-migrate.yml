---
# ==============================================================================
# tasks/pre-migrate.yml — orchestrator run from main.yml pre_tasks.
#
# Safe to run on every playbook invocation — if no migrations are pending,
# this is a no-op (plus a state read/write to bump generated_at).
#
# NOTE: wire-up into main.yml is performed by the human operator after all
# framework agents have finished. This file is inert until imported.
#
# Extra-vars it honours:
#   auto_migrate=true            skip the interactive confirmation prompt
#   migrate_dry_run=true         run nos_migrate in dry-run mode (no writes)
# ==============================================================================

- name: "[pre-migrate] Read current state"
  nos_state:
    action: read
    state_path: "{{ ansible_facts['env']['HOME'] }}/.nos/state.yml"
  register: _nos_state
  check_mode: false
  tags: ['migrate']

# WHY THIS IS NOT `{{ vars }}`, and it is a converge-breaking difference.
#
# Measured 2026-08-22 on the first FULL converge since Secrets P1 landed:
#
#   Error while resolving value for 'role_vars': 'nos_derived_secrets' is
#   undefined   <- default.credentials.yml:190, rustfs_access_key
#
# `{{ vars }}` resolves EAGERLY, so it drags in all 73 declarations that P1
# rewrote to read `{{ nos_derived_secrets.<key> }}` — and this file runs at
# main.yml:966 while that fact is set at main.yml:1231. P1's own comment shows
# the reasoning that missed it: it names `tasks/restore.yml` as the earliest
# consumer and says the ordering holds "with room to spare" against core-up's
# eager resolve. Core-up is not the earliest eager consumer. This task is, by
# 265 lines.
#
# The secrets block CANNOT simply move earlier: its input `global_password_prefix`
# is set at main.yml:1117 from the removal prompt, after this file.
#
# So the fix belongs here, and it is the direction CLAUDE.md already names as
# strategic — stop passing `{{ vars }}` wholesale. `nos_state` reads exactly
# three keys per service (`version_var`, `data_path_var`, `install_flag`,
# nos_state_lib.py:418-426), all NAMED BY THE MANIFEST — 152 names across 64
# services, not one of them a credential. `lookup('vars', …)` resolves one key
# at a time, so an undefined credential elsewhere in the play cannot abort a
# read that never wanted it.
#
# A missing name is omitted rather than defaulted: `introspect_service` tests
# `if version_var in role_vars`, so absent and empty are already different
# things to it, and inventing an empty string would make a service look pinned
# to "".
- name: "[pre-migrate] Collect the var names the manifest asks about"
  ansible.builtin.set_fact:
    _nos_manifest_var_names: >-
      {{ ((lookup('file', playbook_dir ~ '/state/manifest.yml') | from_yaml).services | default([]))
         | map('ansible.builtin.dict2items') | flatten
         | selectattr('key', 'in', ['version_var', 'data_path_var', 'install_flag'])
         | map(attribute='value') | select('string') | unique | list }}
  tags: ['migrate']

# ONE lookup, no `when:`. The first cut tested existence in a conditional with
# `lookup('vars', item, default=None) is not none` and died on `mcpo_version`:
# inside a conditional the vars lookup RAISES "No variable named …" rather than
# returning the default. A sentinel keeps the whole decision inside the value
# expression, where the default does apply — and it also stops the lookup
# happening twice per key.
- name: "[pre-migrate] Resolve only those, one key at a time"
  ansible.builtin.set_fact:
    _nos_manifest_vars: >-
      {{ (_nos_manifest_vars | default({})) if _nos_v == '__nos_absent__'
         else (_nos_manifest_vars | default({})) | combine({item: _nos_v}) }}
  vars:
    _nos_v: "{{ lookup('vars', item, default='__nos_absent__') }}"
  loop: "{{ _nos_manifest_var_names }}"
  loop_control:
    label: "{{ item }}"
  tags: ['migrate']

- name: "[pre-migrate] Introspect services against manifest"
  nos_state:
    action: introspect
    state_path: "{{ ansible_facts['env']['HOME'] }}/.nos/state.yml"
    manifest_path: "{{ playbook_dir }}/state/manifest.yml"
    role_vars: "{{ _nos_manifest_vars | default({}) }}"
  register: _nos_introspect
  # runtime-state refresh; not idempotency-relevant — introspection is a read
  # that records the observed service versions + a fresh generated_at every run
  # (the module hardcodes changed=True for the stamp), not a config write.
  changed_when: false
  tags: ['migrate']

- name: "[pre-migrate] List pending migrations"
  nos_migrate:
    action: list_pending
    migrations_dir: "{{ playbook_dir }}/files/anatomy/migrations"
    state: "{{ _nos_state.state | default({}) }}"
  register: _pending
  # nos_migrate is delivered by agent 2. Until that ships, this task fails
  # module-not-found. Guard with a friendly skip for solo testing of agent 1.
  failed_when:
    - _pending is defined
    - _pending is failed
    - "'No module named' not in (_pending.msg | default(''))"
  ignore_errors: "{{ nos_pre_migrate_tolerant | default(false) }}"
  tags: ['migrate']

- name: "[pre-migrate] Announce pending migrations"
  ansible.builtin.debug:
    msg: |
      {% set pending = _pending.pending | default([]) %}
      {% if pending | length == 0 %}
      No pending migrations.
      {% else %}
      {{ pending | length }} pending migration(s):
      {% for m in pending %}
        - [{{ m.severity }}] {{ m.id }} — {{ m.title }}
      {% endfor %}
      {% endif %}
  when: _pending is defined and _pending is not failed
  tags: ['migrate']

- name: "[pre-migrate] Confirm breaking migrations"
  ansible.builtin.pause:
    prompt: |-
      {% set pending = _pending.pending | default([]) %}
      {% set breaking = pending | selectattr('severity', 'in', ['breaking', 'security']) | list %}
      {{ pending | length }} migration(s) pending, {{ breaking | length }} require confirmation.
      Press ENTER to apply, or Ctrl+C then A to cancel.
  when:
    - _pending is defined
    - _pending is not failed
    - (_pending.pending | default([]) | selectattr('severity', 'in', ['breaking', 'security']) | list | length) > 0
    - not (auto_migrate | default(false) | bool)
  tags: ['migrate']

- name: "[pre-migrate] Apply each pending migration"
  nos_migrate:
    action: apply
    migration: "{{ item }}"
    dry_run: "{{ migrate_dry_run | default(false) | bool }}"
    state_path: "{{ ansible_facts['env']['HOME'] }}/.nos/state.yml"
  loop: "{{ _pending.pending | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  register: _apply_result
  when:
    - _pending is defined
    - _pending is not failed
    - (_pending.pending | default([]) | length) > 0
  failed_when:
    - _apply_result is defined
    - _apply_result.success is defined
    - not _apply_result.success
  tags: ['migrate']

- name: "[pre-migrate] Persist updated state"
  nos_state:
    action: write
    state_path: "{{ ansible_facts['env']['HOME'] }}/.nos/state.yml"
    merge: true
    state: {}
  # Consistency merge-touch; the only delta is the module's generated_at stamp.
  changed_when: false
  tags: ['migrate']
