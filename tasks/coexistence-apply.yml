---
# ==============================================================================
# COEXISTENCE APPLY (W5-B5c, 2026-05-27)
# ------------------------------------------------------------------------------
# Consumes the coexistence_planned queue (the upgrade-architect agent or an
# operator queues a parallel-track provision for a breaking upgrade) and
# provisions each track via tasks/coexistence-provision.yml. Applies ONLY under
# --tags coexistence (the import in main.yml carries 'never'); never on a
# normal run. Dry-run with -e coexist_dry_run=true.
#
#     ansible-playbook main.yml --tags coexistence
#     ansible-playbook main.yml --tags coexistence -e coexist_dry_run=true
# ==============================================================================

# --list-gated annotates each planned row with the G-PROVISION-MIGRATED gate
# (plan_mode + source_migration_uuid + migration_merged). A coexist track may
# only provision once its linked migrations_authored row reaches
# review_status='merged' (GATE 2 — the operator's local-forge MR merge).
- name: "[Coexistence] Read planned-coexistence queue from Wing (with provision gate)"
  ansible.builtin.command:
    cmd: >-
      php bin/planned-coexistence.php --list-gated
      --data-dir={{ wing_data_dir | default(ansible_facts['env']['HOME'] ~ '/wing/app/data') }}
    chdir: "{{ wing_app_dir | default(ansible_facts['env']['HOME'] ~ '/wing/app') }}"
  register: _coexist_raw
  changed_when: false
  failed_when: false
  tags: ['coexistence']

- name: "[Coexistence] Parse planned queue"
  ansible.builtin.set_fact:
    _coexist_queue: >-
      {{ (_coexist_raw.stdout | default('[]') | trim | from_json)
         if (_coexist_raw.stdout | default('') | trim | length > 0) else [] }}
  tags: ['coexistence']

# G-PROVISION-MIGRATED: split the queue on the merge gate. A coexist row whose
# migration is NOT yet merged (migration_merged=false) is BLOCKED from
# provisioning — it stays queued until the operator merges its migration MR on
# the local forge (GATE 2). plan_mode='migration'/legacy rows carry no migration
# prerequisite (the CLI sets migration_merged=true for them) and pass straight
# through. This is the layered-model enforcer made structural: no agent can flip
# a recipe to a running parallel track without an operator forge-merge.
- name: "[Coexistence] Apply G-PROVISION-MIGRATED gate"
  ansible.builtin.set_fact:
    _coexist_planned: >-
      {{ _coexist_queue | selectattr('migration_merged', 'defined')
         | selectattr('migration_merged') | list }}
    _coexist_blocked: >-
      {{ _coexist_queue | rejectattr('migration_merged', 'defined') | list
         + (_coexist_queue | selectattr('migration_merged', 'defined')
            | rejectattr('migration_merged') | list) }}
  tags: ['coexistence']

- name: "[Coexistence] Refuse coexist tracks whose migration is not yet merged"
  ansible.builtin.debug:
    msg: |-
      G-PROVISION-MIGRATED: {{ _coexist_blocked | length }} queued track(s)
      BLOCKED — their migration is not yet merged on the local forge (GATE 2).
      Provision is refused until the operator reviews + merges the migration MR.
      {% for c in _coexist_blocked %}
        - {{ c.service }}/{{ c.tag }} (plan_mode={{ c.plan_mode | default('?') }},
          source_migration={{ c.source_migration_uuid | default('<none>') }})
      {% endfor %}
  when: _coexist_blocked | length > 0
  tags: ['coexistence']

# state/manifest.yml is the authoritative service→{stack, port_var} source
# (same rows Traefik's file provider reads). Index it by id so each queued
# track lands in its real compose stack and computes off its real base port.
- name: "[Coexistence] Index manifest rows by service id"
  ansible.builtin.set_fact:
    _coexist_manifest: >-
      {{ dict(_rows | map(attribute='id') | zip(_rows)) }}
  vars:
    _rows: "{{ (lookup('file', playbook_dir ~ '/state/manifest.yml') | from_yaml).services }}"
  tags: ['coexistence']

- name: "[Coexistence] Summary"
  ansible.builtin.debug:
    msg: |-
      Coexistence apply: {{ _coexist_planned | length }} queued provision(s).
      {% for c in _coexist_planned %}
        - {{ c.service }}/{{ c.tag }} → {{ c.target_version | default('(no version!)') }} (port_offset {{ c.port_offset }})
      {% endfor %}
      {% if _coexist_planned | selectattr('target_version', 'none') | list | length > 0 %}
      WARNING: entries without target_version are skipped (provision needs a version).
      {% endif %}
  tags: ['coexistence']

# nos_coexistence (via coexistence-provision.yml) requires coexist_version, so
# skip any queued row without one. apply: tags propagates 'coexistence' onto
# the included provision tasks (they're tagged coexist-provision otherwise).
- name: "[Coexistence] Provision each queued track"
  ansible.builtin.include_tasks:
    file: tasks/coexistence-provision.yml
    apply:
      tags: ['coexistence']
  vars:
    coexist_service: "{{ item.service }}"
    coexist_tag: "{{ item.tag }}"
    coexist_version: "{{ item.target_version }}"
    coexist_port_offset: "{{ item.port_offset | default(10) }}"
    # Record the migration this coexist track is built ON (the merged
    # migrations_authored.migration_id, resolved by --list-gated). The cutover/
    # promote hook reads it back from state and runs the data move before the
    # pointer flip. Plain queue rows carry none → omit.
    coexist_source_migration_id: "{{ item.source_migration_id | default(omit) }}"
    # Land the track in the service's real compose stack (manifest.stack);
    # fall back to the module default if the service isn't in the manifest.
    coexist_stack: >-
      {{ _coexist_manifest[item.service].stack
         if item.service in _coexist_manifest else omit }}
    # nos_coexistence's first track owns base_port, so base_port must clear the
    # live legacy install. The queue's port_offset means "sit `offset` above the
    # service's normal port" — so base_port = <port_var> + offset (e.g.
    # postgresql 5432 + 10 → track on 5442). port_var comes from the manifest;
    # if the service/var is absent we omit and the module errors clearly
    # (either port or base_port must be provided).
    coexist_base_port: >-
      {{ ((vars[_coexist_manifest[item.service].port_var] | int) + (item.port_offset | default(10) | int))
         if (item.service in _coexist_manifest
             and vars[_coexist_manifest[item.service].port_var] is defined)
         else omit }}
    # coexist_dry_run is NOT forwarded here: re-declaring it as an include var
    # that reads its own name is self-referential and recurses when no -e
    # override breaks the loop (masked while every test passed -e
    # coexist_dry_run=true). The included tasks inherit it from play scope.
  loop: "{{ _coexist_planned }}"
  loop_control:
    label: "{{ item.service }}/{{ item.tag }}"
  when:
    - item.target_version is not none
    - (item.target_version | default('')) | length > 0
  tags: ['coexistence']

- name: "[Coexistence] Mark queued provisions applied"
  ansible.builtin.command:
    cmd: >-
      php bin/planned-coexistence.php --mark-applied
      --service={{ item.service }} --tag={{ item.tag }}
      --data-dir={{ wing_data_dir | default(ansible_facts['env']['HOME'] ~ '/wing/app/data') }}
    chdir: "{{ wing_app_dir | default(ansible_facts['env']['HOME'] ~ '/wing/app') }}"
  loop: "{{ _coexist_planned }}"
  loop_control:
    label: "{{ item.service }}/{{ item.tag }}"
  when:
    - not (coexist_dry_run | default(false) | bool)
    - item.target_version is not none
    - (item.target_version | default('')) | length > 0
  changed_when: true
  failed_when: false
  tags: ['coexistence']
