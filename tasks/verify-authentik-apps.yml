---
# ── Verify: every forward-auth route has an Application behind it ─────────────
#
# MEASURED on CI run 33651218229 (2026-09-02): the blueprint apply is
# best-effort twice over (`|| true` + `failed_when: false`), and nothing ever
# read back whether the providers exist. The run finished green through the
# playbook while the embedded outpost answered its own 404 on all seven
# forward-auth routes. Success markers are written by a READER — this is it.
#
# The route assert is blueprint engine only: under engine=tofu the apply path owns
# its own verification (plan/destroy-guard). The read runs under both engines: the
# tier-binding read-back below joins on it.

- name: "[Verify] Read the Applications Authentik actually holds"
  no_log: true  # carries a secret (test_a_secret_bearing_task_is_no_log)
  ansible.builtin.uri:
    # Loopback, not the domain: a CI runner has no DNS for the tenant TLD
    # (the smoke's loopback retry is what makes its authentik row green), and
    # this reader must not fail on transport while measuring content.
    # superuser_full_list: the plain list holds only what the token's user may open.
    url: "http://127.0.0.1:{{ authentik_port | default(9003) }}/api/v3/core/applications/?superuser_full_list=true&page_size=300"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token | default('') }}"
    validate_certs: false
    status_code: [200]
  register: _verify_ak_apps
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
  tags: ['always', 'verify']

- name: "[Verify] Every forward-auth route resolves to an Application slug"
  ansible.builtin.assert:
    that:
      - _verify_missing | length == 0
    fail_msg: |
      {{ _verify_missing | length }} forward-auth route(s) have NO Application
      in Authentik — the outpost will answer its own 404 on each:

        {{ _verify_missing | join(', ') }}

      The blueprint apply is best-effort and its failure is invisible; re-run
      it and read its output:
        {{ docker_bin | default('docker') }} compose -p infra exec authentik-worker \
          ak apply_blueprint /blueprints/custom/10-oidc-apps.yaml
    success_msg: >-
      {{ _verify_routes | length }} forward-auth route(s), every one backed by
      an Application.
  vars:
    # Route ids come from the rendered router file (preflight derivation);
    # slugs use dashes where manifest ids use underscores, and Tier-2 rows
    # carry an `app:` prefix — normalize both sides before comparing.
    _verify_routes: >-
      {{ (_nos_gated_without_authentik | default([]))
         | difference(['traefik-dashboard']) }}
    _verify_slugs: >-
      {{ (_verify_ak_apps.json.results | default([]))
         | map(attribute='slug') | map('replace', '_', '-') | list }}
    _verify_missing: >-
      {{ _verify_routes
         | map('replace', 'app:', '') | map('replace', '_', '-')
         | difference(_verify_slugs) }}
  when:
    - install_authentik | default(false) | bool
    - install_traefik | default(true) | bool
    - (authentik_engine | default('blueprint')) != 'tofu'
    - nos_docker_ready | default(true)
    - _verify_ak_apps.json is defined
  tags: ['always', 'verify']

# ── Verify: the four blueprints main.yml applies BEST-EFFORT with no reader —
# 20-rbac-policies, 30-agent-clients, 40-enrollment-flow, 46-brand-auth-flow
# (hidden fee 46 / roadmap authentik-blueprint-readers). Unlike the
# Applications check above these are NOT gated on engine!=tofu: OpenTofu owns
# only the providers+applications+outpost layer (10-oidc-apps); these six other
# blueprints apply imperatively under BOTH engines by design
# (docs/opentofu-authentik-cutover.md). Object names verified against the
# blueprint sources 2026-09-04; the brand's flow-routing check is presence-only
# until the Authentik brand serializer's read shape is confirmed live.

- name: "[Verify] Read the RBAC expression policies Authentik holds"
  no_log: true  # carries a secret (test_a_secret_bearing_task_is_no_log)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_port | default(9003) }}/api/v3/policies/expression/?page_size=300"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token | default('') }}"
    validate_certs: false
    status_code: [200]
  register: _verify_ak_policies
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
    - (authentik_rbac_tiers | default([]) | length) > 0
  tags: ['always', 'verify']

- name: "[Verify] Every RBAC tier has its expression policy (20-rbac-policies)"
  ansible.builtin.assert:
    that:
      - _verify_missing_policies | length == 0
    fail_msg: |
      {{ _verify_missing_policies | length }} RBAC tier(s) have NO expression
      policy in Authentik — every app bound to that tier lost its access gate:
        {{ _verify_missing_policies | join(', ') }}
      The blueprint apply is best-effort and its failure is invisible; re-run:
        {{ docker_bin | default('docker') }} compose -p infra exec authentik-worker \
          ak apply_blueprint /blueprints/custom/20-rbac-policies.yaml
    success_msg: "{{ _verify_expected_policies | length }} RBAC tier(s), every one backed by a policy."
  vars:
    _verify_expected_policies: >-
      {{ (authentik_rbac_tiers | default([])) | map(attribute='name')
         | map('regex_replace', '^', 'nos-') | list }}
    _verify_policy_names: >-
      {{ (_verify_ak_policies.json.results | default([])) | map(attribute='name') | list }}
    _verify_missing_policies: "{{ _verify_expected_policies | difference(_verify_policy_names) }}"
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
    - (authentik_rbac_tiers | default([]) | length) > 0
    - _verify_ak_policies.json is defined
  tags: ['always', 'verify']

# ── Verify: the tier BINDINGS, under both engines (row tofu-tier-binding-missing).
# The policy assert above proves blueprint 20 imported once; an application created
# after it (tofu), or a binding removed by hand, left the application open to every
# signed-in user with nothing red. Expected = the rendered blueprint, held = the API.

- name: "[Verify] Read the policy bindings Authentik holds"
  no_log: true  # carries a secret (test_a_secret_bearing_task_is_no_log)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_port | default(9003) }}/api/v3/policies/bindings/?page_size=1000"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token | default('') }}"
    validate_certs: false
    status_code: [200]
  register: _verify_ak_bindings
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
    - (authentik_rbac_tiers | default([]) | length) > 0
  tags: ['always', 'verify']

- name: "[Verify] Every application carries its RBAC tier binding (20-rbac-policies)"
  ansible.builtin.assert:
    that:
      - _verify_rendered | length > 0  # no rendered 20 = nothing compared, never "every one held"
      - _verify_declared | length == _verify_rendered | regex_findall('authentik_policies[.]policybinding') | length
      - (_verify_ak_bindings.json.pagination.next | default(0) | int) == 0
      - (_verify_ak_apps.json.pagination.next | default(0) | int) == 0
      - _verify_unbound | length == 0
      - _verify_extra | length == 0
      - _verify_untiered_bad | length == 0
    fail_msg: |
      {{ _verify_unbound | length }} application(s) do NOT carry the tier policy blueprint 20 declares
      (application, policy) — until bound, every signed-in user reaches them:
        {{ _verify_unbound | join(', ') | default('none', true) }}
      {{ _verify_extra | length }} binding(s) Authentik holds that blueprint 20 does not declare (application,
      policy | group: | user:<pk>) — the policy engine is `any`, so each one widens access; remove it in Authentik:
        {{ _verify_extra | join(', ') | default('none', true) }}
      {{ _verify_untiered_bad | length }} application(s) with no declared tier that are not a machine client or
      authentik_untiered_apps — open to every signed-in user:
        {{ _verify_untiered_bad | join(', ') | default('none', true) }}
      (Or the check could not read its inputs: {{ _verify_declared | length }} bindings parsed from the
      rendered blueprint, next page of held bindings: {{ _verify_ak_bindings.json.pagination.next | default(0) }},
      of applications: {{ _verify_ak_apps.json.pagination.next | default(0) }}.)
      Re-run and read the output (it may print entry attributes; do not paste it anywhere):
        {{ docker_bin | default('docker') }} compose -p infra exec -u root authentik-worker \
          ak apply_blueprint /blueprints/custom/20-rbac-policies.yaml
    success_msg: >-
      {{ _verify_declared | length }} declared tier binding(s), every one held, none extra.
      No declared tier, each a declared exception (machine clients, authentik_untiered_apps):
      {{ _verify_untiered | join(', ') | default('none', true) }}.
  vars:
    _verify_rendered: "{{ lookup('ansible.builtin.file', stacks_dir ~ '/infra/authentik/blueprints/20-rbac-policies.yaml', errors='ignore') | default('', true) }}"
    # "slug policy" per binding entry of the rendered file. `\[` is a literal bracket: Ansible doubles a backslash
    # in a YAML-sourced template, Jinja halves it (`\\[` reached re as `\\[`, unbalanced; `[[]` warned as a possible
    # nested set on every converge, 2026-11-15). Measured on ansible-core 2.20.5 and 2.21.6.
    _verify_declared: >-
      {{ _verify_rendered
         | regex_findall('\[slug, "([^"]+)"[]][]][\n ]+order: 0[\n ]+attrs:[\n ]+policy: !Find \[[a-z_.]+, \[name, "([^"]+)"[]][]]')
         | map('join', ' ') | list }}
    _verify_slug_of: >-
      {{ dict((_verify_ak_apps.json.results | default([])) | map(attribute='pk')
              | zip((_verify_ak_apps.json.results | default([])) | map(attribute='slug'))) }}
    _verify_app_binds: >-
      {{ (_verify_ak_bindings.json.results | default([]))
         | selectattr('enabled') | rejectattr('negate') | rejectattr('policy_obj', 'none')
         | selectattr('target', 'in', _verify_slug_of.keys() | list) | list }}
    _verify_held: >-
      {{ _verify_app_binds | map(attribute='target') | map('extract', _verify_slug_of)
         | zip(_verify_app_binds | map(attribute='policy_obj.name')) | map('join', ' ') | list }}
    _verify_unbound: "{{ _verify_declared | difference(_verify_held) }}"
    # Ruled 2026-11-23, item 1: every enabled binding on an application, of any kind and at any order, must be a
    # declared one. A group or user binding is never declared by blueprint 20; a negated one never equals one.
    _verify_app_any: >-
      {{ (_verify_ak_bindings.json.results | default([]))
         | selectattr('enabled')
         | selectattr('target', 'in', _verify_slug_of.keys() | list) | list }}
    _verify_held_all: >-
      {%- set out = [] -%}
      {%- for b in _verify_app_any -%}
        {%- set _ = out.append(_verify_slug_of[b.target] ~ ' ' ~ (b.policy_obj.name if b.policy_obj
              else ('group:' ~ b.group_obj.name if b.group_obj else 'user:' ~ b.user))
              ~ (' (negated)' if b.negate else '')) -%}
      {%- endfor -%}{{ out }}
    _verify_extra: "{{ _verify_held_all | difference(_verify_declared) }}"
    # Item 2: an application with no declared tier, unless a machine client or authentik_untiered_apps.
    _verify_untiered: "{{ _verify_slug_of.values() | difference(_verify_declared | map('split', ' ') | map('first')) | sort }}"
    _verify_untiered_bad: >-
      {{ _verify_untiered | difference((authentik_agent_clients | default([]) | map(attribute='slug') | list)
                                       + (authentik_untiered_apps | default([]))) }}
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
    - (authentik_rbac_tiers | default([]) | length) > 0
    - _verify_ak_bindings.json is defined
    - _verify_ak_apps.json is defined
  tags: ['always', 'verify']

- name: "[Verify] Read the agent OAuth2 providers Authentik holds"
  no_log: true  # carries a secret (test_a_secret_bearing_task_is_no_log)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_port | default(9003) }}/api/v3/providers/oauth2/?page_size=300"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token | default('') }}"
    validate_certs: false
    status_code: [200]
  register: _verify_ak_agent_providers
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
    - (authentik_agent_clients | default([]) | length) > 0
  tags: ['always', 'verify']

- name: "[Verify] Every agent client has an OAuth2 provider (30-agent-clients)"
  ansible.builtin.assert:
    that:
      - _verify_missing_agents | length == 0
    fail_msg: |
      {{ _verify_missing_agents | length }} agent client(s) have NO OAuth2
      provider — client_credentials fails invalid_client and Bone rejects them:
        {{ _verify_missing_agents | join(', ') }}
      The blueprint apply is best-effort and its failure is invisible; re-run:
        {{ docker_bin | default('docker') }} compose -p infra exec authentik-worker \
          ak apply_blueprint /blueprints/custom/30-agent-clients.yaml
    success_msg: "{{ _verify_expected_agents | length }} agent client(s), every one backed by a provider."
  vars:
    _verify_expected_agents: "{{ (authentik_agent_clients | default([])) | map(attribute='name') | list }}"
    _verify_agent_provider_names: >-
      {{ (_verify_ak_agent_providers.json.results | default([])) | map(attribute='name') | list }}
    _verify_missing_agents: "{{ _verify_expected_agents | difference(_verify_agent_provider_names) }}"
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
    - (authentik_agent_clients | default([]) | length) > 0
    - _verify_ak_agent_providers.json is defined
  tags: ['always', 'verify']

- name: "[Verify] Read the enrollment flow Authentik holds"
  no_log: true  # carries a secret (test_a_secret_bearing_task_is_no_log)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_port | default(9003) }}/api/v3/flows/instances/?page_size=300"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token | default('') }}"
    validate_certs: false
    status_code: [200]
  register: _verify_ak_flows
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
  tags: ['always', 'verify']

- name: "[Verify] The enrollment flow exists (40-enrollment-flow)"
  ansible.builtin.assert:
    that:
      - "'nos-enrollment' in _verify_flow_slugs"
    fail_msg: |
      The enrollment flow (slug nos-enrollment) is missing — operator
      invitations cannot enroll. The blueprint apply is best-effort and its
      failure is invisible; re-run:
        {{ docker_bin | default('docker') }} compose -p infra exec authentik-worker \
          ak apply_blueprint /blueprints/custom/40-enrollment-flow.yaml
    success_msg: "enrollment flow nos-enrollment present."
  vars:
    _verify_flow_slugs: "{{ (_verify_ak_flows.json.results | default([])) | map(attribute='slug') | list }}"
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
    - _verify_ak_flows.json is defined
  tags: ['always', 'verify']

- name: "[Verify] Read the default brand Authentik holds"
  no_log: true  # carries a secret (test_a_secret_bearing_task_is_no_log)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_port | default(9003) }}/api/v3/core/brands/?domain=authentik-default"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token | default('') }}"
    validate_certs: false
    status_code: [200]
  register: _verify_ak_brand
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
  tags: ['always', 'verify']

# Repair before the verdict (2026-11-11): a 47 rendered by an earlier run is unchanged, so no
# handler fires, and on macOS VirtioFS no inotify reaches the worker (~1 h discovery).
- name: "[Authentik] Apply the estate brand when the login page lacks it"
  ansible.builtin.command:
    argv: ["{{ docker_bin }}", compose, -p, infra, exec, -T, -u, root, authentik-worker,
           ak, apply_blueprint, /blueprints/custom/47-estate-brand.yaml]
  register: _ak_brand_heal
  changed_when: _ak_brand_heal.rc == 0
  failed_when: false  # the assert below is the verdict
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
    - _verify_ak_brand.json is defined
    - (_verify_ak_brand.json.results | default([{}]) | first).branding_title | default('') != estate_brand_title
  tags: ['always', 'verify']

- name: "[Verify] Read the default brand again after the repair"
  no_log: true  # carries a secret (test_a_secret_bearing_task_is_no_log)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_port | default(9003) }}/api/v3/core/brands/?domain=authentik-default"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token | default('') }}"
    validate_certs: false
    status_code: [200]
  register: _verify_ak_brand_healed
  when: _ak_brand_heal is changed
  tags: ['always', 'verify']

- name: "[Verify] The re-read is the brand the asserts judge"
  no_log: true  # carries a secret (test_a_secret_bearing_task_is_no_log)
  ansible.builtin.set_fact:
    _verify_ak_brand: "{{ _verify_ak_brand_healed }}"
  when: _ak_brand_heal is changed
  tags: ['always', 'verify']

- name: "[Verify] The default brand exists (46-brand-auth-flow)"
  ansible.builtin.assert:
    that:
      # PRESENCE ONLY: the brand row existing means the blueprint applied. The
      # stronger check — flow_authentication routes through nos-tier1-mfa-flow
      # (enforce_mfa on) or the stock flow (off) — awaits a live-confirmed read
      # shape for the brand serializer (bare PK vs expanded object), then it
      # becomes an equality assert here. TODO(authentik-blueprint-readers).
      - (_verify_ak_brand.json.results | default([])) | length > 0
    fail_msg: |
      The default brand (domain authentik-default) is missing — the auth-flow
      routing blueprint did not apply. Best-effort and invisible; re-run:
        {{ docker_bin | default('docker') }} compose -p infra exec authentik-worker \
          ak apply_blueprint /blueprints/custom/46-brand-auth-flow.yaml
    success_msg: "default brand present (flow-routing check pending a live read shape)."
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
    - _verify_ak_brand.json is defined
  tags: ['always', 'verify']

- name: "[Verify] The login page carries the estate brand (47-estate-brand)"
  ansible.builtin.assert:
    that:
      - (_verify_ak_brand.json.results | default([{}]) | first).branding_title | default('') == estate_brand_title
    fail_msg: |
      The default brand's title is not estate_brand_title ({{ estate_brand_title }}). Re-run:
        {{ docker_bin | default('docker') }} compose -p infra exec authentik-worker \
          ak apply_blueprint /blueprints/custom/47-estate-brand.yaml
    success_msg: "login page titled {{ estate_brand_title }}."
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
    - (_verify_ak_brand.json.results | default([])) | length > 0
  tags: ['always', 'verify']

# ── Verify: 00-admin-groups and 05-synthetic-identities imported, and every
# declared identity can log in. MEASURED 2026-10-18: `pazny` could not sign in
# with the derived password while identity-status said ok — an import is
# all-or-nothing and its failure was swallowed. The worker's own apply writes
# status=error on the instance; Authentik re-applies every 60 min, so a stale
# error clears within the hour once the file is valid.

- name: "[Verify] Read the blueprint instances Authentik holds"
  no_log: true  # carries a secret (test_a_secret_bearing_task_is_no_log)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_port | default(9003) }}/api/v3/managed/blueprints/?page_size=300"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token | default('') }}"
    validate_certs: false
    status_code: [200]
  register: _verify_ak_blueprints
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
  tags: ['always', 'verify']

- name: "[Verify] The identity blueprints did not fail to import (00, 05)"
  ansible.builtin.assert:
    that:
      - _verify_bp_errors | length == 0
    fail_msg: |
      Blueprint(s) at status=error: {{ _verify_bp_errors | join(', ') }}.
      The import is all-or-nothing — its users and passwords are NOT applied.
      Read the reason (it may print entry attributes; do not paste it anywhere):
        {{ docker_bin | default('docker') }} compose -p infra exec authentik-worker \
          ak apply_blueprint /blueprints/{{ _verify_bp_errors | first | default('custom/00-admin-groups.yaml') }}
    success_msg: "00-admin-groups and 05-synthetic-identities imported."
  vars:
    _verify_bp_errors: >-
      {{ (_verify_ak_blueprints.json.results | default([]))
         | selectattr('path', 'in', ['custom/00-admin-groups.yaml', 'custom/05-synthetic-identities.yaml'])
         | selectattr('status', 'equalto', 'error') | map(attribute='path') | list }}
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
    - _verify_ak_blueprints.json is defined
  tags: ['always', 'verify']

- name: "[Verify] Every declared Authentik identity can log in"
  ansible.builtin.command:
    argv: "{{ [nos_tools_python, playbook_dir ~ '/tools/nos-first-login.py', '--login-only', '--auth-host=' ~ authentik_domain]
              + (['--local-tld'] if (tenant_domain_is_local | default(true) | bool) else []) }}"
  environment:
    NOS_FIRST_LOGIN: >-
      {% set out = [] %}{% for i in nos_identities if 'authentik' in (i.realms | default([])) %}{%
      set e = {'name': i.name, 'password': lookup('vars', i.password_var)} %}{%
      if (nos_operator_owns_password | default(false)) and i.name == nos_primary_admin %}{%
      set _ = e.update({'own_password': true}) %}{% endif %}{%
      set _ = out.append(e) %}{% endfor %}{{ out | to_json }}
  register: _verify_ak_logins
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true   # env carries the passwords; the tool prints names only
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
  tags: ['always', 'verify']

- name: "[Verify] Declared identity logins"
  ansible.builtin.assert:
    that: _verify_ak_logins.rc | default(1) == 0
    # FAIL names who and why; FIX (only for a refused password, never an outage) names the one command.
    fail_msg: "{{ (_verify_ak_logins.stdout_lines | default([])) | select('match', '(FAIL|FIX) ') | list }}"
    success_msg: "{{ _verify_ak_logins.stdout_lines | default([]) }}"
  when:
    - install_authentik | default(false) | bool
    - nos_docker_ready | default(true)
    - _verify_ak_logins.rc is defined
  tags: ['always', 'verify']
