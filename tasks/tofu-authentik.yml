---
# ADR-0001 Phase 0 — OpenTofu Authentik DRIFT DETECTOR (plan-only, opt-in).
#
# Renders the playbook-bridged tfvars, runs `tofu init` + `tofu plan` against
# the live tenant, and reports drift. Does NOT apply — `ak apply_blueprint`
# stays authoritative until Phase 1. Opt-in: `--tags tofu-authentik` AND
# `-e manage_authentik_with_tofu=true` (default false). Requires `tofu` on PATH
# (installed by tasks/python.yml / brew when nos_pkg_manager==homebrew).
#
# Cross-platform: OpenTofu via brew (macOS) / apt or release tarball (Linux).
# OpenTofu, NEVER Terraform (BSL conflicts with the nOS all-FOSS principle).

- name: "[tofu-authentik] Resolve tofu binary"
  ansible.builtin.command: "command -v tofu"
  register: _tofu_bin
  changed_when: false
  failed_when: false

- name: "[tofu-authentik] Skip — tofu not installed"
  ansible.builtin.debug:
    msg: "tofu not on PATH — install OpenTofu (brew install opentofu) to run the Authentik drift check. Skipping."
  when: _tofu_bin.rc != 0

# Resilience: the tofu provider reads the live Authentik API at plan/apply
# time. If Authentik isn't answering yet (cold blank, restart), curl-probe it
# first and SKIP cleanly rather than hard-fail the converge. A retry loop gives
# a cold container a moment; if it never answers, we skip (the imperative path
# or a later converge covers it).
- name: "[tofu-authentik] Probe Authentik API reachability"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_port | default(9000) }}/api/v3/core/users/me/"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    timeout: 5
    status_code: 200
  register: _ak_up
  changed_when: false
  failed_when: false
  retries: 12
  delay: 5
  until: _ak_up.status | default(0) == 200
  when: _tofu_bin.rc == 0
  no_log: true

- name: "[tofu-authentik] Skip — Authentik API not reachable"
  ansible.builtin.debug:
    msg: "Authentik API not answering on :{{ authentik_port | default(9000) }} — skipping the OpenTofu step (imperative path / next converge covers it)."
  when:
    - _tofu_bin.rc == 0
    - _ak_up.status | default(0) != 200

- name: "[tofu-authentik] Drift-check block"
  when:
    - _tofu_bin.rc == 0
    - _ak_up.status | default(0) == 200
  vars:
    _tf_dir: "{{ playbook_dir }}/terraform/authentik"
  block:
    - name: "[tofu-authentik] Render playbook-bridged tfvars (0600, secret-bearing)"
      ansible.builtin.template:
        src: "tofu/nos.auto.tfvars.json.j2"
        dest: "{{ _tf_dir }}/nos.auto.tfvars.json"
        mode: '0600'
      no_log: true
      # TASK-SCOPED registry load — NOT include_vars (play-scoped). The registry
      # values carry raw Jinja ({{ bookstack_domain }}); persisting them into the
      # play namespace makes nos_state's `role_vars: "{{ vars }}"` eager-finalize
      # choke ("bookstack_domain is undefined") — the documented {{ vars }} trap
      # (CLAUDE.md). Task-scoped vars never enter that namespace.
      # lookup('template'), NOT lookup('file'): post-2.19 data-tagging marks
      # strings from file+from_yaml untrusted — nested Jinja in registry values
      # is NEVER resolved, so tfvars shipped literal 'https://{{ x_domain }}'
      # (blank #2: 22 proxy providers 400'd on "Enter a valid URL"). template
      # lookup renders the FILE first (full var scope), then from_yaml parses
      # resolved values.
      vars:
        tofu_authentik_services: "{{ (lookup('template', playbook_dir + '/state/tofu-authentik-services.yml') | from_yaml).tofu_authentik_services }}"

    - name: "[tofu-authentik] tofu init"
      ansible.builtin.command: "tofu init -input=false -no-color"
      args:
        chdir: "{{ _tf_dir }}"
      changed_when: false

    # ── SELF-RECONCILE PREFLIGHT (state-PK ⇄ live-PK; idempotent) ────────────
    # tofu tracks each provider by its Authentik integer PK (resource id). Those
    # PKs can drift out from under the state — a blank state-reset that didn't
    # fully align, a provider recreate, a manual change — so the plan below reads
    # a "dangerous in-place client_id/external_host flip" and the guard REFUSES,
    # even though the live SSO is correct. This is the recurring non-blank desync
    # (root-cause + proof: docs/archive/v07-no-auto-adopt.md § LIVE ROOT-CAUSE;
    # providers are managed=None, no blueprint owns them, so there is no single
    # churner to eliminate — the engine must self-reconcile instead).
    #
    # Re-points each module.service[*] provider (+ proxy attachment + app) at its
    # CURRENT live PK, DRIFT-CONDITIONAL (a no-op when already aligned), via the
    # STABLE bridge live application.slug → application.provider (apps import by
    # slug, never desync). IDENTITY ONLY — attributes are still compared by the
    # plan below, so a REAL config change (a genuine immutable-field edit) still
    # trips the guard. Best-effort: if it can't run, the plan+guard below remain
    # the authoritative rails (the run degrades to today's refuse-on-drift, never
    # a silent apply). Only under engine=tofu (imperative path has no tofu state).
    # Run ASYNC + heartbeat: on a non-blank re-converge the blueprints churn
    # EVERY provider PK, so the reconcile re-imports dozens of services (~2-4s of
    # tofu process spawns each) → minutes. Run blocking, the wrapping task looked
    # FROZEN with no signal (live 2026-07-17: one task line ~3min). Async + an
    # async_status wait turns that into per-poll "RETRYING (N left)" liveness
    # lines in ansible.log (same UX as the freescout/bone waits), and the script
    # writes a live counter to ~/.nos/tofu-reconcile.progress: `tail -f` it for
    # per-service detail (`reconcile: 12/43 services … current=<slug>`).
    - name: "[tofu-authentik] Self-reconcile state PKs to live (async)"
      ansible.builtin.command: "{{ playbook_dir }}/tools/tofu-authentik-reconcile.sh --preflight"
      args:
        chdir: "{{ _tf_dir }}"
      environment:
        AUTHENTIK_PORT: "{{ authentik_port | default(9000) }}"
      async: "{{ tofu_reconcile_async_timeout | default(600) }}"
      poll: 0
      register: _reconcile_job
      changed_when: false
      when: (authentik_engine | default('blueprint')) == 'tofu'

    - name: "[tofu-authentik] Await self-reconcile (heartbeat — tail ~/.nos/tofu-reconcile.progress)"
      ansible.builtin.async_status:
        jid: "{{ _reconcile_job.ansible_job_id }}"
      register: _tofu_reconcile
      until: _tofu_reconcile.finished
      retries: "{{ ((tofu_reconcile_async_timeout | default(600)) // 10) | int }}"
      delay: 10
      changed_when: "_tofu_reconcile.stdout | default('') is search('reconciled=[1-9]')"
      failed_when: false
      when: (authentik_engine | default('blueprint')) == 'tofu'

    - name: "[tofu-authentik] Reconcile preflight summary"
      ansible.builtin.debug:
        msg: >-
          tofu self-reconcile: {{ (_tofu_reconcile.stdout_lines | default([]) | select('search', 'reconciled=|no state yet') | list | last) | default('preflight skipped (API unreachable)', true) }}
          {{ '— rc=' ~ _tofu_reconcile.rc ~ ' (best-effort; plan+guard below are the rails)' if (_tofu_reconcile.rc | default(0)) != 0 else '' }}
      when: (authentik_engine | default('blueprint')) == 'tofu'

    - name: "[tofu-authentik] tofu plan (-out so apply can be destroy-gated)"
      ansible.builtin.command: "tofu plan -input=false -no-color -detailed-exitcode -out=tfplan"
      args:
        chdir: "{{ _tf_dir }}"
      register: _tofu_plan
      # -detailed-exitcode: 0=no-drift, 2=drift, 1=error.
      changed_when: _tofu_plan.rc == 2
      failed_when: _tofu_plan.rc not in [0, 2]

    # ── DESTROY GUARD (ADR-0001 Phase 1 safety rail) ────────────────────────
    # The single rule that makes the engine flip safe: NEVER apply a plan that
    # destroys anything. A partial-HCL tenant (e.g. 2 of 50 services authored)
    # would plan to destroy the 48 un-authored providers → catastrophic SSO
    # outage. Parse the plan JSON; refuse apply on any delete action.
    - name: "[tofu-authentik] Read plan as JSON for the destroy guard"
      ansible.builtin.command: "tofu show -json tfplan"
      args:
        chdir: "{{ _tf_dir }}"
      register: _tofu_plan_json
      changed_when: false

    - name: "[tofu-authentik] Parse plan resource_changes"
      ansible.builtin.set_fact:
        _tofu_changes: "{{ (_tofu_plan_json.stdout | from_json).resource_changes | default([]) }}"

    - name: "[tofu-authentik] Count destroy/replace actions"
      ansible.builtin.set_fact:
        _tofu_destroys: >-
          {{ _tofu_changes
             | selectattr('change.actions', 'contains', 'delete')
             | list | length }}

    # ── DANGEROUS-UPDATE GUARD ──────────────────────────────────────────────
    # A pure UPDATE (no delete in change.actions) on an Authentik lookup key
    # silently breaks SSO: e.g. OAuth2Provider.client_id is the OIDC client
    # identifier baked into every consumer's env — flipping it via a registry
    # slug/override edit leaves the app authenticating with the OLD id while
    # Authentik's provider now answers to the NEW one (token validation +
    # discovery break). The destroy guard above only catches delete/replace,
    # so this second pass refuses an in-place change to any immutable-by-
    # contract field. Denylist is per resource type (see modules/nos-authentik
    # -app/main.tf): client_id is the OIDC lookup key, external_host the proxy
    # routing key, slug the application URL/lookup key. The detection lives in
    # the `nos_tofu_immutable_field_updates` filter (filter_plugins/, normal
    # play context — NOT the {{ vars }} loader, so a custom filter loads fine);
    # a field is "dangerous" only when its before value is concrete AND after
    # differs (a null/known-after-apply before is a CREATE, not a mutation).
    - name: "[tofu-authentik] Detect dangerous in-place field updates"
      ansible.builtin.set_fact:
        _tofu_bad_updates: "{{ _tofu_changes | nos_tofu_immutable_field_updates }}"

    - name: "[tofu-authentik] Drift report"
      ansible.builtin.debug:
        msg: >-
          Authentik OpenTofu: {{ 'DRIFT (rc=2)' if _tofu_plan.rc == 2 else 'no-op' }};
          {{ _tofu_destroys }} destroy/replace action(s),
          {{ _tofu_bad_updates | length }} dangerous-field update(s); engine=
          {{ authentik_engine | default('blueprint') }}.
          {{ 'PLAN-ONLY (ak apply_blueprint authoritative).'
             if (authentik_engine | default('blueprint')) != 'tofu'
             else 'APPLY mode.' }}

    # ── APPLY — only when engine=tofu AND zero destroys ─────────────────────
    # Operator UX: when the destroy guard is about to refuse, name the exact
    # resource address(es) the plan would delete (not just a count) plus the
    # paste-able supervised-apply one-liner. The guard refusing with only a
    # number forces the operator to hand-parse the plan JSON to learn which
    # service flipped enabled→false — this debug surfaces it before the fail.
    - name: "[tofu-authentik] Diagnose — list resources the plan would destroy"
      ansible.builtin.debug:
        msg: >-
          DESTROY GUARD will refuse apply. {{ _tofu_destroys }} resource(s)
          would be destroyed/replaced:
          {{ _tofu_changes
             | selectattr('change.actions', 'contains', 'delete')
             | map(attribute='address') | list | join(', ') }}.
          Cause: each is an Authentik object (provider/application/attachment)
          for a service that flipped enabled→false (install_* off) or is not yet
          authored in HCL. To recover after reviewing the plan, run supervised:
          `cd {{ _tf_dir }} && tofu apply -parallelism=1 tfplan`
          (or let the next blank converge the tenant).
      when:
        - (authentik_engine | default('blueprint')) == 'tofu'
        - _tofu_destroys | int > 0

    - name: "[tofu-authentik] REFUSE apply — plan would destroy resources"
      ansible.builtin.fail:
        msg: >-
          tofu plan would destroy/replace {{ _tofu_destroys }} resource(s) —
          refusing to apply. Two known causes: (a) the tenant is only partially
          authored in HCL (un-authored providers plan as destroys) — author/
          import the full tenant (tools/tofu-authentik-adopt.sh) until the plan
          is no-op; (b) a service flipped enabled→false (install_* off) and
          dropped out of the registry filter — review the plan and run
          `tofu apply tfplan` supervised (or let the next blank converge it).
      when:
        - (authentik_engine | default('blueprint')) == 'tofu'
        - _tofu_destroys | int > 0

    - name: "[tofu-authentik] REFUSE apply — in-place change to an immutable field"
      ansible.builtin.fail:
        msg: >-
          tofu plan would change {{ _tofu_bad_updates | length }} immutable
          Authentik lookup field(s) in place — refusing to apply:
          {{ _tofu_bad_updates | join('; ') }}. These (OAuth2Provider.client_id,
          ProxyProvider.external_host, Application.slug) are baked into consumer
          env / OIDC discovery; an in-place flip breaks SSO silently. Usual cause
          is a registry slug change or a stray client_id/external_host override
          in a plugin block — revert the registry edit, or migrate the reference
          deliberately (recreate the provider) and re-run.
      when:
        - (authentik_engine | default('blueprint')) == 'tofu'
        - _tofu_bad_updates | length > 0

    # -parallelism=1: authentik_outpost_provider_attachment is a read-modify-
    # write over the outpost's providers LIST (no row-level m2m API in the
    # goauthentik provider). Default parallelism=10 races the writes — blank #3
    # created 20 attachments, last-writer-wins kept 11, and 9 forward_auth
    # services 404'd at the outpost. Serial apply is the honest fix (~60s).
    - name: "[tofu-authentik] tofu apply (engine=tofu, destroy-guard passed)"
      ansible.builtin.command: "tofu apply -input=false -no-color -parallelism=1 tfplan"
      args:
        chdir: "{{ _tf_dir }}"
      register: _tofu_apply
      changed_when: "'0 added, 0 changed, 0 destroyed' not in _tofu_apply.stdout"
      when:
        - (authentik_engine | default('blueprint')) == 'tofu'
        - _tofu_destroys | int == 0
        - _tofu_bad_updates | length == 0
