---
# ==============================================================================
# Claude Code CLI — installed as a NATIVE build, deliberately outside NVM.
#
# WHY THIS FILE EXISTS, measured 2026-08-04
# -----------------------------------------
# The operator's interactive session was dying several times a day with:
#
#   Couldn't restart the background service — spawn background service:
#   EACCES: permission denied, posix_spawn
#   '/Users/…/.nvm/versions/node/v24.18.0/lib/node_modules/@anthropic-ai/claude-code/…'
#
# The chain, end to end:
#
#   1. `node_nvm_version` is `lts/*` — a FLOATING pin. Every converge runs
#      `nvm install lts/*` + `nvm alias default lts/*`, so a new upstream LTS
#      silently creates a whole new node tree under the operator. Six had
#      accumulated; v24.19.0 was created at 19:16 DURING that day's converge.
#
#   2. tasks/node.yml then re-pointed {{ homebrew_prefix }}/bin/claude
#      (`state: link, force: true`) at whatever `nvm use default` resolved to.
#      That bridge exists for a real reason — launchd starts Pulse and Bone
#      with a minimal PATH, and `command -v claude` failed there in 2026-05-07,
#      which is why it was added. But it made the bridge FOLLOW the float.
#
#   3. So the estate ended up with FIVE claude-code installs (211–270 MB each),
#      one per node version, each with its own auto-updater. Two were rewritten
#      on the same day, 35 minutes apart.
#
#   4. The interactive session executes an absolute path (CLAUDE_CODE_EXECPATH).
#      When an updater rewrote THAT 270 MB file underneath the running session,
#      any spawn landing in the window before the final chmod got EACCES.
#
# THE FIX IS TO REMOVE THE COUPLING, not to guard the window. A developer tool
# the operator is holding has no business being reinstalled by a Node runtime
# migration. `claude install` ships a native build that does not live in any
# node_modules tree, so nvm can churn as much as it likes.
#
# HONEST LIMIT: the EACCES event itself was never captured — nothing on the host
# records it. The mechanism fits the error text and the timestamps line up, but
# it is inference. What is NOT inference: five installs, the float, the bridge
# following it, and the running session's own binary rewritten under it.
#
# NOT DONE HERE, on purpose: `node_nvm_version` stays `lts/*`. The operator's
# position (2026-08-04) is that a floating pin is wrong for a deterministic
# harness and that version moves belong to the agents via wing/upgrades — a
# broader change than one line, tracked separately. This file only stops that
# float from reaching the CLI.
#
# 2026-10-05: the CLI is vendor-owned. A claude that already resolves is left
# untouched (no reinstall, no force-link, no .zshrc edit); nOS installs only
# when none does, and only with install_claude_cli_vendor. Gate:
# test_claude_cli_respects_an_existing_install.py. 2026-10-06: node is pinned exact.
# ==============================================================================

- name: "[claude-cli] Where a native build lives"
  ansible.builtin.set_fact:
    _claude_native_bin: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
  tags: ['claude-cli', 'node']

# Any claude that already resolves is the operator's: his PATH first, then the
# vendor's native location, the launchd bridge, and last NVM's default node.
- name: "[claude-cli] Which claude already resolves?"
  ansible.builtin.shell: |
    PATH="$PATH:$HOME/.local/bin:{{ homebrew_prefix }}/bin"
    found=$(command -v claude 2>/dev/null || true)
    if [ -z "$found" ] && [ -s "{{ homebrew_prefix }}/opt/nvm/nvm.sh" ]; then
      export NVM_DIR="$HOME/.nvm"; . "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
      nvm use default >/dev/null 2>&1; found=$(command -v claude 2>/dev/null || true)
    fi
    echo "$found"
  args:
    executable: /bin/bash
  register: _claude_existing
  changed_when: false
  failed_when: false
  check_mode: false
  tags: ['claude-cli', 'node']

# Only when nothing resolves AND the operator set install_claude_cli_vendor: the
# vendor's own route, once; its auto-updater owns the build afterwards. The old
# route (`claude install`) needed a claude already, so a clean host got nothing.
- name: "[claude-cli] Install the native build (no claude resolved)"
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://claude.ai/install.sh | bash -s '{{ claude_cli_channel | default("stable") }}'
  args:
    executable: /bin/bash
  register: _claude_install
  changed_when: _claude_install.rc | default(1) == 0
  failed_when: false
  when:
    - nos_pkg_manager == 'homebrew'
    - install_claude_cli_vendor | default(false) | bool
    - (_claude_existing.stdout | default('') | trim) == ''
  tags: ['claude-cli', 'node']

- name: "[claude-cli] Stat the native build and the launchd bridge slot"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ _claude_native_bin }}"
    - "{{ homebrew_prefix }}/bin/claude"
  register: _claude_paths
  tags: ['claude-cli', 'node']

- name: "[claude-cli] Name what the stats found"
  ansible.builtin.set_fact:
    _claude_native_after: "{{ _claude_paths.results[0] }}"
    _claude_bridge: "{{ _claude_paths.results[1] }}"
  tags: ['claude-cli', 'node']

# ── The launchd PATH bridge ──────────────────────────────────────────────────
# Pulse forks pulse-run-agent.sh under launchd's minimal PATH, so `command -v
# claude` must resolve in the homebrew prefix. Written only into an EMPTY slot,
# only at the native build: whatever already sits there is the operator's.
- name: "[claude-cli] Bridge the native build into the homebrew PATH"
  ansible.builtin.file:
    src: "{{ _claude_native_bin }}"
    dest: "{{ homebrew_prefix }}/bin/claude"
    state: link
  when:
    - nos_pkg_manager == 'homebrew'
    - _claude_native_after.stat.exists | default(false)
    - not (_claude_bridge.stat.exists | default(false))
  tags: ['claude-cli', 'node']

# Only for a build THIS run installed (~/.local/bin is not on every PATH). A
# claude the operator already had keeps its place in his PATH.
- name: "[claude-cli] Put ~/.local/bin on the shell PATH (fresh install only)"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    marker: "# {mark} CLAUDE CLI - ANSIBLE MANAGED"
    block: |
      # The Claude CLI is a native build outside NVM on purpose — a node
      # version migration must not be able to reinstall the tool the operator
      # is holding. See tasks/claude-cli.yml.
      export PATH="$HOME/.local/bin:$PATH"
    create: true
    mode: '0644'
  when:
    - nos_pkg_manager == 'homebrew'
    - _claude_install is changed
    - _claude_native_after.stat.exists | default(false)
  tags: ['claude-cli', 'node']

# ── The duplicate copies NVM accumulated ───────────────────────────────────
# Each one carries its own auto-updater, so each is another chance to rewrite a
# 270 MB file while a session is holding it. nOS cannot prove which of them it
# put there (an operator's own `npm i -g` looks identical), so it never removes
# one on its own: the flag below is the operator's explicit request, and even
# then the copy his PATH resolves to is kept.
#
# REPORTS BY DEFAULT, REMOVES ONLY ON REQUEST — and that is not timidity, it is
# the specific failure this would otherwise cause. Deleting the copy that a
# LIVE session is executing does not kill the process (macOS keeps the inode),
# it makes the next background-service spawn fail with ENOENT instead of
# EACCES. Strictly worse: the same crash, now with a path that does not exist.
# So the removal additionally refuses while any claude process is running.
- name: "[claude-cli] Find the claude-code copies NVM is carrying"
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/.nvm/versions/node"
    patterns: 'claude-code'
    file_type: directory
    recurse: true
    depth: 4
  register: _claude_nvm_copies
  changed_when: false
  tags: ['claude-cli', 'node']

- name: "[claude-cli] Is a session holding one of them right now?"
  # `pgrep` exits 1 when nothing matches, which under `pipefail` fails the whole
  # pipeline — and "no claude is running" is the ANSWER here, not an error. The
  # `|| n=0` branch is therefore the no-match case, not a swallowed failure.
  ansible.builtin.shell: |
    set -o pipefail
    n=$(pgrep -f 'claude-code/bin/claude.exe' | wc -l | tr -d ' ') || n=0
    echo "${n:-0}"
  args:
    executable: /bin/bash
  register: _claude_running
  changed_when: false
  failed_when: false
  tags: ['claude-cli', 'node']

- name: "[claude-cli] Report the duplicates"
  ansible.builtin.debug:
    msg: >-
      {{ _claude_nvm_copies.files | default([]) | length }} claude-code copies
      under NVM{{ ' — ' ~ (_claude_nvm_copies.files | map(attribute='path') | join(', ')) if (_claude_nvm_copies.files | default([]) | length) > 0 else '' }}.
      Left in place (not provably nOS's).
      {{ 'Set claude_cli_prune_nvm_copies=true to remove them yourself.'
         if (_claude_running.stdout | default('0') | int) == 0
         else (_claude_running.stdout ~ ' claude process(es) are running — removal is refused while one holds a copy.') }}
  when: (_claude_nvm_copies.files | default([]) | length) > 0
  tags: ['claude-cli', 'node']

- name: "[claude-cli] Remove the duplicate NVM copies"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  # The node tree the resolved claude lives in is never in the loop (empty = all kept).
  loop: >-
    {{ _claude_nvm_copies.files | default([]) | rejectattr('path', 'search',
       '^' ~ (_claude_existing.stdout | default('') | trim | dirname | dirname | regex_escape)) | list }}
  loop_control:
    label: "{{ item.path }}"
  when:
    - claude_cli_prune_nvm_copies | default(false)
    - _claude_native_after.stat.exists | default(false)   # never leave zero CLIs
    - (_claude_running.stdout | default('1') | int) == 0
  tags: ['claude-cli', 'node']

- name: "[claude-cli] Report which claude the estate resolves"
  ansible.builtin.debug:
    msg: >-
      {{ ('claude resolves to ' ~ (_claude_existing.stdout | trim) ~ ' (already present, left untouched)')
         if (_claude_existing.stdout | default('') | trim)
         else ('claude installed by the vendor installer at ' ~ _claude_native_bin ~ '; open a NEW shell')
         if (_claude_native_after.stat.exists | default(false))
         else 'NO claude found and the vendor install produced none: agents that call claude will fail'
         if (install_claude_cli_vendor | default(false) | bool)
         else 'claude: ABSENT — set install_claude_cli_vendor: true to let the vendor installer run once' }}.
      launchd bridge {{ homebrew_prefix }}/bin/claude:
      {{ (_claude_bridge.stat.lnk_source | default('present, not a symlink', true))
         if (_claude_bridge.stat.exists | default(false))
         else ('-> ' ~ _claude_native_bin) if (_claude_native_after.stat.exists | default(false))
         else 'ABSENT: Pulse/Wing agents cannot resolve claude under launchd' }}.
  tags: ['claude-cli', 'node']
