---
# ==============================================================================
# REMOVAL SET — the single source of truth for what each remove= level touches.
# Imported (always-tagged) from tasks/run-mode.yml when a removal is requested;
# consumed by the dry-run printer (run-mode), blank-reset (data), remove-source
# (all) and removal-verify (post-removal absence assertion, R5).
#
# MOVED HERE (byte-identical), do not fork:
#   - external-paths guard        <- tasks/blank-reset.yml (former section 0)
#   - auto-dependency resolution  <- tasks/blank-reset.yml (former section 7)
#   - _blank_dirs                 <- tasks/blank-reset.yml (former section 8)
#   - _uninstall_source           <- tasks/uninstall.yml (keap-inclusive,
#     post-2026-07-21 list — the comment about the 2.1 GB ~/keap miss travels
#     with it)
# ==============================================================================

- name: "[Removal-set] Apply external storage path overrides (if set)"
  # SIBLING-RELATIVE path (resolves from tasks/, the dir of THIS file) — the
  # playbook-relative form "tasks/stacks/…" breaks in the G-1/G-2 harnesses
  # (tmp_path playbook). Must run BEFORE _blank_dirs is built so a genuinely
  # SSD-deployed estate removes /Volumes/SSD1TB/* instead of empty ~ fallbacks.
  #
  # GUARD MUST EQUAL THE DEPLOY GATE (main.yml `import_tasks:
  # tasks/external-storage.yml` — configure_external_storage), NOT merely
  # "root is non-empty": external_storage_root has a non-empty DEFAULT, so the
  # old root-only guard applied SSD overrides to removal even on estates
  # deployed WITHOUT them. First live remove=data (2026-07-22) then deleted
  # absent /Volumes/SSD1TB paths while the real ~/nos/platform data survived —
  # and the R5 verify, measuring the same wrong list, stayed green over the
  # survivors (Infisical crashlooped on a rotated key vs its old DB).
  # Pinned by tests/anatomy/test_removal_external_guard_parity.py.
  ansible.builtin.include_tasks: "stacks/external-paths.yml"
  when:
    - configure_external_storage | default(false)
    - external_storage_root is defined
    - external_storage_root | default('') | length > 0

# Services like ERPNext auto-enable MariaDB/Redis, but main.yml
# auto-deps have not run yet. We must resolve them here too, otherwise DB data won't be removed.
- name: "[Removal-set] Resolve auto-dependencies for cleanup"
  ansible.builtin.set_fact:
    install_mariadb: >-
      {{ install_mariadb | default(false) or
         install_wordpress | default(false) or
         install_nextcloud | default(false) or
         install_erpnext | default(false) or
         install_freescout | default(false) or
         install_freepbx | default(false) or
         install_bookstack | default(false) or
         install_firefly | default(false) }}
    install_postgresql: >-
      {{ install_postgresql | default(false) or
         install_authentik | default(false) or
         install_infisical | default(false) or
         install_paperclip | default(false) or
         install_outline | default(false) or
         install_metabase | default(false) or
         install_superset | default(false) or
         install_miniflux | default(false) or
         install_hedgedoc | default(false) }}
    redis_docker: >-
      {{ redis_docker | default(false) or
         install_authentik | default(false) or
         install_infisical | default(false) or
         install_erpnext | default(false) or
         install_outline | default(false) or
         install_superset | default(false) or
         install_bookstack | default(false) or
         install_firefly | default(false) or
         install_onlyoffice | default(false) }}

