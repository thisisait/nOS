---
# ==============================================================================
# skills.yml — put the skill library on every reader's shelf, unequally.
#
# `files/anatomy/skills/<name>/SKILL.md` is the one copy, SYMLINKED into each
# consumer's skill dir — a copy forks the first time the source changes. Two
# consumer kinds (files/anatomy/skills/README.md): `main` (human-driven harness)
# gets EVERY skill as an invariant; `agent` (autonomous runner) gets only skills
# whose `metadata.nos.audience` names it.
#
# A destination is only written if its harness's parent dir exists (measured
# 2026-08-27: only ~/.openclaw and ~/.hermes did) — a skills dir for a harness
# nobody installed reads later as evidence the harness is set up. This file
# creates only the `skills/` child, never the harness's own home.
#
# Ask what actually landed with `tools/skill-status.py` — a pure reader, so it
# can disagree with this file, which is the point of having it.
# ==============================================================================

- name: "[Skills] Discover the library"
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/files/anatomy/skills"
    patterns: "SKILL.md"
    recurse: true
    file_type: file
  register: _skill_files
  tags: ['skills', 'anatomy']

# The audience is read from the skill's own frontmatter, never restated here.
# Unparseable frontmatter is REPORTED and treated as operator-only — guessing
# wide hands an autonomous runner a procedure nobody meant it to have.
- name: "[Skills] Read each skill's declared audience"
  ansible.builtin.set_fact:
    _skills: >-
      {{ _skills | default([]) + [{
           'name': (item.path | dirname | basename),
           'src': (item.path | dirname),
           'audience': ((lookup('file', item.path).split('---')[1] | from_yaml)
                        .get('metadata', {}).get('nos', {}).get('audience', []) | default([], true))
         }] }}
  loop: "{{ _skill_files.files | default([]) | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path | dirname | basename }}"
  tags: ['skills', 'anatomy']

- name: "[Skills] Report the library"
  ansible.builtin.debug:
    msg: >-
      {{ _skills | default([]) | length }} skill(s):
      {{ _skills | default([]) | map(attribute='name') | join(', ') }}
      — main consumers receive all of them; agents receive only what names them.
  tags: ['skills', 'anatomy']

- name: "[Skills] Ensure the skills dir exists for every PRESENT consumer"
  ansible.builtin.file:
    path: "{{ item.dir }}"
    state: directory
    mode: '0755'
  loop: "{{ nos_skill_consumers }}"
  loop_control:
    label: "{{ item.id }} ({{ item.kind }})"
  when: (item.dir | dirname) is directory
  tags: ['skills', 'anatomy']

# `force: true` because the link must follow a rename of the library entry;
# `state: link` on an existing correct link is a no-op, so this stays idempotent.
- name: "[Skills] Link each skill onto the shelves that should hold it"
  ansible.builtin.file:
    src: "{{ item.0.src }}"
    dest: "{{ item.1.dir }}/{{ item.0.name }}"
    state: link
    force: true
  loop: "{{ (_skills | default([])) | product(nos_skill_consumers) | list }}"
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1.id }}"
  when:
    - (item.1.dir | dirname) is directory
    # main takes everything; an agent takes only what named it.
    - item.1.kind == 'main' or item.1.id in (item.0.audience | default([]))
  tags: ['skills', 'anatomy']
