---
# ==============================================================================
# EXTERNAL STORAGE - validation, directories, set_fact override, shell env vars
#
# This task MUST run BEFORE IIAB, observability and openclaw tasks,
# because via set_fact it overrides data-heavy variables to external SSD paths.
# ==============================================================================

# ── Validate mount point ────────────────────────────────────────────────────

- name: "[External SSD] Verify mount point exists"
  ansible.builtin.stat:
    path: "{{ external_storage_root }}"
  register: _ssd_mount

- name: "[External SSD] Fail if SSD is not mounted"
  ansible.builtin.fail:
    msg: >
      External SSD is not mounted at {{ external_storage_root }}.
      Attach the disk and run the playbook again, or set
      configure_external_storage: false in config.yml.
  when:
    - not ansible_check_mode
    - not _ssd_mount.stat.exists or not _ssd_mount.stat.isdir

# ── Override data paths via set_fact (single source of truth) ────────────
# set_fact has higher priority than vars_files -> overrides default.config.yml values.
# The same file is included from blank-reset.yml so blank knows about external
# paths and does not delete non-existent ~/service directories.

- name: "[External SSD] Apply data path overrides"
  ansible.builtin.include_tasks: "tasks/stacks/external-paths.yml"

# ── Create directory structure on SSD ────────────────────────────────────
# Loop over the overridden vars from external-paths.yml, each with the flag its
# service runs under: only installed services get a dir (2026-10-16), an empty
# pre-created dir of an off service read as a backup source.

- name: "[External SSD] Create data directories from override vars"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0755'
  loop_control:
    label: "{{ item.path }}"
  when: item.enabled | bool
  loop:
    # Core infra
    - { path: "{{ mariadb_data_dir }}", enabled: "{{ install_mariadb | default(false) }}" }
    - { path: "{{ postgresql_data_dir }}", enabled: "{{ install_postgresql | default(false) }}" }
    - { path: "{{ redis_data_dir }}", enabled: "{{ redis_docker | default(false) }}" }
    - { path: "{{ authentik_data_dir }}", enabled: "{{ install_authentik | default(false) }}" }
    - { path: "{{ infisical_data_dir }}", enabled: "{{ install_infisical | default(false) }}" }
    - { path: "{{ vaultwarden_data_dir }}", enabled: "{{ install_vaultwarden | default(false) }}" }
    - { path: "{{ bluesky_pds_data_dir }}", enabled: "{{ install_bluesky_pds | default(false) }}" }
    - { path: "{{ traefik_config_dir }}", enabled: "{{ install_traefik | default(false) }}" }
    # IIAB
    - { path: "{{ wordpress_dir }}", enabled: "{{ install_wordpress | default(false) }}" }
    - { path: "{{ nextcloud_dir }}", enabled: "{{ install_nextcloud | default(false) }}" }
    - { path: "{{ nextcloud_data_dir }}", enabled: "{{ install_nextcloud | default(false) }}" }
    - { path: "{{ kiwix_data_dir }}", enabled: "{{ install_kiwix | default(false) }}" }
    - { path: "{{ maps_data_dir }}", enabled: "{{ install_offline_maps | default(false) }}" }
    - { path: "{{ calibreweb_books_dir }}", enabled: "{{ install_calibreweb | default(false) }}" }
    - { path: "{{ n8n_data_dir }}", enabled: "{{ install_n8n | default(false) }}" }
    - { path: "{{ openwebui_data_dir }}", enabled: "{{ install_openwebui | default(false) }}" }
    - { path: "{{ portainer_data_dir }}", enabled: "{{ install_portainer | default(false) }}" }
    - { path: "{{ uptime_kuma_data_dir }}", enabled: "{{ install_uptime_kuma | default(false) }}" }
    - { path: "{{ homeassistant_config_dir }}", enabled: "{{ install_homeassistant | default(false) }}" }
    - { path: "{{ rustfs_data_dir }}", enabled: "{{ install_rustfs | default(false) }}" }
    - { path: "{{ jellyfin_config_dir }}", enabled: "{{ install_jellyfin | default(false) }}" }
    - { path: "{{ jellyfin_cache_dir }}", enabled: "{{ install_jellyfin | default(false) }}" }
    - { path: "{{ jellyfin_movies_dir }}", enabled: "{{ install_jellyfin | default(false) }}" }
    - { path: "{{ jellyfin_shows_dir }}", enabled: "{{ install_jellyfin | default(false) }}" }
    - { path: "{{ jellyfin_music_dir }}", enabled: "{{ install_jellyfin | default(false) }}" }
    # DevOps
    - { path: "{{ gitea_data_dir }}", enabled: "{{ install_gitea | default(false) }}" }
    - { path: "{{ gitlab_data_dir }}", enabled: "{{ install_gitlab | default(false) }}" }
    - { path: "{{ gitlab_config_dir }}", enabled: "{{ install_gitlab | default(false) }}" }
    - { path: "{{ woodpecker_data_dir }}", enabled: "{{ install_woodpecker | default(false) }}" }
    - { path: "{{ paperclip_data_dir }}", enabled: "{{ install_paperclip | default(false) }}" }
    # B2B (erpnext_data_dir deprecated - named volume, see P0.1 commit 3b88162)
    - { path: "{{ freescout_data_dir }}", enabled: "{{ install_freescout | default(false) }}" }
    - { path: "{{ outline_data_dir }}", enabled: "{{ install_outline | default(false) }}" }
    # VoIP / Engineering / Data
    - { path: "{{ mikopbx_data_dir }}", enabled: "{{ install_mikopbx | default(false) }}" }
    - { path: "{{ qgis_data_dir }}", enabled: "{{ install_qgis_server | default(false) }}" }
    - { path: "{{ metabase_data_dir }}", enabled: "{{ install_metabase | default(false) }}" }
    - { path: "{{ superset_data_dir }}", enabled: "{{ install_superset | default(false) }}" }
    # Observability TSDBs
    - { path: "{{ prometheus_storage_path }}", enabled: "{{ install_observability | default(false) }}" }
    - { path: "{{ loki_storage_path }}", enabled: "{{ install_observability | default(false) }}" }
    - { path: "{{ tempo_storage_path }}", enabled: "{{ install_observability | default(false) }}" }
    - { path: "{{ grafana_data_dir }}", enabled: "{{ install_observability | default(false) }}" }

# ── Ollama modely (persistent across --blank) ──────────────────────────────
# Path is set by external-paths.yml: ollama_models_dir → {{ external_storage_root }}/llmModels
# OpenClaw role handles launchctl setenv + .zshrc export.

- name: "[External SSD] Create LLM models directory"
  ansible.builtin.file:
    path: "{{ ollama_models_dir | default(external_storage_root + '/llmModels') }}"
    state: directory
    mode: '0755'
  when: external_storage_ollama | default(true) | bool

# ── Cache directories ───────────────────────────────────────────────────────

- name: "[External SSD] Create cache directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ external_storage_root }}/cache/npm"
    - "{{ external_storage_root }}/cache/pip"
    - "{{ external_storage_root }}/cache/composer"
    - "{{ external_storage_root }}/cache/homebrew"
  when: external_storage_caches | default(true) | bool

# ── Docker Desktop ───────────────────────────────────────────────────────────

- name: "[External SSD] Create Docker data directory"
  ansible.builtin.file:
    path: "{{ external_storage_root }}/docker"
    state: directory
    mode: '0755'
  when: external_storage_docker | default(true) | bool

- name: "[External SSD] Docker Desktop - display manual configuration steps"
  ansible.builtin.debug:
    msg: >
      ╔═══════════════════════════════════════════════════════════════════╗
      ║  DOCKER DESKTOP - MANUAL STEP                                  ║
      ║                                                                 ║
      ║  Docker Desktop -> Settings -> Resources -> Advanced:          ║
      ║  Disk image location: {{ external_storage_root }}/docker       ║
      ║                                                                 ║
      ║  Then restart Docker Desktop.                                  ║
      ╚═══════════════════════════════════════════════════════════════════╝
  when: external_storage_docker | default(true) | bool

# ── Docker.app move to SSD ───────────────────────────────────────────────
# Homebrew installs Docker.app into /Applications. We move it to the SSD and
# create a symlink back so macOS and Launchpad still see Docker.app.

- name: "[External SSD] Check if Docker.app is real app in /Applications"
  ansible.builtin.stat:
    path: /Applications/Docker.app
  register: _docker_app_local
  when: external_storage_docker_app | default(true) | bool

- name: "[External SSD] Check if Docker.app already on SSD"
  ansible.builtin.stat:
    path: "{{ external_storage_root }}/Docker.app"
  register: _docker_app_ssd
  when: external_storage_docker_app | default(true) | bool

- name: "[External SSD] Move Docker.app to SSD"
  ansible.builtin.command:
    cmd: mv /Applications/Docker.app "{{ external_storage_root }}/Docker.app"
  when:
    - external_storage_docker_app | default(true) | bool
    - _docker_app_local.stat.exists | default(false)
    - not (_docker_app_local.stat.islnk | default(false))
    - not (_docker_app_ssd.stat.exists | default(false))

- name: "[External SSD] Symlink /Applications/Docker.app -> SSD"
  ansible.builtin.file:
    src: "{{ external_storage_root }}/Docker.app"
    dest: /Applications/Docker.app
    state: link
    force: true
  when:
    - external_storage_docker_app | default(true) | bool
    - not (_docker_app_local.stat.islnk | default(false)) or
      (_docker_app_local.stat.lnk_target | default('')) != external_storage_root + '/Docker.app'

# ── Shell env vars (.zshrc) ─────────────────────────────────────────────────

- name: "[External SSD] Add storage environment exports to ~/.zshrc"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    marker: "# {mark} EXTERNAL STORAGE (ansible managed)"
    block: |
      # ── External SSD: {{ external_storage_root }} ──
      # OLLAMA_MODELS is managed by OpenClaw role (marker: OPENCLAW – ANSIBLE MANAGED)
      {% if external_storage_caches | default(true) | bool %}
      export HOMEBREW_CACHE="{{ external_storage_root }}/cache/homebrew"
      export npm_config_cache="{{ external_storage_root }}/cache/npm"
      export PIP_CACHE_DIR="{{ external_storage_root }}/cache/pip"
      export COMPOSER_CACHE_DIR="{{ external_storage_root }}/cache/composer"
      {% endif %}
    create: true

# OLLAMA_MODELS launchd env is now managed by pazny.openclaw role

# ── Summary ──────────────────────────────────────────────────────────────

- name: "[External SSD] Summary of storage layout"
  ansible.builtin.debug:
    msg: |
      ┌─────────────────────────────────────────────────────────────────┐
      │  EXTERNAL SSD: {{ external_storage_root }}
      ├─────────────────────────────────────────────────────────────────┤
      │  IIAB data:                                                     │
      │    kiwix       → {{ external_storage_root }}/kiwix
      │    maps        → {{ external_storage_root }}/maps
      │    calibre     → {{ external_storage_root }}/calibre
      │    n8n         → {{ external_storage_root }}/n8n
      │    gitea       → {{ external_storage_root }}/gitea
      │    gitlab      → {{ external_storage_root }}/gitlab
      │    openwebui   → {{ external_storage_root }}/openwebui
      │    woodpecker  → {{ external_storage_root }}/woodpecker
      │    portainer   → {{ external_storage_root }}/portainer
      │    jellyfin    → {{ external_storage_root }}/jellyfin/{config,cache}
      │    media       → {{ external_storage_root }}/media/{movies,shows,music}
      │    uptime-kuma → {{ external_storage_root }}/uptime-kuma
      │    nextcloud   → {{ external_storage_root }}/nextcloud-data
      │    wordpress   → {{ external_storage_root }}/wordpress
      │  Observability:                                                 │
      │    prometheus  → {{ external_storage_root }}/observability/prometheus
      │    loki        → {{ external_storage_root }}/observability/loki
      │    tempo       → {{ external_storage_root }}/observability/tempo
      {% if external_storage_ollama | default(true) | bool %}
      │  LLM Models:   → {{ ollama_models_dir | default(external_storage_root + '/llmModels') }}
      {% endif %}
      {% if external_storage_caches | default(true) | bool %}
      │  Caches:       → {{ external_storage_root }}/cache/{npm,pip,composer,homebrew}
      {% endif %}
      {% if external_storage_docker | default(true) | bool %}
      │  Docker data:  → {{ external_storage_root }}/docker (MANUAL!)
      {% endif %}
      {% if external_storage_docker_app | default(true) | bool %}
      │  Docker.app:   → {{ external_storage_root }}/Docker.app (auto)
      {% endif %}
      │  INTERNAL SSD: macOS, Homebrew, MariaDB, Redis, source code    │
      └─────────────────────────────────────────────────────────────────┘
