---
# ==============================================================================
# Authentik Service-Side OIDC Post-Setup
# Configures services that do not support OIDC via env vars
# Runs after stack-up (providers/applications already exist in Authentik - reconcile
# via blueprints in tasks/stacks/authentik_blueprints.yml)
#
# TRANSITIONAL RESIDUAL: the plugin loader now has a `replay_api_calls`
# runner with docker_exec/docker_inspect support, and Gitea + Nextcloud
# already carry per-plugin post_compose hooks. Keep this file until those
# hooks are parity-proven across a second idempotent live run, then delete
# the include from stack-up.yml and let the plugins own this tendon fully.
#   • Gitea OAuth2 (lines 19-87)       → gitea-base/lifecycle.post_compose
#   • Portainer OAuth verify (93-109)  → portainer role post/API block
#   • Nextcloud OIDC (113-192)         → nextcloud-base/lifecycle.post_compose
# ==============================================================================

# ── Gitea: register Authentik OAuth2 source via the CLI ─────────────────────
# Gitea exposes NO REST endpoint for auth sources at ANY version — the old
# POST /api/v1/admin/identity-providers 404'd, and failed_when:false + no_log
# hid it, so the source NEVER registered (the "Gitea SSO lockout, oauth2
# source row vanishes" saga — root-caused 2026-06-13 by the SSO audit).
# Canonical path: `gitea admin auth add-oauth` (create) / `update-oauth --id`
# (rotate), idempotency keyed off `gitea admin auth list`. Gitea is in the
# devops compose stack (like nextcloud is in iiab). The secret-bearing
# create/rotate stay no_log + failed_when:false; the secret-free Verify below
# is the LOUD gate (mirrors the Nextcloud user_oidc fix).

- name: "[Authentik->Gitea] Check Gitea container is running"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p devops exec -T -u git gitea gitea --version
  register: _gitea_running
  when: install_gitea | default(false)
  changed_when: false
  failed_when: false

- name: "[Authentik->Gitea] Resolve existing authentik source ID"
  ansible.builtin.shell:
    cmd: >
      set -o pipefail;
      {{ docker_bin }} compose -p devops exec -T -u git gitea
      gitea admin auth list | awk '$2=="authentik"{print $1; exit}'
    executable: /bin/bash
  register: _gitea_ak_id
  when:
    - install_gitea | default(false)
    - _gitea_running.rc | default(1) == 0
  changed_when: false
  failed_when: false

- name: "[Authentik->Gitea] Create Authentik OAuth2 source (first-run)"
  ansible.builtin.command:
    argv:
      - "{{ docker_bin }}"
      - compose
      - "-p"
      - devops
      - exec
      - "-T"
      - "-u"
      - git
      - gitea
      - gitea
      - admin
      - auth
      - add-oauth
      - "--name"
      - authentik
      - "--provider"
      - openidConnect
      - "--key"
      - nos-gitea
      - "--secret"
      - "{{ global_password_prefix }}_pw_oidc_gitea"
      - "--auto-discover-url"
      - "https://{{ authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/application/o/gitea/.well-known/openid-configuration"
      - "--scopes"
      - openid
      - "--scopes"
      - profile
      - "--scopes"
      - email
      - "--group-claim-name"
      - groups
      - "--admin-group"
      - "{{ (authentik_rbac_tiers | selectattr('tier', 'equalto', 1) | map(attribute='groups') | first | default(['nos-admins'])) | last }}"
  register: _gitea_oauth_create
  when:
    - install_gitea | default(false)
    - _gitea_running.rc | default(1) == 0
    - (_gitea_ak_id.stdout | default('') | trim) == ''
  changed_when: _gitea_oauth_create.rc == 0
  failed_when: false
  no_log: true
  notify: Restart gitea

- name: "[Authentik->Gitea] Rotate Authentik source secret (reconverge)"
  ansible.builtin.command:
    argv:
      - "{{ docker_bin }}"
      - compose
      - "-p"
      - devops
      - exec
      - "-T"
      - "-u"
      - git
      - gitea
      - gitea
      - admin
      - auth
      - update-oauth
      - "--id"
      - "{{ _gitea_ak_id.stdout | trim }}"
      - "--secret"
      - "{{ global_password_prefix }}_pw_oidc_gitea"
      - "--auto-discover-url"
      - "https://{{ authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/application/o/gitea/.well-known/openid-configuration"
  register: _gitea_oauth_update
  when:
    - install_gitea | default(false)
    - _gitea_running.rc | default(1) == 0
    - (_gitea_ak_id.stdout | default('') | trim) != ''
  changed_when: _gitea_oauth_update.rc == 0
  failed_when: false
  no_log: true

- name: "[Authentik->Gitea] Verify the Authentik OAuth2 source is registered"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p devops exec -T -u git gitea gitea admin auth list
  register: _gitea_oauth_verify
  when:
    - install_gitea | default(false)
    - _gitea_running.rc | default(1) == 0
  changed_when: false
  failed_when: "'authentik' not in (_gitea_oauth_verify.stdout | default(''))"

# ── Portainer: OAuth2 is configured in pazny.portainer/tasks/post.yml ───────
# PUT /api/settings with OAuth2 params runs in core-up.yml immediately after infra start.
# Here we LOUDLY verify that AuthenticationMethod == 3 (OAuth2) is active — a JWT
# GET of /api/settings, not a /api/system/status liveness probe. The old soft path
# (status-only + debug-only) hid an OAuth2 config failure behind a green run, exactly
# like the Nextcloud user_oidc silent-failure saga (root-caused 2026-06-13): the
# local login form still worked, so a dead SSO went unnoticed. Mirrors the loud
# verify in roles/pazny.portainer/tasks/post.yml.

# ROBUST VERIFY via the UNAUTHENTICATED /api/settings/public endpoint.
# The old verify obtained an admin JWT (POST /api/auth with the admin password)
# to read /api/settings — but once OAuth2 is configured the internal admin login
# can 422 (password drift, or Portainer rejecting internal auth), so a JWT was
# unobtainable and the verify FAILED the converge even though SSO was ACTIVE
# (live 2026-06-15: /api/auth=422 yet /api/settings/public AuthenticationMethod=3).
# That coupled SSO verification to the admin-password state — the wrong invariant.
# /api/settings/public returns AuthenticationMethod WITHOUT auth, so the check is
# now password-independent: it fails ONLY when SSO is genuinely not active (≠3),
# never on a password the verify can't use.
- name: "[Authentik->Portainer] Read public settings (unauth — AuthenticationMethod)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_port | default(9002) }}/api/settings/public"
    method: GET
    status_code: [200]
    timeout: 10
  register: _portainer_public
  when: install_portainer | default(false)
  failed_when: false

- name: "[Authentik->Portainer] Fail if SSO is NOT active (AuthenticationMethod != 3)"
  ansible.builtin.fail:
    msg: >-
      Portainer SSO verify FAILED — /api/settings/public reports
      AuthenticationMethod={{ _portainer_public.json.AuthenticationMethod | default('unreadable') }}
      (expected 3 = OAuth2). SSO is genuinely NOT active: the OAuth config
      (roles/pazny.portainer post.yml PUT /api/settings) did not take, or
      Portainer is not answering on :{{ portainer_port | default(9002) }}.
      This reads the UNAUTHENTICATED public endpoint, so it is independent of the
      admin password — a password drift no longer false-fails it.
  when:
    - install_portainer | default(false)
    - (_portainer_public.json.AuthenticationMethod | default(0) | int) != 3

- name: "[Authentik->Portainer] OAuth2 status"
  ansible.builtin.debug:
    msg: >-
      Portainer SSO: OK — AuthenticationMethod=3 (OAuth2) active
      (verified via unauthenticated /api/settings/public; password-independent)
  when:
    - install_portainer | default(false)
    - (_portainer_public.json.AuthenticationMethod | default(0) | int) == 3

# ── Nextcloud: occ commands for user_oidc app ───────────────────────────────

- name: "[Authentik->Nextcloud] Check if Nextcloud container is running"
  ansible.builtin.command: >
    {{ docker_bin }} inspect iiab-nextcloud-1 --format '{{ '{{' }}.State.Running{{ '}}' }}'
  register: _nc_running
  changed_when: false
  failed_when: false
  when: install_nextcloud | default(false)

- name: "[Authentik->Nextcloud] Install user_oidc app"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p iiab exec -T -u www-data nextcloud
    php occ app:install user_oidc
  register: _nc_user_oidc_install
  when:
    - install_nextcloud | default(false)
    - _nc_running.stdout | default('') | trim == 'true'
  failed_when: false
  changed_when: "'already installed' not in (_nc_user_oidc_install.stdout | default(''))"

- name: "[Authentik->Nextcloud] Enable user_oidc app"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p iiab exec -T -u www-data nextcloud
    php occ app:enable user_oidc
  register: _nc_user_oidc_enable
  when:
    - install_nextcloud | default(false)
    - _nc_running.stdout | default('') | trim == 'true'
  failed_when: false
  changed_when: "'already enabled' not in (_nc_user_oidc_enable.stdout | default(''))"

- name: "[Authentik->Nextcloud] Check if OIDC provider registered"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p iiab exec -T -u www-data nextcloud
    php occ user_oidc:provider
  register: _nc_oidc_check
  when:
    - install_nextcloud | default(false)
    - _nc_running.stdout | default('') | trim == 'true'
  failed_when: false
  changed_when: false

# Two-step: CREATE if it does not exist, UPDATE if it does. `occ user_oidc:provider`
# without update-if-exists flag FAILS on duplicate, so we need two
# separate tasks. The update flag differs across versions - failed_when: false
# covers versions without the subcommand.
- name: "[Authentik->Nextcloud] Register OIDC provider (first-run)"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p iiab exec -T -u www-data nextcloud
    php occ user_oidc:provider authentik
    --clientid="nos-nextcloud"
    --clientsecret="{{ global_password_prefix }}_pw_oidc_nextcloud"
    --discoveryuri="https://{{ authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/application/o/nextcloud/.well-known/openid-configuration"
    --mapping-uid="preferred_username"
    --mapping-email="email"
    --mapping-display-name="name"
  register: _nc_oidc_create
  when:
    - install_nextcloud | default(false)
    - _nc_running.stdout | default('') | trim == 'true'
    - "'authentik' not in (_nc_oidc_check.stdout | default(''))"
  changed_when: _nc_oidc_create.rc | default(1) == 0
  failed_when: false
  no_log: true
  notify: Restart nextcloud

# Reconverge client_secret on every run: user_oidc:provider supports the
# --update flag in recent versions. If the flag is not supported, the command
# fails harmlessly (failed_when: false) and the user sees a drift warning.
- name: "[Authentik->Nextcloud] Update OIDC provider client_secret (reconverge)"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p iiab exec -T -u www-data nextcloud
    php occ user_oidc:provider authentik
    --clientsecret="{{ global_password_prefix }}_pw_oidc_nextcloud"
  register: _nc_oidc_update
  when:
    - install_nextcloud | default(false)
    - _nc_running.stdout | default('') | trim == 'true'
    - "'authentik' in (_nc_oidc_check.stdout | default(''))"
  changed_when: _nc_oidc_update.rc | default(1) == 0
  failed_when: false
  no_log: true
  notify: Restart nextcloud

# Loud verify — the register/reconverge steps run no_log + failed_when:false
# (they carry the client secret), so a CLI-arg drift used to fail SILENTLY and
# the playbook reported success with SSO dead. The `--mapping-displayname` ->
# `--mapping-display-name` rename in user_oidc 8.x hid behind exactly that for
# weeks. Re-list providers (no secret in output) and fail LOUD if Authentik
# still isn't registered. SSO is mandatory (memory sso-mandatory-never-local-form).
- name: "[Authentik->Nextcloud] Verify OIDC provider is registered"
  ansible.builtin.command: >
    {{ docker_bin }} compose -p iiab exec -T -u www-data nextcloud
    php occ user_oidc:provider
  register: _nc_oidc_verify
  when:
    - install_nextcloud | default(false)
    - _nc_running.stdout | default('') | trim == 'true'
  changed_when: false
  failed_when: "'authentik' not in (_nc_oidc_verify.stdout | default(''))"
