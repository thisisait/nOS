---
# ==============================================================================
# tasks/stacks/prune-disabled.yml — the DISABLED half of hidden_fees/01
#
# `prune-retired.yml` closed the case where a service leaves nOS. This closes
# the case where a service stays in nOS and the operator switches it OFF, which
# its sibling names and explicitly does not handle:
#
#     "A service that is merely DISABLED (install_* false) is NOT retired and is
#      not handled here."
#
# MEASURED 2026-08-10 — and MISMEASURED the same day, which is its own lesson.
# The first count said SIXTEEN services carried `install_<svc>: false` with a
# container up; it was read from default.config.yml ALONE, and all sixteen are
# `install_*: true` in the operator's config.yml (the documented override
# layer). They run because they are enabled. The genuine instance on this host
# is the ONE service actually switched off there: install_mailpit: false, with
# mailpit.yml + mailpit-base.yml still on disk and iiab-mailpit-1 up. The
# mechanism is real — the render path is create-only, so the fragment written
# on the converge that had the service ON is never removed and the orchestrator
# keeps merging it — but it had one victim here, not sixteen. This file always
# resolved the flags correctly (lookup('vars') below sees config.yml); the
# narrative around it did not. See tools/discovery-scan.py
# resolved_install_flags() for the corrected probe.
#
# IT IS A SECURITY CONTROL, NOT HOUSEKEEPING. Nine rows in the remediation queue
# argue mitigation from exactly this flag — "MITIGATED: install_gitlab=false" —
# and three of those are HIGH. Those claims read the COMMITTED DEFAULT, and the
# resolved flag is true on this host, so the services are simply running; but a
# row whose RESOLVED flag really is false while the container is up (mailpit)
# is an open exposure that has been talked out of being counted. Either way a
# flag is not evidence — only the reconciled estate is.
#
# ── Two false positives this MUST NOT produce, both derived rather than listed ─
#
#  1. AUTO-ENABLED DEPENDENCIES. `main.yml` flips install_postgresql,
#     install_mariadb and redis_docker to true at run time from other flags, so
#     `false` in default.config.yml is their correct DEFAULT. Pruning
#     postgresql's fragment would tear down the database every estate depends
#     on. The list is read from main.yml's own `Auto-enable …` tasks, so a
#     fourth dependency needs no edit here.
#  2. TIER-2 MANIFEST APPS. `apps/<name>.yml` owns their bring-up, not a toggle,
#     so the toggle is not the thing that would have switched them off.
#
# ── Naming is NOT uniform, and a naive mapping misses half of them ───────────
#
# Fragments are named by whatever the role chose: `code-server.yml` with hyphens
# sits beside `qgis_server.yml` and `smtp_stalwart.yml` with underscores. So the
# match is SEPARATOR-INSENSITIVE, the same rule tools/discovery-scan.py already
# needed for container names — a hyphen-only mapping silently misses the
# underscore-named fragments (qgis_server, smtp_stalwart).
#
# ── Why removing the fragment is USUALLY enough, and when it is not ─────────
#
# Every orchestrator runs `up -d --remove-orphans`, so once the fragment is gone
# the service drops out of the project config and compose removes the container
# on the next up. Data volumes are NOT touched — this is the same reversible
# teardown `prune-retired.yml` relies on. Re-enabling the flag and converging
# brings the service back with its data.
#
# EXCEPT WHEN THE FRAGMENT WAS THE STACK'S LAST ONE. Measured 2026-08-22, both
# halves in the same converge:
#
#   data/        superset pruned, metabase remains -> stack comes up
#                -> --remove-orphans fires -> data-superset-1 GONE.
#   engineering/ qgis_server pruned, nothing remains -> the base compose is
#                `services: {}` -> `docker compose up` answers "no service
#                selected" and does nothing at all, --remove-orphans included
#                -> engineering-qgis-server-1 still Up 13 days.
#
# So the sentence above was true for four years of stacks that hold more than
# one service and false the first time a stack held exactly one. The container
# that survives is the one whose whole stack was switched off — the LARGEST
# blast radius of the cases this file exists to close, reached by the narrowest
# path.
#
# This file does not stop containers: that is a destructive act and the estate's
# rule is dry-run first, operator second (memory: feedback-destructive-op-safety).
# What it must not do is stay quiet. The task at the end of this file reports a
# survivor by name and prints the exact command, because a reconcile that
# silently leaves the thing it was reconciling is worse than one that never ran.
#
# ── DEFAULT IS REPORT-ONLY, and that is a decision, not timidity ─────────────
#
# Removing fragments is a container teardown, and the estate's destructive-op
# doctrine is dry-run first, act on an explicit token. So the REPORT runs every
# converge and cannot be missed; the REMOVAL waits for
# `prune_disabled_overrides: true`, which is one deliberate flip with the whole
# list in front of the operator.
#
# This is a dated obligation, not a permanent shim: once an estate has flipped
# it, the flag should become the default and this note should be deleted.
# ==============================================================================

- name: "[Stacks] Read the auto-enabled dependency flags from main.yml"
  # DERIVED, never restated. A hard-coded list here would be the fourth place
  # the same fact lives, and the one nobody updates.
  ansible.builtin.set_fact:
    _auto_enabled: >-
      {{ lookup('file', playbook_dir ~ '/main.yml')
         | regex_findall('^\s*install_([a-z0-9_]+):\s*true\s*$', multiline=True) }}
  tags: ['stacks', 'core', 'always']

- name: "[Stacks] Names of the Tier-2 manifest apps"
  # apps/<name>.yml owns their bring-up, so an `install_<name>` toggle is not
  # what would have switched one off. Derived from the directory, not listed.
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/apps"
    patterns: "*.yml"
    excludes: "_template.yml"
  register: _manifest_apps
  delegate_to: localhost
  become: false
  tags: ['stacks', 'core', 'always']

- name: "[Stacks] Every install_* toggle nOS declares"
  # Read from the COMMITTED defaults, then resolved one at a time below. Reading
  # `vars` wholesale is the eager-resolve trap CLAUDE.md keeps a gate for; a
  # per-name `lookup('vars', …)` touches only the flags this task is about.
  ansible.builtin.set_fact:
    _flag_candidates: >-
      {{ lookup('file', playbook_dir ~ '/default.config.yml')
         | regex_findall('^install_([a-z0-9_]+):', multiline=True)
         | difference(_auto_enabled)
         | difference(_manifest_apps.files | default([]) | map(attribute='path')
                      | map('basename') | map('regex_replace', '\.yml$', '') | list) }}
  tags: ['stacks', 'core', 'always']

- name: "[Stacks] Reset the accumulator (this file is imported TWICE)"
  # core-up.yml and stack-up.yml both import this. Without the reset the list
  # doubles its NAMES on the second import. Since 2026-09-01 that would be a
  # real bug rather than cosmetic: `nos_prune_plan` iterates the names to
  # attribute each one, so a duplicated name is attributed — and reported —
  # twice.
  ansible.builtin.set_fact:
    _disabled_services: []
  tags: ['stacks', 'core', 'always']

- name: "[Stacks] Which of them are switched OFF right now"
  # The RESOLVED value, so an operator's config.yml override counts — the
  # committed default is only how the name was discovered.
  ansible.builtin.set_fact:
    _disabled_services: "{{ _disabled_services + [item] }}"
  loop: "{{ _flag_candidates }}"
  loop_control:
    label: "{{ item }}"
  when: not (lookup('vars', 'install_' ~ item, default=false) | bool)
  tags: ['stacks', 'core', 'always']

- name: "[Stacks] Collect every rendered compose override"
  ansible.builtin.find:
    paths: "{{ stacks_dir }}"
    patterns: "*.yml"
    recurse: true
  register: _all_overrides
  tags: ['stacks', 'core', 'always']

- name: "[Stacks] Read the install flags as the ON-DISK config layers declare them"
  # The RUNTIME value says a service is off; this says whether the operator's
  # own committed+local config says so. The difference is the whole guard: a
  # disablement that exists only for the duration of one command (extra-vars,
  # `-e @some/other/config.yml`) outranks config.yml and is NOT a declaration.
  ansible.builtin.set_fact:
    _on_disk_flags: >-
      {%- set _f = lookup('fileglob', playbook_dir ~ '/config.yml', wantlist=True) -%}
      {%- set _base = lookup('file', playbook_dir ~ '/default.config.yml') | from_yaml -%}
      {%- set _over = (lookup('file', _f[0]) | from_yaml) if _f else {} -%}
      {{ (_base | combine(_over | default({}, true))) | dict2items
         | selectattr('key', 'match', '^install_') | items2dict }}
  tags: ['stacks', 'core', 'always']

- name: "[Stacks] Read the compose services each override declares"
  # Read BEFORE anything is deleted — this map is what makes container
  # selection exact instead of a substring guess. A pinned `container_name:`
  # is carried alongside the service key: the two are equal only by
  # coincidence (pazny.smtp_stalwart), and where they differ the container
  # would survive a prune of its own fragment, silently.
  ansible.builtin.set_fact:
    _override_services: >-
      {%- set ns = namespace(m={}) -%}
      {%- for p in _all_overrides.files | default([]) | map(attribute='path')
                   | select('search', '/overrides/') -%}
      {%- set _svc = ((lookup('file', p) | from_yaml) | default({}, true)).services | default({}, true) -%}
      {%- set _ = ns.m.update({p: (_svc | list) + (_svc.values() | select('mapping')
                                                   | selectattr('container_name', 'defined')
                                                   | map(attribute='container_name') | list)}) -%}
      {%- endfor -%}
      {{ ns.m }}
  tags: ['stacks', 'core', 'always']

- name: "[Stacks] Which containers are running right now"
  # READ-ONLY, and unconditional: the plan needs it to name what a prune would
  # destroy, whether or not the prune is authorised to proceed.
  ansible.builtin.command:
    argv: ["{{ docker_bin | default('docker') }}", "ps", "--format", "{{ '{{' }}.Names{{ '}}' }}"]
  register: _running_containers
  changed_when: false
  failed_when: false
  tags: ['stacks', 'core', 'always']

- name: "[Stacks] Attribute the prune — what is authored, and what must be refused"
  ansible.builtin.set_fact:
    _prune_plan: >-
      {{ (_disabled_services | default([]))
         | nos_prune_plan(_on_disk_flags | default({}),
                          _override_services | default({}),
                          _running_containers.stdout_lines | default([])) }}
  tags: ['stacks', 'core', 'always']

# ── The refusal ─────────────────────────────────────────────────────────────
#
# Scoped to the case where the prune would ACT. With
# `prune_disabled_overrides: false` nothing is destroyed, so refusing would
# block runs that are already harmless — CI converges with a test config being
# the obvious one. What is refused is the combination that destroys.
- name: "[Stacks] REFUSE a prune whose disablements are not authored on disk"
  ansible.builtin.fail:
    msg: >-
      Refusing to prune. {{ _prune_plan.unauthored_destructive | length }} service(s)
      resolve install_*: false for this run but are ENABLED in the on-disk config
      (default.config.yml + config.yml), and each owns a compose fragment —
      {{ _prune_plan.unauthored_destructive | join(', ') }}.
      A disablement that outranks config.yml (extra-vars, `-e @<file>`) is a
      flag for one command, not a declaration, and pruning acts on it
      PERMANENTLY: it deletes compose fragments and removes running containers.
      On 2026-09-01 that combination destroyed 33 containers on this estate.
      Either declare it in config.yml (then this passes), or run with
      `-e prune_disabled_overrides=false` to converge without pruning.
  when:
    - prune_disabled_overrides | default(false) | bool
    - (_prune_plan.unauthored_destructive | default([]) | length) > 0
  tags: ['stacks', 'core', 'always']

- name: "[Stacks] Note un-authored disablements that would destroy nothing"
  # Reported rather than refused: they own no compose fragment, so obeying
  # them removes nothing. `profiles/gov-local.yml` is the documented case —
  # `install_tailscale: false` over a config.yml that says true.
  ansible.builtin.debug:
    msg: >-
      Disabled for this run only (not declared in config.yml) and owning no
      compose fragment, so skipped rather than refused:
      {{ _prune_plan.unauthored | difference(_prune_plan.unauthored_destructive) | join(', ') }}.
  when: (_prune_plan.unauthored | default([]) | difference(_prune_plan.unauthored_destructive | default([])) | length) > 0
  tags: ['stacks', 'core', 'always']

- name: "[Stacks] Note the flags that cannot be attributed without rendering"
  # e.g. `install_acme: "{{ not tenant_domain_is_local }}"`. Neither authored
  # nor un-authored: excluded from the prune AND from the refusal, so it
  # destroys nothing and blocks nothing.
  ansible.builtin.debug:
    msg: >-
      Not attributable from the config text, so excluded from the prune:
      {{ _prune_plan.indeterminate | join(', ') }}.
  when: (_prune_plan.indeterminate | default([]) | length) > 0
  tags: ['stacks', 'core', 'always']

- name: "[Stacks] REPORT — services switched off whose compose fragment is still merged"
  # Runs whether or not the removal is enabled. The whole complaint in
  # hidden_fees/01 is that this case "does not fail loudly"; a report that only
  # appears once someone opts in would leave that true.
  ansible.builtin.debug:
    msg: >-
      {{ _prune_plan.fragments | length }} compose override(s) belong to services
      declared install_*: false and are still being merged into `docker compose
      up` —
      {{ _prune_plan.fragments | map('basename') | join(', ') }}.
      {{ ('This will ALSO remove ' ~ (_prune_plan.containers | length) ~ ' running
           container(s): ' ~ (_prune_plan.containers | join(', ')) ~ '.')
         if (_prune_plan.containers | length) > 0 else '' }}
      {{ 'Removing them now (prune_disabled_overrides is true).'
         if (prune_disabled_overrides | default(false) | bool)
         else 'NOT removed: set prune_disabled_overrides=true to reconcile. Until
               then these services keep running and any security finding that
               claims mitigation from install_*=false is unsound (hidden_fees/01).' }}
  when: (_prune_plan.fragments | default([]) | length) > 0
  tags: ['stacks', 'core', 'always']

- name: "[Stacks] Remove compose overrides of disabled services"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ _prune_plan.fragments | default([]) }}"
  loop_control:
    label: "{{ item | basename }}"
  when: prune_disabled_overrides | default(false) | bool
  tags: ['stacks', 'core', 'always']

# ── Finish the job ─────────────────────────────────────────────────────────
#
# A REPORT WAS THE WRONG ANSWER, corrected 2026-08-23 on operator instruction:
# "either the playbook does it during the loop, or I run nos — nothing in
# between." Asking a human for an ad-hoc `docker compose down` is exactly the
# hand-poking the estate's own doctrine refuses (memory:
# machinery-purpose-and-no-hacks, agents-drive-operator-supervises). The
# playbook is where a destructive act belongs; what needs gating is the
# APPROVAL, and `prune_disabled_overrides` already is that gate — it is what
# authorised deleting the fragment two tasks ago.
#
# `docker rm -f` on NAMED containers rather than `compose down` on the stack:
# surgical, and it cannot take down a stack that still has live services. Data
# volumes are untouched — same reversible teardown as the fragment removal;
# re-enabling the flag and converging brings the service back with its data.
#
# THE NAMES COME FROM THE FRAGMENTS, NOT FROM `docker ps`. Until 2026-09-01
# this selected containers by unanchored substring of the disabled-service
# alternation, which is how `install_observability: false` — a STACK flag that
# matched no fragment and removed nothing — destroyed all nine
# `observability-*` containers. `nos_prune_plan` reads the `services:` keys of
# the fragments actually removed and matches `<stack>-<service>-<n>` exactly,
# so a token that prunes nothing can no longer destroy anything.
- name: "[Stacks] Stop the containers whose fragments were just removed"
  ansible.builtin.command:
    argv: ["{{ docker_bin | default('docker') }}", "rm", "-f", "{{ item }}"]
  loop: "{{ _prune_plan.containers | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: _survivor_removal
  changed_when: _survivor_removal.rc == 0
  when: prune_disabled_overrides | default(false) | bool
  tags: ['stacks', 'core', 'always']
