# =============================================================================
# health-tick.yml — one poll tick of the in-stream bring-up heartbeat.
#
# Included once from wait-stacks-healthy.yml, then re-includes itself while
# not `_wait_done` (ceiling `_wait_ticks_max`). A budget-sized *looped*
# include_tasks cannot short-circuit (fee 07 A; p=54800 147s leftover). A
# non-looped `when:` on the recursive include can.
#
# Each not-yet-ready tick prints a per-stack readiness line into ansible.log
# (the point of this file vs blocking `docker compose up --wait`).
#
# Facts: `_tick`, `_wait_ticks_max`, `_wait_stacks`, `_wait_done`.
# =============================================================================

- name: "[Stacks] Probe stack health (tick {{ _tick }})"
  tags: ['stacks', 'core', 'always']
  ansible.builtin.command:
    argv: "{{ ['python3', playbook_dir ~ '/files/anatomy/scripts/stack-health-probe.py'] + _wait_stacks }}"
  environment:
    NOS_DOCKER_BIN: "{{ docker_bin | default('docker') }}"
    # Absence needs a denominator (docs/hidden_fees/08-empty-stack-reads-as-success.md):
    # a 0-container stack is only PASS if its rendered inputs also declare 0
    # services. Without this the probe cannot read {{ stacks_dir }} and falls
    # back to UNKNOWN for every empty stack rather than guessing PASS.
    NOS_STACKS_DIR: "{{ stacks_dir }}"
  register: _tick_probe
  changed_when: false
  check_mode: false
  when: not (_wait_done | bool)

- name: "[Stacks] {{ _wait_stacks | join(', ') }} — health (tick {{ _tick }})"
  tags: ['stacks', 'core', 'always']
  ansible.builtin.debug:
    msg: "{{ _tick_probe.stdout_lines | reject('equalto', 'PENDING') | reject('equalto', 'ALL_READY') | reject('equalto', 'FAILED') | list }}"
  when: not (_wait_done | bool)

- name: "[Stacks] Record health-wait state (tick {{ _tick }})"
  tags: ['stacks', 'core', 'always']
  ansible.builtin.set_fact:
    _wait_done: "{{ 'ALL_READY' in (_tick_probe.stdout | default('')) }}"
    _wait_last: "{{ _tick_probe.stdout_lines | default([]) }}"
  when: not (_wait_done | bool)

# PENDING keeps polling. FAILED/UNKNOWN will not become ALL_READY by waiting:
# 0 containers with N declared services, a missing compose file, or an Exited
# container. Hidden fee 08: the STRICT wait used to burn the full budget (or,
# before the probe grew a denominator, print 0/0 ready and pass). Abort here.
- name: "[Stacks] Abort health-wait on FAILED/UNKNOWN (tick {{ _tick }})"
  tags: ['stacks', 'core', 'always']
  ansible.builtin.fail:
    msg: |
      Stacks [{{ _wait_stacks | join(', ') }}] will not become ready.
      Probe marker: {{ _tick_probe.stdout_lines | default([]) | last | default('?') }}.
      FAILED = a container is down, or bring-up produced no containers the
      rendered compose declared. UNKNOWN = the compose artifact is missing
      or unreadable (the measured Linux CI shape: up rc=1, no docker-compose.yml).
      Waiting out the remaining budget only delays the same verdict.
        {{ _wait_last | reject('equalto', 'PENDING') | reject('equalto', 'ALL_READY') | list | join('\n        ') }}
  when:
    - not (_wait_done | bool)
    - (_tick_probe.stdout_lines | default([]) | last | default('')) in ['FAILED', 'UNKNOWN']

- name: "[Stacks] Settle {{ stack_wait_tick_interval | default(15) }}s before next tick"
  tags: ['stacks', 'core', 'always']
  ansible.builtin.command: "sleep {{ stack_wait_tick_interval | default(15) | int }}"
  changed_when: false
  when: not (_wait_done | bool)

- name: "[Stacks] Count this health-wait tick"
  tags: ['stacks', 'core', 'always']
  ansible.builtin.set_fact:
    _tick: "{{ (_tick | int) + 1 }}"
  when: not (_wait_done | bool)

- name: "[Stacks] Next health-wait tick"
  tags: ['stacks', 'core', 'always']
  ansible.builtin.include_tasks: health-tick.yml
  when:
    - not (_wait_done | bool)
    - (_tick | int) <= (_wait_ticks_max | int)
