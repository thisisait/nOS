# =============================================================================
# wait-stacks-healthy.yml — in-stream health-wait (replaces blocking `--wait`).
#
# Why this exists: `docker compose up --wait` blocks for up to 540/900s and
# Ansible buffers the shell task's stdout until it returns — so the log
# "freezes" for tens of minutes during bring-up, with no visibility into which
# container is still starting (gitlab/outline can sit unhealthy for 30+ min).
# This task file does the health-wait as a poll loop of short Ansible tasks,
# each printing a per-stack readiness summary into the MAIN ansible.log stream.
#
# Caller contract:
#   - bring the stacks up FIRST with `docker compose up -d` (NO --wait), then
#     include this file with `_wait_stacks` set to the project name(s) to await.
#   - vars: _wait_stacks (list, required), stack_up_wait_timeout (budget s),
#     stack_wait_tick_interval (s between ticks, default 15).
#
# Fails (with the last health snapshot) if not all-ready within the budget.
# =============================================================================

- name: "[Stacks] Health-wait init ({{ _wait_stacks | join(', ') }})"
  tags: ['stacks', 'core', 'always']
  ansible.builtin.set_fact:
    _wait_done: false
    _wait_last: []

# ─────────────────────────────────────────────────────────────────────────────
# Re-bind stale config mounts BEFORE asking anything whether it is healthy.
#
# MEASURED 2026-09-01, and it is a deadlock rather than an inefficiency.
# Ansible's `template:` writes a temp file and RENAMES it into place. A
# single-FILE bind mount binds the inode, so the rename leaves the container's
# path at ENOENT — not stale content, GONE:
#
#   in-place write (`> f`)  container sees the new bytes immediately
#   atomic rename           container gets `No such file or directory`
#   docker restart          re-binds; container sees the new bytes
#
# Loki's healthcheck is `loki -verify-config` against exactly such a mount, so a
# converge that changed one line of local-config.yaml took it to `8/9 ready
# FAILED: loki-1` and the STRICT gate then waited out its whole budget. The
# reconciler that repairs this ran at the END of main.yml — AFTER this wait — so
# the fix could never be reached by the run that caused the damage. Sixteen
# minutes of a blocked converge, and on a longer budget it would have been the
# full 540s and then a hard fail.
#
# It runs here without --apply's verdict being fatal: this is the REPAIR, and
# the poll loop immediately below is what judges whether it worked. The
# authoritative pass at the end of main.yml still fails the run on config a
# container never picked up — finding stale config is not an error, failing to
# act on it is, and that judgement stays in one place.
- name: "[Stacks] Re-bind any container whose rendered config was replaced"
  tags: ['stacks', 'core', 'always']
  ansible.builtin.command: "{{ playbook_dir }}/tools/reload-stale-config.py --apply"
  register: _wait_reload
  changed_when: "'restarted ' in _wait_reload.stdout"
  failed_when: false
  # default(TRUE), like every other nos_docker_ready consumer in main.yml, and
  # the polarity is the whole point. The fact is set by a probe in
  # tasks/iiab/docker-prereqs.yml tagged ['iiab','docker','stacks'] — so under
  # `--tags observability` it is never set at all. Defaulting to false made this
  # task skip SILENTLY (ansible.cfg has display_skipped_hosts=false, so a task
  # skipped on every host prints no banner), which is how the first version of
  # this repair ran a whole converge doing nothing and looked identical to one
  # that worked. The end-of-run reconciler had the same bug, tagged `always` so
  # it could not be skipped and then skipping itself on its own `when`.
  # Assuming docker is present is safe: reload-stale-config.py answers
  # `UNKNOWN — could not read docker` and exits 0 when it is not.
  when: nos_docker_ready | default(true) | bool

- name: "[Stacks] Re-bind report ({{ _wait_stacks | join(', ') }})"
  tags: ['stacks', 'core', 'always']
  ansible.builtin.debug:
    msg: "{{ _wait_reload.stdout_lines | default(['(skipped — docker not ready)']) }}"
  when:
    - nos_docker_ready | default(true) | bool
    - _wait_reload.changed | default(false)

# NOTE: NO `when:` on this include — a `when` on a *looped* include_tasks does
# NOT short-circuit the loop (Ansible evaluates it once at loop-expansion, so a
# set_fact inside health-tick.yml never skips later items). The loop therefore
# always iterates the full budget; the early-exit lives INSIDE health-tick.yml
# (each task gated on `not _wait_done`), so post-ready ticks are silent no-ops.
- name: "[Stacks] Health-wait poll ({{ _wait_stacks | join(', ') }})"
  tags: ['stacks', 'core', 'always']
  ansible.builtin.include_tasks: health-tick.yml
  loop: "{{ range(0, ((stack_up_wait_timeout | default(540) | int) // (stack_wait_tick_interval | default(15) | int)) + 1) | list }}"
  loop_control:
    loop_var: _tick
    # A `_wait_done` conditional here is DEAD: labels for a looped
    # include_tasks are templated before any iteration runs (measured
    # 2026-08-27 — 81 labels, all "tick N/80", 6 probes). See fee 07 A.
    label: "tick {{ _tick }}/{{ ((stack_up_wait_timeout | default(540) | int) // (stack_wait_tick_interval | default(15) | int)) }} — {{ _wait_stacks | join(',') }}"

- name: "[Stacks] Health-wait result ({{ _wait_stacks | join(', ') }})"
  tags: ['stacks', 'core', 'always']
  ansible.builtin.fail:
    msg: |
      Stacks [{{ _wait_stacks | join(', ') }}] did not all reach ready within
      {{ stack_up_wait_timeout | default(540) }}s. Last health snapshot:
        {{ _wait_last | reject('equalto', 'PENDING') | reject('equalto', 'FAILED') | reject('equalto', 'ALL_READY') | list | join('\n        ') }}
      Diagnose: docker compose -p <stack> ps  /  docker compose -p <stack> logs --tail=200
  when: not (_wait_done | bool)
