---
# ==============================================================================
# Authentik -> Bluesky PDS Identity Bridge
# Auto-provisions Bluesky accounts for Authentik users
# Handle format: @username.{{ bluesky_pds_hostname }} (e.g. @admin.bsky.dev.lan)
# ==============================================================================

# ── 1. Prerequisites: PDS + Authentik token ───────────────────────────────────

- name: "[PDS Bridge] Verify PDS is healthy"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ bluesky_pds_port | default(2583) }}/xrpc/_health"
    status_code: 200
    timeout: 5
  register: _pds_bridge_health
  failed_when: false

- name: "[PDS Bridge] Get Authentik API token"
  ansible.builtin.shell: >
    set -o pipefail;
    {{ docker_bin }} compose -p infra exec -T authentik-server
    ak shell -c
    "from authentik.core.models import Token;
    t=Token.objects.filter(identifier='nos-api').first();
    print(t.key if t else '')"
    2>/dev/null | tail -1
  args:
    executable: /bin/bash
  register: _pds_bridge_token_raw
  changed_when: false
  failed_when: false
  no_log: true   # stdout is the Authentik API token
  when: _pds_bridge_health.status | default(0) == 200

- name: "[PDS Bridge] Set bridge variables"
  ansible.builtin.set_fact:
    _pds_bridge_token: "{{ _pds_bridge_token_raw.stdout | default('') | trim }}"
    _pds_bridge_base: "http://127.0.0.1:{{ authentik_port | default(9003) }}"
    _pds_hostname: "{{ bluesky_pds_hostname | default('bsky.dev.lan') }}"
  when: _pds_bridge_health.status | default(0) == 200

- name: "[PDS Bridge] Skip - prerequisites not met"
  ansible.builtin.debug:
    msg: >-
      PDS bridge skipped: PDS={{ _pds_bridge_health.status | default('unreachable') }},
      token={{ (_pds_bridge_token | default('') | length > 0) | ternary('OK', 'missing') }}
  when: >-
    (_pds_bridge_health.status | default(0) != 200) or
    (_pds_bridge_token | default('') | length < 10)

# ── 2. Fetch users from Authentik ─────────────────────────────────────────────

- name: "[PDS Bridge] Fetch Authentik users"
  ansible.builtin.uri:
    url: "{{ _pds_bridge_base }}/api/v3/core/users/?page_size=100&is_active=true"
    headers:
      Authorization: "Bearer {{ _pds_bridge_token }}"
    status_code: 200
  register: _pds_bridge_ak_users
  when:
    - _pds_bridge_health.status | default(0) == 200
    - _pds_bridge_token | default('') | length >= 10
  failed_when: false
  no_log: true

# ── 3. Fetch existing PDS accounts ──────────────────────────────────────────

- name: "[PDS Bridge] List existing PDS accounts"
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p infra exec -T bluesky-pds
    goat pds admin account list
    --pds-host http://localhost:3000
    --admin-password "{{ bluesky_pds_admin_password }}" 2>&1
  register: _pds_bridge_existing
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - _pds_bridge_health.status | default(0) == 200
    - _pds_bridge_token | default('') | length >= 10

# ── 4. Filter users to provision ────────────────────────────────────────────

- name: "[PDS Bridge] Filter eligible Authentik users"
  ansible.builtin.set_fact:
    _pds_bridge_eligible: >-
      {{ _pds_bridge_ak_users.json.results | default([])
         | rejectattr('username', 'equalto', 'akadmin')
         | selectattr('is_active', 'equalto', true)
         | list }}
  when:
    - _pds_bridge_ak_users is defined
    - _pds_bridge_ak_users.status | default(0) == 200

- name: "[PDS Bridge] Build list of users to provision"
  # Filters in order:
  #   1. reject service_account type users — Authentik auto-generates these
  #      with un-DNS-safe usernames like `ak-<App Name>-client_credentials`
  #      (spaces + uppercase + underscores) which AT Protocol's handle regex
  #      refuses. They have no business owning a PDS identity anyway.
  #      Surfaced 2026-05-04 on `ak-nOS State Manager-client_credentials`.
  #   2. drop the legacy `^ak-outpost` exact-match (covered by #1, kept as
  #      belt-and-suspenders for any pre-Track-B install where `type` field
  #      may not be present on the user record).
  #   3. drop `nos-tester-e2e-*` ephemeral A13.6 testers — they get
  #      auto-cleaned up by sweep_orphans / per-test teardown / atexit, so
  #      a stable Bluesky identity makes no sense. Bonus: their 24-char
  #      username portion exceeds Bluesky PDS's handle length limit, so
  #      trying to provision throws `InvalidHandle: Handle too long`.
  #      Surfaced 2026-05-17 on `nos-tester-e2e-a5e51b63`.
  #   4. drop usernames that wouldn't pass AT Proto handle validation —
  #      lowercase + alnum + hyphen only, must start with alnum, and
  #      length floor of 20 chars (Bluesky PDS-internal handle limit
  #      <= 20; conservative pre-flight reject is cheaper than letting
  #      goat CLI reject with stderr we'd then have to parse).
  ansible.builtin.set_fact:
    _pds_bridge_to_create: >-
      {{ _pds_bridge_eligible | default([])
         | selectattr('username', 'defined')
         | list
         | select('mapping')
         | rejectattr('type', 'equalto', 'service_account')
         | rejectattr('username', 'search', '^ak-outpost')
         | rejectattr('username', 'search', '^nos-tester-e2e-')
         | selectattr('username', 'match', '^[a-z0-9][a-z0-9-]{0,19}$')
         | list }}
  when: _pds_bridge_eligible | default([]) | length > 0

# Filter out users that already have PDS accounts.
#
# IMPORTANT: the previous form used a `>-` YAML folded-scalar block with a
# Jinja for-loop that built `new_list` via `namespace`/`set _ = new_list.append(user)`.
# That approach renders the result as a STRING ('[<dict>, <dict>]' literal),
# which breaks `loop:` consumers downstream with "loop value must resolve
# to a 'list', not 'str'". Surfaced 2026-05-02 during the first pazny.eu
# production blank when 4 new agent SSO users (nos-tester + nos-inspektor +
# nos-librarian + nos-scout) hit this bridge for the first time.
#
# Fix: build a JSON-array string with the for-loop, then round-trip through
# `from_json` so set_fact stores a real Python list. The substring match
# semantics are preserved exactly — "<username>.<hostname>" not in goat
# list-accounts stdout. `joiner(',')` handles the comma between items.
- name: "[PDS Bridge] Check which users need provisioning"
  ansible.builtin.set_fact:
    _pds_bridge_new_users: "{{ _pds_filtered_json | from_json }}"
  vars:
    _pds_filtered_json: |-
      {%- set existing = _pds_bridge_existing.stdout | default('') -%}
      [
      {%- set comma = joiner(',') -%}
      {%- for user in _pds_bridge_to_create | default([]) -%}
      {%-   if (user.username ~ '.' ~ _pds_hostname) not in existing -%}
      {{ comma() }}{{ user | to_json }}
      {%-   endif -%}
      {%- endfor -%}
      ]
  when: _pds_bridge_to_create | default([]) | length > 0

# ── 5. Provision PDS accounts ──────────────────────────────────────────────
# CLI shape change (2026-05-02 production blank revealed):
# Modern goat (v0.x as shipped in ghcr.io/bluesky-social/pds:0.4) refactored
# the admin subcommand tree:
#   - OLD: `goat pds admin invite create --uses 1` + `account create --invite-code <c>`
#   - NEW: `goat pds admin create-invites --count N --uses N`  (separate)
#          `goat pds admin account create` — auto-generates an invite code
#                                            internally; --invite-code flag
#                                            removed entirely.
#
# We adopt the new shape: just call `account create` with handle / email /
# password and let goat handle the invite ceremony itself. Drops the
# previous "mint invite per user" + "build invite map" steps (~40 lines)
# without changing the user-visible outcome — accounts still get
# provisioned, idempotently, on hosts where bluesky_pds_invite_required
# is true.
#
# bluesky_pds_invite_required is now informational (PDS-side config); the
# bridge no longer needs to consult it because the goat CLI does the
# right thing either way.

# ── P1b uid-collision guard. slugifyUid folds dash-runs and trims dashes, so
# two DISTINCT Authentik usernames (`pazny` / `pazny-` / `paz--ny`) can share
# one slug — and under scheme v2 a shared slug is a shared user_master: user
# B's derived secrets WOULD BE user A's (adversarial review). The same folding
# already governs the face VFS tree and KEAP row ownership, so a collision is
# estate-wide wrong, not just PDS-wrong. Refuse loudly before provisioning.
- name: "[PDS Bridge] Refuse slug-colliding usernames (P1b user-scope isolation)"
  ansible.builtin.assert:
    that:
      - >-
        (_pds_bridge_to_create | default([]) | map(attribute='username')
         | map('lower') | map('regex_replace', '[^a-z0-9]+', '-')
         | map('regex_replace', '^-+|-+$', '') | list | unique | length)
        == (_pds_bridge_to_create | default([]) | length)
    fail_msg: >-
      Two Authentik usernames in this bridge run collapse to the same
      slugified uid. Under the P1b user-scope derivation a shared uid is a
      shared secret subtree — one user's credentials would BE another's.
      Rename one of the accounts (the same folding also governs their face
      VFS tree and KEAP ownership). See docs/secrets-p1-hkdf.md §3.
    quiet: true
  when: _pds_bridge_to_create | default([]) | length > 1

# ── P1b (docs/secrets-p1-hkdf.md §3): the per-user PDS password is the first
# user-scope consumer of the derived tree. Scheme v1 keeps the historical
# `<prefix>_pw_bsky_<username>` byte-identical (v1_suffix below); scheme v2
# derives HKDF(user_master(slugifyUid(username)), "bsky", "password") — so a
# compromised user account yields that user and nothing else, and nothing here
# ever concatenates the master into a credential again.
- name: "[PDS Bridge] Derive per-user PDS password (P1b user scope)"
  nos_secret_map:
    mode: user_leaf
    scheme: "{{ nos_secret_scheme }}"
    master: "{{ nos_secret_master | default('') }}"
    prefix: "{{ global_password_prefix }}"
    username: "{{ item.username }}"
    service: "bsky"
    purpose: "password"
    v1_suffix: "bsky_{{ item.username }}"
  register: _pds_bridge_leaves
  loop: "{{ _pds_bridge_new_users | default([]) }}"
  loop_control:
    label: "{{ item.username }}"
  when: _pds_bridge_new_users | default([]) | length > 0
  no_log: true

- name: "[PDS Bridge] Create PDS account"
  # SEC: username is regex-hardened in step 4; email is operator/Authentik-
  # sourced and reaches the shell, so `| quote` it (and the handle/password)
  # to close the shell-injection hole. no_log keeps the admin password +
  # per-user password out of the telemetry callback (cmd + stdout).
  ansible.builtin.shell: >
    {{ docker_bin }} compose -p infra exec -T bluesky-pds
    goat pds admin account create
    --pds-host http://localhost:3000
    --admin-password {{ bluesky_pds_admin_password | quote }}
    --handle {{ (item.item.username ~ '.' ~ _pds_hostname) | quote }}
    --email {{ (item.item.email | default(item.item.username ~ '@' ~ _pds_hostname)) | quote }}
    --password {{ item.value | quote }} 2>&1
  register: _pds_bridge_created
  # Loops over the derivation results: item.item is the user row, item.value
  # the P1b-derived password (v1 byte-identical to the old concatenation).
  loop: "{{ _pds_bridge_leaves.results | default([]) }}"
  loop_control:
    label: "{{ item.item.username }}.{{ _pds_hostname }}"
  when: _pds_bridge_new_users | default([]) | length > 0
  no_log: true
  changed_when: "'did:' in (_pds_bridge_created.stdout | default(''))"
  # Real error guard: treat output as failure UNLESS either (a) a DID was
  # returned (success), (b) the handle is already taken (idempotent), or
  # (c) the handle is invalid per AT Proto / Bluesky-internal rules
  # (skip-with-log: an ephemeral or otherwise-unprovisionable identity
  # shouldn't abort the whole playbook — the step-4 filter SHOULD catch
  # these, but accepting `InvalidHandle:` as a recognized class makes the
  # bridge robust to future Bluesky tightenings of the rule).
  failed_when:
    - _pds_bridge_created is defined
    - _pds_bridge_created.rc is defined
    - _pds_bridge_created.rc != 0
    - "'did:' not in (_pds_bridge_created.stdout | default(''))"
    - "'InvalidHandle' not in (_pds_bridge_created.stdout | default(''))"
    - "'already' not in (_pds_bridge_created.stdout | default('') | lower)"

# ── 6. Summary ──────────────────────────────────────────────────────────────

- name: "[PDS Bridge] Summary"
  ansible.builtin.debug:
    msg: >-
      Authentik->PDS: {{ _pds_bridge_new_users | default([]) | length }} users to provision,
      {{ _pds_bridge_created.results | default([])
         | selectattr('stdout', 'defined')
         | selectattr('stdout', 'search', 'did:')
         | list | length }} created successfully.
      Handles: {{ _pds_bridge_new_users | default([]) | map(attribute='username') | list | join(', ') }}
  when: _pds_bridge_new_users | default([]) | length > 0
