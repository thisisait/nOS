---
# ==============================================================================
# CI TEST CONFIG - minimal configuration for GitHub Actions
# Disables all heavy Docker / network components; exercises the base dev stack.
# ==============================================================================

# -- INSTALLATION QUEUE --------------------------------------------------------
install_homebrew_packages: true
install_cask_apps: true
install_mas_apps: false
# Pinned-package install only; never pull arbitrary upstream upgrades in CI
# (non-deterministic `brew upgrade` breaks the idempotence re-run check).
homebrew_upgrade_all_packages: false

install_nginx: true
install_php: true
# No PHP apps run in CI (WordPress/Nextcloud are install:false), so skip the
# PECL extension build — it isn't exercised and pecl's installed-state is
# undetectable on the GitHub macOS runner (re-installs, breaking idempotence).
php_common_extensions: []
install_node: true
install_bun: true
install_python: true
install_golang: true
install_dotnet: true

install_openclaw: false     # Ollama 27GB model - impractical in CI
install_shell_extras: true
configure_macos_defaults: true
configure_power_management: false  # pmset requires sudo - CI runner has none

enable_ssh: false
enable_samba: false
enable_vnc: false
enable_remote_management: false

install_observability: false  # Grafana stack - not blocking, but adds ~5min
install_tailscale: false      # Requires interactive login
services_lan_access: false    # CI does not need LAN / Tailscale access
install_dnsmasq: true         # Exercises DNS resolver setup

install_mariadb: false
install_wordpress: false
install_nextcloud: false
install_kiwix: false
install_offline_maps: false
install_n8n: false
install_gitea: false
install_gitlab: false
install_woodpecker: false
install_uptime_kuma: false
install_calibreweb: false
install_portainer: false
install_traefik: false
install_jellyfin: false
install_openwebui: false
install_homeassistant: false
install_rustfs: false
# ── The three organs the wet-test needs to prove anything (2026-09-01) ────────
# These were off, each with a comment naming its dependency, and together they
# made the Linux integration job unable to serve a single SSO-gated route:
# Traefik attaches `authentik@file` to every proxy-mode router, the middleware
# was never defined, and all 7 gated services answered 500. Before the smoke
# probe got honest that read as green (docs/hidden_fees/39).
#
# Turning the check off instead (`-e nos_skip_authentik_check=true`) would keep
# the job fast and keep it proving nothing about those 7. The point of a
# wet-test is that the topology is real.
install_postgresql: true
redis_docker: true
install_erpnext: false
install_freescout: false
install_outline: false
install_freepbx: false
install_qgis_server: false
install_metabase: false
install_superset: false
install_bluesky_pds: false
install_paperclip: false         # Requires PostgreSQL Docker
install_authentik: true          # both dependencies are enabled above
install_infisical: false         # Requires PostgreSQL + Redis Docker
install_vaultwarden: false       # Docker
install_keap: false              # Docker; builds nos/keap from a git clone (thisisait/nos-keap, public) — off to skip the heavy image build, like every other Docker stack in the wet-test

configure_dotfiles: false   # Geerlingguy dotfiles - unneeded in CI
configure_sublime: false

# -- Minimal package set for fast CI -------------------------------------------
homebrew_installed_packages:
  - autoconf
  - bash-completion
  - git
  - gh
  - wget
  - curl
  - jq
  - readline
  - openssl
  - sqlite
  - gettext
  - ssh-copy-id
  - mkcert
  - nss
  - ripgrep
  - bat
  - eza
  - fd
  - zoxide
  - starship
  - fzf

homebrew_cask_apps:
  - firefox
  - licecap

# -- Languages - base config ---------------------------------------------------
php_version: "8.3"
node_nvm_version: "lts/*"
python_version: "3.13"

node_global_packages:
  - typescript

pip_packages:
  - name: virtualenv
  - name: ansible

go_packages: []

# -- Shell extras --------------------------------------------------------------
starship_preset: "gruvbox-rainbow"
shell_aliases:
  - alias: ll
    command: "eza -la --icons"
  - alias: cat
    command: "bat --style=numbers"

# -- dnsmasq -------------------------------------------------------------------
dnsmasq_dev_domain: "dev.local"
dnsmasq_dev_address: "127.0.0.1"

# -- Nginx - auto-detected from install_* flags (CI renders default.conf only)--

# -- Dummy passwords for CI ---------------------------------------------------
# NOT "unused because install_* flags are off" — that comment stood here until
# 2026-09-01 and was false. The install flags gate whether a SERVICE runs, not
# whether a credential is PERSISTED: templates/secrets.yml.j2 writes its keys
# into ~/.nos/secrets.yml unconditionally. `mariadb_root_password` lived here,
# and one converge run with `-e @tests/config.yml` froze "ci-test-password"
# into the live estate's credential store, orphaning the real root password
# that the data volume was initialised with. It is removed here;
# default.config.yml already resolves it from nos_derived_secrets.
# Gate: tests/anatomy/test_ci_config_cannot_poison_the_secret_store.py
grafana_admin_password: "ci-test-password"
wordpress_db_password: "ci-test-password"
nextcloud_admin_password: "ci-test-password"
gitea_secret_key: "ci-test-secret-key-32-characters"
openclaw_user: "runner"
openclaw_base_dir: "/Users/runner"
