---
name: CI
'on':
  pull_request:
    paths-ignore:
      - '*.md'
  push:
    paths-ignore:
      - '*.md'
    branches:
      - master
      # D2 (2026-06-11): dev pushes get the LIGHT lane only (lint + syntax +
      # pytest + contracts). The two Integration wet-tests stay PR/cron/master
      # — 22 commits landed on dev after v0.5-beta with zero CI coverage; this
      # closes that gap without a 25-min wet-test on every dev push (that
      # remains `tools/ci-local.sh` discipline + the release PR gate).
      - dev
      - 'claude/**'
  schedule:
    - cron: "0 5 * * 4"

# Default minimum permissions for every job — read-only access to the
# repository. Closes GitHub Code Scanning's actions/missing-workflow-
# permissions alerts (#1, #2, #7). Per-job overrides may add more
# capabilities (e.g., write for release jobs) once we have any.
permissions:
  contents: read

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # LINT – fast static check (yamllint + ansible-lint), runs on Linux
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6

      - name: Set up Python 3.
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Pin ansible-core to the operator's installed baseline 2.20.5.
      # NOTE: the Integration-job red (2026-06-08) was NOT an ansible-core issue
      # — it was Python 3.14. `setup-python` `'3.x'` floated to 3.14, where
      # ansible-core 2.20.x's filter plugins fail to import
      # (`cannot import name 'VaultDecryptionContext'`), so `ansible.builtin.core`
      # filters get SKIPPED and every filter (`bool`/`default`/`to_nice_json`/…)
      # throws "No filter named" at runtime (integration only — syntax/lint don't
      # resolve templates). Fixed by pinning `python-version: '3.13'` everywhere
      # below. This `<2.20.6` upper bound just matches the operator baseline; it
      # is not load-bearing for the Python 3.14 fix.
      - name: Install lint dependencies.
        run: pip3 install yamllint 'ansible-core>=2.20,<2.20.6' ansible-lint

      - name: yamllint – YAML syntax check.
        run: yamllint .

      - name: ansible-lint – Ansible best practices.
        run: ansible-lint

  # ──────────────────────────────────────────────────────────────────────────
  # SYNTAX CHECK – Ansible syntax-check across the supported OS matrix.
  # Adds Ubuntu LTS targets ahead of the Phase-1 Linux port. matrix.os is
  # a workflow-controlled value (no external input) so no escaping needed.
  # ──────────────────────────────────────────────────────────────────────────
  syntax:
    name: Syntax Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - macos-14
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6

      - name: Set up Python 3.
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Pin to current operator baseline (2.20.x). See Lint job comment.
      - name: Install Ansible.
        run: pip3 install 'ansible-core>=2.20,<2.20.6'

      - name: Install Ansible Galaxy requirements.
        # Retry: Galaxy occasionally returns transient 502/Bad Gateway from
        # GitHub's archive endpoint. 3 attempts with backoff covers it.
        run: |
          for attempt in 1 2 3 4 5 6; do
            ansible-galaxy install -r requirements.yml && exit 0
            echo "ansible-galaxy attempt ${attempt} failed (galaxy 504s are common); sleeping ${attempt}0s"
            sleep "${attempt}0"
          done
          exit 1

      - name: Set up test inventory and config.
        run: |
          cp tests/ansible.cfg ./ansible.cfg
          cp tests/inventory ./inventory
          cp tests/config.yml ./config.yml

      - name: Ansible syntax check.
        run: ansible-playbook main.yml --syntax-check

  # ──────────────────────────────────────────────────────────────────────────
  # PYTEST – Python unit tests covering the callback plugin, migrate
  # engine, schema-handler consistency, upgrade actions, and state manager.
  # Fast (~2s) — runs on every PR. Excludes wing-api/wing-frontend (PHP).
  # ──────────────────────────────────────────────────────────────────────────
  pytest:
    name: Pytest (Python tests)
    runs-on: ubuntu-latest
    env:
      # THE ENVIRONMENT CONTRACT (tests/anatomy/_environment_contract.py):
      # every tool named here must resolve on PATH or the anatomy suite
      # ABORTS before running a single test. This job is where the
      # php/composer/jq/sqlite3-gated gates are SUPPOSED to run on GitHub —
      # if a runner-image update drops one of these, the run must go red
      # loudly, not demote those gates into skips nobody reads. Pinned by
      # tests/anatomy/test_absence_is_counted.py.
      # The last entry is a PATH, not a name: the AgentKit/Wing behavioural
      # gates run PHP against the wing vendor tree, which no workflow used to
      # install, and vendor is never on PATH so nothing could bind it. Seven
      # of nine assertions in the tool-scope gate — every one that actually
      # calls a tool — skipped on every run here. Declared, so a failed or
      # deleted `composer install` aborts instead of going quietly green.
      NOS_TEST_PROVIDES: git,ansible-playbook,php,composer,jq,sqlite3,openssl,files/anatomy/wing/vendor/autoload.php
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6

      - name: Set up Python 3.
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # PHP + composer needed by tests/anatomy/test_lockfile_sync.py.
      # The test gates files/anatomy/wing/{composer.json,composer.lock}
      # drift — added 2026-05-07 after a lockfile-only commit shipped
      # without re-running `composer update` and broke the operator's
      # next playbook run. Without composer in PATH the test self-skips
      # (Homebrew dev path) — the CI runner explicitly installs it so
      # the gate is binding here.
      - name: Set up PHP + composer.
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # ~150 wing/agentkit gates execute PHP against this tree — the tool
      # scope-split, the bound-agent report path, the presenter gates. The
      # forge has installed it since 2026-05 (its composer-validate step
      # shares the workspace); GitHub never did, so those gates ran on the
      # operator's Mac and nowhere else. Declared above, so this step failing
      # is a red run rather than a hundred skips.
      - name: Install the wing vendor tree.
        run: composer install --no-progress --no-interaction --no-scripts -d files/anatomy/wing

      # fastapi: tests/bone_vfs mounts the Bone VFS router on a throwaway app to
      # exercise the containment + filename-hardening gates (nOS-face v0.2).
      # ansible-core comes from the FROZEN pin (tools/ci-freeze.env) rather
      # than the runner image's preinstalled ansible: 19 anatomy gates drive
      # ansible-playbook harnesses (the fail-closed removal ladder), and they
      # must run against a version this repo declares, not one the image
      # happens to carry this month. markdown==3.10.2 must equal MARKDOWN_PIN
      # in tools/devlog-compile.py (gated by test_absence_is_counted.py).
      # textual: the control-centre panes are a Textual app, and its two gates
      # drive it headless through `run_test()` — they have already caught a
      # palette that never showed and panes that read once and sat there. Both
      # import tools/cc/app.py at module level, so without this the estate's
      # only check on its operator surface is a collection error.
      - name: Install test dependencies.
        run: . tools/ci-freeze.env && pip3 install pytest pyyaml jsonschema httpx jinja2 requests markdown==3.10.2 fastapi textual "$NOS_ANSIBLE_CORE"

      - name: Run pytest suite.
        run: >
          python3 -m pytest tests/
          --ignore=tests/wing-api
          --ignore=tests/wing-frontend
          --ignore=tests/e2e
          -q

  # ──────────────────────────────────────────────────────────────────────────
  # PYTEST-APPS – focused subset on tests/apps/ for fast per-submodule
  # failure visibility. Tier-2 apps_runner + Coolify importer regressions
  # surface here before they bleed into the full pytest suite. Runs in
  # parallel with the full pytest job; same Python pin so coverage is
  # consistent. ~0.2s today.
  # ──────────────────────────────────────────────────────────────────────────
  pytest-apps:
    name: Pytest (apps + importer)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6

      - name: Set up Python 3.
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install test dependencies.
        run: pip3 install pytest pyyaml jsonschema

      - name: Run apps + importer tests.
        run: python3 -m pytest tests/apps/ -v

  # ──────────────────────────────────────────────────────────────────────────
  # FACE – nOS-face shell (vendored SvelteKit, files/anatomy/face). The repo's
  # first JS toolchain (v0.2, 2026-07-18): type-check + lint + vitest. The
  # python doctrine/security gates (test_face_*.py) ride the pytest job.
  # ──────────────────────────────────────────────────────────────────────────
  face:
    name: Face (nOS-face shell)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6

      - name: Set up Node.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: files/anatomy/face/package-lock.json

      - name: Install shell dependencies.
        working-directory: files/anatomy/face
        run: npm ci

      - name: Type-check (svelte-check).
        working-directory: files/anatomy/face
        run: npm run check

      - name: Lint (prettier + eslint).
        working-directory: files/anatomy/face
        run: npm run lint

      - name: Unit tests (vitest).
        working-directory: files/anatomy/face
        run: npm test

  # ──────────────────────────────────────────────────────────────────────────
  # CORTEX – the reasoning organ (vendored KEAP v1.27.0 port, files/anatomy/
  # cortex). Node-22 job modeled 1:1 on the face job above. The conformance
  # step is the shared onto1 gate: the organ must keep reproducing the
  # reference composition (6 fixtures + the pinned digest over the spine) on
  # every push — KEAP v1.27.0 conformance IS the grading line (design §4).
  # e2e runs against the BUILT bundle via Playwright's request fixture only
  # (no browser download needed — no page/browser use in e2e/*.spec.ts).
  # ──────────────────────────────────────────────────────────────────────────
  cortex:
    name: Cortex (reasoning organ)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6

      - name: Set up Node.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: files/anatomy/cortex/package-lock.json

      - name: Install organ dependencies (validates the npm-10 lockfile).
        working-directory: files/anatomy/cortex
        run: npm ci

      - name: Build the daemon bundle (tsc typecheck + esbuild).
        working-directory: files/anatomy/cortex
        run: npm run build

      - name: Unit + store tests (vitest).
        working-directory: files/anatomy/cortex
        run: npm test

      - name: onto1 conformance (shared gate — fixtures + pinned digest).
        working-directory: files/anatomy/cortex
        run: node knowledge/onto1-conformance.mjs

      - name: E2E against the built bundle (Playwright request-only).
        working-directory: files/anatomy/cortex
        run: npm run test:e2e

  # ──────────────────────────────────────────────────────────────────────────
  # CONTRACTS DRIFT – regenerate Bone OpenAPI + Wing OpenAPI + Wing DDL
  # and diff against the committed artifacts under
  # files/anatomy/skills/contracts/. Anatomy A5 (2026-05-04) — surfaces
  # API/schema drift the moment a presenter or migration lands without
  # the artifact being refreshed.
  # ──────────────────────────────────────────────────────────────────────────
  contracts-drift:
    name: Contracts drift check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6

      - name: Set up Python 3.
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up PHP 8.5.
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3

      - name: Install Bone Python deps (FastAPI for OpenAPI introspection).
        run: |
          pip3 install --upgrade pip
          pip3 install -r files/anatomy/bone/requirements.txt

      - name: Regenerate contracts.
        run: |
          mkdir -p /tmp/contracts-rebuild
          python3 files/anatomy/bone/bin/export-openapi.py \
            --output /tmp/contracts-rebuild/bone.openapi.yml
          php files/anatomy/wing/bin/export-openapi.php \
            --output=/tmp/contracts-rebuild/wing.openapi.yml
          php files/anatomy/wing/bin/export-schema.php \
            --output=/tmp/contracts-rebuild/wing.db-schema.sql

      - name: Check genome artifacts are current.
        # The genome (state/genome/entity.schema.json) is one declaration emitted
        # into every runtime that needs it. --check diffs in place and exits 1 on
        # drift, so a hand-edited generated file goes red here rather than
        # surviving as a fifth uncoordinated copy of the same law.
        run: python3 tools/genome-codegen.py --check

      - name: Diff against committed artifacts.
        run: |
          set -e
          fail=0
          for f in bone.openapi.yml wing.openapi.yml wing.db-schema.sql; do
            committed="files/anatomy/skills/contracts/$f"
            rebuilt="/tmp/contracts-rebuild/$f"
            if ! diff -u "$committed" "$rebuilt"; then
              echo "::error::Drift detected in $f — regenerate via the export script and recommit."
              fail=1
            fi
          done
          exit "$fail"

  # ──────────────────────────────────────────────────────────────────────────
  # INTEGRATION – full run on real macOS (slower, expensive)
  # Runs only on master/claude/** pushes, not on every PR commit
  # ──────────────────────────────────────────────────────────────────────────
  integration:
    name: Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Cap a hung run (stack-up timeout, Authentik migration hang) at 45 min so a
    # deployment stall can't pin a runner for GitHub's 6h default ceiling. Budget:
    # ~25min cold-blank playbook + ~10min idempotence re-run + margin.
    timeout-minutes: 45
    # NON-BLOCKING (2026-06-08): the macOS hosted runner regressed the custom-module
    # interpreter path — nos_state runs on an auto-discovered python WITHOUT pyyaml
    # even though env / cfg `interpreter_python` / `-e ansible_python_interpreter`
    # all point at a $PY that has it (PY-DEPS-OK). 7 fixes couldn't redirect it; it
    # is a GitHub-macOS-runner + ansible-2.21 quirk, NOT a code/playbook defect. The
    # The Linux `integration-linux` job is the INTENDED gating wet-test — but as of
    # 2026-07-22 it does not yet prove the playbook, and this file carried the
    # withdrawn sentence ("IS the gating wet-test (green, full ok=473 run)") for
    # four weeks after CLAUDE.md retracted it. Corrected 2026-08-18, found by a
    # sweep of docs/hidden_fees/08: `stacks/infra/docker-compose.yml` is not
    # rendered on Linux, `docker compose up infra` returns rc=1, and the STRICT
    # probe passes the resulting EMPTY stack as `0/0 ready`. It was green for
    # weeks over an estate with no database at all.
    #
    # A retraction that reaches the prose and not the file the prose is about is
    # the shape hidden_fees/07 is filed for — and this instance sat inside CI,
    # which is the one place a reader treats as authoritative about CI.
    # Keep this job for visibility; revert continue-on-error once the runner/ansible
    # ships a fix. See CLAUDE.md tech-debt and docs/hidden_fees/08.
    continue-on-error: true
    # Keep the venv ansible's sys.path clean — the runner ships ansible in the
    # user/system site which can namespace-shadow the venv's `ansible.plugins`
    # (newer core.py over the venv's older _dumper.py → filter plugins skipped).
    env:
      PYTHONNOUSERSITE: '1'
    # On feature branches run integration only on push, not on draft PRs
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref != 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-14

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6

      - name: Set up Python 3.
        id: python-setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Uninstall GitHub Actions' built-in Homebrew.
        run: tests/uninstall-homebrew.sh

      - name: Uninstall GitHub Actions' built-in browser installs.
        run: |
          sudo rm -rf /Applications/Firefox.app
          sudo rm -rf /Applications/Google\ Chrome.app
          sudo rm -rf /usr/local/bin/firefox

      # Install Ansible into an ISOLATED venv, NOT the toolcache Python — and at
      # ansible-core 2.21+ (NOT the operator's 2.20.x). On these runners the full
      # playbook trips `ansible.builtin.core` filter loading with "cannot import
      # name 'VaultDecryptionContext' from ansible._internal._yaml._dumper" →
      # filters skipped → every filter (`default`/`bool`/`to_nice_json`/…) throws
      # "No filter named" mid-run. `VaultDecryptionContext` is a symbol ADDED in
      # ansible-core 2.21 — something in the runner's filter-load path imports it,
      # so the venv's `_dumper.py` must HAVE it (2.21+), or the load fails. 2.21 is
      # forward-compat-verified (see CLAUDE.md) and still ships the deprecated
      # `{{ vars }}` (only removed in 2.24), so it runs the playbook unchanged. The
      # venv + bin-on-PATH keeps `ansible-playbook`/`ansible-galaxy`/the interpreter
      # on one clean install. (Supersedes the 2026-05-04 explicit-$PY
      # fix — the venv subsumes it.)
      - name: Install test dependencies.
        env:
          PY: ${{ steps.python-setup.outputs.python-path }}
        run: |
          # Frozen toolchain pins — single source of truth shared 1:1 with the
          # local pre-release gate (tools/ci-local.sh). NOS_ANSIBLE_CORE today is
          # ansible-core==2.21.0, the only 2.21 release — exactly what the old
          # >=2.21,<2.24 range resolved to, so behaviour is unchanged; the freeze
          # just stops a future 2.21.x/2.22 float from landing mid-gating.
          . "${GITHUB_WORKSPACE}/tools/ci-freeze.env"
          "$PY" -m venv "$RUNNER_TEMP/nosvenv"
          "$RUNNER_TEMP/nosvenv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/nosvenv/bin/pip" install "$NOS_ANSIBLE_CORE" pyyaml jsonschema
          echo "$RUNNER_TEMP/nosvenv/bin" >> "$GITHUB_PATH"
          # Modules run target-side on $PY (the module interpreter, set via
          # ANSIBLE_PYTHON_INTERPRETER below) — NOT the venv (the venv is only the
          # CONTROLLER, for filter loading; a venv path as the module interpreter
          # trips macOS's venv-resolution). $PY needs the full ansible-core dep set
          # (packaging/jinja2/pyyaml/…) so nos_state + the pip-ish preflight tasks
          # import cleanly. Installing ansible-core here pulls them all in; the
          # module payload is bundled by the controller, so $PY's own ansible-core
          # version is irrelevant. (2026-05-04 macOS-proven shape.)
          # --break-system-packages: the macOS runner's framework $PY is PEP-668
          # externally-managed, so a plain install silently lands in user-site,
          # which PYTHONNOUSERSITE=1 (job env) then hides from the module → nos_state
          # "PyYAML is required". Force the main site-packages.
          "$PY" -m pip install --break-system-packages "$NOS_ANSIBLE_CORE" pyyaml jsonschema
          "$PY" -c 'import yaml, jsonschema; print("PY-DEPS-OK @", yaml.__file__)' || echo "PY-DEPS-MISSING"
          # Sanity probe — confirm the venv ansible loads core filters cleanly.
          "$RUNNER_TEMP/nosvenv/bin/python" -c 'import yaml, jsonschema; print("ok", yaml.__version__, jsonschema.__version__, "@", __import__("sys").executable)'
          "$RUNNER_TEMP/nosvenv/bin/ansible" localhost -m ansible.builtin.debug -a '{"msg": "{{ [] | to_nice_json }} {{ true | bool }}"}'

      - name: Set up the test environment.
        env:
          PY: ${{ steps.python-setup.outputs.python-path }}
        run: |
          cp tests/ansible.cfg ./ansible.cfg
          # Pin the module interpreter to $PY (it has ansible-core + pyyaml).
          # macOS interpreter auto-discovery overrides the env pin for CUSTOM
          # modules (nos_state) → "PyYAML is required"; a cfg pin to the non-venv
          # $PY (no venv-resolution) fixes it on macOS and is a no-op on ubuntu.
          echo "interpreter_python = $PY" >> ./ansible.cfg
          cp tests/inventory ./inventory
          cp tests/config.yml ./config.yml
          # Retry Galaxy install — see Syntax Check job comment. Install from the
          # FROZEN lock (exact pins, 1:1 with tools/ci-local.sh), not the
          # floor+ceiling requirements.yml. The lock holds what the ranges resolve
          # to today, so this is behaviour-identical now and frozen going forward.
          for attempt in 1 2 3 4 5 6; do
            ansible-galaxy install -r requirements.lock.yml && exit 0
            echo "ansible-galaxy attempt ${attempt} failed (galaxy 504s are common); sleeping ${attempt}0s"
            sleep "${attempt}0"
          done
          exit 1

      - name: Test the playbook's syntax.
        run: ansible-playbook main.yml --syntax-check
        env:
          # Pin Ansible's localhost Python to the same one we installed
          # pyyaml/jsonschema into (see Install test dependencies step).
          ANSIBLE_PYTHON_INTERPRETER: ${{ steps.python-setup.outputs.python-path }}

      # Diagnostic: prove the controller `ansible-playbook` and its filter core
      # come from the clean venv (not a shadowing user/system ansible).
      - name: Diagnose ansible filter loading.
        run: |
          echo "which ansible-playbook: $(command -v ansible-playbook)"
          ansible-playbook --version 2>&1 | head -3
          "$RUNNER_TEMP/nosvenv/bin/python" - <<'PY' || true
          import os, sys, ansible
          print("ansible.__path__:", list(getattr(ansible, "__path__", [])))
          print("PYTHONPATH:", os.environ.get("PYTHONPATH", "<unset>"))
          try:
              import ansible.plugins.filter.core as c
              print("core.py:", c.__file__)
          except Exception as e:
              print("core.py IMPORT FAILED:", type(e).__name__, e)
          print("sys.path:", [p for p in sys.path if p][:8])
          PY

      - name: Test the playbook.
        # -e ansible_python_interpreter (extra-vars, highest precedence) forces the
        # module interpreter past macOS's custom-module discovery cache, which
        # ignores the env + cfg pins. $PY has ansible-core + pyyaml (main-site).
        run: ansible-playbook main.yml -e allow_weak_prefix=true -e ansible_python_interpreter="${{ steps.python-setup.outputs.python-path }}"
        env:
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_PYTHON_INTERPRETER: ${{ steps.python-setup.outputs.python-path }}

      - name: Idempotence check.
        run: |
          idempotence=$(mktemp)
          ansible-playbook main.yml -e ansible_python_interpreter="${{ steps.python-setup.outputs.python-path }}" | tee -a "${idempotence}"
          tail "${idempotence}" | grep -q 'changed=0.*failed=0' \
            && (echo 'Idempotence test: pass' && exit 0) \
            || (echo 'Idempotence test: fail' && exit 1)
        env:
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_PYTHON_INTERPRETER: ${{ steps.python-setup.outputs.python-path }}

  # v0.4 cross-platform wet-test. GitHub ubuntu runners ship Docker + passwordless
  # sudo, so this ACTUALLY exercises the Linux path: the pazny.linux.* roles
  # (apt / docker / nginx / hardening), systemd --user daemons, and the
  # homebrew/launchd/osascript Darwin-gates added on feat/linux-port. Expected to
  # surface the remaining Linux gaps as it is iterated toward green; once green it
  # is the standing Linux acceptance gate (the macOS Integration matrix above
  # cannot test Linux, and GitHub macOS runners no longer ship Docker Desktop).
  integration-linux:
    name: Integration (ubuntu-24.04)
    runs-on: ubuntu-24.04
    # Cap a hung run at 45 min (see the macOS Integration job) so a stalled
    # deployment can't pin a runner for GitHub's 6h default ceiling.
    timeout-minutes: 45
    env:
      PYTHONNOUSERSITE: '1'   # keep the venv ansible's sys.path clean (see macOS job)
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref != 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6

      - name: Set up Python 3.
        id: python-setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Isolated venv — see the macOS Integration job's Install step for why
      # (runner's baked ansible-core vs our pin → filter-plugin split-brain).
      - name: Install test dependencies.
        env:
          PY: ${{ steps.python-setup.outputs.python-path }}
        run: |
          # Frozen toolchain pins — single source of truth shared 1:1 with the
          # local pre-release gate (tools/ci-local.sh). NOS_ANSIBLE_CORE today is
          # ansible-core==2.21.0, the only 2.21 release — exactly what the old
          # >=2.21,<2.24 range resolved to, so behaviour is unchanged; the freeze
          # just stops a future 2.21.x/2.22 float from landing mid-gating.
          . "${GITHUB_WORKSPACE}/tools/ci-freeze.env"
          "$PY" -m venv "$RUNNER_TEMP/nosvenv"
          "$RUNNER_TEMP/nosvenv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/nosvenv/bin/pip" install "$NOS_ANSIBLE_CORE" pyyaml jsonschema
          echo "$RUNNER_TEMP/nosvenv/bin" >> "$GITHUB_PATH"
          # Modules run target-side on $PY (the module interpreter, set via
          # ANSIBLE_PYTHON_INTERPRETER below) — NOT the venv (the venv is only the
          # CONTROLLER, for filter loading; a venv path as the module interpreter
          # trips macOS's venv-resolution). $PY needs the full ansible-core dep set
          # (packaging/jinja2/pyyaml/…) so nos_state + the pip-ish preflight tasks
          # import cleanly. Installing ansible-core here pulls them all in; the
          # module payload is bundled by the controller, so $PY's own ansible-core
          # version is irrelevant. (2026-05-04 macOS-proven shape.)
          # --break-system-packages: the macOS runner's framework $PY is PEP-668
          # externally-managed, so a plain install silently lands in user-site,
          # which PYTHONNOUSERSITE=1 (job env) then hides from the module → nos_state
          # "PyYAML is required". Force the main site-packages.
          "$PY" -m pip install --break-system-packages "$NOS_ANSIBLE_CORE" pyyaml jsonschema
          "$PY" -c 'import yaml, jsonschema; print("PY-DEPS-OK @", yaml.__file__)' || echo "PY-DEPS-MISSING"
          "$RUNNER_TEMP/nosvenv/bin/python" -c 'import yaml, jsonschema; print("ok", yaml.__version__, "@", __import__("sys").executable)'
          "$RUNNER_TEMP/nosvenv/bin/ansible" localhost -m ansible.builtin.debug -a '{"msg": "{{ [] | to_nice_json }} {{ true | bool }}"}'

      - name: Set up the test environment.
        env:
          PY: ${{ steps.python-setup.outputs.python-path }}
        run: |
          cp tests/ansible.cfg ./ansible.cfg
          # Pin the module interpreter to $PY (it has ansible-core + pyyaml).
          # macOS interpreter auto-discovery overrides the env pin for CUSTOM
          # modules (nos_state) → "PyYAML is required"; a cfg pin to the non-venv
          # $PY (no venv-resolution) fixes it on macOS and is a no-op on ubuntu.
          echo "interpreter_python = $PY" >> ./ansible.cfg
          cp tests/inventory ./inventory
          cp tests/config.yml ./config.yml
          # Retry Galaxy install — see Syntax Check job comment. Install from the
          # FROZEN lock (exact pins, 1:1 with tools/ci-local.sh), not the
          # floor+ceiling requirements.yml. The lock holds what the ranges resolve
          # to today, so this is behaviour-identical now and frozen going forward.
          for attempt in 1 2 3 4 5 6; do
            ansible-galaxy install -r requirements.lock.yml && exit 0
            echo "ansible-galaxy attempt ${attempt} failed (galaxy 504s are common); sleeping ${attempt}0s"
            sleep "${attempt}0"
          done
          exit 1

      - name: Test the playbook's syntax.
        run: ansible-playbook main.yml --syntax-check
        env:
          ANSIBLE_PYTHON_INTERPRETER: ${{ steps.python-setup.outputs.python-path }}

      - name: Diagnose ansible filter loading.
        run: |
          echo "which ansible-playbook: $(command -v ansible-playbook)"
          ansible-playbook --version 2>&1 | head -3
          "$RUNNER_TEMP/nosvenv/bin/python" - <<'PY' || true
          import os, sys, ansible
          print("ansible.__path__:", list(getattr(ansible, "__path__", [])))
          print("PYTHONPATH:", os.environ.get("PYTHONPATH", "<unset>"))
          try:
              import ansible.plugins.filter.core as c
              print("core.py:", c.__file__)
          except Exception as e:
              print("core.py IMPORT FAILED:", type(e).__name__, e)
          print("sys.path:", [p for p in sys.path if p][:8])
          PY

      # allow_weak_prefix: a runner has no credentials.yml, so the P0 prefix
      # guard (main.yml, 2026-08-02) refuses — this is the sandbox it names.
      - name: Test the playbook (Linux).
        # -e ansible_python_interpreter (extra-vars, highest precedence) forces the
        # module interpreter past macOS's custom-module discovery cache, which
        # ignores the env + cfg pins. $PY has ansible-core + pyyaml (main-site).
        #
        # TRAEFIK, NOT NGINX, ON LINUX (2026-08-31). `tests/config.yml` carries
        # `install_nginx: true` + `install_traefik: false` for both integration
        # jobs, and on Linux that is the one combination that cannot serve
        # anything: per-service nginx vhosts are macOS-only (docs/linux-port.md
        # — Traefik is the Linux edge), so nothing listens on 443 at all.
        #
        # That is why this job has been red since 2026-07-16 — 46 days and nine
        # consecutive runs, through BOTH the v0.10-beta and v0.11-beta tags. The
        # break was `b0df60e9 fix(smoke): a probe must test the service, not
        # DNS`, which added a loopback retry so a probe would stop passing on
        # DNS alone. The retry then got `Connection refused` on every host —
        # correctly, because there was no edge. The probe did not break the
        # build; it stopped hiding that CI proves no service is reachable.
        #
        # Overridden here rather than in tests/config.yml so the macOS job keeps
        # exercising the nginx vhost path, which is real and supported there.
        run: ansible-playbook main.yml -e allow_weak_prefix=true -e install_traefik=true -e install_nginx=false -e ansible_python_interpreter="${{ steps.python-setup.outputs.python-path }}"
        env:
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_PYTHON_INTERPRETER: ${{ steps.python-setup.outputs.python-path }}
