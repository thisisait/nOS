# =============================================================================
# pages.yml — publish the nos-core devlog to GitHub Pages on release tags.
#
# tools/devlog-render.py turns docs/devlog/nos-core/**/*.md into a static
# site (index + per-entry pages + RSS). Deployment is Actions-artifact ONLY —
# never enable "Pages from branch /docs" (docs/index.html is a separate
# hand-made dashboard and must not collide). One-time operator step:
# repo Settings → Pages → Source = GitHub Actions.
# Doctrine: docs/devlog/README.md § Pipeline.
# =============================================================================
name: Devlog Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Post-tag artifact gate. pages.yml fires on any `v*` tag push; the
  # devlog-release.sh pre-flight is operator-gated and CANNOT run if someone
  # cuts a tag by hand. This job re-validates the release artifacts AFTER the
  # tag lands and gates the publish on them, so an incomplete release (missing
  # devlog entry or RELEASE.md section) never reaches GitHub Pages.
  validate:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need the tag ref itself, not just the tip commit

      - name: Validate release artifacts are in sync with the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() { echo "RELEASE-GATE FAIL: $*" >&2; exit 1; }

          # 1. The tag must actually exist in git (defensive; the trigger
          #    implies it, but a re-tag/lightweight edge could surprise us).
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || fail "tag $TAG not found in git"
          echo "ok: tag $TAG present"

          # 2. A devlog entry must carry 'release: <tag>' in its front-matter.
          grep -l "^release: $TAG\$" docs/devlog/nos-core/*/*.md >/dev/null 2>&1 \
            || fail "no devlog entry with 'release: $TAG' — run /devlog release"
          echo "ok: devlog entry present"

          # 3. RELEASE.md must carry the matching '## <tag>' section header.
          grep -q "^## $TAG\b" RELEASE.md \
            || fail "RELEASE.md has no '## $TAG' section"
          echo "ok: RELEASE.md section present"

          echo "ALL RELEASE-GATE CHECKS GREEN for $TAG"

  build:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install renderer deps (pin matches tools/devlog-compile.py)
        run: pip3 install pyyaml markdown==3.10.2

      - name: Render the devlog
        run: python3 tools/devlog-render.py --out _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
