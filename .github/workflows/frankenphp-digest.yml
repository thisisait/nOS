---
# php/frankenphp re-uploads its latest tag every night (~01:10 UTC), so frankenphp_checksums go
# stale and the Linux install fails closed. This re-pins only what upstream's static.yaml signed
# (tools/frankenphp-repin.py refuses anything else) and opens a PR into dev; the operator merges.
# Push and PR go through the nos-bot GitHub App token: GITHUB_TOKEN events start no CI run.
# Needs repo secrets NOS_BOT_CLIENT_ID + NOS_BOT_APP_KEY: docs/git-and-release.md §nos-bot.
name: FrankenPHP digest
'on':
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: app
        with:
          client-id: ${{ secrets.NOS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.NOS_BOT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          ref: dev
          token: ${{ steps.app.outputs.token }}
      - name: Re-pin attested assets
        id: repin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/frankenphp-repin.py --write
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open the PR
        if: steps.repin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          branch="bot/frankenphp-digest-$(date -u +%Y%m%d)"
          uid="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${uid}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "fix(wing): frankenphp digests of the $(date -u +%m-%d) rebuild"
          git push origin "$branch"
          body="Upstream re-uploaded the release assets. tools/frankenphp-repin.py moved each pin only after"
          body="$body \`gh attestation verify --signer-workflow php/frankenphp/.github/workflows/static.yaml\`."
          gh pr create --base dev --head "$branch" --title "fix(wing): frankenphp digests of the $(date -u +%m-%d) rebuild" --body "$body"
