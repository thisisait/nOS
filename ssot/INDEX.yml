# The map. A realm is a key. Bytes live at path. Do not copy a realm into a
# second tree. Tenant constitutions use the same keys; their prefix is not
# nos-sot; their bytes live in the tenant seed after digest.
# `for` is who reads it first — not a sixth kind of force.
prefix: nos-sot
realms:
  doctrine:
    path: ssot/doctrine
    in_force: true
    for: law
    # Law kept as data in state/, read by code that enforces it. They stay in
    # state/ because their readers name them there (AgentLoader, judges, budget).
    # A state/ file with obligation keys must be listed here or sit in a realm
    # (gate: tests/anatomy/test_an_obligation_is_classified.py).
    companions:
      - state/judge-sets.yml
      - state/gdpr-consent-map.yml
      - state/gdpr-erasure-map.yml
      - state/gdpr-export-map.yml
      - state/offboard-book-owner.yml
      - state/digest-constitution.yml
      - state/digest-importers/
  genome:
    path: state/genome
    in_force: true
    for: what exists
  systems:
    path: docs/systems
    in_force: false
    for: how to reuse a wired service
  idea:
    path: docs/idea
    in_force: false
    for: not law
  dtt:
    path: "$NOS_SEED_DIR"
    in_force: true
    public: false
    for: claimed work
  fee:
    path: docs/hidden_fees
    in_force: false
    for: paid lessons
# Full warehouse originals, not stubs, not law. Promote when the operator
# settles the remaining axes (agentkit §6; backoffice §5 apex rename;
# n8n-packs needs an explicit ruling).
# organs.md moved to ssot/doctrine/body-plan.md and tissues.md to
# ssot/doctrine/tissue.md; each says in_force: false itself (ssot.md §3).
proposed:
  - docs/doctrine/agentkit.md
  - docs/doctrine/backoffice.md
  - docs/doctrine/n8n-packs.md
