# The map. A realm is a key. Bytes live at path. Do not copy a realm into a
# second tree. Tenant constitutions use the same keys; their prefix is not
# nos-sot; their bytes live in the tenant seed after digest.
# `for` is who reads it first — not a sixth kind of force.
prefix: nos-sot
realms:
  doctrine:
    path: ssot/doctrine
    in_force: true
    for: law
  genome:
    path: state/genome
    in_force: true
    for: what exists
  systems:
    path: docs/systems
    in_force: false
    for: how to reuse a wired service
  idea:
    path: docs/idea
    in_force: false
    for: not law
  dtt:
    path: "$NOS_SEED_DIR"
    in_force: true
    public: false
    for: claimed work
  fee:
    path: docs/hidden_fees
    in_force: false
    for: paid lessons
