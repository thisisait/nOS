# The ISDOC RECORD DICT — the shape every invoice-path source emits and every
# invoice-path unit binds to: digest-import-isdoc.py's IsdocImporter.parse()
# has produced this ad-hoc dict since the ISDOC importer landed (2026-09-10);
# this file formalizes the SAME fields as a frozen contract so a second source
# (the vision extractor) and a comparator (isdoc-vision-crosscheck) can bind
# to one shape instead of two independently-evolving ones.
#
# DECODING (invoice-structured-extractor unit): Stage B of the local extractor
# constrains an Ollama call to EXACTLY this shape via the native
# structured-output `format` param — ollama_version: "0.34.0"
# (default.config.yml:1235) ships JSON-schema-constrained decoding; no
# Outlines/XGrammar (ponytail rung 5: a new dependency for one JSON decode
# an already-installed backend already does). Bounded fields (currency,
# vat_breakdown[].rate) are enum classification with logprob confidence;
# unbounded fields (amounts, dates, doc id, party name) are format-constrained
# string/number decoding. Party identity is NEVER generated by the model —
# `seller.ico`/`buyer.ico` are RESOLVED against the live spine by
# nos_digest.resolve_party, same as every other importer.
#
# `required: []` is a deliberate precedent, not an oversight — see
# files/anatomy/agents/ops-extract/one-shot.schema.json's own $comment: an
# absent field (not on the document) must stay a legal, scorable answer, not
# a schema violation punishing the extractor for reporting reality.
#
# vat_breakdown (multi-rate-vat unit): a real Czech invoice mixes VAT rates.
# net/vat are the SUMS across vat_breakdown entries — see
# tools/digest-import-isdoc.py::_tax_subtotals().
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://nos.thisisait.eu/schema/isdoc-record.yaml"
title: "ISDOC record dict"
type: object
required: []
additionalProperties: false
properties:
  id:
    type: string
    description: "Invoice/document number (ISDOC <ID>)."
  issue:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    description: "ISO date (ISDOC <IssueDate>)."
  due:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    description: "ISO date (ISDOC <DueDate>)."
  currency:
    type: string
    enum: ["CZK", "EUR"]
  payable:
    type: number
    description: "PayableAmount — the grand total."
  net:
    type: number
    description: "TaxableAmount sum across vat_breakdown (ex-VAT)."
  vat:
    type: number
    description: "TaxAmount sum across vat_breakdown."
  vat_breakdown:
    type: array
    description: "One entry per TaxSubTotal — real invoices mix rates."
    items:
      type: object
      required: [base, vat]
      additionalProperties: false
      properties:
        rate: { type: number, description: "VAT rate percentage, e.g. 21." }
        base: { type: number, description: "TaxableAmount for this rate." }
        vat:  { type: number, description: "TaxAmount for this rate." }
  seller:
    type: object
    additionalProperties: false
    properties:
      ico:  { type: string, pattern: "^[0-9]{1,8}$" }
      name: { type: string }
  buyer:
    type: object
    additionalProperties: false
    properties:
      ico:  { type: string, pattern: "^[0-9]{1,8}$" }
      name: { type: string }
