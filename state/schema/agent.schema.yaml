# JSON Schema for files/anatomy/agents/<name>/agent.yml
# Anatomy A14 — AgentKit runtime (2026-05-07).
#
# Validated by tests/anatomy/test_agent_schema.py on every CI push.
# Runtime loader (App\AgentKit\AgentLoader) re-validates at agent load time
# so a bad agent.yml can never reach the LLM.
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://nos.thisisait.eu/schema/agent.yml"
title: "AIT Agent Definition"
type: object
additionalProperties: false
required:
  - name
  - version
  - description
  - model
  - audit
properties:
  name:
    type: string
    pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
    description: |
      Stable identifier matching the agent's directory name under
      files/anatomy/agents/. Lowercase + dashes only.
  version:
    type: integer
    minimum: 1
    description: "Bumped on every breaking change to system prompt or tool roster."
  description:
    type: string
    minLength: 16
    description: "One-paragraph human description for the /agents UI + audit trail."
  model:
    type: object
    additionalProperties: false
    required:
      - primary
    properties:
      primary:
        type: string
        # URI scheme: <provider>-<model-id>, dashes throughout.
        pattern: "^(anthropic|claude|openai|openclaw)-[A-Za-z0-9._:/-]{1,96}$"
        description: |
          URI of the primary LLM backend. Format <provider>-<model>.
          Known providers: anthropic, openclaw, openai, local.
          Examples: anthropic-claude-opus-4-7, openclaw-qwen-coder-32b.
      grader:
        type: string
        pattern: "^(anthropic|claude|openai|openclaw)-[A-Za-z0-9._:/-]{1,96}$"
        description: |
          OPTIONAL model that writes REVISION FEEDBACK. It does not decide
          satisfaction — outcomes.gateset does. Absent means no grader call at
          all: the gate set's own output is the feedback. There is no longer a
          fallback to the agent's own client, because a model asked to judge
          its own work agrees with itself (arXiv:2510.16657).

          When declared it MUST differ from model.primary and model.backend.
          Cross-field comparison is not expressible in draft-07, so the refusal
          lives in App\AgentKit\AgentLoader and is pinned by
          tests/anatomy/test_satisfaction_is_written_by_a_gate_run.py.
      fallback:
        type: string
        pattern: "^(anthropic|claude|openai|openclaw)-[A-Za-z0-9._:/-]{1,96}$"
        description: |
          Fallback URI used when primary fails (rate-limited, network error,
          model unavailable). The protocol is platform-agnostic so an
          openclaw fallback for an anthropic primary is safe.
      max_output_tokens:
        type: integer
        minimum: 256
        maximum: 200000
        default: 4096
        description: |
          Output cap for ONE model call. 4096 was the interface default and
          the only value anything ever passed — measured 2026-08-16, the
          librarian's taxonomy-brief batch (ten briefs of 300-12000 characters
          each) stopped at `stop_reason: max_tokens` mid-sentence and never
          reached the POST the ceremony exists to make. A reading ceremony and
          a writing one do not want the same budget; the agent is the level
          that knows which it is. This is NOT the session ceiling in Runner —
          that one is a runaway backstop across the whole run.
      backend:
        type: string
        pattern: "^[a-z][a-z0-9-]{0,30}$"
        description: |
          OPTIONAL backend binding — where a `claude-*` primary's traffic is
          pointed, named into state/llm-backends.yml. A backend is NOT a
          provider: the genome's llm.provider enum names which adapter runs
          (fail-closed, adapter-first), while this names the env contract the
          `claude` CLI honours (ANTHROPIC_BASE_URL / _AUTH_TOKEN / _MODEL).
          Absent = the default backend (the operator's own CLI session).
          Per agent, never estate-wide — ruling 1 in
          docs/minimax-groundwork.md. Declaring it does NOT arm it: the
          backend must also be armed via NOS_ARMED_BACKENDS, the agent's own
          gdpr.processors must name the backend's processor, and
          App\AgentKit\BindingResolver refuses deferred agents and
          opus-primary agents outright. The registry file documents all six
          gates; tests/anatomy/test_a_binding_reads_the_register.py holds the
          declared values to them.
  mode:
    type: string
    enum: [loop, one_shot]
    default: loop
    description: |
      `loop` (default) is the tool-use / outcome runtime. `one_shot` is the
      ops plane's (nos-ops) measurement shape: bind, ONE model call, validate
      the emitted chain against `one_shot.schema_path`, record the verdict.
      No tools, no retry, no outcome iteration — a loop measures the harness
      as much as it measures the model, and the ops plane is measuring models.
      The contradictions (tools / outcomes declared alongside it) are refused
      by App\AgentKit\AgentLoader; draft-07 cannot express the cross-field
      rule. Gate: tests/anatomy/test_one_shot_mode_makes_one_call.py.
  one_shot:
    type: object
    additionalProperties: false
    required: [schema_path]
    description: "Required iff mode: one_shot; refused otherwise (loader)."
    properties:
      schema_path:
        type: string
        description: |
          Path relative to the agent.yml directory of a JSON Schema the single
          emitted answer must satisfy. Validated by App\AgentKit\OneShot
          against a subset (type / required / properties / items / enum) — the
          verdict is the reader's, never the model's.
  system_prompt_path:
    type: string
    description: |
      Path relative to the agent.yml directory. Markdown loaded verbatim
      and passed as the LLM `system` parameter. If absent, no system prompt
      is set (agent runs with default model behaviour).
  tools:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          enum:
            - bash-read-only
            - bash-write            # reserved placeholder, no impl (kept)
            - migration-file-write  # gated, path-allowlisted (Q8/A1, 2026-06-16)
            - mcp-wing-read         # GET only, scope wing.read
            - mcp-wing-write        # POST, scope wing.write, route-allowlisted
            - mcp-bone
            - mcp-pulse
            - mcp-keap              # KEAP cortex /agent/v1 (read + captures-only write)
        config:
          type: object
          description: "Tool-specific config; opaque to the schema."
  multiagent:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type:
        type: string
        enum: [solo, coordinator]
      roster:
        type: array
        description: "Names of agents this coordinator may delegate to."
        items:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
            version:
              type: integer
              minimum: 1
              description: "Pin to a specific version, else latest is used."
      max_concurrent_threads:
        type: integer
        minimum: 1
        maximum: 16
        default: 4
        description: |
          Cap on parallel sub-agent threads (Coordinator::runWithChildren).
          ProcessPool clamps silently into [1, 16]. Default 4 is the
          A14-multiagent-followup baseline; bump for batch consolidation
          jobs (Dreams / Pulse fan-out) where more parallelism helps.
  outcomes:
    type: object
    additionalProperties: false
    required:
      - gateset
    properties:
      gateset:
        type: string
        pattern: "^[a-z][a-z0-9-]{0,30}$"
        description: |
          REQUIRED. Names an entry in state/judge-sets.yml `gate_sets:` whose
          exit code decides whether the run is satisfied. The membership check
          is cross-file and therefore lives in App\AgentKit\AgentLoader
          (draft-07 cannot reference another document); the loader refuses an
          unknown name at load time.

          An outcome loop with no gate set has nobody to ask but the model that
          produced the work.
      deliverable:
        type: object
        additionalProperties: false
        required: [event]
        properties:
          event:
            type: string
            description: |
              The event TYPE this ceremony must have filed, keyed to its own
              session, before the gate set may certify it.

              MEASURED 2026-08-29 (session 53de6409): the surveyor passed both
              judges and was `outcome_satisfied` having posted nothing. The gate
              set judges the TREE — `nos-smoke` says the estate is healthy,
              `cortex-corpus-diff` that the corpus agrees — and neither has an
              opinion about whether the agent did its own work. A prose report
              living only in a transcript is not an artifact anyone can check.

              Omit it when the ceremony's deliverable IS the tree (a writer
              whose gate set reads what it wrote). Declaring it says: the work
              is an artifact, and its absence unmakes satisfaction.
        description: |
          What this ceremony owes, as a thing that can be looked up.
      rubric_path:
        type: string
        description: |
          OPTIONAL markdown rubric, relative to agent.yml dir. Feedback only —
          it is what a declared `model.grader` writes revision notes against.
          It has never decided satisfaction and no longer looks as though it
          might.
      max_iterations:
        type: integer
        minimum: 1
        maximum: 10
        default: 3
  audit:
    type: object
    additionalProperties: false
    required:
      - capability_scopes
      - pii_classification
    properties:
      capability_scopes:
        type: array
        items:
          type: string
          # Scopes match Authentik client scopes + custom nOS verbs.
          pattern: "^[a-z][a-z._-]+$"
        description: |
          What this agent is authorised to do. Scope strings appear in
          every audit event so the trail is grep-able. Examples:
          wing.read, wing.write, events.write, mcp.tool_use,
          bash.read, network.outbound.
      pii_classification:
        type: string
        enum: [none, low, high]
        description: |
          GDPR Article 35 hint. `high` blocks anthropic-* primary (forces
          local fallback) when nos_strict_pii_routing is true.
  vault:
    type: object
    additionalProperties: false
    properties:
      required_credentials:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [scope]
          properties:
            scope:
              type: string
              # Examples: anthropic-api, mcp-wing, mcp-bone, infisical
              pattern: "^[a-z][a-z0-9-]+$"
            optional:
              type: boolean
              default: false
  subscribe:
    type: array
    description: |
      Per-agent webhook auto-fan-out (post-A14). Each entry registers the
      agent itself as a webhook receiver for one event type. When an event
      fires whose `data` matches the optional `filter:` map (exact-string
      equality, no regex/glob/eval), WebhookDispatcher POSTs to the
      Wing-internal operator-trigger endpoint to launch a fresh run of THIS
      agent. The dispatcher refuses to fan out to the agent that produced
      the originating event (self-loop guard) — mass-action loops require
      explicit operator intervention.
    items:
      type: object
      additionalProperties: false
      required: [event_type]
      properties:
        event_type:
          type: string
          # Only A14 agent_* event types are valid fan-out triggers today.
          # Extend as needed when new event families are added.
          enum:
            - agent_session_start
            - agent_session_end
            - agent_thread_start
            - agent_thread_end
            - agent_iteration_start
            - agent_iteration_end
            - agent_tool_use
            - agent_tool_result
            - agent_message
            - agent_grader_decision
            - agent_webhook_dispatch
            - agent_vault_resolved
        filter:
          type: object
          additionalProperties:
            type: string
          description: |
            Map of event-payload field name → expected exact-string value.
            ALL declared keys must match for the fan-out to fire. No regex,
            no glob, no eval — values are compared with strict ===.
        trigger_arg:
          type: string
          enum: [prompt, vault]
          default: prompt
          description: |
            How the upstream event flows into the new agent run. Today
            only `prompt` is implemented; `vault` is reserved for the
            B4 vault-refresh follow-up.
  dream:
    type: object
    additionalProperties: false
    description: |
      Dreams (memory consolidation, post-A14). Optional. When `enabled: true`
      this agent participates in the dream cycle — bin/dream-agent.php reads
      recent agent_sessions for this agent + the current agent_memory_stores
      entries, runs the agent under the restricted `tool_roster` below, and
      writes a deduplicated output store. The roster MUST be a strict subset
      of read-only tools (no bash, no mcp_wing write endpoints) — the dream
      Runner refuses to invoke any tool not in this list, by structural
      enforcement (App\AgentKit\Memory\Dreamer).
    properties:
      enabled:
        type: boolean
        default: false
        description: |
          Default false. Dream cycle skips agents that haven't explicitly
          opted in — keeps the cycle's blast radius narrow.
      tool_roster:
        type: array
        description: |
          Tool ids the agent is allowed to invoke during a dream cycle.
          MUST be a subset of read-only tools (mcp-wing-read, mcp-bone-read).
          The Runner enforces the restriction at session-open time; a tool
          outside the roster returns is_error=true with a refusal message.
        items:
          type: string
          enum:
            - mcp-wing-read
            - mcp-bone-read
      max_entries:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
        description: |
          Soft cap on the number of memory entries this agent's store
          holds at the end of a dream cycle. The Dreamer prunes oldest
          first when the store exceeds this number.
  metadata:
    type: object
    additionalProperties: true
    description: "Free-form key/value pairs, surfaced in Wing /agents UI."
    properties:
      runner_status:
        type: string
        description: |
          How this ceremony actually runs — the one metadata key that is NOT
          free-form, because other code branches on it: the binding resolver
          refuses `deferred` outright, and the anatomy graph publishes it on
          every `agent:` node. Free text let five spellings of the same state
          coexist; the enum makes a sixth a schema error.

            unproven   apparatus exists, no completed run proves it
            scheduled  a pulse job fires it on a cadence
            parked     contract-only: no launcher, no pulse job (deliberate)
            deferred   declared, never performed — refuses a backend binding
            proven     completed runs on record

          ABSENT is not a sixth value and not "fine": it is UNKNOWN, and the
          graph renders it as UNKNOWN rather than as any of the above.
        enum: [unproven, scheduled, parked, deferred, proven]
  gdpr:
    type: object
    additionalProperties: false
    description: |
      Article-30 record for THIS ceremony's processing (2026-08-13).

      Why it is a first-class key and not a `metadata` entry: running an
      agent sends estate content to an LLM provider, which is a transfer to
      a processor — and until this key existed the register asserted zero
      third-party processors while eight ceremonies had been shipping
      prompts to Anthropic nightly since the runtime shipped. The register
      never saw them because `nos_gdpr.all_records()` swept only
      `files/anatomy/plugins/` and `apps/`, and the agent files live in
      neither. A legal record hidden in a free-form bag is the same defect
      one directory further in.

      Why PER AGENT rather than one record for the runtime: the ceremonies
      differ in exactly the way Article 30 cares about. `brief-taxonomy`
      sends taxonomy prose; `triage-open-findings` sends the ±4-line
      neighbourhood of every unresolved secret leak, and gitleaks rows
      carry git author name and email — personal data. One flattened
      record would state the mild case and hide the sharp one. The same
      distinction is what the MiniMax routing ruling needs (capability is
      one axis, data sensitivity the other), so the register and the
      routing decision are served by one table rather than two.
    required:
      - purpose
      - legal_basis
      - data_categories
      - data_subjects
      - processors
      - retention_days
    properties:
      purpose:
        type: string
        minLength: 32
        description: "What this ceremony processes, and why. Art. 30(1)(b)."
      legal_basis:
        type: string
        enum:
          - consent
          - contract
          - legal_obligation
          - vital_interests
          - public_task
          - legitimate_interests
      data_categories:
        type: array
        minItems: 1
        items: {type: string}
        description: |
          What actually leaves the host, named concretely. `repository_source`
          is not the same claim as `secret_leak_neighbourhoods`.
      data_subjects:
        type: array
        minItems: 1
        items: {type: string}
      processors:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, role, country]
          properties:
            name: {type: string}
            role: {type: string}
            country:
              type: string
              description: "ISO-3166 alpha-2, or a plain name. Drives transfers_outside_eu."
            safeguard:
              type: string
              description: "Art. 46 mechanism, e.g. SCCs. Absent = none claimed."
        description: |
          EMPTY MEANS NOBODY, and is a claim. A ceremony that calls a hosted
          model has a processor; saying `[]` there is the assertion this key
          was added to stop being made by default.
      retention_days:
        type: integer
        description: "-1 = kept for the lifetime of the estate."
      eu_residency:
        type: boolean
        description: |
          Whether processing stays inside the EU. Omitted defaults to TRUE
          in nos_gdpr — an all-local-FOSS default that is false for any
          ceremony reaching a US-hosted model, so state it explicitly.
      transfers_outside_eu:
        type: boolean
      storage_location:
        type: string
      security_measures:
        type: array
        items: {type: string}
      notes:
        type: string
  exit_code_semantics:
    type: object
    additionalProperties: false
    description: |
      Per-agent exit-code contract (agent-exit-code-semantics, 2026-06-14).
      pulse-run-agent.sh maps the process exit to A9 notification severity:
        0    — success, no notification
        1    — actionable findings, fires HIGH-severity notification
        2+   — environment / auth / Wing error, fires CRITICAL notification
      The runner's trichotomy is fixed; this block documents what exit 1
      MEANS for THIS agent so the operator knows a HIGH notification is
      "awaiting your review" vs an outright failure. A review-capable agent
      (one whose system prompt emits the `NOS_AGENT_EXIT: 1` sentinel) MUST
      declare exit_1 here; the gate test_agent_exit_semantics_documented
      pins that. Prose-only agents (exit 0 always) still declare the block
      so the contract is explicit, not assumed.
    required:
      - exit_0
      - exit_1
      - exit_2
    properties:
      exit_0:
        type: string
        minLength: 8
        description: "What a clean exit 0 means for this agent."
      exit_1:
        type: string
        minLength: 8
        description: |
          What exit 1 means — fires a HIGH-severity A9 notification. State
          plainly that it is operator-review, not a failure (e.g. 'proposed
          fixes pending approval in /approvals', 'detected drift requiring a
          human decision'). For prose-only agents that never emit the
          NOS_AGENT_EXIT sentinel, say so ('does not emit exit 1').
      exit_2:
        type: string
        minLength: 8
        description: "What exit 2+ means — fires a CRITICAL A9 notification."
      emits_sentinel:
        type: boolean
        default: false
        description: |
          True when the agent's system prompt instructs the model to end its
          report with the `NOS_AGENT_EXIT: N` sentinel that pulse-run-agent.sh
          lifts into the process exit. False for prose-only agents (conductor)
          that always exit 0 unless the runner itself errors.

  # ── Merged in from the retired flat agents/<name>.yml (2026-08-28) ─────────
  # One file is the agent's identity: AgentKit contract, Authentik scopes,
  # notification routing and the Pulse schedule. Shapes stay loose here — the
  # authorities are Authentik, the wing-base routing aggregator and
  # discover-pulse-catalog.py, and a second strict copy would only drift.
  capabilities:
    type: array
    items: {type: string}
    description: "Authentik OAuth scopes the run requests (nos:*). Distinct from audit.capability_scopes, which are AgentKit tool scopes."
  notification:
    type: object
    description: "Per-severity channel routing, harvested into notification-routing.json."
  pulse:
    type: object
    required: [jobs]
    properties:
      jobs:
        type: array
        items:
          type: object
          required: [name, command, schedule]
