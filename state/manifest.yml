---
# ==============================================================================
# nOS State Manifest — source of truth for expected system shape.
#
# Consumed by:
#   - nos_state (introspect)        — reports installed version per service
#   - nos_migrate                   — detects coexistence support, reads identifiers
#   - Wing Upgrades matrix     — list of services to poll
#   - Bone /api/state/services      — canonical list
#
# When you add a Docker service, append an entry here. Entries are validated
# against state/schema/manifest.schema.json.
#
# `install_flag` maps directly to the `install_<service>` boolean in
# default.config.yml — introspect skips services whose flag is false.
# ==============================================================================

schema_version: 1

nos:
  brand: "nOS"
  engine_name: "nOS"
  public_name: "This is AIT"
  tagline: "the engine behind AIT"
  state_dir: "~/.nos"
  launchd_prefix: "eu.thisisait.nos"
  rbac_group_prefix: "nos-"
  oidc_client_prefix: "nos-"
  # Container name pattern. {stack} and {id} are substituted from each
  # service entry. Services whose compose service-name differs from the
  # manifest `id` (hyphens vs underscores, multi-container services)
  # override with explicit `container_name` or `container_names:`.
  container_pattern: "{stack}-{id}-1"

# Host launchd jobs no service row owns, each RULED (I-12, body-plan.md §5): a
# `reflex` or `internal` of its owner (`of:` a row id, or playbook-core for a
# tasks/*.yml hook) is a job, not an organ, and gets no graph node; `heartbeat`
# is the lexicon's own cross-level word and keeps its daemon: node. Every other
# launchd label is a row's (launchd_label / launchd_helpers) and IS that organ.
# Gate: tests/anatomy/test_every_daemon_has_a_manifest_row.py.
daemons_without_row:
  eu.thisisait.nos.acme-renew:
    ruling: reflex
    of: traefik
    reason: "pazny.acme's daily renewal timer: a scheduled response that writes the certificates Traefik serves; acme itself serves nothing"
  eu.thisisait.nos.backup.offsite:
    ruling: reflex
    of: backup
    reason: "tasks/backup.yml's off-site restic leg on its own clock, toggled by configure_backup (not install_backup, so not a helper); backrest takes this job when installed"
  eu.thisisait.nos.ears-listen:
    ruling: internal
    of: ears
    reason: "retired: pazny.ears boots it out and deletes its plist (no mic grant under launchd); declared only so a stale one is booted out"
  eu.thisisait.nos.heartbeat:
    ruling: heartbeat
    of: playbook-core
    reason: "liveness hook (tasks/heartbeat.yml) on every host, no install_* flag; the lexicon's heartbeat word names this label, so it keeps its node at level cross"
  eu.thisisait.nos.resume:
    ruling: internal
    of: playbook-core
    reason: "post-boot hook (tasks/os-resume.yml) that re-establishes host state; on every host, no install_* flag, no job of its own to show"
  homebrew.mxcl.dnsmasq:
    ruling: internal
    of: playbook-core
    reason: "root LaunchDaemon answering *.<local tld> for the edge (tasks/dnsmasq.yml, install_dnsmasq); a row of its own waits on a role, plugin and docs (body-plan.md §3 homes rule)"

services:
  # -------------------------------------------------------------- infra stack
  - id: postgresql
    software_owner: symbiont
    category: database
    stack: infra
    install_flag: install_postgresql
    version_var: postgresql_version
    version_source: docker_image
    image: postgres
    data_path_var: postgresql_data_dir
    port_var: postgresql_port
    health_check:
      type: exec
      command: "docker exec infra-postgresql-1 pg_isready -U postgres"
      expect_rc: 0
      timeout_sec: 10
    upgrade_recipe: upgrades/postgresql.yml
    breaking_boundaries: ["15->16", "16->17"]
    coexistence_supported: true

  - id: mariadb
    software_owner: symbiont
    category: database
    stack: infra
    install_flag: install_mariadb
    version_var: mariadb_version
    version_source: docker_image
    image: mariadb
    data_path_var: mariadb_data_dir
    port_var: mariadb_port
    health_check:
      type: exec
      command: "docker exec infra-mariadb-1 healthcheck.sh --connect"
      expect_rc: 0
      timeout_sec: 10
    upgrade_recipe: upgrades/mariadb.yml
    breaking_boundaries: ["10->11", "11->12"]
    coexistence_supported: true

  - id: redis
    software_owner: symbiont
    category: cache
    stack: infra
    # redis_docker, not install_redis: the flag chooses Docker over the Homebrew
    # build, and that distinction is why it is not spelled install_*.
    install_flag: redis_docker
    version_var: redis_version
    version_source: docker_image
    image: redis
    data_path_var: redis_data_dir
    port_var: redis_port
    health_check:
      type: exec
      command: "docker exec infra-redis-1 redis-cli ping"
      expect_rc: 0
    upgrade_recipe: upgrades/redis.yml
    breaking_boundaries: ["6->7", "7->8"]

  - id: authentik
    software_owner: symbiont
    category: identity
    stack: infra
    install_flag: install_authentik
    version_var: authentik_version
    version_source: docker_image
    image: ghcr.io/goauthentik/server
    container_names:
      - infra-authentik-server-1
      - infra-authentik-worker-1
    domain_var: authentik_domain
    port_var: authentik_port
    data_path_var: authentik_data_dir
    health_check:
      type: http
      url_template: "http://localhost:{{ authentik_port }}/-/health/live/"
      expect_status: 204
      timeout_sec: 15
    upgrade_recipe: upgrades/authentik.yml
    breaking_boundaries: ["2024->2025", "2025->2026"]
    coexistence_supported: true
    oidc: native

  - id: infisical
    software_owner: symbiont
    category: vault
    stack: infra
    install_flag: install_infisical
    version_var: infisical_version
    version_source: docker_image
    image: infisical/infisical
    domain_var: infisical_domain
    port_var: infisical_port
    data_path_var: infisical_data_dir
    health_check:
      type: http
      url_template: "http://localhost:{{ infisical_port }}/api/status"
      expect_status: 200
    upgrade_recipe: upgrades/infisical.yml
    oidc: native                            # env-seeded org SSO config; requires one-time Security→SSO toggle in UI post-install

  - id: portainer
    software_owner: symbiont
    category: devops
    stack: infra
    install_flag: install_portainer
    version_var: portainer_version
    version_source: docker_image
    image: portainer/portainer-ce
    domain_var: portainer_domain
    port_var: portainer_port
    data_path_var: portainer_data_dir
    health_check:
      type: tcp
      host: localhost
      port_var: portainer_port
    oidc: native

  - id: traefik
    software_owner: symbiont
    category: proxy
    stack: infra
    install_flag: install_traefik
    version_var: traefik_image_version
    version_source: docker_image
    image: traefik
    domain_var: traefik_domain
    port_var: traefik_dashboard_port
    health_check:
      type: http
      url_template: "http://localhost:{{ traefik_dashboard_port }}/ping"
      expect_status: 200

  - id: bluesky_pds
    software_owner: symbiont
    category: identity
    stack: infra
    install_flag: install_bluesky_pds
    fragment: bluesky-pds
    version_var: bluesky_pds_version
    version_source: docker_image
    image: ghcr.io/bluesky-social/pds
