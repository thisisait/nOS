      type: http
      url_template: "http://localhost:{{ bluesky_pds_port }}/xrpc/_health"
      expect_status: 200
    upgrade_recipe: upgrades/bluesky_pds.yml

  # domain_var WITHHELD, not missing: domain_var + port_var auto-derives a
  # Traefik router, and traefik_auth_modes says `none` where the plugin says
  # forward_auth. Adding the row must not settle that — see the P1 report.
