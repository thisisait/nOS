  - id: alloy
    software_owner: symbiont
    category: observability
    stack: null
    install_flag: install_observability
    launchd_label: "sh.brew.grafana-alloy"   # observability_launchd_label
    version_var: alloy_version
    version_source: homebrew
    brew_formula: grafana-alloy
    port_var: alloy_ui_port
    health_check:
