# Generated files: the ONE registry. A file here is written by its `writer`,
# never by hand. Read by Bone's git-tree reader (files/anatomy/bone/weaknesses.py:
# an uncommitted one is a writer's output that never landed) and by
# tests/anatomy/test_generated_files_hold.py.
#
# writer  the tool, role or job that writes it.
# check   argv run from the repo root; exit 0 means the file is current.
#         Absent when the writer has no offline check (`checked_by` says who does).
# header  false when the format or writer cannot carry the header; `why` says so.
#         Otherwise the first five lines say `GENERATED by <writer>`, or a JSON
#         file's top-level "generated_by" is the writer.
# Every path carries `merge=regen` in .gitattributes: keep ours, then rerun the writer.
version: 1

files:
  state/anatomy-graph.json:
    writer: tools/anatomy-graph-gen.py
    check: [tools/anatomy-graph-gen.py, --check]
  files/anatomy/face/src/lib/anatomy/anatomy-graph.json:
    writer: tools/anatomy-graph-gen.py
    check: [tools/anatomy-graph-gen.py, --check]
  state/body-plan.json:
    writer: tools/body-plan-gen.py
    check: [tools/body-plan-gen.py, --check]
  state/routing-graph.json:
    writer: tools/routing-graph-gen.py
    check: [tools/routing-graph-gen.py, --check]
  files/anatomy/face/src/lib/anatomy/routing-graph.json:
    writer: tools/routing-graph-gen.py
    check: [tools/routing-graph-gen.py, --check]
  state/loop-graph.json:
    writer: tools/loop-graph-gen.py
    check: [tools/loop-graph-gen.py, --check]
  files/anatomy/face/src/lib/anatomy/loop-graph.json:
    writer: tools/loop-graph-gen.py
    check: [tools/loop-graph-gen.py, --check]
  IMPRINT.md:
    writer: tools/imprint-gen.py
    check: [tools/imprint-gen.py, --check]
  AGENTS.md:
    writer: tools/task-types-render.py
    check: [tools/task-types-render.py, --check]
  docs/glossary.md:
    writer: tools/genome-codegen.py
    check: [tools/genome-codegen.py, --check]
  files/anatomy/module_utils/nos_entity.py:
    writer: tools/genome-codegen.py
    check: [tools/genome-codegen.py, --check]
  files/anatomy/face/src/lib/contracts/entity.gen.ts:
    writer: tools/genome-codegen.py
    check: [tools/genome-codegen.py, --check]
  state/dpa-register.md:
    writer: tools/gdpr-dpa-register.py
    check: [tools/gdpr-dpa-register.py, --check]
  tests/fixtures/selfmodel-recall.json:
    writer: tools/keap-recall-queries.py
    check: [tools/keap-recall-queries.py, --check]
  state/devlog-bundle.jsonl:
    writer: tools/devlog-compile.py
    check: [tools/devlog-compile.py, --check]
    header: false
    why: JSON Lines has no file header; every line is an entry.
  state/tofu-authentik-services.yml:
    writer: tools/tofu-authentik-gen-registry.py
    checked_by: nobody; the writer has no --check (it rewrites in place)
  state/roadmap/index.yml:
    writer: tools/roadmap-seed.py
    checked_by: nobody offline; the writer reads the private seed (NOS_SEED_DIR)
  state/fixtures/report-chain-synthetic/expected.yml:
    writer: tools/report-chain-synth-gen.py
    checked_by: nobody; the writer has no --check
  files/anatomy/contracts/bone.openapi.yml:
    writer: files/anatomy/bone/bin/export-openapi.py
    checked_by: tests/anatomy/test_the_bone_contract_is_current.py and CI contracts-drift
  files/anatomy/contracts/wing.openapi.yml:
    writer: files/anatomy/wing/bin/export-openapi.php
    checked_by: CI contracts-drift (needs php)
  files/anatomy/contracts/wing.db-schema.sql:
    writer: files/anatomy/wing/bin/export-schema.php
    checked_by: CI contracts-drift (needs php)
  files/anatomy/cortex/src/game/data/taxonomy.ts:
    writer: files/anatomy/cortex/knowledge/spine-render.mjs
    checked_by: CI (node files/anatomy/cortex/knowledge/spine-render.mjs --check)
    header: false
    why: a Cortex store debt path (lexicon Cortex.debt); no new code lands there.
  # Written by scheduled jobs on the host, not rerunnable offline.
  docs/llm/security/remediation-queue.json: &scan
    writer: the nightly security scan
    header: false
    why: a job's JSON record; its schema is read by the scan and Wing, not ours to extend.
    checked_by: nobody offline; the job rewrites it on its next run
  docs/llm/security/scan-state.json: *scan
  docs/llm/security/versions.json: *scan
  docs/llm/security/misconfig-findings.json: *scan
  docs/llm/security/attack-surface.json: *scan
  docs/llm/security/pentest-journal.json:
    writer: the pentest agent
    header: false
    why: a job's JSON record; its schema is read by the scan and Wing, not ours to extend.
    checked_by: nobody offline; the job rewrites it on its next run
  docs/llm/security/audit-manifest.json:
    writer: the security audit agent
    header: false
    why: a job's JSON record; its schema is read by the scan and Wing, not ours to extend.
    checked_by: nobody offline; the job rewrites it on its next run

# Generated outside the checkout (the runtime home); listed so nothing is missed.
runtime:
  ~/.nos/smoke-catalog.runtime.yml:
    writer: roles/pazny.apps_runner
