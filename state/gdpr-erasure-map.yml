# =============================================================================
# GDPR right-to-erasure map (Art. 17) — consumed by tasks/gdpr-forget.yml
# =============================================================================
# ONE audited file for every destructive per-subject deletion. Centralized on
# purpose: erasure commands are irreversible, so a single reviewable list beats
# scattering `rm`-equivalents across 20 plugins. Keys (`id`) match the DPA
# register / gdpr_processing rows (`svc_<plugin>` or `app_<manifest>`); `flag`
# is the install toggle (`always` = always-on; `apps_runner_enabled` for
# Tier-2 manifests).
#
# Coverage = every plugin that stores PER-USER data (native_oidc + header_oidc
# + AT-proto identity) + three Tier-2 apps with a gdpr: block (
# documenso, twofauth, roundcube; EspoCRM retired 2026-09-21, Qdrant 2026-10-02),
# PLUS the backend/residual stores that retain DERIVED subject data beyond
# those per-service deletes (Redis sessions, RustFS
# backups, wing.db agent tables, Loki/Tempo) — see the "Backend stores &
# residual reach" section. Plugin forward_auth services remain absent;
# Tier-2 apps that keep per-user PII behind a forward_auth gate are in scope.
#
# method:
#   authentik_api  — the identity anchor. Deletes the Authentik user, revoking
#                    SSO everywhere. Executed automatically on a confirmed run.
#   container_exec — `docker exec` an email-keyed one-liner in the service
#                    container. Executed on a confirmed run; the container is
#                    resolved by compose label at runtime.
#   manual         — no safe email-keyed programmatic delete verified yet; the
#                    dry-run plan prints `note` (the exact documented step) and
#                    a confirmed run still only REPORTS it. Promote an entry to
#                    container_exec/authentik_api once verified on a live host.
#
# {{ forget_subject }} (the data subject's email) is substituted at runtime.
# SAFETY: nothing here runs without `-e forget_confirm=true`; the default
# dry-run prints the full plan and logs a gdpr_dsar row only.
# =============================================================================

services:
  # ── Identity anchor (always first) ──────────────────────────────────────
  - id: svc_authentik
    flag: install_authentik
    method: authentik_api
    note: "Delete the Authentik user — revokes SSO access to every service."

  # ── Verified email-keyed container deletes ──────────────────────────────
  - id: svc_gitea
    flag: install_gitea
    method: container_exec
    stack: devops
    service: gitea
    command: "gitea admin user delete --email {{ forget_subject }} --purge"
    note: "gitea admin user delete --email <subject> --purge"

  - id: svc_wordpress
    flag: install_wordpress
    method: container_exec
    stack: iiab
    service: wordpress
    command: "wp user delete {{ forget_subject }} --reassign=0 --yes --allow-root"
    note: "wp user delete <subject> --reassign=0 --yes"

  # ── Manual (documented step printed in the plan; not auto-run) ───────────
  - id: svc_espocrm-retire
    flag: always
    method: manual
    note: "Residual Authentik OAuth2 client for the retired EspoCRM desk; the
           plugin stores no per-subject rows. Erasure is fully satisfied by the
           svc_authentik delete above; drop this entry when OpenTofu destroys
           the client and the plugin leaves the tree."

  - id: svc_nextcloud
    flag: install_nextcloud
    method: manual
    note: "Resolve uid from email (occ user:list --output=json), then
           docker exec <nextcloud> php occ user:delete <uid>."

  - id: svc_grafana
    flag: always
    method: manual
    note: "GET /api/users/lookup?loginOrEmail=<subject> → DELETE /api/admin/users/:id (admin basic auth)."

  - id: svc_gitlab
    flag: install_gitlab
    method: manual
    note: "GET /api/v4/users?search=<subject> → DELETE /api/v4/users/:id?hard_delete=true (admin PAT)."

  - id: svc_outline
    flag: install_outline
    method: manual
    note: "POST /api/users.delete with the user id (admin API token)."

  - id: svc_open-webui
    flag: install_openwebui
    method: manual
    note: "Admin Panel → Users → delete; or DELETE /api/v1/users/{id} (admin JWT)."

  - id: svc_n8n
    flag: install_n8n
    method: manual
    note: "Owner UI → Settings → Users → delete; or DELETE /rest/users/:id (owner auth)."

  - id: svc_nodered
    flag: install_nodered
    method: manual
    note: "Node-RED users are name-keyed in settings.js adminAuth (not email-keyed) — no programmatic per-subject delete; remove the user block + redeploy. No per-user flow data unless the operator stored PII in flows."

  - id: svc_vaultwarden
    flag: install_vaultwarden
    method: manual
    note: "Admin panel /admin → Users → delete the account by email."

  - id: svc_freescout
    flag: install_freescout
    method: manual
    note: "Manage → Users → delete; or php artisan freescout:... (no stable email-keyed CLI)."

  - id: svc_infisical
    flag: install_infisical
    method: manual
    note: "Org Settings → Members → remove; org-admin API DELETE /api/v1/organizations/:id/memberships/:mid."

  - id: svc_miniflux
    flag: install_miniflux
    method: manual
    note: "Admin → Users → remove; or DELETE /v1/users/:id (admin token)."

  - id: svc_hedgedoc
    flag: install_hedgedoc
    method: manual
    note: "bin/manage_users --del <email> inside the container (HedgeDoc CLI)."

  - id: svc_bookstack
    flag: install_bookstack
    method: manual
    note: "Settings → Users → delete; or php artisan (no stable email-keyed CLI)."

  - id: svc_portainer
    flag: install_portainer
    method: manual
    note: "GET /api/users (match by Username/email) → DELETE /api/users/:id (admin JWT)."

  - id: svc_erpnext
    flag: install_erpnext
    method: manual
    note: "bench --site <site> remove-user <email>, or set User as Disabled + anonymize per Frappe DPA tooling."

  - id: svc_homeassistant
    flag: install_homeassistant
    method: manual
    note: "Settings → People & Users → delete (no stable API for user deletion)."

  - id: svc_jellyfin
    flag: install_jellyfin
    method: manual
    note: "GET /Users (match by Name/email) → DELETE /Users/{id} (X-Emby-Token admin)."

  - id: svc_superset
    flag: install_superset
    method: manual
    note: "Settings → List Users → delete; or superset fab CLI."

  - id: svc_firefly
    flag: install_firefly
    method: manual
    note: "Admin → Users → delete; or DELETE /api/v1/users/:id (admin PAT)."

  - id: svc_dolibarr
    flag: install_dolibarr
    method: manual
    note: "Thirdparties/users: Dolibarr admin Users → delete; REST DELETE
           /users/{id} once a live API token is proven. Commercial records may
           be Art-17(3)(b) retention — review before DROP. Unverified live."

  - id: svc_keap
    flag: install_keap
    method: manual
    note: "SQLite on keap_data volume; rows keyed by X-Authentik-uid — sqlite3 delete WHERE user_id=<uid> (progress/todos/captures). Programmatic admin DELETE planned in nos-keap Admin CMS; flip to method:api once verified."

  - id: svc_bluesky-pds
    flag: install_bluesky_pds
    method: manual
    note: "pdsadmin account delete <did> (resolve did from @<handle>.bsky.<tld>)."

  # ── Tier-2 apps (app_<name> — DPA records_from_app_manifests) ────────────
  - id: app_documenso
    flag: apps_runner_enabled
    method: manual
    note: "Delete Recipient/User rows for the subject in documenso-db. Signed
           documents may be Art-17(3)(b) legal-claim retention — review before
           DROP. Unverified live — method:manual."

  - id: app_twofauth
    flag: apps_runner_enabled
    method: manual
    note: "Delete the matching 2FAuth user (and their TOTP secrets) via the
           admin UI or SQLite. Unverified live — method:manual."

  - id: app_roundcube
    flag: apps_runner_enabled
    method: manual
    note: "Drop the Roundcube identities/session row; mailbox erasure is the
           IMAP/Stalwart path (already covered if svc_stalwart/mail is in
           plan). Unverified live — method:manual."

  # ── Backend stores & residual reach (Art. 17 — beyond per-service deletes) ─
  # These hold DERIVED / RESIDUAL subject data the per-service deletes above do
  # not reach. All `manual`: the deletions are broad (FLUSHDB drops every
  # session, not one subject's), so auto-running them on a per-subject run
  # would over-delete. The dry-run plan prints these so the reach is auditable.
  - id: svc_geo
    flag: install_postgis
    method: manual
    note: "PostGIS projection geo.party_site (a sole trader's site is a person's
           address). Keyed by party, not email: tools/digest-teardown.py
           --erase-party <party-slug> --confirm erases the KEAP party-site rows
           AND geo.party_site at once; the nightly projection then cannot
           recreate them. martin (install_martin) serves it uncached, so
           the next tile is already without them. RÚIAN/INSPIRE layers hold no subject data."

  - id: svc_redis
    # `redis_docker`, not `install_redis`: the latter is declared in no config
    # layer, so this row was never once in a plan.
    flag: redis_docker
    method: manual
    note: "Sessions/cache only, opaque-keyed (session ids, not email). The
           svc_authentik delete revokes SSO; residual sessions TTL-expire. To
           force-clear: docker exec <redis> redis-cli FLUSHDB (drops ALL
           sessions for that logical DB — every user re-logs in)."

  - id: svc_rustfs
    flag: install_rustfs
    method: manual
    note: "BACKUP CARVE-OUT (Art. 17(3) / recital 65): an erased subject's
           encrypted dumps age out per backup retention (7 daily + 4 weekly +
           12 monthly) — do NOT surgically edit encrypted archives. Re-run this
           erasure for the subject after ANY restore. Object-store buckets of
           user uploads follow the owning service's delete."

  - id: svc_wing
    flag: install_wing
    method: manual
    note: "agent_sessions/threads/iterations/memory_stores may reference the
           subject in prompts/outputs. events are WORM-chained (integrity);
           subject content in agent tables is purged via tasks/audit-retention.yml.
           gdpr_consent rows store the subject's plaintext email (Art-7(1)
           demonstrability) — on erasure, do NOT delete the consent proof;
           pseudonymise it via GdprRepository::pseudonymiseSubject (keeps the
           grant/withdraw record, removes the plaintext email — reconciles
           Art-7(1) vs Art-17). record-consent.php has no pseudonymise flag yet,
           so this is an operator-run SQL/CLI step (method:manual).
           Manual review for free-text PII in agent memory + consent notes."

  - id: svc_loki
    flag: always
    method: manual
    note: "Logs may contain IP/email in request lines. No per-subject log
           deletion — minimise PII at the source and rely on the Loki retention
           horizon (logs age out). Tighten loki retention for gov deployments."

  - id: svc_tempo
    flag: always
    method: manual
    note: "Traces may carry IP / user span attributes. No per-subject trace
           deletion; rely on the Tempo retention horizon (traces age out).
           Minimise PII in span attributes."

  # ── nos-forum (iiab; policy docs/compliance/nos-forum.md) ─────────────────
  - id: svc_nos-forum
    flag: install_nos_forum
    method: manual
    note: "v0.1 has no forget CLI. As the module owner (the CLI in
           nos_forum_data_dir/cli, see roles/pazny.nos_forum/tasks/post.yml):
           sql \"SELECT identity FROM user WHERE username = '<u>'\" →
           call set_config service_identity <owner-hex> (once) → call
           erase_subject <identity-hex>. Tombstones the subject's messages and
           posts (author → erased identity), deletes reactions, read markers,
           memberships and the user row; refuses while the subject owns a
           server (transfer first). The Authentik user delete above ends login."

  # ── Device gateway (host organ; policy docs/compliance/devices.md) ──────────
  - id: svc_device-gateway
    flag: install_device_gateway
    method: manual
    note: "Pairing registry: KEAP table device-client rows WHERE owner = the
           subject's Authentik username — set status=revoked + revoked_at, or
           delete outright on erasure (no writer exists yet, so today the table
           is empty). Tokens: the svc_authentik user delete above revokes every
           RFC 8628 grant; for unpair-only, revoke the user's nos-device-gateway
           tokens in Authentik (Directory > Tokens / consents). Edge access log
           lines age out with loki_retention (31 d) — see svc_loki."

  # ── Ears (host organ; policy docs/compliance/ears.md) ──────────────────────
  - id: svc_ears
    flag: install_ears
    method: manual
    note: "Nothing to erase by default: transcripts are not kept
           (ears_keep_transcripts: false) and audio is never at rest. When kept:
           delete the subject's lines (or the day-files) under ~/ears/turns/
           turns-YYYY-MM-DD.jsonl; the listener prunes the rest at
           ears_retention_days. The caddy's ledger (KEAP table caddy-sessions)
           carries the transcript column only while transcripts are kept —
           delete those rows via the KEAP agent API."
