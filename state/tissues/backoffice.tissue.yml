# The backoffice tissue: a firm's books and counterparties, staffed by cells.
# Every id below already exists in its own source; this file only gathers
# them (docs/doctrine/tissues.md, PROPOSED). Checked by tools/tissue-status.py
# and tests/anatomy/test_tissue_holds.py.
meta:
  name: backoffice
  version: "0.1.0"
  summary: "Counterparties, invoices and double-entry books, with the desk that keeps them."
  license: MIT
  category: business

# The two invoice-extraction stages, both on-device.
cells: [invoice-vision-ocr, invoice-extract]

skills: [nos-backoffice, nos-datatables]

# Shared spines (party, account) are held here AND by other tissues; removal
# never drops a table someone else holds.
tables:
  - party
  - party-tax-identity
  - party-address
  - party-contact
  - party-registry-status
  - account
  - invoice
  - invoice-line
  - invoice-review
  - pending-invoice-verify
  - journal-entry
  - posting
  - book-access
  - cnb-fx

services: [dolibarr, freescout]

reflexes:
  - crm-hydrate:hydrate-parties
  - invoice-vision:intake-sweep
  - invoice-vision:absorb-approved

importers: [isdoc, isdoc-vision, doli-party, csv-party]

# Reference knowledge: the CZ chart of accounts (no personal data).
seeds: [accounting]

profile: praxis

acceptance: [consulting-firm]
