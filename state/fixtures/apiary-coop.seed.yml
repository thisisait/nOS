# =============================================================================
# Apiary co-op — synthetic business fixture seed (row fixture-apiary-coop).
#
# A beekeeping co-operative: member organisations, apiary sites, hives, scale
# readings and alerts. It is the LOW-PII fixture: every member is an
# organisation and no row names a natural person, so a personal-data detector
# run over it has nothing to flag. The answer key is
# state/fixtures/apiary-coop/expected.yml (never seeded).
#
# A map keyed by table slug; each value a list of row dicts. Top-to-bottom is
# DEPENDENCY ORDER (a rowRef target appears above its referencer); seed-bundle.yml
# walks the keys in this order. A row's `slug` is its KEAP row id (idempotent
# upsert), so every rowRef value is a target-row slug, never a display string.
#
# SYNTHETIC BY RULE: party slugs start `synthetic-`, emails/web end `.invalid`,
# phones start `+420 000`, tax ids match (CZ)?000001\d\d (the apiary holds 40-49).
# Dates are fixed epoch seconds (UTC) so the seed is byte-deterministic: readings
# run 2026-09-01 to 2026-09-18, two a week. A reading taken by hand has no
# `brood_temp_c`; a hive with no scale has no reading at all. `raised_by` is a
# label (`agent:apiary-watch` or `keeper`), not an identity.
# =============================================================================

# ── The shared EN-16931 party table (the co-op's members ARE parties) ────────
