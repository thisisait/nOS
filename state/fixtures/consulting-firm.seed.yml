# =============================================================================
# Consulting-firm fixture seed (consulting-firm-deployment epic, D2).
#
# Tenancy = MODEL C (operator 2026-09-19): the consultant is the sole USER;
# each client firm is DATA, never a controller/tenant column. Isolation is
# proven at the data layer only — each client's books balance independently
# and no posting bridges two clients' analytical accounts. A per-client ACCESS
# layer is a later epic (docs/idea/17: "no tenant column, ever").
#
# ICO RANGE: (CZ)?000001{30..49} — grepped free across the whole tree before
# use (TAKEN: 100-101 label-printer, 110-113 kolben, 112/113 also referenced by
# repos-fixture + isdoc-fixture, 120-122 repos-importer CSV, 177, 199). This
# fixture uses 130-139 (10 parties), leaving 140-149 free for a future sibling.
#
# SHAPE: 1 processor (the consultant) + 3 client firms (2 s.r.o. org + 1 OSVC
# person) + each client's own counterparty (a customer it sells to, a vendor
# it buys from). Dependency order below is the seed-bundle order (party leads;
# a rowRef target must appear above its referencer):
#   party -> party-tax-identity -> party-address -> party-contact ->
#   account -> invoice -> journal-entry -> posting
#
# ACCOUNTS: 311/321/343/601/601/501 are the SHARED class spine (same slugs as
# accounting.seed.yml, idempotent re-seed). Each client gets its OWN analytical
# 311-<client> / 321-<client> account (account.party = that client, parent =
# the shared 311/321) — the isolation invariant (test_consulting_firm_fixture_
# declares_the_business.py) resolves via THIS rowRef, never the code string.
#
# PER CLIENT: >=2 invoices — one ISSUED (client = seller) and one RECEIVED
# (client = buyer), each book_owner = that client (the D1 column, a
# data-organization rowRef, not RBAC) — and >=2 balanced journal entries whose
# postings hit ONLY that client's analytical accounts + the shared spine.
# Entries are authored in nos_accounting.derive_entry's exact leg shape (DR 311
# gross / CR 601 net / CR 343 vat when selling; DR 501 net / DR 343 vat / CR
# 321 gross when buying) so a future importer regenerates identical rows.
#
# state/fixtures/consulting-firm/ carries the dual-intake documents (ISDOC +
# plain-text OCR stand-in) — see that directory's own files for the planted
# multi-rate-VAT invoice and the one planted image-vs-ISDOC discrepancy.
#
# SYNTHETIC BY RULE (same as every other fixture): party slugs start
# `synthetic-`, emails end `.invalid`, phones start `+420 000`, tax ids match
# (CZ)?000001\d\d. Dates are fixed epoch seconds.
# =============================================================================

