---
# Recorded shows. The thalamus test iris_genui renders each case; it does not score the YAML against itself.
- id: table-steps
  kind: table
  component:
    kind: table
    props:
      title: Steps by track
      columns: [track, next, done]
      rows:
        - [pupil, I4c, 2]
  expect:
    - Steps by track
    - track
    - next
    - done
    - pupil
    - I4c
    - "2"
- id: list-steps
  kind: list
  component:
    kind: list
    props:
      title: Next steps
      ordered: true
      items:
        - text: query_rows
          detail: landed in I4a
          tone: "ok"
        - text: show
  expect:
    - Next steps
    - query_rows
    - landed in I4a
    - "ok"
    - show
- id: record-steps
  kind: record
  component:
    kind: record
    props:
      title: One step
      fields:
        - key: tool
          value: query_rows
        - key: track
          value: I4c
  expect:
    - One step
    - tool
    - query_rows
    - track
    - I4c
- id: markdown-steps
  kind: markdown
  component:
    kind: markdown
    props:
      text: "## Next step\nquery_rows"
  expect:
    - query_rows
- id: chart-steps
  kind: chart
  component:
    kind: chart
    props:
      title: Steps by track
      chart: bar
      x: category
      series:
        - name: query_rows
          points:
            - [I4c, 2]
  expect:
    - Steps by track
    - bar
    - query_rows
    - I4c
    - "2"
    - category x
# The model quotes a numeric x: x is always a string on the wire, whatever the axis.
- id: chart-scatter-numeric-x
  kind: chart
  component:
    kind: chart
    props:
      title: Latency by load
      chart: scatter
      x: number
      series:
        - name: p50
          points:
            - ["3", 5]
            - ["10", 12.5]
            - ["-2", 1]
  expect:
    - Latency by load
    - scatter
    - number x
    - p50
    - 3=5
    - 10=12.5
    - -2=1
- id: chart-time-line
  kind: chart
  component:
    kind: chart
    props:
      title: Rows per day
      chart: line
      x: time
      series:
        - name: rows
          points:
            - ["2026-10-11", 3]
            - ["2026-10-12T08:00:00Z", 4]
            - ["2026-10-13T08:00:00+02:00", 9]
  expect:
    - Rows per day
    - time x
    - 2026-10-11=3
    - 2026-10-13T08:00:00+02:00=9
- id: chart-area
  kind: chart
  component:
    kind: chart
    props:
      chart: area
      x: category
      series:
        - name: open
          points: [[mon, 3], [tue, 5]]
        - name: done
          points: [[mon, 1], [tue, 2]]
  expect:
    - area chart
    - open
    - tue=5
    - done
    - mon=1
- id: chart-stacked-bar
  kind: chart
  component:
    kind: chart
    props:
      title: Rows by track and status
      chart: stacked_bar
      x: category
      series:
        - name: next
          points: [[pupil, 4], [keap, 2]]
        - name: done
          points: [[pupil, 9], [keap, 7]]
  expect:
    - stacked_bar chart Rows by track and status
    - next
    - keap=2
    - pupil=9
- id: chart-pie
  kind: chart
  component:
    kind: chart
    props:
      title: Share by track
      chart: pie
      x: category
      series:
        - name: rows
          points: [[pupil, 4], [keap, 0], [face, 6]]
  expect:
    - pie chart Share by track
    - pupil=4
    - keap=0
    - face=6
# A chart of table rows names its source: the thalamus draws KEAP's aggregate and the person may pin it.
- id: chart-pie-sourced
  kind: chart
  component:
    kind: chart
    props:
      title: Expenses by kind
      chart: pie
      x: category
      series:
        - name: sum of amount
          points: [[travel, 120], [food, 42]]
  source:
    query: {table: expenses}
    x: kind
    y: amount
    op: sum
  expect:
    - pie chart Expenses by kind
    - travel=120
    - food=42
- id: tree-steps
  kind: tree
  component:
    kind: tree
    props:
      title: Roadmap
      nodes:
        - label: nOS
          children:
            - label: pupil
              note: the eye
            - label: keap
  expect:
    - Roadmap
    - nOS
    - pupil
    - the eye
    - keap
- id: timeline-steps
  kind: timeline
  component:
    kind: timeline
    props:
      title: History
      items:
        - when: "2026-10-12"
          title: I4a landed
          note: query_rows
        - when: "2026-10-13"
          title: chart
          hi: true
  expect:
    - History
    - "2026-10-12"
    - I4a landed
    - query_rows
    - "2026-10-13"
    - chart
    - hi
- id: timeline-spans
  kind: timeline
  component:
    kind: timeline
    props:
      title: I5 build
      items:
        - when: "2026-10-01"
          until: "2026-10-05"
          title: lanes and gates
          lane: thalamus
        - when: "2026-10-06"
          until: "2026-10-09"
          title: chart axes
          lane: pupil
        - when: "2026-10-13"
          title: timeline
          lane: pupil
          hi: true
  expect:
    - I5 build
    - 2026-10-01 → 2026-10-05
    - lanes and gates
    - "[thalamus]"
    - 2026-10-06 → 2026-10-09
    - "[pupil]"
    - "2026-10-13  timeline hi [pupil]"
- id: graph-organs
  kind: graph
  component:
    kind: graph
    props:
      title: How the organs talk
      nodes:
        - {id: bone, label: Bone, note: FastAPI bridge, tone: ok}
        - {id: wing, label: Wing, note: dashboard}
        - {id: pulse, label: Pulse, tone: warn}
        - {id: keap, label: KEAP}
      edges:
        - {from: bone, to: wing, label: events}
        - {from: pulse, to: bone, label: jobs}
        - {from: wing, to: keap, dashed: true}
        - {from: keap, to: bone, label: recall}
  expect:
    - How the organs talk
    - "nodes:"
    - bone Bone — FastAPI bridge [ok]
    - wing Wing — dashboard
    - pulse Pulse [warn]
    - keap KEAP
    - "edges:"
    - bone -> wing (events)
    - pulse -> bone (jobs)
    - wing - -> keap
    - keap -> bone (recall)
- id: choice-fork
  kind: choice
  component:
    kind: choice
    props:
      question: Which table should I chart first?
      options:
        - label: todos
          note: the open work
        - label: expenses
      suggested: [todos]
      multi: false
  expect:
    - Which table should I chart first?
    - "1. todos"
    - the open work
    - "(suggested)"
    - "2. expenses"
    - /choose
- id: sequence-approval
  kind: sequence
  component:
    kind: sequence
    props:
      title: How an approval travels
      participants: [pupil, thalamus, KEAP]
      steps:
        - {phase: propose}
        - {from: pupil, to: thalamus, text: "turn: close the row"}
        - {from: thalamus, to: KEAP, text: query_rows}
        - {from: KEAP, to: thalamus, text: 1 row, dashed: true}
        - {note: the person decides, over: [pupil]}
        - {note: recorded in the ledger, over: [thalamus, KEAP]}
  expect:
    - How an approval travels
    - "participants: pupil, thalamus, KEAP"
    - "  == propose =="
    - "pupil -> thalamus: turn: close the row"
    - "thalamus -> KEAP: query_rows"
    - "KEAP --> thalamus: 1 row"
    - "  note pupil: the person decides"
    - "  note thalamus, KEAP: recorded in the ledger"
# A dry run: what an action would add, remove or change, said as + - ~ before the line (iris-genui-change-markers).
- id: tree-delta
  kind: tree
  component:
    kind: tree
    props:
      title: What the converge would change
      nodes:
        - label: nOS
          delta: changed
          children:
            - label: pupil
              delta: added
              children:
                - label: eye
            - label: keap
              delta: removed
              children:
                - label: lobe
            - label: wing
  expect:
    - "~ nOS"
    - "+   pupil"
    - "+     eye"
    - "-   keap"
    - "-     lobe"
    - "    wing"
- id: list-delta
  kind: list
  component:
    kind: list
    props:
      title: Jobs after the change
      ordered: false
      items:
        - text: nightly-backup
          delta: changed
          detail: 02:00 -> 03:00
        - text: digest-import
          delta: added
        - text: old-sync
          delta: removed
        - text: red-status
  expect:
    - "~ - nightly-backup — 02:00 -> 03:00"
    - "+ - digest-import"
    - "- - old-sync"
    - "  - red-status"
- id: record-delta
  kind: record
  component:
    kind: record
    props:
      title: backup-restic-fork
      fields:
        - key: status
          value: done
          delta: changed
          was: open
        - key: owner
          value: iris
          delta: added
        - key: blocker
          value: virtiofs
          delta: removed
        - key: track
          value: backup
  expect:
    - "~ status: open -> done"
    - "+ owner: iris"
    - "- blocker: virtiofs"
    - "  track: backup"
# A KPI as serve draws it from show's source (the model never sends the number; serve.rs refuses a kpi without one).
- id: kpi-total
  kind: kpi
  component:
    kind: kpi
    props:
      title: Travel spend
      value: 12450.5
      unit: Kč
      delta: -320
      delta_label: vs last month
      source: sum of amount over 7 rows of Expenses (kind = travel)
  expect:
    - "Travel spend: 12450.5 Kč"
    - "down 320 vs last month"
    - sum of amount over 7 rows of Expenses (kind = travel)
# v12: callout, steps, sources and follow_up (names and shapes after OpenUI's genui-lib, MIT).
- id: callout-risk
  kind: callout
  component:
    kind: callout
    props:
      tone: bad
      title: Not backed up
      text: These rows are in no backup taken today.
  expect:
    - "[bad] Not backed up"
    - These rows are in no backup taken today.
- id: steps-plan
  kind: steps
  component:
    kind: steps
    props:
      title: Close the month
      items:
        - title: Import the statement
          status: done
        - title: Match invoices
          status: active
          detail: 12 of 40
  expect:
    - Close the month
    - "1. [done] Import the statement"
    - "2. [active] Match invoices — 12 of 40"
# A source as serve sends it: name is the table title serve resolved from the rows it showed.
- id: sources-rows
  kind: sources
  component:
    kind: sources
    props:
      items:
        - table: expenses
          row: e1
          name: Expenses
          note: the travel line
  expect:
    - sources
    - "Expenses (expenses) / e1 — the travel line"
- id: follow-up-next
  kind: follow_up
  component:
    kind: follow_up
    props:
      prompts: ["Chart this by month", "Which are unmatched?"]
  expect:
    - you could ask
    - "> Chart this by month"
    - "> Which are unmatched?"
