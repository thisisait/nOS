# =============================================================================
# Halyard Studio — synthetic business fixture seed (row fixture-halyard-studio).
#
# A dev shop: projects for clients, tasks typed by the estate's own task_type
# enum, and CI builds per task. The question it exists to ask is "which work
# is green on CI but not deployed", a join over halyard-build and halyard-task.
# The answer key is state/fixtures/halyard-studio/expected.yml (never seeded).
#
# A map keyed by table slug; each value a list of row dicts. Top-to-bottom is
# DEPENDENCY ORDER (a rowRef target appears above its referencer); seed-bundle.yml
# walks the keys in this order. A row's `slug` is its KEAP row id (idempotent
# upsert), so every rowRef value is a target-row slug, never a display string.
#
# SYNTHETIC BY RULE: party slugs start `synthetic-`, emails/web end `.invalid`,
# phones start `+420 000`, tax ids match (CZ)?000001\d\d (Halyard holds 20-29).
# Dates are fixed epoch seconds (UTC) so the seed is byte-deterministic. A build
# without `deployed_at` was never deployed.
# =============================================================================

