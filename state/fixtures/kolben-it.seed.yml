# A map keyed by table slug; each value a list of row dicts. Top-to-bottom is
# DEPENDENCY ORDER (a rowRef target must appear above its referencer) and it
# equals the ORDER in seed-kolben-fixture-tables.yml + the Kolben fixture gate.
#
# ROW IDENTITY: a row's `slug` is its KEAP row id (idempotent upsert), so every
# rowRef VALUE below is a literal target-row slug — never a display string.
#
# SYNTHETIC BY RULE (docs/idea/15, enforced by the Kolben fixture gate): party
# slugs start `synthetic-`, emails/web end `.invalid`, phones start `+420 000`,
# tax ids match (CZ)?000001\d\d. No real Kolben client until an Article-30
# register entry and the company's written yes exist. Dates are fixed epoch
# seconds so the seed is byte-deterministic across a blank + reconverge.
# =============================================================================

