# =============================================================================
# Label-printer fixture — SEED ROWS (w-fixture, docs/idea/15-business-fixture.md)
#
# REAL STRUCTURE, SYNTHETIC PEOPLE. Every person and company in this file is
# invented; every email ends in `.invalid` (RFC 2606 reserved), every phone
# sits in the +420 000 range, every tax identifier is in the 000001xx range no
# registry issues. This is the fixture's one shipped rule, and it is a GATE,
# not a convention: tests/anatomy/test_fixture_tables_declare_the_business.py
# refuses this file the moment a value stops looking synthetic. Real customers
# require the fixture's own Article-30 register entry AND the company's yes in
# writing — the order the design doc calls "the sequence that cannot be
# undone" — and neither exists yet. The 88-record register shipped 2026-08-13
# covers the AGENT ceremonies' processors; it does not cover this data.
#
# ROW IDENTITY: a row's `slug` doubles as its row id in KEAP's agent upsert
# (agent.ts POST /agent/v1/tables/:slug/rows), so rowRef VALUES in this file
# are target-row slugs, literal and stable — a re-seed PATCHes rather than
# duplicates, which is what lets proof 3 of the design doc ("a converge does
# not lose it") be attempted at all.
#
# TABLE ORDER IS DEPENDENCY ORDER — a rowRef's target table (and target rows)
# must exist before the referencing rows land. The seeder walks this file top
# to bottom; the gate refuses a forward reference.
#
# THE SCHEDULE IS DELIBERATELY PINCHED: every job's finishing pass routes
# through the one finisher, so "which jobs miss their deadline if the finisher
# stops" has a non-trivial answer on day one — and a DIFFERENT answer than
# "if the digital press stops", which touches only three of the four jobs.
# Dates are fixed epoch seconds (KEAP `date` kind), so the seed is
# deterministic and the fixture reproducible byte-for-byte.
# =============================================================================

