# state/judge-sets.yml — the judge registry and the named gate sets.
#
# Contract: docs/idea/11-agentic-loop-contract.md §2.1 (DECISION 2).
# Committed to the repo on purpose: a gate set must mean the same thing in CI,
# on the operator's Mac, and in a 03:00 Pulse job. A set defined in runtime
# state drifts per host. This file is itself inside the budget's deny list
# (§5.2) — the loop may not edit its own oracle.
#
# NO JINJA IN THIS FILE — not even inside a comment. It is read by judges.py
# with yaml.safe_load and is not an Ansible vars file; keeping it literal means
# it can never break the play-var eager-resolve path (constraint G).
# A brace-brace or brace-percent sequence is a template expression to Jinja
# WHEREVER it appears: Jinja does not respect YAML comments, so writing one in a
# comment does not make it inert. Same shape as the shell-brace trap in
# constraint F. The gate test_the_registry_is_literal_yaml_with_no_jinja caught
# exactly this sequence in an earlier draft of this header.
#
# EVERY FIELD HERE IS MEASURED, NOT ASSUMED. The measurement transcripts live
# in the contract §0 and were re-run at build time:
#   ansible-lint  → "Passed: 0 failure(s), 0 warning(s) in 1476 files processed
#                    of 3148 encountered."  EXIT=0   (on STDERR, not stdout)
#                    (re-measured 2026-08-06; this header still quoted the
#                    1400/2979 run after min_work moved to 1450 below — a
#                    transcript is evidence only while it matches the tool)
#   genome-codegen → "genome artifacts current (2 checked)"  EXIT=0
#   nos-smoke      → "smoke catalog yielded zero entries"    EXIT=0  ← false green
#   corpus-diff    → returns `3 if removalShaped else 0` under --no-ledger, so
#                    EXIT=0 is reachable while the report says DISAGREE.

version: 1

judges:

  # ── ansible-lint ────────────────────────────────────────────────────────
  # Failure code is 2, NOT 1. A naive `!= 0` check is right by accident; a
  # naive `== 1` check is wrong. Hence pass_exit/fail_exit are explicit and
  # anything outside both lists is INDETERMINATE rather than guessed at.
  ansible-lint:
    argv: ["ansible-lint"]
    adapter: exit_zero
    pass_exit: [0]
    fail_exit: [2]
    deterministic: true
    runtime_s_p95: 55
    timeout_s: 600
    # The terminal line is written to STDERR. work_regex is matched against
    # stdout and stderr combined for exactly this reason.
    work_field: files_processed
    work_regex: "in\\s+(\\d+)\\s+files processed"
    # RATCHET, in the style of BLAST_RADIUS_CEILING: 1476 of 3148 encountered
    # files are actually processed today, and nothing else pins that ratio.
    # Silent scope loss would otherwise read as green.
    min_work: 1450
    mutates_worktree: false
    requires: []
    # §5.1 — this judge's oracle. Forbidden to any proposal judged by a set
    # containing ansible-lint: the rules ARE the verdict, and a proposal that
    # relaxes them passes by construction.
    oracle_paths:
      - ".ansible-lint"
      - ".yamllint"

  # ── genome-codegen --check ──────────────────────────────────────────────
  # The one judge whose failure branch has actually been observed (contract
  # §8.1, re-run at build time in this session).
  genome-codegen:
    argv: ["python3", "tools/genome-codegen.py", "--check"]
    adapter: exit_zero
    pass_exit: [0]
    fail_exit: [1]
    deterministic: true
    runtime_s_p95: 2
    timeout_s: 120
    work_field: artifacts_checked
    work_regex: "\\((\\d+) checked\\)"
    min_work: 2
    mutates_worktree: false
    # M7's mutex is RETIRED HERE (2026-08-20), subsumed by DECISION 2d: every
    # judge of every set runs in its own ephemeral worktree, so the nos_entity.py
    # two runs touch are two files — and this judge's committed argv is --check,
    # which writes nothing. The machine-wide lock guarded nothing and BROKE the
    # engine's own gates: the `repo` set held it around pytest-anatomy while 16
    # gates INSIDE that pytest called run_gate_set on sets containing this judge,
    # found the lock held, and went INDETERMINATE — gate set `repo` could never
    # pass a tree containing the loop's own tests. Measured, proposal 5ea07907.
    # Gate: test_the_engine_judges_its_own_gates.py.
    requires: []
    # §5.1 — the generator, the genome it reads, and BOTH generated targets.
    # A proposal that edits a generated file makes --check red; a proposal that
    # edits the generator makes --check green about the wrong thing.
    oracle_paths:
      - "tools/genome-codegen.py"
      - "state/genome/**"
      - "files/anatomy/module_utils/nos_entity.py"
      - "files/anatomy/face/src/lib/contracts/entity.gen.ts"

  # ── pytest-anatomy ──────────────────────────────────────────────────────
  # Exit 0 covers "all skipped" (M3, re-confirmed at build time:
  # HOME=/tmp/emptyhome … → "2 skipped" EXIT=0). Work is passed+failed;
  # SKIPPED IS NOT WORK, which is what closes that false green.
  pytest-anatomy:
    argv: ["python3", "-m", "pytest", "tests/anatomy", "-q"]
    adapter: pytest_summary
    deterministic: true
    runtime_s_p95: 190
    timeout_s: 900
    work_field: tests_executed
    # RATCHET. MEASURED 2026-08-05 on this tree: "2788 passed, 25 skipped in
    # 228.85s". It was 200 — 12x below reality — which is not a ratchet, it is
    # the absence of one: a run that lost 91% of its collection still cleared
    # it. That is exactly what let a SIGINT'd pytest read as a pass at 454 of
    # 2432. The margin below the measurement absorbs host-conditional skips
    # (skipped is not executed work); it is deliberately small.
    #
    # RE-MEASURED because the ratchet had decayed the other way. The floor was
    # 2400 against a 2026-08-02 measurement of 2456, and the suite grew to 2788
    # without either number moving: a run that lost 14% of its collection
    # cleared the floor, which is the same defect the 12x gap was, arrived at by
    # growth instead of by a guess. The gate that was supposed to hold this
    # compared the two COMMITTED numbers to each other, so it could not see
    # reality move past both. It now re-measures collection
    # (test_the_pytest_ratchet_is_remeasured_against_collection) and goes red
    # when the record falls behind, which forces this line to be re-derived
    # rather than left to age.
    #
    # RE-DERIVED AGAIN 2026-08-06 (2911 passed, 25 skipped): the gate that
    # forces this re-derivation fired for the first time, at 2936 collected
    # against a 2788 record. It works, and it will keep firing as the suite
    # grows — which is the intended cost of not letting a floor age.
    #
    # RE-DERIVED same day, second pass (2943 passed, 26 skipped — the
    # anatomy-graph soundness gate added 19). The collection gate stayed
    # green at this delta; the floor moves anyway, because a floor that only
    # moves under compulsion spends its slack as a budget.
    #
    # RE-DERIVED same day, third pass (2974 passed, 27 skipped — the
    # core-substrate graph gates + the ledger-list gates added 25). Same
    # rule: the record is known stale, so the floor moves without waiting
    # for the collection gate to force it.
    #
    # RE-DERIVED same day, fourth pass (3003 passed, 27 skipped — the
    # doctrine-citation gate + run-now gate + the parent session's
    # cannot-run-says-so gates). The cadence is the point: every commit
    # that grows the suite moves the floor in the same diff.
    #
    # RE-DERIVED 2026-08-07 (3050 passed, 27 skipped — the face form/build
    # axis gate + the face-app harvest refusal, R3). Same cadence, same diff.
    #
    # RE-DERIVED 2026-08-07, R2 (3091 passed, 27 skipped — the service-edge
    # probe's own fixture gates, the layer derivation, and the compiler's
    # enforced_by / misspelled-key refusals). The collection ratchet did NOT
    # fire (3050 → 3091 is inside its 5% allowance); moved anyway, per this
    # file's own rule that a record known to be stale is stale.
    #
    # RE-DERIVED 2026-08-07, R4 (3113 passed, 27 skipped — the genome `axes`
    # facet: one declaration for form/build/layer, the compiler's stamp_axes
    # refusals, and the anchor rename). Collection ratchet did not fire again;
    # moved anyway, same rule, same diff.
    #
    # RE-DERIVED 2026-08-09 (3252 passed, 28 skipped — the truth pass:
    # discovery-scan's prerelease comparison + its 13 gates). The collection
    # ratchet FIRED this time, at 3281 collected against a 3113 record. Note
    # what that means: most of the 139-test gap was grown by commits that did
    # NOT move this line, so the compulsion did the work the cadence was
    # supposed to. The floor moving on its own is cheaper than this.
    #
    # RE-DERIVED 2026-08-12 (3400 passed, 29 skipped — the readiness batch's four
    # new gate files). Collection ratchet FIRED at 3429 vs the 3252 record; floor
    # raised to just below the fresh measurement.
    #
    # RE-DERIVED 2026-08-17 (3548 passed, 33 skipped). Fired again, at 3582
    # collected vs the 3400 record — grown by the apex font gates, the web-root
    # inode gate, the tool-result encoding gate and the bound-loop gate. Same
    # lesson as the entry above and worth repeating: every one of those commits
    # left this line alone, so the ratchet, not the author, kept the floor
    # honest.
    #
    # RE-DERIVED 2026-08-19 (3704 passed, 35 skipped). Fired at 3737 collected
    # vs the 3548 record — grown by the environment-contract batch and the
    # loop bookkeeping gates (driver refresh-in-place, passed-awaiting-act,
    # fixture segregation). Moved by the same commit that grew it, for once.
    #
    # RE-DERIVED 2026-08-20 (3865 passed, 39 skipped). Fired at 3905 collected
    # vs the 3704 record — grown by Secrets P1 and by the day's four gates:
    # selectattr-takes-a-test, the red reader's findings codes, the judge's own
    # both-ends capture, and the custom-module shebang. Moved by the commit that
    # grew it. The cadence this file keeps insisting on is the whole mechanism:
    # a floor that moves only under compulsion has already spent its slack.
    # RE-DERIVED 2026-08-20, second pass (3877 passed, 40 skipped on the
    # operator env; the engine-judges-its-own-gates file added 3). New fact
    # from the first PASSING `repo` verdict: the JUDGE env executes fewer —
    # 3855 at the prior HEAD (its filtered PATH skips more host-conditional
    # gates) — so the floor's real margin is measured against the judge env,
    # not this line's operator number. Floor moves 3850 → 3853, keeping the
    # judge-env margin at ~5, same as the margin that held before.
    # 2026-08-24: operator collection MEASURED at 4085 (was 3877). The judge
    # env's own count is NOT re-measured here — it needs a real loop run — so
    # this floor is INFERRED from the gap that has held all along (operator
    # 3877 / judge 3855 = -22) and set just under it. Say which is which: the
    # 4085 is a reading, the 4060 is arithmetic on a historically stable
    # difference, and the next `repo` verdict is what confirms or corrects it.
    #
    # IT CORRECTED IT. 2026-08-25, three ticks in one morning: the judge env
    # measured work_count=4032, not the ~4063 the arithmetic assumed (gap -53,
    # not -22 — newer gates skew host-conditional). Every verdict wedged into
    # indeterminate, then a one-way door (tools/loop-pr.py, fixed 2026-08-26)
    # kept proposals 18/19/20 out of the queue on the constant, not their merits.
    #
    # THE RULE: derive this floor from the judge env's own readings in
    # `loop_judge_runs` — never operator collection minus an assumed gap.
    # Recorded minimum 4020 (2026-08-24); 3900 sits 120 below it, still
    # catching a ~3% scope shrink. Read the record before moving it:
    #   sqlite3 "file:$HOME/wing/app/data/wing.db?mode=ro" \
    #     "SELECT started_at, work_count, min_work, outcome FROM loop_judge_runs
    #       WHERE judge_name='pytest-anatomy' ORDER BY id DESC LIMIT 10"
    min_work: 4370   # re-measured 2026-08-30: 4425 passed / 4485 collected
    # DECISION 2d: ALWAYS sandboxed, attended and unattended alike.
    # test_genome_contract.py appends HAND_EDITED to a TRACKED file and
    # restores it in a `finally` — a killed run leaves the source corrupted,
    # and being killed is an unattended loop's normal failure mode.
    mutates_worktree: true
    requires: []
    # M7's mutex retired 2026-08-20 with genome-codegen's (see that entry): the
    # per-set sandbox already isolates the mutated file, and holding a machine-
    # wide lock around THIS judge is what starved the loop-engine gates running
    # inside it. The recursion is the design: this judge judges its own tests.
    # §5.1 — the gate bodies AND the harness that decides which of them run.
    # The `gate-add` carve-out (§5a) re-opens `tests/anatomy/**` and NOTHING
    # else here: conftest.py and pytest.ini configure collection, so a proposal
    # editing them is not adding a gate, it is choosing which gates exist.
    # pytest.ini does not exist today; it is listed so the loop cannot CREATE
    # one and set `testpaths` away from the gates it is being judged by.
    oracle_paths:
      - "tests/anatomy/**"
      - "tests/conftest.py"
      - "pytest.ini"

  # ── nos-smoke ───────────────────────────────────────────────────────────
  # Exit is 0 or 1 as of 2026-08-06. This comment said "Exit IS the failure
  # count, capped at 127 — not a boolean" and was true when written; the line
  # below it is where that stopped being so.
  # --no-jsonl is part of the committed argv (DECISION 2e): without it the run
  # appends to ~/.nos/events/smoke.jsonl, OUTSIDE the repo, where `git status`
  # can never reveal it.
  nos-smoke:
    argv: ["python3", "tools/nos-smoke.py", "--no-jsonl"]
    # WAS `exit_count`, when the script encoded its failure count in the exit
    # status. That was the estate's third exit-code convention and it collided
    # with the Pulse runner's reserved 126/127 — a run with 127 dead probes and
    # a binary that never started produced the same integer. The script now
    # answers 0 or 1 and the count is read from stdout by work_regex below,
    # which is where a magnitude belongs: a number about the ESTATE, not about
    # the process. Same vocabulary as every other judge here.
    adapter: exit_zero
    pass_exit: [0]
    fail_exit: [1]
    deterministic: false
    runtime_s_p95: 3
    timeout_s: 300
    work_field: probes_run
    work_regex: "(\\d+)\\s*/\\s*(\\d+)\\s+OK"
    work_regex_group: 2
    # RATCHET = the committed catalog's own entry count. At 1 the M2 shape was
    # only half closed: literal zero was caught, and a catalog that shrank to a
    # single probe passed. The runner layers the manifest auto-import on top of
    # these (live runs measure ~48), so this is a floor on the curated part
    # only — the part a proposal could delete. Pinned against
    # state/smoke-catalog.yml by test_the_ratchets_match_measured_reality;
    # that catalog is this judge's own oracle, so the loop cannot lower both.
    # 10 -> 9 on 2026-08-12: traefik-routers-count removed — the :8082 API
    # surface it probed was closed (api.insecure:false); one fewer curated entry.
    min_work: 9
    mutates_worktree: false
    requires: ["live_estate"]
    # §5.1 — the prober and the catalog it reads. Removing an entry from the
    # catalog is the M2 false green (zero entries, EXIT=0) authored on purpose.
    oracle_paths:
      - "tools/nos-smoke.py"
      - "state/smoke-catalog.yml"

  # ── cortex-corpus-diff ──────────────────────────────────────────────────
  # THE EXIT CODE IS NOT THE VERDICT: under --no-ledger it returns
  # `3 if removalShaped else 0`, so a DISAGREE report exits 0. The verdict is
  # the .agrees field of the JSON report.
  # --no-ledger --json are part of the committed argv (DECISION 2e): without
  # them the run advances or zeroes agreeStreak, may page the operator via A9,
  # and may run --halt-cmd, stopping the organ's fs-sync. A judge that can page
  # the operator and halt an organ is not a judge.
  # On the "cortex unreachable" path it prints NO json and returns 0 — the
  # json_field adapter finds nothing to read and reports INDETERMINATE, which
  # is what corrects the script's own `night VOID → 0`.
  cortex-corpus-diff:
    argv: ["python3", "files/anatomy/scripts/cortex-corpus-diff.py", "--no-ledger", "--json"]
    adapter: json_field
    json_field: agrees
    deterministic: false
    runtime_s_p95: 3
    timeout_s: 300
    work_field: tables_compared
    work_json_field: tables
    min_work: 1
    mutates_worktree: false
    requires: ["keap_token_ro", "cortex_token_ro"]
    # §5.1 — the differ itself. Its own --halt-cmd / A9 wiring is why it may
    # only ever run with --no-ledger --json (DECISION 2e), and a proposal that
    # edits the script could restore either.
    oracle_paths:
      - "files/anatomy/scripts/cortex-corpus-diff.py"

# keap-lint is DELIBERATELY ABSENT (DECISION 2f). It needs a RW token, POSTs
# /agent/v1/lint/run which reconciles state, fans results into A9, and its
# exit 0 means "ran", not "clean". That is a scheduled maintenance job with an
# alerting side effect, not a deterministic oracle. Admitting it would give the
# loop a judge that mutates the thing being measured.

gate_sets:
  fast:
    judges: ["ansible-lint", "genome-codegen"]
    unattended: true
  repo:
    judges: ["ansible-lint", "genome-codegen", "pytest-anatomy"]
    unattended: true
  live:
    judges: ["nos-smoke", "cortex-corpus-diff"]
    unattended: true
  full:
    judges: ["ansible-lint", "genome-codegen", "pytest-anatomy", "nos-smoke", "cortex-corpus-diff"]
    unattended: false
