# The lexicon: one meaning per word. nOS names its parts after a living body,
# and a word that means two things lets a newly arrived model learn the wrong one.
# Rulings accepted by the operator 2026-10-06 (roadmap row `lexicon`).
# Rendered to docs/glossary.md by tools/genome-codegen.py.
# Gate: tests/anatomy/test_lexicon_holds.py.
#
# level    one of `order` below. The body levels come first, smallest to largest.
# names    typed surfaces where the word lives today; each must exist:
#            path | yaml_key (file#dotted.key, * = any key or list item) |
#            config_key (a committed default, whichever config layer holds it) |
#            graph_kind | manifest_field | launchd_label | anchor_prefix
#          A graph_kind carries a one-line `reason`; it is the ONE kind → level
#          map (tools/body-plan-gen.py reads it). Its class is the word's level,
#          or the word itself when the level is `cross`. A yaml_key may pin `values`.
# proposed true when the word is new and the operator has not yet ruled it.
# not      words it must not be confused with.
# counter_example  one thing a reader could take for this word and that is not
#            it (ssot/doctrine/body-plan.md §7); legacy and proper names owe none.
# no_surface_reason  why a word has no `names` (one sentence), instead of a surface.
# mechanism  the mechanical word that says it better. Its own field, not a `not:`
#            entry: `not:` keeps nOS words apart; a mechanism is a sibling to cite.
# retired  senses the word no longer carries: {sense, replacement, surfaces};
#            each surface must be gone (today's are pending in the gate).
# debt     code the word does not own yet still holds: {says, row, paths}; the
#            word's own gate keeps `paths` true (rendered to the glossary).
# retired_phrases  exact phrases a model must not be taught; matched only in
#            the tracked files models are told to trust (briefs, doctrine, docs,
#            skills, agents, plugins, state tables, the default config layers,
#            tool and gate docstrings; the gate's TRUSTED list), never history.

version: 1

order:
  - genome
  - cell
  - tissue
  - organ
  - organ system
  - organism
  - habitat
  - cross
  - internal
  - procedure
  - proper-name
  - legacy

words:
  # ── the body levels, smallest to largest ────────────────────────────────
  genome:
    level: genome
    means: The declared facts every part of nOS inherits, kept in state/genome/.
    names:
      - path: state/genome/
      - yaml_key: "ssot/INDEX.yml#realms.genome"
      - graph_kind: tasktype
        reason: a declared work contract every part inherits; a cell expresses it via may_take
      - graph_kind: skill
        reason: a declared procedure contract every part inherits
    not: [law, definition]
    counter_example: "a cell's system.md (its definition, not something every part inherits)"
    retired:
      - sense: "DNA of the inner organism (prompts, skills, CLAUDE.md, allow-lists)"
        replacement: "law for the shared parts; definition for one cell's prompt and allow-list"
        surfaces: []
    retired_phrases: ["DNA of the inner organism"]

  gene:
    level: genome
    means: One declared kind of entity in the genome.
    names:
      - path: state/genome/genes/
    not: [plugin]
    counter_example: "one DataTable row (data a gene shapes, not a gene)"

  cell:
    level: cell
    means: One model in one specialization; in code it is called an agent.
    names:
      - graph_kind: agent
        reason: one model in one specialization (its charter, tools and backend)
      - path: files/anatomy/agents/
    not: [sense, stem cell, "AWS/Slack cell (an isolated full-stack replica)"]
    counter_example: "an immune indicator (a sense)"
    retired:
      - sense: "an immune indicator called a cell"
        replacement: "sense (an indicator is a sense with an indicator contract)"
        surfaces: []
    retired_phrases: ["indicators are cells", "indicators as cells", "cell contract", "cell kinds"]

  stem cell:
    level: cell
    means: A model that has not yet differentiated into one specialization.
    no_surface_reason: every agent in files/anatomy/agents/ has one charter today, so none is a stem cell.
    not: [cell]
    counter_example: "jeff, a broad assistant that still has one charter (a cell)"

  definition:
    level: cell
    means: One cell's own prompt and tool allow-list, versioned and hashed.
    names:
      - yaml_key: "files/anatomy/agents/jeff/agent.yml#system_prompt_path"
      - yaml_key: "files/anatomy/agents/jeff/agent.yml#tools"
    not: [genome, law]
    counter_example: "the model pin in agent.yml (which model runs the cell, not its prompt or allow-list)"
    retired:
      - sense: "the `dna` field of the indicator contract"
        replacement: definition
        surfaces: []
    retired_phrases: ["dna"]

  tissue:
    level: tissue
    means: The transplantable pack of one specialization's cells with their skills, tables and services.
    names:
      - graph_kind: tissue
        reason: one manifest gathering a specialization's existing cells, skills, tables, services and reflexes
      - path: state/tissues/
    not: [plugin, organ]
    mechanism: bounded context (domain-driven design)
    counter_example: "a plugin (wiring, not a specialization)"
    retired:
      - sense: "praxis pack / backoffice pack"
        replacement: tissue
        surfaces: []
      - sense: "plugins as connective tissue, tendons or vessels"
        replacement: plugin wiring
        surfaces: []
    retired_phrases: ["praxis pack", "backoffice pack", "connective tissue", "tendon", "vessel"]

  organ:
    level: organ
    means: One service or host daemon with one job; one row in state/manifest.yml.
    names:
      - manifest_field: id
      - graph_kind: service
        reason: one service with one job, one state/manifest.yml row
      - graph_kind: daemon
        reason: one host launchd daemon with one job
      - graph_kind: repo
        reason: >-
          ruled 2026-10-06: a git surface an organ hosts (hosted_by); github-origin
          is the one true outside surface, noted, not split
      - graph_kind: faceapp
        reason: >-
          ruled 2026-10-06: a face app is one job of the face organ (its edges to the
          face service stay)
    not: [organ system, cell, digest]
    counter_example: "a Pulse job (a reflex of the Pulse organ)"
    retired:
      - sense: "a public apex group called an organ"
        replacement: organ system
        surfaces:
          - yaml_key: "files/anatomy/apex/ruling.yml#organs"
      - sense: "organ meaning host-native (runs under launchd or systemd)"
        replacement: "the stack axis: stack is null"
        surfaces: []
      - sense: "a model called an organ"
        replacement: cell
        surfaces: []
      - sense: "organ meaning nOS's own parts as opposed to vendor software"
        replacement: self organ
        surfaces: []
    retired_phrases: ["models are organs", "organs of a first organism", "public organ"]

  organ system:
    level: organ system
    means: >-
      A public group of organs serving one function; the apex page shows thirteen.
      Its source is the apex ruling's `organ_systems:` key.
    names:
      - yaml_key: "files/anatomy/apex/ruling.yml#organ_systems"
      - graph_kind: organ_system
        reason: one public group of organs from the signed apex ruling's `organ_systems:` key
    not: [organ, organism]
    counter_example: "a compose stack such as iiab (a deployment group, not a public function)"

  organism:
    level: organism
    means: One nOS install on one machine, all its organ systems together.
    no_surface_reason: no file or node stands for the whole install; the whole is the anatomy graph (tools/body.py says so).
    not: [habitat, anatomy]
    counter_example: "the anatomy graph (a drawing of the organism, not the organism)"
    retired_phrases: ["the organism is alive"]

  habitat:
    level: habitat
    means: >-
      The machine and what lives beside the organism: its software by origin
      (self / symbiont / habitat). Software of origin habitat belongs to the
      machine's owner, and nOS never installs or touches it. Ruled 2026-10-06: the
      git forges nOS hosts itself are not habitat (they are organ jobs); the LLM
      backends nOS's cells call are habitat, third-party processors beside it.
    names:
      - graph_kind: backend
        reason: an LLM backend row of state/llm-backends.yml, a third-party processor beside the organism
      - config_key: software_owner
        values: [self, symbiont, habitat]
    not: [organism, symbiont]
    counter_example: "the Gitea or GitLab nOS hosts (organ jobs, not habitat)"
    retired:
      - sense: "host, as the third owner class of software"
        replacement: habitat
        surfaces: []

  # ── across levels ───────────────────────────────────────────────────────
  self:
    level: cross
    # Operator ruling 2026-10-06, provisional: calls, not wrote (vendor formulae count).
    means: >-
      Software nOS calls, pins and updates itself, vendor formulae included; a self
      organ is one of nOS's own parts. Provisional — a deeper sense (versions as a
      lineage, old ones die, new ones are born) is being designed, roadmap row self-definition.
    names:
      - config_key: software_owner
    not: [declared, symbiont]
    counter_example: "OpenHuman, declared and installed by nOS but neither pinned nor updated by it (its vendor updates it: a symbiont)"
    retired:
      - sense: "self meaning the immune system's tolerated set"
        replacement: declared
        surfaces: []
    retired_phrases: ["non-self", "attacking self"]

  symbiont:
    level: cross
    means: Declared foreign software that lives beside nOS and is updated by its own vendor.
    names:
      - config_key: software_owner
    not: [self, habitat]
    counter_example: "a personal Homebrew package (habitat: the machine owner's, never installed by nOS)"

  declared:
    level: cross
    means: On the list nOS generates from its declarations; the immune system tolerates it, and anything undeclared is a signal.
    names:
      - path: tools/undeclared-status.py
    not: [self]
    counter_example: "a launchd job the operator loaded by hand (undeclared until a declaration explains it, however harmless)"

  sense:
    level: cross
    means: A reader or judge that only reads; an immune indicator is a sense with an indicator contract.
    names:
      - graph_kind: reader
        reason: a tools/README.md §Readers script that asks the estate what is true
      - graph_kind: tool_ro
        reason: an agent tool grant whose every scope is `.read` (tools/agent-capability.py)
      - graph_kind: token_ro
        reason: a judge capability whose own name declares it read-only (`_ro`)
      - graph_kind: judge
        reason: a gate command that reads a change and returns a verdict; it does not act
      - graph_kind: weakness
        reason: a Bone reader whose findings become loop proposals
      - path: tools/README.md
      - yaml_key: "files/anatomy/apex/ruling.yml#organ_systems.senses"
    not: [cell, limb]
    counter_example: "tools/genome-codegen.py (it writes the glossary; only its --check reads)"

  limb:
    level: cross
    means: A tool that acts.
    names:
      - graph_kind: tool
        reason: an agent tool grant that acts — it opens a write scope, or declares none
      - graph_kind: token
        reason: a judge capability whose name does not declare it read-only
    not: [sense, side]
    mechanism: port / adapter (hexagonal architecture)
    counter_example: "an agent tool grant whose every scope is .read (a sense)"
    retired:
      - sense: "limb as the apex page's left/right/core column key"
        replacement: side
        surfaces:
          - yaml_key: "files/anatomy/apex/ruling.yml#organ_systems.*.limb"

  memory:
    level: cross
    means: What nOS has learned, kept in KEAP; RAM stays plain English.
    names:
      - path: roles/pazny.keap/
      - graph_kind: table
        reason: a KEAP DataTable definition, what the estate records and learns
    not: [cortex, verdicts, stores]
    counter_example: "Wing's audit ledger (a record of what happened, not what nOS learned)"
    retired:
      - sense: "The Memory, the apex group of databases"
        replacement: The Stores
        surfaces:
          - yaml_key: "files/anatomy/apex/ruling.yml#organ_systems.memory"
      - sense: "memory meaning the immune system's verdict log"
        replacement: verdicts
        surfaces: []

  verdicts:
    level: cross
    means: The log of what each sense reported and what the operator judged.
    no_surface_reason: each indicator's contract names its own verdicts file (immune-system.md §2); no shared log exists yet.
    not: [memory]
    counter_example: "KEAP (memory: what nOS learned, not what a sense reported)"
    retired_phrases: ["immune memory", "memory — the verdict log", "memory | where each verdict"]

  law:
    level: cross
    means: The rules in force, kept in ssot/doctrine/ and kept apart from the genome.
    names:
      - path: ssot/doctrine/
      - yaml_key: "ssot/INDEX.yml#realms.doctrine"
      - graph_kind: doctrine
        reason: a cited constitution paragraph, an inherited rule
      - graph_kind: article
        reason: an in-force constitution article (the ssot/INDEX.yml doctrine realm)
    not: [genome, definition]
    counter_example: "the genome's entity schema (declared facts, not rules in force)"
    retired_phrases: ["settled law", "this file is the law", "doctrine locked", "authoritative doc"]

  reflex:
    level: cross
    means: An automatic, scheduled response of an organ; Pulse runs each one on its clock.
    names:
      - graph_kind: pulse
        reason: one scheduled job, run by the Pulse daemon on its own cron
      - yaml_key: "files/anatomy/apex/ruling.yml#organ_systems.reflexes"
    not: [Pulse, heartbeat, organ]
    mechanism: "a scheduled job (cron); where it restarts what failed, a supervisor (Erlang/OTP)"
    counter_example: "a launchd daemon (an organ, not a scheduled response)"

  internal:
    level: internal
    means: Real plumbing that is not a body part; the body plan hides it by default.
    names:
      - graph_kind: gateset
        reason: a named bundle of judges; the judges themselves are the senses
      - graph_kind: authentik
        reason: an SSO client object inside Authentik, not an actor
      - graph_kind: tofu
        reason: an OpenTofu state root, declarative plumbing behind Authentik
      - graph_kind: lock
        reason: a mutex claims are drawn against; exclusion is plumbing, not a body part
    not: [organ, sense]
    counter_example: "the Authentik service (an organ); only an SSO client object inside it is internal"

  heartbeat:
    level: cross
    means: A periodic signal that proves something is still alive.
    names:
      - path: files/heartbeat/heartbeat.py
      - launchd_label: eu.thisisait.nos.heartbeat
    not: [Pulse]
    mechanism: a liveness signal; monitor / link (Erlang/OTP)
    counter_example: "a health check (asked from outside; a heartbeat is sent from inside on a clock)"
    retired:
      - sense: "Pulse called the heartbeat"
        replacement: "Pulse, which is the scheduler"
        surfaces: []
    retired_phrases: ["Pulse is the heartbeat", "Pulse heartbeat"]

  nervous system:
    level: cross
    means: The path events take to the operator, from events to the Wing inbox to ntfy or mail.
    names:
      - path: files/anatomy/wing/app/Presenters/InboxPresenter.php
      - path: roles/pazny.ntfy/
    not: [converge]
    counter_example: "a converge (one playbook run, not the path events take)"
    retired:
      - sense: "the playbook called the nervous system"
        replacement: converge
        surfaces: []
    retired_phrases: ["the playbook is the nervous system"]

  twin:
    level: cross
    means: The second Mac.
    no_surface_reason: the second Mac is a machine, not a file; nothing in the repo declares it yet.
    not: [mirror-parity]
    counter_example: "a coexistence track (a second copy of one service on the same Mac)"
    retired:
      - sense: "twin for two lists that must stay equal (twin-parity)"
        replacement: mirror-parity
        surfaces: []
    retired_phrases: ["twin-parity", "twin parity"]

  plugin:
    level: cross
    means: A plugin.yml declaring how one service is wired to the others (SSO, dashboards, jobs).
    names:
      - path: files/anatomy/plugins/
      - path: tests/anatomy/test_a_plugin_loads_when_its_role_runs.py
    not: [tissue, gene]
    counter_example: "an apps/<name>.yml manifest app (it deploys a service; a plugin only wires one)"

  anatomy:
    level: cross
    means: The structure of one organism drawn as a graph.
    names:
      - path: state/anatomy-graph.json
      - path: tools/anatomy-graph-gen.py
    not: [body plan]
    counter_example: "state/body-plan.json (the anatomy projected onto levels, not the graph)"

  body plan:
    level: cross
    means: The anatomy projected onto the levels above; each graph kind's level is read from state/genome/lexicon.yml.
    names:
      - path: state/body-plan.json
      - path: tools/body-plan-gen.py
      - path: tools/body.py
    not: [anatomy]
    counter_example: "state/anatomy-graph.json (the anatomy itself; the body plan is its projection)"
    retired:
      - sense: "a second kind-to-level map beside the lexicon"
        replacement: "the graph_kind names in state/genome/lexicon.yml"
        surfaces:
          - path: state/body-levels.yml

  appendage:
    level: cross
    means: >-
      An organ attached through one declared joint (a cross-repo contract: spec,
      fixture, symmetric gates), with its own code and licence, which no core organ
      depends on or imports; the organism survives its loss. A property of an organ,
      not a level.
    names:
      - manifest_field: joint_pending
      - yaml_key: "state/schema/manifest.schema.json#definitions.service.properties.joint"
      - path: ssot/doctrine/cross-repo-contracts.md
    not: [tissue, symbiont, organ system, twin, limb, KEAP]
    counter_example: "KEAP: has a cross-repo contract and the core depends on it"

  # ── procedures ──────────────────────────────────────────────────────────
  digest:
    level: procedure
    means: The intake process that turns outside data into DataTable rows; mail digest and hash digest are allowed compounds.
    names:
      - path: tools/digest-import.py
      - path: state/digest-constitution.yml
      - path: files/anatomy/module_utils/nos_digest.py
    not: [organ]
    counter_example: "a sha256 digest (a hash, an allowed compound, not the intake)"
    retired:
      - sense: "the digest organ, the stomach"
        replacement: digest
        surfaces: []
    retired_phrases: ["digest organ", "stomach", "gut"]

  converge:
    level: procedure
    means: One playbook run that moves the source into the running system.
    names:
      - path: main.yml
    not: [nervous system]
    mechanism: a reconcile loop (a Kubernetes operator) — declared against observed; it does not heal
    counter_example: "a hand `docker compose up` (it moves one container, not the declared source)"
    retired_phrases: ["self-healing", "heals itself", "self-heal", "auto-heal"]

  imprint:
    level: procedure
    means: The one page a newborn model reads first.
    names:
      - path: tools/apgar.py
    not: [cell]
    counter_example: "CLAUDE.md (the brief for an assistant working in the repo, not a newborn's first page)"

  apgar:
    level: procedure
    means: The score of a newborn model on the questions its imprint should answer.
    names:
      - path: tools/apgar.py
      - path: state/apgar.yml
    not: [cell]
    counter_example: "a pytest gate (it scores the repo, not a newborn model's answers)"

  # ── proper names: one job each, the metaphor no longer justifies them ───
  Bone:
    level: proper-name
    means: The host API bridge between the runs and the records.
    names:
      - path: roles/pazny.bone/
      - launchd_label: eu.thisisait.nos.bone
    retired:
      - sense: "bones-and-wings for the host organs together"
        replacement: "the host organs"
        surfaces: []
    retired_phrases: ["bones-and-wings"]
  Wing:
    level: proper-name
    means: The host dashboard and audit ledger.
    names:
      - path: roles/pazny.wing/
  Pulse:
    level: proper-name
    means: The scheduler that runs every scheduled job.
    names:
      - path: roles/pazny.pulse/
    not: [heartbeat]
  Cortex:
    level: proper-name
    means: The reasoning machinery (the cortex daemon, cortex-lang and Wing's executor); it is not KEAP.
    names:
      - path: roles/pazny.cortex/
      - path: files/anatomy/cortex/server/cortex-lang.ts
      - path: files/anatomy/wing/app/Cortex/
    not: [memory, KEAP]
    # Ruling 2026-10-07 (option b); gate: tests/anatomy/test_cortex_store_is_declared_debt.py.
    debt:
      says: >-
        The store inside Cortex is transitional: the Cortex corpus (a replica of memory
        held for the onto1 digest) with its libsql store, fs-sync, embeddings and ANN index.
        KEAP is memory; the store leaves Cortex after v0.17, and no new store code lands here
      row: cortex-corpus-ruling
      paths:
        - files/anatomy/cortex/knowledge/
        - files/anatomy/cortex/server/cortex-ann.ts
        - files/anatomy/cortex/server/cortex-config.ts
        - files/anatomy/cortex/server/cortex-fs-cli.ts
        - files/anatomy/cortex/server/cortex-fs.ts
        - files/anatomy/cortex/server/cortex-store-cli.ts
        - files/anatomy/cortex/server/cortex-store.test.ts
        - files/anatomy/cortex/server/cortex-store.ts
        - files/anatomy/cortex/server/embeddings.ts
        - files/anatomy/cortex/server/fs-roots.test.ts
        - files/anatomy/cortex/server/fs-roots.ts
        - files/anatomy/cortex/server/fs-sync.test.ts
        - files/anatomy/cortex/server/fs-sync.ts
        - files/anatomy/cortex/server/intake.test.ts
        - files/anatomy/cortex/server/intake.ts
        - files/anatomy/cortex/server/objects.ts
        - files/anatomy/cortex/server/search.ts
        - files/anatomy/cortex/server/uid.ts
    retired:
      - sense: "Cortex remembers (holds memory) as well as reasons"
        replacement: "Cortex reasons; KEAP is memory"
        surfaces: []
      - sense: "cortex-query, recall from KEAP"
        replacement: "keap-recall"
        surfaces:
          - path: tools/cortex-query.py
          - path: files/anatomy/skills/cortex-query/
          - path: tests/fixtures/cortex-query-recall.json
      - sense: "KEAP called the cortex (a cortex store, cortex objects)"
        replacement: "KEAP, where nOS keeps its memory"
        surfaces: []
    retired_phrases: ["cortex-query", "KEAP cortex", "cortex (KEAP)", "the nOS cortex",
                      "cortex of the nOS anatomy", "cortex store", "cortex object",
                      "remembers and reasons"]
  Face:
    level: proper-name
    means: The web desktop.
    names:
      - path: roles/pazny.face/
  Ears:
    level: proper-name
    means: The speech organ, which hears and speaks.
    names:
      - path: roles/pazny.ears/
  Apex:
    level: proper-name
    means: The public page that shows the organ systems to strangers.
    names:
      - path: roles/pazny.apex/
  KEAP:
    level: proper-name
    means: The knowledge store where nOS keeps its memory.
    names:
      - path: roles/pazny.keap/
    not: [Cortex]
  AgentKit:
    # A rename is pending the operator's ruling (roadmap row organelles-not-agentkit); not planned here.
    level: proper-name
    means: The audit-first runtime inside Wing that runs the cells (agents).
    names:
      - path: files/anatomy/wing/app/AgentKit/
    not: [cell, tissue, Wing]
    counter_example: "a cell such as jeff (AgentKit runs it; the cell is the model in its specialization)"

  # ── left alone and written down once ────────────────────────────────────
  iiab:
    level: legacy
    means: An old compose stack name, still used by about two dozen services.
    names:
      - yaml_key: "state/manifest.yml#services.*.stack"
  files/anatomy/:
    level: legacy
    means: The source tree of nOS's own parts; the directory name stays.
    names:
      - path: files/anatomy/
  tests/anatomy/:
    level: legacy
    means: The offline gates; the directory name stays.
    names:
      - path: tests/anatomy/
  bone_* / WING_* / eu.thisisait.nos.*:
    level: legacy
    means: Config, environment and launchd label prefixes; they stay as spelled.
    names:
      - yaml_key: "state/manifest.yml#nos.launchd_prefix"
      - path: roles/pazny.wing/templates/wing.env.j2
  nos.host.*:
    level: legacy
    means: KEAP anchors for host-native organs; they stay.
    names:
      - anchor_prefix: nos.host.
  pulse (graph kind):
    level: legacy
    means: The anatomy graph's kind name for a reflex (one scheduled job), not the Pulse organ; the kind name stays.
  heartbeat_* / mail_digest_*:
    level: legacy
    means: Config keys for the fleet heartbeat and the daily mail digest; they stay.
    names:
      - config_key: heartbeat_interval
      - config_key: mail_digest_cron

  # ── retired entirely ────────────────────────────────────────────────────
  brain:
    level: legacy
    means: Not used. KEAP is memory, the host parts are organs, the Wing API token is a flat token.
    retired:
      - sense: "brain for KEAP, the four host parts or the Wing API token"
        replacement: "memory / organs / flat token"
        surfaces:
          - path: tests/anatomy/test_backup_reaches_the_brain.py
    retired_phrases: ["brain token", "four brains", "fourth brain", "fifth brain", "layer of the brain"]
  spine:
    level: legacy
