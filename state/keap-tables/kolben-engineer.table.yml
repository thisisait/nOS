# =============================================================================
# KEAP DataTable — "Kolben IT · Engineer" (business fixture, docs/idea/15).
#
# Kolben IT s.r.o. is a synthetic small Czech IT-services shop — the SECOND
# business fixture after the label printer, and the first whose core object is
# a TICKET with an SLA deadline (the "what changes at 14:00" shape, one level
# up from a print job). Engineers are the internal staff a ticket is assigned
# to. Synthetic people by the fixture's one rule (docs/idea/15) — no real
# person is an nOS test fixture until an Article-30 entry + written yes exist.
# =============================================================================
title: "Kolben IT · Engineer"
description: >-
  Internal engineering staff at the synthetic Kolben IT fixture. Assignees of
  tickets and authors of time entries. Synthetic people (docs/idea/15).
driver: libsql
visibility: tier-managers
schema:
  columns:
    - { key: slug,  label: "Slug",  kind: text,   role: dimension, required: true, concept: identity.slug }
    - { key: name,  label: "Name",  kind: text,   role: dimension, required: true, concept: identity.name }
    - { key: role,  label: "Role",  kind: select, role: dimension, required: true, concept: class.kind,
        options: ["developer", "ops", "lead", "support"] }
