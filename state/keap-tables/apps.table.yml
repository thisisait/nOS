# =============================================================================
# KEAP DataTable definition — "Apps" (the nOS application catalog)
#
# LeanIX-style Enterprise-Architecture fact-sheet for AGENT-GENERATED nOS apps.
# Source-of-truth lives here in nOS code; a seeder (playbook task / AgentKit
# harness) creates the table in KEAP via POST /api/tables and upserts one row
# per app via POST /api/tables/:id/rows. Each row anchors into the KEAP universe
# (taxonomy_ref → a body orbiting the "nOS / Applications" star) and carries a
# 768-dim embedding of `description` for free local semantic search ("brain").
#
# Contract: nos-keap shared/contracts/table.ts (createTableRequestSchema).
# Driver: libsql (SQLite) — per owner direction "DataTable(Store) je klíčový".
# The nOS-face "Apps" desktop icon is a mini UI over this table: per-row
# enable/disable (status), add-to-desktop (on_desktop), and edit-description
# (re-embeds for brain search).
# =============================================================================

title: "Apps"
description: >-
  Catalog of nOS applications — agent-generated business apps + face-native
  utils. LeanIX-style fact sheet: lifecycle, criticality, tier, organs used,
  and graph relationships, all queryable and rendered in /explore.
driver: libsql
visibility: tier-users            # every authenticated user sees the catalog
# Taxonomy anchor(s) — the star this table's card orbits. Resolved by the seeder
# to the real node id under the nOS self-model constellation ("nOS / Applications").
anchors: ["nos.applications"]

schema:
  columns:
    # ── identity ─────────────────────────────────────────────────────────────
    - { key: name,        label: "Name",              kind: text,   role: dimension, required: true }
    - { key: slug,        label: "Slug",              kind: text,   role: dimension, required: true }
    - { key: description, label: "Description",       kind: text,   role: attribute }
    # 768-dim nomic-embed-text vector of `description` — the brain-embedding.
    - { key: embedding,   label: "Embedding",         kind: vector, role: attribute, dim: 768 }

    # ── classification (LeanIX fact-sheet dimensions) ─────────────────────────
    # face-app complexity tier (docs/doctrine/face-app-tiers.md) — selects the
    # app-gen agent's system-prompt profile.
    - { key: app_tier,    label: "App tier",          kind: select, role: dimension,
        options: ["F1", "F2", "F3", "F4", "H"] }
    - { key: rbac_tier,   label: "RBAC tier",         kind: select, role: dimension,
        options: ["tier-1", "tier-2", "tier-3", "tier-4"] }
    - { key: category,    label: "Business capability", kind: text, role: dimension }
    - { key: tenant,      label: "Tenant",            kind: text,   role: dimension }
    - { key: has_ui,      label: "Has UI",            kind: boolean, role: dimension }

    # ── lifecycle & health (LeanIX) ───────────────────────────────────────────
    - { key: status,      label: "Status",            kind: select, role: dimension,
        options: ["draft", "enabled", "disabled", "archived"] }
    - { key: lifecycle,   label: "Lifecycle",         kind: select, role: dimension,
        options: ["plan", "phase_in", "active", "phase_out", "end_of_life"] }
    - { key: business_criticality, label: "Criticality", kind: select, role: dimension,
        options: ["low", "medium", "high", "mission_critical"] }

    # ── face presentation (drives the nOS-face desktop) ───────────────────────
    - { key: on_desktop,  label: "On desktop",        kind: boolean, role: attribute }
    - { key: icon,        label: "Icon",              kind: text,    role: attribute }
    - { key: entry_url,   label: "Launch URL",        kind: text,    role: attribute }

    # ── provenance & build artifacts ──────────────────────────────────────────
    - { key: repo_url,       label: "Submodule repo",  kind: text, role: attribute }
    - { key: manifest_path,  label: "Manifest",        kind: text, role: attribute }
    - { key: generated_by,   label: "Generated by",    kind: text, role: attribute }
    - { key: owner,          label: "Owner",           kind: user, role: attribute }

    # ── relationships / IT-components (LeanIX graph) ──────────────────────────
    # nOS organs the app consumes (secrets, ci, euro-office, email, 2fa, db,
    # n8n, node-red, agentkit, vfs, user-state …).
    - { key: organs,        label: "Organs used",      kind: json, role: attribute }
    # DBs / schemas the app owns (F2+): [{engine, name}]
    - { key: data_stores,   label: "Data stores",      kind: json, role: attribute }
    # Other apps/systems it depends on (edges into the universe graph).
    - { key: dependencies,  label: "Dependencies",     kind: json, role: attribute }

    # ── universe anchor ───────────────────────────────────────────────────────
    # Anchors THIS app row to its business-capability taxonomy node so it renders
    # as a station/body orbiting that star in /explore.
    - { key: taxonomy_ref,  label: "Anchor",           kind: taxonomyRef, role: attribute }
