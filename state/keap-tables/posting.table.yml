# =============================================================================
# KEAP DataTable — "Postings" (accounting knowledge graph — the ledger lines).
#
# One debit or credit line. `entry` rowRefs the journal entry it belongs to
# (restrict, the balancing group); `account` rowRefs the account it hits
# (restrict). `amount` is always POSITIVE — the side is `direction`, never a
# signed amount (nos_accounting.entry_balances refuses a negative). An entry's
# postings must sum debit==credit (the double-entry invariant).
# =============================================================================
title: "Postings"
description: >-
  Ledger lines — each a debit or credit of a positive amount against one account,
  belonging to a journal entry that must balance. The atoms the double-entry
  invariant checks.
driver: libsql
anchors: ["nos.accounting"]
visibility: tier-managers
schema:
  columns:
    - { key: slug,      label: "Slug",      kind: text,   role: dimension, required: true, concept: identity.slug }
    - { key: entry,     label: "Entry",     kind: rowRef, role: dimension, required: true,
        refTable: "journal-entry", refDisplay: "slug", onDelete: "restrict", concept: graph.parent }
    - { key: account,   label: "Account",   kind: rowRef, role: dimension, required: true,
        refTable: "account", refDisplay: "name", onDelete: "restrict" }
    - { key: direction, label: "Direction", kind: select, role: dimension, required: true, concept: class.kind,
        options: ["debit", "credit"] }
    - { key: amount,    label: "Amount",    kind: number, role: attribute }
