# =============================================================================
# KEAP DataTable — party registry status (ARES + unreliable VAT payer).
#
# Facet of the party spine, not a column on party and not a Dolibarr table.
# Daily n8n Schedule overwrites the same slug (reg-ico-<8digit>) — this is a CHECK,
# so absorb's skip-existing door is the wrong writer (that freeze is for
# booked facts). Clock: n8n Schedule. Watch: Pulse n8n-exec-watch. Writer: n8n Upsert DTT.
#
# ARES = "is this IČO a living ekonomický subjekt?". ADIS (GFŘ) =
# nespolehlivý plátce DPH. They are two government services; ARES DIČ is
# not the reliability flag.
# =============================================================================
title: "Party registry status"
description: >-
  Latest ARES existence check and MFČR unreliable-VAT-payer status per
  Czech IČO on the party spine. One row per IČO, overwritten on each run.
driver: libsql
visibility: tier-managers
anchors: ["nos.digest.party-registry-status"]
graph:
  mode: rows
  node: { idColumn: slug, labelColumn: ico, kind: party-registry-status }
schema:
  columns:
    - { key: slug,             label: "Slug",              kind: text,   role: dimension, required: true, concept: identity.slug }
    - { key: party,            label: "Party",             kind: rowRef, role: dimension, required: true,
        refTable: "party", refDisplay: "legal_name", onDelete: "restrict", concept: graph.parent }
    - { key: ico,              label: "IČO",               kind: text,   role: dimension, required: true }
    - { key: ares_found,       label: "In ARES",           kind: boolean, role: attribute }
    - { key: legal_name_ares,  label: "ARES legal name",   kind: text,   role: attribute, concept: identity.name }
    - { key: dic,              label: "DIČ",               kind: text,   role: attribute }
    - { key: vat_reliability,  label: "VAT reliability",   kind: select, role: dimension, required: true, concept: lifecycle.status,
        options: ["reliable", "unreliable", "not_payer", "unknown"] }
    - { key: checked_at,       label: "Checked at",        kind: date,   role: attribute, concept: time.occurred_at }
