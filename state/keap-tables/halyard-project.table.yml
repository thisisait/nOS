# =============================================================================
# KEAP DataTable — "Halyard · Project" (business fixture, row fixture-halyard-studio).
#
# A client engagement at Halyard Studio, a synthetic dev shop. `client` is a
# rowRef into the shared `party` table, so seeding Halyard re-seeds the party
# rows it references (idempotent upsert by slug). No counterparty concept
# exists, so `client` is conceptless, exactly as kolben-project.client is.
# =============================================================================
title: "Halyard · Project"
description: >-
  A client engagement at the synthetic Halyard Studio fixture: who it is for,
  its lifecycle, its repository and when it started.
driver: libsql
anchors: ["nos.fixture.halyard"]
visibility: tier-managers
client_scope: rowRef:client
schema:
  columns:
    - { key: slug,    label: "Slug",    kind: text,   role: dimension, required: true, concept: identity.slug }
    - { key: name,    label: "Name",    kind: text,   role: dimension, required: true, concept: identity.name }
    - { key: client,  label: "Client",  kind: rowRef, role: dimension, required: true,
        refTable: "party", refDisplay: "legal_name", onDelete: "restrict" }
    - { key: status,  label: "Status",  kind: select, role: dimension, required: true, concept: lifecycle.status,
        options: ["active", "on-hold", "closed"] }
    - { key: repo,    label: "Repository", kind: text, role: attribute, concept: net.repo }
    - { key: started, label: "Started", kind: date,   role: attribute, concept: time.occurred_at }
