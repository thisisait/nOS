# KEAP DataTable — "Print orders" (what a customer asked for, by when).
#
# The order is the commercial noun; the JOB (print-job) is the operational
# one. customer is the fixture's headline rowRef — order → party, the join
# the relations doc opened with ("an invoice cannot reference its customer")
# and the first one to run on live data. `ordered_at` vs `due_at` follows the
# roadmap table's target/occurred_at split: what happened vs what was
# promised, never one column doing both.
#
# customer carries NO concept on purpose: the L1 vocabulary has no
# counterparty concept, graph.parent would claim the order nests under the
# customer (it does not), and a wrong concept is worse than none — the
# vocabulary grows by KEAP release, not by stretching a neighbour.

title: "Print orders"
description: >-
  Customer orders — reference, who ordered (rowRef to Parties), when it was
  placed and when it is due. Jobs nest under orders via print-job.order.
driver: libsql
visibility: tier-managers
anchors: ["nos.fixture.print"]

schema:
  columns:
    - { key: slug,       label: "Slug",       kind: text,   role: dimension, required: true, concept: identity.slug }
    - { key: reference,  label: "Reference",  kind: text,   role: dimension, required: true, concept: identity.name }
    - { key: customer,   label: "Customer",   kind: rowRef, role: dimension, required: true,
        refTable: "party", refDisplay: "legal_name", onDelete: "restrict" }
    - { key: ordered_at, label: "Ordered at", kind: date,   role: attribute, required: true, concept: time.occurred_at }
    - { key: due_at,     label: "Due at",     kind: date,   role: attribute, required: true, concept: time.target }
    - { key: status,     label: "Status",     kind: select, role: dimension, required: true, concept: lifecycle.status,
        options: ["quoted", "confirmed", "in-production", "delivered", "cancelled"] }
    - { key: notes,      label: "Notes",      kind: text,   role: attribute, concept: identity.description }
