# =============================================================================
# KEAP DataTable — "Apiary · Hive" (business fixture, row fixture-apiary-coop).
#
# One colony on a site. `status` is the colony's state as the keeper last
# recorded it; a hive can be dead and still stand on an active site. The
# queen's year is a plain number with no concept (a year is not an event).
# =============================================================================
title: "Apiary · Hive"
description: >-
  A hive at the synthetic beekeeping co-op fixture: its site, the year its
  queen was raised and the colony's state.
driver: libsql
anchors: ["nos.fixture.apiary"]
visibility: tier-managers
client_scope: rowRef:site
schema:
  columns:
    - { key: slug,       label: "Slug",       kind: text,   role: dimension, required: true, concept: identity.slug }
    - { key: label,      label: "Label",      kind: text,   role: dimension, required: true, concept: identity.name }
    - { key: site,       label: "Site",       kind: rowRef, role: dimension, required: true,
        refTable: "apiary-site", refDisplay: "name", onDelete: "restrict", concept: graph.parent }
    - { key: queen_year, label: "Queen year", kind: number, role: attribute }
    - { key: status,     label: "Status",     kind: select, role: dimension, required: true, concept: lifecycle.status,
        options: ["strong", "weak", "queenless", "dead"] }
