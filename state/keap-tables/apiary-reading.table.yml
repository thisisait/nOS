# =============================================================================
# KEAP DataTable — "Apiary · Reading" (business fixture, row fixture-apiary-coop).
#
# One weighing of a hive. A hive's weight trend is a question over several rows,
# never a column. A reading taken by hand carries no brood temperature. The two
# measures have no concept: evidence.observation binds json, not a number.
# =============================================================================
title: "Apiary · Reading"
description: >-
  A scale reading of a hive at the synthetic beekeeping co-op fixture: when it
  was taken, the hive's weight, the brood temperature and where it came from.
driver: libsql
anchors: ["nos.fixture.apiary"]
visibility: tier-managers
client_scope: rowRef:hive
schema:
  columns:
    - { key: slug,         label: "Slug",          kind: text,   role: dimension, required: true, concept: identity.slug }
    - { key: hive,         label: "Hive",          kind: rowRef, role: dimension, required: true,
        refTable: "apiary-hive", refDisplay: "label", onDelete: "restrict", concept: graph.parent }
    - { key: measured_at,  label: "Measured",      kind: date,   role: attribute, required: true, concept: time.occurred_at }
    - { key: weight_kg,    label: "Weight (kg)",   kind: number, role: measure,   required: true }
    - { key: brood_temp_c, label: "Brood temp (C)", kind: number, role: measure }
    - { key: source,       label: "Source",        kind: select, role: dimension, required: true, concept: prov.source,
        options: ["scale", "manual"] }
