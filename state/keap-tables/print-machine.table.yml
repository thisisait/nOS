# KEAP DataTable — "Print machines" (the label printer's capacity).
#
# A machine is what makes the fixture's core question non-documentary:
# "which jobs miss their deadline if machine 2 stops" is answered by walking
# print-job-step rows (the job↔machine N:N junction) against due dates — a
# cortex query over transactional data, not a document lookup
# (docs/idea/15-business-fixture.md, "What it exercises").

title: "Print machines"
description: >-
  The shop's machines — presses and finishers. Jobs reach machines only
  through print-job-step (the N:N junction), never by a column here.
driver: libsql
visibility: tier-managers
anchors: ["nos.fixture.print"]

schema:
  columns:
    - { key: slug,   label: "Slug",   kind: text,   role: dimension, required: true, concept: identity.slug }
    - { key: name,   label: "Name",   kind: text,   role: dimension, required: true, concept: identity.name }
    - { key: kind,   label: "Kind",   kind: select, role: dimension, required: true, concept: class.kind,
        options: ["flexo-press", "digital-press", "finisher"] }
    - { key: status, label: "Status", kind: select, role: dimension, required: true, concept: lifecycle.status,
        options: ["up", "maintenance", "down"] }
