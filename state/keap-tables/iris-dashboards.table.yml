# KEAP DataTable — "Iris dashboards" (iris v3 B4, operator ruling Q1).
#
# One row per dashboard a person placed from an Iris offer. The thalamus writes
# it as that person when they click Place (wire dashboard_save, a ledger write
# like a form submit) and lists back only rows whose owner is them. Consumers:
# the pupil (loads them, its workspaces.json is the fallback); the face later.
# KEAP isolates no rows yet (visibility.ts: row __owner is a later change), so
# tier-users here and the owner filter in the thalamus.
title: "Iris dashboards"
description: >-
  Dashboards a person placed from an Iris offer: a name, a lens (the tab's
  shared filter) and the widget specs. Owner is the person; the thalamus never
  lists or loads another person's row.
driver: libsql
visibility: tier-users
schema:
  columns:
    - {key: owner, label: "Owner", kind: text, role: dimension, required: true, concept: access.owner}   # user:<canonical uid>
    - {key: slug, label: "Slug", kind: text, role: dimension, required: true, concept: identity.slug}    # the pupil's tab id
    - {key: name, label: "Name", kind: text, role: dimension, required: true, concept: identity.name}
    - {key: lens, label: "Lens", kind: json, role: attribute}                                            # [{column, op, value, kind?, options?}]
    - {key: widgets, label: "Widgets", kind: json, role: attribute, concept: ui.layout}                  # [{title, spec}]
