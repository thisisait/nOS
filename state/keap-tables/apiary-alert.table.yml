# =============================================================================
# KEAP DataTable — "Apiary · Alert" (business fixture, row fixture-apiary-coop).
#
# Something a keeper should look at on one hive. `status` says whether a person
# has dealt with it; `raised_by` is a label (the watching agent or a keeper),
# not an identity: v1 seeds rows, no agent writes them.
# =============================================================================
title: "Apiary · Alert"
description: >-
  An alert on a hive at the synthetic beekeeping co-op fixture: what kind, when
  it was raised, by what, and whether someone has dealt with it.
driver: libsql
anchors: ["nos.fixture.apiary"]
visibility: tier-managers
client_scope: rowRef:hive
schema:
  columns:
    - { key: slug,      label: "Slug",      kind: text,   role: dimension, required: true, concept: identity.slug }
    - { key: hive,      label: "Hive",      kind: rowRef, role: dimension, required: true,
        refTable: "apiary-hive", refDisplay: "label", onDelete: "restrict", concept: graph.parent }
    - { key: kind,      label: "Kind",      kind: select, role: dimension, required: true, concept: class.kind,
        options: ["weight-drop", "cold-brood", "swarm-risk", "tamper"] }
    - { key: raised_at, label: "Raised",    kind: date,   role: attribute, required: true, concept: time.occurred_at }
    - { key: status,    label: "Status",    kind: select, role: dimension, required: true, concept: lifecycle.status,
        options: ["open", "reviewed", "dismissed"] }
    - { key: raised_by, label: "Raised by", kind: text,   role: attribute, concept: prov.generated_by }
    - { key: note,      label: "Note",      kind: text,   role: attribute, concept: identity.description }
