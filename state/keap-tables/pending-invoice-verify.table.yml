# =============================================================================
# KEAP DataTable — "Pending invoice verify" (consulting-surface-wiring unit 1).
#
# One row per HELD vision-extracted sidecar (VisionImporter.parse(), tools/
# digest-import-vision.py) — unverified or below CONFIDENCE_FLOOR. The
# consultant reviews it here via face's generic TablesApp (graph.mode:rows,
# no bespoke screen) and sets `resolution`. `sidecar_id` is the STABLE JOIN
# KEY unit 2 (VisionImporter.parse()) looks up by — the sidecar's filename,
# the one thing that survives even a record with no `id` field.
#
# BATCH semantics (operator decision): approving/rejecting here does nothing
# by itself — the NEXT import run reads this table and honors the decision.
# No trigger, no daemon.
# =============================================================================
title: "Pending invoice verify"
description: >-
  Held vision-extracted invoice sidecars awaiting a consultant's approve/
  reject decision. Read by VisionImporter.parse() on the NEXT import run
  (batch semantics) — resolution never posts anything by itself.
driver: libsql
# nos.digest.pending-invoice-verify never existed in the live taxonomy — the
# KEAP lint reported it broken (gate test_table_anchors_resolve). Anchored to
# the invoice node like invoice/invoice-line/book-access; mint a dedicated
# node first if this queue ever deserves its own branch.
anchors: ["nos.digest.invoice"]
visibility: tier-managers
graph:
  mode: rows
  node: { idColumn: slug, labelColumn: sidecar_id, kind: pending-invoice-verify }
schema:
  columns:
    - { key: slug,        label: "Slug",        kind: text,   role: dimension, required: true, concept: identity.slug }
    - { key: sidecar_id,  label: "Sidecar",      kind: text,   role: dimension, required: true, concept: prov.ref }
    - { key: fields,      label: "Fields",       kind: json,   role: attribute, concept: evidence.observation }
    - { key: resolution,  label: "Resolution",   kind: select, role: dimension, required: true, concept: lifecycle.status,
        options: ["pending", "approved", "rejected"] }
    - { key: resolved_by, label: "Resolved by",  kind: text,   role: attribute, concept: access.owner }
    - { key: resolved_at, label: "Resolved at",  kind: date,   role: attribute, concept: time.occurred_at }
