# =============================================================================
# KEAP DataTable — "Apiary · Site" (business fixture, row fixture-apiary-coop).
#
# A stand of hives kept by one member of the synthetic beekeeping co-op. The
# member is a row of the shared party table and is always an organisation: this
# is the low-PII fixture. `member` has no concept for the reason
# halyard-project.client has none (no counterparty concept yet).
# =============================================================================
title: "Apiary · Site"
description: >-
  An apiary site at the synthetic beekeeping co-op fixture: which member keeps
  it, whether it is active, wintering or closed, and a note.
driver: libsql
anchors: ["nos.fixture.apiary"]
visibility: tier-managers
client_scope: rowRef:member
schema:
  columns:
    - { key: slug,   label: "Slug",   kind: text,   role: dimension, required: true, concept: identity.slug }
    - { key: name,   label: "Name",   kind: text,   role: dimension, required: true, concept: identity.name }
    - { key: member, label: "Member", kind: rowRef, role: dimension, required: true,
        refTable: "party", refDisplay: "legal_name", onDelete: "restrict" }
    - { key: status, label: "Status", kind: select, role: dimension, required: true, concept: lifecycle.status,
        options: ["active", "wintering", "closed"] }
    - { key: note,   label: "Note",   kind: text,   role: attribute, concept: identity.description }
