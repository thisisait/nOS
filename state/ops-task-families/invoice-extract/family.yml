# One ops-plane task family: extract three fields from an invoice blob.
#
# The labels in samples.jsonl were written BY HAND. A model may not label a
# sample set it is later scored against — that measures agreement between two
# models, which is the failure arXiv:2510.16657 describes, not accuracy.
#
# Scored by tools/nos-ops-harness.py: exact reproduction of `expect`, decided
# by the code oracle. The model never assesses itself.
#
# ONE RUN IS NOT A MEASUREMENT, and this family is where that was found out.
# The same 22 samples, the same model, the same code, hours apart:
#
#   hermes3:8b    17/22   then   14/22        <- three samples of drift
#   qwen3:14b     22/22   then   22/22
#   MiniMax-M2.7  20/22   then   21/22
#
# That is what `--repeat` was built for. THREE PASSES EACH, pooled:
#
#   hermes3:8b     runs [18, 16, 16]   spread 2   50/66   0.758
#   qwen3:14b      runs [21, 22, 20]   spread 2   63/66   0.955
#   MiniMax-M2.7   runs [20, 19, 20]   spread 1   59/66   0.894
#
# THE 22/22 WAS A LUCKY PASS. The 14B's real rate on this family is 0.955, not
# 1.0, and no subject here has spread 0 — the perfect score that looked like a
# ceiling was one draw from a distribution with a 2-sample width.
#
# The 14B still leads the hosted model, 63 vs 59, but by four samples against a
# spread of two: consistent across the three passes, and much thinner than the
# single-run 22-vs-20 suggested. What is unambiguous is the 8B's distance from
# both, 50 vs 59 and 63, which no amount of that noise touches.
#
# AND IT DOES NOT TRAVEL. On weakness-triage the same three subjects go the
# other way (MiniMax 52/60, both local models 46/60), so "the local 14B beats
# the hosted model" is a statement about EXTRACTION and false as a general
# claim. See that family's header.
#
# Reports in state/ops-harness/ are the LAST run, never the best one.
name: invoice-extract
# The agent whose one_shot schema these labels are written against. The
# harness takes --agent as a flag, so a family could be scored against a
# schema that cannot express its labels and every sample would come back
# `invalid` — a capability finding that was really a mismatched flag.
# test_a_family_label_fits_its_schema.py checks every label against it.
agent: ops-extract
description: >
  Three fields (invoice_no, total, currency) out of a short invoice text, in
  the layouts a small business actually receives them: EN and CS, comma and
  dot decimals, symbol and code currencies, noise lines around the numbers.
prompt_template: |
  Extract these three fields from the invoice below:
    invoice_no  — the invoice number, exactly as printed
    total       — the total amount due, as a number (no thousands separator)
    currency    — one of EUR, CZK

  Answer with ONE JSON object and nothing else.

  INVOICE:
  {input}
