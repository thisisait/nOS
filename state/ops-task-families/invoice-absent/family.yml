# The family that measures INVENTION, not extraction.
#
# invoice-extract asks whether a model can read three fields off a document.
# Every one of its 22 samples contains all three, so a model that guesses well
# and a model that reads carefully score identically — and the estate's whole
# doctrine is that those two are different.
#
# Here a field is genuinely ABSENT. The label omits it, so the only way to
# score is to omit it too. `ops-extract`'s system prompt already says
# "if a field is genuinely absent from the input, omit it rather than
# inventing a plausible value — a wrong number is worse than a missing one",
# and until this family existed nothing checked whether that sentence had any
# effect.
#
# Same agent, same schema, same three fields as invoice-extract on purpose:
# the ONLY variable is whether the answer is there. That is what makes the two
# accuracies comparable, and the gap between them is the measurement.
#
# THE SCHEMA STILL REQUIRES ALL THREE, which is deliberate and is the sharpest
# thing this family measures. A model that omits a field it cannot find emits
# an object the schema REJECTS — so the honest answer scores as `invalid`, not
# as `exact`. Read the columns together: high `invalid` here means the model
# refused to invent and the contract had no way to say so; high `wrong` means
# it invented. Those are opposite findings and the report keeps them apart.
#
# MEASURED 2026-08-30, and the fix this family forced is in the numbers.
#
#   BEFORE (schema required all three fields)
#     hermes3:8b   2/10   invalid 6   wrong 2
#     qwen3:14b    2/10   invalid 6   wrong 2      <- identical, to the sample
#
#   AFTER (required: [])
#     hermes3:8b   2/10   invalid 4   wrong 4
#     qwen3:14b    7/10   invalid 0   wrong 3
#
# The 14B was right five more times than the contract allowed it to be, and
# now emits nothing the schema refuses. The 8B did not improve — its failures
# moved from `invalid` to `wrong`, which is the finding: it was not omitting,
# it was inventing ("invoice_no": "N/A", a currency guessed from the language
# of the text rather than read off it).
#
# The same fix lifted invoice-extract's 8B from 14/22 to 18/22, so four of the
# misses on the ORIGINAL family were the contract too. The 14B stayed 22/22.
#
# TWO REMAINING 14B MISSES ARE WORTH READING before anyone calls it 7/10:
#   a04, a08 — expected {}, the model returned []. It correctly said "nothing
#              here"; JSON's empty object and empty array are the same thing
#              to PHP's json_decode, and the exact-match oracle is not. Left
#              scored as a miss rather than teaching the oracle to blur them —
#              a loosened oracle is worth less than an honest 7.
#   a07      — a credit note; it returned the invoice the note REFERENCES
#              instead of the note's own number. A genuine comprehension miss.
#
# Labels written by hand. A model may not label a set it is scored against.
name: invoice-absent
description: >
  The same three fields, from documents where one of them is not present:
  no invoice number, no currency marker, or a total that is a due date rather
  than an amount. The correct answer is never a plausible guess.
prompt_template: |
  Extract these three fields from the invoice below:
    invoice_no  — the invoice number, exactly as printed
    total       — the total amount due, as a number (no thousands separator)
    currency    — one of EUR, CZK

  Answer with ONE JSON object and nothing else.

  INVOICE:
  {input}
