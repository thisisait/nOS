# =============================================================================
# state/roadmap-probes.yml — one probe per roadmap row, run by
# `tools/roadmap-verify.py --all`.
#
# WHAT A PROBE ASSERTS, AND WHY IT IS ALWAYS THE SAME DIRECTION
# -------------------------------------------------------------
# Every command here asserts ONE thing: **the row's deliverable exists**. Not
# "the row's status is right" — that would make each probe depend on the claim
# it is supposed to be independent of, and the whole point of the `verified`
# column is that it does not.
#
# Read the two columns together and all four combinations mean something:
#
#   status=shipped  verified=confirmed     they agree
#   status=shipped  verified=contradicted  the most useful row the table can
#                                          hold — someone said it landed and
#                                          the estate disagrees
#   status=queued   verified=confirmed     ALSO a finding, and the one this
#                                          file was written for: the work is
#                                          there and nobody recorded it
#   status=queued   verified=contradicted  consistent — genuinely not started
#
# The third line is the measured problem. On 2026-08-08 the roadmap had 35 rows
# past their target and no way to tell lateness from unrecorded progress,
# because no row's status had EVER changed since it was filed. At least three
# of the 35 were done.
#
# WHAT MAKES A GOOD PROBE. Something the estate can answer without a human
# reading it: a file that must exist, a symbol that must be defined, a version
# the host must report. `test -d …` is a fine probe. `true` is not, and neither
# is anything whose output would embarrass us in a table the face renders —
# `tools/roadmap-verify.py` stores stdout as evidence and cannot know which
# bytes you would not want read.
#
# A PROBE MAY NOT MATCH THE DESCRIPTION OF THE WORK. The first draft of this
# file got five of nine `confirmed` verdicts wrong the same way, and it is worth
# recording because it is this estate's oldest bug wearing yet another hat:
#
#     sec-p1:  grep -rqil "hkdf" tools/ files/anatomy/ roles/    -> confirmed
#     the only file in the repo containing "hkdf" is tools/roadmap-seed.py
#     — the script that AUTHORS the roadmap row saying HKDF should be built
#
# The probe verified that we had written down the plan. Same for `sec-p5`
# (keychain), and `loop-forget` matched `last_attempted_at`, a webhook retry
# column with nothing to do with the loop remembering what it tried.
#
# So: `grep -r` may not take `tools/` or `docs/` as a search root — those hold
# the plan — and a probe should prefer a named artifact over a word. Pinned by
# tests/anatomy/test_a_probe_cannot_match_its_own_description.py.
#
# WHEN THERE IS NO PROBE, SAY SO. `{unverifiable: "reason"}` is a first-class
# answer, not a gap. A row that nobody can check should say that rather than
# inherit `unverified` forever or borrow a neighbour's evidence. Absence must
# never render as calm.
#
# Commands run from the repo root, through the shell, with a 120s cap.
# =============================================================================

# ── agents ──────────────────────────────────────────────────────────────────
agents-inbox: >-
  test -f files/anatomy/wing/app/Model/AgentQuestionRepository.php
  && test -f files/anatomy/wing/app/AgentKit/Tools/AskOperatorTool.php
  && grep -q "inbox/answer" files/anatomy/wing/app/Core/RouterFactory.php

agents-evals: >-
  ls tools/ | grep -q "agent-eval"

# The engine exists; the driver is the row. A pulse job is what would schedule
# it, so its absence from every manifest is the honest test.
loop-driver: >-
  grep -rql "loop-propose\|loop-driver" files/anatomy/plugins/*/plugin.yml

# The table that would hold "this was tried and failed". Named, not worded —
# the first version matched `last_attempted_at`, which is webhook retry state.
loop-forget: >-
  grep -q "CREATE TABLE IF NOT EXISTS loop_attempts"
  files/anatomy/wing/db/schema-extensions.sql

loop-reach:
  unverifiable: >-
    a whitelist's CORRECTNESS is the question, and no command can answer
    whether it matches where defects actually are — that needs the defect
    history read against the rule, which is a person's job

loop-operator-model: >-
  test -f docs/doctrine/operator-model.md

loop-sandbox:
  unverifiable: >-
    the row asks whether two named open questions have MIT answers — a
    literature verdict, not an estate fact

# The deliverable is a grader AGENT, so the probe is that agent's definition —
# not the word "intent", which the scout's manifest already uses in prose.
local-llm-intent: >-
  test -f files/anatomy/agents/intent-grader/agent.yml

local-llm-model: >-
  test -d files/anatomy/models

local-llm-bench: >-
  test -x tools/local-model-bench.py && test -f state/local-model-bench.yml

# CAUGHT MYSELF A THIRD TIME. The first version of this probe asserted that the
# installed ollama ships `llama-server` — and came back `confirmed`, because it
# does. But that is the PREREQUISITE, not the deliverable: the row is "the
# estate emits chains under a grammar", and no grammar file exists. A probe that
# passes on a dependency reports the ingredient as the meal, which is the same
# mistake as reading the plan and calling it the work.
#
# The deliverable is a GBNF grammar for cortex-lang plus something that sends it.
#
# TIGHTENED 2026-08-22, and the loosening it replaces is worth keeping visible:
# `grep "gbnf\|grammar"` passes on a bench that merely MENTIONS a grammar.
# Measured that day — ollama's /api/generate accepts an unknown `options.grammar`
# and silently drops it (hermes3:8b, temperature 0, byte-identical output with
# and without). So the sending half has to name the path that cannot pretend:
# llama-server, told at startup, where an unparsable grammar is a startup
# failure instead of a no-op.
local-llm-grammar: >-
  test -f state/cortex-lang.gbnf
  && grep -q 'grammar-file' tools/local-model-bench.py
  && grep -q 'llama-server' tools/local-model-bench.py

local-llm-thinkingcap: >-
  ollama list | grep -qi thinkingcap

local-llm-lfm25:
  unverifiable: >-
    a benchmark result is a measurement someone must run and record; the
    absence of a number is not something a file test can distinguish from a
    number nobody wrote down

# ── cortex ──────────────────────────────────────────────────────────────────
# CAUGHT THE SAME WAY local-llm-grammar was, and it is worth the fourth telling.
# This probe was `test -d files/anatomy/wing/app/Cortex`, and on 2026-08-09 that
# directory appeared — so the probe would have flipped to `confirmed` on a
# handler set where FIVE of the seven verbs are LateBoundHandler stubs, because
# KEAP publishes no taxonomy/search/classify/embed route to any bearer. An
# executor that refuses five of its seven verbs is an executor in the same sense
# that an empty stack is `0/0 ready`.
#
# The deliverable is an executor that executes. While any handler is still
# late-bound this reads `refuted` against a status of `active`, which is the
# honest pairing: built, running, not done.
# EMBED IS DELIBERATELY LATE-BOUND, so "no handler is late-bound" is a bar this
# row can never clear (corrected 2026-08-22). KEAP serves GET /embeddings/pending
# (a queue) and POST /embeddings (a write of computed vectors) and NOTHING that
# computes an embedding for supplied text — genuinely absent upstream, recorded
# as such in w-exec-pipe and honoured by
# tests/anatomy/test_cortex_blocker_is_named_correctly.py, which carves out the
# same exception. A probe that cannot go green even once the work is done is
# worse than no probe: every reader either re-diagnoses a closed question or
# learns to distrust the catalogue.
cortex-exec: >-
  test -d files/anatomy/wing/app/Cortex
  && test "$(cd files/anatomy/wing/app/Cortex/Handler && grep -l 'extends LateBoundHandler' *.php)" = EmbedHandler.php

cortex-rows: >-
  grep -rql "syncRows" files/anatomy/cortex/

cortex-lang: >-
  test -f files/anatomy/cortex/server/cortex-lang.ts
  && test -f files/anatomy/cortex/server/cortex-validate.ts

cortex-readers: >-
  grep -rqil "epub" files/anatomy/face/src/lib/apps/native/

local-llm-corpus: >-
  ls tools/ | grep -q "cortex-corpus-gen"

# This row and cortex-exec are close enough to be one row wearing two slugs, and
# pointing both at the same `test -d` is what hid that. Not papering over it with
# an invented distinction: the row says "authorisation AND execution", so it asks
# for BOTH halves — a binding gate that something actually loads (a class nobody
# loads is a lint, not a gate), and an execution surface with no late-bound verbs
# left. Narrowing it to the gate alone would have flipped it to `confirmed`
# today, which is the overclaim this whole pass exists to remove.
# Same embed carve-out as cortex-exec above, same reason.
local-llm-executor: >-
  test -f files/anatomy/wing/app/Cortex/CortexBindingGate.php
  && grep -rql "CortexBindingGate" tests/
  && test "$(cd files/anatomy/wing/app/Cortex/Handler && grep -l 'extends LateBoundHandler' *.php)" = EmbedHandler.php

# ── face ────────────────────────────────────────────────────────────────────
face-anatomy: >-
  test -d files/anatomy/face/src/lib/apps/native/anatomy

face-planner: >-
  test -d files/anatomy/face/src/lib/apps/native/planner

# Four styles render (files/anatomy/face/src/lib/tables/view.ts). The row is
# the PICKER — a control that switches a live table between them.
face-styles: >-
  grep -rql "ResolvedStyle" files/anatomy/face/src/lib/components/

face-tree: >-
  grep -rql "parent" files/anatomy/face/src/lib/tables/tree.ts

# ── platform ────────────────────────────────────────────────────────────────
# The one probe here that reads the HOST rather than the tree: the row is about
# what the machine runs, and the pin is downstream of that.
# Three readings, because this row has three halves and today's fix
# (7ac823a1, "the keg and the daemon are two questions") exists precisely
# because one of them was mistaken for the whole. `ollama --version` reports the
# RUNNING DAEMON, so it can say 0.32.6 while the keg is still 0.30.7 — or the
# reverse, right after a swap with no reload. And neither reading sees the tap,
# which is the other half of the row's title; memory `ollama-brew-mlx-only-bottle`
# records that tap shadowing core for two months without `state: latest` ever
# showing it.
plat-ollama: >-
  brew list --versions ollama | grep -Eq "0\.(3[2-9]|[4-9][0-9])"
  && ollama --version | grep -Eq "0\.(3[2-9]|[4-9][0-9])"
  && ! brew tap | grep -q "pazny/local"

plat-signing: >-
  test "$(git config commit.gpgsign)" = "true"

plat-linux:
  unverifiable: >-
    the claim is about an Ubuntu estate this Mac is not; the honest probe is
    the Linux integration job, which cannot run from here

sere-a: >-
  test -x tools/ci-local.sh && python3 -m pytest tests/anatomy -q --co >/dev/null 2>&1

sere-b:
  unverifiable: "needs a host that can be created and destroyed; none exists yet"

sere-c:
  unverifiable: "a mutex over the live estate — nothing to probe until it is built"

sere-hosts:
  unverifiable: "no Linux host or VPS is provisioned to probe"

plat-v07: >-
  test -d docs/archive/v0.7

# ── security ────────────────────────────────────────────────────────────────
# The derivation itself, where a derivation would live — not `tools/`, whose
# roadmap-seed.py is the only file in the repo that has ever said "hkdf".
sec-p1: >-
  grep -rqil "hkdf" roles/ files/anatomy/library files/anatomy/module_utils
  files/anatomy/wing/app

sec-p3: >-
  grep -rql "canary" default.credentials.yml

sec-p5: >-
  grep -rql "find-generic-password" roles/

# Not "is the queue empty" — it never will be. The row is the open HIGHs, and
# the estate's own reader is the probe.
#
# It must ask the reader's MACHINE mode. The first version counted lines of the
# human render (`rem-status.py | grep -c 'HIGH '`) and so counted its headings:
# the severity summary, "N CRITICAL/HIGH are BLOCKED", "+N pending below HIGH".
# Four of the six matching lines are structural, so the probe could not reach 0
# even with every HIGH closed — it had reported `contradicted` since it was
# filed and would have gone on reporting it after the work was done.
sec-rem: >-
  test "$(tools/rem-status.py --json | python3 -c "import json,sys;
  s = json.load(sys.stdin)['pending_by_severity'];
  print(s.get('CRITICAL', 0) + s.get('HIGH', 0))")" -eq 0

sec-queue-authorship: >-
  grep -ql "resolved_by" tools/scan-runner.sh

# ── filesystem ──────────────────────────────────────────────────────────────
fs-s0: >-
  grep -rql "canonical" files/anatomy/plugins/nextcloud-base/plugin.yml

fs-s1:
  unverifiable: >-
    the row names its own test — open a .docx in ONLYOFFICE, save, and check
    the bytes changed in the VFS tree. That is a browser doing it, not a shell

# Per-user CONTAINERS, so the artifact is a compose template that renders one
# service per tenant. The word "per-user" appears in three manifests as prose
# and proves nothing.
fs-peruser: >-
  ls roles/pazny.*/templates/ | grep -q "peruser\|per-user"

# NOT ADDED, AND THE REASON IS THE FINDING (2026-08-22).
#
# A probe for `w-exec-pipe` was written here and then removed, because
# `test_every_probed_slug_is_a_row_someone_authored` refused it: "the catalogue
# names rows tools/roadmap-seed.py does not author — a typo here verifies
# nothing, quietly". The gate is right, and it is right about something larger
# than a typo.
#
# The ENTIRE v0.11 ordinal ladder — w-exec-pipe, w-agentkit-spine, w-datalog,
# w-fixture, w-release, w-keap-routes, w-keap-relations — exists ONLY in the
# live KEAP table. No git file authors it: `roadmap-seed.py`'s `row()` has no
# `ordinal` parameter at all, and grepping tools/ for those slugs finds nothing
# that writes them. They were hand-authored in the Planner, so 25 of the 93 rows
# are ungoverned by git and therefore unprobeable by construction — the same
# shape as the ideas table, which has no update path either (`kpro-table-access`).
#
# The probe that was refused would have been a good one; it checked that stage
# N's rows reach stage N+1 rather than that a file exists. It can be restored
# the day those rows have a git-owned author. Until then, adding it would mean
# teaching the gate to accept a slug nothing can verify — satisfying a gate by
# editing it, which is the one thing this estate refuses.

# ── Datastore transport (REM-217) ───────────────────────────────────────────
# Every one of these asks tools/tls-uptake.py, which reads what the estate
# NEGOTIATES. Deliberately not the templates: the June 2026 require-pin was
# present in every template for nine weeks and rendered `prefer` on every host
# (docs/hidden_fees/23), and a shape probe would have called that shipped.
sec-transport: >-
  test "$(tools/tls-uptake.py --json | python3 -c "import json,sys;
  d = json.load(sys.stdin)['datastores'];
  print(sum(1 for x in d if x['verdict'] != 'GREEN'))")" -eq 0

# `on_fabric or 1` so an idle estate cannot report 0-of-0 as done. That is
# hidden fee 08 — the STRICT health probe passing an empty stack as 0/0 ready.
sec-transport-pg: >-
  test "$(tools/tls-uptake.py --json | python3 -c "import json,sys;
  d = next(x for x in json.load(sys.stdin)['datastores'] if x['datastore'] == 'postgresql');
  n = d.get('sessions_on_fabric', 0);
  print(1 if not n else n - d.get('sessions_encrypted', -1))")" -eq 0

sec-transport-redis: >-
  test "$(tools/tls-uptake.py --json | python3 -c "import json,sys;
  d = next(x for x in json.load(sys.stdin)['datastores'] if x['datastore'] == 'redis');
  print(int(bool(d.get('secret_on_argv')) or not d.get('tls_listener')))")" -eq 0

sec-transport-mariadb: >-
  test "$(tools/tls-uptake.py --json | python3 -c "import json,sys;
  d = next(x for x in json.load(sys.stdin)['datastores'] if x['datastore'] == 'mariadb');
  print(int(not d.get('require_secure_transport')))")" -eq 0
