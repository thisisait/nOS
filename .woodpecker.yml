# nOS — Woodpecker CI pipeline (Anatomy A16, 2026-05-17)
#
# Runs on every push to any branch from the Gitea mirror. Four required
# stages (composer, php-lint, pytest, ansible-syntax); one optional
# stage (notify) for dev/pzny pushes that posts a CI-green notification
# into Wing /inbox so the operator-attention queue surfaces it.
#
# Pipeline runs entirely in containers — no host filesystem access, no
# deploy step in this iteration. Deploy is operator-triggered via
# `ansible-playbook main.yml --tags <stack>` after CI goes green.
#
# Secret 'wing_api_token' is optional — if not configured in Woodpecker
# the notify step is gracefully skipped. Set via the Woodpecker UI
# (Repo → Settings → Secrets) once the wing API surface has minted a
# pipeline-scoped token (Authentik OIDC client, scopes nos:notifications).

# Top-level when removed (2026-05-20): manual triggers (event=manual) and
# cron events would be filtered out otherwise. Per-step `when:` blocks below
# still gate the notify-green step to push/pzny branches only.

steps:
  composer-validate:
    image: composer:2
    pull: true
    commands:
      - cd files/anatomy/wing
      - composer validate --strict --no-check-publish
      - composer install --no-progress --no-interaction --no-scripts

  php-lint:
    image: php:8.5-cli-alpine
    pull: true
    commands:
      - find files/anatomy/wing/app files/anatomy/wing/bin -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null

  pytest-anatomy:
    image: python:3.13-slim
    pull: true
    commands:
      # pytest + pyyaml = anatomy test runner + yaml-based gates
      # httpx + pytest-asyncio = Pulse daemon test fixtures (test_pulse_daemon.py
      #   imports the pulse package which depends on httpx)
      # jinja2 + jsonschema = plugin loader render tests
      # requests = tester_identity lib (tests/e2e/lib/authentik_admin.py)
      - pip install --quiet --no-cache-dir pytest pytest-asyncio pyyaml httpx jinja2 jsonschema requests
      # Install pulse as editable so its package imports resolve in test
      - pip install --quiet --no-cache-dir -e files/anatomy/pulse
      - python -m pytest tests/anatomy/ -q --tb=short

  ansible-syntax:
    image: python:3.13-slim
    pull: true
    environment:
      # ansible.cfg is ignored when CWD is world-writable (Docker default
      # 0777). Set library/module_utils explicitly via env so the custom
      # nos_state / nos_migrate modules resolve even without ansible.cfg.
      ANSIBLE_LIBRARY: files/anatomy/library
      ANSIBLE_MODULE_UTILS: files/anatomy/module_utils
      ANSIBLE_ROLES_PATH: ./roles
    commands:
      - pip install --quiet --no-cache-dir 'ansible-core>=2.20,<2.22'
      # Install both roles AND collections from the single requirements.yml
      # (Galaxy roles like elliotweiser.osx-command-line-tools + collections
      # like community.general). Without the role install the playbook
      # syntax-check fails on the `roles: - role:` block in main.yml.
      - ansible-galaxy role install -r requirements.yml
      - ansible-galaxy collection install -r requirements.yml
      - ansible-playbook main.yml --syntax-check

  # notify-green removed 2026-05-20 — Woodpecker v3 resolves from_secret at
  # parse time, so missing secrets fail the WHOLE pipeline before any step
  # runs. Re-add as a separate workflow file (.woodpecker/notify.yml) once
  # the `wing_api_token` + `wing_api_url` secrets are provisioned via the
  # Woodpecker UI (Repo Settings → Secrets, restrict to dev+pzny branches).

  # ── A17 deploy-trigger (auto-deploy to host on dev push) ───────────────
  # Fires after all test stages succeed AND only on dev branch (master is
  # always operator-manual; pzny pushes don't reach this pipeline since
  # they don't hit GitHub). Computes which tags to deploy from the
  # commit message footer `deploy-tags: a,b,c` — empty = skip deploy.
  # Wing's /api/v1/deploy-trigger enforces a strict tag allowlist; a
  # malformed footer that lists a non-allowlisted tag returns 403 and
  # the deploy step fails — pipeline reports failure to operator.
  deploy-trigger:
    image: curlimages/curl:latest
    pull: true
    when:
      - event: push
        branch: dev
    environment:
      WING_DEPLOY_URL:
        from_secret: wing_deploy_url
      NOS_DEPLOY_HMAC_SECRET:
        from_secret: nos_deploy_hmac_secret
    commands:
      - |
        # Extract `deploy-tags:` footer line. Empty → no deploy.
        TAGS=$(printf '%s' "$$CI_COMMIT_MESSAGE" | grep -m1 -oE 'deploy-tags:[ ]*[a-z0-9_,-]+' | sed -E 's/^deploy-tags:[ ]*//' | tr -d ' ' || true)
        if [ -z "$$TAGS" ]; then
          echo "no deploy-tags footer in commit message — skipping auto-deploy"
          exit 0
        fi
        DEPLOY_UUID=$(cat /proc/sys/kernel/random/uuid 2>/dev/null || apk add --no-cache util-linux >/dev/null 2>&1 && uuidgen)
        TS=$(date +%s)
        # Build canonical-JSON body (alphabetically sorted keys, no whitespace).
        BODY=$(printf '{"branch":"%s","commit":"%s","deploy_uuid":"%s","source":"woodpecker","tags":[%s],"ts":%s}' \
          "$$CI_COMMIT_BRANCH" "$$CI_COMMIT_SHA" "$$DEPLOY_UUID" \
          "$(echo "$$TAGS" | tr ',' '\n' | awk '{printf "%s\"%s\"", (NR>1?",":""), $$0}')" \
          "$$TS")
        SIG=$(printf '%s.%s' "$$TS" "$$BODY" | openssl dgst -sha256 -hmac "$$NOS_DEPLOY_HMAC_SECRET" -hex | awk '{print $$NF}')
        echo "→ POST $$WING_DEPLOY_URL  deploy_uuid=$$DEPLOY_UUID tags=$$TAGS"
        HTTP_CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
          -X POST \
          -H 'Content-Type: application/json' \
          -H "X-Wing-Timestamp: $$TS" \
          -H "X-Wing-Signature: $$SIG" \
          --data "$$BODY" \
          "$$WING_DEPLOY_URL")
        echo "HTTP $$HTTP_CODE"
        cat /tmp/resp.json
        case "$$HTTP_CODE" in
          202) echo "→ deploy spawned on host (subprocess detached)" ;;
          *) echo "→ deploy refused"; exit 1 ;;
        esac
