---
service: infisical
allow_shell: true   # upgrade recipes need exec.shell for backup/pg_dump/image bump steps
docs_url: "https://infisical.com/docs/self-hosting/overview"
maintainers: ["pazny"]
notes: |
  Infisical CE is relatively stable but occasionally reshuffles env vars
  between minor versions (ENCRYPTION_KEY, AUTH_SECRET, SITE_URL, JWT_*).
  This recipe does not mutate env — the infisical role re-renders the
  compose on every playbook run from default.config.yml, so operators
  should bump `infisical_version` there AND add any new env vars before
  running the upgrade.

recipes:
  - id: "infisical-0.60-to-0.70"
    from_regex: "^v?0\\.60\\."   # ^v? — infisical image tags are v-prefixed; tolerate both
    to: "0.70.0"
    severity: minor
    changelog_url: "https://github.com/Infisical/infisical/releases"
    notes: |
      The 0.60 -> 0.70 window introduced new environment variables for
      SMTP and SSO config. If you have any SMTP relay configured for
      secret-expiry notifications, check the role defaults and add missing
      vars to credentials.yml before applying.

    coexistence_supported: false       # shared postgres + encryption key

    requires:
      min_disk_free_gb: 1
      service_healthy: true
      other_services_healthy: ["postgresql"]

    reset:
      scope: container
      estimated_sec: 60
      affected_services: [infisical]
      reason: >-
        compose.set_image_tag force-recreates only the infisical container;
        pg_dump/psql exec.shell are docker-exec backups (not host-disruptive, no
        DB restart), so floor stays container and no stack escalation.

    pre:
      - id: backup_data
        type: backup.volume
        src: "{{ infisical_data_dir }}"
        label: "pre-{{ upgrade_id }}"
      - id: backup_db
        type: exec.shell
        allow_shell: true
        command: >-
          docker exec {{ postgresql_container_name | default('nos-postgresql') }}
          pg_dump -U postgres -d infisical --clean --if-exists
          > {{ '~/.nos/backups/' + upgrade_id + '/infisical-db.sql' | expanduser }}

    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: infra
        service: infisical
        tag: "{{ recipe.to }}"
        wait: true

    post:
      - id: wait_healthy
        type: http.wait
        url: "https://{{ infisical_domain | default('vault' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/api/status"
        expect_status: 200
        timeout_sec: 120
        interval_sec: 3
      - id: verify_api
        type: custom.module
        module: ansible.builtin.uri
        args:
          url: "https://{{ infisical_domain | default('vault' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/api/v1/status"
          return_content: true
          status_code: [200]
        ignore_errors: true

    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: infra
        service: infisical
        tag: "{{ recipe.from_version_resolved }}"
        wait: false
      - id: restore_db
        type: exec.shell
        allow_shell: true
        command: >-
          docker exec -i {{ postgresql_container_name | default('nos-postgresql') }}
          psql -U postgres -d infisical
          < {{ '~/.nos/backups/' + upgrade_id + '/infisical-db.sql' | expanduser }}
      - id: restore_data
        type: backup.restore
        dst: "{{ infisical_data_dir }}"
        label: "pre-{{ upgrade_id }}"
      - id: restart_service
        type: compose.restart_service
        stack: infra
        service: infisical
        action: up
        wait: true

  - id: "infisical-0.70-to-0.80"
    from_regex: "^v?0\\.70\\."   # ^v? — tolerate v-prefixed image tag
    to: "0.80.0"
    severity: minor
    changelog_url: "https://github.com/Infisical/infisical/releases"
    notes: |
      0.70 -> 0.80 renamed a few auth env vars and tightened CORS. Same
      upgrade shape as the prior recipe.

    coexistence_supported: false

    requires:
      min_disk_free_gb: 1
      service_healthy: true
      other_services_healthy: ["postgresql"]

    reset:
      scope: container
      estimated_sec: 60
      affected_services: [infisical]
      reason: >-
        Same shape as the 0.60->0.70 recipe: a single compose.set_image_tag
        recreate of infisical; backup/restore exec.shell hit postgres via docker
        exec but never restart it, so postgres is a precondition not a
        forced-reconnect consumer.

    pre:
      - id: backup_data
        type: backup.volume
        src: "{{ infisical_data_dir }}"
        label: "pre-{{ upgrade_id }}"
      - id: backup_db
        type: exec.shell
        allow_shell: true
        command: >-
          docker exec {{ postgresql_container_name | default('nos-postgresql') }}
          pg_dump -U postgres -d infisical --clean --if-exists
          > {{ '~/.nos/backups/' + upgrade_id + '/infisical-db.sql' | expanduser }}

    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: infra
        service: infisical
        tag: "{{ recipe.to }}"
        wait: true

    post:
      - id: wait_healthy
        type: http.wait
        url: "https://{{ infisical_domain | default('vault' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/api/status"
        expect_status: 200
        timeout_sec: 120
        interval_sec: 3

    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: infra
        service: infisical
        tag: "{{ recipe.from_version_resolved }}"
        wait: false
      - id: restore_db
        type: exec.shell
        allow_shell: true
        command: >-
          docker exec -i {{ postgresql_container_name | default('nos-postgresql') }}
          psql -U postgres -d infisical
          < {{ '~/.nos/backups/' + upgrade_id + '/infisical-db.sql' | expanduser }}
      - id: restore_data
        type: backup.restore
        dst: "{{ infisical_data_dir }}"
        label: "pre-{{ upgrade_id }}"

# ^v?0\.160\. was too narrow; the pin is v0.162.19.
  - id: "infisical-current"
    from_regex: "^v?0\\.16[0-9]\\."
    to: "v0.162.19"        # == installed
    severity: minor
    changelog_url: "https://github.com/Infisical/infisical/releases"
    notes: |
      At-target forward coverage widened from ^v?0\.160\. to the whole 0.16x
      line. The pin is v0.162.19 (synced to the role default in the 2026-08-05
      shadow cleanup, swept from v0.162.16 on 2026-08-11), so the narrow pattern
      reported "no upgrade path" for a current vault.
      Patch/minor bumps inside 0.16x run Knex migrations on boot against the
      shared PostgreSQL. The encryption root key is env-supplied and unchanged;
      the DB dump below is the only thing that makes a rollback real.
    coexistence_supported: false
    requires: { min_disk_free_gb: 3, service_healthy: true }
    reset:
      scope: container
      estimated_sec: 120
      affected_services: [infisical]
      reason: >-
        compose.set_image_tag recreates infra-infisical-1 only. PostgreSQL is a
        dependency, not a bounced consumer — but every service resolving a
        secret at converge time reads through this container, so schedule
        outside a converge window.
    pre:
      - id: backup_db
        type: exec.shell
        command: >-
          docker exec infra-postgresql-1 pg_dump -U postgres -Fc infisical
          > ~/.nos/backups/{{ upgrade_id }}/infisical.dump
        allow_shell: true
      - id: backup_data
        type: backup.volume
        src: "{{ infisical_data_dir }}"
        label: "pre-{{ upgrade_id }}"
    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: infra
        service: infisical
        tag: "{{ recipe.to }}"
        wait: true
    post:
      - id: wait_healthy
        type: http.wait
        url: "http://127.0.0.1:{{ infisical_port | default(8075) }}/api/status"
        expect_status: 200
        timeout_sec: 300
        interval_sec: 5
    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: infra
        service: infisical
        tag: "{{ recipe.from_version_resolved }}"
        wait: true
      - id: restore_db
        type: exec.shell
        command: >-
          docker exec -i infra-postgresql-1 pg_restore -U postgres
          -d infisical --clean --if-exists
          < ~/.nos/backups/{{ upgrade_id }}/infisical.dump
        allow_shell: true

# ^v?0\.16[0-9]\. are disjoint, so the first-match rule is unambiguous.
  - id: "infisical-0.80-to-0.160"
    from_regex: "^v?0\\.(8[0-9]|9[0-9]|1[0-5][0-9])\\."
    to: "0.160.4"          # existing matrix to_version — NOT invented
    severity: breaking
    changelog_url: "https://github.com/Infisical/infisical/releases"
    notes: |
      UNCOVERED LADDER JUMP. The shipped ladder runs 0.60 → 0.70 → 0.80 and then
      stops; the next rung is ^v?0\.160\. A host anywhere in 0.80–0.159 has no
      path at all, and the hop it needs spans ~80 minor releases of forward-only
      Knex migrations on a SECRETS VAULT. That is breaking by blast radius even
      though every individual release is labelled minor.

      # TODO verify upstream — before this is committed, confirm against the
      # Infisical release notes whether intermediate stops are MANDATORY (the
      # engine's first-match rule means this recipe would otherwise jump the
      # whole span in one boot) and whether the encryption-key / auth-method
      # handling changed anywhere in the span. Do NOT invent intermediate
      # versions; read them off the upstream release list and split this rung
      # into as many hops as upstream requires.

      COEXISTENCE, NOT IN-PLACE. A vault that half-migrates is a vault whose
      secrets cannot be decrypted, and every converge reads through it. Queued:
      tag `infisical-0160`, port offset +10. Stand the new track up beside the
      old one, verify a decrypt of EVERY project, then cut over.

      CAVEAT the operator must weigh: `nos_coexistence` ships supported tracks
      for grafana / postgres / mariadb / authentik / gitea / nextcloud /
      wordpress. Infisical is NOT among them, so the queued row is a REQUEST FOR
      PREP — authoring the track is the work, not running it.
    coexistence_supported: true
    requires: { min_disk_free_gb: 5, service_healthy: true }
    reset:
      scope: stack
      estimated_sec: 600
      affected_services: [infisical]
      reason: >-
        Escalated to stack. The container floor is one recreate, but a vault
        version change makes every secret-resolving consumer re-authenticate,
        and a failed migration blocks the next converge estate-wide.
    pre:
      - id: backup_db
        type: exec.shell
        command: >-
          docker exec infra-postgresql-1 pg_dump -U postgres -Fc infisical
          > ~/.nos/backups/{{ upgrade_id }}/infisical.dump
        allow_shell: true
      - id: backup_data
        type: backup.volume
        src: "{{ infisical_data_dir }}"
        label: "pre-{{ upgrade_id }}"
    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: infra
        service: infisical
        tag: "{{ recipe.to }}"
        wait: true
    post:
      - id: wait_healthy
        type: http.wait
        url: "http://127.0.0.1:{{ infisical_port | default(8075) }}/api/status"
        expect_status: 200
        timeout_sec: 600
        interval_sec: 10
      - id: verify_secret_readback
        type: exec.shell
        # Proves DECRYPT works post-migration, not merely that HTTP answers.
        # Refuses rather than defaults: an empty projectId would make this
        # "verification" pass without decrypting anything.
        command: >-
          pid="{{ infisical_probe_project_id | default('') }}";
          if [ -z "$pid" ]; then
          echo "infisical_probe_project_id is unset — decrypt is NOT proven"; exit 1;
          fi;
          infisical secrets --projectId "$pid" --env dev --silent | head -n 1
        allow_shell: true
    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: infra
        service: infisical
        tag: "{{ recipe.from_version_resolved }}"
        wait: true
      - id: restore_db
        type: exec.shell
        command: >-
          docker exec -i infra-postgresql-1 pg_restore -U postgres
          -d infisical --clean --if-exists
          < ~/.nos/backups/{{ upgrade_id }}/infisical.dump
        allow_shell: true
      - id: restore_data
        type: backup.restore
        dst: "{{ infisical_data_dir }}"
        label: "pre-{{ upgrade_id }}"
