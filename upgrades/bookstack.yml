---
service: bookstack
allow_shell: true   # upgrade recipes need exec.shell for backup/pg_dump/image bump steps
docs_url: "https://www.bookstackapp.com/docs/admin/updates/"
maintainers: ["pazny"]
notes: |
  BookStack ships through the LSIO (linuxserver.io) image pipeline, so the
  tag format is `vX.Y.Z-lsNNN`. Laravel migrations run on container boot
  from the LSIO init scripts; the role's `/config/www/.env` (rendered from
  templates/env.j2) is the authoritative config. Data lives in MariaDB
  (shared from the infra stack) + the /config volume for uploaded media.

  Breaking boundary: v25 -> v26 dropped PHP 8.1 support. Make sure the
  LSIO image you target has PHP 8.2+ (every `vXX.*-lsNNN` after the base
  image bump already does).

recipes:
# The `^v` anchor never matched the real pin (26.05.2, no v prefix).
  - id: "bookstack-minor-or-patch"
    from_regex: "^v?(2[6-9]|3[0-9])\\."
    to: "26.05.2"          # == installed; bare tag form, matches the pin
    severity: patch
    changelog_url: "https://github.com/BookStackApp/BookStack/releases"
    notes: |
      Regex repair + at-target forward coverage. The shipped pattern anchored on
      a literal `v`; roles/pazny.bookstack pins the bare form `26.05.2`, so the
      advisor saw "no upgrade path" on a service that was in fact current.
      Safe in-place bump across minor/patch on the 26.x line — migrations run
      in-container on first boot.
    coexistence_supported: false
    requires: { min_disk_free_gb: 2, service_healthy: true }
    reset:
      scope: container
      estimated_sec: 45
      affected_services: [bookstack]
      reason: >-
        Single-app image bump: compose.set_image_tag force-recreates only
        b2b-bookstack-1. MariaDB is a dependency, not a bounced consumer.
    pre:
      - id: backup_db
        type: exec.shell
        command: >-
          docker exec infra-mariadb-1 mariadb-dump -u root
          -p"{{ mariadb_root_password }}" bookstack
          > ~/.nos/backups/{{ upgrade_id }}/bookstack.sql
        allow_shell: true
      - id: backup_data
        type: backup.volume
        src: "{{ bookstack_data_dir }}"
        label: "pre-{{ upgrade_id }}"
    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: b2b
        service: bookstack
        tag: "{{ recipe.to }}"
        wait: true
    post:
      - id: wait_healthy
        type: http.wait
        url: "http://127.0.0.1:{{ bookstack_port | default(3013) }}/status"
        expect_status: 200
        timeout_sec: 300
        interval_sec: 5
    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: b2b
        service: bookstack
        tag: "{{ recipe.from_version_resolved }}"
        wait: true
      - id: restore_data
        type: backup.restore
        dst: "{{ bookstack_data_dir }}"
        label: "pre-{{ upgrade_id }}"
