---
service: authentik
allow_shell: true   # upgrade recipes need exec.shell for backup/pg_dump/image bump steps
docs_url: "https://docs.goauthentik.io/docs/install-config/upgrade"
maintainers: ["pazny"]
notes: |
  Authentik ships one major + several minors per year. Migrations are
  automatic on container start (Django makemigrations/migrate). nOS
  additionally re-applies blueprints on every playbook run, which handles
  schema drift for providers/applications/policies.

  Authentik has two containers: server and worker. Both must be bumped
  together. compose.set_image_tag accepts a list under `services:`.

recipes:
  - id: "authentik-2024-to-2025"
    from_regex: "^2024\\."
    to: "2025.2.1"
    severity: breaking
    changelog_url: "https://docs.goauthentik.io/docs/releases/2025.2"
    release_date: "2025-02-20"
    notes: |
      2025.x tightens RBAC role binding API (breaking for custom blueprints
      that reference `RoleBinding.target_user`), introduces the mTLS
      provider, and renames some env variables under AUTHENTIK_BOOTSTRAP_*.
      nos re-applies its blueprints after upgrade to re-converge state.

    coexistence_supported: false       # shared postgres schema; dual-running breaks DB

    requires:
      min_disk_free_gb: 2
      service_healthy: true
      other_services_healthy: ["postgresql", "redis"]

    pre:
      - id: backup_data
        type: backup.volume
        src: "{{ authentik_data_dir }}"
        label: "pre-{{ upgrade_id }}"
      - id: backup_db
        type: exec.shell
        allow_shell: true
        command: >-
          docker exec {{ postgresql_container_name | default('nos-postgresql') }}
          pg_dump -U postgres -d authentik --clean --if-exists
          > {{ '~/.nos/backups/' + upgrade_id + '/authentik-db.sql' | expanduser }}
      - id: export_blueprints
        type: http.get_all
        url: "https://{{ authentik_domain | default('auth' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/api/v3/managed/blueprints/"
        auth:
          type: bearer
          token_var: "authentik_bootstrap_token"
        save_to: "~/.nos/backups/{{ upgrade_id }}/blueprints.json"
        ignore_errors: true

    apply:
      - id: bump_image_tags
        type: compose.set_image_tag
        stack: infra
        override: authentik
        services: [authentik-server, authentik-worker]
        tag: "{{ recipe.to }}"
        wait: true

    post:
      - id: wait_server_healthy
        type: http.wait
        # Probe authentik LOCALLY on its host port — NOT the public domain.
        # The public edge (Cloudflare / Traefik forward-auth) returns 403, and
        # authentik's /-/health/live/ returns 200 (not 204). A false-negative
        # here used to fire the destructive rollback below.
        url: "http://127.0.0.1:{{ authentik_port | default(9003) }}/-/health/live/"
        expect_status: [200, 204]
        timeout_sec: 300
        interval_sec: 5
      - id: wait_ready
        type: http.wait
        url: "http://127.0.0.1:{{ authentik_port | default(9003) }}/-/health/ready/"
        expect_status: [200, 204]
        timeout_sec: 180
        interval_sec: 4
      - id: reapply_blueprints
        type: custom.module
        module: ansible.builtin.include_tasks
        args:
          file: "tasks/stacks/authentik-blueprints.yml"
        ignore_errors: true

    rollback:
      # NO automatic rollback. authentik major upgrades run forward-only DB
      # migrations that cannot be cleanly reversed: restoring the pre-upgrade
      # dump under the new code (or reverting the image over a migrated DB)
      # leaves a half-migrated schema — observed 2026-05-30 as a
      # `column cert_expiry already exists` gunicorn boot loop that took SSO
      # down. On post-phase failure authentik is left on the NEW version.
      # Manual recovery: stop authentik, drop+recreate the authentik DB, restore
      # ~/.nos/backups/<upgrade_id>/authentik-db.sql, then start the image whose
      # schema matches the dump (old) — or re-run forward on the clean DB.
      - id: no_auto_rollback
        type: noop

  - id: "authentik-2025-to-2026"
    from_regex: "^2025\\."
    to: "2026.5.2"
    severity: minor
    changelog_url: "https://docs.goauthentik.io/docs/releases/2026.1"
    notes: |
      Assumed-minor. If the upstream 2026.1 notes flip any field breaking,
      bump this recipe's severity and add explicit DB migration guards.

    coexistence_supported: false

    requires:
      min_disk_free_gb: 2
      service_healthy: true
      other_services_healthy: ["postgresql", "redis"]

    pre:
      - id: backup_data
        type: backup.volume
        src: "{{ authentik_data_dir }}"
        label: "pre-{{ upgrade_id }}"
      - id: backup_db
        type: exec.shell
        allow_shell: true
        command: >-
          docker exec {{ postgresql_container_name | default('nos-postgresql') }}
          pg_dump -U postgres -d authentik --clean --if-exists
          > {{ '~/.nos/backups/' + upgrade_id + '/authentik-db.sql' | expanduser }}

    apply:
      - id: bump_image_tags
        type: compose.set_image_tag
        stack: infra
        override: authentik
        services: [authentik-server, authentik-worker]
        tag: "{{ recipe.to }}"
        wait: true

    post:
      - id: wait_server_healthy
        type: http.wait
        # Probe authentik LOCALLY on its host port — NOT the public domain.
        # The public edge (Cloudflare / Traefik forward-auth) returns 403, and
        # authentik's /-/health/live/ returns 200 (not 204). A false-negative
        # here used to fire the destructive rollback below.
        url: "http://127.0.0.1:{{ authentik_port | default(9003) }}/-/health/live/"
        expect_status: [200, 204]
        timeout_sec: 300
        interval_sec: 5
      - id: reapply_blueprints
        type: custom.module
        module: ansible.builtin.include_tasks
        args:
          file: "tasks/stacks/authentik-blueprints.yml"
        ignore_errors: true

    rollback:
      # NO automatic rollback — authentik major upgrades are forward-only (see
      # the 2024-to-2025 rollback note). Restoring the pre-upgrade DB dump under
      # the new code half-migrates the schema and boot-loops the server, which
      # took SSO down on 2026-05-30. On failure authentik stays on the NEW
      # version; recover manually from ~/.nos/backups/<upgrade_id>/authentik-db.sql.
      - id: no_auto_rollback
        type: noop
