---
service: gitlab
allow_shell: true   # upgrade recipes need exec.shell for backup/pg_dump/image bump steps
docs_url: "https://docs.gitlab.com/ee/update/"
maintainers: ["pazny"]
notes: |
  GitLab enforces STRICT stepping-stone upgrades across majors. You
  cannot jump 15 -> 16 -> 17 -> 18 in one go; you must land on the
  documented "required stops" so background migrations drain between
  bumps. Reference:
    https://docs.gitlab.com/ee/update/#upgrade-paths

  Per the 18.x doc (as of 2026-04): 17.x -> 18.x requires landing on
  17.11.z first, then 18.0.z, then 18.latest. Same rules applied to
  15 -> 16 and 16 -> 17 in earlier recipes.

  Background migration health must be verified between major bumps
  via: Admin -> Monitoring -> Background Migrations -> "no stuck jobs".
  The post step exercises gitlab-rake db:migrate:status which, while
  not a full BG-migration check, fails loudly on schema gaps.

  EVERY recipe here is severity: breaking and coexistence_supported:
  false (Omnibus is stateful with internal Postgres+Redis; side-by-
  side requires a second Omnibus stack which is out of scope here).

recipes:
  - id: "gitlab-17-to-17-11"
    from_regex: "^17\\.(?!11)"
    to: "17.11.7-ce.0"
    severity: breaking
    notes: "Land on 17.11.z, the final 17.x stop before 18.x."

    coexistence_supported: false

    requires:
      min_disk_free_gb: 10
      service_healthy: true

    reset:
      scope: container
      estimated_sec: 720
      affected_services: [gitlab]
      reason: >-
        Single compose.set_image_tag recreate of the self-contained Omnibus
        gitlab container (internal PG+Redis bundled, no shared-DB consumers
        cascade); backup/http.wait/migrate-status steps are none-floor.

    pre:
      - id: gitlab_backup
        type: exec.shell
        command: >-
          docker exec devops-gitlab-1 gitlab-backup create STRATEGY=copy
        allow_shell: true
        timeout_sec: 1800
      - id: backup_config
        type: backup.volume
        src: "{{ gitlab_config_dir }}"
        label: "pre-{{ upgrade_id }}-config"

    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: devops
        service: gitlab
        tag: "{{ recipe.to }}"
        wait: true

    post:
      - id: wait_readiness
        type: http.wait
        url: "http://127.0.0.1:{{ gitlab_http_port | default(8929) }}/-/readiness"
        expect_status: 200
        timeout_sec: 900
        interval_sec: 15
      - id: verify_migrations
        type: exec.shell
        command: "docker exec devops-gitlab-1 gitlab-rake db:migrate:status | tail -5"
        allow_shell: true

    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: devops
        service: gitlab
        tag: "{{ recipe.from_version_resolved }}"
        wait: true

  - id: "gitlab-17-11-to-18-0"
    from_regex: "^17\\.11\\."
    to: "18.0.5-ce.0"
    severity: breaking
    notes: "First 18.x hop. Background migrations MUST finish before the next bump."

    coexistence_supported: false

    requires:
      min_disk_free_gb: 10
      service_healthy: true

    reset:
      scope: container
      estimated_sec: 720
      affected_services: [gitlab]
      reason: >-
        Apply is one compose.set_image_tag of the gitlab service only; Omnibus is
        a single stateful container so the bump force-recreates just
        devops-gitlab-1, no stack-wide consumer reconnect.

    pre:
      - id: gitlab_backup
        type: exec.shell
        command: "docker exec devops-gitlab-1 gitlab-backup create STRATEGY=copy"
        allow_shell: true
        timeout_sec: 1800

    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: devops
        service: gitlab
        tag: "{{ recipe.to }}"
        wait: true

    post:
      - id: wait_readiness
        type: http.wait
        url: "http://127.0.0.1:{{ gitlab_http_port | default(8929) }}/-/readiness"
        expect_status: 200
        timeout_sec: 900
        interval_sec: 15

    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: devops
        service: gitlab
        tag: "{{ recipe.from_version_resolved }}"
        wait: true

  - id: "gitlab-18-to-current"
    from_regex: "^18\\.([0-9]|[1-9][0-9])\\."
    to: "18.11.9-ce.0"     # == installed (was 18.10.3-ce.0, BEHIND the pin)
    severity: security
    changelog_url: "https://about.gitlab.com/releases/"
    notes: |
      Stale-target repair. The shipped `to` (18.10.3-ce.0) sits BELOW the pinned
      18.11.9-ce.0, so the advisor was offering a downgrade across forward-only
      background migrations — GitLab does not support that and it is not a
      rollback either (rollback restores the data dir; this would not).
      18.11.9 is the terminal 18.11.x build (REM-159: 18.11.8 was withdrawn
      upstream). Patch/minor bumps inside 18.x are a single Omnibus recreate.
      BEFORE the next MAJOR hop: `gitlab-rake db:background_migrations:status`
      must read finished, per the 17.11→18.0 track's own rule.
    coexistence_supported: false
    requires: { min_disk_free_gb: 10, service_healthy: true }
    reset:
      scope: container
      estimated_sec: 540
      affected_services: [gitlab]
      reason: >-
        Single compose.set_image_tag recreate of the self-contained Omnibus
        container (PG+Redis bundled); backup and http.wait are none-floor.
    pre:
      - id: backup_app
        type: exec.shell
        command: >-
          docker exec devops-gitlab-1 gitlab-backup create
          BACKUP={{ upgrade_id }} STRATEGY=copy
        allow_shell: true
      - id: backup_data
        type: backup.volume
        src: "{{ gitlab_data_dir }}"
        label: "pre-{{ upgrade_id }}"
    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: devops
        service: gitlab
        tag: "{{ recipe.to }}"
        wait: true
    post:
      - id: wait_healthy
        type: http.wait
        url: "http://127.0.0.1:{{ gitlab_http_port | default(8929) }}/-/readiness"
        expect_status: 200
        timeout_sec: 900
        interval_sec: 10
      - id: background_migrations_drained
        type: exec.shell
        command: >-
          docker exec devops-gitlab-1 gitlab-rake
          db:background_migrations:status
        allow_shell: true
    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: devops
        service: gitlab
        tag: "{{ recipe.from_version_resolved }}"
        wait: true
      - id: restore_data
        type: backup.restore
        dst: "{{ gitlab_data_dir }}"
        label: "pre-{{ upgrade_id }}"

