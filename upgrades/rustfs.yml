---
service: rustfs
allow_shell: true   # upgrade recipes need exec.shell for backup/pg_dump/image bump steps
docs_url: "https://github.com/rustfs/rustfs"
maintainers: ["pazny"]
notes: |
  RustFS is still in alpha (1.0.0-alpha.x); every image bump may change
  wire format / on-disk layout. Buckets and objects live at
  {{ rustfs_data_dir }}. Access keys come from role defaults.
  Rolling-release: pin the tag tightly and verify bucket listing after.

recipes:
  - id: "rustfs-alpha-bump"
    from_regex: "^1\\.0\\.0-alpha\\."
    to: "1.0.0-alpha.93"
    severity: security
    notes: |
      Alpha ->alpha bump. Pin reason for 1.0.0-alpha.93 specifically:
      - CVE-2025-68926 patched
      - alpha.91 tightened multipart auth (#2411)
      - alpha.x OIDC claim matching fix (#2386)

      Data is in a bind-mount; a tar snapshot is enough safety.

    coexistence_supported: false

    requires:
      min_disk_free_gb: 3
      service_healthy: true

    reset:
      scope: container
      estimated_sec: 75
      affected_services: [rustfs]
      reason: >-
        Image bump via compose.set_image_tag force-recreates only the
        iiab-rustfs-1 container; pre/post are fs snapshot + S3 list/diff + http
        health-wait, no shared-DB cascade or host op.

    pre:
      - id: snapshot_data
        type: exec.shell
        command: >-
          cp -al {{ rustfs_data_dir }}
          {{ rustfs_data_dir }}.pre-{{ upgrade_id }}
        allow_shell: true
      - id: list_buckets_before
        type: exec.shell
        command: >-
          AWS_ACCESS_KEY_ID="{{ rustfs_access_key }}"
          AWS_SECRET_ACCESS_KEY="{{ rustfs_secret_key }}"
          aws --endpoint-url http://127.0.0.1:{{ rustfs_api_port | default(9010) }}
          s3api list-buckets --query 'Buckets[].Name' --output json
          > ~/.nos/backups/{{ upgrade_id }}/buckets-before.json
        allow_shell: true

    apply:
      # No explicit pull — compose.set_image_tag runs `up -d --wait`, which
      # pulls the new tag if absent. A bare `docker compose pull` has no -f
      # context in the engine's exec.shell cwd and fails "no config file".
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: iiab
        service: rustfs
        tag: "{{ recipe.to }}"
        wait: true

    post:
      - id: wait_health
        type: http.wait
        url: "http://127.0.0.1:{{ rustfs_api_port | default(9010) }}/health"
        expect_status: 200
        timeout_sec: 120
        interval_sec: 3
      - id: verify_buckets
        type: exec.shell
        command: >-
          AWS_ACCESS_KEY_ID="{{ rustfs_access_key }}"
          AWS_SECRET_ACCESS_KEY="{{ rustfs_secret_key }}"
          aws --endpoint-url http://127.0.0.1:{{ rustfs_api_port | default(9010) }}
          s3api list-buckets --query 'Buckets[].Name' --output json
          > ~/.nos/backups/{{ upgrade_id }}/buckets-after.json
          && diff -q
          ~/.nos/backups/{{ upgrade_id }}/buckets-before.json
          ~/.nos/backups/{{ upgrade_id }}/buckets-after.json
        allow_shell: true

    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: iiab
        service: rustfs
        tag: "{{ recipe.from_version_resolved }}"
        wait: true
      - id: restore_snapshot
        type: exec.shell
        command: |
          rm -rf {{ rustfs_data_dir }}
          mv {{ rustfs_data_dir }}.pre-{{ upgrade_id }} {{ rustfs_data_dir }}
        allow_shell: true

# alpha recipe's regex to ^1\.0\.0-alpha\.(?!9[3-9]) if the operator wants
# in-line alpha bumps to keep winning. As drafted the patterns are disjoint.
  - id: "rustfs-alpha-to-beta"
    from_regex: "^1\\.0\\.0-alpha\\.9[3-9]$"
    to: "1.0.0-beta.11"    # == installed — NOT invented
    severity: breaking
    changelog_url: "https://github.com/rustfs/rustfs/releases"
    notes: |
      UNCOVERED LINE CHANGE. The shipped recipe tops out at 1.0.0-alpha.93; the
      estate runs 1.0.0-beta.11 and nothing describes how it got there. A
      pre-1.0 object store changing release line is breaking on principle — the
      on-disk layout, the S3 auth path and the OIDC claim handling all moved
      (the pin's own comment cites CVE-2025-68926, the alpha.91 multipart-auth
      hardening #2411 and the OIDC claim fix #2386).

      # TODO verify upstream — confirm against the rustfs release notes whether
      # alpha.93 → beta.x migrates the on-disk object layout in place or
      # requires a fresh volume with an S3-level copy. This recipe assumes the
      # SAFE reading (fresh track + copy), which is why it is coexistence-only.

      THIS SERVICE HOLDS THE NIGHTLY BACKUP TARGET. An in-place bump that
      cannot read back its own buckets destroys the restore path at the same
      moment it destroys the service. Queued: tag `rustfs-beta`, offset +10 —
      stand beta beside alpha, verify bucket listing AND object readback of a
      real backup artifact, then cut over.

      CAVEAT: rustfs is not in `nos_coexistence`'s supported set (grafana /
      postgres / mariadb / authentik / gitea / nextcloud / wordpress). The
      queued row is a request for PREP; authoring the track is the work.
    coexistence_supported: true
    requires: { min_disk_free_gb: 20, service_healthy: true }
    reset:
      scope: stack
      estimated_sec: 300
      affected_services: [rustfs]
      reason: >-
        Escalated to stack: rustfs is the S3 endpoint the backup job and any
        restic/rclone consumer writes to; a recreate that changes the release
        line invalidates in-flight backup runs, not just HTTP sessions.
    pre:
      - id: backup_data
        type: backup.volume
        src: "{{ rustfs_data_dir }}"
        label: "pre-{{ upgrade_id }}"
      - id: record_bucket_inventory
        type: exec.shell
        # The pre-state the post-step must reproduce. Written to the backup dir
        # so a failed cutover can be COMPARED, not guessed at.
        command: >-
          aws --endpoint-url http://127.0.0.1:{{ rustfs_api_port | default(9010) }}
          s3 ls --recursive s3://
          > ~/.nos/backups/{{ upgrade_id }}/rustfs-inventory.txt
        allow_shell: true
    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: iiab
        service: rustfs
        tag: "{{ recipe.to }}"
        wait: true
    post:
      - id: wait_console
        type: http.wait
        url: "http://127.0.0.1:{{ rustfs_console_port | default(9001) }}/"
        expect_status: 200
        timeout_sec: 300
        interval_sec: 5
      - id: verify_inventory_matches
        type: exec.shell
        # Readback, not liveness. A rustfs that answers HTTP with an empty
        # object store is the exact failure this whole recipe exists to catch.
        command: >-
          aws --endpoint-url http://127.0.0.1:{{ rustfs_api_port | default(9010) }}
          s3 ls --recursive s3://
          | diff - ~/.nos/backups/{{ upgrade_id }}/rustfs-inventory.txt
        allow_shell: true
    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: iiab
        service: rustfs
        tag: "{{ recipe.from_version_resolved }}"
        wait: true
      - id: restore_data
        type: backup.restore
        dst: "{{ rustfs_data_dir }}"
        label: "pre-{{ upgrade_id }}"

  - id: "rustfs-beta-current"
    from_regex: "^1\\.0\\.0-beta\\."
    to: "1.0.0-beta.11"    # == installed
    severity: security
    changelog_url: "https://github.com/rustfs/rustfs/releases"
    notes: |
      At-target forward coverage for the beta line the estate actually runs.
      In-line beta bumps are a tag swap on the same on-disk layout. The
      inventory diff is kept from the alpha→beta rung deliberately: on a
      pre-1.0 store, "it started" is not evidence that "it still has the data".
      Re-read this rung's severity when rustfs reaches 1.0.0 final — a stable
      line deserves its own track, not this one widened.
    coexistence_supported: false
    requires: { min_disk_free_gb: 10, service_healthy: true }
    reset:
      scope: container
      estimated_sec: 90
      affected_services: [rustfs]
      reason: >-
        Same-line tag swap: only the rustfs container recreates. Backup
        consumers reconnect on their next scheduled run.
    pre:
      - id: backup_data
        type: backup.volume
        src: "{{ rustfs_data_dir }}"
        label: "pre-{{ upgrade_id }}"
      - id: record_bucket_inventory
        type: exec.shell
        command: >-
          aws --endpoint-url http://127.0.0.1:{{ rustfs_api_port | default(9010) }}
          s3 ls --recursive s3://
          > ~/.nos/backups/{{ upgrade_id }}/rustfs-inventory.txt
        allow_shell: true
    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: iiab
        service: rustfs
        tag: "{{ recipe.to }}"
        wait: true
    post:
      - id: wait_console
        type: http.wait
        url: "http://127.0.0.1:{{ rustfs_console_port | default(9001) }}/"
        expect_status: 200
        timeout_sec: 300
        interval_sec: 5
      - id: verify_inventory_matches
        type: exec.shell
        command: >-
          aws --endpoint-url http://127.0.0.1:{{ rustfs_api_port | default(9010) }}
          s3 ls --recursive s3://
          | diff - ~/.nos/backups/{{ upgrade_id }}/rustfs-inventory.txt
        allow_shell: true
    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: iiab
        service: rustfs
        tag: "{{ recipe.from_version_resolved }}"
        wait: true
      - id: restore_data
        type: backup.restore
        dst: "{{ rustfs_data_dir }}"
        label: "pre-{{ upgrade_id }}"
