---
service: mariadb
allow_shell: true   # upgrade recipes need exec.shell for backup/pg_dump/image bump steps
docs_url: "https://mariadb.com/kb/en/upgrading/"
maintainers: ["pazny"]
notes: |
  MariaDB majors (10.x -> 11.x) change table format and mysql.* system
  tables. The standard path is mariadb-upgrade running against the live
  server. Because nos runs MariaDB in a container with a bind-mounted data
  dir, the sequence is: backup -> pull new image -> start -> run
  mariadb-upgrade -> verify.

recipes:
  - id: "mariadb-10-to-11"
    from_regex: "^10\\."
    to: "11.4"
    severity: breaking
    changelog_url: "https://mariadb.com/kb/en/changes-improvements-in-mariadb-11-0/"
    release_date: "2023-06-06"
    notes: |
      11.x renames several *_create_options system variables, removes
      SUPER privilege for certain legacy actions, and tightens
      InnoDB defaults. nos apps (WordPress, Nextcloud, FreeScout,
      BookStack, Firefly, ERPNext) have been tested on 11.4.

    coexistence_supported: true
    coexistence_port_offset: 100

    requires:
      min_disk_free_gb: 3
      service_healthy: true

    reset:
      scope: stack
      estimated_sec: 120
      affected_services: [mariadb, wordpress, nextcloud, bookstack, firefly, erpnext, freescout, freepbx]
      reason: >-
        Major 10->11 stops/restarts the shared infra MariaDB (compose
        stop->image bump->up + mariadb-upgrade), forcing all consumers to
        reconnect.

    pre:
      - id: backup_data
        type: backup.volume
        src: "{{ mariadb_data_dir }}"
        label: "pre-{{ upgrade_id }}"
      - id: sql_dump_all
        type: exec.shell
        allow_shell: true
        command: >-
          docker exec {{ mariadb_container_name | default('nos-mariadb') }}
          mariadb-dump -uroot -p"{{ mariadb_root_password }}"
          --all-databases --events --routines --triggers
          > {{ '~/.nos/backups/' + upgrade_id + '/mariadb-all.sql' | expanduser }}

    apply:
      - id: stop_service
        type: compose.restart_service
        stack: infra
        service: mariadb
        action: stop
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: infra
        service: mariadb
        tag: "{{ recipe.to }}"
        wait: false
      - id: start_service
        type: compose.restart_service
        stack: infra
        service: mariadb
        action: up
        wait: true
      - id: run_mariadb_upgrade
        type: exec.shell
        allow_shell: true
        # Idempotent: mariadb-upgrade exits 0 and prints "already upgraded"
        # on a repeat run.
        command: >-
          docker exec {{ mariadb_container_name | default('nos-mariadb') }}
          mariadb-upgrade -uroot -p"{{ mariadb_root_password }}"
          --force

    post:
      - id: wait_ready
        type: http.wait
        url: "tcp://{{ mariadb_host | default('localhost') }}:{{ mariadb_port | default(3306) }}"
        timeout_sec: 90
        interval_sec: 2
      - id: verify_version
        type: exec.shell
        allow_shell: true
        command: >-
          docker exec {{ mariadb_container_name | default('nos-mariadb') }}
          mariadb -uroot -p"{{ mariadb_root_password }}"
          -e "SELECT VERSION();"

    rollback:
      - id: stop_service
        type: compose.restart_service
        stack: infra
        service: mariadb
        action: stop
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: infra
        service: mariadb
        tag: "{{ recipe.from_version_resolved }}"
        wait: false
      - id: restore_data
        type: backup.restore
        dst: "{{ mariadb_data_dir }}"
        label: "pre-{{ upgrade_id }}"
      - id: start_service
        type: compose.restart_service
        stack: infra
        service: mariadb
        action: up
        wait: true

  - id: "mariadb-11-current"
    from_regex: "^11\\."
    to: "11.8.8"           # == installed (was 11.8.6, BEHIND the pin)
    severity: security
    changelog_url: "https://mariadb.com/kb/en/release-notes/"
    notes: |
      Stale-target repair. 11.8.8 carries REM-102 (CVE-2026-49261, and the
      earlier CVE-2026-32710 / CVE-2026-3494 patched in 11.8.6); the recipe
      still pointed one patch below the pin.
      In-branch patch bumps on the 11.8 line: no mariadb-upgrade data-format
      step, but `mariadb-upgrade` is run post-boot anyway because it is cheap
      and idempotent. DO NOT widen this regex to cover a 11.8 → 12.x jump — the
      11.4.10 FK-ALTER crash on Apple Silicon is the standing reason major
      MariaDB moves get their own supervised rung.
    coexistence_supported: true
    requires: { min_disk_free_gb: 10, service_healthy: true }
    reset:
      scope: stack
      estimated_sec: 300
      affected_services: [mariadb]
      reason: >-
        Escalated to stack: the DB ENGINE restarts, so every MariaDB-backed
        consumer (wordpress, nextcloud, bookstack, freescout, firefly,
        hedgedoc...) drops its pool and reconnects.
    pre:
      - id: backup_all_databases
        type: exec.shell
        command: >-
          docker exec infra-mariadb-1 mariadb-dump -u root
          -p"{{ mariadb_root_password }}" --all-databases --single-transaction
          --routines --events
          > ~/.nos/backups/{{ upgrade_id }}/mariadb-all.sql
        allow_shell: true
      - id: backup_data
        type: backup.volume
        src: "{{ mariadb_data_dir }}"
        label: "pre-{{ upgrade_id }}"
    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: infra
        service: mariadb
        tag: "{{ recipe.to }}"
        wait: true
    post:
      - id: run_mariadb_upgrade
        type: exec.shell
        command: >-
          docker exec infra-mariadb-1 mariadb-upgrade -u root
          -p"{{ mariadb_root_password }}"
        allow_shell: true
      - id: verify_select
        type: exec.shell
        command: >-
          docker exec infra-mariadb-1 mariadb -u root
          -p"{{ mariadb_root_password }}" -e "SELECT VERSION();"
        allow_shell: true
    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: infra
        service: mariadb
        tag: "{{ recipe.from_version_resolved }}"
        wait: true
      - id: restore_data
        type: backup.restore
        dst: "{{ mariadb_data_dir }}"
        label: "pre-{{ upgrade_id }}"

