---
service: freescout
allow_shell: true   # backup/restore + image-bump steps need exec.shell
docs_url: "https://github.com/nfrastack/docker-freescout"
maintainers: ["pazny"]
notes: |
  FreeScout runs on the nfrastack image (formerly tiredofit, which ended the
  php8.3-1.17.x line at 1.17.999 and moved the 2.x line to nfrastack/freescout).
  App data lives in MariaDB (shared from the infra stack) + the /data volume;
  the image runs Laravel migrations on container boot.

  REM-118 (CVE-2026-53595, CVSS 9.4): the pinned tiredofit build php8.3-1.17.159
  bundles FreeScout 1.8.219, which is vulnerable to unauthenticated account
  takeover on MySQL/MariaDB (a %20/empty invite_hash collision at /user-setup)
  plus three more unauth/auth CVEs. All fixed at/below 1.8.224; nfrastack
  2.1.3-php8.3 bundles 1.8.226.

  CROSS-ORG MIGRATION — read this: this is not a plain tag bump. The image ORG
  changes (tiredofit → nfrastack) and 2.x renamed SITE_URL → APP_URL. Those two
  changes live in the ROLE compose template (roles/pazny.freescout/templates/
  compose.yml.j2) + the freescout_version pin in default.config.yml, so a normal
  `ansible-playbook main.yml` converge re-renders the override with the new
  org+env+tag and recreates the container = the actual upgrade (fail-loud: the
  STRICT wait-stacks-healthy blocks if 2.x does not come up). This recipe pins the
  target tag + wraps the transition with a DB dump (pre), a health gate (post),
  and a rollback, for a supervised `--tags upgrade -e upgrade_service=freescout`
  apply AFTER the template renders nfrastack (or as the safe re-apply record).
  Back up the DB before a blind converge; the MariaDB data persists, so a failed
  2.x boot is recoverable by reverting freescout_version + the template org.

recipes:
  - id: "freescout-1.17-to-2.1"
    from_regex: "^php8\\.[0-9]+-1\\.17\\."
    to: "2.1.3-php8.3"
    severity: security
    release_date: "2026-06-27"
    notes: |
      tiredofit php8.x-1.17.x (FreeScout ~1.8.219) → nfrastack 2.1.3-php8.3
      (FreeScout 1.8.226). Closes REM-118 + the June-2026 FreeScout advisory
      cluster. Migrations are forward-only + run on boot; rollback restores the
      pre-upgrade DB dump. The org+env change is template-driven (see notes above).

    coexistence_supported: false

    requires:
      min_disk_free_gb: 2
      service_healthy: true

    reset:
      scope: container
      estimated_sec: 120
      affected_services: [freescout]
      reason: >-
        Single-app recreate: only b2b-freescout-1 bounces (compose recreate on
        the new org+tag). Shared MariaDB is a dependency, not a restarted
        consumer; backups + http health gate are read-only. First 2.x boot runs
        Laravel migrations so the health gate allows a generous window.

    pre:
      - id: backup_db
        type: exec.shell
        command: >-
          docker exec infra-mariadb-1 mariadb-dump
          -u root -p"{{ mariadb_root_password }}"
          --single-transaction --routines "{{ freescout_db_name }}"
          > ~/.nos/backups/{{ upgrade_id }}/freescout.sql
        allow_shell: true
      - id: backup_data
        type: backup.volume
        src: "{{ freescout_data_dir }}"
        label: "pre-{{ upgrade_id }}"

    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: b2b
        service: freescout
        tag: "{{ recipe.to }}"
        wait: true

    post:
      - id: wait_healthy
        type: http.wait
        url: "http://127.0.0.1:{{ freescout_port | default(8090) }}/login"
        expect_status: 200
        timeout_sec: 300
        interval_sec: 5

    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: b2b
        service: freescout
        tag: "{{ recipe.from_version_resolved }}"
        wait: true
      - id: restore_db
        type: exec.shell
        command: >-
          docker exec -i infra-mariadb-1 mariadb
          -u root -p"{{ mariadb_root_password }}" "{{ freescout_db_name }}"
          < ~/.nos/backups/{{ upgrade_id }}/freescout.sql
        allow_shell: true
      - id: restore_data
        type: backup.restore
        dst: "{{ freescout_data_dir }}"
        label: "pre-{{ upgrade_id }}"
