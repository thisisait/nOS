---
service: redis
allow_shell: true   # upgrade recipes need exec.shell for backup/pg_dump/image bump steps
docs_url: "https://redis.io/docs/latest/operate/oss_and_stack/management/"
maintainers: ["pazny"]
notes: |
  Redis minor/major bumps are generally transparent: RDB/AOF on-disk format
  is backward-compatible across 6.x/7.x/8.x. The standard procedure is
  restart on the new image. nos uses Redis as a shared cache/queue for
  Authentik, Infisical, Outline, Superset, Firefly, ERPNext, BookStack and
  OnlyOffice, so data loss on restart is acceptable — we still snapshot for safety.

recipes:
  - id: "redis-7-to-8"
    from_regex: "^7\\."
    to: "8.0"
    severity: minor
    changelog_url: "https://github.com/redis/redis/releases"
    notes: |
      Redis 8 promotes RESP3 as default, enables cluster-friendly defaults,
      and ships Redis Stack modules built-in. For nos's usage pattern
      (cache + queue) the upgrade is effectively a swap.

    coexistence_supported: false       # shared cache — not worth dual-running

    requires:
      min_disk_free_gb: 1
      service_healthy: true

    reset:
      scope: stack
      estimated_sec: 60
      affected_services: [redis, authentik, infisical, outline, superset, firefly, erpnext, bookstack, onlyoffice]
      reason: >-
        compose.set_image_tag bounces the redis container (floor=container),
        escalated to stack because Redis is a shared cache/queue forcing every
        consumer (Authentik, Infisical, Outline, Superset, Firefly, ERPNext,
        BookStack, OnlyOffice) to reconnect.

    pre:
      - id: backup_data
        type: backup.volume
        src: "{{ redis_data_dir }}"
        label: "pre-{{ upgrade_id }}"
      - id: save_rdb
        type: exec.shell
        allow_shell: true
        # Forces a synchronous RDB snapshot so the tar includes the freshest
        # state.  BGSAVE would race with backup.volume above.
        command: >-
          docker exec {{ redis_container_name | default('nos-redis') }}
          redis-cli SAVE
        ignore_errors: true

    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: infra
        service: redis
        tag: "{{ recipe.to }}"
        wait: true

    post:
      - id: wait_ready
        type: http.wait
        url: "tcp://{{ redis_host | default('localhost') }}:{{ redis_port | default(6379) }}"
        timeout_sec: 60
        interval_sec: 2
      - id: ping
        type: exec.shell
        allow_shell: true
        command: >-
          docker exec {{ redis_container_name | default('nos-redis') }}
          redis-cli PING
      - id: verify_version
        type: exec.shell
        allow_shell: true
        command: >-
          docker exec {{ redis_container_name | default('nos-redis') }}
          redis-cli INFO server

    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: infra
        service: redis
        tag: "{{ recipe.from_version_resolved }}"
        wait: false
      - id: restore_data
        type: backup.restore
        dst: "{{ redis_data_dir }}"
        label: "pre-{{ upgrade_id }}"
      - id: restart_service
        type: compose.restart_service
        stack: infra
        service: redis
        action: up
        wait: true

  - id: "redis-8-current"
    from_regex: "^8\\."
    to: "8.10.1"           # == installed (was 8.0, an EOL branch BELOW the pin)
    severity: security
    changelog_url: "https://github.com/redis/redis/releases"
    notes: |
      Stale-target repair, and the worst-shaped one in the matrix: `to: 8.0`
      pointed at the EOL 8.0 branch that REM-103 explicitly re-pinned AWAY from
      (it supersedes 7.4.6 / CVE-2025-49844 RediShell RCE). Acting on the
      shipped recipe would have been a security REGRESSION dressed as an
      upgrade. 8.10.1 is the REM-216 coordinated all-branch release of
      2026-08-17.
      Redis here is a cache/queue backend: the durable state is RDB/AOF in the
      data dir, and an in-branch bump reads both formats. BGSAVE first anyway.
    coexistence_supported: false
    requires: { min_disk_free_gb: 2, service_healthy: true }
    reset:
      scope: stack
      estimated_sec: 90
      affected_services: [redis]
      reason: >-
        Escalated to stack: every Redis-backed consumer (authentik server+worker,
        n8n, nextcloud, paperclip...) loses its connection pool on the recreate.
    pre:
      - id: force_snapshot
        type: exec.shell
        command: "docker exec infra-redis-1 redis-cli BGSAVE"
        allow_shell: true
      - id: backup_data
        type: backup.volume
        src: "{{ redis_data_dir }}"
        label: "pre-{{ upgrade_id }}"
    apply:
      - id: bump_image_tag
        type: compose.set_image_tag
        stack: infra
        service: redis
        tag: "{{ recipe.to }}"
        wait: true
    post:
      - id: verify_ping
        type: exec.shell
        command: "docker exec infra-redis-1 redis-cli PING"
        allow_shell: true
    rollback:
      - id: revert_image_tag
        type: compose.set_image_tag
        stack: infra
        service: redis
        tag: "{{ recipe.from_version_resolved }}"
        wait: true
      - id: restore_data
        type: backup.restore
        dst: "{{ redis_data_dir }}"
        label: "pre-{{ upgrade_id }}"
