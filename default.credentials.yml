# ==============================================================================

# n8n since v1.0 does not support setting the password via env vars.

# ==============================================================================
# RUSTFS (only if install_rustfs: true)
# S3 API login: {{ global_password_prefix }}_pw_rustfs_access / {{ global_password_prefix }}_pw_rustfs_secret
# Web console: https://fs.dev.local
# ==============================================================================

rustfs_access_key: "{{ nos_derived_secrets.rustfs_access }}"
rustfs_secret_key: "{{ nos_derived_secrets.rustfs_secret }}"

# ==============================================================================
# BACKUP — client-side encryption passphrase (pazny.backup)
# AES-256-CBC/pbkdf2 over every dump BEFORE it lands in RustFS object storage,
# so a bucket/disk compromise never exposes cleartext personal data. Restore
# reads the SAME value to decrypt — losing it makes encrypted backups
# unrecoverable, so custody it alongside global_password_prefix.
# ==============================================================================

# P2 (2026-08-02): NOT derived from the prefix any more. It used to be
# `{{ global_password_prefix }}_pw_backup_encryption`, which made the chain
# prefix -> archive key -> the copy of ~/.nos/secrets.yml inside the archive ->
# every secret the estate deliberately randomised. REM-144 leaked that prefix.
# Empty = main.yml mints a 256-bit random value on first run and persists it;
# the outgoing derived key is preserved in backup_encryption_keys_previous so
# archives written before the rotation still open.
# A literal here still wins, as with every other credential in this file.
backup_encryption_passphrase: ""

# ==============================================================================
# BACKREST — local daemon login (pazny.backrest, sec-backrest-auth)
# Not a fallback for the Authentik edge gate: the edge guards the EDGE, and any
# container with a host-gateway alias reaches :9898 without passing it.
# ==============================================================================
backrest_admin_password: "{{ nos_derived_secrets.backrest_admin }}"

# ==============================================================================
# WOODPECKER CI (only if install_woodpecker: true)
# Login: via Gitea OAuth2 (no local password)
# Requires an OAuth2 app in Gitea: Settings -> Applications -> OAuth2
# ==============================================================================

woodpecker_agent_secret: "{{ nos_derived_secrets.woodpecker }}"
woodpecker_gitea_client: ""   # auto-provisioned on first run (post-oauth.yml); leave empty
woodpecker_gitea_secret: ""   # auto-provisioned on first run (post-oauth.yml); leave empty

# ── A16 (2026-05-17): autowiring tokens ────────────────────────────────
# gitea_api_token: NO LONGER needed by the playbook as of A19 (2026-05-24) —
#   the nOS repo-autowire (post-repo.yml) uses Gitea Admin Basic auth over
#   127.0.0.1. Still consumed (optionally) by the `tools/nos-push` operator
#   wrapper for its mirror-sync trigger, which degrades gracefully when empty.
#   Leave empty unless you use nos-push; provision via Gitea → Profile →
#   Settings → Applications → Generate New Token (scope: write:repository).
# woodpecker_api_token: required when install_woodpecker_autowire_nos=true.
#   OAuth-derived, cannot be autowired — provision one-time:
#   Woodpecker → User Settings → Personal Access Tokens → Generate
gitea_api_token: ""
woodpecker_api_token: ""

# ==============================================================================
# GITLAB (only if install_gitlab: true)
# Default login: root / {{ global_password_prefix }}_pw_gitlab
