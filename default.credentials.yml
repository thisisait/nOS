---
# credentials.yml - PASSWORDS, TOKENS and PERSONAL SETTINGS
# ─────────────────────────────────────────────────────────────────────────────
# This file is in .gitignore - NEVER commit it!
#
# Usage:
#   cp credentials.example.yml credentials.yml
#   nano credentials.yml        # fill in passwords, optionally override paths
#
# Generate random passwords (run in terminal):
#   openssl rand -hex 32
#
# Note: Passwords resolve from the DERIVED MAP (`nos_derived_secrets.<key>`)
#       (Secrets P1, docs/secrets-p1-hkdf.md), computed once per run by the
#       nos_secret_map module from files/anatomy/secrets/registry.yml.
#       Scheme v1 (hosts converged before P1) reproduces the legacy
#       `<prefix>_pw_<key>` byte-identical; scheme v2 (after a confirmed
#       blank) derives HKDF leaves of a random master that is never rendered,
#       so one leaked credential yields exactly one credential. The default
#       prefix `changeme` is in `default.config.yml:8`; a confirmed removal
#       still prompts for it. For a permanent custom password write a
#       **literal** into `credentials.yml` (e.g. `grafana_admin_password:
#       "my-secret-42"`) - the literal shadows the map reference, unchanged.
# ─────────────────────────────────────────────────────────────────────────────

# ==============================================================================
# GIT CONFIGURATION
# ==============================================================================

git_user_name: "Pázny"                    # git config --global user.name (empty = skip)
git_user_email: "pazny.develop@gmail.com"                   # git config --global user.email

# ==============================================================================
# SYSTEM SERVICES
# ==============================================================================

# Tailscale pre-auth key (optional - without it an interactive login runs)
# tailscale_auth_key: ""    # Get one at: https://login.tailscale.com/admin/settings/keys

# ==============================================================================
# DATABASE - MariaDB (only if install_mariadb: true)
# Passwords in mariadb_users are taken automatically from wordpress_db_password
# and nextcloud_db_password below - DO NOT redefine them!
# ==============================================================================

