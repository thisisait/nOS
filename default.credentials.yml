# Requires: PostgreSQL + Redis Docker
# ==============================================================================

superset_db_password: "{{ nos_derived_secrets.superset }}"
superset_secret_key: "{{ nos_derived_secrets.superset_secret }}"

# ==============================================================================
# BLUESKY PDS (only if install_bluesky_pds: true)
# Admin login via pdsadmin CLI: pdsadmin account create
# Federated identity: @user.bsky.dev.local
# ==============================================================================

bluesky_pds_admin_password: "{{ nos_derived_secrets.bluesky }}"
bluesky_pds_jwt_secret: "{{ global_password_prefix }}_pw_bluesky_jwt"
bluesky_pds_rotation_key: ""   # openssl rand -hex 32

# ==============================================================================
# PAPERCLIP (only if install_paperclip: true)
# Dashboard: https://paperclip.dev.local
# ==============================================================================

paperclip_db_password: "{{ nos_derived_secrets.paperclip }}"
paperclip_db_user: "paperclip"                    # Override DB user (default: paperclip)

# ==============================================================================
# AUTHENTIK (only if install_authentik: true)
# SSO/IdP: https://auth.dev.local
# ==============================================================================

authentik_secret_key: "{{ global_password_prefix }}_pw_authentik_secret"   # openssl rand -hex 50
authentik_db_password: "{{ nos_derived_secrets.authentik_db }}"
authentik_bootstrap_password: "{{ nos_derived_secrets.authentik_admin }}"
authentik_bootstrap_email: "{{ default_admin_email }}"

# ── Infisical seed: Authentik admin + per-service OIDC client_secret values ──
# These are consumed by the `infisical_seed_secrets` nos-identity block in
# default.config.yml ONLY via `| default(global_password_prefix + '_pw_oidc_<svc>')`.
# They MUST also exist as real definitions: under `template_vars: "{{ vars }}"`
# the loader eagerly resolves the entire var namespace and an undefined var aborts
# the run even when guarded by default() (the akadmin/oidc twins of mysqld_exporter
# above). The five remaining oidc secrets (nodered/homeassistant/erpnext/freescout/
# superset) are already defined inline next to their service config in config.yml.
# Values match the default() fallbacks byte-for-byte → behaviour unchanged.
akadmin_password: "{{ nos_derived_secrets.akadmin }}"
authentik_oidc_outline_client_secret: "{{ nos_derived_secrets.oidc_outline }}"
authentik_oidc_grafana_client_secret: "{{ nos_derived_secrets.oidc_grafana }}"
authentik_oidc_infisical_client_secret: "{{ nos_derived_secrets.oidc_infisical }}"
authentik_oidc_portainer_client_secret: "{{ nos_derived_secrets.oidc_portainer }}"
authentik_oidc_nextcloud_client_secret: "{{ nos_derived_secrets.oidc_nextcloud }}"
authentik_oidc_gitea_client_secret: "{{ nos_derived_secrets.oidc_gitea }}"
authentik_oidc_openwebui_client_secret: "{{ nos_derived_secrets.oidc_openwebui }}"
authentik_oidc_n8n_client_secret: "{{ nos_derived_secrets.oidc_n8n }}"

# ── Tester identity for headless smoke + Playwright (Track G) ───────────────
# Dedicated account that nos-smoke uses to authenticate against proxy/OIDC
# protected services — proves end-to-end "auth flow returns 200" instead of
# accepting bare 30x redirects (AIT philosophy: no manual click-through tests).
#
# `tester_password_prefix` is an optional override (defaults to
# `global_password_prefix`) so an operator can rotate the global op
# password without rotating the test-fixture password. Override it in
# credentials.yml if you want the test-fixture password decoupled.
# It MUST carry a real default (not just the `| default()` below): under the
# core-up `template_vars: "{{ vars }}"` eager resolution an undefined var aborts
# the run. Defining it = global_password_prefix keeps nos_tester_password byte-identical.
tester_password_prefix: "{{ global_password_prefix }}"
# P1 (2026-08-20): resolves from the derived map. Scheme v1 keeps the exact
# `{{ tester_password_prefix }}_pw_nos_tester` value (the module receives
# tester_password_prefix for that), so the decoupling override still works on
# a v1 host; on v2 the leaf is HKDF-derived and the override loses meaning —
# override nos_tester_password itself with a literal instead.
nos_tester_password: "{{ nos_derived_secrets.nos_tester }}"

# ── Stalwart Mail Server admin (Track G — gated install_smtp_stalwart) ──────
stalwart_admin_password: "{{ nos_derived_secrets.stalwart_admin }}"

# ── Security agent OAuth2 client secrets (Track G/seed) ─────────────────────
# The blueprint references these via authentik_agent_clients; placing them
# here keeps the secrets next to the existing agent passwords (state_manager,
# openclaw, wing) and rotates with global_password_prefix.
# Note: these are templates referenced from default.config.yml itself —
# Ansible's vars_files merge resolves them at apply time, so the real
# secret values get baked into the Authentik blueprint at reconcile.
# (No separate var needed; default.config.yml already does the templating.)

# ==============================================================================
# INFISICAL (only if install_infisical: true)
# Secrets vault: https://vault.dev.local
# ==============================================================================

infisical_encryption_key: "{{ global_password_prefix }}_pw_infisical_enc"  # openssl rand -hex 16
infisical_auth_secret: "{{ global_password_prefix }}_pw_infisical_auth"    # openssl rand -base64 32
infisical_db_password: "{{ nos_derived_secrets.infisical_db }}"
# Admin bootstrap (used by roles/pazny.infisical/tasks/seed.yml via
# `infisical bootstrap` CLI on first install). Email is prefix-free
# (operator can override; not a secret). Password is prefix-derived —
# regenerate by changing global_password_prefix + `-e blank=true`.
infisical_admin_email: "admin@{{ tenant_domain | default('dev.local') }}"
infisical_admin_password: "{{ nos_derived_secrets.infisical_admin }}"
# Machine identity token — populated by `seed.yml` after bootstrap.
# Persisted to ~/.nos/secrets.yml so re-runs reuse the same identity.
infisical_admin_token: ""
# A18 follow-up (2026-05-23): UniversalAuth machine identity for the
# seeder. Used as a fallback when Infisical is already bootstrapped but
# no admin_token is persisted (operator wiped ~/.nos/secrets.yml, or
# first install pre-dated the A18 capture path).
#
# One-time UI step:
#   Org Settings → Access Control → Identities → "Create identity"
#   Name: nos-seeder    Org Role: Admin
#   Authentication: UniversalAuth → New Client Secret
#   Paste Client ID + Client Secret here (in credentials.yml, NOT this
#   default file — keep it gitignored).
#
# Playbook exchanges these for a fresh access token on every run, so
# the JWT never sits on disk and no persisted token expires.
infisical_machine_id_client_id: ""
infisical_machine_id_client_secret: ""

# ==============================================================================
# VAULTWARDEN (only if install_vaultwarden: true)
# Password vault: https://pass.dev.local
# ==============================================================================

vaultwarden_admin_token: "{{ global_password_prefix }}_pw_vaultwarden_admin"  # openssl rand -base64 48

# ==============================================================================
# WING (Security Research Dashboard)
# API token for CLI/agents: https://wing.dev.local/api/v1/
# ==============================================================================

wing_api_token: "{{ global_password_prefix }}_pw_wing_api"          # openssl rand -hex 32

# SEC-6 (2026-05-23): edge-trust signature. Traefik's wing router
# middleware (`wing-edge@file`) injects X-Wing-Edge-Token: <this>;
# Wing's BasePresenter::startup() validates the header BEFORE trusting
# X-Authentik-Username / X-Authentik-Groups. Without this, the
# loopback bind (now 127.0.0.1 only — SEC-6) is the ONLY defense
# against header-forgery via direct curl. Auto-regenerated on first run
# (Pattern B per docs/secret-lifecycle-doctrine.md); operator override
# in credentials.yml wins if ≥32 chars.
wing_edge_token: "{{ global_password_prefix }}_pw_wing_edge"        # openssl rand -hex 32
face_edge_token: "{{ global_password_prefix }}_pw_face_edge"        # nOS face edge-trust (X-Face-Edge-Token); openssl rand -hex 32
face_vfs_token: "{{ nos_derived_secrets.face_vfs }}"          # bearer for the Bone VFS (M2)

# ── Agentic loop (docs/idea/11-agentic-loop-contract.md §3.4, §8.2) ──────────
# TWO tokens, never one: constraint A says the proposer and the evaluator never
# share an identity, and this is that sentence at the credential level. The
# proposer may read + propose; the evaluator may read + judge.
#
# Constraint D: NEITHER is `{{ global_password_prefix }}_pw_*`. They are empty
# here and MINTED RANDOM by main.yml's lazy-regenerate group, then persisted to
# ~/.nos/secrets.yml — the same treatment REM-144 forced on face_edge_token,
# applied on the way in rather than after a leak. `{prefix}_pw_{svc}` is
# concatenation, not derivation: the rendered value contains the master in clear
# (tests/anatomy/test_secret_blast_radius.py). Bone refuses a `_pw_`-shaped loop
# token at RUNTIME too (loopauth.py) — the declaration and the effect are gated
# separately on purpose.
loop_propose_token: ""    # openssl rand -hex 32 — minted in main.yml
loop_judge_token: ""      # openssl rand -hex 32 — minted in main.yml
loop_operator_token: ""   # openssl rand -hex 32 — minted in main.yml; §6.2 forget (wedge exit)
openclaw_wing_api_token: "{{ nos_derived_secrets.wing_openclaw }}"  # Wing bearer for OpenClaw agent
conductor_wing_api_token: "{{ nos_derived_secrets.wing_conductor }}"  # Wing bearer for conductor (A8)

# The ONLY bearer the cortex executor accepts. `CortexCapability::fromToken`
# returns null unless a token carries all three axes, and `CortexBindingGate`
# then answers 403 — so before this existed the executor was shipped, running,
# gated, and reachable by nobody: nine provisioned tokens, none with a cortex
# column set (measured 2026-08-11). Threading rows between stages changes
# nothing observable while no caller can open the door.
cortex_executor_token: "placeholder-regenerated-on-first-run"
surveyor_wing_api_token: "{{ nos_derived_secrets.wing_surveyor }}"       # Wing bearer for surveyor surface-legibility agent (A20)
jeff_wing_api_token: "{{ nos_derived_secrets.wing_jeff }}"             # Wing bearer for the caddy (cortex axes: it is the only agent holding `exec`)
librarian_wing_api_token: "{{ nos_derived_secrets.wing_librarian }}"     # Wing bearer for librarian knowledge judge (cortex L2)
upgrade_architect_wing_api_token: "{{ nos_derived_secrets.wing_upgrade_architect }}"  # Wing bearer for upgrade-architect agent (W5-B5)

# ==============================================================================
# NTFY (only if install_ntfy: true)
# Push notifications server: https://ntfy.dev.local
# Server has auth-default-access: deny-all - admin user MUST be provisioned
# (done by pazny.ntfy/tasks/post.yml on every run, reconverging the password).
# ==============================================================================

ntfy_admin_user: "admin"
# Prefix-derived ON PURPOSE, and it stays that way. A human types this one — on
# a phone, into the ntfy app — so a value the operator can reconstruct from the
# prefix they chose at install beats one they must go and look up.
#
# Briefly minted on 2026-08-08 and reverted the same hour: the reasoning was
# that a prefix-derived value is persisted nowhere, which is true, and that the
# operator therefore could not find it, which is NOT — they know their own
# prefix, and logging in with `<prefix>_pw_ntfy_admin` is exactly how this was
# disproved. Minting would have re-randomised a working credential for a
# doctrinal gain, on a machine whose stated threat model is that there is
# nothing here to steal.
#
# What WAS a real defect is fixed in tasks/post.yml: the access-info banner said
# the password was "in ~/.nos/secrets.yml", where a derived value has never been.
ntfy_admin_password: "{{ global_password_prefix }}_pw_ntfy_admin"
# The estate's own publisher. SEPARATE from admin on purpose: the dispatcher
# runs unattended and holds this credential in the Wing daemon env, so it gets
# write on `nos-*` and nothing else. Before 2026-08-08 it published anonymously
# — which worked only because ntfy's auth was unconfigured and every declared
# access rule was inert.
ntfy_publisher_user: "nos-publisher"
# Placeholder only — main.yml MINTS this (openssl rand) on first run and
# persists it, like bone_secret and wing_api_token. It is deliberately NOT
# `{{ global_password_prefix }}_pw_*`: a credential no human ever types should
# not widen the blast radius of the one string that unlocks everything, and
# `test_secret_blast_radius` refuses the prefix form outright.
ntfy_publisher_password: ""

# ==============================================================================
# MINIFLUX (only if install_miniflux: true)
# Default login: OIDC via Authentik (fallback admin / miniflux_admin_password)
# Requires: PostgreSQL
# ==============================================================================

miniflux_db_password: "{{ nos_derived_secrets.miniflux }}"
miniflux_admin_password: "{{ nos_derived_secrets.miniflux_admin }}"

# ==============================================================================
# HEDGEDOC (only if install_hedgedoc: true)
# Login: OIDC via Authentik (session secret auto-regenerated in main.yml safe group)
# Requires: PostgreSQL
# ==============================================================================

hedgedoc_db_password: "{{ nos_derived_secrets.hedgedoc }}"
hedgedoc_session_secret: "{{ global_password_prefix }}_pw_hedgedoc_session"

# ==============================================================================
# BOOKSTACK (only if install_bookstack: true)
# Login: OIDC via Authentik (fallback admin@admin.com / password on first init)
# Requires: MariaDB
# APP_KEY is Laravel-style, auto-regenerated in main.yml (safe group) via
# `base64:$(openssl rand -base64 32)`. The fallback placeholder is only for
# the first non-blank run before the first regeneration.
# ==============================================================================

bookstack_db_password: "{{ nos_derived_secrets.bookstack }}"
bookstack_app_key: "base64:{{ global_password_prefix }}_pw_bookstack_appkey_placeholder"

# ==============================================================================
# FIREFLY III (only if install_firefly: true)
# Login: via Authentik proxy outpost (remote_user_guard) - no local password
# Requires: MariaDB + Redis Docker
# APP_KEY is the Laravel APP_KEY. On blank=true main.yml auto-generates it
# (destructive group - encrypts OAuth2 secrets, 2FA tokens).
# ==============================================================================

firefly_db_password: "{{ nos_derived_secrets.firefly }}"
firefly_app_key: "base64:{{ global_password_prefix }}_pw_firefly_appkey_placeholder"

# ==============================================================================
# INFLUXDB (only if install_influxdb: true)
# Login: admin / {{ influxdb_admin_password }} (native InfluxDB session)
# Token: auto-regenerated in main.yml (safe group); stable only after first init
# (InfluxDB 2.x reads DOCKER_INFLUXDB_INIT_ADMIN_TOKEN only on first-run).
# ==============================================================================

influxdb_admin_password: "{{ nos_derived_secrets.influxdb }}"
influxdb_admin_token: "{{ global_password_prefix }}_pw_influxdb_token"

# ==============================================================================
# ONLYOFFICE (only if install_onlyoffice: true)
# JWT secret shared between ONLYOFFICE Document Server and host apps
# (Nextcloud, BookStack). Auto-regenerated in main.yml (safe group).
# ==============================================================================

onlyoffice_jwt_secret: "{{ global_password_prefix }}_pw_onlyoffice_jwt"

# ==============================================================================
# AI provider API keys (OpenWebUI multi-connector)
# Set in credentials.yml to activate them in OpenWebUI (optional, skip = chat
# only with Ollama). Anthropic uses the OpenAI-compatible /v1 endpoint.
# ==============================================================================

openai_api_key: ""          # sk-... (optional, for OpenAI GPT models)
anthropic_api_key: ""       # sk-ant-... (optional, for Claude models)

# ==============================================================================
# MCP Gateway (mcpo) - read-only DB for MCP postgres server
# ==============================================================================

mcp_postgres_password: "{{ nos_derived_secrets.mcp_postgres_ro }}"
mcpo_api_key: "{{ nos_derived_secrets.mcpo }}"

# ==============================================================================
# ACME / Let's Encrypt — wildcard cert via DNS-01 challenge
# Required ONLY when tenant_domain is a public TLD (default.config.yml gates
# install_acme to false on dev.local / .lan / .test). Override in your local
# credentials.yml (gitignored).
#
# Cloudflare API token: https://dash.cloudflare.com/profile/api-tokens
# Permissions: Zone:DNS:Edit + Zone:Zone:Read for the target zone only.
# ==============================================================================

# MUST be set in credentials.yml when tenant_domain is a public TLD (e.g. pazny.eu).
# Empty here = ACME role REFUSES to run (NOT silently skips) so a misconfigured
# public deploy fails fast instead of falling back to mkcert. Override with
# `-e install_acme=false` only if you bring your own ssl_cert_path/ssl_cert_key.
acme_cloudflare_api_token: ""           # cf-XXXXXX… (set in credentials.yml)

# ==============================================================================
# MiniMax — third-party Anthropic-compatible model backend for scheduled agents
# PREPARED, NOT ARMED. Empty here = the feature stays inert (minimax_enabled is
# false in default.config.yml regardless). To arm: set this in credentials.yml
# (gitignored) AND flip minimax_enabled: true — see docs/minimax-groundwork.md
# for the two decisions to make first. The key is persisted to ~/.nos/secrets.yml
# as secret:minimax_api_key and reaches agent jobs as ANTHROPIC_AUTH_TOKEN only
# by REFERENCE, never as a plaintext value in pulse_jobs.
# ==============================================================================
minimax_api_key: ""                     # MiniMax API key (set in credentials.yml)
# Mistral EU key — PREPARED, NOT ARMED (see state/llm-backends.yml mistral-eu
# row). Paste into credentials.yml + flip mistral_enabled: true; persisted as
# nos:mistral_api_key, resolved by AgentKit's BindingResolver at session open.
mistral_api_key: ""                     # Mistral API key (set in credentials.yml)
