ssh_allow_groups: "admin staff"

mariadb_root_password: "{{ nos_derived_secrets.mariadb }}"
# mysqld-exporter monitoring user (observability). MUST be a real definition, not
# only a `| default()` fallback at default.config.yml:mariadb_databases — under the
# `template_vars: "{{ vars }}"` eager resolution an undefined var aborts the run even
# when guarded by default(). See test_config_stock_jinja_only.py + CLAUDE.md gotcha.
mysqld_exporter_password: "{{ nos_derived_secrets.mysqld_exporter }}"
redis_password: "{{ nos_derived_secrets.redis }}"      # CVE-2025-49844: Redis MUST have authentication

# ==============================================================================
# WORDPRESS (only if install_wordpress: true)
# Default login: admin / {{ global_password_prefix }}_pw_wordpress_admin
# Auto-install via wp-cli (no wizard)
# ==============================================================================

wordpress_db_password: "{{ nos_derived_secrets.wordpress }}"
wordpress_admin_password: "{{ nos_derived_secrets.wordpress_admin }}"
# wordpress_admin_email: "admin@dev.local"

# ==============================================================================
# NEXTCLOUD (only if install_nextcloud: true)
# Default login: admin / {{ global_password_prefix }}_pw_nextcloud_admin
# Password can be changed in Settings -> Personal info
# ==============================================================================

nextcloud_db_password: "{{ nos_derived_secrets.nextcloud }}"
nextcloud_admin_password: "{{ nos_derived_secrets.nextcloud_admin }}"

# ==============================================================================
# GRAFANA (only if install_observability: true)
# Default login: admin / {{ global_password_prefix }}_pw_grafana
# ==============================================================================

grafana_admin_password: "{{ nos_derived_secrets.grafana }}"

# ==============================================================================
# GITEA (only if install_gitea: true)
# Default login: (system user) / {{ global_password_prefix }}_pw_gitea
# ==============================================================================

gitea_admin_password: "{{ nos_derived_secrets.gitea }}"
gitea_admin_email: "pazny.develop@gmail.com"                          # FILL IN!
gitea_secret_key: "{{ nos_derived_secrets.gitea_secret }}"   # openssl rand -hex 32
gitea_metrics_token: "{{ nos_derived_secrets.gitea_metrics }}"   # bearer token for /metrics scrape

# ==============================================================================
# KEAP (only if install_keap: true)
# Agent-surface bearer tokens for /agent/v1 (scope-split: read-only vs
# read+write, R9). Consumed by the container env AND by the AgentKit vault
# (agent_credentials.secret_ref) — never by humans; the human surface is SSO.
# ==============================================================================

keap_agent_token_ro: "{{ nos_derived_secrets.keap_agent_ro }}"
keap_agent_token_rw: "{{ nos_derived_secrets.keap_agent_rw }}"
# Device tier (AR glasses / mobile / sensors): write-only intake — can feed
# the review queue via /ingest/v1 but can never READ the knowledge base.
keap_agent_token_capture: "{{ nos_derived_secrets.keap_agent_capture }}"
# SEC-02 proxy-trust secret. KEAP's identityMiddleware checks x-keap-proxy-secret
# (timing-safe) BEFORE reading any X-Authentik-* header, so a peer on gated_net
# cannot forge identity. Injected by Traefik's keap-proxy@file at the same hop
# that copies the outpost's X-Authentik-* headers. Unset on KEAP ⇒ no check
# (backward-compatible); activates when keap_repo_ref passes the P1 commit.
keap_proxy_shared_secret: "{{ nos_derived_secrets.keap_proxy_shared }}"

# ==============================================================================
# CORTEX (only if install_cortex: true)
# Scope-split bearer tokens for the reasoning organ's /agent/v1 surface
# (loopback 127.0.0.1:8098). RO = validate/opcodes; RW = future allowlisted
# writes (C2 embed-sync). BOTH must be set — the daemon fail-closes with 503
# when neither is configured, and the role always provisions both.
# ==============================================================================

cortex_ro_token: "{{ nos_derived_secrets.cortex_ro }}"
cortex_rw_token: "{{ nos_derived_secrets.cortex_rw }}"
# CAPTURE is the write-only intake tier (S2): the consolidator fan-out POSTs
# /ingest/v1/capture to KEAP and to the organ in one run. It is a DISTINCT
# secret under a DISTINCT name from keap_agent_token_capture on purpose — one
# env name meaning two secrets on one host is how a write token reaches the
# wrong daemon (docs/archive/cortex-corpus-parallel.md §2.1).
cortex_capture_token: "{{ nos_derived_secrets.cortex_capture }}"

# ==============================================================================
# OPEN WEBUI (only if install_openwebui: true)
# Default login: admin@dev.local / {{ global_password_prefix }}_pw_openwebui_admin
# Auto-registration of the first admin user via API
# ==============================================================================

openwebui_secret_key: "{{ nos_derived_secrets.openwebui }}"
openwebui_admin_password: "{{ nos_derived_secrets.openwebui_admin }}"
# openwebui_admin_email: "admin@dev.local"

# ==============================================================================
# PORTAINER (only if install_portainer: true)
