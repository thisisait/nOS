# =============================================================================
# nos-dgx — nginx as the LAN edge AND the identity outpost for KEAP.
#
# One host (__HOST__ via mDNS), one port per service:
#     443  landing page + the mkcert root CA to install
#    8443  KEAP (DataTables)         PAM login -> X-Authentik-* headers
#    8444  Open WebUI (chat)         its own accounts (see the 8444 block)
#    8445  JupyterHub                its own PAM login form (group nos-users)
#    8446  Backrest (backups)        PAM, group nos-maintainers only
#    8447  n8n (automation)          its own accounts (owner invites)
#
# Identity: auth_pam against the box's own accounts (/etc/pam.d/nginx restricts
# to group nos-users). The username becomes the KEAP row key; the tier comes
# from the $nos_groups map below — adding an admin is one line there.
# This plays the role Traefik's authentik@file + keap-proxy@file play in a full
# nOS estate: the upstream trusts identity headers ONLY from this hop.
# =============================================================================

map $remote_user $nos_groups {
    default   "nos-users";                     # tier 3 — every nos-users member
    admin     "nos-providers,nos-admins";      # tier 1
    pza2bj    "nos-providers,nos-admins";      # tier 1 — the operator's own account
    tester    "nos-users";                     # tier 3 (nos-guests = tier 4 if wanted)
}

# The e-mail an upstream sees. Open WebUI keys accounts on it, and the
# existing volume already holds the operator's admin account under the
# GitHub e-mail — so both operator logins map to it instead of minting a
# second, role-less account. Everyone else: <user>@__HOST__.
map $remote_user $nos_email {
    default   "$remote_user@__HOST__";
    admin     "pazny.develop@gmail.com";
    pza2bj    "pazny.develop@gmail.com";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── 80 → https ───────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # $host, not the mDNS name: a client on the corporate uplink typed an IP and
    # cannot resolve .local across that network.
    return 301 https://$host$request_uri;
}

# ── 443 landing ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __HOST__ __SHORT__;
    include /etc/nginx/nos-dgx-tls.conf;

    root /srv/nos-dgx/www;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

# ── 8443 KEAP ────────────────────────────────────────────────────────────────
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name __HOST__ __SHORT__;
    include /etc/nginx/nos-dgx-tls.conf;

    client_max_body_size 200m;

    location / {
        auth_pam              "nOS on __SHORT__";
        auth_pam_service_name "nginx";

        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # The identity KEAP trusts (server/identity.ts). Every X-Authentik-*
        # header is SET here from the PAM-verified user, so a client-supplied
        # one is replaced, never forwarded; Uid is cleared because KEAP reads
        # it as a fallback and nginx would otherwise pass it through.
        proxy_set_header X-Authentik-Username $remote_user;
        proxy_set_header X-Authentik-Email    $nos_email;
        proxy_set_header X-Authentik-Name     $remote_user;
        proxy_set_header X-Authentik-Groups   $nos_groups;
        proxy_set_header X-Authentik-Uid      "";
        # The browser's basic-auth credential stays at this hop.
        proxy_set_header Authorization        "";
        # SEC-02 proxy secret — root:www-data 0640, generated by setup-root.sh.
        include /etc/nginx/nos-keap-secret.conf;

        proxy_read_timeout 300s;
    }
}

# ── 8444 Open WebUI ──────────────────────────────────────────────────────────
server {
    listen 8444 ssl http2;
    listen [::]:8444 ssl http2;
    server_name __HOST__ __SHORT__;
    include /etc/nginx/nos-dgx-tls.conf;

    client_max_body_size 500m;

    # NO auth_pam here, on purpose (2026-09-07): Open WebUI's frontend sends its
    # own `Authorization: Bearer <jwt>` on every /api call, and a browser can
    # carry only one Authorization header — the basic-auth credential is
    # dropped, nginx answers 401 and the UI reports "Session expired". So this
    # service keeps its OWN accounts (ENABLE_SIGNUP=false; the admin invites),
    # and nginx provides TLS only. KEAP is unaffected: its SPA authenticates
    # by identity headers, never by a bearer.
    location / {
        proxy_pass http://127.0.0.1:12000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;   # WITH the port: Jupyter/socket.io compare Origin against Host
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_buffering off;               # streamed model output
        proxy_read_timeout 3600s;
    }
}

# ── 8445 JupyterHub ──────────────────────────────────────────────────────────
# No auth_pam: the Hub authenticates against PAM itself (same accounts, same
# nos-users group) and its cookie/token would clash with basic-auth (8444 note).
server {
    listen 8445 ssl http2;
    listen [::]:8445 ssl http2;
    server_name __HOST__ __SHORT__;
    include /etc/nginx/nos-dgx-tls.conf;

    client_max_body_size 1g;                # notebook uploads, datasets

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;   # WITH the port: Jupyter/socket.io compare Origin against Host
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Scheme          https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;               # kernel/terminal websockets
        proxy_read_timeout 86400s;
    }
}

# ── 8446 Backrest — admin only ───────────────────────────────────────────────
server {
    listen 8446 ssl http2;
    listen [::]:8446 ssl http2;
    server_name __HOST__ __SHORT__;
    include /etc/nginx/nos-dgx-tls.conf;

    location / {
        auth_pam              "nOS backups (maintainers)";
        auth_pam_service_name "nginx-admin";      # /etc/pam.d/nginx-admin: group nos-maintainers

        proxy_pass http://127.0.0.1:9898;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Authorization     "";   # Backrest auth is disabled; PAM is the gate
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# ── 8447 n8n — everyone, its own accounts ────────────────────────────────────
# Same reasoning as Chat: n8n's session cookie/JWT and a basic-auth gate would
# fight; n8n keeps its own user management (owner invites), nginx gives TLS.
server {
    listen 8447 ssl http2;
    listen [::]:8447 ssl http2;
    server_name __HOST__ __SHORT__;
    include /etc/nginx/nos-dgx-tls.conf;

    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
