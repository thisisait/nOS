# /etc/systemd/system/ollama.service.d/nos-dgx.conf
# Bind to the docker0 address: reachable from host tools (OLLAMA_HOST in
# /etc/profile.d/nos.sh) and from containers via host.docker.internal, NOT from
# the LAN — the API has no auth. docker0 must exist first, hence the ordering.
[Unit]
After=docker.service
Wants=docker.service

[Service]
Environment="OLLAMA_HOST=172.17.0.1:11434"
Environment="OLLAMA_KEEP_ALIVE=30m"
Restart=always
RestartSec=3
