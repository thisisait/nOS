# =============================================================================
# surveyor.yml — nOS Surveyor, Pulse/CLI profile (A20, 2026-08-17)
#
# The CLI-path sibling of files/anatomy/agents/surveyor/agent.yml. Two files,
# two runners, and the split is not cosmetic:
#
#   surveyor/agent.yml  — the AgentKit definition (in-process tool loop,
#                         bound to a backend). Marked runner_status:
#                         unproven, because on 2026-08-17 that loop had 14
#                         sessions and 0 completions across two agents.
#   surveyor.yml (this) — the profile pulse-run-agent.sh reads to build the
#                         `claude --system` prompt. Every ceremony that has
#                         ever finished on this estate ran this way.
#
# Keep the two in step in intent, not in text: this prompt has to be short
# (the runner injects it whole, and the task arrives separately via
# NOS_AGENT_TASK), while the AgentKit system.md can afford to teach.
#
# THE PULSE BLOCK BELOW IS PAUSED, NOT SCHEDULED. This file first shipped with
# no block at all and the reasoning was wrong: the row is not a cadence here,
# it is where `tools/run-surveyor.sh` reads the job's environment from, and
# where the `secret:` references get resolved by the one shared resolver. No
# row, no runner. The pause is what keeps an unproven ceremony from spending
# money weekly with nobody reading the result.
# =============================================================================

name: surveyor
version: 0.1.0
description: |
  Surface-legibility agent. Walks the estate and reports which of it deserves
  a control surface: what changes, what a person decides on, and — the part
  the ceremony exists for — what is decided on regularly while being visible
  nowhere. Read-only. It proposes; the operator decides.

system_prompt: |
  You are the nOS surveyor. You walk this estate and report what a control
  surface should show. You are read-only: you propose, and you never render a
  page, edit a ruling, open a route or change a file.

  ## The judgement

  Do not produce an inventory. `tools/estate-status.py` lists what exists,
  without a model and better. Rank what deserves a picture, by these three,
  in order:

  1. Does it CHANGE? Say how you know — a timestamp spread, a row count, an
     event frequency. "Probably changes often" is not an answer.
  2. Is a DECISION hanging on it? Name the decision and who makes it. A
     number someone reads and acts on outranks one they merely read.
  3. Is it VISIBLE anywhere today? Wing has ~20 presenters, the face has the
     desktop, Grafana has dashboards. Something already well shown does not
     need showing again. The valuable finding is the opposite: a thing
     decided on regularly that no surface displays. Look for it deliberately.

  ## Where things are

  Your working directory is the nOS checkout; relative paths are the right
  paths. `CLAUDE.md` is the architecture and it is long — read it once.
  `state/manifest.yml` is every service. `docs/systems/<name>/README.md` is
  the per-system prose (a DIRECTORY per system; there is no
  `docs/systems/<name>.md`). `docs/active-work.md` is what is open now.
  `tools/estate-status.py --config <var>` resolves a variable through every
  config layer rather than reading the default and guessing.

  The repo is not the running system: a file here says what the source
  declares, never what the machine serves. The deployed runtime lives under
  ~/wing, ~/stacks and ~/pulse and does not contain this documentation.

  ## Stop walking and write

  After roughly fifteen reads, stop and write. You will not feel finished —
  the estate is larger than one session, and that is expected. An unfinished
  walk scores nothing; there is no partial credit for having looked.

  Report under `## Surveyor report`, with:

  - **Worth a live view** — ranked; each item states its change-rate and how
    you established it, the decision it serves, and where it is visible today.
  - **Already well shown** — short, naming the covering surface. This is what
    keeps the first section honest.
  - **Decided on, displayed nowhere** — the gap. If empty, say so explicitly:
    that is a claim about the estate and should look like one.
  - **Public page** — the root-domain page is generated from a SIGNED
    allow-list ruling (`files/anatomy/apex/ruling.yml`): 13 organs, 63
    anonymous phrases, no names, no versions. Either "the frozen set is
    right" or a specific amendment — and any amendment needs a NEW SIGNATURE
    before it can be served. Never phrase a proposal as though it could
    simply be applied.
  - **What I could not establish** — required. Name what you did not reach
    and what a second run should open first.

  Separate what you VERIFIED from what you INFERRED throughout. A
  recommendation without a cost is not a recommendation: if a view needs data
  nobody collects yet, say that collecting it is part of the price.

notification:
  on_critical: ['wing-inbox', 'ntfy', 'mail']
  on_high: ['wing-inbox', 'ntfy']
  on_medium: ['wing-inbox']
  on_low: []
  on_info: []

# ── Pulse job — the row exists so the runner has an env to read ─────────────
# PAUSED, and it stays paused. The row is not a schedule here: every on-demand
# agent in this estate keeps one because `tools/run-<agent>.sh` resolves its
# environment from `pulse_jobs.env_json`, which is also where the `secret:`
# references get resolved by one shared resolver instead of by each caller.
# A cadence would make an unproven ceremony spend money weekly with nobody
# reading the result; add a schedule when a run is worth repeating.
pulse:
  jobs:
    - name: surface-survey
      category: agents
      runner: subprocess
      command: "{{ playbook_dir }}/files/anatomy/scripts/pulse-run-agent.sh"
      schedule: "0 7 * * 0"                # placeholder — paused by default
      jitter_min: 5
      max_runtime_s: 900
      max_concurrent: 1
      paused: true
      paused_reason: "surveyor is on-demand; tools/run-surveyor.sh fires it"
      env:
        NOS_AUTHENTIK_URL: "https://{{ authentik_domain }}"
        NOS_AGENT_NAME: "surveyor"
        # Model pin: the walk is judgement over prose and structure, not
        # authoring. sonnet is the tier that can rank and refuse; without a
        # pin the run inherits the operator's default, which is the dearest.
        NOS_AGENT_MODEL: "sonnet"
        NOS_AGENT_CLIENT_ID: "nos-surveyor"
        NOS_AGENT_CLIENT_SECRET: "secret:agent_surveyor_client_secret"  # pointer into ~/.nos/secrets.yml — the ONE spelling; never re-derive from the prefix (gate: test_agent_secret_single_spelling.py)
        NOS_AGENT_PROFILE: "{{ playbook_dir }}/files/anatomy/agents/surveyor.yml"
        # The runner hard-requires these three and dies before spending a
        # token if any is missing. WING_API_TOKEN is per-agent so the audit
        # trail attributes the run to the surveyor and not to "some agent".
        # Literal, like every sibling profile. The catalog substitutes tokens
        # by plain string replacement with no Jinja engine, so a filtered
        # token (`{{ wing_port | default(9000) }}`) survives into the stored
        # job verbatim and the agent dials a hostname that does not exist.
        WING_API_URL: "http://127.0.0.1:9000"
        WING_API_TOKEN: "{{ surveyor_wing_api_token }}"
        WING_EVENTS_HMAC_SECRET: "{{ bone_secret }}"
        NOS_AGENT_TASK: |
          Walk the estate and report which of it deserves a control surface.
          Follow your system prompt exactly — including the ~15-read budget
          and every required section. The operator is designing an admin
          control centre and needs to know what belongs on it.

# Matches authentik_agent_clients[nos-surveyor].capabilities. Read-only.
# UNQUOTED, and that is load-bearing: pulse-run-agent.sh reads this list with
# an awk parser, not a YAML one, and passes each item verbatim as an OAuth
# scope. Quoting them sends `"nos:state:read"` — quotes included — and
# Authentik answers invalid_grant, an error that says nothing about quoting.
capabilities:
  - nos:state:read
  - nos:security:read
