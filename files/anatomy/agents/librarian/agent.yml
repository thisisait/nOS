name: librarian
version: 1
description: |
  nOS librarian — knowledge / RAG agent. Surfaces "have we seen this
  before?" context from prior agent runs + remediation history, and
  queries the KEAP cortex (mcp-keap) for semantic recall over the
  curated knowledge taxonomy, captures and notes. Grows the taxonomy
  bottom-up: when no anchor is specific enough it proposes a new node
  via /agent/v1/taxonomy/propose (Track T zone governance — the
  moderator, or the free zone itself, decides; never the agent).

  **STATUS: contract-only (2026-05-17; corpus landed 2026-07-11).** The
  AgentKit profile is shipped so the catalog under /agents displays the
  spec, but no Pulse runner exists yet. The original blocker — an empty
  embeddings substrate — is GONE: KEAP's libSQL vector corpus is live
  (790 taxonomy nodes embedded, keap-embed-sync Pulse job keeps it
  current) and reachable via the mcp-keap tool. What remains is the
  runner itself (Pulse job + ceremony wiring). Qdrant is no longer a
  prerequisite; it stays reserved for a future agent-outputs corpus.
  The Authentik client `nos-librarian` is pre-provisioned and reserved.

model:
  # THE SONNET TIER, NAMED THROUGH THE SDK ADAPTER (2026-08-15, supervised run).
  # Was `claude-sonnet` — the local CLI — which cannot be handed the four tool
  # schemas this agent declares, so AgentKit could not run it at all
  # (`spine-tools-vs-cli-refusal`). The `anthropic-*` provider selects the SDK
  # adapter, which speaks the tool protocol; the URI names INTENT and TIER, and
  # a binding supplies the endpoint, bearer and served model id.
  #
  # CONSEQUENCE WORTH KNOWING BEFORE DISARMING: unbound, this URI resolves to
  # Anthropic's API and demands ANTHROPIC_API_KEY, which this estate does not
  # set. So with `minimax_enabled: false` this agent no longer falls back to the
  # operator's CLI session — it refuses. That is fail-closed, not silent, but it
  # is a change from "runs on the subscription" and must be undone deliberately
  # (put `claude-sonnet` back) rather than discovered on a quiet Sunday.
  primary: anthropic-claude-sonnet-4-5
  backend: minimax
  # A WRITING ceremony. taxonomy-brief emits ten briefs per batch, each 300-12000
  # characters of English plus a Czech translation, so one call must carry
  # roughly 15-25k output tokens. At the 4096 default the run stopped at
  # `stop_reason: max_tokens` mid-brief on 2026-08-16 and never reached the POST
  # that the batch exists to make — 39k tokens spent, zero proposals filed.
  max_output_tokens: 32000
  fallback: openclaw-qwen2.5-coder:32b

system_prompt_path: system.md

tools:
  - id: bash-read-only
  - id: mcp-wing-read
  # Grandfathered 2026-08-28 from 11 measured POSTs, all to /api/v1/events —
  # this agent files its report there. Extent: wing-write-grants.json.
  - id: mcp-wing-write
  - id: mcp-bone
  - id: mcp-keap


outcomes:
  # The survey is an ARTIFACT, not prose in a transcript. Measured 2026-08-29
  # (session 53de6409): both judges passed and the run was satisfied having
  # filed nothing at all.
  deliverable:
    event: conductor_report
  # writes into the live cortex; the corpus differ is what can contradict it.
  gateset: live
  rubric_path: rubric.md
  max_iterations: 3

audit:
  capability_scopes:
    - bash.read
    - mcp.tool_use
    - wing.read
    - wing.write
    - bone.read
    - keap.read
    # This agent files lint verdicts and briefs into KEAP's moderation queue —
    # it has always written. mcp-keap now asks for the scope that names the
    # verb (2026-08-28), so the grant is declared rather than assumed.
    - keap.write
    - events.write
    - audit.read
  pii_classification: none

vault:
  required_credentials:
    - scope: anthropic-api
    - scope: mcp-wing
    - scope: mcp-bone
    - scope: mcp-keap

metadata:
  ait_phase: A9.4-contract-only
  ceremony_role: rag-recall
  runner_status: scheduled
  deferred_reason: >-
    runner live 2026-07-11;
    unpaused 2026-08-28, nightly through tools/run-agent.sh (AgentKit), which
    is the runner that can receive the MiniMax binding. Intake = KEAP lint overlap-review /
    near-duplicate findings; verdicts via /agent/v1/lint/verdict.

exit_code_semantics:
  emits_sentinel: true
  exit_0: "Contract-only (no live runner). Reserved: RAG recall completed, context posted as events."
  exit_1: "Does not emit exit 1 today (runner deferred). Reserved: surfaced prior-art requiring operator review."
  exit_2: "Environment / auth / Wing error inside the runner. Fires a CRITICAL A9 notification."
# ── Article 30 ────────────────────────────────────────────────────────────────
gdpr:
  purpose: |
    Surfaces prior context — earlier agent runs, remediation history, KEAP
    knowledge nodes — so a question already answered is not re-answered.
    Estate operation (legitimate interest, Art. 6(1)(f)).
  legal_basis: legitimate_interests
  data_categories:
    - agent_run_history
    - remediation_queue_records
    - knowledge_corpus_content    # KEAP taxonomy + node text
  data_subjects:
    - operators
  retention_days: -1
  processors:
    - name: "Anthropic, PBC"
      role: "LLM inference for the ceremony's reasoning (claude CLI, --print)"
      country: "US"
      safeguard: "None claimed. Assess SCCs / Art. 46 before this is relied on."
    # Added 2026-08-15 for the supervised run, BEFORE any prompt was routed
    # there — the binding resolver refuses a session whose register does not
    # name the backend's processor, which is the order this estate wants.
    #
    # THE LEGAL ENTITY HERE IS UNVERIFIED AND MUST BE CORRECTED BY THE
    # OPERATOR. `MiniMax` is the match token the backend registry keys on, not
    # a contracting party: the international endpoint api.minimax.io is
    # operated by a MiniMax group company whose registered name, seat and
    # transfer mechanism were NOT established from a primary source before
    # writing this. Naming it precisely, and establishing whether any Art. 46
    # safeguard exists, is a records obligation that outlives this run.
    - name: "MiniMax"
      role: "LLM inference via the Anthropic-compatible endpoint (SDK adapter, tool loop driven by AgentKit)"
      country: "unverified — international endpoint api.minimax.io; entity and seat not established"
      safeguard: "None claimed, and none assessed. No SCCs, adequacy finding or derogation has been identified for this transfer."
  eu_residency: false
  transfers_outside_eu: true

capabilities:
  - nos:state:read
  - nos:security:read

notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []

pulse:
  jobs:
    - name: judge-lint-queue
      category: knowledge
      runner: subprocess
      command: "{{ playbook_dir }}/tools/run-agent.sh"
      args: ["--agent=librarian", "--trigger=pulse"]
      # 05:35, AFTER the producer. It was 05:10 and `keap:keap-lint` — the job
      # that FILLS the lint queue — fires at 05:15, so every night since these
      # schedules were set the judge ruled on the PREVIOUS night's queue and
      # nothing said so. Measured 2026-08-30 across the run history: judge
      # 05:11-05:14, keap-lint 05:15-05:18, every single night.
      #
      # 05:35 clears keap-lint's worst end (05:19, max 21s) and cortex's
      # corpus-diff at 05:30, so the judge sees a queue filled the same night.
      # The night finishes ~25 min later; ordering is worth more than latency
      # when the alternative is a verdict on stale input.
      schedule: "35 5 * * *"
      jitter_min: 5
      max_runtime_s: 600
      max_concurrent: 1
      paused: false
      paused_reason: "librarian is on-demand; tools/run-librarian.sh fires it"
      env:
        NOS_AUTHENTIK_URL: "https://{{ authentik_domain }}"
        NOS_AGENT_NAME: "librarian"
        NOS_AGENT_CLIENT_ID: "nos-librarian"
        NOS_AGENT_CLIENT_SECRET: "secret:agent_librarian_client_secret"  # pointer into ~/.nos/secrets.yml — the ONE spelling; never re-derive from the prefix (gate: test_agent_secret_single_spelling.py)
        NOS_AGENT_PROFILE: "{{ playbook_dir }}/files/anatomy/agents/librarian/agent.yml"
        # Judgment calls need reasoning but not the flagship tier.
        NOS_AGENT_TASK: |
          Work the KEAP lint intake queue:
          1. GET /agent/v1/lint?check=overlap-review&unjudged=1&limit=20
             and ?check=near-duplicate&unjudged=1&limit=20.
          2. For each finding fetch both texts (objects/notes; skip
             captures unless names are decisive).
          3. Rule fine|duplicate|contradiction per the judgment procedure;
             POST each verdict to /agent/v1/lint/verdict.
          4. Then work the PROMOTION intake: up to 5 datapoints from
             GET /agent/v1/captures?unpromoted=1 — for knowledge-worthy
             ones find taxonomy anchors (semantic search + node verify)
             and POST /agent/v1/promotions with a synthesized object
             draft + rationale. You propose; the moderator decides.
          5. If the best anchor is too generic for a datapoint, grow the
             tree per the taxonomy-growth procedure: POST
             /agent/v1/taxonomy/propose (load-bearing description; max 3
             per run; anchor-core refusals are final, anchor shallow).
          6. POST your "## Librarian report" (add "Proposals" +
             "Taxonomy" sections)
             via Wing /api/v1/events type=conductor_report source=librarian,
             with the full markdown in result_json.report_markdown — a body
             under any other key is refused rather than stored empty.
          End the report with a final line `NOS_AGENT_EXIT: N` (the runner
          reads this — a bare exit code is NOT propagated): 1 when any
          duplicate/contradiction verdict was issued (the operator must
          review a knowledge conflict); otherwise 0 — an empty queue, all
          `fine`, or routine promotion/node proposals awaiting moderation
          are the normal outcome and do NOT escalate.
        WING_API_URL: "http://127.0.0.1:9000"
        WING_API_TOKEN: "{{ librarian_wing_api_token }}"
        WING_EVENTS_HMAC_SECRET: "{{ bone_secret }}"
        KEAP_API_URL: "http://127.0.0.1:{{ keap_port }}"
        KEAP_AGENT_TOKEN_RO: "{{ keap_agent_token_ro }}"
        KEAP_AGENT_TOKEN_RW: "{{ keap_agent_token_rw }}"

    # taxonomy-brief (skills/taxonomy-brief in nos-keap). Paused, on-demand:
    # tools/run-librarian.sh --brief fires one ~10-node batch, root-first.
    # SWEEP SCOPE: maxLevel=9 — FULL sweep (all ~432 remaining L3+ nodes),
    # approved 2026-07-13 after the L0-2 waves landed. Root-first ordering
    # means each run still fills the shallowest pending nodes first. Move this
    # AND run-librarian.sh's intake count together.
    # HISTORY: pilot maxLevel=0 (12 categories) → L0-1 anchor core → L0-2 →
    # now full. The operator moderates each batch in Admin › Moderace.
    - name: brief-taxonomy
      category: knowledge
      runner: subprocess
      command: "{{ playbook_dir }}/tools/run-agent.sh"
      args: ["--agent=librarian", "--trigger=pulse"]
      schedule: "10 3 * * *"
      jitter_min: 5
      max_runtime_s: 900
      max_concurrent: 1
      paused: false
      paused_reason: "brief sweep is operator-paced; tools/run-librarian.sh --brief fires it"
      env:
        NOS_AUTHENTIK_URL: "https://{{ authentik_domain }}"
        NOS_AGENT_NAME: "librarian"
        NOS_AGENT_CLIENT_ID: "nos-librarian"
        NOS_AGENT_CLIENT_SECRET: "secret:agent_librarian_client_secret"  # pointer into ~/.nos/secrets.yml — the ONE spelling; never re-derive from the prefix (gate: test_agent_secret_single_spelling.py)
        NOS_AGENT_PROFILE: "{{ playbook_dir }}/files/anatomy/agents/librarian/agent.yml"
        # Briefs are the operator-facing articles — sonnet, not the flagship.
        NOS_AGENT_TASK: |
          Work ONE batch of the taxonomy-brief skill (root taxonomy sweep):
          1. GET /agent/v1/taxonomy/brief/pending?limit=10&maxLevel=9 —
             nodes (full sweep, all levels, root-first) lacking an
             article, with server context (path, K1 description,
             childNames, siblingNames).
          2. Write briefs per the brief procedure AND the house style:
             2-4 paragraphs en + real cs translation, 2-5 [[node-id]]
             vazby (mandatory), 1-3 durable external links, building
             on the K1 description.
          3. POST /agent/v1/taxonomy/brief with ALL items in one batch;
             report per-item errors verbatim.
          4. POST your "## Librarian report" (sections Summary — batch
             size, proposed, errors, remaining total — and Taxonomy)
             via Wing /api/v1/events type=conductor_report source=librarian,
             with the full markdown in result_json.report_markdown. That
             field name is not a suggestion: a body under any other key is
             refused, because a report the door cannot store would be
             recorded empty (measured 2026-08-29, session be9d107f).
          End the report with a final line `NOS_AGENT_EXIT: 0` (the runner
          reads this — a bare exit code is NOT propagated). Proposals await
          the moderator, but that is the normal outcome — do NOT escalate;
          use 1 only if the batch could not run at all.
        WING_API_URL: "http://127.0.0.1:9000"
        WING_API_TOKEN: "{{ librarian_wing_api_token }}"
        WING_EVENTS_HMAC_SECRET: "{{ bone_secret }}"
        KEAP_API_URL: "http://127.0.0.1:{{ keap_port }}"
        KEAP_AGENT_TOKEN_RO: "{{ keap_agent_token_ro }}"
        KEAP_AGENT_TOKEN_RW: "{{ keap_agent_token_rw }}"

    # K1 taxonomy-describe (skills/taxonomy-describe in nos-keap). Paused,
    # on-demand: tools/run-librarian.sh --describe fires one ~40-node batch;
    # the ~778-node backlog is ~20 supervised runs, not a cron.
    - name: describe-taxonomy
      category: knowledge
      runner: subprocess
      command: "{{ playbook_dir }}/tools/run-agent.sh"
      args: ["--agent=librarian", "--trigger=pulse"]
      # 02:30, not 02:10 (moved 2026-08-30). Every claude-CLI agent takes the
      # same mkdir mutex, and conductor:vulnerability-scan fires at 02:00 and
      # averages 607s with a measured worst case of 1080s. This job waits 300s
      # for the lock and then dies rc=2 — which it has, twice. Ten minutes of
      # separation was never enough for a job that can run eighteen.
      schedule: "30 2 * * *"
      jitter_min: 5
      max_runtime_s: 900
      max_concurrent: 1
      paused: false
      paused_reason: "K1 is operator-paced; tools/run-librarian.sh --describe fires it"
      env:
        NOS_AUTHENTIK_URL: "https://{{ authentik_domain }}"
        NOS_AGENT_NAME: "librarian"
        NOS_AGENT_CLIENT_ID: "nos-librarian"
        NOS_AGENT_CLIENT_SECRET: "secret:agent_librarian_client_secret"  # pointer into ~/.nos/secrets.yml — the ONE spelling; never re-derive from the prefix (gate: test_agent_secret_single_spelling.py)
        NOS_AGENT_PROFILE: "{{ playbook_dir }}/files/anatomy/agents/librarian/agent.yml"
        # Bulk 1-3-sentence descriptions — haiku carries the whole backlog.
        NOS_AGENT_TASK: |
          Work ONE batch of the K1 taxonomy-describe skill:
          1. GET /agent/v1/taxonomy/describe/pending?limit=40 — nodes
             lacking a load-bearing description, with server context
             (path, childNames, siblingNames).
          2. Write descriptions per the description procedure AND the
             house style: concept not label, sibling-carving boundaries,
             1-3 dense sentences, en canonical + cs real translation.
          3. POST /agent/v1/taxonomy/describe with ALL items in one
             batch; report per-item errors verbatim.
          4. POST your "## Librarian report" (sections Summary — batch
             size, proposed, errors, remaining total — and Taxonomy)
             via Wing /api/v1/events type=conductor_report source=librarian,
             with the full markdown in result_json.report_markdown. That
             field name is not a suggestion: a body under any other key is
             refused, because a report the door cannot store would be
             recorded empty (measured 2026-08-29, session be9d107f).
          End the report with a final line `NOS_AGENT_EXIT: 0` (the runner
          reads this — a bare exit code is NOT propagated). Proposals await
          the moderator, but that is the normal outcome — do NOT escalate;
          use 1 only if the batch could not run at all.
        WING_API_URL: "http://127.0.0.1:9000"
        WING_API_TOKEN: "{{ librarian_wing_api_token }}"
        WING_EVENTS_HMAC_SECRET: "{{ bone_secret }}"
        KEAP_API_URL: "http://127.0.0.1:{{ keap_port }}"
        KEAP_AGENT_TOKEN_RO: "{{ keap_agent_token_ro }}"
        KEAP_AGENT_TOKEN_RW: "{{ keap_agent_token_rw }}"
