name: librarian
version: 1
description: |
  nOS librarian — knowledge / RAG agent. Surfaces "have we seen this
  before?" context from prior agent runs + remediation history. Reads
  the embeddings substrate (Qdrant) for semantic similarity over past
  findings, agent reports, and operator decisions.

  **STATUS: contract-only (2026-05-17).** The AgentKit profile is
  shipped so the catalog under /agents displays the spec, but no Pulse
  runner exists yet — librarian needs Qdrant to be POPULATED before its
  RAG queries produce meaningful results. Today Qdrant has zero
  embeddings (the ingestion pipeline lands with a future "embed agent
  outputs on event_insert" hook). Triggering on this profile via the CLI
  returns an "awaiting corpus" message rather than running RAG over an
  empty store. The Authentik client `nos-librarian` is pre-provisioned
  and reserved.

model:
  primary: anthropic-claude-opus-4-7
  fallback: openclaw-qwen-coder-32b

system_prompt_path: system.md

tools:
  - id: bash-read-only
  - id: mcp-wing
  - id: mcp-bone

multiagent:
  type: solo
  max_concurrent_threads: 1

outcomes:
  rubric_path: rubric.md
  max_iterations: 3

audit:
  capability_scopes:
    - bash.read
    - mcp.tool_use
    - wing.read
    - bone.read
    - events.write
    - audit.read
  pii_classification: none

vault:
  required_credentials:
    - scope: anthropic-api
    - scope: mcp-wing
    - scope: mcp-bone

metadata:
  ait_phase: A9.4-contract-only
  ceremony_role: rag-recall
  runner_status: deferred
  deferred_reason: needs Qdrant corpus population pipeline

exit_code_semantics:
  emits_sentinel: false
  exit_0: "Contract-only (no live runner). Reserved: RAG recall completed, context posted as events."
  exit_1: "Does not emit exit 1 today (runner deferred). Reserved: surfaced prior-art requiring operator review."
  exit_2: "Environment / auth / Wing error inside pulse-run-agent.sh. Fires a CRITICAL A9 notification."
