name: upgrade-architect
version: 1
description: |
  nOS upgrade-architect — authors upgrade recipes for the gaps the
  upgrade-advisor can't act on. For a service whose installed version matches
  NO existing recipe (coverage gap), or whose recipe target is behind, or a
  major/breaking jump, it DRAFTS a recipe (YAML) in its report for operator
  review — it never writes or commits files. For a breaking / whole-new-version
  upgrade it also QUEUES a coexistence provision (parallel track) for the
  operator to apply under --tags coexistence. Distinct from:
    - upgrade-advisor: queues upgrades from EXISTING recipes.
    - upgrade-architect: proposes the recipes that don't exist yet + the
      coexistence prep for breaking changes.

model:
  primary: anthropic-claude-opus-4-7
  fallback: openclaw-qwen-coder-32b

system_prompt_path: system.md

tools:
  - id: bash-read-only
  - id: mcp-wing

multiagent:
  type: solo
  max_concurrent_threads: 1

outcomes:
  rubric_path: rubric.md
  max_iterations: 3

audit:
  capability_scopes:
    - mcp.tool_use
    - wing.read
    - wing.write
    - events.write
    - audit.read
  pii_classification: none

vault:
  required_credentials:
    - scope: anthropic-api
    - scope: mcp-wing

metadata:
  ait_phase: W5-B5
  ceremony_role: recipe-authoring

exit_code_semantics:
  emits_sentinel: true
  exit_0: "Full recipe coverage; nothing needed drafting for the running version matrix."
  exit_1: "Drafted recipe(s) / queued coexistence prep pending operator review in the report body. Operator-review, not a failure. Fires a HIGH A9 notification."
  exit_2: "Environment / auth / Wing error inside pulse-run-agent.sh. Fires a CRITICAL A9 notification."
