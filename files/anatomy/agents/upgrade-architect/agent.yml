name: upgrade-architect
version: 1
description: |
  nOS upgrade-architect — authors upgrade recipes for the gaps the
  upgrade-advisor can't act on. For a service whose installed version matches
  NO existing recipe (coverage gap), or whose recipe target is behind, or a
  major/breaking jump, it DRAFTS a recipe (YAML) in its report for operator
  review — it never writes or commits files. For a breaking / whole-new-version
  upgrade it also QUEUES a coexistence provision (parallel track) for the
  operator to apply under --tags coexistence. Distinct from:
    - upgrade-advisor: queues upgrades from EXISTING recipes.
    - upgrade-architect: proposes the recipes that don't exist yet + the
      coexistence prep for breaking changes.

model:
  primary: claude-sonnet
  fallback: openclaw-qwen2.5-coder:32b

system_prompt_path: system.md

tools:
  - id: bash-read-only
  - id: mcp-wing-read
  - id: migration-file-write  # 2026-08-28 — writes upgrades/<service>.yml; the
                              # runner's post-step opens the MR from it

multiagent:
  type: solo
  max_concurrent_threads: 1

outcomes:
  rubric_path: rubric.md
  max_iterations: 3

audit:
  capability_scopes:
    - mcp.tool_use
    - wing.read
    - wing.write
    - events.write
    - audit.read
    - nos.migration.write
  pii_classification: none

vault:
  required_credentials:
    - scope: anthropic-api
    - scope: mcp-wing

metadata:
  ait_phase: W5-B5
  ceremony_role: recipe-authoring

exit_code_semantics:
  emits_sentinel: true
  exit_0: "Full recipe coverage; nothing needed drafting for the running version matrix."
  exit_1: "Drafted recipe(s) / queued coexistence prep pending operator review in the report body. Operator-review, not a failure. Fires a HIGH A9 notification."
  exit_2: "Environment / auth / Wing error inside the runner. Fires a CRITICAL A9 notification."
# ── Article 30 ────────────────────────────────────────────────────────────────
gdpr:
  purpose: |
    Authors upgrade recipes for the version gaps the advisor cannot act on.
    Estate maintenance (legitimate interest, Art. 6(1)(f)). Recipe authoring
    sends repository source — role defaults, task files, templates — for
    reasoning.
  legal_basis: legitimate_interests
  data_categories:
    - repository_source
    - installed_version_inventory
  data_subjects:
    - operators
  retention_days: -1
  processors:
    - name: "Anthropic, PBC"
      role: "LLM inference for the ceremony's reasoning (claude CLI, --print)"
      country: "US"
      safeguard: "None claimed. Assess SCCs / Art. 46 before this is relied on."
  eu_residency: false
  transfers_outside_eu: true

capabilities:
  - nos:upgrades:read
  - nos:state:read
  - nos:coexistence:read

notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []

pulse:
  jobs:
    - name: recipe-author
      category: agents
      runner: subprocess
      command: "{{ playbook_dir }}/tools/run-agent.sh"
      args: ["--agent=upgrade-architect", "--trigger=pulse"]
      schedule: "0 8 * * 0"                # placeholder — paused by default
      jitter_min: 5
      max_runtime_s: 300
      max_concurrent: 1
      paused: true
      paused_reason: "upgrade-architect is on-demand; tools/run-upgrade-architect.sh fires it"
      env:
        NOS_AUTHENTIK_URL: "https://{{ authentik_domain }}"
        NOS_AGENT_NAME: "upgrade-architect"
        # Model pin: this ceremony AUTHORS upgrade recipes — it drafts real YAML
        # per coverage gap that the operator then commits. Authoring correct,
        # committable recipes is high-value and error-prone, so it earns the
        # strongest tier; a pin is mandatory or it inherits the default anyway,
        # but here the intent is explicitly the top tier, not a fallback.
        NOS_AGENT_MODEL: "opus"
        NOS_AGENT_CLIENT_ID: "nos-upgrade-architect"
        NOS_AGENT_CLIENT_SECRET: "secret:agent_upgrade_architect_client_secret"  # pointer into ~/.nos/secrets.yml — the ONE spelling; never re-derive from the prefix (gate: test_agent_secret_single_spelling.py)
        NOS_AGENT_PROFILE: "{{ playbook_dir }}/files/anatomy/agents/upgrade-architect/agent.yml"
        NOS_AGENT_TASK: |
          Author missing upgrade recipes + queue coexistence for breaking ones:
          1. GET /api/v1/upgrades — the matrix (rows carry security:
             {pending_ids, max_severity, floor, below_floor}).
          2. Find gaps: installed matches no recipe from_pattern, or installed
             at/ahead of every to_version, or an uncovered major jump, or
             security.below_floor is true (draft toward security.floor —
             never target a version below it, even when "at target").
          3. DRAFT a recipe (```yaml) per gap in your report (operator commits).
          4. For breaking/whole-new-version: POST /api/v1/coexistence/<svc>/queue.
          5. POST "## Upgrade architect report" via /api/v1/events
             type=conductor_report source=upgrade-architect.
          End the report with a final line `NOS_AGENT_EXIT: 0` (full coverage)
          or `NOS_AGENT_EXIT: 1` (you drafted recipes / queued coexistence).
        WING_API_URL: "http://127.0.0.1:9000"
        WING_API_TOKEN: "{{ upgrade_architect_wing_api_token }}"
        WING_EVENTS_HMAC_SECRET: "{{ bone_secret }}"
