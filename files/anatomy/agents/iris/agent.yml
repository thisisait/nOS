name: iris
version: 1
owner: install_thalamus
description: >-
  The thalamus's cell: one person at a terminal asks Iris to find rows in one
  DataTable and change one row. The model picks the tools; the thalamus runs
  them as that person through KEAP's human door, and no write lands without the
  person approving the cell-level diff. Not run by Wing — the thalamus binds and
  runs it (files/anatomy/thalamus/thalamus/src/binding.rs).

model:
  # Operator ruling 2026-10-12: Mistral Large on the EU endpoint. sonnet tier ->
  # NOS_MISTRAL_MODEL (mistral_model). The thalamus resolves this exactly as
  # BindingResolver does; mistral-eu is the only backend this record covers, so
  # a disarmed or keyless mistral-eu refuses rather than degrades (gate 8).
  primary: openai-sonnet
  backend: mistral-eu
  # Ruling 2026-10-14: a host may choose the on-device row instead (iris_backend: ollama in
  # config.yml -> NOS_CELL_BACKEND). A choice, never a fallback.
  # Ruling 2026-10-17: also Anthropic's and MiniMax's OpenAI-compatible rows. They are NOT
  # EU-resident, so they serve only on a host at gdpr_posture: none (gate 8); standard refuses.
  backends_allowed: [mistral-eu, ollama, anthropic-api, minimax-api]

audit:
  capability_scopes:
    - keap.read
    - keap.write
  pii_classification: low

vault:
  required_credentials:
    # mistral_api_key: the thalamus reads it from its 0600 plist env
    # (roles/pazny.thalamus), not from Wing's vault — Wing does not run iris.
    - scope: mistral-eu

metadata:
  specialization: person-assistant
  runner_status: unproven

exit_code_semantics:
  emits_sentinel: false
  exit_0: "The turn completed. A rejected edit is still exit 0 — the person decided, and the ledger records it."
  exit_1: "Does not emit exit 1. Iris answers in the shell; there is no review queue behind it."
  exit_2: "Binding, identity or KEAP error — nothing was read or written."

gdpr:
  purpose: >-
    Helping one person find and change rows in a DataTable they can already
    read and write through KEAP's human door. Every read and write runs as
    that person; Iris adds no access. Legitimate interest, Art. 6(1)(f).
  legal_basis: legitimate_interests
  # What reaches the bound row's processor on each call: the person's turns and the row values
  # the tool results carry (query_rows, propose_row_edit).
  data_categories:
    - person_authored_prompts
    - datatable_row_contents
  data_subjects:
    - operators
    - estate_users
  # The thalamus ledger keeps the turn, the tool calls and the decision. The
  # processor's own retention is its terms', not this record's (see safeguard).
  retention_days: -1
  processors:
    - name: "Mistral AI SAS"
      role: >-
        LLM inference (Mistral Large) on the EU-regional endpoint
        api.eu.mistral.ai, OpenAI-compatible chat completions with tools. Each
        call carries the person's turn and the DataTable row values returned
        by Iris's tools. Bound by state/habitat/llm-backends.yml row mistral-eu.
      country: "FR — Paris; EU inference under the regional endpoint"
      safeguard: >-
        EU processor with an EU seat; no third-country transfer is claimed.
        Caveats from the register row: the control plane (auth, billing, abuse)
        is not regionalised, zero data retention is Scale-plan-only by request,
        and training use needs an explicit opt-out. The Art. 28 DPA with Mistral
        is the operator's to confirm.
    - name: "This host (on-device, Ollama)"
      role: >-
        Only when the host chose iris_backend: ollama. LLM inference on this machine through
        Ollama's OpenAI-compatible endpoint on 127.0.0.1; nothing leaves the host. Bound by
        state/habitat/llm-backends.yml row ollama.
      country: "this host"
      safeguard: "Local processing; no processor outside the operator's control."
    - name: "Anthropic PBC"
      role: >-
        Only when the host chose iris_backend: anthropic-api (or the person picked it) on a host at
        gdpr_posture: none. LLM inference (Claude) through Anthropic's OpenAI-compatible endpoint
        api.anthropic.com/v1; each call carries the person's turn and the row values Iris's tools
        return. Bound by state/habitat/llm-backends.yml row anthropic-api.
      country: "US — San Francisco"
      safeguard: >-
        Third-country transfer to the US. Anthropic's Data Processing Addendum incorporates the EU
        SCCs, Modules Two/Three (anthropic.com/legal/data-processing-addendum, read 2026-10-17). Its
        processor is the Anthropic entity that signed the operator's agreement (the site says EU
        services come from Anthropic Ireland Limited); confirming which is the operator's. Never
        served at gdpr_posture standard.
    - name: "MiniMax (contracting entity UNVERIFIED)"
      role: >-
        Only when the host chose iris_backend: minimax-api (or the person picked it) on a host at
        gdpr_posture: none. LLM inference through MiniMax's OpenAI-compatible endpoint
        api.minimax.io/v1; each call carries the person's turn and the row values Iris's tools
        return. Bound by state/habitat/llm-backends.yml row minimax-api.
      country: "UNVERIFIED (non-EU)"
      safeguard: >-
        NONE FOUND: no DPA and no Art. 46 safeguard (SCCs) for api.minimax.io could be established,
        and the contracting entity is unverified. Acceptable only for the operator's own and bench
        data; the posture refuses it on every host that claims the EU (gdpr_posture standard).
  eu_residency: true
  # False because every host at gdpr_posture standard is served by the EU rows alone: gate 8
  # refuses a non-EU row there, and refuses to degrade to the default when one is disarmed. At
  # posture none the effective record (nos_gdpr.effective_records) recomputes it from the row.
  transfers_outside_eu: false
  storage_location: "{nos_data_root}/platform/services/thalamus/data/ledger.db on this host"

notification:
  on_critical: [wing-inbox]
  on_high:     []
  on_medium:   []
  on_low:      []
  on_info:     []

capabilities: []

task_types: [investigate]
