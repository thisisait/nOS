# =============================================================================
# upgrade-advisor.yml — nOS upgrade-advisor agent profile (W5-B4, 2026-05-27)
#
# Reads the /upgrades version matrix and QUEUES the upgrades that apply to the
# running system, for the operator to apply via `--tags upgrade`. Propose-only.
#
# Read by pulse-run-agent.sh (env NOS_AGENT_PROFILE=this file).
# AgentKit (A14) counterpart lives at files/anatomy/agents/upgrade-advisor/.
# =============================================================================

name: upgrade-advisor

system_prompt: |
  You are the nOS upgrade-advisor. Turn the version matrix into a reviewed
  upgrade PLAN by queueing applicable upgrades. Propose only — never apply.

  1. GET /api/v1/upgrades (Bearer $WING_API_TOKEN). Each service has installed,
     stable, latest, recipes[] (recipe_id, from_pattern, to_version, severity),
     and planned.
  2. For each service: skip if installed is empty or planned is already true.
     An upgrade applies when a recipe's from_pattern matches installed AND its
     to_version is ahead. Prefer the recipe matching the installed track.
  3. POST /api/v1/upgrades/<service>/<recipe_id>/queue (Bearer, body {}) for
     each applicable upgrade. NEVER pass force; a 409 means you proposed a
     non-applicable recipe — report it, don't force it.
  4. POST your "## Upgrade advisor report" via /api/v1/events
     type=conductor_report source=upgrade-advisor (Queued / Skipped /
     Recommendations sections, citing installed → target + the matched pattern).

  Exit signal: END your report with a final line, exactly, on its own:
  `NOS_AGENT_EXIT: 0` if nothing needed queueing (or queued only routine
  upgrades) — or `NOS_AGENT_EXIT: 1` if you queued upgrades that need operator
  review (breaking/security) before applying. The runtime reads this line and
  propagates it as the agent's exit code, so the operator's run-tool reports
  REVIEW vs GREEN correctly.

# ── Notification routing (A9 canonical severity shape) ────────────────────────
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []

# ── Capability scopes ─────────────────────────────────────────────────────────
# Matches authentik_agent_clients[nos-upgrade-advisor].capabilities. The
# advisor works through Wing's bearer API; the scopes future-proof Bone reads.
capabilities:
  - nos:upgrades:read
  - nos:state:read

# ── Pulse job — on-demand only (no schedule) ──────────────────────────────────
# Fires when the operator triggers it (tools/run-upgrade-advisor.sh) or after a
# recipe/version change. No default cron — planning is useful right after the
# matrix changes, not on a fixed schedule.
pulse:
  jobs:
    - name: upgrade-advise
      category: agents
      runner: subprocess
      command: "{{ playbook_dir }}/files/anatomy/scripts/pulse-run-agent.sh"
      schedule: "0 7 * * 0"                # placeholder — paused by default
      jitter_min: 5
      max_runtime_s: 300
      max_concurrent: 1
      paused: true
      paused_reason: "upgrade-advisor is on-demand; tools/run-upgrade-advisor.sh fires it"
      env:
        NOS_AUTHENTIK_URL: "https://{{ authentik_domain }}"
        NOS_AGENT_NAME: "upgrade-advisor"
        # Model pin: matches installed versions against recipe from_patterns and
        # queues the ones that fit — version-range reasoning, but every wrong
        # match is caught by the queue guard (409). sonnet gets the ranges right
        # without opus cost; a pin is mandatory or it falls to the default tier.
        NOS_AGENT_MODEL: "sonnet"
        NOS_AGENT_CLIENT_ID: "nos-upgrade-advisor"
        NOS_AGENT_CLIENT_SECRET: "{{ global_password_prefix }}_pw_agent_upgrade_advisor"
        NOS_AGENT_PROFILE: "{{ playbook_dir }}/files/anatomy/agents/upgrade-advisor.yml"
        NOS_AGENT_TASK: |
          Plan applicable upgrades:
          1. GET /api/v1/upgrades — the version matrix.
          2. For each service with installed set and not already planned, find
             the recipe whose from_pattern matches installed and whose
             to_version is ahead; POST /api/v1/upgrades/<service>/<recipe_id>/queue.
          3. Never queue a non-matching recipe (the guard returns 409 — do not force).
          4. POST your "## Upgrade advisor report" via /api/v1/events
             type=conductor_report source=upgrade-advisor.
          End the report with a final line `NOS_AGENT_EXIT: 0` (nothing/routine
          queued) or `NOS_AGENT_EXIT: 1` (queued upgrades need operator review).
        WING_API_URL: "http://127.0.0.1:9000"
        WING_API_TOKEN: "{{ upgrade_advisor_wing_api_token }}"
        WING_EVENTS_HMAC_SECRET: "{{ bone_secret }}"
