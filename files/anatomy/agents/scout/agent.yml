name: scout
version: 1
description: |
  nOS scout — drift / visibility agent. Reads recent events from
  wing.db, correlates with the committed state in `state/manifest.yml`,
  and reports what changed unexpectedly. Read-only across state +
  security; the operator decides whether drift is intentional.

  Distinct from conductor / remediator:
    - Conductor verifies platform health end-to-end (does everything
      respond? are jobs registered? is the audit trail flowing?).
    - Remediator analyzes individual security findings.
    - Scout looks at the *deltas*: tracks event types, frequency,
      actor distribution, and flags anomalies (new actor_id appearing,
      drop in conductor heartbeat, pulse job exit_code skew).

model:
  primary: anthropic-claude-opus-4-7
  fallback: openclaw-qwen-coder-32b

system_prompt_path: system.md

tools:
  - id: bash-read-only
  - id: mcp-wing
  - id: mcp-bone

multiagent:
  type: solo
  max_concurrent_threads: 1

outcomes:
  rubric_path: rubric.md
  max_iterations: 3

audit:
  capability_scopes:
    - bash.read
    - mcp.tool_use
    - wing.read
    - bone.read
    - events.write
    - audit.read
  pii_classification: none

vault:
  required_credentials:
    - scope: anthropic-api
    - scope: mcp-wing
    - scope: mcp-bone

metadata:
  ait_phase: A9.4
  ceremony_role: drift-visibility
