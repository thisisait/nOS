name: remediator
version: 1
description: |
  nOS remediator — proposes (does NOT auto-apply) fixes for open security
  findings. Reads gitleaks_findings + remediation_items, fetches file
  context, and produces a markdown remediation report with one specific
  recommendation per finding. Operator decides what to apply.

  Distinct from the conductor:
    - Conductor verifies platform health end-to-end (read-only diagnostics).
    - Remediator focuses on security findings (read-only proposals).
  Both write events; neither modifies repo files or marks findings
  resolved without operator action.

model:
  primary: claude-opus
  fallback: openclaw-qwen2.5-coder:32b

system_prompt_path: system.md

tools:
  - id: bash-read-only
  - id: mcp-wing
  - id: mcp-bone

multiagent:
  type: solo
  max_concurrent_threads: 1

outcomes:
  rubric_path: rubric.md
  max_iterations: 3

audit:
  capability_scopes:
    - bash.read
    - mcp.tool_use
    - wing.read
    - bone.read
    - events.write
    - audit.read
  pii_classification: none

vault:
  required_credentials:
    - scope: anthropic-api
    - scope: mcp-wing
    - scope: mcp-bone

metadata:
  ait_phase: A9.3
  ceremony_role: security-finding-triage

exit_code_semantics:
  emits_sentinel: false
  exit_0: "Triaged all open security findings; remediation proposals posted as events. Prose-only — exits 0 even when proposals exist (the operator decides what to apply)."
  exit_1: "Does not emit exit 1. Proposals never auto-apply; they live in the report body for operator review, not in the process exit."
  exit_2: "Environment / auth / Wing error inside pulse-run-agent.sh. Fires a CRITICAL A9 notification."
# ── Article 30 ────────────────────────────────────────────────────────────────
gdpr:
  purpose: |
    Proposes (never applies) fixes for open security findings. Estate security
    (legitimate interest, Art. 6(1)(f)).

    THE SHARPEST CEREMONY IN THE FLEET, and the reason these records are per
    agent. It reads `gitleaks_findings` — whose rows carry the COMMIT AUTHOR'S
    NAME AND EMAIL — and then fetches the surrounding file context, i.e. the
    plaintext neighbourhood of every unresolved secret leak. Both leave the
    host. A record written for "the agent runtime" as a whole would have
    described the mildest ceremony and covered this one by implication.
  legal_basis: legitimate_interests
  data_categories:
    - secret_leak_neighbourhoods  # source lines around each finding
    - commit_author_identifiers   # git author name + email, from finding rows
    - remediation_queue_records
  data_subjects:
    - operators
    - commit_authors              # anyone whose commit produced a finding
  retention_days: -1
  processors:
    - name: "Anthropic, PBC"
      role: "LLM inference for the ceremony's reasoning (claude CLI, --print)"
      country: "US"
      safeguard: "None claimed. Assess SCCs / Art. 46 before this is relied on."
  eu_residency: false
  transfers_outside_eu: true
  notes: |
    Routing consequence, recorded here so it is not re-derived: this ceremony
    fails the data-sensitivity axis for any additional processor. Adding a
    second LLM provider widens the recipients of leaked-secret context and
    commit-author identity, and must be a deliberate act with its own basis.
