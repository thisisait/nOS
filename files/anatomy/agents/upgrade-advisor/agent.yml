name: upgrade-advisor
version: 1
description: |
  nOS upgrade-advisor — reads the /upgrades version matrix and QUEUES the
  upgrades that apply to the running system, for the operator to apply via
  `ansible-playbook main.yml --tags upgrade`. Proposes only; never applies.

  For each service it reads installed (from state) vs the recipe targets,
  and queues a recipe only when its from_pattern matches the installed
  version (the queue's mismatch guard enforces this too). Distinct from the
  other agents:
    - Conductor verifies platform health end-to-end.
    - Scout reports drift (state vs committed).
    - Remediator triages security findings (gitleaks).
    - Upgrade-advisor turns the version matrix into a reviewed upgrade plan.

model:
  primary: claude-sonnet
  fallback: openclaw-qwen2.5-coder:32b

system_prompt_path: system.md

tools:
  - id: bash-read-only
  - id: mcp-wing

multiagent:
  type: solo
  max_concurrent_threads: 1

outcomes:
  rubric_path: rubric.md
  max_iterations: 3

audit:
  capability_scopes:
    - mcp.tool_use
    - wing.read
    - wing.write
    - events.write
    - audit.read
  pii_classification: none

vault:
  required_credentials:
    - scope: anthropic-api
    - scope: mcp-wing

metadata:
  ait_phase: W5-B4
  ceremony_role: upgrade-planning

exit_code_semantics:
  emits_sentinel: true
  exit_0: "Nothing needed queueing (or only routine upgrades); the version matrix is at target."
  exit_1: "Queued upgrade(s) pending operator review — apply via `ansible-playbook main.yml --tags upgrade`. Operator-review, not a failure. Fires a HIGH A9 notification."
  exit_2: "Environment / auth / Wing error inside pulse-run-agent.sh. Fires a CRITICAL A9 notification."
# ── Article 30 ────────────────────────────────────────────────────────────────
gdpr:
  purpose: |
    Reads the upgrade version matrix and queues the upgrades that apply to the
    running estate, for the operator to apply. Estate maintenance (legitimate
    interest, Art. 6(1)(f)).
  legal_basis: legitimate_interests
  data_categories:
    - installed_version_inventory
    - upgrade_recipe_metadata
  data_subjects:
    - operators
  retention_days: -1
  processors:
    - name: "Anthropic, PBC"
      role: "LLM inference for the ceremony's reasoning (claude CLI, --print)"
      country: "US"
      safeguard: "None claimed. Assess SCCs / Art. 46 before this is relied on."
  eu_residency: false
  transfers_outside_eu: true
