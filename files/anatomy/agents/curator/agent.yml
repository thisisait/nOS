name: curator
version: 1
description: |
  nOS curator — the librarian's active sibling and the taxonomy's
  reconciler. Where the librarian FILLS (describes, briefs, judges lint)
  and never modifies, the curator RESHAPES: it sweeps the votable zone
  (level >= min_level, default 3), acts as an advanced linter, and
  proposes rename / rewrite / renumber / create / delete / rewire edits
  into the moderation panel for the operator to approve. Nothing
  auto-applies — every change is a promotion the moderator decides.

  Recursive self-improving loop: approved edits re-embed, sharpening the
  semantic neighborhoods the next pass reasons over; rejected proposals
  teach taste via a house-style memo. Traversal is staleness-ordered with
  epsilon random hops; a work-log (curator_runs + curator_visits) makes an
  overnight run resumable after a kill/OOM.

  **STATUS: PARKED (2026-08-26, roster close).** The P0 read-only pilot
  ran live 2026-07-14 (desc-kind proposals through the describe seam;
  full L>=3 sweep, convergence proven) and then went quiet: zero
  agent:curator events in the current wing.db epoch. The launcher
  apparatus is gone — flat profile files/anatomy/agents/curator.yml,
  Pulse job curator:curator-sweep, tools/run-curator.sh and the
  curator_wing_api_token bearer were all removed; this AgentKit contract
  is the ONE remaining spelling. The Authentik client `nos-curator`
  stays provisioned and reserved (inspektor pattern). Un-parking is
  epic-bound work (P1-P3, docs/archive/keap-curator-agent.md): re-declare
  the pulse job, the bearer, and a launcher deliberately — do not
  resurrect the old copies from git without re-reading the plan.

model:
  # `anthropic-*` = SDK adapter (tool schemas). Ruling 1 admits it: no code.
  primary: anthropic-claude-sonnet-4-5
  backend: minimax
  fallback: openclaw-qwen2.5-coder:32b

system_prompt_path: system.md

tools:
  - id: bash-read-only
  - id: mcp-wing-read
  - id: mcp-bone
  - id: mcp-keap


outcomes:
  # reshapes the KEAP corpus — cortex-corpus-diff is the oracle for that.
  gateset: live
  rubric_path: rubric.md
  max_iterations: 3

audit:
  capability_scopes:
    - bash.read
    - mcp.tool_use
    - wing.read
    - bone.read
    - keap.read
    - keap.write
    - events.write
    - audit.read
  pii_classification: none

vault:
  required_credentials:
    - scope: anthropic-api
    - scope: mcp-wing
    - scope: mcp-bone
    - scope: mcp-keap

metadata:
  ait_phase: curator-P0-pilot
  ceremony_role: taxonomy-reconcile
  runner_status: parked
  plan_ref: docs/archive/keap-curator-agent.md
  deferred_reason: >-
    Parked 2026-08-26 (roster close): the P0 pilot proved the sweep
    (frontier via /agent/v1/curator/frontier, desc rewrites via
    /agent/v1/taxonomy/describe, checkpoints via /agent/v1/curator/visit)
    but no run since; launcher, flat profile, pulse job and Wing bearer
    removed. P1-P3 (node-edit / delete / relation seams) is the scheduled
    epic that un-parks it.

exit_code_semantics:
  emits_sentinel: true
  exit_0: "Sweep completed; visits checkpointed. Any desc proposals await the moderator — the normal, non-escalating outcome."
  exit_1: "Structural findings queued for operator review (a duplicate / contradiction / misparent the moderator must adjudicate)."
  exit_2: "Environment / auth / Wing or KEAP error inside the runner. Fires a CRITICAL A9 notification."
# ── Article 30 ────────────────────────────────────────────────────────────────
gdpr:
  purpose: |
    Reconciles and reshapes the KEAP taxonomy — the librarian's active sibling.
    Estate knowledge maintenance (legitimate interest, Art. 6(1)(f)). What
    travels is curated public-knowledge content, not tenant data.
  legal_basis: legitimate_interests
  data_categories:
    - knowledge_corpus_content
    - taxonomy_structure
  data_subjects:
    - operators
  retention_days: -1
  processors:
    - name: "MiniMax"
      role: "LLM inference via the Anthropic-compatible endpoint (SDK adapter, tool loop driven by AgentKit). The bound backend for this ceremony."
      country: "unverified — international endpoint api.minimax.io; entity and seat not established"
      safeguard: "None established. Recorded as UNVERIFIED rather than asserted; the binding gate refuses a backend this record does not name, so this entry is what permits the routing and must not be written as a claim it cannot support."
    - name: "Anthropic, PBC"
      role: "LLM inference when this ceremony is driven on the claude-CLI path rather than the bound backend (--print)"
      country: "US"
      safeguard: "None claimed. Assess SCCs / Art. 46 before this is relied on."
  eu_residency: false
  transfers_outside_eu: true

# nos-work:// CO segment (dtt-routing-address) — authored; see agent-capability.py
task_types: [seed-edit, investigate]
