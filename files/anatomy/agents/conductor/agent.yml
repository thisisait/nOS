name: conductor
version: 1
description: |
  nOS conductor — first non-operator-identity agent. Runs after each playbook
  blank+converge to verify the platform end-to-end. Pulse-fired weekly (Sun
  04:00 UTC) for ongoing drift detection. Walks: hub health, pulse trigger,
  events query, OpenAPI drift, wing test suite. Posts a markdown report
  back into events as type=conductor_report. First A8 ceremony pass criterion
  is that THIS agent successfully completes a full self-test cycle and the
  resulting wing.db rows pass the Phase-5 verification gate.

model:
  # `anthropic-*` selects the SDK adapter, the only one that can be handed the
  # three tool schemas below (`spine-tools-vs-cli-refusal`). Unbound this URI
  # wants ANTHROPIC_API_KEY, which the estate does not set — so disarming
  # MiniMax makes the BOUND path refuse rather than fall back. The CLI ceremony
  # (conductor:self-test, NOS_AGENT_MODEL=haiku) never reads this block.
  primary: anthropic-claude-sonnet-4-5
  backend: minimax
  fallback: openclaw-qwen2.5-coder:32b

system_prompt_path: system.md

tools:
  - id: bash-read-only
  - id: mcp-wing
  - id: mcp-bone

multiagent:
  type: solo
  max_concurrent_threads: 1

outcomes:
  rubric_path: rubric.md
  max_iterations: 3

audit:
  capability_scopes:
    - bash.read
    - mcp.tool_use
    - wing.read
    - bone.read
    - events.write
    - audit.read
  pii_classification: none

vault:
  required_credentials:
    - scope: anthropic-api
    - scope: mcp-wing
    - scope: mcp-bone

metadata:
  ait_phase: A8
  ceremony_role: first-non-operator-write
  # The CLI ceremony (conductor:self-test) runs weekly and works. This says
  # nothing about the bound path, which has never served this agent.
  runner_status: unproven

exit_code_semantics:
  emits_sentinel: false
  exit_0: "Self-test ceremony completed; health report posted as events. Prose-only — conductor always exits 0 unless the runner itself errors."
  exit_1: "Does not emit exit 1. Conductor posts a markdown report, not a sentinel; findings live in the report body, not the process exit."
  exit_2: "Environment / auth / Wing error inside pulse-run-agent.sh (token, HMAC, claude CLI). Fires a CRITICAL A9 notification."
# ── Article 30 ────────────────────────────────────────────────────────────────
gdpr:
  purpose: |
    Verifies the platform end-to-end after a converge: reads Wing state, health
    endpoints and the Pulse job registry, then reports findings. Estate
    operation and assurance (legitimate interest, Art. 6(1)(f)). The prompt and
    the material it gathers are sent to a hosted model for reasoning.
  legal_basis: legitimate_interests
  data_categories:
    - estate_health_telemetry     # container/service status, endpoint probes
    - job_registry_metadata       # plugin, job name, schedule, last exit
    - operator_authored_prompts
  data_subjects:
    - operators
  retention_days: -1              # findings persist as events in wing.db
  processors:
    - name: "MiniMax"
      role: "LLM inference via the Anthropic-compatible endpoint (SDK adapter, tool loop driven by AgentKit). The bound backend for this ceremony."
      country: "unverified — international endpoint api.minimax.io; entity and seat not established"
      safeguard: "None established. Recorded as UNVERIFIED rather than asserted; the binding gate refuses a backend this record does not name, so this entry is what permits the routing and must not be written as a claim it cannot support."
    - name: "Anthropic, PBC"
      role: "LLM inference when this ceremony is driven on the claude-CLI path rather than the bound backend (--print)"
      country: "US"
      safeguard: "None claimed. Assess SCCs / Art. 46 before this is relied on."
  eu_residency: false
  transfers_outside_eu: true
  notes: |
    The transfer is a property of the CEREMONY, not of the harness: it holds
    whether pulse-run-agent.sh or AgentKit drives it.
