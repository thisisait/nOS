name: conductor
version: 1
description: |
  nOS conductor — first non-operator-identity agent. Runs after each playbook
  blank+converge to verify the platform end-to-end. Pulse-fired weekly (Sun
  04:00 UTC) for ongoing drift detection. Walks: hub health, pulse trigger,
  events query, OpenAPI drift, wing test suite. Posts a markdown report
  back into events as type=conductor_report. First A8 ceremony pass criterion
  is that THIS agent successfully completes a full self-test cycle and the
  resulting wing.db rows pass the Phase-5 verification gate.

model:
  # `anthropic-*` = SDK adapter (tool schemas); unbound it refuses.
  primary: anthropic-claude-sonnet-4-5
  backend: minimax
  fallback: openclaw-qwen2.5-coder:32b

system_prompt_path: system.md

tools:
  - id: bash-read-only
  - id: mcp-wing
  - id: mcp-bone

multiagent:
  type: solo
  max_concurrent_threads: 1

outcomes:
  rubric_path: rubric.md
  max_iterations: 3

audit:
  capability_scopes:
    - bash.read
    - mcp.tool_use
    - wing.read
    - bone.read
    - events.write
    - audit.read
  pii_classification: none

vault:
  required_credentials:
    - scope: anthropic-api
    - scope: mcp-wing
    - scope: mcp-bone

metadata:
  ait_phase: A8
  ceremony_role: first-non-operator-write
  # The weekly CLI ceremony works; the bound path has never served this agent.
  runner_status: unproven

exit_code_semantics:
  emits_sentinel: false
  exit_0: "Self-test ceremony completed; health report posted as events. Prose-only — conductor always exits 0 unless the runner itself errors."
  exit_1: "Does not emit exit 1. Conductor posts a markdown report, not a sentinel; findings live in the report body, not the process exit."
  exit_2: "Environment / auth / Wing error inside the runner (token, HMAC, environment). Fires a CRITICAL A9 notification."
# ── Article 30 ────────────────────────────────────────────────────────────────
gdpr:
  purpose: |
    Verifies the platform end-to-end after a converge: reads Wing state, health
    endpoints and the Pulse job registry, then reports findings. Estate
    operation and assurance (legitimate interest, Art. 6(1)(f)). The prompt and
    the material it gathers are sent to a hosted model for reasoning.
  legal_basis: legitimate_interests
  data_categories:
    - estate_health_telemetry     # container/service status, endpoint probes
    - job_registry_metadata       # plugin, job name, schedule, last exit
    - operator_authored_prompts
  data_subjects:
    - operators
  retention_days: -1              # findings persist as events in wing.db
  processors:
    - name: "MiniMax"
      role: "LLM inference via the Anthropic-compatible endpoint (SDK adapter, tool loop driven by AgentKit). The bound backend for this ceremony."
      country: "unverified — international endpoint api.minimax.io; entity and seat not established"
      safeguard: "None established. Recorded as UNVERIFIED rather than asserted; the binding gate refuses a backend this record does not name, so this entry is what permits the routing and must not be written as a claim it cannot support."
    - name: "Anthropic, PBC"
      role: "LLM inference when this ceremony is driven on the claude-CLI path rather than the bound backend (--print)"
      country: "US"
      safeguard: "None claimed. Assess SCCs / Art. 46 before this is relied on."
  eu_residency: false
  transfers_outside_eu: true
  notes: |
    The transfer is a property of the CEREMONY, not of the harness: it holds
    whether pulse-run-agent.sh or AgentKit drives it.

capabilities:
  - nos:state:read
  - nos:state:write
  - nos:security:read
  - nos:security:write
  - nos:security:scan
  - nos:migrations:read
  - nos:upgrades:read
  - nos:patches:read
  - nos:coexistence:read

notification:
  on_critical: [wing-inbox, ntfy, mail]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []

pulse:
  jobs:
    - name: self-test-001
      category: agents
      runner: subprocess
      command: "{{ playbook_dir }}/tools/run-agent.sh"
      args: ["--agent=conductor", "--trigger=pulse"]
      schedule: "0 4 * * 0"
      jitter_min: 5
      max_runtime_s: 300
      max_concurrent: 1
      env:
        NOS_AUTHENTIK_URL: "https://{{ authentik_domain }}"
        # Genericized A9.3 (2026-05-17). Both NOS_AGENT_* and NOS_CONDUCTOR_*
        # work in the runner; new agents only set NOS_AGENT_*.
        NOS_AGENT_NAME: "conductor"
        # Model pin: this ceremony is four fixed GET calls + a summary table +
        # a 0/1 exit — mechanical read-and-tabulate, no authoring, no open-ended
        # reasoning. haiku is the right (cheapest) tier; without a pin it would
        # inherit the operator's default (the most expensive tier).
        NOS_AGENT_MODEL: "haiku"
        NOS_AGENT_CLIENT_ID: "nos-conductor"
        NOS_AGENT_CLIENT_SECRET: "secret:agent_conductor_client_secret"  # pointer into ~/.nos/secrets.yml — the ONE spelling; never re-derive from the prefix (gate: test_agent_secret_single_spelling.py)
        NOS_AGENT_PROFILE: "{{ playbook_dir }}/files/anatomy/agents/conductor/agent.yml"
        NOS_AGENT_TASK: |
          Run the Phase 5 conductor self-test ceremony:
          1. GET /api/health from Bone — verify liveness (expect 200).
          2. GET /api/v1/gitleaks_findings?open_only=1 from Wing — count unresolved findings.
          3. GET /api/v1/pulse_jobs from Wing — verify nightly-scan is registered.
          4. GET /api/v1/events?source=conductor&limit=5 — show my last 5 runs.
          5. Report: summary table of findings + job catalog + event history.
          Exit 0 if all checks passed. Exit 1 if any check failed or findings need attention.
        WING_API_URL: "http://127.0.0.1:9000"
        WING_API_TOKEN: "{{ conductor_wing_api_token }}"
        WING_EVENTS_HMAC_SECRET: "{{ bone_secret }}"

    # Nervy (2026-05-25): deterministic (no-LLM) scheduled drift watcher.
    # Runs the drift-check probe daily so the Prometheus drift metric refreshes
    # between playbook runs, and notifies (HMAC → Bone) when the scan is stale
    # (>14d) or CRITICALs are pending. Closes the "manual interim refresh path"
    # debt; the LLM scan-REFRESH (self-test-001 above + scan-runner) stays separate.
    - name: security-drift-watch
      category: security
      runner: subprocess
      command: "{{ playbook_dir }}/files/anatomy/scripts/drift-watch.sh"
      schedule: "0 6 * * *"          # 06:00 UTC daily
      jitter_min: 10
      max_runtime_s: 120
      max_concurrent: 1
      env:
        NOS_REPO: "{{ playbook_dir }}"
        # 9000 is WING. Bone (bone_port, 8099) is what verifies the HMAC on
        # /api/v1/notifications, so a signed POST to 9000 lands on a service
        # with no verifier and 401s. Third occurrence of this exact defect —
        # gitleaks and authentik-tofu-drift were both fixed on 2026-07-08 and
        # the gitleaks comment claimed it was "the sole outlier". It was not,
        # and nothing checked. Now pinned by test_bone_port_never_hardcoded.py.
        BONE_API_URL: "http://127.0.0.1:{{ bone_port }}"
        WING_EVENTS_HMAC_SECRET: "{{ bone_secret }}"
        DRIFT_STALE_HOURS: "336"

    # 2026-08-05: record the scan's output, because until now nothing did.
    #
    # scan-runner.sh writes remediation-queue.json + scan-state.json into the
    # repository and never mentions git, so months of findings accumulated as an
    # uncommitted diff in one checkout. Measured that day: the main checkout
    # carried 165 rows, origin/dev carried 152 — thirteen findings, two HIGH,
    # that only one directory on one machine knew about, and one `git checkout`
    # from gone.
    #
    # A SEPARATE JOB rather than a line at the end of scan-runner, for two
    # reasons: a broken recorder must not be able to fail the scan, and the
    # queue has other writers (an agent flipping a status, an operator adding a
    # rationale) whose edits deserve recording just as much.
    #
    # 03:30 — after the 02:00 scan's 1800s ceiling has expired, so it records a
    # settled file rather than one being written.
    #
    # It moves ONE ref and touches no working tree; the paths it may commit are
    # a hardcoded allow-list, so it cannot pick up the operator's in-flight work.
    # See the tool's header for the plumbing and for why `git commit` in a live
    # tree was the wrong answer.
    - name: scan-state-record
      category: security
      runner: subprocess
      command: "{{ playbook_dir }}/tools/scan-state-snapshot.py"
      schedule: "30 3 * * *"         # 03:30 UTC daily
      jitter_min: 5
      max_runtime_s: 120
      max_concurrent: 1
      # What this job WRITES (anatomy graph, actor-side declaration). No args
      # → no `--push`: the ref move is LOCAL. Nothing automated pushes this
      # branch anywhere; repo:github-origin's automated_writers stays [].
      writes:
        - target: "repo:scan-data"
          via: "moves refs/heads/scan-data to a new commit holding
            scan-state.json + remediation-queue.json
            (tools/scan-state-snapshot.py:90 BRANCH, :268 ref update;
            --push is opt-in at :375 and this job passes no args)"
          measured: "2026-08-06"
      env: {}

    # Nervy (2026-05-25): autonomous vulnerability scan — the LLM scan-REFRESH
    # half. Migrated from the launchd eu.thisisait.nos.vulnscan job to unified
    # Pulse scheduling (alongside gitleaks + conductor), per tasks/vulnerability-
    # scan.yml's own "eventually migrate to Pulse" note. Dispatches `claude`
    # with scan-prompt.md over the oldest components, refreshes last_full_scan +
    # remediation-queue, emits scan.batch_* events. No-ops cleanly when `claude`
    # is absent (scan-runner preflights it). Pause via Wing /pulse to stop the
    # autonomous LLM scans. REPO_DIR/VULNSCAN_SECURITY_DIR are set explicitly —
    # scan-runner's $(dirname $0)/../docs default mis-resolves from the repo path.
    - name: vulnerability-scan
      category: security
      runner: subprocess
      command: "{{ playbook_dir }}/files/vuln-scan/scan-runner.sh"
      schedule: "0 2 * * *"          # 02:00 UTC daily (was 2×/day launchd)
      jitter_min: 15
      max_runtime_s: 1800             # an LLM scan of a batch can run minutes
      max_concurrent: 1
      env:
        REPO_DIR: "{{ playbook_dir }}"
        VULNSCAN_SECURITY_DIR: "{{ playbook_dir }}/docs/llm/security"
        WING_EVENTS_HMAC_SECRET: "{{ bone_secret }}"
        # `claude` (Claude Code) must be on this PATH; adjust if installed elsewhere.
        PATH: "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
