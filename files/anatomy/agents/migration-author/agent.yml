name: migration-author
version: 1
description: |
  nOS migration-author — promotes a MERGED upgrade recipe into the real
  committed codebase change. For a service whose recipe the operator has
  reviewed + the operator's plan-choice (migration in-place | coexist), it
  WRITES the imperative migration record under files/anatomy/migrations/ +
  bumps <service>_version in default.config.yml, then opens a LOCAL forge
  MERGE REQUEST for the operator to review + merge (GATE 2). It never merges,
  never promotes to GitHub, never runs an apply tag, never provisions a track.
  The forge MR + the operator's merge is the gate. Distinct from:
    - upgrade-architect: drafts the recipes that don't exist yet (recipe MR).
    - migration-author: promotes a merged recipe → the real migration record +
      version bump (migration MR).
  (upgrade-advisor, which queued upgrades from EXISTING recipes, was retired
  2026-08-26 — that task became a deterministic query when
  UpgradeRepository::compareVersions landed.)

  **STATUS: PARKED (2026-08-26, roster close).** One real session ever
  (2026-06; zero agent:migration-author events in the current wing.db
  epoch). The launcher apparatus is gone — flat profile
  files/anatomy/agents/migration-author.yml, Pulse job
  migration-author:promote-migration, tools/run-migration-author.sh and
  the migration_author_wing_api_token bearer were all removed; this
  AgentKit contract is the ONE remaining spelling. The Authentik client
  `nos-migration-author` stays provisioned and reserved (inspektor
  pattern). Un-parking rides the agentic upgrade→migration→coexistence
  epic (docs/archive/agentic-upgrade-migration-coexistence.md): re-declare
  the bearer and a trigger deliberately.

model:
  primary: claude-sonnet
  fallback: openclaw-qwen2.5-coder:32b

system_prompt_path: system.md

# Q8/A2 (2026-06-16): runs NATIVELY in AgentKit (`bin/run-agent.php
# --agent=migration-author --trigger=operator`), so runs land in
# agent_sessions + OTel. Writes only via the gated migration-file-write tool
# (path-allowlisted, scope nos.migration.write); the forge MR
# (tools/migration-pr.sh) is a deterministic post-step, NOT an LLM tool, so
# AgentKit gains visibility, not git/network reach. A2's "delete neither"
# rule was superseded by the 2026-08-26 roster close (see STATUS below).
tools:
  - id: bash-read-only       # cat/grep upgrades/<svc>.yml, _template.yml, migration.schema.json, state/manifest.yml
  # GET only. No write plane: this agent has never been measured POSTing, so
  # the 2026-08-28 grandfather granted it nothing (wing-write-grants.json).
  - id: mcp-wing-read
  - id: migration-file-write # NEW (A2) — write the migration YAML + bump default.config.yml (gated)

multiagent:
  type: solo
  max_concurrent_threads: 1

outcomes:
  rubric_path: rubric.md
  max_iterations: 3

audit:
  capability_scopes:
    - mcp.tool_use
    - wing.read
    - wing.write
    - events.write
    - nos.migration.write
    - audit.read
  pii_classification: none

vault:
  required_credentials:
    - scope: anthropic-api
    - scope: mcp-wing

metadata:
  ait_phase: A2
  ceremony_role: migration-authoring
  runtime: agentkit            # native AgentKit (Q8/A2); flat CLI fallback removed 2026-08-26
  runner_status: parked
  plan_ref: docs/archive/agentic-upgrade-migration-coexistence.md
  deferred_reason: >-
    Parked 2026-08-26 (roster close): the Q8/A2 native run path is proven
    but dormant; launcher, flat profile, pulse job and Wing bearer removed.
    The agentic upgrade→migration→coexistence epic un-parks it.

exit_code_semantics:
  emits_sentinel: true
  exit_0: "Nothing to author — no merged recipe gap, or the migration record already exists / is already merged-backed. The trigger layer skips the MR post-step (no path_written migration file)."
  exit_1: "Authored a migration record + version bump (via migration-file-write). The trigger layer then runs tools/migration-pr.sh --open-pr as a deterministic post-step → local-forge MR pending operator review (GATE 2). Operator-review, not a failure. Fires a HIGH A9 notification."
  exit_2: "Environment / auth / Wing error inside the AgentKit Runner (or the migration-pr.sh post-step exit 2 — forge unavailable). Fires a CRITICAL A9 notification."
# ── Article 30 ────────────────────────────────────────────────────────────────
gdpr:
  purpose: |
    Promotes a reviewed upgrade recipe into the committed codebase change.
    Estate maintenance (legitimate interest, Art. 6(1)(f)). Authoring a real
    code change sends repository source, and the resulting branch carries
    commit metadata.
  legal_basis: legitimate_interests
  data_categories:
    - repository_source
    - commit_metadata             # author + message on the branch it opens
  data_subjects:
    - operators
    - commit_authors
  retention_days: -1
  processors:
    - name: "Anthropic, PBC"
      role: "LLM inference for the ceremony's reasoning (claude CLI, --print)"
      country: "US"
      safeguard: "None claimed. Assess SCCs / Art. 46 before this is relied on."
  eu_residency: false
  transfers_outside_eu: true
