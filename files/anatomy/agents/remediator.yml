# =============================================================================
# remediator.yml — nOS Remediator agent profile (Anatomy A9.3, 2026-05-17)
#
# Sister agent to conductor.yml. Where conductor verifies platform health
# end-to-end, the remediator triages OPEN SECURITY FINDINGS — reads them,
# fetches file context, proposes ONE specific remediation per finding,
# emits a markdown report event + summary notification. NEVER auto-resolves
# findings; operator decides what to apply.
#
# Read by pulse-run-agent.sh (env NOS_AGENT_PROFILE=this file).
# AgentKit (A14) counterpart lives at files/anatomy/agents/remediator/.
# =============================================================================

name: remediator
version: 0.1.0
description: |
  Security-finding triage agent. Reads gitleaks_findings + remediation_items
  from Wing, fetches surrounding file context via bash-read-only, produces
  one remediation proposal per finding. NEVER auto-resolves. Notifies the
  operator via A9 fanout with severity = max severity analyzed.

# ── System prompt ─────────────────────────────────────────────────────────────
# Injected by pulse-run-agent.sh via claude --system-prompt.
# Mirrors the AgentKit-side system.md but trimmed for the Pulse runner's
# claude-CLI invocation (no MCP toolbelt; direct REST + bash-read-only).
system_prompt: |
  You are the nOS Remediator — the security-finding triage agent. You run
  under the Authentik identity `agent:remediator`. Every action you take
  is audited via Wing events tagged with $NOS_RUN_ID.

  ## Available APIs
  - Wing API: $WING_API_URL (Bearer: $WING_API_TOKEN)
    - GET  /api/v1/gitleaks_findings?open_only=1  — open findings list
    - GET  /api/v1/gitleaks_findings/{id}          — single finding detail
    - GET  /api/v1/events?source=remediator        — my prior runs
    - POST /api/v1/events                          — write the report
  - Bone API: http://127.0.0.1:8099 (no token; runner provides HMAC)
    - GET  /api/health                             — liveness probe

  ## Rules
  1. READ-ONLY. Never POST any HTTP method against Wing/Bone except the
     final /api/v1/events report write. Never modify repo files.
     Never call /api/v1/gitleaks_findings/{id}/resolve — the operator does
     that from Wing /inbox.
  2. Cite evidence. Every claim in your report must reference the tool
     call (bash command or Wing API call) that produced it.
  3. One remediation per finding. No vague suggestions ("rotate the
     key" without specifying how). Be concrete: file path, line number,
     suggested replacement snippet, verb-noun operator action.
  4. End your response with a markdown section "## Remediation report"
     with sub-sections "Summary", "Per-finding analysis", "Recommendations".
     The runner reads the title + body into the A9 notification.
  5. Exit 0 if all findings analyzed cleanly.
     Exit 1 if findings require operator review (default for non-empty list).

# ── Notification routing (Anatomy A9.5) ───────────────────────────────────────
# Bone resolves channels by looking up `origin_agent: remediator` against
# this block via the wing-base aggregator. Remediator's findings ARE the
# notification — critical/high page the operator, medium goes inbox.
notification:
  on_critical: [wing-inbox, ntfy, mail]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []

# ── Capability scopes ─────────────────────────────────────────────────────────
# Matches authentik_agent_clients[nos-remediator].capabilities in
# default.config.yml. Read-only across state + security; NO write scope
# (no nos:security:write — that would let it auto-resolve findings).
capabilities:
  - nos:state:read
  - nos:security:read
  - nos:migrations:read
  - nos:upgrades:read
  - nos:patches:read

# ── Pulse job — on-demand only (no schedule) ──────────────────────────────────
# The remediator runs WHEN the operator triggers it (tools/run-remediator.sh)
# or when a webhook fires (A14.5 — auto-fan-out from notification events).
# No default cron — security triage on a fixed schedule isn't useful;
# triage should happen RIGHT AFTER gitleaks emits findings, not 24h later.
#
# We still register a Pulse row (paused=1) so the operator can resume it
# from Wing UI without re-running the playbook, and so the env_json is
# centrally available for tools/run-remediator.sh to look up.
pulse:
  jobs:
    - name: triage-open-findings
      runner: subprocess
      command: "{{ playbook_dir }}/files/anatomy/scripts/pulse-run-agent.sh"
      schedule: "0 5 * * 0"                # placeholder — paused by default
      jitter_min: 5
      max_runtime_s: 300
      max_concurrent: 1
      paused: true                         # operator manually triggers
      paused_reason: "remediator is on-demand; tools/run-remediator.sh fires it"
      env:
        NOS_AUTHENTIK_URL: "https://{{ authentik_domain }}"
        NOS_AGENT_NAME: "remediator"
        NOS_AGENT_CLIENT_ID: "nos-remediator"
        NOS_AGENT_CLIENT_SECRET: "{{ global_password_prefix }}_pw_agent_remediator"
        NOS_AGENT_PROFILE: "{{ playbook_dir }}/files/anatomy/agents/remediator.yml"
        NOS_AGENT_TASK: |
          Triage every open gitleaks finding:
          1. GET /api/v1/gitleaks_findings?open_only=1 from Wing — list.
          2. For each finding, fetch the file (4 lines context above + below
             line_start) via the cat verb of bash-read-only.
          3. Propose ONE concrete remediation per finding (file:line +
             suggested fix snippet + operator action verb-noun).
          4. POST your markdown "## Remediation report" body via
             /api/v1/events type=conductor_report with source=remediator.
          Exit 0 if zero open findings. Exit 1 if any findings need
          operator review (default for non-empty list).
        WING_API_URL: "http://127.0.0.1:9000"
        # NOTE: discover-pulse-catalog.py is a dumb substring substituter, not
        # a Jinja engine — it can't expand `| default(...)` chains. Use a
        # bare {{ var }} for which the substitution table carries an entry.
        # remediator_wing_api_token is declared in default.credentials.yml.
        WING_API_TOKEN: "{{ remediator_wing_api_token }}"
        WING_EVENTS_HMAC_SECRET: "{{ bone_secret }}"
