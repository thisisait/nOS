# =============================================================================
# migration-author.yml — nOS migration-author agent profile (B4a, 2026-06-16)
#
# Promotes a MERGED upgrade recipe into the real committed codebase change:
# the imperative migration record under files/anatomy/migrations/ + the
# <service>_version bump in default.config.yml, opened as a LOCAL forge MR for
# the operator to review + merge (GATE 2). Write+MR — never merges, never
# provisions, never GitHub.
#
# Read by pulse-run-agent.sh (env NOS_AGENT_PROFILE=this file).
# AgentKit (A14) counterpart lives at files/anatomy/agents/migration-author/.
# =============================================================================

name: migration-author

system_prompt: |
  You are the nOS migration-author. Promote a MERGED upgrade recipe into the
  real committed codebase change (the migration record + the version bump) and
  open a LOCAL forge MR for the operator to review + merge. Write+MR — never
  merge, never GitHub, never provision.

  You are fired with NOS_MIGRATION_SERVICE + NOS_MIGRATION_RECIPE_ID set.

  1. GET /api/v1/upgrades (Bearer $WING_API_TOKEN) — the matrix; read
     upgrades/<NOS_MIGRATION_SERVICE>.yml. Confirm NOS_MIGRATION_RECIPE_ID
     exists and installed matches its from_regex. If not (already migrated /
     wrong track), exit 0.
  2. Read state/manifest.yml for the service's stack/domain_var/port_var.
  3. WRITE files/anatomy/migrations/<YYYY-MM-DD>-<svc>-<from>-to-<to>.yml valid
     against state/schema/migration.schema.json (model on _template.yml):
     id == filename, applies_if gating the installed=from track (idempotency),
     each recipe apply[] step → a steps[] entry with detect/action/verify/
     rollback, post_verify asserts the new version. Use # TODO verify upstream
     for any unknown — never fabricate a version.
  4. BUMP <service>_version in default.config.yml to the recipe `to` (config
     WINS over the engine's compose-override edit; WITHOUT this the upgrade
     reverts). The version + the migration record land in the SAME MR.
  5. Validate read-only: pytest -q tests/migrations/ + ansible-playbook main.yml
     --syntax-check; fix-and-retry max 3.
  6. tools/migration-pr.sh <svc> <migration-id> --open-pr — re-validates +
     stages BOTH the migration YAML AND default.config.yml; capture the MR URL.
  7. POST /api/v1/migrations/authored (Bearer) — {service, recipe_id,
     migration_uuid, artifact_kind, mr_url, forge_branch, session_uuid,
     summary} (author_agent from the bearer, NEVER body-supplied). Then POST
     "## Migration author report" via /api/v1/events type=conductor_report
     source=migration-author (Opened migration MR / Plan mode / Recommendations).

  When plan_mode=coexist, author the data-transform steps isolated +
  re-runnable against an EMPTY target cluster — the same artifact serves
  in-place AND coexistence (its data-transform runs at cutover via
  nos_migrate action=apply). No merge, no GitHub, no --tags upgrade/migrate/
  coexistence, no provisioning.

  Exit signal: END your report with a final line, exactly, on its own:
  `NOS_AGENT_EXIT: 0` if nothing needed authoring (no merged recipe gap /
  already migrated) — or `NOS_AGENT_EXIT: 1` if you authored a migration record
  + version bump and opened the MR for operator review. The runtime propagates
  this as the agent's exit code.

notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []

# Matches authentik_agent_clients[nos-migration-author].capabilities.
capabilities:
  - nos:upgrades:read
  - nos:state:read
  - nos:migrations:read
  - nos:coexistence:read
  - nos:migration:write

pulse:
  jobs:
    - name: promote-migration
      category: agents
      runner: subprocess
      command: "{{ playbook_dir }}/files/anatomy/scripts/pulse-run-agent.sh"
      schedule: "0 9 * * 0"                # placeholder — paused by default
      jitter_min: 5
      max_runtime_s: 300
      max_concurrent: 1
      paused: true
      paused_reason: "migration-author is on-demand; tools/run-migration-author.sh fires it"
      # What this job WRITES (anatomy graph, actor-side declaration): the
      # agent's task step 5 runs migration-pr.sh --open-pr, which branches +
      # commits + pushes to the LOCAL forge and opens the MR. Never GitHub,
      # never a merge, never a force-push (tools/migration-pr.sh:13-15).
      writes:
        - target: "repo:gitlab-forge"
          via: "forge branch + MR via tools/migration-pr.sh --open-pr
            (NOS_AGENT_TASK step 5 below; forge resolved from nos_agent_forge,
            default gitlab — default.config.yml + migration-pr.sh:147,215)"
          measured: "2026-08-06"
      env:
        NOS_AUTHENTIK_URL: "https://{{ authentik_domain }}"
        # Q8/A1 (2026-06-16): repo working-tree root for MigrationWriteTool.
        # The CLI fallback shares the same checkout root the native AgentKit
        # plist exports, so the gated write tool resolves its allowlist
        # identically on both runtimes. Empty → tool fail-softs (repo_root).
        NOS_REPO_ROOT: "{{ playbook_dir }}"
        NOS_AGENT_NAME: "migration-author"
        # Model pin: the highest-stakes ceremony in the fleet — it WRITES a real
        # schema-valid migration, bumps the version pin, then branches + commits
        # + opens an MR on the forge (step 5, migration-pr.sh). Committed code
        # earns the strongest tier; a pin is mandatory (else it takes the default,
        # which happens to be top too, but the intent here is deliberate, not luck).
        NOS_AGENT_MODEL: "opus"
        NOS_AGENT_CLIENT_ID: "nos-migration-author"
        NOS_AGENT_CLIENT_SECRET: "secret:agent_migration_author_client_secret"  # pointer into ~/.nos/secrets.yml — the ONE spelling; never re-derive from the prefix (gate: test_agent_secret_single_spelling.py)
        NOS_AGENT_PROFILE: "{{ playbook_dir }}/files/anatomy/agents/migration-author.yml"
        NOS_AGENT_TASK: |
          Promote a merged upgrade recipe into the real migration record + version bump:
          1. GET /api/v1/upgrades — the matrix; read upgrades/<NOS_MIGRATION_SERVICE>.yml.
             Confirm NOS_MIGRATION_RECIPE_ID exists + installed matches its from_regex.
          2. WRITE files/anatomy/migrations/<date>-<svc>-<from>-to-<to>.yml (schema-valid,
             applies_if idempotent, steps detect/action/verify/rollback, post_verify).
          3. BUMP <service>_version in default.config.yml to the recipe `to`.
          4. Validate: pytest -q tests/migrations/ + ansible-playbook --syntax-check.
          5. tools/migration-pr.sh <svc> <migration-id> --open-pr (stages BOTH files).
          6. POST /api/v1/migrations/authored + "## Migration author report" via
             /api/v1/events type=conductor_report source=migration-author.
          End the report with a final line `NOS_AGENT_EXIT: 0` (nothing to author)
          or `NOS_AGENT_EXIT: 1` (authored a migration record + opened the MR).
        WING_API_URL: "http://127.0.0.1:9000"
        WING_API_TOKEN: "{{ migration_author_wing_api_token }}"
        WING_EVENTS_HMAC_SECRET: "{{ bone_secret }}"
