# Event types: the one list every event whitelist in nOS is held to.
# Two writers keep a copy each (Bone in Python, Wing in PHP, separate runtimes);
# the gate holds BOTH to this file, so neither can drift and both cannot drift
# together. Add a type here first; the gate names the side that lags.
---
contract_version: 1
gate: tests/anatomy/test_event_types_match_the_contract.py
mirrors:
  bone: files/anatomy/bone/events.py                        # VALID_TYPES
  wing: files/anatomy/wing/app/Model/EventRepository.php    # EventRepository::VALID_TYPES
subsets:
  ansible: state/schema/event.schema.json                   # properties.type.enum
types:
  - admin_emergency_halt
  - admin_emergency_resume
  - agent_approval_decision
  - agent_approval_request
