# thalamus <-> shell joint: what crosses ~/.nos/thalamus.sock.
# Protocol: ssot/doctrine/cross-repo-contracts.md §1 (spec + fixture + gates
# over the same bytes). Both sides link one Rust crate (nos-contract), so the
# gate is the crate decoding the fixture; one copy only, both sides cite this.
contract_version: 6   # 6: dashboard (+ saved); 3: table_results name/query/matched/total, markdown, table, list, record, chart; 4: tree, timeline, graph, form, choice, delta, sequence; 5: row_diff_approval op/title/read_from
fixture: files/anatomy/contracts/thalamus-shell.fixture.json

producer:
  organ: thalamus
  code:
    - files/anatomy/thalamus/contract/src/wire.rs        # ToThalamus, ToShell, decode_*
    - files/anatomy/thalamus/contract/src/renderers.rs   # the closed component vocabulary
consumer:
  organ: thalamus   # the shell is the same binary's default mode
  code:
    - files/anatomy/thalamus/contract/examples/wire_fixture.rs
    - files/anatomy/pupil/src-tauri/src/bridge.rs        # the pupil (desktop window) decodes with the same crate
    - files/anatomy/pupil/src/fixture.test.ts            # and draws every fixture component
  # Not built: the face would read the person's iris-dashboards rows from KEAP, not this wire.
  future: [face]
gates:
  both: tests/anatomy/test_thalamus_shell_contract.py   # decodes, re-encodes and refuses the fixture
  pupil: tests/anatomy/test_pupil_renders_the_fixture.py

# ── 1. The wire ─────────────────────────────────────────────────────────────
wire:
  framing: "newline-delimited JSON, one message per line, UTF-8"
  tag: "every message is an object whose `t` names its variant (snake_case)"
  to_thalamus: [turn, approval_decision, control, widget, form_submit, choice_reply, dashboard_save, dashboard_list]
  to_shell: [session, text, render, approval_request, refused, activity, widget, form_result, table_changed, dashboards,
             dashboard_saved]
  widget: >-
    A widget is a spec the person placed; the pupil re-runs it over `widget {widget, spec, trigger}`
    and the thalamus answers as that person, without the model, with `widget {session, widget,
    component}` (table_results, a chart that may have no points yet, or a form) or `refused
    {reason, widget}`. `widget` is the pupil's token [A-Za-z0-9_-]{1,64}, echoed, never a thalamus
    id. spec is exactly one of {rows: query_rows arguments}, {chart: {query {table, q?, where?},
    chart bar|line|pie, x column, y? number column, op count|sum|avg}} (aggregated by the thalamus:
    category x largest first, 59 and "other" past 60; date x by UTC day, the last 60; number x
    ascending, the 60 smallest), {form: {table, columns?, prefill? {key: value}, when? {key: {key, op
    eq|neq, value}}}} (prefill and when are checked as the form's submit is, and copied onto the form
    it answers). trigger: click|restore|table_changed,
    recorded with the spec in the ledger. A widget's rows never let the model propose an edit.
  pin: >-
    `render {session, component, pin?}`: `pin` is the widget spec (as above, and checked as a widget
    message's spec is: a table, and y for sum or avg) the person may place from that render with
    one click; only the thalamus sets it. A query_rows table carries {rows: its arguments}; a show
    chart carries {chart: ...} only when the model named its source and the thalamus drew KEAP's
    aggregate in place of the model's numbers. The model never adds a widget; the person's click
    does, and the pupil stores the spec, never the rows. The terminal says "(pinnable in the pupil)".
  form_submit: >-
    `form_submit {form, widget, values}` submits a widget form the thalamus sent on this connection
    (form a uuid, widget its token, values {key: string|number|bool}). The submit is the person's
    decision: the thalamus checks every value against that form's fields (only its keys, at most 20,
    required ones present, text <= 4000 chars, a select one of its options, a date YYYY-MM-DD stored as
    epoch seconds at UTC midnight), records request + decision + result under tool form_submit with
    the peer {pid, exe}, and commit() inserts the row (KEAP mints its id). It answers `form_result
    {session, widget, form, row}` or `refused {reason, widget}`; the model is not told.
  choice_reply: >-
    `choice_reply {session, choice, picked[]}` answers a choice the thalamus rendered in this session
    (choice the uuid it minted, picked the option labels, at most 6). The thalamus checks it against
    the choice it stored: an unknown or closed id, a label not offered, more than one pick without
    multi, or no pick is refused (said to the person, recorded in the ledger); so is a reply while an
    approval waits. A valid reply closes the choice, is recorded under tool choice_reply before
    anything is sent, and reaches the model as data: "[thalamus] choice <id>: picked <labels>", plus
    "the suggestion (<labels>) was kept untouched" when the picks are the suggestion, which is not
    agreement. Then the model's next turn runs. A reply never mints an approval, a form, a widget or a
    write; a picked label is only a label.
  table_changed: >-
    `table_changed {session, table, row}` follows every write this connection approved (an insert
    from a form or an approved row edit), so the pupil re-runs the widgets that read that table.
  dashboard_save: >-
    `dashboard_save {dashboard {slug, name, lens[], widgets[{title, spec}]}}` is the person's click on
    "Place on a new tab": slug is the pupil's new tab id ([A-Za-z0-9_-]{1,64}), the rest is the offer as
    placed (components.dashboard caps, no dropped). It names no owner; a message that does is refused.
    The thalamus refuses a slug the person already saved, else records request + decision + result under
    tool dashboard_save with the peer and commit() inserts a row of KEAP's iris-dashboards
    (state/keap-tables/iris-dashboards.table.yml) as the person, owner "user:<uid>". It answers
    `dashboard_saved {session, slug, row}` or `refused {reason}`; the model is not told.
  dashboard_list: >-
    `dashboard_list {}` asks for the person's saved dashboards; the thalamus reads iris-dashboards as
    them and answers `dashboards {session, dashboards[] <=12, left_out[{title, why}]}` with only the rows
    whose owner is them (KEAP isolates no rows yet: the filter is the thalamus's); a row that does not
    decode or check is left out with why, never dropped. An unreadable table is `refused`, never an
    empty list. The pupil adds each one its own file lacks as a tab (the file keeps what this Mac
    changed); refused, it keeps its file. Nothing runs until the tab is shown.
  phase: [thinking, tool, writing, idle]   # activity.phase; tool is {tool: {name}}
  decision: [approve, reject]
  control_view: [inbox, approvals, red_status]
  uid: >-
    The actor is "user:<uid>", the uid of face-wing.yml §1 (nos_contract::uid),
    pinned by the thalamus from the peer's login and the receptor's identity
    map. The shell never names the actor; a message that does is refused.

# ── 2. The component vocabulary (the shell renders these and nothing else) ──
components:
  kind: "a component is {kind, props}; props are typed and closed (unknown fields refused)"
  vocabulary:
    table_results: "rows of one DataTable: {table, name, query, matched, total, columns[], rows[{__id, cells{}}], projected}; total: rows readable, matched: after the query"
    row_diff_approval: >-
      one row's proposed write, cell by cell: {table, title, op insert|update|insert_many, row_id?, cells[{key, old, new}] >=1,
      read_from[]?, lines?}; an update names its row, an insert names none and every old is null; read_from names the tools whose
      free text the model read that turn, and the card head says "contains text from" them. insert_many (v6) is a parent and
      its line items under ONE approval: the parent is new (no row_id, olds null) or an existing row shown unchanged (row_id,
      each old == new, never written); lines {table, title, ref_key, rows[[{key, old null, new}]] 1-20, each >=1 cell, never
      ref_key} are written after the parent in order, each with ref_key = the parent's id; both shells show every line. Only
      insert_many carries lines. A write that stops part-way is said with the rows written before it, never silently
    inbox_list: "waiting captures and promotions: {items[{id, title, source, created_at}], refused[]}"
    approvals_list: "tools/awaiting-operator.py --json: {items[{kind, severity, age, what, where, note?}], unknown[]}"
    red_status: "tools/red-status.py --json: {red_count, reds[], hold_count, holds[]}"
    markdown: "model text as markdown, drawn as text nodes (headings 1-3, paragraphs, lists, code fences; links as text): {text}, at most 8000 chars"
    table: "rows the model shows (show tool): {title?, columns[], rows[][]}; at most 12 columns, 50 rows, every row as long as columns, a cell 2000 chars"
    list: "items the model shows (show tool): {title?, ordered, items[{text, detail?, tone? ok|info|warn|bad, delta?}]}; at most 50 items, text 500, detail 2000"
    record: "one thing's fields (show tool): {title?, fields[{key, value, delta?, was?}]}; at most 40 fields, a value (and was) 4000 chars as text; was only on a changed field; titles and names 120"
    chart: >-
      values plotted (show tool): {title?, chart bar|stacked_bar|line|area|scatter|pie, x category|number|time,
      series[{name, points[[x, number]]}]}; x is a string on every axis (a number parses as one, a time is
      YYYY-MM-DD[THH:MM:SS(Z|+HH:MM)]); at most 6 series, 60 points each, 60 x labels; line, area and stacked_bar
      series share the same x; scatter is number or time x; pie is 1 series of values >= 0
    # delta added|removed|changed marks what an action would change (iris-genui-change-markers). A child of an
    # added or removed node is that too: check() refuses a child that says otherwise. Both shells say the mark
    # as text (+ - ~), never as colour only; the pupil adds a "+N −M ~K" row and a Před / Změny / Po switch.
    tree: "a hierarchy (show tool): {title?, nodes[{label, note?, delta?, children[]}]}; depth at most 4, at most 100 nodes; one root with 2-4 children is an org chart, otherwise a nested list"
    timeline: >-
      a history (show tool): {title?, items[{when, title, note?, hi?, until?, lane?}]}; at most 30; when every
      when is a date (YYYY-MM-DD[THH:MM:SS(Z|+HH:MM)]) it is drawn on a time axis: spans when -> until (until not
      before when), instants as dots, one row per lane (at most 40 chars), zoomable; otherwise in order,
      horizontal up to 6 items, vertical beyond; hi is said as a word
    graph: >-
      things and the links between them (show tool): {title?, nodes[{id, label, note?, tone? ok|info|warn|bad}],
      edges[{from, to, label?, dashed?}]}; at most 60 nodes and 120 edges; ids [A-Za-z0-9_-]{1,64}, unique, and
      every edge names two of them; drawn as layered columns (face graphLayered.ts), zoomable; the terminal says
      every node and edge as text
    sequence: >-
      who sends what to whom, in order (show tool): {title?, participants[], steps[{from, to, text, dashed?} |
      {note, over[]} | {phase}]}; 2-8 participants, unique, at most 40 chars; at most 40 steps; a message text at
      most 120 (from may equal to), a note at most 200 over 1-2 participants, a phase at most 60; from, to and over
      name participants exactly. The pupil draws SVG lifelines (pupil/src/sequence/layout.ts widens a gap until its
      labels fit), solid arrows, dashed replies, every word a text node; the terminal says "A -> B: text" (dashed
      "A --> B"), notes and phases as indented lines
    choice: >-
      a question Iris asks at a fork that changes what she does next (show tool): {id?, question, options[{label,
      note?}], suggested[], multi}; question at most 15 words and 120 chars, 2-6 options, labels at most 60 chars
      and unique (case and spaces aside), a note at most 200, suggested names options: exactly 1, or 1 or more
      when multi. The model sends no id: the thalamus mints a uuid and a render carries it (a render without one
      is refused), and an approval_request never carries a choice. The pupil draws native radios (checkboxes
      when multi) with the suggestion preselected and marked "navrženo", and sends choice_reply once on
      "Odpovědět"; the terminal numbers the options and answers with /choose 2 (or 1,3)
    # Crosses the wire only inside a `widget` message: a render or approval_request carrying one is
    # refused (wire.rs not_a_form).
    form: >-
      a widget form serve builds from the table's live schema (form_from_schema), never the model:
      {form uuid, table, title (the KEAP table's), fields[{key, label, kind text|number|date|select|bool,
      required, options?, min?, max?, placeholder?, when? {key, op eq|neq, value}}], omitted[{key, kind}],
      prefill? {key: value}}; at most 20 fields, keys unique, never empty or __-prefixed, a select has 1-50
      options, min <= max; `when` names another field and never sits on a required one (the pupil hides the
      field while it fails and sends no value for it); prefill names fields only and is where the person's
      draft starts, never a value sent (KEAP's column def has no min/max, so serve sets none); a rowRef column is a select of
      the parent rows' refDisplay labels (1-50, unique; else text, the parent's id) and the submit writes the picked row's id; the pupil draws its own header
      "Adds a row to <title> (<table>)" and button "Add row"; the terminal says the fields and
      "fill it in the pupil"
    # Rendered only (wire.rs: never in an approval, never as a widget's answer); nothing runs at offer.
    dashboard: >-
      a tab of widgets Iris offers (offer_dashboard): {name, lens[{column, op eq|neq|lt|gt|contains, value,
      kind?, options?}] <=4, widgets[{title, spec}] 1-8, dropped[{title, why}]}; name 1-40 chars, a spec is a
      WidgetSpec of wire.widget and passes check_spec, an empty lens value is unset; kind and options are the
      column's, for the person's lens input. serve validated each widget against the live schema as the person
      (no row read) and moved the ones that failed to dropped with why, always present. The pupil draws it
      with "Place on a new tab": the click makes a tab with that lens and runs each widget once (trigger
      click); the lens joins every rows and chart widget's where at send time, a form takes its eq values
      as prefill; the terminal says it and "place it in the pupil"

# ── 3. The three invariants (ssot/doctrine/cross-repo-contracts.md §4) ──────
invariants:
  identity: >-
    `session` and `approval` are lowercase hyphenated uuids, minted by the
    thalamus; `actor` is "user:<canonical uid>". A message with any other
    shape is refused, so one person's turn can never be filed under a guess.
  visibility: >-
    A line the shell cannot decode (unknown `t`, unknown component kind,
    unknown field, a component over its caps: renderers.rs Component::check)
    becomes a `refused` message naming why. It is shown,
    never dropped: a component that silently fails to render is worse than
    one that errors. `projected: false` on table_results says the search was
    substring, not semantic. A source the person may not read (inbox
    `refused`, approvals `unknown`) is listed as such, never as empty.
  removal: >-
    The fixture holds one sample of every variant and every component. A
    variant or component leaving the enum fails to decode its sample and the
    gate goes red; removing one is a contract_version bump with the fixture
    in the same change.

open:
  - >-
    Since v4 the model chooses a renderer through the `show` tool, for table,
    list, record, chart, tree, timeline, graph, sequence and choice (plain text already draws as markdown); table_results,
    row_diff_approval and the
    control views stay chosen by their tool or control, and an approval is
    minted by propose_row_edit, or by a widget form the person submits
    (wire.form_submit). The model has no form: a form is a widget the person
    made, and a widget runs without the model (wire.widget). A choice asks; its
    answer is data for the model, never an approval (wire.choice_reply). Since v6 offer_dashboard
    offers a tab of widgets (components.dashboard); only the person's click places it and runs it.
