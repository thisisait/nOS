# thalamus <-> shell joint: what crosses ~/.nos/thalamus.sock.
# Protocol: ssot/doctrine/cross-repo-contracts.md §1 (spec + fixture + gates
# over the same bytes). Both sides link one Rust crate (nos-contract), so the
# gate is the crate decoding the fixture; one copy only, both sides cite this.
contract_version: 15   # 15: setting, state settings; 14: halt, lift_halt, state act; 13: state (both ways); 12: callout, steps, sources, follow_up; 11: dendrogram; 10: knowledge_tree, widget spec knowledge; 9: resume workspace, clear, branch, stop, model_state; 8: catalogue (both ways), limbs, act, acted, action_approval; 7: resume, workspace_load, workspace_save, workspace, said, replay; 6: dashboard, kpi, working_for, model_options, model_pick; 3: table_results name/query/matched/total, markdown, table, list, record, chart; 4: tree, timeline, graph, form, choice, delta, sequence; 5: row_diff_approval op/title/read_from
fixture: files/anatomy/contracts/thalamus-shell.fixture.json

producer:
  organ: thalamus
  code:
    - files/anatomy/thalamus/contract/src/wire.rs        # ToThalamus, ToShell, decode_*
    - files/anatomy/thalamus/contract/src/renderers.rs   # the closed component vocabulary
consumer:
  organ: thalamus   # the shell is the same binary's default mode
  code:
    - files/anatomy/thalamus/contract/examples/wire_fixture.rs
    - files/anatomy/pupil/src-tauri/src/bridge.rs        # the pupil (desktop window) decodes with the same crate
    - files/anatomy/face/src/lib/iris/fixture.test.ts     # and draws every fixture component
gates:
  both: tests/anatomy/test_thalamus_shell_contract.py   # decodes, re-encodes and refuses the fixture
  pupil: tests/anatomy/test_pupil_renders_the_fixture.py

# ── 1. The wire ─────────────────────────────────────────────────────────────
wire:
  framing: "newline-delimited JSON, one message per line, UTF-8"
  tag: "every message is an object whose `t` names its variant (snake_case)"
  to_thalamus: [turn, approval_decision, control, widget, form_submit, choice_reply, working_for, model_options, model_pick, resume, workspace_load, workspace_save, catalogue, limbs, acted, clear, branch, stop, state, halt, lift_halt, setting]
  to_shell: [session, text, render, approval_request, refused, activity, widget, form_result, table_changed, working_for, model_options, said, replay, workspace, catalogue, act, model_state, state]
  widget: >-
    A widget is a spec the person placed; the pupil re-runs it over `widget {widget, spec, trigger}`
    and the thalamus answers as that person, without the model, with `widget {session, widget,
    component}` (table_results, a chart that may have no points yet, a form or a kpi) or `refused
    {reason, widget}`. `widget` is the pupil's token [A-Za-z0-9_-]{1,64}, echoed, never a thalamus
    id. spec is exactly one of {rows: query_rows arguments}, {chart: {query {table, q?, where?},
    chart bar|line|pie, x column, y? number column, op count|sum|avg}} (aggregated by the thalamus:
    category x largest first, 59 and "other" past 60; date x by UTC day, the last 60; number x
    ascending, the 60 smallest), {form: {table, columns?, prefill? {key: value}, when? {key: {key, op
    eq|neq, value}}}} (prefill and when are checked as the form's submit is, and copied onto the form
    it answers), {kpi: {query {table, q?, where?}, op count|sum|avg, y? number column, unit?}} (one total
    over the query's rows by the thalamus, as query_rows with op and no group_by; an avg over no number is
    refused, never 0), {knowledge: {node}} (the tree around one taxonomy node, read by the thalamus as the
    person from KEAP's /api/taxonomy-metadata/<node> and /api/graph). trigger: click|restore|table_changed,
    recorded with the spec in the ledger. A widget's rows never let the model propose an edit.
  pin: >-
    `render {session, component, pin?}`: `pin` is the widget spec (as above, and checked as a widget
    message's spec is: a table, and y for sum or avg) the person may place from that render with
    one click; only the thalamus sets it. A query_rows table carries {rows: its arguments}; a show
    chart carries {chart: ...} only when the model named its source and the thalamus drew KEAP's
    aggregate in place of the model's numbers; a knowledge_tree render carries {knowledge: {node: its focus}}; a kpi render always carries {kpi: ...} (one without it, or
    with another spec, is refused: its number is the thalamus's). The model never adds a widget; the person's click
    does, and the pupil stores the spec, never the rows. The terminal says "(pinnable in the pupil)".
  form_submit: >-
    `form_submit {form, widget, values}` submits a widget form the thalamus sent on this connection
    (form a uuid, widget its token, values {key: string|number|bool}). The submit is the person's
    decision: the thalamus checks every value against that form's fields (only its keys, at most 20,
    required ones present, text <= 4000 chars, a select one of its options, a date YYYY-MM-DD stored as
    epoch seconds at UTC midnight), records request + decision + result under tool form_submit with
    the peer {pid, exe}, and commit() inserts the row (KEAP mints its id). It answers `form_result
    {session, widget, form, row}` or `refused {reason, widget}`; the model is not told.
  choice_reply: >-
    `choice_reply {session, choice, picked[]}` answers a choice the thalamus rendered in this session
    (choice the uuid it minted, picked the option labels, at most 6). The thalamus checks it against
    the choice it stored: an unknown or closed id, a label not offered, more than one pick without
    multi, or no pick is refused (said to the person, recorded in the ledger); so is a reply while an
    approval waits. A valid reply closes the choice, is recorded under tool choice_reply before
    anything is sent, and reaches the model as data: "[thalamus] choice <id>: picked <labels>", plus
    "the suggestion (<labels>) was kept untouched" when the picks are the suggestion, which is not
    agreement. Then the model's next turn runs. A reply never mints an approval, a form, a widget or a
    write; a picked label is only a label.
  table_changed: >-
    `table_changed {session, table, row}` follows every write this connection approved (an insert
    from a form or an approved row edit), so the pupil re-runs the widgets that read that table.
  working_for: >-
    `working_for {scope}` is the person saying whom they work for in this session (the septum, D2):
    scope is all (no wall, as before one is said), personal, or {client: <a party's id, slug or name>},
    which serve resolves against the party rows of role client as the person (unknown: refused, naming
    the clients). Every table read then honours that table's client_scope (state/keap-tables): a
    book_owner, self or rowRef walk keeps only that client's rows (personal: no client's) and the query
    says so; a personal table, a table Iris created for another client, or one no def declares is not
    shown and is said by name (list_tables, query_rows, widgets, dashboard offers, forms). A table Iris
    creates is that client's (the ledger keeps whom it was made for). serve answers `working_for
    {session, scope, name}` (scope resolved to the party id, name what both shells show on the turn
    and on every card), records it, forgets the rows shown before, and refuses a switch while an
    approval waits, so a card is always asked under the scope the shells show.
  model_options: >-
    `model_options` is the person asking which model Iris may use in this session (W5); serve answers
    `model_options {session, options, refused}`: one option {backend, model, processor,
    transfers_outside_eu, warning?, current} per row of iris's model.backends_allowed that is armed
    here and passes the binding gates and gdpr_posture (a non-EU row only under none), a local row once
    per model the host has pulled that passes the size floor (llm_cell_min_params_b refuses, below
    llm_cell_recommended_params_b `warning` says it runs badly); `refused` says each one left out and
    why. `current` marks the session's binding (at most one); a session opens on the host's iris_backend.
  model_pick: >-
    `model_pick {backend, model}` is the person choosing one of those options for this session: serve
    judges it again, refuses one not offered by its name and reason, records it (agent_session_rebind
    {from_model_uri, to_model_uri, by person, reason} plus backend, model, processor,
    transfers_outside_eu), rebinds the session from its next turn, whose first answered model request says the
    move once (naming who answered before; nothing if no turn was), and answers `model_options` with the pick current. A refused pick stays agent_tool_result tool:model.
  workspace: >-
    The person's workspace document is the thalamus's, per person (the peer's identity, never a field), in
    <data-dir>/people/<uid>/workspace.json (0600, written whole). `workspace_load` answers `workspace {doc}`,
    doc null when none is held; `workspace_save {doc}` replaces it with a JSON object of at most 512 KiB and
    answers nothing, or `refused`. Neither opens a session. The pupil keeps its own file as an offline cache
    and moves it up once, when the thalamus holds none.
  replay: >-
    `resume`, asked before anything else on a connection, opens the person's last session closed by its
    connection (connection_closed) again: the same `session` uuid (a second agent_session_start says
    resumed), then `replay {session, log, open}`: that session's chat oldest first (said, text,
    render, approval_request, refused; at most 200 lines), and `open` the approvals and choices still
    waiting, each decided or answered once, as before. `said {session, text}` is the person's own turn.
    With none to resume it opens a fresh one, with no replay; any other first message opens a fresh one too.
    A `turn` without `session` is the open session's (the shell has not heard it yet); one naming another is refused.
    Another person resumes and reads none of it.
  tabs: >-
    v9: each workspace tab of the shell is its own conversation (operator 2026-10-18). `resume {workspace}`
    (a tab id [A-Za-z0-9_-]{1,64}) opens that tab's session, held per person in <data-dir>/people/<uid>/
    sessions.json, its chat in conversation-<workspace>.json: resumed and replayed as above when it was closed by
    its connection or switched away from, else a fresh one; a session open on the connection ends `switched`
    first (it comes back with its own tab). `clear` (the shell's /clear) ends the open session `cleared` (never
    resumed; the ledger keeps it), forgets its tab's chat and opens a fresh session for the same tab. `branch
    {workspace}` (the shell's /branch, after it added that tab) opens a fresh session for it that starts from
    this one's conversation: the model hears it, the chat is copied and replayed, its ledger says {branched_from} and holds
    the last 40 said lines {role, text, copied: true} before the shell hears the session; the old one ends
    `switched`. A switch, clear or branch is refused while an approval or a choice waits ("answer or reject the
    card first"). The shell parses /clear and /branch; serve takes no commands. Without `workspace`, resume is v7's.
  stop: >-
    v9: `stop {session}` is the person ending the turn that runs in their open session. serve checks it before
    each model and tool call and every 200 ms of a model request (which is left to finish on its own): the calls
    not run are answered as stopped, the ledger keeps agent_message {role: thalamus, text: "Stopped."}, the shell
    gets `text` "Stopped." and the turn's idle. A stop between turns stops nothing and is answered with nothing.
  model_state: >-
    v9: `model_state {session, loaded}` says whether the session's local model is in memory (loaded: a model of
    Ollama's GET <origin>/api/ps, base_url <origin>/v1, is the binding's model id), asked when a session opens, at
    each turn's end and every 30 s of an idle connection, and said only when it changes. A remote binding, or a
    host that does not answer, is never said: the shell keeps what it had.
  retry: >-
    v9: a tool call that failed in this turn, asked again with the same name and arguments after the model heard
    the error, is not run again: the model hears {error, repeated: true, hint}; a second such repeat ends the
    turn with a text naming the error. A show chart whose source drew no points says why with numbers (rows
    matched, or none of them with a date or a number in x).
  catalogue: >-
    `catalogue` is the shell asking for the person's catalogue, so it can mark their input as they type
    (row iris-input-highlighting); serve answers `catalogue {session, tables[{id, title, columns[{key,
    label?, kind, options?}]}]}`: the tables the person may read under the scope, as the cortex plan
    sees them (a table the septum hides is not in it; at most 12 tables), each column's label and a
    select's options as KEAP holds them. Asked once, it is sent again after every working_for. It is
    data for the shell's marks, never a turn: no model reads it from the shell. Caps: 64 tables, 120
    columns each, 200 options a column; an id, key or kind is 1-200 chars.
  limbs: >-
    `limbs {limbs[{app, action, params{name: {type string|number|boolean|enum, values? (enum only, 1-50),
    required?}}, writes, says}]}` is the face saying what Iris may do on its screen (row face-limbs): app and
    action [a-z0-9_-]{1,64}, each (app, action) once, at most 64 limbs and 16 params each, says 1-200 chars.
    Stored per connection, never opening a session; a later limbs replaces it. Only a connection that
    declared limbs offers the model the tool face_act {app, action, params}: the pair must be declared and
    the params pass its spec (no unknown name, required present, a value of its type or one of its values),
    else the call is refused and recorded. writes false: serve sends `act {session, act, app, action,
    params}` (act a uuid serve minted, params strings, numbers or bools) and waits for the face's `acted
    {act, ok, result?, reason?}` (no answer in the reader timeout is a tool error the model hears); writes
    true: an action_approval card first, and only an approve sends the act. Every call is a tool_use and
    tool_result under face_act, capped by the turn's tool-call cap. The terminal declares none.
  state: >-
    v13: `state` is a listed person asking for the estate's runtime set-points (row medulla-settings); serve
    answers `state {halt, loops_paused, organs, settings}` (settings v15) without opening a session and writes nothing. halt and
    loops_paused are {on, since?, reason?, file}: on while the file exists (NOS_HALT_FILE, else ~/.nos/halt;
    NOS_LOOPS_PAUSED_FILE, else ~/.nos/loops-paused), since and reason as the file says them; organs are
    [{name, label, running}] for the host LaunchAgents or systemd user units. on and running are null when the
    source could not be read: UNKNOWN, never off. The same struct is `medulla state --json` and GET
    /api/v1/admin/state (thalamus/src/state.rs; gate files/anatomy/thalamus/medulla/tests/state.rs).
  halt: >-
    v14: `halt {reason?}` and `lift_halt` set the emergency halt (`resume` already names a session's resume).
    Only a tier-1 person (NOS_TIER1_GROUPS) at a listed decider executable (NOS_DECIDER_EXES; empty admits
    nobody here, and Linux none) sets it: serve writes the halt file whole ({"by","at","reason"?}, the shape
    tools/nos writes) or removes it, then sends Wing the act (POST /api/v1/admin/{halt,resume}, the wing-halt
    bearer from ~/.nos/secrets.yml) and answers `state` with `act {recorded, why?}`. The set-point holds
    whether or not Wing recorded it. Anyone else gets `refused` naming why, the file untouched. reason is one
    line of at most 300 chars. `medulla halt|resume` speaks it; gate files/anatomy/thalamus/medulla/tests/halt.rs.
  setting: >-
    v15: `setting {key, value}` changes one setting state/genome/settings.yml names (key dotted lowercase, at
    most 64 chars); the same tier-1 decider as the halt sets it. A map setting's value is the change, one
    entry each: {entry: {reason?}} sets it, {entry: null} removes it; serve stamps by (the kernel's person)
    and at, writes MEDULLA_DATA_DIR/estate/<key>.json whole (thalamus/src/settings.rs), sends Wing the change
    (POST /api/v1/admin/setting {by, key, change}, record-only, the wing-halt bearer) and answers `state` with
    `act`. A key the genome does not name, a bad change, or a store that does not read is `refused`, the store
    untouched. `state` carries `settings`: each estate setting the genome names by key, its default while no
    file holds one, null when its file does not read; the whole map null when the genome does not read.
    `medulla pause <job> [--reason …]|unpause <job>` speaks pulse.paused; gate files/anatomy/thalamus/medulla/tests/settings.rs.
  phase: [thinking, tool, writing, idle]   # activity.phase; tool is {tool: {name}}
  decision: [approve, reject]
  control_view: [inbox, approvals, red_status]
  uid: >-
    The actor is "user:<uid>", the uid of face-wing.yml §1 (nos_contract::uid),
    pinned by the thalamus from the peer's login and the receptor's identity
    map. The shell never names the actor; a message that does is refused.

# ── 2. The component vocabulary (the shell renders these and nothing else) ──
components:
  kind: "a component is {kind, props}; props are typed and closed (unknown fields refused)"
  vocabulary:
    table_results: "rows of one DataTable: {table, name, query, matched, total, columns[], rows[{__id, cells{}}], projected}; total: rows readable, matched: after the query"
    row_diff_approval: >-
      one row's proposed write, cell by cell: {table, title, op insert|update|insert_many|delete, row_id?, cells[{key, old, new}] >=1,
      read_from[]?, lines?, warning?}; an update names its row, an insert names none and every old is null; read_from names the tools whose
      free text the model read that turn, and the card head says "contains text from" them. insert_many (v6) is a parent and
      its line items under ONE approval: the parent is new (no row_id, olds null) or an existing row shown unchanged (row_id,
      each old == new, never written); lines {table, title, ref_key, rows[[{key, old null, new}]] 1-20, each >=1 cell, never
      ref_key} are written after the parent in order, each with ref_key = the parent's id; both shells show every line. Only
      insert_many carries lines. A delete (v6) names its row and shows every value it holds, each old -> null (old never
      null); both shells say delete in red, and serve re-reads the row and deletes nothing if it changed since the card.
      warning (v6, <=400) says the row is not the one the person named (each standalone number of their latest
      message naming one, unless written as a value, is a number in the row's title), or whose the row is when that is not
      whom the person works for (W4; both joined by "; "); both shells draw it in red
      first; never a refusal. A write that stops part-way is said with the rows written before it, never silently
    table_schema_approval: >-
      a new DataTable Iris proposes (propose_table_create, v6), asked only as an approval: {title 1-160, description?
      <=2000, visibility private, columns[{key, label, kind text|number|date|select|boolean|rowRef, required,
      options?, ref_table?, ref_title?, ref_display?}] 1-30}; keys snake_case ([a-z][a-z0-9_]*, <=64) and unique,
      labels 1-120, a select has 1-50 unique options and only a select has options, a rowRef names the table it
      points into (id, title, and the column a row is shown by) and only a rowRef does. visibility is private, the
      person the owner: sharing is a later step, never part of the create. Both shells show every column with its
      kind, options and required; on approve serve POSTs it as the person, reads it back and records the result
    column_add_approval: >-
      new columns for a DataTable the person queried or created this session (propose_column_add, v6), asked only as
      an approval: {table, title, existing[{key, label, kind}], columns[...as table_schema_approval] 1-30}; existing
      is the table's columns at the card, shown read-only; a new key is none of them, a new column is never required
      (its rows have no value), and the table holds at most 120. Both shells show the existing and the new columns;
      on approve serve re-reads the table, adds nothing if its columns moved, PATCHes the whole column list as the
      person (KEAP decides; a 403 is said), reads it back and records the result
    inbox_list: "waiting captures and promotions: {items[{id, title, source, created_at}], refused[]}"
    approvals_list: "tools/awaiting-operator.py --json: {items[{kind, severity, age, what, where, note?}], unknown[]}"
    red_status: "tools/red-status.py --json: {red_count, reds[], hold_count, holds[]}"
    markdown: "model text as markdown, drawn as text nodes (headings 1-3, paragraphs, lists, code fences; links as text): {text}, at most 8000 chars"
    table: "rows the model shows (show tool): {title?, columns[], rows[][]}; at most 12 columns, 50 rows, every row as long as columns, a cell 2000 chars"
    list: "items the model shows (show tool): {title?, ordered, items[{text, detail?, tone? ok|info|warn|bad, delta?}]}; at most 50 items, text 500, detail 2000"
    record: "one thing's fields (show tool): {title?, fields[{key, value, delta?, was?}]}; at most 40 fields, a value (and was) 4000 chars as text; was only on a changed field; titles and names 120"
    chart: >-
      values plotted (show tool): {title?, chart bar|stacked_bar|line|area|scatter|pie, x category|number|time,
      series[{name, points[[x, number]]}]}; x is a string on every axis (a number parses as one, a time is
      YYYY-MM-DD[THH:MM:SS(Z|+HH:MM)]); at most 6 series, 60 points each, 60 x labels; line, area and stacked_bar
      series share the same x; scatter is number or time x; pie is 1 series of values >= 0
    # delta added|removed|changed marks what an action would change (iris-genui-change-markers). A child of an
    # added or removed node is that too: check() refuses a child that says otherwise. Both shells say the mark
    # as text (+ - ~), never as colour only; the pupil adds a "+N −M ~K" row and a Před / Změny / Po switch.
    tree: "a hierarchy (show tool): {title?, nodes[{label, note?, delta?, children[]}]}; depth at most 4, at most 100 nodes; one root with 2-4 children is an org chart, otherwise a nested list"
    timeline: >-
      a history (show tool): {title?, items[{when, title, note?, hi?, until?, lane?}]}; at most 30; when every
      when is a date (YYYY-MM-DD[THH:MM:SS(Z|+HH:MM)]) it is drawn on a time axis: spans when -> until (until not
      before when), instants as dots, one row per lane (at most 40 chars), zoomable; otherwise in order,
      horizontal up to 6 items, vertical beyond; hi is said as a word
    graph: >-
      things and the links between them (show tool): {title?, nodes[{id, label, note?, tone? ok|info|warn|bad}],
      edges[{from, to, label?, dashed?}]}; at most 60 nodes and 120 edges; ids [A-Za-z0-9_-]{1,64}, unique, and
      every edge names two of them; drawn as layered columns (face graphLayered.ts), zoomable; the terminal says
      every node and edge as text
    sequence: >-
      who sends what to whom, in order (show tool): {title?, participants[], steps[{from, to, text, dashed?} |
      {note, over[]} | {phase}]}; 2-8 participants, unique, at most 40 chars; at most 40 steps; a message text at
      most 120 (from may equal to), a note at most 200 over 1-2 participants, a phase at most 60; from, to and over
      name participants exactly. The pupil draws SVG lifelines (face/src/lib/iris/sequence/layout.ts widens a gap until its
      labels fit), solid arrows, dashed replies, every word a text node; the terminal says "A -> B: text" (dashed
      "A --> B"), notes and phases as indented lines
    choice: >-
      a question Iris asks at a fork that changes what she does next (show tool): {id?, question, options[{label,
      note?}], suggested[], multi}; question at most 15 words and 120 chars, 2-6 options, labels at most 60 chars
      and unique (case and spaces aside), a note at most 200, suggested names options: exactly 1, or 1 or more
      when multi. The model sends no id: the thalamus mints a uuid and a render carries it (a render without one
      is refused), and an approval_request never carries a choice. The pupil draws native radios (checkboxes
      when multi) with the suggestion preselected and marked "navrženo", and sends choice_reply once on
      "Odpovědět"; the terminal numbers the options and answers with /choose 2 (or 1,3)
    # v12: four kinds whose names and prop shapes follow OpenUI's genui-lib (MIT; docs/systems/thalamus/genui-vocabulary.md).
    # The model fills them through show; none rides an approval or a widget, none carries a URL, a style or an action.
    callout: >-
      a note not to miss (show tool): {tone ok|info|warn|bad, title 1-120, text 1-2000}; both shells head it "Iris says"
      (drawn by the shell, never a prop: a marker field is refused) so it never reads as the thalamus's own warning, and say
      the tone as a word, warn and bad drawn as warnings; text only, links as text
    steps: >-
      a plan's steps in order (show tool): {title?, items[{title 1-120, status pending|active, detail? <=2000}] 1-20}; at most
      one active. Done and failed are verdicts, the thalamus's to say: refused from the model, and no serve-built steps card
      exists yet (ruling 2026-10-25)
    sources: >-
      the rows a claim came from (show tool): {title?, items[{table, row, name, note? <=200}] 1-20}; serve refuses an item
      that is not a row query_rows showed this person in this session, sets table to its id and name to its title (the
      model never sends name; a render without it is refused); a (table, row) once. No url, no file path
    follow_up: >-
      next prompts the person may send (show tool): {prompts[] 1-4, each 1-200 chars, unique case aside}; the pupil puts a
      clicked prompt in the composer and the person sends it as their own turn; the terminal lists them. Never an action
    knowledge_tree: >-
      the ontology around one node of our knowledge (read_node, or a knowledge widget; v10): {title?, focus, nodes[{id,
      name, parent?, child_count?, text?}], hidden}; ids [A-Za-z0-9._-]{1,128}, unique; focus names a node; a parent
      names a node of the tree (none: a top); at most 200 nodes (serve draws iris_knowledge_tree_max, default 50: the
      parent chain, the node, its children, then its siblings), a name 1-200 chars, a text at most 600 (the focus's
      description head); hidden is how many the cap left out, said by both shells. Never in an approval. The pupil
      draws it as the graph's layered columns (parent -> child), the focus marked; a click on a node opens that node
      as a knowledge widget, read by the thalamus without the model; the terminal says one indented line a node
    dendrogram: >-
      one agent run as a tree (read_run; v11): {title?, root, nodes[{id, parent?, kind agent|thread|turn|tool|approval|iteration,
      name, status running|ok|bad|waiting, started?, ended?, tokens?, note?}], hidden}; ids [A-Za-z0-9._-]{1,128}, unique;
      exactly one node has no parent and root names it; every parent is a node of the tree and no chain cycles; at most
      200 nodes (serve cuts the rest in order and hidden says how many), a name 1-200 chars, a note at most 600, started
      and ended are dates (ended not before started). Serve builds it from Wing's agent_sessions, threads, iterations
      and events by actor_action_id; the model never writes it. Never in an approval. The pupil draws it as the graph's
      layered columns, status as tone (ok ok, running info, waiting warn, bad bad); the terminal says one indented line a node
    # Crosses the wire only inside a `widget` message: a render or approval_request carrying one is
    # refused (wire.rs not_a_form).
    form: >-
      a widget form serve builds from the table's live schema (form_from_schema), never the model:
      {form uuid, table, title (the KEAP table's), fields[{key, label, kind text|number|date|select|bool,
      required, options?, min?, max?, placeholder?, when? {key, op eq|neq, value}}], omitted[{key, kind}],
      prefill? {key: value}}; at most 20 fields, keys unique, never empty or __-prefixed, a select has 1-50
      options, min <= max; `when` names another field and never sits on a required one (the pupil hides the
      field while it fails and sends no value for it); prefill names fields only and is where the person's
      draft starts, never a value sent (KEAP's column def has no min/max, so serve sets none); a rowRef column is a select of
      the parent rows' refDisplay labels (1-50, unique; else text, the parent's id) and the submit writes the picked row's id; the pupil draws its own header
      "Adds a row to <title> (<table>)" and button "Add row"; the terminal says the fields and
      "fill it in the pupil"
    kpi: >-
      one number serve computed from a table (show kind kpi, only with a source {query, op, y?}; or a kpi
      widget): {title, value, unit?, delta?, delta_label?, source?}; title 1-120 chars, unit at most 16, delta_label
      60, source 200 (what was totalled over which rows). The model never sends the number: serve drops its
      value, delta and source and draws query_rows' total. Never in an approval. The pupil draws the value as one
      big text node in the shell locale (unit after it, CZK when no unit and the title names money) and delta
      as an arrow and a sign (↑ +320, ↓ −3.5) with its word for a screen reader; the terminal says
      "<title>: <value> <unit>", "up|down <|delta|> <label>" and "from <source>"
    action_approval: >-
      an act Iris asks to take on the face's screen that writes (face_act on a limb declared writes, v8), asked only
      as an approval: {app, action, params{name: value}, says}; app and action name the declared limb, says is its
      one line. Both shells show the limb, what it says and every param; only an approve sends the act
    # Rendered only (wire.rs: never in an approval, never as a widget's answer); nothing runs at offer.
    dashboard: >-
      a tab of widgets Iris offers (offer_dashboard): {name, lens[{column, op eq|neq|lt|gt|contains, value,
      kind?, options?}] <=4, widgets[{title, spec}] 1-8, dropped[{title, why}]}; name 1-40 chars, a spec is a
      WidgetSpec of wire.widget and passes check_spec, an empty lens value is unset; kind and options are the
      column's, for the person's lens input (a rowRef's: its parent labels, as a form's; a where names a label
      and serve reads it as that parent's id). serve validated each widget against the live schema as the
      person (no row read but a rowRef's parents) and moved the ones that failed to dropped with why, always present. The pupil draws it
      with "Place on a new board": the click makes a board inside the open one with that lens and runs each widget once (trigger
      click); the lens joins every rows, chart and kpi widget's where at send time, a form takes its eq values
      as prefill; the terminal says it and "place it in the pupil"

# ── 3. The three invariants (ssot/doctrine/cross-repo-contracts.md §4) ──────
invariants:
  identity: >-
    `session` and `approval` are lowercase hyphenated uuids, minted by the
    thalamus; `actor` is "user:<canonical uid>". A message with any other
    shape is refused, so one person's turn can never be filed under a guess.
  visibility: >-
    A line the shell cannot decode (unknown `t`, unknown component kind,
    unknown field, a component over its caps: renderers.rs Component::check)
    becomes a `refused` message naming why. It is shown,
    never dropped: a component that silently fails to render is worse than
    one that errors. `projected: false` on table_results says the search was
    substring, not semantic. A source the person may not read (inbox
    `refused`, approvals `unknown`) is listed as such, never as empty.
  removal: >-
    The fixture holds one sample of every variant and every component. A
    variant or component leaving the enum fails to decode its sample and the
    gate goes red; removing one is a contract_version bump with the fixture
    in the same change.

open:
  - >-
    Since v4 the model chooses a renderer through the `show` tool, for table,
    list, record, chart, tree, timeline, graph, sequence, choice, kpi and (v12) callout, steps, sources and
    follow_up (plain text already draws as markdown); table_results,
    row_diff_approval and the
    control views stay chosen by their tool or control, and an approval is
    minted by propose_row_edit (insert, delete, propose_table_create for a new table, propose_column_add for new columns), or by a widget form the person submits
    (wire.form_submit). The model has no form: a form is a widget the person
    made, and a widget runs without the model (wire.widget). A choice asks; its
    answer is data for the model, never an approval (wire.choice_reply). Since v6 offer_dashboard
    offers a tab of widgets (components.dashboard); only the person's click places it and runs it.
