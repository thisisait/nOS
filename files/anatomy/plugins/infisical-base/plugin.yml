# =============================================================================
# infisical-base — service plugin (Q2 native_oidc_env batch B, U6).
# Native OIDC via OIDC_DISCOVERY_URL + OIDC_CLIENT_*. Tier 1 (admin).
#
# Note: Infisical CE 0.60+ env vars seed the default OIDC config; org-level
# OIDC attach still needs a post-API call (deferred to U8 native_oidc_api batch).
# =============================================================================

name: infisical-base
version: 0.1.0
description: |
  Wiring layer for Infisical CE (central secrets vault): Authentik
  native-OIDC vessel, GDPR Article 30 row, /hub card.
upstream: https://infisical.com/
license: MIT

type:
  - service
  - ui-extension

requires:
  role: pazny.infisical
  feature_flag: install_infisical
  variables:
    - infisical_domain
    - infisical_port
    - tenant_domain
    - host_alias
    - global_password_prefix

# ── DEPENDS_ON — service→service edges (docs/idea/13-relations.md, R1) ──────
# Transcribed from main.yml's two `Auto-enable <provider> for services that
# require it` blocks (PostgreSQL, Redis Docker) — the estate has held this as
# behaviour since before the graph existed. Compiled by
# tools/anatomy-graph-gen.py; the equivalence between the two representations
# is pinned by tests/anatomy/test_service_dependency_edges.py.
depends_on:
  - upstream: "service:postgresql"
    kind: data
    via: >-
      DB_CONNECTION_URI=postgresql://…@postgresql:5432
      (roles/pazny.infisical/templates/compose.yml.j2:23) — database
      `infisical`
    measured: "2026-08-07"
  - upstream: "service:redis"
    kind: data
    via: >-
      REDIS_URL=redis://…@redis:6379
      (roles/pazny.infisical/templates/compose.yml.j2:24)
    measured: "2026-08-07"

authentik:
  # forward_auth (NOT native_oidc): Infisical org-OIDC is enterprise-licensed; on
  # CE the OIDC_* env is inert (live-verified v0.159.16: oidc_configs=0, sso
  # endpoint 404, unauth GET=200=no gate), so the old native_oidc claim left this
  # Tier-1 vault UNGATED. Gate it at the edge via authentik@file forward-auth
  # (traefik_auth_modes: infisical=proxy). CE ceiling = gate-only (Authentik gates
  # access, then Infisical's own email/password form). 2026-06-02.
  mode: forward_auth                          # nOS doctrine label
  provider_type: forward_auth                 # schema-canonical (state/schema/plugin.schema.json)
  client_id: nos-infisical
  client_secret: "{{ nos_derived_secrets.oidc_infisical }}"
  slug: infisical
  name: 'Infisical'
  enabled: "{{ install_infisical | default(false) }}"
  launch_url: "https://{{ infisical_domain }}"
  tier: 1
  # NO autologin block: forward_auth services are pure access gates (pinned by
  # test_no_autologin_for_pure_proxy_services). Infisical CE cannot force/seed
  # OIDC at all (enterprise-licensed), so there is nothing to auto-redirect —
  # the honest ceiling is gate-only. break-glass when Authentik is down:
  # /login/admin (org-admin email+password, reachable past the gate).

compose_extension:
  template: templates/infisical-base.compose.yml.j2
  target_stack: infra
  target_service: infisical

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health: "http://127.0.0.1:{{ infisical_port }}/api/status"

gdpr:
  purpose: |
    Hosts the operator's central secrets vault (Infisical CE). Stores
    encrypted secrets, project metadata, audit logs, and OIDC session links.
    Vault values are envelope-encrypted at rest.
  legal_basis: legitimate_interests
  data_categories:
    - encrypted_secrets
    - audit_logs
    - oauth_session_data
    - email
  data_subjects:
    - operators
  retention_days: -1
  processors: []
  eu_residency: true
  breach_severity_default: critical

ui-extension:
  hub_card:
    title: "Infisical"
    icon: vault
    url: "https://{{ infisical_domain }}"
    tier: 1
    description: "Central secrets vault"
    health_check: "https://{{ infisical_domain }}/api/status"

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
