# =============================================================================
# infisical-base — service plugin (Q2 native_oidc_env batch B, U6).
# Native OIDC via OIDC_DISCOVERY_URL + OIDC_CLIENT_*. Tier 1 (admin).
#
# Note: Infisical CE 0.60+ env vars seed the default OIDC config; org-level
# OIDC attach still needs a post-API call (deferred to U8 native_oidc_api batch).
# =============================================================================

name: infisical-base
version: 0.1.0
description: |
  Wiring layer for Infisical CE (central secrets vault): Authentik
  native-OIDC vessel, GDPR Article 30 row, /hub card.
upstream: https://infisical.com/
license: MIT

type:
  - service
  - ui-extension

requires:
  role: pazny.infisical
  feature_flag: install_infisical
  variables:
    - infisical_domain
    - infisical_port
    - tenant_domain
    - host_alias
    - global_password_prefix

authentik:
  mode: native_oidc
  provider_type: oauth2
  client_id: nos-infisical
  client_secret: "{{ global_password_prefix }}_pw_oidc_infisical"
  slug: infisical
  name: 'Infisical'
  enabled: "{{ install_infisical | default(false) }}"
  redirect_uris:
    - "https://{{ infisical_domain }}/api/v1/sso/oidc/callback"
  launch_url: "https://{{ infisical_domain }}"
  scopes:
    - openid
    - email
    - profile
  tier: 1
  # ── SSO autologin (force-OIDC) — sso-autologin-plan.md Batch 3 (matice b/d) ─
  # Infisical CE: the OIDC_* env (already seeded below in the compose-ext when
  # install_authentik=true) gives a "Sign in with Authentik" button. "Enforce
  # OIDC" (force-only / pre-login auto-redirect) is ENTERPRISE-gated — there is
  # NO user-facing enforce nor auto-redirect in OSS. So `enabled` behaves as
  # SEED-ONLY here: turning autologin on must NOT render an enterprise-only
  # enforce API/env call (pinned by tests/anatomy/test_infisical_no_enforce_in_oss.py).
  # PARTIAL + enforce deferred. Stays dormant behind sso_autologin=false; the
  # compose-extension {% if %} gates on the SAME enable expression below and only
  # emits a benign OSS seed marker (no enforce).
  autologin:
    supports: "partial"      # upstream truth — button seed only; enforce is enterprise-gated
    enabled: "{{ (sso_autologin_infisical | default(sso_autologin_min_tier_1 | default(sso_autologin | default(false)))) | bool }}"
    hides_local_form: false  # OSS cannot enforce/hide the form (enterprise-only); button only
    break_glass: "/login/admin"   # org-admin login bypass (always reachable in OSS)

compose_extension:
  template: templates/infisical-base.compose.yml.j2
  target_stack: infra
  target_service: infisical

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health: "http://127.0.0.1:{{ infisical_port }}/api/status"

gdpr:
  purpose: |
    Hosts the operator's central secrets vault (Infisical CE). Stores
    encrypted secrets, project metadata, audit logs, and OIDC session links.
    Vault values are envelope-encrypted at rest.
  legal_basis: legitimate_interests
  data_categories:
    - encrypted_secrets
    - audit_logs
    - oauth_session_data
    - email
  data_subjects:
    - operators
  retention_days: -1
  processors: []
  eu_residency: true
  breach_severity_default: critical

ui-extension:
  hub_card:
    title: "Infisical"
    icon: vault
    url: "https://{{ infisical_domain }}"
    tier: 1
    description: "Central secrets vault"
    health_check: "https://{{ infisical_domain }}/api/status"

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
