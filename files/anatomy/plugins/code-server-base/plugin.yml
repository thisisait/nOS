# =============================================================================
# code-server-base — service plugin (Q2 proxy-auth batch, 2026-05-04)
#
# Status: live manifest. Wires `pazny.code_server` into the proxy-auth doctrine —
# Authentik forward-auth via Traefik middleware (no native OIDC).
#
# Tier 2 (manager) per CLAUDE.md RBAC mapping. Forward-auth gates
# access at the proxy layer; the service still renders its own login UI
# (or, for stateless services, the Authentik session IS the auth).
# =============================================================================

name: code-server-base
version: 0.1.0
description: |
  code-server — VS Code in the browser (LinuxServer.io image).

  Wiring layer for proxy-authenticated access via Authentik forward-auth
  (Traefik middleware `authentik@file`). The role `pazny.code_server` keeps install-
  only responsibilities (image, ports, volumes); this plugin owns the
  Traefik labels + Authentik tier binding + GDPR Article 30 row + Wing
  /hub deep-link card.
upstream: https://github.com/coder/code-server
license: AGPL-3.0  # plugin manifest is repo-licensed

type:
  - service
  - ui-extension

# Defensive sentinel — pin the plugin slug for any tool that introspects
# manifests via the loader (P0.12 doctrine).
_NOS_PLUGIN: "code-server-base"

# =============================================================================
# REQUIRES
# =============================================================================

requires:
  role: pazny.code_server
  feature_flag: install_code_server
  variables:
    - code_server_port
    - code_server_domain
    - tenant_domain
    - host_alias

# =============================================================================
# AUTHENTIK — proxy / forward-auth gate (Tier 2 = manager)
# =============================================================================
# This service has NO native OIDC support — Authentik gates access at
# the Traefik layer via the `authentik@file` middleware. RBAC tier
# determines which Authentik group expression policy applies.

authentik:
  mode: forward_auth                          # nOS doctrine label (provider_type below = canonical)
  provider_type: forward_auth                 # schema-canonical (state/schema/plugin.schema.json)
  client_id: nos-code-server
  client_secret: "{{ global_password_prefix }}_pw_oidc_code_server"
  slug: code-server
  name: 'code-server'
  enabled: "{{ install_code_server | default(false) }}"
  launch_url: "https://{{ code_server_domain }}"
  tier: 2
  # ── Autologin verdict (forward_auth) — sso-autologin-plan.md §forward_auth ──
  # NOT an `autologin` block by design: forward_auth services gate the ROUTE
  # (WHO), not service identity (WHAT). An `autologin` field here would trip
  # test_no_autologin_for_pure_proxy_services (anti-pattern double-protection).
  # This sentinel records the honest second-login elimination verdict instead.
  _nos_autologin_verdict:
    supports: "no"                # forward_auth never carries autologin (gate-locked)
    second_login: "password (HASHED_PASSWORD prompt rendered by the LSIO image)"
    elimination: needs-sidecar  # NOT cleanly config-doable today (honest)
    detail: |
      code-server.<tld> sits behind the Traefik authentik@file middleware, so
      Authentik already gates the route — but the LinuxServer.io image then
      renders its OWN password login (PASSWORD/HASHED_PASSWORD). Coder OSS
      upstream can run `--auth none` (relying purely on the proxy gate) or an
      external `--auth oauth-proxy` mode, but the LSIO image strips both: it
      hard-wires the password gate and exposes no REMOTE_USER / trusted-proxy
      env to consume the X-Authentik-* headers Traefik already forwards.
      Clean elimination needs EITHER an oauth2-proxy sidecar in front of the
      container OR an upstream LSIO build-arg PR forwarding Coder's --auth
      flags (see docs/upstream-pr-opportunities.md). No fake config toggle
      exists — left honestly as needs-sidecar.

# =============================================================================
# COMPOSE-EXTENSION — Traefik labels (forward-auth middleware)
# =============================================================================
compose_extension:
  template: templates/code-server-base.compose.yml.j2
  target_stack: devops
  target_service: code-server
  hardening_refs: []

# =============================================================================
# LIFECYCLE HOOKS
# =============================================================================

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health:
        url: "http://127.0.0.1:{{ code_server_port }}/"
        timeout: 60
        accept_any_2xx_3xx_4xx: true   # forward-auth returns 401/302; that's healthy

# =============================================================================
# OBSERVABILITY — Loki labels (forward-auth has no /metrics natively)
# =============================================================================

observability:
  loki:
    labels:
      app: code-server
      stack: devops
      tier: "2"

# =============================================================================
# GDPR — Article 30 register row
# =============================================================================

gdpr:
  purpose: |
    Operator-hosted VS Code in the browser (LinuxServer.io image). Forward-auth gate ensures only
    Authentik-authenticated principals reach the service.
  legal_basis: legitimate_interests
  data_categories:
    - workspace_files
    - git_credentials
    - oauth_session_data
  data_subjects:
    - operators
  retention_days: 365
  processors: []
  eu_residency: true
  transfers_outside_eu: false

# =============================================================================
# UI-EXTENSION — Wing /hub deep-link card
# =============================================================================

ui-extension:
  hub_card:
    title: "code-server"
    icon: code
    url: "https://{{ code_server_domain }}"
    tier: 2
    description: "VS Code in the browser"

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
