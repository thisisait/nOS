# =============================================================================
# freescout-base — service plugin (Q2 native_oidc_env mop-up, P1).
# Native OIDC via the freescout-oauth community module (env-driven).
# RBAC tier 2 (manager — helpdesk staff).
#
# U8 worker had this slated as native_oidc_api (artisan CLI) but the role
# already wires OIDC via env vars (FREESCOUT_OIDC_*) — env-based fits the
# U5/U6 shape. Operator-completed in Phase 1 mop-up 2026-05-05.
# =============================================================================

name: freescout-base
version: 0.1.0
description: |
  Wiring layer for FreeScout helpdesk: Authentik native-OIDC vessel via
  the freescout-oauth community module (FREESCOUT_OIDC_* env vars),
  mkcert CA mount conditional, GDPR Article 30 row, /hub card.
upstream: https://freescout.net/
license: AGPL-3.0

type:
  - service
  - ui-extension

requires:
  role: pazny.freescout
  feature_flag: install_freescout
  variables:
    - freescout_domain
    - freescout_port
    - tenant_domain
    - host_alias
    - global_password_prefix

# ── DEPENDS_ON — service→service edges (docs/idea/13-relations.md, R1) ──────
# Transcribed from main.yml's `Auto-enable MariaDB for services that require
# it` — the estate has held this as behaviour since before the graph existed.
# Compiled by tools/anatomy-graph-gen.py; the equivalence between the two is
# pinned by tests/anatomy/test_service_dependency_edges.py.
depends_on:
  - upstream: "service:mariadb"
    kind: data
    via: >-
      DB_HOST=mariadb (roles/pazny.freescout/templates/compose.yml.j2:25) —
      schema `freescout`
    measured: "2026-08-07"

# FLIPPED native_oidc -> forward_auth, 2026-08-11, closing REM-192 (HIGH).
#
# The `native_oidc` claim was ASPIRATIONAL and the edge paid for it. Declaring
# `oidc` means the auto-derived Traefik router carries NO authentik@file
# middleware — correct for a service whose own login page offers Authentik, and
# a doctrine violation for one that does not. FreeScout does not: the
# `freescout-oauth` module never installs because BOTH upstream sources are
# HTTP 404 (freescout-help-desk/oauth, tiredofit/freescout-module-oauth), which
# roles/pazny.freescout/tasks/post.yml has documented at length and CLAUDE.md
# lists under "ASPIRATIONAL, not live".
#
# So the FREESCOUT_OIDC_* env rendered, nothing consumed it, /login served the
# local email+password form, and the edge was open onto it. Measured live by
# the cycle-26 default_credentials_test probe: HTTP 200 with name="email" and
# name="password" inputs and no authentik marker anywhere on the page.
#
# forward_auth is the honest classification while no reachable module exists —
# Authentik gates the route, FreeScout keeps its own local account behind it.
# docs/active-work.md carried this decision ("or reclassify FreeScout as
# forward_auth") before the probe proved it; this is the doing.
#
# NO redirect_uris and NO scopes: a proxy provider has no OIDC client, and
# leaving them would declare a callback nothing can reach.
authentik:
  mode: forward_auth                          # nOS doctrine label (provider_type below = canonical)
  provider_type: forward_auth                 # schema-canonical (state/schema/plugin.schema.json)
  client_id: nos-freescout
  client_secret: "{{ nos_derived_secrets.oidc_freescout }}"
  slug: freescout
  name: 'FreeScout'
  enabled: "{{ install_freescout | default(false) }}"
  launch_url: "https://{{ freescout_domain }}"
  tier: 2

compose_extension:
  template: templates/freescout-base.compose.yml.j2
  target_stack: b2b
  target_service: freescout

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health: "http://127.0.0.1:{{ freescout_port | default(8090) }}/"
    - replay_api_calls: hooks/post_compose.yml

gdpr:
  purpose: |
    Hosts the operator's FreeScout helpdesk system. Stores customer
    conversations, ticket history, internal notes, agent accounts, and
    OIDC session data. Customer email content is processed for support
    purposes (legitimate interests basis, contractual where the customer
    has an active service agreement).
  legal_basis: legitimate_interests
  data_categories:
    - support_conversations
    - ticket_metadata
    - customer_emails
    - internal_notes
    - user_accounts
    - oauth_session_data
  data_subjects:
    - operators
    - support_agents
    - end_users
  retention_days: 1095   # 3 years — typical helpdesk retention horizon
  processors: []
  eu_residency: true

ui-extension:
  hub_card:
    title: "FreeScout"
    icon: ticket
    url: "https://{{ freescout_domain }}"
    tier: 2
    description: "Helpdesk / customer support"
    health_check: "https://{{ freescout_domain }}/"

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
