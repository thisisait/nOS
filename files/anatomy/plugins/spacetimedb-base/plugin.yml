# =============================================================================
# spacetimedb-base — service plugin (D1.1, last C1 blocker, 2026-05-05)
#
# Closes the only `only_central` row in tools/aggregator-dry-run.py: pre-D1.1
# spacetimedb existed in default.config.yml's authentik_oidc_apps as
# type=proxy but had no plugin manifest, blocking C1 (delete central list).
#
# This is a minimal STUB. SpacetimeDB is a realtime DB with a binary
# protocol — the Tier-1 surface is just the dashboard at /admin and module
# publishing endpoints. End-user RBAC happens inside WASM modules via
# ctx.sender.identity (cryptographic identity passport, not Authentik).
# So the plugin only declares the proxy gate for the HTTP admin surface;
# no app-level OIDC client makes sense.
#
# Q3 candidate per docs/archive/track-q-residue-analysis.md — when SpacetimeDB
# matures to ship a multi-tenant admin UI, revisit. Until then this stub
# is sufficient: Authentik gates /admin via forward_auth, module-level
# auth uses SpacetimeDB's own crypto identity. **Stay proxy permanently.**
#
# Doctrine refs:
#   - docs/native-sso-survey.md (β1.A trichotomy)
#   - docs/upstream-pr-opportunities.md (permanently-proxy table)
# =============================================================================

name: spacetimedb-base
version: 0.1.0
description: |
  Wiring layer for SpacetimeDB realtime DB: no edge surface (reached only
  through the nos-forum /stdb lane), GDPR Article 30 row.
  Module-level RBAC happens inside operator WASM modules via
  ctx.sender.identity — out of nOS plugin scope.
upstream: https://spacetimedb.com/
license: BSL-1.1   # SpacetimeDB upstream; manifest is repo-licensed

type:
  - service

_NOS_PLUGIN: "spacetimedb-base"

# =============================================================================
# REQUIRES
# =============================================================================

requires:
  role: pazny.spacetimedb
  feature_flag: install_spacetimedb
  variables:
    - spacetimedb_domain
    - spacetimedb_port
    - tenant_domain
    - host_alias

# =============================================================================
# AUTHENTIK — none: no edge surface at all
# =============================================================================
# REM-144 took the edge router away (traefik_skip_ids), so the forward_auth
# claim here gated nothing and the e2e probe 404'd (2026-10-03). The only
# browser path is the nos-forum lane, two SDK endpoints, SpacetimeDB checking
# the id_token itself. The tofu registry keeps a disabled tombstone.

# No compose_extension — Traefik file-provider derives the forward_auth
# middleware attachment from state/manifest.yml's auth_mode column.

# =============================================================================
# LIFECYCLE
# =============================================================================

# =============================================================================
# OBSERVABILITY — the Loki label set, and the stack this plugin belongs to
# =============================================================================
# ADDED 2026-08-31 for the SECOND half, which is the one with teeth.
#
# `load_plugins._plugin_stack` resolves a plugin's stack from
# `compose_extension.target_stack` first and this label second, and `run_hook`
# skips a plugin only when `pstack is not None and pstack not in stack_filter`.
# So a plugin with NO resolvable stack is never filtered out: its lifecycle
# hooks ran on EVERY stack-scoped pass, doing work for a service that pass was
# not bringing up. This plugin had hooks and no stack.
#
# Not new metadata — the fact was already recorded elsewhere: the role renders
# its override to {{ stacks_dir }}/infra/overrides/spacetimedb.yml. (The "no
# manifest row" half of this note expired 2026-09-01 — state/manifest.yml now
# carries one; it is still excluded from the all-on profile.)
#
# The log labels themselves are close to free: Alloy discovers ALL containers
# over the Docker socket and derives `container` / `compose_project` /
# `compose_service` by relabel, so logs already reach Loki with their stack
# whether or not a plugin says anything. `metrics`/`dashboard` are deliberately
# omitted — they are metadata with no aggregator today
# (files/anatomy/docs/plugin-wiring-capabilities.md).
observability:
  loki:
    labels:
      app: spacetimedb
      stack: infra

lifecycle:
  pre_compose: []
  post_compose:
    - wait_health: "http://127.0.0.1:{{ spacetimedb_port | default(3030) }}/admin"
    - replay_api_calls: hooks/post_compose.yml
  post_blank: []

# =============================================================================
# GDPR — Article 30 register row
# =============================================================================

gdpr:
  purpose: |
    Hosts the operator's SpacetimeDB realtime DB modules. Stores user-defined
    tables, table rows, and the cryptographic identity (ctx.sender.identity)
    of every module caller. Module-level data subject is operator-defined.
  data_categories:
    - module_state
    - operator_identity
  data_subjects:
    - operator
    - module_callers
  legal_basis: legitimate_interests
  retention_days: 365
  processors: []
  eu_residency: true

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []

e2e:
  enabled: "{{ install_spacetimedb | default(false) }}"
  probes:
    - name: no-public-edge
      url: https://{{ spacetimedb_domain | default('spacetime' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/
      expect: {status: [404]}
    - name: forum-lane-refuses-the-sql-api
      url: https://{{ nos_forum_domain | default('forum.' ~ (tenant_domain | default('dev.local'))) }}/stdb/v1/database/nos-forum/sql
      expect: {status: [302], location_contains: "/auth/login"}
