# =============================================================================
# bookstack-base — service plugin (Q2 native_oidc_env batch B, U6).
# Native OIDC via OIDC_* env vars (issuer-discovery). RBAC tier 3 (user).
# =============================================================================

name: bookstack-base
version: 0.1.0
description: |
  Wiring layer for BookStack wiki: Authentik native-OIDC vessel,
  mkcert CA mount conditional, GDPR Article 30 row, /hub card.
upstream: https://www.bookstackapp.com/
license: MIT

type:
  - service
  - ui-extension

requires:
  role: pazny.bookstack
  feature_flag: install_bookstack
  variables:
    - bookstack_domain
    - bookstack_port
    - tenant_domain
    - host_alias
    - global_password_prefix

# ── DEPENDS_ON — service→service edges (docs/idea/13-relations.md, R1) ──────
# Transcribed from main.yml's two `Auto-enable <provider> for services that
# require it` blocks (MariaDB, Redis Docker) — the estate has held this as
# behaviour since before the graph existed. Compiled by
# tools/anatomy-graph-gen.py; the equivalence between the two representations
# is pinned by tests/anatomy/test_service_dependency_edges.py.
depends_on:
  - upstream: "service:mariadb"
    kind: data
    via: >-
      DB_HOST=mariadb (roles/pazny.bookstack/templates/compose.yml.j2:26) —
      schema `bookstack`
    measured: "2026-08-07"
  - upstream: "service:redis"
    kind: data
    via: >-
      REDIS_SERVERS=redis:6379:0 — session + cache store
      (roles/pazny.bookstack/templates/compose.yml.j2:35)
    measured: "2026-08-07"

authentik:
  mode: native_oidc
  provider_type: oauth2
  client_id: nos-bookstack
  client_secret: "{{ global_password_prefix }}_pw_oidc_bookstack"
  slug: bookstack
  name: 'BookStack'
  enabled: "{{ install_bookstack | default(false) }}"
  redirect_uris:
    - "https://{{ bookstack_domain }}/oidc/callback"
  launch_url: "https://{{ bookstack_domain }}"
  scopes:
    - openid
    - email
    - profile
    - groups
  tier: 3
  # ── SSO autologin (force-OIDC) — sso-autologin-plan.md Batch 2 (clean win) ──
  # BookStack clean win (conf 0.92): env-only force-OIDC. AUTH_METHOD=oidc is
  # already set above; AUTH_AUTO_INITIATE=true makes BookStack auto-redirect to
  # Authentik and hide the local login form. Stays dormant behind
  # sso_autologin=false default; the compose-extension {% if %} gates on the
  # SAME enable expression below. Break-glass: ?prevent_auto_init=true → form.
  autologin:
    supports: "yes"          # upstream truth — AUTH_AUTO_INITIATE hides form + auto-redirects
    enabled: "{{ (sso_autologin_bookstack | default(sso_autologin_min_tier_3 | default(sso_autologin | default(false)))) | bool }}"
    hides_local_form: true   # AUTH_AUTO_INITIATE removes the local form
    break_glass: "?prevent_auto_init=true"   # → login form (skips the auto-initiate)

compose_extension:
  template: templates/bookstack-base.compose.yml.j2
  target_stack: b2b
  target_service: bookstack

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health: "http://127.0.0.1:{{ bookstack_port }}/login"

gdpr:
  purpose: |
    Hosts the operator's BookStack wiki. Stores pages, page revisions,
    user accounts, and the OIDC session link.
  legal_basis: legitimate_interests
  data_categories:
    - wiki_content
    - revision_history
    - user_accounts
    - oauth_session_data
    - email
  data_subjects:
    - operators
    - end_users
  retention_days: 365
  processors: []
  eu_residency: true

ui-extension:
  hub_card:
    title: "BookStack"
    icon: book
    url: "https://{{ bookstack_domain }}"
    tier: 3
    description: "Wiki / knowledge base"
    health_check: "https://{{ bookstack_domain }}/login"

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
