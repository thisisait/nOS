# =============================================================================
# wordpress-base — service plugin (Q2 native_oidc_env batch B mop-up, P1).
# Native OIDC via openid-connect-generic WP plugin (configured by mu-plugin
# oidc-bootstrap.php from WP_OIDC_* env vars). RBAC tier 4 (guest).
#
# Worker U6 was scoped 8 plugins but ran out of agent quota at 7; this
# plugin completes the batch (operator-authored 2026-05-05).
# =============================================================================

name: wordpress-base
version: 0.1.0
description: |
  Wiring layer for WordPress: Authentik native-OIDC vessel via the
  openid-connect-generic plugin (env-driven configuration through
  mu-plugins/oidc-bootstrap.php), mkcert CA mount conditional, GDPR
  Article 30 row, /hub card.
upstream: https://wordpress.org/
license: GPL-2.0

type:
  - service
  - ui-extension

requires:
  role: pazny.wordpress
  feature_flag: install_wordpress
  variables:
    - wordpress_domain
    - wordpress_port
    - tenant_domain
    - host_alias
    - global_password_prefix

# ── DEPENDS_ON — service→service edges (docs/idea/13-relations.md, R1) ──────
# Transcribed from main.yml's `Auto-enable MariaDB for services that require
# it` — the estate has held this as behaviour since before the graph existed.
# Compiled by tools/anatomy-graph-gen.py; the equivalence between the two is
# pinned by tests/anatomy/test_service_dependency_edges.py.
depends_on:
  - upstream: "service:mariadb"
    kind: data
    via: >-
      WORDPRESS_DB_HOST=mariadb
      (roles/pazny.wordpress/templates/compose.yml.j2:26) — schema
      `wordpress`, created by mariadb_databases (default.config.yml:1219)
    measured: "2026-08-07"

authentik:
  mode: native_oidc
  provider_type: oauth2
  client_id: nos-wordpress
  client_secret: "{{ nos_derived_secrets.oidc_wordpress }}"
  slug: wordpress
  name: 'WordPress'
  enabled: "{{ install_wordpress | default(false) }}"
  redirect_uris:
    - "https://{{ wordpress_domain }}/wp-admin/admin-ajax.php?action=openid-connect-authorize"
  launch_url: "https://{{ wordpress_domain }}"
  scopes:
    - openid
    - email
    - profile
  tier: 4
  # ── SSO autologin (force-OIDC) — sso-autologin-plan.md Batch 2 (matice b) ─
  # WordPress via openid-connect-generic: WP_OIDC_LOGIN_TYPE=auto-sso (from
  # the default 'button') makes /wp-login.php auto-redirect to Authentik.
  # PARTIAL: the form is NOT hidden — wp-login.php stays reachable directly
  # (and IS the documented break-glass). Stays dormant behind
  # sso_autologin=false default; the compose-extension gates WP_OIDC_LOGIN_TYPE
  # on the SAME enable expression below.
  autologin:
    supports: "partial"      # upstream truth — auto-redirects but does NOT hide the form
    enabled: "{{ (sso_autologin_wordpress | default(sso_autologin_min_tier_4 | default(sso_autologin | default(false)))) | bool }}"
    hides_local_form: false  # auto-sso redirects but wp-login.php remains directly reachable
    break_glass: "/wp-login.php"   # the local form stays live; hit it directly to bypass auto-SSO

compose_extension:
  template: templates/wordpress-base.compose.yml.j2
  target_stack: iiab
  target_service: wordpress

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health: "http://127.0.0.1:{{ wordpress_port | default(8084) }}/wp-login.php"
    - replay_api_calls: hooks/post_compose.yml

gdpr:
  purpose: |
    Hosts the operator's WordPress site. Stores posts, pages, comments,
    user accounts, and OIDC session data. Public-facing content may be
    reachable to anonymous visitors (legitimate interests basis).
  legal_basis: legitimate_interests
  data_categories:
    - blog_content
    - comments
    - user_accounts
    - oauth_session_data
    - email
  data_subjects:
    - operators
    - end_users
    - anonymous_visitors
  retention_days: 365
  processors: []
  eu_residency: true

ui-extension:
  hub_card:
    title: "WordPress"
    icon: globe
    url: "https://{{ wordpress_domain }}"
    tier: 4
    description: "Public website / blog"
    health_check: "https://{{ wordpress_domain }}/wp-login.php"

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
