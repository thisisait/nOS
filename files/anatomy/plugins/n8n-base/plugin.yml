# =============================================================================
# n8n-base — service plugin (Track Q U5, Phase 1, 2026-05-04)
#
# Replaces the `authentik_oidc_apps[slug=n8n]` row + the role-side
# N8N_AUTH_OIDC_* env block. Phase 2 C1 deletes both.
# =============================================================================

name: n8n-base
version: 0.1.0
description: |
  Wiring layer for n8n (workflow automation). Carries Authentik native-OIDC
  env block (N8N_AUTH_OIDC_ENABLED + CLIENT_ID/SECRET + ISSUER) plus the
  mkcert CA volume + NODE_EXTRA_CA_CERTS conditional.
upstream: https://n8n.io/
license: SUSTAINABLE-USE-1.0   # n8n upstream; manifest is repo-licensed

type:
  - service

# =============================================================================
# REQUIRES
# =============================================================================

requires:
  role: pazny.n8n
  feature_flag: install_n8n
  variables:
    - n8n_domain
    - n8n_port
    - tenant_domain
    - host_alias
    - global_password_prefix

# ── DEPENDS_ON — service→service edges (docs/idea/13-relations.md, R2) ──────
depends_on:
  - upstream: "service:mailpit"
    kind: data
    via: >-
      N8N_SMTP_HOST="mailpit" with N8N_EMAIL_MODE=smtp
      (roles/pazny.n8n/templates/compose.yml.j2:27-29) — n8n's user
      invitations and workflow-failure alerts leave through it
    measured: "2026-08-07"
    unenforced: >-
      No auto-enable block turns Mailpit on for n8n. With it off, SMTP fails
      per-message inside n8n; the container stays healthy and the converge
      reports nothing.

# =============================================================================
# AUTHENTIK — native OIDC client
# =============================================================================

authentik:
  mode: native_oidc
  client_id: nos-n8n
  client_secret: "{{ nos_derived_secrets.oidc_n8n }}"
  slug: n8n
  name: 'n8n'
  enabled: "{{ install_n8n | default(false) }}"
  redirect_uris:
    - "https://{{ n8n_domain | default('n8n' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/rest/oauth2-credential/callback"
    - "https://{{ n8n_domain | default('n8n' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/rest/oidc/callback"
  launch_url: "https://{{ n8n_domain | default('n8n' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}"
  scopes:
    - openid
    - profile
    - email
  tier: 2   # manager — workflow author, integrations / secrets

# =============================================================================
# COMPOSE-EXTENSION
# =============================================================================

compose_extension:
  template: templates/n8n-base.compose.yml.j2
  target_stack: iiab
  target_service: n8n

# =============================================================================
# LIFECYCLE HOOKS
# =============================================================================

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health: "http://127.0.0.1:{{ n8n_port | default(5678) }}/healthz"

gdpr:
  purpose: |
    Hosts the operator's n8n workflow automation platform. Stores
    workflow definitions, execution history, credentials, and OIDC
    session data. Workflows may process third-party data subjects'
    information depending on the operator's automations.
  legal_basis: legitimate_interests
  data_categories:
    - workflow_definitions
    - execution_history
    - encrypted_credentials
    - oauth_session_data
    - email
  data_subjects:
    - operators
    - end_users
  retention_days: 365
  processors: []
  eu_residency: true

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []

# ── Wing /hub card (ui-extension) ────────────────────────────────────────────
# Forward-ready deep-link card for the Wing hub (harvest pending). Matches the
# woodpecker-base/grafana-base shape. domain var is playbook-defined.
ui-extension:
  hub_card:
    title: n8n
    icon: workflow
    url: "https://{{ n8n_domain }}"
    tier: 2
    description: Workflow automation
    health_check: "https://{{ n8n_domain }}"
