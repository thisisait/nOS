# =============================================================================
# n8n-base — service plugin (Track Q U5, Phase 1, 2026-05-04)
#
# Replaces the `authentik_oidc_apps[slug=n8n]` row + the role-side
# N8N_AUTH_OIDC_* env block. Phase 2 C1 deletes both.
# =============================================================================

name: n8n-base
version: 0.1.0
description: |
  Wiring layer for n8n (workflow automation). Carries Authentik native-OIDC
  env block (N8N_AUTH_OIDC_ENABLED + CLIENT_ID/SECRET + ISSUER) plus the
  mkcert CA volume + NODE_EXTRA_CA_CERTS conditional.
upstream: https://n8n.io/
license: SUSTAINABLE-USE-1.0   # n8n upstream; manifest is repo-licensed

type:
  - service
  - scheduled-job

# =============================================================================
# REQUIRES
# =============================================================================

requires:
  role: pazny.n8n
  feature_flag: install_n8n
  variables:
    - n8n_domain
    - n8n_port
    - tenant_domain
    - host_alias
    - global_password_prefix

# ── DEPENDS_ON — service→service edges (docs/idea/13-relations.md, R2) ──────
depends_on:
  - upstream: "service:mailpit"
    kind: data
    via: >-
      N8N_SMTP_HOST="mailpit" with N8N_EMAIL_MODE=smtp
      (roles/pazny.n8n/templates/compose.yml.j2:27-29) — n8n's user
      invitations and workflow-failure alerts leave through it
    measured: "2026-08-07"
    unenforced: >-
      No auto-enable block turns Mailpit on for n8n. With it off, SMTP fails
      per-message inside n8n; the container stays healthy and the converge
      reports nothing.
  - upstream: "service:keap"
    kind: data
    via: >-
      n8n packs write KEAP DataTables over the agent API: post.yml's pack sync
      (tools/n8n-pack.py sync) injects the nos-keap-rw credential from
      keap_agent_token_rw and renders https://{{ keap_domain }} into every
      keap_write pack graph (docs/doctrine/n8n-packs.md §3)
    measured: "2026-09-21"
    unenforced: >-
      Both sync and the pack graphs are gated on install_keap (post.yml when:
      + pack requires:); with KEAP off, keap_write packs are skipped at sync
      and nothing imports them, so no runtime failure surfaces.

# =============================================================================
# AUTHENTIK — forward_auth gate
#
# Was native_oidc until 2026-09-23. It never worked and could not:
# n8n's OIDC login is a LICENSED Enterprise feature, and this is the CE build.
# Its own unauthenticated /rest/settings says so — enterprise.oidc false,
# sso.oidc.loginEnabled false, authenticationMethod "email" — while the claim
# suppressed authentik@file on the router, so n8n answered 200 to the public
# internet over real DNS. Third `oidc` classification audited, third found
# false — the two before it were FreeScout and the 2026-08-11 audit.
#
# forward_auth, not header_oidc: n8n has no header-login path either, so the
# Authentik session is a GATE and n8n keeps its own email/password login behind
# it. That is a double login and it is the honest option available on CE.
#
# Machine callers are unaffected: the Pulse clock posts to 127.0.0.1:5678 over
# loopback (ares-verify-base), never through Traefik. If a genuinely external
# webhook ever needs in, that is a `traefik_machine_lanes` entry — and the
# webhook must authenticate its own callers first (see the n8n comment there).
# =============================================================================

authentik:
  mode: forward_auth                          # nOS doctrine label (provider_type below = canonical)
  provider_type: forward_auth                 # schema-canonical (state/schema/plugin.schema.json)
  client_id: nos-n8n
  client_secret: "{{ nos_derived_secrets.oidc_n8n }}"
  slug: n8n
  name: 'n8n'
  enabled: "{{ install_n8n | default(false) }}"
  launch_url: "https://{{ n8n_domain | default('n8n' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}"
  tier: 2   # manager — workflow author, integrations / secrets

# =============================================================================
# COMPOSE-EXTENSION
# =============================================================================

compose_extension:
  template: templates/n8n-base.compose.yml.j2
  target_stack: iiab
  target_service: n8n

# =============================================================================
# LIFECYCLE HOOKS
# =============================================================================

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health: "http://127.0.0.1:{{ n8n_port | default(5678) }}/healthz"

gdpr:
  purpose: |
    Hosts the operator's n8n workflow automation platform. Stores
    workflow definitions, execution history, credentials, and OIDC
    session data. Workflows may process third-party data subjects'
    information depending on the operator's automations.
  legal_basis: legitimate_interests
  data_categories:
    - workflow_definitions
    - execution_history
    - encrypted_credentials
    - oauth_session_data
    - email
  data_subjects:
    - operators
    - end_users
  retention_days: 365
  processors: []
  eu_residency: true

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []

# ── Wing /hub card (ui-extension) ────────────────────────────────────────────
# Forward-ready deep-link card for the Wing hub (harvest pending). Matches the
# woodpecker-base/grafana-base shape. domain var is playbook-defined.
ui-extension:
  hub_card:
    title: n8n
    icon: workflow
    url: "https://{{ n8n_domain }}"
    tier: 2
    description: Workflow automation
    health_check: "https://{{ n8n_domain }}"

# One Pulse reader for every n8n pack (docs/doctrine/n8n-packs.md §4).
# Does not fire workflows. ares-verify-base stays until this job is seen live.
pulse:
  jobs:
    - name: exec-watch
      runner: subprocess
      command: "{{ playbook_dir }}/tools/n8n-pack.py"
      args:
        - watch
        - "--packs={{ playbook_dir }}/files/anatomy/n8n/packs"
        - "--url=http://127.0.0.1:5678"
        - "--secrets={{ ansible_facts['env']['HOME'] }}/.nos/secrets.yml"
      schedule: "15 * * * *"
      jitter_min: 5
      max_runtime_s: 60
      max_concurrent: 1
      category: knowledge
      findings_exit_codes: [1]
      env:
        N8N_API_KEY: "secret:n8n_api_key"
