# =============================================================================
# cortex-base — service plugin for the pazny.cortex HOST daemon (P-4 step 10).
#
# Cortex (the reasoning organ) is a native host Node daemon on loopback :8098 —
# NOT a container, and unlike backrest it has NO route and NO Authentik
# provider AT ALL: design §5 (docs/archive/nos-cortex-organ-design.md) makes pure
# loopback the default, and the id sits in traefik_skip_ids. Its callers are
# Wing's executor, host AgentKit and (later) Pulse — all on the host, all
# presenting the scope-split bearer tokens the role provisions. A public
# /agent route stays UNBUILT until a caller outside that set appears
# (design §7 Q5).
#
# S2 UPDATE (docs/archive/cortex-corpus-parallel.md). The note that used to stand
# here — "NO pulse job, the C1 daemon exposes no embed surface to sync against"
# — was correct and is now spent: the organ serves /agent/v1/embeddings{,/pending}
# and /ingest/v1/capture, and keap-base's two feeders FAN OUT to it rather than
# being moved or duplicated. This plugin gains ONE job, the agreement harness,
# which writes to neither store. The embed job stays in keap-base because it is
# still one job feeding N targets, incumbent first.
# =============================================================================

name: cortex-base
version: 0.1.0
description: |
  Cortex — the nOS reasoning organ (loopback Node daemon, vendored KEAP
  v1.27.0 cortex port). Serves POST /agent/v1/validate + the opcode registry +
  a drift-stamped /health on 127.0.0.1:8098, over its own libsql store
  materialised from git + the estate self-model. This plugin owns the GDPR row
  and A9 notification routing; the role pazny.cortex owns the install
  primitives (npm build, store materialisation, launchd/systemd unit).
upstream: https://github.com/thisisait/nos-keap
license: AGPL-3.0

type:
  - service

_NOS_PLUGIN: "cortex-base"

requires:
  role: pazny.cortex
  feature_flag: install_cortex
  variables:
    - cortex_port
    - cortex_store_path

# NO authentik: block — the organ has no human surface and no route to gate.
# Access control is the daemon's own fail-closed bearer check (tokenless ⇒ 503,
# timingSafeEqual over sha256; server/tokens.ts ported verbatim).

# =============================================================================
# NOTIFICATION — A9 canonical severity routing
# =============================================================================
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []

# =============================================================================
# OBSERVABILITY — Loki labels (host daemon, launchd logs)
# =============================================================================
observability:
  loki:
    labels:
      app: cortex
      stack: host
      tier: "1"

# =============================================================================
# GDPR — Article 30 register row
# =============================================================================
gdpr:
  purpose: |
    Cortex is the estate's reasoning organ: it typechecks agent-authored
    cortex-lang programs against the curated taxonomy and the controlled verb
    vocabulary, and reports the ontology/opcode/database drift axes on
    /health. Its store is materialised from the repository (spine + canonical
    tree + the generated nOS self-model).

    SINCE S2 (docs/archive/cortex-corpus-parallel.md) it ALSO mirrors the
    per-user filesystem tree — {{ nos_data_root }}/tenants/<slug>/users/<uid>/
    {documents,library,inbox} — as owner-scoped knowledge objects, and accepts
    consolidator datapoints on /ingest/v1/capture. The previous row said this
    service "holds NO per-user content and NO knowledge_objects corpus"; that
    stopped being true the moment fs-sync was ported, and it is corrected here
    rather than at the next audit. The mirror is READ-ONLY with respect to the
    user tree: the organ opens no file for writing, and every id and every
    visibility decision is derived from directory NAMES, never from filesystem
    ownership. Per-user data is duplicated from KEAP's identical mirror, from
    the same host source, so this adds a second COPY of an already-registered
    category — no new category of subject data enters the estate.
  legal_basis: legitimate_interests
  data_categories:
    - taxonomy_tree              # curated knowledge taxonomy + estate self-model
    - validate_requests          # agent-submitted programs, processed in-memory only
    - user_documents             # fs mirror: title, path, size, mtime, text excerpt (BODY_CAP 4000)
    - consolidator_datapoints    # capture queue rows fanned out from keap-consolidate
  data_subjects:
    - operators
    - tenant_users               # anyone with a per-user tree under tenants/<slug>/users
  # Not 0 any more: the mirror persists until its source file disappears, at
  # which point the pass prunes the object and pruneEmbeddings reaps its
  # vector. Deletion is therefore driven by the filesystem, not by a clock —
  # recorded as -1 ("retained while the source exists") rather than as a
  # horizon nothing enforces.
  retention_days: -1
  processors: []
  eu_residency: true
  transfers_outside_eu: false    # loopback-only host daemon; nothing leaves the box

# =============================================================================
# PULSE — the organ's mirror pass, then the S2 agreement harness
# =============================================================================
pulse:
  jobs:
    # ── the pass ─────────────────────────────────────────────────────────────
    # `cortex_fs_sync_interval_s` is 0 by design (the pass is a DECISION, and
    # §5.3's halt needs something haltable) — and the decision was missing. With
    # no interval, no job and a daemon the role restarts only when the plist
    # template changes, the organ's ONLY pass was its boot pass: the mirror froze
    # at the last converge that changed the build while KEAP re-walked every
    # 300 s. Every file created since then read as `only_in_keap` over a CLEAN
    # (just old) organ pass, so the harness blamed the organ's reader nightly and
    # the 3-night clock could never reach NIGHTS_REQUIRED.
    #
    # 04:30 UTC — after the consolidator (04:15), before keap-embed-sync (04:45),
    # so the night's new mirror rows have vectors by the time the diff reads both
    # corpora at 05:30. This is also the job §5.3's `--halt-cmd` disables.
    - name: cortex-fs-sync
      category: knowledge
      runner: subprocess
      command: "{{ playbook_dir }}/files/anatomy/scripts/cortex-fs-sync.py"
      schedule: "30 4 * * *"
      jitter_min: 2
      max_runtime_s: 900
      max_concurrent: 1
      env:
        # rw, not ro: a pass WRITES the corpus (upserts, and — behind five
        # guards and the mount sentinel — prunes).
        CORTEX_API_URL: "{{ cortex_fanout_url }}"
        CORTEX_AGENT_TOKEN_RW: "{{ cortex_rw_token }}"
        NOS_NOTIFY_BIN: "{{ playbook_dir }}/files/anatomy/scripts/nos-notify.sh"

    # ── the measurement ──────────────────────────────────────────────────────
    # Reads BOTH corpora over /agent/v1 only and records one night in the ledger.
    # It NEVER writes either store, and it never halts the incumbent: a target
    # that is down makes the night VOID (neither +1 nor a reset), because a
    # skipped night must not be able to advance a 3-night clock.
    #
    # 05:30 UTC — after keap-embed-sync (04:45) has run BOTH passes, so the diff
    # sees two corpora in their settled state rather than mid-embed.
    - name: cortex-corpus-diff
      category: knowledge
      runner: subprocess
      command: "{{ playbook_dir }}/files/anatomy/scripts/cortex-corpus-diff.py"
      schedule: "30 5 * * *"
      jitter_min: 5
      max_runtime_s: 600
      max_concurrent: 1
      env:
        # BARE tokens — the Pulse catalog does a LITERAL replace; Ansible
        # pre-renders the values.
        KEAP_API_URL: "http://127.0.0.1:{{ keap_port }}"
        KEAP_AGENT_TOKEN_RO: "{{ keap_agent_token_ro }}"
        CORTEX_API_URL: "{{ cortex_fanout_url }}"
        CORTEX_AGENT_TOKEN_RO: "{{ cortex_ro_token }}"
        NOS_NOTIFY_BIN: "{{ playbook_dir }}/files/anatomy/scripts/nos-notify.sh"
