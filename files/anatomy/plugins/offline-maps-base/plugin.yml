# =============================================================================
# offline-maps-base — service plugin (Track Q5 — content batch, 2026-05-07)
#
# Status: live. Wires `pazny.offline_maps` (tileserver-gl + MBTiles) into
# the plugin loader so it picks up health probes, observability labels,
# GDPR Article 30 row, and Wing /hub deep-link card without role-side
# imperatives.
#
# tileserver-gl serves vector + raster MBTiles offline (Wikipedia-style
# offline-first content delivery — cf. iiab stack mission). The base map
# is built by Planetiler for `maps_region`; the e2e probes read the style
# and the dataset back, so an empty tileserver is red.
#
# SSO posture: forward_auth at the Traefik layer. tileserver-gl has no
# native OIDC. No `authentik:` block here (Track Q5 doctrine).
# =============================================================================

name: offline-maps-base
version: 0.1.0
description: |
  Wiring layer for tileserver-gl: offline vector + raster map tiles served
  from MBTiles archives. Forward-auth gated at the Traefik proxy; no
  app-level authentication.
upstream: https://github.com/maptiler/tileserver-gl
license: BSD-3-Clause

type:
  - service
  - ui-extension

requires:
  role: pazny.offline_maps
  feature_flag: install_offline_maps
  variables:
    - maps_port
    - maps_domain
    - tenant_domain
    - host_alias

lifecycle:
  post_compose:
    - wait_health:
        # Loopback port bypasses forward-auth, so only a served style is healthy.
        url: "http://127.0.0.1:{{ maps_port | default(8070) }}/styles/liberty/style.json"
        timeout: 120
  post_blank:
    - remove_dir: "{{ maps_data_dir }}"

e2e:
  enabled: "{{ install_offline_maps | default(false) }}"
  probes:
    - name: liberty-style-is-served
      url: http://127.0.0.1:{{ maps_port }}/styles/liberty/style.json
      expect: {status: [200]}
    - name: basemap-tilejson-is-served
      url: http://127.0.0.1:{{ maps_port }}/data/basemap.json
      expect: {status: [200]}

observability:
  loki:
    labels:
      app: tileserver
      stack: iiab
      tier: "3"

gdpr:
  purpose: |
    The offline-maps tile server serves pre-rendered map tiles to browser
    clients. It processes tile request logs (bounding box, zoom level, tile
    coordinates) and hostname labels for operational monitoring of the map
    service (legitimate interest in service operation, Art. 6(1)(f)). The
    request logs can be attributed to browsing end-users; no account or
    identity data is collected.
  data_categories:
    - tile_request_logs              # bbox / zoom / tile coords requested
    - hostname_labels
  data_subjects:
    - operators
    - end_users                      # browser clients viewing offline maps
  legal_basis: legitimate_interests
  retention_days: 30
  processors: []
  eu_residency: true

ui-extension:
  hub_card:
    title: "Offline Maps"
    icon: map
    url: "https://{{ maps_domain }}/"
    tier: 3
    description: "Offline base map (OpenStreetMap, Planetiler-built)"
    health_check: "/"

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
