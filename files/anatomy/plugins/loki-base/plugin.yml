# =============================================================================
# loki-base — service plugin (Track Q1 — observability batch, 2026-05-04)
#
# Status: live. Extracts Loki's master config (`local-config.yaml`) out of
# `tasks/stacks/core-up.yml` rendering into a declarative plugin entry.
#
# Pre-Q1 shape:
#   files/observability/loki/local-config.yaml
#   tasks/stacks/core-up.yml task `Deploy Loki configuration`
#
# Post-Q1 shape:
#   files/anatomy/plugins/loki-base/provisioning/local-config.yaml.j2
#   plugin loader pre_compose hook renders it.
# =============================================================================

name: loki-base
version: 0.1.0
description: |
  Wiring layer for Loki (log aggregation): master config with retention,
  storage backend, schema config. Future Q1+ work extends this with per-
  service log labels (already partially declared in plugin observability
  blocks across woodpecker/qdrant/portainer/vaultwarden drafts).
upstream: https://grafana.com/oss/loki/
license: AGPL-3.0

# Backend daemon — log store queried via Grafana Explore, no browser-root UI.
# wing-base harvests this into backend-slugs.json so /hub suppresses the tile
# (phi-hub-card-icon-gap; was HubPresenter::BACKEND_ONLY_SLUGS).
kind: backend

type:
  - service

requires:
  role: pazny.loki
  feature_flag: install_observability
  variables:
    - loki_port
    - host_alias
    - tenant_domain

provisioning:
  config:
    template: provisioning/local-config.yaml.j2
    target: "{{ stacks_dir }}/observability/loki/local-config.yaml"

lifecycle:
  pre_compose:
    - ensure_dir: "{{ stacks_dir }}/observability/loki"
    - render: provisioning.config
  post_compose:
    - wait_health:
        url: "http://127.0.0.1:{{ loki_port | default(3100) }}/ready"
        timeout: 60
  post_blank:
    - remove_dir: "{{ stacks_dir }}/observability/loki"

observability:
  loki:
    labels:
      app: loki
      stack: observability
      tier: "1"

gdpr:
  purpose: |
    Loki is the platform log-aggregation backend. It stores log lines,
    hostname labels and request metadata (which may include user agents and
    source IPs harvested from nginx/Wing access logs) so the operator can
    search, correlate and debug across services (legitimate interest in
    service operation and security, Art. 6(1)(f)). End-user data appears
    incidentally inside ingested access-log lines; retention follows the Loki
    schema_config horizon (~30 days).
  data_categories:
    - log_lines
    - hostname_labels
    - request_metadata     # may include user agents, IPs from access logs
  data_subjects:
    - operators
    - end_users            # end-user requests appear in nginx/Wing access logs
  legal_basis: legitimate_interests
  retention_days: 30       # logs retained per Loki schema_config retention
  processors: []
  eu_residency: true

# Loki is a log-aggregation backend (no browser UI — operators query it via
# Grafana → Explore → Loki). No hub_card; the card URL 404'd. (2026-05-29 audit.)

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
