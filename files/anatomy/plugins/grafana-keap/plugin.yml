# =============================================================================
# grafana-keap — composition plugin (veins wiring, 2026-07-31)
#
# Sibling of grafana-wing. Wires keap-base (the cortex knowledge store) into
# grafana-base via a datasource provisioning fragment. Pure tendon: no service,
# no Authentik client, no compose extension of its own — the bind mount lives in
# roles/pazny.grafana beside the wing one, so plugin + datasource + mount are
# gated on the same condition and can never provision half-wired.
#
# WHY: table rows are invisible outside KEAP's own UI. `syncRows()` (roadmap B2)
# will materialise them as cortex objects, but even before that lands, the
# operator has no way to see what the knowledge layer actually contains without
# opening KEAP. Wing's store has had a Grafana view since 2026-05-30; the
# knowledge store has had none.
#
# WHAT THIS IS NOT: the `observability:` block in service manifests looks like it
# should do this job. It does not — 41 manifests declare it and the only atom
# with a live consumer is `loki.labels.stack`. `metrics_of_interest`,
# `observability.grafana.dashboards` and `alerts` have zero consumers each. The
# working path is a composition plugin that renders a provisioning fragment,
# which is what grafana-wing does and what this copies.
# =============================================================================

name: grafana-keap
version: 0.1.0
description: |
  Composition plugin: registers the KEAP cortex store as a Grafana datasource
  (uid=keap_sqlite, type frser-sqlite-datasource) so dashboards can read the
  taxonomy, typed relations, knowledge objects and DataTables rows directly
  from keap.db, bind-mounted read-only into the Grafana container at
  /var/lib/grafana/keap/keap.db by roles/pazny.grafana.
upstream: https://github.com/fr-ser/grafana-sqlite-datasource
license: AGPL-3.0  # follows the Grafana licensing of the consuming service

type:
  - composition

# =============================================================================
# REQUIRES — activation gate, not merely DAG ordering
# =============================================================================
# Renders only when BOTH grafana-base (install_observability) and keap-base
# (install_keap) are loaded, so a host without the cortex never gets a
# datasource pointing at a keap.db that is not there.

requires:
  plugin:
    - grafana-base
    - keap-base
  feature_flag: install_observability

# =============================================================================
# PROVISIONING — datasource fragment
# =============================================================================
# Grafana 9+ concatenates every `datasources:` list under
# provisioning/datasources/. Filename carries the plugin slug so
# `ls .../provisioning/datasources/` shows which plugin contributed what.

provisioning:
  datasource:
    template: provisioning/datasources/keap.yml.j2
    target: "{{ stacks_dir }}/observability/grafana/provisioning/datasources/keap.yml"

# =============================================================================
# LIFECYCLE HOOKS
# =============================================================================

lifecycle:
  pre_compose:
    - ensure_dir: "{{ stacks_dir }}/observability/grafana/provisioning/datasources"
    - render: provisioning.datasource
  post_blank:
    - remove_file: "{{ stacks_dir }}/observability/grafana/provisioning/datasources/keap.yml"

# =============================================================================
# GDPR — Article 30 row
#
# Compositions process no new data, but the schema requires a complete block and
# that is correct: this one widens WHO can read the knowledge store. Grafana is
# Tier-1 (admin); the cortex itself is header_oidc with per-user rows. A panel
# built on this datasource sees rows across users, so the register should say so
# rather than shrug because the plugin "stores nothing".
# =============================================================================

gdpr:
  purpose: |
    Composition wiring that provisions the keap.db SQLite datasource into
    Grafana so operators can observe the knowledge layer — taxonomy size and
    shape, typed relations, corpus objects, DataTables row counts — alongside
    the operational Wing dashboards (legitimate interest in service operation,
    Art. 6(1)(f)). It stores nothing itself; the retention horizon is owned by
    keap-base. Read-only, admin-tier access.
  data_categories:
    - knowledge_taxonomy          # nodes, descriptions, typed relations
    - knowledge_corpus_metadata   # object titles/ids mirrored from the filesystem
    - datatable_rows              # operator-authored business rows
  data_subjects:
    - operators
    - tenant_users
  legal_basis: legitimate_interests
  retention_days: 0               # stores nothing itself; horizon owned by keap-base
  processors: []
  eu_residency: true
  transfers_outside_eu: false
