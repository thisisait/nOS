---
# =============================================================================
# erpnext-base — service plugin (Q2 OIDC API scaffold, U8, 2026-05-04)
#
# Status: LIVE (Phase 2 C5 shipped 2026-05-12). The plugin loader post_compose
# runner executes this manifest's wiring. `roles/pazny.erpnext/tasks/post.yml`
# (~213 LOC) is NOT retired — still invoked at stack-up and runs idempotently
# ALONGSIDE the hook during the dual-safe transition.
#
# NOTE on SSO mode (D1.0 corrected 2026-05-05): pre-D1.0 the U8 worker
# followed CLAUDE.md "Proxy auth" list, but reality is native OIDC —
# `roles/pazny.erpnext/tasks/post.yml:139-198` installs a Frappe
# `Social Login Key` doctype (custom OAuth2 provider) using bench. Central
# `authentik_oidc_apps[slug=erpnext]` lists oauth2 with redirect_uri
# `/api/method/frappe.integrations.oauth2_logins.custom?provider=Authentik`
# and `post_setup: erpnext_bench`. → `mode: native_oidc`.
# =============================================================================

name: erpnext-base
version: 0.1.0
description: |
  Wiring layer for ERPNext (Frappe + Maria + Redis). Captures the bench-CLI
  sequence: configurator retry on first-run failure, idempotent
  `bench migrate` with stale-lock cleanup, frontend+backend restart, and
  Administrator password reconverge via `bench set-admin-password`.

  Role `pazny.erpnext` keeps install-only responsibilities; the 205-LOC
  post.yml moves into this manifest's `lifecycle.post_compose` once the
  loader's docker_exec runner ships (Phase 2 C5).
upstream: https://erpnext.com/
license: GPL-3.0

type:
  - service
  - ui-extension

requires:
  role: pazny.erpnext
  feature_flag: install_erpnext
  variables:
    - erpnext_domain
    - erpnext_site_name
    - erpnext_admin_password
    - erpnext_data_dir
    - mariadb_root_password
    - tenant_domain
    - host_alias
    - global_password_prefix

# ── DEPENDS_ON — service→service edges (docs/idea/13-relations.md, R1) ──────
# Transcribed from main.yml's two `Auto-enable <provider> for services that
# require it` blocks (MariaDB, Redis Docker) — the estate has held this as
# behaviour since before the graph existed. Compiled by
# tools/anatomy-graph-gen.py; the equivalence between the two representations
# is pinned by tests/anatomy/test_service_dependency_edges.py.
depends_on:
  - upstream: "service:mariadb"
    kind: data
    via: >-
      DB_HOST=mariadb on all five bench containers plus the configurator's
      `bench new-site --db-root-password`
      (roles/pazny.erpnext/templates/compose.yml.j2:32,47) — schema `erpnext`
    measured: "2026-08-07"
  - upstream: "service:redis"
    kind: data
    via: >-
      REDIS_CACHE/REDIS_QUEUE/REDIS_SOCKETIO at redis:6379/{0,1,2}, set both
      in the configurator and on every worker
      (roles/pazny.erpnext/templates/compose.yml.j2:34-36,51-52)
    measured: "2026-08-07"

# =============================================================================
# AUTHENTIK — native OIDC (Frappe Social Login Key)
# =============================================================================

authentik:
  mode: native_oidc
  provider_type: native_oidc
  client_id: nos-erpnext
  client_secret: "{{ nos_derived_secrets.oidc_erpnext }}"
  slug: erpnext
  name: 'ERPNext'
  enabled: "{{ install_erpnext | default(false) }}"
  redirect_uris:
    - "https://{{ erpnext_domain | default('erp' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/api/method/frappe.integrations.oauth2_logins.custom?provider=Authentik"
  launch_url: "https://{{ erpnext_domain | default('erp' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}"
  scopes:
    - openid
    - email
    - profile
  tier: 2                                # manager — per CLAUDE.md RBAC

# =============================================================================
# LIFECYCLE — declares the contract; loader runner lands in Phase 2 C5
# =============================================================================

lifecycle:
  post_compose:
    - wait_health: "http://127.0.0.1:{{ erpnext_port | default(8001) }}/api/method/frappe.ping"
    - replay_api_calls: hooks/post_compose.yml

  post_blank: []

# =============================================================================
# OBSERVABILITY
# =============================================================================

observability:
  loki:
    labels:
      app: erpnext
      stack: b2b
      tier: "2"

# =============================================================================
# UI-EXTENSION — Wing /hub deep-link card
# =============================================================================

ui-extension:
  hub_card:
    title: "ERPNext"
    icon: briefcase
    url: "https://{{ erpnext_domain }}"
    tier: 2
    description: "ERP / accounting / inventory"
    health_check: "/api/method/frappe.ping"

# =============================================================================
# GDPR — Article 30 row
# =============================================================================

gdpr:
  purpose: |
    ERPNext is the business ERP/CRM platform. It processes employee and
    customer identity metadata, financial records (invoices, expenses, GL
    entries), HR and payroll data, CRM customer/order data, and an audit log,
    in order to run the operator's accounting, HR and customer-relationship
    operations. Most of this is necessary to perform contracts with employees
    and customers (Art. 6(1)(b)), with statutory accounting-retention
    obligations driving the ~7-year horizon. Subjects include operators,
    tenant employees/customers (end-users), and third-party CRM contacts.
  data_categories:
    - identity_metadata                  # employee names, emails
    - financial_records                  # invoices, expenses, GL entries
    - hr_data                            # payroll, employee records
    - customer_data                      # CRM contacts, orders
    - audit_log_entries
  data_subjects:
    - operators
    - end_users                          # tenant employees / customers
    - third_parties                      # customer contacts in CRM
  legal_basis: contract
  retention_days: 2555                   # 7y per typical accounting law
  processors: []                  # self-hosted (mariadb is internal infra, not a processor)
  eu_residency: true

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
