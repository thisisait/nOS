# =============================================================================
# outline-base — service plugin (Track Q U5, Phase 1, 2026-05-04)
#
# Status: native-OIDC env vessel. Replaces the `authentik_oidc_apps` row for
# the `outline` slug. Today both this plugin's compose-extension AND the
# role-side env block render — Phase 2 C1 deletes the central list and the
# role-side block, leaving only this manifest.
#
# Doctrine: docs/bones-and-wings-refactor.md §1.1 (tendons & vessels).
# =============================================================================

name: outline-base
version: 0.1.0
description: |
  Wiring layer for Outline (collaborative wiki / docs). Carries Authentik
  native-OIDC env block (OIDC_CLIENT_ID/SECRET + AUTH/TOKEN/USERINFO URIs +
  scopes + NODE_EXTRA_CA_CERTS conditional) plus the mkcert CA volume
  conditional. Role `pazny.outline` keeps install primitives.
upstream: https://www.getoutline.com/
license: BSL-1.1   # Outline upstream; manifest is repo-licensed

type:
  - service

# =============================================================================
# REQUIRES
# =============================================================================

requires:
  role: pazny.outline
  feature_flag: install_outline
  variables:
    - outline_domain
    - outline_port
    - tenant_domain
    - host_alias
    - global_password_prefix

# ── DEPENDS_ON — service→service edges (docs/idea/13-relations.md, R1) ──────
# Transcribed from main.yml's two `Auto-enable <provider> for services that
# require it` blocks (PostgreSQL, Redis Docker) — the estate has held this as
# behaviour since before the graph existed. Compiled by
# tools/anatomy-graph-gen.py; the equivalence between the two representations
# is pinned by tests/anatomy/test_service_dependency_edges.py.
depends_on:
  - upstream: "service:postgresql"
    kind: data
    via: >-
      DATABASE_URL=postgres://…@postgresql:5432
      (roles/pazny.outline/templates/compose.yml.j2:23) — database `outline`
    measured: "2026-08-07"
  - upstream: "service:redis"
    kind: data
    via: >-
      REDIS_URL=redis://…@redis:6379 — websocket collaboration state
      (roles/pazny.outline/templates/compose.yml.j2:25)
    measured: "2026-08-07"

# =============================================================================
# AUTHENTIK — native OIDC client (replaces authentik_oidc_apps[slug=outline])
# =============================================================================

authentik:
  mode: native_oidc
  client_id: nos-outline
  client_secret: "{{ global_password_prefix }}_pw_oidc_outline"
  slug: outline
  name: 'Outline'
  enabled: "{{ install_outline | default(false) }}"
  redirect_uris:
    - "https://{{ outline_domain | default('wiki' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/auth/oidc.callback"
  launch_url: "https://{{ outline_domain | default('wiki' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}"
  scopes:
    - openid
    - profile
    - email
  tier: 3   # user — collaborative wiki for end users
  # ── SSO autologin (force-OIDC) — sso-autologin-plan.md Batch 3 (matice b) ─
  # Outline auto-redirects to OIDC by the ABSENCE of OIDC_DISABLE_REDIRECT —
  # there is no positive "force" env. So the mechanism is inverted vs the
  # Batch-1/2 services: autologin ON → DO NOT emit OIDC_DISABLE_REDIRECT
  # (upstream default = redirect straight to Authentik); autologin OFF → the
  # compose-extension emits OIDC_DISABLE_REDIRECT=true so the local login page
  # (with the "Continue with Authentik" button) stays the entry point.
  # PARTIAL: absence-of-env gives auto-redirect, but Outline cannot suppress
  # the post-logout return to its own login screen without a proxy/source mod —
  # a true forced-only redirect (no path back to a form) is not env-reachable.
  # Stays dormant behind sso_autologin=false; the compose-extension gates the
  # OIDC_DISABLE_REDIRECT emission on the SAME enable expression below.
  autologin:
    supports: "partial"      # upstream truth — absence-of-env auto-redirects; no env-only forced-only mode
    enabled: "{{ (sso_autologin_outline | default(sso_autologin_min_tier_3 | default(sso_autologin | default(false)))) | bool }}"
    hides_local_form: false  # auto-redirect only; Outline's login screen remains reachable (no env to hide it)
    break_glass: "set OIDC_DISABLE_REDIRECT=true + recreate"  # re-add the env (no live UI param) → login page returns

# =============================================================================
# COMPOSE-EXTENSION — secondary docker-compose override (OIDC env + mkcert CA)
# =============================================================================

compose_extension:
  template: templates/outline-base.compose.yml.j2
  target_stack: b2b
  target_service: outline

# =============================================================================
# LIFECYCLE HOOKS
# =============================================================================

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health: "http://127.0.0.1:{{ outline_port | default(3005) }}/_health"

gdpr:
  purpose: |
    Hosts the operator's Outline collaborative wiki. Stores documents,
    document revisions, comments, user accounts, and OIDC session data.
  legal_basis: legitimate_interests
  data_categories:
    - wiki_content
    - revision_history
    - comments
    - user_accounts
    - oauth_session_data
    - email
  data_subjects:
    - operators
    - end_users
  retention_days: 365
  processors: []
  eu_residency: true

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []

# ── Wing /hub card (ui-extension) ────────────────────────────────────────────
# Forward-ready deep-link card for the Wing hub (harvest pending). Matches the
# woodpecker-base/grafana-base shape. domain var is playbook-defined.
ui-extension:
  hub_card:
    title: Outline
    icon: wiki
    url: "https://{{ outline_domain }}"
    tier: 3
    description: Team wiki / knowledge base
    health_check: "https://{{ outline_domain }}"
