# =============================================================================
# hermes-base — service plugin (2026-06-08)
#
# Wires `pazny.hermes` (host launchd daemon + Ollama MLX backend, FastAPI web
# UI) into the proxy-auth doctrine. Without this manifest the Traefik router for
# hermes.<tld> ALREADY existed (auto-derived from state/manifest.yml's hermes
# entry with domain_var + port_var; roles/pazny.traefik/vars/main.yml sets
# `hermes: proxy` and hermes is NOT in traefik_skip_ids) but Authentik
# forward-auth had no registered Provider for that Host header → the embedded
# outpost returned 404. This plugin is the missing tendon — modelled on
# openclaw-base (Hermes's exact sibling: a host-launchd Ollama-backed agent
# daemon), kept lean (authentik + gdpr + notification, no lifecycle/provisioning
# /pulse — Hermes needs none yet).
#
# Tier 1 (admin) — Hermes is the operator's local cross-channel agent gateway;
# treat as admin-tier surface. RBAC tier is configurable per service via
# `authentik_app_tiers` in default.config.yml.
# =============================================================================

name: hermes-base
version: 0.1.0
description: |
  Hermes — local cross-channel AI agent gateway (launchd-managed Python daemon,
  FastAPI web UI) backed by Ollama 0.19+ with the MLX backend.

  This plugin owns the wiring layer: Traefik forward-auth gate, Authentik
  provider registration, GDPR Article 30 row. The role pazny.hermes owns the
  install primitives (uv venv, Ollama models, opt-in launchd web-UI daemon).
upstream: https://github.com/pazny-develop/nOS
license: AGPL-3.0

type:
  - service

# Defensive sentinel — pin the plugin slug for any tool that introspects
# manifests via the loader (P0.12 doctrine).
_NOS_PLUGIN: "hermes-base"

# =============================================================================
# REQUIRES
# =============================================================================

requires:
  role: pazny.hermes
  feature_flag: install_hermes
  variables:
    - hermes_domain
    - hermes_web_port
    - tenant_domain

# =============================================================================
# AUTHENTIK — proxy / forward-auth gate (Tier 1 = admin)
# =============================================================================
# Hermes's FastAPI web UI has NO native OIDC support — it binds loopback and
# authenticates nobody. Authentik gates access at the Traefik layer via the
# `authentik@file` middleware. After this plugin lands, Authentik blueprint
# render (10-oidc-apps.yaml.j2) creates a Proxy Provider with redirect_uri →
# hermes.<tld>/outpost.goauthentik.io/callback, the embedded outpost binds to
# it, and forward-auth no longer 404s.
authentik:
  mode: forward_auth
  provider_type: forward_auth
  client_id: nos-hermes
  client_secret: "{{ global_password_prefix }}_pw_oidc_hermes"
  slug: hermes
  name: 'Hermes'
  enabled: "{{ install_hermes | default(false) }}"
  launch_url: "https://{{ hermes_domain }}"
  tier: 1   # admin tier — operator's personal agent gateway
  # ── Autologin verdict (forward_auth) — sso-autologin-plan.md §forward_auth ──
  # NOT an `autologin` block: forward_auth gates the route, not identity, and an
  # autologin field would trip test_no_autologin_for_pure_proxy_services.
  _nos_autologin_verdict:
    supports: "no"                # forward_auth never carries autologin (gate-locked)
    second_login: "none at the web UI (Hermes FastAPI has no native auth screen)"
    elimination: header-provision-patch  # needs own-code patch (honest)
    detail: |
      Hermes is the operator's host-side agent gateway (launchd web-UI daemon).
      The Traefik authentik@file gate fronts hermes.<tld>; once through the gate
      the FastAPI web UI has no native login of its own, so SSO is effectively a
      true 0-click for the operator. There is no path to consume the
      X-Authentik-* headers Traefik forwards for per-user identity inside Hermes
      today. Since Hermes is nOS-wired code, the clean fix is a header-provision
      patch (teach the web UI to trust the forward-auth headers). Tier-1
      admin-only surface, so low urgency; left honestly as a header-provision
      patch rather than shipping a half-baked auth change.

# =============================================================================
# GDPR — Article 30 register row
# =============================================================================
gdpr:
  purpose: |
    Hermes is the operator's local cross-channel agent gateway. It receives
    prompts from the operator (web UI / CLI / — when explicitly enabled —
    messaging channels), forwards them to Ollama (running on the same host with
    the MLX backend), and returns generated text. No prompts or completions
    persist beyond the active request except Hermes's local FTS5 memory under
    ~/.hermes/ (operator-local, never leaves the host).

    EU-RESIDENCY CAVEAT: Hermes can OPTIONALLY delegate to the Anthropic API
    (US) or the Claude Code CLI when the operator sets hermes_anthropic_api_key
    / hermes_claude_code_enabled. Both are OFF by default (all-local Ollama). If
    the operator enables Anthropic delegation, prompts may be transferred to
    Anthropic (US) — update transfers_outside_eu + processors accordingly.
  legal_basis: "legitimate_interests"
  data_categories:
    - "operator_prompts"           # request bodies passed through to the model
    - "agent_run_metadata"         # if runs are POSTed to Wing /events post-run
    - "agent_memory"               # local FTS5 cross-session memory (~/.hermes/)
  data_subjects:
    - "operators"                  # the operator interacting with the gateway
  retention_days: 0                # no server-side persistence beyond local memory
  # all-local by default (Ollama on the same host); add "Anthropic PBC (US)" to
  # processors if the operator enables Anthropic API delegation.
  processors: []
  transfers_outside_eu: false      # default all-local; see EU-RESIDENCY CAVEAT above

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. Channels:
# wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
