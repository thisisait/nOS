# =============================================================================
# miniflux-base — service plugin (Q2 native_oidc_env batch B, U6).
# Native OIDC via OAUTH2_* env vars. RBAC tier 3 (user).
#
# Worker U6 wrote README + manifest.fragment.yml + compose-extension template
# but ran out of agent quota before generating plugin.yml. Operator-completed
# from the bookstack-base shape (same batch, same shape).
# =============================================================================

name: miniflux-base
version: 0.1.0
description: |
  Wiring layer for Miniflux RSS reader: Authentik native-OIDC vessel,
  mkcert CA mount conditional, GDPR Article 30 row, /hub card.
upstream: https://miniflux.app/
license: Apache-2.0

type:
  - service
  - ui-extension

requires:
  role: pazny.miniflux
  feature_flag: install_miniflux
  variables:
    - miniflux_domain
    - miniflux_port
    - tenant_domain
    - host_alias
    - global_password_prefix

# ── DEPENDS_ON — service→service edges (docs/idea/13-relations.md, R1) ──────
# Transcribed from main.yml's `Auto-enable PostgreSQL for services that require
# it` — the estate has held this as behaviour since before the graph existed.
# Compiled by tools/anatomy-graph-gen.py; the equivalence between the two is
# pinned by tests/anatomy/test_service_dependency_edges.py.
depends_on:
  - upstream: "service:postgresql"
    kind: data
    via: >-
      DATABASE_URL=postgres://…@postgresql:5432
      (roles/pazny.miniflux/templates/compose.yml.j2:18) — database `miniflux`
    measured: "2026-08-07"
  - upstream: "service:mailpit"
    kind: data
    via: >-
      SMTP_HOST="mailpit" (roles/pazny.miniflux/templates/compose.yml.j2:31) —
      the relay every Miniflux notification leaves through
    measured: "2026-08-07"
    unenforced: >-
      No auto-enable block turns Mailpit on for Miniflux. With it off, mail
      fails per-message inside Miniflux; the container stays healthy.

authentik:
  mode: native_oidc
  provider_type: oauth2
  client_id: nos-miniflux
  client_secret: "{{ nos_derived_secrets.oidc_miniflux }}"
  slug: miniflux
  name: 'Miniflux'
  enabled: "{{ install_miniflux | default(false) }}"
  redirect_uris:
    - "https://{{ miniflux_domain }}/oauth2/oidc/callback"
  launch_url: "https://{{ miniflux_domain }}"
  scopes:
    - openid
    - email
    - profile
  tier: 3
  # ── SSO autologin (force-OIDC) — sso-autologin-plan.md Batch 3 (partial) ─────
  # Miniflux is `partial` (conf 0.80): DISABLE_LOCAL_AUTH=1 hides the
  # username/password form AND blocks POST /login (upstream issue #2220), but
  # there is NO built-in auto-redirect — the login page then renders ONLY the
  # "Sign in with OpenID Connect" link, so a bare DISABLE_LOCAL_AUTH leaves the
  # operator one manual click away (or, if they hit a deep link, a near-blank
  # page). The missing auto-redirect is supplied OUT-OF-BAND by a Traefik
  # redirect middleware (roles/pazny.traefik dynamic config) that 302s
  # GET /login → /oauth2/oidc/redirect (the canonical Miniflux OAuth2-start
  # path: `GET /oauth2/{provider}/redirect`, provider=oidc). Both the env and
  # the middleware gate on the SAME enable expression below and stay dormant
  # behind sso_autologin=false by default.
  #
  # hides_local_form: true — DISABLE_LOCAL_AUTH removes the form entirely.
  # break_glass is NOT a runtime UI param: with the form gone there is no
  # reachable local login. The escape is to UNSET DISABLE_LOCAL_AUTH and
  # recreate the container (env-unset + recreate, not a query string) — see the
  # break-glass truth-table in sso-autologin-plan.md §"Bezpečnost". When this
  # gate is OFF the route is NOT touched (no middleware attached) — the service
  # behaves exactly as before.
  autologin:
    supports: "partial"      # form hides via env, but auto-redirect needs the Traefik middleware (no upstream auto-redirect)
    enabled: "{{ (sso_autologin_miniflux | default(sso_autologin_min_tier_3 | default(sso_autologin | default(false)))) | bool }}"
    hides_local_form: true   # DISABLE_LOCAL_AUTH removes the local login form (POST /login also blocked)
    break_glass: "unset DISABLE_LOCAL_AUTH + recreate (no runtime UI escape — form is env-hidden)"

compose_extension:
  template: templates/miniflux-base.compose.yml.j2
  target_stack: iiab
  target_service: miniflux

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health: "http://127.0.0.1:{{ miniflux_port | default(3011) }}/healthcheck"

gdpr:
  purpose: |
    Hosts the operator's RSS aggregator. Stores feed subscriptions,
    read/unread state, starred items, and the OIDC session link.
  legal_basis: legitimate_interests
  data_categories:
    - feed_subscriptions
    - read_state
    - oauth_session_data
    - email
  data_subjects:
    - operators
    - end_users
  retention_days: 365
  processors: []
  eu_residency: true

ui-extension:
  hub_card:
    title: "Miniflux"
    icon: rss
    url: "https://{{ miniflux_domain }}"
    tier: 3
    description: "RSS aggregator"
    health_check: "https://{{ miniflux_domain }}/healthcheck"

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
