---
# =============================================================================
# gitea-base — service plugin (Q2 OIDC API scaffold, U8, 2026-05-04)
#
# Status: SCAFFOLD. Declares the contract; the loader does not yet have a
# `post_compose api_calls` runner. Phase 2 C5 finalizes execution; until then
# `roles/pazny.gitea/tasks/post.yml` + `tasks/stacks/authentik_service_post.yml`
# remain the live wiring path. This plugin is the harvest target.
#
# Tendons captured:
#   • Admin user create + password reconverge   ← roles/pazny.gitea/tasks/post.yml
#   • Authentik OAuth source create/update      ← tasks/stacks/authentik_service_post.yml:1-79
#   • RBAC tier=2 (manager) per CLAUDE.md "RBAC" section
# =============================================================================

name: gitea-base
version: 0.1.0
description: |
  Wiring layer for Gitea: idempotent admin bootstrap (`gitea admin user create`
  + `change-password`) and Authentik OIDC OAuth-source registration via the
  /api/v1/admin/identity-providers Admin API. Native OIDC — surfaces a
  "Sign in with Authentik" button on Gitea's login page.

  Role `pazny.gitea` keeps install-only responsibilities (data dir + compose
  render). The 71-LOC post.yml + 79-LOC slice of authentik_service_post.yml
  collapse into this manifest's `lifecycle.post_compose` once the loader's
  api_calls runner ships (Phase 2 C5).
upstream: https://about.gitea.com/
license: MIT

type:
  - service
  - ui-extension

requires:
  role: pazny.gitea
  feature_flag: install_gitea
  variables:
    - gitea_domain
    - gitea_port
    - gitea_admin_user
    - gitea_admin_password
    - gitea_admin_email
    - tenant_domain
    - host_alias
    - global_password_prefix

# =============================================================================
# AUTHENTIK — native OIDC (Gitea Admin API)
# =============================================================================

authentik:
  # 2026-05-17: normalized from provider_type=oauth2 to the canonical
  # native_oidc mode. Functionally identical (blueprint already routes
  # everything non-proxy through the oauth2provider branch), but the
  # canonical-set anatomy gate now refuses any non-canonical mode label
  # so the per-CLAUDE.md mode-trichotomy stays single-spelling.
  mode: native_oidc
  provider_type: native_oidc
  client_id: nos-gitea
  client_secret: "{{ global_password_prefix }}_pw_oidc_gitea"
  slug: gitea
  name: 'Gitea'
  enabled: "{{ install_gitea | default(false) }}"
  redirect_uris:
    - "https://{{ gitea_domain }}/user/oauth2/authentik/callback"
  launch_url: "https://{{ gitea_domain }}"
  scopes:
    - openid
    - email
    - profile
  tier: 2                                # manager — per CLAUDE.md RBAC
  post_setup: gitea_admin_api            # see hooks/post_compose.yml
  # ── SSO autologin (force-OIDC) — sso-autologin-plan.md Batch 3 (matrix b) ───
  # Gitea hides the local username/password form via the SERVICE env toggles
  # (ENABLE_PASSWORD_SIGNIN_FORM=false + ENABLE_BASIC_AUTHENTICATION=false),
  # leaving only the "Sign in with Authentik" OAuth2 button. supports: yes is
  # honest for the FORM-HIDE capability — but there is NO auto-redirect upstream
  # (the user still clicks the button). Stays dormant behind sso_autologin=false
  # default; the compose-extension {% if %} gates on the SAME enable expression.
  #
  # CRITICAL caveat: the OIDC-backed admin MUST exist before the form is locked
  # (the gitea_admin_api post_setup hook provisions it) — flipping autologin on
  # before an admin exists + a healthy Authentik = lockout (no local login path).
  #
  # hides_local_form: true. break_glass is NOT a live UI param (the form is
  # env-hidden) — it is re-enable env + recreate: set sso_autologin_gitea=false
  # (or sso_autologin=false) and re-converge. Documented as env-unset+recreate
  # in docs/break-glass-runbook.md (NOT a ?query escape).
  autologin:
    supports: "yes"          # upstream truth — form-hide works cleanly; no auto-redirect
    enabled: "{{ (sso_autologin_gitea | default(sso_autologin_min_tier_2 | default(sso_autologin | default(false)))) | bool }}"
    hides_local_form: true   # ENABLE_PASSWORD_SIGNIN_FORM=false removes the local form
    break_glass: "re-enable ENABLE_PASSWORD_SIGNIN_FORM env + recreate (no live UI param)"

# =============================================================================
# COMPOSE-EXTENSION — secondary docker-compose override (SSO autologin gate)
# =============================================================================
# Loader renders templates/gitea-base.compose.yml.j2 into
#   {{ stacks_dir }}/devops/overrides/gitea-base.yml
# which the existing override-discovery loop in stack-up.yml picks up. This
# fragment carries ONLY the force-OIDC form-hide env (behind the autologin
# gate) — the OIDC client is registered via the Gitea Admin API, not env.

compose_extension:
  template: templates/gitea-base.compose.yml.j2
  target_stack: devops
  target_service: gitea

# =============================================================================
# LIFECYCLE — declares the contract; loader runner lands in Phase 2 C5
# =============================================================================

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health: "http://127.0.0.1:{{ gitea_port | default(3003) }}/api/v1/version"
    - replay_api_calls: hooks/post_compose.yml

  post_blank: []

# =============================================================================
# OBSERVABILITY
# =============================================================================

observability:
  loki:
    labels:
      app: gitea
      stack: devops
      tier: "2"

# =============================================================================
# UI-EXTENSION — Wing /hub deep-link card
# =============================================================================

ui-extension:
  hub_card:
    title: "Gitea"
    icon: git
    url: "https://{{ gitea_domain }}"
    tier: 2
    description: "Self-hosted Git service"
    health_check: "/api/v1/version"

# =============================================================================
# GDPR — Article 30 row
# =============================================================================

gdpr:
  purpose: |
    Gitea is the self-hosted Git forge. It processes developer identity
    metadata (username, email, full name), authentication credentials
    (password hash, OAuth tokens), user-authored source code repositories, and
    an activity audit log (push events, login history), in order to provide
    source-code hosting and collaboration to tenant developers. Providing the
    forge to a registered developer is contractual (Art. 6(1)(b)). Accounts
    persist while active; deletion is handled via the Art-17 erasure path.
  data_categories:
    - identity_metadata                  # username, email, full name
    - authentication_credentials         # password hash, OAuth tokens
    - source_code                        # user-authored repos
    - audit_log_entries                  # push events, login history
  data_subjects:
    - operators
    - end_users                          # tenant developers (Tier 2 RBAC)
  legal_basis: contract
  retention_days: -1                     # active accounts kept; deletion via DSAR
  processors: []                  # self-hosted; no third-party (Art. 30) processor
  eu_residency: true

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
