---
# =============================================================================
# gitea-base / hooks/post_compose.yml
#
# Declarative API-call sequence replayed by the plugin loader's
# `replay_api_calls` runner. Each entry mirrors a task in
# roles/pazny.gitea/tasks/post.yml or tasks/stacks/authentik_service_post.yml
# so the harvest is byte-traceable during the final role-thinning pass.
#
# SHAPE: same as portainer-base/plugin.yml `api_calls` block — base_url +
# tls_verify + retries + sequence[].
# =============================================================================

base_url: "http://127.0.0.1:{{ gitea_port | default(3003) }}"
tls_verify: false                        # localhost loopback
retries:
  max: 30
  delay_seconds: 2

sequence:
  # Phase 1 — admin bootstrap (CLI, not REST: Gitea has no admin-init API)
  # Maps to roles/pazny.gitea/tasks/post.yml lines 13-71.
  - id: wait_api_ready
    method: GET
    path: /api/v1/version
    expect_status: 200
    timeout_seconds: 60

  - id: check_admin_exists
    runner: docker_exec                  # CLI fallback for non-REST steps
    container: gitea
    compose_project: devops
    cmd: >
      gitea admin user list --admin
    expect_substring: "{{ gitea_admin_user | default(ansible_facts['user_id']) }}"
    register: _gitea_admin_exists

  - id: create_admin
    when: "_gitea_admin_exists.rc != 0"
    runner: docker_exec
    container: gitea
    compose_project: devops
    cmd: >
      gitea admin user create
      --username "{{ gitea_admin_user | default(ansible_facts['user_id']) }}"
      --password "{{ gitea_admin_password }}"
      --email "{{ gitea_admin_email | default(gitea_admin_user + '@localhost') }}"
      --admin --must-change-password=false

  - id: reconverge_admin_password
    when: "_gitea_admin_exists.rc == 0"
    runner: docker_exec
    container: gitea
    compose_project: devops
    cmd: >
      gitea admin user change-password
      --username "{{ gitea_admin_user | default(ansible_facts['user_id']) }}"
      --password "{{ gitea_admin_password }}"
      --must-change-password=false
    notify: Restart gitea

  # Phase 2 — Authentik OAuth source via Admin API
  # Maps to tasks/stacks/authentik_service_post.yml lines 1-79.
  - id: list_oauth_sources
    when: "install_authentik | bool"
    method: GET
    path: /api/v1/admin/identity-providers
    auth:
      type: basic
      username: "{{ gitea_admin_user }}"
      password: "{{ gitea_admin_password }}"
    register: _gitea_oauth_sources

  - id: create_authentik_source
    when: >
      install_authentik | bool
      and _gitea_oauth_sources.status == 200
      and (_gitea_oauth_sources.body | selectattr('name', 'equalto', 'authentik') | list | length) == 0
    method: POST
    path: /api/v1/admin/identity-providers
    auth:
      type: basic
      username: "{{ gitea_admin_user }}"
      password: "{{ gitea_admin_password }}"
    body:
      type: oauth2
      name: authentik
      config:
        provider: openidConnect
        client_id: "nos-gitea"
        client_secret: "{{ global_password_prefix }}_pw_oidc_gitea"
        open_id_connect_auto_discovery_url: "https://{{ authentik_domain }}/application/o/gitea/.well-known/openid-configuration"
        # Group → admin sync: Authentik's profile scope emits the user's group
        # names in `groups`, so a tier-1 (nos-admins) Authentik user becomes a
        # Gitea admin on OIDC login — no manual promotion. Derived from
        # authentik_rbac_tiers (last tier-1 group = the admin group).
        group_claim_name: "groups"
        admin_group: "{{ (authentik_rbac_tiers | selectattr('tier', 'equalto', 1) | map(attribute='groups') | first | default(['nos-admins'])) | last }}"

  - id: update_authentik_source
    when: >
      install_authentik | bool
      and _gitea_oauth_sources.status == 200
      and (_gitea_oauth_sources.body | selectattr('name', 'equalto', 'authentik') | list | length) > 0
    method: PATCH
    # Resolve the source id inline from the registered list (the replay runner
    # renders paths against the registers map). The old `{{ _gitea_ak_source_id }}`
    # was never registered in this sequence → rendered empty → PATCH to a
    # path with no id. (A19 latent fix, 2026-05-23.)
    path: "/api/v1/admin/identity-providers/{{ (_gitea_oauth_sources.body | selectattr('name', 'equalto', 'authentik') | list | first | default({})).id | default(0) }}"
    auth:
      type: basic
      username: "{{ gitea_admin_user }}"
      password: "{{ gitea_admin_password }}"
    body:
      config:
        client_id: "nos-gitea"
        client_secret: "{{ global_password_prefix }}_pw_oidc_gitea"
        open_id_connect_auto_discovery_url: "https://{{ authentik_domain }}/application/o/gitea/.well-known/openid-configuration"
        # Group → admin sync (reconverged on every run; see create body above).
        group_claim_name: "groups"
        admin_group: "{{ (authentik_rbac_tiers | selectattr('tier', 'equalto', 1) | map(attribute='groups') | first | default(['nos-admins'])) | last }}"
    notify: Restart gitea
