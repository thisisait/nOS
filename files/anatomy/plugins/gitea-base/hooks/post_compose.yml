---
# =============================================================================
# gitea-base / hooks/post_compose.yml
#
# Declarative API-call sequence replayed by the plugin loader's
# `replay_api_calls` runner. Each entry mirrors a task in
# roles/pazny.gitea/tasks/post.yml or tasks/stacks/authentik_service_post.yml
# so the harvest is byte-traceable during the final role-thinning pass.
#
# SHAPE: same as portainer-base/plugin.yml `api_calls` block — base_url +
# tls_verify + retries + sequence[].
# =============================================================================

base_url: "http://127.0.0.1:{{ gitea_port | default(3003) }}"
tls_verify: false                        # localhost loopback
retries:
  max: 30
  delay_seconds: 2

sequence:
  # Phase 1 — admin bootstrap (CLI, not REST: Gitea has no admin-init API)
  # Maps to roles/pazny.gitea/tasks/post.yml lines 13-71.
  - id: wait_api_ready
    method: GET
    path: /api/v1/version
    expect_status: 200
    timeout_seconds: 60

  - id: check_admin_exists
    runner: docker_exec                  # CLI fallback for non-REST steps
    container: gitea
    compose_project: devops
    cmd: >
      gitea admin user list --admin
    expect_substring: "{{ gitea_admin_user | default(ansible_facts['user_id']) }}"
    register: _gitea_admin_exists

  - id: create_admin
    when: "_gitea_admin_exists.rc != 0"
    runner: docker_exec
    container: gitea
    compose_project: devops
    cmd: >
      gitea admin user create
      --username "{{ gitea_admin_user | default(ansible_facts['user_id']) }}"
      --password "{{ gitea_admin_password }}"
      --email "{{ gitea_admin_email | default(gitea_admin_user + '@localhost') }}"
      --admin --must-change-password=false

  - id: reconverge_admin_password
    when: "_gitea_admin_exists.rc == 0"
    runner: docker_exec
    container: gitea
    compose_project: devops
    cmd: >
      gitea admin user change-password
      --username "{{ gitea_admin_user | default(ansible_facts['user_id']) }}"
      --password "{{ gitea_admin_password }}"
      --must-change-password=false
    notify: Restart gitea

  # Phase 2 — Authentik OAuth source via the gitea CLI.
  # Gitea has NO REST endpoint for auth sources at ANY version — the old
  # POST /api/v1/admin/identity-providers 404'd silently (root-caused
  # 2026-06-13). Canonical path: `gitea admin auth add-oauth`. Mirrors
  # tasks/stacks/authentik_service_post.yml. The replay runner splits cmd on
  # whitespace and has no shell, so it cannot pipe to parse the numeric source
  # id that `update-oauth --id` needs — the hook does create-if-absent; secret
  # rotation/reconverge is owned by the role path. Bare (unquoted) tokens only:
  # the derived secret + discovery URL + group names contain no spaces, so
  # cmd.split() yields clean argv.
  - id: list_oauth_sources
    when: "install_authentik | bool"
    runner: docker_exec
    container: gitea
    compose_project: devops
    user: git
    cmd: gitea admin auth list
    register: _gitea_oauth_sources

  - id: create_authentik_source
    when: >
      install_authentik | bool
      and 'authentik' not in (_gitea_oauth_sources.stdout | default(''))
    runner: docker_exec
    container: gitea
    compose_project: devops
    user: git
    cmd: >
      gitea admin auth add-oauth --name authentik --provider openidConnect
      --key nos-gitea --secret {{ global_password_prefix }}_pw_oidc_gitea
      --auto-discover-url https://{{ authentik_domain }}/application/o/gitea/.well-known/openid-configuration
      --scopes openid --scopes profile --scopes email
      --group-claim-name groups
      --admin-group {{ (authentik_rbac_tiers | selectattr('tier', 'equalto', 1) | map(attribute='groups') | first | default(['nos-admins'])) | last }}
    notify: Restart gitea
