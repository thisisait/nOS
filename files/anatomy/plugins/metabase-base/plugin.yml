# =============================================================================
# metabase-base — service plugin (Q2, U6 — pivoted to forward_auth).
#
# PIVOT NOTE: Metabase OSS does not support OIDC (SAML/JWT/OIDC live in
# Metabase Enterprise / paid tier). Inspection of role compose template
# confirms no AUTH/OIDC env vars. Pivot to forward_auth (matches U7 shape).
# RBAC tier 2 (manager) per CLAUDE.md.
# =============================================================================

name: metabase-base
version: 0.1.0
description: |
  Wiring layer for Metabase: Authentik forward-auth gate (Traefik
  middleware), GDPR Article 30 row, /hub card. Metabase OSS has no
  native OIDC; gate is access-control only.
upstream: https://www.metabase.com/
license: AGPL-3.0

type:
  - service
  - ui-extension

requires:
  role: pazny.metabase
  feature_flag: install_metabase
  variables:
    - metabase_domain
    - metabase_port
    - tenant_domain
    - host_alias

# ── DEPENDS_ON — service→service edges (docs/idea/13-relations.md, R1) ──────
# Transcribed from main.yml's `Auto-enable PostgreSQL for services that require
# it` — the estate has held this as behaviour since before the graph existed.
# Compiled by tools/anatomy-graph-gen.py; the equivalence between the two is
# pinned by tests/anatomy/test_service_dependency_edges.py.
depends_on:
  - upstream: "service:postgresql"
    kind: data
    via: >-
      MB_DB_TYPE=postgres + MB_DB_HOST=postgresql
      (roles/pazny.metabase/templates/compose.yml.j2:23,28) — database
      `metabase`
    measured: "2026-08-07"

authentik:
  mode: forward_auth
  provider_type: forward_auth
  client_id: nos-metabase
  client_secret: "{{ nos_derived_secrets.oidc_metabase }}"
  slug: metabase
  name: 'Metabase'
  enabled: "{{ install_metabase | default(false) }}"
  external_host: "https://{{ metabase_domain }}"
  internal_host: "http://metabase:{{ metabase_port }}"
  cookie_domain: ".{{ tenant_domain }}"
  tier: 2

  target_stack: data

# =============================================================================
# OBSERVABILITY — the Loki label set, and the stack this plugin belongs to
# =============================================================================
# ADDED 2026-08-31 for the SECOND half, which is the one with teeth.
#
# `load_plugins._plugin_stack` resolves a plugin's stack from
# `compose_extension.target_stack` first and this label second, and `run_hook`
# skips a plugin only when `pstack is not None and pstack not in stack_filter`.
# So a plugin with NO resolvable stack is never filtered out: its lifecycle
# hooks ran on EVERY stack-scoped pass, doing work for a service that pass was
# not bringing up. This plugin had hooks and no stack.
#
# Not new metadata — the fact was already recorded elsewhere:
#     state/manifest.yml gives metabase stack: data
#
# The log labels themselves are close to free: Alloy discovers ALL containers
# over the Docker socket and derives `container` / `compose_project` /
# `compose_service` by relabel, so logs already reach Loki with their stack
# whether or not a plugin says anything. `metrics`/`dashboard` are deliberately
# omitted — they are metadata with no aggregator today
# (files/anatomy/docs/plugin-wiring-capabilities.md).
observability:
  loki:
    labels:
      app: metabase
      stack: data

lifecycle:
  pre_compose: []
  post_compose:
    - wait_health: "http://127.0.0.1:{{ metabase_port }}/api/health"

gdpr:
  purpose: |
    Hosts the operator's Metabase BI dashboards. Stores question /
    dashboard / collection metadata, query history, user accounts.
  legal_basis: legitimate_interests
  data_categories:
    - dashboard_definitions
    - query_history
    - user_accounts
  data_subjects:
    - operators
  retention_days: 365
  processors: []
  eu_residency: true

ui-extension:
  hub_card:
    title: "Metabase"
    icon: pie-chart
    url: "https://{{ metabase_domain }}"
    tier: 2
    description: "BI dashboards"
    health_check: "https://{{ metabase_domain }}/api/health"

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
