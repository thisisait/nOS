# =============================================================================
# wing-base — service plugin (Q2 proxy-auth batch, 2026-05-04)
#
# Status: live manifest. Wires `pazny.wing` into the proxy-auth doctrine —
# Authentik forward-auth via Traefik middleware (no native OIDC).
#
# Tier 1 (admin) per CLAUDE.md RBAC mapping. Forward-auth gates
# access at the proxy layer; the service still renders its own login UI
# (or, for stateless services, the Authentik session IS the auth).
# =============================================================================

name: wing-base
version: 0.1.0
description: |
  Wing — security-research dashboard (FrankenPHP host daemon).

  Wiring layer for proxy-authenticated access via Authentik forward-auth
  (Traefik middleware `authentik@file`). The role `pazny.wing` keeps install-
  only responsibilities (image, ports, volumes); this plugin owns the
  Traefik labels + Authentik tier binding + GDPR Article 30 row + Wing
  /hub deep-link card.
upstream: https://github.com/pazny-develop/nOS
license: AGPL-3.0  # plugin manifest is repo-licensed

type:
  - service
  - ui-extension

# Defensive sentinel — pin the plugin slug for any tool that introspects
# manifests via the loader (P0.12 doctrine).
_NOS_PLUGIN: "wing-base"

# =============================================================================
# REQUIRES
# =============================================================================

requires:
  role: pazny.wing
  feature_flag: install_wing
  variables:
    - wing_port
    - wing_domain
    - tenant_domain
    - host_alias

# =============================================================================
# AUTHENTIK — proxy / forward-auth gate (Tier 1 = admin)
# =============================================================================
# This service has NO native OIDC support — Authentik gates access at
# the Traefik layer via the `authentik@file` middleware. RBAC tier
# determines which Authentik group expression policy applies.

# ── DEPENDS_ON — service→service edges (docs/idea/13-relations.md, R2) ──────
depends_on:
  - upstream: "service:bone"
    kind: data
    via: >-
      NOS_BONE_PORT + NOS_BONE_SECRET in the launchd environment
      (roles/pazny.wing/tasks/post.yml:414-416, rendered into
      roles/pazny.wing/templates/wing.plist.j2:68) — Bone is the HMAC event
      vein every Ansible run writes through on its way to wing.db
    measured: "2026-08-07"
    unenforced: >-
      No auto-enable block ties install_bone to install_wing. With Bone down
      the callback plugin falls back to ~/.nos/events.jsonl, so the estate
      keeps converging and the timeline quietly stops growing.
  - upstream: "service:keap"
    kind: data
    via: >-
      NOS_KEAP_PORT / the KEAP agent API base in wing.env.j2:31 and
      wing.plist.j2:77-82 — Wing's knowledge panels query /agent/v1
    measured: "2026-08-07"
    unenforced: >-
      No auto-enable block ties install_keap to install_wing; the panels render
      their empty state.
  - upstream: "service:prometheus"
    kind: data
    via: >-
      NOS_PROMETHEUS_PORT (roles/pazny.wing/tasks/post.yml:420) — the
      alert-relay-base Pulse job polls Prometheus for firing alerts (2026-08-05)
    measured: "2026-08-07"
    unenforced: >-
      Prometheus rides install_observability, which no block ties to
      install_wing. With it absent the relay job runs and finds no alerts,
      which is indistinguishable from a quiet estate — the alert path's own
      absence-as-calm, recorded here rather than fixed here.

authentik:
  mode: forward_auth                          # nOS doctrine label (provider_type below = canonical)
  provider_type: forward_auth                 # schema-canonical (state/schema/plugin.schema.json)
  client_id: nos-wing
  client_secret: "{{ global_password_prefix }}_pw_oidc_wing"
  slug: wing
  name: 'Wing'
  enabled: "{{ install_wing | default(false) }}"
  launch_url: "https://{{ wing_domain }}"
  tier: 1

# =============================================================================
# COMPOSE-EXTENSION — Traefik labels (forward-auth middleware)
# =============================================================================
# Wing runs as a host launchd daemon (FrankenPHP, anatomy A3.5)
# — there is NO Docker stack to extend. Traefik file-provider
# derives the wing.<tld> route from state/manifest.yml's
# host-mode path; this plugin owns the proxy-auth gate + GDPR
# row + Wing /hub card only. The compose template under
# templates/wing-base.compose.yml.j2 is a sentinel (empty
# services map) kept on disk for tooling that walks the
# canonical plugin layout.

# =============================================================================
# LIFECYCLE HOOKS
# =============================================================================
# Wing itself is a host launchd daemon (FrankenPHP) provisioned by
# roles/pazny.wing/tasks/main.yml — no Docker compose surface. The single
# post_compose action below renders the A9.5 notification-routing sidecar
# (derived from peer plugins' `notification:` blocks); see the AGGREGATES
# block for the harvest spec. Readiness for the daemon itself is the
# launchd KeepAlive contract, not an HTTP probe.

# =============================================================================
# AGGREGATES — notification routing (Anatomy A9.5, 2026-05-16)
#
# Harvest every peer plugin's `notification:` block into
# inputs.notification_routing. Each entry is a per-severity → channel-list
# map; the post_compose action below renders the flat list into a JSON
# sidecar Wing reads at runtime, and Bone's notification insert path
# falls back to the routing when the emitter omits explicit channels.
#
# A plugin opts in by adding to its manifest:
#   notification:
#     on_critical: [wing-inbox, ntfy, mail]
#     on_high:     [wing-inbox, ntfy]
#     on_medium:   [wing-inbox]
#     on_low:      []
#     on_info:     []
# =============================================================================

aggregates:
  - from: consumer_block
    block_path: notification
    output_var: notification_routing
  - from: agent_profile
    block_path: notification
    output_var: notification_routing
  # P1a (2026-05-29): harvest every peer plugin's ui-extension block (the
  # hub_card metadata, authored on 49 plugins) so the /hub renders them
  # plugin-driven + RBAC-aware. The loader's feature-flag gate means only
  # INSTALLED services are harvested; _deep_render resolves the card url
  # against the live domain vars.
  - from: consumer_block
    block_path: ui-extension
    output_var: hub_cards
  # phi-hub-card-icon-gap (2026-06-14): harvest each installed peer's top-level
  # `kind: backend` flag so /hub suppresses tiles for services with a domain
  # route but no browser-root UI (daemons / APIs / OGC endpoints). Replaces the
  # hardcoded HubPresenter::BACKEND_ONLY_SLUGS allow-list — a new backend plugin
  # now auto-hides via its manifest, no PHP edit. Feature-flag gated like the
  # hub_card harvest, so a disabled backend never lands in the sidecar.
  - from: consumer_kind
    block_path: kind
    output_var: backend_kinds

# Render target for the routing sidecar (read by Bone's clients/wing.py at
# notification-insert time when the emitter omits explicit channels).
provisioning:
  notification_routing:
    template: templates/notification-routing.json.j2
    target: "{{ wing_home }}/app/data/notification-routing.json"
  # P1a: plugin-harvested hub cards (the /hub renders these, RBAC-filtered by
  # the viewer's tier). Read by App\Model\HubCardRepository.
  hub_cards:
    template: templates/hub-cards.json.j2
    target: "{{ wing_home }}/app/data/hub-cards.json"
  # phi-hub-card-icon-gap: the harvested `kind: backend` slugs, read by
  # HubPresenter to suppress non-clickable tiles (dynamic allow-list).
  backend_slugs:
    template: templates/backend-slugs.json.j2
    target: "{{ wing_home }}/app/data/backend-slugs.json"

lifecycle:
  post_compose:
    - render: provisioning.notification_routing
    - render: provisioning.hub_cards
    - render: provisioning.backend_slugs

# =============================================================================
# PULSE JOB — notification dispatch worker (Anatomy A9, 2026-05-16)
#
# Flushes the wing.db.notifications table to ntfy + mail. Idempotent —
# per-row dispatched_at marker is the lock; partial failures stamp the
# error column and re-try on the next tick (Pulse polls every minute).
# =============================================================================

pulse:
  jobs:
    - name: dispatch-notifications
      category: notification
      runner: subprocess
      command: "/opt/homebrew/bin/php"
      args:
        - "{{ wing_app_dir }}/bin/dispatch-notifications.php"
      schedule: "* * * * *"        # every minute; cheap when queue is empty
      jitter_min: 0
      max_runtime_s: 30
      max_concurrent: 1
      env:
        WING_DB_PATH: "{{ wing_home }}/app/data/wing.db"
        NTFY_URL: "{{ ntfy_url }}"
        # Publish credential (2026-08-08). ntfy's auth was UNCONFIGURED — no
        # auth-file, so the declared `deny-all` did nothing and this job
        # published anonymously to a port anyone could also SUBSCRIBE to. With
        # auth on, an anonymous POST is 403, so the job needs an identity: a
        # write-only-on-nos-* user, never the admin.
        # BARE tokens — no `| default()`. The catalog builder does LITERAL
        # substitution, not Jinja, so a filtered token reaches Wing verbatim and
        # is rejected with a bare 400. Two gates say so; both caught this.
        NTFY_PUBLISH_USER: "{{ ntfy_publisher_user }}"
        NTFY_PUBLISH_PASSWORD: "{{ ntfy_publisher_password }}"
        # Mail target — Stalwart (production) when install_smtp_stalwart is on,
        # else mailpit (dev sink). The TLS_MODE + USERNAME + PASSWORD trio
        # tells the dispatch worker which SMTP dance to do; mailpit is raw
        # SMTP, Stalwart requires STARTTLS on submission port 587 + AUTH LOGIN.
        # See files/anatomy/wing/bin/dispatch-notifications.php::_smtp_open_session.
        MAIL_HOST: "{{ mail_host }}"
        MAIL_PORT: "{{ mail_port }}"
        MAIL_TLS_MODE: "{{ mail_tls_mode }}"
        MAIL_USERNAME: "{{ mail_username }}"
        MAIL_PASSWORD: "{{ mail_password }}"
        # Operators with a self-signed dev cert can set mail_tls_verify=false.
        MAIL_TLS_VERIFY: "{{ mail_tls_verify_flag }}"
        MAIL_FROM: "{{ mail_from }}"
        MAIL_RECIPIENT: "{{ mail_recipient }}"
        DISPATCH_BATCH_LIMIT: "50"
        # A9 daily-digest (2026-05-17): severities AT OR BELOW this floor
        # ("medium" → medium+low+info) queue for digest instead of immediate
        # mail. Critical/high stay immediate. Set to "none" to disable
        # digest behavior entirely (every severity fires immediate).
        DISPATCH_MAIL_DIGEST_FLOOR: "{{ mail_digest_floor_val }}"
    # ── A9 daily-digest flush ─────────────────────────────────────────────
    # Companion to dispatch-notifications. Once a day (09:00 UTC by default)
    # batches every row queued via mail_digest_window into ONE summary email.
    # Set mail_digest_floor: none in operator config to disable; this job
    # then no-ops cleanly when the digest queue is always empty.
    - name: dispatch-notifications-digest
      category: notification
      runner: subprocess
      command: "/opt/homebrew/bin/php"
      args:
        - "{{ wing_app_dir }}/bin/dispatch-notifications.php"
      schedule: "{{ mail_digest_cron }}"   # bare token (catalog can't render filters); resolved via NOS_MAIL_DIGEST_CRON
      jitter_min: 5
      max_runtime_s: 60
      max_concurrent: 1
      env:
        WING_DB_PATH: "{{ wing_home }}/app/data/wing.db"
        NTFY_URL: ""               # digest job is mail-only
        MAIL_HOST: "{{ mail_host }}"
        MAIL_PORT: "{{ mail_port }}"
        MAIL_TLS_MODE: "{{ mail_tls_mode }}"
        MAIL_USERNAME: "{{ mail_username }}"
        MAIL_PASSWORD: "{{ mail_password }}"
        MAIL_TLS_VERIFY: "{{ mail_tls_verify_flag }}"
        MAIL_FROM: "{{ mail_from }}"
        MAIL_RECIPIENT: "{{ mail_recipient }}"
        DISPATCH_DIGEST_FLUSH: "1"
    # ── Audit-chain integrity verify (gov P1) ─────────────────────────────
    # Daily walk of the wing.db hash-chain; caches the verdict into
    # audit_chain_meta (--write-verdict) for the Wing header badge. Harmless
    # when the chain is off (all-unsigned -> ok, badge hidden by its env gate).
    # Needs WING_EVENTS_HMAC_SECRET to compute the key (else exits 3, no write).
    - name: audit-chain-verify
      category: compliance
      runner: subprocess
      command: "/opt/homebrew/bin/php"
      args:
        - "{{ wing_app_dir }}/bin/verify-audit-chain.php"
        - "--db={{ wing_home }}/app/data/wing.db"
        - "--json"
        - "--write-verdict"
      schedule: "17 4 * * *"        # daily 04:17 UTC; off-peak
      jitter_min: 10
      max_runtime_s: 120
      max_concurrent: 1
      env:
        WING_EVENTS_HMAC_SECRET: "{{ bone_secret }}"   # bare token (catalog literal-replace)
        # The key ring. THIS job is the one that would go red the morning after
        # a rotation without it — every pre-rotation row unverifiable under the
        # new key. Verify-only; the writer never reads it.
        WING_EVENTS_HMAC_SECRET_RETIRED: "{{ bone_secret_retired }}"
    # ── Daily agent-cost tally (readiness item 2, 2026-08-12) ─────────────
    # pulse-run-agent.sh persists cost_usd + cost_basis into every
    # agent_run_end event; this job is the reader that makes the number seen.
    # It sums the last 24h of TRUTHFUL (basis=anthropic) spend, tallies tokens
    # for every run, and fires an A9 notification above the floor OR whenever a
    # run was unpriced (a foreign backend) — so foreign-backend spend can never
    # accumulate in silence. All-literal env (no new catalog token, so no
    # double-allowlist to keep in sync); floor/window are plain values.
    - name: agent-cost-tally
      category: platform
      runner: subprocess
      command: "{{ playbook_dir }}/files/anatomy/scripts/agent-cost-tally.py"
      schedule: "23 6 * * *"        # daily 06:23 UTC; after the night's agent runs
      jitter_min: 5
      max_runtime_s: 60
      max_concurrent: 1
      env:
        WING_DATA_DIR: "{{ wing_home }}/app/data"
        # bare token (catalog literal-replace) — WING_EVENTS_HMAC_SECRET signs
        # the /api/v1/notifications POST exactly as pulse-run-agent.sh does.
        WING_EVENTS_HMAC_SECRET: "{{ bone_secret }}"
        NOS_COST_TALLY_WINDOW_H: "24"
        NOS_COST_TALLY_FLOOR_USD: "5.00"

# =============================================================================
# OBSERVABILITY — Loki labels (forward-auth has no /metrics natively)
# =============================================================================

observability:
  loki:
    labels:
      app: wing
      stack: host
      tier: "1"

# =============================================================================
# GDPR — Article 30 register row
# =============================================================================

gdpr:
  purpose: |
    Operator-hosted security-research dashboard (FrankenPHP host daemon). Forward-auth gate ensures only
    Authentik-authenticated principals reach the service.
  legal_basis: legitimate_interests
  data_categories:
    - systems_inventory
    - remediation_items
    - audit_events
    - oauth_session_data
  data_subjects:
    - operators
  retention_days: -1
  processors: []
  eu_residency: true
  transfers_outside_eu: false

# =============================================================================
# UI-EXTENSION — Wing /hub deep-link card
# =============================================================================

ui-extension:
  hub_card:
    title: "Wing"
    icon: shield
    url: "https://{{ wing_domain }}"
    tier: 1
    description: "Security research dashboard"

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
