# =============================================================================
# nextcloud-base — service plugin (Track Q U5, Phase 1, 2026-05-04)
#
# Replaces the `authentik_oidc_apps[slug=nextcloud]` row. Nextcloud OIDC is
# configured via the `occ` CLI (post_setup: nextcloud_occ in the central
# list) — there are NO OIDC env vars on the compose service. The compose-
# extension carries only the mkcert CA volume conditional + extra_hosts;
# Phase 2 C1 removes the central row and the loader's authentik aggregator
# starts emitting Nextcloud blueprint definitions from this manifest.
# =============================================================================

name: nextcloud-base
version: 0.1.0
description: |
  Wiring layer for Nextcloud (file sync + collaboration). Authentik OIDC is
  applied via `occ user_oidc` after the container is up (driven by the role's
  post-tasks) — this plugin carries only the OIDC client metadata, mkcert CA
  volume conditional, and the authentik host-gateway alias.
upstream: https://nextcloud.com/
license: AGPL-3.0

type:
  - service

# =============================================================================
# REQUIRES
# =============================================================================

requires:
  role: pazny.nextcloud
  feature_flag: install_nextcloud
  variables:
    - nextcloud_domain
    - nextcloud_port
    - tenant_domain
    - host_alias
    - global_password_prefix

# =============================================================================
# AUTHENTIK — native OIDC client (configured via `occ user_oidc`)
# =============================================================================

authentik:
  mode: native_oidc
  post_setup: nextcloud_occ        # loader hands client_id+secret to occ CLI
  client_id: nos-nextcloud
  client_secret: "{{ global_password_prefix }}_pw_oidc_nextcloud"
  slug: nextcloud
  name: 'Nextcloud'
  enabled: "{{ install_nextcloud | default(false) }}"
  redirect_uris:
    - "https://{{ nextcloud_domain | default('cloud' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/apps/user_oidc/code"
  launch_url: "https://{{ nextcloud_domain | default('cloud' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}"
  scopes:
    - openid
    - profile
    - email
  tier: 3   # user — files, contacts, calendar for end users
  # ── SSO autologin (force-OIDC) — sso-autologin-plan.md Batch 2 ───────────
  # Nextcloud supports auto-redirect, but NOT via a compose env var — it needs
  # the `user_oidc` app configured as the single default provider via `occ`
  # (allow_multiple_user_backends=0 + login_redirect=<provider>). The occ hook
  # in roles/pazny.nextcloud/tasks/post.yml carries the render; it gates on the
  # SAME enable expression below (config-hook service, NOT compose env). Stays
  # dormant behind sso_autologin=false default.
  autologin:
    supports: "yes"          # upstream truth — occ makes OIDC the default login (302)
    enabled: "{{ (sso_autologin_nextcloud | default(sso_autologin_min_tier_3 | default(sso_autologin | default(false)))) | bool }}"
    hides_local_form: false  # local form stays reachable via ?direct=1
    break_glass: "?direct=1" # → Nextcloud's own login form (always reachable)
    # CAVEAT: occ hook REQUIRED — a compose env var alone is insufficient for
    # Nextcloud auto-redirect; user_oidc default-provider config lives in the DB.

# =============================================================================
# COMPOSE-EXTENSION
# =============================================================================

compose_extension:
  template: templates/nextcloud-base.compose.yml.j2
  target_stack: iiab
  target_service: nextcloud

# =============================================================================
# LIFECYCLE HOOKS
# =============================================================================

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health: "http://127.0.0.1:{{ nextcloud_port | default(8085) }}/status.php"
    - replay_api_calls: hooks/post_compose.yml

gdpr:
  purpose: |
    Hosts the operator's Nextcloud collaboration suite. Stores files,
    contacts, calendars, talk messages, user accounts, and OIDC session
    data. May process end-user uploads.
  legal_basis: legitimate_interests
  data_categories:
    - file_storage
    - contacts
    - calendars
    - chat_messages
    - user_accounts
    - oauth_session_data
    - email
  data_subjects:
    - operators
    - end_users
  retention_days: 365
  processors: []
  eu_residency: true

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []

# ── Wing /hub card (ui-extension) ────────────────────────────────────────────
# Forward-ready deep-link card for the Wing hub (harvest pending). Matches the
# woodpecker-base/grafana-base shape. domain var is playbook-defined.
ui-extension:
  hub_card:
    title: Nextcloud
    icon: cloud
    url: "https://{{ nextcloud_domain }}"
    tier: 3
    description: Self-hosted cloud — files, calendar, contacts
    health_check: "https://{{ nextcloud_domain }}"
