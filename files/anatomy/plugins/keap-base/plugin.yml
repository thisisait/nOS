# =============================================================================
# keap-base — service plugin (CORTEX, 2026-07-10)
#
# Status: live manifest. KEAP (Knowledge Explorer and Preserver) is the
# CORTEX of the nOS anatomy — the knowledge layer of the brain. Where Bone
# carries signals, Wing observes, and Pulse keeps time, the cortex REMEMBERS:
# curated taxonomy (790 nodes), content links resolved into the live content
# services (Kiwix, Calibre-Web, Nextcloud, Open WebUI), a capture/
# preservation review queue, and an agent-facing knowledge API (/agent/v1)
# that gives AgentKit agents a queryable map of what knowledge exists and
# where it lives locally.
#
# Source lives OUTSIDE nOS (thisisait/nos-keap, org-transferred 2026-07-13
# from the budweis-dev origin) — roles/pazny.keap git-clones the pinned ref
# and builds nos/keap from source (hermes clone + build precedents).
#
# SSO: header_oidc (firefly-base pattern) — the Authentik proxy outpost
# injects X-Authentik-uid/-username/-email/-groups; server/identity.ts keys
# per-user rows on uid and 401s header-less /api requests
# (KEAP_TRUSTED_PROXY=1). SEC-02: the container joins ONLY the Traefik-only
# gated_net so peers cannot forge identity headers. The loopback-published
# port is the AgentKit surface (scope-split bearer tokens), unreachable from
# containers (A19-verified).
# =============================================================================

name: keap-base
version: 0.1.0
description: |
  KEAP — Knowledge Explorer and Preserver (the nOS cortex).

  Wiring layer for header-OIDC authenticated access via Authentik proxy
  outpost. The role `pazny.keap` keeps install-only responsibilities
  (clone, build, ports, volumes, env); this plugin owns the Traefik label
  hygiene + Authentik tier binding + GDPR Article 30 row + Wing /hub card.
upstream: https://github.com/thisisait/nos-keap
license: MIT  # plugin manifest is repo-licensed

type:
  - service
  - ui-extension

# Defensive sentinel — pin the plugin slug for any tool that introspects
# manifests via the loader (P0.12 doctrine).
_NOS_PLUGIN: "keap-base"

# =============================================================================
# REQUIRES
# =============================================================================

requires:
  role: pazny.keap
  feature_flag: install_keap
  variables:
    - keap_port
    - keap_domain
    - tenant_domain
    - host_alias

# =============================================================================
# AUTHENTIK — header_oidc (Authentik outpost → X-Authentik-* headers)
# =============================================================================
# KEAP's Express backend (server/identity.ts) consumes X-Authentik-uid /
# -username / -email / -groups injected by the proxy outpost and auto-scopes
# every user row by uid. β1.A trichotomy: this is **header_oidc** — true SSO
# from the user POV (no in-app login screen), no per-app OIDC client. To go
# native_oidc later: flip mode/provider_type, add redirect_uris/scopes
# (miniflux-base shape) and an OIDC client lib in the backend.

# ── DEPENDS_ON — service→service edges (docs/idea/13-relations.md, R2) ──────
depends_on:
  - upstream: "service:cortex"
    kind: data
    via: >-
      CORTEX_BACKEND_URL → host.docker.internal:{{ cortex_port }}
      (roles/pazny.keap/templates/compose.yml.j2:110, with its own token space
      at :112) — the resolver organ KEAP delegates to once
      `keap_cortex_cutover` is on
    measured: "2026-08-07"
    unenforced: >-
      No auto-enable block ties install_cortex to install_keap. Rollback is
      `keap_cortex_cutover: false` + converge, so with the organ absent and the
      flag on, KEAP serves its own path and the delegation silently never
      happens.

authentik:
  mode: header_oidc
  provider_type: header_oidc
  client_id: nos-keap
  client_secret: "{{ global_password_prefix }}_pw_oidc_keap"
  slug: keap
  name: 'KEAP — Knowledge Explorer'
  enabled: "{{ install_keap | default(false) }}"
  launch_url: "https://{{ keap_domain | default('keap' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}"
  tier: 3

# =============================================================================
# COMPOSE-EXTENSION — Traefik label hygiene (file provider is authoritative)
# =============================================================================
compose_extension:
  template: templates/keap-base.compose.yml.j2
  target_stack: iiab
  target_service: keap
  hardening_refs: []

# =============================================================================
# LIFECYCLE HOOKS
# =============================================================================

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health:
        url: "http://127.0.0.1:{{ keap_port }}/api/health"
        timeout: 120

# =============================================================================
# PULSE — embedding sync (feeds the libSQL vector corpus in keap.db)
# =============================================================================
# Trust-boundary split: KEAP's container decides WHAT to embed (the /agent/v1
# embeddings/pending diff); this host-side job decides HOW — host-loopback
# Ollama (nomic-embed-text, 768-dim) → POST /agent/v1/embeddings. The
# container on gated_net cannot reach a host daemon, so live embedding stays
# host-side by design. Idempotent: corpus current → no-op exit 0.

pulse:
  jobs:
    - name: keap-embed-sync
      category: knowledge
      runner: subprocess
      # Wing's pulse_jobs API requires an ABSOLUTE command path (no leading
      # interpreter word) — the script is executable with a python3 shebang.
      command: "{{ playbook_dir }}/files/anatomy/scripts/keap-embed-sync.py"
      schedule: "45 4 * * *"    # 04:45 UTC daily; offset from gitleaks 03:00 + tofu-drift 05:30
      jitter_min: 10
      max_runtime_s: 900        # first full run embeds ~800 texts (~2 min on MLX); headroom for corpus growth
      max_concurrent: 1
      # depends_on: consumer-side edge declarations, compiled into
      # state/anatomy-graph.json (tools/anatomy-graph-gen.py; margins by
      # tools/anatomy-measure-margins.py). Declaration only — the daemon
      # still dispatches on cron minutes (Phase 0).
      depends_on:
        - upstream: "pulse:cortex:cortex-fs-sync"
          kind: data
          via: "settled cortex mirror rows needing vectors (S2 fan-out, GET /agent/v1/embeddings/pending)"
          expects: succeeded
          measured: "2026-08-06"
        - upstream: "pulse:cortex:cortex-fs-sync"
          kind: temporal
          margin_min: 15.1          # min over 10 nights to 2026-08-06
          schedules: ["30 4 * * *", "45 4 * * *"]
          measured: "2026-08-06"
      env:
        # BARE tokens — the Pulse catalog does a LITERAL replace (gitleaks
        # WING_EVENTS_HMAC_SECRET precedent); Ansible pre-renders the values.
        KEAP_API_URL: "http://127.0.0.1:{{ keap_port }}"
        KEAP_AGENT_TOKEN_RW: "{{ keap_agent_token_rw }}"
        OLLAMA_URL: "http://127.0.0.1:11434"
        # S2 fan-out: a SECOND target, not a moved one. Empty until the organ
        # is installed, and the job then behaves exactly as it did. Distinct
        # env NAMES holding distinct SECRETS is deliberate — one name meaning
        # two secrets on one host is how a write token reaches the wrong
        # daemon (docs/archive/cortex-corpus-parallel.md §2.1).
        CORTEX_API_URL: "{{ cortex_fanout_url }}"
        CORTEX_AGENT_TOKEN_RW: "{{ cortex_rw_token }}"

    # Semantic-lens feature sync (05:00 — after embed-sync, before lint):
    # projects each node's embedding onto the exemplar-difference axes +
    # centrality + k-means, upserts node_features (GraphCanvas colour/size/
    # texture channels). Appearance only — never touches the baked U1 positions.
    # Idempotent; no embeddings yet -> no-op. See docs/archive/keap-semantic-lens.md.
    - name: keap-features-sync
      category: knowledge
      runner: subprocess
      command: "{{ playbook_dir }}/files/anatomy/scripts/keap-features-sync.py"
      schedule: "0 5 * * *"     # 05:00 UTC — between embed-sync (04:45) and lint (05:15)
      jitter_min: 5
      max_runtime_s: 600
      max_concurrent: 1
      depends_on:
        - upstream: "pulse:keap:keap-embed-sync"
          kind: data
          via: "fresh embeddings read via /agent/v1, projected onto exemplar axes"
          expects: succeeded
          measured: "2026-08-06"
        - upstream: "pulse:keap:keap-embed-sync"
          kind: temporal
          margin_min: 6.3           # the chain's thinnest; min over 11 nights to 2026-08-06
          schedules: ["45 4 * * *", "0 5 * * *"]
          measured: "2026-08-06"
      env:
        KEAP_API_URL: "http://127.0.0.1:{{ keap_port }}"
        KEAP_AGENT_TOKEN_RO: "{{ keap_agent_token_ro }}"
        KEAP_AGENT_TOKEN_RW: "{{ keap_agent_token_rw }}"
        OLLAMA_URL: "http://127.0.0.1:11434"

    # Cortex consolidator (the "dream" sweep, 04:15 — opens the night
    # shift): walks raw data piles (Nextcloud files, ~/keap/inbox drop dir,
    # operator-imported MariaDB databases) and registers new/changed items
    # as datapoints via the unified intake (capture-tier token — the
    # consolidator is a FEEDER, it can never read the corpus). Night order:
    # consolidate 04:15 -> embed-sync 04:45 -> lint 05:15 -> librarian.
    - name: keap-consolidate
      category: knowledge
      runner: subprocess
      command: "{{ playbook_dir }}/files/anatomy/scripts/keap-consolidate.py"
      schedule: "15 4 * * *"
      jitter_min: 5
      max_runtime_s: 600
      max_concurrent: 1
      env:
        KEAP_API_URL: "http://127.0.0.1:{{ keap_port }}"
        KEAP_AGENT_TOKEN_CAPTURE: "{{ keap_agent_token_capture }}"
        CORTEX_API_URL: "{{ cortex_fanout_url }}"
        CORTEX_AGENT_TOKEN_CAPTURE: "{{ cortex_capture_token }}"
        NOS_CONSOLIDATE_FS_ROOTS: "{{ consolidate_fs_roots }}"
        NOS_MARIADB_ROOT_PASSWORD: "{{ mariadb_root_password }}"
        NOS_CONSOLIDATE_DB_EXCLUDE: "{{ consolidate_db_exclude }}"
        NOS_NOTIFY_BIN: "{{ playbook_dir }}/files/anatomy/scripts/nos-notify.sh"

    # Knowledge lint (Karpathy's third operation, vector-extended): the
    # container runs the deterministic checks (nos-keap server/lint.ts) and
    # keeps the findings lifecycle; this job just triggers the run AFTER the
    # embed sync (fresh vectors) and fans NEW findings into A9. Standing
    # findings never re-alert.
    - name: keap-lint
      category: knowledge
      runner: subprocess
      command: "{{ playbook_dir }}/files/anatomy/scripts/keap-lint.py"
      schedule: "15 5 * * *"    # 05:15 UTC — after keap-embed-sync (04:45+jitter)
      jitter_min: 5
      max_runtime_s: 300
      max_concurrent: 1
      depends_on:
        - upstream: "pulse:keap:keap-embed-sync"
          kind: data
          via: "fresh vectors for the container's lint pass (POST /agent/v1/lint/run)"
          expects: succeeded
          measured: "2026-08-06"
        - upstream: "pulse:keap:keap-features-sync"
          kind: temporal
          margin_min: 11.1          # min over 11 nights to 2026-08-06
          schedules: ["0 5 * * *", "15 5 * * *"]
          measured: "2026-08-06"
      env:
        KEAP_API_URL: "http://127.0.0.1:{{ keap_port }}"
        KEAP_AGENT_TOKEN_RW: "{{ keap_agent_token_rw }}"
        NOS_NOTIFY_BIN: "{{ playbook_dir }}/files/anatomy/scripts/nos-notify.sh"

# =============================================================================
# OBSERVABILITY — Loki labels
# =============================================================================

observability:
  loki:
    labels:
      app: keap
      stack: iiab
      tier: "3"

# =============================================================================
# GDPR — Article 30 register row
# =============================================================================

gdpr:
  purpose: |
    Per-user knowledge-exploration state (learning progress, todos, saved
    bookmarks), operator-curated taxonomy content links, and captures
    submitted for human review through the unified intake: the companion
    userscript, nOS agents, and field DEVICES (AR glasses / mobile
    companions posting text, transcripts, geo-tagged moments and
    media-by-reference to /ingest/v1).
  legal_basis: legitimate_interests
  data_categories:
    - username            # X-Authentik-uid/-username/-groups (identity + RBAC)
    - email
    - behavioural_data    # learning progress, completion state
    - user_generated_content  # captured page metadata, todos, bookmarks, device captures
    - location_data       # optional geo on device captures (intake envelope)
  data_subjects:
    - end_users
  retention_days: 365
  processors: []
  eu_residency: true
  transfers_outside_eu: false

# =============================================================================
# UI-EXTENSION — Wing /hub deep-link card
# =============================================================================

ui-extension:
  hub_card:
    title: "Knowledge Explorer"
    icon: compass
    url: "https://{{ keap_domain }}"
    tier: 3
    description: "Cortex — taxonomy, content links & preservation"
    health_check: "https://{{ keap_domain }}/api/health"

# ── Notification routing (A9 severity → channel) ─────────────────────────────
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []
