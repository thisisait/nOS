# =============================================================================
# gitlab-base — service plugin (Track Q U5, Phase 1, 2026-05-04)
#
# Replaces the `authentik_oidc_apps[slug=gitlab]` row + the role-side
# omniauth providers block in GITLAB_OMNIBUS_CONFIG. Phase 2 C1 deletes both.
#
# Note: GitLab Omnibus configures OIDC via Ruby DSL inside GITLAB_OMNIBUS_CONFIG
# (a multi-line env var). The compose-extension carries the same DSL block in
# its own GITLAB_OMNIBUS_CONFIG; Compose merges environment maps key-by-key —
# whichever fragment renders LAST wins for that key. Phase 2 C1 removes the
# role-side rendering so this plugin is the single writer.
# =============================================================================

name: gitlab-base
version: 0.1.0
description: |
  Wiring layer for GitLab CE. Carries Authentik omniauth_openid_connect
  provider config (omniauth_enabled + omniauth_providers DSL) plus the
  mkcert CA volume conditional and the extra_hosts authentik:host-gateway
  alias.
upstream: https://about.gitlab.com/install/ce-or-ee/
license: MIT   # GitLab CE upstream; manifest is repo-licensed

type:
  - service

# =============================================================================
# REQUIRES
# =============================================================================

requires:
  role: pazny.gitlab
  feature_flag: install_gitlab
  variables:
    - gitlab_domain
    - gitlab_http_port
    - tenant_domain
    - host_alias
    - global_password_prefix

# =============================================================================
# AUTHENTIK — native OIDC client (omniauth_openid_connect)
# =============================================================================

authentik:
  mode: native_oidc
  client_id: nos-gitlab
  client_secret: "{{ global_password_prefix }}_pw_oidc_gitlab"
  slug: gitlab
  name: 'GitLab'
  enabled: "{{ install_gitlab | default(false) }}"
  redirect_uris:
    - "https://{{ gitlab_domain | default('gitlab' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}/users/auth/openid_connect/callback"
  launch_url: "https://{{ gitlab_domain | default('gitlab' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}"
  scopes:
    - openid
    - profile
    - email
  tier: 2   # manager — repo + CI admin
  # ── SSO autologin (force-OIDC) — sso-autologin-plan.md Batch 3 ───────────
  # GitLab is supports: PARTIAL (plan matrix (b), conf 0.78). The reliable
  # lever is gitlab_rails['disable_password_authentication_for_web'] = true,
  # which HIDES the username/password form (only the OIDC button remains).
  # The auto-redirect key gitlab_rails['omniauth_auto_sign_in_with_provider']
  # is NOT unambiguously confirmed in official GitLab OIDC Omnibus docs — it
  # may or may not fire depending on version — so this is downgraded from a
  # "clean win" to PARTIAL: the form is hidden, true zero-click auto-redirect
  # is not guaranteed. The force-OIDC Omnibus fragment lives ROLE-SIDE (the
  # role owns the monolithic GITLAB_OMNIBUS_CONFIG string per the D2 decision
  # in gitlab-base.compose.yml.j2 — splitting it across files is unsafe), and
  # is gated on the SAME enable expression below. Dormant behind
  # sso_autologin=false (default). Break-glass: ?auto_sign_in=false → the
  # /users/sign_in form; reachable only while disable_password_authentication
  # _for_web is NOT true, otherwise use recovery (see break-glass runbook).
  autologin:
    supports: partial        # upstream truth — form hides via disable_pw; auto-redirect key unconfirmed
    enabled: "{{ (sso_autologin_gitlab | default(sso_autologin_min_tier_2 | default(sso_autologin | default(false)))) | bool }}"
    hides_local_form: true   # disable_password_authentication_for_web=true hides the password form
    break_glass: "?auto_sign_in=false"   # → /users/sign_in (only if disable_pw ≠ true)

# =============================================================================
# COMPOSE-EXTENSION
# =============================================================================

compose_extension:
  template: templates/gitlab-base.compose.yml.j2
  target_stack: devops
  target_service: gitlab

# =============================================================================
# LIFECYCLE HOOKS
# =============================================================================

lifecycle:
  pre_compose:
    - render_compose_extension: compose_extension
  post_compose:
    - wait_health: "http://127.0.0.1:{{ gitlab_http_port | default(8929) }}/-/readiness"

gdpr:
  purpose: |
    Hosts the operator's GitLab source-control + CI platform. Stores
    repositories, issues, merge requests, CI artifacts, user accounts,
    and OIDC session data.
  legal_basis: legitimate_interests
  data_categories:
    - repository_content
    - issues_and_mrs
    - ci_artifacts
    - user_accounts
    - oauth_session_data
    - email
  data_subjects:
    - operators
    - end_users
  retention_days: 365
  processors: []
  eu_residency: true

# ── Notification routing (A9 severity → channel) ─────────────────────────────
# Uniform wiring contract (2026-05-23): harvested by wing-base into
# notification-routing.json; Bone falls back to this when an emitter POSTs a
# notification with origin_plugin + severity but no explicit channels. The
# emitter decides which failure maps to which severity; this block only routes
# a severity to channels. Channels: wing-inbox | ntfy | mail. Tune per service.
notification:
  on_critical: [wing-inbox, ntfy]
  on_high:     [wing-inbox, ntfy]
  on_medium:   [wing-inbox]
  on_low:      []
  on_info:     []

# ── Wing /hub card (ui-extension) ────────────────────────────────────────────
# Forward-ready deep-link card for the Wing hub (harvest pending). Matches the
# woodpecker-base/grafana-base shape. domain var is playbook-defined.
ui-extension:
  hub_card:
    title: GitLab
    icon: git
    url: "https://{{ gitlab_domain }}"
    tier: 2
    description: DevOps platform — repos, CI/CD, registry
    health_check: "https://{{ gitlab_domain }}"
