# Secrets P1 — the credential registry (docs/secrets-p1-hkdf.md §3, §6).
#
# ONE file, three consumers: the nos_secret_map module (derivation), the
# anatomy gates (inertness + reference cross-check), tools/nos-secret.py (the
# operator reader). A credential exists here or it does not exist — a second
# list would drift (the Pulse-catalog lesson, twice in one week, 2026-08-05/06).
#
# key      = the legacy `_pw_<key>` suffix. Scheme v1 resolves each key to
#            `{global_password_prefix}_pw_<key>` BYTE-IDENTICAL to the retired
#            concatenation — that identity is the inertness contract and is
#            pinned by tests/anatomy/test_secret_scheme_inert_until_blank.py.
# service+purpose = the HKDF domain separation for scheme v2:
#            leaf = HKDF-SHA256(master, salt="nos/estate|"+service, info=purpose)
#            (service, purpose) pairs MUST be unique — load_registry() refuses
#            a collision because colliding pairs derive the SAME value.
#
# Shared v1 leaves stay shared on purpose (freescout db+admin, superset db
# sharing the retired admin suffix): v1 byte-identity outranks the wish to
# split them, and a split is a blank-time change queued in the spec §9.
#
# NOT here, each with its reason (spec §6): restic_password (BLOCKED — repo
# keyed under the derived value), ntfy_admin_password (operator-decided
# human-typed exception, 2026-08-08), the 27 lazy-MINTED names (coexist —
# minted secrets are individually rotatable, derived ones are reproducible;
# neither subsumes the other), `_pw_bsky_<username>` (dynamic, user-scope —
# derived per-user by nos_secret_map mode=user_leaf in the PDS bridge).
