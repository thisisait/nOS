# -----------------------------------------------------------------------------
# VOCABULARY AMNESTY — withheld VALUES that happen to be ordinary English
# words the page needs as its own vocabulary. Each entry is a signable
# exception to the leak check's harvested-substring rule. An amnesty term
# may never equal a service name — the gate enforces that.
# -----------------------------------------------------------------------------
vocabulary_amnesty:
  - term: anatomy
    collides_with: "an internal app title"
    why_needed: "it is the page's own subject word"

# -----------------------------------------------------------------------------
# FORBIDDEN MARKS — distinctive product names behind the atoms. The leak
# check refuses any output containing one of these as a word, in any case,
# regardless of how it got there. This list is a backstop UNDER the field
# and node rulings, not a substitute for them.
# -----------------------------------------------------------------------------
forbidden_marks:
  [authentik, traefik, tailscale, bluesky, infisical, vaultwarden, bitwarden,
   mariadb, postgres, postgresql, redis, restic, keap, kiwix, calibre,
   nextcloud, onlyoffice, jellyfin, grafana, prometheus, loki, influxdb,
   gitea, gitlab, woodpecker, erpnext, freescout, firefly, metabase,
   superset, wordpress, freepbx, asterisk, stalwart, snappymail, miniflux,
   hedgedoc, bookstack, portainer, watchtower, kuma, rustfs, backrest,
   openclaw, ollama, mailpit, ntfy, n8n, nodered, homeassistant, qgis,
   docker, ansible, launchd]

