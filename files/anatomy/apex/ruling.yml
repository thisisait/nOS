# =============================================================================
# THE PUBLIC-SURFACE RULING — pazny.eu apex site
# =============================================================================
#
# This file is the ONLY door between the internal anatomy artifact
# (state/anatomy-graph.json) and anything served to an anonymous visitor.
# It is written to be read and signed by a person, not parsed by engineers:
# every line under `nodes:` that says `publish:` is a sentence that will
# leave this machine, exactly as written here, and nothing else will.
#
# THE DEFAULT IS WITHHELD. A field or a node with no ruling here does not
# fall through — it HALTS THE BUILD (files/anatomy/apex/projection.py
# refuses to run until someone adds a ruling). A generator commit is not a
# public-surface review; this file is where the review happens.
#
# HOW TO READ A FIELD RULING
#   VERBATIM    — the value may leave byte-identical.
#   TRANSFORMED — only the named transform of the value may leave; the raw
#                 value never does.
#   WITHHELD    — nothing derived from this field may leave, including its
#                 count, its ordering, and its absence.
#
# HOW TO READ A NODE RULING
#   publish: <organ>  — the node joins that organ as ONE ANONYMOUS ATOM.
#                       What leaves: the organ it belongs to, and the
#                       `speaks:` phrase. What never leaves: its name, its
#                       hostname, its version, its schedule, its health.
#   withheld          — the node contributes nothing to the public surface.
#
# TO SIGN: set status: SIGNED and put your name in signed_by. Until then
# the build is preview-only and must not be wired to any route.
# =============================================================================

ruling: thisisait-public-anatomy
version: 1
status: SIGNED            # PROPOSED = local preview only. SIGNED = may deploy.
signed_by: Pázny
proposed: 2026-08-17
signed: 2026-08-17        # every organ title and all 63 `speaks:` phrases read
artifact: state/anatomy-graph.json

# THE SIGNATURE IS A FLAG, NOT A PROMISE — until this line exists.
#
# `status: SIGNED` + `signed_by:` says someone once signed something; it does
# not say they signed THIS. Measured 2026-08-29: a session added two `withheld`
# node rulings to a SIGNED file and every gate stayed green, because nothing
# compared the content to what the signer read. Two withheld rows publish
# nothing, so no harm was done — and nothing would have said so either way.
#
# `signed_digest` is sha256 over this file with this line removed. Amend the
# ruling and it stops matching; `tools/awaiting-operator.py` then reports the
# file as AMENDED AFTER SIGNING and asks for a fresh signature. To re-sign:
#   python3 tools/apex-sign.py            # prints the diff since the last sign
#   python3 tools/apex-sign.py --confirm  # writes the new digest
signed_digest: 0067a68ffe71910eff8acd97df78efedbd7f9782efff1e6dfcbb1a2a4554005a


# The declared split. The gate recounts the table below and refuses to run
# if the actual split differs — so a ruling change is always a conscious
# edit of BOTH the row and this ledger line.
splits:
  verbatim: 6
  transformed: 9
  withheld: 69

# -----------------------------------------------------------------------------
# STANDING DECISIONS — operator rulings, recorded as decisions with reasons,
# not as omissions. These outrank everything below.
# -----------------------------------------------------------------------------
decisions:
  - id: D1
    subject: "node fields `layer`, `layer_withheld`, `layer_basis` and the artifact `layer_basis`"
    ruling: WITHHELD
    ruled_by: operator
    recorded: 2026-08-17
    reason: >
      No blast-radius ranking on the public page. A layer index (L0/L1/L2)
      is a prioritised target list: it tells a stranger which organ to hit
      first. Ruled out entirely — no ring index, no derived ordering.

  - id: D2
    subject: "hostnames and service names, in any spelling"
    ruling: WITHHELD
    ruled_by: operator
    recorded: 2026-08-17
    reason: >
      DNS and the TLS certificate are both wildcards, so the service-to-
      hostname map is not currently enumerable from outside. A page naming
      services hands that map over. Therefore: no service names, no
      subdomains, no click-through. An organ says what it is FOR, never
      what it is CALLED. This is also why the projection's leak check
      treats every service's name as a forbidden mark.

  - id: D3
    subject: "freshness, health, schedules — anything that changes when the estate does"
    ruling: WITHHELD
    ruled_by: this ruling (second-order invariant)
    recorded: 2026-08-17
    reason: >
      Structure may move; state may not. A page whose pulse changes when a
      container dies is a monitoring feed for anyone watching. All motion
      on the page is seeded from this file's `version:` — a build-time
      constant — never from live health, never from the artifact's
      content, never from the clock. The build is byte-deterministic:
      building twice yields identical files, which is what the gate tests.

  - id: D4
    subject: "the published node set"
    ruling: FROZEN
    ruled_by: this ruling (second-order invariant)
    recorded: 2026-08-17
    reason: >
      Absence is an oracle if the node set moves. The published set is the
      list below, not "whatever the artifact holds today": a node that
      appears in the artifact without a ruling here halts the build, and a
      ruled node that vanishes from the artifact halts the build. Every
      count on the page is recomputed over the published set only.

# -----------------------------------------------------------------------------
# FIELD RULINGS — all 84 fields the artifact carries today: 8 top-level,
# 59 node fields, 17 edge fields. The gate diffs this table against the
# artifact's actual key census, both directions.
# -----------------------------------------------------------------------------
fields:
  artifact:
    version:      { ruling: VERBATIM, note: "schema literal; a build-time constant" }
    generated_by: { ruling: WITHHELD, why: "internal tool path" }
    doctrine:     { ruling: WITHHELD, why: "internal doc path" }
    layer_basis:  { ruling: WITHHELD, why: "D1" }
    counts:       { ruling: TRANSFORMED, transform: "discarded and recomputed over the published set only (D4); no internal tally ever leaves" }
    warnings:     { ruling: WITHHELD, why: "a written catalogue of the estate's failure modes" }
    nodes:        { ruling: TRANSFORMED, transform: "filtered to the ruled atoms below, rewritten to organs; ids never leave (D2)" }
    edges:        { ruling: TRANSFORMED, transform: "aggregated to organ-pair veins; an edge with an unpublished endpoint, or both endpoints in one organ, is dropped" }

  node:
    kind:              { ruling: TRANSFORMED, transform: "selector only — `service` nodes may become atoms; every other kind has no public form; the word itself never leaves" }
    description:       { ruling: TRANSFORMED, transform: "replaced by the operator-authored `speaks:` phrase below; the artifact string never leaves and is a forbidden term in the leak check" }
    stack:             { ruling: TRANSFORMED, transform: "folded into the organ assignment below; the value never leaves" }
    category:          { ruling: TRANSFORMED, transform: "folded into the organ assignment below; the value never leaves" }
    form:              { ruling: VERBATIM, note: "generic vocabulary (`view`); granted, not exercised in v1" }
    build:             { ruling: VERBATIM, note: "F-tier label from a public doctrine doc; granted, not exercised in v1" }
    deterministic:     { ruling: VERBATIM, note: "content-free boolean; granted, not exercised in v1" }
    unattended:        { ruling: VERBATIM, note: "content-free boolean; granted, not exercised in v1" }
    source:            { ruling: WITHHELD, why: "file paths" }
    mode:              { ruling: WITHHELD, why: "SSO edge posture per service" }
    tier:              { ruling: WITHHELD, why: "RBAC map" }
    client_id:         { ruling: WITHHELD, why: "OIDC client identifier" }
