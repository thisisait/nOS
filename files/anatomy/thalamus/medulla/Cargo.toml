[package]
name = "medulla"
version.workspace = true
edition = "2021"
publish = false
description = "One static binary runs the host organs under its own identity; `medulla thalamus` is the relay organ."

[[bin]]
name = "medulla"
path = "src/main.rs"

[dependencies]
nos-contract = { path = "../contract" }
thalamus = { path = "../thalamus" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
time = { version = "0.3.55", default-features = false, features = ["std"] }
