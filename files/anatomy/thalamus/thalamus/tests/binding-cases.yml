# One set of cases, two resolvers: src/binding.rs (tests/binding.rs) and tools/nos_cell_binding.py
# (tests/anatomy/test_llm_cell_requirement.py). Both read the REAL register; `cell:` reads the real cell.
# expect.kind: default | disarmed | bound | refused; `model_id` for bound, `backend` for disarmed,
# `contains` a fragment of the refusal. A `nos:<var>` env key is the cell's key, as main.rs answers it.
# `sizes:` judge a bound local model against `floors` (llm_cell_min_params_b refuses,
# llm_cell_recommended_params_b warns; tests/anatomy/test_on_host_models.py pins them to the defaults).
floors: {min_b: 3, warn_b: 8}
sizes:
  - {model: "hermes3:8b", expect: silent}
  - {model: "qwen3:14b-q4_K_M", expect: silent}
  - {model: "qwen3:4b", expect: warned, contains: "'qwen3:4b' has 4B parameters, below the 8B recommended"}
  - {model: "llama3.2:3b", expect: warned, contains: "below the 8B recommended"}
  - {model: "phi3:3.8b", expect: warned, contains: "3.8B parameters"}
  - {model: "qwen3:1.7b", expect: refused, contains: "'qwen3:1.7b' has 1.7B parameters, below the 3B minimum"}
  - {model: "gemma3:270m", expect: refused, contains: "0.27B parameters"}
  - {model: "qwen3:latest", expect: refused, contains: "the size of 'qwen3:latest' is UNKNOWN"}
  - {model: "gemma3n:e2b", expect: refused, contains: "UNKNOWN"}
  - {model: "", expect: refused, contains: "UNKNOWN"}
cases:
  - name: an armed local cell binds the local model
    agent: "name: loc\nmodel: {primary: openai-local-sonnet, backend: ollama}\ngdpr: {processors: [{name: on-device}], transfers_outside_eu: false}\n"
    env: {NOS_ARMED_BACKENDS: ollama, NOS_LOCAL_MODEL: "qwen3:14b"}
    expect: {kind: bound, model_id: "qwen3:14b"}
  - name: the binding does not judge size
    agent: "name: loc\nmodel: {primary: openai-local-sonnet, backend: ollama}\ngdpr: {processors: [{name: on-device}], transfers_outside_eu: false}\n"
    env: {NOS_ARMED_BACKENDS: ollama, NOS_LOCAL_MODEL: "llama3.2:3b"}
    expect: {kind: bound, model_id: "llama3.2:3b"}
  - name: a disarmed EU-only local cell refuses rather than degrade
    agent: "name: loc\nmodel: {primary: openai-local-sonnet, backend: ollama}\ngdpr: {processors: [{name: on-device}], transfers_outside_eu: false}\n"
    env: {NOS_LOCAL_MODEL: "qwen3:14b"}
    expect: {kind: refused, contains: "not armed"}
  - name: armed with an empty model env refuses
    agent: "name: loc\nmodel: {primary: openai-local-sonnet, backend: ollama}\ngdpr: {processors: [{name: on-device}], transfers_outside_eu: false}\n"
    env: {NOS_ARMED_BACKENDS: ollama}
    expect: {kind: refused, contains: "NOS_LOCAL_MODEL is empty"}
  - name: iris armed with its key binds Mistral on the EU row
    cell: iris
    env: {NOS_ARMED_BACKENDS: mistral-eu, NOS_MISTRAL_MODEL: mistral-large-latest, "nos:mistral_api_key": k-test}
    expect: {kind: bound, model_id: mistral-large-latest}
  - name: iris armed without its key refuses and names credentials.yml
    cell: iris
    env: {NOS_ARMED_BACKENDS: mistral-eu, NOS_MISTRAL_MODEL: mistral-large-latest}
    expect: {kind: refused, contains: "set mistral_api_key in credentials.yml"}
  - name: iris disarmed refuses, never degrades to ollama
    cell: iris
    env: {NOS_ARMED_BACKENDS: ollama, NOS_LOCAL_MODEL: "qwen3:14b", NOS_MISTRAL_MODEL: mistral-large-latest, "nos:mistral_api_key": k-test}
    expect: {kind: refused, contains: "not armed"}
  - name: a disarmed cloud cell may degrade
    agent: "name: cloudy\nmodel: {primary: claude-sonnet, backend: minimax}\ngdpr: {processors: [{name: MiniMax}], transfers_outside_eu: true}\n"
    env: {NOS_MINIMAX_MODEL: m1}
    expect: {kind: disarmed, backend: minimax}
  - name: an armed keyed backend refuses without a vault
    agent: "name: cloudy\nmodel: {primary: claude-sonnet, backend: minimax}\ngdpr: {processors: [{name: MiniMax}], transfers_outside_eu: true}\n"
    env: {NOS_ARMED_BACKENDS: minimax, NOS_MINIMAX_MODEL: m1}
    expect: {kind: refused, contains: "auth_secret"}
  - name: no backend is the default
    agent: "name: c\nmodel: {primary: claude-sonnet}\n"
    env: {NOS_ARMED_BACKENDS: ollama}
    expect: {kind: default}
  - name: the default row is the default
    agent: "name: c\nmodel: {primary: claude-sonnet, backend: anthropic}\n"
    env: {}
    expect: {kind: default}
  - name: an unlisted backend refuses
    agent: "name: c\nmodel: {primary: openai-local-sonnet, backend: nowhere}\n"
    env: {}
    expect: {kind: refused, contains: "does not list"}
  - name: a provider that does not speak the protocol refuses
    agent: "name: c\nmodel: {primary: claude-sonnet, backend: ollama}\ngdpr: {processors: [{name: on-device}]}\n"
    env: {NOS_ARMED_BACKENDS: ollama, NOS_LOCAL_MODEL: "qwen3:14b"}
    expect: {kind: refused, contains: "wire protocol"}
  - name: deferred refuses
    agent: "name: c\nmodel: {primary: openai-local-sonnet, backend: ollama}\nmetadata: {runner_status: deferred}\ngdpr: {processors: [{name: on-device}]}\n"
    env: {NOS_ARMED_BACKENDS: ollama, NOS_LOCAL_MODEL: "qwen3:14b"}
    expect: {kind: refused, contains: "deferred"}
  - name: a record that does not name the processor refuses
    agent: "name: c\nmodel: {primary: openai-local-sonnet, backend: ollama}\ngdpr: {processors: [{name: Anthropic}]}\n"
    env: {NOS_ARMED_BACKENDS: ollama, NOS_LOCAL_MODEL: "qwen3:14b"}
    expect: {kind: refused, contains: "never names 'on-device'"}
  - name: an EU-only record never routes off the EU
    agent: "name: c\nmodel: {primary: claude-sonnet, backend: minimax}\ngdpr: {processors: [{name: MiniMax}], transfers_outside_eu: false}\n"
    env: {}
    expect: {kind: refused, contains: "not EU-resident"}
  - name: the opus tier refuses
    agent: "name: c\nmodel: {primary: openai-local-opus, backend: ollama}\ngdpr: {processors: [{name: on-device}], transfers_outside_eu: false}\n"
    env: {NOS_ARMED_BACKENDS: ollama, NOS_LOCAL_MODEL: "qwen3:14b"}
    expect: {kind: refused, contains: "tier 'opus'"}
  - name: no tier word refuses
    agent: "name: c\nmodel: {primary: openai-gpt4, backend: ollama}\ngdpr: {processors: [{name: on-device}]}\n"
    env: {NOS_ARMED_BACKENDS: ollama, NOS_LOCAL_MODEL: "qwen3:14b"}
    expect: {kind: refused, contains: "no model mapping"}
  - name: the haiku tier reads the small model
    agent: "name: c\nmodel: {primary: openai-local-haiku, backend: ollama}\ngdpr: {processors: [{name: on-device}]}\n"
    env: {NOS_ARMED_BACKENDS: ollama, NOS_LOCAL_SMALL_MODEL: "hermes3:8b"}
    expect: {kind: bound, model_id: "hermes3:8b"}
  - name: iris on a host that chose the on-device row binds the local model
    cell: iris
    env: {NOS_CELL_BACKEND: ollama, NOS_ARMED_BACKENDS: ollama, NOS_LOCAL_MODEL: "qwen3:14b"}
    expect: {kind: bound, model_id: "qwen3:14b"}
  - name: a chosen row the cell does not allow refuses
    cell: iris
    env: {NOS_CELL_BACKEND: minimax, NOS_ARMED_BACKENDS: minimax, NOS_MINIMAX_MODEL: m1}
    expect: {kind: refused, contains: "may bind only mistral-eu, ollama, anthropic-api, minimax-api"}
  - name: the chosen on-device row unarmed refuses rather than degrade
    cell: iris
    env: {NOS_CELL_BACKEND: ollama, NOS_LOCAL_MODEL: "qwen3:14b", NOS_ARMED_BACKENDS: mistral-eu, NOS_MISTRAL_MODEL: m, "nos:mistral_api_key": k}
    expect: {kind: refused, contains: "not armed"}
  # Operator ruling 2026-10-17: Iris may use Anthropic's and MiniMax's OpenAI-compatible endpoints like
  # mistral-eu; only residency differs, so gate 8 lets them serve an EU-claiming record only at gdpr_posture: none.
  - name: iris on anthropic-api at posture none binds the configured Claude model
    cell: iris
    env: {NOS_CELL_BACKEND: anthropic-api, NOS_ARMED_BACKENDS: anthropic-api, NOS_ANTHROPIC_API_MODEL: claude-haiku-5-5,
          "nos:anthropic_api_key": k-test, NOS_GDPR_POSTURE: none}
    expect: {kind: bound, model_id: claude-haiku-5-5}
  - name: iris on anthropic-api at posture standard refuses (a client host)
    cell: iris
    env: {NOS_CELL_BACKEND: anthropic-api, NOS_ARMED_BACKENDS: anthropic-api, NOS_ANTHROPIC_API_MODEL: claude-haiku-5-5,
          "nos:anthropic_api_key": k-test, NOS_GDPR_POSTURE: standard}
    expect: {kind: refused, contains: "gdpr_posture is 'standard'"}
  - name: iris on anthropic-api with no posture set is standard and refuses
    cell: iris
    env: {NOS_CELL_BACKEND: anthropic-api, NOS_ARMED_BACKENDS: anthropic-api, NOS_ANTHROPIC_API_MODEL: claude-haiku-5-5,
          "nos:anthropic_api_key": k-test}
    expect: {kind: refused, contains: "not EU-resident"}
  - name: iris on anthropic-api armed without its key refuses and names credentials.yml
    cell: iris
    env: {NOS_CELL_BACKEND: anthropic-api, NOS_ARMED_BACKENDS: anthropic-api, NOS_ANTHROPIC_API_MODEL: claude-haiku-5-5,
          NOS_GDPR_POSTURE: none}
    expect: {kind: refused, contains: "set anthropic_api_key in credentials.yml"}
  - name: iris on anthropic-api unarmed refuses, never degrades
    cell: iris
    env: {NOS_CELL_BACKEND: anthropic-api, NOS_ANTHROPIC_API_MODEL: claude-haiku-5-5, "nos:anthropic_api_key": k-test,
          NOS_GDPR_POSTURE: none}
    expect: {kind: refused, contains: "not armed"}
  - name: iris on minimax-api at posture none binds the configured MiniMax model
    cell: iris
    env: {NOS_CELL_BACKEND: minimax-api, NOS_ARMED_BACKENDS: minimax-api, NOS_MINIMAX_MODEL: MiniMax-M2,
          "nos:minimax_api_key": k-test, NOS_GDPR_POSTURE: none}
    expect: {kind: bound, model_id: MiniMax-M2}
  - name: iris on minimax-api with no model id refuses rather than send a blank one
    cell: iris
    env: {NOS_CELL_BACKEND: minimax-api, NOS_ARMED_BACKENDS: minimax-api, "nos:minimax_api_key": k-test, NOS_GDPR_POSTURE: none}
    expect: {kind: refused, contains: "NOS_MINIMAX_MODEL is empty"}
  - name: iris on minimax-api at posture standard refuses
    cell: iris
    env: {NOS_CELL_BACKEND: minimax-api, NOS_ARMED_BACKENDS: minimax-api, NOS_MINIMAX_MODEL: MiniMax-M2,
          "nos:minimax_api_key": k-test, NOS_GDPR_POSTURE: standard}
    expect: {kind: refused, contains: "gdpr_posture is 'standard'"}
