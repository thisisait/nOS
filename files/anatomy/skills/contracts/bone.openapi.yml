    post:
      description: "HMAC-authenticated notification ingestion. Writes wing.db.notifications.\n\nBody shape:\n  severity: critical|high|medium|low|info\
        \   (required)\n  title:    str                              (required, ≤500 chars)\n  body:     str             \
        \                 (optional, markdown)\n  channels: [wing-inbox|ntfy|mail]           (optional, default [wing-inbox])\n\
        \  target_actor_id: str                       (optional, default \"operator\")\n  actor_id, actor_action_id:     \
        \            (optional, A10 audit lineage)\n  origin_plugin, origin_agent:               (optional, attribution hints)\n\
        \  source_event_id: int                       (optional, soft FK events.id)\n  metadata: object                  \
        \         (optional, per-channel hints)\n\nBatches accepted as {\"notifications\": [...]}; single-object payloads\n\
        also accepted for hand-curl tests."
      operationId: notifications_ingest_api_v1_notifications_post
      parameters:
      - in: header
        name: x-wing-timestamp
        required: false
        schema:
          default: ''
