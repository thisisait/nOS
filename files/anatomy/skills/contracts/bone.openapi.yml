        name: unread_only
        required: false
        schema:
          default: false
          title: Unread Only
          type: boolean
      - in: query
        name: since
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Since
      - in: query
        name: actor_action_id
        required: false
