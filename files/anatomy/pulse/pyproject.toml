[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nos-pulse"
version = "0.1.0"
description = "nOS Pulse — local launchd daemon for scheduled agentic + non-agentic jobs"
authors = [{name = "nOS"}]
license = {text = "AGPL-3.0"}
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    # Added 2026-08-11 with `_resolve_secrets` (since 2026-08-12 the
    # implementation is pulse/secrets.py, shared with the on-demand shell
    # runners via `python3 -m pulse.secrets`). The resolver reads
    # ~/.nos/secrets.yml to turn a `secret:<name>` reference into a value, and
    # the venv did not carry a YAML parser — so the resolver returned an empty
    # store and ALL 25 reference-carrying jobs refused. Caught only by running
    # the check inside the deployed venv: the same probe passed against the
    # repo, where the operator's interpreter has yaml. The repo is not the
    # running system, and a dependency is the sharpest form of that.
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
nos-pulse = "pulse.__main__:main"

[tool.setuptools.packages.find]
include = ["pulse*"]
