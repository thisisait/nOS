# ==============================================================================
# config.d/40-data.yml — data: MariaDB, PostgreSQL, Redis, RustFS, Restic and the backup, external storage (row config-split-data).
#
# One of the default layers (config.d/*.yml in order, then default.config.yml;
# the set is tools/nos_identity.default_layers and main.yml vars_files). Every
# variable is declared in exactly one of them. config.yml still overrides.
# The install_*/configure_* switches and the version/image pins stay in
# default.config.yml: the upgrade path writes only that file.
# ==============================================================================

# THE one derivation of the backup path. Copy #1 needs its RustFS target; without
# it (core profile) there is no copy #1 and configure_backup's restic run stages
# the DB dumps itself and snapshots them with the data dirs (ruling 2026-10-16).
backup_copy1_enabled: "{{ (install_backup | default(false)) and (install_rustfs | default(false)) }}"

backup_staging_dir: "{{ ansible_facts['env']['HOME'] }}/backups/staging"

backup_pre_blank_dir: "{{ ansible_facts['env']['HOME'] }}/backups/pre-blank"  # staging as a blank found it (<UTC stamp>/, newest 2): restore_from after a blank

backup_restic_status_file: "{{ ansible_facts['env']['HOME'] }}/.nos/backup-restic-status.json"

restic_repo: ""

# S3-compatible targets only (restic_repo starts with "s3:"): the key pair the
# repo is opened with. Empty = not an S3 target. Exported as AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY to whichever orchestrator runs restic.
restic_s3_access_key: ""

restic_s3_secret_key: ""

# P2 REVERTED FOR RESTIC, 2026-08-03, and the reason is worth reading before
# anyone "fixes" this back.
#
# The 2026-08-02 note below was wrong on its own premise: it said "restic_repo
# is empty … no repository exists to lock out". That was the DEFAULT. The
# operator's config.yml sets `restic_repo: /Volumes/SSD1TB/nos-restic` and
# `configure_backup: true`, and that repository exists, created under the
# DERIVED key. Only the default was checked (the version-pin shadow class,
# ssot/doctrine/four-trees.md R4).
#
# Emptying this cost two converges: `Fatal: wrong password or no key found`.
# A restic key is PER-REPOSITORY — minting a new value does not rotate the
# repo, it locks it.
#
# UNBLOCK CONDITION, and it needs a human: from a shell with Full Disk Access,
#   restic -r <repo> key add          # authenticated by the OLD password
# then set the new value here. Until then this stays derived, and the
# blast-radius gate names it as the one crown jewel P2 did not free.
restic_password: "{{ global_password_prefix }}_pw_restic"

# Path the restic --exclude-file is deployed to (from files/backup/resticignore).
# Was referenced in tasks/backup.yml (l.32/74/120) with NO default → a run with
# configure_backup:true aborted on "restic_excludefile is undefined" (2026-06-09).
restic_excludefile: "{{ ansible_facts['env']['HOME'] }}/backups/.resticignore"

restic_keep_daily: 7

restic_keep_weekly: 4

restic_keep_monthly: 6

restic_backup_schedule_hour: 4            # legacy orchestrator only; Backrest plans carry their own cron (staggered after copy #1 at 03:00)

# Off-site agent label — de-collided from the RustFS copy-#1 agent
# (eu.thisisait.nos.backup.rustfs). Both shared eu.thisisait.nos.backup before,
# writing the SAME plist path → enabling both silently disabled one.
restic_launchd_label: "eu.thisisait.nos.backup.offsite"

# ==============================================================================
# IIAB – MARIADB
# ==============================================================================

mariadb_port: 3306
# ── Server-side TLS material on disk (REM-217, rungs 1 and 2) ───────────────
# MariaDB reports have_ssl=YES with ssl_cert EMPTY, because 11.x generates
# EPHEMERAL in-memory material when none is configured. That is how a client
# gets TLS_AES_256_GCM_SHA384 today while there is no certificate anywhere on
# disk — and no certificate on disk means no CA file to hand a client.
#
# That is the actual blocker, and it is a library fact rather than a security
# argument: Laravel — freescout, firefly and bookstack, three of the five
# clients — reads exactly one knob, `MYSQL_ATTR_SSL_CA`, through `array_filter`,
# which DROPS an empty value. So the supported path needs a real file path or
# it gets nothing.
#
# Self-signed with `mariadb` in the SAN, mirroring what pazny.postgresql has
# done since 2026-06. NOT mkcert (that CA's purpose is a system trust store,
# and this is a public-TLD estate) and NOT the LE wildcard (clients reach the
# server as `mariadb`, a compose service name; no public certificate carries
# it). The cert is its own CA, so a client pointed at server.crt gets both
# encryption and a name that matches.
#
# This rung changes NOTHING for a plaintext client. require_secure_transport
# stays off until every client is measured on TLS — that is rung 4, and it is a
# cliff: today it would refuse 99.98% of connections.
#
# At PLAY scope from the first line, deliberately. The postgres equivalent
# spent nine weeks as a role default that no client role could see
# (docs/hidden_fees/23), and this variable will have exactly the same readers.
mariadb_ssl_enabled: "{{ ansible_facts['os_family'] | default('') == 'Darwin' }}"

postgresql_port: 5432

postgresql_root_user: "postgres"


# ── Server-side TLS, AT PLAY SCOPE — and it has to be here, not in the role ──
# This began as a `pazny.postgresql` role default, which is where it belongs
# logically and where it cannot work. Five OTHER roles read it to decide their
# own client sslmode (authentik ×2, hedgedoc, infisical, paperclip), and a role
# default is not in scope for a different role's render, so every one of them
# resolved `| default(false)` and rendered the plaintext-tolerant branch.
#
# MEASURED 2026-08-23, in the rendered artifacts rather than the templates:
# hedgedoc, paperclip and both authentik blocks on disk all say `sslmode=prefer`
# on a macOS host, and the live paperclip container's env agrees — while the
# server override two directories away says `ssl=on`. The `require`-pin commit
# of 2026-06-14 has never once produced `require` in a render. Its gate reads
# the template, so it passed for two months.
#
# The role default stays as a fallback so the role remains usable alone; this
# line is what every consumer actually resolves. Linux is still false — the
# key-ownership leg (PG wants the key owned by postgres-uid or root, the
# host-user bind mount is not) is genuinely undone, not merely unset.
postgresql_ssl_enabled: "{{ ansible_facts['os_family'] | default('') == 'Darwin' }}"

# Live container name (compose project = stack, so <stack>-<service>-1). Used by
# upgrade recipes' docker-exec dump/restore steps; default 'nos-postgresql' was wrong.
postgresql_container_name: "infra-postgresql-1"

mariadb_container_name: "infra-mariadb-1"

# ==============================================================================
# INFRA – REDIS (Docker)
# Homebrew Redis is no longer installed: the auto-enable list at main.yml:1504
# IS the consumer list, so redis_docker false means nothing wanted Redis at all.
# ==============================================================================

redis_docker: false                    # true = Redis in Docker (for cross-stack access)
redis_container_name: "infra-redis-1"   # live <stack>-<service>-1; used by upgrade recipe docker-exec

# ==============================================================================
# IIAB – MARIADB (continued)
# ==============================================================================

mariadb_databases:
  - name: "wordpress"
  - name: "nextcloud"
  - name: "freescout"
  - name: "erpnext"
  - name: "bookstack"
  - name: "firefly"
  - name: "dolibarr"

mariadb_users:
  - name: "wordpress"
    password: "{{ wordpress_db_password }}"
    priv: "wordpress.*:ALL"
  - name: "nextcloud"
    password: "{{ nextcloud_db_password }}"
    priv: "nextcloud.*:ALL"
  - name: "freescout"
    password: "{{ freescout_db_password | default(nos_derived_secrets.freescout) }}"
    priv: "freescout.*:ALL"
  - name: "erpnext"
    password: "{{ erpnext_admin_password | default(nos_derived_secrets.erpnext) }}"
    priv: "erpnext.*:ALL"
  - name: "bookstack"
    password: "{{ bookstack_db_password | default(nos_derived_secrets.bookstack) }}"
    priv: "bookstack.*:ALL"
  - name: "firefly"
    password: "{{ firefly_db_password | default(nos_derived_secrets.firefly) }}"
    priv: "firefly.*:ALL"
  - name: "dolibarr"
    password: "{{ dolibarr_db_password | default(nos_derived_secrets.dolibarr) }}"
    priv: "dolibarr.*:ALL"
  # mysqld-exporter (observability stack) — scraped by Grafana Alloy on the
  # observability_net via stacks_shared_network. Needs the three "slave"/monitoring
  # privileges that Percona/MariaDB's stock exporter queries require. Host "%" so
  # it works from any Docker network (exporter lives in the observability project).
  - name: "mysqld_exporter"
    password: "{{ mysqld_exporter_password | default(nos_derived_secrets.mysqld_exporter) }}"
    host: "%"
    priv: "*.*:PROCESS,REPLICATION CLIENT,SELECT"

redis_port: 6379                   # Redis port

# ==============================================================================
# RESTIC – backups
# Documentation: https://restic.readthedocs.io/
# ==============================================================================

# Off-site copy #2 mirrors the RustFS bucket dir (copy #1's encrypted objects) —
# NOT the whole $HOME. The old "{{ HOME }}" default dragged in TCC-protected
# ~/Library subdirs on macOS → restic dir-level EPERM → fatal rc=1 (it aborted
# the all-on blank, 2026-06-09). The bucket dir is user-owned + self-contained:
# DB dumps, volume/dir tars, wing.db, nos-state, blueprints (all encrypted).
# DR: `restic restore latest --target <rustfs parent>` repopulates it, then
# `--tags restore`. See docs/backup-architecture.md.
restic_backup_paths:
  - "{{ rustfs_data_dir }}"     # RustFS bucket dir = canonical copy #1 object store

# ==============================================================================
# EXTERNAL STORAGE – move data directories to a secondary SSD
# Internal SSD (0.5 TB) = macOS, Homebrew, source code, MariaDB (low latency)
# External SSD (1 TB)   = Kiwix ZIM, Calibre, maps, Docker, Ollama, observability
#
# How it works:
#   1. Set configure_external_storage: true
#   2. Mount the SSD at external_storage_root (e.g. /Volumes/SSD1TB)
#   3. Run the playbook – the task redirects all data-heavy paths to the SSD
#   4. The original paths in the home directory will NOT be used (set_fact override)
#
# What stays on the internal SSD (performance):
#   - macOS system, Homebrew, source code, MariaDB, Redis
# ==============================================================================

external_storage_root: "/Volumes/SSD1TB"

# Optional moves (only if configure_external_storage: true)
external_storage_docker: true           # Docker Desktop disk image (~20-100 GB)
external_storage_docker_app: true      # Move Docker.app to the SSD + symlink in /Applications
external_storage_ollama: true           # Ollama models (~10-150 GB)
external_storage_caches: true           # npm, pip, Composer, Homebrew cache (~10-50 GB)

# ==============================================================================
# RUSTFS – S3-compatible object storage
# ==============================================================================

rustfs_api_port: 9010               # S3 API (aws-cli, rclone, restic, SDK...) – 9000 taken by PHP-FPM
rustfs_console_port: 9001           # Web console
rustfs_domain: "fs{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"

postgresql_certs_dir: "{{ nos_data_root }}/platform/services/postgresql/certs"

mariadb_certs_dir: "{{ nos_data_root }}/platform/services/mariadb/certs"

# Where the server certificate is mounted INSIDE each MariaDB client, as its CA.
# One string, because five templates and tools/tls-uptake.py must agree on it —
# a reader watching a different path than the renderer writes would report every
# client unconfigured for ever, and be believed (gate:
# test_the_tls_reader_only_reads.py::test_the_ca_path_the_reader_looks_for...).
# A NEW directory on purpose: mounting into /etc/ssl/certs would collide with
# whatever each image does to its own CA bundle.
mariadb_client_ca_path: "/nos-certs/mariadb-ca.crt"

# Restore-drill entrypoint. Defined HERE, not in the role, because the
# backup-base plugin manifest registers it as a Pulse command and the plugin
# loader runs during core-up — before any role default is in scope. Stock Jinja
# only (subscripting, no filters): this value lands in the `{{ vars }}` namespace
# the loader eagerly resolves.
backup_verify_command: "{{ ansible_facts['env']['HOME'] }}/.nos/backup-verify.sh"

backup_schedule_hour: 3                          # local-time 03:00 (off-site Restic staggered to 04:00)

backup_schedule_minute: 0

backup_target_bucket: "backups"

backup_target_endpoint: "http://127.0.0.1:9010"  # RustFS S3 API

backup_target_access_key: "{{ rustfs_access_key }}"

backup_target_secret_key: "{{ rustfs_secret_key }}"

backup_retention_daily: 7                        # last-N dailies

backup_retention_weekly: 4                       # last-N Sundays

backup_retention_monthly: 3                      # last-N month-firsts (12 kept ~110 GB of undeduplicated dumps; operator 11-04)

# Docker NAMED volumes to tar. Empty by default: DB *_data volumes are redundant
# (the logical dumps below cover them) and a hot-volume tar is an inconsistent
# datadir. Add only genuinely-stateful NON-DB volumes you confirm via
# `docker volume ls` (e.g. authentik_media). Was [mariadb_data] — dropped.
backup_volumes_to_dump: []

# Host-bind service data dirs (filesystem state NO DB dump can rebuild — git
# repos). name → target path; restore maps it back via restore_dir_targets.
# Extend (gated by dir-existence; backup.sh skips a missing path) for other
# host-bind SQLite services — see "KNOWN-UNBACKED" in docs/backup-architecture.md.
backup_dirs_to_dump:
  - { name: "gitea", flag: install_gitea, path: "{{ gitea_data_dir | default(ansible_facts['env']['HOME'] + '/gitea') }}" }
  - { name: "gitlab", flag: install_gitlab, path: "{{ gitlab_data_dir | default(ansible_facts['env']['HOME'] + '/gitlab') }}" }
  - { name: "gitlab-config", flag: install_gitlab, path: "{{ gitlab_config_dir | default(ansible_facts['env']['HOME'] + '/gitlab-config') }}" }
  # S4 (2026-06-10) — the KNOWN-UNBACKED host-bind set from
  # docs/backup-architecture.md: PRIMARY state no DB dump covers; before this,
  # a DR lost every Vaultwarden password. backup.sh skips absent paths, so
  # disabled services cost nothing. SQLite torn-window honesty: vaultwarden
  # db.sqlite3 + n8n database.sqlite are tar'd LIVE at 03:00 (low-write
  # window); restic keeps 7 dailies so one torn copy isn't fatal. A proper
  # sqlite3 .backup quiesce is the queued follow-up.
  - { name: "vaultwarden", flag: install_vaultwarden, path: "{{ vaultwarden_data_dir | default(ansible_facts['env']['HOME'] + '/vaultwarden') }}" }
  - { name: "n8n", flag: install_n8n, path: "{{ n8n_data_dir | default(ansible_facts['env']['HOME'] + '/n8n') }}" }
  - { name: "nodered", flag: install_nodered, path: "{{ nodered_data_dir | default(ansible_facts['env']['HOME'] + '/nodered/data') }}" }
  - { name: "authentik", flag: install_authentik, empty_ok: true, path: "{{ authentik_data_dir | default(ansible_facts['env']['HOME'] + '/authentik') }}" }
  # Invoice PDFs and extracts live under tenants/.../inbox/accounting/*/incoming
  # (and extracts/). KEAP sqlite is not those files. Alpine bind-mounts the
  # tree (same VirtioFS path as gitea) so launchd TCC cannot drop them.
  - { name: "tenants", path: "{{ nos_data_root }}/tenants" }
  - { name: "dolibarr-documents", flag: install_dolibarr, path: "{{ dolibarr_data_dir | default(ansible_facts['env']['HOME'] + '/dolibarr/documents') }}" }
  - { name: "dolibarr-custom", flag: install_dolibarr, path: "{{ dolibarr_custom_dir | default(ansible_facts['env']['HOME'] + '/dolibarr/custom') }}" }
  # MikoPBX: cf/ holds the whole config in SQLite (same torn-window honesty as
  # kuma.db), storage/ the recordings + voicemail. One source, one restore target.
  - { name: "mikopbx", flag: install_mikopbx, path: "{{ mikopbx_data_dir | default(ansible_facts['env']['HOME'] + '/mikopbx') }}" }
  # 2026-09-28 — the ten cheap holes backup_coverage named: file-only stores
  # no DB dump covers (attachments, uploads, three SQLite apps). Same torn-window
  # honesty as vaultwarden/n8n for kuma.db / webui.db / home-assistant_v2.db.
  # empty_ok: an attachment store with no uploads yet IS empty; backup.sh records
  # it as success/0 bytes instead of FAILED (the in-container count already
  # rules out the unreadable-mount case that made "empty" a failure elsewhere).
  - { name: "bookstack", flag: install_bookstack, empty_ok: true, path: "{{ bookstack_data_dir | default(ansible_facts['env']['HOME'] + '/bookstack') }}" }
  - { name: "firefly-upload", flag: install_firefly, empty_ok: true, path: "{{ firefly_upload_dir | default(ansible_facts['env']['HOME'] + '/firefly/upload') }}" }
  - { name: "freescout", flag: install_freescout, empty_ok: true, path: "{{ freescout_data_dir | default(ansible_facts['env']['HOME'] + '/freescout') }}" }
  - { name: "hedgedoc", flag: install_hedgedoc, empty_ok: true, path: "{{ hedgedoc_data_dir | default(ansible_facts['env']['HOME'] + '/hedgedoc/uploads') }}" }
  - { name: "outline", flag: install_outline, empty_ok: true, path: "{{ outline_data_dir | default(ansible_facts['env']['HOME'] + '/outline') }}" }
  - { name: "paperclip", flag: install_paperclip, empty_ok: true, path: "{{ paperclip_data_dir | default(ansible_facts['env']['HOME'] + '/paperclip') }}" }
  - { name: "paperclip-workspaces", flag: install_paperclip, empty_ok: true, path: "{{ paperclip_workspaces_dir }}" }
  # Iris: each person's workspace, conversations, sessions and watches (thalamus store.rs).
  - { name: "thalamus-people", flag: install_thalamus, empty_ok: true, path: "{{ thalamus_data_dir }}/people" }
  # The medulla's settings (a job paused by hand): set-points a person chose, which no dump holds.
  - { name: "medulla", flag: install_thalamus, empty_ok: true, path: "{{ medulla_data_dir }}" }
  - { name: "uptime-kuma", flag: install_uptime_kuma, path: "{{ uptime_kuma_data_dir | default(ansible_facts['env']['HOME'] + '/uptime-kuma') }}" }
  - { name: "homeassistant", flag: install_homeassistant, path: "{{ homeassistant_config_dir | default(ansible_facts['env']['HOME'] + '/homeassistant') }}" }
  - { name: "openwebui", flag: install_openwebui, path: "{{ openwebui_data_dir | default(ansible_facts['env']['HOME'] + '/openwebui') }}" }
  - { name: "wordpress-uploads", flag: install_wordpress, empty_ok: true, path: "{{ wordpress_dir | default(ansible_facts['env']['HOME'] + '/projects/wordpress') }}/wp-content/uploads" }
  # 2026-09-28, second pass — every unbacked store whose service is ON:
  # Stalwart mailboxes (the one real mail store; rocksdb tar'd live, same
  # torn-window honesty), grafana.db, woodpecker.sqlite, InfluxDB TSDB, PDS
  # sqlite + repos, the browser IDE's workspace (empty_ok: nothing checked out yet).
  - { name: "stalwart", flag: install_smtp_stalwart, path: "{{ stalwart_data_dir | default(ansible_facts['env']['HOME'] + '/stalwart') }}" }
  - { name: "grafana", flag: install_observability, path: "{{ grafana_data_dir | default(ansible_facts['env']['HOME'] + '/grafana') }}" }
  - { name: "woodpecker", flag: install_woodpecker, path: "{{ woodpecker_data_dir | default(ansible_facts['env']['HOME'] + '/woodpecker') }}" }
  - { name: "influxdb", flag: install_influxdb, path: "{{ influxdb_data_dir | default(ansible_facts['env']['HOME'] + '/influxdb') }}" }
  - { name: "bluesky-pds", flag: install_bluesky_pds, path: "{{ bluesky_pds_data_dir | default(ansible_facts['env']['HOME'] + '/bluesky-pds') }}" }
  - { name: "code-server-workspace", flag: install_code_server, empty_ok: true, path: "{{ code_server_workspace_dir | default(ansible_facts['env']['HOME'] + '/code-server/workspace') }}" }

# Every `*_dir` var in this file that backup_dirs_to_dump does NOT cover, with
# the class that says why — reconciled by tests/anatomy/test_backup_coverage_is_declared.py,
# so a new service cannot be silently absent from the backup set (the removal
# set has the same rule: `_removal_keep` in tasks/removal-set.yml).
#   dump     — the state is captured by a logical dump backup.sh already takes
#   db       — the service keeps its state in MariaDB/PostgreSQL (dumped); the dir is cache/config
#   derived  — rendered by a converge or regenerable; nothing to restore
#   store    — the backup target itself
#   never    — operator-owned content nOS does not manage
#   unbacked — REAL GAP, named: files no dump covers. Move the var into
#              backup_dirs_to_dump to close it (size/consistency is the operator's call).
backup_coverage:
  agents_libexec_dir:          { class: derived, why: "root-owned claude copy + launcher, rendered by pazny.mac.agent_user" }
  nos_estate_dir:              { class: derived, why: "the estate clone, re-made by tools/estate-adopt.sh; its config.yml + credentials.yml travel in the spore" }
  artifact_cache_dir:          { class: derived, why: "verified image tars — re-pullable, checksummed, survives every removal" }
  geo_cache_dir:               { class: derived, why: "RÚIAN/INSPIRE downloads — re-fetchable open data; the loaded tables are in pg_dumpall" }
  maps_cache_dir:              { class: derived, why: "Planetiler PMTiles + OSM sources, glyphs, sprites — rebuildable from open data" }
  nos_atlas_src_dir:           { class: never, why: "the nos-atlas dev checkout — operator-owned source, not estate state" }
  vllm_data_dir:               { class: derived, why: "a pinned Hugging Face snapshot — re-downloadable by revision (slow: tens of GB)" }
  geolibre_data_dir:           { class: derived, why: "copy of the nos-atlas dist bundle — rebuildable from the nos-atlas checkout" }
  mariadb_data_dir:            { class: dump, why: "mariadb.sql.gz — all databases" }
  postgresql_data_dir:         { class: dump, why: "postgres.sql.gz — pg_dumpall (incl. the PostGIS geo db; restore replays into the same image)" }
  erpnext_data_dir:            { class: dump, why: "sites in a named volume; DB in mariadb.sql.gz (parked service)" }
  wing_app_dir:                { class: dump, why: "wing-db.sql.gz — sqlite3 .dump of wing.db" }
  wing_data_dir:               { class: dump, why: "wing-db.sql.gz — sqlite3 .dump of wing.db" }
  keap_data_dir:               { class: dump, why: "keap-db.gz — online .backup; /user-files are under tenants (dir-tenants)" }
  firefly_export_dir:          { class: derived, why: "export scratch" }
  hedgedoc_config_dir:         { class: derived, why: "rendered config" }
  code_server_data_dir:        { class: derived, why: "editor settings + extensions" }
  influxdb_config_dir:         { class: derived, why: "rendered config" }
  qgis_data_dir:               { class: unbacked, why: "GIS projects (opt-in service)" }
  spacetimedb_data_dir:        { class: unbacked, why: "nos-forum hot state; no dump path yet (nos-forum open question Q11)" }
  spacetimedb_keys_dir:        { class: unbacked, why: "JWT signing keys; rotation orphans every identity" }
  nos_forum_data_dir:          { class: unbacked, why: "module-owner CLI token; losing it = cannot republish the module (Q11)" }
  thalamus_data_dir:           { class: dump, why: "thalamus-ledger.sql.gz — sqlite3 .dump of ledger.db (Iris turns, approved cell edits); people/ is dir-thalamus-people" }
  infisical_data_dir:          { class: db, why: "secrets live in postgres.sql.gz" }
  metabase_data_dir:           { class: db, why: "app db in postgres.sql.gz; dir holds plugins" }
  superset_data_dir:           { class: db, why: "app db in postgres.sql.gz" }
  onlyoffice_data_dir:         { class: derived, why: "document server cache" }
  onlyoffice_db_dir:           { class: derived, why: "embedded cluster, seeded blank-safe (euro-office pilot)" }
  onlyoffice_lib_dir:          { class: derived, why: "document server cache" }
  onlyoffice_logs_dir:         { class: derived, why: "logs" }
  ntfy_data_dir:               { class: derived, why: "message cache + attachments with TTL" }
  portainer_data_dir:          { class: derived, why: "portainer.db — endpoints + OAuth re-registered by the converge" }
  snappymail_data_dir:         { class: derived, why: "rendered config" }
  mcpo_data_dir:               { class: derived, why: "rendered config" }
  mailpit_data_dir:            { class: derived, why: "dev SMTP sink" }
  watchtower_data_dir:         { class: derived, why: "image-poll state" }
  jellyfin_cache_dir:          { class: derived, why: "transcode/metadata cache" }
  jellyfin_movies_dir:         { class: never, why: "operator media library" }
  jellyfin_shows_dir:          { class: never, why: "operator media library" }
  jellyfin_music_dir:          { class: never, why: "operator media library" }
  rustfs_data_dir:             { class: store, why: "copy #1 object store — the backup target, not a source" }
  stacks_dir:                  { class: derived, why: "rendered compose files" }
  tls_cert_dir:                { class: derived, why: "mkcert/ACME re-issues" }
  traefik_config_dir:          { class: derived, why: "rendered dynamic config" }
  redis_data_dir:              { class: derived, why: "cache" }
  mariadb_certs_dir:           { class: derived, why: "re-issued by the role" }
  postgresql_certs_dir:        { class: derived, why: "re-issued by the role" }
  nextcloud_dir:               { class: derived, why: "app checkout; user files are under tenants, DB in mariadb.sql.gz" }
  wordpress_dir:               { class: derived, why: "app checkout; wp-content/uploads is in the set (wordpress-uploads), posts in mariadb.sql.gz" }
  openclaw_base_dir:           { class: never, why: "is $HOME" }
  openclaw_agents_dir:         { class: never, why: "~/agents user content" }
  openclaw_projects_dir:       { class: never, why: "~/projects user content" }
  openclaw_log_dir:            { class: never, why: "agent logs under ~/agents" }
  pi_config_dir:               { class: derived, why: "rendered agent config" }
  iiab_terminal_config_dir:    { class: derived, why: "rendered config" }
  node_exporter_textfile_dir:  { class: derived, why: "metrics scratch" }
  tofu_authentik_state_dir:    { class: dump, why: "backup.sh run_tofu_state (tofu-state): terraform.tfstate + .backup" }
  backup_tofu_state_dir:       { class: dump, why: "is tofu_authentik_state_dir — what run_tofu_state reads" }
  backup_staging_dir:          { class: store, why: "tonight's plaintext dumps — the restic source, rewritten every run" }
  backup_pre_blank_dir:        { class: store, why: "the staging set as a blank found it (pre-wipe copy, newest 2)" }
  one_way_upgrade_backup_dir:  { class: store, why: "cold tars before a migration with no rollback (one-way-upgrade-guard); the operator prunes" }

backup_databases_mariadb: "{{ install_mariadb | default(false) }}"        # the installed set (manifest forced_by applied at run time)

backup_databases_postgresql: "{{ install_postgresql | default(false) }}"

# Databases that also get their own pg_dump (postgres-<db>.sql.gz) beside the dumpall, so one can
# come back alone: a blank that cleans Authentik can keep Paperclip (restore_postgres_dbs=<db>).
# containers = stopped while it is replaced; verify = tables whose row count must match the dump.
backup_postgres_dbs:
  - { db: paperclip, flag: install_paperclip, containers: [devops-paperclip-1], verify: [companies, projects, issues] }

# A9 result notification (W6.1): backup outcome → Wing inbox (fail=high,
# success=info heartbeat) via Bone HMAC. Empty wing_events_hmac_secret
# (fresh install pre-regen) silently disables.
backup_notify_enabled: true

backup_notify_url: "http://127.0.0.1:8099/api/v1/notifications"

backup_authentik_blueprints: "{{ install_authentik | default(false) }}"

backup_wing_db: "{{ install_wing | default(true) }}"   # sqlite3 .dump of the Wing store

backup_keap_db: "{{ install_keap | default(false) }}"  # sqlite3 .backup of the KEAP store (taxonomy, tables, vectors)

backup_nos_state: true                                  # ~/.nos/{secrets,state}.yml (restore gated by restore_state)

backup_wing_db_path: "{{ wing_data_dir | default(ansible_facts['env']['HOME'] + '/wing/app/data') }}/wing.db"

backup_thalamus_ledger: "{{ install_thalamus | default(false) }}"   # sqlite3 .dump of Iris's ledger.db

backup_thalamus_ledger_path: "{{ thalamus_data_dir }}/ledger.db"

# KEAP is snapshotted INSIDE this container (node:sqlite backup()), never by copying the live file.
backup_keap_container: "iiab-keap-1"

backup_keap_db_container_path: "/data/keap.db"

backup_tofu_state: true                                 # terraform.tfstate(+.backup) + nos.auto.tfvars.json

backup_tofu_state_dir: "{{ tofu_authentik_state_dir }}"

# Client-side encryption (GDPR Art.32 / NIS2 at-rest). OFF only for a throw-away
# dev target with no PII. The passphrase is the ONLY key to every object —
# credentials.yml MUST survive off-box (see docs/backup-architecture.md custody).
backup_encryption_enabled: true

# P2 key ring. Declared HERE, not only in roles/pazny.backup/defaults, because a
# ROLE DEFAULT does not count as "defined before core-up" — main.yml's
# key-preserving set_fact runs long before pazny.backup is invoked, and the
# eager `{{ vars }}` resolution has bitten this repo on exactly that shape
# before (CLAUDE.md, operator gotchas). The real value arrives later from
# ~/.nos/secrets.yml, which include_vars loads after this file.
backup_encryption_keys_previous: []

backup_overwrite_same_day: true

backup_run_now: false

backup_status_file: "{{ ansible_facts['env']['HOME'] }}/.nos/backup-status.json"

backup_log_file: "{{ ansible_facts['env']['HOME'] }}/.nos/backup.log"
