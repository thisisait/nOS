# ==============================================================================
# config.d/70-geo.yml — geo: offline base maps (tileserver-gl + Planetiler),
# GeoLibre web GIS + the nos-atlas plugin, martin vector tiles, QGIS Server.
#
# One of the default layers (config.d/*.yml in order, then default.config.yml;
# the set is tools/nos_identity.default_layers and main.yml vars_files). Every
# variable is declared in exactly one of them. config.yml still overrides.
# The install_* switches and the image pins stay in default.config.yml: the
# upgrade path writes only that file (test_image_pins_stay_in_default_config).
# ==============================================================================

# ==============================================================================
# IIAB – OFFLINE MAPS (tileserver-gl + a Planetiler-built base map)
# ==============================================================================

maps_domain: "maps{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
maps_port: 8081                               # 8080 taken by Traefik dashboard

# Base map: Planetiler builds OpenMapTiles PMTiles from the Geofabrik extract
# once, into maps_cache_dir (survives every removal level). Region = Geofabrik slug.
maps_region: "czech-republic"
maps_languages: "cs,en,de,sk,pl"               # name:* tags kept in the tiles
maps_planetiler_java_opts: "-Xmx3g"            # 6g was OOM-killed beside ~10 GB of estate; CZ measured in roles/pazny.offline_maps/README.md
maps_cache_dir: "{{ artifact_cache_dir }}/maps"
# Glyphs + sprites the vendored OpenFreeMap style expects (OFL fonts, BSD sprites).
maps_fonts_url: "https://assets.openfreemap.com/fonts/ofm.tar.gz"
maps_sprites_url: "https://tiles.openfreemap.org/sprites/ofm_f384"

# Extra operator archives ({url, dest} into maps_data_dir), served by basename.
maps_mbtiles_files: []

# ==============================================================================
# IIAB – GEOLIBRE (web GIS) + the nos-atlas plugin drop-in, at atlas.<tenant>
# ==============================================================================

geolibre_domain: "atlas{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
geolibre_port: 8072                           # nginx :80 in the container, 127.0.0.1 only
nos_atlas_src_dir: "{{ ansible_facts['env']['HOME'] }}/projects/nos-atlas"   # dist/nos-atlas is COPIED into geolibre_data_dir; build it there (npm run build)

# martin: geo tables as vector tiles at atlas.<tenant>/tiles (same origin, the atlas gate).

# GeoLibre Browser layer catalog (rendered to GEOLIBRE_SERVICES_FILE; schema = GeoLibre
# docker/entrypoint.sh). Free, keyless services only; `licence_url` is the source checked.
# GeoLibre shows no per-service attribution, so the required credit rides in `name`.
# ČÚZK services verified 2026-10-03: capabilities Fees/AccessConstraints = none, EPSG:3857.
# No martin entry: GeoLibre v3.2.0 catalog kinds are raster/OGC only, and its xyz
# kind rejects a vector TileJSON. Add tiles by hand: Add data → OGC vector tiles →
# https://atlas.<tenant>/tiles/<source> (roles/pazny.martin/README.md).
geolibre_layers:
  - id: nos-basemap
    name: "nOS basemap — Liberty (© OpenStreetMap contributors)"
    category: Basemaps
    kind: xyz
    enabled: "{{ install_offline_maps }}"
    fields: {url: "https://{{ maps_domain }}/styles/liberty/{z}/{x}/{y}.png", tileSize: "256", shortUrl: false}
    licence: "Own tileserver (pazny.offline_maps). Data © OpenStreetMap contributors, ODbL 1.0."
    licence_url: "https://www.openstreetmap.org/copyright"
  - id: cuzk-katastralni-mapa
    name: "Katastrální mapa (ČÚZK – on-line)"
    category: ČÚZK
    kind: wms
    enabled: true
    fields: {endpoint: "https://services.cuzk.gov.cz/wms/local-km-wms.asp", layers: "KN", styles: "", format: "image/png", transparent: true, tileSize: "256", version: "1.3.0"}
    licence: "ČÚZK network services: free, no registration, commercial use allowed; credit 'ČÚZK – on-line'."
    licence_url: "https://www.cuzk.gov.cz/Predpisy/Podminky-poskytovani-prostor-dat-a-sitovych-sluzeb/Podminky-poskytovani-sitovych-sluzeb-CUZK.aspx"
  - id: cuzk-ortofoto
    name: "Ortofoto ČR (ČÚZK – on-line)"
    category: ČÚZK
    kind: wms
    enabled: true
    fields: {endpoint: "https://ags.cuzk.gov.cz/arcgis1/services/ORTOFOTO/MapServer/WMSServer", layers: "0", styles: "", format: "image/png", transparent: false, tileSize: "256", version: "1.3.0"}
    licence: "ČÚZK network services: free, no registration, commercial use allowed; credit 'ČÚZK – on-line'."
    licence_url: "https://www.cuzk.gov.cz/Predpisy/Podminky-poskytovani-prostor-dat-a-sitovych-sluzeb/Podminky-poskytovani-sitovych-sluzeb-CUZK.aspx"
  - id: cuzk-ruian
    name: "RÚIAN — budovy a adresní místa (ČÚZK – on-line)"
    category: ČÚZK
    kind: wms
    enabled: true
    fields: {endpoint: "https://ags.cuzk.gov.cz/arcgis/services/RUIAN/MapServer/WMSServer", layers: "StavebniObjekt,AdresniMisto", styles: "", format: "image/png", transparent: true, tileSize: "256", version: "1.3.0"}
    licence: "ČÚZK network services: free, no registration, commercial use allowed; credit 'ČÚZK – on-line'."
    licence_url: "https://www.cuzk.gov.cz/Predpisy/Podminky-poskytovani-prostor-dat-a-sitovych-sluzeb/Podminky-poskytovani-sitovych-sluzeb-CUZK.aspx"

# ==============================================================================
# ENGINEERING – QGIS SERVER (GIS map server)
# ==============================================================================

qgis_domain: "gis{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
qgis_port: 8071
