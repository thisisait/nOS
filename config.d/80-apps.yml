# ==============================================================================
# config.d/80-apps.yml — apps: WordPress, Nextcloud, Kiwix, n8n, Gitea, GitLab, Open WebUI, Woodpecker, Portainer, Jellyfin, Uptime Kuma, Calibre-Web, SnappyMail, and the b2b/data apps (ERPNext, FreeScout, Outline, Metabase) (row config-split-apps); Mailpit, Stalwart, Mastodon, Watchtower (row config-d-mail-social).
#
# One of the default layers (config.d/*.yml in order, then default.config.yml;
# the set is tools/nos_identity.default_layers and main.yml vars_files). Every
# variable is declared in exactly one of them. config.yml still overrides.
# The install_*/configure_* switches and the version/image pins stay in
# default.config.yml: the upgrade path writes only that file.
# ==============================================================================

calibreweb_books_dir: "{{ nos_data_root }}/tenants/{{ nos_tenant_slug }}/shared/calibreweb/books"

calibreweb_config_dir: "{{ nos_data_root }}/tenants/{{ nos_tenant_slug }}/shared/calibreweb/config"

jellyfin_config_dir: "{{ nos_data_root }}/tenants/{{ nos_tenant_slug }}/shared/jellyfin/config"

# ==============================================================================
# IIAB – WORDPRESS
# ==============================================================================

wordpress_domain: "wordpress{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
wordpress_dir: "{{ ansible_facts['env']['HOME'] }}/projects/wordpress"
wordpress_db_name: "wordpress"
wordpress_db_user: "wordpress"
wordpress_db_host: "127.0.0.1"          # ignored if install_mariadb=true (uses 'mariadb' from iiab_net)
wordpress_table_prefix: "wp_"
# The live container already RAN 7.1.2 (WP auto-updates in the volume) while the
# image said 7.0.4 — a force-recreate would have restored vulnerable files under
# a 7.1.2 database. No 7.0.x image exists past 7.0.4, so this branch hop IS the fix.
# ── wp2shell (CVE-2026-63030 + CVE-2026-60137), disclosed 2026-07-17 ──────────
# Unauth RCE via /wp-json/batch/v1/: a REST batch-route confusion chained with a
# core SQLi. Upstream fixed both the same day in 6.8.6 / 6.9.5 / 7.0.2, and for
# two weeks the Docker official image published NONE of the three — so the pin
# sat at 6.9.4 with a mu-plugin unregistering the batch endpoint, which breaks
# the CHAIN at its entry but never patched the SQLi underneath it.
#
# LIFTED 2026-08-06. `wordpress:7.0.2` is on Docker Hub (pushed 2026-08-05,
# arm64 among its architectures — verified against the registry, not inferred
# from a release note). REM-129 + REM-160 are two rows for this one move: 160
# is the observation that unblocks 129.
#
# ⚠️ 7.0.0 and 7.0.1 REMAIN VULNERABLE. The range is 6.9.0-6.9.4 AND
# 7.0.0-7.0.1, so a mechanical "bump to the newest 7.0.x" is a lateral move into
# the same hole. Only 6.8.6 / 6.9.5 / 7.0.2 are safe. Verify the exact tag
# exists before bumping.
#
# The mitigation is now OFF and its mu-plugin is actively REMOVED (a flag that
# only decides whether to write a file is half a switch — see the removal task
# in roles/pazny.wordpress/tasks/main.yml). The file itself is kept: a rollback
# to 6.9.4 is exactly when it is needed again.
wordpress_cve_63030_mitigate: false
wordpress_harden_unauth_surface: true   # REM-114: mu-plugin disables XML-RPC + blocks REST user enum + author enumeration (defense-in-depth; 6.9.4 core is CVE-clean)
wordpress_port: 8084                    # Local container port (nginx proxy)
wordpress_admin_user: "admin"
# Break-glass local admin, NOT the SSO admin: sharing akadmin's address made
# WordPress refuse to create akadmin at its first SSO login (email taken).
wordpress_admin_email: "wordpress-admin@{{ tenant_domain | default('dev.local') }}"

# ── Devlog platform (docs/devlog/README.md) ──────────────────────────────────
# WordPress presents the nOS devlog: nos-core namespace is repo-committed and
# synced by tasks/devlog-sync.yml; on-site namespaces are written live via
# tools/devlog-post.py. The bot's Application Password is WP-minted in
# roles/pazny.wordpress/tasks/devlog.yml and persisted to ~/.nos/secrets.yml.
wordpress_devlog_enabled: true          # effective only with install_wordpress
wordpress_devlog_bot_user: "nos-devlog-bot"
wordpress_devlog_app_name: "nos-devlog"

# Site polish (devlog presentation): theme + extra plugins installed/activated
# idempotently by post.yml via wp-cli (wp.org slugs, all GPL).
wordpress_theme: "generatepress"
wordpress_extra_plugins: ["secure-custom-fields"]

# RBAC mirror — Authentik groups -> WP roles, enforced on every OIDC login by
# the rbac-role-sync.php mu-plugin (highest privilege wins; unmapped users
# fall back to subscriber; local accounts untouched). JSON STRING literal on
# purpose: to_json is an ansible filter and this value lands in the core-up
# vars namespace (stock-Jinja trap). Operators with custom group names
# (authentik_rbac_tiers) override this string in config.yml.
wordpress_rbac_role_map_json: '{"nos-providers":"administrator","nos-admins":"administrator","nos-managers":"editor","nos-users":"author","nos-guests":"subscriber"}'

# ==============================================================================
# IIAB – NEXTCLOUD
# ==============================================================================

nextcloud_domain: "cloud{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
nextcloud_dir: "{{ ansible_facts['env']['HOME'] }}/projects/nextcloud"
nextcloud_db_name: "nextcloud"
nextcloud_db_user: "nextcloud"
nextcloud_db_host: "127.0.0.1"         # ignored if install_mariadb=true (uses 'mariadb' from iiab_net)
nextcloud_admin_user: "admin"
nextcloud_port: 8085                    # Local container port (nginx proxy)

# ==============================================================================
# IIAB – KIWIX (offline Wikipedia, Gutenberg, ZIM files)
# Kiwix runs in a Docker container (simplest on macOS)
# ==============================================================================

kiwix_domain: "kiwix{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
kiwix_port: 8888                           # Local kiwix-serve port

# Init ZIM — downloaded automatically on first blank run so Kiwix can start
# with a working demo (no manual onboarding step). Alpine Linux wiki, ~3 MB.
# The UNDATED permalink: dated names rotate off the mirror (_2026-04 404'd
# by 2026-10, so the blank came up with no ZIM). Set
# to "" in config.yml to opt out and rely on kiwix_zim_files / download-zim.sh.
# WARNING: large ZIMs (>50 MB) block the playbook for the full download duration.
kiwix_init_zim_url: "https://download.kiwix.org/zim/alpinelinux_en_all_maxi.zim"
kiwix_init_zim_dest: "alpinelinux.zim"

# ZIM files to download (empty = do not download automatically)
# See: https://download.kiwix.org/zim/
kiwix_zim_files: []

n8n_domain: "n8n{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"

n8n_port: 5678

n8n_timezone: "{{ nos_timezone }}"

# Where extra_hosts' `host-gateway` lands — BOTH families, CSV of CIDRs. The
# n8n pack path (https://keap.<tld> pinned to host-gateway) must be re-opened
# through n8n's SSRF guard via IP RANGES: the hostname allowlist env exists
# but covers only the lookup phase — the connect-time validator sees a bare
# IP (ssrf-protection.service.js validateConnectionHost) — and the lookup
# phase validates EVERY resolved address, so the /etc/hosts IPv6 row (ULA ⊂
# the default blocked set) blocks a v4-only allowlist. Both addresses
# measured in the container's /etc/hosts on Docker Desktop for Mac
# (2026-09-21). GLOBAL (not a role default) because the plugin loader renders
# n8n-base's compose extension without the role's defaults in scope — a
# role-scoped var rendered "" there. Linux bridge is typically 172.17.0.1 —
# override on a Linux host.
n8n_host_gateway_cidr: "192.168.65.254/32,fdc4:f303:9324::254/128"

n8n_admin_email: "{{ default_admin_email }}"

n8n_admin_password: "{{ nos_derived_secrets.n8n }}"

n8n_admin_firstname: "Admin"

n8n_admin_lastname: "nOS"

# ==============================================================================
# IIAB – GITEA (self-hosted Git)
# ==============================================================================

gitea_domain: "git{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
gitea_port: 3003         # 3000=Grafana, 3001=Uptime Kuma, 3002=reserve → Gitea on 3003
gitea_ssh_port: 2222
# Derives from the declared-identities registry (nos_primary_admin, top of
# this file) — never directly from the OS username. The registry is the one
# place that says who the local forge admin IS.
gitea_admin_user: "{{ nos_primary_admin }}"
gitea_admin_password: "{{ nos_derived_secrets.gitea }}"
gitea_admin_email: ""                          # FILL IN!
gitea_secret_key: "{{ nos_derived_secrets.gitea_secret }}"
gitea_metrics_token: "{{ nos_derived_secrets.gitea_metrics }}"   # bearer token guarding /metrics (Alloy scrape sends it)
gitea_disable_registration: false              # true = only admin can add users (also blocks OIDC auto-create)
# Pure-SSO: hide the local self-registration form but still let OAuth2/OIDC
# first-login auto-create users (Authentik onboarding). true = external-only.
gitea_allow_only_external_registration: true

gitlab_domain: "gitlab{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"

gitlab_http_port: 8929          # Internal HTTP port (nginx handles SSL, forwards here)

gitlab_ssh_port: 2224           # Git SSH (22=system, 2222=Gitea → Gitlab on 2224)

gitlab_timezone: "{{ nos_timezone }}"

gitlab_signup_enabled: false    # Disables registration of new users

gitlab_puma_workers: 2          # Worker processes (min 2, with 36 GB feel free to use 4)

gitlab_sidekiq_concurrency: 10  # Background job threads

# ==============================================================================
# IIAB – WOODPECKER CI (CI/CD connected to Gitea)
# Requires: install_gitea: true + manual OAuth2 application in Gitea
# ==============================================================================

woodpecker_domain: "ci{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
woodpecker_port: 8060            # Web UI
woodpecker_grpc_port: 9060       # gRPC for agents (internal)
woodpecker_agent_secret: "{{ nos_derived_secrets.woodpecker }}"
woodpecker_gitea_client: ""      # auto-provisioned on first run (post-oauth.yml); leave empty
woodpecker_gitea_secret: ""      # auto-provisioned on first run (post-oauth.yml); leave empty
# Hosts Gitea webhooks may POST to. Gitea denies private addresses by default
# (SSRF); the CI host resolves to the LAN through the public edge, so without
# this every Woodpecker delivery is refused while the hook still reports
# active=true. Comma-separated hostnames — never `*` or `private`.
# Where Woodpecker's deploy-trigger step POSTs. Over the Docker host bridge,
# not the public edge: the caller is a container on this host, so the edge would
# add a Cloudflare hop and a forward-auth surface to a call that never leaves
# the machine. Provisioned as the `wing_deploy_url` REPO SECRET by
# roles/pazny.woodpecker/tasks/post-secrets.yml.
woodpecker_wing_deploy_url: "http://host.docker.internal:{{ wing_port | default(9000) }}/api/v1/deploy-trigger"
gitea_webhook_allowed_hosts: "{{ woodpecker_domain | default('ci' ~ (_host_alias_seg | default('')) ~ '.' ~ (tenant_domain | default('dev.local'))) }}"
woodpecker_open_registration: false  # true = anyone can log in via Gitea
# Comma-separated Gitea usernames Woodpecker auto-creates AND grants admin to,
# bypassing open_registration=false. With registration closed this is the ONLY
# list that can log in at all. It is DERIVED from the declared-identities
# registry (every nos_identities entry whose realms include `woodpecker`), so
# the incident of 2026-08-19 — the operator arrived as `akadmin`, the list
# said `pazny` — cannot recur: both operators are in the registry, so both are
# in this list. Add an identity to the registry, not a name to this string.
woodpecker_admin: >-
  {%- set _wp_names = [] -%}
  {%- for _i in nos_identities | default([]) -%}
  {%- if 'woodpecker' in (_i.realms | default([])) -%}
  {%- set _ = _wp_names.append(_i.name) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _wp_names | join(',') }}
woodpecker_max_workflows: 4      # Max parallel pipeline runs per agent
# REM-002 hardening — see roles/pazny.woodpecker/templates/compose.yml.j2 for
# the full hardening block. Operators with vetted plugins can override
# `woodpecker_plugins_privileged` with a comma-separated allowlist of plugin
# image refs (e.g. "plugins/docker,plugins/kaniko"). Empty = no privileged plugins.
woodpecker_plugins_privileged: ""
woodpecker_prom_token: "{{ nos_derived_secrets.wp_prom }}"

# ==============================================================================
# IIAB – PORTAINER CE (Docker management UI)
# ==============================================================================

portainer_domain: "portainer{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
portainer_port: 9002                   # 9000/9001 reserved for RustFS (S3 API + console)
  # REM-212 CRITICAL (CVE-2026-72533 / GHSA-jxhm-qq8x-v4c6, Docker API authz
  # bypass). The row was filed vendor_blocked when no patch existed; 2.45.0
  # (STS, 2026-08-27) now does. Tag verified pullable on Docker Hub before
  # pinning — the queue records VERSIONS, and a version is not always a tag
  # (node-red's recorded 4.1.13 has no plain tag at all).
# Repair an admin-password DRIFT (admin exists but neither the current nor
# previous prefix logs in — left by an interrupted/partial provisioning). true =
# wipe Portainer's BoltDB so admin-init recreates the admin with the config
# password (Portainer holds no user data — endpoints/OAuth are reprovisioned).
# Default false (manual-over-auto): off gives a loud, paste-able reset diagnostic.
portainer_admin_auto_reset: false

# ==============================================================================
# IIAB – JELLYFIN (media server)
# ==============================================================================

jellyfin_domain: "media{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
jellyfin_port: 8096
jellyfin_lan_access: true              # true = port reachable from LAN (for TVs, mobile clients)
jellyfin_cache_dir: "{{ nos_data_root }}/platform/services/jellyfin/cache"
jellyfin_movies_dir: "{{ ansible_facts['env']['HOME'] }}/media/movies"   # Override to your library
jellyfin_shows_dir: "{{ ansible_facts['env']['HOME'] }}/media/shows"
jellyfin_music_dir: "{{ ansible_facts['env']['HOME'] }}/media/music"
# More libraries, e.g. ["/Volumes/SSD1TB/Filmy"]. Each mounts read-only at the
# SAME path inside the container, so Jellyfin's picker accepts the host path.
jellyfin_extra_media_dirs: []

# ==============================================================================
# IIAB – UPTIME KUMA (monitoring dashboard)
# ==============================================================================

uptime_kuma_domain: "uptime{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
uptime_kuma_port: 3001
uptime_kuma_admin_user: "admin"
uptime_kuma_auto_monitors: true  # Automatically create monitors for all install_* services
# NOTE (autologin ceiling): Kuma v1.x has NO OIDC and NO proxy-header login, so it
# always shows its own login after the Authentik forward-auth gate. The only lever
# is Kuma "Disable Auth" (gate-only) — a SECURITY DOWNGRADE (anyone past the gate
# becomes shared Kuma admin). Deliberately NOT wired (deferred): it needs careful
# set_settings/connect() idempotency in setup-monitors.py. Real per-user SSO waits
# on the Kuma v2.x migration (sqlite→mariadb, breaking).
uptime_kuma_status_page_slug: "nos"               # Slug for public status page (status.dev.local → /status/<slug>)
uptime_kuma_status_page_title: "nOS Service Status"
uptime_kuma_status_page_domain: "status{{ _host_alias_seg }}.{{ tenant_domain | default('dev.local') }}"
uptime_kuma_ntfy_topic: "nos-alerts"              # ntfy topic used for alert notifications
uptime_kuma_notify_webhook_url: "http://127.0.0.1:{{ bone_port | default(8099) }}/api/events"
uptime_kuma_tls_expiry_monitors: true             # Create TLS cert-expiry monitors for HTTPS-exposed services
uptime_kuma_docker_host_monitors: false           # Optional Docker healthcheck pass-through (needs socket proxy)

# ==============================================================================
# IIAB – CALIBRE-WEB (ebook server)
# ==============================================================================

calibreweb_domain: "books{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
calibreweb_port: 8083
calibreweb_timezone: "{{ nos_timezone }}"

# ==============================================================================
# IIAB – SNAPPYMAIL (webmail frontend)
# ==============================================================================

snappymail_domain: "webmail{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
snappymail_port: 3008

erpnext_domain: "erp{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"

erpnext_port: 8087                     # 8082 = Traefik dashboard, 8083-8086 taken

# erpnext_data_dir: DEPRECATED since P0.1 migration to a named volume. Sites data
# lives in Docker named volume `b2b_erpnext_sites` (managed for blank-reset
# via `compose down -v` + `volume prune -f -a`). External storage can be
# configured by moving the whole Docker Desktop disk image to an external SSD.

# Site name follows erpnext_domain (host_alias + tenant_domain aware).
erpnext_site_name: "{{ erpnext_domain }}"

erpnext_experimental_override: false

freescout_domain: "helpdesk{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"

freescout_port: 8090

freescout_db_name: "freescout"

freescout_db_user: "freescout"


freescout_admin_email: "{{ default_admin_email }}"


freescout_timezone: "{{ nos_timezone }}"

freescout_admin_first_name: "Admin"

freescout_admin_last_name: "nOS"

# ==============================================================================
# B2B – OUTLINE (team wiki / knowledge base)
# Requires: install_postgresql: true, redis_docker: true
# ==============================================================================

outline_domain: "wiki{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
outline_port: 3005
outline_db_name: "outline"
outline_db_user: "outline"

# ==============================================================================
# DATA – METABASE (BI dashboards)
# Requires: install_postgresql: true
# ==============================================================================

metabase_domain: "bi{{ _host_alias_seg | default('') }}.{{ tenant_domain | default('dev.local') }}"
metabase_port: 3002
metabase_db_name: "metabase"
metabase_db_user: "metabase"
metabase_timezone: "{{ nos_timezone }}"
metabase_admin_email: "{{ default_admin_email }}"
metabase_admin_first_name: "Admin"
metabase_admin_last_name: "nOS"

# ── Mailpit (dev SMTP capture-all + modern web UI) ───────────────────────────
# Every other service relays SMTP into mailpit:1025 inside the iiab_net docker
# network. UI at https://mail.<tld>, gated by Authentik forward_auth (Tier 2
# manager). The switch install_mailpit stays in default.config.yml.
mailpit_domain: "mail{{ _host_alias_seg }}.{{ tenant_domain }}"
mailpit_smtp_port: 1025                   # Apps relay here (mailpit:1025 inside iiab_net)
mailpit_ui_port: 8025                     # Web UI + REST API port (nginx fronts at mail.<tld>)

# ── Stalwart Mail Server, Mastodon ───────────────────────────────────────────
# Nothing to declare here yet: each section holds only its switch (install_smtp_stalwart) or a
# reserved note (Mastodon has no role), and both stay in default.config.yml.

# ── Watchtower (Docker image freshness watcher) ──────────────────────────────
# NOTIFY-ONLY by default: surfaces stale images in Mailpit without restarting anything.
# The switch install_watchtower stays in default.config.yml.
watchtower_mode: "notify"                 # notify | apply (per-host opt-in)
