# ==============================================================================
# config.d/20-host-software.yml — software on the habitat: who owns each host
# package (software_owner), the Homebrew/pip/npm/bun/go/gem/composer/.NET lists
# by class, the switches that install them, and the runtime pins they need.
#
# One of the default layers (config.d/*.yml in order, then default.config.yml;
# the set is tools/nos_identity.default_layers and main.yml vars_files). Every
# variable is declared in exactly one of them. config.yml still overrides.
# ==============================================================================

# ==============================================================================
# INSTALL SWITCHES — software (the rest of the queue stays in default.config.yml)
# ==============================================================================
install_homebrew_packages: true   # Homebrew + the self/symbiont formulae (software_owner)
install_cask_apps: false          # GUI applications via Homebrew Cask (habitat)
install_personal_packages: false  # homebrew/pip/npm *personal* lists below (habitat)
install_node: true                # Node.js + NVM (Cortex runs on it); node_global_packages are personal
# Claude CLI as a NATIVE build outside NVM (tasks/claude-cli.yml). Separate
# from install_node because that is the whole point: a node version migration
# must not be able to reinstall the tool the operator is holding. Turning this
# off leaves the CLI wherever NVM put it — which is the arrangement that broke
# live sessions with EACCES several times a day (measured 2026-08-04).
install_claude_cli: true
claude_cli_channel: "stable"      # stable | latest | an exact version
# When no claude resolves, DOWNLOAD and RUN the vendor's script (claude.ai/install.sh)
# once; its auto-updater owns the CLI afterwards. Off = nOS installs nothing, reports ABSENT.
install_claude_cli_vendor: false
install_bun: false                # Bun JavaScript runtime / bundler (habitat)
install_python: true              # Python + pyenv + pip packages
install_golang: false             # Go language + gopls, golangci-lint, air (habitat)
install_dotnet: false             # .NET SDK (C#, F#) + EF CLI (habitat)

# ==============================================================================
# SOFTWARE OWNERSHIP. self: nOS calls, pins and updates it. symbiont: installed
# once when absent, then fed by its vendor, never touched. habitat: the machine
# owner's, never installed by default; class `habitat` = the `*personal*` lists.
# Gate: tests/anatomy/test_every_host_package_has_an_owner.py
# ==============================================================================
software_owner:
  homebrew_installed_packages: self
  homebrew_symbiont_packages: symbiont
  homebrew_symbiont_casks: symbiont
  homebrew_personal_packages: habitat
  homebrew_cask_apps: habitat
  pip_packages: self
  pip_symbiont_packages: symbiont
  pip_personal_packages: habitat
  node_global_packages: habitat
  npm_packages: habitat
  bun_global_packages: habitat
  go_packages: habitat
  gem_packages: habitat
  composer_packages: habitat
  php_composer_packages: habitat
  dotnet_global_tools: habitat
  mas_installed_apps: habitat
  install_personal_packages: habitat
  install_cask_apps: habitat
  install_mas_apps: habitat
  install_bun: habitat
  install_golang: habitat
  install_dotnet: habitat
  install_shell_extras: habitat
  configure_terminal: habitat
  configure_osx: habitat
  configure_macos_defaults: habitat
  configure_dotfiles: habitat
  configure_dock: habitat
  configure_sublime: habitat

# ==============================================================================
# HOMEBREW – general settings
# ==============================================================================

homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts['machine'] == 'arm64' else '/usr/local' }}"

# self — each one has a caller in tasks/roles/tools/organs (the gate finds it).
homebrew_installed_packages:
  - git
  - gh                   # tools/red-status.py reads CI + Dependabot through it
  - curl
  - jq
  - openssl
  - sqlite               # sqlite3: wing.db restore + verify
  - tmux                 # tools/nos-cc.sh control centre
  - mkcert               # local SSL certificates (tasks/tls-certs.yml)
  - ffmpeg               # ears: microphone capture + resample
  - restic               # pre-wipe backup, Backrest
  - gitleaks             # gitleaks plugin: nightly secret scan
  # Infisical CLI — used by roles/pazny.infisical/tasks/seed.yml to run
  # `infisical bootstrap` on a fresh CE instance, returning a machine
  # identity token used for the rest of the org/project/secret seed flow.
  # Tap: `infisical/get-cli` (added below).
  - infisical

# symbiont — installed when absent, then left to its vendor (nOS calls none directly).
homebrew_symbiont_packages:
  - nss                  # mkcert's Firefox trust-store backend
  - ripgrep              # rg — on the AgentKit read-only bash allow-list
  - pre-commit           # contributors: .pre-commit-config.yaml

# symbiont casks — installed once when absent (Caskroom or the .app), never upgraded
# or removed by nOS: the vendor's updater owns them. `flag` = the switch that wants it.
homebrew_symbiont_casks:
  - { name: openhuman, app: /Applications/OpenHuman.app, flag: install_openhuman }

